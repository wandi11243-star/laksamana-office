<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Absensi · Laksamana Muda</title>
<meta name="theme-color" content="#A9791F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/jpeg" href="../assets/LaksamanaMudaLogo.jpeg">
<link rel="apple-touch-icon" href="../assets/LaksamanaMudaLogo.jpeg">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   ABSENSI — modul yang dipakai SAMBIL BERDIRI DI DEPAN PINTU, satu tangan
   memegang HP. Itu satu kalimat yang menjelaskan hampir semua keputusan
   tampilan di berkas ini: tombolnya besar, angkanya besar, dan yang
   penting selalu berada di separuh bawah layar tempat ibu jari sampai.
   ===================================================================== */
:root{
  --ink:#2A2620; --gold:#A9791F; --gold-2:#C8961F; --gold-dim:#7A560F;
  --gold-soft:#F2E9D3; --paper:#F7F6F4; --surface:#fff;
  --line:#E7E1D3; --muted:#5C574D; --muted-2:#8C8677;
  --ok:#1F9D5F; --ok-bg:#E4F5EC; --warn:#B5831A; --warn-bg:#F7EFDB;
  --danger:#C9432B; --danger-bg:#F8E4DF; --info:#2F7FC4; --info-bg:#E4EFF8;
  --radius:16px; --radius-sm:10px; --shadow:0 4px 18px rgba(50,42,28,.06);
  --shadow-lg:0 18px 48px rgba(50,42,28,.14);
  --sans:'Plus Jakarta Sans',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:14px;
  line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
h1,h2,h3{font-weight:700;letter-spacing:-.015em;line-height:1.25}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
img{max-width:100%;display:block}
.mono{font-variant-numeric:tabular-nums}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes denyut{0%,100%{opacity:1}50%{opacity:.45}}
.rise{animation:rise .4s cubic-bezier(.16,1,.3,1) both}
.spinner{width:16px;height:16px;border:2.5px solid var(--gold-soft);border-top-color:var(--gold-2);
  border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:-3px}

.topbar{position:sticky;top:0;z-index:40;background:rgba(247,246,244,.92);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line)}
.topbar-in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:11px}
.topbar img.logo{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#fff;
  border:2px solid var(--gold-2);padding:2px;flex:none}
.topbar .nm b{display:block;font-size:15px;line-height:1.15}
.topbar .nm span{display:block;font-size:10px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted-2)}
.topbar .kanan{margin-left:auto;text-align:right}
.topbar .kanan .keluar{background:none;border:none;padding:4px 0;text-align:right;color:inherit}
.topbar .kanan b{display:block;font-size:13px;line-height:1.2}
.topbar .kanan span{display:block;font-size:11px;color:var(--muted-2)}

.wrap{max-width:760px;margin:0 auto;padding:16px 16px 96px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow)}
.sec{padding:16px}
.mini{font-size:12px;color:var(--muted-2)}
.empty{text-align:center;padding:44px 18px;color:var(--muted-2)}

/* ---- JAM BESAR ----
   Jam server, bukan jam HP. Ditulis besar bukan demi gaya: kru yang datang
   mepet perlu tahu dalam satu lirikan apakah ia masih sempat, dan angka
   kecil memaksanya mendekatkan layar ke mata sambil berjalan. */
/* Jam besar berlatar emas. Ini benda pertama yang dilihat orang saat
   membuka aplikasi sambil berjalan ke pintu, dan satu-satunya angka yang
   ia butuhkan dalam satu lirikan. Kartu putih membuatnya tenggelam di
   antara kartu lain; latar emas membuatnya jadi kepala halaman. */
.jam{text-align:center;padding:26px 16px 22px;border:none;color:#fff;
  background:linear-gradient(140deg,var(--gold-2) 0%,var(--gold-dim) 100%);
  box-shadow:0 10px 30px rgba(122,86,15,.28)}
.jam .t{font-size:clamp(48px,16vw,68px);font-weight:800;letter-spacing:-.045em;line-height:1;
  font-variant-numeric:tabular-nums;text-shadow:0 2px 14px rgba(0,0,0,.18)}
.jam .d{color:rgba(255,255,255,.9);margin-top:7px;font-size:13.5px;font-weight:500}
.jam .sv{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-size:10.5px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;color:#fff;
  background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);
  padding:5px 12px;border-radius:20px}

/* ---- KARTU SHIFT ---- */
.shift{display:flex;gap:13px;align-items:center;padding:16px}
.shift .pita{width:5px;align-self:stretch;border-radius:20px;flex:none;min-height:40px;background:var(--line)}
.shift b{display:block;font-size:15px}
.shift span{display:block;color:var(--muted);font-size:13px;margin-top:1px}
.shift .kode{margin-left:auto;font-weight:800;font-size:13px;padding:6px 12px;border-radius:20px;
  background:var(--gold-soft);color:var(--gold-dim);flex:none}

/* ---- STATUS SYARAT (lokasi / wajah) ----
   Tiga keping yang menjawab satu pertanyaan: kenapa tombolnya belum hijau.
   Sebelum ada ini, kru cuma melihat tombol yang "tidak mau ditekan". */
.syarat{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.syarat .s{display:flex;gap:10px;align-items:flex-start;padding:12px 13px;border-radius:var(--radius-sm);
  border:1px solid var(--line);background:var(--surface)}
.syarat .s .ic{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center}
.syarat .s b{display:block;font-size:12.5px;line-height:1.3}
.syarat .s span{display:block;font-size:11.5px;color:var(--muted);line-height:1.45;margin-top:1px}
.syarat .s.ya  .ic{background:var(--ok-bg);color:var(--ok)}
.syarat .s.ya  {border-color:rgba(31,157,95,.3)}
.syarat .s.no  .ic{background:var(--warn-bg);color:var(--warn)}
.syarat .s.no  {border-color:rgba(181,131,26,.35)}
.syarat .s.mati .ic{background:#EFEDE8;color:var(--muted-2)}
@media(max-width:420px){ .syarat{grid-template-columns:1fr} }

/* ---- KAMERA ----
   Kotak persegi, cermin. Cermin karena orang mengarahkan wajahnya memakai
   bayangan dirinya sendiri — gambar yang tidak dicerminkan membuat setiap
   gerakan terasa terbalik dan orang bergoyang mencari posisi. */
.kamera{position:relative;aspect-ratio:1/1;max-width:300px;margin:0 auto;border-radius:22px;
  overflow:hidden;background:#1a1713;border:1px solid var(--line)}
.kamera video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.kamera .tanda{position:absolute;inset:12%;border:2px dashed rgba(255,255,255,.5);border-radius:50%;
  pointer-events:none}
.kamera.cocok .tanda{border-color:var(--ok);border-style:solid}
.kamera .ket{position:absolute;left:0;right:0;bottom:0;padding:9px 12px;font-size:12px;font-weight:600;
  color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.7));text-align:center}
.kamera .mati{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:13px;
  text-align:center;padding:22px}

/* ---- TOMBOL ---- */
.btn{border:none;border-radius:var(--radius-sm);padding:12px 18px;font-weight:700;font-size:15px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:filter .15s}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-pri{background:linear-gradient(135deg,var(--gold-2),var(--gold-dim));color:#fff;
  box-shadow:0 4px 14px rgba(122,86,15,.3)}
.btn-ok{background:linear-gradient(135deg,#28B36C,#158049);color:#fff;box-shadow:0 4px 14px rgba(21,128,73,.3)}
.btn-danger{background:var(--danger);color:#fff}
.btn-ghost{background:var(--surface);border:1.5px solid var(--line);color:var(--ink)}
.btn-block{width:100%}
.btn-lg{padding:18px 20px;font-size:17px;border-radius:14px}
/* Dua tombol sejajar, masing-masing setinggi 62px. Di layar 360px keduanya
   tetap muat berdampingan, dan itu penting: menumpuknya ke bawah membuat
   tombol Pulang jatuh di balik lipatan layar. */
.aksi{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.aksi .btn{flex-direction:column;gap:5px;min-height:62px;line-height:1.2}
.aksi .btn .ikon{width:21px;height:21px}
@media(max-width:340px){ .aksi{grid-template-columns:1fr} }

/* ---- BARIS RIWAYAT ---- */
.hari{padding:13px 15px;display:flex;gap:12px;align-items:center}
.hari+.hari{border-top:1px solid var(--line)}
.hari .tg{width:46px;flex:none;text-align:center}
.hari .tg b{display:block;font-size:19px;line-height:1;font-weight:800}
.hari .tg span{display:block;font-size:10.5px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.06em}
.hari .is{flex:1;min-width:0}
.hari .is b{display:block;font-size:13.5px}
.hari .is span{display:block;font-size:12px;color:var(--muted)}
.hari .kn{text-align:right;flex:none}
.lencana{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;
  white-space:nowrap}
.l-ok{background:var(--ok-bg);color:var(--ok)}
.l-telat{background:var(--danger-bg);color:var(--danger)}
.l-lembur{background:var(--info-bg);color:var(--info)}
.l-tunggu{background:var(--warn-bg);color:var(--warn)}
.l-tolak{background:#EFEDE8;color:var(--muted-2)}

/* ---- ANTREAN PENGAJUAN ---- */
.aju{padding:14px 15px}
.aju+.aju{border-top:1px solid var(--line)}
.aju .kep{display:flex;gap:12px;align-items:flex-start}
.aju .kep img{width:56px;height:56px;border-radius:12px;object-fit:cover;flex:none;background:#EFEDE8}
.aju .kep .n{flex:1;min-width:0}
.aju .kep .n b{display:block;font-size:14.5px}
.aju .kep .n span{display:block;font-size:12px;color:var(--muted)}
.aju .alasan{margin-top:10px;padding:10px 12px;border-radius:var(--radius-sm);background:var(--paper);
  font-size:13px;color:var(--muted);border-left:3px solid var(--gold-2)}
.aju .tbl{display:flex;gap:8px;margin-top:11px}
.aju .tbl .btn{flex:1;padding:10px;font-size:13.5px}

/* ---- ISIAN ---- */
.field{margin-bottom:11px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line);
  border-radius:var(--radius-sm);font-size:16px;background:var(--surface);color:var(--ink)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--gold-2)}
.dua{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ---- MENU BAWAH ----
   Di bawah, bukan di atas: modul ini dipakai satu tangan sambil berdiri,
   dan bagian atas layar HP 6 inci tidak terjangkau ibu jari. */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);
  border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(50,42,28,.1);
  padding-bottom:env(safe-area-inset-bottom)}
.tabbar-in{max-width:760px;margin:0 auto;display:flex}
/* Target sentuh 56px. Di bawah 44px jempol meleset terus, dan menu yang
   meleset di aplikasi yang dibuka sambil berjalan terasa rusak. */
.tabbar button{flex:1;background:none;border:none;padding:9px 4px 11px;display:flex;flex-direction:column;
  align-items:center;gap:4px;font-size:10.5px;font-weight:700;color:var(--muted-2);
  min-height:56px;position:relative;transition:color .15s}
.tabbar button.on{color:var(--gold-dim)}
/* Garis emas di ATAS tombol aktif — penanda yang terbaca tanpa warna, jadi
   tetap jelas di layar yang redup atau di bawah matahari. */
.tabbar button.on::before{content:'';position:absolute;top:0;left:22%;right:22%;height:3px;
  border-radius:0 0 4px 4px;background:linear-gradient(90deg,var(--gold-2),var(--gold-dim))}
.tabbar button .ikon{width:23px;height:23px}

.hd{margin:20px 0 11px}
.hd h2{font-size:17px}
.hd p{font-size:12.5px;color:var(--muted-2);margin-top:2px}
.hd:first-child{margin-top:0}

.toasts{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);z-index:200;display:flex;
  flex-direction:column;gap:8px;width:calc(100% - 32px);max-width:420px}
.toast{background:var(--ink);color:#fff;padding:12px 16px;border-radius:var(--radius-sm);font-size:13px;
  box-shadow:var(--shadow-lg);animation:rise .3s;display:flex;gap:9px;align-items:flex-start}
.toast i{width:8px;height:8px;border-radius:50%;flex:none;margin-top:5px}

.sheet{position:fixed;inset:0;z-index:150;background:rgba(30,26,20,.5);display:none;
  align-items:flex-end;justify-content:center}
.sheet.buka{display:flex}
.sheet .isi{background:var(--surface);width:100%;max-width:520px;border-radius:20px 20px 0 0;
  padding:20px 18px calc(20px + env(safe-area-inset-bottom));animation:rise .25s;
  max-height:88vh;overflow-y:auto}
.sheet h3{font-size:19px;margin-bottom:4px}
.sheet .ket{font-size:13px;color:var(--muted);margin-bottom:14px;line-height:1.6}
/* Gagang lembar. Bukan hiasan: tanpa penanda, lembar yang muncul dari bawah
   di HP terbaca sebagai halaman baru, dan orang mencari tombol "kembali"
   yang tidak ada alih-alih menariknya turun. */
.sheet .isi::before{content:'';display:block;width:38px;height:4px;border-radius:20px;
  background:var(--line);margin:-8px auto 14px}

/* ---------- KOTAK STATUS GPS ----------
   Akurasi ditulis sebagai KALIMAT, bukan cuma angka. "±8 m" tidak berarti
   apa-apa bagi orang yang belum pernah menandai titik kerja; "Akurat, boleh
   dipakai" langsung memberi tahu apakah ia sudah boleh menekan lanjut. */
.gps{display:flex;gap:12px;align-items:flex-start;padding:14px 15px;border-radius:var(--radius);
  border:1px solid var(--line);background:var(--surface)}
.gps .ic{width:34px;height:34px;border-radius:11px;flex:none;display:grid;place-items:center}
.gps .is{flex:1;min-width:0}
.gps .is b{display:block;font-size:14px}
.gps .is span{display:block;font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:2px}
.gps.baik  {border-color:rgba(31,157,95,.35);background:var(--ok-bg)}
.gps.baik  .ic{background:#fff;color:var(--ok)}
.gps.sedang{border-color:rgba(181,131,26,.35);background:var(--warn-bg)}
.gps.sedang .ic{background:#fff;color:var(--warn)}
.gps.buruk {border-color:rgba(201,67,43,.3);background:var(--danger-bg)}
.gps.buruk .ic{background:#fff;color:var(--danger)}
.gps.cari  .ic{background:var(--gold-soft);color:var(--gold-dim)}

/* Keadaan kosong yang MENJELASKAN, bukan sekadar "belum ada data". */
.kosong-lok{padding:26px 20px;text-align:center}
.kosong-lok .ic{width:54px;height:54px;border-radius:50%;margin:0 auto 12px;display:grid;
  place-items:center;background:var(--gold-soft);color:var(--gold-dim)}
.kosong-lok b{display:block;font-size:15px;margin-bottom:5px}
.kosong-lok span{display:block;font-size:12.5px;color:var(--muted);line-height:1.6;max-width:340px;margin:0 auto}

/* Dua cara mengisi koordinat. Pemilihnya berupa dua tombol lebar, bukan
   tab kecil — di HP, target sentuh di bawah 44px meleset terus. */
.pilih-cara{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.pilih-cara .pc{padding:11px 8px;border-radius:var(--radius-sm);border:1.5px solid var(--line);
  background:var(--surface);font-size:13px;font-weight:700;color:var(--muted);
  display:flex;align-items:center;justify-content:center;gap:6px}
.pilih-cara .pc.on{border-color:var(--gold-2);background:var(--gold-soft);color:var(--gold-dim)}

/* ---------- PETA ----------
   Bingkainya diberi tinggi TETAP, bukan aspect-ratio: lembar ini bisa dibuka
   di layar yang sangat pendek (HP mendatar), dan peta yang tingginya ikut
   lebar akan mendorong tombol "Pakai titik" keluar layar. */
.pilih-cara.tiga{grid-template-columns:1fr 1fr 1fr}
.peta-bingkai{position:relative;height:260px;border-radius:var(--radius);overflow:hidden;
  border:1.5px solid var(--line);background:var(--bg)}
#peta{position:absolute;inset:0}
.peta-tunggu,.peta-gagal{position:absolute;inset:0;display:grid;place-items:center;
  gap:6px;text-align:center;padding:18px;font-size:13px;color:var(--muted);line-height:1.6}
.peta-gagal b{display:block;color:var(--danger);margin-bottom:4px}
/* Penanda tengah: TIDAK boleh menangkap sentuhan, kalau tidak ia menelan
   gerakan geser dan petanya jadi terasa macet. Ujung pin ada di bawah, jadi
   titiknya digeser ke atas separuh tinggi ikonnya. */
.peta-silang{position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);
  pointer-events:none;z-index:500;color:var(--danger);filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.peta-silang::after{content:'';position:absolute;left:50%;top:100%;width:6px;height:6px;
  margin-left:-3px;margin-top:-2px;border-radius:50%;background:var(--danger);opacity:.85}
.peta-saya{position:absolute;right:10px;bottom:10px;z-index:500;width:40px;height:40px;
  border-radius:12px;border:1.5px solid var(--line);background:var(--surface);
  color:var(--gold-dim);display:grid;place-items:center;box-shadow:var(--shadow-lg)}
.peta-koord{margin-top:9px;text-align:center;font-size:13px;color:var(--muted)}
.peta-cari{display:flex;gap:8px;margin-bottom:9px}
.peta-cari input{flex:1;min-width:0}
.peta-hasil{display:flex;flex-direction:column;gap:5px;margin-bottom:9px}
.peta-hasil:empty{display:none}
.peta-hasil-baris{text-align:left;padding:10px 12px;border-radius:var(--radius-sm);
  border:1px solid var(--line);background:var(--surface);font-size:12.5px;line-height:1.5;
  color:var(--text)}
.peta-hasil-baris:hover{border-color:var(--gold-2);background:var(--gold-soft)}
.peta-ket{font-size:12.5px;color:var(--muted);padding:4px 2px}

.koord{margin-top:12px}
.koord .kosong{padding:13px 15px;border-radius:var(--radius-sm);border:1.5px dashed var(--line);
  color:var(--muted-2);font-size:13px;text-align:center}
.koord .ada{display:flex;align-items:center;gap:9px;padding:13px 15px;border-radius:var(--radius-sm);
  background:var(--ok-bg);border:1px solid rgba(31,157,95,.3);color:var(--ok);font-weight:700;font-size:13.5px}

/* Angka + satuannya dalam satu kotak. Label "menit" yang berdiri sendiri di
   atas kotak isian membuat orang mengetik "5 menit" ke dalam kotak angka. */
.satuan{display:flex;align-items:center;gap:0;border:1.5px solid var(--line);
  border-radius:var(--radius-sm);background:var(--surface);overflow:hidden}
.satuan input{border:none!important;border-radius:0;flex:1;min-width:0}
.satuan input:focus{outline:none}
.satuan:focus-within{border-color:var(--gold-2)}
.satuan span{padding:0 13px;font-size:12px;font-weight:600;color:var(--muted-2);flex:none;
  border-left:1px solid var(--line);align-self:stretch;display:flex;align-items:center}

.cepat{display:flex;gap:7px;margin-top:8px;flex-wrap:wrap}
.cepat button{flex:1;min-width:62px;padding:9px 4px;border-radius:var(--radius-sm);
  border:1.5px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:700;color:var(--muted)}
.cepat button:hover{border-color:var(--gold-2);color:var(--gold-dim)}

/* ---------- SAKLAR ----------
   Seluruh barisnya bisa diketuk. Kotak centang bawaan berukuran ~16px di HP
   dan meleset terus; barisnya selebar layar. */
.saklar{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;margin-bottom:9px;
  border:1.5px solid var(--line);border-radius:var(--radius-sm);cursor:pointer;
  background:var(--surface);transition:border-color .15s,background .15s}
.saklar.on{border-color:var(--gold-2);background:var(--gold-soft)}

<script src="vendor/face-api.min.js"></script>
<script>
/* =====================================================================
   ABSENSI LAKSAMANA MUDA

   TIGA HAL YANG HARUS DIPAHAMI SEBELUM MENYUNTING BERKAS INI:

   1. WAKTU TIDAK PERNAH DIAMBIL DARI HP. Jam yang tampil besar di layar
      adalah jam SERVER (dihitung dari selisih yang diukur sekali saat
      memuat), dan jam yang tercatat di database juga jam server. Jam HP
      bisa diputar mundur lewat Pengaturan dalam sepuluh detik, dan absensi
      yang mempercayainya tidak mencatat apa pun yang berarti.

   2. PENCOCOKAN WAJAH DIKERJAKAN DI SERVER. Yang dikerjakan di HP hanya
      MENGUBAH WAJAH JADI 128 ANGKA (descriptor). Angka itu dikirim, server
      yang membandingkan dengan yang terdaftar. Kalau dibalik — descriptor
      tersimpan dikirim ke HP lalu dibandingkan di sana — siapa pun yang
      membuka Developer Tools bisa membalas "cocok" tanpa menghadapkan
      wajah ke kamera.

   3. SHIFT TIDAK DISIMPAN DI SINI. Ia dibaca server dari modul jadwal
      (kru tetap) dan modul dw (pekerja harian) setiap kali seseorang
      menekan tombol. Menyalinnya berarti head yang merapikan jadwal
      kemarin tidak mengubah apa pun di absensi.
   ===================================================================== */
/* ALAMAT API — DI DALAM FOLDERNYA SENDIRI, bukan folder tetangga.
   Versi pertama memakai '../absensi-api/api.php' meniru pasangan
   ticketing / ticketing-api. Itu keliru untuk situs yang berdiri di
   subdomain sendiri: kalau docroot absensi.laksamanamuda.id adalah
   /public_html/absensi/, maka '../' menunjuk KE LUAR docroot dan tidak bisa
   dicapai lewat host itu sama sekali.

   Dengan backend di dalam ('/public_html/absensi/api/'), jalurnya benar
   apa pun cara subdomainnya dibuat — dan juga benar di dev, tempat situsnya
   duduk sebagai subfolder biasa (dev.laksamanamuda.id/absensi/). Satu
   berkas, dua server, tanpa syarat yang harus diingat orang. */
const API = 'api/api.php';

/* SESI MILIK SITUS INI SENDIRI, BUKAN MILIK OFFICE.
   localStorage terikat pada origin. Karena modul ini pindah ke subdomain
   sendiri, ia TIDAK BISA membaca `lm_session` milik team.laksamanamuda.id —
   dan itu bukan kekurangan yang perlu diakali, melainkan keuntungan:
   aplikasi absensi yang dipasang di layar depan HP tidak boleh menuntut
   orang membuka portal Office lebih dulu setiap pagi.

   Yang dipakai tetap AKUN OFFICE YANG SAMA. Login di sini diteruskan
   server-ke-server ke account-api oleh backend absensi (action=masuk),
   jadi tidak ada database akun kedua, dan tidak ada CORS yang perlu
   dilonggarkan di API akun. */
const SESI_KEY = 'lm_absensi_sesi';
const HARI  = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const BLN_PDK = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];

let ME    = null;   // {id,nama,token,admin,hr}
let KTX   = null;   // balasan action=konteks
let POS   = null;   // {lat,lng,akurasi} hasil GPS terakhir
let POS_ERR = '';
let WAJAH = null;   // descriptor 128 angka dari kamera, siap dikirim
let FOTO  = '';     // potret kecil (data URI) yang menyertai ketukan
let SELISIH_JAM = 0;// waktuServer - Date.now(), dipakai menggambar jam besar
let HAL   = 'absen';
let KAMERA_STREAM = null;
let MODEL_SIAP = false, MODEL_MUAT = false;

/* ---------------------------------------------------------------------
   Alat bantu
   ------------------------------------------------------------------- */
const $  = (s)=>document.querySelector(s);
const $$ = (s)=>[...document.querySelectorAll(s)];
function esc(x){ return String(x==null?'':x).replace(/[&<>"']/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(pesan, jenis){
  const w=$('#toasts'); if(!w) return;
  const warna = jenis==='ok'?'#28B36C' : jenis==='err'?'#E0654B' : jenis==='warn'?'#E0A93B' : '#8C8677';
  const d=document.createElement('div');
  d.className='toast'; d.innerHTML='<i style="background:'+warna+'"></i><span>'+esc(pesan)+'</span>';
  w.appendChild(d);
  setTimeout(()=>{ d.style.opacity='0'; d.style.transition='opacity .3s'; setTimeout(()=>d.remove(),320); }, 4200);
}
/* Waktu server, bukan waktu HP. Lihat catatan (1) di kepala berkas. */
function sekarang(){ return Date.now() + SELISIH_JAM; }
function duaAngka(n){ return (n<10?'0':'')+n; }
function jamStr(ms){ const d=new Date(ms); return duaAngka(d.getHours())+':'+duaAngka(d.getMinutes()); }
function tglIso(ms){ const d=new Date(ms);
  return d.getFullYear()+'-'+duaAngka(d.getMonth()+1)+'-'+duaAngka(d.getDate()); }
function tglPanjang(ms){ const d=new Date(ms);
  return HARI[d.getDay()]+', '+d.getDate()+' '+BULAN[d.getMonth()]+' '+d.getFullYear(); }
/* Menit jadi "1j 25m". Angka menit mentah ("85 menit lembur") memaksa orang
   menghitung sendiri, dan laporan yang perlu dihitung ulang tidak dibaca. */
function durasi(menit){
  menit=Math.max(0,Math.round(menit||0));
  if(menit<60) return menit+'m';
  const j=Math.floor(menit/60), m=menit%60;
  return j+'j'+(m?' '+m+'m':'');
}

const IKON={
  absen:'<path d="M9 12.5 11 14.5 15.5 10"/><rect x="3.5" y="4.5" width="17" height="16" rx="3"/><path d="M8 2.5v4M16 2.5v4"/>',
  riwayat:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5.5l3.5 2"/>',
  antre:'<path d="M4 6h16M4 12h16M4 18h10"/>',
  wajah:'<circle cx="12" cy="12" r="9"/><path d="M9 10h.01M15 10h.01"/><path d="M8.5 14.5a4.5 4.5 0 0 0 7 0"/>',
  atur:'<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.2 5.2l2.1 2.1M16.7 16.7l2.1 2.1M18.8 5.2l-2.1 2.1M7.3 16.7l-2.1 2.1"/>',
  pin:'<path d="M12 21s7-6.3 7-11a7 7 0 1 0-14 0c0 4.7 7 11 7 11Z"/><circle cx="12" cy="10" r="2.5"/>',
  jam:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  kamera:'<path d="M3.5 8.5A2.5 2.5 0 0 1 6 6h1.6l1-2h4.8l1 2H16a2.5 2.5 0 0 1 2.5 2.5v8A2.5 2.5 0 0 1 16 19H6a2.5 2.5 0 0 1-2.5-2.5Z"/><circle cx="11" cy="12.5" r="3.2"/>',
  keluar:'<path d="M9 21H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3"/><path d="M16 17l5-5-5-5M21 12H9"/>',
  masuk:'<path d="M15 3h3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-3"/><path d="M10 17l-5-5 5-5M5 12h10"/>'
};
function ikon(n,u){
  return '<svg class="ikon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" '
   +'stroke-linecap="round" stroke-linejoin="round" width="'+(u||22)+'" height="'+(u||22)+'">'
   +(IKON[n]||'')+'</svg>';
}

/* ---------------------------------------------------------------------
   API
   ------------------------------------------------------------------- */
async function api(aksi, data){
  const isGet = typeof aksi==='string' && aksi.indexOf('action=')===0;
  const url = isGet ? API+'?'+aksi+'&sesi='+encodeURIComponent(ME&&ME.token||'') : API;
  const opt = isGet ? {method:'GET'} : {method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(Object.assign({action:aksi, sesi:(ME&&ME.token)||''}, data||{}))};
  let r;
  try{ r = await fetch(url, opt); }
  catch(e){
    /* Dibedakan dari galat server: kru yang kehilangan sinyal di gudang
       harus tahu ia perlu pindah tempat, bukan mengira sistemnya rusak. */
    throw new Error('Tidak ada sambungan internet. Absensi butuh jaringan — jamnya diambil dari server, bukan dari HP.');
  }
  let j; try{ j = await r.json(); }catch(e){ throw new Error('Balasan server tidak terbaca.'); }
  if(!j || !j.ok) throw new Error((j && j.error) || 'Permintaan gagal.');
  return j.data;
}

/* ---------------------------------------------------------------------
   IDENTITAS — sesi Office
   ------------------------------------------------------------------- */
function bacaSesi(){
  try{
    const x=JSON.parse(localStorage.getItem(SESI_KEY)||'null');
    if(!x || !x.token || !x.expiry || Date.now()>=x.expiry) return null;
    return {id:x.id, nama:x.nama, token:x.token, keterangan:x.keterangan||''};
  }catch(e){ return null; }
}
function simpanSesi(u){
  /* 30 hari. Panjang dengan sengaja: ini aplikasi yang dibuka SETIAP PAGI
     sambil berdiri di depan pintu, dan memaksa login ulang tiap minggu
     berarti ada orang yang terlambat gara-gara lupa PIN. Tokennya tetap
     bisa dicabut sepihak dari server kapan saja. */
  const x={id:u.id, nama:u.name||u.nama, token:u.token, keterangan:u.keterangan||'',
           expiry:Date.now()+30*24*3600*1000};
  try{ localStorage.setItem(SESI_KEY, JSON.stringify(x)); }catch(e){}
  return {id:x.id, nama:x.nama, token:x.token, keterangan:x.keterangan};
}
function keluarAkun(){
  if(!confirm('Keluar dari aplikasi absensi?')) return;
  try{ localStorage.removeItem(SESI_KEY); }catch(e){}
  location.reload();
}

/* ---------------------------------------------------------------------
   LAYAR MASUK
   ------------------------------------------------------------------- */
function viewMasuk(pesan){
  $('#tabbar').style.display='none';
  $('#app').innerHTML=
    '<div class="card rise" style="margin-top:8px">'
     +'<div style="text-align:center;padding:26px 20px 6px">'
       +'<img src="../assets/LaksamanaMudaLogo.jpeg" alt="" '
         +'style="width:96px;height:96px;border-radius:50%;margin:0 auto 14px;border:3px solid var(--gold-2);'
         +'padding:8px;background:#fff;box-shadow:var(--shadow)">'
       +'<h2 style="font-size:20px">Absensi Laksamana Muda</h2>'
       +'<p class="mini" style="margin-top:4px">Masuk dengan akun Office yang sama.</p>'
     +'</div>'
     +'<div class="sec">'
       +(pesan?'<div style="padding:11px 13px;border-radius:10px;background:var(--danger-bg);'
               +'color:var(--danger);font-size:13px;margin-bottom:12px">'+esc(pesan)+'</div>':'')
       +'<div class="field"><label>Nama atau username</label>'
         +'<input id="mNama" autocomplete="username" placeholder="mis. Wandi"></div>'
       +'<div class="field"><label>PIN</label>'
         +'<input id="mPin" type="password" inputmode="numeric" autocomplete="current-password"></div>'
       +'<button class="btn btn-pri btn-block btn-lg" id="btMasukAkun" onclick="kirimMasuk()">Masuk</button>'
       +'<p class="mini" style="text-align:center;margin-top:12px">Lupa PIN? Minta admin mengaturnya ulang di Office.</p>'
     +'</div>'
    +'</div>';
  const inp=$('#mPin');
  if(inp) inp.addEventListener('keydown', e=>{ if(e.key==='Enter') kirimMasuk(); });
}
async function kirimMasuk(){
  const nama=$('#mNama').value.trim(), pin=$('#mPin').value.trim();
  if(!nama || !pin) return toast('Nama dan PIN diisi dulu.','warn');
  const b=$('#btMasukAkun'); b.disabled=true; b.innerHTML='<span class="spinner"></span> Memeriksa…';
  try{
    /* Diteruskan backend absensi ke account-api. Tidak dipanggil langsung
       dari peramban supaya API akun tidak perlu membuka CORS untuk
       subdomain ini — dan supaya alamat API akun cuma ditulis di SATU
       tempat (config.php), bukan juga di dalam HTML. */
    const d=await api('masuk',{nama:nama, pin:pin});
    ME=simpanSesi(d.user);
    await muatKonteks();
    $('#tabbar').style.display='';
    gambarTab(); go('absen');
    toast('Selamat datang, '+(d.user.name||nama)+'.','ok');
  }catch(e){
    b.disabled=false; b.textContent='Masuk';
    toast(e.message,'err');
  }
}

/* ---------------------------------------------------------------------
   LOKASI
   ------------------------------------------------------------------- */
/* GPS diminta SEKALI saat halaman dibuka, lalu diperbarui terus lewat
   watchPosition. Meminta lokasi baru pada saat tombol ditekan berarti kru
   menunggu 5-15 detik sambil melihat tombol yang tidak merespons — dan itu
   detik-detik yang persis membuatnya terlambat. */
/* GPS dipantau terus lewat watchPosition sejak halaman dibuka. Meminta lokasi
   baru pada saat tombol ditekan berarti kru menunggu 5-15 detik sambil
   melihat tombol yang tidak merespons — dan itu detik-detik yang persis
   membuatnya terlambat.

   TAPI watchPosition SAJA TIDAK CUKUP, dan ini yang membuat "setel lokasi"
   tidak pernah jalan: sebagian peramban HP (Safari iOS, dan Chrome Android
   dalam mode tertentu) hanya memunculkan kotak izin kalau permintaannya
   datang dari SENTUHAN pengguna. Panggilan otomatis saat halaman dimuat
   diabaikan diam-diam — tidak ada kotak izin, tidak ada galat, POS tetap
   null selamanya, dan tombol "Pakai lokasi saya sekarang" cuma menjawab
   "lokasi belum terbaca" tanpa pernah bisa diperbaiki.

   Karena itu ada mintaLokasi(): dipanggil dari tombol, jadi ia sentuhan. */
let POS_WATCH=null;
/* DUA TAHAP, dan urutannya yang penting.

   Dulu satu-satunya panggilan adalah watchPosition dengan
   enableHighAccuracy:true. Di HP, permintaan akurasi tinggi menyalakan GPS
   perangkat keras dan itu butuh 5–30 detik di dalam bangunan — sepanjang
   waktu itu tidak ada satu pun jawaban, layar cuma bertuliskan "Mencari
   sinyal", dan orang menyimpulkan fiturnya rusak. Padahal posisi kasar dari
   Wi-Fi/menara sudah tersedia hampir seketika.

   Sekarang: satu pembacaan KASAR lebih dulu (cepat, dari Wi-Fi/seluler)
   supaya layar langsung punya angka, lalu watchPosition akurasi tinggi yang
   menajamkannya sendiri begitu GPS mengunci. terimaPos hanya menerima yang
   lebih baik, jadi yang kasar tidak pernah menimpa yang sudah tajam. */
function mulaiLokasi(){
  if(!navigator.geolocation){ POS_ERR='Peramban ini tidak mendukung GPS.'; return; }
  /* Izin yang SUDAH ditolak permanen tidak akan pernah memunculkan kotak izin
     lagi, berapa kali pun diminta. Dikatakan apa adanya, bukan dibiarkan
     berputar selamanya di "Mencari sinyal". */
  if(navigator.permissions && navigator.permissions.query){
    try{
      navigator.permissions.query({name:'geolocation'}).then(function(st){
        if(st.state==='denied'){
          POS_ERR='Izin lokasi ditolak untuk situs ini. Ketuk ikon gembok di sebelah alamat → Izin situs → Lokasi → Izinkan.';
          segarkanLokasiDiLayar();
        }
        /* Begitu izinnya berubah (orang membukanya dari setelan peramban),
           langsung dicoba lagi tanpa perlu memuat ulang halaman. */
        st.onchange=function(){ if(st.state==='granted'){ POS_ERR=''; mulaiLokasi(); } };
      }).catch(function(){});
    }catch(e){}
  }
  try{
    navigator.geolocation.getCurrentPosition(terimaPos, function(){},
      {enableHighAccuracy:false, timeout:8000, maximumAge:120000});
    if(POS_WATCH!==null) navigator.geolocation.clearWatch(POS_WATCH);
    POS_WATCH=navigator.geolocation.watchPosition(terimaPos, tolakPos,
      {enableHighAccuracy:true, timeout:25000, maximumAge:5000});
  }catch(e){ POS_ERR='GPS tidak bisa dijalankan: '+e.message; }
}
/* Tab yang dibiarkan terbuka semalaman memegang posisi kemarin, dan sebagian
   peramban menghentikan watchPosition saat tabnya tersembunyi. Saat kembali
   aktif, pantauannya dijalankan lagi. */
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState==='visible' && !POS) mulaiLokasi();
});
function terimaPos(p){
  const baru={lat:p.coords.latitude, lng:p.coords.longitude,
              akurasi:Math.round(p.coords.accuracy||0), at:Date.now()};
  /* Yang lebih KASAR tidak boleh menimpa yang sudah tajam — kecuali yang
     lama sudah basi (>2 menit), yang berarti orangnya mungkin sudah pindah.
     Tanpa aturan ini, pembacaan kasar tahap pertama bisa datang belakangan
     dan menghapus kunci GPS yang sudah didapat. */
  if(POS && baru.akurasi>POS.akurasi && (Date.now()-POS.at)<120000) return;
  POS=baru;
  POS_ERR='';
  segarkanLokasiDiLayar();
}
function tolakPos(e){
  POS_ERR = e && e.code===1
      ? 'Izin lokasi ditolak. Ketuk ikon gembok di sebelah alamat, lalu izinkan Lokasi untuk situs ini.'
    : e && e.code===3
      ? 'Sinyal GPS belum didapat. Coba keluar dari ruangan tertutup, lalu ketuk "Ambil lokasi" lagi.'
    : e && e.code===2
      ? 'Lokasi tidak tersedia. Pastikan GPS di HP menyala.'
      : 'Lokasi tidak bisa dibaca.';
  segarkanLokasiDiLayar();
}
/* Satu tempat yang memperbarui SEMUA bagian layar yang bergantung pada GPS.
   Sebelumnya tiap pemanggil menebak sendiri bagian mana yang perlu digambar
   ulang, dan lembar setel lokasi tidak pernah ikut — jadi angka koordinatnya
   membeku pada keadaan saat lembarnya dibuka. */
function segarkanLokasiDiLayar(){
  if(HAL==='absen') gambarSyarat();
  const kotak=$('#gpsKotak'); if(kotak) kotak.innerHTML=gpsKotakHTML();
  const b=$('#btPakaiGps'); if(b) b.disabled=!POS;
  /* Lingkaran "posisi saya" di peta ikut bergerak selama petanya terbuka. */
  if(typeof petaSegarkanSaya==='function') petaSegarkanSaya();
}

/* Minta lokasi SEKARANG, dari sentuhan pengguna. Mengembalikan janji supaya
   tombolnya bisa menunggu dan menampilkan putaran — tanpa itu orang menekan
   berkali-kali karena tidak ada yang berubah di layar selama 10 detik. */
function mintaLokasi(){
  return new Promise(function(selesai){
    if(!navigator.geolocation){ POS_ERR='Peramban ini tidak mendukung GPS.'; segarkanLokasiDiLayar(); return selesai(false); }
    navigator.geolocation.getCurrentPosition(
      function(p){ terimaPos(p); selesai(true); },
      function(e){ tolakPos(e); selesai(false); },
      /* maximumAge:0 memaksa pembacaan BARU. Tanpa itu peramban boleh
         menjawab dengan posisi lama yang di-cache — dan orang yang berdiri di
         kantor untuk menandai titiknya bisa mendapat koordinat rumahnya. */
      {enableHighAccuracy:true, timeout:20000, maximumAge:0});
  });
}
async function ambilLokasiSekarang(){
  const b=$('#btGps');
  if(b){ b.disabled=true; b.innerHTML='<span class="spinner"></span> Mencari sinyal…'; }
  await mintaLokasi();
  if(b){ b.disabled=false; b.innerHTML=ikon('pin',17)+' Ambil lokasi lagi'; }
  if(POS) toast('Lokasi terbaca, akurasi ±'+POS.akurasi+' m.','ok');
  else if(POS_ERR) toast(POS_ERR,'warn');
}

/* Kotak status GPS — dipakai di halaman Atur dan di lembar setel titik.
   Akurasi ditampilkan sebagai kalimat, bukan cuma angka: "±8 m" tidak berarti
   apa-apa bagi orang yang belum pernah menandai titik, sedangkan "cukup
   akurat" langsung memberi tahu apakah boleh dilanjut. */
function gpsKotakHTML(){
  if(POS_ERR && !POS){
    return '<div class="gps buruk"><div class="ic">'+ikon('pin',18)+'</div>'
      +'<div class="is"><b>Lokasi belum terbaca</b><span>'+esc(POS_ERR)+'</span></div></div>';
  }
  if(!POS){
    return '<div class="gps cari"><div class="ic"><span class="spinner"></span></div>'
      +'<div class="is"><b>Mencari sinyal GPS…</b>'
      +'<span>Kalau kotak izin tidak muncul, ketuk tombol di bawah.</span></div></div>';
  }
  const a=POS.akurasi;
  const nilai = a<=20 ? ['baik','Akurat'] : a<=60 ? ['sedang','Cukup akurat'] : ['buruk','Kurang akurat'];
  const saran = a<=20 ? 'Boleh dipakai menandai titik kerja.'
              : a<=60 ? 'Masih boleh, tapi beri radius agak lega.'
                      : 'Terlalu kasar. Keluar ke area terbuka lalu ambil lagi.';
  return '<div class="gps '+nilai[0]+'"><div class="ic">'+ikon('pin',18)+'</div>'
    +'<div class="is"><b>'+nilai[1]+' · ±'+a+' m</b>'
    +'<span class="mono">'+POS.lat.toFixed(6)+', '+POS.lng.toFixed(6)+'</span>'
    +'<span>'+saran+'</span></div></div>';
}

/* Terima koordinat yang DITEMPEL, bukan hanya dari GPS.
   Alasannya nyata: yang menandai titik kerja sering bukan orang yang sedang
   berdiri di sana — admin menyiapkannya dari kantor pusat, atau dari laptop.
   Tanpa jalan ini, pemasangan modul MACET sampai ada orang yang bersedia
   berdiri di lokasi sambil memegang HP.

   Yang diterima:
     -0.507100, 101.447800          (tempel dari Google Maps: tahan titik → salin)
     https://maps.google.com/?q=-0.5071,101.4478
     https://www.google.com/maps/@-0.5071,101.4478,17z
     https://www.google.com/maps/place/X/@-0.5071,101.4478,17z/data=!3d-0.5071!4d101.4478
   Tautan pendek maps.app.goo.gl TIDAK bisa dibaca di sini — ia harus dibuka
   dulu supaya berubah jadi alamat panjang, dan itu dikatakan apa adanya
   daripada gagal diam-diam. */
function bacaKoordinat(teks){
  const t=String(teks||'').trim();
  if(!t) return null;
  if(/maps\.app\.goo\.gl|goo\.gl\/maps/i.test(t))
    return {galat:'Tautan pendek Google Maps tidak bisa dibaca. Buka dulu tautannya di peramban, lalu salin alamat panjang yang muncul.'};
  /* !3d<lat>!4d<lng> adalah koordinat yang PALING tepat di tautan Maps —
     yang setelah @ adalah titik tengah layar, bukan titik yang ditandai. */
  let m=/!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/.exec(t);
  if(!m) m=/[?&]q=(-?\d+(?:\.\d+)?)[,\s]+(-?\d+(?:\.\d+)?)/.exec(t);
  if(!m) m=/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/.exec(t);
  if(!m) m=/^(-?\d+(?:\.\d+)?)[,\s]+(-?\d+(?:\.\d+)?)$/.exec(t);
  if(!m) return {galat:'Tidak ketemu koordinat di teks itu. Tempel dua angka dipisah koma, atau tautan Google Maps yang panjang.'};
  const lat=parseFloat(m[1]), lng=parseFloat(m[2]);
  if(!isFinite(lat)||!isFinite(lng)) return {galat:'Koordinatnya bukan angka.'};
  if(lat<-90||lat>90)   return {galat:'Lintang harus antara -90 dan 90. Mungkin urutannya tertukar?'};
  if(lng<-180||lng>180) return {galat:'Bujur harus antara -180 dan 180.'};
  return {lat:lat, lng:lng};
}

/* ---------------------------------------------------------------------
   PETA — MENANDAI TITIK KERJA DENGAN MENGGESER PETA

   Cara yang sudah dikenal semua orang dari Shopee / Gojek / Grab: petanya
   digeser, penanda diam di tengah, dan yang dipilih adalah titik di bawah
   penanda. Sengaja BUKAN "ketuk untuk menaruh pin" — di layar HP jari
   menutupi titik yang sedang ditunjuk, dan yang tertaruh selalu meleset
   beberapa puluh meter.

   Petanya Leaflet + ubin OpenStreetMap: gratis dan tanpa kunci API, sesuai
   syarat modul ini (Google Maps JS API menuntut kunci + penagihan aktif).
   Leaflet DITANAM di vendor/, bukan diambil dari CDN — modul ini sudah
   pernah mati total gara-gara satu berkas luar yang tidak terunduh, dan
   jaringan kantor yang menyaring domain luar akan mematikannya lagi.

   DIMUAT MALAS: 160 KB tidak boleh ikut menahan layar absen yang dibuka
   ratusan kali sehari. Petanya cuma dipakai admin, sesekali, saat menandai
   titik kerja — jadi berkasnya baru diambil ketika tab Peta dibuka.
   ------------------------------------------------------------------- */
let PETA=null, PETA_SIAP=null, PETA_LINGKARAN=null, PETA_SAYA=null;

function muatPeta(){
  if(PETA_SIAP) return PETA_SIAP;
  PETA_SIAP=new Promise(function(selesai,gagal){
    if(window.L) return selesai(window.L);
    const css=document.createElement('link');
    css.rel='stylesheet'; css.href='vendor/leaflet.css';
    document.head.appendChild(css);
    const js=document.createElement('script');
    js.src='vendor/leaflet.js';
    js.onload=function(){ selesai(window.L); };
    /* Kegagalan dikatakan apa adanya. Peta yang tidak muncul tanpa pesan
       membuat orang menunggu tanpa batas lalu menyimpulkan modulnya rusak. */
    js.onerror=function(){ PETA_SIAP=null; gagal(new Error('Berkas peta gagal dimuat.')); };
    document.head.appendChild(js);
  });
  return PETA_SIAP;
}

/* Titik awal: koordinat yang sudah tersimpan kalau ada, kalau tidak posisi
   GPS sekarang, kalau tidak juga jatuh ke Pekanbaru. Membuka peta di tengah
   samudra memaksa orang menggeser separuh dunia sebelum bisa mulai. */
function petaTitikAwal(){
  if(LOK_LAT || LOK_LNG) return {lat:LOK_LAT, lng:LOK_LNG, z:18};
  if(POS) return {lat:POS.lat, lng:POS.lng, z:17};
  return {lat:0.5071, lng:101.4478, z:13};
}

async function siapkanPeta(){
  if(PETA) { setTimeout(function(){ if(PETA) PETA.invalidateSize(); },60); return; }
  const el=$('#peta'); if(!el) return;
  el.innerHTML='<div class="peta-tunggu"><span class="spinner"></span> Memuat peta…</div>';
  try{ await muatPeta(); }
  catch(e){
    el.innerHTML='<div class="peta-gagal"><b>'+esc(e.message)+'</b>'
      +'<span>Pakai cara <b>Dari GPS</b> atau <b>Tempel koordinat</b> sebagai gantinya — keduanya tidak butuh jaringan ke luar.</span></div>';
    return;
  }
  /* Wadahnya baru punya ukuran sesudah lembarnya benar-benar tampil. Leaflet
     yang dipasang pada wadah setinggi 0 menggambar ubinnya di tempat yang
     salah dan tidak pernah membetulkannya sendiri. */
  await new Promise(function(r){ setTimeout(r,60); });
  if(!$('#peta')) return;
  el.innerHTML='';
  const t=petaTitikAwal();
  PETA=L.map(el,{zoomControl:true, attributionControl:false}).setView([t.lat,t.lng], t.z);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(PETA);
  /* Lingkaran radius ikut digambar: yang sedang ditandai bukan sebuah titik,
     melainkan AREA yang dianggap "di kantor". Tanpa lingkarannya, "120 m"
     cuma angka — dengan lingkarannya langsung terlihat apakah ia menelan
     jalan raya di depan, yang berarti orang bisa absen dari dalam mobil. */
  PETA_LINGKARAN=L.circle([t.lat,t.lng],{radius:radiusSekarang(),
    color:'#A9791F', weight:2, fillColor:'#C8940A', fillOpacity:.15}).addTo(PETA);
  PETA.on('move', petaBergerak);
  petaBergerak();
  petaSegarkanSaya();
  setTimeout(function(){ if(PETA) PETA.invalidateSize(); },120);
}
function radiusSekarang(){
  const r=parseInt(($('#lRad')||{}).value,10);
  return (r>=30 && r<=2000) ? r : 120;
}
function petaBergerak(){
  if(!PETA) return;
  const c=PETA.getCenter();
  const k=$('#pKoord'); if(k) k.textContent=c.lat.toFixed(6)+', '+c.lng.toFixed(6);
  if(PETA_LINGKARAN) PETA_LINGKARAN.setLatLng(c);
}
/* Radius diubah di kotak di bawah — lingkarannya harus ikut, kalau tidak
   angkanya dan gambarnya mengatakan dua hal yang berbeda. */
function petaSegarkanRadius(){
  if(PETA_LINGKARAN) PETA_LINGKARAN.setRadius(radiusSekarang());
}
/* Titik biru "posisi saya", supaya orang tahu ia sedang menandai di mana
   relatif terhadap dirinya sendiri. Ini BUKAN titik yang dipilih — yang
   dipilih tetap yang ada di bawah penanda tengah. */
function petaSegarkanSaya(){
  if(!PETA || !window.L || !POS) return;
  if(PETA_SAYA) PETA_SAYA.setLatLng([POS.lat,POS.lng]);
  else PETA_SAYA=L.circleMarker([POS.lat,POS.lng],
    {radius:6, color:'#fff', weight:2, fillColor:'#2F7FC4', fillOpacity:1}).addTo(PETA);
}
async function petaKeSaya(){
  if(!POS) await mintaLokasi();
  if(!POS) return toast(POS_ERR||'Lokasi belum terbaca.','warn');
  if(PETA) PETA.setView([POS.lat,POS.lng], Math.max(PETA.getZoom(),17));
  petaSegarkanSaya();
}
/* Pencarian alamat lewat Nominatim (OpenStreetMap) — gratis, tanpa kunci.
   Hanya dipanggil saat tombol Cari ditekan, bukan tiap ketukan: layanan ini
   milik proyek nirlaba dan aturan pemakaiannya melarang permintaan beruntun. */
async function cariAlamat(){
  const q=String(($('#pCari')||{}).value||'').trim();
  const kotak=$('#pCariHasil'); if(!kotak) return;
  if(q.length<3){ kotak.innerHTML='<div class="peta-ket">Ketik minimal 3 huruf.</div>'; return; }
  const b=$('#pCariBtn'); if(b){ b.disabled=true; b.textContent='Mencari…'; }
  kotak.innerHTML='<div class="peta-ket">Mencari…</div>';
  try{
    const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=5&q='
      +encodeURIComponent(q), {headers:{'Accept':'application/json'}});
    const j=await r.json();
    if(!Array.isArray(j) || !j.length){
      kotak.innerHTML='<div class="peta-ket">Tidak ketemu. Coba nama jalan atau nama tempat yang lebih umum.</div>';
      return;
    }
    kotak.innerHTML=j.map(function(x){
      return '<button type="button" class="peta-hasil-baris" '
        +'onclick="petaKe('+Number(x.lat)+','+Number(x.lon)+')">'+esc(x.display_name)+'</button>';
    }).join('');
  }catch(e){
    /* Jaringan yang menyaring domain luar gagal di sini. Petanya tetap bisa
       digeser tangan, jadi ini bukan jalan buntu — dan itu yang dikatakan,
       bukan "gagal" tanpa keterangan. */
    kotak.innerHTML='<div class="peta-ket">Pencarian tidak bisa dipakai sekarang. Geser petanya tangan saja.</div>';
  }finally{ if(b){ b.disabled=false; b.textContent='Cari'; } }
}
function petaKe(lat,lng){
  if(PETA) PETA.setView([lat,lng],18);
  const k=$('#pCariHasil'); if(k) k.innerHTML='';
}
function pakaiTitikPeta(){
  if(!PETA) return toast('Petanya belum siap.','warn');
  const c=PETA.getCenter();
  setKoord(c.lat, c.lng);
  toast('Titik diambil dari peta.','ok');
}
/* Peta HARUS dibongkar saat lembarnya ditutup. Leaflet memasang pendengar
   pada window dan menahan wadah DOM-nya; membuka-tutup lembar ini beberapa
   kali tanpa remove() meninggalkan peta-peta lama yang masih hidup, dan
   halamannya tersendat tanpa sebab yang kelihatan. */
function buangPeta(){
  if(PETA){ try{ PETA.remove(); }catch(e){} }
  PETA=null; PETA_LINGKARAN=null; PETA_SAYA=null;
}

/* Jarak ke lokasi kerja terdekat — dihitung ulang DI LAYAR hanya untuk
   memberi tahu kru sebelum ia menekan. Yang menentukan sah atau tidak
   tetap perhitungan server; kalau keduanya berbeda, yang benar server. */
function jarakTerdekat(){
  if(!POS || !KTX || !KTX.lokasi || !KTX.lokasi.length) return null;
  let best=null;
  KTX.lokasi.forEach(function(l){
    if(!l.lat && !l.lng) return;
    const R=6371000, t=Math.PI/180;
    const dp=(l.lat-POS.lat)*t, dl=(l.lng-POS.lng)*t;
    const a=Math.sin(dp/2)**2 + Math.cos(POS.lat*t)*Math.cos(l.lat*t)*Math.sin(dl/2)**2;
    const j=Math.round(R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)));
    if(!best || j<best.jarak) best={lokasi:l, jarak:j};
  });
  return best;
}

   KAMERA & WAJAH
   ------------------------------------------------------------------- */
/* Model dimuat MALAS — hanya saat kamera pertama kali dinyalakan. Bobotnya
   6,5 MB; memuatnya saat halaman dibuka berarti kru yang cuma mau melihat
   riwayat ikut menunggu unduhan yang tidak ia butuhkan. */
async function muatModel(){
  if(MODEL_SIAP) return true;
  if(MODEL_MUAT) return false;
  if(typeof faceapi==='undefined'){ toast('Pustaka wajah gagal dimuat.','err'); return false; }
  MODEL_MUAT=true;
  try{
    await faceapi.nets.tinyFaceDetector.loadFromUri('models');
    await faceapi.nets.faceLandmark68TinyNet.loadFromUri('models');
    await faceapi.nets.faceRecognitionNet.loadFromUri('models');
    MODEL_SIAP=true;
  }catch(e){
    toast('Model wajah gagal dimuat: '+e.message,'err');
  }
  MODEL_MUAT=false;
  return MODEL_SIAP;
}

async function nyalakanKamera(idVideo){
  const v=document.getElementById(idVideo); if(!v) return false;
  try{
    KAMERA_STREAM = await navigator.mediaDevices.getUserMedia(
      {video:{facingMode:'user', width:{ideal:640}, height:{ideal:640}}, audio:false});
    v.srcObject=KAMERA_STREAM; await v.play();
    return true;
  }catch(e){
    const kotak=v.closest('.kamera');
    if(kotak) kotak.insertAdjacentHTML('beforeend',
      '<div class="mati">Kamera tidak bisa dibuka.<br><span class="mini" style="color:#cfc9bd">'
      +esc(e.name==='NotAllowedError'?'Izin kamera ditolak. Izinkan lewat pengaturan peramban.':e.message)
      +'</span></div>');
    return false;
  }
}
function matikanKamera(){
  if(KAMERA_STREAM){ KAMERA_STREAM.getTracks().forEach(t=>t.stop()); KAMERA_STREAM=null; }
}
/* Satu tangkapan: descriptor 128 angka + potret kecil.
   Potretnya dikecilkan ke 320px dan dikompres ke JPEG 0.7 — bukan demi
   hemat tempat semata, tapi karena data URI beresolusi penuh membuat satu
   ketukan absen berukuran 2 MB, dan di sinyal lemah pengirimannya gagal
   di tengah tanpa pesan yang berarti. */
async function tangkapWajah(idVideo){
  const v=document.getElementById(idVideo); if(!v) return null;
  if(!MODEL_SIAP) return null;
  const opsi=new faceapi.TinyFaceDetectorOptions({inputSize:320, scoreThreshold:.45});
  const hasil=await faceapi.detectSingleFace(v,opsi).withFaceLandmarks(true).withFaceDescriptor();
  if(!hasil) return null;
  const c=document.createElement('canvas');
  const sisi=Math.min(v.videoWidth,v.videoHeight)||320;
  c.width=320; c.height=320;
  const g=c.getContext('2d');
  g.drawImage(v, (v.videoWidth-sisi)/2, (v.videoHeight-sisi)/2, sisi, sisi, 0,0,320,320);
  return {descriptor:Array.from(hasil.descriptor), foto:c.toDataURL('image/jpeg',.7)};
}

const HALAMAN = [

  {k:'wajah',   n:'Wajah',    ic:'wajah'},

];
function bolehBuka(k){
  const h=HALAMAN.find(x=>x.k===k);
  if(!h) return false;
  if(h.hr) return !!(KTX && KTX.siapa && KTX.siapa.hr);
  return true;
}
function gambarTab(){
  /* PEMBUNGKUS .tabbar-in WAJIB ADA — dialah yang memegang display:flex dan
     max-width. Tanpa dia, tombol menumpuk ke bawah di sisi kiri layar dan
     menu bawah berubah jadi daftar setinggi separuh halaman.

     Bug ini bertahan sejak modulnya lahir sampai 7 Agustus 2026: CSS-nya
     menargetkan .tabbar-in sejak awal, tapi fungsi ini menulis tombolnya
     LANGSUNG ke .tabbar. Tidak ada galat sama sekali — pemilih CSS yang
     tidak menemukan sasaran memang diam saja, dan yang tersisa cuma tampilan
     yang salah tanpa petunjuk apa pun tentang sebabnya. */
  $('#tabbar').innerHTML = '<div class="tabbar-in">'
    + HALAMAN.filter(h=>bolehBuka(h.k)).map(function(h){
        return '<button class="'+(HAL===h.k?'on':'')+'" onclick="go(\''+h.k+'\')">'
          +ikon(h.ic)+'<span>'+esc(h.n)+'</span></button>';
      }).join('')
    + '</div>';
}
function go(k){
  if(!bolehBuka(k)) k='absen';
  matikanKamera();
  HAL=k; window.scrollTo(0,0);
  gambarTab(); gambar();
}

async function mulai(){
  /* Jam besar berdetak sejak awal, bahkan di layar masuk: satu-satunya
     penanda bahwa aplikasinya hidup dan jamnya benar. */
  setInterval(function(){
    const t=$('#jamTeks');
    if(t) t.textContent=jamStr(sekarang());
  },1000);

  ME=bacaSesi();
  if(!ME) return viewMasuk('');
  mulaiLokasi();
  try{ await muatKonteks(); }
  catch(e){
    /* Token yang ditolak server (dicabut, kedaluwarsa, atau akunnya
       dinonaktifkan) tidak boleh berakhir di layar galat buntu — kru cuma
       perlu masuk lagi. Dibedakan dari server yang benar-benar tak
       terjangkau, karena yang itu tidak bisa diselesaikan dengan login. */
    if(/sesi tidak dikenali/i.test(e.message)){
      try{ localStorage.removeItem(SESI_KEY); }catch(x){}
      return viewMasuk('Sesimu sudah berakhir. Masuk lagi ya.');

    $('#app').innerHTML='<div class="card sec rise"><h2 style="margin-bottom:8px">Tidak bisa menghubungi server</h2>'
      +'<p class="mini">'+esc(e.message)+'</p>'
      +'<button class="btn btn-ghost btn-block" style="margin-top:14px" onclick="location.reload()">Coba lagi</button></div>';
    return;
  }
  if(KTX && KTX.siapa && !KTX.siapa.boleh){
    $('#tabbar').style.display='none';
    $('#app').innerHTML='<div class="card sec rise" style="text-align:center;padding:40px 22px">'
     +'<h2 style="margin-bottom:8px">Belum diberi akses</h2>'
     +'<p class="mini" style="margin-bottom:18px">Akun '+esc(KTX.siapa.nama)+' belum diberi akses modul '
     +'Absensi. Minta admin membukanya di Office.</p>'
     +'<button class="btn btn-ghost" onclick="keluarAkun()">Keluar</button></div>';
    return;
  }
  gambarTab(); gambar();
}

    lokKelas='no'; lokJudul='Lokasi belum terbaca'; lokKet=POS_ERR;
  }else if(!POS){
    lokKelas='no'; lokJudul='Mencari sinyal GPS…'; lokKet='Tunggu sebentar, atau keluar dari ruangan tertutup.';
  }else if(dekat && dekat.jarak<=dekat.lokasi.radius){
    lokKelas='ya'; lokJudul='Di '+dekat.lokasi.nama;
    lokKet=dekat.jarak+' m dari titik · akurasi ±'+POS.akurasi+' m';
  }else{
    lokKelas='no'; lokJudul='Di luar area kerja';
    lokKet=(dekat? dekat.jarak+' m dari '+dekat.lokasi.nama : 'Jauh dari semua lokasi')
      +'. Absen tetap bisa, tapi perlu persetujuan HR.';
  }

  const wajibWajah = KTX && KTX.setting && KTX.setting.wajahWajib;
  const sudahDaftar = KTX && KTX.wajahTerdaftar;
  let wjKelas, wjJudul, wjKet;
  if(!sudahDaftar){
    wjKelas = wajibWajah ? 'no' : 'mati';
    wjJudul = 'Wajah belum didaftarkan';
    wjKet = wajibWajah ? 'Wajib. Daftarkan dulu di tab Wajah.' : 'Belum wajib. Daftarkan supaya absenmu lebih kuat buktinya.';
  }else{
    /* Yang wajahnya SUDAH terdaftar selalu dicocokkan, tanpa memandang
       setelan — dan itu harus dikatakan sebelum tombolnya ditekan, bukan
       sesudah absennya jatuh ke antrean tanpa penjelasan. */
    wjKelas='ya'; wjJudul='Wajah terdaftar';
    wjKet = 'Wajib cocok. Wajah yang tidak cocok tetap terekam, tapi masuk antrean persetujuan HR.';
  }

  w.innerHTML='<div class="syarat">'
    +'<div class="s '+lokKelas+'"><div class="ic">'+ikon('pin',17)+'</div>'
      +'<div><b>'+esc(lokJudul)+'</b><span>'+esc(lokKet)+'</span></div></div>'
    +'<div class="s '+wjKelas+'"><div class="ic">'+ikon('wajah',17)+'</div>'
      +'<div><b>'+esc(wjJudul)+'</b><span>'+esc(wjKet)+'</span></div></div>'
  +'</div>';
}

let ARAH_AKTIF='';
function bukaAbsen(arah){
  ARAH_AKTIF=arah; WAJAH=null; FOTO='';
  const dekat=jarakTerdekat();
  const adaLokasi = KTX && KTX.lokasi && KTX.lokasi.length;
  const diLuar = adaLokasi && (!dekat || dekat.jarak > dekat.lokasi.radius);
  const sh = KTX && KTX.shift;
  const perluAlasan = diLuar || !sh || sh.libur || luarJamShift();

  let kenapa='';
  if(diLuar)          kenapa='Kamu berada di luar area kerja.';
  else if(!sh)        kenapa='Kamu tidak punya jadwal shift hari ini.';
  else if(sh.libur)   kenapa='Hari ini jadwalmu '+sh.kode+'.';
  else if(luarJamShift()) kenapa='Sekarang di luar jam shiftmu ('+sh.mulai+'–'+sh.selesai+').';

  bukaSheet(
    '<h3>Absen '+(arah==='MASUK'?'Masuk':'Pulang')+'</h3>'
   +'<p class="ket">'+esc(tglPanjang(sekarang()))+' · '+jamStr(sekarang())+' WIB</p>'
   +'<div class="kamera" id="kotakKamera"><video id="vid" playsinline muted></video>'
     +'<div class="tanda"></div><div class="ket" id="kamKet">Menyiapkan kamera…</div></div>'
   +(perluAlasan
      ? '<div style="margin-top:14px;padding:12px 13px;border-radius:10px;background:var(--warn-bg);'
        +'border:1px solid rgba(181,131,26,.35)">'
        +'<b style="font-size:13px;color:var(--warn)">Perlu persetujuan HR</b>'
        +'<p class="mini" style="color:var(--muted);margin-top:3px">'+esc(kenapa)
        +' Absenmu tetap tercatat, tapi baru sah setelah disetujui.</p></div>'
        +'<div class="field" style="margin-top:11px"><label>Alasan (wajib)</label>'
        +'<textarea id="alasan" rows="2" placeholder="Contoh: diminta datang menggantikan Rian"></textarea></div>'
      : '')
   +'<button class="btn btn-lg btn-block '+(arah==='MASUK'?'btn-ok':'btn-pri')+'" id="btKirim" '
     +'style="margin-top:12px" onclick="kirimAbsen()">Rekam Absen '+(arah==='MASUK'?'Masuk':'Pulang')+'</button>'
   +'<button class="btn btn-ghost btn-block" style="margin-top:8px" onclick="tutupSheet()">Batal</button>');

  siapkanKamera();
}
/* Apakah SEKARANG di luar jam shift — perkiraan di layar saja, supaya kru
   tahu lebih dulu bahwa absennya akan masuk antrean. Yang menentukan tetap
   server; kalau berbeda, yang benar server. */
function luarJamShift(){
  const sh=KTX && KTX.shift;
  if(!sh || sh.libur) return false;
  const set=(KTX && KTX.setting)||{};
  const ke=(t)=>{ const m=/^(\d{1,2}):(\d{2})$/.exec(t||''); return m? (+m[1])*60+(+m[2]) : -1; };
  let m=ke(sh.mulai), s=ke(sh.selesai);
  if(m<0||s<0) return false;
  if(s<=m) s+=1440;
  const d=new Date(sekarang());
  let n=d.getHours()*60+d.getMinutes();
  const a=m-(set.awalMenit||60), b=s+(set.akhirMenit||180);
  if(n>=a && n<=b) return false;
  if(n+1440>=a && n+1440<=b) return false;
  return true;
}

async function siapkanKamera(){
  const ket=$('#kamKet');
  const ok=await nyalakanKamera('vid');
  if(!ok){ if(ket) ket.textContent='Kamera tidak aktif — absen tetap bisa direkam.'; return; }
  if(ket) ket.innerHTML='<span class="spinner"></span> Memuat model wajah…';
  const siap=await muatModel();
  if(!siap){ if(ket) ket.textContent='Model wajah tidak tersedia — absen tetap bisa direkam.'; return; }
  if(ket) ket.textContent='Hadapkan wajah ke lingkaran';
  /* Deteksi berjalan terus tiap 900 ms supaya kru melihat lingkarannya
     berubah hijau — umpan balik itu yang membuat orang tahu ia sudah pada
     posisi yang benar, alih-alih menekan tombol lalu ditolak. */
  const putar=async()=>{
    if(!KAMERA_STREAM) return;
    const hasil=await tangkapWajah('vid');
    const kotak=$('#kotakKamera');
    if(hasil){ WAJAH=hasil.descriptor; FOTO=hasil.foto;
      if(kotak) kotak.classList.add('cocok');
      if(ket) ket.textContent='Wajah terbaca';
    }else{
      if(kotak) kotak.classList.remove('cocok');
      if(ket) ket.textContent='Hadapkan wajah ke lingkaran';
    }
    if(KAMERA_STREAM) setTimeout(putar,900);
  };
  putar();
}

async function kirimAbsen(){
  const b=$('#btKirim'); if(!b) return;
  const al=$('#alasan');
  const perluAlasan = !!al;
  if(perluAlasan && !al.value.trim()) return toast('Alasannya diisi dulu ya.','warn');
  /* Wajah yang sudah terdaftar WAJIB ikut dikirim. Tanpa ini, kru yang
     wajahnya terdaftar bisa melewati kamera begitu saja dan absennya jatuh
     ke antrean HR tanpa ia tahu kenapa — padahal yang kurang cuma satu
     tangkapan kamera yang tinggal ditunggu dua detik. */
  const perluWajah = KTX && KTX.setting
    && (KTX.setting.wajahWajib || KTX.wajahTerdaftar);
  if(perluWajah && !WAJAH)
    return toast('Wajah belum terbaca. Dekatkan wajah ke kamera dan pastikan ruangan cukup terang.','warn');

  b.disabled=true; b.innerHTML='<span class="spinner"></span> Merekam…';
  try{
    const d=await api('absen', {
      arah:ARAH_AKTIF,
      lat:POS?POS.lat:0, lng:POS?POS.lng:0, akurasi:POS?POS.akurasi:0,
      descriptor:WAJAH||null, foto:FOTO||'',
      alasan: al?al.value.trim():''
    });
    matikanKamera(); tutupSheet();
    if(d.duplikat){
      toast('Absen masuk hari ini sudah tercatat pukul '+d.punch.jam+'. Yang pertama yang berlaku.','info');
    }else if(d.punch.status==='MENUNGGU'){
      toast('Terekam pukul '+d.punch.jam+', menunggu persetujuan HR.','warn');
    }else{
      toast('Absen '+(ARAH_AKTIF==='MASUK'?'masuk':'pulang')+' tercatat pukul '+d.punch.jam+'.','ok');
    }
    await muatKonteks(); gambar();
  }catch(e){
    b.disabled=false; b.textContent='Coba lagi';
    toast(e.message,'err');
  }
}

async function muatRiwayat(){
  const w=$('#riwIsi'); if(!w) return;
  w.innerHTML='<div class="empty"><span class="spinner"></span> Memuat…</div>';
  let d;
  try{ d=await api('action=rekap&dari='+encodeURIComponent(RIW_DARI)+'&sampai='+encodeURIComponent(RIW_SAMPAI)); }
  catch(e){ w.innerHTML='<div class="empty">'+esc(e.message)+'</div>'; return; }

  if(!hari.length){ w.innerHTML='<div class="card"><div class="empty">Belum ada absensi pada rentang ini.</div></div>'; return; }

  let totTelat=0, totLembur=0, totHari=0;
  hari.forEach(h=>{ const c=h.hitung||{}; totTelat+=c.telat||0; totLembur+=c.lembur||0; if(c.lengkap) totHari++; });

  w.innerHTML=
    '<div class="card sec" style="margin-bottom:12px"><div style="display:flex;gap:14px;text-align:center">'
      +'<div style="flex:1"><div class="mini">Hari kerja</div><div style="font-size:21px;font-weight:800">'+totHari+'</div></div>'
      +'<div style="flex:1"><div class="mini">Total telat</div><div style="font-size:21px;font-weight:800;color:'
        +(totTelat?'var(--danger)':'var(--ink)')+'">'+durasi(totTelat)+'</div></div>'
      +'<div style="flex:1"><div class="mini">Total lembur</div><div style="font-size:21px;font-weight:800;color:'
        +(totLembur?'var(--info)':'var(--ink)')+'">'+durasi(totLembur)+'</div></div>'
    +'</div></div>'
   +'<div class="card">'+hari.map(hariBarisHTML).join('')+'</div>';

function hariBarisHTML(h){

}

async function simpanWajahSaya(){
  if(!WAJAH) return toast('Wajah belum terbaca. Dekatkan wajah ke kamera.','warn');
  const b=$('#btDaftar'); b.disabled=true; b.innerHTML='<span class="spinner"></span> Menyimpan…';
  try{
    await api('daftarWajah',{tipe:'USER', id:KTX.siapa.id, nama:KTX.siapa.nama,
                             descriptor:WAJAH, foto:FOTO});
    matikanKamera(); tutupSheet();
    toast('Sidik wajah tersimpan.','ok');
    await muatKonteks(); gambar();
  }catch(e){ b.disabled=false; b.textContent='Coba lagi'; toast(e.message,'err'); }
}

/* =====================================================================
   HALAMAN 5 — PENGATURAN (HR)
   ===================================================================== */
function viewAtur(){
  const st=(KTX&&KTX.setting)||{};
  const l=(KTX&&KTX.lokasi)||[];
  $('#app').innerHTML=
    '<div class="hd"><h2>Titik Kerja</h2>'
    +'<p>Absen di dalam radius salah satunya langsung sah. Di luar semuanya masuk antrean pengajuan.</p></div>'
   /* Kotak GPS diletakkan DI ATAS daftar titik, bukan di dalam lembar
      tambah — kalau GPS-nya bermasalah, orang harus tahu SEBELUM ia menekan
      "Tambah" dan menemui tombol mati tanpa penjelasan. */
   +'<div id="gpsKotak">'+gpsKotakHTML()+'</div>'
   +'<button class="btn btn-ghost btn-block" id="btGps" style="margin-top:9px" onclick="ambilLokasiSekarang()">'
     +ikon('pin',17)+(POS?' Ambil lokasi lagi':' Ambil lokasi saya')+'</button>'
   +(l.length? '<div class="card" style="margin-top:12px">'+l.map(lokBarisHTML).join('')+'</div>'
             : '<div class="card kosong-lok" style="margin-top:12px">'
               +'<div class="ic">'+ikon('pin',26)+'</div>'
               +'<b>Belum ada titik kerja</b>'
               +'<span>Selama kosong, semua absen dianggap di dalam area — jadi tidak ada yang terhambat '
               +'sementara ini disiapkan.</span></div>')
   +'<button class="btn btn-pri btn-block" style="margin-top:10px" onclick="bukaLokasi()">'
     +ikon('pin',18)+' Tambah titik kerja</button>'

   +'<div class="hd"><h2>Aturan</h2><p>Berlaku untuk semua orang.</p></div>'
   +'<div class="card sec">'
     +'<div class="dua">'
       +'<div class="field"><label>Toleransi telat</label>'
         +'<div class="satuan"><input type="number" id="sTol" value="'+(+st.toleransiTelat||0)+'" min="0" max="60"><span>menit</span></div></div>'
       +'<div class="field"><label>Lembur diabaikan di bawah</label>'
         +'<div class="satuan"><input type="number" id="sLem" value="'+(+st.lemburMinMenit||0)+'" min="0" max="120"><span>menit</span></div></div>'
     +'</div>'
     +'<div class="dua">'
       +'<div class="field"><label>Boleh absen sebelum shift</label>'
         +'<div class="satuan"><input type="number" id="sAwal" value="'+(+st.awalMenit||0)+'" min="0" max="360"><span>menit</span></div></div>'
       +'<div class="field"><label>…dan sesudah shift</label>'
         +'<div class="satuan"><input type="number" id="sAkhir" value="'+(+st.akhirMenit||0)+'" min="0" max="720"><span>menit</span></div></div>'
     +'</div>'
     +'<div class="field"><label>Ambang kemiripan wajah</label>'
       +'<div class="satuan"><input type="number" step="0.01" id="sAmb" value="'+(+st.wajahAmbang||0.45)+'" min="0.2" max="0.8"><span>makin kecil makin ketat</span></div></div>'
     +saklarHTML('sWajib', st.wajahWajib, 'Wajah wajib cocok',
        'Nyalakan setelah semua kru mendaftarkan wajah. Kalau dinyalakan lebih awal, yang belum terdaftar tidak bisa absen sama sekali.')
     +saklarHTML('sTanpa', st.tanpaShiftBoleh, 'Boleh absen tanpa jadwal shift',
        'Kalau mati, absen tanpa jadwal selalu masuk antrean pengajuan.')
     +'<button class="btn btn-pri btn-block" style="margin-top:14px" onclick="simpanAturan()">Simpan Aturan</button>'
   +'</div>';
}
/* Saklar sebagai baris yang BISA DIKETUK SELURUHNYA, bukan kotak centang
   kecil di sebelah teks. Di HP, kotak centang bawaan berukuran ~16px dan
   meleset terus — sedangkan barisnya selebar layar. */
function saklarHTML(id, nyala, judul, ket){
  return '<label class="saklar'+(nyala?' on':'')+'" for="'+id+'">'
    +'<input type="checkbox" id="'+id+'" '+(nyala?'checked':'')+' onchange="this.closest(\'.saklar\').classList.toggle(\'on\',this.checked)">'
    +'<span class="knop"></span>'
    +'<span class="tks"><b>'+esc(judul)+'</b><span>'+esc(ket)+'</span></span></label>';
}
function lokBarisHTML(x){
  const dekat = POS ? jarakKe(x) : null;
  return '<div class="hari"><div class="is"><b>'+esc(x.nama)+'</b>'
   +'<span class="mono">'+x.lat.toFixed(5)+', '+x.lng.toFixed(5)+'</span>'
   +'<span>Radius '+x.radius+' m'
   +(dekat!==null? ' · kamu '+(dekat<=x.radius?'<b style="color:var(--ok)">di dalam</b>':'di luar')
                   +' ('+dekat+' m)' : '')+'</span></div>'
   +'<div class="kn"><button class="btn btn-ghost" style="padding:8px 13px;font-size:12.5px" '
   +'onclick="bukaLokasi(\''+esc(x.id)+'\')">Ubah</button></div></div>';
}
function jarakKe(l){
  if(!POS || (!l.lat && !l.lng)) return null;
  const R=6371000, t=Math.PI/180;
  const dp=(l.lat-POS.lat)*t, dl=(l.lng-POS.lng)*t;
  const a=Math.sin(dp/2)**2 + Math.cos(POS.lat*t)*Math.cos(l.lat*t)*Math.sin(dl/2)**2;
  return Math.round(R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)));
}
function gambarLokasi(){ if(HAL==='atur') viewAtur(); }

function bukaLokasi(id){
  const l=((KTX&&KTX.lokasi)||[]).find(x=>x.id===id) || {id:'',nama:'',lat:0,lng:0,radius:120};
  bukaSheet('<h3>'+(id?'Ubah':'Tambah')+' Titik Kerja</h3>'
   +'<p class="ket">Tandai di peta seperti di Gojek/Grab, ambil dari GPS saat berdiri di sana, atau tempel koordinat dari Google Maps.</p>'
   +'<div class="field"><label>Nama titik</label>'
     +'<input id="lNama" value="'+esc(l.nama)+'" placeholder="Kantor / Outlet Sudirman"></div>'

   /* PETA JADI CARA PERTAMA. Dua cara lama tetap ada dan tidak diubah:
      GPS untuk yang memang sedang berdiri di lokasinya, tempel koordinat
      untuk yang menyiapkannya dari laptop tanpa jaringan ke luar. */
   +'<div class="pilih-cara tiga">'
     +'<button class="pc on" id="pcPeta" onclick="pilihCara(\'peta\')">'+ikon('pin',16)+' Peta</button>'
     +'<button class="pc" id="pcGps" onclick="pilihCara(\'gps\')">Dari GPS</button>'
     +'<button class="pc" id="pcTempel" onclick="pilihCara(\'tempel\')">Tempel</button>'
   +'</div>'

   +'<div id="caraPeta">'
     +'<div class="peta-cari">'
       +'<input id="pCari" placeholder="Cari alamat atau nama tempat\u2026" '
         +'onkeydown="if(event.key===\'Enter\'){event.preventDefault();cariAlamat()}">'
       +'<button type="button" class="btn btn-ghost" id="pCariBtn" onclick="cariAlamat()">Cari</button>'
     +'</div>'
     +'<div id="pCariHasil" class="peta-hasil"></div>'
     +'<div class="peta-bingkai">'
       +'<div id="peta"></div>'
       /* Penanda DIAM di tengah, petanya yang digeser — di layar HP jari
          menutupi titik yang sedang ditunjuk, dan pin yang ditaruh dengan
          mengetuk selalu meleset beberapa puluh meter. */
       +'<div class="peta-silang">'+ikon('pin',34)+'</div>'
       +'<button type="button" class="peta-saya" onclick="petaKeSaya()" title="Ke posisi saya">'
         +ikon('pin',17)+'</button>'
     +'</div>'
     +'<div class="peta-koord mono" id="pKoord">\u2014</div>'
     +'<p class="mini" style="margin:6px 0 9px">Peta &copy; OpenStreetMap</p>'
     +'<button class="btn btn-ok btn-block" onclick="pakaiTitikPeta()">Pakai titik di penanda</button>'
   +'</div>'

   +'<div id="caraGps" style="display:none">'
     +'<div id="gpsKotak">'+gpsKotakHTML()+'</div>'
     +'<button class="btn btn-ghost btn-block" style="margin-top:9px" id="btGps" onclick="ambilLokasiSekarang()">'
       +ikon('pin',17)+' Ambil lokasi saya</button>'
     +'<button class="btn btn-ok btn-block" style="margin-top:8px" id="btPakaiGps" '
       +(POS?'':'disabled')+' onclick="pakaiLokasiSaya()">Pakai koordinat ini</button>'
   +'</div>'
   +'<div id="caraTempel" style="display:none">'
     +'<div class="field"><label>Koordinat atau tautan Google Maps</label>'
       +'<textarea id="lTempel" rows="2" placeholder="-0.507100, 101.447800"></textarea></div>'
     +'<button class="btn btn-ok btn-block" onclick="pakaiTempelan()">Baca koordinat</button>'
     +'<p class="mini" style="margin-top:8px">Di Google Maps: tahan titiknya sampai muncul penanda merah, '
     +'lalu salin angka yang tampil di bawah. Tautan pendek (maps.app.goo.gl) harus dibuka dulu.</p>'
   +'</div>'

   +'<div class="koord" id="koordKotak">'+koordKotakHTML(l.lat,l.lng)+'</div>'

   +'<div class="field" style="margin-top:12px"><label>Radius</label>'
     +'<div class="satuan"><input type="number" id="lRad" value="'+l.radius+'" min="30" max="2000" '
     +'oninput="petaSegarkanRadius()"><span>meter</span></div></div>'
   +'<div class="cepat">'
     +[80,120,200,400].map(r=>'<button onclick="setRadius('+r+')">'+r+' m</button>').join('')
   +'</div>'
   +'<p class="mini" style="margin:8px 0 14px">Di bawah 30 m tidak diterima: akurasi GPS di dalam bangunan '
   +'jarang lebih baik dari itu, dan kru yang berdiri di dalam kantor akan dinyatakan di luar area.</p>'

   +'<button class="btn btn-pri btn-block btn-lg" onclick="simpanLokasi(\''+esc(l.id)+'\')">Simpan Titik Kerja</button>'
   +(id?'<button class="btn btn-ghost btn-block" style="margin-top:8px;color:var(--danger)" onclick="hapusLokasi(\''+esc(id)+'\')">Hapus titik ini</button>':'')
   +'<button class="btn btn-ghost btn-block" style="margin-top:8px" onclick="tutupSheet()">Batal</button>');
  /* Koordinat disimpan di variabel, bukan di kotak isian tersembunyi:
     angka pecahan 7 digit yang bolak-balik lewat input bertipe teks gampang
     kehilangan ketelitian karena pemformatan. */
  LOK_LAT=l.lat; LOK_LNG=l.lng;
  /* Petanya dipasang begitu lembarnya terbuka — tab Peta memang yang aktif
     dari awal, jadi menundanya sampai tabnya "dipilih" berarti ia tidak
     pernah terpasang sama sekali. */
  siapkanPeta();
}
let LOK_LAT=0, LOK_LNG=0;
function koordKotakHTML(lat,lng){
  if(!lat && !lng)
    return '<div class="kosong">Koordinat belum diisi</div>';
  return '<div class="ada">'+ikon('pin',16)
    +'<span class="mono">'+Number(lat).toFixed(6)+', '+Number(lng).toFixed(6)+'</span></div>';
}
function pilihCara(c){
  [['peta','#caraPeta','#pcPeta'],['gps','#caraGps','#pcGps'],['tempel','#caraTempel','#pcTempel']]
    .forEach(function(x){
      const aktif=(c===x[0]);
      const isi=$(x[1]); if(isi) isi.style.display=aktif?'':'none';
      const tb=$(x[2]);  if(tb)  tb.classList.toggle('on', aktif);
    });
  /* Petanya baru dipasang saat tabnya benar-benar dibuka — 160 KB tidak
     boleh ikut menahan lembar yang dibuka cuma untuk mengubah radius. */
  if(c==='peta') siapkanPeta();
}
function setKoord(lat,lng){
  LOK_LAT=lat; LOK_LNG=lng;
  const k=$('#koordKotak'); if(k) k.innerHTML=koordKotakHTML(lat,lng);
}
function pakaiLokasiSaya(){
  if(!POS) return toast('Lokasi belum terbaca. Ketuk "Ambil lokasi saya" dulu.','warn');
  setKoord(POS.lat, POS.lng);
  toast('Koordinat diisi dari GPS (±'+POS.akurasi+' m).','ok');
}
function pakaiTempelan(){
  const r=bacaKoordinat($('#lTempel').value);
  if(!r) return toast('Isi dulu koordinat atau tautannya.','warn');
  if(r.galat) return toast(r.galat,'warn');
  setKoord(r.lat, r.lng);
  toast('Koordinat terbaca.','ok');
}
function setRadius(r){ $('#lRad').value=r; petaSegarkanRadius(); }

async function simpanLokasi(id){
  const nama=$('#lNama').value.trim();
  if(!nama) return toast('Nama titik kerja diisi dulu.','warn');
  if(!LOK_LAT && !LOK_LNG)
    return toast('Koordinatnya masih kosong. Ambil dari GPS atau tempel dari Google Maps.','warn');
  const row={id:id, nama:nama, lat:LOK_LAT, lng:LOK_LNG,
             radius:parseInt($('#lRad').value,10)||120, aktif:1};
  try{
    await api('simpanLokasi',{row:row});
    tutupSheet(); toast('Titik kerja tersimpan.','ok');
    await muatKonteks(); gambar();
  }catch(e){ toast(e.message,'err'); }
}
async function hapusLokasi(id){
  if(!confirm('Hapus titik kerja ini? Absen di sana akan mulai masuk antrean pengajuan.')) return;
  try{ await api('hapusLokasi',{id:id}); tutupSheet(); toast('Titik kerja dihapus.','ok');
       await muatKonteks(); gambar(); }
  catch(e){ toast(e.message,'err'); }
}
async function simpanAturan(){
  const d={
    toleransiTelat:parseInt($('#sTol').value,10)||0,
    lemburMinMenit:parseInt($('#sLem').value,10)||0,
    awalMenit:parseInt($('#sAwal').value,10)||0,
    akhirMenit:parseInt($('#sAkhir').value,10)||0,
    wajahAmbang:parseFloat($('#sAmb').value)||0.45,
    wajahWajib:$('#sWajib').checked,
    tanpaShiftBoleh:$('#sTanpa').checked,
    hr:((KTX&&KTX.setting&&KTX.setting.hr)||[])
  };
  try{ await api('simpanSetting',{data:d}); toast('Aturan tersimpan.','ok');
       await muatKonteks(); gambar(); }
  catch(e){ toast(e.message,'err'); }
}

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(e=>console.warn('SW gagal:',e));
  });
}
mulai();
