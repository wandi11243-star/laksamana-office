; Batas unggahan untuk modul Marketing.
;
; Surat Penawaran boleh sampai 40MB. Berkasnya dikirim sebagai JSON berisi
; base64, dan base64 membengkakkan ukuran ~33% — jadi 40MB berkas menjadi
; ~54MB body permintaan. Angka di bawah diberi kelonggaran di atas itu.
;
; PENTING: post_max_size TIDAK bisa diubah dari kode (ini_set) karena bertipe
; PHP_INI_PERDIR. Kalau body melewati batasnya, PHP membuang isinya sebelum
; api.php sempat jalan — php://input jadi kosong dan unggahan gagal dengan
; pesan yang membingungkan ("file kosong"), bukan pesan "terlalu besar".
;
; Berkas ini hanya berlaku di PHP mode CGI/FastCGI/FPM (mayoritas shared
; hosting). Kalau server memakai mod_php, .user.ini DIABAIKAN — setel nilai
; yang sama lewat php.ini atau .htaccess:
;   php_value post_max_size 64M
;   php_value upload_max_filesize 64M
;   php_value memory_limit 256M
; (php_value di .htaccess membuat server NON-mod_php balas 500, jadi jangan
; dipasang kalau tidak yakin.)

post_max_size = 64M
upload_max_filesize = 64M
memory_limit = 256M
max_input_time = 300
