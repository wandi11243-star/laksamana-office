    ['Service charge', r.svc],
    ['Pajak', r.tax],
    ['Pembulatan & biaya lain', (r.grand || 0) - (r.net || 0) - (r.svc || 0) - (r.tax || 0)],
    ['Grand Total', r.grand, 1]
  ];
  h += '<div class="card"><h3>Susunan Penjualan</h3>'
    + '<div class="card-sub">Dijumlahkan dari kolom yang memang ada di berkasnya — '
    + 'tidak ada satu pun angka yang dihitung ulang di sini.</div>'
    + '<div class="tbl-wrap"><table><tbody>'
    + baris.map(x => '<tr' + (x[2] ? ' style="font-weight:700"' : '') + '><td>' + esc(x[0]) + '</td>'
        + '<td class="num mono" style="text-align:right">' + rp0(x[1]) + '</td></tr>').join('')
    + '</tbody></table></div></div>';

  /* Bandingkan dengan Rekap Penjualan. Dua sumber untuk angka yang sama harus
     dicocokkan di suatu tempat, dan kalau tidak di sini maka tidak di mana
     pun — selisihnya baru ketahuan saat laporan bulanan tidak cocok. */
  h += bandingKompas(b, d);
  V.innerHTML = h;
}

/* Pemilih bulan, dipakai SELURUH halaman yang membaca satu bulan. Dulu
   dipotong `slice(0, 14)` — bulan ke-15 dan seterusnya hilang dari layar tanpa
   satu pun tanda, dan yang mencarinya akan menyimpulkan laporannya belum pernah
   diunggah. Sekarang semuanya digambar; chip-nya membungkus sendiri. */
function pilihBulan() {
  const a = blnAda(), b = blnAktif();
  if (!a.length) return '';
  return '<div class="card" style="padding:14px 18px;margin-bottom:16px">'
    + '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'
    + '<b style="font-size:13px">Bulan</b>'
    + a.map(x => '<span class="qa-chip' + (x === b ? ' on' : '') + '" data-b="' + esc(x) + '"'
        + ' onclick="blnPilih(this.dataset.b)">' + esc(fmtBln(x)) + '</span>').join('')
    + '<span style="flex:1"></span>'
    + '<span class="helper" style="margin:0">' + esc(ketLaporan(lap(b))) + '</span>'
    + '</div></div>';
}
function ketLaporan(d) {
  if (!d) return '';
  return (d.jenis === 'menu' ? 'Menu Report' : 'Bill Report') + ' · diunggah '
    + fmtTgl(d.diunggah) + (d.oleh ? ' oleh ' + d.oleh : '');
}
function kosongBelumAda() {
  return '<div class="empty"><div class="big">◫</div>'
    + '<b>Belum ada laporan yang diunggah.</b>'
    + '<div style="margin-top:6px">Buka <b>Unggah Laporan</b> lalu pilih berkas '
    + '<i>Sales Recapitulation</i> dari POS. Berkasnya diurai di peramban ini — '
    + 'yang dikirim ke server cuma ringkasannya.</div></div>';
}

/* Angka POS vs angka yang diketik di Rekap Penjualan. Keduanya MEMANG boleh
   berbeda — Rekap diisi manual dan bisa tertinggal — tapi bedanya harus
   kelihatan, karena selisih yang tidak pernah dilihat adalah selisih yang
   tidak pernah dicari sebabnya. */
function bandingKompas(b, d) {
  if (!KP) return '<div class="notice warn">⚠ <div>' + esc(KP_ERR) + '</div></div>';
  const daily = Array.isArray(KP.daily) ? KP.daily : [];
  let net = 0, svc = 0, tax = 0, adaHari = 0;
  daily.forEach(x => {
    if (blnDari(isoDari(x && x.date)) !== b) return;
    adaHari++;
    net += (+x.food || 0) + (+x.bev || 0) + (+x.lainnya || 0) - (+x.discount || 0);
    svc += (+x.service_charge || 0); tax += (+x.tax || 0);
  });
  if (!adaHari) return '<div class="notice info">ℹ <div>Rekap Penjualan belum punya data '
    + esc(fmtBln(b)) + ', jadi belum ada yang bisa dibandingkan.</div></div>';
  const tagihan = net + svc + tax;
  const posGrand = (d.ringkas || {}).grand || 0;
  const selisih = posGrand - tagihan;
  const besar = tagihan ? Math.abs(selisih) / tagihan : 0;
  return '<div class="card"><h3>Dibanding Rekap Penjualan</h3>'
    + '<div class="card-sub">Rekap Penjualan diisi manual tiap hari; berkas POS ini keluaran mesin. '
    + 'Keduanya memang bisa berbeda — yang penting bedanya terlihat.</div>'
    + '<div class="grid g3">'
    + kartu('POS (Grand Total)', rp0(posGrand), Object.keys(d.hari || {}).length + ' hari')
    + kartu('Rekap Penjualan', rp0(tagihan), adaHari + ' hari terisi · net + service + pajak')
    + kartu('Selisih', rp0(selisih), (tagihan ? (selisih >= 0 ? '+' : '') + (besar * 100).toFixed(1) + '% dari Rekap' : '—'))
    + '</div>'
    + (besar > 0.02
        ? '<div class="notice warn" style="margin-top:12px">⚠ <div>Selisihnya lebih dari 2%. '
          + 'Yang paling sering jadi sebabnya: hari yang belum diinput di Rekap Penjualan, '
          + 'atau berkas POS yang periodenya tidak sebulan penuh.</div></div>'
        : '')
    + '</div>';
}

/* ============ HALAMAN: HARI & JAM ============ */
function vHari() {
  const V = document.getElementById('app-view');
  const b = blnAktif(), d = lap(b);
  let h = pilihBulan();
  if (!d) { V.innerHTML = h + kosongBelumAda(); return; }

  const hari = d.hari || {};
  const tgl = Object.keys(hari).sort();

  /* ---- per hari dalam seminggu ---- */
  const dow = Array.from({ length: 7 }, () => ({ n:0, grand:0, bill:0 }));
  tgl.forEach(t => { const k = dow[dowDari(t)];
    k.n++; k.grand += hari[t].grand || 0; k.bill += hari[t].bill || 0; });
  const puncak = Math.max(...dow.map(x => x.n ? x.grand / x.n : 0), 1);
  const totalRata = tgl.length ? tgl.reduce((a, t) => a + (hari[t].grand || 0), 0) / tgl.length : 0;

  h += '<div class="card"><h3>Omset per Hari dalam Seminggu</h3>'
    + '<div class="card-sub">Rata-rata, bukan jumlah — bulan yang punya lima Sabtu dan empat Senin '
    + 'akan selalu menunjukkan Sabtu lebih besar kalau yang dibandingkan jumlahnya.</div>'
    + '<div class="tbl-wrap"><table><thead><tr><th>Hari</th><th class="num">Jumlah hari</th>'
    + '<th class="num">Rata-rata omset</th><th class="num">Rata-rata bill</th>'
    + '<th class="num">vs rata-rata bulan</th><th style="width:34%"></th></tr></thead><tbody>'
    + [1,2,3,4,5,6,0].map(i => {
        const x = dow[i], rata = x.n ? x.grand / x.n : 0;
        const beda = totalRata ? (rata - totalRata) / totalRata * 100 : 0;
        const w = Math.round(rata / puncak * 100);
        return '<tr><td><b>' + NAMA_HARI[i] + '</b></td>'
          + '<td class="num">' + x.n + '</td>'
          + '<td class="num mono">' + rp0(rata) + '</td>'
          + '<td class="num mono">' + (x.n ? Math.round(x.bill / x.n) : 0) + '</td>'
          + '<td class="num mono" style="color:' + (beda >= 0 ? 'var(--ok)' : 'var(--danger)') + '">'
            + (beda >= 0 ? '+' : '') + beda.toFixed(0) + '%</td>'
          + '<td><div style="background:var(--gold-soft);border-radius:4px;height:10px">'
            + '<div style="width:' + w + '%;height:10px;border-radius:4px;background:var(--gold)"></div></div></td>'
          + '</tr>';
      }).join('')
    + '</tbody></table></div>'
    + '<div class="helper">Rata-rata seluruh hari: <b>' + rp0(totalRata) + '</b>.</div>'
    + '</div>';

  /* ---- dua shift ---- */
  const S = shiftSet();
  const lbl = (a, z) => String(a).padStart(2,'0') + ':00–' + String(z % 24).padStart(2,'0') + ':00';
  const jam = Array.isArray(d.jam) ? d.jam : [];
  let g1 = 0, g2 = 0, b1 = 0, b2 = 0, gLain = 0, bLain = 0;
  jam.forEach((x, j) => {
    const g = (x && x.grand) || 0, bl = (x && x.bill) || 0;
    if (diRentang(j, S.s1a, S.s1b)) { g1 += g; b1 += bl; }
    else if (diRentang(j, S.s2a, S.s2b % 24)) { g2 += g; b2 += bl; }
    else { gLain += g; bLain += bl; }
  });
  const tot = g1 + g2 + gLain;

  h += '<div class="card"><h3>Dua Shift</h3>'
    + '<div class="card-sub">Dikelompokkan menurut <b>jam bill dibuka</b> (Sales In Time). '
    + 'Batas jamnya disetel di Pengaturan.</div>'
    + '<div class="grid g3">'
    + kartu('Siang · ' + lbl(S.s1a, S.s1b), rp0(g1), pct(g1, tot) + '% omset · ' + b1.toLocaleString('id-ID') + ' bill'
        + (b1 ? ' · ' + rp0(g1 / b1) + '/bill' : ''))
    + kartu('Malam · ' + lbl(S.s2a, S.s2b), rp0(g2), pct(g2, tot) + '% omset · ' + b2.toLocaleString('id-ID') + ' bill'
        + (b2 ? ' · ' + rp0(g2 / b2) + '/bill' : ''))
    + kartu('Di luar keduanya', rp0(gLain), pct(gLain, tot) + '% · ' + bLain.toLocaleString('id-ID') + ' bill')
    + '</div>'
    /* Jam di luar kedua shift TIDAK disembunyikan. Kalau dibuang, jumlah kedua
       shift tidak akan sama dengan total di halaman Ringkasan, dan yang
       menjumlahkannya akan mengira salah satu halaman salah. */
    + (gLain > 0 ? '<div class="helper">Yang di luar keduanya tetap dihitung supaya '
        + 'jumlah ketiganya sama dengan total di Ringkasan.</div>' : '')
    + '</div>';

  /* ---- sebaran per jam ---- */
  const pun = Math.max(...jam.map(x => (x && x.grand) || 0), 1);
  h += '<div class="card"><h3>Sebaran per Jam</h3>'
    + '<div class="card-sub">Sepanjang bulan, menurut jam bill dibuka.</div>'
    + '<div class="tbl-wrap"><table><thead><tr><th>Jam</th><th class="num">Bill</th>'
    + '<th class="num">Omset</th><th class="num">Rata/bill</th><th style="width:42%"></th></tr></thead><tbody>'
    + jam.map((x, j) => {
        const g = (x && x.grand) || 0, bl = (x && x.bill) || 0;
        if (!bl) return '';
        const dlm = diRentang(j, S.s1a, S.s1b) ? 'siang' : (diRentang(j, S.s2a, S.s2b % 24) ? 'malam' : '');
        return '<tr><td class="mono">' + String(j).padStart(2,'0') + ':00'
          + (dlm ? ' <span class="chip" style="background:var(--gold-soft);color:var(--gold-dim)">' + dlm + '</span>' : '')
          + '</td>'
          + '<td class="num">' + bl.toLocaleString('id-ID') + '</td>'
          + '<td class="num mono">' + rp0(g) + '</td>'
          + '<td class="num mono">' + rp0(bl ? g / bl : 0) + '</td>'
          + '<td><div style="background:var(--gold-soft);border-radius:4px;height:10px">'
            + '<div style="width:' + Math.round(g / pun * 100) + '%;height:10px;border-radius:4px;background:var(--gold)"></div></div></td>'
          + '</tr>';
      }).join('')
    + '</tbody></table></div></div>';

  /* ---- daftar tanggal ---- */
  h += '<div class="card"><h3>Per Tanggal</h3><div class="tbl-wrap"><table>'
    + '<thead><tr><th>Tanggal</th><th>Hari</th><th class="num">Bill</th><th class="num">Omset</th>'
    + '<th class="num">Rata/bill</th></tr></thead><tbody>'
    + tgl.map(t => { const x = hari[t];
        return '<tr><td class="mono">' + esc(fmtTgl(t)) + '</td>'
          + '<td>' + NAMA_HARI[dowDari(t)] + '</td>'
          + '<td class="num">' + (x.bill || 0) + '</td>'
          + '<td class="num mono">' + rp0(x.grand) + '</td>'
          + '<td class="num mono">' + rp0(x.bill ? x.grand / x.bill : 0) + '</td></tr>';
      }).join('')
    + '</tbody></table></div></div>';
  V.innerHTML = h;
}

/* ============ HALAMAN: MENU & BAHAN BAKU ============ */
function vMenu() {
  const V = document.getElementById('app-view');
  const b = blnAktif(), d = lap(b);
  let h = pilihBulan();
  if (!d) { V.innerHTML = h + kosongBelumAda(); return; }

  const menu = d.menu || {};
  const nama = Object.keys(menu);

  /* Laporan yang diunggah pertama kali adalah Bill Report, dan di dalamnya
     tidak ada satu pun nama menu. Menggambar tabel kosong akan terbaca sebagai
     "tidak ada yang terjual" — jawaban yang salah untuk pertanyaan yang tidak
     pernah ditanyakan. Jadi yang dikatakan adalah laporan mana yang kurang. */
  if (!nama.length) {
    V.innerHTML = h + '<div class="notice warn">⚠ <div><b>Laporan bulan ini tidak memuat nama menu.</b> '
      + 'Yang diunggah adalah <b>Bill Report</b> — satu baris per bill, berisi nilai dan jamnya, '
      + 'tapi tidak berisi apa saja yang dipesan.</div></div>'
      + '<div class="card"><h3>Yang perlu diunggah</h3>'
      + '<div class="card-sub">Di layar ekspor POS yang sama, ganti <b>Sales Report Type</b> dari '
      + '<i>Bill Report</i> ke jenis laporan yang merinci menu — biasanya bernama '
      + '<i>Menu Report</i>, <i>Item Sales</i>, atau <i>Product Sales</i>. Berkasnya diunggah '
      + 'di halaman <b>Unggah Laporan</b> seperti biasa; halaman ini mengenali sendiri '
      + 'bentuknya dari nama kolomnya.</div>'
      + '<div class="notice info">ℹ <div>Begitu laporan menu masuk, halaman ini menghitung '
      + '<b>menu terlaris</b> dan <b>perkiraan bahan baku yang seharusnya keluar</b> — dikalikan '
      + 'dari resep di modul HPP, jadi bisa dibandingkan dengan stok fisik di lapangan.</div></div>'
      + '</div>';
    return;
  }

  const urut = nama.map(n => ({ n, qty:menu[n].qty || 0, nilai:menu[n].nilai || 0 }))
                   .sort((a, x) => x.nilai - a.nilai);
  const totQty = urut.reduce((a, x) => a + x.qty, 0);
  const totNilai = urut.reduce((a, x) => a + x.nilai, 0);

  h += '<div class="grid g3" style="margin-bottom:18px">'
    + kartu('Menu Berbeda', urut.length, 'yang pernah terjual bulan ini')
    + kartu('Porsi Terjual', totQty.toLocaleString('id-ID'), 'jumlah seluruh qty')
    + kartu('Nilai Menu', rp0(totNilai), 'sebelum service & pajak')
    + '</div>';

  const pun = urut.length ? urut[0].nilai : 1;
  h += '<div class="card"><h3>Menu Terlaris</h3>'
    + '<div class="card-sub">Diurut menurut NILAI, bukan jumlah porsi. Menu murah yang terjual '
    + 'ratusan porsi bisa menyumbang lebih sedikit daripada satu menu mahal — dan yang dicari '
    + 'di halaman ini biasanya yang menyumbang omset.</div>'
    + '<div class="tbl-wrap"><table><thead><tr><th>#</th><th>Menu</th><th class="num">Qty</th>'
    + '<th class="num">Nilai</th><th class="num">% omset menu</th><th style="width:26%"></th></tr></thead><tbody>'
    + urut.slice(0, 50).map((x, i) => '<tr><td>' + (i + 1) + '</td><td><b>' + esc(x.n) + '</b></td>'
        + '<td class="num">' + x.qty.toLocaleString('id-ID') + '</td>'
        + '<td class="num mono">' + rp0(x.nilai) + '</td>'
        + '<td class="num">' + pct(x.nilai, totNilai) + '%</td>'
        + '<td><div style="background:var(--gold-soft);border-radius:4px;height:10px">'
          + '<div style="width:' + Math.round(x.nilai / pun * 100) + '%;height:10px;border-radius:4px;background:var(--gold)"></div></div></td>'
        + '</tr>').join('')
    + '</tbody></table></div>'
    + (urut.length > 50 ? '<div class="helper">50 teratas dari ' + urut.length + ' menu.</div>' : '')
    + '</div>';

  h += bahanBakuHtml(urut);
  V.innerHTML = h;
}

/* ---- perkiraan bahan baku dari resep HPP ----
   Menu terjual x resep = bahan yang SEHARUSNYA keluar. Dibandingkan dengan
   stok fisik, selisihnya adalah yang hilang, terbuang, atau salah takar.

   Resep boleh memakai resep lain (base), jadi harus DIURAI BERTINGKAT.
   Kedalaman dibatasi supaya resep yang tidak sengaja menunjuk dirinya sendiri
   tidak menggantung halaman — dan yang kena batas DISEBUTKAN, bukan diam. */
function resepPeta() {
  const peta = {};
  ((HP && HP.resep) || []).forEach(r => { if (r && r.nama) peta[String(r.nama).trim().toLowerCase()] = r; });
  return peta;
}
function uraiResep(nama, qty, peta, keluar, dalam, jejak) {
  dalam = dalam || 0; jejak = jejak || {};
  const k = String(nama || '').trim().toLowerCase();
  if (!k) return;
  if (dalam > 6 || jejak[k]) { keluar.__putar = true; return; }
  const r = peta[k];
  if (!r) { keluar.__hilang = keluar.__hilang || {}; keluar.__hilang[nama] = (keluar.__hilang[nama] || 0) + qty; return; }
  const y = (+r.yield_qty || 0) || 1;
  const j2 = Object.assign({}, jejak); j2[k] = 1;
  (Array.isArray(r.bahan) ? r.bahan : []).forEach(x => {
    const nm = String((x && (x.nama || x.bahan)) || '').trim();
    const q = (+((x && (x.qty || x.jumlah)) || 0)) * qty / y;
    if (!nm || !q) return;
    if (peta[nm.toLowerCase()]) uraiResep(nm, q, peta, keluar, dalam + 1, j2);
    else {
      const sat = String((x && (x.satuan || x.unit)) || '').trim();
      const kunci = nm + (sat ? ' (' + sat + ')' : '');
      keluar[kunci] = (keluar[kunci] || 0) + q;
    }
  });
}
function bahanBakuHtml(urut) {
  if (!HP) return '<div class="notice warn">⚠ <div><b>Resep dari modul HPP tidak terbaca.</b> '
    + 'Menu terlaris di atas tetap terbaca, tapi perkiraan bahan baku belum bisa dihitung.</div></div>';
  const peta = resepPeta();
  const keluar = {};
  const tanpaResep = [];
  urut.forEach(x => {
    if (!peta[String(x.n).trim().toLowerCase()]) { tanpaResep.push(x); return; }
    uraiResep(x.n, x.qty, peta, keluar);
  });
  const putar = !!keluar.__putar; delete keluar.__putar;
  const hilang = keluar.__hilang || null; delete keluar.__hilang;

  const daftar = Object.keys(keluar).sort((a, b) => keluar[b] - keluar[a]);
  let h = '<div class="card"><h3>Perkiraan Bahan Baku Keluar</h3>'
    + '<div class="card-sub">Jumlah menu terjual dikalikan resepnya di modul HPP. Inilah yang '
    + '<b>seharusnya</b> keluar dari gudang — bandingkan dengan stok fisik untuk melihat '
    + 'selisihnya.</div>';

  /* Menu yang namanya tidak ada di resep DILAPORKAN PALING ATAS dan disebut
     berapa nilainya. Tanpa itu, perkiraan bahan baku terlihat lengkap padahal
     separuh menunya tidak pernah ikut dihitung — dan selisih di lapangan akan
     dikira kehilangan barang. */
  if (tanpaResep.length) {
    const nilai = tanpaResep.reduce((a, x) => a + x.nilai, 0);
    const totNilai = urut.reduce((a, x) => a + x.nilai, 0);
    h += '<div class="notice warn">⚠ <div><b>' + tanpaResep.length + ' menu belum punya resep di HPP</b> '
      + '(' + pct(nilai, totNilai) + '% dari nilai penjualan menu). Bahan bakunya TIDAK ikut dihitung '
      + 'di bawah, jadi angkanya lebih kecil daripada yang sebenarnya keluar.'
      + '<div style="margin-top:6px">' + tanpaResep.slice(0, 12).map(x =>
          '<span class="chip" style="background:var(--warn-bg);color:var(--warn);margin:2px 4px 2px 0">'
          + esc(x.n) + '</span>').join('')
      + (tanpaResep.length > 12 ? '<span class="helper" style="margin:0"> +' + (tanpaResep.length - 12) + ' lagi</span>' : '')
      + '</div>'
      + '<div style="margin-top:6px">Nama menu di POS dan nama resep di HPP harus <b>sama persis</b>. '
      + 'Kalau ejaannya beda, betulkan salah satunya — atau petakan di <b>Pengaturan</b>.</div>'
      + '</div></div>';
  }
  if (hilang) {
    h += '<div class="notice warn">⚠ <div><b>Ada baris resep yang bahannya tidak terdaftar</b> di HPP: '
      + Object.keys(hilang).slice(0, 8).map(esc).join(', ') + '. Baris itu dilewati.</div></div>';
  }
  if (putar) {
    h += '<div class="notice bad">⚠ <div><b>Ada resep yang menunjuk dirinya sendiri</b> (langsung atau '
      + 'lewat base lain). Penguraiannya dihentikan di kedalaman 6, jadi sebagian bahan tidak terhitung. '
      + 'Perlu dibetulkan di modul HPP.</div></div>';
  }

  if (!daftar.length) return h + '<div class="empty">Belum ada bahan yang bisa dihitung.</div></div>';

  const bulat = q => q >= 100 ? Math.round(q).toLocaleString('id-ID')
                   : (Math.round(q * 100) / 100).toLocaleString('id-ID');
  h += '<div class="tbl-wrap"><table><thead><tr><th>#</th><th>Bahan</th>'
    + '<th class="num">Perkiraan keluar</th></tr></thead><tbody>'
    + daftar.slice(0, 200).map((k, i) => '<tr><td>' + (i + 1) + '</td><td>' + esc(k) + '</td>'
        + '<td class="num mono">' + bulat(keluar[k]) + '</td></tr>').join('')
    + '</tbody></table></div>'
    + (daftar.length > 200 ? '<div class="helper">200 teratas dari ' + daftar.length + ' bahan.</div>' : '')
    + '<div class="helper">Satuannya mengikuti satuan yang ditulis di baris resep HPP — '
    + 'bukan satuan beli. Bahan yang dibeli per Kg tapi ditakar per Gram akan muncul dalam Gram.</div>'
    + '</div>';
  return h;
}

/* ============ HALAMAN: PENGARUH EVENT ============
   Pertanyaannya "apakah event berpengaruh ke omset". Yang bisa dijawab jujur
   dari data ini cuma: hari berevent rata-rata sekian, hari biasa sekian.

   YANG TIDAK DILAKUKAN, DAN SENGAJA: menyebut angkanya sebagai bukti bahwa
   event MENYEBABKAN kenaikan. Event hampir selalu ditaruh di akhir pekan, dan
   akhir pekan memang lebih ramai tanpa event apa pun — jadi perbandingan
   mentah akan memuji event untuk sesuatu yang sudah terjadi dengan
   sendirinya. Karena itu halaman ini SELALU menampilkan pembandingnya per
   hari juga, dan menyebutkan jumlah harinya. Angka dari tiga hari bukan
   bukti, dan itu ditulis di layar. */
/* ============ HALAMAN: PENGARUH EVENT & PENGARUH MARKETING ============
   DUA HALAMAN, satu penggambar (2 September 2026, permintaan user). Sebelumnya
   satu halaman yang mencampur acara dari modul Event dan modul Marketing —
   dua hal yang direncanakan tim berbeda dan dinilai dengan pertanyaan berbeda.
   Dicampur, tidak satu pun pertanyaan tentang salah satunya bisa dijawab tanpa
   memilah dengan mata.

   Dipisah sebagai PARAMETER, bukan disalin jadi dua fungsi: kalau disalin, satu
   perbaikan rumus akan berlaku di satu halaman saja, dan dua halaman yang
   menghitung "pengaruh" dengan cara berbeda lebih buruk daripada satu halaman
   yang tercampur. */
let KAT_PILIH = { Event:'', Marketing:'' };
function katPilih(sumber, k) { KAT_PILIH[sumber] = k; render(); }
function vEvent()     { vDampak('Event'); }
function vMarketing() { vDampak('Marketing'); }

function vDampak(sumber) {
  const V = document.getElementById('app-view');
  const b = blnAktif(), d = lap(b);
  let h = pilihBulan();
  if (!d) { V.innerHTML = h + kosongBelumAda(); return; }

  const hari = d.hari || {};
  const tgl = Object.keys(hari).sort();
  /* Total omset SEBULAN dari laporan POS. Inilah penyebut "kontribusi berapa
     persen" — bukan total setahun, dan bukan total hari berevent saja. */
  const totalBulan = tgl.reduce((a, t) => a + (hari[t].grand || 0), 0);

  if (EV_ERR.indexOf(sumber) >= 0) h += '<div class="notice warn">⚠ <div><b>Modul ' + esc(sumber)
    + ' tidak menjawab.</b> Daftar acara di bawah belum lengkap, jadi perbandingannya '
    + 'belum bisa dipercaya.</div></div>';

  const semua = EV.filter(e => e.sumber === sumber && blnDari(e.tgl) === b);
  /* Kategori yang benar-benar ADA di bulan ini, bukan daftar tertutup: kategori
     baru di modul Event tidak perlu didaftarkan lagi di sini. */
  const katSet = [...new Set(semua.map(e => e.kategori))].sort();
  const kat = (KAT_PILIH[sumber] && katSet.indexOf(KAT_PILIH[sumber]) >= 0) ? KAT_PILIH[sumber] : '';
  const dipakai = kat ? semua.filter(e => e.kategori === kat) : semua;

  /* Peta tanggal -> daftar acara. Satu hari bisa punya beberapa acara; yang
     dihitung tetap SATU hari, kalau tidak hari dengan tiga acara dihitung tiga
     kali dan rata-ratanya condong ke hari itu saja. */
  const peta = {};
  dipakai.forEach(e => { (peta[e.tgl] = peta[e.tgl] || []).push(e); });

  const adaEv = tgl.filter(t => peta[t]);
  const tanpa = tgl.filter(t => !peta[t]);
  const rata = arr => arr.length ? arr.reduce((a, t) => a + (hari[t].grand || 0), 0) / arr.length : 0;
  const rEv = rata(adaEv), rNo = rata(tanpa);
  const beda = rNo ? (rEv - rNo) / rNo * 100 : 0;
  const omsetEv = adaEv.reduce((a, t) => a + (hari[t].grand || 0), 0);

  /* Tapis kategori. Angkanya dihitung dari SELURUH acara bulan itu, bukan dari
     yang sedang tersaring — kalau ikut, tombol yang tidak dipilih selalu
     menulis nol, dan nol membaca sebagai "tidak ada acara kategori itu". */
  if (katSet.length) {
    const jml = k => {
      const hr = new Set(semua.filter(e => !k || e.kategori === k).map(e => e.tgl).filter(t => hari[t]));
      return hr.size;
    };
    h += '<div class="card" style="padding:14px 18px;margin-bottom:16px">'
      + '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'
      + '<b style="font-size:13px">Kategori</b>'
      /* Angkanya diredupkan lewat OPACITY, bukan .helper: chip yang terpilih
         berlatar emas dengan tulisan putih, dan .helper memakai warna abu tetap
         yang di atasnya hampir tidak terbaca. */
      + '<span class="qa-chip' + (kat ? '' : ' on') + '" onclick="katPilih(\'' + sumber + '\',\'\')">'
        + 'Semua <span style="opacity:.7">' + jml('') + ' hari</span></span>'
      + katSet.map(k => '<span class="qa-chip' + (kat === k ? ' on' : '') + '" data-k="' + esc(k) + '"'
          + ' onclick="katPilih(\'' + sumber + '\', this.dataset.k)">' + esc(k)
          + ' <span style="opacity:.7">' + jml(k) + ' hari</span></span>').join('')
      + '</div></div>';
  }

  h += '<div class="grid g4" style="margin-bottom:18px">'
    + kartu('Hari ada acara', adaEv.length, 'dari ' + tgl.length + ' hari' + (kat ? ' · ' + esc(kat) : ''))
    + kartu('Omset hari itu', rp0(omsetEv),
            (totalBulan ? (omsetEv / totalBulan * 100).toFixed(1) + '% dari omset bulan ini' : 'belum ada omset'))
    + kartu('Rata-rata hari ada acara', rp0(rEv), adaEv.length ? adaEv.length + ' hari' : 'belum ada')
    + kartu('Rata-rata hari biasa', rp0(rNo), tanpa.length + ' hari')
    + '</div>';

  if (!adaEv.length) {
    h += '<div class="notice info">ℹ <div>Tidak ada acara ' + esc(sumber)
      + (kat ? ' berkategori <b>' + esc(kat) + '</b>' : '')
      + ' yang tanggalnya punya data POS untuk ' + esc(fmtBln(b)) + ', jadi belum ada yang bisa dibandingkan.</div></div>';
    V.innerHTML = h; return;
  }

  h += '<div class="card"><h3>Selisihnya</h3>'
    + '<div class="grid g2">'
    + kartu('Beda rata-rata', (beda >= 0 ? '+' : '') + beda.toFixed(0) + '%', rp0(rEv - rNo) + ' per hari')
    + kartu('Cukup untuk disimpulkan?', (adaEv.length >= 6 && tanpa.length >= 6) ? 'Mungkin' : 'Belum',
            adaEv.length + ' hari ada acara vs ' + tanpa.length + ' hari biasa')
    + '</div>'
    /* Peringatan ini TIDAK boleh dihapus supaya halamannya terlihat lebih
       tegas. Acara ditaruh di akhir pekan, dan akhir pekan memang lebih ramai
       tanpa acara apa pun — angka mentah di atas akan memuji acara untuk
       sesuatu yang sudah terjadi dengan sendirinya. */
    + '<div class="notice warn" style="margin-top:12px">⚠ <div><b>Angka di atas bukan bukti sebab-akibat.</b> '
    + 'Acara hampir selalu ditaruh di akhir pekan, dan akhir pekan memang lebih ramai tanpa acara apa pun. '
    + 'Pembanding yang lebih adil ada di tabel bawah: tiap hari dibandingkan dengan '
    + 'rata-rata hari yang SAMA di bulan ini.</div></div>'
    + '</div>';

  /* Pembanding per hari yang sama — inilah yang membuat angkanya berarti. */
  const dowRata = Array.from({ length: 7 }, () => ({ n:0, g:0 }));
  tanpa.forEach(t => { const k = dowRata[dowDari(t)]; k.n++; k.g += hari[t].grand || 0; });
  const pembandingDow = t => { const k = dowRata[dowDari(t)]; return k.n ? k.g / k.n : 0; };

  /* ---- PER KATEGORI (permintaan user) ----
     Dua angka yang diminta: omset yang didapat, dan berapa persen kontribusinya
     terhadap total omset bulan itu. Ditambah uplift terhadap hari yang sama
     tanpa acara, karena tanpa itu kategori yang kebetulan jatuh di Sabtu akan
     selalu terlihat paling hebat. */
  if (katSet.length > 1 && !kat) {
    const perKat = katSet.map(k => {
      const hr = [...new Set(semua.filter(e => e.kategori === k).map(e => e.tgl))].filter(t => hari[t]);
      const om = hr.reduce((a, t) => a + (hari[t].grand || 0), 0);
      const pemb = hr.reduce((a, t) => a + pembandingDow(t), 0);
      return { k, acara: semua.filter(e => e.kategori === k).length, hr, om,
               naik: pemb ? (om - pemb) / pemb * 100 : null };
    }).sort((x, y) => y.om - x.om);

    /* Satu hari bisa punya acara dari DUA kategori, dan hari itu ikut dihitung
       di keduanya. Jumlah kolom Omset karena itu bisa lebih besar daripada
       "Omset hari itu" di kartu atas — dan angka yang tidak bisa dijumlahkan
       harus MENGATAKAN kenapa, bukan dibiarkan membingungkan. */
    const jumlahHariKat = perKat.reduce((a, x) => a + x.hr.length, 0);
    const tumpang = jumlahHariKat - adaEv.length;

    h += '<div class="card"><h3>Per Kategori</h3>'
      + '<div class="card-sub">Omset yang masuk pada hari-hari berkategori itu, dan berapa persennya '
      + 'dari <b>seluruh omset ' + esc(fmtBln(b)) + '</b> (' + rp0(totalBulan) + ').</div>'
      + '<div class="tbl-wrap"><table><thead><tr><th>Kategori</th><th class="num">Acara</th>'
      + '<th class="num">Hari</th><th class="num">Omset hari itu</th><th class="num">Kontribusi</th>'
      + '<th class="num">Rata-rata/hari</th><th class="num">vs hari sama</th></tr></thead><tbody>'
      + perKat.map(x => '<tr><td><b>' + esc(x.k) + '</b></td>'
          + '<td class="num">' + x.acara + '</td>'
          + '<td class="num">' + x.hr.length + '</td>'
          + '<td class="num mono">' + rp0(x.om) + '</td>'
          + '<td class="num mono">' + (totalBulan ? (x.om / totalBulan * 100).toFixed(1) + '%' : '—') + '</td>'
          + '<td class="num mono">' + rp0(x.hr.length ? x.om / x.hr.length : 0) + '</td>'
          + '<td class="num mono" style="color:' + (x.naik === null ? 'var(--muted-2)' : x.naik >= 0 ? 'var(--ok)' : 'var(--danger)') + '">'
            + (x.naik === null ? 'tidak ada pembanding' : (x.naik >= 0 ? '+' : '') + x.naik.toFixed(0) + '%') + '</td>'
          + '</tr>').join('')
      + '</tbody></table></div>'
      + (tumpang > 0
          ? '<div class="notice info" style="margin-top:12px">ℹ <div><b>Kolom Omset tidak bisa dijumlahkan.</b> '
            + tumpang + ' hari punya acara dari lebih dari satu kategori, dan hari itu ikut dihitung di '
            + 'tiap kategorinya. Yang tidak berganda ada di kartu <b>Omset hari itu</b> di atas: '
            + rp0(omsetEv) + '.</div></div>'
          : '')
      + '<div class="helper">Tekan sebuah kategori di atas halaman untuk melihat hanya kategori itu.</div>'
      + '</div>';
  }

  h += '<div class="card"><h3>Hari Ada Acara, Satu per Satu</h3>'
    + '<div class="card-sub">Tiap hari dibandingkan dengan rata-rata hari yang sama '
    + '<b>tanpa acara</b> di bulan ini. Sabtu berevent dibandingkan dengan Sabtu biasa, bukan '
    + 'dengan rata-rata seluruh hari.</div>'
    + '<div class="tbl-wrap"><table><thead><tr><th>Tanggal</th><th>Hari</th><th>Acara</th>'
    + '<th class="num">Omset</th><th class="num">Kontribusi</th>'
    + '<th class="num">Rata-rata hari sama</th><th class="num">Selisih</th>'
    + '</tr></thead><tbody>'
    + adaEv.map(t => {
        const dw = dowDari(t), k = dowRata[dw];
        const pemb = k.n ? k.g / k.n : 0;
        const g = hari[t].grand || 0;
        const s = pemb ? (g - pemb) / pemb * 100 : 0;
        return '<tr><td class="mono">' + esc(fmtTgl(t)) + '</td>'
          + '<td>' + NAMA_HARI[dw] + '</td>'
          + '<td>' + peta[t].map(e => esc(e.judul)
              + ' <span class="helper" style="margin:0">' + esc(e.kategori) + '</span>').join('<br>') + '</td>'
          + '<td class="num mono">' + rp0(g) + '</td>'
          + '<td class="num mono">' + (totalBulan ? (g / totalBulan * 100).toFixed(1) + '%' : '—') + '</td>'
          + '<td class="num mono">' + (k.n ? rp0(pemb) : '<span style="color:var(--muted-2)">tidak ada pembanding</span>') + '</td>'
          + '<td class="num mono" style="color:' + (s >= 0 ? 'var(--ok)' : 'var(--danger)') + '">'
            + (k.n ? (s >= 0 ? '+' : '') + s.toFixed(0) + '%' : '—') + '</td>'
          + '</tr>';
      }).join('')
    + '</tbody></table></div>'
    /* Hari yang seluruh pembandingnya juga berevent tidak punya dasar
       pembanding sama sekali — itu dikatakan, bukan diisi nol. Nol terbaca
       sebagai "tidak berpengaruh". */
    + '<div class="helper">Kolom <b>Kontribusi</b> = omset hari itu dibagi seluruh omset '
    + esc(fmtBln(b)) + '. Hari yang seluruh pembandingnya juga ada acara ditulis '
    + '"tidak ada pembanding" — bukan nol, karena nol terbaca sebagai tidak berpengaruh.</div>'
    + '</div>';

  V.innerHTML = h;
}

/* ============ HALAMAN: TREN BULANAN ============
   Seluruh halaman lain menjawab "bulan ini bagaimana". Yang tidak pernah bisa
   dijawab dari mana pun: "dibanding bulan lalu bagaimana" — dan itu justru
   pertanyaan pertama tiap kali laporan baru diunggah (permintaan user).

   Grafiknya memakai Chart.js yang MEMANG SUDAH DIMUAT modul ini sejak awal
   tapi belum pernah dipakai satu kali pun. CDN-nya bisa mati, jadi ketiadaan
   `Chart` DIKATAKAN dan tabelnya tetap digambar — angka yang hilang gara-gara
   satu berkas dari luar tidak bisa dibedakan dari angka yang memang nol. */
let TREN_A = '', TREN_B = '';
function trenPilih(sisi, v) { if (sisi === 'a') TREN_A = v; else TREN_B = v; render(); }

function trenBaris() {
  return blnAda().slice().sort().map(b => {
    const d = lap(b) || {}, r = d.ringkas || {};
    const nHari = Object.keys(d.hari || {}).length;
    return { b, jenis:d.jenis || 'bill', grand:r.grand || 0, bill:r.bill || 0, hari:nHari,
             perBill: r.bill ? (r.grand || 0) / r.bill : 0,
             perHari: nHari ? (r.grand || 0) / nHari : 0 };
  });
}

function vTren() {
  const V = document.getElementById('app-view');
  const semua = trenBaris();
  if (!semua.length) { V.innerHTML = kosongBelumAda(); return; }

  /* Menu Report tidak punya Grand Total per bill — ia dipisah, bukan digambar
     sebagai bulan beromset nol. Batang nol di tengah grafik terbaca sebagai
     bulan yang sepi, bukan sebagai bulan yang laporannya berbeda jenis. */
  const pakai = semua.filter(x => x.grand > 0);
  const kosong = semua.filter(x => !(x.grand > 0));

  if (semua.length === 1) {
    V.innerHTML = '<div class="notice info">ℹ <div><b>Baru satu bulan yang diunggah ('
      + esc(fmtBln(semua[0].b)) + ').</b> Tren bulan ke bulan baru bisa digambar mulai bulan kedua — '
      + 'unggah laporan bulan lain lewat <b>Unggah Laporan</b>.</div></div>';
    return;
  }

  const totalSemua = pakai.reduce((a, x) => a + x.grand, 0);
  const terbaik = pakai.slice().sort((x, y) => y.grand - x.grand)[0];
  const akhir = pakai[pakai.length - 1], sebelum = pakai[pakai.length - 2];
  const tumbuh = (sebelum && sebelum.grand) ? (akhir.grand - sebelum.grand) / sebelum.grand * 100 : null;

  let h = '<div class="grid g4" style="margin-bottom:18px">'
    + kartu('Bulan terunggah', semua.length, pakai.length + ' punya omset')
    + kartu('Rata-rata per bulan', rp0(pakai.length ? totalSemua / pakai.length : 0),
            'dari ' + pakai.length + ' bulan')
    + kartu('Bulan tertinggi', terbaik ? rp0(terbaik.grand) : '—', terbaik ? fmtBln(terbaik.b) : 'belum ada')
    + kartu('Bulan terakhir vs sebelumnya',
            tumbuh === null ? '—' : (tumbuh >= 0 ? '+' : '') + tumbuh.toFixed(1) + '%',
            sebelum ? fmtBln(akhir.b) + ' vs ' + fmtBln(sebelum.b) : 'belum ada pembanding')
    + '</div>';

  h += '<div class="card"><h3>Total Omset Bulan ke Bulan</h3>'
    + '<div class="card-sub">Grand Total dari berkas POS tiap bulan. Garisnya rata-rata per hari — '
    + 'bulan yang harinya lebih sedikit (bulan berjalan, atau berkas yang tidak sebulan penuh) '
    + 'akan terlihat rendah di batangnya padahal tidak di garisnya.</div>'
    + '<div style="position:relative;height:300px"><canvas id="trenChart"></canvas></div>'
    + (typeof Chart !== 'function'
        ? '<div class="notice warn" style="margin-top:12px">⚠ <div><b>Grafik tidak bisa digambar.</b> '
          + 'Pustaka Chart.js gagal dimuat dari CDN — periksa koneksi. Tabel di bawah tetap benar.</div></div>'
        : '')
    + '</div>';

  h += '<div class="card"><h3>Perbandingan Bulan ke Bulan</h3>'
    + '<div class="tbl-wrap"><table><thead><tr><th>Bulan</th><th class="num">Grand Total</th>'
    + '<th class="num">Δ bulan sebelumnya</th><th class="num">Bill</th><th class="num">Hari</th>'
    + '<th class="num">Rata-rata/bill</th><th class="num">Rata-rata/hari</th></tr></thead><tbody>'
    + semua.slice().reverse().map((x, i, arr) => {
        const sb = arr[i + 1];
        const dlt = (sb && sb.grand) ? (x.grand - sb.grand) / sb.grand * 100 : null;
        return '<tr><td><b>' + esc(fmtBln(x.b)) + '</b>'
          + (x.jenis === 'menu' ? ' <span class="helper" style="margin:0">Menu Report</span>' : '') + '</td>'
          + '<td class="num mono">' + rp0(x.grand) + '</td>'
          + '<td class="num mono" style="color:' + (dlt === null ? 'var(--muted-2)' : dlt >= 0 ? 'var(--ok)' : 'var(--danger)') + '">'
            + (dlt === null ? '—' : (dlt >= 0 ? '+' : '') + dlt.toFixed(1) + '%') + '</td>'
          + '<td class="num mono">' + (x.bill || 0).toLocaleString('id-ID') + '</td>'
          + '<td class="num">' + x.hari + '</td>'
          + '<td class="num mono">' + rp0(x.perBill) + '</td>'
          + '<td class="num mono">' + rp0(x.perHari) + '</td></tr>';
      }).join('')
    + '</tbody></table></div>'
    + (kosong.length
        ? '<div class="helper">' + kosong.length + ' bulan tidak punya Grand Total ('
          + esc(kosong.map(x => fmtBln(x.b)).join(', ')) + ') — laporannya Menu Report, '
          + 'yang memang tidak memuat nilai per bill. Bulan itu tidak ikut di grafik.</div>'
        : '')
    + '</div>';

  /* ---- BANDINGKAN DUA BULAN ----
     Tabel di atas cuma membandingkan dengan bulan TEPAT sebelumnya. Pertanyaan
     yang sering datang justru "Agustus vs Agustus tahun lalu", dan itu tidak
     terjawab oleh selisih berurutan. */
  const opsi = semua.map(x => x.b);
  const A = opsi.indexOf(TREN_A) >= 0 ? TREN_A : opsi[opsi.length - 1];
  const B = opsi.indexOf(TREN_B) >= 0 ? TREN_B : opsi[opsi.length - 2];
  const ra = semua.find(x => x.b === A), rb = semua.find(x => x.b === B);
  const sel = (x, y) => (y ? (x - y) / y * 100 : null);
  const barisBanding = [
    ['Grand Total', ra.grand, rb.grand, 1],
    ['Jumlah bill', ra.bill, rb.bill, 0],
    ['Hari ada transaksi', ra.hari, rb.hari, 0],
    ['Rata-rata per bill', ra.perBill, rb.perBill, 1],
    ['Rata-rata per hari', ra.perHari, rb.perHari, 1]
  ];
  h += '<div class="card"><h3>Bandingkan Dua Bulan</h3>'
    + '<div class="card-sub">Tabel di atas membandingkan dengan bulan tepat sebelumnya. '
    + 'Yang ini bebas — mis. bulan yang sama tahun lalu.</div>'
    + '<div class="grid g2" style="margin-bottom:14px">'
    + '<div class="field"><label>Bulan A</label><select onchange="trenPilih(\'a\', this.value)">'
      + opsi.map(x => '<option value="' + esc(x) + '"' + (x === A ? ' selected' : '') + '>' + esc(fmtBln(x)) + '</option>').join('')
      + '</select></div>'
    + '<div class="field"><label>Bulan B (pembanding)</label><select onchange="trenPilih(\'b\', this.value)">'
      + opsi.map(x => '<option value="' + esc(x) + '"' + (x === B ? ' selected' : '') + '>' + esc(fmtBln(x)) + '</option>').join('')
      + '</select></div>'
    + '</div>'
    + (A === B
        ? '<div class="notice info">ℹ <div>Kedua kotaknya bulan yang sama, jadi selisihnya nol. Pilih bulan yang berbeda.</div></div>'
        : '<div class="tbl-wrap"><table><thead><tr><th></th><th class="num">' + esc(fmtBln(A)) + '</th>'
          + '<th class="num">' + esc(fmtBln(B)) + '</th><th class="num">Selisih</th><th class="num">%</th>'
          + '</tr></thead><tbody>'
          + barisBanding.map(x => {
              const s = sel(x[1], x[2]);
              const f = v => x[3] ? rp0(v) : Math.round(v).toLocaleString('id-ID');
              return '<tr><td>' + esc(x[0]) + '</td>'
                + '<td class="num mono">' + f(x[1]) + '</td>'
                + '<td class="num mono">' + f(x[2]) + '</td>'
                + '<td class="num mono">' + (x[1] - x[2] >= 0 ? '+' : '') + f(x[1] - x[2]) + '</td>'
                + '<td class="num mono" style="color:' + (s === null ? 'var(--muted-2)' : s >= 0 ? 'var(--ok)' : 'var(--danger)') + '">'
                  + (s === null ? '—' : (s >= 0 ? '+' : '') + s.toFixed(1) + '%') + '</td></tr>';
            }).join('')
          + '</tbody></table></div>')
    + '</div>';

  V.innerHTML = h;

  /* Chart dibuat SESUDAH innerHTML dipasang — canvas-nya belum ada sebelum itu,
     dan Chart.js gagal diam-diam kalau elemennya null. Instansnya dicatat di
     CHARTS supaya bersihkanChart() membuangnya saat halaman berganti; tanpa itu
     tiap perpindahan halaman meninggalkan satu chart hidup di memori. */
  if (typeof Chart === 'function' && pakai.length) {
    const cv = document.getElementById('trenChart');
    if (cv) CHARTS.push(new Chart(cv, {
      data: {
        labels: pakai.map(x => fmtBln(x.b)),
        datasets: [
          { type:'bar', label:'Grand Total', data: pakai.map(x => x.grand),
            backgroundColor:'rgba(169,121,31,.75)', borderRadius:6, yAxisID:'y' },
          { type:'line', label:'Rata-rata per hari', data: pakai.map(x => x.perHari),
            borderColor:'#5C574D', backgroundColor:'#5C574D', tension:.25, yAxisID:'y1' }
        ]
      },
      options: {
        responsive:true, maintainAspectRatio:false,
        interaction:{ mode:'index', intersect:false },
        plugins:{ legend:{ position:'bottom' },
          tooltip:{ callbacks:{ label: c => c.dataset.label + ': ' + rp0(c.parsed.y) } } },
        scales:{
          /* Dua sumbu: total sebulan dan rata-rata sehari berbeda dua orde
             besaran, dan digambar di satu sumbu garisnya akan rata menempel di
             dasar grafik — terbaca sebagai "rata-ratanya nol". */
          y:  { position:'left',  ticks:{ callback: v => fmtRpShort(v) } },
          y1: { position:'right', grid:{ drawOnChartArea:false }, ticks:{ callback: v => fmtRpShort(v) } }
        }
      }
    }));
  }
}

/* ---- mesin pengurai: baris mentah -> ringkasan bulan ----
   KOLOM DICARI MENURUT NAMANYA, bukan posisinya. POS mengubah urutan kolom
   antar versi tanpa memberi tahu siapa pun, dan pembaca yang menghitung kolom
   ke-41 akan diam-diam membaca Tax sebagai Grand Total — salah yang muncul
   sebagai uang, bukan sebagai galat. */
const KOL_CARI = {
  tgl   : ['sales date','sales in date','date','tanggal','trx date','transaction date'],
  jam   : ['sales in time','time','jam','transaction time','order time'],
  grand : ['grand total','total','total amount','nett amount'],
  net   : ['net sales','netsales','net amount'],
  sub   : ['subtotal','sub total','gross sales','amount'],
  dMenu : ['menu discount'],
  dBill : ['bill discount','discount'],
  dVouc : ['voucher discount'],
  svc   : ['service charge total','service charge','service'],
  tax   : ['tax total','tax','pb1','pb 1'],
  pax   : ['pax total','pax','guest','cover'],
  bill  : ['bill number','sales number','receipt number','no bill'],
  menu  : ['menu','menu name','product','product name','item','item name','nama menu'],
  qty   : ['qty','quantity','jumlah','qty sold','sold'],
  nilai : ['menu total','item total','total menu','sales amount','subtotal']
};
function petaKolomPos(kepala) {
  const p = {};
  Object.keys(kepala).forEach(k => {
    const nm = String(kepala[k] || '').trim().toLowerCase().replace(/\s+/g, ' ');
    if (nm && p[nm] === undefined) p[nm] = k;
  });
  const cari = jenis => { for (const nm of KOL_CARI[jenis]) if (p[nm]) return p[nm]; return null; };
  const out = {};
  Object.keys(KOL_CARI).forEach(j => { out[j] = cari(j); });
  return out;
}
/* Baris kepala = baris pertama yang punya minimal lima sel berisi teks.
   Berkas POS punya belasan baris judul & penyaring di atasnya, dan menganggap
   baris pertama sebagai kepala membuat SELURUH kolom tidak dikenali. */
function cariBarisKepala(baris) {
  for (let i = 0; i < Math.min(baris.length, 80); i++) {
    const v = Object.values(baris[i]);
    if (v.filter(x => x && isNaN(Number(x))).length >= 5) return i;
  }
  return -1;
}
const angka = v => { const n = parseFloat(String(v == null ? '' : v).replace(/[^0-9.\-]/g, '')); return isNaN(n) ? 0 : n; };

function ringkasPos(baris, namaBerkas) {
  const iH = cariBarisKepala(baris);
  if (iH < 0) throw new Error('Baris kepala kolom tidak ketemu. Pastikan berkasnya hasil ekspor POS, bukan berkas yang sudah disunting.');
  const K = petaKolomPos(baris[iH]);
  if (!K.tgl) throw new Error('Kolom tanggal tidak ketemu. Yang dicari: ' + KOL_CARI.tgl.join(', ') + '.');
  /* Laporan menu dikenali dari ADANYA kolom menu + qty. Bukan dari nama
     berkasnya: nama berkas diketik orang dan tidak pernah bisa dipercaya. */
  const jenis = (K.menu && K.qty) ? 'menu' : 'bill';
  if (jenis === 'bill' && !K.grand && !K.net)
    throw new Error('Kolom nilai tidak ketemu (Grand Total / Net Sales).');

  const hari = {}, jam = Array.from({ length: 24 }, () => ({ bill:0, grand:0 }));
  const menu = {}, perBln = {};
  const r = { bill:0, grand:0, net:0, sub:0, svc:0, tax:0,
              discMenu:0, discBill:0, discVoucher:0, pax:0, billPax:0 };
  let nLewat = 0;

  for (let i = iH + 1; i < baris.length; i++) {
    const b = baris[i];
    const t = isoDari(b[K.tgl]);
    if (!t) { if (Object.keys(b).length) nLewat++; continue; }
    perBln[blnDari(t)] = (perBln[blnDari(t)] || 0) + 1;

    const g = K.grand ? angka(b[K.grand]) : 0;
    const net = K.net ? angka(b[K.net]) : 0;
    if (!hari[t]) hari[t] = { bill:0, grand:0, net:0 };
    hari[t].bill++; hari[t].grand += g; hari[t].net += net;
    r.bill++; r.grand += g; r.net += net;
    if (K.sub) r.sub += angka(b[K.sub]);
    if (K.svc) r.svc += angka(b[K.svc]);
    if (K.tax) r.tax += angka(b[K.tax]);
    if (K.dMenu) r.discMenu += angka(b[K.dMenu]);
    if (K.dBill) r.discBill += angka(b[K.dBill]);
    if (K.dVouc) r.discVoucher += angka(b[K.dVouc]);
    if (K.pax) { const p = angka(b[K.pax]); if (p > 0) { r.pax += p; r.billPax++; } }

    const jm = parseInt(String(b[K.jam] || '').slice(0, 2), 10);
    if (jm >= 0 && jm < 24) { jam[jm].bill++; jam[jm].grand += g; }

    if (jenis === 'menu') {
      const nm = String(b[K.menu] || '').trim();
      if (nm) {
        const q = angka(b[K.qty]) || 0;
        const nl = K.nilai ? angka(b[K.nilai]) : g;
        if (!menu[nm]) menu[nm] = { qty:0, nilai:0 };
        menu[nm].qty += q; menu[nm].nilai += nl;
      }
    }
  }
  if (!r.bill) throw new Error('Tidak ada satu pun baris yang punya tanggal terbaca.');

  /* Bulan dengan baris terbanyak yang dipakai. Berkas yang menyeberang bulan
     TIDAK dibuang diam-diam — jumlahnya dilaporkan di pratinjau. */
  const blnUrut = Object.keys(perBln).sort((a, b) => perBln[b] - perBln[a]);
  const bulan = blnUrut[0];
  const blnLain = blnUrut.slice(1).map(b => ({ b, n:perBln[b] }));

  /* Hanya bulan terpilih yang disimpan — kalau tidak, omset bulan sebelahnya
     ikut terhitung di bulan ini tanpa ada yang menyadarinya. */
  Object.keys(hari).forEach(t => { if (blnDari(t) !== bulan) delete hari[t]; });
  const tglU = Object.keys(hari).sort();

  return { bulan, jenis, berkas:namaBerkas, hari, jam, menu, ringkas:r,
           nBaris:r.bill, nLewat, blnLain, tglAwal:tglU[0] || '', tglAkhir:tglU[tglU.length - 1] || '' };
}

async function anPilihBerkas(el) {
  const f = el && el.files && el.files[0];
  if (!f) return;
  const st = document.getElementById('an_status');
  const lapor = (kelas, teks) => { if (st) { st.className = 'helper'; st.innerHTML = teks; } setSync(kelas, teks); };
  lapor('saving', 'Membaca ' + esc(f.name) + '…');
  try {
    let baris;
    if (/\.csv$/i.test(f.name)) {
      baris = uraiCsvBaris(await f.text());
    } else {
      if (!bisaXlsx()) throw new Error('Peramban ini belum bisa membuka .xlsx. Ekspor sebagai CSV.');
      const zip = await bacaZip(await f.arrayBuffer());
      /* Nama lembarnya tidak selalu sheet1.xml. Yang dipakai lembar PERTAMA
         yang ada — berkas dengan dua lembar akan memakai lembar pertama, dan
         itu memang lembar laporannya di seluruh ekspor POS yang dilihat. */
      const lembar = zip.daftar.filter(x => /^xl\/worksheets\/.*\.xml$/i.test(x)).sort();
      if (!lembar.length) throw new Error('Tidak ada lembar kerja di dalam berkasnya.');
      const ss = uraiSharedStrings(await zip.ambil('xl/sharedStrings.xml'));
      baris = uraiSheet(await zip.ambil(lembar[0]), ss);
    }
    UNGGAH_HASIL = ringkasPos(baris, f.name);
    UNGGAH_HASIL.diunggah = todayISO();
    UNGGAH_HASIL.oleh = (CURRENT_USER && CURRENT_USER.name) || '';
    setSync('ok', '✓ Terbaca');
    render();
  } catch (e) {
    UNGGAH_HASIL = null;
    lapor('err', '⚠ ' + esc(e.message || e));
    alert('Berkasnya tidak bisa dibaca.\n\n' + (e.message || e));
  }
}
function anBatalUnggah() { UNGGAH_HASIL = null; render(); }
async function anSimpanUnggah() {
  if (!bolehAksi('unggah') || !UNGGAH_HASIL) return;
  const u = UNGGAH_HASIL;
  const lama = AN.data.laporan[u.bulan];
  if (lama && !confirm('Ringkasan ' + fmtBln(u.bulan) + ' sudah ada dan akan DITIMPA.\n\n'
      + 'Yang sekarang: ' + (lama.ringkas || {}).bill + ' bill.\n'
      + 'Yang baru   : ' + u.ringkas.bill + ' bill.\n\nLanjut?')) return;
  const sebelum = AN.data.laporan[u.bulan];
  AN.data.laporan[u.bulan] = {
    diunggah: u.diunggah, oleh: u.oleh, berkas: u.berkas, jenis: u.jenis,
    hari: u.hari, jam: u.jam, menu: u.menu, ringkas: u.ringkas
  };
  if (await simpan()) {
    UNGGAH_HASIL = null; BLN = u.bulan;
    toast('Ringkasan ' + fmtBln(u.bulan) + ' tersimpan.');
    go('ringkasan');
  } else {
    /* Gagal simpan mengembalikan keadaan. Ringkasan yang tertinggal di layar
       padahal server tidak menerimanya akan dibaca sebagai sudah tersimpan. */
    if (sebelum) AN.data.laporan[u.bulan] = sebelum; else delete AN.data.laporan[u.bulan];
    render();
  }
}
async function anHapus(b) {
  if (!bolehAksi('unggah')) return;
  if (!confirm('Hapus ringkasan ' + fmtBln(b) + '?\n\nBerkas aslinya tidak ikut terhapus — '
      + 'bisa diunggah lagi kapan saja.')) return;
  const sebelum = AN.data.laporan[b];
  delete AN.data.laporan[b];
  if (await simpan()) { if (BLN === b) BLN = null; toast('Dihapus.'); render(); }
  else { AN.data.laporan[b] = sebelum; render(); }
}
function go(view) {
  if (!TITLES[view] || !bolehLihat(view)) { const p = halPertamaBoleh(); if (!p) { CURRENT = ''; render(); return; } view = p; }
  /* Hasil urai yang belum disimpan lenyap begitu halaman berganti. Ditanya
     dulu — mengurai ulang berkas 9 MB bukan bencana, tapi juga bukan sesuatu
     yang perlu terjadi karena satu klik yang tidak disengaja. */
  if (view !== CURRENT && UNGGAH_HASIL && CURRENT === 'unggah' &&
      !confirm('Hasil urai berkas belum disimpan dan akan hilang. Lanjut?')) return;
  if (view !== CURRENT) UNGGAH_HASIL = null;
  CURRENT = view;
  if (location.hash !== '#/' + view) location.hash = '#/' + view;
  render();
}
function bersihkanChart() { CHARTS.forEach(c => { try { c.destroy(); } catch (e) {} }); CHARTS = []; }
function render() {
  bersihkanChart();
  document.querySelectorAll('.nav a').forEach(a => a.classList.toggle('active', a.dataset.view === CURRENT));
  const t = TITLES[CURRENT];
  document.getElementById('pageTitle').textContent = t ? t[0] : 'Analytics';
  document.getElementById('pageSub').textContent   = t ? t[1] : '';
  const V = document.getElementById('app-view');
  if (!CURRENT) {
    V.innerHTML = '<div class="card"><div class="empty"><div class="big">🔒</div>' +
      '<b>Belum ada halaman yang boleh kamu buka.</b><div style="margin-top:8px">' +
      'Akun kamu punya kunci modul Analytics, tapi seluruh halamannya disembunyikan untuk role ' +
      '<b>' + esc(ROLE_LABEL[peranSaya()]) + '</b>. Minta admin modul membukanya di Kelola Akses.</div></div></div>';
    return;
  }
  /* Halaman tidak pernah digambar sebelum datanya ada. Boot memang berhenti
     kalau analyticsGet gagal, tapi go() juga bisa dipanggil dari hashchange —
     dan halaman yang melempar TypeError meninggalkan layar kosong tanpa satu
     pun keterangan, padahal sebabnya sudah diketahui. */
  if (!AN) {
    V.innerHTML = '<div class="notice bad">⚠ <div><b>Data Analytics belum terbaca.</b> '
      + esc(KP_ERR || 'Backend Kompas tidak menjawab.') + ' Muat ulang halaman (Ctrl+F5).</div></div>';
    return;
  }
  ({ ringkasan:vRingkasan, tren:vTren, hari:vHari, menu:vMenu,
     event:vEvent, marketing:vMarketing, unggah:vUnggah,
     pengaturan:vPengaturan, akses:vAkses }[CURRENT] || vRingkasan)();
  terapkanKunci();
}

async function simpanShift() {
  if (!bolehAksi('pengaturan')) return;
  const g = id => parseInt((document.getElementById(id) || {}).value, 10);
  const s = { s1a:g('s1a'), s1b:g('s1b'), s2a:g('s2a'), s2b:g('s2b') };
  for (const k in s) if (isNaN(s[k]) || s[k] < 0 || s[k] > 24) { alert('Jam harus 0–24.'); return; }
  const sebelum = AN.data.setting.shift;
  AN.data.setting.shift = s;
  if (await simpan()) { toast('Batas jam tersimpan.'); render(); }
  else { AN.data.setting.shift = sebelum; render(); }
}
async function petaTambah() {
  if (!bolehAksi('pengaturan')) return;
  const g = id => ((document.getElementById(id) || {}).value || '').trim();
  const pos = g('pm_pos'), hpp = g('pm_hpp');
  if (!pos || !hpp) { alert('Kedua nama wajib diisi.'); return; }
  if (!AN.data.setting.petaMenu) AN.data.setting.petaMenu = {};
  const sebelum = AN.data.setting.petaMenu[pos];
  AN.data.setting.petaMenu[pos] = hpp;
  if (await simpan()) { toast('Dipetakan.'); render(); }
  else { if (sebelum === undefined) delete AN.data.setting.petaMenu[pos];
         else AN.data.setting.petaMenu[pos] = sebelum; render(); }
}
async function petaHapus(k) {
  if (!bolehAksi('pengaturan')) return;
  const peta = AN.data.setting.petaMenu || {};
  const sebelum = peta[k];
  delete peta[k];
  if (await simpan()) { toast('Dihapus.'); render(); }
  else { peta[k] = sebelum; render(); }
}

/* ============ HALAMAN: KELOLA AKSES ============ */
let ROSTER = [];
async function muatRoster() {
  try {
    const r = await postJson('../account-api-mysql/api.php', { action:'listModuleRoster', module:'analytics' });
    ROSTER = (r && r.ok && Array.isArray(r.members)) ? r.members : [];
  } catch (e) { ROSTER = []; }
}
function vAkses() {
  const V = document.getElementById('app-view');
  const bisa = bolehUbah('akses') && sayaAdmin();
  let h = '';
  if (!sayaAdmin()) h += '<div class="notice info">ℹ <div>Matriks di bawah cuma bisa diubah <b>admin modul</b>. '
    + 'Kamu tetap bisa melihatnya supaya tahu hak akses role kamu sendiri.</div></div>';

  h += '<div class="card"><h3>Hak Akses per Halaman</h3>'
    + '<div class="card-sub">Klik selnya untuk memutar None → Lihat → Ubah. Kolom <b>Admin Modul</b> selalu penuh dan tidak bisa diturunkan — '
    + 'kalau bisa, satu klik salah membuat modul ini tidak punya siapa pun yang bisa membetulkannya lagi.</div>'
    + '<div class="perm-legend">'
    + PERM_OPT.map((o, i) => '<div class="lg-item"><span class="lg-dot" style="background:' +
        ['var(--danger-bg)','var(--warn-bg)','var(--ok-bg)'][i] + ';border-color:' +
        ['var(--danger)','var(--warn)','var(--ok)'][i] + '"></span>' + o[1] + '</div>').join('')
    + '</div>'
    + '<div class="tbl-wrap"><table class="perm-matrix"><thead><tr><th>Halaman</th>'
    + ROLE_KEYS.map(r => '<th class="num">' + esc(ROLE_LABEL[r]) + '</th>').join('')
    + '<th class="num">' + esc(ROLE_LABEL.admin) + '</th></tr></thead><tbody>';
  Object.keys(TITLES).forEach(v => {
    h += '<tr><td><b>' + esc(TITLES[v][0]) + '</b>'
       + (AKS_HAL_ISI.indexOf(v) < 0 ? '<span class="helper">halaman informasi — "Ubah" tidak berlaku</span>' : '') + '</td>';
    ROLE_KEYS.forEach(r => { const t = aksTingkat(v, r);
      h += '<td class="num"><button class="perm-btn" data-v="' + t + '" data-hal="' + v + '" data-role="' + r + '"'
         + (bisa ? '' : ' disabled') + ' onclick="permKlik(this)">' + PERM_OPT[t][2] + '</button></td>'; });
    const ta = aksTingkat(v, 'admin');
    h += '<td class="num"><button class="perm-btn perm-lock" data-v="' + ta + '" disabled>' + PERM_OPT[ta][2] + '</button></td>';
    h += '</tr>';
  });
  h += '</tbody></table></div>'
    + (bisa ? '<div style="margin-top:14px" data-aks><button class="btn btn-primary" onclick="simpanAkses()">Simpan Matriks</button></div>' : '')
    + '</div>';

  h += '<div class="card"><h3>Role Tiap Kru</h3>'
    + '<div class="card-sub">Kru yang belum pernah ditentukan rolenya dihitung sebagai <b>' + esc(ROLE_LABEL[ROLE_BAWAAN]) + '</b>. '
    + ROLE_KEYS.map(r => '<b>' + esc(ROLE_LABEL[r]) + '</b>: ' + esc(ROLE_KET[r])).join(' ') + '</div>'
    + (ROSTER.length ? '<div class="tbl-wrap"><table><thead><tr><th>Nama</th><th>Tim</th><th>Role</th></tr></thead><tbody>'
      + ROSTER.map(u => { const k = aksKunci(u); const cur = peranUser(k);
          return '<tr><td><b>' + esc(u.name) + '</b>' + (u.isModuleAdmin ? ' <span class="chip">admin modul</span>' : '') + '</td>'
            + '<td>' + esc(u.keterangan || '—') + '</td>'
            + '<td>' + (u.isModuleAdmin
                ? '<span class="helper">Admin modul — selalu akses penuh</span>'
                : '<select ' + (bisa ? '' : 'disabled') + ' onchange="setPeran(\'' + k + '\',this.value)">'
                  + ROLE_KEYS.map(r => '<option value="' + r + '"' + (cur === r ? ' selected' : '') + '>' + esc(ROLE_LABEL[r]) + '</option>').join('')
                  + '</select>') + '</td></tr>'; }).join('')
      + '</tbody></table></div>'
      : '<div class="empty"><div class="big">◔</div>Belum ada kru yang diberi kunci modul <b>analytics</b> di Kelola Akses Office.</div>')
    + '</div>';
  V.innerHTML = h;
}
function permKlik(btn) {
  const t = (parseInt(btn.dataset.v, 10) + 1) % 3;
  btn.dataset.v = t; btn.textContent = PERM_OPT[t][2];
}
/* Yang dikirim ke server cuma SELISIH dari DEFAULT_PERMS. Menyimpan salinan
   penuh membekukan aturan hari ini, sehingga halaman yang lahir besok tidak
   pernah mendapat bawaannya di pemasangan yang sudah jalan. */
async function simpanAkses() {
  if (!bolehAksi('akses') || !sayaAdmin()) return;
  const peta = {};
  document.querySelectorAll('.perm-btn[data-hal]').forEach(b => {
    const v = parseInt(b.dataset.v, 10), hal = b.dataset.hal, role = b.dataset.role;
    if (v === aksBawaan(hal, role)) return;
    if (!peta[role]) peta[role] = {};
    peta[role][hal] = v;
  });
  setSync('saving', 'Menyimpan…');
  try {
    const r = await postJson(API_AN, { action:'analyticsAkses', peta });
    if (!r || !r.ok) throw new Error((r && r.error) || 'gagal');
    AN.akses = r.data.akses; setSync('ok', '✓ Tersimpan'); toast('Matriks tersimpan.');
    pasangMenu(); render();
  } catch (e) { setSync('err', '⚠ Gagal: ' + esc(e.message || e)); alert('Gagal menyimpan matriks.\n\n' + (e.message || e)); }
}
async function setPeran(kunci, peran) {
  if (!bolehAksi('akses') || !sayaAdmin()) return;
  setSync('saving', 'Menyimpan…');
  try {
    const r = await postJson(API_AN, { action:'analyticsPeran', kunci, peran });
    if (!r || !r.ok) throw new Error((r && r.error) || 'gagal');
    AN.peran = r.data.peran; setSync('ok', '✓ Tersimpan'); toast('Role tersimpan.');
    pasangMenu();
  } catch (e) { setSync('err', '⚠ Gagal: ' + esc(e.message || e)); alert('Gagal menyimpan role.\n\n' + (e.message || e)); }
}

/* ============ BOOT ============ */
document.querySelectorAll('.nav a').forEach(a => a.addEventListener('click', e => { e.preventDefault(); go(a.dataset.view); }));
/* Hasil urai yang belum disimpan hidup di peramban saja. Menutup tab berarti
   berkasnya harus diunggah dan diurai ulang — bukan bencana, tapi 9 MB dan
   satu langkah yang bisa dihindari dengan satu peringatan. */
window.addEventListener('beforeunload', e => {
  if (!UNGGAH_HASIL) return;
  e.preventDefault(); e.returnValue = '';
});
window.addEventListener('hashchange', () => { const v = (location.hash || '').replace('#/', ''); if (v && v !== CURRENT) go(v); });

(async function boot() {
  CURRENT_USER = bacaSesi();
  if (!CURRENT_USER) { location.replace('../'); return; }
  document.getElementById('suName').textContent = CURRENT_USER.name || '—';
  document.getElementById('suAvatar').textContent =
    String(CURRENT_USER.name || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(x => x[0]).join('').toUpperCase() || '?';
  try {
    await muatSemua();
  } catch (e) {
    setSync('err', '⚠ ' + esc(e.message || e));
    document.getElementById('app-view').innerHTML =
      '<div class="notice bad">⚠ <div><b>Data Analytics tidak terbaca.</b> ' + esc(e.message || e) +
      '<br>Muat ulang halaman (Ctrl+F5). Kalau tetap begini, backend Kompas-nya yang belum diperbarui.</div></div>';
    return;
  }
  await muatRoster();
  pasangMenu();
  const awal = (location.hash || '').replace('#/', '');
  go(TITLES[awal] ? awal : halPertamaBoleh());
})();

</script>
