/* ---- Pemindai kamera ----
   Memakai BarcodeDetector kalau browsernya punya (Chrome/Edge Android &
   desktop). Kalau tidak ada, kamera tetap menyala sebagai pengarah dan
   petugas mengetik tokennya — lebih baik daripada menolak sama sekali.
   Kamera WAJIB lewat HTTPS; di http:// browser memblokirnya. */
let _camStream=null, _camLoop=null, _camDetector=null, _camTerakhir='', _camSibuk=false;
/* SATU PERILAKU SAJA: QR sah yang dipindai LANGSUNG dicatat masuk, lalu
   layarnya menampilkan kartu "berhasil". Centang "auto check-in" yang dulu ada
   di layar sudah dihapus — dua mode berarti petugas harus ingat sedang di mode
   mana, dan tebakan yang salah di depan antrean berakhir dengan tamu yang
   dikira sudah masuk padahal belum.
   Yang TIDAK sah dan yang SUDAH pernah masuk tetap berhenti di peringatan,
   karena justru di situlah petugas perlu berpikir. */
function checkinTiket(tk){
  tk.status='Checked-In';
  const ci={id:uid(),ticket_id:tk.id,checked_in_at:new Date().toISOString(),staff:DB.role,gate:'Main',result:'Valid'};
  DB.checkins.push(ci); save(); return ci;
}
function showScanResult(html){ const el=document.getElementById('scanResult'); if(el) el.innerHTML=html; }
function lanjutScanNanti(){ setTimeout(()=>{ _camTerakhir=''; if(_camStream&&_camDetector&&!_camLoop)_camLoop=setInterval(bacaFrame,350); },1200); }
function kameraDidukung(){ return !!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia); }
async function toggleKamera(){
  if(_camStream) return matikanKamera();
  if(!kameraDidukung()){toast('Browser ini tidak mendukung akses kamera.');return;}
  if(!window.isSecureContext){toast('Kamera hanya bisa lewat HTTPS. Buka situsnya dengan https://');return;}
  const box=document.getElementById('cam_box'), vid=document.getElementById('cam_video'), btn=document.getElementById('cam_btn');
  try{
    // facingMode 'environment' = kamera belakang di HP; di laptop diabaikan.
    _camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
  }catch(e){
    toast(e.name==='NotAllowedError'?'Izin kamera ditolak. Aktifkan lewat ikon gembok di address bar.'
         :e.name==='NotFoundError' ?'Tidak ada kamera yang terdeteksi.'
         :'Kamera gagal dibuka: '+e.message);
    return;
  }
  vid.srcObject=_camStream; await vid.play().catch(()=>{});
  box.style.display=''; btn.textContent='■ Matikan Kamera';
  if('BarcodeDetector' in window){
    /* Terima QR MAUPUN barcode 1D — tiket bisa memakai salah satunya, jadi
       jangan dibatasi ke qr_code saja. Format yang tak didukung peramban
       diabaikan diam-diam oleh BarcodeDetector. */
    try{ _camDetector=new window.BarcodeDetector({formats:['qr_code','code_128','code_39','ean_13','ean_8','codabar','itf','upc_a','upc_e']}); }
    catch(_){ try{ _camDetector=new window.BarcodeDetector(); }catch(__){ _camDetector=null; } }
  }
  if(!_camDetector) toast('Kamera menyala. Browser ini belum bisa membaca QR sendiri — ketik tokennya di bawah.');
  else _camLoop=setInterval(bacaFrame,350);
}
function matikanKamera(){
  clearInterval(_camLoop); _camLoop=null; _camDetector=null; _camTerakhir='';
  if(_camStream){_camStream.getTracks().forEach(t=>t.stop());_camStream=null;}
  const box=document.getElementById('cam_box'), btn=document.getElementById('cam_btn');
  if(box)box.style.display='none';
  if(btn)btn.textContent='📷 Nyalakan Kamera';
}
async function bacaFrame(){
  const vid=document.getElementById('cam_video');
  if(!vid||!_camDetector||vid.readyState<2)return;
  /* Satu pembacaan pada satu waktu. detect() di HP kelas menengah bisa makan
     lebih dari 350ms, sementara setInterval tetap memanggil tiap 350ms — jadi
     panggilan menumpuk, kamera tersendat, dan halaman ikut berat. Penjaga ini
     yang membuat pemindaian tetap halus di perangkat pelan. */
  if(_camSibuk)return;
  _camSibuk=true;
  let hasil=[];
  try{ hasil=await _camDetector.detect(vid); }catch(_){ return; }
  finally{ _camSibuk=false; }
  if(!hasil.length)return;
  const token=(hasil[0].rawValue||'').trim();
  if(!token||token===_camTerakhir)return;   // jangan proses QR yang sama berulang
  _camTerakhir=token;
  if(navigator.vibrate)navigator.vibrate(60);
  clearInterval(_camLoop); _camLoop=null;   // jeda memindai selama konfirmasi
  konfirmasiScan(token);
}
/* Tiga jawaban, dan hanya satu yang berjalan tanpa henti:
   TIDAK DIKENAL → peringatan merah; SUDAH MASUK → peringatan kuning berisi jam
   masuknya; SAH → langsung dicatat, kartu hijau, pemindaian lanjut sendiri. */
function konfirmasiScan(token){
  const tk=DB.tickets.find(t=>t.qr_token===token);
  if(!tk||tk.status==='Cancelled'){
    modal(`<button class="close" onclick="closeModal();lanjutScan()">×</button><h3 style="color:var(--red)">✗ Tiket Tidak Valid</h3>
    <p class="mini">QR tidak dikenal atau tiketnya sudah dibatalkan.</p>
    <div class="modal-actions"><button class="btn" onclick="closeModal();lanjutScan()">Pindai Lagi</button></div>`);
    return;
  }
  const o=DB.orders.find(x=>x.id===tk.order_item_id)||{};
  const c=DB.ticketClasses.find(x=>x.id===tk.ticket_class_id);
  if(tk.status==='Checked-In'){
    const ci=DB.checkins.find(c2=>c2.ticket_id===tk.id);
    modal(`<button class="close" onclick="closeModal();lanjutScan()">×</button><h3 style="color:var(--accent)">⚠ Sudah check-in sebelumnya</h3>
    <div class="kv"><div class="k">Nama</div><div><b>${esc(o.buyer_name||'Tamu')}</b></div><div class="k">Tiket</div><div>${esc(tk.ticket_number)}</div><div class="k">Class</div><div>${c?esc(c.name):'-'}</div><div class="k">Tempat</div><div>${seatTeks(tk)}</div><div class="k">Masuk pada</div><div>${ci?fmtDateTime(ci.checked_in_at):'-'}</div></div>
    <p class="mini" style="margin-top:10px">QR ini sudah dipakai masuk. Jangan diloloskan lagi tanpa pengecekan — bisa jadi tiketnya diteruskan ke orang lain.</p>
    <div class="modal-actions"><button class="btn ghost" onclick="closeModal();batalCheckin('${tk.id}')">Tadi salah pindai — batalkan</button>
      <button class="btn" onclick="closeModal();lanjutScan()">Pindai lagi</button></div>`);
    return;
  }
  // Tiket sah dan belum dipakai → langsung masuk. Tidak ada tombol konfirmasi:
  // memindai QR sudah merupakan keputusan petugas.
  checkinTiket(tk);
  if(navigator.vibrate)navigator.vibrate([40,40,80]);
  showScanResult(kartuMasukHTML(tk));
  toast('✓ '+o.buyer_name+' masuk');
  // Angka & denah diperbarui di tempat; kamera tidak disentuh sama sekali.
  segarkanCheckin();
  lanjutScanNanti();
}
function seatTeks(tk){
  const s=tk.seat_id?DB.seats.find(x=>x.id===tk.seat_id):null;

/* Kartu hijau di bawah pemindai. Tombol "batalkan" ikut di sini karena inilah

function lanjutScan(){ _camTerakhir=''; if(_camStream&&_camDetector&&!_camLoop)_camLoop=setInterval(bacaFrame,350); }

/* ---- Ketuk kursi di denah ----
   Jalan kedua untuk mencatat kedatangan, dan satu-satunya jalan kalau QR tamu
   tidak bisa dibaca (layar HP mati, e-ticket terhapus, QR tercetak buram). */
function ciKursi(seatId){
  const s=DB.seats.find(x=>x.id===seatId);
  const tks=DB.tickets.filter(t=>t.seat_id===seatId && t.status!=='Cancelled');

    <div class="modal-actions"><button class="btn" onclick="closeModal()">Tutup</button></div>`);
    return;
  }
  const baris=tks.map(function(t){
    const o=DB.orders.find(x=>x.id===t.order_item_id)||{};
    const c=DB.ticketClasses.find(x=>x.id===t.ticket_class_id);
    const ci=DB.checkins.find(x=>x.ticket_id===t.id);

      <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap">

          <div class="mini">${esc(t.ticket_number)} · ${c?esc(c.name):'-'}${(+t.pax_total>1)?' · tamu '+(+t.pax_no)+' dari '+(+t.pax_total):''}</div>
          <div class="mini">${esc(o.phone||'')}</div>
          ${masuk?`<div class="mini" style="color:var(--green)">✓ sudah masuk ${ci?fmtDateTime(ci.checked_in_at):''}</div>`:''}
        </div>
        <div>${masuk
          ? `<button class="btn ghost sm" onclick="batalCheckin('${t.id}')">Batalkan</button>`
          : `<button class="btn sm" onclick="checkinDariDenah('${t.id}')">Check-in</button>`}</div>
      </div></div>`;
  }).join('');
  modal(`<button class="close" onclick="closeModal()">×</button><h3>Kursi ${esc(nama)}</h3>
  <p class="mini" style="margin-bottom:10px">${tks.length} tiket terdaftar di tempat ini.</p>
  ${baris}
  <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Tutup</button></div>`);

function checkinDariDenah(tid){

/* PEMBATALAN SELALU LEWAT KONFIRMASI.
   Salah pencet di sini menghapus bukti kedatangan seseorang yang benar-benar
   sudah masuk — dan tidak ada apa pun di layar yang bisa mengembalikannya

function batalCheckin(tid){
  const tk=DB.tickets.find(t=>t.id===tid); if(!tk)return;
  if(tk.status!=='Checked-In'){ toast('Tiket ini memang belum check-in.'); return; }

function batalCheckinYakin(tid){

/* ============ EVENT CALENDAR ============ */
let calMonth=new Date();let calFilter='all';
/* ---------- KALENDER LINTAS MODUL: EMS MEMBACA EVENT MARKETING ----------
   Dua modul ini memakai kalender yang sama di dunia nyata — venue-nya cuma
   satu. Tapi masing-masing hanya menggambar eventnya sendiri, jadi kru EMS
   tidak pernah melihat acara yang sedang disiapkan Marketing, dan dobel
   booking baru ketahuan di hari-H.

   YANG TERJADI ADALAH PEMBACAAN, BUKAN PENYALINAN. Baris Marketing tidak
   pernah masuk DB.events di sini. Kalau disalin, ada dua kebenaran untuk
   satu acara: acara yang dibatalkan di Marketing tidak ikut hilang dari
   kalender ini, dan yang salah selalu yang jarang dilihat. Pola yang sama
   dipakai modul jadwal saat membaca DW.

   TIDAK PERNAH MELEMPAR. Backend Marketing yang mati tidak boleh membuat
   kalender EMS ikut kosong — paling jauh satu baris peringatan di atas
   legenda, lengkap dengan tombol coba lagi. */
const MKT_URL = '../marketing-api-mysql/api.php';
let MKT_EVENTS = [];
let MKT_ERR    = '';
let MKT_MUAT   = false;
let MKT_SUDAH  = false;

async function muatEventMarketing(paksa){
  if(MKT_MUAT) return;
  if(MKT_SUDAH && !paksa) return;
  MKT_MUAT=true;
  const stop=new AbortController();
  const jam=setTimeout(function(){ stop.abort(); }, 8000);
  try{
    const r=await fetch(MKT_URL+'?action=getAll&t='+Date.now(),
      {method:'GET', redirect:'follow', signal:stop.signal});
    const j=await r.json();
    if(!j || !j.ok || !j.data) throw new Error('balasan tidak dikenali');
    const cl={};
    (j.data.clients||[]).forEach(function(c){ if(c&&c.id) cl[c.id]=c.nama||''; });
    /* Yang ditampilkan hanya yang benar-benar akan terjadi. Peluang berstatus
       Lost tetap ada di Marketing sebagai riwayat, tapi memajangnya di
       kalender venue berarti memperlihatkan tanggal yang sebenarnya kosong —
       dan orang lalu menghindari tanggal yang seharusnya bisa dipakai. */
    MKT_EVENTS=(j.data.events||[])
      .filter(function(e){ return e && e.tanggal && e.status!=='Lost'; })
      .map(function(e){ return {tanggal:e.tanggal, nama:e.nama||'(tanpa nama)',
              client:cl[e.clientId]||'', status:e.status||'', pax:+e.pax||0}; });
    MKT_ERR='';
  }catch(err){
    MKT_EVENTS=[];
    MKT_ERR = (err && err.name==='AbortError')
      ? 'Modul Marketing tidak menjawab dalam 8 detik.'
      : 'Tidak bisa membaca event Marketing: '+((err&&err.message)||'gagal');
  }finally{
    clearTimeout(jam);
    MKT_MUAT=false; MKT_SUDAH=true;
    /* Digambar ulang HANYA kalau kalendernya masih terbuka — kalau tidak,
       balasan yang datang terlambat akan menimpa halaman lain yang sedang
       dibaca orang. */
    if(location.hash.indexOf('#/calendar')===0) renderCalendar();
  }
}
/* Baris peringatan, bukan layar galat. Kalender yang kehilangan satu sumber
   masih berguna; kalender yang DIAM soal itu tidak — orang akan mengira
   Marketing memang sedang tidak punya acara. */
function panelGagalMkt(){
  if(!MKT_ERR) return '';
  return '<div class="mini" style="margin:8px 0;padding:9px 12px;border-radius:8px;'
    +'background:rgba(229,72,77,.09);border:1px solid rgba(229,72,77,.3)">'
    +esc(MKT_ERR)+' Acara Marketing tidak ikut tergambar. '
    +'<button class="btn ghost sm" style="margin-left:6px" onclick="muatEventMarketing(true)">Coba lagi</button></div>';
}

function renderCalendar(){
  setTop('Event Calendar','Kalender terpadu multi-sumber','');
  const y=calMonth.getFullYear(),m=calMonth.getMonth();
  const startDow=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();const todayStr=dstr(new Date());
  // aggregate items
  const items={};// date -> [{title,color,type}]
  /* `klik` = pemanggil popup untuk item itu. Kosong berarti item tidak bisa
     diklik (mis. hari libur) — dan itu ditandai di layar lewat kursor, supaya
     orang tidak menekan sesuatu yang memang tidak akan merespons. */
  const push=(date,title,color,type,klik)=>{if(calFilter!=='all'&&calFilter!==type)return;(items[date]=items[date]||[]).push({title,color,type,klik});};
  /* TIGA WARNA SAJA, mengikuti PEMILIKNYA — bukan jenis acaranya.
     Dulu enam: Event kuning, Entertainment hijau, Reservation ungu, Marketing
     jingga, Holiday merah, Birthday biru. Enam warna untuk satu kisi kecil
     berarti tidak ada satu pun yang benar-benar dikenali; yang dicari orang
     saat membuka kalender terpadu justru cuma satu hal — ini acara siapa,
     boleh saya pakai tanggalnya atau tidak.

     Sekarang tiga warna, DISALIN PERSIS dari kalender Marketing supaya kru
     yang membuka keduanya bergantian tidak perlu menghafal dua bahasa warna:

         Marketing  = emas   (.cal .ev di Marketing)
         EMS        = ungu   (.cal .ev-ems di Marketing)
         Reservasi  = teal   (.cal .ev-rsv di Marketing)

     PERHATIKAN BAHWA EMS BUKAN LAGI KUNING. Sebelumnya EMS memakai --accent
     (#A9791F) dan Marketing --orange (#b5831a) — dua nada emas yang selisihnya
     tidak terlihat di kotak tanggal sekecil ini, jadi seluruh gagasan "warna
     memberi tahu ini acara siapa" tidak pernah benar-benar bekerja. Yang
     dipakai sekarang justru pasangan yang sudah terbukti terbaca di modul
     sebelah, dan arah pemetaannya ikut dibalik supaya sama: di kedua kalender,
     EMAS selalu berarti Marketing dan UNGU selalu berarti EMS.

     Jadwal talent, hari libur, dan ulang tahun semuanya milik EMS, jadi ikut
     ungu. Jenisnya tetap tertulis di label & saringan, jadi tidak ada
     keterangan yang hilang — yang hilang cuma warna yang tidak menjelaskan
     apa-apa. */
  DB.events.forEach(e=>push(e.start_datetime.slice(0,10),e.title,'purple','Event',"calEventPopup('"+e.id+"')"));
  /* TALENT PUNYA WARNANYA SENDIRI, terpisah dari acara. Sebelumnya keduanya
     sama-sama ungu dengan alasan "sama-sama milik EMS", dan legendanya harus
     menerangkannya lewat kurung panjang "(event, talent, libur, ulang tahun)"
     — keterangan sepanjang itu di bawah kalender adalah tanda bahwa warnanya
     sendiri tidak menjelaskan apa pun.

     Di layar keduanya memang dua pertanyaan berbeda: "malam ini ada acara apa"
     dan "malam ini siapa yang main". Yang membuka kalender ini hampir selalu
     mencari salah satunya, bukan keduanya sekaligus.

     Libur & ulang tahun ikut warna acara: keduanya menandai HARInya, bukan
     penampilnya — dan menambah warna kelima untuk dua jenis yang muncul
     beberapa kali setahun akan mengembalikan persoalan yang sama. */
  DB.schedules.forEach(s=>{const t=DB.talents.find(x=>x.id===s.talent_id);push(s.date,'🎤 '+(t?t.name:''),'blue','Entertainment',"calJadwalPopup('"+s.id+"')");});
  DB.calendarExtra.forEach(x=>push(x.date,x.title,x.type==='Reservation'?'teal':'purple',x.type));
  /* Event Marketing — dibaca, tidak disalin. Ditandai jingga dan diberi
     awalan supaya jelas ia milik modul lain dan tidak bisa disunting di sini. */
  MKT_EVENTS.forEach(function(e,i){
    push(e.tanggal, '[MKT] '+e.nama+(e.client?' - '+e.client:''), 'yellow', 'Marketing',
         'calMktPopup('+i+')'); });
  muatEventMarketing();
  let cells='';for(let i=0;i<startDow;i++)cells+='<div class="cell other"></div>';
  for(let d=1;d<=days;d++){const ds=dstr(new Date(y,m,d));const its=items[ds]||[];cells+=`<div class="cell ${ds===todayStr?'today':''}"><div class="dn">${d}</div>${its.slice(0,4).map(it=>`<span class="evt-dot b-${it.color}${it.klik?' bisa':''}"${it.klik?` onclick="${it.klik}"`:''}>${esc(it.title)}</span>`).join('')}${its.length>4?`<span class="mini">+${its.length-4} lagi</span>`:''}</div>`;}
  const types=['all','Event','Entertainment','Reservation','Marketing','Holiday','Birthday'];
  C().innerHTML=`<div class="toolbar"><button class="btn ghost sm" onclick="calMonth=new Date(${y},${m-1},1);renderCalendar()">‹</button><b style="min-width:140px;text-align:center">${MONTHS[m]} ${y}</b><button class="btn ghost sm" onclick="calMonth=new Date(${y},${m+1},1);renderCalendar()">›</button>
  <select onchange="calFilter=this.value;renderCalendar()" style="width:auto">${types.map(t=>`<option value="${t}" ${calFilter===t?'selected':''}>${t==='all'?'Semua tipe':t}</option>`).join('')}</select></div>
  ${panelGagalMkt()}
  <div class="legend"><span><i class="dotc" style="background:var(--purple)"></i>Event</span><span><i class="dotc" style="background:var(--blue)"></i>Talent</span><span><i class="dotc" style="background:var(--accent)"></i>Marketing${MKT_EVENTS.length?' ('+MKT_EVENTS.length+')':''}</span><span><i class="dotc" style="background:#0C6B64"></i>Reservasi</span></div>
  <div class="cal">${DOW.map(d=>`<div class="dow">${d}</div>`).join('')}${cells}</div>`;
}

   tidak kelihatan sudah sampai mana, dan batal di tengah membuang semuanya.
   Sekarang satu form utuh yang bisa dilihat sekaligus. */
function evalIdea(id){
  const i=DB.ideas.find(x=>x.id===id);
  modal(`<button class="close" onclick="closeModal()">×</button><h3>Evaluasi — ${esc(i.name)}</h3>
  <p class="mini" style="margin-bottom:12px">Diisi setelah event-nya berjalan. Dipakai untuk menilai apakah ide ini layak diulang.</p>
  <div class="grid g2">
    <div class="field"><label>Tanggal Pelaksanaan</label><input id="ev_tgl" type="date" value="${dstr(new Date())}"></div>
    <div class="field"><label>Omzet (IDR)</label><input id="ev_omzet" type="number" min="0" value="0"></div>
    <div class="field"><label>Jumlah Hadir</label><input id="ev_att" type="number" min="0" value="0"></div>
    <div class="field"><label>Biaya Aktual (IDR)</label><input id="ev_biaya" type="number" min="0" value="${+i.budget||0}"></div>
    <div class="field"><label>Skor Keseluruhan (1–10)</label><input id="ev_score" type="number" min="1" max="10" value="7"></div>
    <div class="field"><label>Layak Diulang?</label><select id="ev_ulang"><option>Ya</option><option>Perlu perbaikan</option><option>Tidak</option></select></div>

  <div class="field"><label>Yang Perlu Diperbaiki</label><textarea id="ev_minus" rows="2" placeholder="mis. sound telat, parkir penuh"></textarea></div>
  <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn" onclick="simpanEval('${id}')">Simpan Evaluasi</button></div>`,true);

function simpanEval(id){
  const g=x=>document.getElementById(x).value;
  const score=+g('ev_score');
  if(score<1||score>10){toast('Skor harus 1–10.');return;}
  const omzet=+g('ev_omzet')||0, biaya=+g('ev_biaya')||0;
  const i=DB.ideas.find(x=>x.id===id);
  i.evaluations.push({executed:'Ya',tanggal:g('ev_tgl'),omzet,biaya,profit:omzet-biaya,
    attendance:+g('ev_att')||0,score,ulang:g('ev_ulang'),
    plus:g('ev_plus').trim(),minus:g('ev_minus').trim(),
    feedback:[g('ev_plus').trim(),g('ev_minus').trim()].filter(Boolean).join(' | '),
    at:new Date().toISOString()});
  i.ever_executed=true;save();closeModal();renderIdeas();
  toast('✓ Evaluasi tersimpan — profit '+IDR(omzet-biaya)+'.');
}
/* Dulu tombol ini langsung membuat event dan melempar ke Event Management,

/* ============ EVENT HISTORY ============ */
let histFilter={year:'',cat:''};
function renderHistory(){
  setTop('Event History','Arsip event selesai (read-only)','');
  /* SEBABNYA HALAMAN INI SELALU KOSONG selama berbulan-bulan: syaratnya masih
     'Finished', padahal status itu sudah tidak ada sejak EMS dipangkas jadi
     tiga (Planning / Upcoming / Event Done). normalize() memetakan data lama
     Finished → Event Done, dan autoSelesaikanEvent() menulis 'Event Done'
     juga — jadi tidak ada satu pun event di database yang bisa lolos syarat
     ini, dan halaman selalu berkata "Belum ada event selesai" meski arsipnya
     penuh. Tidak ada galat, tidak ada yang aneh di layar: itu sebabnya ia
     bertahan begitu lama.

     'Finished' tetap ikut diterima supaya data yang belum sempat lewat
     normalize() — mis. cadangan lama yang baru dipulihkan — tidak hilang dari
     arsip untuk kedua kalinya. */
  let list=DB.events.filter(e=>e.status==='Event Done'||e.status==='Finished');
  /* Yang terbaru di atas. Arsip tanpa urutan memaksa orang memindai seluruh
     kartu untuk menemukan acara bulan lalu. */
  list.sort((a,b)=>String(b.start_datetime).localeCompare(String(a.start_datetime)));
  const years=[...new Set(list.map(e=>e.start_datetime.slice(0,4)))];
  if(histFilter.year)list=list.filter(e=>e.start_datetime.startsWith(histFilter.year));
  if(histFilter.cat)list=list.filter(e=>e.category===histFilter.cat);
  C().innerHTML=`<div class="toolbar">
    <select onchange="histFilter.year=this.value;renderHistory()"><option value="">Semua tahun</option>${years.map(y=>`<option ${histFilter.year===y?'selected':''}>${y}</option>`).join('')}</select>
    <select onchange="histFilter.cat=this.value;renderHistory()"><option value="">Semua kategori</option>${EVT_CATS.map(c=>`<option ${histFilter.cat===c?'selected':''}>${c}</option>`).join('')}</select>
    <span class="pill">${list.length} event</span></div>
  <!-- KARTU ARSIP: TANPA EVALUASI, DENGAN TOMBOL "BUAT EVENT SERUPA".
       Yang dulu berdiri di baris ketiga tiap kartu adalah skor evaluasi —
       dan karena evaluasi memang sudah dicabut dari modul ini (lihat
       renderHistoryDetail), yang tampil di hampir semua kartu cuma tulisan
       "Evaluasi belum ada": satu baris yang menagih sesuatu yang tidak ada
       tempatnya lagi untuk diisi. Gantinya angka yang memang tercatat —
       omzet & tiket terjual, dari sumber yang sama dengan laporan.

       Tombolnya naik ke kartu karena itu SATU-SATUNYA hal yang orang lakukan
       di halaman ini. Sebelumnya ia bersembunyi di dasar halaman detail:
       buka arsip → cari kartunya → klik → gulir ke bawah → baru tombolnya
       kelihatan. Empat langkah untuk satu tindakan. -->
  <div class="grid g3">${list.map(e=>{
    const h=breakdownEventEms({events:[e]})[0];
    /* stopPropagation: kartunya sendiri sudah bisa diklik untuk membuka
       detail — tanpa ini, menekan tombol membuka formulir DAN berpindah
       halaman sekaligus, jadi formulirnya langsung tergilas. */
    const tombol=bisaUbah('planning')
      ?`<button class="btn ghost sm" style="margin-top:10px;width:100%" onclick="event.stopPropagation();buatEventLagi('${e.id}')">↺ Buat Event Serupa</button>`:'';
    return `<div class="ecard" onclick="location.hash='#/history/${e.id}'"><div class="cover">${e.poster_img?`<img src="${fileUrl(e.poster_img.key)}" class="poster-img" alt="">`:''}</div><div class="body"><div class="t">${esc(e.title)}</div><div class="meta">📅 ${fmtDate(e.start_datetime)} · ${esc(e.venue||'—')}</div><div class="meta" style="color:var(--accent)">💰 ${IDR(h.omzet)} · 🎟️ ${h.terjual} terjual · 👥 ${h.hadir} hadir</div>${tombol}</div></div>`;}).join('')||'<div class="empty">Belum ada event selesai.</div>'}</div>`;
}
/* MEMBUAT ULANG ACARA YANG SUDAH LEWAT.
   Acara yang berhasil hampir selalu diulang - tahunan, atau tiap kuartal - dan
   selama ini menyalinnya berarti mengetik ulang seluruh formulir sambil bolak-
   balik membaca arsipnya di tab lain.

   YANG DISALIN cuma yang menerangkan BENTUK acaranya: judul, kategori, tema,
   venue, kapasitas, PIC, deskripsi, dan saklar ber-tiket.

   YANG TIDAK IKUT, dan itu disengaja: tanggal (harus diputuskan orangnya),
   kelas tiket & harganya (harga tahun lalu jarang masih berlaku), denah,
   pesanan, tiket, dan seluruh angka pencapaian. Menyalinnya berarti membuat
   acara baru yang lahir dengan penjualan milik acara lain.

   Statusnya SELALU 'Planning' - salinan tetap harus lewat persetujuan
   manajemen seperti rencana lain. */
function buatEventLagi(id){
  const e=DB.events.find(function(x){ return x.id===id; }); if(!e) return;
  if(!bisaUbah('planning')) return toast('Kamu tidak punya izin membuat rencana event.');
  eventForm(null,{
    status:'Planning',
    title:(e.title||'')+' (ulang)',
    category:e.category||'', theme:e.theme||'',
    venue:e.venue||'', capacity:+e.capacity||0,
    pic:e.pic||'', description:e.description||'',
    is_ticketed:!!e.is_ticketed
  });
  toast('Formulir diisi dari "'+(e.title||'')+'". Tanggal & kelas tiket sengaja dikosongkan.');
}
function renderHistoryDetail(id){
  const e=DB.events.find(x=>x.id===id);if(!e){location.hash='#/history';return;}
  /* EVALUASI DICABUT. Yang dulu berdiri di sini: skor, feedback, "Problem:
     Sound sistem kurang di area belakang" dan "Improvement: Upgrade PA system"
     - dua kalimat yang DITULIS MATI di dalam kode dan tampil sama persis di
     SETIAP acara, sejak dulu. Arsip yang mengarang temuannya sendiri lebih
     buruk daripada arsip yang diam.

     Gantinya pencapaian yang memang tercatat dan bisa dipercaya, dihitung dari
     sumber yang sama dengan laporan (lihat breakdownEventEms). */
  const hasil=breakdownEventEms({events:[e]})[0];
  const d=DB.eventDetails[id];
  const sold=DB.ticketClasses.filter(c=>c.event_id===id).reduce((a,c)=>a+c.sold,0);
  setTop(e.title,'<a href="#/history" style="color:var(--accent)">History</a> / '+esc(e.title),statusBadge(e.status));
  /* BENTUKNYA SENGAJA SAMA DENGAN DETAIL EVENT BIASA (renderEventDetail):
     banner yang sama, kartu "Informasi Dasar" yang sama, urutan baris yang
     sama. Arsip yang punya tata letaknya sendiri memaksa orang belajar dua
     halaman untuk membaca satu acara — padahal yang berbeda cuma satu hal:
     acaranya sudah lewat.

     Yang TIDAK ikut, dan itu memang bedanya: timeline, rundown, vendor,
     sponsor & task. Kelimanya kotak isian untuk acara yang masih disiapkan;
     di acara yang sudah selesai isinya cuma tabel kosong yang tidak bisa
     diisi. Yang tinggal adalah gambaran menyeluruhnya — keterangan acaranya,
     hasilnya, dan uangnya.

     "Buat Event Serupa" TIDAK LAGI DI SINI — tombolnya pindah ke kartu di
     halaman arsip (renderHistory), tempat orang sudah berdiri saat
     memutuskan mau mengulang acara yang mana. */
  const banner=`<div class="evt-banner"><div class="poster-head" style="width:64px;height:64px">${posterKecilHTML(e,64)}</div>
    <div class="eb-info"><div class="eb-title">${esc(e.title)}</div>
      <div class="eb-meta"><span class="badge b-blue">${e.category}</span> ${statusBadge(e.status)} <span>📍 ${esc(e.venue)}</span> <span>📅 ${fmtDate(e.start_datetime)}</span></div></div></div>`;
  C().innerHTML=`${banner}
  <div class="grid g2"><div class="card"><h3 class="sec">ℹ️ Informasi Dasar</h3><div class="kv">
    <div class="k">Kategori</div><div><span class="badge b-blue">${e.category}</span></div><div class="k">Theme</div><div>${esc(e.theme||'—')}</div>
    <div class="k">Venue</div><div>${esc(e.venue)}</div><div class="k">Waktu</div><div>${fmtDateTime(e.start_datetime)}${e.end_datetime?' – '+new Date(e.end_datetime).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}):''}</div>
    <div class="k">Kapasitas</div><div>${e.capacity} orang</div><div class="k">PIC</div><div>${esc(e.pic||'—')}</div>
    <div class="k">Status</div><div>${statusBadge(e.status)}</div><div class="k">Ticketed</div><div>${e.is_ticketed?'Ya · '+sold+' terjual':'Tidak'}</div></div>
    ${e.description?`<div style="margin-top:12px" class="mini">${e.description}</div>`:''}</div>
  <div class="card"><h3 class="sec">📊 Pencapaian</h3><div class="kv">
    <div class="k">Omzet Tiket</div><div><b>${IDR(hasil.omzet)}</b></div>
    <div class="k">Tiket Terjual</div><div>${hasil.terjual}${hasil.kuota?` <span class="mini">dari ${hasil.kuota} kuota · ${hasil.isi}%</span>`:''}</div>
    <div class="k">Hadir Hari-H</div><div>${hasil.hadir}${hasil.tiket?` <span class="mini">dari ${hasil.tiket} e-ticket · ${hasil.hadirPct}%</span>`:''}</div>
    <div class="k">Kategori Terlaku</div><div>${hasil.top?`<b>${esc(hasil.top.name)}</b> <span class="mini">${+hasil.top.sold||0} terjual</span>`:'<span class="mini">—</span>'}</div>
  </div></div></div>
  ${d&&d.budget.length?`<div class="card" style="margin-top:16px"><h3 class="sec">💰 P/L</h3><table><thead><tr><th>Item</th><th>Tipe</th><th>Actual</th></tr></thead><tbody>${d.budget.map(b=>`<tr><td>${esc(b.item)}</td><td>${b.type}</td><td>${IDR(b.actual)}</td></tr>`).join('')}</tbody></table></div>`:''}`;
}

/* ============ INIT ============
   Data datang dari server, jadi boot-nya asinkron. Kalau server tidak bisa
   dihubungi, JANGAN diam-diam jalan dengan data kosong — nanti dikira datanya
   hilang. Tampilkan layar gagal + tombol coba lagi. */
/* Identitas & logo di sidebar — disamakan dengan Marketing/Reservasi.
   Nama diambil dari sesi Office (guard SSO di <head> sudah memastikan sesinya
   ada dan berhak), jadi tidak perlu login terpisah di modul ini. */
/* Nama kru yang sedang login — dipakai sebagai jejak siapa yang mencatat
   penjualan. Sumbernya sesi Office yang sama dengan blok pengguna di sidebar. */
function namaKru(){
  let s=null; try{ s=JSON.parse(localStorage.getItem('lm_session')||'null'); }catch(_){}
  return (s&&s.name)||'Kru';
}
function paintSideUser(){
  let s=null; try{ s=JSON.parse(localStorage.getItem('lm_session')||'null'); }catch(_){}
  const nama=(s&&s.name)||'Kru';
  const av=document.getElementById('su-avatar'); if(av)av.textContent=initials(nama);
  const un=document.getElementById('su-un');     if(un)un.textContent=nama;
  const ur=document.getElementById('su-ur');     if(ur)ur.textContent=DB&&DB.role?DB.role:'Kru';
  const lg=document.getElementById('brand-logo');if(lg)lg.src=window.__ICON__;
}
// "Keluar" = kembali ke portal Office. Sesi Office sengaja TIDAK dihapus:
// modul lain memakainya juga, jadi menghapusnya di sini akan memaksa kru
// login ulang hanya karena menutup EMS.
function logout(){ location.replace('../'); }

(async function init(){
  try{
    await load();
    /* DITUNGGU, bukan dijalankan di latar: buildNav() di dalam router()
       langsung bertanya "peranku apa", dan kalau rosternya belum sampai,
       menu digambar dengan peran jalan-mundur lalu berubah sendiri sedetik
       kemudian. Fungsinya menelan galatnya sendiri, jadi Office yang mati
       tidak pernah menggagalkan boot — paling lama menunda 8 detik. */
    await muatRosterOffice();
    paintSideUser();
    if(!location.hash)location.hash='#/dashboard';
    router();
  }catch(e){
    document.getElementById('content').innerHTML=
      '<div class="card" style="border-color:var(--red);max-width:620px;margin:40px auto">'+
      '<h3 class="sec" style="color:var(--red)">Tidak bisa memuat data</h3>'+
      '<p class="mini">Server EMS tidak merespons, jadi tidak ada yang ditampilkan.<br>'+
      'Data kamu <b>aman di database</b> — ini cuma gagal memuat, bukan data hilang.</p>'+
      '<div class="kv" style="margin-top:12px"><div class="k">Alamat API</div><div class="mini">'+esc(API_URL)+'</div>'+
      '<div class="k">Pesan</div><div class="mini">'+esc(e.message)+'</div></div>'+
      '<div class="modal-actions"><button class="btn" onclick="location.reload()">Coba lagi</button></div></div>';
    document.getElementById('pageTitle').textContent='Gagal memuat';
  }
})();


</script>
