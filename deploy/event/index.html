/* ---- Pengiriman e-ticket ke pembeli ----
   Belum ada pengiriman otomatis dari server, jadi jalurnya WhatsApp: pesannya
   sudah tersusun lengkap, kasir tinggal menekan kirim. Dipilih begini karena
   kasir MELIHAT SENDIRI pesannya terkirim — tidak ada kegagalan diam-diam
   seperti email yang masuk folder spam tanpa ada yang tahu.

   QR-nya diunduh terpisah sebagai gambar lalu dilampirkan, karena tautan
   wa.me hanya bisa membawa teks. */
function tiketRingkas(tid){
  const tk=DB.tickets.find(x=>x.id===tid); if(!tk)return null;
  const o=DB.orders.find(x=>x.id===tk.order_item_id);
  const c=DB.ticketClasses.find(x=>x.id===tk.ticket_class_id);
  const e=o?DB.events.find(x=>x.id===o.event_id):null;
  const seat=tk.seat_id?DB.seats.find(s=>s.id===tk.seat_id):null;
  return {tk,o,c,e,seat};
}
function kirimWA(tid){
  const r=tiketRingkas(tid); if(!r||!r.o){toast('Data tiket tidak lengkap.');return;}
  const {tk,o,c,e,seat}=r;
  const baris=[
    'Halo '+o.buyer_name+', berikut e-ticket Anda:','',
    'Nama           : '+o.buyer_name,
    'Nomor Tiket    : '+tk.ticket_number,
    'Jam            : '+(e?fmtDateTime(e.start_datetime):'-'),
    'Kategori Tiket : '+(c?c.name:'-')
  ];
  if(seat) baris.push('Seat           : '+seat.table_no);
  if(e)    baris.push('Venue          : '+esc(e.venue));
  baris.push('','Tunjukkan QR code (gambar terlampir) saat check-in.',
             'QR berlaku sekali pakai.','','Laksamana Muda Coffee & Live Space');
  const nomor=String(o.phone||'').replace(/[^0-9]/g,'').replace(/^0/,'62');
  if(!nomor){toast('Nomor WhatsApp pembeli kosong.');return;}
  window.open('https://wa.me/'+nomor+'?text='+encodeURIComponent(baris.join(String.fromCharCode(10))),'_blank','noopener');
  toast('WhatsApp dibuka - jangan lupa lampirkan gambar QR-nya.');
}
// QR disimpan sebagai PNG supaya gampang dilampirkan di WhatsApp atau email.
function unduhQR(tid){
  const r=tiketRingkas(tid); if(!r)return;
  const svg=qrSvg(r.tk.qr_token,600);
  const img=new Image();
  img.onload=function(){
    const cv=document.createElement('canvas'); cv.width=cv.height=600;
    const cx=cv.getContext('2d'); cx.fillStyle='#fff'; cx.fillRect(0,0,600,600); cx.drawImage(img,0,0);
    cv.toBlob(function(b){
      const a=document.createElement('a');
      a.href=URL.createObjectURL(b);
      a.download='QR-'+r.tk.ticket_number+'.png';
      a.click(); setTimeout(function(){URL.revokeObjectURL(a.href);},4000);
      toast('QR tersimpan sebagai '+a.download);
    });
  };
  img.onerror=function(){toast('Gagal menyiapkan gambar QR.');};
  img.src='data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(svg)));
}
/* Satu order = satu pengajuan refund yang hidup. Dulu tombolnya bisa
   ditekan berkali-kali dan tiap klik menambah baris baru, sehingga satu
   order bisa punya banyak refund Pending yang saling bertentangan. */
function refundAktif(oid){
  return DB.refunds.find(r=>r.order_id===oid && r.status!=='Rejected');
}
function requestRefund(oid){
  const ada=refundAktif(oid);
  if(ada){
    toast(ada.status==='Pending'
      ? 'Refund untuk order ini sudah diajukan — menunggu persetujuan.'
      : 'Refund untuk order ini sudah disetujui.');
    const o0=DB.orders.find(x=>x.id===oid);window._tixTab='sales';renderTicketDetail(o0.event_id);return;
  }
  const o=DB.orders.find(x=>x.id===oid);
  modal(`<button class="close" onclick="closeModal()">×</button><h3>Ajukan Refund</h3>
  <div class="kv" style="margin-bottom:14px"><div class="k">Buyer</div><div><b>${esc(o.buyer_name)}</b></div><div class="k">Nominal</div><div>${IDR(o.total)}</div></div>
  <div class="field"><label>Alasan refund *</label><textarea id="rf_reason" rows="3" placeholder="mis. acara bentrok, tiket dobel"></textarea></div>
  <p class="mini">Setelah diajukan, statusnya <b>menunggu persetujuan</b>. Pengajuan hanya bisa sekali per order.</p>
  <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn" onclick="submitRefund('${oid}')">Ajukan</button></div>`);
}
function submitRefund(oid){
  const reason=document.getElementById('rf_reason').value.trim();
  if(!reason){toast('Alasan wajib diisi.');return;}
  if(refundAktif(oid)){toast('Refund untuk order ini sudah ada.');closeModal();return;}
  DB.refunds.push({id:uid(),order_id:oid,reason,status:'Pending',requested_at:new Date().toISOString()});
  save();closeModal();toast('✓ Refund diajukan — menunggu persetujuan.');
  const o=DB.orders.find(x=>x.id===oid);window._tixTab='sales';renderTicketDetail(o.event_id);
}
/* Satu pesanan bisa berisi BANYAK tiket sejak pembelian multi-kursi ada.
   Versi lama memakai DB.tickets.find(...) — satu tiket saja — sehingga
   pesanan 6 kursi yang di-refund menyisakan 5 tiket berstatus Valid, 5 kursi
   tetap terjual di denah, dan kuota kelas berkurang 1 dari 6 yang seharusnya.
   Uangnya sudah dikembalikan tapi kursinya tidak pernah bisa dijual lagi. */
function approveRefund(rid){
  const r=DB.refunds.find(x=>x.id===rid); if(!r) return;
  const o=DB.orders.find(x=>x.id===r.order_id); if(!o) return;
  r.status='Approved'; r.approved_at=new Date().toISOString();
  o.payment_status='Refunded';
  const tiket=DB.tickets.filter(t=>t.order_item_id===o.id && t.status!=='Cancelled');
  tiket.forEach(function(tk){
    tk.status='Cancelled';
    if(tk.seat_id){ const st=DB.seats.find(x=>x.id===tk.seat_id); if(st) st.status='Available'; }
    const c=DB.ticketClasses.find(x=>x.id===tk.ticket_class_id);
    if(c&&c.sold>0) c.sold--;
  });
  save();
  toast('✓ Refund disetujui — '+tiket.length+' tiket dibatalkan & kursinya dilepas.');
  renderTicketDetail(o.event_id);
}
function rejectRefund(rid){const r=DB.refunds.find(x=>x.id===rid);r.status='Rejected';save();const o=DB.orders.find(x=>x.id===r.order_id);renderTicketDetail(o.event_id);toast('Refund ditolak.');}

/* Live Occupancy = denah venue yang sama dengan Ticketing (Lantai 1 meja &
   Lantai 2 Reguler+), tapi READ-ONLY dan diwarnai status kedatangan. Memakai
   seatMapBody dengan window._denahRO supaya tak ada duplikasi tata letak. */
function liveDenahHTML(eid){
  if(!DB.seats.some(s=>s.event_id===eid))
    return '<div class="mini">Event ini standing (tanpa seat map).</div>';
  window._denahRO=true;
  // Denah kustom (kalau event ini memakainya) ikut tampil live — warnanya
  // memakai status kedatangan yang sama dengan denah template.
  /* Event yang punya denah KUSTOM hanya menampilkan denah itu. Sebelumnya
     keduanya digambar bertumpuk, jadi petugas check-in melihat dua denah untuk
     satu ruangan — yang satu tata letak asli acara, yang satu template bawaan
     venue yang tidak dipakai malam itu. Di depan antrean tamu, dua denah yang
     saling bertentangan lebih buruk daripada tidak ada denah sama sekali. */
  const punyaKustom=ldzItems(eid).length>0;
  if(punyaKustom){
    /* _denahRO HARUS tetap true selama kanvasnya dibangun. Versi sebelumnya
       mematikannya lebih dulu, jadi tiap objek dipasangi onclick="toggleSeat()"
       — di layar Check-In, satu sentuhan pada denah memutar status kursi lalu
       memanggil renderTicketDetail(), yang MENIMPA seluruh isi halaman Check-In
       dengan halaman Ticketing. Itulah "check-in berantakan" dan "klik denah
       malah masuk ke halaman layout": halaman Ticketing terbuka pada tab
       terakhir yang dipakai, yang biasanya Layout. */
    const html='<div class="card"><h3 class="sec">Denah Kustom — Lantai '+ldzLantai()+'</h3>'
      +ldzLantaiBarLive(eid)+ldzCanvasHTML(eid,false)+'</div>';

    return html;
  }
  const template=DB.seats.some(s=>s.event_id===eid && s.zone!=='Custom') ? seatMapBody(eid) : '';
  window._denahRO=false;
  return template;
}
/* Pemilih lantai untuk Live Occupancy di Check-In.
   Denah kustom di Check-In sebelumnya hanya menggambar SATU lantai — lantai
   yang terakhir dibuka di tab Layout — tanpa cara apa pun untuk berpindah,
   jadi separuh venue tak terlihat oleh petugas.

   TIDAK memakai ldzSetLantai(): fungsi itu memanggil renderTicketDetail() kalau
   tidak menemukan #ldzRoot, dan di halaman Check-In itu berarti seluruh layar
   petugas tertimpa halaman Ticketing di tengah antrean tamu — kesalahan yang
   sama yang dulu membuat "klik denah malah masuk ke halaman layout".

   Jumlah objek dan yang sudah datang ditulis di kedua tombol, jadi keadaan
   lantai yang sedang TIDAK dibuka pun tetap terbaca tanpa harus berpindah. */
function ldzLantaiBarLive(eid){
  const semua=ldzSemuaItems(eid);

  const kini=ldzLantai();

      +' onclick="ldzSetLantaiLive(\''+eid+'\',\''+f+'\')">Lantai '+f
      +' <span class="mini">('+n+' objek'+(h?' · '+h+' hadir':'')+')</span></button>';
  };
  return '<div class="lm-floors" style="margin:0 0 10px">'+tombol('1')+tombol('2')+'</div>';

/* ---- Pemindai kamera ----
   Memakai BarcodeDetector kalau browsernya punya (Chrome/Edge Android &
   desktop). Kalau tidak ada, kamera tetap menyala sebagai pengarah dan
   petugas mengetik tokennya — lebih baik daripada menolak sama sekali.
   Kamera WAJIB lewat HTTPS; di http:// browser memblokirnya. */
let _camStream=null, _camLoop=null, _camDetector=null, _camTerakhir='';
/* Auto check-in: begitu QR valid dipindai, langsung masukkan tanpa tombol
   "Konfirmasi Masuk" — dipakai saat antrean padat. Bisa dimatikan lewat
   centang di layar; kalau mati, kembali ke konfirmasi manual (cocokkan wajah
   dulu). Yang SUDAH check-in / TIDAK valid tetap memunculkan peringatan di
   kedua mode — auto hanya melewati konfirmasi untuk tiket yang jelas valid. */
let _autoCheckin=true;
function checkinTiket(tk){
  tk.status='Checked-In';
  const ci={id:uid(),ticket_id:tk.id,checked_in_at:new Date().toISOString(),staff:DB.role,gate:'Main',result:'Valid'};
  DB.checkins.push(ci); save(); return ci;
}
function showScanResult(html){ const el=document.getElementById('scanResult'); if(el) el.innerHTML=html; }
function lanjutScanNanti(){ setTimeout(()=>{ _camTerakhir=''; if(_camStream&&_camDetector&&!_camLoop)_camLoop=setInterval(bacaFrame,350); },1200); }
function kameraDidukung(){ return !!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia); }
async function toggleKamera(){
  if(_camStream) return matikanKamera();
  if(!kameraDidukung()){toast('Browser ini tidak mendukung akses kamera.');return;}
  if(!window.isSecureContext){toast('Kamera hanya bisa lewat HTTPS. Buka situsnya dengan https://');return;}
  const box=document.getElementById('cam_box'), vid=document.getElementById('cam_video'), btn=document.getElementById('cam_btn');
  try{
    // facingMode 'environment' = kamera belakang di HP; di laptop diabaikan.
    _camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
  }catch(e){
    toast(e.name==='NotAllowedError'?'Izin kamera ditolak. Aktifkan lewat ikon gembok di address bar.'
         :e.name==='NotFoundError' ?'Tidak ada kamera yang terdeteksi.'
         :'Kamera gagal dibuka: '+e.message);
    return;
  }
  vid.srcObject=_camStream; await vid.play().catch(()=>{});
  box.style.display=''; btn.textContent='■ Matikan Kamera';
  if('BarcodeDetector' in window){
    /* Terima QR MAUPUN barcode 1D — tiket bisa memakai salah satunya, jadi
       jangan dibatasi ke qr_code saja. Format yang tak didukung peramban
       diabaikan diam-diam oleh BarcodeDetector. */
    try{ _camDetector=new window.BarcodeDetector({formats:['qr_code','code_128','code_39','ean_13','ean_8','codabar','itf','upc_a','upc_e']}); }
    catch(_){ try{ _camDetector=new window.BarcodeDetector(); }catch(__){ _camDetector=null; } }
  }
  if(!_camDetector) toast('Kamera menyala. Browser ini belum bisa membaca QR sendiri — ketik tokennya di bawah.');
  else _camLoop=setInterval(bacaFrame,350);
}
function matikanKamera(){
  clearInterval(_camLoop); _camLoop=null; _camDetector=null; _camTerakhir='';
  if(_camStream){_camStream.getTracks().forEach(t=>t.stop());_camStream=null;}
  const box=document.getElementById('cam_box'), btn=document.getElementById('cam_btn');
  if(box)box.style.display='none';
  if(btn)btn.textContent='📷 Nyalakan Kamera';
}
async function bacaFrame(){
  const vid=document.getElementById('cam_video');
  if(!vid||!_camDetector||vid.readyState<2)return;
  let hasil=[];
  try{ hasil=await _camDetector.detect(vid); }catch(_){ return; }
  if(!hasil.length)return;
  const token=(hasil[0].rawValue||'').trim();
  if(!token||token===_camTerakhir)return;   // jangan proses QR yang sama berulang
  _camTerakhir=token;
  if(navigator.vibrate)navigator.vibrate(60);
  clearInterval(_camLoop); _camLoop=null;   // jeda memindai selama konfirmasi
  konfirmasiScan(token);
}
/* Konfirmasi dulu, baru check-in. Petugas perlu mencocokkan nama di layar
   dengan orang di depannya — QR bisa saja diteruskan ke orang lain. */
function konfirmasiScan(token){
  const tk=DB.tickets.find(t=>t.qr_token===token);
  const lanjutMemindai=()=>{ if(_camStream&&_camDetector&&!_camLoop)_camLoop=setInterval(bacaFrame,350); };
  if(!tk||tk.status==='Cancelled'){
    modal(`<button class="close" onclick="closeModal();lanjutScan()">×</button><h3 style="color:var(--red)">✗ Tiket Tidak Valid</h3>
    <p class="mini">QR tidak dikenal atau tiketnya sudah dibatalkan.</p>
    <div class="modal-actions"><button class="btn" onclick="closeModal();lanjutScan()">Pindai Lagi</button></div>`);
    return;
  }
  const o=DB.orders.find(x=>x.id===tk.order_item_id);
  const c=DB.ticketClasses.find(x=>x.id===tk.ticket_class_id);
  const seat=tk.seat_id?DB.seats.find(s=>s.id===tk.seat_id):null;
  if(tk.status==='Checked-In'){
    const ci=DB.checkins.find(c2=>c2.ticket_id===tk.id);
    modal(`<button class="close" onclick="closeModal();lanjutScan()">×</button><h3 style="color:var(--accent)">⚠ Sudah Check-In</h3>
    <div class="kv"><div class="k">Nama</div><div><b>${esc(o.buyer_name)}</b></div><div class="k">Tiket</div><div>${esc(tk.ticket_number)}</div><div class="k">Masuk pada</div><div>${ci?fmtDateTime(ci.checked_in_at):'-'}</div></div>
    <p class="mini" style="margin-top:10px">Tiket ini sudah dipakai masuk. Jangan diloloskan lagi tanpa pengecekan.</p>
    <div class="modal-actions"><button class="btn" onclick="closeModal();lanjutScan()">Pindai Lagi</button></div>`);
    return;
  }
  const seatTxt=seat?esc(seat.seat_no||seat.table_no)+(seat.zone==='Lantai 1'?' (Meja '+esc(seat.table_no)+')':''):'Standing';
  // AUTO: tiket jelas valid & belum masuk → langsung check-in, tanpa tombol.
  if(_autoCheckin){
    checkinTiket(tk);
    if(navigator.vibrate)navigator.vibrate([40,40,80]);
    const kartu=`<div class="card" style="border-color:var(--green)"><h3 style="color:var(--green);margin:0 0 8px">✓ ${esc(o.buyer_name)} masuk</h3>
      <div class="kv"><div class="k">Tiket</div><div>${esc(tk.ticket_number)}</div><div class="k">Class</div><div>${c?esc(c.name):'-'}</div><div class="k">Seat</div><div>${seatTxt}</div><div class="k">Jam</div><div>${fmtDateTime(new Date().toISOString())}</div></div></div>`;
    if(_camStream){ showScanResult(kartu); toast('✓ '+o.buyer_name+' masuk'); lanjutScanNanti(); }
    else { renderCheckin(); showScanResult(kartu); }
    return;
  }
  modal(`<button class="close" onclick="closeModal();lanjutScan()">×</button><h3 style="color:var(--green)">✓ Tiket Valid</h3>
  <p class="mini" style="margin-bottom:12px">Cocokkan dengan orang di depan kamu, lalu konfirmasi.</p>
  <div class="kv">
    <div class="k">Nama</div><div><b style="font-size:16px">${esc(o.buyer_name)}</b></div>
    <div class="k">Kontak</div><div>${esc(o.phone)}</div>
    <div class="k">Tiket</div><div>${esc(tk.ticket_number)}</div>
    <div class="k">Class</div><div>${c?esc(c.name):'-'}</div>
    <div class="k">Seat</div><div>${seatTxt}</div>
  </div>
  <div class="modal-actions"><button class="btn danger" onclick="closeModal();lanjutScan()">Bukan Orangnya</button><button class="btn" onclick="konfirmasiMasuk('${tk.id}')">Konfirmasi Masuk</button></div>`);
}
function lanjutScan(){ _camTerakhir=''; if(_camStream&&_camDetector&&!_camLoop)_camLoop=setInterval(bacaFrame,350); }
function konfirmasiMasuk(tid){
  const tk=DB.tickets.find(t=>t.id===tid); if(!tk)return;
  tk.status='Checked-In';
  DB.checkins.push({id:uid(),ticket_id:tk.id,checked_in_at:new Date().toISOString(),staff:DB.role,gate:'Main',result:'Valid'});
  save();closeModal();
  const o=DB.orders.find(x=>x.id===tk.order_item_id);
  toast('✓ '+o.buyer_name+' masuk — occupancy diperbarui.');
  const kamera=!!_camStream;
  renderCheckin();
  // renderCheckin menggambar ulang <video>, jadi kamera dinyalakan lagi.
  if(kamera){ matikanKamera(); setTimeout(toggleKamera,150); }
}
function doScan(token){
  token=(token||'').trim();
  if(!token){toast('Token masih kosong.');return;}
  konfirmasiScan(token);
}

let calMonth=new Date();let calFilter='all';
function renderCalendar(){
  setTop('Event Calendar','Kalender terpadu multi-sumber','');
  const y=calMonth.getFullYear(),m=calMonth.getMonth();
  const startDow=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();const todayStr=dstr(new Date());
  // aggregate items
  const items={};// date -> [{title,color,type}]
  const push=(date,title,color,type)=>{if(calFilter!=='all'&&calFilter!==type)return;(items[date]=items[date]||[]).push({title,color,type});};
  DB.events.forEach(e=>push(e.start_datetime.slice(0,10),e.poster+' '+e.title,'yellow','Event'));
  DB.schedules.forEach(s=>{const t=DB.talents.find(x=>x.id===s.talent_id);push(s.date,'🎤 '+(t?t.name:''),'green','Entertainment');});
  DB.calendarExtra.forEach(x=>push(x.date,x.title,x.color==='purple'?'purple':x.color==='orange'?'orange':x.color==='red'?'red':'blue',x.type));
  let cells='';for(let i=0;i<startDow;i++)cells+='<div class="cell other"></div>';
  for(let d=1;d<=days;d++){const ds=dstr(new Date(y,m,d));const its=items[ds]||[];cells+=`<div class="cell ${ds===todayStr?'today':''}"><div class="dn">${d}</div>${its.slice(0,4).map(it=>`<span class="evt-dot b-${it.color}">${esc(it.title)}</span>`).join('')}${its.length>4?`<span class="mini">+${its.length-4} lagi</span>`:''}</div>`;}
  const types=['all','Event','Entertainment','Reservation','Marketing','Holiday','Birthday'];
  C().innerHTML=`<div class="toolbar"><button class="btn ghost sm" onclick="calMonth=new Date(${y},${m-1},1);renderCalendar()">‹</button><b style="min-width:140px;text-align:center">${MONTHS[m]} ${y}</b><button class="btn ghost sm" onclick="calMonth=new Date(${y},${m+1},1);renderCalendar()">›</button>
  <select onchange="calFilter=this.value;renderCalendar()" style="width:auto">${types.map(t=>`<option value="${t}" ${calFilter===t?'selected':''}>${t==='all'?'Semua tipe':t}</option>`).join('')}</select></div>
  <div class="legend"><span><i class="dotc" style="background:var(--accent)"></i>Event</span><span><i class="dotc" style="background:var(--green)"></i>Talent</span><span><i class="dotc" style="background:var(--purple)"></i>Reservation</span><span><i class="dotc" style="background:var(--orange)"></i>Marketing</span><span><i class="dotc" style="background:var(--red)"></i>Holiday</span><span><i class="dotc" style="background:var(--blue)"></i>Birthday</span></div>
  <div class="cal">${DOW.map(d=>`<div class="dow">${d}</div>`).join('')}${cells}</div>`;
}

/* ============ IDEA BANK ============ */
const IDEA_CATS=['Music','Community','Food','Competition','Family','Kids','Education','Business','Religious','Festival'];
const FREQS=['Weekly','Biweekly','Monthly','Quarterly','Yearly','One Time'];
let ideaFilter={cat:'',freq:''};
function renderIdeas(){
  setTop('Event Idea Bank','Database ide event + evaluasi','<button class="btn" onclick="ideaForm()">+ Ide Baru</button>');
  let list=DB.ideas.filter(i=>(!ideaFilter.cat||i.category===ideaFilter.cat)&&(!ideaFilter.freq||i.frequency===ideaFilter.freq));
  C().innerHTML=`<div class="toolbar">
    <select onchange="ideaFilter.cat=this.value;renderIdeas()"><option value="">Semua kategori</option>${IDEA_CATS.map(c=>`<option ${ideaFilter.cat===c?'selected':''}>${c}</option>`).join('')}</select>
    <select onchange="ideaFilter.freq=this.value;renderIdeas()"><option value="">Semua frekuensi</option>${FREQS.map(f=>`<option ${ideaFilter.freq===f?'selected':''}>${f}</option>`).join('')}</select>
    <span class="pill">${list.length} ide</span></div>
  <div class="grid g3">${list.map(i=>{const ev=i.evaluations[0];const roi=i.budget?Math.round((i.potential_revenue-i.budget)/i.budget*100):0;return `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:start"><b>${esc(i.name)}</b><span class="badge b-blue">${i.category}</span></div>
    <div class="mini" style="margin:6px 0">${esc(i.description)}</div>
    <div class="kv" style="font-size:12px"><div class="k">Target</div><div>${esc(i.target_market)}</div><div class="k">Budget</div><div>${IDR(i.budget)}</div><div class="k">Potensi</div><div>${IDR(i.potential_revenue)} <span class="mini">(ROI ~${roi}%)</span></div><div class="k">Frekuensi</div><div>${i.frequency}</div><div class="k">Difficulty</div><div>${statusBadge(i.difficulty==='Easy'?'Active':i.difficulty==='Hard'?'Rejected':'Waiting')} ${i.difficulty}</div></div>
    ${ev?`<div class="mini" style="margin-top:6px;color:var(--green)">✓ Pernah dibuat — omzet ${IDR(ev.omzet)}, ${ev.attendance} hadir, skor ${ev.score}/10</div>`:'<div class="mini" style="margin-top:6px">Belum pernah dieksekusi</div>'}
    <div style="margin-top:10px;display:flex;gap:6px"><button class="btn blue sm" onclick="spawnEvent('${i.id}')">→ Buat Event</button>${!ev?`<button class="btn ghost sm" onclick="evalIdea('${i.id}')">+ Evaluasi</button>`:''}</div>
  </div>`;}).join('')||'<div class="empty">Tidak ada ide.</div>'}</div>`;
}
function ideaForm(){
  modal(`<button class="close" onclick="closeModal()">×</button><h3>Ide Event Baru</h3>
  <div class="grid g2">
    <div class="field"><label>Nama</label><input id="i_name"></div>
    <div class="field"><label>Kategori</label><select id="i_cat">${IDEA_CATS.map(c=>`<option>${c}</option>`).join('')}</select></div>
    <div class="field"><label>Target Market</label><input id="i_target"></div>
    <div class="field"><label>Frekuensi</label><select id="i_freq">${FREQS.map(f=>`<option>${f}</option>`).join('')}</select></div>
    <div class="field"><label>Budget (IDR)</label>${uangInput('i_budget',10000000)}</div>
    <div class="field"><label>Potensi Revenue</label>${uangInput('i_rev',20000000)}</div>
    <div class="field"><label>Difficulty</label><select id="i_diff"><option>Easy</option><option>Medium</option><option>Hard</option></select></div>
  </div>
  <div class="field"><label>Deskripsi</label><textarea id="i_desc" rows="2"></textarea></div>
  <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn" onclick="saveIdea()">Simpan</button></div>`,true);
}
function saveIdea(){const g=x=>document.getElementById(x).value;const name=g('i_name').trim();if(!name){toast('Nama wajib.');return;}DB.ideas.push({id:uid(),name,description:g('i_desc'),category:g('i_cat'),target_market:g('i_target'),budget:+g('i_budget'),potential_revenue:+g('i_rev'),difficulty:g('i_diff'),frequency:g('i_freq'),ever_executed:false,evaluations:[]});save();closeModal();renderIdeas();toast('Ide tersimpan.');}
/* Evaluasi dulu diisi lewat empat prompt() beruntun — tidak bisa mundur,
   tidak kelihatan sudah sampai mana, dan batal di tengah membuang semuanya.
   Sekarang satu form utuh yang bisa dilihat sekaligus. */
function evalIdea(id){
  const i=DB.ideas.find(x=>x.id===id);
  modal(`<button class="close" onclick="closeModal()">×</button><h3>Evaluasi — ${esc(i.name)}</h3>
  <p class="mini" style="margin-bottom:12px">Diisi setelah event-nya berjalan. Dipakai untuk menilai apakah ide ini layak diulang.</p>
  <div class="grid g2">
    <div class="field"><label>Tanggal Pelaksanaan</label><input id="ev_tgl" type="date" value="${dstr(new Date())}"></div>
    <div class="field"><label>Omzet (IDR)</label><input id="ev_omzet" type="number" min="0" value="0"></div>
    <div class="field"><label>Jumlah Hadir</label><input id="ev_att" type="number" min="0" value="0"></div>
    <div class="field"><label>Biaya Aktual (IDR)</label><input id="ev_biaya" type="number" min="0" value="${+i.budget||0}"></div>
    <div class="field"><label>Skor Keseluruhan (1–10)</label><input id="ev_score" type="number" min="1" max="10" value="7"></div>
    <div class="field"><label>Layak Diulang?</label><select id="ev_ulang"><option>Ya</option><option>Perlu perbaikan</option><option>Tidak</option></select></div>
  </div>
  <div class="field"><label>Yang Berjalan Baik</label><textarea id="ev_plus" rows="2" placeholder="mis. antusiasme tinggi, sponsor puas"></textarea></div>
  <div class="field"><label>Yang Perlu Diperbaiki</label><textarea id="ev_minus" rows="2" placeholder="mis. sound telat, parkir penuh"></textarea></div>
  <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn" onclick="simpanEval('${id}')">Simpan Evaluasi</button></div>`,true);
}
function simpanEval(id){
  const g=x=>document.getElementById(x).value;
  const score=+g('ev_score');
  if(score<1||score>10){toast('Skor harus 1–10.');return;}
  const omzet=+g('ev_omzet')||0, biaya=+g('ev_biaya')||0;
  const i=DB.ideas.find(x=>x.id===id);
  i.evaluations.push({executed:'Ya',tanggal:g('ev_tgl'),omzet,biaya,profit:omzet-biaya,
    attendance:+g('ev_att')||0,score,ulang:g('ev_ulang'),
    plus:g('ev_plus').trim(),minus:g('ev_minus').trim(),
    feedback:[g('ev_plus').trim(),g('ev_minus').trim()].filter(Boolean).join(' | '),
    at:new Date().toISOString()});
  i.ever_executed=true;save();closeModal();renderIdeas();
  toast('✓ Evaluasi tersimpan — profit '+IDR(omzet-biaya)+'.');
}
/* Dulu tombol ini langsung membuat event dan melempar ke Event Management,
   jadi tanggalnya terlanjur "hari ini" dan harus dibetulkan belakangan.
   Sekarang form event dibuka lebih dulu dengan isian dari ide, dan
   tanggalnya wajib ditentukan sebelum tersimpan. */
function spawnEvent(id){
  const i=DB.ideas.find(x=>x.id===id); if(!i)return;
  window._dariIde=id;
  const awal={category:i.category==='Music'?'Music':i.category==='Festival'?'Festival':'Community',
              status:'Draft',poster:'💡',capacity:100,
              title:i.name,theme:'',venue:'',
              description:'<p>'+esc(i.description||'')+'</p>'};
  eventForm(null,awal);
  toast('Lengkapi tanggal & venue-nya, lalu Simpan.');
}

/* ============ EVENT HISTORY ============ */
let histFilter={year:'',cat:''};
function renderHistory(){
  setTop('Event History','Arsip event selesai (read-only)','');
  let list=DB.events.filter(e=>e.status==='Finished');
  const years=[...new Set(list.map(e=>e.start_datetime.slice(0,4)))];
  if(histFilter.year)list=list.filter(e=>e.start_datetime.startsWith(histFilter.year));
  if(histFilter.cat)list=list.filter(e=>e.category===histFilter.cat);
  C().innerHTML=`<div class="toolbar">
    <select onchange="histFilter.year=this.value;renderHistory()"><option value="">Semua tahun</option>${years.map(y=>`<option ${histFilter.year===y?'selected':''}>${y}</option>`).join('')}</select>
    <select onchange="histFilter.cat=this.value;renderHistory()"><option value="">Semua kategori</option>${EVT_CATS.map(c=>`<option ${histFilter.cat===c?'selected':''}>${c}</option>`).join('')}</select>
    <span class="pill">${list.length} event</span></div>
  <div class="grid g3">${list.map(e=>{const idea=e.idea_id?DB.ideas.find(i=>i.id===e.idea_id):null;const ev=idea&&idea.evaluations[0];return `<div class="ecard" onclick="location.hash='#/history/${e.id}'"><div class="cover">${e.poster}</div><div class="body"><div class="t">${esc(e.title)}</div><div class="meta">📅 ${fmtDate(e.start_datetime)}</div>${ev?`<div class="meta" style="color:var(--accent)">💰 ${IDR(ev.omzet)} · 👥 ${ev.attendance} · ⭐ ${ev.score}/10</div>`:'<div class="meta">Evaluasi belum ada</div>'}</div></div>`;}).join('')||'<div class="empty">Belum ada event selesai.</div>'}</div>`;
}
function renderHistoryDetail(id){
  const e=DB.events.find(x=>x.id===id);if(!e){location.hash='#/history';return;}
  const idea=e.idea_id?DB.ideas.find(i=>i.id===e.idea_id):null;const ev=idea&&idea.evaluations[0];
  const d=DB.eventDetails[id];
  setTop(e.title,'<a href="#/history" style="color:var(--accent)">History</a> / '+esc(e.title),statusBadge('Finished'));
  C().innerHTML=`<div style="display:flex;gap:16px;align-items:center;margin-bottom:16px"><div class="poster-head">${posterKecilHTML(e,54)}</div><div><h3 style="font-size:20px">${esc(e.title)}</h3><span class="mini">${e.category} · ${esc(e.venue)} · ${fmtDate(e.start_datetime)}</span></div></div>
  <div class="grid g2"><div class="card"><h3 class="sec">📊 Hasil</h3><div class="kv">
    <div class="k">Omzet</div><div><b>${ev?IDR(ev.omzet):'—'}</b></div>
    <div class="k">Attendance</div><div>${ev?ev.attendance+' orang':'—'}</div>
    <div class="k">Score</div><div>${ev?ev.score+'/10':'—'}</div>
    <div class="k">Feedback</div><div>${ev?esc(ev.feedback):'—'}</div>
  </div></div>
  <div class="card"><h3 class="sec">🖼️ Media & Evaluasi</h3><div class="grid g3">${['📷','🎥','📸'].map(m=>`<div class="card" style="background:var(--panel2);text-align:center;font-size:28px">${m}</div>`).join('')}</div>
    <div class="kv" style="margin-top:12px"><div class="k">Problem</div><div>Sound sistem kurang di area belakang.</div><div class="k">Improvement</div><div>Upgrade PA system + tambah stage monitor.</div></div></div></div>
  ${d&&d.budget.length?`<div class="card" style="margin-top:16px"><h3 class="sec">💰 P/L</h3><table><thead><tr><th>Item</th><th>Tipe</th><th>Actual</th></tr></thead><tbody>${d.budget.map(b=>`<tr><td>${esc(b.item)}</td><td>${b.type}</td><td>${IDR(b.actual)}</td></tr>`).join('')}</tbody></table></div>`:''}`;
}

/* ============ INIT ============
   Data datang dari server, jadi boot-nya asinkron. Kalau server tidak bisa
   dihubungi, JANGAN diam-diam jalan dengan data kosong — nanti dikira datanya
   hilang. Tampilkan layar gagal + tombol coba lagi. */
/* Identitas & logo di sidebar — disamakan dengan Marketing/Reservasi.
   Nama diambil dari sesi Office (guard SSO di <head> sudah memastikan sesinya
   ada dan berhak), jadi tidak perlu login terpisah di modul ini. */
/* Nama kru yang sedang login — dipakai sebagai jejak siapa yang mencatat
   penjualan. Sumbernya sesi Office yang sama dengan blok pengguna di sidebar. */
function namaKru(){
  let s=null; try{ s=JSON.parse(localStorage.getItem('lm_session')||'null'); }catch(_){}
  return (s&&s.name)||'Kru';
}
function paintSideUser(){
  let s=null; try{ s=JSON.parse(localStorage.getItem('lm_session')||'null'); }catch(_){}
  const nama=(s&&s.name)||'Kru';
  const av=document.getElementById('su-avatar'); if(av)av.textContent=initials(nama);
  const un=document.getElementById('su-un');     if(un)un.textContent=nama;
  const ur=document.getElementById('su-ur');     if(ur)ur.textContent=DB&&DB.role?DB.role:'Kru';
  const lg=document.getElementById('brand-logo');if(lg)lg.src=window.__ICON__;
}
// "Keluar" = kembali ke portal Office. Sesi Office sengaja TIDAK dihapus:
// modul lain memakainya juga, jadi menghapusnya di sini akan memaksa kru
// login ulang hanya karena menutup EMS.
function logout(){ location.replace('../'); }

(async function init(){
  try{
    await load();
    paintSideUser();
    if(!location.hash)location.hash='#/dashboard';
    router();
  }catch(e){
    document.getElementById('content').innerHTML=
      '<div class="card" style="border-color:var(--red);max-width:620px;margin:40px auto">'+
      '<h3 class="sec" style="color:var(--red)">Tidak bisa memuat data</h3>'+
      '<p class="mini">Server EMS tidak merespons, jadi tidak ada yang ditampilkan.<br>'+
      'Data kamu <b>aman di database</b> — ini cuma gagal memuat, bukan data hilang.</p>'+
      '<div class="kv" style="margin-top:12px"><div class="k">Alamat API</div><div class="mini">'+esc(API_URL)+'</div>'+
      '<div class="k">Pesan</div><div class="mini">'+esc(e.message)+'</div></div>'+
      '<div class="modal-actions"><button class="btn" onclick="location.reload()">Coba lagi</button></div></div>';
    document.getElementById('pageTitle').textContent='Gagal memuat';
  }
})();


</script>
