/* ---------- menggambar ---------- */
function ldzStatusCls(it){ return seatCls(it); }   // available | locked | sold | checked
function ldzItemHTML(it,edit){
  const T=ldzTierInfo(it.event_id,it.tier);
  const st=ldzStatusCls(it);
  const isi=(st==='sold'||st==='checked');
  const sel=(edit&&ldzIsSel(it.id))?' sel':'';
  /* Isian SOLID untuk semua bentuk — persegi maupun bulat. Sebelumnya objek
     yang belum terjual diisi warna tier 15% opasitas: di kanvas putih, Silver
     dan Regular praktis sama-sama abu-abu pucat dan tidak bisa dibedakan.
     Sekarang warna tier dipakai penuh, tulisannya putih. */
  /* Area digambar netral abu-abu dan tidak pernah memakai warna kategori:
     kalau ikut berwarna, panggung terbaca seperti blok kursi termahal. */
  /* Warna ruang menang atas warna kategori untuk AREA dan meja EXT: keduanya
     bukan tempat duduk yang dijual per kelas, jadi memberinya warna kategori
     justru menyesatkan — EXT pernah tampil semerah blok VIP. Kursi & meja biasa
     tetap memakai warna kategori tiketnya. */
  const ruang=(ldzAdalahArea(it)||/^ext/i.test(String(it.table_no||'')))?ldzWarnaRuang(it):null;
  const wr=ruang
    ? ruang
    : (ldzAdalahArea(it)
        ? {bg:'#b9b4ac',tepi:'#8d8880',teks:'#2b2721'}
        : ldzWarnaObjek(it,T.c,isi));
  /* Zona REGULER digambar BERPETAK, meniru denah cetak yang memenuhi area itu
     dengan deretan kotak kursi. Dibuat sebagai pola isian, bukan ratusan objek
     kecil: yang dibutuhkan cuma tampilannya — kursinya sendiri memang tidak
     bernomor dan tidak dijual satu-satu, jadi menaruh 300 objek di sana hanya
     memberatkan kanvas tanpa menambah satu pun kemampuan. */
  const petak=(ldzAdalahArea(it)&&it.pola==='petak');
  let sty='left:'+(+it.x||0)+'px;top:'+(+it.y||0)+'px;width:'+(+it.w||40)+'px;height:'+(+it.h||40)+'px;'
    +'border-color:'+wr.tepi+';background:'+wr.bg+';color:'+wr.teks+';';
  if(petak){
    const g=+it.petak||26;      // sisi satu petak (px kanvas)
    sty+='background-image:linear-gradient(rgba(50,45,35,.7) 2px,transparent 2px),'
       +'linear-gradient(90deg,rgba(50,45,35,.7) 2px,transparent 2px);'
       +'background-size:'+g+'px '+g+'px;background-position:3px 3px;';
  }
  const cap=(+it.capacity||1)>1?'<small>'+(+it.capacity)+' pax</small>':'';
  const judul=(it.kind==='table'?'Meja ':'Kursi ')+(it.table_no||'')+' · '+it.tier+' · '
    +(st==='checked'?'sudah check-in':st==='sold'?'terjual':st==='locked'?'hold':'tersedia');
  /* Mode read-only (window._denahRO, dipakai Live Occupancy saat acara jalan):
     denah hanya untuk MELIHAT status kedatangan — tanpa klik supaya tidak ada
     status yang tak sengaja berputar di tengah acara. */
  let aksi='';
  if(edit) aksi=' onpointerdown="ldzDown(event,\''+it.id+'\',\'move\')" ondblclick="ldzRename(\''+it.id+'\')"';
  else if(ldzAdalahArea(it)){ sty+='cursor:default;'; }
  else if(window._beliMode||ldzJualAktif()){
    // Layar penjualan / mode jual di tab Layout: klik = pilih atau lepas.
    aksi=' onclick="beliToggleSeat(\''+it.event_id+'\',\''+it.id+'\')"'; sty+='cursor:pointer;';
    if(beliSel().indexOf(it.id)>=0) sty+='box-shadow:0 0 0 3px var(--accent);';
  }
  else if(window._denahRO) sty+='cursor:default;';
  else { aksi=' onclick="toggleSeat(\''+it.event_id+'\',\''+it.id+'\')"'; sty+='cursor:pointer;'; }
  // Ambang 26px: di bawah itu tiga angka tidak muat pada font normal.
  const kecil=((+it.w||40)<=26||(+it.h||40)<=26)?' kecil':'';
  return '<div class="ldz-item '+it.shape+' '+st+(edit?' edit':'')+sel+kecil+'" id="ldz_'+it.id+'" style="'+sty+'" title="'+esc(judul)+'"'+aksi+'>'
    +esc(it.table_no||'')+cap+'</div>';
}
// Kotak pilihan + 8 pegangan. Ukuran pegangan dibagi zoom supaya tetap enak
// ditekan baik saat kanvas diperkecil maupun diperbesar.
function ldzSelBoxHTML(){
  const items=ldzSelItems(); const b=ldzBBox(items); if(!b) return '';
  const z=ldzZoom(), s=Math.max(6,Math.round(9/z)), o=-s/2, bw=Math.max(1,1/z);
  const dirs=[['nw',0,0],['n',.5,0],['ne',1,0],['w',0,.5],['e',1,.5],['sw',0,1],['s',.5,1],['se',1,1]];
  return '<div class="ldz-selbox" style="left:'+b.x+'px;top:'+b.y+'px;width:'+b.w+'px;height:'+b.h+'px;border-width:'+bw+'px">'
    +dirs.map(function(d){
      return '<i class="ldz-h h-'+d[0]+'" style="width:'+s+'px;height:'+s+'px;left:'+(b.w*d[1]+o)+'px;top:'+(b.h*d[2]+o)+'px;border-width:'+bw+'px"'
        +' onpointerdown="ldzDown(event,null,\'size:'+d[0]+'\')"></i>';
    }).join('')+'</div>';
}
/* Blok-seret berlaku di DUA keadaan: menyusun denah (Mode Desain) dan memilih
   kursi untuk dipesan (Mode Jual). Menyeret di ruang KOSONG tidak punya arti
   lain di keadaan mana pun, jadi tidak ada yang dikorbankan — sementara
   memblok enam kursi sekaligus lalu menekan Booking adalah cara paling cepat
   melayani rombongan. */
/* ---- JENIS OBJEK "AREA": zona berlabel yang TIDAK dijual ----
   Denah venue tidak seluruhnya berisi kursi: ada panggung, meja DJ, ruang
   talent, tangga, dan yang paling penting zona REGULER yang memang dijual
   tanpa nomor kursi. Sebelumnya hanya ada kursi & meja, jadi hal-hal itu tidak
   bisa digambar sama sekali \u2014 padahal tanpa panggung, petugas tidak bisa
   membaca arah hadap denah.

   Area sengaja tidak punya kapasitas dan tidak pernah bisa dipesan: ia penanda
   ruang, bukan tempat duduk bernomor. Kuota zona reguler tetap diatur sebagai
   kelas tiket non-seated di tab Ticket Class. */
function ldzAdalahArea(it){ return !!it && it.kind==='area'; }
/* ---- WARNA PER JENIS RUANG ----
   Semua area dulu abu-abu sama rata, jadi panggung, tangga, ruang talent, dan
   zona reguler tidak bisa dibedakan tanpa membaca tulisannya satu-satu — padahal
   denah dipakai justru untuk membaca ruangan dalam sekali lihat.

   Warnanya dipilih dari maknanya, bukan sekadar supaya beda: panggung gelap
   (pusat perhatian, bukan tempat dijual), pintu masuk oranye seperti rambu
   keluar-masuk di denah cetak, tangga cokelat kayu, ruang talent ungu (area
   tertutup), zona reguler biru baja (dijual, tapi tanpa nomor), void nyaris
   putih karena ia memang lubang lantai. EXT memakai kuning bergaris merah,
   persis penandaan di denah cetak.

   Dicocokkan dari LABELNYA, jadi denah yang sudah digambar sebelum ini pun ikut
   berwarna tanpa perlu diapa-apakan. Satu objek boleh memakai warnanya sendiri
   lewat field `warna` — itu yang diisi pemilih warna di panel kanan. */
const LDZ_RUANG=[
  [/^stage$|panggung/i,        {bg:'#3f4a5a', tepi:'#2b3340'}],
  [/^meja ?dj$/i,              {bg:'#a9791f', tepi:'#7a560f'}],
  [/talent/i,                  {bg:'#6d5aa8', tepi:'#4e3f80'}],
  [/entrance|masuk|keluar/i,   {bg:'#e08a1e', tepi:'#a86212'}],
  [/tangga/i,                  {bg:'#8a6242', tepi:'#63452e'}],
  [/operator|foh/i,            {bg:'#2f3a4a', tepi:'#1d2530'}],
  [/^void/i,                   {bg:'#eceae4', tepi:'#c9c4b8'}],
  [/reguler|regular/i,         {bg:'#5b7fa6', tepi:'#3f5d7d'}],
  [/^ext/i,                    {bg:'#f2c14e', tepi:'#c9432b'}]
];
// Tulisan hitam atau putih, dipilih dari kecerahan latarnya sendiri supaya
// kontrasnya aman tanpa perlu diatur satu-satu.
function ldzTeksKontras(hex){
  const n=parseInt(String(hex).replace('#',''),16);
  const L=(0.299*((n>>16)&255)+0.587*((n>>8)&255)+0.114*(n&255))/255;
  return L>0.62?'#241f18':'#fff';
}
function ldzWarnaRuang(it){
  if(!it) return null;
  if(it.warna) return {bg:it.warna, tepi:ldzGelap(it.warna,0.7), teks:ldzTeksKontras(it.warna)};
  const lbl=String(it.table_no||'');
  for(let i=0;i<LDZ_RUANG.length;i++){
    if(LDZ_RUANG[i][0].test(lbl)){
      const w=LDZ_RUANG[i][1];
      return {bg:w.bg, tepi:w.tepi, teks:ldzTeksKontras(w.bg)};
    }
  }
  return null;
}
function ldzBolehBlok(){ return !!window._ldzEdit || ldzJualAktif(); }
function ldzCanvasInner(eid,edit){
  const L=ldzMeta(eid), its=ldzItems(eid);
  const bg=L.bg?'<div class="ldz-bg" style="background-image:url(\''+fileUrl(L.bg.key)+'\');opacity:'+((+L.bgOpacity||70)/100)+'"></div>':'';
  return bg+its.map(function(i){ return ldzItemHTML(i,edit); }).join('')
    +(edit?ldzSelBoxHTML():'')
    /* Kotak seleksi perlu wadah kosong untuk digambar. Tanpa ini seretan tetap
       memilih objek tapi tidak menampilkan apa pun, dan itu terbaca sebagai
       "fiturnya tidak jalan". */
    +(ldzBolehBlok()?'<div id="ldzMarquee"></div>':'');
}
function ldzCanvasHTML(eid,edit){
  const L=ldzMeta(eid);
  /* Versi ringkas kanvas ini dipakai halaman Penjualan & Check-In, dan DULU
     sama sekali tidak memasang penangan pointer — jadi di Mode Jual, menyeret
     di kanvas tidak terjadi apa-apa. Yang punya penangan hanya kanvas di dalam
     perancang denah; itu sebabnya blok-seret terasa cuma jalan kadang-kadang. */
  const aksi=ldzBolehBlok()?' onpointerdown="ldzCanvasDown(event)"':'';
  const tandai=ldzBolehBlok()?' bisa-blok':'';
  return '<div class="ldz-wrap"><div id="ldzCanvas" class="ldz-canvas'+(L.grid?' grid':'')+tandai+'"'+aksi+' '
    +'style="position:relative;width:'+L.w+'px;height:'+L.h+'px">'+ldzCanvasInner(eid,edit)+'</div></div>';
}
/* Menggambar ulang SATU objek tanpa menyentuh sisa kanvas. Dipakai jalur yang
   berjalan tiap gerakan pointer, jadi harus semurah mungkin: yang diubah cuma
   empat properti gaya, bukan innerHTML.

   Kedua fungsi ini pernah TERHAPUS oleh penggantian blok saat menggarap
   blok-seret — dan akibatnya tiap geseran objek melempar ReferenceError pada
   gerakan pointer pertama, sehingga objeknya terasa berat dan tidak mau
   dipindahkan. Uji blok-seret tidak menangkapnya karena marquee memang tidak
   memanggil keduanya. */
function ldzPaintItem(it){
  const el=document.getElementById('ldz_'+it.id); if(!el) return;
  el.style.left=(+it.x||0)+'px'; el.style.top=(+it.y||0)+'px';
  el.style.width=(+it.w||40)+'px'; el.style.height=(+it.h||40)+'px';
}
function ldzPaintSel(){
  const box=document.getElementById('ldzCanvas'); if(!box) return;
  const old=box.querySelector('.ldz-selbox'); if(old) old.remove();
  const html=ldzSelBoxHTML();
  if(html) box.insertAdjacentHTML('beforeend',html);
}
function ldzPt(e){
  const cv=document.getElementById('ldzCanvas'); if(!cv) return {x:0,y:0};
  const r=cv.getBoundingClientRect(), z=ldzZoom();
  return {x:(e.clientX-r.left)/z, y:(e.clientY-r.top)/z};
}
function ldzSnap(v,L){ const g=L.snap?10:1; return Math.round(v/g)*g; }
/* ================= GARIS BANTU PERATAAN (SMART GUIDES) =================
   Inilah yang membuat draw.io terasa "pas sendiri": saat sebuah objek diseret
   dan tepinya hampir sejajar dengan objek lain, posisinya ditarik agar benar-
   benar sejajar, dan garis tipis muncul menunjukkan sejajar dengan apa.

   Kenapa ini lebih penting daripada snap-ke-grid yang sudah ada: grid 10px
   hanya menjamin objek jatuh di kelipatan 10, bukan bahwa meja baris kedua
   lurus dengan meja baris pertama. Denah venue penuh dengan barisan yang harus
   lurus, dan meluruskannya dengan mata pada zoom 40% mustahil.

   Ambangnya dihitung dalam piksel LAYAR (dibagi zoom), supaya rasa "menempel"
   sama saat kanvas diperbesar maupun diperkecil. */
const LDZ_TARIK=6;
/* Dua elemen garis bantu dibuat SEKALI lalu disembunyikan/digeser. Versi
   sebelumnya menghapus dan membuat ulang elemen tiap gerakan pointer; pada
   denah padat, kelahiran-kematian elemen itu yang terasa sebagai tersendat. */
function ldzGuideEl(arah){
  const c=document.getElementById('ldzCanvas'); if(!c) return null;
  const id='ldzGuide'+arah;
  let g=document.getElementById(id);
  if(!g){ g=document.createElement('div'); g.id=id; g.className='ldz-guide '+arah; c.appendChild(g); }
  return g;
}
function ldzGuideBersih(){
  ['v','h'].forEach(function(a){
    const g=document.getElementById('ldzGuide'+a);
    if(g) g.style.display='none';
  });
}
function ldzGuideGambar(vs,hs){
  const gv=ldzGuideEl('v'), gh=ldzGuideEl('h');
  if(gv){ if(vs.length){ gv.style.display='block'; gv.style.left=vs[0]+'px'; } else gv.style.display='none'; }
  if(gh){ if(hs.length){ gh.style.display='block'; gh.style.top=hs[0]+'px'; } else gh.style.display='none'; }
}
/* Menghitung pergeseran tambahan supaya blok yang sedang diseret menempel ke
   objek lain. Yang dibandingkan tiga garis per sumbu — tepi awal, tengah, tepi
   akhir — jadi objek bisa rata kiri, rata tengah, ataupun rata kanan. */
function ldzTarikSejajar(eid,box,abaikan){
  const amb=LDZ_TARIK/ldzZoom();
  /* SELURUH objek tetap jadi acuan, termasuk yang jauh di atas atau di samping:
     meluruskan meja baris ke-4 dengan baris pertama justru pekerjaan yang paling
     butuh bantuan ini, dan membatasinya dengan radius membuat perataan berhenti
     bekerja tepat saat paling dibutuhkan.

     Sebelumnya sempat saya batasi radius 260px karena menyangka bantuan inilah
     yang membuat objek "susah dipindahkan". Ternyata sebabnya lain dan jauh
     lebih parah: ldzPaintItem/ldzPaintSel terhapus, jadi setiap gerakan pointer
     melempar ReferenceError dan objeknya tidak pernah bergerak. */
  const lain=ldzItems(eid).filter(function(i){ return abaikan.indexOf(i.id)<0; });
  const garisX=[], garisY=[];
  lain.forEach(function(i){
    const x=+i.x||0, y=+i.y||0, w=+i.w||0, h=+i.h||0;
    garisX.push(x, x+w/2, x+w);
    garisY.push(y, y+h/2, y+h);
  });
  const cari=function(nilai,garis){
    let best=null;
    nilai.forEach(function(v){
      garis.forEach(function(g){
        const d=g-v;
        if(Math.abs(d)<=amb && (!best||Math.abs(d)<Math.abs(best.d))) best={d:d,g:g};
      });
    });
    return best;
  };
  const bx=cari([box.x,box.x+box.w/2,box.x+box.w],garisX);
  const by=cari([box.y,box.y+box.h/2,box.y+box.h],garisY);
  return {dx:bx?bx.d:0, dy:by?by.d:0,
          vs:bx?[bx.g]:[], hs:by?[by.g]:[]};
}
function ldzDown(e,id,mode){
  /* Potret riwayat DITUNDA sampai objeknya benar-benar bergeser (lihat ldzUp).
     Sebelumnya diambil di setiap pointerdown — termasuk saat cuma MEMILIH objek
     — dan tiap potret men-stringify seluruh objek lantai itu. Di denah 264
     objek, sekadar mengklik pun ikut membayar biaya itu. */
  if(window._ldzEdit) _ldzPotretTunda=ldzPotret(window._ldzEid);
  if(!window._ldzEdit) return;
  e.preventDefault(); e.stopPropagation();
  const eid=window._ldzEid, L=ldzMeta(eid);
  if(mode==='move'){
    // Klik objek yang belum terpilih = pilih dia saja (kecuali Shift/Ctrl,
    // yang menambah ke pilihan) — perilaku yang sama dengan draw.io.
    if(e.shiftKey||e.ctrlKey||e.metaKey){
      const s=ldzSel().slice(), i=s.indexOf(id);
      if(i>=0) s.splice(i,1); else s.push(id);
      ldzSetSel(s); ldzRepaint(eid);
      if(!ldzIsSel(id)) return;                 // baru saja dilepas → jangan ikut digeser
    } else if(!ldzIsSel(id)){
      ldzSetSel([id]); ldzRepaint(eid);
    }
    const items=ldzSelItems();
    _ldzDrag={mode:'move',sx:e.clientX,sy:e.clientY,moved:false,L,
      asal:items.map(function(i){ return {id:i.id,x:+i.x||0,y:+i.y||0}; })};
  } else if(mode.indexOf('size:')===0){
    const items=ldzSelItems(), b=ldzBBox(items); if(!b) return;
    _ldzDrag={mode:'size',dir:mode.slice(5),sx:e.clientX,sy:e.clientY,moved:false,L,b0:b,
      asal:items.map(function(i){ return {id:i.id,x:+i.x||0,y:+i.y||0,w:+i.w||LDZ_MIN,h:+i.h||LDZ_MIN}; })};
  }
  window.addEventListener('pointermove',ldzMove);
  window.addEventListener('pointerup',ldzUp);
}
// Seret di area kosong = kotak seleksi. Tanpa Shift, pilihan lama diganti.
function ldzCanvasDown(e,dariPanggung){
  if(!ldzBolehBlok()){
    /* Diam-diam tidak melakukan apa pun adalah jawaban terburuk: orang mengira
       fiturnya rusak, bukan bahwa modenya belum dinyalakan. Diberitahu sekali
       saja per halaman supaya tidak jadi gangguan. */
    if(!window._ldzPernahIngat){
      window._ldzPernahIngat=true;
      toast('Nyalakan Mode Desain (atau Pilih Kursi di Denah) dulu untuk memblok dengan seret.');
    }
    return;
  }
  const t=e.target;
  const bolehMulai = dariPanggung || !t
    || t.id==='ldzCanvas'
    || (t.classList && (t.classList.contains('ldz-bg')||t.classList.contains('ldz-sizer')||t.classList.contains('ldz-stage')));
  if(!bolehMulai) return;
  // Menaruh bentuk dari palet lewat sekali klik (mode "armed").
  if(window._ldzArm){
    const p=ldzPt(e), a=window._ldzArm; window._ldzArm=null;
    const st=document.getElementById('ldzStage'); if(st) st.classList.remove('placing');
    ldzBuat(window._ldzEid,a.kind,a.shape,p.x,p.y);
    return;
  }
  e.preventDefault();
  const p=ldzPt(e);
  const jual=ldzJualAktif();
  _ldzDrag={mode:'marquee',jual:jual,sx:e.clientX,sy:e.clientY,x0:p.x,y0:p.y,moved:false,
    tambah:(e.shiftKey||e.ctrlKey||e.metaKey),awal:(jual?beliSel():ldzSel()).slice()};
  /* Pointer capture: seluruh pointermove & pointerup berikutnya dijamin sampai
     ke elemen ini, bahkan kalau kursornya keluar dari kanvas atau melewati
     objek lain di tengah seretan. Tanpa ini, seretan yang keluar dari area
     kanvas bisa "putus" di tengah jalan dan seleksinya berhenti separuh. */
  try{ if(e.pointerId!=null && e.currentTarget && e.currentTarget.setPointerCapture)
         e.currentTarget.setPointerCapture(e.pointerId); }catch(_){}
  window.addEventListener('pointermove',ldzMove);
  window.addEventListener('pointerup',ldzUp);
  // pointercancel (mis. browser mengambil alih untuk gulir) harus ikut menutup
  // seretan; kalau tidak, _ldzDrag menggantung dan klik berikutnya kacau.
  window.addEventListener('pointercancel',ldzUp);
}
function ldzMove(e){
  if(!_ldzDrag) return;
  const z=ldzZoom();
  const dx=(e.clientX-_ldzDrag.sx)/z, dy=(e.clientY-_ldzDrag.sy)/z;
  if(Math.abs(e.clientX-_ldzDrag.sx)>2||Math.abs(e.clientY-_ldzDrag.sy)>2) _ldzDrag.moved=true;

  if(_ldzDrag.mode==='move'){
    const L=_ldzDrag.L;
    // Digeser sebagai SATU kelompok: pergeseran dihitung dari kotak pilihan,
    // bukan per objek, supaya jarak antar objek tidak berubah saat dibatasi
    // tepi kanvas.
    let gx=ldzSnap(dx,L), gy=ldzSnap(dy,L);
    let minx=Infinity,miny=Infinity,maxx=-Infinity,maxy=-Infinity;
    _ldzDrag.asal.forEach(function(a){
      const it=ldzFind(a.id); if(!it) return;
      minx=Math.min(minx,a.x); miny=Math.min(miny,a.y);
      maxx=Math.max(maxx,a.x+(+it.w||LDZ_MIN)); maxy=Math.max(maxy,a.y+(+it.h||LDZ_MIN));
    });
    gx=Math.max(-minx,Math.min(L.w-maxx,gx));
    gy=Math.max(-miny,Math.min(L.h-maxy,gy));
    /* Tarik-sejajar dijalankan SESUDAH pembatasan tepi kanvas, dan hasilnya
       dibatasi ulang — kalau tidak, tarikan bisa mendorong blok keluar kanvas
       tepat di pinggir. Alt menahan tarikan, kebiasaan yang sama dengan
       aplikasi gambar lain: kadang justru sengaja ingin sedikit meleset. */
    let vs=[], hs=[];
    if(!e.altKey){
      const ids=_ldzDrag.asal.map(function(a){ return a.id; });
      const t=ldzTarikSejajar(window._ldzEid,{x:minx+gx,y:miny+gy,w:maxx-minx,h:maxy-miny},ids);
      if(t.dx){ const g2=Math.max(-minx,Math.min(L.w-maxx,gx+t.dx)); if(g2!==gx){ gx=g2; vs=t.vs; } }
      if(t.dy){ const g3=Math.max(-miny,Math.min(L.h-maxy,gy+t.dy)); if(g3!==gy){ gy=g3; hs=t.hs; } }
    }
    ldzGuideGambar(vs,hs);
    _ldzDrag.asal.forEach(function(a){
      const it=ldzFind(a.id); if(!it) return;
      it.x=a.x+gx; it.y=a.y+gy; ldzPaintItem(it);
    });
    ldzPaintSel();

  } else if(_ldzDrag.mode==='size'){
    const b0=_ldzDrag.b0, d=_ldzDrag.dir, L=_ldzDrag.L;
    let x=b0.x,y=b0.y,w=b0.w,h=b0.h;
    if(d.indexOf('e')>=0) w=b0.w+dx;
    if(d.indexOf('s')>=0) h=b0.h+dy;
    if(d.indexOf('w')>=0){ x=b0.x+dx; w=b0.w-dx; }
    if(d.indexOf('n')>=0){ y=b0.y+dy; h=b0.h-dy; }
    // Shift = jaga rasio (sudut saja; sisi tunggal tidak punya rasio berarti).
    if(e.shiftKey && d.length===2 && b0.w>0 && b0.h>0){
      const f=Math.max(w/b0.w,h/b0.h);
      const nw=b0.w*f, nh=b0.h*f;
      if(d.indexOf('w')>=0) x=b0.x+b0.w-nw;
      if(d.indexOf('n')>=0) y=b0.y+b0.h-nh;
      w=nw; h=nh;
    }
    if(L.snap){ x=ldzSnap(x,L); y=ldzSnap(y,L); w=ldzSnap(w,L); h=ldzSnap(h,L); }
    if(w<LDZ_MIN){ if(d.indexOf('w')>=0) x=b0.x+b0.w-LDZ_MIN; w=LDZ_MIN; }
    if(h<LDZ_MIN){ if(d.indexOf('n')>=0) y=b0.y+b0.h-LDZ_MIN; h=LDZ_MIN; }
    const sx=b0.w?w/b0.w:1, sy=b0.h?h/b0.h:1;
    _ldzDrag.asal.forEach(function(a){
      const it=ldzFind(a.id); if(!it) return;
      it.x=Math.round(x+(a.x-b0.x)*sx);
      it.y=Math.round(y+(a.y-b0.y)*sy);
      it.w=Math.max(LDZ_MIN,Math.round(a.w*sx));
      it.h=Math.max(LDZ_MIN,Math.round(a.h*sy));
      ldzPaintItem(it);
    });
    ldzPaintSel();

  } else if(_ldzDrag.mode==='marquee'){
    const p=ldzPt(e);
    const r={x:Math.min(_ldzDrag.x0,p.x),y:Math.min(_ldzDrag.y0,p.y),
             w:Math.abs(p.x-_ldzDrag.x0),h:Math.abs(p.y-_ldzDrag.y0)};
    /* Kotak seleksi cukup DIGESER lewat style. Versi sebelumnya menulis
       outerHTML tiap gerakan pointer — artinya elemen dibongkar dan dipasang
       ulang puluhan kali per detik, dan di denah padat itu terasa sebagai
       tersendat saat menyeret. */
    const box=document.getElementById('ldzMarquee');
    if(box){
      if(!box.classList.contains('ldz-marquee')) box.className='ldz-marquee';
      box.style.left=r.x+'px'; box.style.top=r.y+'px';
      box.style.width=r.w+'px'; box.style.height=r.h+'px';
    }
    // Bersinggungan (bukan harus termuat penuh) — lebih memaafkan saat menyapu
    // barisan kursi rapat.
    let kena=ldzItems(window._ldzEid).filter(function(i){
      return !((+i.x||0)>r.x+r.w || (+i.x||0)+(+i.w||0)<r.x || (+i.y||0)>r.y+r.h || (+i.y||0)+(+i.h||0)<r.y);
    });
    // Di Mode Jual yang boleh masuk pilihan hanya kursi yang MASIH BISA dijual;
    // menyapu kursi terjual lalu menemukannya ditolak saat simpan jauh lebih
    // menjengkelkan daripada tidak pernah ikut terpilih sejak awal.
    if(_ldzDrag.jual) kena=kena.filter(beliBisaDipilih);
    const ids=kena.map(function(i){ return i.id; });
    const gabung=_ldzDrag.tambah?_ldzDrag.awal.concat(ids.filter(function(k){ return _ldzDrag.awal.indexOf(k)<0; })):ids;
    /* Hanya objek yang BERUBAH status pilihannya disentuh. Sebelumnya seluruh
       objek di lantai itu di-toggle tiap gerakan pointer: pada 264 objek berarti
       264 operasi DOM per gerakan, puluhan kali per detik — itu sumber utama
       delay saat memblok di denah penuh. */
    const sblm=_ldzDrag.terpilih||[];
    const masuk=gabung.filter(function(k){ return sblm.indexOf(k)<0; });
    const keluar=sblm.filter(function(k){ return gabung.indexOf(k)<0; });
    _ldzDrag.terpilih=gabung.slice();
    if(_ldzDrag.jual){
      beliSetSel(gabung);
      masuk.forEach(function(id){ const el=document.getElementById('ldz_'+id); if(el) el.style.boxShadow='0 0 0 3px var(--accent)'; });
      keluar.forEach(function(id){ const el=document.getElementById('ldz_'+id); if(el) el.style.boxShadow=''; });
    } else {
      ldzSetSel(gabung);
      masuk.forEach(function(id){ const el=document.getElementById('ldz_'+id); if(el) el.classList.add('sel'); });
      keluar.forEach(function(id){ const el=document.getElementById('ldz_'+id); if(el) el.classList.remove('sel'); });
    }
  }
}
function ldzUp(){
  window.removeEventListener('pointermove',ldzMove);
  window.removeEventListener('pointerup',ldzUp);
  window.removeEventListener('pointercancel',ldzUp);
  if(!_ldzDrag) return;
  const d=_ldzDrag; _ldzDrag=null;
  const eid=window._ldzEid;
  ldzGuideBersih();
  if(d.mode==='marquee'){
    const m=document.getElementById('ldzMarquee');
    if(m) m.outerHTML='<div id="ldzMarquee"></div>';
    if(d.jual){
      if(!d.moved) beliSetSel(d.tambah?d.awal:[]);   // klik biasa di ruang kosong = lepas pilihan
      renderTicketDetail(eid);                       // bar "n kursi · Booking" ikut diperbarui
      return;
    }
    if(!d.moved) ldzSetSel(d.tambah?d.awal:[]);
    ldzRepaint(eid);
    return;
  }
  if(d.moved){
    // Baru sekarang perubahannya sah masuk riwayat: klik tanpa geser bukan
    // langkah yang perlu dibatalkan.
    ldzRekamPotret(eid,_ldzPotretTunda);
    save(); ldzSideRefresh(eid);
  }
  _ldzPotretTunda=null;
  ldzPaintSel();
}

/* ---------- palet: seret bentuk ke kanvas ---------- */
let _ldzPal=null;
function ldzPalDown(e,kind,shape){
  if(!window._ldzEdit) return;
  e.preventDefault();
  const u=ldzUkuranBaku(kind,shape), z=ldzZoom();
  _ldzPal={kind,shape,u,moved:false,sx:e.clientX,sy:e.clientY};
  const g=document.createElement('div');
  g.className='ldz-ghost'+(shape==='circle'?' circle':'');
  g.style.width=(u.w*z)+'px'; g.style.height=(u.h*z)+'px';
  g.style.left=(e.clientX-u.w*z/2)+'px'; g.style.top=(e.clientY-u.h*z/2)+'px';
  g.id='ldzGhost'; document.body.appendChild(g);
  window.addEventListener('pointermove',ldzPalMove);
  window.addEventListener('pointerup',ldzPalUp);
}
function ldzPalMove(e){
  if(!_ldzPal) return;
  if(Math.abs(e.clientX-_ldzPal.sx)>3||Math.abs(e.clientY-_ldzPal.sy)>3) _ldzPal.moved=true;
  const g=document.getElementById('ldzGhost'); if(!g) return;
  const z=ldzZoom();
  g.style.left=(e.clientX-_ldzPal.u.w*z/2)+'px';
  g.style.top=(e.clientY-_ldzPal.u.h*z/2)+'px';
}
function ldzPalUp(e){
  window.removeEventListener('pointermove',ldzPalMove);
  window.removeEventListener('pointerup',ldzPalUp);
  const g=document.getElementById('ldzGhost'); if(g) g.remove();
  if(!_ldzPal) return;
  const pal=_ldzPal; _ldzPal=null;
  const cv=document.getElementById('ldzCanvas'); if(!cv) return;
  const r=cv.getBoundingClientRect();
  const di=e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;
  if(di){ const p=ldzPt(e); ldzBuat(window._ldzEid,pal.kind,pal.shape,p.x,p.y); return; }
  if(pal.moved) return;                       // diseret keluar kanvas → batal
  /* Sekali klik pada palet (tanpa diseret) = bentuknya "dipegang", lalu klik
     di kanvas menaruhnya. Menyeret tidak selalu nyaman di trackpad/layar
     sentuh, jadi kedua cara disediakan. */
  window._ldzArm={kind:pal.kind,shape:pal.shape};
  const st=document.getElementById('ldzStage'); if(st) st.classList.add('placing');
  toast('Klik di kanvas untuk menaruh '+(pal.kind==='table'?'meja':'kursi')+'.');
}

/* ---------- zoom & pan ---------- */
function ldzSetZoom(eid,z,pusat){
  const st=document.getElementById('ldzStage');
  const lama=ldzZoom();
  z=Math.max(.2,Math.min(4,z));
  window._ldzZoom=z;
  ldzRepaint(eid);
  // Pertahankan titik yang sedang dilihat supaya zoom tidak "melompat".
  const st2=document.getElementById('ldzStage');
  if(st&&st2){
    const cx=(pusat?pusat.x:st.clientWidth/2), cy=(pusat?pusat.y:st.clientHeight/2);
    st2.scrollLeft=(st.scrollLeft+cx)*(z/lama)-cx;
    st2.scrollTop =(st.scrollTop +cy)*(z/lama)-cy;
  }
}
function ldzZoomFit(eid){
  const st=document.getElementById('ldzStage'); const L=ldzMeta(eid);
  if(!st) return;
  const z=Math.min((st.clientWidth-24)/L.w,(st.clientHeight-24)/L.h);
  ldzSetZoom(eid,Math.max(.2,Math.min(2,z)));
}
function ldzWheel(e){
  if(!(e.ctrlKey||e.metaKey)) return;          // gulir biasa tetap menggulir
  e.preventDefault();
  const st=document.getElementById('ldzStage'); if(!st) return;
  const r=st.getBoundingClientRect();
  ldzSetZoom(window._ldzEid,ldzZoom()*(e.deltaY<0?1.12:1/1.12),{x:e.clientX-r.left,y:e.clientY-r.top});
}
// Pan: tombol tengah tetikus, atau tahan Spasi lalu seret.
let _ldzPan=null;
function ldzStageDown(e){
  const st=document.getElementById('ldzStage'); if(!st) return;
  /* Klik kiri di area kosong panggung = mulai memblok, bukan diam saja.
     Panggung hanya menerima ini kalau yang ditekan memang RUANG KOSONG —
     kanvas & objeknya punya penangan sendiri yang berjalan lebih dulu. */
  if(e.button===0 && !window._ldzSpace && ldzBolehBlok()
     && (e.target===st || (e.target.classList&&e.target.classList.contains('ldz-sizer')))){
    ldzCanvasDown(e,true);
    return;
  }
  if(!(e.button===1 || (window._ldzSpace&&e.button===0))) return;
  e.preventDefault();
  _ldzPan={sx:e.clientX,sy:e.clientY,l:st.scrollLeft,t:st.scrollTop};
  st.classList.add('panning');
  window.addEventListener('pointermove',ldzPanMove);
  window.addEventListener('pointerup',ldzPanUp);
}
function ldzPanMove(e){
  const st=document.getElementById('ldzStage'); if(!st||!_ldzPan) return;
  st.scrollLeft=_ldzPan.l-(e.clientX-_ldzPan.sx);
  st.scrollTop =_ldzPan.t-(e.clientY-_ldzPan.sy);
}
function ldzPanUp(){
  window.removeEventListener('pointermove',ldzPanMove);
  window.removeEventListener('pointerup',ldzPanUp);
  _ldzPan=null;
  const st=document.getElementById('ldzStage'); if(st) st.classList.remove('panning');
}

/* ---------- papan ketik ----------
   Dipasang sekali untuk seluruh aplikasi dan baru aktif kalau kanvas memang
   sedang terbuka & mode desain menyala. */
if(!window._ldzKeys){
  window._ldzKeys=true;
  window.addEventListener('keyup',function(e){ if(e.code==='Space'){ window._ldzSpace=false;
    const st=document.getElementById('ldzStage'); if(st) st.classList.remove('pan'); } });
  window.addEventListener('keydown',function(e){
    if(!window._ldzEdit||!document.getElementById('ldzCanvas')) return;
    const t=e.target&&e.target.tagName;
    if(t==='INPUT'||t==='SELECT'||t==='TEXTAREA') return;
    const eid=window._ldzEid, L=ldzMeta(eid);
    if(e.code==='Space'){ window._ldzSpace=true;
      const st=document.getElementById('ldzStage'); if(st) st.classList.add('pan'); e.preventDefault(); return; }
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='a'){
      e.preventDefault(); ldzSetSel(ldzItems(eid).map(function(i){ return i.id; })); ldzRepaint(eid); return; }
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='d'){ e.preventDefault(); ldzDuplicate(eid); return; }
    /* Ctrl+Z / Ctrl+Y (dan Ctrl+Shift+Z, kebiasaan dari aplikasi gambar lain).
       Diperiksa SEBELUM pintasan lain supaya tidak tersandung cabang di bawah
       yang butuh objek terpilih — membatalkan justru paling sering diperlukan
       tepat setelah semuanya terhapus dan tidak ada lagi yang terpilih. */
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!e.shiftKey){ e.preventDefault(); ldzUndo(); return; }
    if((e.ctrlKey||e.metaKey)&&(e.key.toLowerCase()==='y'||(e.key.toLowerCase()==='z'&&e.shiftKey))){ e.preventDefault(); ldzRedoAksi(); return; }
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='c'){ e.preventDefault(); ldzSalin(); return; }
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='v'){ e.preventDefault(); ldzTempel(eid); return; }
    if(e.key==='F2'){ const s1=ldzSel(); if(s1.length===1){ e.preventDefault(); ldzRename(s1[0]); } return; }
    if((e.ctrlKey||e.metaKey)&&(e.key==='='||e.key==='+')){ e.preventDefault(); ldzSetZoom(eid,ldzZoom()*1.2); return; }
    if((e.ctrlKey||e.metaKey)&&e.key==='-'){ e.preventDefault(); ldzSetZoom(eid,ldzZoom()/1.2); return; }
    if((e.ctrlKey||e.metaKey)&&e.key==='0'){ e.preventDefault(); ldzSetZoom(eid,1); return; }
    if(e.key==='Escape'){ window._ldzArm=null; ldzSetSel([]); ldzRepaint(eid); return; }
    const sel=ldzSelItems(); if(!sel.length) return;
    if(e.key==='Delete'||e.key==='Backspace'){ e.preventDefault(); ldzDelete(eid); return; }
    const step=e.shiftKey?10:1;
    let dx=0,dy=0;
    if(e.key==='ArrowLeft') dx=-step; else if(e.key==='ArrowRight') dx=step;
    else if(e.key==='ArrowUp') dy=-step; else if(e.key==='ArrowDown') dy=step;
    else return;
    e.preventDefault();
    /* Rekaman untuk panah dikelompokkan: menahan panah menghasilkan puluhan
       keydown, dan satu potret per piksel akan menghabiskan seluruh riwayat
       hanya untuk satu geseran. Deretan penekanan dalam 800ms dianggap satu
       langkah. */
    const kini=Date.now();
    if(!window._ldzNudgeAt || kini-window._ldzNudgeAt>800) ldzRekam(eid);
    window._ldzNudgeAt=kini;
    sel.forEach(function(it){
      it.x=Math.max(0,Math.min(L.w-(+it.w||LDZ_MIN),(+it.x||0)+dx));
      it.y=Math.max(0,Math.min(L.h-(+it.h||LDZ_MIN),(+it.y||0)+dy));
      ldzPaintItem(it);
    });
    ldzPaintSel(); save();
  });
}

/* ---------- perataan & distribusi ----------
   Alasan orang memakai draw.io untuk denah kursi: merapikan puluhan objek
   sekaligus, bukan menggeser satu-satu sampai kelihatan lurus. */
function ldzAlign(eid,cara){
  ldzRekam(eid);
  const sel=ldzSelItems(); if(sel.length<2) return toast('Pilih minimal dua objek dulu.');
  const b=ldzBBox(sel);
  sel.forEach(function(it){
    const w=+it.w||LDZ_MIN, h=+it.h||LDZ_MIN;
    if(cara==='kiri')   it.x=b.x;
    if(cara==='kanan')  it.x=b.x+b.w-w;
    if(cara==='tengahH')it.x=Math.round(b.x+(b.w-w)/2);
    if(cara==='atas')   it.y=b.y;
    if(cara==='bawah')  it.y=b.y+b.h-h;
    if(cara==='tengahV')it.y=Math.round(b.y+(b.h-h)/2);
  });
  save(); ldzRepaint(eid);
}
function ldzDistribute(eid,arah){
  ldzRekam(eid);
  const sel=ldzSelItems(); if(sel.length<3) return toast('Pilih minimal tiga objek dulu.');
  const kunci=arah==='h'?'x':'y', sisi=arah==='h'?'w':'h';
  const urut=sel.slice().sort(function(a,b){ return (+a[kunci]||0)-(+b[kunci]||0); });
  const awal=+urut[0][kunci]||0;
  const akhirIt=urut[urut.length-1];
  const akhir=(+akhirIt[kunci]||0)+(+akhirIt[sisi]||0);
  const total=urut.reduce(function(a,i){ return a+(+i[sisi]||0); },0);
  const sela=(akhir-awal-total)/(urut.length-1);
  let pos=awal;
  urut.forEach(function(it){ it[kunci]=Math.round(pos); pos+=(+it[sisi]||0)+sela; });
  save(); ldzRepaint(eid);
}
function ldzSamakan(eid,apa){
  ldzRekam(eid);
  const sel=ldzSelItems(); if(sel.length<2) return toast('Pilih minimal dua objek dulu.');
  const p=sel[0];
  sel.forEach(function(it){ if(apa!=='h') it.w=+p.w||LDZ_MIN; if(apa!=='w') it.h=+p.h||LDZ_MIN; });
  save(); ldzRepaint(eid);
}

/* ---------- panel properti ---------- */
function ldzSet(eid,field,val){
  /* warna & pola bernilai TEKS, bukan angka. Tanpa cabang ini keduanya
     lewat jalur pembersih angka di bawah dan berubah jadi 0. */
  if(field==='warna'||field==='pola'){
    ldzRekam(eid);
    ldzSelItems().forEach(function(it){ it[field]=String(val||''); });
    save(); ldzRepaint(eid); return;
  }
  ldzRekam(eid);
  const sel=ldzSelItems(); if(!sel.length) return;
  sel.forEach(function(it){
    if(field==='tier'){ it.tier=val; it.ticket_class_id=ldzTierClass(eid,val).id; }
    else if(field==='capacity') it.capacity=Math.max(1,+val||1);
    else if(field==='w'||field==='h') it[field]=Math.max(LDZ_MIN,+val||LDZ_MIN);
    else if(field==='x'||field==='y') it[field]=Math.max(0,+val||0);
    else if(field==='status'){
      if(ldzTerjual(it)) return;               // terjual → hanya lewat Refund
      it.status=val;
    }
    else it[field]=val;
  });
  ldzSyncQuota(eid); save(); ldzRepaint(eid);
}
function ldzMetaSet(eid,field,val){
  const L=ldzMeta(eid);
  /* Batas dinaikkan dari 4.000 ke 24.000 px. Denah venue sungguhan yang
     digambar 1:1 dari file arsitek bisa berukuran ~19.000 × 12.000; dengan
     batas lama, gambar latarnya terpaksa dikecilkan sampai nomor mejanya tak
     terbaca. Kanvasnya sendiri cuma div ber-transform, jadi yang mahal bukan
     ukurannya melainkan jumlah objek di dalamnya. */
  if(field==='w'||field==='h') L[field]=Math.max(200,Math.min(24000,+val||1200));
  else if(field==='bgOpacity') L.bgOpacity=Math.max(0,Math.min(100,+val||0));
  else L[field]=val;
  save(); ldzRepaint(eid);
}
function ldzBg(eid){
  pilihBerkas(function(f){
    if(!berkasGambar(f)) return toast('Latar denah harus gambar (jpg/png/webp/gif).');
    ldzMeta(eid).bg={key:f.key,name:f.name}; save(); ldzRepaint(eid);
    toast('✓ Gambar denah dipasang sebagai latar — tinggal taruh kursi/mejanya.');
  },'image/*');
}
function ldzBgHapus(eid){ ldzMeta(eid).bg=null; save(); ldzRepaint(eid); }

  return h;
}

/* ================= PUSTAKA TEMPLATE DENAH =================
   Menggambar ulang denah venue dari nol tiap kali ada acara adalah pekerjaan
   setengah jam yang hasilnya selalu sama. Sekarang denah yang sudah jadi bisa
   DISIMPAN sebagai template dan dimuat oleh event berikutnya dalam sekali klik,
   lengkap dengan posisi, ukuran, bentuk, kapasitas, dan penomorannya.

   Kenapa menyimpan denah yang sudah digambar, bukan menuliskan koordinat tiap
   kursi di dalam kode: koordinat yang disalin dari foto denah tidak akan pernah
   persis, dan begitu venue menggeser satu blok meja, kode ikut harus diubah dan
   di-deploy. Template yang lahir dari denah asli selalu cocok dengan kenyataan,
   dan yang mengurusnya orang yang memang tahu tata letaknya.

   Kategori tiket TIDAK ikut disalin apa adanya — yang disimpan namanya saja,
   lalu dipetakan ke kelas tiket milik event tujuan saat dimuat. Event yang
   berbeda menjual kelas yang berbeda; menyalin id kelas antar event akan
   membuat kursi tertaut ke tiket yang bukan miliknya. */
/* ================= DENAH BAWAAN LAKSAMANA MUDA =================
   Disusun dengan MENSKALAKAN denah cetak venue (±1,5×), bukan menaruh objek
   sesuka penata: letak tiap meja, panggung, EXT, dan ruang talent mengikuti
   proporsi gambar aslinya.

   URUTAN PENOMORAN mengikuti denah cetak, dan itu TIDAK sama dengan urutan
   menggambar yang paling nyaman:

     U1–U3 .......... 1–24     (7 + 8 + 9)
     31, 32 ......... 25–36    (6 kursi bernomor tiap meja, label 7 pax)
     24, 23, 22, 21 . 37–52    (bundar, 4 tiap meja)
     33, 34 ......... 53–64
     35 ............. 65–70
     42-43 .......... 71–75
     44 ............. 76–79
     45 ............. 80–83
     S1 ............. 84–93    S2 94–97   S3 98–107  S5 108–117
     S4 ............. 118–121  S6 122–125 41 126–129
     11–19 .......... 130–166
     1–9 ............ 167–211

   Versi sebelumnya menomori menurut urutan pembuatan, sehingga meja bundar
   mendapat 53–64 dan meja 33/34 mendapat 37–52 — tertukar dari denah cetak. Itu
   bukan soal kerapian: nomor kursi ikut tercetak di e-ticket, dan tamu memegang
   kertas bernomor yang menunjuk meja yang salah.

   Perlu diketahui: kapasitas LABEL dan jumlah KURSI BERNOMOR tidak selalu sama.
   Meja 31–34 berlabel "7 pax" tapi hanya punya 6 kursi bernomor di denah cetak
   (satu tempat memang tanpa nomor). Keduanya disimpan terpisah supaya rekap
   kapasitas tetap benar tanpa mengarang kursi bernomor yang tidak ada.

   Denah bawaan MENAMBAHKAN, tidak menghapus, dan bisa dibatalkan dengan Ctrl+Z.
   Sesudah dirapikan, simpan lewat "Simpan sebagai Template" — event berikutnya
   memakai versi rapi itu. */

/* Penempatan kursi di sekeliling meja, ditulis EKSPLISIT per meja.

   Denah cetak tidak memakai satu pola untuk semua: meja 44 punya kursi di
   empat sisi (kiri, atas, kanan, bawah), meja 42-43 punya satu di kiri lalu
   dua atas & dua bawah, dan meja ujung barisan (1 dan 9, 19) punya satu kursi
   tambahan di sisi lorong. Pola tebak-tebakan "separuh atas separuh bawah"
   tidak akan pernah cocok dengan semuanya — dan nomor kursi yang salah tempat
   ikut tercetak di e-ticket.

   Formatnya deretan sisi + jumlah, DALAM URUTAN PENOMORAN denah cetak:
     'l1,t2,b2' → 1 kiri (nomor terkecil), lalu 2 atas, lalu 2 bawah
     't2,b2,r1' → 2 atas, 2 bawah, lalu 1 di kanan (nomor terbesar)
   Sisi: t=atas, b=bawah, l=kiri, r=kanan. */
function ldzKursiSekitar(o, nomor, x, y, w, h, spek){
  const d=18, j=5;
  const bikin=function(cx,cy){ o.push({kind:'seat',shape:'circle',lbl:String(nomor.n++),x:Math.round(cx),y:Math.round(cy),w:d,h:d}); };
  const sebar=function(n,p1,p2){ const out=[]; for(let i=0;i<n;i++) out.push(p1+((p2-p1)/(n+1))*(i+1)); return out; };
  String(spek||'').split(',').forEach(function(bag){
    const sisi=bag.charAt(0), n=+bag.slice(1)||0;
    if(!n) return;
    if(sisi==='t') sebar(n,x,x+w).forEach(function(cx){ bikin(cx-d/2, y-d-j); });
    else if(sisi==='b') sebar(n,x,x+w).forEach(function(cx){ bikin(cx-d/2, y+h+j); });
    else if(sisi==='l') sebar(n,y,y+h).forEach(function(cy){ bikin(x-d-j, cy-d/2); });
    else if(sisi==='r') sebar(n,y,y+h).forEach(function(cy){ bikin(x+w+j, cy-d/2); });
  });
}
// Jumlah kursi dalam sebuah spek — dipakai memeriksa kecocokannya dengan pax.
function ldzJumlahSpek(spek){
  return String(spek||'').split(',').reduce(function(a,b){ return a+(+b.slice(1)||0); },0);
}
function ldzBawaanL1(){
  const o=[], nomor={n:1};
  const area=function(lbl,x,y,w,h){ o.push({kind:'area',shape:'rect',lbl:lbl,x:x,y:y,w:w,h:h}); };
  /* pax   = kapasitas tercetak di denah (dipakai rekap & potensi pendapatan)
     spek  = penempatan kursi bernomor, dalam urutan penomoran denah cetak */
  const meja=function(lbl,x,y,w,h,pax,shape,spek){
    o.push({kind:'table',shape:shape||'rect',lbl:lbl,x:x,y:y,w:w,h:h,cap:pax});
    if(spek) ldzKursiSekitar(o,nomor,x,y,w,h,spek);
  };
  const ext=function(no,x,y,w,h){ o.push({kind:'table',shape:'rect',lbl:'EXT '+no,x:x,y:y,w:w,h:h,cap:2}); };

  // ---- kerangka ruangan (skala ±1,5x dari denah cetak) ----
  area('MEJA DJ',780,58,160,32);
  area('STAGE',600,45,535,150);
  area('TALENT ROOM',1440,45,125,480);
  area('ENTRANCE',12,470,30,120);

  /* U1–U3 menempel dinding barat: kursi di ATAS, KIRI, lalu BAWAH — sisi kanan
     menghadap lorong, jadi tidak berkursi. Jarak antar meja memuat dua baris
     kursi (bawah meja atas + atas meja bawah), minimal 46px. */
  meja('U1',203,60,158,78,7,'rect','t3,l2,b2');
  meja('U2',203,196,158,84,8,'rect','t2,l4,b2');
  meja('U3',203,338,158,96,9,'rect','t4,l3,b2');

  // ---- EXT: hanya 1–11, 14, 15 (denah cetak tidak punya EXT 12/13) ----
  ext(1,402,60,48,56);  ext(2,503,60,50,56);
  ext(3,402,143,48,56); ext(4,503,143,50,56);
  ext(5,450,213,60,40);
  ext(6,52,214,50,56);  ext(7,52,300,50,56); ext(8,52,386,50,56);
  ext(9,233,485,95,34);
  ext(10,93,648,50,56); ext(11,93,818,50,56);
  ext(14,638,282,50,74); ext(15,1028,278,50,74);

  // ---- 31 & 32: meja tegak, kursi 3 kiri + 3 kanan (label 7 pax) ----
  meja('31',458,263,128,116,7,'rect','l3,r3');
  meja('32',458,395,128,116,7,'rect','l3,r3');
  // ---- meja bundar 24, 23, 22, 21 ----
  meja('24',623,428,76,60,4,'circle','t2,b2');
  meja('23',762,428,76,60,4,'circle','t2,b2');
  meja('22',893,428,76,60,4,'circle','t2,b2');
  meja('21',1020,428,76,60,4,'circle','t2,b2');
  // ---- 33 & 34 di timur, pola sama dengan 31/32 ----
  meja('33',1118,263,128,112,7,'rect','l3,r3');
  meja('34',1118,391,128,120,7,'rect','l3,r3');
  /* Kolom timur. Pola tiap meja berbeda dan itu memang begitu di denah cetak:
       35     : 3 atas, 3 bawah
       42-43  : 1 KIRI, lalu 2 atas, 2 bawah
       44 & 45: satu kursi di TIAP sisi (kiri, atas, kanan, bawah) */
  meja('35',1275,55,150,100,7,'rect','t3,b3');
  meja('42-43',1290,212,135,58,4,'rect','l1,t2,b2');
  /* 44 & 45 dipersempit dan digeser ke kiri: kursi sisi KANANnya butuh ruang
     sebelum TALENT ROOM (x=1440). Pada lebar 105 di x=1320, kursi 78 dan 82
     menembus ruang talent. */
  meja('44',1296,338,96,56,4,'rect','l1,t1,r1,b1');
  meja('45',1296,465,96,57,4,'rect','l1,t1,r1,b1');
  /* Deret S: denah cetak menulis "10-12 PAX" untuk S1/S3/S5, sedangkan kursi
     bernomornya 10. Kapasitas dipatok 10 — angka yang lebih kecil dari dua
     kemungkinan, karena kapasitas dipakai menghitung POTENSI pendapatan dan
     melebihkannya membuat target terlihat lebih besar dari yang bisa dijual. */
  meja('S1',338,600,180,58,10,'rect','t5,b5');
  meja('S2',567,597,72,62,4,'circle','t2,b2');
  meja('S3',683,600,180,58,10,'rect','t5,b5');
  meja('S5',893,600,180,58,10,'rect','t5,b5');
  meja('S4',1113,597,70,62,4,'circle','t2,b2');

  /* Barisan 11–19 dan 1–9. Meja UJUNG barisan punya satu kursi tambahan di sisi

  ['11','12','13','14','15','16','17','18','19'].forEach(function(lbl,i){

function ldzBawaanL2(){
  const o=[];
  const area=function(lbl,x,y,w,h,pola,petak){ o.push({kind:'area',shape:'rect',lbl:lbl,x:x,y:y,w:w,h:h,pola:pola,petak:petak}); };
  /* Semua posisi dihitung DARI KOTAK VOID, jadi ketiga barisan kursi selalu
     menempel walau ukuran voidnya diubah. */
  const V={x:300,y:210,w:880,h:400};
  const d=18, jr=4;
  area('STAGE',Math.round(V.x+V.w/2-190),40,380,140);
  area('VOID LANTAI 2',V.x,V.y,V.w,V.h);
  let n=1;
  const nKiri=22, sKiri=V.h/nKiri;
  for(let i=0;i<nKiri;i++) o.push({kind:'seat',shape:'rect',lbl:String(n++),
    x:V.x-d-jr, y:Math.round(V.y+sKiri*i+(sKiri-d)/2), w:d,h:d});
  const nBawah=39, sBawah=V.w/nBawah;
  for(let i=0;i<nBawah;i++) o.push({kind:'seat',shape:'rect',lbl:String(n++),
    x:Math.round(V.x+sBawah*i+(sBawah-d)/2), y:V.y+V.h+jr, w:d,h:d});
  const nKanan=22, sKanan=V.h/nKanan;
  for(let i=0;i<nKanan;i++) o.push({kind:'seat',shape:'rect',lbl:String(n++),
    x:V.x+V.w+jr, y:Math.round(V.y+V.h-sKanan*(i+1)+(sKanan-d)/2), w:d,h:d});
  /* Zona REGULER digambar BERPETAK penuh seperti denah cetak: petak 26px kira-
     kira satu kursi, jadi luasnya langsung terbaca sebagai daya tampung
     walaupun kursinya tidak bernomor dan tidak dijual satu-satu. */
  area('REGULER',60,V.y,190,V.h,'petak',26);
  area('REGULER',V.x+V.w+40,V.y,190,V.h,'petak',26);
  area('TANGGA',60,V.y+V.h+40,120,60);
  area('TANGGA',V.x+V.w+40,V.y+V.h+40,120,60);
  /* Blok bawah (REGULER – OPERATOR – REGULER) DIPUSATKAN terhadap void, tidak
     lagi dipatok mulai x=120. Operator di denah cetak berada tepat di tengah
     bentang void; kalau lebar blok atau void diubah, titik tengahnya ikut
     dihitung ulang sendiri. */
  const yb=V.y+V.h+120;
  const wReg=430, wOp=120, sela=30;
  const wBlok=wReg*2+wOp+sela*2;
  const x0=Math.round(V.x+V.w/2-wBlok/2);
  area('REGULER',x0,yb,wReg,150,'petak',26);
  area('OPERATOR',x0+wReg+sela,yb,wOp,150);
  area('REGULER',x0+wReg+sela+wOp+sela,yb,wReg,150,'petak',26);
  return {kanvas:{w:1440,h:yb+180},objek:o};
}
/* Memasang denah bawaan di lantai yang sedang dibuka.
   Kategori: Lantai 1 seluruhnya VIP; kursi bernomor Lantai 2 jadi Reguler+.
   Kelas tiketnya dibuat kalau belum ada — termasuk kelas Reguler TANPA kursi
   untuk zona berdiri, supaya kuotanya tetap bisa dijual. */
/* ---------- BERSIHKAN DENAH TEMPLATE LAMA ----------
   Kursi template (zone selain 'Custom') adalah peninggalan sebelum perancang
   denah ada. Event yang sudah punya denah kustom tidak memerlukannya lagi,
   tapi selama keduanya ada, tiap layar menghitung yang berbeda dan tidak ada
   satu pun yang salah menurut dirinya sendiri.

   PENJAGANYA: kursi yang sudah punya tiket TIDAK BOLEH ikut terhapus. Tiket
   yang kursinya lenyap tidak bisa lagi ditunjukkan letaknya di pintu masuk,
   dan uangnya sudah diterima. Kalau ada satu saja yang begitu, seluruh
   penghapusan dibatalkan — bukan dihapus sebagian, yang justru meninggalkan
   denah setengah rusak yang lebih sulit dijelaskan. */
function kursiTemplate(eid){
  return DB.seats.filter(function(s2){ return s2.event_id===eid && s2.zone!=='Custom'; });
}
function hapusDenahTemplate(eid){
  const tpl=kursiTemplate(eid);
  if(!tpl.length){ toast('Tidak ada denah template di event ini.'); return; }
  const dipakai=tpl.filter(function(s2){
    return DB.tickets.some(function(t){ return t.seat_id===s2.id && t.status!=='Cancelled'; });
  });
  if(dipakai.length){
    toast('Dibatalkan — '+dipakai.length+' kursi template sudah punya tiket terjual. '
      +'Refund atau pindahkan tiketnya dulu sebelum denah lama dihapus.');
    return;
  }
  if(!confirm('Hapus '+tpl.length+' kursi denah template lama?\n\n'
    +'Denah kustom ('+ldzSemuaItems(eid).length+' objek) TIDAK disentuh.')) return;
  const buang={}; tpl.forEach(function(s2){ buang[s2.id]=1; });
  DB.seats=DB.seats.filter(function(s2){ return !buang[s2.id]; });
  save(); renderTicketDetail(eid);
  toast('✓ '+tpl.length+' kursi denah template lama dihapus. Denah kustom utuh.');
}
function ldzPasangBawaan(eid){
  const e=DB.events.find(function(x){ return x.id===eid; }); if(!e) return;
  const lantai=ldzLantai();

  let cls=DB.ticketClasses.find(function(c){ return c.event_id===eid && c.name===namaKelas; });
  if(!cls){
    cls={id:uid(),event_id:eid,name:namaKelas,price:0,quota:0,sold:0,
         sale_start:e.start_datetime||'',sale_end:e.start_datetime||'',
         description:'Dibuat dari denah bawaan',benefit:namaKelas,is_seated:true};
    DB.ticketClasses.push(cls);
  }
  if(lantai==='2' && !DB.ticketClasses.some(function(c){ return c.event_id===eid && c.name==='Reguler'; })){
    DB.ticketClasses.push({id:uid(),event_id:eid,name:'Reguler',price:0,quota:100,sold:0,
      sale_start:e.start_datetime||'',sale_end:e.start_datetime||'',
      description:'Zona reguler tanpa nomor kursi',benefit:'Area reguler',is_seated:false});
  }
  ldzRekam(eid);

  L.w=Math.max(L.w,tpl.kanvas.w); L.h=Math.max(L.h,tpl.kanvas.h);
  const baru=tpl.objek.map(function(o){
    return {id:uid(),event_id:eid,ticket_class_id:cls.id,zone:'Custom',floor:lantai,
            kind:o.kind,shape:o.shape,tier:cls.name,
            x:o.x,y:o.y,w:o.w,h:o.h,
            capacity:(o.kind==='area')?0:(o.kind==='table'?(+o.cap||0):1),
            // pola isian ikut dibawa: zona REGULER digambar berpetak penuh
            pola:o.pola||'', petak:+o.petak||0,
            table_no:o.lbl,seat_no:o.lbl,status:'Available'};
  });
  DB.seats=DB.seats.concat(baru);
  ldzSetSel([]); ldzSyncQuota(eid); save();
  if(document.querySelector('.tabs')) renderTicketDetail(eid); else ldzRepaint(eid);
  const kursi=baru.filter(function(i){ return i.kind==='seat'; }).length;
  const meja=baru.filter(function(i){ return i.kind==='table'; }).length;
  const luas=baru.filter(function(i){ return i.kind==='area'; }).length;
  toast('✓ Denah bawaan Lantai '+lantai+' — '+kursi+' kursi bernomor, '+meja+' meja, '+luas+' area. Rapikan lalu Simpan sebagai Template.');

/* Pemetaan kategori: tiap nama kategori di template dipasangkan dengan kelas
   tiket milik event ini. Bawaannya kelas bernama sama kalau ada; kalau tidak,
   kelas pertama — dan itu ditampilkan, bukan diputuskan diam-diam. */
/* Pratinjau kecil: denah template digambar ulang sebagai kotak-kotak mungil,
   diskalakan agar muat. Tanpa ini nama template ("LM Lantai 1") adalah
   satu-satunya petunjuk isinya — dan begitu ada tiga template dengan nama
   mirip, memilihnya jadi tebak-tebakan yang baru ketahuan salah sesudah
   objeknya terlanjur masuk ke denah. */
function ldzTplPreviewHTML(t){
  if(!t||!t.objek||!t.objek.length) return '<span class="mini">Template kosong.</span>';
  const W=(t.kanvas&&+t.kanvas.w)||1200, H=(t.kanvas&&+t.kanvas.h)||760;
  const lebar=320, sk=lebar/W, tinggi=Math.max(60,Math.round(H*sk));
  return '<div class="tpl-canvas" style="width:'+lebar+'px;height:'+tinggi+'px">'
   +t.objek.map(function(o){
      const warna=(o.kind==='table')?'#c9b28c':'#2f7fc4';
      return '<i style="left:'+Math.round((+o.x||0)*sk)+'px;top:'+Math.round((+o.y||0)*sk)+'px;'
       +'width:'+Math.max(2,Math.round((+o.w||40)*sk))+'px;height:'+Math.max(2,Math.round((+o.h||40)*sk))+'px;'
       +'background:'+warna+(o.shape==='circle'?';border-radius:50%':'')+'"></i>';
   }).join('')
   +'</div><div class="mini">'+t.objek.length+' objek · kanvas '+W+'×'+H+' · Lantai '+esc(t.lantai||'1')+'</div>';
}
function ldzMuatPetaKelas(eid){
  const box=document.getElementById('tpl_peta'); if(!box) return;
  const t=ldzTemplates()[+((document.getElementById('tpl_pilih')||{}).value||0)]; if(!t) return;
  const pv=document.getElementById('tpl_prev'); if(pv) pv.innerHTML=ldzTplPreviewHTML(t);
  const kelas=DB.ticketClasses.filter(function(c){ return c.event_id===eid; });
  const namaTier=[...new Set(t.objek.map(function(o){ return o.tier||'(tanpa kategori)'; }))];
  if(!kelas.length){
    box.innerHTML='<p class="mini" style="color:var(--red)">Event ini belum punya satu kelas tiket pun. Buat dulu di tab <b>Ticket Class</b> \u2014 kalau tidak, kursinya tidak bisa dijual.</p>';
    return;
  }
  box.innerHTML='<label style="display:block;margin-bottom:6px">Pasangkan kategori template dengan kelas tiket event ini</label>'
   +'<div class="tbl-edit"><table><thead><tr><th>Kategori di template</th><th>Jadi kelas</th></tr></thead><tbody>'
   +namaTier.map(function(n){
      const sama=kelas.find(function(c){ return c.name===n; });
      return '<tr><td>'+esc(n)+'</td><td><select class="inp tpl_map" data-tier="'+esc(n)+'">'
       +kelas.map(function(c){ return '<option value="'+c.id+'"'+((sama&&sama.id===c.id)?' selected':'')+'>'+esc(c.name)+'</option>'; }).join('')
       +'</select></td></tr>';
   }).join('')
   +'</tbody></table></div>';
}

/* ---- MODE JUAL DI TAB LAYOUT ----

   Mode jual memakai pilihan yang sama dengan layar Catat Penjualan
   (beliSel), jadi kursi yang sudah dipilih di denah langsung terbawa ke

function ldzJualAktif(){ return !window._ldzEdit && window._ldzJual; }

function seatMapBody(id){
  const seats=DB.seats.filter(s=>s.event_id===id);
  const rplus=seats.filter(s=>s.zone==='Reguler+').sort((a,b)=>a.seat_no-b.seat_no);
  const rL1=seats.filter(s=>s.zone==='Lantai 1');
  // Pemilih lantai — tampil begitu salah satu denah ada.
  window._lmFloor = window._lmFloor || (rplus.length?'2':(rL1.length?'1':'2'));
  const fl=window._lmFloor;
  // Saat read-only (Live Occupancy di Check-In), tab lantai me-refresh denah
  // saja (renderLiveDenah) — bukan renderTicketDetail — agar scanner tak reset.
  const go=f=>window._denahRO?('window._lmFloor=\''+f+'\';renderLiveDenah(\''+id+'\')')
                            :('window._lmFloor=\''+f+'\';renderTicketDetail(\''+id+'\')');
  const tabs='<div class="lm-floors">'
    +'<button class="'+(fl==='2'?'on':'')+'" onclick="'+go('2')+'">Lantai 2 — Reguler+</button>'
    +'<button class="'+(fl==='1'?'on':'')+'" onclick="'+go('1')+'">Lantai 1 — Meja</button></div>';

function renderL2Hall(id){
  // Objek denah kustom SENGAJA dikecualikan: tempatnya di tab Layout Kustom,
  // yang menggambarnya pada koordinat sendiri — kalau ikut ke sini ia jatuh
  // sebagai grid datar tanpa tata letak dan membingungkan.
  const seats=DB.seats.filter(s=>s.event_id===id && s.zone!=='Custom');
  const rplus=seats.filter(s=>s.zone==='Reguler+').sort((a,b)=>a.seat_no-b.seat_no);
  if(!rplus.length){
    // fallback: kalau ada seat lain (mis. VIP table lama), tetap tampilkan;
    // selalu tawarkan template LM.
    let h='<div class="card"><h3 class="sec">Denah Kursi</h3>'
      +'<p class="mini">Belum ada denah Reguler+. Buat template venue Laksamana Muda — 83 kursi bernomor mengelilingi panggung (Lantai 2)'
      +(window._denahRO?'':', atau susun denah sendiri di tab <b>Layout Kustom</b>')+'.</p>'

    if(seats.length){ h+='<div class="stage-bar" style="margin-top:16px">S T A G E</div><div class="seatmap">'
      +seats.map(s=>'<div class="seat '+seatCls(s)+'" title="'+esc(s.table_no)+' — '+s.status+'">'+esc(s.table_no)+'</div>').join('')+'</div>'; }
    return h+'</div>';
  }
  const kiri=rplus.filter(s=>s.seat_no<=23);
  const depan=rplus.filter(s=>s.seat_no>=24 && s.seat_no<=60);
  const kanan=rplus.filter(s=>s.seat_no>=61).slice().reverse();  // 83 di atas → 61 di bawah (poster)
  const terisi=rplus.filter(s=>seatCls(s)!=='available').length;
  const reg=DB.ticketClasses.find(c=>c.event_id===id && c.name==='Reguler');

  let h='<div class="card"><h3 class="sec">Denah Lantai 2 — Reguler+ <span class="mini" style="font-weight:400">('+terisi+'/'+rplus.length+' terisi)</span></h3>'
    +'<p class="mini" style="margin-bottom:10px">'+(window._denahRO
        ?'Warna kursi = status kedatangan tamu (live).'
        :'Klik kursi untuk memutar status: Tersedia → Hold → Terjual → Tersedia. Kursi yang terjual lewat pembelian dilepas lewat Refund.')+'</p>'
    +'<div class="lm-hall">'
      +'<div class="lm-stage">S T A G E</div>'
      +'<div class="lm-kiri"><span class="lm-side-lbl">REGULER +</span>'+kiri.map(seatBox).join('')+'</div>'
      +'<div class="lm-floor"><b>LANTAI 2</b><span>Area lantai / floor</span></div>'
      +'<div class="lm-kanan"><span class="lm-side-lbl">REGULER +</span>'+kanan.map(seatBox).join('')+'</div>'
      +'<div class="lm-depan">'+depan.map(seatBox).join('')+'</div>'
    +'</div>'
    +denahLegend();

  // Zona Reguler (tanpa nomor) — lantai 2 pojok + seluruh lantai 1.
  // Di Live Occupancy (read-only) tombol +/- disembunyikan: cukup tampil angka.
  const zc = reg
    ? (window._denahRO
        ? '<div class="zc"><b>'+reg.sold+'</b> / '+reg.quota+' terjual</div>'
        : '<div class="zc"><button onclick="regulerAdj(\''+id+'\',-1)">−</button><b>'+reg.sold+'</b> / '+reg.quota+' terjual<button onclick="regulerAdj(\''+id+'\',1)">+</button></div>')
    : '<div class="mini" style="margin-top:8px">Kelas "Reguler" belum ada.</div>';
  h+='<div class="lm-zones">'
    +'<div class="lm-zone"><h4>Reguler — Lantai 1 &amp; pojok Lantai 2</h4><span class="mini">Zona bebas tanpa nomor kursi.</span>'
    +zc+'</div></div>';
  return h+'</div>';
}
/* HAPUS KELAS TIKET — dijaga dua hal yang tidak boleh dilanggar.

   1. Sudah ada yang membeli. Menghapus kelasnya membuat tiket yang sudah
      terbayar kehilangan induknya: harganya jadi nol, kuotanya lenyap, dan
      laporan penjualan tidak lagi bisa menjelaskan uang yang sudah diterima.
   2. Masih dipakai objek di denah. Kursinya akan tetap tergambar tapi tanpa
      harga — di situs customer ia muncul lalu menolak dipilih, dan tidak
      ada apa pun di layar yang menjelaskan sebabnya.

   Keduanya menolak dengan MENYEBUT ANGKANYA, bukan sekadar "tidak bisa":
   yang dibutuhkan orang saat ditolak adalah tahu apa yang harus dibereskan
   lebih dulu. */
/* JUMLAH TERJUAL DIHITUNG DARI TIKETNYA, BUKAN DARI KOLOM `sold`.

   `sold` adalah penghitung yang disimpan terpisah, dan ia bisa basi: data
   contoh bawaan memasang angka (mis. Spectator 70) tanpa satu pun baris di
   tabel tickets, dan pembatalan lama tidak selalu menurunkannya kembali.
   Memakai angka itu sebagai penjaga membuat kelas yang sebenarnya bersih
   MENOLAK dihapus dengan alasan "sudah terjual 70" — padahal di halaman
   Penjualan tidak ada satu baris pun. Tiket adalah bukti transaksinya;
   penghitung hanya cerminan yang bisa tertinggal. */
function tiketTerjual(id){
  return DB.tickets.filter(function(t){ return t.ticket_class_id===id && t.status!=='Cancelled'; }).length;
}
function delTicketClass(eid, id){
  const c = DB.ticketClasses.find(x => x.id === id); if(!c) return;
  const nyata = tiketTerjual(id);
  if(nyata > 0){
    toast('Tidak bisa dihapus — sudah ada ' + nyata + ' tiket terjual di kelas ini.');
    return;
  }
  const dipakai = DB.seats.filter(function(s2){
    if(s2.event_id !== eid) return false;
    // Objek yang sudah bertaut id dinilai dari id-nya saja: kalau tidak, objek
    // yang id-nya kelas LAIN tapi namanya kebetulan sama ikut terhitung dan
    // penghapusan yang sah jadi tertolak tanpa alasan yang bisa ditelusuri.
    return s2.ticket_class_id ? s2.ticket_class_id === id : s2.tier === c.name;
  });
  if(dipakai.length){
    /* Angkanya DIPILAH antara denah kustom dan kursi template bawaan.
       Sebelumnya keduanya dijumlah jadi satu angka bernama "objek di denah",
       dan angkanya tidak cocok dengan apa pun yang terlihat di layar: kru
       melihat 92 objek di Rangkuman Denah lalu ditolak dengan "175 objek",
       tanpa cara apa pun menemukan 83 sisanya. */
    const kustom = dipakai.filter(function(s2){ return s2.zone === 'Custom'; }).length;
    const tpl = dipakai.length - kustom;
    const bagian = [];
    if(kustom) bagian.push(kustom + ' objek di denah kustom');
    if(tpl)    bagian.push(tpl + ' kursi denah template lama');
    toast('Masih dipakai ' + bagian.join(' + ') + '. Ubah tingkatannya dulu, atau hapus denah template kalau sudah tidak dipakai.');
    return;
  }
  // Penghitung basi diberitahukan, bukan dipakai menolak — supaya angka aneh
  // di kolom Terjual tidak lagi jadi misteri yang tak bisa dijelaskan.
  const pesan = (+c.sold > 0)
    ? 'Hapus ticket class "' + c.name + '"?\n\nKolom Terjual tertulis ' + c.sold
      + ', tapi tidak ada satu pun tiket sungguhan di kelas ini (angka itu sisa data contoh).'
    : 'Hapus ticket class "' + c.name + '"?';
  if(!confirm(pesan)) return;
  DB.ticketClasses = DB.ticketClasses.filter(x => x.id !== id);
  save(); renderTicketDetail(eid); toast('Ticket class dihapus.');
}
function ticketClassForm(eid, id){
  /* Satu form untuk BUAT dan UBAH. Sebelumnya hanya bisa membuat: salah ketik
     harga sekali berarti kelas itu menetap selamanya, dan satu-satunya jalan
     keluar adalah membuat kelas kedua — yang justru merusak, karena kursi di
     denah dicocokkan ke kelas lewat NAMA. */
  const c = id ? DB.ticketClasses.find(x => x.id === id) : null;
  const d = c || {name:'', price:100000, quota:100, benefit:'', is_seated:false,
                  sale_start:new Date().toISOString(), sale_end:''};
  modal(`<button class="close" onclick="closeModal()">×</button><h3>${c?'Ubah Ticket Class':'Ticket Class Baru'}</h3>
  <div class="grid g2">
    <div class="field"><label>Nama</label><input id="tc_name" placeholder="Regular / VIP / Early Bird" value="${esc(d.name)}"></div>
    <div class="field"><label>Harga (IDR)</label>${uangInput('tc_price',+d.price||0)}</div>
    <div class="field"><label>Kuota</label><input id="tc_quota" type="number" value="${+d.quota||1}"></div>
    <div class="field"><label>Benefit</label><input id="tc_benefit" placeholder="Free drink, seat, dll" value="${esc(d.benefit||'')}"></div>
    <div class="field"><label>Sale Start</label><input id="tc_ss" type="date" value="${dstr(new Date(d.sale_start||Date.now()))}" onchange="syncSaleWindow()"></div>
    <div class="field"><label>Sale End</label><input id="tc_se" type="date" value="${d.sale_end?dstr(new Date(d.sale_end)):''}"><div class="mini" id="tc_se_hint"></div></div>
  </div>
  <label style="display:inline-flex;gap:6px;color:var(--txt)"><input type="checkbox" id="tc_seated" style="width:auto" ${d.is_seated?'checked':''}> Seated (pilih kursi)</label>
  ${c&&+c.sold>0?`<p class="mini" style="margin-top:8px">Sudah ${c.sold} tiket terjual — kuota tidak bisa diturunkan di bawah angka itu.</p>`:''}
  <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn" onclick="saveTicketClass('${eid}'${c?(",'"+c.id+"'"):''})">Simpan</button></div>`,true);
}
/* Sale End tidak boleh mendahului Sale Start. Dijaga di dua lapis: kalender
   tidak mengizinkan memilih tanggal sebelum Sale Start (min), dan saat simpan
   tetap diperiksa lagi — atribut min bisa dilewati kalau tanggalnya diketik. */
function syncSaleWindow(){
  const ss=document.getElementById('tc_ss'), se=document.getElementById('tc_se');
  if(!ss||!se)return;
  se.min=ss.value||'';
  const hint=document.getElementById('tc_se_hint');
  if(se.value && ss.value && se.value<ss.value){
    se.value=''; if(hint)hint.textContent='Sale End dikosongkan — tidak boleh sebelum Sale Start.';
  } else if(hint) hint.textContent=ss.value?'Paling awal '+ss.value:'';
}
function saveTicketClass(eid, id){
  const g=x=>document.getElementById(x).value;
  const name=g('tc_name').trim();if(!name){toast('Nama wajib.');return;}
  const ss=g('tc_ss'), se=g('tc_se');
  if(!ss){toast('Sale Start wajib diisi.');return;}
  if(!se){toast('Sale End wajib diisi.');return;}
  if(se<ss){toast('⛔ Sale End ('+se+') tidak boleh sebelum Sale Start ('+ss+').');return;}
  const price=uangNilai('tc_price'), quota=+g('tc_quota');
  if(price<0){toast('Harga tidak boleh minus.');return;}
  if(quota<1){toast('Kuota minimal 1.');return;}
  const seated = document.getElementById('tc_seated').checked;
  const lama = id ? DB.ticketClasses.find(x => x.id === id) : null;
  if(lama){
    /* Kuota tidak boleh turun di bawah yang SUDAH terjual — kalau tidak,
       "sisa" jadi minus dan penjualan berikutnya ditolak dengan angka yang
       tidak masuk akal buat kasir maupun pembeli. */
    const nyata = tiketTerjual(id);
    if(quota < nyata){
      toast('Sudah terjual ' + nyata + ' tiket — kuota tidak boleh di bawah itu.');
      return;
    }
    /* Nama kelas adalah TAUTAN ke kursi di denah: objek denah menyimpan
       tingkatannya sebagai nama, bukan id. Mengganti nama tanpa ikut
       memperbarui kursinya memutus tautan itu diam-diam — kursinya tetap
       tergambar tapi kehilangan harga, dan di situs customer jadi tidak bisa
       dipilih tanpa sebab yang terlihat. */
    if(lama.name !== name){
      /* Dicocokkan lewat ID LEBIH DULU, nama hanya cadangan untuk objek lama
         yang belum sempat termigrasi. Kalau hanya mengandalkan nama, objek
         yang tingkatannya pernah diketik berbeda ejaan akan tertinggal dan
         diam-diam kehilangan harga. */
      let n = 0;
      DB.seats.forEach(function(s2){
        if(s2.event_id !== eid) return;
        if(s2.ticket_class_id === id || (!s2.ticket_class_id && s2.tier === lama.name)){
          s2.tier = name; s2.ticket_class_id = id; n++;
        }
      });
      if(n) toast(n + ' objek denah ikut dipindah ke nama "' + name + '".');
    }
    Object.assign(lama, {name, price, quota, benefit:g('tc_benefit'), is_seated:seated,
      sale_start:new Date(ss).toISOString(), sale_end:new Date(se+'T23:59:59').toISOString()});
    save(); closeModal(); renderTicketDetail(eid); toast('Ticket class diperbarui.');
    return;
  }
  DB.ticketClasses.push({id:uid(),event_id:eid,name,price,quota,sold:0,
    sale_start:new Date(ss).toISOString(),sale_end:new Date(se+'T23:59:59').toISOString(),
    description:'',benefit:g('tc_benefit'),is_seated:seated});
  save();closeModal();renderTicketDetail(eid);toast('Ticket class dibuat.');
}
/* Satu pembeli boleh mengambil BANYAK kursi sekaligus. Dulu satu penjualan =
   satu tiket = satu kursi, yang dipilihkan sistem (kursi Available pertama
   yang ketemu). Rombongan enam orang berarti mengulang formulir enam kali dan
   kursinya tersebar entah di mana — padahal justru rombongan yang paling
   ingin duduk berdekatan.

   Sekarang kursinya diklik langsung di denah acara itu (denah kustom kalau
   ada, template kalau tidak), persis seperti pemilih meja di modul Reservasi.
   Untuk tiket berdiri (tanpa denah) yang muncul kotak jumlah tiket. */
function purchaseFlow(eid,pakaiPilihan){
  const e=DB.events.find(x=>x.id===eid);const classes=DB.ticketClasses.filter(c=>c.event_id===eid);
  // Dipanggil dari denah (mode jual) → kursi yang sudah diklik dipertahankan.
  const bawaan=pakaiPilihan?beliSel().slice():[];
  if(!pakaiPilihan) beliSetSel([]);
  modal(`<button class="close" onclick="closeModal()">×</button><h3>Catat Penjualan Tiket — ${esc(e.title)}</h3>
  <div class="field"><label>Pilih Tiket</label><select id="pf_class" onchange="pfKelasBerubah('${eid}')">${classes.map(c=>`<option value="${c.id}" ${c.sold>=c.quota?'disabled':''}>${esc(c.name)} - ${IDR(c.price)} ${c.sold>=c.quota?'(SOLD OUT)':'('+(c.quota-c.sold)+' tersisa)'}</option>`).join('')}</select></div>
  <div id="pf_seatwrap"></div>
  <div class="grid g2">
    <div class="field"><label>Nama *</label><input id="pf_name"></div>
    <div class="field"><label>Phone *</label><input id="pf_phone" value="+628"></div>
    <div class="field"><label>Email *</label><input id="pf_email"></div>
    <div class="field"><label>Tgl Lahir</label><input id="pf_bd" type="date"></div>
  </div>
  <div id="pf_total" class="mini" style="margin-top:10px"></div>
  <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn blue" id="pf_go" onclick="doPurchase('${eid}')">Simpan &amp; Tandai Lunas</button></div>`,true);
  /* Kelas tiket dipilihkan dari kursi yang sudah diklik: kalau semua kursi itu
     satu tingkatan, kelas itu yang dipakai. Tanpa ini orang harus menebak
     kelas mana yang cocok dengan kursi yang baru saja dipilihnya. */
  if(bawaan.length){
    const tier=[...new Set(bawaan.map(function(id){ const x=DB.seats.find(function(s2){ return s2.id===id; }); return x&&x.tier; }))];
    const sel=document.getElementById('pf_class');
    if(sel && tier.length===1){
      const c=classes.find(function(x){ return x.name===tier[0]; });
      if(c) sel.value=c.id;
    }
  }
  pfKelasBerubah(eid);
  if(bawaan.length){ beliSetSel(bawaan); pfGambarDenah(eid); pfRingkas(eid); }
}
// Kursi yang bisa dijual untuk sebuah event (denah kustom didahulukan).
function pfKursiEvent(eid){
  const kustom=ldzItems(eid);
  if(kustom.length) return kustom;
  return DB.seats.filter(s=>s.event_id===eid && s.zone!=='Custom');
}
function pfKelasBerubah(eid){
  const wrap=document.getElementById('pf_seatwrap'); if(!wrap) return;
  const c=DB.ticketClasses.find(x=>x.id===(document.getElementById('pf_class')||{}).value);
  const adaDenah=pfKursiEvent(eid).length>0;
  beliSetSel([]);
  if(c && c.is_seated && adaDenah){
    wrap.innerHTML='<div class="field"><label>Pilih Kursi <span class="mini">(klik di denah, boleh lebih dari satu)</span></label>'
      +'<div id="pf_denah"></div><div id="pf_pilihan" class="mini" style="margin-top:6px"></div></div>';
    pfGambarDenah(eid);
  } else if(c && c.is_seated){
    wrap.innerHTML='<p class="mini" style="color:var(--red)">Kelas ini bertanda <b>Seated</b> tapi event ini belum punya denah. Buat denahnya dulu di tab Layout, atau lepas tanda Seated.</p>';
  } else {
    wrap.innerHTML='<div class="field"><label>Jumlah Tiket</label><input id="pf_qty" type="number" min="1" value="1" onchange="pfRingkas(\''+eid+'\')" oninput="pfRingkas(\''+eid+'\')"></div>';
  }
  pfRingkas(eid);
}
/* PERTANYAAN TINGKAT EVENT TIDAK BOLEH DIJAWAB DATA TINGKAT LANTAI.

   Versi sebelumnya memutuskan "pakai denah kustom atau template" lewat
   ldzItems(), yang hanya berisi objek LANTAI YANG SEDANG DIBUKA. Kalau kru
   terakhir kali membuka Lantai 2 yang masih kosong, modal Catat Penjualan
   diam-diam jatuh ke denah TEMPLATE bawaan venue — kursi yang diklik kasir
   bukan kursi yang dirancang di layout, dan tidak ada apa pun di layar yang
   memberi tahu bahwa itu denah yang berbeda.

   Keputusannya sekarang memakai ldzSemuaItems() (lintas lantai), dan kalau
   lantai yang sedang aktif kebetulan kosong, dipindah sendiri ke lantai yang
   ada isinya. */
function pfGambarDenah(eid){
  const box=document.getElementById('pf_denah'); if(!box) return;
  window._beliMode=true;
  const semua=ldzSemuaItems(eid);
  if(semua.length){
    if(!semua.some(function(o){ return ldzLantaiObjek(o)===ldzLantai(); })){
      window._ldzLantai=ldzLantaiObjek(semua[0]);
    }
    box.innerHTML=pfLantaiBar(eid)+ldzCanvasHTML(eid,false);
  } else {
    box.innerHTML=seatMapBody(eid);
  }
  window._beliMode=false;
}
/* Pemilih lantai khusus modal penjualan. TIDAK memakai ldzSetLantai(): fungsi
   itu menggambar ulang seluruh halaman Ticketing, yang berarti modal yang
   sedang diisi kasir ikut tertutup dan isian namanya hilang. */
function pfLantaiBar(eid){
  const semua=ldzSemuaItems(eid);
  const ada=[...new Set(semua.map(ldzLantaiObjek))].sort();
  if(ada.length<2) return '';
  const kini=ldzLantai();
  return '<div class="lm-floors" style="margin:0 0 10px">'+ada.map(function(f){
    const n=semua.filter(function(o){ return ldzLantaiObjek(o)===f; }).length;
    return '<button class="'+(kini===f?'on':'')+'" type="button" onclick="pfSetLantai(\''+eid+'\',\''+f+'\')">'
      +'Lantai '+esc(f)+' <span class="mini">('+n+')</span></button>';
  }).join('')+'</div>';
}
function pfSetLantai(eid,f){
  window._ldzLantai=(String(f)==='2')?'2':'1';
  pfGambarDenah(eid); pfRingkas(eid);
}
function pfRingkas(eid){
  const c=DB.ticketClasses.find(x=>x.id===(document.getElementById('pf_class')||{}).value);
  const pilih=beliSel();
  const kotak=document.getElementById('pf_pilihan');
  if(kotak) kotak.innerHTML=pilih.length
    ? '<b>'+pilih.length+' kursi:</b> '+pilih.map(id=>{const s=DB.seats.find(x=>x.id===id);return esc((s&&(s.table_no||s.seat_no))||'?');}).join(', ')
    : 'Belum ada kursi dipilih — klik meja/kursi di denah.';
  const qtyEl=document.getElementById('pf_qty');
  const n=pilih.length||(qtyEl?Math.max(1,+qtyEl.value||1):1);
  const tot=document.getElementById('pf_total');
  if(tot&&c) tot.innerHTML='<b>'+n+' tiket × '+IDR(c.price)+'</b> + biaya layanan '+IDR(5000*n)
    +' = <b style="color:var(--accent);font-size:15px">'+IDR(n*c.price+5000*n)+'</b>';
}
function doPurchase(eid){
  /* Penjaga tekan-ganda. Tombolnya menyimpan pesanan LALU menutup modal; kalau
     ditekan dua kali cepat (atau Enter ditahan), dua pesanan identik terbentuk
     dengan kursi yang sama — dan kuota ikut berkurang dua kali. Penjaganya
     dilepas lagi di tiap jalur keluar yang gagal, kalau tidak orang terkunci
     setelah satu kesalahan isian. */
  if(window._pfSibuk) return;
  const tombol=document.getElementById('pf_go');
  const lepas=function(){ window._pfSibuk=false; if(tombol){ tombol.disabled=false; tombol.textContent='Simpan & Tandai Lunas'; } };
  window._pfSibuk=true; if(tombol){ tombol.disabled=true; tombol.textContent='Menyimpan\u2026'; }
  const g=x=>{const el=document.getElementById(x);return el?el.value.trim():'';};
  const cid=g('pf_class'),name=g('pf_name'),phone=g('pf_phone'),email=g('pf_email');
  if(!name||!phone||!email){toast('Nama, phone, email wajib.');lepas();return;}
  const c=DB.ticketClasses.find(x=>x.id===cid); if(!c){toast('Pilih kelas tiket dulu.');lepas();return;}
  const kursi=beliSel().slice();
  const qtyEl=document.getElementById('pf_qty');
  const jumlah=kursi.length||(qtyEl?Math.max(1,+qtyEl.value||1):1);
  if(c.is_seated && !kursi.length){toast('Pilih kursinya dulu di denah.');lepas();return;}
  /* Kuota diperiksa untuk SELURUH jumlah, bukan satu per satu — kalau tidak,
     rombongan 6 orang bisa lolos pada sisa kuota 2 dan kuota jadi minus. */
  const sisa=(+c.quota||0)-(+c.sold||0);
  if(jumlah>sisa){toast('⛔ Sisa kuota tinggal '+sisa+' tiket.');lepas();return;}
  // Kursi diperiksa ulang tepat sebelum simpan: bisa saja baru terjual.
  const bentrok=kursi.filter(id=>!beliBisaDipilih(DB.seats.find(s=>s.id===id)));
  if(bentrok.length){toast('⛔ Kursi sudah keburu terjual — pilih ulang.');pfGambarDenah(eid);lepas();return;}

  const oid=uid();
  DB.orders.push({id:oid,event_id:eid,buyer_name:name,phone,email,birthdate:g('pf_bd'),notes:'',
    subtotal:c.price*jumlah,fee:5000*jumlah,total:(c.price+5000)*jumlah,payment_status:'Paid',
    payment_ref:'MID-'+uid().slice(2,8).toUpperCase(),
    // Jejak pencatat: siapa kru yang menerima uangnya, dan dari layar mana.
    recorded_by:namaKru(), recorded_via:(kursi.length?'denah':'formulir'),
    expires_at:new Date(Date.now()+600000).toISOString(),created:new Date().toISOString()});

  const dibuat=[];
  for(let i=0;i<jumlah;i++){
    let seatId=null;
    if(kursi.length){ seatId=kursi[i]; const s=DB.seats.find(x=>x.id===seatId); if(s) s.status='Sold'; }
    else if(c.is_seated){ const av=DB.seats.find(s=>s.ticket_class_id===cid&&s.status==='Available'); if(av){av.status='Sold';seatId=av.id;} }
    const tk={id:uid(),order_item_id:oid,ticket_number:'LM-'+(1000+DB.tickets.length+i),
      qr_token:'QR'+uid()+oid+i,ticket_class_id:cid,seat_id:seatId,pdf_url:'eticket.pdf',status:'Valid'};
    DB.tickets.push(tk); dibuat.push(tk);
  }
  c.sold=(+c.sold||0)+jumlah;
  beliSetSel([]);
  window._pfSibuk=false;
  save();closeModal();
  toast('✓ '+jumlah+' tiket tercatat lunas'+(kursi.length?' · kursi '+kursi.map(id=>{const s=DB.seats.find(x=>x.id===id);return (s&&(s.table_no||s.seat_no))||'?';}).join(', '):'')+'.');
  window._tixTab='sales';renderTicketDetail(eid);
  // E-ticket pertama dibuka; sisanya lewat daftar pembeli — membuka 6 modal
  // bertumpuk tidak menolong siapa pun.
  setTimeout(()=>showETicket(dibuat[0].id),400);
}
function showETicket(tid){
  const tk=DB.tickets.find(x=>x.id===tid);const o=DB.orders.find(x=>x.id===tk.order_item_id);const c=DB.ticketClasses.find(x=>x.id===tk.ticket_class_id);const e=DB.events.find(x=>x.id===o.event_id);const seat=tk.seat_id?DB.seats.find(s=>s.id===tk.seat_id):null;
  modal(`<button class="close" onclick="closeModal()">×</button><h3>🎟️ E-Ticket</h3>
  <div style="display:flex;gap:20px;flex-wrap:wrap">
    <div style="text-align:center">${qrSvg(tk.qr_token)}<div class="mini" style="margin-top:6px">${tk.ticket_number}</div><div class="mini">${statusBadge(tk.status)}</div></div>
    <div class="kv" style="flex:1;min-width:220px">
      <div class="k">Event</div><div><b>${esc(e.title)}</b></div>
      <div class="k">Nama</div><div>${esc(o.buyer_name)}</div>
      <div class="k">Class</div><div>${esc(c.name)}</div>
      <div class="k">Seat</div><div>${seat?esc(seat.table_no):'Standing'}</div>
      <div class="k">Venue</div><div>${esc(e.venue)}</div>
      <div class="k">Waktu</div><div>${fmtDateTime(e.start_datetime)}</div>
      <div class="k">QR Token</div><div class="mini" style="word-break:break-all">${tk.qr_token.slice(0,20)}...</div>
    </div>
  </div>
  <p class="mini" style="margin-top:14px">Terms: QR single-use. Tunjukkan saat check-in.<br><b>Pengiriman otomatis belum aktif</b> — e-ticket ini masih perlu dikirim manual ke pembeli.</p>
  <div class="modal-actions">
    <button class="btn ghost" onclick="copyToken('${tk.qr_token}')">Copy QR Token</button>
    <button class="btn ghost" onclick="unduhQR('${tk.id}')">Unduh QR</button>
    <button class="btn blue" onclick="kirimWA('${tk.id}')">Kirim via WhatsApp</button>
    <button class="btn" onclick="closeModal()">Tutup</button>
  </div>`,true);
}
