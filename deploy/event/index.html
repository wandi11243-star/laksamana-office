/* Kategori tiket TIDAK diberi fungsi hapus baru di sini: delTicketClass()
   sudah ada dan sudah dijaga (menolak kalau tiketnya terjual, dan melepas
   tautan objek denah yang memakainya). Menambah cara kedua untuk pekerjaan
   yang sama berarti dua tempat yang harus diingat saat aturannya berubah,
   dan cepat atau lambat salah satunya tertinggal. */

/* Dialog konfirmasi dengan tombol merah. Dipisah supaya keempat fungsi di
   atas tidak menuliskan bentuknya sendiri-sendiri — kalau ditulis ulang tiap
   kali, cepat atau lambat ada satu yang lupa memakai tombol merah dan
   terlihat seperti tindakan biasa. */
let _hapusCb=null;
function konfirmasiHapus(judul, isi, cb){
  _hapusCb=cb;
  modal(`<h3>${esc(judul)}</h3><div style="margin-top:10px;line-height:1.65">${isi}</div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal()">Batal</button>
      <button class="btn danger" onclick="jalankanHapus()">Hapus Permanen</button>
    </div>`);
}
function jalankanHapus(){ const cb=_hapusCb; _hapusCb=null; closeModal(); if(cb) cb(); }
function modalInfo(judul, isi){
  modal(`<h3>${esc(judul)}</h3><div style="margin-top:10px;line-height:1.65">${isi}</div>
    <div class="modal-actions"><button class="btn" onclick="closeModal()">Mengerti</button></div>`);
}

function delSched(id){DB.schedules=DB.schedules.filter(x=>x.id!==id);save();closeModal();renderSchedule();toast('Jadwal dihapus.');}
function hasConflict(talent_id,date,st,et,ignoreId){return DB.schedules.some(s=>s.talent_id===talent_id&&s.date===date&&s.status!=='Cancelled'&&s.id!==ignoreId&&overlaps(st,et,s.start_time,s.end_time));}
/* ---------- SATU HARI, BISA BANYAK TALENT ----------
   Formulir lama hanya menerima SATU talent per simpan. Padahal satu malam
   sering diisi beberapa penampil (pembuka, band utama, DJ penutup), dan
   memasukkannya berarti membuka formulir yang sama tiga kali sambil
   mengetik ulang tanggal dan jam yang persis sama. Yang mengetik ulang
   akhirnya salah ketik, dan jadwal jadi tidak cocok dengan kenyataan.

   Sekarang talent dicentang — berapa pun. Tiap centang jadi SATU baris
   jadwal sendiri, bukan satu baris berisi banyak nama: fee dibayar per
   orang, konflik diperiksa per orang, dan rekap fee menghitung per orang.
   Satu baris berisi banyak nama akan merusak ketiganya sekaligus.

   FEE TETAP PER ORANG. Kotak fee terisi otomatis dari fee harian
   masing-masing talent dan masih bisa diubah satu per satu — dua penampil
   di malam yang sama jarang dibayar sama besar. */
/* `tgl` datang dari sel kalender yang diklik. Tetap boleh kosong — tombol
   "+ Jadwal" di pojok atas memanggilnya tanpa argumen, dan jatuh ke hari ini
   seperti sebelumnya. */
/* ---------- INPUT MINGGUAN: SATU LEMBAR, BUKAN TUJUH FORMULIR ----------
   Menyusun jadwal seminggu itu tujuh kali pekerjaan yang sama persis.
   Bentuk pertama modul ini: klik sel → centang talent → Simpan → cari sel
   berikutnya di kalender. Bentuk kedua memperbaiki langkah keempat dengan
   merantai tujuh formulir — lebih baik, tapi masih tujuh layar berturut-turut
   yang terlihat sama persis, dan yang mengisi kehilangan hitungan di tengah.
   Jadwal setengah jadi lebih buruk daripada tidak ada, karena yang membacanya
   mengira Rabu memang kosong.

   Sekarang bentuknya LEMBAR, meniru Jadwal Shift: tujuh kolom hari kelihatan
   sekaligus, tombol nama talent di bawah. Klik tombol → masuk ke hari yang
   sedang ditunjuk, dan penunjuknya maju sendiri ke hari berikutnya. Jadi
   "klik, klik, klik" mengisi Senin, Selasa, Rabu tanpa memindahkan tangan.

   Bedanya dengan Jadwal Shift, dan ini yang menentukan bentuk datanya: di
   sana satu sel = satu shift, di sini satu HARI bisa berisi beberapa talent
   (pembuka, band utama, DJ penutup). Karena itu tiap hari menyimpan ARRAY,
   dan tombol talent bisa DISERET ke kolom mana pun untuk menambah tanpa
   memindahkan penunjuk.

   null = lembar sedang tidak terbuka. */
let MG=null;
const HARI_PJG_EMS=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const HARI_PDK_EMS=['SEN','SEL','RAB','KAM','JUM','SAB','MIN'];
function tglGeser(t,n){ const d=new Date(t+'T00:00:00'); d.setDate(d.getDate()+n); return dstr(d); }
function namaHari(t){ const d=new Date(t+'T00:00:00'); return isNaN(d)?'':HARI_PJG_EMS[d.getDay()]; }
/* URUTAN TALENT: yang paling sering & paling baru dipakai naik ke atas.
   Daftar talent tumbuh terus dan tidak pernah menyusut — yang sudah lama tidak
   dipakai tetap tinggal demi riwayat fee-nya. Diurut abjad, band yang tampil
   tiap Jumat bisa berada di bawah sepuluh nama yang terakhir main tahun lalu,
   dan penyusun jadwal menggulir daftar yang sama tiap kali.

   Bobotnya sengaja sederhana dan bisa diterangkan kalau ditanya: jumlah tampil
   90 hari terakhir, lalu tanggal tampil terakhir sebagai pemecah seri, lalu
   abjad. Bukan skor rahasia — kalau urutannya terasa aneh, sebabnya bisa
   ditunjuk. */
function talentUrut(list){
  const batas=tglGeser(dstr(new Date()),-90);
  const skor={}, akhir={};
  (DB.schedules||[]).forEach(function(s){
    if(!s||s.status==='Cancelled'||!s.talent_id) return;
    if(s.date>=batas) skor[s.talent_id]=(skor[s.talent_id]||0)+1;
    if(!akhir[s.talent_id]||s.date>akhir[s.talent_id]) akhir[s.talent_id]=s.date;
  });
  return (list||[]).slice().sort(function(a,b){
    const d=(skor[b.id]||0)-(skor[a.id]||0); if(d) return d;
    const x=akhir[b.id]||'', y=akhir[a.id]||'';
    if(x!==y) return x<y?1:-1;
    return String(a.name||'').localeCompare(String(b.name||''));
  });
}
function talentAktif(){ return talentUrut(DB.talents.filter(function(x){ return x.status!=='Inactive'; })); }
/* SATU penggambar tombol talent untuk TIGA lembar: mingguan, bulanan, dan
   Tambah Jadwal. Sebelumnya tiap lembar menyusun HTML-nya sendiri — dan itu
   jenis duplikasi yang paling gampang menyimpang tanpa ketahuan: satu lembar
   dapat warna barunya, dua lainnya tidak, dan tidak ada yang gagal.
   `aksi` = nama fungsi yang dipanggil saat diklik; `seret` = nama fungsi
   dragstart (kosongkan kalau lembarnya tidak menerima seretan). */
function tombolTalentHTML(t,aksi,seret,aktif){
  const w=talWarna(t), f=talTeks(w);
  return '<button type="button" class="tal-b'+(aktif?' on':'')+'" data-id="'+t.id+'"'
    +' style="background:'+w+';color:'+f+'"'
    +(seret?' draggable="true" ondragstart="'+seret+'(event,&#39;'+t.id+'&#39;)"':'')
    +' onclick="'+aksi+'(&#39;'+t.id+'&#39;)"'
    +' title="'+esc(t.name)+' · '+esc(t.category||'tanpa kategori')+' · '+esc(IDR(t.default_fee||0))+'/hari">'
    +'<b>'+esc(t.name)+'</b>'
    +'<small>'+esc(t.category||'—')+' · '+esc(IDR(t.default_fee||0))+'</small>'
    +'</button>';
}
/* Chip nama di dalam kolom hari. Dipakai lembar mingguan & bulanan. */
function chipTalentHTML(id,judul,onclick,pudar){
  const w=talWarnaId(id), f=talTeks(w);
  const t=DB.talents.find(function(x){ return x.id===id; });
  return '<span class="mg-c'+(pudar?' lama':'')+'" style="background:'+w+';color:'+f+'"'
    +' title="'+esc(judul||'')+'"'+(onclick?' onclick="'+onclick+'"':'')+'>'
    +esc(t?t.name:'?')+'</span>';
}
/* Legenda warna kategori — hanya kategori yang BENAR-BENAR dipakai talent
   aktif. Menampilkan kedelapan-delapannya membuat baris legenda lebih panjang
   daripada lembarnya sendiri di venue yang cuma memakai tiga jenis penampil. */
function legendaTalentHTML(){
  const ada=[];
  talentAktif().forEach(function(t){
    const k=t.category||'—';
    if(ada.indexOf(k)<0) ada.push(k);
  });
  if(!ada.length) return '';
  return '<div class="pill-row" style="margin:-2px 0 10px">'
    +ada.map(function(k){
        return '<span class="mini" style="display:inline-flex;align-items:center;gap:5px">'
          +'<i style="width:11px;height:11px;border-radius:3px;display:inline-block;background:'
          +talWarna(k)+'"></i>'+esc(k)+'</span>';
      }).join('')
    +'</div>';
}
function inputMingguan(){
  /* Senin dari minggu yang sedang dibuka di kalender, bukan dari hari ini:
     orang menekan tombol ini setelah menggulir ke bulan yang mau diisi. */
  const dasar=new Date(schMonth.getFullYear(),schMonth.getMonth(),1);
  const kini=new Date();
  const acuan=(dasar.getFullYear()===kini.getFullYear()&&dasar.getMonth()===kini.getMonth())
    ? kini : dasar;
  const sen=new Date(acuan); sen.setDate(acuan.getDate()-((acuan.getDay()+6)%7));
  mgBuka(dstr(sen));
}
function mgBuka(senin){
  MG={ senin:senin, i:0, mulai:'20:00', selesai:'23:00', tipe:(TAL_CATS[0]||''), hari:[] };
  /* Yang SUDAH terjadwal di minggu itu ikut dimuat, bukan lembar kosong.
     Lembar kosong padahal jadwalnya sudah ada membuat orang mengisi ulang hari
     yang sudah beres — dan tiap isian ulang berakhir sebagai "bentrok,
     dilewati" yang tidak bisa dijelaskan ke yang mengisinya. Baris lama
     ditandai `lama:1`: ia dipajang tapi TIDAK ditulis ulang saat Simpan. */
  for(let k=0;k<7;k++){
    const tgl=tglGeser(senin,k);
    MG.hari.push((DB.schedules||[])
      .filter(function(s){ return s.date===tgl && s.status!=='Cancelled'; })
      .map(function(s){ return {id:s.talent_id, fee:+s.fee||0, lama:1}; }));
  }
  gambarMingguan();
}
function mgGeser(n){ if(!MG) return; mgAmbilForm(); mgBuka(tglGeser(MG.senin,n*7)); }
/* Nilai jam/tipe dibaca dari DOM SEBELUM lembar digambar ulang. Tanpa ini,
   mengubah jam lalu mengklik talent akan mengembalikan jam ke 20:00 — modal
   digambar ulang dari MG, dan yang tidak pernah masuk ke MG tidak ada. */
function mgAmbilForm(){
  if(!MG) return;
  const g=function(id){ const el=document.getElementById(id); return el?el.value:null; };
  MG.mulai   = g('mg_jam1') || MG.mulai;
  MG.selesai = g('mg_jam2') || MG.selesai;
  MG.tipe    = g('mg_tipe') || MG.tipe;
}
function mgKe(i){ if(!MG) return; mgAmbilForm(); MG.i=i; gambarMingguan(); }
/* Menaruh talent di hari ke-i. Satu talent tidak boleh dua kali di hari yang
   sama: itu bukan "tampil dua sesi", itu dua baris jadwal dengan jam identik
   yang akan saling dianggap bentrok saat disimpan, dan fee-nya terhitung
   dobel di rekap. */
function mgTaruh(tid,i){
  if(!MG||i<0||i>6) return false;
  const t=DB.talents.find(function(x){ return x.id===tid; });
  if(MG.hari[i].some(function(x){ return x.id===tid; })){
    toast(((t&&t.name)||'Talent')+' sudah ada di '+namaHari(tglGeser(MG.senin,i))+'.');
    return false;
  }
  MG.hari[i].push({id:tid, fee:(t&&+t.default_fee)||0});
  return true;
}
/* Klik tombol talent = isi hari yang sedang ditunjuk, lalu penunjuk MAJU.
   Di hari terakhir penunjuk berhenti (tidak memutar balik ke Senin): klik
   berlebih yang diam-diam menumpuk di awal minggu jauh lebih mahal daripada
   klik yang tidak melakukan apa-apa. */
function mgKlikTalent(tid){
  if(!MG) return;
  mgAmbilForm();
  if(mgTaruh(tid,MG.i) && MG.i<6) MG.i++;
  gambarMingguan();
}
function mgBuang(i,k){
  if(!MG) return;
  mgAmbilForm(); MG.hari[i].splice(k,1); gambarMingguan();
}
function mgKosongkanHari(i){
  if(!MG) return;
  mgAmbilForm();
  /* Baris lama TIDAK ikut dibuang: menghapus jadwal yang sudah tersimpan
     bukan pekerjaan lembar ini (tempatnya di kalender, lewat Hapus). Yang
     dibersihkan cuma isian yang belum sempat disimpan. */
  MG.hari[i]=MG.hari[i].filter(function(x){ return x.lama; });
  gambarMingguan();
}
/* Seret tombol talent ke kolom hari mana pun — inilah yang membuat satu hari
   bisa berisi dua talent tanpa memindahkan penunjuk bolak-balik. dataTransfer
   dipakai apa adanya; di peramban yang tidak meneruskannya (sebagian peramban
   HP) jalur kliknya tetap ada, dan itu yang utama. */
let MG_SERET=null;
function mgSeretMulai(ev,tid){
  MG_SERET=tid;
  try{ ev.dataTransfer.setData('text/plain',tid); ev.dataTransfer.effectAllowed='copy'; }catch(e){}
}
function mgSeretAtas(ev,i){
  ev.preventDefault();
  const el=document.getElementById('mg_h'+i); if(el) el.classList.add('jatuh');
}
function mgSeretKeluar(i){ const el=document.getElementById('mg_h'+i); if(el) el.classList.remove('jatuh'); }
function mgJatuh(ev,i){
  ev.preventDefault();
  let tid=MG_SERET;
  try{ tid=(ev.dataTransfer&&ev.dataTransfer.getData('text/plain'))||tid; }catch(e){}
  MG_SERET=null;
  if(!tid||!MG) return;
  mgAmbilForm();
  mgTaruh(tid,i);
  MG.i=i;            // penunjuk ikut ke kolom yang dituju — itu yang barusan diperhatikan
  gambarMingguan();
}
function gambarMingguan(){
  if(!MG) return;
  const tals=talentAktif();
  const nama=function(id){ const t=DB.talents.find(function(x){ return x.id===id; }); return t?t.name:'?'; };
  const baru=MG.hari.reduce(function(a,d){ return a+d.filter(function(x){ return !x.lama; }).length; },0);

  const kolom=MG.hari.map(function(isi,i){
    const tgl=tglGeser(MG.senin,i);
    const chip=isi.map(function(x,k){
      return chipTalentHTML(x.id, nama(x.id)+(x.lama?' — sudah tersimpan':' — klik untuk membuang'),
        x.lama?'':('event.stopPropagation();mgBuang('+i+','+k+')'), x.lama);
    }).join('')||'<span class="kosong">·</span>';
    return '<div class="mg-h'+(i===MG.i?' sel':'')+(i>=5?' wknd':'')+'" id="mg_h'+i+'" '
      +'onclick="mgKe('+i+')" ondragover="mgSeretAtas(event,'+i+')" '
      +'ondragleave="mgSeretKeluar('+i+')" ondrop="mgJatuh(event,'+i+')">'
      +'<small>'+HARI_PDK_EMS[i]+'</small><b>'+String(+tgl.slice(8))+'</b>'+chip+'</div>';
  }).join('');

  const tombol=tals.map(function(t){
    return tombolTalentHTML(t,'mgKlikTalent','mgSeretMulai',false);
  }).join('')||'<span class="mini">Belum ada talent. Tambahkan dulu di Talent Management.</span>';

  modal('<button class="close" onclick="MG=null;closeModal()">&times;</button>'
   +'<h3>Input Mingguan</h3>'
   +'<div class="toolbar" style="margin-bottom:10px">'
     +'<button class="btn ghost sm" onclick="mgGeser(-1)">&lsaquo;</button>'
     +'<b style="min-width:190px;text-align:center">'+esc(fmtDate(MG.senin))+' – '+esc(fmtDate(tglGeser(MG.senin,6)))+'</b>'
     +'<button class="btn ghost sm" onclick="mgGeser(1)">&rsaquo;</button>'
     +'<span class="pill">'+baru+' baris baru</span></div>'
   +'<div class="mg-hari">'+kolom+'</div>'
   +'<p class="mini" style="margin:-2px 0 10px">Menunjuk <b>'+esc(namaHari(tglGeser(MG.senin,MG.i)))
     +', '+esc(fmtDate(tglGeser(MG.senin,MG.i)))+'</b> — klik nama talent untuk mengisinya, penunjuk maju sendiri. '
     +'Seret nama ke kolom lain kalau satu hari diisi lebih dari satu talent. '
     +'Nama yang pudar sudah tersimpan sebelumnya dan tidak ditulis ulang.</p>'
   +legendaTalentHTML()
   +'<div class="mg-tal">'+tombol+'</div>'
   +'<div class="grid g3" style="margin-top:12px">'
     +'<div class="field"><label>Jam Mulai</label><input id="mg_jam1" type="time" value="'+esc(MG.mulai)+'"></div>'
     +'<div class="field"><label>Jam Selesai</label><input id="mg_jam2" type="time" value="'+esc(MG.selesai)+'"></div>'
     +'<div class="field"><label>Tipe</label><select id="mg_tipe">'
       +TAL_CATS.map(function(c){ return '<option'+(c===MG.tipe?' selected':'')+'>'+esc(c)+'</option>'; }).join('')
     +'</select></div></div>'
   +'<p class="mini">Jam & tipe berlaku untuk seluruh baris baru minggu ini. Fee memakai fee bawaan '
   +'tiap talent — ubah per baris lewat kalender kalau malam itu beda.</p>'
   +'<div class="modal-actions">'
     +'<button class="btn ghost" onclick="mgKosongkanHari('+MG.i+')">Kosongkan hari ini</button>'
     +'<button class="btn ghost" onclick="MG=null;closeModal()">Batal</button>'
     +'<button class="btn" onclick="mgSimpan()"'+(baru?'':' disabled')+'>Simpan'+(baru?' '+baru+' Jadwal':'')+'</button>'
   +'</div>',true);
}
function mgSimpan(){
  if(!MG) return;
  mgAmbilForm();
  const m=MG.mulai, s=MG.selesai;
  if(m>=s) return toast('Jam selesai harus lebih dari jam mulai.');
  /* Bentrok diperiksa untuk SELURUH lembar sebelum satu pun ditulis — sama
     seperti saveSchedule. Kalau diperiksa sambil menulis, sebagian sudah masuk
     lalu berhenti di tengah, dan yang mengisi harus menebak mana yang jadi. */
  const tulis=[], lewat=[];
  MG.hari.forEach(function(isi,i){
    const tgl=tglGeser(MG.senin,i);
    isi.forEach(function(x){
      if(x.lama) return;
      if(hasConflict(x.id,tgl,m,s)){
        const t=DB.talents.find(function(y){ return y.id===x.id; });
        lewat.push(((t&&t.name)||'?')+' '+fmtDate(tgl));
        return;
      }
      tulis.push({id:uid(),talent_id:x.id,event_id:null,date:tgl,start_time:m,end_time:s,
        performance_type:MG.tipe,fee:x.fee,status:'Scheduled',recurring_rule_id:null,source:'mingguan'});
    });
  });
  if(!tulis.length && !lewat.length) return toast('Belum ada baris baru untuk disimpan.');
  tulis.forEach(function(r){ DB.schedules.push(r); });
  save();
  const dt=new Date(MG.senin+'T00:00:00');
  if(!isNaN(dt)) schMonth=new Date(dt.getFullYear(),dt.getMonth(),1);
  MG=null; closeModal(); renderSchedule();
  toast('✓ '+tulis.length+' jadwal tersimpan'
    +(lewat.length?' · '+lewat.length+' dilewati karena bentrok: '+lewat.slice(0,3).join(', ')
      +(lewat.length>3?' …':''):'')+'.');
}
/* ---------- TAMBAH JADWAL: LEMBAR SATU HARI ----------
   Bentuk lamanya daftar centang — satu baris satu talent, kotak fee di
   sebelahnya. Bekerja, tapi ia benda ketiga yang berbeda di modul yang sama:
   lembar mingguan pakai tombol, lembar bulanan pakai tombol, dan layar yang
   paling sering dibuka justru pakai daftar centang. Kru harus belajar dua cara
   memilih talent untuk pekerjaan yang sama.

   Sekarang tombolnya sama persis dengan dua lembar itu (tombolTalentHTML),
   dan yang terpilih berdiri sebagai baris di bawahnya.

   YANG TIDAK IKUT DISERAGAMKAN, dan itu disengaja: kotak FEE PER TALENT.
   Layar inilah satu-satunya yang punya itu, dan memang harus — dua penampil di
   malam yang sama jarang dibayar sama besar, dan malam tertentu (tahun baru,
   ulang tahun venue) dibayar di luar tarif biasa. Lembar mingguan & bulanan
   memakai fee bawaan karena ia mengisi puluhan baris sekaligus; layar ini
   mengisi satu malam, dan di situlah angkanya memang perlu disentuh. */
let TJ=null;      // {tgl, tipe, mulai, selesai, pilih:[{id,fee}]}
function scheduleForm(tgl){
  TJ={ tgl: tgl||dstr(new Date()), tipe:(TAL_CATS[0]||''),
       mulai:'20:00', selesai:'23:00', pilih:[] };
  gambarTambahJadwal();
}
/* Isian dibaca ke state SEBELUM digambar ulang — pola yang sama dengan
   mgAmbilForm. Yang tidak pernah masuk state akan hilang tanpa jejak pada
   render berikutnya, dan yang paling sering hilang justru fee yang barusan
   diketik untuk talent pertama. */
function tjAmbilForm(){
  if(!TJ) return;
  const g=function(id){ const el=document.getElementById(id); return el?el.value:null; };
  TJ.tgl     = g('s_date')  || TJ.tgl;
  TJ.mulai   = g('s_start') || TJ.mulai;
  TJ.selesai = g('s_end')   || TJ.selesai;
  TJ.tipe    = g('s_type')  || TJ.tipe;
  TJ.pilih.forEach(function(p){
    const el=document.getElementById('tj_fee_'+p.id);
    if(el) p.fee=+String(el.value).replace(/\D/g,'')||0;
  });
}
function tjToggle(tid){
  if(!TJ) return;
  tjAmbilForm();
  const i=TJ.pilih.findIndex(function(x){ return x.id===tid; });
  if(i>-1) TJ.pilih.splice(i,1);
  else {
    const t=DB.talents.find(function(x){ return x.id===tid; });
    TJ.pilih.push({id:tid, fee:(t&&+t.default_fee)||0});
  }
  gambarTambahJadwal();
}
function gambarTambahJadwal(){
  if(!TJ) return;
  const tals=talentAktif();
  const terpilih={}; TJ.pilih.forEach(function(p){ terpilih[p.id]=p; });
  /* Jadwal yang SUDAH ada di tanggal itu ikut diperlihatkan. Tanpa ini orang
     yang mengklik tanggal ramai tidak tahu siapa saja yang sudah masuk, dan
     bentroknya baru ketahuan sesudah menekan Simpan. */
  const sudah=DB.schedules.filter(function(x){ return x.date===TJ.tgl && x.status!=='Cancelled'; });

  const tombol=tals.map(function(t){
    return tombolTalentHTML(t,'tjToggle','',!!terpilih[t.id]);
  }).join('')||'<span class="mini">Belum ada talent. Tambahkan dulu di Talent Management.</span>';

  const baris=TJ.pilih.map(function(p){
    const t=DB.talents.find(function(x){ return x.id===p.id; });
    const w=talWarna(t), f=talTeks(w);
    return '<div class="tj-baris">'
      +'<span class="tj-nm" style="background:'+w+';color:'+f+'">'+esc(t?t.name:'?')+'</span>'
      +'<span class="mini" style="flex:1">'+esc((t&&t.category)||'—')+'</span>'
      +'<span class="uang-wrap" style="width:150px"><span class="uang-rp">Rp</span>'
      +'<input class="uang-inp" id="tj_fee_'+p.id+'" inputmode="numeric" autocomplete="off" '
      +'value="'+esc(uangFormat(p.fee||0))+'" oninput="uangKetik(this)"></span>'
      +'<button class="btn ghost sm" title="Keluarkan" onclick="tjToggle(&#39;'+p.id+'&#39;)">&times;</button>'
      +'</div>';
  }).join('');

  modal('<button class="close" onclick="TJ=null;closeModal()">&times;</button>'
   +'<h3>Tambah Jadwal</h3>'
   +'<p class="mini" style="margin-bottom:10px">Klik nama talent yang tampil <b>'+esc(fmtDate(TJ.tgl))+'</b> — '
     +'boleh lebih dari satu. Tiap nama jadi satu baris jadwal dengan fee-nya sendiri.</p>'
   +(sudah.length?'<div class="mini" style="margin-bottom:10px;padding:8px 10px;background:var(--panel2);border-radius:8px">'
     +'<b>Sudah dijadwalkan hari ini:</b> '
     +sudah.map(function(x){ const t=DB.talents.find(function(y){ return y.id===x.talent_id; });
         return esc((t?t.name:'?')+' ('+x.start_time+')'); }).join(', ')+'</div>':'')
   +legendaTalentHTML()
   +'<div class="mg-tal">'+tombol+'</div>'
   +(TJ.pilih.length
      ? '<div class="tj-list">'+baris+'</div>'
      : '<div class="mini" style="margin-top:10px">Belum ada talent dipilih.</div>')
   +'<div class="grid g2" style="margin-top:12px">'
     +'<div class="field"><label>Tanggal *</label><input id="s_date" type="date" value="'+esc(TJ.tgl)+'" onchange="tjAmbilForm();gambarTambahJadwal()"></div>'
     +'<div class="field"><label>Tipe Performance</label><select id="s_type">'
       +TAL_CATS.map(function(c){ return '<option'+(c===TJ.tipe?' selected':'')+'>'+esc(c)+'</option>'; }).join('')
     +'</select></div>'
     +'<div class="field"><label>Jam Mulai</label><input id="s_start" type="time" value="'+esc(TJ.mulai)+'"></div>'
     +'<div class="field"><label>Jam Selesai</label><input id="s_end" type="time" value="'+esc(TJ.selesai)+'"></div>'
   +'</div>'
   +'<div class="modal-actions">'
     +'<button class="btn ghost" onclick="TJ=null;closeModal()">Batal</button>'
     +'<button class="btn" onclick="saveSchedule()"'+(TJ.pilih.length?'':' disabled')+'>Simpan'
       +(TJ.pilih.length>1?' '+TJ.pilih.length+' Jadwal':'')+'</button></div>',true);
}
function saveSchedule(){
  if(!TJ) return;
  tjAmbilForm();
  const date=TJ.tgl, st=TJ.mulai, et=TJ.selesai, type=TJ.tipe;
  if(!TJ.pilih.length){ toast('Pilih minimal satu talent dulu.'); return; }
  if(st>=et){ toast('Jam selesai harus > jam mulai.'); return; }

  /* Konflik diperiksa untuk SEMUA yang dipilih SEBELUM satu pun disimpan.
     Kalau diperiksa sambil menyimpan, sebagian sudah masuk lalu prosesnya
     berhenti di tengah — dan orang harus menebak mana yang sudah tersimpan
     dan mana yang belum. */
  const bentrok=TJ.pilih.filter(function(p){ return hasConflict(p.id,date,st,et); })
    .map(function(p){ const t=DB.talents.find(function(x){ return x.id===p.id; }); return (t&&t.name)||p.id; });
  if(bentrok.length){ toast('Bentrok di '+fmtDate(date)+': '+bentrok.join(', ')); return; }

  const n=TJ.pilih.length;
  TJ.pilih.forEach(function(p){
    DB.schedules.push({id:uid(),talent_id:p.id,event_id:null,date:date,start_time:st,end_time:et,
      performance_type:type, fee:+p.fee||0,
      status:'Scheduled', recurring_rule_id:null, source:'manual'});
  });
  save();
  /* Pindah ke bulan tanggalnya kalau perlu — menyimpan jadwal bulan depan
     lalu dikembalikan ke bulan ini membuat orang mengira simpanannya gagal. */
  const dt=new Date(date+'T00:00:00');
  if(!isNaN(dt)) schMonth=new Date(dt.getFullYear(),dt.getMonth(),1);
  TJ=null;
  toast(n>1 ? n+' jadwal tersimpan (tanpa konflik).' : 'Jadwal tersimpan (tanpa konflik).');
  closeModal(); renderSchedule();
}
/* ATURAN BERULANG UNTUK LEBIH DARI SATU TALENT.
   Yang sebenarnya terjadi di lapangan: "band A tiap Jumat, band B tiap Sabtu,
   akustik C tiap Minggu" — jam, rentang tanggal, dan tipenya sama persis,
   cuma namanya beda. Dengan satu dropdown, itu berarti membuka formulir ini
   tiga kali dan mengetik ulang seluruh isinya tiga kali.

   DROPDOWN PENCARIAN TETAP ADA, dan itu disengaja: untuk daftar talent yang
   panjang, mengetik dua huruf nama jauh lebih cepat daripada mencari tombolnya
   di antara puluhan. Dua jalan masuk (dropdown + panel tombol), satu keranjang
   yang sama — RECUR_TAL. Yang dilihat pemakai selalu barisan chip di atas,
   bukan "yang terakhir dipilih di salah satu alat". */
let RECUR_TAL=[];
function recurringModal(){
  RECUR_TAL=[];
  modal(`<button class="close" onclick="closeModal()">×</button><h3>🔁 Recurring Schedule</h3><p class="mini" style="margin-bottom:12px">Buat aturan berulang, sistem auto-generate dalam rentang tanpa duplikasi (idempotent). Talent boleh lebih dari satu — tiap talent dapat aturannya sendiri.</p>
  <div class="field"><label>Talent</label>
    <div id="r_chips" class="pill-row" style="margin-bottom:7px"><span class="mini">Belum ada talent dipilih.</span></div>
    <div style="display:flex;gap:7px;align-items:center;flex-wrap:wrap">
      <select id="r_tal" style="flex:1;min-width:170px"><option value="">— cari &amp; pilih talent —</option>${DB.talents.map(t=>`<option value="${t.id}">${esc(t.name)}${t.category?' · '+esc(t.category):''}</option>`).join('')}</select>

    </div>
  </div>
  <div class="field"><label>Hari</label><div style="display:flex;gap:8px;flex-wrap:wrap">${DOW.map((d,i)=>`<label style="display:inline-flex;gap:4px;color:var(--txt)"><input type="checkbox" style="width:auto" value="${i}" class="r_dow">${d}</label>`).join('')}</div></div>
  <div class="grid g2">
    <div class="field"><label>Tipe</label><select id="r_type">${TAL_CATS.map(c=>`<option>${c}</option>`).join('')}</select></div>
    <div class="field"><label>Fee / show</label>${uangInput('r_fee',0)}<span class="mini">Rp 0 = pakai fee bawaan masing-masing talent.</span></div>
    <div class="field"><label>Jam Mulai</label><input id="r_start" type="time" value="20:00"></div>
    <div class="field"><label>Jam Selesai</label><input id="r_end" type="time" value="23:00"></div>
    <div class="field"><label>Dari</label><input id="r_from" type="date" value="${dstr(new Date())}"></div>
    <div class="field"><label>Sampai</label><input id="r_to" type="date" value="${dstr(new Date(new Date().getFullYear(),new Date().getMonth()+2,0))}"></div>
  </div>
  <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn" onclick="genRecurring()">Generate</button></div>`,true);
}
function recurPopup(){
  const p=document.getElementById('r_pop'); if(!p) return;
  p.style.display=(p.style.display==='none'?'':'none');
  if(p.style.display===''){ const c=document.getElementById('r_cari'); if(c) c.focus(); }
}
function recurTalTambah(){
  const s=document.getElementById('r_tal'); if(!s||!s.value) return;
  if(RECUR_TAL.indexOf(s.value)<0) RECUR_TAL.push(s.value);
  s.value='';                       // dikosongkan lagi supaya jelas ia alat TAMBAH, bukan penampung pilihan
  catTalRecur();
}
function recurTalToggle(id){
  const i=RECUR_TAL.indexOf(id);
  if(i<0) RECUR_TAL.push(id); else RECUR_TAL.splice(i,1);
  catTalRecur();
}
function recurCari(q){
  const s=String(q||'').toLowerCase();
  [].forEach.call(document.querySelectorAll('.tal-b'),function(b){
    b.style.display=(b.textContent.toLowerCase().indexOf(s)>-1?'':'none');
  });
}
/* Menggambar ulang HANYA barisan chip + keadaan tombol. Menggambar ulang
   seluruh modal (pola biasa di modul ini) akan mengosongkan tanggal, jam, dan
   centang hari yang sudah diisi — modal() menimpa innerHTML, dan nilai <input>
   tidak ikut terbawa string HTML. */
function catTalRecur(){
  const box=document.getElementById('r_chips');
  if(box) box.innerHTML=RECUR_TAL.length
    ? RECUR_TAL.map(function(id){
        const t=DB.talents.find(function(x){ return x.id===id; });
        return '<span class="badge b-blue" style="cursor:pointer" title="Buang dari daftar" '
          +'onclick="recurTalToggle(\''+id+'\')">'+esc(t?t.name:'?')+' &times;</span>';
      }).join(' ')
    : '<span class="mini">Belum ada talent dipilih.</span>';
  [].forEach.call(document.querySelectorAll('.tal-b'),function(b){
    b.classList.toggle('on',RECUR_TAL.indexOf(b.getAttribute('data-id'))>-1);
  });
}
function genRecurring(){
  const g=x=>document.getElementById(x).value;
  const dows=[...document.querySelectorAll('.r_dow:checked')].map(c=>+c.value);
  if(!dows.length){toast('Pilih minimal satu hari.');return;}
  if(!RECUR_TAL.length){toast('Pilih minimal satu talent.');return;}
  const st=g('r_start'),et=g('r_end'),type=g('r_type'),feeIsi=uangNilai('r_fee');
  const dari=g('r_from'),sampai=g('r_to'),to=new Date(sampai);
  let added=0,skipped=0;
  RECUR_TAL.forEach(function(tid){
    const t=DB.talents.find(function(x){ return x.id===tid; });
    /* Fee kosong = fee bawaan MASING-MASING talent. Satu angka datar untuk
       tiga orang yang tarifnya berbeda adalah cara paling mudah membuat rekap
       pembayaran salah tanpa ada satu pun galat yang muncul. */
    const fee=feeIsi||(t&&+t.default_fee)||0;
    const rid=uid();
    DB.recurringRules.push({id:rid,talent_id:tid,days_of_week:dows,start_time:st,end_time:et,
      valid_from:dari,valid_to:sampai,performance_type:type,fee});
    for(let d=new Date(dari);d<=to;d.setDate(d.getDate()+1)){
      if(!dows.includes(d.getDay())) continue;
      const ds=dstr(d);
      if(hasConflict(tid,ds,st,et)){skipped++;continue;}
      DB.schedules.push({id:uid(),talent_id:tid,event_id:null,date:ds,start_time:st,end_time:et,
        performance_type:type,fee,status:'Scheduled',recurring_rule_id:rid,source:'recurring'});
      added++;
    }
  });
  save();closeModal();renderSchedule();
  toast('✓ '+added+' jadwal dibuat untuk '+RECUR_TAL.length+' talent'
    +(skipped?', '+skipped+' dilewati (konflik/duplikat)':'')+'.');
}
/* ---------- GENERATE BULANAN: LEMBAR YANG SAMA DENGAN INPUT MINGGUAN ----------
   Bentuk lamanya tabel tujuh baris berisi dropdown — satu hari, satu talent,
   selamanya. Dua hal yang tidak bisa dilakukannya, dan dua-duanya keadaan biasa:
   malam Sabtu yang diisi band pembuka DAN DJ penutup, dan menyusun pola sebulan
   tanpa membuka tujuh dropdown satu per satu.

   Sekarang bentuknya sama persis dengan Input Mingguan (lihat mgBuka): tujuh
   kolom, tombol nama talent di bawah, klik mengisi kolom yang ditunjuk lalu
   penunjuk maju sendiri, dan tombolnya bisa DISERET ke kolom mana pun. Kru
   yang sudah hafal satu lembar tidak perlu belajar lembar kedua.

   BEDANYA satu, dan ini yang menentukan artinya: kolom di sini bukan TANGGAL
   melainkan HARI DALAM SEMINGGU. Apa yang ditaruh di kolom Jumat berlaku untuk
   SETIAP Jumat di bulan yang sedang dibuka — itu memang guna halaman ini.
   Jumlah tanggal yang akan terbentuk ditulis di kepala lembar supaya tidak ada
   yang menekan Generate sambil mengira hasilnya cuma tujuh baris.

   Urutan kolom Senin-dulu, sama dengan lembar mingguan. Pemetaan ke getDay()
   ((i+1)%7) ditulis SEKALI di blLibur(): dua tempat yang memetakan sendiri-
   sendiri adalah cara paling mudah membuat pola "tiap Jumat" mendarat di Kamis
   tanpa satu pun galat. */
let BLN=null;
function blDow(i){ return (i+1)%7; }          // 0=Senin di lembar  ->  getDay()
function monthlyGenModal(){
  BLN={ i:0, mulai:'20:00', selesai:'23:00', tipe:(TAL_CATS[0]||''),
        hari:[[],[],[],[],[],[],[]] };

}
function blAmbilForm(){
  if(!BLN) return;

  BLN.mulai   = g('bl_jam1') || BLN.mulai;
  BLN.selesai = g('bl_jam2') || BLN.selesai;
  BLN.tipe    = g('bl_tipe') || BLN.tipe;
}
function blKe(i){ if(!BLN) return; blAmbilForm(); BLN.i=i; gambarBulanan(); }
function blTaruh(tid,i){
  if(!BLN||i<0||i>6) return false;
  const t=DB.talents.find(function(x){ return x.id===tid; });
  if(BLN.hari[i].some(function(x){ return x.id===tid; })){
    toast(((t&&t.name)||'Talent')+' sudah ada di kolom '+HARI_PJG_EMS[blDow(i)]+'.');
    return false;
  }
  BLN.hari[i].push({id:tid, fee:(t&&+t.default_fee)||0});
  return true;
}
function blKlikTalent(tid){
  if(!BLN) return;
  blAmbilForm();

  gambarBulanan();
}
function blBuang(i,k){ if(!BLN) return; blAmbilForm(); BLN.hari[i].splice(k,1); gambarBulanan(); }
function blKosongkanHari(i){ if(!BLN) return; blAmbilForm(); BLN.hari[i]=[]; gambarBulanan(); }
let BL_SERET=null;
function blSeretMulai(ev,tid){
  BL_SERET=tid;
  try{ ev.dataTransfer.setData('text/plain',tid); ev.dataTransfer.effectAllowed='copy'; }catch(e){}
}
function blSeretAtas(ev,i){ ev.preventDefault(); const el=document.getElementById('bl_h'+i); if(el) el.classList.add('jatuh'); }
function blSeretKeluar(i){ const el=document.getElementById('bl_h'+i); if(el) el.classList.remove('jatuh'); }
function blJatuh(ev,i){
  ev.preventDefault();

  try{ tid=(ev.dataTransfer&&ev.dataTransfer.getData('text/plain'))||tid; }catch(e){}

/* Berapa tanggal yang benar-benar akan terbentuk. Dihitung dari kalender bulan
   yang sedang dibuka, bukan ditaksir 4 minggu: bulan bisa punya lima Jumat, dan
   selisih satu malam adalah satu talent yang tidak dibayar atau satu malam yang
   tidak ada penampilnya. */
function blHitung(){
  if(!BLN) return {tgl:0, baris:0};
  const y=schMonth.getFullYear(), m=schMonth.getMonth();
  const hari=new Date(y,m+1,0).getDate();
  let tgl=0, baris=0;
  for(let d=1;d<=hari;d++){
    const dow=new Date(y,m,d).getDay();
    const kolom=BLN.hari[(dow+6)%7];
    if(kolom.length){ tgl++; baris+=kolom.length; }
  }
  return {tgl:tgl, baris:baris};
}
function gambarBulanan(){
  if(!BLN) return;
  const tals=talentAktif();

  const tombol=tals.map(function(t){

  }).join('')||'<span class="mini">Belum ada talent. Tambahkan dulu di Talent Management.</span>';

  modal('<button class="close" onclick="BLN=null;closeModal()">&times;</button>'
   +'<h3>Generate Bulanan</h3>'
   +'<div class="toolbar" style="margin-bottom:10px">'
     +'<b style="min-width:170px">'+MONTHS[schMonth.getMonth()]+' '+schMonth.getFullYear()+'</b>'
     +'<span class="pill">'+n.tgl+' tanggal</span>'
     +'<span class="pill">'+n.baris+' jadwal akan dibuat</span></div>'
   +'<div class="mg-hari">'+kolom+'</div>'
   +'<p class="mini" style="margin:-2px 0 10px">Menunjuk kolom <b>'+esc(HARI_PJG_EMS[blDow(BLN.i)])+'</b> — '
     +'klik nama talent untuk mengisinya, penunjuk maju sendiri. Seret nama ke kolom lain kalau satu '
     +'malam diisi lebih dari satu talent. Isi kolom berlaku untuk <b>setiap</b> hari itu sepanjang bulan.</p>'
   +legendaTalentHTML()
   +'<div class="mg-tal">'+tombol+'</div>'
   +'<div class="grid g3" style="margin-top:12px">'
     +'<div class="field"><label>Jam Mulai</label><input id="bl_jam1" type="time" value="'+esc(BLN.mulai)+'"></div>'
     +'<div class="field"><label>Jam Selesai</label><input id="bl_jam2" type="time" value="'+esc(BLN.selesai)+'"></div>'
     +'<div class="field"><label>Tipe</label><select id="bl_tipe">'
       +TAL_CATS.map(function(c){ return '<option'+(c===BLN.tipe?' selected':'')+'>'+esc(c)+'</option>'; }).join('')
     +'</select></div></div>'
   +'<p class="mini">Jam &amp; tipe berlaku untuk seluruh jadwal yang dibuat. Fee memakai fee bawaan tiap '
   +'talent. Tanggal yang bentrok dilewati, tidak ditimpa.</p>'
   +'<div class="modal-actions">'
     +'<button class="btn ghost" onclick="blKosongkanHari('+BLN.i+')">Kosongkan kolom ini</button>'
     +'<button class="btn ghost" onclick="BLN=null;closeModal()">Batal</button>'
     +'<button class="btn" onclick="genMonthly()"'+(n.baris?'':' disabled')+'>Generate'+(n.baris?' '+n.baris+' Jadwal':'')+'</button>'
   +'</div>',true);
}
function genMonthly(){
  if(!BLN) return;
  blAmbilForm();
  const st=BLN.mulai, et=BLN.selesai;
  if(st>=et) return toast('Jam selesai harus lebih dari jam mulai.');
  const y=schMonth.getFullYear(), m=schMonth.getMonth(), hari=new Date(y,m+1,0).getDate();
  /* Sama seperti lembar mingguan: seluruh bulan diperiksa dulu, baru ditulis.
     Kalau diperiksa sambil menulis, sebagian sudah masuk lalu berhenti di
     tengah dan yang mengisi harus menebak mana yang jadi. */
  const tulis=[]; let lewat=0, totalFee=0;
  for(let d=1;d<=hari;d++){
    const dt=new Date(y,m,d), ds=dstr(dt);
    const isi=BLN.hari[(dt.getDay()+6)%7];
    isi.forEach(function(x){
      if(hasConflict(x.id,ds,st,et)){ lewat++; return; }
      const t=DB.talents.find(function(z){ return z.id===x.id; });
      const fee=(+x.fee)||(t&&+t.default_fee)||0;
      tulis.push({id:uid(),talent_id:x.id,event_id:null,date:ds,start_time:st,end_time:et,
        performance_type:BLN.tipe,fee:fee,status:'Scheduled',recurring_rule_id:null,
        source:'monthly_generator'});
      totalFee+=fee;
    });
  }
  if(!tulis.length && !lewat) return toast('Belum ada kolom hari yang diisi.');
  tulis.forEach(function(r){ DB.schedules.push(r); });
  save(); BLN=null; closeModal(); renderSchedule();
  toast('✓ '+tulis.length+' jadwal ter-generate · total fee '+IDR(totalFee)
    +(lewat?' · '+lewat+' dilewati (bentrok)':'')+'.');
}
/* ---- DAILY ENTERTAINMENT RULES ----
   Dulu ini cuma satu kotak teks bebas per hari, dan tidak ada satu baris kode
   pun yang membacanya — padahal keterangannya sendiri berjanji "generator
   menghormati aturan ini". Jadi aturannya tidak pernah berlaku: yang menulis
   "Sen: DJ 21:00-01:00" tetap harus mengisi ulang semuanya tiap kali membuat
   jadwal bulanan.

   Sekarang aturannya berisi kolom yang bisa dipakai mesin: kategori talent,
   jam mulai/selesai, dan fee. Generate Bulanan mengambil bawaannya dari sini
   (lihat monthlyGenModal), dan kolom catatan bebas tetap ada untuk hal yang
   tidak bisa dijadikan kolom. */
function ruleNormal(r){
  r=r||{};
  return {day:r.day||'', rule:r.rule||'', category:r.category||'',
          start:r.start||'', end:r.end||'', fee:+r.fee||0};
}
function dailyRulesModal(){

  <p class="mini" style="margin-bottom:12px">Pola tetap tiap hari. <b>Generate Bulanan mengambil bawaannya dari sini</b> — kategori, jam, dan fee tinggal dipakai atau ditimpa. Mengubah aturan tidak menyentuh jadwal yang sudah ada.</p>
  <div class="tbl-edit"><table><thead><tr><th style="width:62px">Hari</th><th>Kategori</th><th style="width:96px">Mulai</th><th style="width:96px">Selesai</th><th style="width:130px">Fee</th><th>Catatan</th></tr></thead><tbody>

    <td><select class="inp er_cat" data-i="${i}"><option value="">— kosong —</option>${TAL_CATS.map(c=>`<option ${r.category===c?'selected':''}>${c}</option>`).join('')}</select></td>

    <td><input class="inp er_end" type="time" data-i="${i}" value="${esc(r.end)}"></td>

    <td><input class="inp er_rule" data-i="${i}" value="${esc(r.rule)}" placeholder="catatan bebas"></td>
  </tr>`).join('')}
  </tbody></table></div>
  <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn" onclick="saveDailyRules()">Simpan</button></div>`,true);
}
function saveDailyRules(){
  DB.entertainmentRules=DB.entertainmentRules.map(ruleNormal);
  const set=(cls,f)=>document.querySelectorAll('.'+cls).forEach(el=>f(DB.entertainmentRules[+el.dataset.i],el));

/* Aturan hari tertentu (0=Minggu). Dipakai Generate Bulanan.

   DAILY RULES SUDAH DICABUT DARI LAYAR, jadi fungsi ini SELALU memulangkan
   aturan kosong. Ini disengaja dan bukan setengah jalan: begitu tombolnya
   hilang, isi DB.entertainmentRules tidak bisa dilihat maupun diubah siapa

   jadwal sebulan adalah bentuk yang paling buruk. Lebih baik tidak ada sama

   fee semuanya kelihatan di lembarnya sendiri. Dibiarkan berdiri bersama
   dailyRulesModal() sebagai satu fitur utuh yang tertidur — kalau kelak
   dihidupkan lagi, keduanya masih sepasang. Jangan dipanggil dari kode baru:
   yang tidak bisa diperiksa di layar tidak boleh menentukan angka. */
function ruleHari(dow){
  return ruleNormal({});
}

/* ============ FEE & PAYMENT ============
   FEE YANG DIISI DI TALENT MANAGEMENT ADALAH FEE PER HARI TAMPIL.
   Rekap di bawah menjumlahkannya per periode: tiap jadwal berstatus Done
   adalah satu hari tampil, jadi total = jumlah hari x fee hari itu. Fee tiap
   jadwal disimpan per baris, bukan diambil ulang dari profil talent — kalau
   diambil ulang, menaikkan fee seseorang bulan ini akan diam-diam mengubah
   tagihan bulan-bulan yang sudah lewat.

   PERIODENYA BISA MINGGUAN. Sebelumnya hanya bulanan, dan itu tidak cocok
   dengan cara bayar yang sebenarnya: banyak penampil dibayar tiap akhir
   pekan, bukan menunggu tanggal 1. Yang membayar mingguan terpaksa
   menghitung sendiri dari daftar bulanan — dan hitungan tangan yang diulang
   tiap minggu pasti meleset suatu saat. */
let feeMode='bulan';          // 'minggu' | 'bulan' | 'rentang'
let feeMonth=dstr(new Date()).slice(0,7);
let feeDari='', feeSampai='';

/* Rentang tanggal periode yang sedang dipilih, apa pun modenya. Satu tempat
   supaya rekap, tombol Generate, dan rincian tagihan tidak pernah memakai
   rentang yang berbeda. */
function feeRentang(){
  if(feeMode==='rentang'){
    const a=feeDari||dstr(new Date()), b=feeSampai||a;
    return a<=b?{a:a,b:b}:{a:b,b:a};
  }
  if(feeMode==='minggu'){
    /* Senin sampai Minggu. Awal pekan Senin, bukan Minggu: itu yang dipakai
       modul jadwal shift dan cara orang di sini menyebut "minggu ini". */
    const d=feeDari?new Date(feeDari+'T00:00:00'):new Date();
    const geser=(d.getDay()+6)%7;
    const sen=new Date(d); sen.setDate(d.getDate()-geser);
    const min=new Date(sen); min.setDate(sen.getDate()+6);
    return {a:dstr(sen), b:dstr(min)};
  }
  const th=+feeMonth.slice(0,4), bl=+feeMonth.slice(5,7);
  return {a:feeMonth+'-01', b:dstr(new Date(th, bl, 0))};
}
function feeLabelPeriode(){
  const r=feeRentang();
  if(feeMode==='bulan') return MONTHS[+feeMonth.slice(5)-1]+' '+feeMonth.slice(0,4);
  return fmtDate(r.a)+' - '+fmtDate(r.b);
}
/* Kunci periode untuk baris pembayaran. Bulanan tetap memakai 'YYYY-MM'
   supaya tagihan lama tetap ketemu; periode lain memakai rentangnya, jadi
   tagihan mingguan tidak pernah tertukar dengan tagihan bulanan. */
function feeKunci(){
  const r=feeRentang();
  return feeMode==='bulan' ? feeMonth : (r.a+'..'+r.b);
}
/* Dua bentuk kunci periode, jadi dua bentuk pembacanya — dan KEDUANYA harus
   lewat sini.

   Yang dulu salah: layar Bayar, Tandai Lunas, dan Detail sama-sama menulis
   `MONTHS[+p.period_month.slice(5)-1] + ' ' + p.period_month.slice(0,4)`,
   yaitu menganggap kuncinya SELALU 'YYYY-MM'. Untuk tagihan mingguan/rentang
   kuncinya 'YYYY-MM-DD..YYYY-MM-DD', jadi slice(5) menghasilkan '08-03..…',
   `+` atasnya NaN, dan MONTHS[NaN-1] undefined. Yang terbaca petugas finance
   tepat sebelum mentransfer uang: "**undefined 2026**" — tanpa satu pun galat
   di console, karena secara teknis tidak ada yang gagal. */
function labelPeriodeBayar(kunci){
  const k=String(kunci||'');
  const p=k.split('..');
  if(p.length===2) return fmtDate(p[0])+' - '+fmtDate(p[1]);
  if(/^\d{4}-\d{2}$/.test(k)) return MONTHS[+k.slice(5)-1]+' '+k.slice(0,4);
  return k||'—';
}
/* Rentang tanggal yang DICAKUP satu kunci periode. Dipakai riwayat di profil
   talent untuk menentukan show mana yang sudah terbayar. Sebelumnya di sana
   ditulis `p.period_month === s.date.slice(0,7)`, yang berarti tagihan
   mingguan TIDAK PERNAH cocok dengan show mana pun: fee-nya sudah ditransfer
   dan statusnya Paid, tapi profil talent tetap memajang "Waiting" selamanya —
   dan yang menagih ulang berdasarkan layar itu adalah talentnya sendiri. */
function rentangPeriodeBayar(kunci){
  const k=String(kunci||'');
  const p=k.split('..');
  if(p.length===2) return {a:p[0], b:p[1]};
  if(/^\d{4}-\d{2}$/.test(k)) return {a:k+'-01', b:dstr(new Date(+k.slice(0,4), +k.slice(5,7), 0))};
  return null;
}
function feeSetMode(m){
  feeMode=m;
  if(m!=='bulan' && !feeDari) feeDari=dstr(new Date());
  renderFee();
}
function feeGeser(arah){
  const r=feeRentang();
  if(feeMode==='bulan'){
    feeMonth=dstr(new Date(+feeMonth.slice(0,4), +feeMonth.slice(5,7)-1+arah, 1)).slice(0,7);
  }else if(feeMode==='minggu'){
    const d=new Date(r.a+'T00:00:00'); d.setDate(d.getDate()+7*arah); feeDari=dstr(d);
  }else{
    const a=new Date(r.a+'T00:00:00'), b=new Date(r.b+'T00:00:00');
    const n=Math.round((b-a)/86400000)+1;
    a.setDate(a.getDate()+n*arah); b.setDate(b.getDate()+n*arah);
    feeDari=dstr(a); feeSampai=dstr(b);
  }
  renderFee();
}
/* Fee satu baris jadwal, SELALU sebagai angka.
   Sebelum ini rekap memakai `total += s.fee` mentah, dan tiga bentuk data yang
   sama-sama nyata ada di DB.schedules membuatnya patah tanpa satu pun galat:

     fee: 1500000      angka        -> benar
     fee: '2.000.000'  teks         -> 0 + '2.000.000' = '02.000.000' (disambung, bukan dijumlah)
     fee: undefined    tak ada      -> '...' + undefined = '02.000.000undefined'
     fee: null         dikosongkan  -> 0 + null = 0 (fee-nya hilang diam-diam)

   Akibatnya berlapis: kolom Total Fee mencetak "Rp02.000.000undefined", pil
   "Total fee" di atasnya jadi sambungan seluruh angka sebulan, dan tombol
   Generate Payment BERHENTI BEKERJA sama sekali — nilainya ditempelkan
   langsung ke onclick sebagai `genPayment('t2',02.000.000undefined,2)`, yang
   bukan JavaScript yang sah, jadi menekannya tidak melakukan apa pun.

   Angka dibaca apa adanya; teks dibersihkan dari pemisah ribuan. Yang tidak
   bisa dibaca jatuh ke 0 — dan supaya 0 itu tidak diam-diam terbayar, jadwal
   tanpa fee dihitung tersendiri dan ditandai di layar (lihat tanpaFee). */
function feeAngka(s){
  const v=s?s.fee:0;
  if(typeof v==='number') return isFinite(v)?v:0;
  return +String(v==null?'':v).replace(/[^\d]/g,'')||0;
}
/* ---------- RINCIAN SATU TALENT (ala rekap Jadwal Shift) ----------
   Tabel di bawah menjawab "siapa dibayar berapa". Yang tidak dijawabnya, dan
   selalu jadi pertanyaan berikutnya begitu angkanya dibawa ke talent-nya:
   "empat hari itu tanggal berapa saja", dan "saya ingat main enam kali, kenapa
   di sini empat".

   Pertanyaan kedua itu yang paling sering jadi perselisihan, dan sebabnya
   hampir selalu sama: dua jadwal masih berstatus Scheduled/Confirmed, belum
   ditandai Done. Karena itu panel ini menampilkan SELURUH jadwal pada periode
   itu — yang tidak Done ikut dipajang, diberi tanda, dan diterangkan bahwa ia
   belum masuk hitungan. Menyembunyikannya berarti selisihnya cuma bisa
   ditemukan dengan membuka kalender satu per satu. */
let FEE_PILIH=null;
function feePilih(tid){ FEE_PILIH=(FEE_PILIH===tid?null:tid); renderFee(); }
function feeRincianHTML(){
  if(!FEE_PILIH) return '';
  const t=DB.talents.find(function(x){ return x.id===FEE_PILIH; });
  if(!t){ FEE_PILIH=null; return ''; }
  const per=feeRentang();
  const semua=(DB.schedules||[])
    .filter(function(s){ return s.talent_id===t.id && s.date>=per.a && s.date<=per.b; })
    .sort(function(a,b){ return String(a.date).localeCompare(String(b.date)); });
  const done=semua.filter(function(s){ return s.status==='Done'; });
  const belum=semua.filter(function(s){ return s.status!=='Done' && s.status!=='Cancelled'; });
  const batal=semua.filter(function(s){ return s.status==='Cancelled'; });
  const total=done.reduce(function(a,s){ return a+feeAngka(s); },0);
  const nanti=belum.reduce(function(a,s){ return a+feeAngka(s); },0);
  const pay=(DB.talentPayments||[]).find(function(p){ return p.talent_id===t.id && p.period_month===feeKunci(); });

  let h='<div class="card" style="margin-bottom:14px;border-color:var(--accent)">'
   +'<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">'
   +'<div><h3 class="sec" style="margin-bottom:2px">'+esc(t.name)+'</h3>'
   +'<span class="mini">'+esc(t.category||'')+' · '+esc(feeLabelPeriode())
   +(t.bank_name?' · '+esc(t.bank_name)+(t.bank_account?' '+esc(t.bank_account):''):'')+'</span></div>'
   +'<button class="btn ghost sm" onclick="feePilih(&#39;'+t.id+'&#39;)">Tutup</button></div>'
   +'<div class="grid g4" style="margin:12px 0">'
   +stat('Hari Tampil',done.length,'berstatus Done')
   +stat('Total Dibayar',IDR(total),done.length?('rata-rata '+IDR(Math.round(total/done.length))+' / hari'):'belum ada yang selesai')
   +stat('Belum Dihitung',belum.length,belum.length?('senilai '+IDR(nanti)+' — belum Done'):'semua sudah diputuskan')
   +stat('Status Tagihan',pay?pay.status:'—',pay?('dibuat '+fmtDate(String(pay.created_at||'').slice(0,10))):'belum di-generate')
   +'</div>';

  if(!semua.length){
    return h+'<div class="empty">Tidak ada jadwal pada periode ini.</div></div>';
  }
  h+='<div class="tbl-lebar"><table><thead><tr><th>Tanggal</th><th>Hari</th><th>Jam</th>'
   +'<th>Tipe</th><th>Status</th><th style="text-align:right">Fee</th></tr></thead><tbody>';
  semua.forEach(function(s){
    const f=feeAngka(s);
    const ikut=(s.status==='Done');
    h+='<tr'+(ikut?'':' style="opacity:.6"')+'>'
      +'<td><a href="javascript:schedInfo(\''+s.id+'\')" style="color:var(--accent)">'+esc(fmtDate(s.date))+'</a></td>'
      +'<td class="mini">'+esc(namaHari(s.date))+'</td>'
      +'<td class="mini">'+esc(s.start_time||'')+'–'+esc(s.end_time||'')+'</td>'
      +'<td class="mini">'+esc(s.performance_type||'—')+'</td>'
      +'<td>'+statusBadge(s.status)+'</td>'
      +'<td style="text-align:right">'+(ikut
          ? (f?'<b>'+IDR(f)+'</b>':'<span class="mini" style="color:var(--red)" title="Jadwal Done tanpa fee — isi dulu sebelum tagihan dibuat">Rp 0</span>')
          : '<span class="mini">'+IDR(f)+' · belum dihitung</span>')+'</td></tr>';
  });
  h+='</tbody><tfoot><tr><td colspan="5"><b>Total dibayar periode ini</b>'
   +(belum.length?' <span class="mini">('+belum.length+' jadwal belum Done tidak ikut'
     +(batal.length?', '+batal.length+' batal':'')+')</span>':'')
   +'</td><td style="text-align:right"><b>'+IDR(total)+'</b></td></tr></tfoot></table></div></div>';
  return h;
}
function renderFee(){
  setTop('Fee & Pembayaran Talent','Rekap otomatis show Done × fee','');
  // build recap per talent for month
  const per=feeRentang();
  const recap={};
  DB.schedules.filter(s=>s.date>=per.a && s.date<=per.b && s.status==='Done')
    .forEach(s=>{recap[s.talent_id]=recap[s.talent_id]||{count:0,total:0,tanpaFee:0};
                 const f=feeAngka(s);
                 recap[s.talent_id].count++; recap[s.talent_id].total+=f;
                 if(!f) recap[s.talent_id].tanpaFee++;});
  /* Dulu tabel ini hanya memuat talent yang PUNYA show Done bulan itu, jadi
     talent yang baru ditambah seolah-olah tidak masuk sistem fee sama sekali.
     Sekarang semua talent Active ikut tampil (0 show), plus talent Inactive
     yang masih punya show bulan itu supaya fee-nya tetap terbayar. */
  const ids=new Set(Object.keys(recap));
  DB.talents.filter(t=>t.status==='Active').forEach(t=>ids.add(t.id));
  const rows=[...ids].map(tid=>{
    const t=DB.talents.find(x=>x.id===tid); if(!t)return null;
    const pay=DB.talentPayments.find(p=>p.talent_id===tid&&p.period_month===feeKunci());
    return {t,count:0,total:0,tanpaFee:0,...(recap[tid]||{}),pay};
  }).filter(Boolean)
    // yang ada show-nya di atas, lalu nominal terbesar, lalu abjad
    .sort((a,b)=>(b.count-a.count)||(b.total-a.total)||a.t.name.localeCompare(b.t.name));
  C().innerHTML=`
  <div class="toolbar" style="flex-wrap:wrap;gap:8px">
    <div class="seg-per">
      ${[['minggu','Mingguan'],['bulan','Bulanan'],['rentang','Rentang']].map(m=>
        `<button class="${feeMode===m[0]?'on':''}" onclick="feeSetMode('${m[0]}')">${m[1]}</button>`).join('')}
    </div>
    <button class="btn ghost sm" title="Periode sebelumnya" onclick="feeGeser(-1)">&lsaquo;</button>
    ${feeMode==='bulan'
      ? `<input type="month" value="${feeMonth}" onchange="feeMonth=this.value;renderFee()" style="width:auto">`
      : feeMode==='minggu'
      ? `<input type="date" value="${per.a}" onchange="feeDari=this.value;renderFee()" style="width:auto">`
      : `<input type="date" value="${per.a}" onchange="feeDari=this.value;renderFee()" style="width:auto">
         <span class="mini">s/d</span>
         <input type="date" value="${per.b}" onchange="feeSampai=this.value;renderFee()" style="width:auto">`}
    <button class="btn ghost sm" title="Periode berikutnya" onclick="feeGeser(1)">&rsaquo;</button>
    <span class="pill">${feeLabelPeriode()}</span>
    <span class="pill">Total hari tampil: ${Object.values(recap).reduce((a,r)=>a+r.count,0)}</span>
    <span class="pill">Total fee: ${IDR(Object.values(recap).reduce((a,r)=>a+r.total,0))}</span>
  </div>
  <p class="mini" style="margin:-4px 0 12px">Fee di profil talent adalah <b>fee per hari tampil</b>.
     Total di bawah = jumlah hari berstatus <b>Done</b> pada periode ini &times; fee hari itu.
     Klik nama talent untuk membuka rinciannya.</p>
  ${feeRincianHTML()}
  <div class="card" style="padding:0"><table><thead><tr><th>Talent</th><th>Bank</th><th>Hari Tampil</th><th>Total Fee</th><th>Status</th><th>Aksi</th></tr></thead><tbody>
  ${rows.map(r=>`<tr class="${r.t.id===FEE_PILIH?'fee-on':''}"${r.count?'':' style="opacity:.62"'}><td style="cursor:pointer" title="Lihat rincian hari tampilnya" onclick="feePilih('${r.t.id}')"><b>${esc(r.t.name)}</b><br><span class="mini">${r.t.category}</span></td><td>${esc(r.t.bank_name||'—')}${r.t.bank_account?' · '+esc(r.t.bank_account):''}</td><td>${r.count} hari${r.tanpaFee?`<br><span class="mini" style="color:var(--red)" title="Jadwal berstatus Done yang fee-nya kosong atau nol. Isi fee-nya di Talent Schedule sebelum tagihan dibuat.">${r.tanpaFee} tanpa fee</span>`:''}</td><td><b>${IDR(r.total)}</b></td><td>${r.pay?statusBadge(r.pay.status):(r.count?'<span class="mini">belum di-generate</span>':'<span class="mini">tidak tampil di periode ini</span>')}</td>
    <td>${r.pay?(r.pay.status==='Waiting'?`<button class="btn sm" onclick="payAction('${r.pay.id}')">Bayar</button> <button class="btn ghost sm" onclick="payHistory('${r.pay.id}')">Detail</button>`:`<button class="btn ghost sm" onclick="payHistory('${r.pay.id}')">Detail</button>`):(r.count?`<button class="btn blue sm" onclick="genPayment('${r.t.id}',${r.total},${r.count})">Generate Payment</button>`:'<span class="mini">—</span>')}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">Belum ada talent. Tambahkan di menu Talent Management.</td></tr>'}
  </tbody></table></div>`;
}
/* Dulu tombol ini cuma memunculkan toast, jadi tidak kelihatan APA yang
   dibuat. Sekarang langsung membuka rincian tagihan yang baru dibuat:
   periode, jumlah show, rekening tujuan, dan tombol lanjut ke pembayaran. */
function genPayment(tid,total,count){
  const t=DB.talents.find(x=>x.id===tid);
  const per=feeRentang();
  const shows=DB.schedules.filter(s=>s.talent_id===tid&&s.date>=per.a&&s.date<=per.b&&s.status==='Done')
                          .sort((a,b)=>a.date.localeCompare(b.date));
  /* Angkanya DIHITUNG ULANG di sini, tidak sekadar dipercaya dari argumen.
     `total` & `count` datang lewat atribut onclick — ditempelkan sebagai teks
     ke dalam HTML, jadi bentuknya bergantung pada apa yang tergambar terakhir
     kali. Yang tersimpan di sini adalah nominal yang nanti benar-benar
     ditransfer ke rekening orang, dan satu-satunya sumber yang tidak bisa
     berbohong adalah jadwalnya sendiri. */
  total=shows.reduce(function(a,s){ return a+feeAngka(s); },0);
  count=shows.length;
  const tanpaFee=shows.filter(function(s){ return !feeAngka(s); }).length;
  const p={id:uid(),talent_id:tid,period_month:feeKunci(),show_count:count,total_amount:total,
           status:'Waiting',bank:'',transfer_proof:null,pic_finance:'',paid_at:null,
           created_at:new Date().toISOString()};
  DB.talentPayments.push(p);save();renderFee();
  modal(`<button class="close" onclick="closeModal()">×</button><h3>Tagihan Dibuat — ${esc(t.name)}</h3>
  <p class="mini" style="margin-bottom:12px">Status <b>Waiting</b>: tagihan sudah tercatat, belum dibayar. Rinciannya dari show berstatus Done pada periode ini.</p>
  <div class="kv" style="margin-bottom:14px">
    <div class="k">Periode</div><div>${feeLabelPeriode()}</div>
    <div class="k">Hari Tampil</div><div>${count} hari</div>
    <div class="k">Total</div><div><b style="color:var(--accent);font-size:16px">${IDR(total)}</b></div>
    <div class="k">Rekening</div><div>${esc(t.bank_name||'—')}${t.bank_account?' · '+esc(t.bank_account):''}${t.account_holder?'<br><span class="mini">a/n '+esc(t.account_holder)+'</span>':''}</div>
  </div>
  <div class="card" style="padding:0;margin-bottom:12px"><table><thead><tr><th>Tanggal</th><th>Jenis Show</th><th>Jam</th><th>Fee</th></tr></thead><tbody>
  ${shows.map(s=>`<tr><td>${fmtDate(s.date)}</td><td>${esc(s.performance_type)}</td><td class="mini">${esc(s.start_time)}–${esc(s.end_time)}</td><td>${feeAngka(s)?IDR(feeAngka(s)):'<b style="color:var(--red)">fee kosong</b>'}</td></tr>`).join('')}
  <tr><td colspan="3" style="text-align:right"><b>Total</b></td><td><b>${IDR(total)}</b></td></tr>
  </tbody></table></div>
  ${tanpaFee?`<p class="mini" style="color:var(--red)">⚠ ${tanpaFee} hari tampil belum ada fee-nya dan dihitung Rp0. Isi fee-nya di Talent Schedule lalu buat ulang tagihannya — kalau memang gratis, abaikan pesan ini.</p>`:''}
  ${!t.bank_account?'<p class="mini" style="color:var(--red)">⚠ Rekening talent ini belum diisi — lengkapi dulu di profil talent sebelum transfer.</p>':''}
  <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Nanti</button><button class="btn" onclick="payAction('${p.id}')">Proses Pembayaran →</button></div>`,true);
}

  window._payPid=pid;

// Pratinjau bukti: gambar tampil langsung, PDF jadi tautan.
function buktiHTML(f){
  if(!f) return '<span class="mini">Belum ada bukti diunggah.</span>';
  // Data lama menyimpan nama berkas sebagai teks ('bukti.jpg') tanpa berkas
  // sungguhan. Ditampilkan apa adanya, bukan dianggap tautan yang rusak.
  if(typeof f==='string') return `<span class="mini">${esc(f)} <i>(catatan lama, berkasnya tidak tersimpan)</i></span>`;
  if(berkasGambar(f))
    return `<a href="javascript:void 0" onclick="pratinjauBerkas('${escJsStr(f.key)}','${escJsStr(f.name)}')" title="Lihat ukuran penuh"><img src="${fileUrl(f.key)}" alt="bukti transfer" class="bukti-img"></a>
            <div class="mini">${esc(f.name)} · ${fmtSize(f.size)}</div>`;
  return `<a href="${fileUrl(f.key)}" target="_blank" rel="noopener">📄 ${esc(f.name)}</a> <span class="mini">${fmtSize(f.size)}</span>`;
}
/* ================== PEMERIKSAAN BUKTI TRANSFER (OCR) ==================
   Mesinnya sama dengan yang dipakai modul Reservasi untuk memeriksa bukti DP:
   Tesseract.js dimuat dari CDN hanya saat dibutuhkan, gambar dipertajam dulu,
   lalu teksnya diurai. Yang dibawa ke sini cuma bagian yang memang dipakai EMS
   — nominal, bank, dan penilaian "ini bukti transfer atau bukan". Sengaja
   TIDAK memanggil kode modul sebelah: dua modul terpisah, dan menyeberangkan
   fungsi antar berkas hanya menghasilkan kaitan yang diam-diam putus. */
const OCR_SRC="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
let _ocrLoad=null,_ocrWorker=null;
function loadOCR(){
  if(window.Tesseract) return Promise.resolve(window.Tesseract);
  if(_ocrLoad) return _ocrLoad;
  _ocrLoad=new Promise(function(res,rej){
    const sc=document.createElement('script'); sc.src=OCR_SRC;
    // Batas waktu: koneksi lambat tidak boleh menggantung layar selamanya.
    const t=setTimeout(function(){ rej(new Error('Mesin OCR tidak bisa dimuat (koneksi lambat / offline).')); },45000);
    sc.onload=function(){ clearTimeout(t); window.Tesseract?res(window.Tesseract):rej(new Error('Mesin OCR gagal dimuat.')); };
    sc.onerror=function(){ clearTimeout(t); rej(new Error('Gagal memuat mesin OCR — pemeriksaan bukti butuh koneksi internet.')); };
    document.head.appendChild(sc);
  }).catch(function(e){ _ocrLoad=null; throw e; });
  return _ocrLoad;
}
async function getOcrWorker(){
  if(_ocrWorker) return _ocrWorker;
  const T=await loadOCR();
  _ocrWorker=await T.createWorker('eng');   // struk bank isinya angka + nama bank; model "eng" paling stabil
  return _ocrWorker;
}
/* Bukti transfer biasanya tangkapan layar kecil dan agak buram. Diperbesar lalu
   digelapkan dengan gamma — BUKAN contrast stretch di sekitar 128, yang justru
   memucatkan teks abu-abu (tanggal & jam di struk Livin/SeaBank ditulis abu
   muda) sampai hilang terbaca. */
function prepOcrImage(dataUrl){
  return new Promise(function(res){
    const img=new Image();
    img.onload=function(){
      const scale=Math.min(3,Math.max(1,1700/(img.width||1)));
      const w=Math.round(img.width*scale),h=Math.round(img.height*scale);
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      const x=c.getContext('2d'); x.drawImage(img,0,0,w,h);
      try{
        const d=x.getImageData(0,0,w,h),px=d.data;
        for(let i=0;i<px.length;i+=4){
          const g=(0.299*px[i]+0.587*px[i+1]+0.114*px[i+2])/255;
          const v=Math.round(255*Math.pow(g,1.6));
          px[i]=px[i+1]=px[i+2]=v<0?0:v>255?255:v;
        }
        x.putImageData(d,0,0);
        res(c.toDataURL('image/png'));
      }catch(e){ res(dataUrl); }     // canvas tainted / gagal → pakai aslinya
    };
    img.onerror=function(){ res(dataUrl); };
    img.src=dataUrl;
  });
}
async function ocrRead(dataUrl){
  const w=await getOcrWorker();
  const img=await prepOcrImage(dataUrl);
  const hasil=await w.recognize(img);
  return (hasil&&hasil.data&&hasil.data.text)||'';
}
const OCR_BANKS=[
  ['BCA',/\b(BCA|KLIKBCA|MY\s?BCA|BANK CENTRAL ASIA|BLU)\b/i],
  ['Mandiri',/\b(MANDIRI|LIVIN)\b/i],
  ['BRI',/\b(BRI|BRIMO|BANK RAKYAT)\b/i],
  ['BNI',/\b(BNI|BANK NEGARA)\b/i],
  ['BSI',/\b(BSI|BANK SYARIAH)\b/i],
  ['CIMB Niaga',/\b(CIMB|OCTO)\b/i],
  ['Permata',/\bPERMATA\b/i],['Danamon',/\bDANAMON\b/i],['BTN',/\bBTN\b/i],
  ['SeaBank',/\bSEA\s?BANK\b/i],['Bank Jago',/\bJAGO\b/i],['Maybank',/\bMAYBANK\b/i],
  ['OCBC',/\bOCBC\b/i],['Panin',/\bPANIN\b/i],['Bank Mega',/\bBANK\s?MEGA\b/i],
  ['Jenius/BTPN',/\b(JENIUS|BTPN)\b/i],['UOB',/\bUOB\b/i],['QRIS',/\bQRIS\b/i],
  ['DANA',/\bDANA\b/],['OVO',/\bOVO\b/i],['GoPay',/\b(GO-?PAY|GOJEK)\b/i],
  ['ShopeePay',/\bSHOPEE\s?PAY\b/i],['LinkAja',/\bLINK\s?AJA\b/i]
];
// "500.000,00" / "Rp 1,500,000" → 500000 / 1500000
function toNumberID(x){
  let v=String(x||'').replace(/\s/g,'');
  v=v.replace(/[.,]\d{2}$/,'');            // buang sen
  const d=v.replace(/[^0-9]/g,'');
  return d?Number(d):0;
}
/* Nominal yang dicari NOMINAL TRANSFER, bukan biaya admin atau sisa saldo —
   struk selalu memuat beberapa angka besar sekaligus. Baris yang menyebut
   biaya/saldo diberi nilai minus, dan label yang ditulis DI BARIS ATAS
   nilainya ("Nominal Transaksi" lalu "Rp 200.000") ikut dipinjam. */
function ocrAmount(t){
  const POS=/(nominal|jumlah|total|nilai|amount|transfer|dibayar|pembayaran|dikirim)/i;
  const NEG=/(biaya|admin|fee|saldo|sisa|limit|denda|pajak|potongan|cashback|po[il]n)/i;
  const RE=/(rp\.?\s*)?(\d{1,3}(?:[.,]\d{3})+(?:[.,]\d{2})?)|rp\.?\s*(\d{4,})/gi;
  const lines=String(t||'').split(/\r?\n/);
  let best=null;
  lines.forEach(function(line,i){
    let pos=POS.test(line),neg=NEG.test(line);
    if(!pos&&!neg){ const prev=lines[i-1]||''; pos=POS.test(prev); neg=NEG.test(prev); }
    const base=(pos?3:0)+(neg?-6:0);
    let m; RE.lastIndex=0;
    while((m=RE.exec(line))){
      const raw=m[2]||m[3]; if(!raw) continue;
      const val=toNumberID(raw);
      if(val<1000||val>2e9) continue;                 // nomor rekening / angka receh
      const score=base+((m[1]||m[3])?1:0);
      if(!best||score>best.score||(score===best.score&&val>best.val)) best={score:score,val:val};
    }
  });
  return best?best.val:0;
}
function ocrBank(t){
  const hay=String(t||'');
  for(let i=0;i<OCR_BANKS.length;i++) if(OCR_BANKS[i][1].test(hay)) return OCR_BANKS[i][0];
  return '';
}
/* APAKAH GAMBAR INI BUKTI TRANSFER? Dinilai dari beberapa penanda sekaligus,
   bukan satu kata kunci: struk mana pun boleh saja kebetulan memuat satu kata,
   tapi gambar yang bukan bukti transfer hampir tak pernah memuat nominal
   berformat rupiah SEKALIGUS kata kerja transaksi dan nama bank. Ambang 3
   dipilih supaya foto menu, poster, atau tangkapan layar chat tidak lolos. */
function buktiSkor(t){
  const txt=String(t||'');
  let skor=0; const alasan=[];
  const adaNominal=!!ocrAmount(txt);
  const adaKata=/(transfer|transaksi|berhasil|sukses|success|pembayaran|dibayar|terkirim)/i.test(txt);
  const bank=ocrBank(txt);
  const adaRek=/(rekening|no\.?\s?rek|va|virtual account|ref|referensi|nomor transaksi)/i.test(txt);
  if(adaNominal){ skor+=2; alasan.push('ada nominal berformat rupiah'); }
  if(adaKata){ skor+=1; alasan.push('ada kata transaksi'); }
  if(bank){ skor+=1; alasan.push('menyebut '+bank); }
  if(adaRek){ skor+=1; alasan.push('ada nomor rekening/referensi'); }
  if(/rp/i.test(txt)){ skor+=1; alasan.push('ada tanda Rp'); }
  /* Nominal saja TIDAK cukup. Poster acara, daftar menu, dan tangkapan layar
     katalog semuanya memuat "Rp 150.000" — kalau angka rupiah dianggap bukti,
     ketiganya lolos. Harus ada penanda transaksi yang sesungguhnya: kata kerja
     transaksi, nama bank/e-wallet, atau nomor rekening/referensi. */
  const bukti = adaNominal && (adaKata||!!bank||adaRek) && skor>=3;
  return {skor:skor, bukti:bukti, alasan:alasan};
}
function parseBuktiText(txt){
  const t=String(txt||'').replace(/\u00a0/g,' ');
  const nilai=buktiSkor(t);
  return {amount:ocrAmount(t),bank:ocrBank(t),skor:nilai.skor,bukti:nilai.bukti,alasan:nilai.alasan};
}
function bacaDataUrl(file){
  return new Promise(function(res,rej){
    const r=new FileReader();
    r.onload=function(){ res(String(r.result)); };
    r.onerror=function(){ rej(new Error('gagal membaca berkas')); };
    r.readAsDataURL(file);
  });
}
/* Memeriksa bukti yang baru diunggah. Hasilnya disimpan di pembayaran itu
   (proof_amount / proof_bank / proof_skor / proof_ocr_at) supaya tetap ada
   walau layarnya ditutup — dan supaya OCR tidak perlu diulang tiap membuka
   layar pembayaran. */
async function periksaBuktiOtomatis(pid,file){
  const p=DB.talentPayments.find(function(x){ return x.id===pid; }); if(!p) return;
  const box=document.getElementById('pay_cocok');
  if(!berkasGambar({name:(file&&file.name)||''})){
    if(box) box.innerHTML='<p class="mini">Bukti berupa PDF — tidak dibaca otomatis. Isi nominalnya sendiri.</p>';
    return;
  }
  if(box) box.innerHTML='<p class="mini">Membaca bukti… pertama kali agak lama karena mesin pembacanya diunduh dulu.</p>';
  try{
    const teks=await ocrRead(await bacaDataUrl(file));
    const h=parseBuktiText(teks);
    p.proof_bank=h.bank; p.proof_skor=h.skor; p.proof_bukti=h.bukti;
    p.proof_ocr_at=new Date().toISOString();
    /* Nominal hasil bacaan TIDAK menimpa yang sudah diketik tangan: koreksi
       manusia harus menang atas tebakan mesin. */
    if(h.amount && !(+p.proof_amount)) p.proof_amount=h.amount;
    save();
    const el=document.getElementById('pay_amt');
    if(el && p.proof_amount) el.value=uangFormat(p.proof_amount);
    if(box) box.innerHTML=buktiPeriksaHTML(p);
  }catch(e){
    if(box) box.innerHTML='<p class="mini" style="color:var(--red)">Pembacaan otomatis gagal: '+esc(e.message)
      +'. Isi nominalnya sendiri — pencocokan dengan tagihan tetap jalan.</p>';
  }
}
/* Memeriksa ulang bukti yang SUDAH tersimpan — berkasnya diambil kembali dari
   server. Dipakai kalau pemeriksaan pertama gagal (mesin OCR belum terunduh,

  }
}
/* Hasil pemeriksaan bukti transfer. Nominal yang TERBACA di bukti disimpan
   di p.proof_amount, lalu dibandingkan dengan tagihan. Selisih sekecil apa pun
   ditandai merah: bukti yang nominalnya beda dari tagihan adalah pertanda

function buktiPeriksaHTML(p){
  if(!p||!p.transfer_proof) return '';

  if(p.proof_ocr_at){
    awal=p.proof_bukti

/* ============ EVENT MANAGEMENT ============ */
const EVT_CATS=['Free','Paid','Internal','Community','Corporate','Wedding','Festival','Music','Launching','Private'];
const TIMELINE_PHASES=['Preparation','Marketing','Vendor','Talent','Decoration','Opening','Closing','Evaluation'];
/* BUKAN 'all'. Halaman Event Management dibuka untuk mengurus acara yang
   AKAN berjalan; "Semua" membuka daftar yang didominasi acara tahun lalu,
   dan yang dicari orang selalu ada di bawah gulungan. Upcoming jadi bawaan,
   dan "Semua" digeser ke ujung kanan — tetap ada, tapi tidak lagi jadi hal
   pertama yang ditekan mata. */
let evtFilter='Upcoming';
/* ================= TIGA STATUS, SATU ALUR PERSETUJUAN =================
   Dulu ada lima status (Draft, Upcoming, Today, Finished, Cancelled) yang
   diputar satu tombol. Tiga di antaranya tidak pernah jadi keputusan siapa pun:
   "Today" cuma keterangan tanggal, dan "Draft" tidak membedakan rencana yang
   masih dipikirkan dari rencana yang sudah disetujui manajemen.

   Sekarang tiga, dan tiap perpindahannya adalah keputusan:
     Planning    — masih disusun tim event; belum boleh jualan tiket
     Upcoming    — SUDAH DISETUJUI manajemen; jadwal & anggarannya mengikat
     Event Done  — sudah lewat

   Yang memindahkan Planning → Upcoming BUKAN tombol, melainkan persetujuan.
   Itu satu-satunya cara membuat "sudah disetujui" berarti sesuatu: kalau siapa
   pun bisa menggeser statusnya sendiri, tanda setuju itu tidak menjamin apa-apa
   dan orang berhenti mempercayainya. */
/* LIMA tahap, dua di antaranya baru (Prospect & Approval).

   Dulu tiga: Planning -> Upcoming -> Event Done, dan persetujuan manajemen
   memindahkan rencana LANGSUNG dari Planning ke Upcoming. Akibatnya dua
   keadaan yang sangat berbeda memakai label yang sama: rencana yang baru
   ditulis dan rencana yang sudah diajukan dan sedang ditunggu keputusannya
   dua-duanya berbunyi 'Planning'. Tidak ada layar yang bisa menjawab "mana
   yang sedang di meja manajemen".

   Sekarang:
     Planning   rencana yang masih digarap sendiri
     Prospect   sudah diajukan, menunggu keputusan manajemen
     Approval   sudah disetujui — dipindahkan OTOMATIS oleh setujuiRencana,
                bukan tombol status. Tiketnya sudah boleh disiapkan, tapi
                acaranya belum dinyatakan berjalan.
     Upcoming   dinyatakan berjalan
     Event Done sudah lewat */
const EVT_STATUS = ['Planning','Prospect','Approval','Upcoming','Event Done'];
/* Tahap yang sudah boleh dihitung sebagai HASIL, bukan rencana. Dipakai
   angkaEms() — satu-satunya sumber angka Performance & Report. Ditulis sebagai
   daftar terpisah, bukan `slice(2)` dari EVT_STATUS, supaya menyisipkan tahap
   baru di tengah tidak diam-diam mengubah apa yang masuk laporan. */
const EVT_STATUS_HASIL = ['Approval','Upcoming','Event Done'];

/* ---------- PERAN & HAK AKSES (pola yang sama dengan modul Marketing) ----------
   Marketing memakai matriks (halaman × peran) dengan tiga tingkat. Angkanya
   (0/1/2) hanya bentuk simpanan — dipilih karena bertingkat, sehingga
   pemeriksaannya cukup `>= 1` / `>= 2` tanpa tabel pemetaan. Angka itu TIDAK
   pernah ditampilkan: orang yang mengatur izin membaca "Tak Terlihat / Lihat /
   Boleh Ubah", persis seperti di Marketing (lihat PERM_OPT di sana).
   EMS memakai bentuk yang sama supaya kru tidak perlu belajar dua sistem izin
   yang berbeda di dua modul yang mereka buka bergantian. */
const EMS_IZIN = [[0,'Tak Terlihat'],[1,'Lihat'],[2,'Boleh Ubah']];
function labelIzin(v){ const t=EMS_IZIN.find(function(x){ return x[0]===(+v||0); }); return t?t[1]:'Tak Terlihat'; }
const EMS_PERAN = {
  manajemen: 'Manajemen',        // Howandi, Wandi, super admin — yang menyetujui
  event:     'Tim Event',        // menyusun rencana, menjalankan acara
  kasir:     'Kasir / Ticketing',

};
const EMS_HALAMAN = {
  dashboard:'Dashboard', calendar:'Event Calendar', talents:'Talent Management',
  schedule:'Talent Schedule', fee:'Fee & Pembayaran', planning:'Perencanaan Event',
  events:'Event Management', ticketing:'Ticketing', checkin:'Check-In',
  ideas:'Event Idea Bank', history:'Event History', akses:'Hak Akses',
  /* Halaman baru. Ikut matriks izin seperti halaman lain — bawaannya
     diatur emsPermBawaan(); yang bukan manajemen tetap boleh MELIHAT

  approval:'Approval Flow', pipeline:'Event Pipeline',

};
/* Bawaan yang dipilih supaya sistemnya bisa langsung dipakai tanpa disetel:
   tim event mengerjakan semuanya kecuali menyetujui rencananya sendiri dan
   mengatur hak akses; kasir hanya menyentuh penjualan & pintu masuk. */
function emsPermBawaan() {
  const P = {};

    P[h] = { manajemen: 2, event: 2, kasir: 1, lihat: 1 };
  });
  P.planning.kasir = 0;  P.planning.lihat = 1;
  P.fee.kasir      = 0;  P.fee.lihat      = 0;   // angka honor talent bukan konsumsi umum

}
function emsPerm() {
  if (!DB.perm || typeof DB.perm !== 'object' || Array.isArray(DB.perm)) DB.perm = emsPermBawaan();
  // Halaman baru yang belum ada di data lama diberi bawaannya, bukan dibiarkan
  // kosong — kosong berarti tak terlihat oleh siapa pun, termasuk manajemen.
  const bawaan = emsPermBawaan();
  Object.keys(bawaan).forEach(function(h) { if (!DB.perm[h]) DB.perm[h] = bawaan[h]; });
