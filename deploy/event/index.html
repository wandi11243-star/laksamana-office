}
/* ---------- PERAN DITURUNKAN DARI DATABASE USER OFFICE ----------
   Dulu peran diketik satu per satu di layar Hak Akses lalu disimpan di
   DB.peran. Dua hal membuatnya salah terus-menerus: id-nya harus diketik
   PERSIS seperti di Office — satu huruf meleset berarti orangnya diam-diam
   memakai peran bawaan tanpa pesan apa pun — dan kru baru tidak pernah muncul
   sampai ada yang ingat menambahkannya manual. Sekarang sumbernya satu:
   database user Office (account-mysql), sama seperti modul lain.

   Dipakai `listModuleRoster` saja, BUKAN listDivisiRoster seperti Marketing:
   pertanyaan di modul ini adalah "siapa yang bisa membuka EMS dan berperan
   apa", dan itu persis isi listModuleRoster. Menarik seluruh pegawai kantor
   cuma akan mendaftar puluhan orang yang gerbang SSO-nya memang menolak.
   Endpoint ini tanpa gerbang PIN — balasannya memang tidak pernah memuat PIN.

   DB.peran tidak lagi dibaca. Isinya sengaja TIDAK dihapus dari database:
   kalau penurunan otomatis ini ternyata salah untuk seseorang, pemetaan
   lamanya masih utuh untuk dilihat. */
const OFFICE_URL = '../account-api-mysql/api.php';
let EMS_ROSTER = null;      // array roster terakhir; null = belum/gagal dimuat
let EMS_ROSTER_ERR = '';

function emsSesi() {
  try { return JSON.parse(localStorage.getItem('lm_session') || 'null') || {}; }
  catch (_) { return {}; }
}
/* Kolom "Tim / Keterangan" di Office adalah teks bebas ("Event", "Bar",
   "Event Manager", "Kasir"), jadi perannya diturunkan dengan pencocokan KATA
   UTUH — supaya "Barista" tidak terbaca sebagai "bar" dan "Administrasi"
   tidak terbaca sebagai "admin".

   URUTAN PENTING dan sengaja begini: yang lebih berkuasa diperiksa lebih
   dulu, sama seperti ROLE_JABATAN di Marketing. "Event Manager" harus jatuh
   ke Manajemen, bukan Tim Event — kalau urutannya dibalik, orang yang
   berwenang MENYETUJUI rencana justru kehilangan hak setujunya. */
const EMS_PERAN_TIM = [
  [['owner'],'manajemen'],   [['direktur'],'manajemen'],   [['director'],'manajemen'],
  [['manager'],'manajemen'], [['manajer'],'manajemen'],    [['manajemen'],'manajemen'],
  [['management'],'manajemen'], [['gm'],'manajemen'],      [['kepala'],'manajemen'],
  [['supervisor'],'manajemen'],
  [['kasir'],'kasir'],       [['cashier'],'kasir'],        [['ticketing'],'kasir'],
  [['finance'],'kasir'],     [['keuangan'],'kasir'],
  [['event'],'event'],       [['mc'],'event'],             [['talent'],'event'],
  [['produksi'],'event'],    [['production'],'event'],     [['crew'],'event'],
  [['magang'],'lihat'],      [['intern'],'lihat'],         [['trainee'],'lihat']
];
function peranDariTim(ket) {
  const kata = String(ket || '').toLowerCase().split(/[^a-z0-9]+/i).filter(Boolean);
  if (!kata.length) return '';
  const cocok = EMS_PERAN_TIM.find(function (x) {
    return x[0].every(function (k) { return kata.indexOf(k) >= 0; });
  });
  return cocok ? cocok[1] : '';
}
/* Satu baris roster -> satu peran EMS.
   Admin modul di Office DIDAHULUKAN: itu pemberian wewenang yang disengaja,
   dan kalau sampai kalah oleh kolom Tim yang kebetulan belum diisi, orang
   yang berhak mengatur justru terkunci di luar halaman Hak Akses.
   Kolom Tim yang tidak terbaca jatuh ke 'event' — bukan 'lihat' — karena
   orang ini sudah diberi akses modul Event di Office; itu juga persis
   perilaku bawaan sebelum perubahan ini, jadi tidak ada yang tiba-tiba
   kehilangan menu gara-gara kolom Tim-nya kosong. */
function peranDariRoster(m) {
  if (!m) return '';
  if (m.isModuleAdmin) return 'manajemen';
  return peranDariTim(m.keterangan) || 'event';
}
/* Baris roster milik orang yang sedang membuka. `id` adalah kunci utama —
   nama bisa kembar, id tidak. Username & nama cuma cadangan untuk sesi lama
   yang belum menyimpan userId. */
function rosterSaya(s) {
  if (!Array.isArray(EMS_ROSTER)) return null;
  s = s || emsSesi();
  const id = String(s.userId || '').trim();
  if (id) {
    const byId = EMS_ROSTER.find(function (m) { return String(m.id) === id; });
    if (byId) return byId;
  }
  const nm = String(s.username || s.name || '').trim().toLowerCase();
  if (!nm) return null;
  return EMS_ROSTER.find(function (m) {
    return String(m.username || '').toLowerCase() === nm || String(m.name || '').toLowerCase() === nm;
  }) || null;
}
async function ambilOffice(payload) {
  const stop = new AbortController();
  const jam = setTimeout(function () { stop.abort(); }, 8000);
  try {
    const r = await fetch(OFFICE_URL, { method: 'POST', redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload), signal: stop.signal });
    const t = await r.text();
    let j = null; try { j = JSON.parse(t); } catch (_) {}
    if (!j) throw new Error('Office membalas bukan JSON (account-api-mysql belum terpasang?)');
    if (!j.ok) throw new Error(j.error || 'ditolak');
    return Array.isArray(j.members) ? j.members : [];
  } finally { clearTimeout(jam); }
}
/* Menelan galatnya sendiri dan TIDAK pernah melempar: modul harus tetap bisa
   dipakai waktu account-api sedang mati, dan peranSaya() sudah punya jalan
   mundur. Yang gagal cuma ketelitian perannya, bukan seluruh EMS. */
async function muatRosterOffice() {
  try {
    const anggota = await ambilOffice({ action: 'listModuleRoster', module: 'event' });
    EMS_ROSTER = anggota.filter(function (m) { return m && m.id; }).map(function (m) {
      return { id: m.id, name: m.name || '', username: m.username || '',
               keterangan: m.keterangan || '', active: m.active !== false,
               isModuleAdmin: !!m.isModuleAdmin };
    });
    EMS_ROSTER_ERR = '';
  } catch (e) {
    EMS_ROSTER = null;
    EMS_ROSTER_ERR = (e && e.name === 'AbortError')
      ? 'Office tidak menjawab dalam 8 detik'
      : ((e && e.message) || 'gagal');
  }
}
function peranSaya() {
  const s = emsSesi();
  const m = rosterSaya(s);
  if (m) return peranDariRoster(m);
  /* Jalan mundur waktu roster belum sempat dimuat atau Office tidak menjawab.
     Sengaja sama persis dengan perilaku lama supaya kegagalan menarik roster
     tidak pernah berarti orang terkunci di luar modulnya sendiri. */
  const admin = (s.adminModules || []).some(function (x) { return x === '*' || x === 'event'; });
  return admin ? 'manajemen' : 'event';
}
function bisaLihat(h) { const p = emsPerm()[h]; return !!p && (p[peranSaya()] || 0) >= 1; }
function bisaUbah(h)  { const p = emsPerm()[h]; return !!p && (p[peranSaya()] || 0) >= 2; }
/* Menyetujui rencana bukan sekadar "boleh ubah halaman Planning" — itu
   kewenangan yang berdiri sendiri, dan sengaja hanya milik manajemen. */
function bisaSetujui() { return peranSaya() === 'manajemen'; }

/* ---------- PENGAJUAN RENCANA ----------
   Bentuk datanya sengaja sederhana: satu objek di dalam event, bukan koleksi
   tersendiri. Satu event hanya punya satu pengajuan yang hidup, dan riwayat
   penolakannya cukup disimpan sebagai catatan terakhir — kalau butuh jejak
   panjang, tempatnya di log aktivitas, bukan di sini. */
function pengajuan(e) { return (e && e.pengajuan) || null; }
function statusPengajuan(e) { const p = pengajuan(e); return p ? p.status : 'Belum diajukan'; }
function ajukanRencana(id) {
  const e = DB.events.find(function (x) { return x.id === id; }); if (!e) return;
  if (e.status !== 'Planning') { toast('Hanya rencana yang bisa diajukan.'); return; }
  if (!e.title || !e.start_datetime || !e.venue) {
    toast('Lengkapi dulu judul, tanggal, dan venue sebelum diajukan.'); return;
  }
  const p = pengajuan(e);
  if (p && p.status === 'Menunggu') { toast('Rencana ini sudah diajukan dan sedang menunggu keputusan.'); return; }
  e.pengajuan = { status:'Menunggu', oleh:namaKru(), pada:new Date().toISOString(), alasan:'' };
  /* Tahapnya ikut pindah ke Prospect. Tanpa ini rencana yang sudah diajukan
     tetap berlabel Planning, jadi papan manajemen dan papan tim melihat
     hal yang sama dan tidak ada yang tahu bolanya di tangan siapa. */
  e.status = 'Prospect'; e.statusAt = Date.now();
  save(); toast('✓ Diajukan ke manajemen — tahapnya kini Prospect.');
  router();
}
function setujuiRencana(id) {
  if (!bisaSetujui()) { toast('Hanya manajemen yang bisa menyetujui rencana.'); return; }
  const e = DB.events.find(function (x) { return x.id === id; }); if (!e) return;
  e.pengajuan = Object.assign({}, e.pengajuan || {}, {
    status:'Disetujui', penyetuju:namaKru(), disetujuiPada:new Date().toISOString(), alasan:''
  });
  /* Persetujuanlah yang memindahkan statusnya — bukan tombol status. statusAt
     ikut dicatat supaya perapian otomatis tidak menarik balik event yang baru
     saja disetujui (lihat autoSelesaikanEvent). */
  /* Disetujui = naik ke APPROVAL, bukan langsung Upcoming. Dua hal yang
     berbeda: manajemen menyetujui rencananya, dan tim menyatakan acaranya
     benar-benar berjalan. Menggabungkannya membuat persetujuan di atas
     kertas terbaca sebagai acara yang sudah pasti jalan — dan tiket mulai
     dijual untuk acara yang venue-nya belum dikunci. */
  e.status = 'Approval'; e.statusAt = Date.now();
  save(); toast('✓ Disetujui — tahapnya naik ke Approval. Lanjutkan ke Upcoming kalau acaranya sudah pasti berjalan.');
  router();
}
function tolakRencana(id) {
  if (!bisaSetujui()) { toast('Hanya manajemen yang bisa menolak rencana.'); return; }
  const e = DB.events.find(function (x) { return x.id === id; }); if (!e) return;
  modal('<button class="close" onclick="closeModal()">×</button><h3>Tolak Rencana</h3>'
    +'<p class="mini">' + esc(e.title) + '</p>'

    +'placeholder="mis. anggaran belum masuk, tanggal bentrok dengan acara lain"></textarea>'

    +'<div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Batal</button>'
    +'<button class="btn danger" onclick="tolakRencanaYakin(\'' + id + '\')">Tolak</button></div>');
}
function tolakRencanaYakin(id) {
  const alasan = (document.getElementById('tol_alasan').value || '').trim();
  if (!alasan) { toast('Alasan wajib diisi.'); return; }
  const e = DB.events.find(function (x) { return x.id === id; }); if (!e) return;
  e.pengajuan = Object.assign({}, e.pengajuan || {}, {
    status:'Ditolak', penyetuju:namaKru(), disetujuiPada:new Date().toISOString(), alasan:alasan
  });
  /* Ditolak = kembali ke Planning, apa pun tahapnya saat itu. Membiarkannya
     di Prospect berarti papan manajemen memajang antrian yang sudah kosong,

  e.status = 'Planning'; e.statusAt = Date.now();

}

/* Status diubah langsung dari dropdown di kartu, tidak perlu masuk ke detail

/* ---------- PIPELINE EVENT (EMS) ----------
   Papan yang sama bentuknya dengan Sales Pipeline di modul Marketing:
   pita ringkasan, kanban satu kolom per tahap, dan tab kedua berisi tabel.
   Yang digeser di sini adalah TAHAP EVENT — kolomnya persis EVT_STATUS,

const PIPE_WARNA={Planning:'--muted',Prospect:'--blue',Approval:'--orange',

let pipeTabEms='kanban';
function setPipeTabEms(v){ pipeTabEms=v; router(); }

let dragIdEms=null;
function bindKanbanEms(){
  C().querySelectorAll('.kcard').forEach(function(k){
    k.addEventListener('dragstart',function(ev){ dragIdEms=k.dataset.id; k.style.opacity='.4'; ev.stopPropagation(); });
    k.addEventListener('dragend',function(){ k.style.opacity='1'; });
  });
  C().querySelectorAll('.kcol-body').forEach(function(b){
    b.addEventListener('dragover',function(ev){ ev.preventDefault(); b.closest('.kcol').classList.add('drag-over'); });
    b.addEventListener('dragleave',function(){ b.closest('.kcol').classList.remove('drag-over'); });
    b.addEventListener('drop',function(ev){ ev.preventDefault();
      b.closest('.kcol').classList.remove('drag-over');
      pindahTahapEms(dragIdEms,b.dataset.col); });
  });
}
/* DITANYA DULU, sama seperti papan Marketing. Menggeser kartu itu gerakan
   yang gampang terjadi tanpa diniatkan, sementara yang berubah menentukan
   event masuk laporan mana dan boleh-tidaknya tiket dijual.

   Aturannya sendiri TIDAK diulang di sini — seluruhnya diserahkan ke
   setEventStatus(), termasuk larangan Planning->Upcoming tanpa persetujuan
   manajemen. Menyalin aturan ke papan berarti dua tempat yang harus
   diperbaiki tiap kali kebijakannya berubah. */
function pindahTahapEms(id,st){
  const e=DB.events.find(function(x){ return x.id===id; });
  if(!e||!st||e.status===st) return router();
  const dari=e.status;
  modal('<button class="close" onclick="closeModal();router()">\u00d7</button>'
   +'<h3>Pindahkan ke '+esc(st)+'?</h3>'
   +'<p class="mini" style="margin-bottom:10px">'+esc(e.title||'')+'</p>'
   +'<p style="font-size:13.5px">Tahapnya berubah dari <b>'+esc(dari)+'</b> jadi <b>'+esc(st)+'</b>.'
   +(st==='Event Done'?' Data eventnya ikut terkunci.':'')+'</p>'
   +'<div class="modal-actions">'
   +'<button class="btn ghost" onclick="closeModal();router()">Batal</button>'
   +'<button class="btn" onclick="closeModal();setEventStatus(&#39;'+e.id+'&#39;,&#39;'+esc(st)+'&#39;);router()">Ya, pindahkan</button>'
   +'</div>');
}
function setEventStatus(id,st){
  const e=DB.events.find(x=>x.id===id); if(!e)return;
  /* PLANNING → UPCOMING TIDAK BISA LEWAT SINI.
     Perpindahan itu hasil persetujuan manajemen (setujuiRencana). Kalau tombol
     status bisa melakukannya juga, tanda "sudah disetujui" berhenti berarti
     apa pun — siapa saja bisa menerbitkannya sendiri. */
  if(e.status==='Planning' && st!=='Planning'){
    toast('Rencana hanya naik ke Upcoming lewat persetujuan manajemen.');
    renderPlanning(); return;
  }
  if(st==='Planning' && e.status!=='Planning' && !bisaSetujui()){
    toast('Hanya manajemen yang bisa menarik event kembali ke Perencanaan.');
    return;
  }
  const lama=e.status; e.status=st;
  /* Jejak "status ini dipilih manusia, jam sekian". Dipakai autoSelesaikanEvent
     untuk tahu mana status yang boleh ia rapikan dan mana yang tidak. */
  e.statusAt=Date.now();
  save(); renderEvents();
  toast('Status '+e.title+': '+lama+' → '+st+(st==='Event Done'?' (data event terkunci)':''));
}
/* Event yang tanggalnya sudah lewat tapi masih "Upcoming"/"Today" dinaikkan
   sendiri jadi Finished — dulu harus diubah manual satu per satu, dan yang
   terlupakan menumpuk di daftar Upcoming seolah masih akan datang.
   Draft & Cancelled TIDAK ikut: draft belum tentu jadi, cancelled memang
   sudah selesai urusannya. */
function autoSelesaikanEvent(){
  const skrg=Date.now(); let ubah=0;
  DB.events.forEach(e=>{
    if(e.status!=='Upcoming')return;   // Planning tidak pernah 'lewat' sendiri
    const selesai=new Date(e.end_datetime||e.start_datetime).getTime();
    if(!selesai||isNaN(selesai))return;
    /* PILIHAN MANUSIA MENANG ATAS PERAPIAN OTOMATIS.
       setEventStatus() menyimpan lalu memanggil renderEvents(), dan renderEvents()
       menjalankan fungsi ini sebagai baris pertamanya. Tanpa penjaga di bawah,
       memilih "Upcoming" pada event yang tanggalnya sudah lewat diputar balik
       jadi "Finished" dalam hitungan milidetik — statusnya seolah menolak
       diubah, dan tidak ada apa pun di layar yang menjelaskan kenapa.
       (Terasa saat memasang situs customer: hanya event Upcoming/Today yang
       dijual, jadi event lampau mustahil dibuka untuk penjualan.)

       Yang dirapikan sekarang hanya event yang TIDAK disentuh orang sejak ia
       berakhir — itu memang maksud aslinya: menyapu yang terlupakan, bukan
       membatalkan keputusan yang baru saja diambil. */
    if(e.statusAt && e.statusAt > selesai) return;
    if(selesai<skrg){ e.status='Event Done'; ubah++; }
  });
  if(ubah){ save(); toast(ubah+' event yang tanggalnya sudah lewat dipindah ke Event Done.'); }
  return ubah;
}
/* ============ PERENCANAAN EVENT ============
   Isinya HANYA event berstatus Planning. Yang sudah disetujui pindah sendiri ke
   Event Management — jadi halaman ini selalu berisi pekerjaan yang belum
   selesai, bukan arsip. */
let planFilter='all';
/* ============ PERFORMANCE & REPORT ============
   Dua halaman, sepasang dengan Marketing Performance & Reporting di modul
   Marketing \u2014 bentuk kartu, judul bagian, dan tabelnya sengaja sama supaya
   kru yang membaca keduanya tidak perlu menerjemahkan dua tata letak.

   SATU SUMBER ANGKA untuk keduanya. Kalau Performance dan Report menghitung
   sendiri-sendiri, dua halaman yang seharusnya menceritakan hal yang sama
   akan lambat laun berbeda \u2014 dan yang membacanya tidak punya cara tahu mana
   yang benar. Semua lewat angkaEms(). */
function angkaEms(rentang){
  const dalam=function(tgl){
    if(!rentang) return true;
    const t=String(tgl||'').slice(0,10);
    return t && t>=rentang.a && t<=rentang.b;
  };
  /* RENCANA TIDAK IKUT DIHITUNG. Sebelum ini penyaringnya cuma tanggal, jadi
     Performance melaporkan "2 dari 6 event" untuk periode yang sebenarnya cuma
     berisi 4 acara — dua sisanya rencana yang belum disetujui siapa pun.
     Akibatnya bukan cuma angka yang salah: Keterisian dan Omzet ikut dibagi
     dengan acara yang belum pernah menjual satu tiket pun, dan halaman yang
     dibuat untuk menilai hasil justru selalu memberi nilai lebih rendah dari
     yang sebenarnya.

     Planning DAN Prospect sama-sama dibuang. Keduanya rencana: Prospect cuma
     Planning yang sudah diajukan dan masih menunggu keputusan manajemen —
     sebelum tahap itu dipisah, dua-duanya memang berlabel 'Planning'.
     Yang mulai dihitung adalah sejak DISETUJUI (Approval), karena sejak itu
     jadwal & anggarannya mengikat dan tiketnya sudah boleh disiapkan. */
  const events=DB.events.filter(function(e){
    return dalam(e.start_datetime) && EVT_STATUS_HASIL.indexOf(e.status)>=0; });
  const idEv={}; events.forEach(function(e){ idEv[e.id]=1; });
  const orders=DB.orders.filter(function(o){ return o.payment_status==='Paid' && idEv[o.event_id]; });
  const omzet=orders.reduce(function(a,o){ return a+(+o.total||0); },0);
  const kelas=DB.ticketClasses.filter(function(c){ return idEv[c.event_id]; });
  /* `terjual` (c.sold) SENGAJA berbeda dari `tiket` (jumlah e-ticket terbit) —
     ini bukan ketidakcocokan yang perlu "dirapikan" jadi satu angka. Zona
     Reguler tanpa nomor dijual walk-in lewat regulerAdj() yang menaikkan
     c.sold TANPA menerbitkan e-ticket, jadi terjual >= tiket dan keduanya
     memang mengukur hal berbeda: berapa yang laku, dan berapa yang punya
     barcode. Kartunya pun berlabel beda ("Tiket Terjual" vs "Tiket Terbit"). */
  const terjual=kelas.reduce(function(a,c){ return a+(+c.sold||0); },0);
  const kuota=kelas.reduce(function(a,c){ return a+(+c.quota||0); },0);
  /* Check-in dihitung dari tiketnya, bukan dari DB.checkins langsung: satu
     tamu bisa dipindai dua kali, dan yang ingin diketahui berapa ORANG yang
     masuk \u2014 bukan berapa kali pemindai berbunyi. */
  const tiketEv=DB.tickets.filter(function(t){
    const c=DB.ticketClasses.find(function(x){ return x.id===t.ticket_class_id; });
    return c && idEv[c.event_id]; });
  const hadir=tiketEv.filter(function(t){ return t.status==='Checked-In'; }).length;
  const jadwal=DB.schedules.filter(function(x){ return dalam(x.date) && x.status==='Done'; });
  return {events:events, orders:orders, omzet:omzet, terjual:terjual, kuota:kuota,
          tiket:tiketEv.length, hadir:hadir, jadwal:jadwal,
          selesai:events.filter(function(e){ return e.status==='Event Done'; }).length,
          isi: kuota?Math.round(terjual/kuota*100):0,
          hadirPct: tiketEv.length?Math.round(hadir/tiketEv.length*100):0};
}
/* Omzet enam bulan terakhir. Yang dihitung pesanan LUNAS \u2014 pesanan yang belum
   dibayar bukan uang masuk, dan memasukkannya membuat grafik ini berbohong ke
   arah yang paling menyenangkan. */
function omzetPerBulanEms(n){
  const out=[]; const d=new Date(); d.setDate(1);
  for(let i=n-1;i>=0;i--){
    const x=new Date(d.getFullYear(),d.getMonth()-i,1);
    const kunci=x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0');
    const total=DB.orders.filter(function(o){
        if(o.payment_status!=='Paid') return false;
        const e=DB.events.find(function(y){ return y.id===o.event_id; });
        return e && String(e.start_datetime||'').slice(0,10).slice(0,7)===kunci;
      }).reduce(function(a,o){ return a+(+o.total||0); },0);
    out.push([BULAN_PDK_EMS[x.getMonth()], Math.round(total/1000000)]);
  }
  return out;
}
const BULAN_PDK_EMS=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Ags','Sep','Okt','Nov','Des'];

/* Pita saringan periode. Selain empat tombol tetap, ada pemilih BULAN dan
   TANGGAL beserta panah geser — supaya "September kemarin" atau "17 Agustus"
   bisa dibuka langsung, bukan lewat menghitung mundur dari "bulan ini".

   Panahnya menggeser satuan yang sedang dipakai: mode bulan bergeser sebulan,
   mode tanggal bergeser sehari. Kalau yang aktif salah satu kata tetap
   ('hari'/'minggu'/'bulan'), panah menggeser dari bulan berjalan — menekan '<'
   dari "Bulan ini" mendarat di bulan lalu, yang memang yang dimaksud orang. */
function periodeBulanAktif(aktif){
  const m=String(aktif||'');
  if(/^\d{4}-\d{2}/.test(m)) return m.slice(0,7);
  const t=new Date();
  return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0');
}
function periodeGeser(aktif,arah,fn){
  const m=String(aktif||'');
  if(/^\d{4}-\d{2}-\d{2}$/.test(m)){
    const d=new Date(m+'T00:00:00'); d.setDate(d.getDate()+arah);
    return window[fn](dstr(d));
  }
  const b=periodeBulanAktif(aktif);
  const d=new Date(+b.slice(0,4), +b.slice(5,7)-1+arah, 1);
  window[fn](d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'));
}
function pitaPeriodeEms(aktif,fn,jml){
  const bln=periodeBulanAktif(aktif);
  const tgl=/^\d{4}-\d{2}-\d{2}$/.test(String(aktif))?String(aktif):'';
  return '<div class="toolbar" style="flex-wrap:wrap;gap:8px"><div class="seg-per">'+DASH_PERIODE.map(function(x){
      return '<button class="'+(aktif===x[0]?'on':'')+'" onclick="'+fn+'(&#39;'+x[0]+'&#39;)">'+x[1]+'</button>';
    }).join('')+'</div>'
   +'<button class="btn ghost sm" title="Geser mundur" onclick="periodeGeser(&#39;'+esc(String(aktif||''))+'&#39;,-1,&#39;'+fn+'&#39;)">‹</button>'
   +'<input type="month" value="'+esc(bln)+'" title="Pilih bulan" style="width:auto" '
     +'onchange="'+fn+'(this.value)">'
   +'<button class="btn ghost sm" title="Geser maju" onclick="periodeGeser(&#39;'+esc(String(aktif||''))+'&#39;,1,&#39;'+fn+'&#39;)">›</button>'
   +'<input type="date" value="'+esc(tgl)+'" title="Atau pilih satu tanggal" style="width:auto" '
     +'onchange="if(this.value)'+fn+'(this.value)">'
   +'<span class="pill">'+jml+' event</span>'
   +'<span class="pill">'+esc(labelPeriodeEms(aktif))+'</span></div>';
}
/* Nama periode yang sedang berlaku, ditulis apa adanya. Angka tanpa keterangan
   periode tidak bisa ditindaklanjuti - dan sejak bulan bisa dipilih sendiri,
   tombol yang menyala bukan lagi penanda yang cukup. */
function labelPeriodeEms(aktif){

  if(/^\d{4}-\d{2}-\d{2}$/.test(m)) return fmtDate(m);

  const t=(DASH_PERIODE.find(function(x){ return x[0]===m; })||['','Semua'])[1];
  return t;
}

/* BREAKDOWN PER EVENT - tiket terjual, kategori paling laku, dan yang benar-
   benar hadir di hari-H. Sebelumnya laporan hanya memberi angka gabungan
   ("340 tiket terjual"), yang tidak menuntun ke keputusan apa pun: yang
   menentukan acara berikutnya dibuat seperti apa adalah kategori MANA yang
   laku di acara MANA, dan berapa persen pembeli yang akhirnya datang.

   Hadir dihitung dari tiket berstatus Checked-In, bukan dari DB.checkins: satu
   tamu bisa dipindai dua kali dan yang ingin diketahui berapa ORANG yang masuk
   - aturan yang sama dengan angkaEms(). */
function breakdownEventEms(a){
  return a.events.map(function(e){
    const kelas=DB.ticketClasses.filter(function(c){ return c.event_id===e.id; });
    const tiket=DB.tickets.filter(function(t){
      return kelas.some(function(c){ return c.id===t.ticket_class_id; }); });
    const hadir=tiket.filter(function(t){ return t.status==='Checked-In'; }).length;
    const terjual=kelas.reduce(function(x,c){ return x+(+c.sold||0); },0);
    const omzet=DB.orders.filter(function(o){ return o.event_id===e.id && o.payment_status==='Paid'; })
      .reduce(function(x,o){ return x+(+o.total||0); },0);
    const top=kelas.slice().sort(function(x,y){ return (+y.sold||0)-(+x.sold||0); })[0];
    const kuota=kelas.reduce(function(x,c){ return x+(+c.quota||0); },0);
    return {e:e, terjual:terjual, kuota:kuota, tiket:tiket.length, hadir:hadir, omzet:omzet,
            top:(top&&+top.sold)?top:null,
            isi: kuota?Math.round(terjual/kuota*100):0,
            hadirPct: tiket.length?Math.round(hadir/tiket.length*100):0};
  }).sort(function(x,y){ return y.terjual-x.terjual; });
}
function breakdownEventHTML(a){
  const b=breakdownEventEms(a);
  let h='<div class="card" style="margin-top:18px"><h3 class="sec">Rincian per Event</h3>';
  if(!b.length) return h+'<div class="empty">Belum ada event pada periode ini.</div></div>';
  h+='<div class="tbl-lebar"><table><thead><tr><th>Event</th><th>Kategori Paling Laku</th>'
   +'<th>Tiket Terjual</th><th>Hadir Hari-H</th><th>Omzet</th></tr></thead><tbody>';
  b.forEach(function(x){
    h+='<tr style="cursor:pointer" onclick="location.hash=&#39;#/ticketing/'+x.e.id+'&#39;">'
     +'<td><b>'+esc(x.e.title)+'</b><div class="mini">'+fmtDate(x.e.start_datetime)+'</div></td>'
     +'<td>'+(x.top?'<b>'+esc(x.top.name)+'</b> <span class="mini">'+(+x.top.sold||0)+' terjual</span>'
                  :'<span class="mini">belum ada penjualan</span>')+'</td>'
     +'<td><b>'+x.terjual+'</b></td>'
     /* Hadir dibandingkan dengan TIKET TERBIT, bukan dengan `terjual`: zona
        reguler walk-in menaikkan sold tanpa menerbitkan barcode, jadi
        membaginya dengan sold akan melaporkan kehadiran yang selalu lebih
        rendah dari kenyataan. */
     +'<td><b>'+x.hadir+'</b>'
       +(x.tiket?' <span class="mini">dari '+x.tiket+' e-ticket · '+x.hadirPct+'%</span>':'')+'</td>'
     +'<td>'+IDR(x.omzet)+'</td></tr>';
  });
  return h+'</tbody></table></div></div>';
}

/* ---------- APPROVAL FLOW (EMS) ----------
   Bentuknya sengaja MENIRU modul Marketing: satu kartu angka (berapa yang
   menunggu), dua tab (Antrian / Riwayat), tabel di bawahnya. Kru yang
   bolak-balik antara dua modul tidak perlu belajar dua tata letak untuk
   pekerjaan yang sama persis.

   Yang bukan manajemen tetap boleh membuka halamannya — melihat antrian itu
   berguna bagi yang mengajukan ("punyaku sudah diputuskan belum?"). Yang
   disaring bisaSetujui() hanya tombol Setujui/Tolak. */
/* DUA JENIS KEPUTUSAN di meja yang sama: rencana event, dan refund e-ticket.
   Keduanya sama-sama "manajemen memutuskan sesuatu yang tim tidak boleh
   putuskan sendiri", dan keduanya butuh riwayat yang bisa dibuka lagi enam
   bulan kemudian ("siapa yang menyetujui pengembalian 4,2 juta itu?").

   Sebelum ini refund diputuskan dari tab Penjualan di halaman Ticketing —
   tombol Setujui/Tolak berdiri tepat di sebelah daftar pembeli. Dua akibatnya:
   riwayat keputusan tidak pernah terkumpul di satu tempat, dan siapa pun yang
   sedang membaca papan penjualan bisa menyetujui uang keluar hanya karena
   tombolnya kebetulan ada di depan matanya. Tombol itu sekarang DICABUT dari
   sana (lihat salesBody); di Ticketing tinggal statusnya saja.

   Pemilih JENIS memakai .seg-per (segmented, seperti Upcoming/Riwayat di
   Ticketing), sedangkan Antrian/Riwayat tetap .tabs — dua tingkat pilihan
   yang digambar dengan gaya yang sama akan terbaca sebagai satu deret tab
   yang membingungkan. */
let apprEmsTab='antri';
let apprEmsJenis='event';
function setApprEmsTab(v){ apprEmsTab=v; router(); }
function setApprEmsJenis(v){ apprEmsJenis=v; apprEmsTab='antri'; router(); }
/* Pengajuan refund menunjuk order, bukan event. Yang dibutuhkan meja putusan
   justru rangkaian lengkapnya: acara apa, pembeli siapa, berapa tiket yang
   ikut hangus. Order yang sudah tidak ada (event dihapus beserta isinya)
   memulangkan o=null dan disaring keluar — tidak ada yang bisa diputuskan
   dari pengajuan yang tidak punya pesanan lagi. */
function refundRingkas(r){
  const o=DB.orders.find(function(x){ return x.id===r.order_id; })||null;
  const e=o?DB.events.find(function(x){ return x.id===o.event_id; }):null;
  const tks=o?DB.tickets.filter(function(t){ return t.order_item_id===o.id; }):[];
  return { r:r, o:o, e:e, tiket:tks.length };
}
function apprRefundList(){
  return (DB.refunds||[]).map(refundRingkas).filter(function(x){ return !!x.o; });
}
function renderApprovalEms(){
  const setuju=bisaSetujui();
  setTop('Approval Flow','Meja putusan manajemen','');

  const diajukan=DB.events.filter(function(e){ return !!pengajuan(e); });
  const antriEv=diajukan.filter(function(e){ return statusPengajuan(e)==='Menunggu'; });
  const riwayatEv=diajukan.filter(function(e){ return statusPengajuan(e)!=='Menunggu'; })
    .sort(function(a,b){ return String((b.pengajuan||{}).disetujuiPada||'').localeCompare(String((a.pengajuan||{}).disetujuiPada||'')); });

  const semuaRf=apprRefundList();
  // Antrian refund diurut TERLAMA DI ATAS: yang paling lama menunggu uangnya
  // kembali adalah yang paling mendesak, bukan yang paling baru masuk.
  const antriRf=semuaRf.filter(function(x){ return x.r.status==='Pending'; })
    .sort(function(a,b){ return String(a.r.requested_at||'').localeCompare(String(b.r.requested_at||'')); });
  const riwayatRf=semuaRf.filter(function(x){ return x.r.status!=='Pending'; })
    .sort(function(a,b){ return String(b.r.decided_at||b.r.approved_at||'').localeCompare(String(a.r.decided_at||a.r.approved_at||'')); });
  const nilaiAntriRf=antriRf.reduce(function(a,x){ return a+(+x.o.total||0); },0);

  let h='<div class="grid g4" style="margin-bottom:18px">'
    +stat('Rencana Menunggu',antriEv.length,antriEv.length?'perlu ditindak':'semua sudah diputuskan')
    +stat('Refund Menunggu',antriRf.length,antriRf.length?'pembeli sedang menunggu uangnya':'tidak ada yang menggantung')

    +'<button class="'+(apprEmsJenis==='refund'?'on':'')+'" onclick="setApprEmsJenis(&#39;refund&#39;)">Refund E-Ticket'+(antriRf.length?' ('+antriRf.length+')':'')+'</button>'
    +'</div></div>';

  const antri  = apprEmsJenis==='refund' ? antriRf   : antriEv;
  const riwayat= apprEmsJenis==='refund' ? riwayatRf : riwayatEv;
  const list   = apprEmsTab==='riwayat' ? riwayat : antri;
  h+='<div class="tabs">'
    +'<button class="'+(apprEmsTab==='antri'?'active':'')+'" onclick="setApprEmsTab(&#39;antri&#39;)">Antrian'+(antri.length?' ('+antri.length+')':'')+'</button>'
    +'<button class="'+(apprEmsTab==='riwayat'?'active':'')+'" onclick="setApprEmsTab(&#39;riwayat&#39;)">Riwayat Approval'+(riwayat.length?' ('+riwayat.length+')':'')+'</button>'
    +'</div>';
  if(!list.length){
    const kosong = apprEmsTab==='antri'
      ? (apprEmsJenis==='refund' ? 'Tidak ada pengajuan refund yang menunggu. ⚓'
                                 : 'Tidak ada rencana yang menunggu keputusan. ⚓')
      : 'Belum ada keputusan yang tercatat.';
    C().innerHTML=h+'<div class="empty">'+kosong+'</div>';
    return;
  }
  C().innerHTML=h+(apprEmsJenis==='refund'
    ? apprTabelRefund(list,setuju)
    : apprTabelEvent(list,setuju));
}

/* TIGA TAB di satu halaman: rencana yang sedang digarap, bank ide, dan
   riwayat acara yang sudah lewat.

   Ketiganya dulu berdiri sebagai menu sendiri-sendiri di kelompok
   "Intelligence". Padahal ide, rencana, dan acara yang sudah jalan adalah
   tiga wujud dari benda yang SAMA pada tiga waktu berbeda — dan pertanyaan
   yang membawa orang ke sini hampir selalu melintasi ketiganya: "pernah
   bikin yang seperti ini belum, hasilnya bagaimana, ada idenya di bank?".
   Tiga menu berarti tiga halaman untuk satu pertanyaan.

   renderIdeas & renderHistory dipanggil APA ADANYA, isinya tidak disalin:
   keduanya masih punya rutenya sendiri (#/ideas, #/history) supaya tautan
   lama dan baris izinnya tidak putus. Keduanya menulis ke C() sendiri, jadi
   pita tab ditempelkan sesudahnya. */
let planTab='rencana';
function setPlanTab(v){ planTab=v; renderPlanning(); }
function planTabsHTML(){
  /* 'Event Idea Bank' DICABUT dari sini. Halaman Perencanaan menjawab "apa yang
     sedang disiapkan dan menunggu keputusan"; bank ide menjawab "apa yang
     mungkin dibuat suatu saat" - dua jarak waktu yang sangat berbeda, dan
     mencampurnya membuat tab ini terbaca seolah ide adalah tahap awal
     perencanaan, padahal tidak pernah begitu dipakai.

     Halamannya sendiri tidak dihapus (#/ideas masih ada di router) - yang
     dicabut cuma pintunya dari Perencanaan. */
  const t=[['rencana','Perencanaan'],['riwayat','Event History']];
  return '<div class="tabs">'+t.map(function(x){
    return '<button class="'+(planTab===x[0]?'active':'')+'" '
      +'onclick="setPlanTab(&#39;'+x[0]+'&#39;)">'+x[1]+'</button>'; }).join('')+'</div>';
}
function renderPlanning(){
  const boleh=bisaUbah('planning'), setuju=bisaSetujui();
  // Tab 'ide' sudah tidak ada; data lama yang tersimpan dipulangkan ke Perencanaan.
  if(planTab==='ide') planTab='rencana';
  if(planTab==='riwayat'){
    renderHistory();
    C().innerHTML=planTabsHTML()+C().innerHTML;
    setTop('Perencanaan Event','Acara yang sudah lewat — bisa dibuat ulang','');
    return;
  }
  setTop('Perencanaan Event','Rencana yang belum disetujui manajemen',
    boleh?'<button class="btn" onclick="eventForm(null,{status:\'Planning\'})">+ Rencana Baru</button>':'');
  /* Tahap Prospect ikut: rencana yang sudah diajukan dan sedang ditunggu
     manajemen masih pekerjaan halaman ini — yang mengajukan perlu melihat
     miliknya sampai diputuskan. */
  const semua=DB.events.filter(e=>e.status==='Planning'||e.status==='Prospect');
  const st=e=>statusPengajuan(e);
  const saring={all:semua,
    belum:semua.filter(e=>st(e)==='Belum diajukan'),
    nunggu:semua.filter(e=>st(e)==='Menunggu'),
    tolak:semua.filter(e=>st(e)==='Ditolak')};
  const list=saring[planFilter]||semua;
  /* TOMBOL SARING, bukan tab. Isinya memang satu halaman yang sama —
     rencana event — cuma disaring statusnya. Dibuat menyerupai tab, ia
     terbaca seolah empat halaman berbeda, dan orang jadi ragu apakah
     "Semua" itu halaman lain atau saringan yang dilepas. Bentuk chip
     menjawabnya sendiri: yang menyala = saringan yang sedang menempel. */
  const tab=(k,t)=>`<button class="fchip${planFilter===k?' on':''}" onclick="planFilter='${k}';renderPlanning()">`
    +`${t} <b>${saring[k].length}</b></button>`;

  /* Pita tab di paling atas, di atas chip saringan: tab berpindah HALAMAN
     (rencana / ide / riwayat), chip cuma menyaring daftar yang sama. Dua
     tingkat yang berbeda, jadi urutannya harus jelas dari atas ke bawah. */
  let h=planTabsHTML()
    +`<div class="fbar">${tab('all','Semua')}${tab('belum','Belum diajukan')}`
    +`${tab('nunggu','Menunggu keputusan')}${tab('tolak','Ditolak')}</div>`;
  /* Manajemen melihat lebih dulu apa yang menunggu keputusannya — itu satu-
     satunya alasan mereka membuka halaman ini. */
  if(setuju && saring.nunggu.length)
    h+=`<div class="tbl-note">${svg(IC.alert)}<span><b>${saring.nunggu.length} rencana</b> menunggu keputusanmu.</span></div>`;
  if(!list.length){
    h+='<div class="empty">'+(planFilter==='nunggu'?'Tidak ada yang menunggu keputusan.':'Belum ada rencana di sini.')+'</div>';
    C().innerHTML=h; return;
  }
  /* Satu kartu yang gagal digambar TIDAK boleh menghapus tiga kartu lain.
     Tanpa penjaga ini, satu event dengan data cacat membuat seluruh .map()
     melempar, `C().innerHTML` tidak pernah ditulis, dan yang tampak di layar
     adalah tab dengan hitungan yang benar di atas daftar yang kosong sama
     sekali — gejala yang mustahil dilacak karena angkanya justru meyakinkan. */
  h+='<div class="grid g3">'+list.map(function(e){
   try{
    const p=pengajuan(e), s=st(e);
    const chip=s==='Menunggu'?'<span class="badge b-yellow">Menunggu keputusan</span>'
      :s==='Ditolak'?'<span class="badge b-red">Ditolak</span>'
      :'<span class="badge b-grey">Belum diajukan</span>';
    return `<div class="ecard">
      <div class="cover" onclick="location.hash='#/events/${e.id}'">${posterCoverHTML(e)}
        <span class="cat">${esc(e.category||'')}</span></div>
      <div class="body">
        <div class="t">${esc(e.title||'(tanpa judul)')}</div>
        <div class="meta">📅 ${fmtDateTime(e.start_datetime)}</div>
        <div class="meta">📍 ${esc(e.venue||'—')}</div>
        <div class="meta">👤 ${esc(e.pic||'—')}</div>
        <div style="margin:8px 0">${chip}</div>
        ${p&&p.status==='Menunggu'?`<div class="mini">Diajukan ${esc(p.oleh||'')} · ${fmtDateTime(p.pada)}</div>`:''}
        ${p&&p.status==='Ditolak'&&p.alasan?`<div class="mini" style="color:var(--red)">Alasan: ${esc(p.alasan)}</div>`:''}
        <div class="pill-row" style="margin-top:10px">
          <button class="btn ghost sm" onclick="location.hash='#/events/${e.id}'">Buka</button>
          ${boleh&&s!=='Menunggu'?`<button class="btn sm" onclick="ajukanRencana('${e.id}')">Ajukan ke manajemen</button>`:''}
          ${setuju&&s==='Menunggu'?`<button class="btn sm" onclick="setujuiRencana('${e.id}')">Setujui</button>
            <button class="btn ghost danger sm" onclick="tolakRencana('${e.id}')">Tolak</button>`:''}
          <!-- Rencana yang salah ketik juga harus punya jalan keluar. Tanpa
               tombol ini, satu-satunya cara membuang rencana percobaan adalah
               menyetujuinya dulu supaya pindah ke Event Management — yang
               berarti mengotori Approval Flow dengan keputusan palsu. -->
          ${boleh?`<button class="rowdel" style="margin-left:auto" title="Hapus rencana" onclick="hapusEvent('${e.id}')">${svgTong(15)}</button>`:''}
        </div>
      </div></div>`;
   }catch(err){
    console.error('Kartu rencana gagal digambar:', e, err);
    /* Kartu pengganti ini TIDAK BOLEH membaca isi `e` tanpa penjaga sendiri.
       Yang membuat kartu aslinya gagal biasanya justru salah satu propertinya,
       dan membacanya lagi di sini melempar untuk kedua kalinya — kali ini di
       LUAR try, sehingga seluruh daftar ikut hilang lagi dan penjaga ini
       menjadi sia-sia. Persis itu yang terjadi saat penjaga ini pertama diuji:
       ecard=0, sama saja dengan sebelum ada penjaga. */
    let judul='(rencana rusak)';
    try{ if(e&&e.title) judul=String(e.title); }catch(_){}
    let sebab='penyebab tidak terbaca';
    try{ sebab=(err&&err.message)||String(err); }catch(_){}
    return '<div class="ecard"><div class="body">'
      +'<div class="t">'+esc(judul)+'</div>'
      +'<div class="meta" style="color:var(--red)">Kartu ini gagal digambar.</div>'
      +'<div class="mini">'+esc(sebab)+'</div></div></div>';
   }
  }).join('')+'</div>';
  C().innerHTML=h;
}

/* ============ HAK AKSES ============

     +'</span></div>';
  }else{
    const saya=rosterSaya(s);

    h+='<div class="tbl-scroll"><table><thead><tr><th>Pengguna</th><th>Tim / Keterangan</th><th>Status</th><th>Peran EMS</th></tr></thead><tbody>';

      h+='<tr><td colspan="4"><span class="mini">Belum ada kru yang diberi akses modul Event di Office.</span></td></tr>';
    }
    baris.forEach(function(m){

      h+='<tr><td><b>'+esc(m.name||m.id)+'</b>'+(saya&&saya.id===m.id?' <span class="mini">(kamu)</span>':'')+'</td>'

  /* Tombol "Segarkan dari Office" DICABUT. Menyegarkan roster bukan keputusan

     seseorang dibetulkan di Office, lalu di sini masih tampil yang lama sampai

     Sekarang halaman ini menariknya sendiri tiap kali dibuka (lihat
     renderAkses -> segarkanRosterOtomatis). Yang tersisa hanya keterangan kapan

  h+='<div class="mini" style="margin-top:10px">'
   +(EMS_ROSTER

      : '<b style="color:var(--red)">Office tidak terjangkau</b> — yang tampil salinan terakhir. '
        +esc(String(EMS_ROSTER_ERR||'')))
   +'</div>';
  h+='</div>';

  h+='<div class="card" style="margin-top:16px"><h3 class="sec">Matriks Izin</h3>'

   +'<div class="tbl-scroll"><table><thead><tr><th>Halaman</th>'

/* Menarik ulang roster tanpa memuat ulang halaman — dipakai setelah seseorang
   baru saja dibetulkan kolom Tim-nya di Office. Menggambar ulang MENU juga,
   bukan cuma tabelnya: peran yang berubah bisa mengubah menu yang boleh
   dilihat, termasuk peranmu sendiri. */
/* Penarikan roster otomatis saat halaman Hak Akses dibuka.
   TIDAK menggambar ulang kalau isinya sama persis: renderAkses() memanggil ini,
   dan menggambar ulang tanpa syarat akan memanggil renderAkses() lagi -
   putaran tak berujung. Perbandingannya lewat sidik jari JSON, bukan panjang
   daftar: orang yang bertukar peran tidak mengubah jumlah anggota.

   Menggambar ulang MENU juga, bukan cuma tabelnya: peran yang berubah bisa
   mengubah menu yang boleh dilihat, termasuk peranmu sendiri. */
async function segarkanRosterOtomatis(){
  const sebelum=JSON.stringify(EMS_ROSTER||null);
  await muatRosterOffice();
  window._rosterAt=Date.now();
  if(JSON.stringify(EMS_ROSTER||null)===sebelum) return;
  buildNav();
  if(String(location.hash).indexOf('akses')>-1) renderAkses();
}
function setIzin(hal,peran,nilai){
  if(!bisaUbah('akses')) return;
  const P=emsPerm(); P[hal]=P[hal]||{}; P[hal][peran]=+nilai;
  /* PENJAGA: manajemen tidak boleh mengunci dirinya sendiri keluar dari halaman

/* Saringan periode, bentuk & kosakata yang sama dengan Input & Event di
   Marketing supaya kru tidak belajar dua istilah untuk satu hal. */
let evtCari='', evtPeriode='';
const EVT_PERIODE=[['','Semua'],['hari','Hari ini'],['minggu','Minggu ini'],['bulan','Bulan ini']];
function evtSetPeriode(k){ evtPeriode=k; renderEvents(); }

/* Satu penghitung rentang untuk SELURUH modul — dipakai daftar event dan
   dashboard. Dua salinan aturan "minggu ini" pasti lambat laun berbeda,
   dan bedanya cuma ketahuan saat dua layar melaporkan jumlah yang tidak
   sama untuk hari yang sama. Minggu = Senin–Minggu, sama dengan modul
   Jadwal Shift dan cara orang di sini menyebutnya. */
/* MODE PERIODE, kini empat bentuk — bukan lagi cuma tiga kata tetap:

     ''            seluruh riwayat
     'hari'        hari ini
     'minggu'      Senin-Minggu pekan ini
     'bulan'       bulan berjalan
     '2026-09'     BULAN TERTENTU        <- baru
     '2026-09-05'  TANGGAL TERTENTU      <- baru

   Sebelumnya tiga kata itu satu-satunya pilihan, jadi pertanyaan sesederhana
   "September kemarin bagaimana?" tidak bisa dijawab sama sekali dari layar —
   dan menjelang penyusunan acara, membandingkan bulan justru pekerjaan yang
   paling sering dilakukan.

   Bentuk tanggal & bulan dikenali dari POLANYA, bukan dari saklar terpisah.
   Dengan begitu seluruh pemanggil lama (dashboard, performance, report, daftar
   event) ikut mendukungnya tanpa satu baris pun berubah di sana. */
function rentangPeriode(mode){
  if(!mode) return null;
  const m=String(mode);
  if(/^\d{4}-\d{2}-\d{2}$/.test(m)) return {a:m, b:m};
  if(/^\d{4}-\d{2}$/.test(m)){
    const th=+m.slice(0,4), bl=+m.slice(5,7);
    const akh=new Date(th, bl, 0);
    return {a:m+'-01', b:m+'-'+String(akh.getDate()).padStart(2,'0')};
  }
  const f=function(x){ return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); };
  const t=new Date();
  if(mode==='hari') return {a:f(t),b:f(t)};
  if(mode==='minggu'){
    const sen=new Date(t); sen.setDate(t.getDate()-((t.getDay()+6)%7));
    const min=new Date(sen); min.setDate(sen.getDate()+6);
    return {a:f(sen),b:f(min)};
  }
  const awal=new Date(t.getFullYear(),t.getMonth(),1);
  const akhir=new Date(t.getFullYear(),t.getMonth()+1,0);
  return {a:f(awal),b:f(akhir)};
}

function saveEvent(id){
  const g=x=>document.getElementById(x).value;

  // Tanggal wajib: event tanpa tanggal tidak bisa masuk kalender, tidak bisa
  // dinilai upcoming/selesai, dan dulu diam-diam diisi "sekarang".
  if(!g('e_start')){toast('Tanggal & jam mulai wajib diisi.');return;}
  if(g('e_end') && g('e_end')<g('e_start')){toast('⛔ Waktu selesai tidak boleh sebelum waktu mulai.');return;}
  const data={title,category:g('e_cat'),theme:g('e_theme'),venue:g('e_venue'),capacity:+g('e_cap'),start_datetime:g('e_start')?new Date(g('e_start')).toISOString():new Date().toISOString(),end_datetime:g('e_end')?new Date(g('e_end')).toISOString():new Date().toISOString(),pic:g('e_pic'),description:'<p>'+esc(g('e_desc'))+'</p>',is_ticketed:document.getElementById('e_tix').checked};

  // event tanpa membuka pemilih gambar tidak menghapus poster yang sudah ada.
  if(window._posterBaru)      data.poster_img=window._posterBaru;
  else if(window._posterHapus) data.poster_img=null;
  if(id){Object.assign(DB.events.find(x=>x.id===id),data);}
  else{const nid=uid();data.status='Draft';data.idea_id=window._dariIde||null;window._dariIde=null;DB.events.push({id:nid,...data});
    // default timeline & tasks from template
    DB.eventDetails[nid]={timeline:Object.fromEntries(TIMELINE_PHASES.map(p=>[p,false])),rundown:[],vendors:[],budget:[],sponsors:[],tasks:[{title:'Design poster',assignee:'Marketing',due:data.start_datetime,done:false},{title:'Book talent',assignee:'Ent. Coord',due:data.start_datetime,done:false}]};

/* Pemutar status lama DIHAPUS. Ia memutar lima status dalam satu lingkaran —
   bentuk yang tidak lagi punya arti sejak Planning→Upcoming hanya boleh lewat
   persetujuan manajemen. Perpindahan yang sah sekarang cuma dua, dan keduanya
   punya jalannya sendiri: setujuiRencana() dan setEventStatus(). */
function toggleTimeline(id,p){DB.eventDetails[id].timeline[p]=!DB.eventDetails[id].timeline[p];save();}
/* toggleTask() DIHAPUS: centang "selesai" sekarang jadi kolom biasa di tabel
   task (data-r="done") dan ikut tersimpan lewat simpanSeksi seperti kolom lain. */
/* Rundown, Vendor, Budget, Sponsor & Task diisi LANGSUNG di tabel yang sedang
   dilihat. Dua generasi sebelumnya sudah dibuang: prompt() beruntun (hilang
   semua kalau satu di-Cancel), lalu tombol "✎ Kelola X" yang membuka modal
   berisi tabel KEDUA. Modal itu punya cacat yang sama tiap kali: tabel yang
   dibaca bukan tabel yang diisi, layarnya menutupi konteks yang justru sedang
   dipakai memutuskan, dan menambah satu vendor perlu empat ketukan (buka,
   tambah, isi, simpan) — plus semuanya hangus kalau modalnya keburu ditutup.
   Sekarang: tekan Tambah, baris kosong muncul di tempat, isi, selesai.
   Tersimpan sendiri begitu kotaknya ditinggalkan, jadi tidak ada lagi keadaan
   "sudah diketik tapi belum tersimpan" yang bisa hilang. */
function ambilBaris(wrapId,kolom){
  const wrap=document.getElementById(wrapId); if(!wrap)return [];
  return [...wrap.querySelectorAll('tbody tr')].map(tr=>{
    const o={};
    kolom.forEach(k=>{
      const el=tr.querySelector('[data-r="'+k+'"]');
      if(!el){ o[k]=''; return; }
      if(el.type==='checkbox') o[k]=el.checked;
      // Kotak uang menyimpan "1.500.000" di layar; yang dibaca kode angkanya.
      else if(el.classList.contains('uang')) o[k]=+String(el.value).replace(/\D/g,'')||0;
      else o[k]=el.value.trim();
    });
    return o;
  });
}
function barisTambah(wrapId,html){
  const b=document.querySelector('#'+wrapId+' tbody'); if(!b)return;
  const tmp=document.createElement('tbody'); tmp.innerHTML=html;
  b.appendChild(tmp.firstElementChild);
  const inp=b.lastElementChild.querySelector('input,select'); if(inp)inp.focus();
}
/* Hapus baris. Kalau barisnya ada di dalam seksi detail event, seksinya
   digambar ulang seutuhnya — bukan sekadar dicabut dari DOM — supaya pesan
   "belum ada isi" dan angka turunannya (total, variance) ikut benar. */
function barisHapus(btn){
  const wrap=btn.closest('.tbl-edit'), tb=btn.closest('tbody');
  btn.closest('tr').remove();
  if(wrap&&wrap.dataset.ev){ simpanSeksi(wrap.dataset.ev,wrap.dataset.sek,true); return; }
  if(!tb.querySelector('tr')) tb.innerHTML='<tr class="kosong"><td colspan="9" class="empty">Belum ada baris — tekan Tambah.</td></tr>';
}
function bersihkanKosong(wrapId){ const k=document.querySelector('#'+wrapId+' tr.kosong'); if(k)k.remove(); }

/* Argumen kedua tiap pembuat baris: boleh diubah atau tidak. Kotaknya dimatikan
   lewat `disabled` dan tombol hapusnya tidak digambar — bentuknya tetap sama
   supaya kolom yang dibaca sama persis dengan kolom yang diisi. */
function matikan(boleh){ return boleh===false?' disabled':''; }
/* PEMILIH STATUS DI TABEL SEKSI.
   Dulu selalu <select>, termasuk saat seksinya cuma boleh DIBACA — dan select
   yang disabled tetap menggambar panah dropdown-nya. Yang terlihat: ikon
   dropdown yang diketuk berkali-kali tanpa terjadi apa-apa, tanpa satu pun
   petunjuk kenapa. Itu keluhan "vendor kenapa ada icon dropdown tetapi tidak
   bisa dipakai".

   Mode baca sekarang memakai badge biasa. Yang boleh mengubah tetap dapat
   select penuh — dan di situlah jawaban "status Confirmed diubah dari mana":
   dari kolom Status di baris vendornya sendiri, bukan dari layar lain.

   NILAI LAMA YANG SUDAH TIDAK ADA DI DAFTAR tetap ikut jadi pilihan. Tanpa itu
   vendor lama berstatus 'Cancelled' akan diam-diam terbaca sebagai pilihan
   PERTAMA ('Pending') begitu barisnya tersentuh — status berubah sendiri tanpa
   ada yang menyentuhnya. */
function selStatus(nilai, opsi, boleh, kunci){
  const skr=String(nilai==null?'':nilai);
  if(boleh===false) return skr?statusBadge(skr):'<span class="mini">—</span>';
  const daftar=opsi.slice();
  if(skr && daftar.indexOf(skr)<0) daftar.push(skr);      // nilai warisan
  return '<select class="inp" data-r="'+(kunci||'status')+'">'
    +daftar.map(function(x){ return '<option'+(skr===x?' selected':'')+'>'+esc(x)+'</option>'; }).join('')
    +'</select>';
}
function selHapus(boleh){ return boleh===false?'<td></td>'
  :'<td><button class="rowdel" title="Hapus baris" onclick="barisHapus(this)">×</button></td>'; }

const RD_COLS=['time','endtime','activity','pic','notes'];

const VD_COLS=['name','pic','phone','cost','status'];
/* 'Cancelled' dicabut atas permintaan: vendor yang batal dihapus barisnya,

const VD_STATUS=['Pending','Confirmed','Paid'];
function vendorRowHTML(v,b){v=v||{};const m=matikan(b);return `<tr>

  <td>${selStatus(v.status||'Pending',VD_STATUS,b)}</td>

const TK_COLS=['title','assignee','due','done'];
function taskRowHTML(t,b){t=t||{};const m=matikan(b);const due=t.due?String(t.due).slice(0,10):'';return `<tr>
  <td><input class="inp" data-r="title" value="${esc(t.title||'')}" placeholder="judul task"${m}></td>

/* ---- BUDGET & SPONSOR ----
   Dua bagian ini sebelumnya HANYA bisa dibaca: tabelnya digambar dari
   d.budget / d.sponsors, tapi tidak ada satu pun tombol yang bisa mengisinya
   — jadi selamanya berbunyi "Belum ada budget". Sekarang keduanya memakai
   pola baris-langsung yang sama dengan Rundown/Vendor/Task. */
const BG_COLS=['item','type','budget','actual'];
const BG_TYPES=['Expense','Income'];
function budgetRowHTML(b,bo){b=b||{};const m=matikan(bo);
  const v=(+b.actual||0)-(+b.budget||0);
  const warna=v<0?'var(--green)':v>0?'var(--red)':'var(--muted)';
  return `<tr>
  <td><input class="inp" data-r="item" value="${esc(b.item||'')}" placeholder="nama item"${m}></td>
  <td><select class="inp" data-r="type"${m}>${BG_TYPES.map(x=>`<option ${b.type===x?'selected':''}>${x}</option>`).join('')}</select></td>
  <td><span class="uang-wrap"><span class="uang-rp">Rp</span><input class="inp uang-inp uang" inputmode="numeric" data-r="budget" value="${uangFormat(+b.budget||0)}" oninput="uangKetik(this)"${m}></span></td>
  <td><span class="uang-wrap"><span class="uang-rp">Rp</span><input class="inp uang-inp uang" inputmode="numeric" data-r="actual" value="${uangFormat(+b.actual||0)}" oninput="uangKetik(this)"${m}></span></td>

const SP_COLS=['name','package','nominal','agreement','status'];
const SP_STATUS=['Pending','Confirmed','Paid'];
function sponsorRowHTML(sp,b){sp=sp||{};const m=matikan(b);return `<tr>
  <td><input class="inp" data-r="name" value="${esc(sp.name||'')}" placeholder="nama sponsor"${m}></td>
  <td><input class="inp" data-r="package" value="${esc(sp.package||'')}" placeholder="mis. Gold / Media Partner"${m}></td>
  <td><span class="uang-wrap"><span class="uang-rp">Rp</span><input class="inp uang-inp uang" inputmode="numeric" data-r="nominal" value="${uangFormat(+sp.nominal||0)}" oninput="uangKetik(this)"${m}></span></td>
  <td><input class="inp" data-r="agreement" value="${esc(sp.agreement||'')}" placeholder="MoU / kontrak"${m}></td>
  <td>${selStatus(sp.status||'Pending',SP_STATUS,b)}</td>
  ${selHapus(b)}</tr>`;}
/* ---- MESIN SEKSI DETAIL EVENT ----
   Kelima seksi berbeda hanya pada kolomnya, jadi yang dibedakan cuma data ini;
   cara menggambar, menambah, menyimpan, dan menghapusnya satu jalur untuk
   semuanya. Menambah seksi keenam nanti = menambah satu entri di sini. */
const SEKSI={
  rundown:{judul:'🗓️ Rundown', catatan:'urut jam mulai', tambah:'Tambah baris',
    kosong:'Belum ada rundown.', kolom:RD_COLS, baris:rundownRowHTML,
    th:'<th style="width:118px">Mulai</th><th style="width:118px">Selesai</th><th>Activity</th><th style="width:140px">PIC</th><th>Notes</th>',
    isi:function(r){ return !!(r.time||r.activity); },
    rapi:function(r){ return r; },
    /* Diurutkan saat DISIMPAN, bukan saat digambar: kalau barisnya melompat
       posisi tiap kali jam diketik, mustahil mengisinya. Urutan barunya baru
       terlihat waktu halaman ini dibuka lagi. */
    urut:function(a,b){ return String(a.time).localeCompare(String(b.time)); }},
  vendors:{judul:'🤝 Vendor', tambah:'Tambah vendor', kosong:'Belum ada vendor.',
    kolom:VD_COLS, baris:vendorRowHTML,
    th:'<th>Vendor</th><th style="width:140px">PIC</th><th style="width:140px">Phone</th><th style="width:150px">Cost (IDR)</th><th style="width:136px">Status</th>',
    isi:function(v){ return !!v.name; },
    rapi:function(v){ return {name:v.name,pic:v.pic,phone:v.phone,cost:+v.cost||0,status:v.status||'Pending',attachment:''}; }},
  budget:{judul:'💰 Budget', catatan:'Budget = rencana, Actual = yang benar-benar keluar/masuk',
    tambah:'Tambah item', kosong:'Belum ada item budget.', kolom:BG_COLS, baris:budgetRowHTML,
    th:'<th>Item</th><th style="width:136px">Tipe</th><th style="width:150px">Budget</th><th style="width:150px">Actual</th><th style="width:130px">Variance</th>',
    isi:function(b){ return !!b.item; },
    rapi:function(b){ return {item:b.item,type:b.type||'Expense',budget:+b.budget||0,actual:+b.actual||0}; }},
  sponsors:{judul:'🏷️ Sponsor', tambah:'Tambah sponsor', kosong:'Belum ada sponsor.',
    kolom:SP_COLS, baris:sponsorRowHTML,
    th:'<th>Sponsor</th><th style="width:170px">Package</th><th style="width:150px">Nominal</th><th style="width:150px">Agreement</th><th style="width:136px">Status</th>',
    isi:function(s){ return !!s.name; },
    rapi:function(s){ return {name:s.name,package:s.package,nominal:+s.nominal||0,agreement:s.agreement,status:s.status||'Pending'}; },
    kaki:function(d){ return '<tr><td colspan="2" style="text-align:right"><b>Total sponsor masuk</b></td>'
      +'<td colspan="4"><b id="sp_total">'+IDR(totalSponsor(d))+'</b></td></tr>'; }},
  tasks:{judul:'✅ Task Internal', catatan:'sinkron Task Management', tambah:'Tambah task',
    kosong:'Belum ada task.', kolom:TK_COLS, baris:taskRowHTML,
    th:'<th>Task</th><th style="width:160px">Assignee</th><th style="width:160px">Due Date</th><th style="width:70px">Selesai</th>',
    isi:function(t){ return !!t.title; },
    rapi:function(t){ return {title:t.title,assignee:t.assignee,
      due:t.due?new Date(t.due).toISOString():new Date().toISOString(), done:!!t.done}; }}
};
function totalSponsor(d){ return (d.sponsors||[]).filter(function(x){ return x.status!=='Cancelled'; })
  .reduce(function(a,x){ return a+(+x.nominal||0); },0); }
function wrapSeksi(k){ return 'sek_'+k+'_wrap'; }

/* Satu seksi utuh: judul, tombol tambah, dan tabelnya. `boleh` = orangnya
   memang boleh mengubah (peran + event belum selesai). Kalau tidak boleh,
   tabel yang SAMA digambar dengan kotak yang dimatikan — bukan tabel baca
   tersendiri, supaya tidak ada dua tampilan yang bisa saling ketinggalan. */
function seksiHTML(id,k,boleh){
  const s=SEKSI[k], d=ensureDetails(id), rows=d[k]||[];
  const kolTotal=(s.th.match(/<th/g)||[]).length+1;
  return '<div class="card" id="sek_'+k+'">'
   +'<div class="sek-head"><h3 class="sec" style="border:none;padding:0">'+s.judul
     +(s.catatan?' <span class="mini">('+s.catatan+')</span>':'')+'</h3>'
   +(boleh?'<button class="btn ghost sm" onclick="tambahBarisSeksi(\''+id+'\',\''+k+'\')">+ '+s.tambah+'</button>':'')
   +'</div>'
   +'<div class="tbl-edit'+(boleh?'':' baca')+'" id="'+wrapSeksi(k)+'" data-ev="'+esc(id)+'" data-sek="'+k+'"'
     +(boleh?' onchange="simpanSeksi(\''+id+'\',\''+k+'\')"':'')+'>'
   +'<table><thead><tr>'+s.th+'<th style="width:36px"></th></tr></thead><tbody>'
   +(rows.length?rows.map(function(r){ return s.baris(r,boleh); }).join('')
     :'<tr class="kosong"><td colspan="'+kolTotal+'" class="empty">'+s.kosong
      +(boleh?' Tekan <b>'+s.tambah+'</b> untuk mengisi.':'')+'</td></tr>')
   +'</tbody>'+(s.kaki?'<tfoot>'+s.kaki(d)+'</tfoot>':'')+'</table></div></div>';
}
function tambahBarisSeksi(id,k){
  const w=wrapSeksi(k);
  bersihkanKosong(w);
  /* RUNDOWN BERANTAI, pola yang sama dengan Marketing. Baris baru langsung
     mulai dari jam SELESAI baris terakhir; kalau tabelnya masih kosong, dari
     jam mulai acaranya. Rundown selalu disusun berurutan tanpa jeda, jadi
     mengetik ulang jam mulai yang sama persis dengan jam selesai di atasnya
     adalah pekerjaan yang tidak pernah punya jawaban lain - dan salah satu
     tempat paling sering salah ketik. Angkanya tetap bisa ditimpa. */
  let awal=null;
  if(k==='rundown'){
    const akhir=document.querySelector('#'+w+' tbody tr:last-child [data-r="endtime"]');
    if(akhir && akhir.value) awal=akhir.value;
    else {
      const e=DB.events.find(function(x){ return x.id===id; });
      const t=e&&e.start_datetime?String(e.start_datetime):'';
      const m=t.match(/T(\d{2}:\d{2})/); if(m) awal=m[1];
    }
  }
  barisTambah(w, SEKSI[k].baris(awal?{time:awal}:null, true));
  const tr=document.querySelector('#'+w+' tbody tr:last-child');
  if(tr){
    tr.classList.add('baru');
    /* Fokus ke jam SELESAI, bukan jam mulai: jam mulainya sudah terisi, yang
       perlu diketik berikutnya memang jam selesainya. */
    const fokus=tr.querySelector(awal?'[data-r="endtime"]':'input,select');
    if(fokus) fokus.focus();
  }
}
/* Menyimpan seksi. Dipanggil dari event `change` yang menggelembung dari
   seluruh tabel — jadi satu penangan untuk semua kotak, dan tersimpan tepat
   saat kotaknya ditinggalkan. `gambarUlang` hanya dipakai sesudah menghapus:
   di luar itu tabelnya sengaja TIDAK digambar ulang, karena itu akan merebut
   fokus dari kotak berikutnya yang sedang dituju orangnya. */
function simpanSeksi(id,k,gambarUlang){
  const s=SEKSI[k];
  const rows=ambilBaris(wrapSeksi(k),s.kolom).filter(s.isi).map(s.rapi);
  if(s.urut) rows.sort(s.urut);
  ensureDetails(id)[k]=rows;
  save();
  if(gambarUlang){ const c=document.getElementById('sek_'+k); if(c) c.outerHTML=seksiHTML(id,k,true); }
  else { document.querySelectorAll('#'+wrapSeksi(k)+' tr.baru').forEach(function(tr){ tr.classList.remove('baru'); }); }
  paintTurunan(id);
}
/* Angka yang dihitung dari isi tabel (kartu ringkas budget, variance per
   baris, total sponsor). Diperbarui di tempat supaya tidak perlu menggambar
   ulang tabel yang sedang diketik. */
function paintTurunan(id){
  const d=ensureDetails(id);
  const st=document.getElementById('bg_stat'); if(st) st.innerHTML=budgetStatHTML(d);
  const tot=document.getElementById('sp_total'); if(tot) tot.innerHTML=IDR(totalSponsor(d));
  document.querySelectorAll('#'+wrapSeksi('budget')+' tbody tr').forEach(function(tr){
    const sel=function(n){ const el=tr.querySelector('[data-r="'+n+'"]'); return el?+String(el.value).replace(/\D/g,'')||0:0; };
    const v=sel('actual')-sel('budget'), td=tr.querySelector('.bg-var'); if(!td) return;
    td.textContent=(v>0?'+':'')+IDR(v);
    td.style.color=v<0?'var(--green)':v>0?'var(--red)':'var(--muted)';
  });
}
function budgetStatHTML(d){
  const inc=(d.budget||[]).filter(function(b){ return b.type==='Income'; });
  const exp=(d.budget||[]).filter(function(b){ return b.type==='Expense'; });
  const sumB=function(a){ return a.reduce(function(s,b){ return s+(+b.budget||0); },0); };
  const sumA=function(a){ return a.reduce(function(s,b){ return s+(+b.actual||0); },0); };
  const profit=sumA(inc)-sumA(exp);
  return stat('Income (Actual)',IDR(sumA(inc)),'budget '+IDR(sumB(inc)))
        +stat('Expense (Actual)',IDR(sumA(exp)),'budget '+IDR(sumB(exp)))
        +stat('Profit',IDR(profit),profit>=0?'surplus':'defisit');
}

/* ============ TICKETING ============ */
function renderTicketing(id){
  if(id)return renderTicketDetail(id);
  setTop('Ticketing','Event ber-tiket yang sudah disetujui','');
  /* RENCANA TIDAK PUNYA TIKET.
     Event Planning belum diketok manajemen — menjualnya, entah lewat kasir di
     sini atau lewat situs customer, berarti menagih uang orang untuk acara yang
     barangkali tidak jadi. Situs customer sudah menolaknya di server
     (boleh_dijual di lib_ticketing.php); halaman ini dulu belum, jadi kelas
     tiket & penjualannya masih bisa dibuka dari sini. */
  const evs=DB.events.filter(e=>e.is_ticketed && e.status!=='Planning');
  /* DUA TAB: yang masih berjalan vs yang sudah lewat.
     Sebelumnya semuanya satu daftar, dan acara yang sudah selesai menumpuk
     selamanya di antara acara yang tiketnya sedang dijual - persis yang paling
     sering dibuka jadi paling sulit ditemukan, dan makin lama makin parah.
     Riwayat tidak dibuang, cuma pindah ke tabnya sendiri. */
  const sah=['upcoming','riwayat'];
  if(sah.indexOf(window._tixList)<0) window._tixList='upcoming';
  const selesai=evs.filter(e=>e.status==='Event Done');
  const jalan=evs.filter(e=>e.status!=='Event Done');
  const list=(window._tixList==='riwayat')?selesai:jalan;
  const tb=(k,l,n)=>`<button class="${window._tixList===k?'on':''}" onclick="window._tixList='${k}';renderTicketing()">${l}${n?' ('+n+')':''}</button>`;
  C().innerHTML=`<div class="toolbar"><div class="seg-per">${tb('upcoming','Upcoming',jalan.length)}${tb('riwayat','Riwayat Event',selesai.length)}</div></div>
  <div class="grid g2">${list.map(e=>{const cls=DB.ticketClasses.filter(c=>c.event_id===e.id);const sold=cls.reduce((a,c)=>a+(+c.sold||0),0);const quota=cls.reduce((a,c)=>a+(+c.quota||0),0);const rev=DB.orders.filter(o=>o.event_id===e.id&&o.payment_status==='Paid').reduce((a,o)=>a+(+o.total||0),0);const pct=quota?Math.round(sold/quota*100):0;return `<div class="ecard" onclick="location.hash='#/ticketing/${e.id}'"><div class="body">
    <div style="display:flex;justify-content:space-between"><div class="t">${posterKecilHTML(e,22)} ${esc(e.title)}</div>${statusBadge(e.status)}</div>
    <div class="meta">📅 ${fmtDate(e.start_datetime)} · 📍 ${esc(e.venue)}</div>
    <div style="margin-top:10px;display:flex;justify-content:space-between"><span>${sold}/${quota} tiket (${pct}%)</span><b style="color:var(--accent)">${IDR(rev)}</b></div>
    <div class="progress"><div style="width:${pct}%"></div></div>
    ${kartuKategoriHTML(e.id,cls)}
    ${pct>=90?'<div class="mini" style="color:var(--red);margin-top:6px">⚠ Tiket hampir habis!</div>':''}
  </div></div>`;}).join('')||`<div class="empty">${window._tixList==='riwayat'?'Belum ada event yang selesai.':'Belum ada event ber-tiket yang berjalan.'}</div>`}</div>`;
}
/* RINCIAN PER KATEGORI DI KARTU EVENT.
   "120/300 tiket" tidak memberi tahu apa yang sebenarnya perlu ditindak: VIP
   habis sementara Reguler baru terjual seperempat menuntut keputusan yang
   sangat berbeda dari sebaliknya, dan selama ini jawabannya cuma bisa didapat
   dengan membuka eventnya satu per satu.

   Dibatasi EMPAT baris teratas. Kartu di kisi dua kolom tidak boleh tumbuh
   mengikuti jumlah kategori - event dengan sembilan kelas tiket akan mendorong
   kartu di sebelahnya sampai daftarnya tidak lagi terbaca sebagai kisi.

function kartuKategoriHTML(eid,cls){
  if(!cls || cls.length<2) return '';        // satu kategori: bar di atasnya sudah menjawab
