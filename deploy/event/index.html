function talentSimpanInline(id){
  const t=DB.talents.find(x=>x.id===id); if(!t)return;
  const g=x=>{ const el=document.getElementById(x); return el?el.value.trim():''; };
  if(!g('ti_phone')){ toast('Phone wajib diisi.'); return; }
  const email=g('ti_email');
  if(email&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ toast('Email tidak valid.'); return; }
  Object.assign(t,{category:g('ti_cat'),phone:g('ti_phone'),whatsapp:g('ti_wa'),instagram:g('ti_ig'),
    email,manager_name:g('ti_mgr'),address:g('ti_addr'),npwp:g('ti_npwp'),
    default_fee:uangNilai('ti_fee'),bank_name:g('ti_bank'),bank_account:g('ti_acc'),
    status:g('ti_st'),contract_status:g('ti_ct')});
  if(!t.account_holder) t.account_holder=t.name;
  save(); renderTalentDetail(id); toast('✓ Data talent tersimpan.');
}

/* ============ TALENT SCHEDULE ============ */
let schMonth=new Date();
function renderSchedule(){
  setTop('Talent Schedule','Kalender jadwal · anti double-booking','<button class="btn ghost sm" onclick="dailyRulesModal()">⚙ Daily Rules</button> <button class="btn ghost sm" onclick="recurringModal()">🔁 Recurring</button> <button class="btn ghost sm" onclick="monthlyGenModal()">📅 Generate Bulanan</button> <button class="btn" onclick="scheduleForm()">+ Jadwal</button>');
  const y=schMonth.getFullYear(),m=schMonth.getMonth();
  const first=new Date(y,m,1),startDow=first.getDay(),days=new Date(y,m+1,0).getDate();
  const todayStr=dstr(new Date());
  let cells='';
  for(let i=0;i<startDow;i++)cells+='<div class="cell other"></div>';
  for(let d=1;d<=days;d++){
    const ds=dstr(new Date(y,m,d));
    const daySched=DB.schedules.filter(s=>s.date===ds);
    cells+=`<div class="cell ${ds===todayStr?'today':''}"><div class="dn">${d}</div>${daySched.map(s=>{const t=DB.talents.find(x=>x.id===s.talent_id);const col={Scheduled:'b-yellow',Confirmed:'b-blue',Done:'b-green',Cancelled:'b-grey'}[s.status];return `<span class="evt-dot ${col}" onclick="event.stopPropagation();schedInfo('${s.id}')">${s.start_time} ${esc(t?t.name:'')}</span>`;}).join('')}</div>`;
  }
  C().innerHTML=`
  <div class="toolbar"><button class="btn ghost sm" onclick="schMonth=new Date(${y},${m-1},1);renderSchedule()">‹</button>
  <b style="min-width:150px;text-align:center">${MONTHS[m]} ${y}</b>
  <button class="btn ghost sm" onclick="schMonth=new Date(${y},${m+1},1);renderSchedule()">›</button>
  <span class="pill">${DB.schedules.filter(s=>s.date.startsWith(y+'-'+pad(m+1))).length} jadwal bulan ini</span></div>
  <div class="legend"><span><i class="dotc" style="background:var(--accent)"></i>Scheduled</span><span><i class="dotc" style="background:var(--blue)"></i>Confirmed</span><span><i class="dotc" style="background:var(--green)"></i>Done</span><span><i class="dotc" style="background:var(--grey)"></i>Cancelled</span></div>
  <div class="cal">${DOW.map(d=>`<div class="dow">${d}</div>`).join('')}${cells}</div>`;
}
function schedInfo(id){
  const s=DB.schedules.find(x=>x.id===id);const t=DB.talents.find(x=>x.id===s.talent_id);
  modal(`<button class="close" onclick="closeModal()">×</button><h3>${esc(t.name)}</h3>
  <div class="kv"><div class="k">Tanggal</div><div>${fmtDate(s.date)}</div><div class="k">Jam</div><div>${s.start_time} – ${s.end_time}</div><div class="k">Tipe</div><div>${s.performance_type}</div><div class="k">Fee</div><div>${IDR(s.fee)}</div><div class="k">Status</div><div>${statusBadge(s.status)}</div><div class="k">Source</div><div><span class="pill">${s.source}</span></div></div>
  <div class="modal-actions">
    <button class="btn ghost" onclick="cycleSchedStatus('${id}')">Ubah Status</button>
    <button class="btn danger" onclick="delSched('${id}')">Hapus</button>
    <button class="btn" onclick="closeModal()">Tutup</button></div>`);
}
function cycleSchedStatus(id){const order=['Scheduled','Confirmed','Done','Cancelled'];const s=DB.schedules.find(x=>x.id===id);s.status=order[(order.indexOf(s.status)+1)%order.length];save();closeModal();renderSchedule();toast('Status → '+s.status);}
function delSched(id){DB.schedules=DB.schedules.filter(x=>x.id!==id);save();closeModal();renderSchedule();toast('Jadwal dihapus.');}
function hasConflict(talent_id,date,st,et,ignoreId){return DB.schedules.some(s=>s.talent_id===talent_id&&s.date===date&&s.status!=='Cancelled'&&s.id!==ignoreId&&overlaps(st,et,s.start_time,s.end_time));}
function scheduleForm(){
  modal(`<button class="close" onclick="closeModal()">×</button><h3>Tambah Jadwal</h3>
  <div class="grid g2">
    <div class="field"><label>Talent *</label><select id="s_tal">${DB.talents.map(t=>`<option value="${t.id}" data-fee="${t.default_fee}" data-cat="${t.category}">${esc(t.name)}</option>`).join('')}</select></div>
    <div class="field"><label>Tanggal *</label><input id="s_date" type="date" value="${dstr(new Date())}"></div>
    <div class="field"><label>Jam Mulai</label><input id="s_start" type="time" value="20:00"></div>
    <div class="field"><label>Jam Selesai</label><input id="s_end" type="time" value="23:00"></div>
    <div class="field"><label>Tipe Performance</label><select id="s_type">${TAL_CATS.map(c=>`<option>${c}</option>`).join('')}</select></div>
    <div class="field"><label>Fee (IDR)</label>${uangInput('s_fee',1500000)}</div>
  </div>
  <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn" onclick="saveSchedule()">Simpan</button></div>`,true);
  document.getElementById('s_tal').onchange=function(){document.getElementById('s_fee').value=uangFormat(this.selectedOptions[0].dataset.fee);document.getElementById('s_type').value=this.selectedOptions[0].dataset.cat;};
  document.getElementById('s_tal').dispatchEvent(new Event('change'));
}
function saveSchedule(){
  const g=x=>document.getElementById(x).value;const tid=g('s_tal'),date=g('s_date'),st=g('s_start'),et=g('s_end');
  if(st>=et){toast('Jam selesai harus > jam mulai.');return;}
  if(hasConflict(tid,date,st,et)){const t=DB.talents.find(x=>x.id===tid);toast('⛔ Talent already booked — '+t.name+' bentrok di '+fmtDate(date));return;}
  DB.schedules.push({id:uid(),talent_id:tid,event_id:null,date,start_time:st,end_time:et,performance_type:g('s_type'),fee:uangNilai('s_fee'),status:'Scheduled',recurring_rule_id:null,source:'manual'});
  save();closeModal();renderSchedule();toast('Jadwal tersimpan (tanpa konflik).');
}
function recurringModal(){
  modal(`<button class="close" onclick="closeModal()">×</button><h3>🔁 Recurring Schedule</h3><p class="mini" style="margin-bottom:12px">Buat aturan berulang, sistem auto-generate dalam rentang tanpa duplikasi (idempotent).</p>
  <div class="grid g2">
    <div class="field"><label>Talent</label><select id="r_tal">${DB.talents.map(t=>`<option value="${t.id}" data-fee="${t.default_fee}">${esc(t.name)}</option>`).join('')}</select></div>
    <div class="field"><label>Tipe</label><select id="r_type">${TAL_CATS.map(c=>`<option>${c}</option>`).join('')}</select></div>
  </div>
  <div class="field"><label>Hari</label><div style="display:flex;gap:8px;flex-wrap:wrap">${DOW.map((d,i)=>`<label style="display:inline-flex;gap:4px;color:var(--txt)"><input type="checkbox" style="width:auto" value="${i}" class="r_dow">${d}</label>`).join('')}</div></div>
  <div class="grid g2">
    <div class="field"><label>Jam Mulai</label><input id="r_start" type="time" value="20:00"></div>
    <div class="field"><label>Jam Selesai</label><input id="r_end" type="time" value="23:00"></div>
    <div class="field"><label>Dari</label><input id="r_from" type="date" value="${dstr(new Date())}"></div>
    <div class="field"><label>Sampai</label><input id="r_to" type="date" value="${dstr(new Date(new Date().getFullYear(),new Date().getMonth()+2,0))}"></div>
    <div class="field"><label>Fee</label>${uangInput('r_fee',1500000)}</div>
  </div>
  <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn" onclick="genRecurring()">Generate</button></div>`,true);
}
function genRecurring(){
  const g=x=>document.getElementById(x).value;
  const dows=[...document.querySelectorAll('.r_dow:checked')].map(c=>+c.value);
  if(!dows.length){toast('Pilih minimal satu hari.');return;}
  const tid=g('r_tal'),st=g('r_start'),et=g('r_end'),fee=uangNilai('r_fee'),type=g('r_type');
  const rid=uid();DB.recurringRules.push({id:rid,talent_id:tid,days_of_week:dows,start_time:st,end_time:et,valid_from:g('r_from'),valid_to:g('r_to'),performance_type:type,fee});
  let added=0,skipped=0;const from=new Date(g('r_from')),to=new Date(g('r_to'));
  for(let d=new Date(from);d<=to;d.setDate(d.getDate()+1)){
    if(dows.includes(d.getDay())){const ds=dstr(d);
      if(hasConflict(tid,ds,st,et)){skipped++;continue;}
      DB.schedules.push({id:uid(),talent_id:tid,event_id:null,date:ds,start_time:st,end_time:et,performance_type:type,fee,status:'Scheduled',recurring_rule_id:rid,source:'recurring'});added++;}
  }
  save();closeModal();renderSchedule();toast(`✓ ${added} jadwal dibuat${skipped?', '+skipped+' dilewati (konflik/duplikat)':''}.`);
}
function monthlyGenModal(){
  /* Bawaan jam & fee diambil dari Daily Rules; kalau hari itu belum punya
     aturan, dipakai 20:00–23:00 seperti dulu. Fee-nya sekarang KELIHATAN dan
     bisa ditimpa per hari — sebelum ini fee diam-diam diambil dari default
     talent, jadi jadwal sebulan bisa ter-generate dengan angka yang tidak

  <p class="mini" style="margin-bottom:12px">Pola per hari untuk <b>${MONTHS[schMonth.getMonth()]} ${schMonth.getFullYear()}</b>. Bawaannya diambil dari <b>Daily Rules</b>; ubah di sini kalau bulan ini berbeda. Tanggal yang bentrok dilewati, tidak ditimpa.</p>

      <td><select class="inp mg_tal" data-dow="${i}" onchange="mgIsiFee(this)"><option value="">— kosong —</option>${pilihan.map(t=>`<option value="${t.id}" data-fee="${t.default_fee||0}">${esc(t.name)}${t.category?' · '+t.category:''}</option>`).join('')}</select></td>
      <td><input class="inp mg_st" type="time" value="${esc(r.start||'20:00')}"></td>
      <td><input class="inp mg_et" type="time" value="${esc(r.end||'23:00')}"></td>
      <td><input class="inp mg_fee uang" inputmode="numeric" value="${uangFormat(r.fee||0)}" oninput="uangKetik(this)" placeholder="ikut default talent"></td>
    </tr>`;}).join('')}
  </tbody></table></div>
  <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn" onclick="genMonthly()">Generate Bulan Ini</button></div>`,true);

/* Memilih talent mengisi fee-nya, TAPI hanya kalau kotaknya masih kosong —
   fee yang datang dari Daily Rules atau yang sudah diketik tangan tidak boleh
   ditimpa hanya karena talentnya diganti. */
function mgIsiFee(sel){
  const baris=sel.closest('tr'); if(!baris)return;
  const kotak=baris.querySelector('.mg_fee'); if(!kotak)return;
  const adaIsi=+String(kotak.value).replace(/\D/g,'')>0;
  if(!adaIsi && sel.selectedOptions[0]) kotak.value=uangFormat(sel.selectedOptions[0].dataset.fee||0);

function genMonthly(){

    const t=DB.talents.find(x=>x.id===tid); if(!t){ skipped++; continue; }

/* ================== PEMERIKSAAN BUKTI TRANSFER (OCR) ==================
   Mesinnya sama dengan yang dipakai modul Reservasi untuk memeriksa bukti DP:
   Tesseract.js dimuat dari CDN hanya saat dibutuhkan, gambar dipertajam dulu,
   lalu teksnya diurai. Yang dibawa ke sini cuma bagian yang memang dipakai EMS
   — nominal, bank, dan penilaian "ini bukti transfer atau bukan". Sengaja
   TIDAK memanggil kode modul sebelah: dua modul terpisah, dan menyeberangkan
   fungsi antar berkas hanya menghasilkan kaitan yang diam-diam putus. */
const OCR_SRC="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
let _ocrLoad=null,_ocrWorker=null;
function loadOCR(){
  if(window.Tesseract) return Promise.resolve(window.Tesseract);
  if(_ocrLoad) return _ocrLoad;
  _ocrLoad=new Promise(function(res,rej){
    const sc=document.createElement('script'); sc.src=OCR_SRC;
    // Batas waktu: koneksi lambat tidak boleh menggantung layar selamanya.
    const t=setTimeout(function(){ rej(new Error('Mesin OCR tidak bisa dimuat (koneksi lambat / offline).')); },45000);
    sc.onload=function(){ clearTimeout(t); window.Tesseract?res(window.Tesseract):rej(new Error('Mesin OCR gagal dimuat.')); };
    sc.onerror=function(){ clearTimeout(t); rej(new Error('Gagal memuat mesin OCR — pemeriksaan bukti butuh koneksi internet.')); };
    document.head.appendChild(sc);
  }).catch(function(e){ _ocrLoad=null; throw e; });
  return _ocrLoad;
}
async function getOcrWorker(){
  if(_ocrWorker) return _ocrWorker;
  const T=await loadOCR();
  _ocrWorker=await T.createWorker('eng');   // struk bank isinya angka + nama bank; model "eng" paling stabil
  return _ocrWorker;
}
/* Bukti transfer biasanya tangkapan layar kecil dan agak buram. Diperbesar lalu
   digelapkan dengan gamma — BUKAN contrast stretch di sekitar 128, yang justru
   memucatkan teks abu-abu (tanggal & jam di struk Livin/SeaBank ditulis abu
   muda) sampai hilang terbaca. */
function prepOcrImage(dataUrl){
  return new Promise(function(res){
    const img=new Image();
    img.onload=function(){
      const scale=Math.min(3,Math.max(1,1700/(img.width||1)));
      const w=Math.round(img.width*scale),h=Math.round(img.height*scale);
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      const x=c.getContext('2d'); x.drawImage(img,0,0,w,h);
      try{
        const d=x.getImageData(0,0,w,h),px=d.data;
        for(let i=0;i<px.length;i+=4){
          const g=(0.299*px[i]+0.587*px[i+1]+0.114*px[i+2])/255;
          const v=Math.round(255*Math.pow(g,1.6));
          px[i]=px[i+1]=px[i+2]=v<0?0:v>255?255:v;
        }
        x.putImageData(d,0,0);
        res(c.toDataURL('image/png'));
      }catch(e){ res(dataUrl); }     // canvas tainted / gagal → pakai aslinya
    };
    img.onerror=function(){ res(dataUrl); };
    img.src=dataUrl;
  });
}
async function ocrRead(dataUrl){
  const w=await getOcrWorker();
  const img=await prepOcrImage(dataUrl);
  const hasil=await w.recognize(img);
  return (hasil&&hasil.data&&hasil.data.text)||'';
}
const OCR_BANKS=[
  ['BCA',/\b(BCA|KLIKBCA|MY\s?BCA|BANK CENTRAL ASIA|BLU)\b/i],
  ['Mandiri',/\b(MANDIRI|LIVIN)\b/i],
  ['BRI',/\b(BRI|BRIMO|BANK RAKYAT)\b/i],
  ['BNI',/\b(BNI|BANK NEGARA)\b/i],
  ['BSI',/\b(BSI|BANK SYARIAH)\b/i],
  ['CIMB Niaga',/\b(CIMB|OCTO)\b/i],
  ['Permata',/\bPERMATA\b/i],['Danamon',/\bDANAMON\b/i],['BTN',/\bBTN\b/i],
  ['SeaBank',/\bSEA\s?BANK\b/i],['Bank Jago',/\bJAGO\b/i],['Maybank',/\bMAYBANK\b/i],
  ['OCBC',/\bOCBC\b/i],['Panin',/\bPANIN\b/i],['Bank Mega',/\bBANK\s?MEGA\b/i],
  ['Jenius/BTPN',/\b(JENIUS|BTPN)\b/i],['UOB',/\bUOB\b/i],['QRIS',/\bQRIS\b/i],
  ['DANA',/\bDANA\b/],['OVO',/\bOVO\b/i],['GoPay',/\b(GO-?PAY|GOJEK)\b/i],
  ['ShopeePay',/\bSHOPEE\s?PAY\b/i],['LinkAja',/\bLINK\s?AJA\b/i]
];
// "500.000,00" / "Rp 1,500,000" → 500000 / 1500000
function toNumberID(x){
  let v=String(x||'').replace(/\s/g,'');
  v=v.replace(/[.,]\d{2}$/,'');            // buang sen
  const d=v.replace(/[^0-9]/g,'');
  return d?Number(d):0;
}
/* Nominal yang dicari NOMINAL TRANSFER, bukan biaya admin atau sisa saldo —
   struk selalu memuat beberapa angka besar sekaligus. Baris yang menyebut
   biaya/saldo diberi nilai minus, dan label yang ditulis DI BARIS ATAS
   nilainya ("Nominal Transaksi" lalu "Rp 200.000") ikut dipinjam. */
function ocrAmount(t){
  const POS=/(nominal|jumlah|total|nilai|amount|transfer|dibayar|pembayaran|dikirim)/i;
  const NEG=/(biaya|admin|fee|saldo|sisa|limit|denda|pajak|potongan|cashback|po[il]n)/i;
  const RE=/(rp\.?\s*)?(\d{1,3}(?:[.,]\d{3})+(?:[.,]\d{2})?)|rp\.?\s*(\d{4,})/gi;
  const lines=String(t||'').split(/\r?\n/);
  let best=null;
  lines.forEach(function(line,i){
    let pos=POS.test(line),neg=NEG.test(line);
    if(!pos&&!neg){ const prev=lines[i-1]||''; pos=POS.test(prev); neg=NEG.test(prev); }
    const base=(pos?3:0)+(neg?-6:0);
    let m; RE.lastIndex=0;
    while((m=RE.exec(line))){
      const raw=m[2]||m[3]; if(!raw) continue;
      const val=toNumberID(raw);
      if(val<1000||val>2e9) continue;                 // nomor rekening / angka receh
      const score=base+((m[1]||m[3])?1:0);
      if(!best||score>best.score||(score===best.score&&val>best.val)) best={score:score,val:val};
    }
  });
  return best?best.val:0;
}
function ocrBank(t){
  const hay=String(t||'');
  for(let i=0;i<OCR_BANKS.length;i++) if(OCR_BANKS[i][1].test(hay)) return OCR_BANKS[i][0];
  return '';
}
/* APAKAH GAMBAR INI BUKTI TRANSFER? Dinilai dari beberapa penanda sekaligus,
   bukan satu kata kunci: struk mana pun boleh saja kebetulan memuat satu kata,
   tapi gambar yang bukan bukti transfer hampir tak pernah memuat nominal
   berformat rupiah SEKALIGUS kata kerja transaksi dan nama bank. Ambang 3
   dipilih supaya foto menu, poster, atau tangkapan layar chat tidak lolos. */
function buktiSkor(t){
  const txt=String(t||'');
  let skor=0; const alasan=[];
  const adaNominal=!!ocrAmount(txt);
  const adaKata=/(transfer|transaksi|berhasil|sukses|success|pembayaran|dibayar|terkirim)/i.test(txt);
  const bank=ocrBank(txt);
  const adaRek=/(rekening|no\.?\s?rek|va|virtual account|ref|referensi|nomor transaksi)/i.test(txt);
  if(adaNominal){ skor+=2; alasan.push('ada nominal berformat rupiah'); }
  if(adaKata){ skor+=1; alasan.push('ada kata transaksi'); }
  if(bank){ skor+=1; alasan.push('menyebut '+bank); }
  if(adaRek){ skor+=1; alasan.push('ada nomor rekening/referensi'); }
  if(/rp/i.test(txt)){ skor+=1; alasan.push('ada tanda Rp'); }
  /* Nominal saja TIDAK cukup. Poster acara, daftar menu, dan tangkapan layar
     katalog semuanya memuat "Rp 150.000" — kalau angka rupiah dianggap bukti,
     ketiganya lolos. Harus ada penanda transaksi yang sesungguhnya: kata kerja
     transaksi, nama bank/e-wallet, atau nomor rekening/referensi. */
  const bukti = adaNominal && (adaKata||!!bank||adaRek) && skor>=3;
  return {skor:skor, bukti:bukti, alasan:alasan};
}
function parseBuktiText(txt){
  const t=String(txt||'').replace(/\u00a0/g,' ');
  const nilai=buktiSkor(t);
  return {amount:ocrAmount(t),bank:ocrBank(t),skor:nilai.skor,bukti:nilai.bukti,alasan:nilai.alasan};
}
function bacaDataUrl(file){
  return new Promise(function(res,rej){
    const r=new FileReader();
    r.onload=function(){ res(String(r.result)); };
    r.onerror=function(){ rej(new Error('gagal membaca berkas')); };
    r.readAsDataURL(file);
  });
}
/* Memeriksa bukti yang baru diunggah. Hasilnya disimpan di pembayaran itu
   (proof_amount / proof_bank / proof_skor / proof_ocr_at) supaya tetap ada
   walau layarnya ditutup — dan supaya OCR tidak perlu diulang tiap membuka
   layar pembayaran. */
async function periksaBuktiOtomatis(pid,file){
  const p=DB.talentPayments.find(function(x){ return x.id===pid; }); if(!p) return;
  const box=document.getElementById('pay_cocok');
  if(!berkasGambar({name:(file&&file.name)||''})){
    if(box) box.innerHTML='<p class="mini">Bukti berupa PDF — tidak dibaca otomatis. Isi nominalnya sendiri.</p>';
    return;
  }
  if(box) box.innerHTML='<p class="mini">Membaca bukti… pertama kali agak lama karena mesin pembacanya diunduh dulu.</p>';
  try{
    const teks=await ocrRead(await bacaDataUrl(file));
    const h=parseBuktiText(teks);
    p.proof_bank=h.bank; p.proof_skor=h.skor; p.proof_bukti=h.bukti;
    p.proof_ocr_at=new Date().toISOString();
    /* Nominal hasil bacaan TIDAK menimpa yang sudah diketik tangan: koreksi
       manusia harus menang atas tebakan mesin. */
    if(h.amount && !(+p.proof_amount)) p.proof_amount=h.amount;
    save();
    const el=document.getElementById('pay_amt');
    if(el && p.proof_amount) el.value=uangFormat(p.proof_amount);
    if(box) box.innerHTML=buktiPeriksaHTML(p);
  }catch(e){
    if(box) box.innerHTML='<p class="mini" style="color:var(--red)">Pembacaan otomatis gagal: '+esc(e.message)
      +'. Isi nominalnya sendiri — pencocokan dengan tagihan tetap jalan.</p>';
  }
}
/* Memeriksa ulang bukti yang SUDAH tersimpan — berkasnya diambil kembali dari
   server. Dipakai kalau pemeriksaan pertama gagal (mesin OCR belum terunduh,
   koneksi putus) atau kalau nominalnya ingin dibaca ulang setelah dikoreksi
   tangan. Sama-sama satu asal dengan halaman ini, jadi canvas-nya tidak
   tainted dan gambarnya tetap bisa dipertajam sebelum dibaca. */
async function periksaUlangBukti(pid){
  const p=DB.talentPayments.find(function(x){ return x.id===pid; });
  if(!p||!p.transfer_proof||typeof p.transfer_proof==='string')
    return toast('Belum ada berkas bukti untuk diperiksa.');
  window._payPid=pid;
  const box=document.getElementById('pay_cocok');
  if(box) box.innerHTML='<p class="mini">Mengambil berkas bukti…</p>';
  try{
    const res=await fetch(fileUrl(p.transfer_proof.key));
    const blob=await res.blob();
    const file=new File([blob],p.transfer_proof.name||'bukti.jpg',{type:blob.type});
    await periksaBuktiOtomatis(pid,file);
  }catch(e){
    if(box) box.innerHTML='<p class="mini" style="color:var(--red)">Gagal mengambil berkas bukti: '+esc(e.message)+'</p>';
  }
}
/* Hasil pemeriksaan bukti transfer. Nominal yang TERBACA di bukti disimpan
   di p.proof_amount, lalu dibandingkan dengan tagihan. Selisih sekecil apa pun
   ditandai merah: bukti yang nominalnya beda dari tagihan adalah pertanda
   transfer salah jumlah atau bukti milik pembayaran lain — dua hal yang paling
   sering baru ketahuan berbulan-bulan kemudian saat rekonsiliasi. */
function buktiPeriksaHTML(p){
  if(!p||!p.transfer_proof) return '';
  let awal='';
  if(p.proof_ocr_at){
    awal=p.proof_bukti
      ? '<p class="mini" style="color:var(--green)"><b>✓ Terbaca sebagai bukti transfer</b>'
        +(p.proof_bank?' · '+esc(p.proof_bank):'')+'</p>'
      : '<p class="mini" style="color:var(--red)"><b>⚠ Gambar ini tidak terbaca sebagai bukti transfer.</b> '
        +'Periksa sendiri sebelum melanjutkan — bisa jadi salah gambar, atau tulisannya terlalu buram untuk dibaca mesin.</p>';
  }
  const terbaca=+p.proof_amount||0;
  if(!terbaca) return awal+'<p class="mini">Nominal pada bukti belum dicatat — isi di layar Proses Pembayaran supaya bisa dicocokkan otomatis dengan tagihan.</p>';
  return awal+buktiCocokHTML(p,terbaca);
}
function buktiCocokHTML(p,terbaca){
  const selisih=terbaca-(+p.total_amount||0);
  return selisih===0
    ? '<p class="mini" style="color:var(--green)"><b>✓ Nominal cocok</b> — bukti tertulis '+IDR(terbaca)+', sama dengan tagihan.</p>'
    : '<p class="mini" style="color:var(--red)"><b>⚠ Nominal TIDAK cocok</b> — bukti tertulis '+IDR(terbaca)+', tagihan '+IDR(p.total_amount)+' (selisih '+(selisih>0?'+':'')+IDR(selisih)+'). Periksa dulu sebelum menandai lunas.</p>';
}
function pilihBuktiTransfer(pid){
  pilihBerkas((f,asli)=>{
    const p=DB.talentPayments.find(x=>x.id===pid);
    // Hasil pemeriksaan lama ikut dibuang: buktinya sudah berganti.
    p.transfer_proof=f; p.proof_bank=''; p.proof_skor=0; p.proof_bukti=false; p.proof_ocr_at='';
    save();

    if(box) box.innerHTML=buktiHTML(f);

}

const EVT_CATS=['Free','Paid','Internal','Community','Corporate','Wedding','Festival','Music','Launching','Private'];
const TIMELINE_PHASES=['Preparation','Marketing','Vendor','Talent','Decoration','Opening','Closing','Evaluation'];
let evtFilter='all';
const EVT_STATUS=['Draft','Upcoming','Today','Finished','Cancelled'];
/* Status diubah langsung dari dropdown di kartu, tidak perlu masuk ke detail
   lalu menekan "Ubah Status" berkali-kali sampai sampai ke status yang mau. */
function setEventStatus(id,st){
  const e=DB.events.find(x=>x.id===id); if(!e)return;
  const lama=e.status; e.status=st;
  /* Jejak "status ini dipilih manusia, jam sekian". Dipakai autoSelesaikanEvent
     untuk tahu mana status yang boleh ia rapikan dan mana yang tidak. */
  e.statusAt=Date.now();
  save(); renderEvents();
  toast('Status '+e.title+': '+lama+' → '+st+(st==='Finished'?' (data event terkunci)':''));
}
/* Event yang tanggalnya sudah lewat tapi masih "Upcoming"/"Today" dinaikkan
   sendiri jadi Finished — dulu harus diubah manual satu per satu, dan yang
   terlupakan menumpuk di daftar Upcoming seolah masih akan datang.
   Draft & Cancelled TIDAK ikut: draft belum tentu jadi, cancelled memang
   sudah selesai urusannya. */
function autoSelesaikanEvent(){
  const skrg=Date.now(); let ubah=0;
  DB.events.forEach(e=>{
    if(!['Upcoming','Today'].includes(e.status))return;
    const selesai=new Date(e.end_datetime||e.start_datetime).getTime();
    if(!selesai||isNaN(selesai))return;
    /* PILIHAN MANUSIA MENANG ATAS PERAPIAN OTOMATIS.
       setEventStatus() menyimpan lalu memanggil renderEvents(), dan renderEvents()
       menjalankan fungsi ini sebagai baris pertamanya. Tanpa penjaga di bawah,
       memilih "Upcoming" pada event yang tanggalnya sudah lewat diputar balik
       jadi "Finished" dalam hitungan milidetik — statusnya seolah menolak
       diubah, dan tidak ada apa pun di layar yang menjelaskan kenapa.
       (Terasa saat memasang situs customer: hanya event Upcoming/Today yang
       dijual, jadi event lampau mustahil dibuka untuk penjualan.)

       Yang dirapikan sekarang hanya event yang TIDAK disentuh orang sejak ia
       berakhir — itu memang maksud aslinya: menyapu yang terlupakan, bukan
       membatalkan keputusan yang baru saja diambil. */
    if(e.statusAt && e.statusAt > selesai) return;
    if(selesai<skrg){ e.status='Finished'; ubah++; }
  });
  if(ubah){ save(); toast(ubah+' event yang tanggalnya sudah lewat dipindah ke Finished.'); }
  return ubah;
}
function renderEvents(){
  autoSelesaikanEvent();
  setTop('Event Management','Kelola event dari draft hingga selesai','<button class="btn" onclick="eventForm()">+ Event Baru</button>');
  const filters=['all','Upcoming','Today','Finished','Cancelled','Draft'];
  let list=DB.events.filter(e=>evtFilter==='all'||e.status===evtFilter);
  C().innerHTML=`
  <div class="tabs">${filters.map(f=>`<button class="${evtFilter===f?'active':''}" onclick="evtFilter='${f}';renderEvents()">${f==='all'?'Semua':f}</button>`).join('')}</div>
  <div class="grid g3">
  ${list.map(e=>{const sold=DB.ticketClasses.filter(c=>c.event_id===e.id).reduce((a,c)=>a+c.sold,0);const rev=DB.orders.filter(o=>o.event_id===e.id&&o.payment_status==='Paid').reduce((a,o)=>a+o.total,0);return `<div class="ecard" onclick="location.hash='#/events/${e.id}'">
    <div class="cover">${posterCoverHTML(e)}
      <span class="cat">${esc(e.category||'')}</span>
      <button class="card-edit" title="Edit event" onclick="event.stopPropagation();eventForm('${e.id}')">✎</button>
    </div>
    <div class="body"><div class="t">${esc(e.title)}</div>
    <div class="meta">📅 ${fmtDateTime(e.start_datetime)}</div>
    <div class="meta">📍 ${esc(e.venue)}</div>
    <div class="meta">👤 ${esc(e.pic)}</div>
    ${e.is_ticketed?`<div class="meta" style="margin-top:6px;color:var(--accent)">🎟️ ${sold} tiket · ${IDR(rev)}</div>`:'<div class="meta" style="margin-top:6px"><span class="pill">Non-ticketed</span></div>'}
    <select class="card-status st-${e.status}" onclick="event.stopPropagation()" onchange="setEventStatus('${e.id}',this.value)">
      ${EVT_STATUS.map(s=>`<option ${e.status===s?'selected':''}>${s}</option>`).join('')}
    </select>
    </div></div>`;}).join('')||'<div class="empty">Tidak ada event.</div>'}
  </div>`;
}

function saveEvent(id){
  const g=x=>document.getElementById(x).value;
  const title=g('e_title').trim();if(!title){toast('Judul wajib.');return;}
  // Tanggal wajib: event tanpa tanggal tidak bisa masuk kalender, tidak bisa
  // dinilai upcoming/selesai, dan dulu diam-diam diisi "sekarang".
  if(!g('e_start')){toast('Tanggal & jam mulai wajib diisi.');return;}
  if(g('e_end') && g('e_end')<g('e_start')){toast('⛔ Waktu selesai tidak boleh sebelum waktu mulai.');return;}
  const data={title,poster:g('e_poster')||'🎪',category:g('e_cat'),theme:g('e_theme'),venue:g('e_venue'),capacity:+g('e_cap'),start_datetime:g('e_start')?new Date(g('e_start')).toISOString():new Date().toISOString(),end_datetime:g('e_end')?new Date(g('e_end')).toISOString():new Date().toISOString(),pic:g('e_pic'),co_pic:g('e_copic'),description:'<p>'+esc(g('e_desc'))+'</p>',is_ticketed:document.getElementById('e_tix').checked};
  // Poster hanya disentuh kalau memang diubah di form ini — supaya menyimpan
  // event tanpa membuka pemilih gambar tidak menghapus poster yang sudah ada.
  if(window._posterBaru)      data.poster_img=window._posterBaru;
  else if(window._posterHapus) data.poster_img=null;
  if(id){Object.assign(DB.events.find(x=>x.id===id),data);}
  else{const nid=uid();data.status='Draft';data.idea_id=window._dariIde||null;window._dariIde=null;DB.events.push({id:nid,...data});
    // default timeline & tasks from template
    DB.eventDetails[nid]={timeline:Object.fromEntries(TIMELINE_PHASES.map(p=>[p,false])),rundown:[],vendors:[],budget:[],sponsors:[],tasks:[{title:'Design poster',assignee:'Marketing',due:data.start_datetime,done:false},{title:'Book talent',assignee:'Ent. Coord',due:data.start_datetime,done:false}]};
    id=nid;}
  save();closeModal();toast('✓ Event tersimpan dengan timeline & task default.');location.hash='#/events/'+id;
}

function setEventStatusDetail(id,st){
  const e=DB.events.find(x=>x.id===id); if(!e)return;
  const lama=e.status; e.status=st; save(); renderEventDetail(id);
  toast('Status: '+lama+' → '+st+(st==='Finished'?' — data terkunci & masuk History.':''));
}
function cycleEventStatus(id){const order=['Draft','Upcoming','Today','Finished'];const e=DB.events.find(x=>x.id===id);const i=order.indexOf(e.status);if(e.status==='Cancelled'){e.status='Draft';}else if(i>=order.length-1){e.status='Cancelled';}else{e.status=order[i+1];}save();if(e.status==='Finished')toast('Event Finished → data terkunci & masuk History.');renderEventDetail(id);}
function toggleTimeline(id,p){DB.eventDetails[id].timeline[p]=!DB.eventDetails[id].timeline[p];save();}
function toggleTask(id,i){DB.eventDetails[id].tasks[i].done=!DB.eventDetails[id].tasks[i].done;save();renderEventDetail(id);}
/* Rundown, Vendor & Task dulu diisi lewat prompt() beruntun — kotak abu-abu
   browser, tanpa validasi, tidak bisa mundur, dan hilang semua kalau salah
   satu di-Cancel. Sekarang barisnya diedit langsung di tabel: tekan tambah,
   baris kosong muncul, isi di tempat, lalu Simpan. */
function ambilBaris(wrapId,kolom){
  const wrap=document.getElementById(wrapId); if(!wrap)return [];
  return [...wrap.querySelectorAll('tbody tr')].map(tr=>{
    const o={};
    kolom.forEach(k=>{
      const el=tr.querySelector('[data-r="'+k+'"]');
      if(!el){ o[k]=''; return; }
      if(el.type==='checkbox') o[k]=el.checked;
      // Kotak uang menyimpan "1.500.000" di layar; yang dibaca kode angkanya.
      else if(el.classList.contains('uang')) o[k]=+String(el.value).replace(/\D/g,'')||0;
      else o[k]=el.value.trim();
    });
    return o;
  });
}
function barisTambah(wrapId,html){
  const b=document.querySelector('#'+wrapId+' tbody'); if(!b)return;
  const tmp=document.createElement('tbody'); tmp.innerHTML=html;
  b.appendChild(tmp.firstElementChild);
  const inp=b.lastElementChild.querySelector('input,select'); if(inp)inp.focus();
}
function barisHapus(btn){
  const b=btn.closest('tbody'); btn.closest('tr').remove();
  if(!b.querySelector('tr')) b.innerHTML='<tr class="kosong"><td colspan="9" class="empty">Belum ada baris — tekan Tambah.</td></tr>';
}
function bersihkanKosong(wrapId){ const k=document.querySelector('#'+wrapId+' tr.kosong'); if(k)k.remove(); }

function renderTicketing(id){

  const evs=DB.events.filter(e=>e.is_ticketed);
  C().innerHTML=`<div class="grid g2">${evs.map(e=>{const cls=DB.ticketClasses.filter(c=>c.event_id===e.id);const sold=cls.reduce((a,c)=>a+c.sold,0);const quota=cls.reduce((a,c)=>a+c.quota,0);const rev=DB.orders.filter(o=>o.event_id===e.id&&o.payment_status==='Paid').reduce((a,o)=>a+o.total,0);const pct=quota?Math.round(sold/quota*100):0;return `<div class="ecard" onclick="location.hash='#/ticketing/${e.id}'"><div class="body">
    <div style="display:flex;justify-content:space-between"><div class="t">${posterKecilHTML(e,22)} ${esc(e.title)}</div>${statusBadge(e.status)}</div>
    <div class="meta">📅 ${fmtDate(e.start_datetime)} · 📍 ${esc(e.venue)}</div>
    <div style="margin-top:10px;display:flex;justify-content:space-between"><span>${sold}/${quota} tiket (${pct}%)</span><b style="color:var(--accent)">${IDR(rev)}</b></div>
    <div class="progress"><div style="width:${pct}%"></div></div>
    ${pct>=90?'<div class="mini" style="color:var(--red);margin-top:6px">⚠ Tiket hampir habis!</div>':''}
  </div></div>`;}).join('')||'<div class="empty">Belum ada event ticketed.</div>'}</div>`;

      <td style="white-space:nowrap"><button class="btn ghost sm" title="Ubah" onclick="ticketClassForm('${id}','${c.id}')">✎</button>
      <button class="btn ghost sm" title="Hapus" onclick="delTicketClass('${id}','${c.id}')">×</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">Belum ada ticket class.</td></tr>'}

/* ---- PENJUALAN & REFUND (satu halaman) ----
   Dibuka dengan ringkasan uang: tiap kategori berapa tiket dan berapa
   rupiahnya, plus total omzet bersih setelah refund. Angka itu yang paling
   sering ditanyakan dan dulu harus dihitung tangan dari daftar pembeli. */
function salesRingkas(eid){
  const orders=DB.orders.filter(o=>o.event_id===eid);
  const per={};
  let omzet=0, dikembalikan=0, tiketSah=0;
  orders.forEach(function(o){
    const tks=DB.tickets.filter(t=>t.order_item_id===o.id);
    const refund=(o.payment_status==='Refunded');
    tks.forEach(function(t){
      const c=DB.ticketClasses.find(x=>x.id===t.ticket_class_id);
      const nama=c?c.name:'(tanpa kelas)';
      const harga=c?(+c.price||0):0;
      per[nama]=per[nama]||{n:0,rp:0,warna:ldzTierInfo(eid,nama).c};
      if(refund){ dikembalikan+=harga; return; }
      per[nama].n++; per[nama].rp+=harga; omzet+=harga; tiketSah++;
    });
  });
  return {per:per, omzet:omzet, dikembalikan:dikembalikan, tiketSah:tiketSah, orders:orders};
}
function salesGrafikHTML(r){
  const nama=Object.keys(r.per);
  if(!nama.length) return '';
  const maks=Math.max.apply(null,nama.map(function(k){ return r.per[k].rp; }))||1;
  return '<div class="card" style="margin-bottom:16px"><h3 class="sec">Penjualan per Kategori</h3>'
   +nama.map(function(k){
      const v=r.per[k], w=Math.round(v.rp/maks*100);
      return '<div style="margin-bottom:10px">'
       +'<div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px">'
         +'<span><span class="ldz-tier"><i style="background:'+v.warna+'"></i>'+esc(k)+'</span></span>'
         +'<span class="mini"><b>'+v.n+' tiket</b> \u00b7 '+IDR(v.rp)+'</span></div>'
       +'<div class="salesbar"><i style="width:'+w+'%;background:'+v.warna+'"></i></div></div>';
   }).join('')
   +'</div>';
}

    const kursi=tks.map(function(t){ const st=t.seat_id?DB.seats.find(x=>x.id===t.seat_id):null; return st?(st.table_no||st.seat_no):null; }).filter(Boolean);
    const masuk=tks.filter(function(t){ return t.status==='Checked-In'; }).length;
    const rfCell = !rf ? '<span class="mini">\u2014</span>'
      : rf.status==='Pending'  ? '<span class="badge b-yellow">On process</span>'
      : rf.status==='Approved' ? '<span class="badge b-green">Refunded</span>'
      : '<span class="badge b-grey">Ditolak</span>';
    const bisaAjukan = tks.length && !refundAktif(o.id) && o.payment_status!=='Refunded';
    h+='<tr><td><b>'+esc(o.buyer_name)+'</b><div class="mini">'+fmtDateTime(o.created)
     +(o.recorded_by?' · oleh '+esc(o.recorded_by):'')+'</div>'
     +'<div class="mini">'+esc(o.payment_ref||'')+'</div></td>'
     +'<td class="mini">'+esc(o.phone)+'<br>'+esc(o.email)+'</td>'
     +'<td>'+(cls?esc(cls.name):'-')+(tks.length>1?' <span class="badge b-blue">'+tks.length+' tiket</span>':'')+'</td>'
     +'<td class="mini">'+(kursi.length?esc(kursi.join(', ')):'\u2014')+'</td>'

     +'<td>'+rfCell+(rf&&rf.status==='Pending'?' <button class="btn sm" onclick="approveRefund(\''+rf.id+'\')">Setujui</button> <button class="btn danger sm" onclick="rejectRefund(\''+rf.id+'\')">Tolak</button>':'')+'</td>'
     +'<td class="mini">'+(masuk?masuk+' / '+tks.length:'\u2014')+'</td>'

        +(bisaAjukan?' <button class="btn ghost sm" onclick="requestRefund(\''+o.id+'\')">Refund</button>':''):'')+'</td></tr>';
  });
  h+='</tbody></table></div>';
  if(halMax>1){
    h+='<div class="pager">'
     +'<button class="btn ghost sm" '+(_salesHal<=1?'disabled':'')+' onclick="_salesHal--;renderTicketDetail(\''+eid+'\')">\u2039 Sebelumnya</button>'

     +'<button class="btn ghost sm" '+(_salesHal>=halMax?'disabled':'')+' onclick="_salesHal++;renderTicketDetail(\''+eid+'\')">Berikutnya \u203a</button>'
     +'</div>';
  }
  h+='</div>';
  return h;

/* ============================================================
   DENAH KURSI — TEMPLATE LAKSAMANA MUDA (Reguler+ bernomor 1–83)
   ------------------------------------------------------------
   Reguler+ = 83 kursi bernomor MENGELILINGI lantai (poster): kolom kiri 1–23,
   depan panggung 24–60, kolom kanan 61–83. Bisa diklik untuk menandai status.
   Reguler = zona (kapasitas, tanpa nomor) — sesuai poster hanya Reguler+ yang
   dinomori. Reguler ada di lantai 2 (pojok) & seluruh lantai 1.
   ============================================================ */
function seatSisi(n){ return n<=23?'Kiri':(n<=60?'Depan':'Kanan'); }
function buatDenahLM(eid){
  const e=DB.events.find(x=>x.id===eid); if(!e) return;
  if(DB.seats.some(s=>s.event_id===eid && s.zone==='Reguler+')){ toast('Denah Reguler+ sudah ada.'); return; }
  // pastikan ada ticket class untuk tiap zona (dipakai kuota & penjualan)
  let clsPlus=DB.ticketClasses.find(c=>c.event_id===eid && c.name==='Reguler+');
  if(!clsPlus){ clsPlus={id:uid(),event_id:eid,name:'Reguler+',price:0,quota:83,sold:0,sale_start:e.start_datetime,sale_end:e.start_datetime,description:'Kursi bernomor',benefit:'Kursi bernomor 1–83',is_seated:true}; DB.ticketClasses.push(clsPlus); }
  if(!DB.ticketClasses.some(c=>c.event_id===eid && c.name==='Reguler')){
    const sisa=Math.max(0,(+e.capacity||0)-83);
    DB.ticketClasses.push({id:uid(),event_id:eid,name:'Reguler',price:0,quota:sisa||100,sold:0,sale_start:e.start_datetime,sale_end:e.start_datetime,description:'Zona reguler (tanpa nomor)',benefit:'Area reguler',is_seated:false});
  }
  for(let n=1;n<=83;n++){ DB.seats.push({id:uid(),event_id:eid,ticket_class_id:clsPlus.id,zone:'Reguler+',table_no:String(n),seat_no:n,capacity:1,x:0,y:0,status:'Available'}); }
  save(); toast('✓ Denah Laksamana Muda dibuat — 83 kursi Reguler+.'); renderTicketDetail(eid);
}
/* Klik kursi = putar status manual (Available → Locked → Sold → Available).
   Kursi yang SUDAH terjual lewat pembelian (punya tiket) tidak boleh dilepas
   dari sini — itu memutus tiket pembeli; lepasnya lewat Refund. */
/* ---- MODE PILIH KURSI (dipakai layar Catat Penjualan) ----
   Denah yang sama dipakai dua keperluan: mengelola status kursi (Ticketing)
   dan memilih kursi yang dibeli. Yang membedakan cuma window._beliMode, jadi
   tidak ada denah kedua yang harus ikut dirawat. */
function beliSel(){ if(!Array.isArray(window._beliSelIds)) window._beliSelIds=[]; return window._beliSelIds; }
function beliSetSel(ids){ window._beliSelIds=(ids||[]).slice(); }
function beliBisaDipilih(s){
  if(!s) return false;
  if(ldzAdalahArea(s)) return false;      // panggung & zona bukan tempat duduk
  const tk=DB.tickets.find(t=>t.seat_id===s.id && t.status!=='Cancelled');
  return !tk && s.status!=='Sold';        // Locked (hold) masih boleh dijual
}
function beliToggleSeat(eid,sid){
  const s=DB.seats.find(x=>x.id===sid); if(!s) return;
  if(!beliBisaDipilih(s)){ toast('Kursi '+(s.table_no||s.seat_no)+' sudah terjual.'); return; }
  const sel=beliSel(), i=sel.indexOf(sid);
  if(i>=0) sel.splice(i,1); else sel.push(sid);
  beliSetSel(sel);
  /* Dua tempat memakai pemilih kursi yang sama: modal Catat Penjualan dan tab
     Layout. Yang mana pun yang sedang terbuka, itu yang digambar ulang. */
  if(document.getElementById('pf_denah')){ pfGambarDenah(eid); pfRingkas(eid); }
  else if(ldzJualAktif()) renderTicketDetail(eid);
}
function toggleSeat(eid,sid){
  const s=DB.seats.find(x=>x.id===sid); if(!s) return;
  const tk=DB.tickets.find(t=>t.seat_id===sid && t.status!=='Cancelled');
  if(tk){ const o=DB.orders.find(x=>x.id===tk.order_item_id); toast('Kursi '+s.table_no+' terjual ke '+((o&&o.buyer_name)||'pembeli')+'. Lepas lewat Refund, bukan dari denah.'); return; }
  s.status = s.status==='Available'?'Locked':(s.status==='Locked'?'Sold':'Available');
  save(); renderTicketDetail(eid);
}
function regulerAdj(eid,delta){
  const c=DB.ticketClasses.find(x=>x.event_id===eid && x.name==='Reguler'); if(!c) return;
  c.sold=Math.max(0,Math.min(c.quota,(+c.sold||0)+delta));
  save(); renderTicketDetail(eid);
}
function seatCls(s){
  const tk=DB.tickets.find(t=>t.seat_id===s.id && t.status!=='Cancelled');
  if(tk && tk.status==='Checked-In') return 'checked';
  if(s.status==='Sold'||tk) return 'sold';
  if(s.status==='Locked') return 'locked';
  return 'available';
}

function seatBox(s){
  const cls=seatCls(s), ro=(cls==='sold'||cls==='checked')?1:0;
  const lbl=s.seat_no||s.table_no;   // Lantai 1: table_no=nama meja, yang ditampilkan nomornya (seat_no)
  const meja=(s.zone==='Lantai 1'&&s.table_no)?(' · Meja '+s.table_no):'';
  // Mode read-only (window._denahRO): dipakai Live Occupancy di Check-In — denah
  // hanya untuk MELIHAT status kedatangan, bukan mengubah status kursi. Tanpa
  // onclick supaya tak sengaja memutar status di tengah acara.
  if(window._denahRO){
    const tampil=cls==='checked'?'sudah datang':cls==='sold'?'belum datang':cls==='locked'?'hold':'kosong';
    return '<div class="seat '+cls+' ro" title="Kursi '+lbl+meja+' — '+tampil+'">'+lbl+'</div>';
  }
  if(window._beliMode){
    const pilih=beliSel().indexOf(s.id)>=0;

  }
  return '<div class="seat '+cls+'" data-ro="'+ro+'" title="Kursi '+lbl+meja+' — '+s.status+'" onclick="toggleSeat(\''+s.event_id+'\',\''+s.id+'\')">'+lbl+'</div>';
}

/* ============================================================
   LAYOUT DESIGNER — denah kustom bergaya draw.io
   ------------------------------------------------------------
   Denah template (Reguler+ / Lantai 1) tata letaknya dikunci di kode. Ini
   kebalikannya: tim event menyusun sendiri denah tiap acara — taruh kursi atau
   meja, geser, ubah ukurannya, beri tingkat tiket.

   Objeknya SENGAJA disimpan di DB.seats (zone='Custom') dan bukan koleksi baru:
   kolom `data` di tabel seats menyimpan seluruh baris sebagai JSON, jadi field
   tambahan (x/y/w/h/shape/kind/tier) ikut tersimpan tanpa ubah skema — dan yang
   lebih penting, penjualan tiket, e-ticket, refund serta Check-In langsung
   bekerja di atas denah kustom ini karena semuanya sudah berbicara ke seats.

   Gambar denah manual (hasil desain di luar sistem) dipasang sebagai LATAR
   kanvas; objek tinggal ditaruh menimpanya lalu disesuaikan posisinya.
   Meta kanvas (latar, ukuran, grid) ada di DB.eventDetails[eid].layout.

   Yang membuatnya terasa seperti draw.io, dan alasannya:
   - PILIHAN JAMAK. Seret di area kosong = kotak seleksi (marquee); semua yang
     tersentuh ikut terpilih dan bergerak bersama. Shift+klik menambah/melepas
     satu objek, Ctrl+A memilih semua. Menata 60 kursi satu per satu bukan
     pekerjaan yang masuk akal.
   - 8 PEGANGAN UKURAN di sekeliling kotak pilihan, bukan satu titik di pojok.
     Untuk pilihan jamak, seluruh kelompok diskalakan proporsional. Shift
     menjaga rasio.
   - ZOOM & PAN. Objek 40px sulit ditata pada denah 1200px; sekarang bisa
     diperbesar. Semua hitungan pointer dibagi zoom.
   - PALET BENTUK yang ditarik ke kanvas, plus perataan (align) & distribusi
     yang jadi alasan orang memakai draw.io untuk denah kursi.
   ============================================================ */
const LDZ_TIERS={
  Regular:{c:'#2f7fc4'},   // biru  — kelas dasar
  Silver :{c:'#8d97a3'},   // perak
  Gold   :{c:'#e0b23c'},   // kuning
  VIP    :{c:'#c9432b'}    // merah
};
const LDZ_TIER_NAMES=Object.keys(LDZ_TIERS);
/* ---- TINGKATAN DENAH = KELAS TIKET EVENT ITU ----
   Dulu tingkatannya dipatok empat nama (Regular/Silver/Gold/VIP) untuk SEMUA
   event. Akibatnya event yang menjual "Early Bird" dan "Festival" tetap harus
   memilih dari empat nama asing itu, lalu ldzTierClass() diam-diam membuat
   kelas tiket baru bernama "Silver" yang tidak pernah dijual siapa pun — dua
   daftar kelas untuk satu event, dan rangkuman denahnya tidak pernah cocok
   dengan kenyataan penjualan.

   Sekarang arahnya dibalik: kelas tiket yang didefinisikan di event ITU yang
   jadi daftar tingkatan. Warnanya dibagikan dari palet berdasarkan urutan
   kelas, jadi tetap konsisten selama urutannya tidak berubah, dan bisa dipatok
   sendiri lewat c.color kalau suatu saat kelas tiket punya kolom warna.
   Event yang belum punya satu kelas pun tetap memakai empat bawaan lama,
   supaya denah bisa mulai digambar sebelum harga tiketnya ditentukan. */
const LDZ_WARNA=['#2f7fc4','#c9432b','#e0b23c','#1F9D5F','#7C5FC0','#8d97a3','#d9573c','#2a9d8f'];
function ldzTiers(eid){
  const kelas=DB.ticketClasses.filter(c=>c.event_id===eid);
  if(!kelas.length) return LDZ_TIERS;
  const out={};
  kelas.forEach(function(c,i){
    out[c.name]={c:c.color||LDZ_WARNA[i%LDZ_WARNA.length],price:+c.price||0,quota:+c.quota||0,id:c.id};
  });
  return out;
}
function ldzTierNames(eid){ return Object.keys(ldzTiers(eid)); }
// Tingkatan yang sedang dipilih di palet, dijamin ada di event ini.
function ldzTierAktif(eid){
  const nama=ldzTierNames(eid);
  return (nama.indexOf(window._ldzTier)>=0)?window._ldzTier:(nama[0]||'Regular');
}
// Kelas tiket yang mewakili tingkatan aktif (null kalau event belum punya kelas).
function ldzKelasAktif(eid){
  const n=ldzTierAktif(eid);
  return DB.ticketClasses.find(function(c){ return c.event_id===eid && c.name===n; })||null;
}
// input type=color hanya menerima #rrggbb; warna palet bisa berupa rgb(...).
function ldzHexWarna(w){
  const t=String(w||'');
  if(/^#[0-9a-f]{6}$/i.test(t)) return t;
  const m=t.match(/(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/);
  if(!m) return '#2f7fc4';
  return '#'+[m[1],m[2],m[3]].map(function(v){ return ('0'+(+v).toString(16)).slice(-2); }).join('');
}
function ldzSetWarnaKelas(eid,nama,warna){
  const c=DB.ticketClasses.find(function(x){ return x.event_id===eid && x.name===nama; });
  if(!c) return toast('Kategori ini belum punya kelas tiket.');
  ldzRekam(eid);
  c.color=warna;
  save();
  if(document.querySelector('.tabs')) renderTicketDetail(eid); else ldzRepaint(eid);
  toast('✓ Warna kategori '+nama+' diubah.');
}
function ldzTierInfo(eid,tier){
  const T=ldzTiers(eid);
  return T[tier]||T[Object.keys(T)[0]]||{c:'#8d97a3',price:0,quota:0};
}
const LDZ_MIN=16;                       // sisi terkecil sebuah objek (px kanvas)
function ldzHexA(hex,a){ const n=parseInt(hex.slice(1),16); return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')'; }
/* Versi lebih gelap dari warna tier, untuk garis tepi & objek terjual. Dengan
   isian solid, tepi harus lebih gelap dari isinya — kalau warnanya sama,
   objek yang berdempetan terbaca sebagai satu blok besar. */
function ldzGelap(hex,f){
  const n=parseInt(hex.slice(1),16), k=(f==null?0.72:f);
  const g=v=>Math.round(v*k);
  return 'rgb('+g((n>>16)&255)+','+g((n>>8)&255)+','+g(n&255)+')';
}
// Versi lebih muda: warna dicampur putih sebanyak f.
function ldzMuda(hex,f){
  const n=parseInt(hex.slice(1),16);
  const c=v=>Math.round(v+(255-v)*f);
  return 'rgb('+c((n>>16)&255)+','+c((n>>8)&255)+','+c(n&255)+')';
}
/* ---- WARNA SATU OBJEK: kategori menentukan RONA, jenis menentukan KEPEKATAN ----
   Kursi dan meja sebelumnya berwarna sama persis — yang membedakan cuma bentuk,
   dan pada denah padat berisi ratusan objek kecil, bentuk saja tidak terbaca
   sekilas. Sekarang KURSI memakai warna kategori penuh (pekat, tulisan putih),
   MEJA memakai versi mudanya dengan tulisan gelap. Ronanya tetap sama, jadi
   kategori tiket tetap terbaca dari warna; yang berubah cuma kepekatannya.

   Objek yang sudah TERJUAL selalu digelapkan, apa pun jenisnya — status uang
   lebih penting daripada perbedaan meja/kursi saat denah dipakai check-in. */
function ldzWarnaObjek(it,warnaTier,terisi){
  const meja=(it&&it.kind==='table');
  if(terisi){
    const dasar=meja?ldzGelap(warnaTier,0.85):ldzGelap(warnaTier);
    return {bg:dasar, tepi:ldzGelap(warnaTier,0.55), teks:'#fff'};
  }
  return meja
    ? {bg:ldzMuda(warnaTier,0.55), tepi:warnaTier,               teks:ldzGelap(warnaTier,0.55)}
    : {bg:warnaTier,               tepi:ldzGelap(warnaTier),     teks:'#fff'};
}
function ldzMeta(eid){
  const d=ensureDetails(eid);
  if(!d.layout||typeof d.layout!=='object'||Array.isArray(d.layout)) d.layout={};
  /* Tiap lantai punya ukuran kanvas & gambar latarnya sendiri — lantai 2 di
     venue ini bentuknya jauh berbeda dari lantai 1. Setelan lantai 1 tetap
     disimpan di akar objek supaya denah lama terbaca apa adanya. */
  if(ldzLantai()==='2'){
    if(!d.layout.f2||typeof d.layout.f2!=='object'||Array.isArray(d.layout.f2)) d.layout.f2={};
    const L2=d.layout.f2;
    L2.w=+L2.w||1200; L2.h=+L2.h||760;
    if(L2.bgOpacity==null) L2.bgOpacity=70;
    if(L2.grid==null) L2.grid=true;
    if(L2.snap==null) L2.snap=true;
    if(!L2.bg) L2.bg=null;
    return L2;
  }
  const L=d.layout;
  L.w=+L.w||1200; L.h=+L.h||760;
  if(L.bgOpacity==null) L.bgOpacity=70;
  if(L.grid==null) L.grid=true;
  if(L.snap==null) L.snap=true;
  if(!L.bg) L.bg=null;
  return L;
}
/* ================= RIWAYAT (UNDO / REDO) =================
   Perancang denah ini sudah punya hampir semua kebiasaan draw.io — seret untuk
   memblok, panah untuk menggeser, Ctrl+A/D, Delete — tapi satu yang paling
   menentukan rasa "aman bereksperimen" belum ada: MEMBATALKAN. Tanpa itu, satu
   Delete yang salah sasaran pada 80 kursi hasil kerja setengah jam tidak bisa
   dikembalikan sama sekali, dan orang jadi enggan mencoba apa pun.

   Caranya sengaja potret utuh, bukan catatan per perubahan: objek denah satu
   event paling banter ratusan baris JSON, jadi menyimpan 60 potret jauh lebih
   murah daripada risiko salah membalik satu operasi. Potret diambil SEBELUM
   perubahan (ldzRekam), jadi Undo mengembalikan keadaan tepat sebelum tindakan
   terakhir. */
let _ldzUndo=[], _ldzRedo=[], _ldzPotretTunda=null;
// Mendaftarkan potret yang sudah diambil lebih dulu (dipakai jalur seret).
function ldzRekamPotret(eid,data){
  if(!data) return;
  _ldzUndo.push({eid:eid,data:data});
  if(_ldzUndo.length>60) _ldzUndo.shift();
  _ldzRedo.length=0;
  ldzTombolRiwayat();
}
function ldzPotret(eid){
  return JSON.stringify({items:ldzItems(eid), L:ldzMeta(eid)});
}
function ldzRekam(eid){
  _ldzUndo.push({eid:eid,data:ldzPotret(eid)});
  if(_ldzUndo.length>60) _ldzUndo.shift();
  _ldzRedo.length=0;              // cabang baru: rekaman "maju" yang lama tak berlaku lagi
  ldzTombolRiwayat();
}
function ldzPulihkan(eid,data){
  const o=JSON.parse(data);
  DB.seats=DB.seats.filter(function(x){ return !(x.event_id===eid && x.zone==='Custom'); }).concat(o.items||[]);
  ensureDetails(eid).layout=o.L||{};
  ldzSetSel(ldzSel().filter(ldzFind));     // objek yang sudah tak ada dilepas dari pilihan
  save(); ldzRepaint(eid);
}
function ldzUndo(){
  const eid=window._ldzEid;
  const r=_ldzUndo.pop(); if(!r){ toast('Tidak ada lagi yang bisa dibatalkan.'); return; }
  _ldzRedo.push({eid:r.eid,data:ldzPotret(r.eid)});
  ldzPulihkan(r.eid,r.data); ldzTombolRiwayat();
  toast('↶ Dibatalkan');
}
function ldzRedoAksi(){
  const r=_ldzRedo.pop(); if(!r){ toast('Tidak ada lagi yang bisa diulangi.'); return; }
  _ldzUndo.push({eid:r.eid,data:ldzPotret(r.eid)});
  ldzPulihkan(r.eid,r.data); ldzTombolRiwayat();
  toast('↷ Diulangi');
}
// Tombolnya dimatikan saat tak ada yang bisa dibatalkan — tombol hidup yang tidak
// melakukan apa-apa membuat orang mengira aplikasinya macet.
function ldzTombolRiwayat(){
  const u=document.getElementById('ldzUndoBtn'), r=document.getElementById('ldzRedoBtn');
  if(u) u.disabled=!_ldzUndo.length;
  if(r) r.disabled=!_ldzRedo.length;
}

/* ================= SALIN & TEMPEL =================
   Ctrl+C / Ctrl+V. Bedanya dengan Gandakan (Ctrl+D): salinan bertahan di papan
   klip, jadi satu blok meja bisa ditempel berkali-kali — dan bisa ditempel di
   denah EVENT LAIN, yang selama ini berarti menggambar ulang dari nol tiap kali
   venue yang sama dipakai acara berbeda. */
let _ldzClip=[];
function ldzSalin(){
  const sel=ldzSelItems();
  if(!sel.length) return toast('Pilih objeknya dulu.');
  _ldzClip=JSON.parse(JSON.stringify(sel));
  toast('⎘ '+sel.length+' objek disalin — Ctrl+V untuk menempel.');
}
function ldzTempel(eid){
  if(!_ldzClip.length) return toast('Papan klip kosong.');
  const L=ldzMeta(eid);
  ldzRekam(eid);
  /* Ditempel relatif terhadap sudut kiri-atas blok aslinya lalu digeser 20px,
     supaya bentuk susunannya utuh dan salinannya tidak menutupi aslinya. */
  let minx=Infinity,miny=Infinity;
  _ldzClip.forEach(function(i){ minx=Math.min(minx,+i.x||0); miny=Math.min(miny,+i.y||0); });
  const n0=ldzItems(eid).length;
  const baru=_ldzClip.map(function(i,k){
    const cls=ldzTierClass(eid,ldzTierNames(eid).indexOf(i.tier)>=0?i.tier:ldzTierAktif(eid));
    const w=+i.w||40, h=+i.h||40;
    return Object.assign({},i,{
      id:uid(), event_id:eid, ticket_class_id:cls.id,
      tier:cls.name,
      table_no:String(n0+k+1), seat_no:n0+k+1, floor:ldzLantai(),
      x:Math.max(0,Math.min(L.w-w,(+i.x||0)-minx+20)),
      y:Math.max(0,Math.min(L.h-h,(+i.y||0)-miny+20)),
      status:'Available'      // salinan selalu kosong: status terjual milik tiket, bukan bentuk
    });
  });
  DB.seats=DB.seats.concat(baru);
  ldzSetSel(baru.map(function(i){ return i.id; }));
  ldzSyncQuota(eid); save(); ldzRepaint(eid);
  toast('✓ '+baru.length+' objek ditempel.');
}

/* ================= GANTI NAMA DI TEMPAT =================
   Klik ganda pada objek langsung membuka kotak ketik di atasnya, seperti
   draw.io. Sebelumnya nomor meja hanya bisa diubah lewat panel kanan — benar,
   tapi jauh: untuk menomori ulang 20 meja, matanya harus bolak-balik antara
   kanvas dan sisi layar sebanyak 20 kali. */
function ldzRename(id){
  if(!window._ldzEdit) return;
  const it=ldzFind(id); if(!it) return;
  const el=document.getElementById('ldz_'+id); if(!el) return;
  const inp=document.createElement('input');
  inp.value=it.table_no||'';
  inp.className='ldz-rename';
  inp.onpointerdown=function(ev){ ev.stopPropagation(); };
  const selesai=function(simpan){
    if(inp._tutup) return; inp._tutup=true;
    if(simpan){
      const v=inp.value.trim();
      if(v!==(it.table_no||'')){ ldzRekam(window._ldzEid); it.table_no=v; save(); }
    }
    ldzRepaint(window._ldzEid);
  };
  inp.onblur=function(){ selesai(true); };
  inp.onkeydown=function(ev){
    ev.stopPropagation();                       // jangan sampai Delete/panah menyentuh kanvas
    if(ev.key==='Enter'){ ev.preventDefault(); selesai(true); }
    if(ev.key==='Escape'){ ev.preventDefault(); selesai(false); }
  };
  el.innerHTML=''; el.appendChild(inp);
  inp.focus(); inp.select();
}
/* ---- DUA LANTAI DALAM SATU EVENT ----
   Venue ini bertingkat, dan tiap lantai punya denah sendiri: lantai bawah
   berisi VIP & Gold di sekitar panggung, lantai atas berisi Reguler & Reguler+.
   Sebelumnya semua objek menumpuk di satu kanvas, jadi menggambar lantai 2
   berarti menyelipkannya di sela-sela lantai 1 — dan pemesanan tidak punya
   cara memberitahu tamu ia duduk di lantai berapa.

   Objek lama yang belum bertanda lantai dianggap Lantai 1: itu yang sudah
   digambar orang selama ini, dan memindahkannya diam-diam ke lantai lain akan
   membuat denah yang sudah jadi tampak kosong. */
/* Panel yang ditutup harus tetap tertutup sesudah kanvas digambar ulang, dan
   itu terjadi belasan kali per menit saat mendesain. localStorage dipakai
   (bukan variabel) supaya pilihannya juga bertahan antar kunjungan halaman —
   orang yang suka bekerja dengan kanvas lebar tidak perlu menutupnya lagi tiap
   kali membuka event. Dibungkus try: localStorage bisa dilarang (mode privat,
   iframe pihak ketiga), dan panel yang tidak bisa ditutup jauh lebih baik
   daripada perancang denah yang mati total. */
function ldzPanelTutup(nama){ try{ return localStorage.getItem('ldzTutup_'+nama)==='1'; }catch(e){ return false; } }
function ldzPanelToggle(nama){
  try{ localStorage.setItem('ldzTutup_'+nama, ldzPanelTutup(nama)?'0':'1'); }catch(e){}
  ldzRepaint(window._ldzEid);
}
function ldzRailHTML(nama,label){
  return '<button class="ldz-rail" title="Buka panel '+esc(label)+'" onclick="ldzPanelToggle(\''+nama+'\')">'
    +'\u00ab<span>'+esc(label)+'</span></button>';
}
function ldzPheadHTML(nama,label){
  return '<div class="ldz-phead"><b>'+esc(label)+'</b>'
    +'<button class="ldz-px" title="Tutup panel '+esc(label)+' — kanvas jadi lebih lega" onclick="ldzPanelToggle(\''+nama+'\')">\u00bb</button></div>';
}
function ldzLantai(){ return window._ldzLantai==='2'?'2':'1'; }
function ldzLantaiObjek(it){ return String((it&&it.floor)||'1'); }
function ldzSetLantai(eid,f){
  window._ldzLantai=(String(f)==='2')?'2':'1';
  ldzSetSel([]); beliSetSel([]);
  if(document.querySelector('.tabs')) renderTicketDetail(eid); else ldzRepaint(eid);
}
// Seluruh objek kustom event ini, lintas lantai — dipakai rekap & penjualan.
function ldzSemuaItems(eid){ return DB.seats.filter(s=>s.event_id===eid && s.zone==='Custom'); }
// Objek pada lantai yang sedang dibuka — inilah yang digambar & diedit.
function ldzItems(eid){ return ldzSemuaItems(eid).filter(i=>ldzLantaiObjek(i)===ldzLantai()); }
function ldzFind(id){ return DB.seats.find(s=>s.id===id && s.zone==='Custom'); }
/* Tiap tingkatan tiket punya satu ticket class per event — dibuat saat pertama
   kali dipakai, supaya objek denah selalu tersambung ke kelas yang bisa dijual. */
function ldzTierClass(eid,tier){
  let c=DB.ticketClasses.find(x=>x.event_id===eid && x.name===tier);
  if(!c){
    const e=DB.events.find(x=>x.id===eid)||{};
    c={id:uid(),event_id:eid,name:tier,price:0,quota:0,sold:0,
       sale_start:e.start_datetime||'',sale_end:e.start_datetime||'',
       description:'Tingkatan tiket '+tier+' (denah kustom)',benefit:tier,is_seated:true};
    DB.ticketClasses.push(c);
  }
  return c;
}
// Kuota kelas mengikuti isi denah: 1 kursi = 1, 1 meja = kapasitas mejanya.
function ldzSyncQuota(eid){
  const its=ldzItems(eid);
  LDZ_TIER_NAMES.forEach(t=>{
    const mine=its.filter(i=>i.tier===t);
    if(!mine.length) return;
    ldzTierClass(eid,t).quota=mine.reduce((a,i)=>a+(+i.capacity||1),0);
  });
}
function ldzCap(eid){ return ldzItems(eid).filter(function(i){ return !ldzAdalahArea(i); }).reduce((a,i)=>a+(+i.capacity||1),0); }
function ldzTerjual(it){ return DB.tickets.some(t=>t.seat_id===it.id && t.status!=='Cancelled'); }

/* ---------- pilihan (bisa lebih dari satu) ---------- */
function ldzSel(){ if(!Array.isArray(window._ldzSelIds)) window._ldzSelIds=[]; return window._ldzSelIds; }
function ldzIsSel(id){ return ldzSel().indexOf(id)>=0; }
function ldzSetSel(ids){ window._ldzSelIds=(ids||[]).slice(); }
function ldzSelItems(){ return ldzSel().map(ldzFind).filter(Boolean); }
function ldzBBox(items){
  if(!items.length) return null;
  let x1=Infinity,y1=Infinity,x2=-Infinity,y2=-Infinity;
  items.forEach(i=>{ x1=Math.min(x1,+i.x||0); y1=Math.min(y1,+i.y||0);
                     x2=Math.max(x2,(+i.x||0)+(+i.w||LDZ_MIN)); y2=Math.max(y2,(+i.y||0)+(+i.h||LDZ_MIN)); });
  return {x:x1,y:y1,w:x2-x1,h:y2-y1};
}
function ldzZoom(){ const z=+window._ldzZoom; return (z&&z>0)?z:1; }

/* ---------- menambah objek ---------- */
function ldzUkuranBaku(kind,shape){
  // Area bawaannya besar: ia menandai RUANG, bukan satu tempat duduk.
  if(kind==='area') return {w:180,h:90};
  if(kind==='table') return shape==='circle'?{w:96,h:96}:{w:110,h:70};
  return {w:40,h:40};
}
function ldzBuat(eid,kind,shape,x,y){
  ldzRekam(eid);
  const L=ldzMeta(eid), n=ldzItems(eid).length;
  // Tingkatan yang dipakai objek baru harus salah satu kelas tiket event ini;
  // window._ldzTier bisa tertinggal dari event sebelumnya yang kelasnya lain.
  const tier=ldzTierAktif(eid);
  const cls=ldzTierClass(eid,tier);
  const u=ldzUkuranBaku(kind,shape);
  const g=L.snap?10:1;
  const it={id:uid(),event_id:eid,ticket_class_id:cls.id,zone:'Custom',
    /* Nomor objek = angka polos mulai dari 1. Awalan K/M dulu dipakai untuk
       membedakan kursi dan meja, tapi sekarang bedanya sudah terlihat dari
       warna dan bentuk — sementara awalan itu ikut tercetak di e-ticket dan
       terbaca petugas sebagai bagian dari nomor kursinya ("K12" padahal
       tamunya mencari meja 12). */
    kind,shape,tier,floor:ldzLantai(),table_no:String(n+1),seat_no:n+1,
    capacity:kind==='area'?0:(kind==='table'?6:1),
    x:Math.max(0,Math.min(L.w-u.w,Math.round((x-u.w/2)/g)*g)),
    y:Math.max(0,Math.min(L.h-u.h,Math.round((y-u.h/2)/g)*g)),
    w:u.w,h:u.h,status:'Available'};
  DB.seats.push(it);
  ldzSetSel([it.id]);
  ldzSyncQuota(eid); save(); ldzRepaint(eid);
  return it;
}
function ldzDuplicate(eid){
  ldzRekam(eid);
  const sel=ldzSelItems(); if(!sel.length) return toast('Pilih dulu objek yang mau digandakan.');
  let n=ldzItems(eid).length; const baru=[];
  sel.forEach(it=>{
    n++;
    const c=Object.assign({},it,{id:uid(),x:(+it.x||0)+20,y:(+it.y||0)+20,seat_no:n,
      table_no:String(n),floor:ldzLantai(),status:'Available'});
    delete c.updatedAt; delete c.createdAt;
    DB.seats.push(c); baru.push(c.id);
  });
  ldzSetSel(baru);
  ldzSyncQuota(eid); save(); ldzRepaint(eid);
}
/* Objek yang kursinya SUDAH terjual tidak boleh dihapus — itu memutus tiket
   yang sudah dipegang pembeli; lepasnya lewat Refund, sama seperti toggleSeat. */
function ldzDelete(eid){
  ldzRekam(eid);
  const sel=ldzSelItems(); if(!sel.length) return toast('Pilih dulu objek yang mau dihapus.');
  const terkunci=sel.filter(ldzTerjual);
  const boleh=sel.filter(i=>!ldzTerjual(i));
  if(!boleh.length) return toast('Semua yang dipilih sudah terjual — lepas lewat Refund dulu.');
  const buang=boleh.map(i=>i.id);
  DB.seats=DB.seats.filter(s=>buang.indexOf(s.id)<0);
  ldzSetSel(terkunci.map(i=>i.id));
  ldzSyncQuota(eid); save(); ldzRepaint(eid);
  if(terkunci.length) toast(terkunci.length+' objek dipertahankan karena sudah terjual.');
}
function ldzClear(eid){
  ldzRekam(eid);
  const its=ldzItems(eid);
  if(!its.length) return;
  const terjual=its.filter(ldzTerjual).length;
  if(!confirm('Hapus seluruh '+its.length+' objek di denah kustom ini?'+(terjual?'\n\n'+terjual+' di antaranya sudah terjual dan akan DILEWATI.':'')+'\n\nTindakan ini tidak bisa dibatalkan.')) return;
  const sisa=its.filter(ldzTerjual).map(i=>i.id);
  DB.seats=DB.seats.filter(s=>!(s.event_id===eid && s.zone==='Custom') || sisa.indexOf(s.id)>=0);
  ldzSetSel([]); ldzSyncQuota(eid); save(); ldzRepaint(eid);
  toast('Denah dikosongkan'+(terjual?' — '+terjual+' objek terjual dipertahankan.':'.'));
}
/* Tambah banyak sekaligus: menaruh 60 kursi satu per satu itu pekerjaan yang
   tidak masuk akal, jadi barisan kursi dibuat dari satu form. */
function ldzBulkForm(eid){
  modal('<h3 class="sec">Tambah Banyak Objek</h3>'

   +'<div class="field"><label>Kapasitas per objek</label><input type="number" id="bz_cap" value="1" min="1"></div>'

function ldzBulkGo(eid){
  ldzRekam(eid);
  const g=k=>document.getElementById(k).value;
  const kind=g('bz_kind'), shape=g('bz_shape'), tier=g('bz_tier');
  const cap=Math.max(1,+g('bz_cap')||1), rows=Math.max(1,+g('bz_rows')||1), cols=Math.max(1,+g('bz_cols')||1);
  const pre=g('bz_pre').trim(), gap=Math.max(0,+g('bz_gap')||0);
