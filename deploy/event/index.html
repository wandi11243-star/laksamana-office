    +'<span class="km-v">'+sisa.reduce((a,c)=>a+(+c.sold||0),0)+'</span></div>';
  return h+'</div>';
}
function renderTicketDetail(id){
  const e=DB.events.find(x=>x.id===id);if(!e){location.hash='#/ticketing';return;}
  /* TIGA TAB, bukan lima. "Seat Map" (denah template bawaan venue) dulu berdiri
     sendiri di sebelah "Layout Kustom", padahal keduanya menjawab pertanyaan
     yang sama — dan event hanya memakai SALAH SATU. Dua tab untuk satu hal
     memaksa orang menebak mana yang berlaku. Sekarang denah template hidup di
     dalam tab Denah sebagai CONTOH yang dibuka kalau perlu.

     "Buyer List" dan "Refund" juga digabung: refund itu kelanjutan sebuah
     pembelian, bukan daftar terpisah, dan memisahkannya berarti kasir harus
     bolak-balik tab untuk menjawab satu pertanyaan ("pesanan ini sudah
     dikembalikan belum?"). */
  /* Tab "Jual Tiket" DIPISAH dari "Penjualan" 7 Agustus 2026. Keduanya dulu
     satu halaman, dan itu mencampur dua pekerjaan yang tidak pernah terjadi
     bersamaan: MENJUAL (kasir, sambil orangnya berdiri di depan meja) dan
     MEMBACA (manajemen, menghitung sudah masuk berapa). Halaman jual yang
     penuh tabel rekap memperlambat yang pertama; halaman rekap yang punya
     tombol jual di atasnya membuat yang kedua takut salah pencet. */
  const sah=['classes','layout','jual','sales'];
  if(sah.indexOf(window._tixTab)<0) window._tixTab='classes';
  const tab=window._tixTab;
  setTop(e.title+' \u2014 Ticketing','<a href="#/ticketing" style="color:var(--accent)">Ticketing</a> / '+esc(e.title),'');
  const classes=DB.ticketClasses.filter(c=>c.event_id===id);
  const tb=(k,l)=>`<button class="${tab===k?'active':''}" onclick="window._tixTab='${k}';renderTicketDetail('${id}')">${l}</button>`;
  let body='';
  if(tab==='classes'){
    body=`<button class="btn ghost sm" style="margin-bottom:12px" onclick="ticketClassForm('${id}')">+ Kelas Tiket Baru</button>
    <div class="card" style="padding:0"><table><thead><tr><th>Kelas Tiket</th><th>Harga</th><th>Kuota</th><th>Terjual</th><th>Masa Jual</th><th>Tempat Duduk</th><th></th></tr></thead><tbody>
    ${classes.map(c=>`<tr><td><b>${esc(c.name)}</b><br><span class="mini">${esc(c.benefit||'')}</span></td><td>${IDR(c.price)}</td><td>${c.quota}</td><td>${c.sold} ${c.sold>=c.quota?statusBadge('Sold'):''}</td><td class="mini">${fmtDate(c.sale_start)} \u2013 ${fmtDate(c.sale_end)}</td><td>${c.is_seated?'<span class="badge b-purple">Kursi bernomor</span>':'<span class="badge b-blue">Bebas berdiri</span>'}</td>
      <td style="white-space:nowrap"><button class="btn ghost sm" title="Ubah" onclick="ticketClassForm('${id}','${c.id}')">✎</button>
      <button class="btn ghost sm" title="Hapus" onclick="delTicketClass('${id}','${c.id}')">×</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">Belum ada kelas tiket.</td></tr>'}
    </tbody></table></div>
    <p class="mini" style="margin-top:12px">Untuk mencatat penjualan atau memesankan kursi, buka tab <b>Jual Tiket</b>.</p>`;
  }
  else if(tab==='layout'){ body=denahTabBody(id); }
  else if(tab==='jual'){ body=jualBody(id); }
  else { body=salesBody(id); }
  C().innerHTML=`<div class="tabs">${tb('classes','Kelas Tiket')}${tb('layout','Denah & Booking')}`
    +`${tb('jual','Jual Tiket')}${tb('sales','Penjualan & Refund')}</div>${body}`;
}
/* ---- TAB JUAL TIKET ----
   Satu-satunya halaman yang dibuka kasir saat ada orang di depan meja.

   FORMNYA DI HALAMAN, BUKAN DI POP-UP. Modal memaksa denah muat di dalam
   kotak yang tingginya dibatasi layar, jadi denah venue penuh harus digulir
   di dalam kotak yang juga bisa digulir — sambil pembeli menunggu. Di halaman
   sendiri denahnya dapat lebar penuh dan langsung terlihat utuh, dan isian
   formnya tepat di atasnya: baca nama, pilih kelas, tunjuk kursinya, simpan.

   Isian dan tombolnya memakai id yang SAMA PERSIS dengan modal lama
   (pf_class, pf_seatwrap, pf_name, …), jadi seluruh mesin di baliknya —
   pfKelasBerubah, pfGambarDenah, pfRingkas, doPurchase — dipakai apa adanya
   tanpa satu pun cabang "kalau di halaman". */
function jualBody(eid){
  const e=DB.events.find(x=>x.id===eid)||{};
  const kelas=DB.ticketClasses.filter(c=>c.event_id===eid);
  if(!kelas.length){
    return '<div class="empty">Event ini belum punya satu kelas tiket pun.<br>'
      +'<span class="mini">Buat dulu di tab <b>Kelas Tiket</b> — tanpa itu tidak ada yang bisa dijual.</span></div>';
  }
  /* Digambar sesudah HTML-nya menempel: pfKelasBerubah menulis ke dalam
     #pf_seatwrap, yang belum ada saat string ini masih disusun. */
  setTimeout(function(){
    if(document.getElementById('pf_class')) pfKelasBerubah(eid);
  },0);

  return '<div class="card" style="margin-bottom:16px">'
   +'<h3 class="sec">Catat Penjualan Tiket</h3>'
   +'<p class="mini" style="margin-bottom:12px">Untuk pembeli yang membayar langsung di tempat — '
   +'tiketnya terbit begitu disimpan, lengkap dengan QR untuk check-in.</p>'
   +'<div class="field"><label>Pilih Tiket</label>'
     +'<select id="pf_class" onchange="pfKelasBerubah(\''+eid+'\')">'
     +kelas.map(function(c){
        const habis=(c.sold>=c.quota);
        return '<option value="'+c.id+'"'+(habis?' disabled':'')+'>'+esc(c.name)+' — '+IDR(c.price)
          +(habis?' (HABIS)':' ('+(c.quota-c.sold)+' tersisa)')+'</option>';
      }).join('')
     +'</select></div>'
   +'<div class="grid g2">'
     +'<div class="field"><label>Nama *</label><input id="pf_name" placeholder="Nama pembeli"></div>'
     +'<div class="field"><label>No. HP *</label><input id="pf_phone" value="+628"></div>'
     +'<div class="field"><label>Email *</label><input id="pf_email" placeholder="untuk kirim e-ticket"></div>'
     /* Tgl Lahir dicabut: tidak pernah dipakai untuk apa pun — tidak masuk
        e-ticket, tidak jadi syarat masuk, tidak pernah dilaporkan. Satu
        kotak lagi yang harus dilewati kasir sambil orang mengantre, dan
        data pribadi yang disimpan tanpa alasan. */
   +'</div>'
   +'<div id="pf_total" class="mini" style="margin:10px 0"></div>'
   +'<button class="btn" id="pf_go" onclick="doPurchase(\''+eid+'\')">Simpan &amp; Tandai Lunas</button>'
   +'</div>'
   /* Denah tinggal di kartunya sendiri, di BAWAH form — pf_seatwrap yang
      mengisinya, dan isinya berganti sendiri mengikuti kelas yang dipilih:
      denah untuk kelas berkursi, kotak jumlah untuk kelas bebas berdiri. */
   +'<div class="card" id="pf_seatwrap"></div>';
}
/* Tab Denah: perancang denah kustom + contoh denah template venue yang hanya
   muncul kalau diminta. Tombol Mode Jual mengubah denah jadi alat pemesanan. */
function denahTabBody(eid){
  const jual=ldzJualAktif();
  const lt=ldzLantai();
  const jml=function(f){ return ldzSemuaItems(eid).filter(function(i){ return ldzLantaiObjek(i)===f; }).length; };
  const bar='<div class="toolbar" style="margin-bottom:10px">'
   /* Pemilih lantai berdiri paling depan: apa pun yang ditekan sesudahnya
      (desain, jual, template) berlaku untuk lantai yang sedang terbuka, jadi
      itu keputusan pertama yang harus disadari orang. */
   +'<div class="lm-floors" style="margin:0">'
     +'<button class="'+(lt==='1'?'on':'')+'" onclick="ldzSetLantai(\''+eid+'\',\'1\')">Lantai 1 <span class="mini">('+jml('1')+')</span></button>'
     +'<button class="'+(lt==='2'?'on':'')+'" onclick="ldzSetLantai(\''+eid+'\',\'2\')">Lantai 2 <span class="mini">('+jml('2')+')</span></button>'
   +'</div>'
   +'<button class="btn '+(window._ldzEdit?'':'ghost')+' sm" onclick="ldzToggleEdit(\''+eid+'\')">\u270e Mode Desain</button>'
   +'<button class="btn ghost sm" title="Pasang denah bawaan venue untuk lantai ini" onclick="ldzPasangBawaan(\''+eid+'\')">Denah Bawaan LM</button>'
   /* Tombol ini HANYA muncul kalau event punya DUA denah sekaligus: objek
      kustom dan kursi template bawaan. Itu keadaan yang membingungkan — dua
      sumber kebenaran untuk satu ruangan — dan penyebab angka yang tidak
      cocok antar layar (Rangkuman Denah menghitung 92, penjaga hapus kelas
      menghitung 175). Kalau eventnya cuma punya satu denah, tombolnya tidak
      perlu ada sama sekali. */
   +(ldzSemuaItems(eid).length && kursiTemplate(eid).length
      ? '<button class="btn ghost sm" title="Hapus sisa denah template bawaan — denah kustom tidak disentuh" onclick="hapusDenahTemplate(\''+eid+'\')">Hapus Denah Template Lama ('+kursiTemplate(eid).length+')</button>'
      : '')
   /* TIGA TOMBOL TEMPLATE DENAH DICABUT: Muat Template, Simpan sebagai
      Template, dan Kelola Template.

      Yang diminta cuma dua yang pertama, tapi "Simpan sebagai Template" ikut
      dicabut karena tanpa pemuatnya ia menulis ke tempat yang tidak bisa
      dibaca siapa pun \u2014 tombol yang berhasil melakukan sesuatu yang tidak
      pernah berguna adalah bentuk kegagalan yang paling sulit disadari.

      "Denah Bawaan LM" sudah menutup kebutuhan yang sebenarnya: memasang
      denah venue dalam sekali tekan. Template hanya menambah satu lapis
      pilihan di atasnya, dan justru dari situ denah berlipat berasal.

      DATANYA TIDAK DIHAPUS. DB.layoutTemplates dibiarkan utuh \u2014 kalau
      ternyata masih dibutuhkan, mengembalikan tombolnya cukup satu baris dan
      template lama masih ada. Fungsi ldzMuatTemplateForm/ldzSimpanTemplate/
      ldzHapusTemplate sengaja dibiarkan hidup untuk itu. */
   +'<span class="mini">'+(jual?'Klik kursi untuk memesan.':(window._ldzEdit?'Menyusun denah Lantai '+lt+'.':'Klik kursi untuk mengubah statusnya.'))+'</span>'
   +'</div>';
  /* "Lihat contoh denah venue" dibuang: denah bawaan gedung tidak pernah
     dipakai event yang menggambar denahnya sendiri, dan menyediakannya di
     sebelah denah asli cuma menambah satu hal untuk dipilih tanpa menjawab
     pertanyaan apa pun. Rujukan bentuk ruangan sekarang datang dari gambar
     latar (tombol Upload denah) — tepat di bawah objeknya, bukan di kartu
     terpisah. */
  return bar+ldzBarJualHTML(eid)+layoutBody(eid);
}
/* ---- PENJUALAN & REFUND (satu halaman) ----
   Dibuka dengan ringkasan uang: tiap kategori berapa tiket dan berapa
   rupiahnya, plus total omzet bersih setelah refund. Angka itu yang paling
   sering ditanyakan dan dulu harus dihitung tangan dari daftar pembeli. */
function salesRingkas(eid){
  const orders=DB.orders.filter(o=>o.event_id===eid);
  const per={};
  let omzet=0, dikembalikan=0, tiketSah=0;
  orders.forEach(function(o){
    const tks=DB.tickets.filter(t=>t.order_item_id===o.id);
    const refund=(o.payment_status==='Refunded');
    tks.forEach(function(t){
      const c=DB.ticketClasses.find(x=>x.id===t.ticket_class_id);
      const nama=c?c.name:'(tanpa kelas)';
      const harga=c?(+c.price||0):0;
      per[nama]=per[nama]||{n:0,rp:0,warna:ldzTierInfo(eid,nama).c,pembeli:[],_idx:{},
                            harga:harga, kuota:(c?(+c.quota||0):0)};
      /* PEMBELI DIKUMPULKAN PER KATEGORI, satu baris per pesanan — bukan satu
         baris per tiket. Satu orang yang membeli 6 tiket VIP adalah SATU
         pembeli yang membawa 6 orang, dan mendaftarnya enam kali membuat
         "berapa orang yang beli VIP" tidak bisa dijawab dari layar.

         Yang di-refund tetap didaftar (dengan penanda), cuma tidak ikut
         menambah uang maupun jumlah tiket sah: pertanyaan "siapa saja yang
         pernah beli VIP" tetap perlu dijawab lengkap, sedangkan angka
         omzetnya tidak boleh ikut naik. */
      let b=per[nama]._idx[o.id];
      if(!b){
        b={ order:o, nama:o.buyer_name, hp:o.phone, email:o.email,
            jml:0, rp:0, refund:refund, kursi:{}, masuk:0 };
        per[nama]._idx[o.id]=b; per[nama].pembeli.push(b);
      }
      b.jml++;
      if(t.status==='Checked-In') b.masuk++;
      const st=t.seat_id?DB.seats.find(x=>x.id===t.seat_id):null;
      if(st){ const l=String(st.table_no||st.seat_no); b.kursi[l]=(b.kursi[l]||0)+1; }
      if(refund){ dikembalikan+=harga; return; }
      b.rp+=harga;
      per[nama].n++; per[nama].rp+=harga; omzet+=harga; tiketSah++;
    });
  });
  /* Pembeli terbesar di atas: yang paling sering ditanyakan dari daftar ini
     adalah "siapa yang borong", bukan urutan waktu belinya. */
  Object.keys(per).forEach(function(k){
    per[k].pembeli.sort(function(a,b){ return b.jml-a.jml || String(a.nama).localeCompare(String(b.nama)); });
    delete per[k]._idx;
  });
  return {per:per, omzet:omzet, dikembalikan:dikembalikan, tiketSah:tiketSah, orders:orders};
}
/* =====================================================================
   HALAMAN RINCIAN SATU KATEGORI TIKET   #/ticketing/<event>/<kelas>

   Dulu rinciannya berupa dropdown yang mengembang di dalam panel ringkasan.
   Dua hal yang salah dengan itu: panel ringkasan jadi memanjang dan berhenti
   berfungsi sebagai ringkasan, dan tidak ada tempat untuk hal yang paling
   dicari saat membicarakan satu kategori — DENAHNYA. "VIP tinggal berapa"
   dijawab angka; "VIP yang mana yang masih kosong" hanya bisa dijawab denah.

   Jadi kategorinya dapat halaman sendiri: denah dengan kursi kategori itu
   disorot dan sisanya diredupkan, lalu di bawahnya daftar penjualan kategori
   itu saja.
   ===================================================================== */
let _katJualHal=1;
/* 8 baris per halaman. Lebih pendek dari tabel pesanan (10) karena di sini
   ada denah di atasnya — dua hal yang panjang dalam satu layar membuat
   keduanya harus digulir setengah-setengah. */
const KAT_PER_HAL=8;
function renderKategoriDetail(eid, clsId){
  const e=DB.events.find(x=>x.id===eid);
  const c=DB.ticketClasses.find(x=>x.id===clsId && x.event_id===eid);
  if(!e || !c){ location.hash='#/ticketing/'+(eid||''); return; }

  const T=ldzTierInfo(eid,c.name);
  const r=salesRingkas(eid);
  const v=r.per[c.name] || {n:0,rp:0,pembeli:[],kuota:+c.quota||0,harga:+c.price||0};
  const kuota=+c.quota||0;
  const sisa=kuota?Math.max(0,kuota-v.n):null;

  setTop(c.name+' — '+e.title,
    '<a href="#/ticketing" style="color:var(--accent)">Ticketing</a> / '
    +'<a href="#/ticketing/'+eid+'" style="color:var(--accent)">'+esc(e.title)+'</a> / '+esc(c.name), '');

  /* Denah: seluruh objek digambar seperti biasa, lalu yang BUKAN kategori ini
     diredupkan lewat CSS beratribut. Bukan digambar ulang dengan aturan
     berbeda — dua penggambar untuk satu denah berarti salah satunya pasti
     tertinggal saat bentuk objeknya berubah. */
  const milikKat=ldzSemuaItems(eid).filter(function(i){ return String(i.tier||'')===c.name; });
  const punyaDenah=milikKat.length>0;
  const kursi=milikKat.filter(function(i){ return !ldzAdalahArea(i); });
  const terjual=kursi.filter(function(i){ const st=ldzStatusCls(i); return st==='sold'||st==='checked'; }).length;

  /* LANTAI YANG DITAMPILKAN MENGIKUTI KATEGORINYA. Lantai aktif itu milik
     bersama seluruh modul (window._ldzLantai), jadi membuka rincian VIP
     sesudah menengok Lantai 2 di tab lain menampilkan lantai kosong — denah
     tanpa satu pun kursi VIP, yang terbaca sebagai "VIP tidak punya denah".
     Di sini lantainya dipilihkan: kalau lantai yang sedang aktif tidak punya
     kursi kategori ini, pindah sendiri ke lantai yang punya. */
  const lantaiKat=[];
  milikKat.forEach(function(i){
    const f=ldzLantaiObjek(i);
    if(lantaiKat.indexOf(f)<0) lantaiKat.push(f);
  });
  lantaiKat.sort();
  if(punyaDenah && lantaiKat.indexOf(ldzLantai())<0) window._ldzLantai=lantaiKat[0];

  let h='<div class="fbar">'
   +'<button class="fchip" onclick="location.hash=\'#/ticketing/'+eid+'\'">‹ Kembali ke Penjualan</button>'
   +'<span class="ldz-tier" style="font-size:14px"><i style="background:'+T.c+'"></i><b>'+esc(c.name)+'</b></span>'
   +(c.is_seated?'<span class="badge b-purple">Kursi bernomor</span>':'<span class="badge b-blue">Bebas berdiri</span>')
   +'</div>';

  h+='<div class="grid g4" style="margin-bottom:16px">'
   +stat('Terjual', v.n+(kuota?' / '+kuota:''), kuota?(sisa?('sisa '+sisa+' tiket'):'kuota habis'):'kuota belum disetel')
   +stat('Uang Masuk', IDR(v.rp), (v.harga?IDR(v.harga)+' / tiket':'harga belum disetel'))
   +stat('Pembeli', (v.pembeli||[]).length, 'pesanan di kategori ini')
   +stat('Kursi Terpakai', punyaDenah?(terjual+' / '+kursi.length):'—', punyaDenah?'menurut denah':'kategori tanpa denah')
   +'</div>';

  if(punyaDenah){
    /* Nama kategori masuk ke dalam selector CSS, jadi tanda kutipnya wajib
       dilucuti — satu kutip di nama kelas ("VIP 'A'") cukup untuk mematahkan
       seluruh blok gaya dan membuat SEMUA kursi tetap redup. */
    const aman=String(c.name).replace(/["\\]/g,'');
    h+='<style>#katDenah .ldz-item{opacity:.14;filter:grayscale(1)}'
      +'#katDenah .ldz-item[data-tier="'+aman+'"]{opacity:1;filter:none}</style>'
      +'<div class="card" style="margin-bottom:16px">'
      +'<h3 class="sec">Denah — kursi '+esc(c.name)+'</h3>'
      +'<p class="mini" style="margin-bottom:10px">Yang berwarna penuh adalah kursi kategori ini; sisanya diredupkan. '
      +'Kursi yang sudah dipesan tampil sesuai warna statusnya — sama dengan denah di tab Denah &amp; Booking.</p>'
      /* Hanya lantai yang PUNYA kursi kategori ini yang diberi tombol. Tombol
         menuju lantai kosong cuma menawarkan layar hampa. */
      +(lantaiKat.length>1
        ? '<div class="lm-floors" style="margin:0 0 10px">'
          +lantaiKat.map(function(f){
              return '<button class="'+(ldzLantai()===f?'on':'')+'" '
                +'onclick="ldzSetLantai(\''+eid+'\',\''+f+'\');renderKategoriDetail(\''+eid+'\',\''+clsId+'\')">Lantai '+f+'</button>';
            }).join('')
          +'</div>'
        : '<p class="mini" style="margin-bottom:10px">Seluruh kursi '+esc(c.name)+' ada di <b>Lantai '+(lantaiKat[0]||'1')+'</b>.</p>')
      +'<div id="katDenah">'+ldzCanvasHTML(eid,false)+'</div></div>';
  }

  // ---- Daftar penjualan kategori ini ----
  const list=(v.pembeli||[]).slice();
  const total=list.length;
  const halMax=Math.max(1,Math.ceil(total/KAT_PER_HAL));
  if(_katJualHal>halMax) _katJualHal=halMax;
  const mulai=(_katJualHal-1)*KAT_PER_HAL;

  h+='<div class="card" style="padding:0"><h3 class="sec" style="padding:14px 16px 0">Penjualan '+esc(c.name)+'</h3>';
  if(!total){
    h+='<div class="empty">Belum ada yang membeli kategori ini.</div></div>';
  }else{

function salesGrafikHTML(r,eid){

         +(sisa===0?'<span><b class="kat-habis">PENUH</b></span>':'')

/* PAGER BERSAMA, BENTUKNYA SAMA DENGAN MARKETING.
   Dulu EMS memakai "< Sebelumnya | Halaman 2 dari 7 | Berikutnya >": dua tombol
   berlabel panjang yang memakan lebar, dan nomor halaman yang cuma bisa DIBACA
   - melompat ke halaman 5 berarti menekan Berikutnya tiga kali. Marketing sudah
   memakai deretan nomor yang bisa langsung diketuk, dan kru membuka kedua modul
   bergantian di hari yang sama.

   Nomornya diringkas seperti di sana: halaman pertama, terakhir, dan tetangga
   halaman aktif; sisanya jadi satu titik-titik. Tanpa itu, acara 900 pesanan
   menghasilkan 90 tombol yang justru lebih sulit dipakai daripada dua panah.

   `aksi` = nama fungsi JS yang menerima nomor halaman. */
function pagerHTML(hal,halMax,total,satuan,aksi){
  if(halMax<=1) return '';
  const ELIP='…';
  const nomor=[];
  for(let i=1;i<=halMax;i++){
    if(i===1||i===halMax||Math.abs(i-hal)<=1) nomor.push(i);
    else if(nomor[nomor.length-1]!==ELIP) nomor.push(ELIP);
  }
  const tbl=function(n,label,mati,pri){
    return '<button class="btn sm'+(pri?' blue':' ghost')+'"'+(mati?' disabled':'')
      +' onclick="'+aksi+'('+n+')">'+label+'</button>'; };
  return '<div class="tbl-pager"><span class="mini">'+total+' '+satuan+'</span>'
    +'<div class="tbl-pager-nav">'
    +tbl(hal-1,'‹',hal<=1,false)
    +nomor.map(function(n){ return n===ELIP ? '<span class="tbl-pager-gap">'+ELIP+'</span>'
        : tbl(n,String(n),false,n===hal); }).join('')
    +tbl(hal+1,'›',hal>=halMax,false)
    +'</div></div>';
}

    const jml={}; const urut=[];

    });
    const kursi=urut.map(function(l){ return jml[l]>1 ? l+' ('+jml[l]+' tamu)' : l; });
    const masuk=tks.filter(function(t){ return t.status==='Checked-In'; }).length;
    const rfCell = !rf ? '<span class="mini">\u2014</span>'

    h+='<tr><td><b>'+esc(o.buyer_name)+'</b><div class="mini">'+fmtDateTime(o.created)

     +'<td>'+rfCell+(rf&&rf.status==='Pending'

  });
  h+='</tbody></table></div>';

/* ============================================================

   Reguler+ = 83 kursi bernomor MENGELILINGI lantai (poster): kolom kiri 1–23,

function seatSisi(n){ return n<=23?'Kiri':(n<=60?'Depan':'Kanan'); }
function buatDenahLM(eid){
  const e=DB.events.find(x=>x.id===eid); if(!e) return;
  if(DB.seats.some(s=>s.event_id===eid && s.zone==='Reguler+')){ toast('Denah Reguler+ sudah ada.'); return; }
  // pastikan ada ticket class untuk tiap zona (dipakai kuota & penjualan)
  let clsPlus=DB.ticketClasses.find(c=>c.event_id===eid && c.name==='Reguler+');
  if(!clsPlus){ clsPlus={id:uid(),event_id:eid,name:'Reguler+',price:0,quota:83,sold:0,sale_start:e.start_datetime,sale_end:e.start_datetime,description:'Kursi bernomor',benefit:'Kursi bernomor 1–83',is_seated:true}; DB.ticketClasses.push(clsPlus); }
  if(!DB.ticketClasses.some(c=>c.event_id===eid && c.name==='Reguler')){
    const sisa=Math.max(0,(+e.capacity||0)-83);

  }

  save(); toast('✓ Denah Laksamana Muda dibuat — 83 kursi Reguler+.'); renderTicketDetail(eid);
}

/* ---- MODE PILIH KURSI (dipakai layar Catat Penjualan) ----

function beliSel(){ if(!Array.isArray(window._beliSelIds)) window._beliSelIds=[]; return window._beliSelIds; }

function beliBisaDipilih(s){

function regulerAdj(eid,delta){
  const c=DB.ticketClasses.find(x=>x.event_id===eid && x.name==='Reguler'); if(!c) return;
  c.sold=Math.max(0,Math.min(c.quota,(+c.sold||0)+delta));

/* Satu tempat bisa memegang BEBERAPA tiket: penjualan online menerbitkan satu
   tiket per tamu untuk meja berkapasitas banyak. Dulu status diambil dari tiket
   PERTAMA yang ketemu — akibatnya meja 6 orang berubah jadi "sudah datang"
   begitu satu tamu memindai, dan Kursi Terisi Langsung melaporkan satu meja penuh
   hadir padahal baru satu orang. Sekarang meja baru hijau kalau SEMUA tiketnya
   sudah check-in. Untuk kursi biasa (satu tiket) hasilnya persis seperti dulu. */
function seatCls(s){
  const tks=DB.tickets.filter(t=>t.seat_id===s.id && t.status!=='Cancelled');
  if(tks.length && tks.every(t=>t.status==='Checked-In')) return 'checked';
  if(s.status==='Sold'||tks.length) return 'sold';
  if(s.status==='Locked') return 'locked';
  return 'available';
}
/* "3 / 6 datang" untuk tempat berisi banyak tiket; kosong untuk kursi biasa,
   supaya tooltip kursi tidak jadi lebih ramai tanpa menambah apa pun. */
function seatDatang(s){
  const tks=DB.tickets.filter(t=>t.seat_id===s.id && t.status!=='Cancelled');
  if(tks.length<2) return '';
  return ' — '+tks.filter(t=>t.status==='Checked-In').length+' dari '+tks.length+' datang';
}

  if(window._denahRO){

/* ============================================================
   LAYOUT DESIGNER — denah kustom bergaya draw.io
   ------------------------------------------------------------
   Denah template (Reguler+ / Lantai 1) tata letaknya dikunci di kode. Ini
   kebalikannya: tim event menyusun sendiri denah tiap acara — taruh kursi atau
   meja, geser, ubah ukurannya, beri tingkat tiket.

   Objeknya SENGAJA disimpan di DB.seats (zone='Custom') dan bukan koleksi baru:
   kolom `data` di tabel seats menyimpan seluruh baris sebagai JSON, jadi field
   tambahan (x/y/w/h/shape/kind/tier) ikut tersimpan tanpa ubah skema — dan yang
   lebih penting, penjualan tiket, e-ticket, refund serta Check-In langsung
   bekerja di atas denah kustom ini karena semuanya sudah berbicara ke seats.

   Gambar denah manual (hasil desain di luar sistem) dipasang sebagai LATAR
   kanvas; objek tinggal ditaruh menimpanya lalu disesuaikan posisinya.
   Meta kanvas (latar, ukuran, grid) ada di DB.eventDetails[eid].layout.

   Yang membuatnya terasa seperti draw.io, dan alasannya:
   - PILIHAN JAMAK. Seret di area kosong = kotak seleksi (marquee); semua yang
     tersentuh ikut terpilih dan bergerak bersama. Shift+klik menambah/melepas
     satu objek, Ctrl+A memilih semua. Menata 60 kursi satu per satu bukan
     pekerjaan yang masuk akal.
   - 8 PEGANGAN UKURAN di sekeliling kotak pilihan, bukan satu titik di pojok.
     Untuk pilihan jamak, seluruh kelompok diskalakan proporsional. Shift
     menjaga rasio.
   - ZOOM & PAN. Objek 40px sulit ditata pada denah 1200px; sekarang bisa
     diperbesar. Semua hitungan pointer dibagi zoom.
   - PALET BENTUK yang ditarik ke kanvas, plus perataan (align) & distribusi
     yang jadi alasan orang memakai draw.io untuk denah kursi.
   ============================================================ */
const LDZ_TIERS={
  Regular:{c:'#2f7fc4'},   // biru  — kelas dasar
  Silver :{c:'#8d97a3'},   // perak
  Gold   :{c:'#e0b23c'},   // kuning
  VIP    :{c:'#c9432b'}    // merah
};
const LDZ_TIER_NAMES=Object.keys(LDZ_TIERS);
/* ---- TINGKATAN DENAH = KELAS TIKET EVENT ITU ----
   Dulu tingkatannya dipatok empat nama (Regular/Silver/Gold/VIP) untuk SEMUA
   event. Akibatnya event yang menjual "Early Bird" dan "Festival" tetap harus
   memilih dari empat nama asing itu, lalu ldzTierClass() diam-diam membuat
   kelas tiket baru bernama "Silver" yang tidak pernah dijual siapa pun — dua
   daftar kelas untuk satu event, dan rangkuman denahnya tidak pernah cocok
   dengan kenyataan penjualan.

   Sekarang arahnya dibalik: kelas tiket yang didefinisikan di event ITU yang
   jadi daftar tingkatan. Warnanya dibagikan dari palet berdasarkan urutan
   kelas, jadi tetap konsisten selama urutannya tidak berubah, dan bisa dipatok
   sendiri lewat c.color kalau suatu saat kelas tiket punya kolom warna.
   Event yang belum punya satu kelas pun tetap memakai empat bawaan lama,
   supaya denah bisa mulai digambar sebelum harga tiketnya ditentukan. */
const LDZ_WARNA=['#2f7fc4','#c9432b','#e0b23c','#1F9D5F','#7C5FC0','#8d97a3','#d9573c','#2a9d8f'];
function ldzTiers(eid){
  const kelas=DB.ticketClasses.filter(c=>c.event_id===eid);
  if(!kelas.length) return LDZ_TIERS;
  const out={};
  kelas.forEach(function(c,i){
    out[c.name]={c:c.color||LDZ_WARNA[i%LDZ_WARNA.length],price:+c.price||0,quota:+c.quota||0,id:c.id};
  });
  return out;
}
function ldzTierNames(eid){ return Object.keys(ldzTiers(eid)); }
// Tingkatan yang sedang dipilih di palet, dijamin ada di event ini.
function ldzTierAktif(eid){
  const nama=ldzTierNames(eid);
  return (nama.indexOf(window._ldzTier)>=0)?window._ldzTier:(nama[0]||'Regular');
}
// Kelas tiket yang mewakili tingkatan aktif (null kalau event belum punya kelas).
function ldzKelasAktif(eid){
  const n=ldzTierAktif(eid);
  return DB.ticketClasses.find(function(c){ return c.event_id===eid && c.name===n; })||null;
}
// input type=color hanya menerima #rrggbb; warna palet bisa berupa rgb(...).
function ldzHexWarna(w){
  const t=String(w||'');
  if(/^#[0-9a-f]{6}$/i.test(t)) return t;
  const m=t.match(/(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/);
  if(!m) return '#2f7fc4';
  return '#'+[m[1],m[2],m[3]].map(function(v){ return ('0'+(+v).toString(16)).slice(-2); }).join('');
}
function ldzSetWarnaKelas(eid,nama,warna){
  const c=DB.ticketClasses.find(function(x){ return x.event_id===eid && x.name===nama; });
  if(!c) return toast('Kategori ini belum punya kelas tiket.');
  ldzRekam(eid);
  c.color=warna;
  save();
  if(document.querySelector('.tabs')) renderTicketDetail(eid); else ldzRepaint(eid);
  toast('✓ Warna kategori '+nama+' diubah.');
}
function ldzTierInfo(eid,tier){
  const T=ldzTiers(eid);
  return T[tier]||T[Object.keys(T)[0]]||{c:'#8d97a3',price:0,quota:0};
}
const LDZ_MIN=16;                       // sisi terkecil sebuah objek (px kanvas)
function ldzHexA(hex,a){ const n=parseInt(hex.slice(1),16); return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')'; }
/* Versi lebih gelap dari warna tier, untuk garis tepi & objek terjual. Dengan
   isian solid, tepi harus lebih gelap dari isinya — kalau warnanya sama,
   objek yang berdempetan terbaca sebagai satu blok besar. */
function ldzGelap(hex,f){
  const n=parseInt(hex.slice(1),16), k=(f==null?0.72:f);
  const g=v=>Math.round(v*k);
  return 'rgb('+g((n>>16)&255)+','+g((n>>8)&255)+','+g(n&255)+')';
}
// Versi lebih muda: warna dicampur putih sebanyak f.
function ldzMuda(hex,f){
  const n=parseInt(hex.slice(1),16);
  const c=v=>Math.round(v+(255-v)*f);
  return 'rgb('+c((n>>16)&255)+','+c((n>>8)&255)+','+c(n&255)+')';
}
/* ---- WARNA SATU OBJEK: kategori menentukan RONA, jenis menentukan KEPEKATAN ----
   Kursi dan meja sebelumnya berwarna sama persis — yang membedakan cuma bentuk,
   dan pada denah padat berisi ratusan objek kecil, bentuk saja tidak terbaca
   sekilas. Sekarang KURSI memakai warna kategori penuh (pekat, tulisan putih),
   MEJA memakai versi mudanya dengan tulisan gelap. Ronanya tetap sama, jadi
   kategori tiket tetap terbaca dari warna; yang berubah cuma kepekatannya.

   Objek yang sudah TERJUAL selalu digelapkan, apa pun jenisnya — status uang
   lebih penting daripada perbedaan meja/kursi saat denah dipakai check-in. */
function ldzWarnaObjek(it,warnaTier,terisi){
  const meja=(it&&it.kind==='table');
  if(terisi){
    /* SUDAH TERJUAL / SUDAH CHECK-IN DIPERTEBAL. Angka lamanya (0.85 untuk
       meja) cuma menggelapkan sedikit, jadi meja terjual dan meja kosong
       tingkatan yang sama sulit dibedakan justru pada saat paling dibutuhkan:
       hari-H, di layar terang, sambil orang mengantre. */
    const dasar=meja?ldzGelap(warnaTier,0.55):ldzGelap(warnaTier,0.45);
    return {bg:dasar, tepi:ldzGelap(warnaTier,0.3), teks:'#fff'};
  }
  /* JARAK WARNA MEJA vs KURSI SENGAJA DILEBARKAN. Sebelumnya meja memakai
     0.55 dari warna tingkatannya - masih cukup pekat sehingga di kanvas penuh,
     dari jarak baca normal, meja dan kursi tingkatan yang sama terlihat nyaris
     sama dan orang harus menyorot satu per satu untuk memastikan. Sekarang
     0.82: meja jelas berupa warna pastel, kursi tetap warna penuh. Garis
     tepinya juga dibedakan (meja lebih tua daripada isiannya) supaya bentuknya
     tetap tegas walau isiannya muda. */
  return meja
    ? {bg:ldzMuda(warnaTier,0.82), tepi:ldzGelap(warnaTier,0.85), teks:ldzGelap(warnaTier,0.5)}
    : {bg:warnaTier,               tepi:ldzGelap(warnaTier),      teks:'#fff'};
}
function ldzMeta(eid){
  const d=ensureDetails(eid);
  if(!d.layout||typeof d.layout!=='object'||Array.isArray(d.layout)) d.layout={};
  /* Tiap lantai punya ukuran kanvas & gambar latarnya sendiri — lantai 2 di
     venue ini bentuknya jauh berbeda dari lantai 1. Setelan lantai 1 tetap
     disimpan di akar objek supaya denah lama terbaca apa adanya. */
  if(ldzLantai()==='2'){
    if(!d.layout.f2||typeof d.layout.f2!=='object'||Array.isArray(d.layout.f2)) d.layout.f2={};
    const L2=d.layout.f2;
    L2.w=+L2.w||1200; L2.h=+L2.h||760;
    if(L2.bgOpacity==null) L2.bgOpacity=70;
    if(L2.grid==null) L2.grid=true;
    if(L2.snap==null) L2.snap=true;
    if(!L2.bg) L2.bg=null;
    return L2;
  }
  const L=d.layout;
  L.w=+L.w||1200; L.h=+L.h||760;
  if(L.bgOpacity==null) L.bgOpacity=70;
  if(L.grid==null) L.grid=true;
  if(L.snap==null) L.snap=true;
  if(!L.bg) L.bg=null;
  return L;
}
/* ================= RIWAYAT (UNDO / REDO) =================
   Perancang denah ini sudah punya hampir semua kebiasaan draw.io — seret untuk
   memblok, panah untuk menggeser, Ctrl+A/D, Delete — tapi satu yang paling
   menentukan rasa "aman bereksperimen" belum ada: MEMBATALKAN. Tanpa itu, satu
   Delete yang salah sasaran pada 80 kursi hasil kerja setengah jam tidak bisa
   dikembalikan sama sekali, dan orang jadi enggan mencoba apa pun.

   Caranya sengaja potret utuh, bukan catatan per perubahan: objek denah satu
   event paling banter ratusan baris JSON, jadi menyimpan 60 potret jauh lebih
   murah daripada risiko salah membalik satu operasi. Potret diambil SEBELUM
   perubahan (ldzRekam), jadi Undo mengembalikan keadaan tepat sebelum tindakan
   terakhir. */
let _ldzUndo=[], _ldzRedo=[], _ldzPotretTunda=null;
// Mendaftarkan potret yang sudah diambil lebih dulu (dipakai jalur seret).
function ldzRekamPotret(eid,data){
  if(!data) return;
  _ldzUndo.push({eid:eid,data:data});
  if(_ldzUndo.length>60) _ldzUndo.shift();
  _ldzRedo.length=0;
  ldzTombolRiwayat();
}
function ldzPotret(eid){
  return JSON.stringify({items:ldzItems(eid), L:ldzMeta(eid)});
}
function ldzRekam(eid){
  _ldzUndo.push({eid:eid,data:ldzPotret(eid)});
  if(_ldzUndo.length>60) _ldzUndo.shift();
  _ldzRedo.length=0;              // cabang baru: rekaman "maju" yang lama tak berlaku lagi
  ldzTombolRiwayat();
}
function ldzPulihkan(eid,data){
  const o=JSON.parse(data);
  DB.seats=DB.seats.filter(function(x){ return !(x.event_id===eid && x.zone==='Custom'); }).concat(o.items||[]);
  ensureDetails(eid).layout=o.L||{};
  ldzSetSel(ldzSel().filter(ldzFind));     // objek yang sudah tak ada dilepas dari pilihan
  save(); ldzRepaint(eid);
}
function ldzUndo(){
  const eid=window._ldzEid;
  const r=_ldzUndo.pop(); if(!r){ toast('Tidak ada lagi yang bisa dibatalkan.'); return; }
  _ldzRedo.push({eid:r.eid,data:ldzPotret(r.eid)});
  ldzPulihkan(r.eid,r.data); ldzTombolRiwayat();
  toast('↶ Dibatalkan');
}
function ldzRedoAksi(){
  const r=_ldzRedo.pop(); if(!r){ toast('Tidak ada lagi yang bisa diulangi.'); return; }
  _ldzUndo.push({eid:r.eid,data:ldzPotret(r.eid)});
  ldzPulihkan(r.eid,r.data); ldzTombolRiwayat();
  toast('↷ Diulangi');
}
// Tombolnya dimatikan saat tak ada yang bisa dibatalkan — tombol hidup yang tidak
// melakukan apa-apa membuat orang mengira aplikasinya macet.
function ldzTombolRiwayat(){
  const u=document.getElementById('ldzUndoBtn'), r=document.getElementById('ldzRedoBtn');
  if(u) u.disabled=!_ldzUndo.length;
  if(r) r.disabled=!_ldzRedo.length;
}

/* ================= SALIN & TEMPEL =================
   Ctrl+C / Ctrl+V. Bedanya dengan Gandakan (Ctrl+D): salinan bertahan di papan
   klip, jadi satu blok meja bisa ditempel berkali-kali — dan bisa ditempel di
   denah EVENT LAIN, yang selama ini berarti menggambar ulang dari nol tiap kali
   venue yang sama dipakai acara berbeda. */
let _ldzClip=[];
function ldzSalin(){
  const sel=ldzSelItems();
  if(!sel.length) return toast('Pilih objeknya dulu.');
  _ldzClip=JSON.parse(JSON.stringify(sel));
  toast('⎘ '+sel.length+' objek disalin — Ctrl+V untuk menempel.');
}
function ldzTempel(eid){
  if(!_ldzClip.length) return toast('Papan klip kosong.');
  const L=ldzMeta(eid);
  ldzRekam(eid);
  /* Ditempel relatif terhadap sudut kiri-atas blok aslinya lalu digeser 20px,
     supaya bentuk susunannya utuh dan salinannya tidak menutupi aslinya. */
  let minx=Infinity,miny=Infinity;
  _ldzClip.forEach(function(i){ minx=Math.min(minx,+i.x||0); miny=Math.min(miny,+i.y||0); });
  const n0=ldzItems(eid).length;
  const baru=_ldzClip.map(function(i,k){
    const cls=ldzTierClass(eid,ldzTierNames(eid).indexOf(i.tier)>=0?i.tier:ldzTierAktif(eid));
    const w=+i.w||40, h=+i.h||40;
    return Object.assign({},i,{
      id:uid(), event_id:eid, ticket_class_id:cls.id,
      tier:cls.name,
      table_no:String(n0+k+1), seat_no:n0+k+1, floor:ldzLantai(),
      x:Math.max(0,Math.min(L.w-w,(+i.x||0)-minx+20)),
      y:Math.max(0,Math.min(L.h-h,(+i.y||0)-miny+20)),
      status:'Available'      // salinan selalu kosong: status terjual milik tiket, bukan bentuk
    });
  });
  DB.seats=DB.seats.concat(baru);
  ldzSetSel(baru.map(function(i){ return i.id; }));
  ldzSyncQuota(eid); save(); ldzRepaint(eid);
  toast('✓ '+baru.length+' objek ditempel.');
}

/* ================= GANTI NAMA DI TEMPAT =================
   Klik ganda pada objek langsung membuka kotak ketik di atasnya, seperti
   draw.io. Sebelumnya nomor meja hanya bisa diubah lewat panel kanan — benar,
   tapi jauh: untuk menomori ulang 20 meja, matanya harus bolak-balik antara
   kanvas dan sisi layar sebanyak 20 kali. */
function ldzRename(id){
  if(!window._ldzEdit) return;
  const it=ldzFind(id); if(!it) return;
  const el=document.getElementById('ldz_'+id); if(!el) return;
  const inp=document.createElement('input');
  inp.value=it.table_no||'';
  inp.className='ldz-rename';
  inp.onpointerdown=function(ev){ ev.stopPropagation(); };
  const selesai=function(simpan){
    if(inp._tutup) return; inp._tutup=true;
    if(simpan){
      const v=inp.value.trim();
      if(v!==(it.table_no||'')){ ldzRekam(window._ldzEid); it.table_no=v; save(); }
    }
    ldzRepaint(window._ldzEid);
  };
  inp.onblur=function(){ selesai(true); };
  inp.onkeydown=function(ev){
    ev.stopPropagation();                       // jangan sampai Delete/panah menyentuh kanvas
    if(ev.key==='Enter'){ ev.preventDefault(); selesai(true); }
    if(ev.key==='Escape'){ ev.preventDefault(); selesai(false); }
  };
  el.innerHTML=''; el.appendChild(inp);
  inp.focus(); inp.select();
}
/* ---- DUA LANTAI DALAM SATU EVENT ----
   Venue ini bertingkat, dan tiap lantai punya denah sendiri: lantai bawah
   berisi VIP & Gold di sekitar panggung, lantai atas berisi Reguler & Reguler+.
   Sebelumnya semua objek menumpuk di satu kanvas, jadi menggambar lantai 2
   berarti menyelipkannya di sela-sela lantai 1 — dan pemesanan tidak punya
   cara memberitahu tamu ia duduk di lantai berapa.

   Objek lama yang belum bertanda lantai dianggap Lantai 1: itu yang sudah
   digambar orang selama ini, dan memindahkannya diam-diam ke lantai lain akan
   membuat denah yang sudah jadi tampak kosong. */
/* Panel yang ditutup harus tetap tertutup sesudah kanvas digambar ulang, dan
   itu terjadi belasan kali per menit saat mendesain. localStorage dipakai
   (bukan variabel) supaya pilihannya juga bertahan antar kunjungan halaman —
   orang yang suka bekerja dengan kanvas lebar tidak perlu menutupnya lagi tiap
   kali membuka event. Dibungkus try: localStorage bisa dilarang (mode privat,
   iframe pihak ketiga), dan panel yang tidak bisa ditutup jauh lebih baik
   daripada perancang denah yang mati total. */
function ldzPanelTutup(nama){ try{ return localStorage.getItem('ldzTutup_'+nama)==='1'; }catch(e){ return false; } }

function ldzLantai(){ return window._ldzLantai==='2'?'2':'1'; }

// Seluruh objek kustom event ini, lintas lantai — dipakai rekap & penjualan.
function ldzSemuaItems(eid){ return DB.seats.filter(s=>s.event_id===eid && s.zone==='Custom'); }
// Objek pada lantai yang sedang dibuka — inilah yang digambar & diedit.
function ldzItems(eid){ return ldzSemuaItems(eid).filter(i=>ldzLantaiObjek(i)===ldzLantai()); }
function ldzFind(id){ return DB.seats.find(s=>s.id===id && s.zone==='Custom'); }
/* Tiap tingkatan tiket punya satu ticket class per event — dibuat saat pertama
   kali dipakai, supaya objek denah selalu tersambung ke kelas yang bisa dijual. */
function ldzTierClass(eid,tier){
  let c=DB.ticketClasses.find(x=>x.event_id===eid && x.name===tier);
  if(!c){
    const e=DB.events.find(x=>x.id===eid)||{};
    c={id:uid(),event_id:eid,name:tier,price:0,quota:0,sold:0,
       sale_start:e.start_datetime||'',sale_end:e.start_datetime||'',
       description:'Tingkatan tiket '+tier+' (denah kustom)',benefit:tier,is_seated:true};
    DB.ticketClasses.push(c);
  }
  return c;
}
// Kuota kelas mengikuti isi denah: 1 kursi = 1, 1 meja = kapasitas mejanya.
function ldzSyncQuota(eid){
  const its=ldzItems(eid);
  LDZ_TIER_NAMES.forEach(t=>{
    const mine=its.filter(i=>i.tier===t);
    if(!mine.length) return;
    const c=ldzTierClass(eid,t);
    const dariDenah=mine.reduce((a,i)=>a+(+i.capacity||1),0);
    /* KUOTA TIDAK BOLEH TURUN DI BAWAH YANG SUDAH TERJUAL. Denah bisa dirombak
       kapan saja, termasuk sesudah tiket beredar — dan kuota 50 untuk kelas
       yang sudah menjual 80 membuat setiap layar yang membandingkan keduanya
       melaporkan hal yang mustahil ("80 dari 50 terjual", keterisian 160%),
       tanpa ada yang gagal sehingga tidak ada yang menyadarinya. */
    c.quota=Math.max(dariDenah, +c.sold||0);
  });
}
/* ---- MEMASANG DENAH BARU KE SATU LANTAI ----
   Dulu kedua jalur pemasangan (Denah Bawaan LM & Muat Template) langsung
   `DB.seats.concat(baru)`. Menekan tombolnya dua kali menghasilkan denah
   BERLIPAT — 90 objek jadi 180 — bertumpuk persis di koordinat yang sama
   sehingga di layar nyaris tidak kelihatan, sementara ldzSyncQuota menaikkan
   kuota kelasnya jadi dua kali lipat. Yang ketahuan belakangan cuma angka
   kuota yang tidak masuk akal, jauh sesudah tiketnya dijual.

   Sekarang memasang denah berarti MENGGANTI isi lantai itu, dan penggantinya
   ditawarkan lebih dulu — bukan dilakukan diam-diam.

   Objek yang tiketnya SUDAH TERJUAL tidak pernah ikut dihapus. Membuangnya
   akan memutus `tickets.seat_id` dari kursinya: barcode yang sudah di tangan
   tamu kehilangan tempat duduknya, dan tidak ada layar yang bisa memulihkan
   pasangan itu. Sisanya dilaporkan apa adanya di toast. */
function ldzPasangKeLantai(eid, baru, sumber, sesudah){
  const lama=ldzItems(eid);
  const pasang=function(ganti){
    ldzRekam(eid);
    let disisakan=0;
    if(ganti && lama.length){
      const buang={};
      lama.forEach(function(i){
        if(ldzTerjual(i)){ disisakan++; return; }   // sudah ada tiketnya: jangan disentuh
        buang[i.id]=1;
      });
      DB.seats=DB.seats.filter(function(s){ return !buang[s.id]; });
    }
    DB.seats=DB.seats.concat(baru);
    ldzSyncQuota(eid); save();
    if(typeof sesudah==='function') sesudah(disisakan);
  };
  if(!lama.length) return pasang(false);
  modal('<button class="close" onclick="closeModal()">&times;</button>'
   +'<h3>Lantai '+ldzLantai()+' sudah berisi denah</h3>'
   +'<p class="mini" style="margin-bottom:12px">Lantai ini sudah punya <b>'+lama.length+' objek</b>. '
   +sumber+' akan menambahkan <b>'+baru.length+' objek</b> lagi.</p>'
   +'<div class="kv" style="margin-bottom:14px">'
     +'<div class="k">Ganti</div><div>Denah lama dihapus, diganti yang baru. '
       +'Objek yang tiketnya sudah terjual tetap dipertahankan.</div>'
     +'<div class="k">Tambahkan</div><div>Keduanya berdiri bersamaan — jadi <b>'
       +(lama.length+baru.length)+' objek</b>. Hampir selalu bukan yang dimaksud: '
       +'objeknya bertumpuk di koordinat yang sama dan kuota kelasnya ikut berlipat.</div>'
   +'</div>'
   +'<div class="modal-actions">'
     +'<button class="btn ghost" onclick="closeModal()">Batal</button>'
     +'<button class="btn ghost" onclick="closeModal();window._ldzPasang(false)">Tambahkan saja</button>'
     +'<button class="btn" onclick="closeModal();window._ldzPasang(true)">Ganti denah lantai ini</button>'
   +'</div>');
  window._ldzPasang=pasang;
}
function ldzCap(eid){ return ldzItems(eid).filter(function(i){ return !ldzAdalahArea(i); }).reduce((a,i)=>a+(+i.capacity||1),0); }
function ldzTerjual(it){ return DB.tickets.some(t=>t.seat_id===it.id && t.status!=='Cancelled'); }

function ldzSel(){ if(!Array.isArray(window._ldzSelIds)) window._ldzSelIds=[]; return window._ldzSelIds; }
function ldzIsSel(id){ return ldzSel().indexOf(id)>=0; }
function ldzSetSel(ids){ window._ldzSelIds=(ids||[]).slice(); }

function ldzBBox(items){
  if(!items.length) return null;
  let x1=Infinity,y1=Infinity,x2=-Infinity,y2=-Infinity;
  items.forEach(i=>{ x1=Math.min(x1,+i.x||0); y1=Math.min(y1,+i.y||0);
                     x2=Math.max(x2,(+i.x||0)+(+i.w||LDZ_MIN)); y2=Math.max(y2,(+i.y||0)+(+i.h||LDZ_MIN)); });
  return {x:x1,y:y1,w:x2-x1,h:y2-y1};
}
function ldzZoom(){ const z=+window._ldzZoom; return (z&&z>0)?z:1; }

/* ---------- menambah objek ---------- */
function ldzUkuranBaku(kind,shape){
  // Area bawaannya besar: ia menandai RUANG, bukan satu tempat duduk.
  if(kind==='area') return {w:180,h:90};
  if(kind==='table') return shape==='circle'?{w:96,h:96}:{w:110,h:70};
  return {w:40,h:40};
}
function ldzBuat(eid,kind,shape,x,y){
  ldzRekam(eid);
  const L=ldzMeta(eid), n=ldzItems(eid).length;
  // Tingkatan yang dipakai objek baru harus salah satu kelas tiket event ini;

  const tier=ldzTierAktif(eid);

  const g=L.snap?10:1;
  const it={id:uid(),event_id:eid,ticket_class_id:cls.id,zone:'Custom',
    /* Nomor objek = angka polos mulai dari 1. Awalan K/M dulu dipakai untuk
       membedakan kursi dan meja, tapi sekarang bedanya sudah terlihat dari
       warna dan bentuk — sementara awalan itu ikut tercetak di e-ticket dan
       terbaca petugas sebagai bagian dari nomor kursinya ("K12" padahal
       tamunya mencari meja 12). */
    kind,shape,tier,floor:ldzLantai(),table_no:String(n+1),seat_no:n+1,
    capacity:kind==='area'?0:(kind==='table'?6:1),
    x:Math.max(0,Math.min(L.w-u.w,Math.round((x-u.w/2)/g)*g)),
    y:Math.max(0,Math.min(L.h-u.h,Math.round((y-u.h/2)/g)*g)),
    w:u.w,h:u.h,status:'Available'};

function ldzDuplicate(eid){

/* Objek yang kursinya SUDAH terjual tidak boleh dihapus — itu memutus tiket
   yang sudah dipegang pembeli; lepasnya lewat Refund, sama seperti toggleSeat. */
function ldzDelete(eid){
  ldzRekam(eid);
  const sel=ldzSelItems(); if(!sel.length) return toast('Pilih dulu objek yang mau dihapus.');
  const terkunci=sel.filter(ldzTerjual);
  const boleh=sel.filter(i=>!ldzTerjual(i));
  if(!boleh.length) return toast('Semua yang dipilih sudah terjual — lepas lewat Refund dulu.');
  const buang=boleh.map(i=>i.id);
  DB.seats=DB.seats.filter(s=>buang.indexOf(s.id)<0);
  ldzSetSel(terkunci.map(i=>i.id));
  ldzSyncQuota(eid); save(); ldzRepaint(eid);
  if(terkunci.length) toast(terkunci.length+' objek dipertahankan karena sudah terjual.');
}
function ldzClear(eid){

  const sisa=its.filter(ldzTerjual).map(i=>i.id);
  DB.seats=DB.seats.filter(s=>!(s.event_id===eid && s.zone==='Custom') || sisa.indexOf(s.id)>=0);

/* ---------- menggambar ---------- */

  else { aksi=' onclick="toggleSeat(\''+it.event_id+'\',\''+it.id+'\')"'; sty+='cursor:pointer;'; }
  // Ambang 26px: di bawah itu tiga angka tidak muat pada font normal.
  const kecil=((+it.w||40)<=26||(+it.h||40)<=26)?' kecil':'';
  /* data-tier dipasang supaya halaman rincian per kategori bisa MEREDUPKAN
     yang bukan kategorinya lewat CSS saja — tanpa menggambar ulang denah
     dengan aturan berbeda, yang berarti dua penggambar untuk satu denah dan
     salah satunya pasti tertinggal saat bentuk objeknya berubah. */
  return '<div class="ldz-item '+it.shape+' '+st+(edit?' edit':'')+sel+kecil+'" id="ldz_'+it.id+'"'
    +' data-tier="'+esc(it.tier||'')+'" style="'+sty+'" title="'+esc(judul)+'"'+aksi+'>'
    +esc(it.table_no||'')+cap+'</div>';
}
// Kotak pilihan + 8 pegangan. Ukuran pegangan dibagi zoom supaya tetap enak
// ditekan baik saat kanvas diperkecil maupun diperbesar.
function ldzSelBoxHTML(){
  const items=ldzSelItems(); const b=ldzBBox(items); if(!b) return '';
  const z=ldzZoom(), s=Math.max(6,Math.round(9/z)), o=-s/2, bw=Math.max(1,1/z);
  const dirs=[['nw',0,0],['n',.5,0],['ne',1,0],['w',0,.5],['e',1,.5],['sw',0,1],['s',.5,1],['se',1,1]];
  return '<div class="ldz-selbox" style="left:'+b.x+'px;top:'+b.y+'px;width:'+b.w+'px;height:'+b.h+'px;border-width:'+bw+'px">'
    +dirs.map(function(d){
      return '<i class="ldz-h h-'+d[0]+'" style="width:'+s+'px;height:'+s+'px;left:'+(b.w*d[1]+o)+'px;top:'+(b.h*d[2]+o)+'px;border-width:'+bw+'px"'
        +' onpointerdown="ldzDown(event,null,\'size:'+d[0]+'\')"></i>';
    }).join('')+'</div>';

/* Blok-seret berlaku di DUA keadaan: menyusun denah (Mode Desain) dan memilih
   kursi untuk dipesan (Mode Jual). Menyeret di ruang KOSONG tidak punya arti
   lain di keadaan mana pun, jadi tidak ada yang dikorbankan — sementara
   memblok enam kursi sekaligus lalu menekan Booking adalah cara paling cepat
   melayani rombongan. */
/* ---- JENIS OBJEK "AREA": zona berlabel yang TIDAK dijual ----
   Denah venue tidak seluruhnya berisi kursi: ada panggung, meja DJ, ruang
   talent, tangga, dan yang paling penting zona REGULER yang memang dijual
   tanpa nomor kursi. Sebelumnya hanya ada kursi & meja, jadi hal-hal itu tidak
   bisa digambar sama sekali \u2014 padahal tanpa panggung, petugas tidak bisa
   membaca arah hadap denah.

   Area sengaja tidak punya kapasitas dan tidak pernah bisa dipesan: ia penanda
   ruang, bukan tempat duduk bernomor. Kuota zona reguler tetap diatur sebagai
   kelas tiket non-seated di tab Kelas Tiket. */
function ldzAdalahArea(it){ return !!it && it.kind==='area'; }
/* ---- WARNA PER JENIS RUANG ----
   Semua area dulu abu-abu sama rata, jadi panggung, tangga, ruang talent, dan
   zona reguler tidak bisa dibedakan tanpa membaca tulisannya satu-satu — padahal
   denah dipakai justru untuk membaca ruangan dalam sekali lihat.

   Warnanya dipilih dari maknanya, bukan sekadar supaya beda: panggung gelap
   (pusat perhatian, bukan tempat dijual), pintu masuk oranye seperti rambu
   keluar-masuk di denah cetak, tangga cokelat kayu, ruang talent ungu (area
   tertutup), zona reguler biru baja (dijual, tapi tanpa nomor), void nyaris
   putih karena ia memang lubang lantai. EXT memakai kuning bergaris merah,
   persis penandaan di denah cetak.

   Dicocokkan dari LABELNYA, jadi denah yang sudah digambar sebelum ini pun ikut
   berwarna tanpa perlu diapa-apakan. Satu objek boleh memakai warnanya sendiri
   lewat field `warna` — itu yang diisi pemilih warna di panel kanan. */
const LDZ_RUANG=[
  [/^stage$|panggung/i,        {bg:'#3f4a5a', tepi:'#2b3340'}],
  [/^meja ?dj$/i,              {bg:'#a9791f', tepi:'#7a560f'}],
  [/talent/i,                  {bg:'#6d5aa8', tepi:'#4e3f80'}],
  [/entrance|masuk|keluar/i,   {bg:'#e08a1e', tepi:'#a86212'}],
  [/tangga/i,                  {bg:'#8a6242', tepi:'#63452e'}],
  [/operator|foh/i,            {bg:'#2f3a4a', tepi:'#1d2530'}],
  [/^void/i,                   {bg:'#eceae4', tepi:'#c9c4b8'}],
  [/reguler|regular/i,         {bg:'#5b7fa6', tepi:'#3f5d7d'}],
  [/^ext/i,                    {bg:'#f2c14e', tepi:'#c9432b'}]
];
// Tulisan hitam atau putih, dipilih dari kecerahan latarnya sendiri supaya
// kontrasnya aman tanpa perlu diatur satu-satu.
function ldzTeksKontras(hex){
  const n=parseInt(String(hex).replace('#',''),16);
  const L=(0.299*((n>>16)&255)+0.587*((n>>8)&255)+0.114*(n&255))/255;
  return L>0.62?'#241f18':'#fff';
}
function ldzWarnaRuang(it){
  if(!it) return null;
  if(it.warna) return {bg:it.warna, tepi:ldzGelap(it.warna,0.7), teks:ldzTeksKontras(it.warna)};
  const lbl=String(it.table_no||'');
  for(let i=0;i<LDZ_RUANG.length;i++){
    if(LDZ_RUANG[i][0].test(lbl)){
      const w=LDZ_RUANG[i][1];
      return {bg:w.bg, tepi:w.tepi, teks:ldzTeksKontras(w.bg)};
    }
  }
  return null;
}
function ldzBolehBlok(){ return !!window._ldzEdit || ldzJualAktif(); }
function ldzCanvasInner(eid,edit){
  const L=ldzMeta(eid), its=ldzItems(eid);
  const bg=L.bg?'<div class="ldz-bg" style="background-image:url(\''+fileUrl(L.bg.key)+'\');opacity:'+((+L.bgOpacity||70)/100)+'"></div>':'';
  return bg+its.map(function(i){ return ldzItemHTML(i,edit); }).join('')
    +(edit?ldzSelBoxHTML():'')
    /* Kotak seleksi perlu wadah kosong untuk digambar. Tanpa ini seretan tetap
       memilih objek tapi tidak menampilkan apa pun, dan itu terbaca sebagai
       "fiturnya tidak jalan". */
    +(ldzBolehBlok()?'<div id="ldzMarquee"></div>':'');
}
function ldzCanvasHTML(eid,edit){
  const L=ldzMeta(eid);
  /* Versi ringkas kanvas ini dipakai halaman Penjualan & Check-In, dan DULU
     sama sekali tidak memasang penangan pointer — jadi di Mode Jual, menyeret
     di kanvas tidak terjadi apa-apa. Yang punya penangan hanya kanvas di dalam
     perancang denah; itu sebabnya blok-seret terasa cuma jalan kadang-kadang. */
  const aksi=ldzBolehBlok()?' onpointerdown="ldzCanvasDown(event)"':'';
  const tandai=ldzBolehBlok()?' bisa-blok':'';
  return '<div class="ldz-wrap"><div id="ldzCanvas" class="ldz-canvas'+(L.grid?' grid':'')+tandai+'"'+aksi+' '
    +'style="position:relative;width:'+L.w+'px;height:'+L.h+'px">'+ldzCanvasInner(eid,edit)+'</div></div>';
}
/* Menggambar ulang SATU objek tanpa menyentuh sisa kanvas. Dipakai jalur yang
   berjalan tiap gerakan pointer, jadi harus semurah mungkin: yang diubah cuma
   empat properti gaya, bukan innerHTML.

   Kedua fungsi ini pernah TERHAPUS oleh penggantian blok saat menggarap
   blok-seret — dan akibatnya tiap geseran objek melempar ReferenceError pada
   gerakan pointer pertama, sehingga objeknya terasa berat dan tidak mau
   dipindahkan. Uji blok-seret tidak menangkapnya karena marquee memang tidak
   memanggil keduanya. */
function ldzPaintItem(it){
  const el=document.getElementById('ldz_'+it.id); if(!el) return;
  el.style.left=(+it.x||0)+'px'; el.style.top=(+it.y||0)+'px';
  el.style.width=(+it.w||40)+'px'; el.style.height=(+it.h||40)+'px';
}
function ldzPaintSel(){
  const box=document.getElementById('ldzCanvas'); if(!box) return;
  const old=box.querySelector('.ldz-selbox'); if(old) old.remove();
  const html=ldzSelBoxHTML();
  if(html) box.insertAdjacentHTML('beforeend',html);
}
function ldzPt(e){
  const cv=document.getElementById('ldzCanvas'); if(!cv) return {x:0,y:0};
  const r=cv.getBoundingClientRect(), z=ldzZoom();
  return {x:(e.clientX-r.left)/z, y:(e.clientY-r.top)/z};
}
function ldzSnap(v,L){ const g=L.snap?10:1; return Math.round(v/g)*g; }
/* ================= GARIS BANTU PERATAAN (SMART GUIDES) =================
   Inilah yang membuat draw.io terasa "pas sendiri": saat sebuah objek diseret
   dan tepinya hampir sejajar dengan objek lain, posisinya ditarik agar benar-
   benar sejajar, dan garis tipis muncul menunjukkan sejajar dengan apa.

   Kenapa ini lebih penting daripada snap-ke-grid yang sudah ada: grid 10px
   hanya menjamin objek jatuh di kelipatan 10, bukan bahwa meja baris kedua
   lurus dengan meja baris pertama. Denah venue penuh dengan barisan yang harus
   lurus, dan meluruskannya dengan mata pada zoom 40% mustahil.

   Ambangnya dihitung dalam piksel LAYAR (dibagi zoom), supaya rasa "menempel"
   sama saat kanvas diperbesar maupun diperkecil. */
const LDZ_TARIK=6;
/* Dua elemen garis bantu dibuat SEKALI lalu disembunyikan/digeser. Versi
   sebelumnya menghapus dan membuat ulang elemen tiap gerakan pointer; pada
   denah padat, kelahiran-kematian elemen itu yang terasa sebagai tersendat. */
function ldzGuideEl(arah){
  const c=document.getElementById('ldzCanvas'); if(!c) return null;
  const id='ldzGuide'+arah;
  let g=document.getElementById(id);
  if(!g){ g=document.createElement('div'); g.id=id; g.className='ldz-guide '+arah; c.appendChild(g); }
  return g;
}
function ldzGuideBersih(){
  ['v','h'].forEach(function(a){
    const g=document.getElementById('ldzGuide'+a);
    if(g) g.style.display='none';
  });
}
function ldzGuideGambar(vs,hs){
  const gv=ldzGuideEl('v'), gh=ldzGuideEl('h');
  if(gv){ if(vs.length){ gv.style.display='block'; gv.style.left=vs[0]+'px'; } else gv.style.display='none'; }
  if(gh){ if(hs.length){ gh.style.display='block'; gh.style.top=hs[0]+'px'; } else gh.style.display='none'; }
}
/* Menghitung pergeseran tambahan supaya blok yang sedang diseret menempel ke
   objek lain. Yang dibandingkan tiga garis per sumbu — tepi awal, tengah, tepi
   akhir — jadi objek bisa rata kiri, rata tengah, ataupun rata kanan. */
function ldzTarikSejajar(eid,box,abaikan){
  const amb=LDZ_TARIK/ldzZoom();
  /* SELURUH objek tetap jadi acuan, termasuk yang jauh di atas atau di samping:
     meluruskan meja baris ke-4 dengan baris pertama justru pekerjaan yang paling
     butuh bantuan ini, dan membatasinya dengan radius membuat perataan berhenti
     bekerja tepat saat paling dibutuhkan.

     Sebelumnya sempat saya batasi radius 260px karena menyangka bantuan inilah
     yang membuat objek "susah dipindahkan". Ternyata sebabnya lain dan jauh
     lebih parah: ldzPaintItem/ldzPaintSel terhapus, jadi setiap gerakan pointer
     melempar ReferenceError dan objeknya tidak pernah bergerak. */
  const lain=ldzItems(eid).filter(function(i){ return abaikan.indexOf(i.id)<0; });
  const garisX=[], garisY=[];
  lain.forEach(function(i){
    const x=+i.x||0, y=+i.y||0, w=+i.w||0, h=+i.h||0;
    garisX.push(x, x+w/2, x+w);
    garisY.push(y, y+h/2, y+h);
  });
  const cari=function(nilai,garis){
    let best=null;
    nilai.forEach(function(v){
      garis.forEach(function(g){
        const d=g-v;
        if(Math.abs(d)<=amb && (!best||Math.abs(d)<Math.abs(best.d))) best={d:d,g:g};
      });
    });
    return best;
  };
  const bx=cari([box.x,box.x+box.w/2,box.x+box.w],garisX);
  const by=cari([box.y,box.y+box.h/2,box.y+box.h],garisY);
  return {dx:bx?bx.d:0, dy:by?by.d:0,
          vs:bx?[bx.g]:[], hs:by?[by.g]:[]};
}
function ldzDown(e,id,mode){
  /* Potret riwayat DITUNDA sampai objeknya benar-benar bergeser (lihat ldzUp).
     Sebelumnya diambil di setiap pointerdown — termasuk saat cuma MEMILIH objek
     — dan tiap potret men-stringify seluruh objek lantai itu. Di denah 264
     objek, sekadar mengklik pun ikut membayar biaya itu. */
  if(window._ldzEdit) _ldzPotretTunda=ldzPotret(window._ldzEid);
  if(!window._ldzEdit) return;
  e.preventDefault(); e.stopPropagation();
  const eid=window._ldzEid, L=ldzMeta(eid);
  if(mode==='move'){
    // Klik objek yang belum terpilih = pilih dia saja (kecuali Shift/Ctrl,
    // yang menambah ke pilihan) — perilaku yang sama dengan draw.io.
    if(e.shiftKey||e.ctrlKey||e.metaKey){
      const s=ldzSel().slice(), i=s.indexOf(id);
      if(i>=0) s.splice(i,1); else s.push(id);
      ldzSetSel(s); ldzRepaint(eid);
      if(!ldzIsSel(id)) return;                 // baru saja dilepas → jangan ikut digeser
    } else if(!ldzIsSel(id)){
      ldzSetSel([id]); ldzRepaint(eid);
    }
    const items=ldzSelItems();
    _ldzDrag={mode:'move',sx:e.clientX,sy:e.clientY,moved:false,L,
      asal:items.map(function(i){ return {id:i.id,x:+i.x||0,y:+i.y||0}; })};
  } else if(mode.indexOf('size:')===0){
    const items=ldzSelItems(), b=ldzBBox(items); if(!b) return;
    _ldzDrag={mode:'size',dir:mode.slice(5),sx:e.clientX,sy:e.clientY,moved:false,L,b0:b,
      asal:items.map(function(i){ return {id:i.id,x:+i.x||0,y:+i.y||0,w:+i.w||LDZ_MIN,h:+i.h||LDZ_MIN}; })};
  }
  window.addEventListener('pointermove',ldzMove);
  window.addEventListener('pointerup',ldzUp);
}
// Seret di area kosong = kotak seleksi. Tanpa Shift, pilihan lama diganti.
function ldzCanvasDown(e,dariPanggung){
  if(!ldzBolehBlok()){
    /* Diam-diam tidak melakukan apa pun adalah jawaban terburuk: orang mengira
       fiturnya rusak, bukan bahwa modenya belum dinyalakan. Diberitahu sekali
       saja per halaman supaya tidak jadi gangguan. */
    if(!window._ldzPernahIngat){
      window._ldzPernahIngat=true;
      toast('Nyalakan Mode Desain (atau Pilih Kursi di Denah) dulu untuk memblok dengan seret.');
    }
    return;
  }
  const t=e.target;
  const bolehMulai = dariPanggung || !t
    || t.id==='ldzCanvas'
    || (t.classList && (t.classList.contains('ldz-bg')||t.classList.contains('ldz-sizer')||t.classList.contains('ldz-stage')));
  if(!bolehMulai) return;
  // Menaruh bentuk dari palet lewat sekali klik (mode "armed").
  if(window._ldzArm){
    const p=ldzPt(e), a=window._ldzArm; window._ldzArm=null;
    const st=document.getElementById('ldzStage'); if(st) st.classList.remove('placing');
    ldzBuat(window._ldzEid,a.kind,a.shape,p.x,p.y);
    return;
  }
  e.preventDefault();
  const p=ldzPt(e);
  const jual=ldzJualAktif();
  _ldzDrag={mode:'marquee',jual:jual,sx:e.clientX,sy:e.clientY,x0:p.x,y0:p.y,moved:false,
    tambah:(e.shiftKey||e.ctrlKey||e.metaKey),awal:(jual?beliSel():ldzSel()).slice()};
  /* Pointer capture: seluruh pointermove & pointerup berikutnya dijamin sampai
     ke elemen ini, bahkan kalau kursornya keluar dari kanvas atau melewati
     objek lain di tengah seretan. Tanpa ini, seretan yang keluar dari area
     kanvas bisa "putus" di tengah jalan dan seleksinya berhenti separuh. */
  try{ if(e.pointerId!=null && e.currentTarget && e.currentTarget.setPointerCapture)
         e.currentTarget.setPointerCapture(e.pointerId); }catch(_){}
  window.addEventListener('pointermove',ldzMove);
  window.addEventListener('pointerup',ldzUp);
  // pointercancel (mis. browser mengambil alih untuk gulir) harus ikut menutup
  // seretan; kalau tidak, _ldzDrag menggantung dan klik berikutnya kacau.
  window.addEventListener('pointercancel',ldzUp);
}
function ldzMove(e){
  if(!_ldzDrag) return;
  const z=ldzZoom();
  const dx=(e.clientX-_ldzDrag.sx)/z, dy=(e.clientY-_ldzDrag.sy)/z;
  if(Math.abs(e.clientX-_ldzDrag.sx)>2||Math.abs(e.clientY-_ldzDrag.sy)>2) _ldzDrag.moved=true;

  if(_ldzDrag.mode==='move'){
    const L=_ldzDrag.L;
    // Digeser sebagai SATU kelompok: pergeseran dihitung dari kotak pilihan,
    // bukan per objek, supaya jarak antar objek tidak berubah saat dibatasi
    // tepi kanvas.
    let gx=ldzSnap(dx,L), gy=ldzSnap(dy,L);
    let minx=Infinity,miny=Infinity,maxx=-Infinity,maxy=-Infinity;
    _ldzDrag.asal.forEach(function(a){
      const it=ldzFind(a.id); if(!it) return;
      minx=Math.min(minx,a.x); miny=Math.min(miny,a.y);
      maxx=Math.max(maxx,a.x+(+it.w||LDZ_MIN)); maxy=Math.max(maxy,a.y+(+it.h||LDZ_MIN));
    });
    gx=Math.max(-minx,Math.min(L.w-maxx,gx));
    gy=Math.max(-miny,Math.min(L.h-maxy,gy));
    /* Tarik-sejajar dijalankan SESUDAH pembatasan tepi kanvas, dan hasilnya
       dibatasi ulang — kalau tidak, tarikan bisa mendorong blok keluar kanvas
       tepat di pinggir. Alt menahan tarikan, kebiasaan yang sama dengan
       aplikasi gambar lain: kadang justru sengaja ingin sedikit meleset. */
    let vs=[], hs=[];
    if(!e.altKey){
      const ids=_ldzDrag.asal.map(function(a){ return a.id; });
      const t=ldzTarikSejajar(window._ldzEid,{x:minx+gx,y:miny+gy,w:maxx-minx,h:maxy-miny},ids);
      if(t.dx){ const g2=Math.max(-minx,Math.min(L.w-maxx,gx+t.dx)); if(g2!==gx){ gx=g2; vs=t.vs; } }
      if(t.dy){ const g3=Math.max(-miny,Math.min(L.h-maxy,gy+t.dy)); if(g3!==gy){ gy=g3; hs=t.hs; } }
    }
    ldzGuideGambar(vs,hs);
    _ldzDrag.asal.forEach(function(a){
      const it=ldzFind(a.id); if(!it) return;
      it.x=a.x+gx; it.y=a.y+gy; ldzPaintItem(it);
    });
    ldzPaintSel();

  } else if(_ldzDrag.mode==='size'){
    const b0=_ldzDrag.b0, d=_ldzDrag.dir, L=_ldzDrag.L;
    let x=b0.x,y=b0.y,w=b0.w,h=b0.h;
    if(d.indexOf('e')>=0) w=b0.w+dx;
    if(d.indexOf('s')>=0) h=b0.h+dy;
    if(d.indexOf('w')>=0){ x=b0.x+dx; w=b0.w-dx; }
    if(d.indexOf('n')>=0){ y=b0.y+dy; h=b0.h-dy; }
    // Shift = jaga rasio (sudut saja; sisi tunggal tidak punya rasio berarti).
    if(e.shiftKey && d.length===2 && b0.w>0 && b0.h>0){
      const f=Math.max(w/b0.w,h/b0.h);
      const nw=b0.w*f, nh=b0.h*f;
      if(d.indexOf('w')>=0) x=b0.x+b0.w-nw;
      if(d.indexOf('n')>=0) y=b0.y+b0.h-nh;
      w=nw; h=nh;
    }
    if(L.snap){ x=ldzSnap(x,L); y=ldzSnap(y,L); w=ldzSnap(w,L); h=ldzSnap(h,L); }
    if(w<LDZ_MIN){ if(d.indexOf('w')>=0) x=b0.x+b0.w-LDZ_MIN; w=LDZ_MIN; }
    if(h<LDZ_MIN){ if(d.indexOf('n')>=0) y=b0.y+b0.h-LDZ_MIN; h=LDZ_MIN; }
    const sx=b0.w?w/b0.w:1, sy=b0.h?h/b0.h:1;
    _ldzDrag.asal.forEach(function(a){
      const it=ldzFind(a.id); if(!it) return;
      it.x=Math.round(x+(a.x-b0.x)*sx);
      it.y=Math.round(y+(a.y-b0.y)*sy);
      it.w=Math.max(LDZ_MIN,Math.round(a.w*sx));
      it.h=Math.max(LDZ_MIN,Math.round(a.h*sy));
      ldzPaintItem(it);
    });
    ldzPaintSel();

  } else if(_ldzDrag.mode==='marquee'){
    const p=ldzPt(e);
    const r={x:Math.min(_ldzDrag.x0,p.x),y:Math.min(_ldzDrag.y0,p.y),
             w:Math.abs(p.x-_ldzDrag.x0),h:Math.abs(p.y-_ldzDrag.y0)};
    /* Kotak seleksi cukup DIGESER lewat style. Versi sebelumnya menulis
       outerHTML tiap gerakan pointer — artinya elemen dibongkar dan dipasang
       ulang puluhan kali per detik, dan di denah padat itu terasa sebagai
       tersendat saat menyeret. */
    const box=document.getElementById('ldzMarquee');
    if(box){
      if(!box.classList.contains('ldz-marquee')) box.className='ldz-marquee';
      box.style.left=r.x+'px'; box.style.top=r.y+'px';
      box.style.width=r.w+'px'; box.style.height=r.h+'px';
    }
    // Bersinggungan (bukan harus termuat penuh) — lebih memaafkan saat menyapu
    // barisan kursi rapat.
    let kena=ldzItems(window._ldzEid).filter(function(i){
      return !((+i.x||0)>r.x+r.w || (+i.x||0)+(+i.w||0)<r.x || (+i.y||0)>r.y+r.h || (+i.y||0)+(+i.h||0)<r.y);
    });
    // Di Mode Jual yang boleh masuk pilihan hanya kursi yang MASIH BISA dijual;
    // menyapu kursi terjual lalu menemukannya ditolak saat simpan jauh lebih
    // menjengkelkan daripada tidak pernah ikut terpilih sejak awal.
    if(_ldzDrag.jual) kena=kena.filter(beliBisaDipilih);
    const ids=kena.map(function(i){ return i.id; });
    const gabung=_ldzDrag.tambah?_ldzDrag.awal.concat(ids.filter(function(k){ return _ldzDrag.awal.indexOf(k)<0; })):ids;
    /* Hanya objek yang BERUBAH status pilihannya disentuh. Sebelumnya seluruh
       objek di lantai itu di-toggle tiap gerakan pointer: pada 264 objek berarti
       264 operasi DOM per gerakan, puluhan kali per detik — itu sumber utama
       delay saat memblok di denah penuh. */
    const sblm=_ldzDrag.terpilih||[];
    const masuk=gabung.filter(function(k){ return sblm.indexOf(k)<0; });
    const keluar=sblm.filter(function(k){ return gabung.indexOf(k)<0; });
    _ldzDrag.terpilih=gabung.slice();
    if(_ldzDrag.jual){
      beliSetSel(gabung);
      masuk.forEach(function(id){ const el=document.getElementById('ldz_'+id); if(el) el.style.boxShadow='0 0 0 3px var(--accent)'; });
      keluar.forEach(function(id){ const el=document.getElementById('ldz_'+id); if(el) el.style.boxShadow=''; });
    } else {
      ldzSetSel(gabung);
      masuk.forEach(function(id){ const el=document.getElementById('ldz_'+id); if(el) el.classList.add('sel'); });
      keluar.forEach(function(id){ const el=document.getElementById('ldz_'+id); if(el) el.classList.remove('sel'); });
    }
  }
}
function ldzUp(){
  window.removeEventListener('pointermove',ldzMove);
  window.removeEventListener('pointerup',ldzUp);
  window.removeEventListener('pointercancel',ldzUp);
  if(!_ldzDrag) return;
  const d=_ldzDrag; _ldzDrag=null;
  const eid=window._ldzEid;
  ldzGuideBersih();
  if(d.mode==='marquee'){
    const m=document.getElementById('ldzMarquee');
    if(m) m.outerHTML='<div id="ldzMarquee"></div>';
    if(d.jual){
      if(!d.moved) beliSetSel(d.tambah?d.awal:[]);   // klik biasa di ruang kosong = lepas pilihan
      renderTicketDetail(eid);                       // bar "n kursi · Booking" ikut diperbarui
      return;
    }
    if(!d.moved) ldzSetSel(d.tambah?d.awal:[]);
    ldzRepaint(eid);
    return;
  }
  if(d.moved){
    // Baru sekarang perubahannya sah masuk riwayat: klik tanpa geser bukan
    // langkah yang perlu dibatalkan.
    ldzRekamPotret(eid,_ldzPotretTunda);
    save(); ldzSideRefresh(eid);
  }
  _ldzPotretTunda=null;
  ldzPaintSel();
}

/* ---------- palet: seret bentuk ke kanvas ---------- */
let _ldzPal=null;
function ldzPalDown(e,kind,shape){
  if(!window._ldzEdit) return;
  e.preventDefault();
  const u=ldzUkuranBaku(kind,shape), z=ldzZoom();
  _ldzPal={kind,shape,u,moved:false,sx:e.clientX,sy:e.clientY};
  const g=document.createElement('div');
  g.className='ldz-ghost'+(shape==='circle'?' circle':'');
  g.style.width=(u.w*z)+'px'; g.style.height=(u.h*z)+'px';
  g.style.left=(e.clientX-u.w*z/2)+'px'; g.style.top=(e.clientY-u.h*z/2)+'px';
  g.id='ldzGhost'; document.body.appendChild(g);
  window.addEventListener('pointermove',ldzPalMove);
  window.addEventListener('pointerup',ldzPalUp);
}
function ldzPalMove(e){
  if(!_ldzPal) return;
  if(Math.abs(e.clientX-_ldzPal.sx)>3||Math.abs(e.clientY-_ldzPal.sy)>3) _ldzPal.moved=true;
  const g=document.getElementById('ldzGhost'); if(!g) return;
  const z=ldzZoom();
  g.style.left=(e.clientX-_ldzPal.u.w*z/2)+'px';
  g.style.top=(e.clientY-_ldzPal.u.h*z/2)+'px';
}
function ldzPalUp(e){
  window.removeEventListener('pointermove',ldzPalMove);
  window.removeEventListener('pointerup',ldzPalUp);
  const g=document.getElementById('ldzGhost'); if(g) g.remove();
  if(!_ldzPal) return;
  const pal=_ldzPal; _ldzPal=null;
  const cv=document.getElementById('ldzCanvas'); if(!cv) return;
  const r=cv.getBoundingClientRect();
  const di=e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;
  if(di){ const p=ldzPt(e); ldzBuat(window._ldzEid,pal.kind,pal.shape,p.x,p.y); return; }
  if(pal.moved) return;                       // diseret keluar kanvas → batal
  /* Sekali klik pada palet (tanpa diseret) = bentuknya "dipegang", lalu klik
     di kanvas menaruhnya. Menyeret tidak selalu nyaman di trackpad/layar
     sentuh, jadi kedua cara disediakan. */
  window._ldzArm={kind:pal.kind,shape:pal.shape};
  const st=document.getElementById('ldzStage'); if(st) st.classList.add('placing');
  toast('Klik di kanvas untuk menaruh '+(pal.kind==='table'?'meja':'kursi')+'.');
}

/* ---------- zoom & pan ---------- */
function ldzSetZoom(eid,z,pusat){
  const st=document.getElementById('ldzStage');
  const lama=ldzZoom();
  z=Math.max(.2,Math.min(4,z));
  window._ldzZoom=z;
  ldzRepaint(eid);
  // Pertahankan titik yang sedang dilihat supaya zoom tidak "melompat".
  const st2=document.getElementById('ldzStage');
  if(st&&st2){
    const cx=(pusat?pusat.x:st.clientWidth/2), cy=(pusat?pusat.y:st.clientHeight/2);
    st2.scrollLeft=(st.scrollLeft+cx)*(z/lama)-cx;
    st2.scrollTop =(st.scrollTop +cy)*(z/lama)-cy;
  }
}
function ldzZoomFit(eid){
  const st=document.getElementById('ldzStage'); const L=ldzMeta(eid);
  if(!st) return;
  const z=Math.min((st.clientWidth-24)/L.w,(st.clientHeight-24)/L.h);
  ldzSetZoom(eid,Math.max(.2,Math.min(2,z)));
}
function ldzWheel(e){
  if(!(e.ctrlKey||e.metaKey)) return;          // gulir biasa tetap menggulir
  e.preventDefault();
  const st=document.getElementById('ldzStage'); if(!st) return;
  const r=st.getBoundingClientRect();
  ldzSetZoom(window._ldzEid,ldzZoom()*(e.deltaY<0?1.12:1/1.12),{x:e.clientX-r.left,y:e.clientY-r.top});
}
// Pan: tombol tengah tetikus, atau tahan Spasi lalu seret.
let _ldzPan=null;
function ldzStageDown(e){
  const st=document.getElementById('ldzStage'); if(!st) return;
  /* Klik kiri di area kosong panggung = mulai memblok, bukan diam saja.
     Panggung hanya menerima ini kalau yang ditekan memang RUANG KOSONG —
     kanvas & objeknya punya penangan sendiri yang berjalan lebih dulu. */
  if(e.button===0 && !window._ldzSpace && ldzBolehBlok()
     && (e.target===st || (e.target.classList&&e.target.classList.contains('ldz-sizer')))){
    ldzCanvasDown(e,true);
    return;
  }
  if(!(e.button===1 || (window._ldzSpace&&e.button===0))) return;
  e.preventDefault();
  _ldzPan={sx:e.clientX,sy:e.clientY,l:st.scrollLeft,t:st.scrollTop};
  st.classList.add('panning');
  window.addEventListener('pointermove',ldzPanMove);
  window.addEventListener('pointerup',ldzPanUp);
}
function ldzPanMove(e){
  const st=document.getElementById('ldzStage'); if(!st||!_ldzPan) return;
  st.scrollLeft=_ldzPan.l-(e.clientX-_ldzPan.sx);
  st.scrollTop =_ldzPan.t-(e.clientY-_ldzPan.sy);
}
function ldzPanUp(){
  window.removeEventListener('pointermove',ldzPanMove);
  window.removeEventListener('pointerup',ldzPanUp);
  _ldzPan=null;
  const st=document.getElementById('ldzStage'); if(st) st.classList.remove('panning');
}

/* ---------- papan ketik ----------
   Dipasang sekali untuk seluruh aplikasi dan baru aktif kalau kanvas memang
   sedang terbuka & mode desain menyala. */
if(!window._ldzKeys){
  window._ldzKeys=true;
  window.addEventListener('keyup',function(e){ if(e.code==='Space'){ window._ldzSpace=false;
    const st=document.getElementById('ldzStage'); if(st) st.classList.remove('pan'); } });
  window.addEventListener('keydown',function(e){
    if(!window._ldzEdit||!document.getElementById('ldzCanvas')) return;
    const t=e.target&&e.target.tagName;
    if(t==='INPUT'||t==='SELECT'||t==='TEXTAREA') return;
    const eid=window._ldzEid, L=ldzMeta(eid);
    if(e.code==='Space'){ window._ldzSpace=true;
      const st=document.getElementById('ldzStage'); if(st) st.classList.add('pan'); e.preventDefault(); return; }
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='a'){
      e.preventDefault(); ldzSetSel(ldzItems(eid).map(function(i){ return i.id; })); ldzRepaint(eid); return; }
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='d'){ e.preventDefault(); ldzDuplicate(eid); return; }
    /* Ctrl+Z / Ctrl+Y (dan Ctrl+Shift+Z, kebiasaan dari aplikasi gambar lain).
       Diperiksa SEBELUM pintasan lain supaya tidak tersandung cabang di bawah
       yang butuh objek terpilih — membatalkan justru paling sering diperlukan
       tepat setelah semuanya terhapus dan tidak ada lagi yang terpilih. */
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!e.shiftKey){ e.preventDefault(); ldzUndo(); return; }
    if((e.ctrlKey||e.metaKey)&&(e.key.toLowerCase()==='y'||(e.key.toLowerCase()==='z'&&e.shiftKey))){ e.preventDefault(); ldzRedoAksi(); return; }
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='c'){ e.preventDefault(); ldzSalin(); return; }
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='v'){ e.preventDefault(); ldzTempel(eid); return; }
    if(e.key==='F2'){ const s1=ldzSel(); if(s1.length===1){ e.preventDefault(); ldzRename(s1[0]); } return; }
    if((e.ctrlKey||e.metaKey)&&(e.key==='='||e.key==='+')){ e.preventDefault(); ldzSetZoom(eid,ldzZoom()*1.2); return; }
    if((e.ctrlKey||e.metaKey)&&e.key==='-'){ e.preventDefault(); ldzSetZoom(eid,ldzZoom()/1.2); return; }
    if((e.ctrlKey||e.metaKey)&&e.key==='0'){ e.preventDefault(); ldzSetZoom(eid,1); return; }
    if(e.key==='Escape'){ window._ldzArm=null; ldzSetSel([]); ldzRepaint(eid); return; }
    const sel=ldzSelItems(); if(!sel.length) return;
    if(e.key==='Delete'||e.key==='Backspace'){ e.preventDefault(); ldzDelete(eid); return; }
    const step=e.shiftKey?10:1;
    let dx=0,dy=0;
    if(e.key==='ArrowLeft') dx=-step; else if(e.key==='ArrowRight') dx=step;
    else if(e.key==='ArrowUp') dy=-step; else if(e.key==='ArrowDown') dy=step;
    else return;
    e.preventDefault();
    /* Rekaman untuk panah dikelompokkan: menahan panah menghasilkan puluhan
       keydown, dan satu potret per piksel akan menghabiskan seluruh riwayat
       hanya untuk satu geseran. Deretan penekanan dalam 800ms dianggap satu
       langkah. */
    const kini=Date.now();
    if(!window._ldzNudgeAt || kini-window._ldzNudgeAt>800) ldzRekam(eid);
    window._ldzNudgeAt=kini;
    sel.forEach(function(it){
      it.x=Math.max(0,Math.min(L.w-(+it.w||LDZ_MIN),(+it.x||0)+dx));
      it.y=Math.max(0,Math.min(L.h-(+it.h||LDZ_MIN),(+it.y||0)+dy));
      ldzPaintItem(it);
    });
    ldzPaintSel(); save();
  });
}

/* ---------- perataan & distribusi ----------
   Alasan orang memakai draw.io untuk denah kursi: merapikan puluhan objek
   sekaligus, bukan menggeser satu-satu sampai kelihatan lurus. */
function ldzAlign(eid,cara){
  ldzRekam(eid);
  const sel=ldzSelItems(); if(sel.length<2) return toast('Pilih minimal dua objek dulu.');
  const b=ldzBBox(sel);
  sel.forEach(function(it){
    const w=+it.w||LDZ_MIN, h=+it.h||LDZ_MIN;
    if(cara==='kiri')   it.x=b.x;
    if(cara==='kanan')  it.x=b.x+b.w-w;
    if(cara==='tengahH')it.x=Math.round(b.x+(b.w-w)/2);
    if(cara==='atas')   it.y=b.y;
    if(cara==='bawah')  it.y=b.y+b.h-h;
    if(cara==='tengahV')it.y=Math.round(b.y+(b.h-h)/2);
  });
  save(); ldzRepaint(eid);
}
function ldzDistribute(eid,arah){
  ldzRekam(eid);
  const sel=ldzSelItems(); if(sel.length<3) return toast('Pilih minimal tiga objek dulu.');
  const kunci=arah==='h'?'x':'y', sisi=arah==='h'?'w':'h';
  const urut=sel.slice().sort(function(a,b){ return (+a[kunci]||0)-(+b[kunci]||0); });
  const awal=+urut[0][kunci]||0;
  const akhirIt=urut[urut.length-1];
  const akhir=(+akhirIt[kunci]||0)+(+akhirIt[sisi]||0);
  const total=urut.reduce(function(a,i){ return a+(+i[sisi]||0); },0);
  const sela=(akhir-awal-total)/(urut.length-1);
  let pos=awal;
  urut.forEach(function(it){ it[kunci]=Math.round(pos); pos+=(+it[sisi]||0)+sela; });
  save(); ldzRepaint(eid);
}
function ldzSamakan(eid,apa){
  ldzRekam(eid);
  const sel=ldzSelItems(); if(sel.length<2) return toast('Pilih minimal dua objek dulu.');
  const p=sel[0];
  sel.forEach(function(it){ if(apa!=='h') it.w=+p.w||LDZ_MIN; if(apa!=='w') it.h=+p.h||LDZ_MIN; });
  save(); ldzRepaint(eid);
}

/* ---------- panel properti ---------- */
function ldzSet(eid,field,val){
  /* warna & pola bernilai TEKS, bukan angka. Tanpa cabang ini keduanya
     lewat jalur pembersih angka di bawah dan berubah jadi 0. */
  if(field==='warna'||field==='pola'){
    ldzRekam(eid);
    ldzSelItems().forEach(function(it){ it[field]=String(val||''); });
    save(); ldzRepaint(eid); return;
  }
  ldzRekam(eid);
  const sel=ldzSelItems(); if(!sel.length) return;
  sel.forEach(function(it){
    if(field==='tier'){ it.tier=val; it.ticket_class_id=ldzTierClass(eid,val).id; }
    else if(field==='capacity') it.capacity=Math.max(1,+val||1);
    else if(field==='w'||field==='h') it[field]=Math.max(LDZ_MIN,+val||LDZ_MIN);
    else if(field==='x'||field==='y') it[field]=Math.max(0,+val||0);
    else if(field==='status'){
      if(ldzTerjual(it)) return;               // terjual → hanya lewat Refund
      it.status=val;
    }
    else it[field]=val;
  });
  ldzSyncQuota(eid); save(); ldzRepaint(eid);
}
function ldzMetaSet(eid,field,val){
  const L=ldzMeta(eid);
  /* Batas dinaikkan dari 4.000 ke 24.000 px. Denah venue sungguhan yang
     digambar 1:1 dari file arsitek bisa berukuran ~19.000 × 12.000; dengan
     batas lama, gambar latarnya terpaksa dikecilkan sampai nomor mejanya tak
     terbaca. Kanvasnya sendiri cuma div ber-transform, jadi yang mahal bukan
     ukurannya melainkan jumlah objek di dalamnya. */
  if(field==='w'||field==='h') L[field]=Math.max(200,Math.min(24000,+val||1200));
  else if(field==='bgOpacity') L.bgOpacity=Math.max(0,Math.min(100,+val||0));
  else L[field]=val;
  save(); ldzRepaint(eid);
}
function ldzBg(eid){

    toast('✓ Gambar denah dipasang sebagai latar — tinggal taruh kursi/mejanya.');

       +'<button class="ldz-ib sq" onclick="ldzDistribute(\''+eid+'\',\'h\')">⇹ Sebar mendatar</button>'
       +'<button class="ldz-ib sq" onclick="ldzDistribute(\''+eid+'\',\'v\')">⇳ Sebar menurun</button>'
       +'<button class="ldz-ib sq" onclick="ldzSamakan(\''+eid+'\',\'wh\')">= Samakan ukuran</button>'
