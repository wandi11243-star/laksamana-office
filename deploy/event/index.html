<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Guard SSO: tanpa sesi Office yang berhak buka event, langsung ke login Office. -->
<script>
(function(){try{var s=JSON.parse(localStorage.getItem('lm_session')||'null');
  var ok=s&&s.expiry&&Date.now()<s.expiry&&(s.modules||[]).some(function(m){return m==='*'||m==='event';});
  if(!ok)location.replace('../');}catch(e){location.replace('../');}})();
</script>
<title>Laksamana Muda — Event Management System</title>
<link rel="icon" type="image/jpeg" href="../assets/LaksamanaMudaLogo.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TEMA — disamakan dengan modul Marketing & Reservasi.
   Prototipe ini awalnya bertema gelap (ala GitHub), jadi terasa seperti
   aplikasi asing saat dibuka dari portal yang sama. Nama variabelnya SENGAJA
   dipertahankan (--bg, --panel, --accent, ...) supaya seluruh CSS di bawah
   tidak perlu diubah — cukup nilainya yang dipetakan ke palet Laksamana Muda.
   Komentar di kanan = nama padanannya di modul Marketing, biar gampang dijaga
   tetap seragam kalau palet induknya berubah.
   ============================================================ */
:root{
  /* PALET DICERAHKAN 7 Agustus 2026. Yang lama abu-abu netral (#f7f6f4 /
     #f2f0ec) di atas latar putih: kartunya nyaris tidak terpisah dari
     halaman, dan keseluruhannya terbaca kusam. Sekarang panelnya bernada
     hangat dengan sedikit emas — warna yang memang dipakai merek ini — jadi
     kartu terlihat sebagai kartu tanpa perlu garis tebal.

     `--muted` juga digelapkan dari #928c80 ke #5c574d. Warna lama itu
     kontrasnya di bawah 3:1 terhadap putih; keterangan kecil di bawah tiap
     angka praktis tidak terbaca di layar terang, dan itu justru baris yang
     menjelaskan angkanya. */
  --bg:#ffffff;
  /* Riwayat singkat supaya tidak diputar-putar lagi:
       abu-abu netral #f7f6f4  -> kusam, kartu tidak terpisah dari halaman
       #fffdf7                 -> bagus, tapi kuningnya masih terasa
       #fdf8ea                 -> KELIRU, malah makin tua/kuning
     Yang dipakai sekarang naik lagi terangnya dan kuningnya dikurangi: masih
     hangat, tapi lebih dekat ke putih daripada ke krem. */
  --panel:#fffdfa;                /* putih hangat, nyaris netral */
  --panel2:#fdf7ec;              /* emas paling muda, untuk isian & penekanan */
  --line:rgba(122,86,15,.22);     /* garis ikut bernada emas */
  --line-soft:rgba(122,86,15,.12);
  --txt:#241f18;                  /* sedikit lebih gelap dari sebelumnya */
  --muted:#5c574d;                /* dulu #928c80 — terlalu pucat untuk dibaca */
  --muted-2:#8a8375;              /* untuk yang MEMANG boleh samar */
  --accent:#A9791F;               /* marketing --gold   */
  --accent-soft:#C8961F;          /* marketing --gold-soft */
  --accent2:#7a560f;              /* marketing --gold-deep */
  --blue:#2f7fc4;                 /* marketing --info   */
  --green:#1f9d5f;                /* marketing --ok     */
  --red:#c9432b;                  /* marketing --danger */
  --grey:#928c80;                 /* marketing --muted  */
  --purple:#7c5fc0;               /* marketing --violet */
  --orange:#b5831a;               /* marketing --warn   */
  --shadow:0 4px 18px rgba(50,42,28,.08);
  --ff-display:'Plus Jakarta Sans',system-ui,sans-serif;
  --ff-body:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
/* font-weight 450 (bukan 400): di layar terang, teks tipis di atas putih
   terbaca pudar — keluhan yang sama dengan warna --muted di atas. 450 masih
   terbaca sebagai teks biasa, bukan tebal. */
body{font-family:var(--ff-body);background:var(--bg);color:var(--txt);font-size:14.5px;
  font-weight:450;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--ff-display)}
#app{display:flex;min-height:100vh}
/* Sidebar */
/* Sidebar disalin gayanya dari modul Marketing supaya seragam:
   latar putih, ikon SVG (bukan emoji), item ber-radius, aktif = gold-glow. */
/* overflow-x:hidden adalah jaring terakhir: begitu sidebar menyusut ke 66px,
   apa pun yang lupa disembunyikan akan menjulur keluar dan menumpuk di atas
   isi halaman. Lebih baik terpotong rapi daripada meluber. */
#sidebar{width:250px;background:#ffffff;border-right:1px solid var(--line-soft);position:fixed;height:100vh;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;transition:width .16s}
.brand{padding:20px 20px 16px;display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--line-soft)}
.brand img{width:34px}
.brand .bt{font-family:var(--ff-display);font-weight:700;font-size:16px;letter-spacing:.02em;line-height:1}
.brand .bs{font-size:9px;letter-spacing:.22em;color:var(--accent);text-transform:uppercase;margin-top:3px}
.nav{padding:10px 12px;flex:1}
/* nowrap + hidden: nama menu panjang ("Fee & Pembayaran Talent") dulu melipat
   jadi dua baris saat sidebar menyempit, lalu menonjol keluar tepinya. */
.nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;color:#5c574d;text-decoration:none;font-weight:500;font-size:13px;cursor:pointer;transition:.16s;white-space:nowrap;overflow:hidden}
.nav a:hover{background:var(--panel);color:var(--txt)}
.nav a.active{background:rgba(169,121,31,.13);color:var(--accent2);font-weight:600}
/* ikon SVG: ukurannya dikunci di sini supaya tiap item sejajar rapi */
.nav a svg{width:17px;height:17px;flex:none;stroke-width:1.8}
/* Lencana jumlah antrian di menu — disalin dari modul Marketing supaya kru
   yang membuka keduanya melihat bentuk yang sama. Aturan mini-nya (baris 127)
   sudah ada sejak dulu, menunggu lencana yang tidak pernah dipasang.
   Warnanya MERAH, bukan emas seperti di Marketing: di sana lencana ini juga
   dipakai Notification Center yang isinya sekadar kabar, sementara di sini ia
   cuma dipakai Approval Flow — dan yang dihitungnya adalah orang yang sedang
   menunggu keputusan, bukan pemberitahuan yang boleh dibaca nanti. */
.nav a .badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;
  padding:1px 7px;border-radius:20px;min-width:18px;text-align:center;flex:none}
.nav .sect{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);padding:16px 12px 7px}
.side-foot{padding:10px 12px;font-size:11px;color:var(--muted)}
.side-foot button{background:none;border:1px solid var(--line);color:var(--muted);padding:4px 8px;border-radius:5px;cursor:pointer;font-size:11px;margin-top:6px}
.side-foot button:hover{border-color:var(--red);color:var(--red)}
/* blok user + logout — EMS sebelumnya tidak punya jalan keluar sama sekali */
.side-user{margin-top:auto;border-top:1px solid var(--line-soft);padding:12px;display:flex;align-items:center;gap:10px}
.su-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent-soft),var(--accent2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:none}
.su-info{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.su-info b{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.su-info span{font-size:10.5px;color:var(--muted)}
.logout-x{background:var(--panel);border:1px solid var(--line);color:var(--muted);width:32px;height:32px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;flex:none;cursor:pointer;transition:.16s}
/* Sama dengan Marketing: ikon "tombol mati" + sorotan merah bahaya. Modul
   yang dibuka bergantian tidak boleh punya dua bentuk tombol keluar. */
.logout-x:hover{background:rgba(201,67,43,.12);border-color:var(--red);color:var(--red)}
/* Main */
#main{margin-left:250px;flex:1;min-width:0;transition:margin-left .16s}
/* Ciutkan menu ke ikon saja (tombol ☰). Desktop only. */
#navMiniBtn{display:inline-flex;align-items:center;justify-content:center;font-size:19px;color:var(--muted);width:34px;height:34px;border-radius:9px;background:none;border:none;cursor:pointer;flex:none}
#navMiniBtn:hover{color:var(--accent)}
@media(max-width:760px){#navMiniBtn{display:none}}
@media(min-width:761px){
  #app.nav-mini #sidebar{width:66px}
  #app.nav-mini #main{margin-left:66px}
  #app.nav-mini .brand .bt,#app.nav-mini .brand .bs,#app.nav-mini .su-info,#app.nav-mini .nav .sect{display:none}
  #app.nav-mini .brand{justify-content:center;padding:20px 6px 16px}
  #app.nav-mini .nav a{justify-content:center;gap:0;font-size:0;padding:9px 0}
  #app.nav-mini .nav a svg{width:18px;height:18px}
  #app.nav-mini .side-user{flex-direction:column;gap:8px;padding:10px 6px}
  /* Bagian yang DULU TERTINGGAL saat menyempit — inilah tulisan yang terlihat
     keluar dari sidebar: kaki sidebar (status sinkron + tombol "Kosongkan semua
     data") tidak punya aturan mini sama sekali. */
  #app.nav-mini .side-foot{display:none}
  #app.nav-mini .brand img{width:30px}
  #app.nav-mini .nav{padding:10px 6px}
  #app.nav-mini .nav a{overflow:hidden;text-overflow:clip}
  #app.nav-mini .nav a .badge{position:absolute;margin:0}
  #app.nav-mini .su-avatar{margin:0 auto}
}
.topbar{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 26px;display:flex;align-items:center;justify-content:space-between}
.topbar h2{font-size:18px;font-weight:600}
.topbar .crumb{font-size:12px;color:var(--muted)}
.content{padding:22px 26px 60px}
/* Components */
.row{display:flex;gap:14px;flex-wrap:wrap}
/* Kartu PUTIH, bukan abu-abu. Latar halaman sudah putih, jadi kartu abu-abu
   membuat seluruh layar terasa kelabu dan justru menenggelamkan isinya. Yang
   memisahkan kartu dari latarnya sekarang garis tipis + bayangan halus — cara
   yang sama dipakai modul Marketing. */
.card{background:var(--panel);border:1px solid var(--line-soft);border-radius:12px;padding:16px;
  box-shadow:0 2px 10px rgba(122,86,15,.06)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
/* ---------- Layar kecil ----------
   Modul ini dipakai di HP saat hari-H (scan QR di pintu masuk), jadi
   sidebar tetap 250px dan tabel selebar layar tidak bisa dipertahankan.
   Sidebar jadi laci yang digeser masuk, dan tabel boleh digeser mendatar. */
.menu-btn{display:none;background:var(--panel2);border:1px solid var(--line);color:var(--txt);
  width:38px;height:38px;border-radius:9px;font-size:17px;cursor:pointer;flex:none;margin-right:12px}
.menu-btn:hover{border-color:var(--accent);color:var(--accent)}
#sideScrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:29}
@media(max-width:760px){
  .menu-btn{display:block}
  #sidebar{transform:translateX(-100%);transition:transform .22s ease;z-index:30;width:250px;
    box-shadow:0 0 40px rgba(0,0,0,.18)}
  body.side-open #sidebar{transform:none}
  body.side-open #sideScrim{display:block}
  #main{margin-left:0}
  .topbar{padding:11px 14px}
  .topbar h2{font-size:16px}
  .content{padding:16px 14px 60px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  /* tabel lebar tidak boleh mendorong seluruh halaman melebar */
  .card table{min-width:560px}
  .card:has(table){overflow-x:auto}
  .modal{max-width:100%;padding:16px;max-height:92vh;overflow-y:auto}
  .toolbar input,.toolbar select{min-width:0;flex:1}
  .cam-box{max-width:100%}
  /* Denah Kursi Terisi Langsung di HP: digulir DI DALAM kartunya sendiri. Tanpa ini
     denah venue yang lebarnya ribuan piksel mendorong seluruh halaman ke
     samping, dan tiap sentuhan menggeser layar alih-alih memilih kursi —
     itulah "check-in ngeframe" di HP. */
  #liveDenah{overflow-x:auto;-webkit-overflow-scrolling:touch}
  /* Kanvas denah kustom diperkecil oleh ciPasDenah() supaya muat lebar layar;
     ini menjaga pembungkusnya tidak ikut melebar dan mendorong halaman. */
  #liveDenah .ldz-wrap{max-width:100%;padding:8px}
  #liveDenah .ldz-canvas{box-shadow:none}
  /* Denah TEMPLATE (bukan kanvas) memakai kotak 34px per kursi — di 360px itu
     sembilan kursi sebaris, cukup terbaca, dan sisanya menggulir di dalam
     kartunya sendiri. */
  #liveDenah .seatmap{padding:10px;gap:5px}
  /* Kartu angka check-in tetap bertiga sebaris: tiga angka pendek tidak perlu
     tiga baris penuh, dan menggulir untuk melihat occupancy itu mengganggu. */
  #ciStat{grid-template-columns:repeat(3,1fr);gap:8px}
  #ciStat .stat{padding:10px 8px}
  #ciStat .stat .val{font-size:19px}
  #ciStat .stat .lbl,#ciStat .stat .sub{font-size:10.5px}
  #topActions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

  /* ---------- 16px, DAN ITU ANGKA WAJIB — BUKAN SELERA ----------
     Safari di iOS memperbesar sendiri seluruh halaman begitu kursor masuk ke
     kolom isian yang font-nya di bawah 16px, DAN TIDAK MENGEMBALIKANNYA.
     Isian di modul ini 13px, jadi tiap kali kasir menyentuh kolom di layar
     Catat Penjualan — atau petugas pintu menempel token di Check-In —
     halamannya melompat membesar dan sisa pekerjaan dikerjakan sambil
     menggeser layar ke kiri-kanan. Persis gejala "ngeframe di HP", dan
     penyebabnya tidak pernah kelihatan dari kodenya.

     Jangan diperbaiki dengan `maximum-scale=1` di <meta viewport>: itu
     memang mematikan zoom-nya, sekaligus mematikan cubit-untuk-memperbesar
     bagi yang matanya memang perlu. */
  input,select,textarea,.tbl-edit .inp{font-size:16px}
  /* Kolom di dalam tabel sunting tetap muat: tingginya yang dipangkas,
     bukan hurufnya. */
  .tbl-edit .inp{padding:6px 7px}

  /* Laci menu tidak boleh memakan hampir seluruh layar 320px — sisakan
     bagian gelap yang jelas bisa ditekan untuk menutupnya. */
  #sidebar{width:min(84vw,270px)}

  /* Modal: 40px kosong di atas itu mahal di layar 640px tinggi. */
  .overlay{padding:18px 10px}
  /* Tombol modal jadi selebar layar dan berurutan ke bawah. Deretan tombol
     rapat di pojok kanan adalah cara tercepat menekan "Hapus" saat yang
     dimaksud "Batal". */
  .modal-actions{flex-wrap:wrap;gap:8px}
  .modal-actions .btn{flex:1 1 140px}
  /* Pasangan label–isi: 130px label di layar 320px menyisakan 150px untuk
     nomor rekening dan nama acara. */
  .kv{grid-template-columns:104px 1fr;gap:6px 10px}

  /* Sasaran sentuh. .btn.sm hanya setinggi ±24px — di bawah batas yang bisa
     ditekan dengan tepat sambil berdiri di pintu masuk. */
  .btn.sm{padding:8px 12px;font-size:12.5px}
}
/* ---------- KALENDER DI LAYAR SEMPIT ----------
   Tujuh kolom tetap dipertahankan: bentuk kalender itu sendiri yang membuat
   orang bisa membaca "Sabtu depan" tanpa berpikir. Yang disesuaikan adalah
   apa yang dimuat tiap sel — jarak dipersempit supaya lebar teksnya
   bertambah, dan pil acara dibuat lebih TINGGI supaya benar-benar bisa
   ditekan (itu satu-satunya jalan ke popup rincian; sel kosongnya sendiri
   tidak membuka apa-apa).

   Nama acara sengaja TIDAK disembunyikan seperti di modul Daily Worker: di
   sana selnya sendiri sebuah tombol yang membuka rincian hari itu, di sini
   tidak — menyembunyikan pilnya berarti menghapus satu-satunya pintu ke
   isinya. */
@media(max-width:620px){
  .cal{gap:3px}
  .cal .cell{min-height:76px;padding:3px;font-size:10px}
  .cal .cell .dn{margin-bottom:2px}
  .evt-dot{padding:4px 4px;margin-bottom:3px;line-height:1.25}
  .legend{font-size:11px;gap:8px}
}
/* Sentuhan kecil: fokus keyboard terlihat, dan tombol tidak terasa mati */
.btn:active{transform:translateY(1px)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs button:hover{color:var(--txt)}
/* Kartu angka: gradasi tipis + garis emas di atas, supaya deretan angka
   tidak terbaca sebagai kotak-kotak datar yang sama semua. */
.stat{position:relative;background:linear-gradient(160deg,#fff 0%,var(--panel) 100%);
  border:1px solid var(--line);border-radius:12px;padding:17px 16px;overflow:hidden;
  transition:transform .15s,box-shadow .15s}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--accent),var(--accent-soft) 60%,transparent)}
.stat:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(50,42,28,.09)}
.stat .val{background:linear-gradient(135deg,var(--accent2),var(--accent-soft));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
/* Panel "Perlu Perhatian" */
.perhatian{display:grid;gap:9px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.pi{display:flex;flex-direction:column;gap:2px;padding:11px 13px;border-radius:10px;
  text-decoration:none;color:var(--txt);border:1px solid var(--line);
  background:linear-gradient(135deg,rgba(255,255,255,.9),var(--panel2));transition:.15s}
.pi:hover{transform:translateX(2px);border-color:var(--accent)}
.pi b{font-size:13px}
.pi span{font-size:11.5px;color:var(--muted)}
.pi-danger{border-left:3px solid var(--red)}
.pi-warn{border-left:3px solid var(--accent)}
.pi-ok{border-left:3px solid var(--green)}
.perhatian-kosong{color:var(--muted);font-size:12.5px;
  background:linear-gradient(135deg,rgba(31,157,95,.07),transparent)}
/* Judul halaman & tombol utama diberi gradasi senada */
.topbar h2{background:linear-gradient(135deg,var(--txt),var(--accent2));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.ecard .cover{background:linear-gradient(135deg,var(--panel2),rgba(169,121,31,.16))}
.sect{background:linear-gradient(90deg,var(--accent),transparent);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-weight:700}

.stat .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.stat .val{font-size:24px;font-weight:700;margin-top:6px}
.stat .sub{font-size:11px;color:var(--muted);margin-top:2px}
h3.sec{font-size:15px;margin:22px 0 12px;display:flex;align-items:center;gap:9px}
h3.sec::before{content:'';width:4px;height:16px;border-radius:3px;flex:none;
  background:linear-gradient(var(--accent-soft),var(--accent2))}
h3.sec:first-child{margin-top:0}
table{width:100%;border-collapse:collapse;font-size:13px}
/* Kepala tabel TANPA latar berwarna — yang membedakannya dari isi cukup
   tulisan tebal berwarna emas tua dan garis bawah tegas. Latar berwarna di
   belakang teks kecil justru menurunkan kontrasnya, dan pada tabel selebar
   Penjualan hasilnya terbaca buram. */
thead th{text-align:left;padding:10px;background:transparent;
  border-bottom:2px solid rgba(169,121,31,.38);color:var(--accent2);font-size:11px;
  text-transform:uppercase;letter-spacing:.5px;font-weight:800;white-space:nowrap}
thead th:first-child{border-top-left-radius:10px}
thead th:last-child{border-top-right-radius:10px}
th{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px;font-weight:600}
td{padding:10px;border-bottom:1px solid rgba(122,86,15,.14)}
/* ZEBRA DIBUANG. Baris berselang warna membuat separuh tabel bertulisan di
   atas latar keruh, dan itu justru menurunkan keterbacaan yang mau ditolong.
   Penjaga mata saat menelusuri ke kanan sekarang: garis antar baris yang
   lebih tegas + satu baris yang menyala saat disentuh kursor. */
tbody tr{background:transparent}
tbody tr:hover{background:rgba(169,121,31,.10)}
tbody tr:last-child td{border-bottom:none}
/* Isi sel dipertebal, bukan diberi latar: 500 masih terbaca sebagai teks
   biasa tapi jelas lebih padat daripada 400 di layar terang. */
td{font-weight:500;color:var(--txt)}
td b{font-weight:800}
/* Tombol utama: emas yang benar-benar emas — gradien terang ke tua plus
   sedikit kilau di tepi atas. Yang lama gradiennya rata dan gelap, jadi
   terbaca cokelat kusam. */
/* border:1.5px TRANSPARAN, bukan border:none. Inilah sebab pasangan
   Setujui/Tolak selalu terlihat tidak sejajar: .btn.ghost menambahkan
   border 1.5px, .btn polos tidak punya border sama sekali — jadi tombol
   ghost 3px LEBIH TINGGI daripada tombol emas di sebelahnya, dan tulisannya
   turun setengah piksel. Selisih sekecil itu tidak pernah dikenali sebagai
   "bug", cuma terasa berantakan. Dengan border transparan, semua ragam
   tombol berkotak sama persis dan tinggal warnanya yang berbeda. */
.btn{background:linear-gradient(135deg,#E4B849 0%,var(--accent-soft) 45%,var(--accent2) 100%);
  color:#fff;border:1.5px solid transparent;padding:8px 15px;border-radius:8px;font-weight:700;cursor:pointer;
  font-size:13px;line-height:1.35;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  white-space:nowrap;font-family:inherit;
  box-shadow:0 2px 8px rgba(122,86,15,.28),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:hover{background:linear-gradient(135deg,#F0C868 0%,#C8961F 45%,#8a6212 100%);
  box-shadow:0 4px 14px rgba(122,86,15,.34),inset 0 1px 0 rgba(255,255,255,.45)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.ghost{background:#fff;border-color:var(--line);color:var(--txt);font-weight:600;box-shadow:none}
.btn.ghost:hover{border-color:var(--accent-soft);color:var(--accent2);background:var(--panel2);box-shadow:none}
/* Kilau emas di bawah tombol MERAH dan BIRU ikut terbawa dari .btn — bayangan
   rgba(122,86,15,...) di bawah tombol "Tolak" terbaca seperti noda. Keduanya
   sekarang punya bayangan senada warnanya sendiri, plus keadaan :hover yang
   sebelumnya tidak ada sama sekali (tombolnya diam saat disentuh, jadi orang
   ragu apakah benar bisa diklik). */
.btn.danger{background:var(--red);color:#fff;box-shadow:0 2px 8px rgba(184,58,58,.26)}
.btn.danger:hover{background:var(--red);filter:brightness(1.08);box-shadow:0 4px 14px rgba(184,58,58,.32)}
.btn.blue{background:var(--blue);color:#fff;box-shadow:0 2px 8px rgba(47,127,196,.26)}
.btn.blue:hover{background:var(--blue);filter:brightness(1.08);box-shadow:0 4px 14px rgba(47,127,196,.32)}
/* TOLAK = garis merah, bukan blok merah penuh. Dua blok warna pekat
   berdampingan (emas "Setujui" + merah "Tolak") sama-sama berteriak, jadi
   tidak ada yang menuntun mata ke tindakan yang wajar. Menolak juga bukan
   perbuatan merusak: ada layar konfirmasi berisi alasan sesudahnya. */
.btn.ghost.danger{background:#fff;border-color:rgba(184,58,58,.55);color:var(--red);font-weight:600;box-shadow:none}
.btn.ghost.danger:hover{background:rgba(184,58,58,.07);border-color:var(--red);color:var(--red);
  filter:none;box-shadow:none}
/* Pasangan tombol putusan di dalam sel tabel. Kelas ini SUDAH DIPAKAI di dua
   tempat tapi tidak pernah punya satu baris CSS pun — jadi kedua tombolnya
   cuma dua elemen inline yang patah ke baris berikutnya sesuka lebar kolom,
   dan di kolom sempit "Setujui" berdiri sendiri di atas "Tolak". */
.aksi-1baris{display:inline-flex;gap:6px;align-items:center;flex-wrap:nowrap}
.aksi-1baris .btn{flex:none}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600}
.b-green{background:rgba(31,157,95,.12);color:var(--green)}
.b-red{background:rgba(201,67,43,.12);color:var(--red)}
.b-blue{background:rgba(47,127,196,.12);color:var(--blue)}
.b-grey{background:rgba(146,140,128,.15);color:var(--grey)}
.b-yellow{background:rgba(169,121,31,.13);color:var(--accent2)}
.b-purple{background:rgba(124,95,192,.12);color:var(--purple)}
.b-orange{background:rgba(181,131,26,.14);color:var(--orange)}
/* Teal — SATU-SATUNYA pemakainya kalender terpadu, untuk Reservasi. Diambil
   dari --teal modul Marketing (#0C6B64) supaya reservasi berwarna sama persis
   di kedua kalender: kru yang membuka keduanya bergantian tidak boleh perlu
   menghafal dua bahasa warna. */
.b-teal{background:rgba(12,107,100,.13);color:#0C6B64}
input,select,textarea{background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:8px 10px;border-radius:7px;font-size:13px;width:100%;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
.field{margin-bottom:12px}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.toolbar input,.toolbar select{width:auto;min-width:150px}
/* Deretan chip penyaring. Beda dengan .tabs: tidak bergaris bawah dan tidak
   memenuhi lebar, supaya jelas ia menyaring isi halaman — bukan memindahkan
   ke halaman lain. */
.fbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.fchip{background:#fff;border:1.5px solid var(--line);color:var(--txt);border-radius:22px;
  padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;
  display:inline-flex;align-items:center;gap:7px;transition:.15s}
.fchip b{font-weight:800;color:var(--muted)}
.fchip:hover{border-color:var(--accent-soft);background:var(--panel2)}
.fchip.on{background:linear-gradient(135deg,#E4B849,var(--accent-soft));border-color:var(--accent2);
  color:#fff;box-shadow:0 2px 10px rgba(122,86,15,.28)}
.fchip.on b{color:rgba(255,255,255,.92)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap}
.tabs button{background:none;border:none;color:var(--muted);padding:9px 14px;cursor:pointer;font-size:13px;border-bottom:2px solid transparent;font-family:inherit}
.tabs button.active{color:var(--accent);border-bottom-color:var(--accent)}
.pill{font-size:11px;color:var(--muted);background:var(--panel2);padding:2px 8px;border-radius:20px}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent-soft),var(--accent2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.ecard{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .16s,box-shadow .16s,border-color .16s;box-shadow:var(--shadow);display:flex;flex-direction:column}
.ecard:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 14px 30px rgba(50,42,28,.15)}
.ecard .cover{height:132px;background:linear-gradient(135deg,var(--panel2),rgba(169,121,31,.12));display:flex;align-items:center;justify-content:center;font-size:44px;position:relative}
/* scrim tipis di bawah cover supaya judul & badge tetap terbaca di atas poster terang */
.ecard .cover::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.22),transparent 52%);pointer-events:none}
.ecard .cat{position:absolute;top:8px;right:8px;z-index:1;background:rgba(255,255,255,.94);color:var(--accent2);font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:.03em;text-transform:uppercase;box-shadow:0 1px 4px rgba(0,0,0,.12)}
/* Poster event: gambar menutup penuh area cover, emoji tetap jadi cadangan */
.poster-img{width:100%;height:100%;object-fit:cover;display:block}
.poster-mini{object-fit:cover;border-radius:6px;vertical-align:middle;display:inline-block}
.poster-head{width:54px;height:54px;display:flex;align-items:center;justify-content:center;
  background:var(--panel2);border-radius:10px;overflow:hidden;flex:none}
/* Banner header di halaman detail event */
.evt-banner{display:flex;gap:16px;align-items:center;margin-bottom:18px;padding:16px 18px;border-radius:14px;
  border:1px solid var(--line);background:linear-gradient(120deg,var(--panel),rgba(169,121,31,.08));box-shadow:var(--shadow)}
.evt-banner .poster-head{box-shadow:0 2px 8px rgba(50,42,28,.14)}
.eb-info{min-width:0}
.eb-title{font-family:var(--ff-display);font-weight:800;font-size:21px;line-height:1.2;margin-bottom:7px}
.eb-meta{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:12.5px;color:var(--muted)}
.eb-meta span{display:inline-flex;align-items:center;gap:4px}
.poster-prev{max-width:100%;max-height:150px;border-radius:8px;display:block;border:1px solid var(--line)}
/* Bukti transfer & dokumen talent */
.bukti-img{max-width:100%;max-height:220px;border-radius:8px;display:block;border:1px solid var(--line)}
.doc-thumb{width:100%;height:88px;object-fit:cover;border-radius:6px;display:block;border:1px solid var(--line)}
.doc-card{display:flex;flex-direction:column;gap:4px}
/* Tabel yang bisa diedit langsung (rundown, vendor, task) */
.tbl-edit{border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:52vh}
.tbl-edit table{width:100%;border-collapse:collapse}
.tbl-edit th{position:sticky;top:0;background:var(--panel2);z-index:1}
.tbl-edit td{padding:4px 6px}
.tbl-edit .inp{width:100%;margin:0;padding:7px 8px;background:var(--panel2);color:var(--txt);
  border:1px solid transparent;border-radius:6px;font:inherit}
.tbl-edit .inp:focus{border-color:var(--accent);outline:none;background:var(--panel)}
/* Daftar pilih talent: seluruh barisnya bisa diketuk, dan kotak fee duduk
   di ujung kanan baris yang sama. Fee yang terpisah dari namanya membuat
   orang harus mengingat urutan sambil mengetik angka. */
/* Item kalender yang bisa diklik. Kursor & sedikit angkat saat disentuh —
   tanpa penanda, orang tidak tahu mana yang merespons dan mana yang tidak,
   lalu berhenti mencoba sama sekali. */
.evt-dot.bisa{cursor:pointer;transition:filter .12s,transform .12s}
.evt-dot.bisa:hover{filter:brightness(1.12);transform:translateY(-1px)}

/* Baris talent terpilih di lembar "Tambah Jadwal". Menggantikan daftar centang
   .tal-pilih/.tal-baris yang lama: yang memilih sekarang tombol berwarna di
   atasnya, dan baris ini cuma memperlihatkan HASILNYA — nama, kategori, dan
   satu-satunya hal yang memang perlu diketik di layar ini, fee malam itu. */
.tj-list{margin-top:10px;border:1.5px solid var(--line);border-radius:11px;
  padding:8px;background:var(--panel)}
.tj-baris{display:flex;align-items:center;gap:9px;padding:5px 4px}
.tj-baris+.tj-baris{border-top:1px solid var(--line)}
.tj-nm{font-size:11.5px;font-weight:800;border-radius:7px;padding:5px 9px;
  white-space:nowrap;max-width:190px;overflow:hidden;text-overflow:ellipsis}
.tj-baris .uang-inp{text-align:right;padding:6px 8px;font-size:12.5px}
@media(max-width:560px){
  .tj-baris{flex-wrap:wrap}
  .tj-baris .uang-wrap{width:100%!important}
}

/* Pemilih periode fee. Tiga tombol, bukan dropdown: pilihannya cuma tiga dan
   semuanya sering dipakai. */
/* Kartu rincian status event — bentuk yang sama dipakai Dashboard modul
   Marketing (.evtile di sana). Lebih rendah daripada .stat karena isinya
   cuma satu angka pendek, dan sepuluh kartu setinggi .stat mendorong
   seluruh isi dashboard keluar layar. */
/* ---------- PIPELINE ----------
   Bentuknya disalin dari modul Marketing supaya kru yang bolak-balik tidak
   belajar dua papan untuk pekerjaan yang sama. Jumlah kolomnya dipasang
   dari EVT_STATUS oleh penggambarnya — bukan ditulis di sini — karena
   angka kolom yang dipatok di CSS SUDAH pernah tertinggal saat tahap
   bertambah, dan gejalanya kolom hantu yang memakan lebar. */
.kanban{display:grid;gap:10px;padding-bottom:4px}
@media(max-width:1000px){.kanban{grid-auto-columns:minmax(210px,1fr);grid-auto-flow:column;
  grid-template-columns:none!important;overflow-x:auto;padding-bottom:8px}}
.kcol{background:var(--panel2);border:1px solid var(--line);border-radius:12px;
  display:flex;flex-direction:column;min-height:180px;max-height:calc(100vh - 300px)}
.kcol-head{display:flex;align-items:center;gap:8px;padding:11px 12px;
  border-bottom:1px solid var(--line-soft);font-size:12.5px;font-weight:700}
.kcol-head .cd{width:8px;height:8px;border-radius:50%;flex:none}
.kcol-head .kc{margin-left:auto;background:var(--panel);border:1px solid var(--line-soft);
  border-radius:20px;padding:1px 8px;font-size:11px;color:var(--muted)}
.kcol-body{padding:10px;display:flex;flex-direction:column;gap:9px;flex:1;
  overflow-y:auto;overflow-x:hidden;min-height:0}
.kcol.drag-over{border-color:var(--accent);background:var(--panel)}
.kcard{background:var(--panel);border:1px solid var(--line-soft);border-radius:10px;
  padding:11px;cursor:grab;transition:.14s}
.kcard:hover{border-color:var(--accent);transform:translateY(-1px)}
.kcard .kn{font-weight:600;font-size:12.5px;line-height:1.35}
.kcard .kco{font-size:11px;color:var(--muted);margin-top:3px}
/* Pita ringkasan — kembar dengan .pipe-sum di Marketing. Tanpa nominal:
   papan ini menjawab "event ada di tahap mana". */
.pipe-sum{display:grid;gap:1px;background:var(--line-soft);border:1px solid var(--line);
  border-radius:12px;overflow:hidden;margin-bottom:14px}
.pipe-sum .sel{background:var(--panel);padding:10px 13px;min-width:0}
.pipe-sum .sel.utama{background:linear-gradient(160deg,#ffffff,var(--panel2))}
.pipe-sum .k{display:flex;align-items:center;gap:6px;font-size:9.5px;font-weight:800;
  letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pipe-sum .k .d{width:7px;height:7px;border-radius:50%;flex:none}
.pipe-sum .n{font-family:var(--ff-display);font-size:21px;font-weight:700;line-height:1.15;margin-top:4px}
.pipe-sum .v{font-size:11.5px;color:var(--muted);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pipe-sum .sel.nol .n{color:var(--muted-2)}
@media(max-width:1000px){.pipe-sum{grid-template-columns:repeat(3,1fr)!important}}
@media(max-width:560px){.pipe-sum{grid-template-columns:repeat(2,1fr)!important}}
.evtile{padding:13px 14px}
.evtile .et-h{display:flex;align-items:flex-start;gap:7px;min-height:26px}
.evtile .et-name{font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--muted);
  line-height:1.25;text-transform:uppercase}
.evtile .et-v{font-family:var(--ff-display);font-size:24px;font-weight:700;margin-top:6px;line-height:1}
.evtile .et-d{font-size:11px;color:var(--muted);margin-top:5px}
.seg-per{display:inline-flex;border:1px solid var(--line-hard);border-radius:9px;overflow:hidden}
.seg-per button{border:none;background:none;padding:7px 13px;font-size:12.5px;cursor:pointer;color:var(--muted)}
.seg-per button+button{border-left:1px solid var(--line-hard)}
.seg-per button.on{background:var(--accent);color:#241d05;font-weight:700}
/* Empat status jadwal talent berdampingan. Dibiarkan melipat di layar sempit —
   .seg-per bawaan tidak pernah melipat, dan empat kata status berjejer tidak
   muat di HP: yang keempat terpotong keluar modal tanpa bisa ditekan. */
.seg-status{display:flex;flex-wrap:wrap;width:100%}
.seg-status button{flex:1 1 88px;text-align:center}
/* Yang DIBATALKAN tidak diberi warna emas seperti tiga lainnya: emas di sini
   berarti "pilihan yang berlaku", dan status batal yang terlihat seperti
   pilihan yang baik adalah kesalahan yang mahal di layar penjadwalan. */
.seg-status button.on:last-child{background:var(--red);color:#fff}
/* Kotak uang dengan awalan "Rp" menempel di dalamnya. Awalannya tidak bisa
   diklik (pointer-events:none) supaya mengetuk "Rp" tetap menaruh kursor di
   angkanya, bukan menelan ketukan itu. */
.uang-wrap{position:relative;display:block}
.uang-wrap .uang-rp{position:absolute;left:11px;top:50%;transform:translateY(-50%);
  font-size:12.5px;font-weight:700;color:var(--muted);pointer-events:none}
.uang-wrap .uang-inp{width:100%;padding-left:34px!important;font-variant-numeric:tabular-nums}
/* Rincian kategori di kartu event Ticketing. Baris rapat & angka rata kanan
   supaya empat baris tetap terbaca sebagai daftar, bukan paragraf. */
.kat-mini{margin-top:9px;border-top:1px solid var(--line-soft);padding-top:7px;display:grid;gap:3px}
.kat-mini .km-row{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted)}
.kat-mini .km-row i{width:8px;height:8px;border-radius:3px;flex:none}
.kat-mini .km-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kat-mini .km-v{flex:none;font-weight:700;color:var(--txt);font-variant-numeric:tabular-nums}
.kat-mini .km-v .mini{font-weight:500;color:var(--muted)}
.kat-mini .km-sisa{font-style:italic}
/* Ringkasan seluruh kategori di atas tabel Check-In. Daftar padat, bukan satu
   pita per kategori: pita bertumpuk akan mendorong tabel tamu keluar layar di
   HP, padahal tabel itulah yang dipakai bekerja. */
.ci-semua{background:var(--panel2);border:1px solid var(--line-soft);border-radius:10px;
  padding:10px 12px;margin-bottom:12px}
.ci-semua .cs-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding-bottom:7px;margin-bottom:5px;border-bottom:1px solid var(--line-soft);font-size:13px}
.ci-semua .cs-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:relative;
  padding:5px 0;font-size:12px;cursor:pointer;border-radius:6px}
.ci-semua .cs-row:hover{background:var(--panel)}
.ci-semua .cs-row .ldz-tier{flex:1;min-width:110px}
.ci-semua .cs-ang{flex:none;color:var(--muted)}
.ci-semua .cs-ang b{font-size:13px}
.ci-semua .cs-tot{flex:none;min-width:88px;text-align:right}
/* GARIS HIJAU MELINTANG SELEBAR HALAMAN DI CHECK-IN — inilah sebabnya.
   .ci-bar dibuat untuk pita .ci-hitung, yang position:relative, jadi ia
   position:absolute + left:14px/right:14px/bottom:7px. Di daftar "Semua
   kategori" ia dipakai ulang di dalam .cs-row, dan baris ini DULU cuma
   menimpa flex-basis & height — position:absolute-nya ikut terbawa.

   .cs-row tidak berposisi, .ci-semua tidak, .card tidak, .content tidak,
   #main tidak: tidak ada satu pun induk berposisi sampai ke atas. Jadi
   patokannya jatuh ke initial containing block, alias SELURUH HALAMAN — pita
   4px itu membentang dari tepi kiri layar (menimpa sidebar, karena sidebar
   position:fixed tanpa z-index dan pita ini digambar belakangan) sampai tepi
   kanan, mengambang di atas denah. Satu garis per kategori, semuanya
   bertumpuk di bottom:7px yang sama.

   Dua penahan sekaligus, sengaja: position:static di sini membuat pita
   kembali menjadi baris biasa di dalam .cs-row (yang memang maksud
   flex-basis:100%), dan position:relative di .cs-row memastikan pemakaian
   .ci-bar berikutnya — atau apa pun yang absolut di dalam baris ini —
   berhenti di batas barisnya, bukan lari ke seluruh halaman. */
.ci-semua .ci-bar{position:static;flex-basis:100%;height:4px;margin-top:3px}

.rowdel{width:28px;height:28px;border:none;background:none;color:var(--muted);line-height:0;display:inline-flex;align-items:center;justify-content:center;
  line-height:1;border-radius:6px;cursor:pointer}
.rowdel:hover{background:var(--red);color:#fff}
/* Tabel yang sama dalam keadaan tidak boleh diubah (event selesai / peran hanya
   Lihat). Kotaknya dimatikan, bukan diganti tabel kedua — satu jalur render
   saja, jadi tidak ada versi baca yang diam-diam ketinggalan dari versi edit. */
.tbl-edit.baca{max-height:none}
.tbl-edit.baca .inp{background:none;border-color:transparent;opacity:1;-webkit-text-fill-color:var(--txt);
  padding-left:0;pointer-events:none}
.tbl-edit.baca .inp option{color:var(--txt)}
/* Baris yang belum diisi: ditandai halus supaya jelas mana yang baru ditambah
   dan masih menunggu diketik, tanpa terlihat seperti galat. */
.tbl-edit tr.baru td{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.sek-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.sek-head h3{margin:0}
/* Edit cepat & ganti status langsung dari kartu event */
.card-edit{position:absolute;top:8px;left:8px;width:30px;height:30px;border:none;border-radius:8px;
  background:rgba(0,0,0,.55);color:#fff;font-size:15px;line-height:1;cursor:pointer;
  opacity:0;transition:.15s;display:flex;align-items:center;justify-content:center}
.ecard:hover .card-edit{opacity:1}
.card-edit:hover{background:var(--accent)}
/* Tombol hapus di kartu: SEBELAHAN dengan edit, warna merah hanya saat
   disentuh. Merah permanen di tiap kartu membuat daftar terlihat penuh
   peringatan, dan orang berhenti memperhatikannya. */
.card-del{position:absolute;top:8px;left:44px;width:30px;height:30px;border:none;border-radius:8px;display:grid;place-items:center;
  background:rgba(0,0,0,.45);color:#fff;font-size:17px;line-height:1;cursor:pointer;opacity:0;
  transition:opacity .15s,background .15s}
.ecard:hover .card-del{opacity:1}
.card-del:hover{background:var(--red)}
/* Di layar sentuh tidak ada hover — tombolnya harus selalu terlihat, kalau
   tidak ia praktis tidak ada. */
@media(hover:none){ .card-edit,.card-del{opacity:1} }
@media (hover:none){.card-edit{opacity:1}}   /* di HP tidak ada hover */
.card-status{width:100%;margin-top:10px;padding:6px 8px;border-radius:7px;font:inherit;font-size:12px;
  background:var(--panel2);color:var(--txt);border:1px solid var(--line);cursor:pointer}
.card-status:hover{border-color:var(--accent)}
/* Warna status. "Event Done" mengandung spasi, jadi kelasnya ditulis dengan
   garis bawah oleh kelasStatus() — CSS tidak bisa memakai kelas berspasi.

   LIMA TAHAP, LIMA WARNA. Sebelumnya cuma tiga yang diberi warna; Prospect dan
   Approval jatuh ke warna teks biasa, jadi dua tahap yang paling perlu
   dibedakan — "sedang di meja manajemen" vs "sudah disetujui" — terlihat sama
   persis, dan papan yang dibaca sekilas kehilangan gunanya.

   Urutannya mengikuti perjalanan acara: kelabu (belum apa-apa) -> kuning
   (menunggu keputusan) -> biru (disetujui) -> emas (berjalan) -> hijau
   (selesai). Hijau tinggal dipakai SATU tahap, bukan hampir semuanya. */
.card-status.st-Planning{color:var(--muted)}
.card-status.st-Prospect{color:var(--orange)}
.card-status.st-Approval{color:var(--blue)}
.card-status.st-Upcoming{color:var(--accent)}
.card-status.st-Event_Done{color:var(--green)}
/* Pemindai kamera check-in.
   Kotaknya diberi rasio tetap 4:3 dan videonya mengisi penuh — sebelumnya
   tingginya dibatasi max-height sementara lebarnya ikut layar, jadi di HP
   potret kotaknya berubah tinggi begitu video mulai jalan dan seluruh halaman
   melompat. Bingkai pengarah dibuat PERSEGI di tengah (QR memang persegi);
   sebelumnya inset 14% mengikuti bentuk kotak, jadi di layar sempit ia jadi
   persegi panjang yang menyesatkan: QR yang pas di bingkai justru terpotong. */
.cam-box{position:relative;border-radius:10px;overflow:hidden;background:#000;margin-bottom:10px;
  max-width:420px;aspect-ratio:4/3}
.cam-box video{width:100%;height:100%;display:block;object-fit:cover}
.cam-frame{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:64%;aspect-ratio:1;border:2px solid var(--accent);border-radius:12px;
  box-shadow:0 0 0 100vmax rgba(0,0,0,.28);pointer-events:none}
.ecard .body{padding:13px 14px 14px;display:flex;flex-direction:column;flex:1}
.ecard .body .t{font-family:var(--ff-display);font-weight:700;font-size:15px;line-height:1.3;margin-bottom:8px}
.ecard .meta{font-size:12px;color:var(--muted);margin-bottom:3px;display:flex;align-items:center;gap:6px}
.ecard .card-status{margin-top:auto}
/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:100;overflow-y:auto}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:100%;max-width:640px;padding:22px}
.modal.wide{max-width:900px}
.modal h3{margin-bottom:16px;font-size:17px}
.modal .close{float:right;cursor:pointer;color:var(--muted);font-size:20px;line-height:1;background:none;border:none}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
/* Calendar */
/* minmax(0,1fr), BUKAN 1fr. `1fr` berarti minmax(AUTO,1fr): lebar minimum
   kolomnya ditentukan isinya, jadi satu balon jadwal bernama panjang
   ("20:00 The Ocean Waves") memaksa kolomnya melebar, kisinya jadi lebih lebar
   daripada halaman, dan muncul gulungan mendatar — kolom Sabtu terpotong di
   tepi layar. minmax(0,…) membolehkan kolom menyusut lebih kecil daripada
   isinya, dan yang kepanjangan dipotong oleh .evt-dot di bawah. */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dow{text-align:center;font-size:11px;color:var(--muted);text-transform:uppercase;padding:4px}
.cal .cell{min-height:88px;background:var(--panel2);border:1px solid var(--line);border-radius:7px;
  padding:5px;font-size:11px;min-width:0;overflow:hidden}
.cal .cell .dn{color:var(--muted);font-weight:600;margin-bottom:3px}
.cal .cell.today{border-color:var(--accent)}
/* Sel yang bisa diklik harus TERLIHAT bisa diklik. Tanpa tanda apa pun,
   satu-satunya cara menemukannya adalah kebetulan menekannya — dan yang
   tidak pernah kebetulan menekannya akan terus memakai tombol di pojok atas
   lalu memilih ulang tanggal yang sudah ia tunjuk di layar. */
.cal .cell.klik{cursor:pointer;position:relative;transition:border-color .12s,background .12s}
.cal .cell.klik:hover{border-color:var(--accent);background:var(--panel)}
.cal .cell.klik:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.cal .cell .cell-plus{position:absolute;right:5px;top:3px;font-size:14px;line-height:1;
  color:var(--accent);opacity:0;transition:opacity .12s;pointer-events:none;font-weight:700}
.cal .cell.klik:hover .cell-plus,.cal .cell.klik:focus-visible .cell-plus{opacity:1}
.cal .cell.other{opacity:.35}
.evt-dot{display:block;font-size:10px;padding:2px 5px;border-radius:4px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
/* Balon talent di Talent Schedule. Warnanya datang dari TAL_WARNA lewat atribut
   style sebaris (per kategori), jadi di sini cuma bentuk & bobotnya. Bobot 600
   karena ukurannya cuma 10px di atas latar pekat. */
.cal .cell .evt-dot.talent{font-weight:600;transition:filter .12s,transform .12s}
.cal .cell .evt-dot.talent:hover{filter:brightness(1.1);transform:translateY(-1px)}
.cal .cell .evt-dot.talent.batal{opacity:.45;text-decoration:line-through}
/* Seat map */
/* Grid rapi (bukan flex acak) supaya kursi berbaris sejajar seperti matriks.
   Ukuran seat 34px DIBATASI ke .seatmap saja — denah bernomor (lm-hall/l1)
   tetap 30px agar proporsi yang sudah ditata ke poster tidak bergeser. */
.seatmap{display:grid;grid-template-columns:repeat(auto-fill,34px);gap:6px;padding:16px;
  background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line-soft);border-radius:12px;justify-content:center}
.seatmap .seat{width:34px;height:34px}
.seat{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-size:10px;line-height:1.05;text-align:center;padding:1px;cursor:pointer;border:1px solid var(--line);
  font-weight:700;transition:transform .12s,box-shadow .12s}
.seat:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(50,42,28,.15);z-index:1}
/* WARNA SOLID, bukan rgba tipis. Isian 15% opasitas nyaris tak terbaca di
   layar terang maupun dari jarak satu meter — dan denah kursi justru paling
   sering dilihat sambil berdiri, jauh dari layar. Tulisan dibuat putih di atas
   warna penuh supaya kontrasnya tetap aman pada kotak sekecil 26px. */
.seat.available{background:#1F9D5F;color:#fff;border-color:#18804C}
.seat.sold{background:#C9432B;color:#fff;border-color:#A33320}
.seat.locked{background:#A9791F;color:#fff;border-color:#8A6218}
.seat.checked{background:#2F7FC4;color:#fff;border-color:#245F94}
.seat.sel{outline:2px solid var(--accent);outline-offset:1px}
.seat[data-ro="1"]{cursor:not-allowed}
.seat.ro{cursor:default}
.seat.ro:hover{transform:none;box-shadow:none}
/* ---------- DENAH LAKSAMANA MUDA (Reguler+ bernomor, klik ala bioskop) ----------
   Panggung di atas; kursi bernomor MENGELILINGI area lantai: kolom kiri 1–23,
   baris depan 24–60, kolom kanan 61–83 — persis urutan poster. Dibuat pakai
   CSS grid supaya bentuk-U-nya jelas tanpa menaruh koordinat piksel manual. */
.lm-hall{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"stage stage stage" "kiri floor kanan" "depan depan depan";gap:12px;background:var(--panel2);border-radius:12px;padding:16px}
.lm-stage{grid-area:stage;background:#111;color:#fff;text-align:center;padding:14px;border-radius:8px;letter-spacing:4px;font-weight:700;font-size:13px}
.lm-kiri{grid-area:kiri;display:flex;flex-direction:column;gap:5px}
.lm-kanan{grid-area:kanan;display:flex;flex-direction:column;gap:5px}
.lm-depan{grid-area:depan;display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.lm-floor{grid-area:floor;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:12px;text-align:center;min-height:120px}
.lm-side-lbl{writing-mode:vertical-rl;transform:rotate(180deg);align-self:center;color:var(--accent);font-weight:700;font-size:11px;letter-spacing:2px}
.lm-zones{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.lm-zone{flex:1;min-width:160px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px}
.lm-zone h4{margin:0 0 4px;font-size:13px}
.lm-zone .zc{display:flex;gap:6px;align-items:center;margin-top:8px}
.lm-zone button{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--txt);cursor:pointer;font-weight:700}
.lm-floors{display:flex;gap:8px;margin-bottom:12px}
.lm-floors button{padding:7px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);cursor:pointer;font-weight:600;font-size:13px}
.lm-floors button.on{background:var(--accent);color:#111;border-color:var(--accent)}
@media(max-width:640px){ .lm-hall{grid-template-columns:auto 1fr auto} .seat{width:26px;height:26px;font-size:9px} }
/* ---------- DENAH LANTAI 1 (berbasis meja bernama) ---------- */
.l1-markers{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.l1-mark{font-size:10px;font-weight:700;letter-spacing:1px;padding:5px 9px;border-radius:6px;border:1px solid var(--line);color:var(--muted)}
.l1-mark.stage{background:#111;color:#fff;border-color:#111;flex:1;text-align:center;letter-spacing:4px}
.l1-mark.ent{background:rgba(230,150,20,.15);color:var(--accent);border-color:var(--accent)}
.l1-reg{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--accent);margin:16px 0 8px;text-transform:uppercase}
.l1-grid{display:flex;flex-wrap:wrap;gap:10px}
/* Tata letak SPASIAL meniru poster: kiri (Entrance+U) · tengah (Stage + meja
   tengah) · kanan (Talent Room + meja kanan); lalu pita S, baris 11–19, 1–9.
   Diberi lebar minimum + scroll-x supaya proporsinya tetap di layar sempit. */
.l1-plan{overflow-x:auto;background:var(--panel2);border-radius:12px;padding:14px}
.l1-plan-in{min-width:1040px;display:flex;flex-direction:column;gap:14px}
.l1-top{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start}
.l1-ent{writing-mode:vertical-rl;transform:rotate(180deg);background:rgba(230,150,20,.15);color:var(--accent);
  border:1px solid var(--accent);border-radius:8px;padding:10px 6px;font-weight:800;letter-spacing:2px;font-size:11px;text-align:center;align-self:stretch;display:flex;align-items:center;justify-content:center}
.l1-talent{background:#c9c9cf;color:#333;border-radius:8px;padding:10px 8px;font-weight:800;letter-spacing:2px;font-size:12px;writing-mode:vertical-rl;text-align:center;align-self:stretch;display:flex;align-items:center;justify-content:center;min-height:120px}
.l1-colL,.l1-colR{display:flex;flex-direction:column;gap:8px}
.l1-center{display:flex;flex-direction:column;gap:10px}
.l1-stage{background:#111;color:#fff;text-align:center;padding:16px;border-radius:8px;font-weight:800;letter-spacing:6px;font-size:16px}
.l1-stage small{display:block;letter-spacing:2px;font-size:10px;color:var(--accent);margin-bottom:4px}
.l1-mid{display:grid;grid-template-columns:auto auto auto;gap:10px;align-items:start;justify-content:center}
.l1-mid .grp{display:flex;gap:8px;flex-wrap:wrap}
/* Meja hijau 24–21 berjajar MENDATAR seperti poster (nowrap), bukan bertumpuk. */
.l1-mid .grp.green{flex-wrap:nowrap;align-items:flex-start}
.l1-band{display:flex;gap:8px;flex-wrap:nowrap;justify-content:center}
.l1-band.wrap{flex-wrap:wrap}
.l1-band-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:2px 0}
.l1-flankL,.l1-flankR{display:flex;flex-direction:column;gap:6px;justify-content:center}
.l1-meja{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:120px}
.l1-meja.green{border-color:var(--green)}
.l1-meja-h{font-size:12px;font-weight:700;color:var(--txt);margin-bottom:7px;display:flex;justify-content:space-between;gap:8px}
.l1-meja-h .pax{color:var(--muted);font-weight:500;font-size:11px}
.l1-seats{display:flex;flex-wrap:wrap;gap:4px;max-width:180px}
.l1-meja .seat{width:26px;height:26px;font-size:9px}
/* ---------- LAYOUT DESIGNER (denah kustom, bergaya draw.io) ----------
   Kanvas berkoordinat piksel: tiap objek (kursi/meja) diletakkan absolut lewat
   x/y/w/h yang tersimpan di barisnya sendiri, jadi tata letaknya bebas — bukan
   grid CSS seperti denah template. Gambar denah manual dipasang sebagai latar
   supaya objek tinggal ditaruh menimpanya.

   Zoom dikerjakan lewat transform:scale pada .ldz-canvas. Karena transform
   TIDAK mengubah ukuran layout, scrollbar-nya akan salah — itu tugas
   .ldz-sizer, yang dilebarkan sebesar kanvas × zoom supaya area gulirnya
   benar. Semua hitungan pointer dibagi zoom (lihat ldzPt/ldzDelta). */
.ldz-app{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel);box-shadow:var(--shadow)}
.ldz-palette{width:124px;flex-shrink:0;border-right:1px solid var(--line);padding:10px;background:var(--panel2);
  display:flex;flex-direction:column;gap:7px;overflow-y:auto}
.ldz-palette h5{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:2px 0}
.ldz-shape{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 4px;border:1px solid var(--line);
  border-radius:9px;background:var(--panel);cursor:grab;font-size:10px;font-weight:600;color:var(--muted);
  user-select:none;touch-action:none;transition:border-color .12s,color .12s,transform .12s}
.ldz-shape:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
.ldz-shape .ic{border:2px solid currentColor;background:transparent}
.ldz-shape .ic.rect-seat{width:22px;height:22px;border-radius:5px}
.ldz-shape .ic.circle-seat{width:22px;height:22px;border-radius:50%}
.ldz-shape .ic.rect-table{width:38px;height:22px;border-radius:5px}
.ldz-shape .ic.rect-area{width:38px;height:18px;border-radius:3px;border-style:dashed}
/* Bagian yang bisa ditutup-buka. Memakai <details> bawaan browser, bukan JS:
   keadaan terbuka/tertutupnya diurus browser sendiri, ikut bekerja dengan papan
   ketik dan pembaca layar, dan tidak bisa "nyangkut" gara-gara render ulang
   kanvas — yang di perancang denah ini terjadi berkali-kali per menit. */
.ldz-lipat{border:1px solid var(--line-soft);border-radius:9px;background:#fff;margin-bottom:8px}
.ldz-lipat>summary{cursor:pointer;list-style:none;padding:8px 10px;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;align-items:center;
  justify-content:space-between;gap:6px;user-select:none}
.ldz-lipat>summary::-webkit-details-marker{display:none}
.ldz-lipat>summary::after{content:'\25be';font-size:11px;transition:transform .15s;color:var(--accent)}
.ldz-lipat[open]>summary::after{transform:rotate(180deg)}
.ldz-lipat>summary:hover{color:var(--accent2);background:rgba(169,121,31,.05)}
.ldz-lipat .isi{padding:0 10px 10px}
.ldz-shape .ic.circle-table{width:26px;height:26px;border-radius:50%}
/* Bayangan bentuk yang mengikuti kursor saat ditarik dari palet. */
.ldz-ghost{position:fixed;pointer-events:none;z-index:9999;opacity:.75;border:2px dashed var(--accent);
  background:rgba(169,121,31,.14);border-radius:7px}
.ldz-ghost.circle{border-radius:50%}
.ldz-stage{flex:1;overflow:auto;background:#eeebe5;position:relative;min-height:440px;height:66vh}
.ldz-stage.pan{cursor:grab}
.ldz-stage.panning{cursor:grabbing}
.ldz-stage.placing{cursor:crosshair}
.ldz-sizer{position:relative;padding:0}
/* touch-action:none WAJIB di sini. Tanpa itu, di layar sentuh & trackpad
   presisi browser memperlakukan seretan sebagai GULIR: pointerdown sempat
   sampai, lalu browser mengambil alih dan mengirim pointercancel — pointermove
   tidak pernah tiba, dan blok-seret berhenti sebelum sempat menggambar apa pun.
   Dari sisi pengguna itu terlihat persis seperti fiturnya tidak ada. */
.ldz-canvas{position:absolute;left:0;top:0;transform-origin:0 0;background:#fff;
  touch-action:none;box-shadow:0 2px 16px rgba(50,42,28,.18)}
.ldz-canvas.bisa-blok{cursor:crosshair}
.ldz-stage.bisa-blok{touch-action:none}
.ldz-canvas.grid{background-image:linear-gradient(rgba(60,55,45,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(60,55,45,.09) 1px,transparent 1px);background-size:20px 20px}
/* Latar gambar dipasang di lapisan sendiri supaya opacity-nya bisa diatur
   tanpa ikut memudarkan objek di atasnya. */
.ldz-bg{position:absolute;inset:0;background-repeat:no-repeat;background-position:center;background-size:contain;pointer-events:none}
.ldz-item{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;line-height:1.15;text-align:center;padding:2px;overflow:hidden;
  border:2px solid;border-radius:8px;user-select:none;touch-action:none;background:#8d97a3;color:#fff}
.ldz-item.circle{border-radius:50%}
.ldz-item small{font-weight:600;font-size:9px;opacity:.85}
/* Objek kecil (kursi) memuat nomor sampai TIGA angka. Dengan font 11px bawaan,
   "210" terpotong oleh overflow:hidden dan yang terbaca cuma "21" — nomor kursi
   yang salah baca lebih berbahaya daripada nomor yang kecil. */
.ldz-item.kecil{font-size:8.5px;letter-spacing:-.04em;padding:0;line-height:1}
.ldz-item.edit{cursor:move}
.ldz-item.locked{border-style:dashed}
/* Warna isian & tulisan diatur inline per objek oleh ldzWarnaObjek() — termasuk
   untuk yang terjual. Aturan lama di sini memaksa tulisan putih dengan
   !important, yang membuat tulisan gelap pada MEJA (isian muda) tak terbaca. */
.ldz-item.sold{}
.ldz-item.checked{color:#fff!important;box-shadow:0 0 0 3px rgba(47,127,196,.35)}
.ldz-item.sel{box-shadow:0 0 0 2px var(--accent)}
/* Kotak ketik saat mengganti nomor objek langsung di kanvas. Dibuat memenuhi
   objeknya supaya tidak ada lompatan tata letak saat masuk/keluar mode ketik. */
.ldz-rename{position:absolute;inset:0;width:100%;height:100%;border:0;padding:0;
  text-align:center;font:inherit;font-weight:700;color:#fff;background:rgba(0,0,0,.45)}
.ldz-rename:focus{outline:2px solid #fff;outline-offset:-2px}
/* Garis bantu perataan: muncul sesaat saat objek yang diseret sejajar dengan
   objek lain, lalu hilang begitu dilepas. */
.ldz-guide{position:absolute;background:var(--accent);pointer-events:none;z-index:9}
.ldz-guide.v{width:1px;top:0;bottom:0}
.ldz-guide.h{height:1px;left:0;right:0}
/* Bar mode jual di tab Denah: menempel di atas kanvas supaya jumlah kursi
   terpilih tetap terlihat sambil menggulir denah yang panjang. */
.ldz-jual-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;
  padding:9px 12px;border:1px solid var(--accent);border-radius:10px;background:var(--panel2);font-size:13px}
.tpl-prev{margin-bottom:10px}
.tpl-canvas{position:relative;border:1px solid var(--line);border-radius:8px;background:var(--panel2);overflow:hidden}
.tpl-canvas i{position:absolute;display:block;border-radius:2px}
.salesbar{height:9px;border-radius:6px;background:var(--panel2);overflow:hidden}
/* Baris kategori yang bisa dibuka jadi daftar pembelinya. Kepalanya sebuah
   <button> penuh lebar, bukan teks yang kebetulan bisa diklik: kalau tidak,
   satu-satunya petunjuk bahwa baris itu bisa dibuka adalah orang yang
   kebetulan mencobanya. */
.katrow{margin-bottom:10px;border-radius:10px;padding:2px}

.kathead{display:flex;align-items:center;gap:12px;width:100%;padding:2px 0 4px;text-align:left}
/* Angka kanan disejajarkan: mata membaca kolom, bukan kalimat. Jumlah tiket
   dibuat paling besar karena itu yang dicari lebih dulu; rupiahnya menyusul
   di baris kedua supaya keduanya tidak berebut perhatian. */
.kathead .kat-angka{margin-left:auto;text-align:right;line-height:1.15;flex-shrink:0}
.kathead .kat-angka b{font-size:16px;font-weight:800}
.kathead .kat-angka .mini{font-size:11px;color:var(--muted)}
.kathead .kat-rp{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.katfoot{display:flex;justify-content:space-between;gap:10px;margin-top:5px;flex-wrap:wrap}
.katfoot b{color:var(--txt)}
/* "PENUH", bukan "HABIS", dan HIJAU, bukan merah. Kuota yang terjual seluruhnya
   adalah kabar paling baik yang bisa dipulangkan halaman ini — memberi tahunya
   dengan kata "habis" berwarna merah membuatnya terbaca sebagai kekurangan
   stok, sewarna dengan galat dan peringatan di layar yang sama. Yang membaca
   papan Ticketing sedang menghitung hasil jualan, bukan sisa gudang. */
.kat-habis{color:var(--green);font-weight:800;letter-spacing:.02em}
.salesbar{position:relative}

.katlist{margin-top:10px;background:var(--panel);border-radius:8px;overflow:hidden}
.katlist table{font-size:12.5px}
.salesbar i{display:block;height:100%;border-radius:6px}
/* Tabel penjualan bisa panjang: digulir di dalam kartunya sendiri supaya
   kepala tabel & pager tidak ikut hilang dari layar. */
.tbl-scroll{max-height:60vh;overflow:auto}
/* Hanya melebar, tidak pernah membatasi tinggi — paginasi yang menahan
   panjangnya, bukan kotak bergulir. */
.tbl-lebar{overflow-x:auto}
/* Pita hitungan kategori di halaman Check-In. Dua angka besar berdampingan —
   sudah masuk & belum datang — karena keduanya ditanyakan bersamaan. */
.ci-hitung{display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:relative;
  background:var(--panel2);border:1px solid var(--line-soft);border-radius:10px;
  padding:11px 14px 15px;margin-bottom:12px}
.ci-hitung .ci-ang{font-size:13px;font-weight:600}
.ci-hitung .ci-ang b{font-size:19px;font-weight:800;margin-right:4px}
.ci-hitung .ci-sudah b{color:var(--green)}
.ci-hitung .ci-belum b{color:var(--orange)}
.ci-bar{position:absolute;left:14px;right:14px;bottom:7px;height:4px;border-radius:4px;background:rgba(60,55,45,.14)}
.ci-bar i{display:block;height:100%;border-radius:4px;background:var(--green)}
.tbl-scroll thead th{position:sticky;top:0;z-index:1;background:var(--panel)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
/* Pager bergaya Marketing (.tbl-pager di sana). Nomornya tombol persegi kecil
   supaya deretannya terbaca sebagai satu kesatuan, bukan sederet kata. */
.tbl-pager{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  padding:11px 14px;border-top:1px solid var(--line-soft)}
.tbl-pager-nav{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.tbl-pager-nav .btn{min-width:30px;padding-left:9px;padding-right:9px;justify-content:center}
.tbl-pager-gap{color:var(--muted);padding:0 2px;font-size:12px}
/* Kotak pilihan + 8 pegangan ukuran, meniru draw.io. Pegangannya diperbesar
   (dan diberi area tekan ekstra lewat ::after) karena versi sebelumnya cuma
   satu titik 14px di pojok — itu yang bikin mengubah ukuran terasa susah. */
/* Kotak seleksi seret. Warnanya sengaja BIRU dan bukan emas seperti sisa
   antarmuka: emas 14% di atas kanvas terang nyaris tak terlihat, jadi orang
   tidak yakin seretannya sedang memblok atau justru menggeser sesuatu —
   persis keraguan yang membuat fitur ini dikira tidak ada. Biru muda dengan
   garis tegas adalah bahasa yang sudah dikenal dari Windows & draw.io. */
.ldz-marquee{position:absolute;border:1px solid #2f7fc4;background:rgba(47,127,196,.18);pointer-events:none;z-index:30}
.ldz-selbox{position:absolute;border:1px dashed var(--accent);pointer-events:none;z-index:20}
.ldz-h{position:absolute;background:#fff;border:1px solid var(--accent);border-radius:2px;pointer-events:auto;
  touch-action:none;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.ldz-h::after{content:'';position:absolute;inset:-7px}
.ldz-h.h-nw,.ldz-h.h-se{cursor:nwse-resize}
.ldz-h.h-ne,.ldz-h.h-sw{cursor:nesw-resize}
.ldz-h.h-n,.ldz-h.h-s{cursor:ns-resize}
.ldz-h.h-w,.ldz-h.h-e{cursor:ew-resize}
.ldz-bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding:9px 10px;border-bottom:1px solid var(--line);background:var(--panel2)}
.ldz-bar .grp{display:flex;gap:5px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 7px}
.ldz-bar .grp>span.lbl{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.ldz-bar select,.ldz-bar input[type=text],.ldz-bar input[type=number]{width:auto;min-width:64px;padding:4px 7px;font-size:12px}
.ldz-ib{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:7px;padding:5px 9px;
  cursor:pointer;font-size:12px;font-weight:600;font-family:inherit;line-height:1.4}
.ldz-ib:hover{border-color:var(--accent);color:var(--accent)}
.ldz-ib.on{background:var(--accent);border-color:var(--accent);color:#fff}
.ldz-ib:disabled{opacity:.4;cursor:not-allowed}
.ldz-ib.sq{padding:5px 8px;min-width:30px;text-align:center}
.ldz-zoom{font-size:12px;font-weight:700;min-width:44px;text-align:center;color:var(--muted)}
.ldz-side{width:328px;flex-shrink:0;border-left:1px solid var(--line);background:var(--panel2);padding:12px;overflow-y:auto;height:66vh}
.ldz-side h4{font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);margin:0 0 9px}
.ldz-side .field{margin-bottom:9px}
.ldz-side table{font-size:12px}
/* ---- TABEL RANGKUMAN DENAH ----
   Empat kolom (Kategori/Pax/Harga/Potensi) tidak muat di panel selebar 262px,
   jadi kolom terakhirnya terpotong tanpa isyarat apa pun bahwa masih ada isi di
   sebelah kanan — angka Potensi, yang justru jadi alasan tabel ini ada.

   Tiga hal yang memperbaikinya sekaligus: panelnya dilebarkan ke 300px,
   table-layout:fixed supaya lebar kolom ditentukan di sini (bukan oleh isi
   terpanjang), dan pembungkus overflow-x sebagai jaring terakhir — kalau suatu
   saat ada nama kategori yang sangat panjang, tabelnya bisa digulir sendiri
   dan bukan halamannya yang melebar. */
.ldz-tbl{overflow-x:auto;-webkit-overflow-scrolling:touch}
.ldz-tbl table{width:100%;table-layout:fixed;font-size:11px;border-collapse:collapse;min-width:250px}
.ldz-tbl th{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  font-weight:700;text-align:left;padding:5px 4px;border-bottom:1px solid var(--line)}
.ldz-tbl td{padding:5px 4px;border-bottom:1px solid var(--line-soft);vertical-align:top}
.ldz-tbl th:first-child,.ldz-tbl td:first-child{width:34%;word-break:break-word}
.ldz-tbl th:nth-child(2),.ldz-tbl td:nth-child(2){width:20%}
.ldz-tbl th:nth-child(3),.ldz-tbl td:nth-child(3){width:23%}
.ldz-tbl th:nth-child(4),.ldz-tbl td:nth-child(4){width:23%;text-align:right}
/* Angkanya tidak boleh dipatahkan ke baris baru — "Rp250." di satu baris dan
   "000" di baris berikutnya terbaca seperti dua angka berbeda. */
/* Hanya kolom Pax yang dilarang patah. Rupiah SENGAJA boleh turun baris:
   dengan table-layout:fixed, isi ber-nowrap yang lebih lebar dari selnya
   terpotong begitu saja — dan pembungkus overflow-x tidak menolong, karena
   tabelnya sendiri tetap selebar 100%. Terpotong diam-diam jauh lebih buruk
   daripada angka yang turun baris. */
.ldz-tbl td:nth-child(2),.ldz-tbl th:nth-child(2){white-space:nowrap}
.ldz-tbl td:nth-child(3),.ldz-tbl td:nth-child(4){word-break:break-word}
.ldz-tbl .ldz-tier{font-size:11px;gap:5px}
.ldz-tbl .ldz-tier i{width:9px;height:9px;border-radius:3px;flex-shrink:0}

/* ---- PANEL BISA DITUTUP KE PINGGIR (seperti sidebar) ----
   <details> di dalam panel hanya melipat isi satu bagian; lebar panelnya tetap
   memakan tempat. Saat merapikan denah yang lebar, yang dibutuhkan justru
   kanvasnya — jadi seluruh panel bisa disusutkan jadi rail tipis dan dibuka
   lagi sewaktu-waktu. Keadaannya disimpan di localStorage: perancang denah ini
   menggambar ulang dirinya belasan kali per menit, dan panel yang membuka
   sendiri tiap kali objek digeser lebih mengganggu daripada tidak bisa ditutup
   sama sekali. */
.ldz-palette.tutup,.ldz-side.tutup{width:32px;min-width:32px;padding:8px 0;overflow:hidden;
  align-items:center;justify-content:flex-start}
.ldz-rail{border:0;background:none;cursor:pointer;color:var(--muted);font-weight:700;
  display:flex;flex-direction:column;align-items:center;gap:12px;padding:4px 0;width:100%;font-size:13px}
.ldz-rail span{writing-mode:vertical-rl;text-orientation:mixed;font-size:9.5px;
  letter-spacing:.2em;text-transform:uppercase}
.ldz-rail:hover{color:var(--accent)}
.ldz-phead{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:8px}
.ldz-phead b{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.ldz-px{border:1px solid var(--line);background:var(--panel);border-radius:7px;cursor:pointer;
  color:var(--muted);font-size:12px;line-height:1;padding:3px 7px;flex-shrink:0}
.ldz-px:hover{border-color:var(--accent);color:var(--accent)}
.ldz-tier{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.ldz-tier i{width:12px;height:12px;border-radius:4px;display:inline-block;border:1px solid rgba(0,0,0,.15)}
.ldz-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--muted)}
.ldz-hint{font-size:11px;color:var(--muted);line-height:1.6;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.ldz-hint b{color:var(--txt)}
.ldz-wrap{overflow:auto;background:var(--panel2);border:1px solid var(--line-soft);border-radius:12px;padding:12px}
/* Denah yang cuma DIBACA (Kursi Terisi Langsung & rincian kategori) tidak
   pernah digulir: seluruh denah diperkecil sampai muat. Menggulir denah
   berarti kehilangan gambaran ruangan secara utuh — dan gambaran utuh itulah
   satu-satunya alasan denah ditampilkan. Yang bisa DIEDIT tetap bergulir;
   di sana orang memang bekerja pada satu sudut ruangan. */
#liveDenah .ldz-wrap,#katDenah .ldz-wrap{overflow:hidden}
@media(max-width:900px){ .ldz-app{flex-direction:column} .ldz-palette{width:auto;flex-direction:row;flex-wrap:wrap;border-right:none;border-bottom:1px solid var(--line)}
  .ldz-side{width:auto;height:auto;border-left:none;border-top:1px solid var(--line)} .ldz-stage{height:52vh}
  /* Panel sudah bertumpuk vertikal di layar sempit, jadi rail tipis di samping
     tidak ada gunanya — yang ditutup justru menyusut jadi baris pendek. */
  .ldz-palette.tutup,.ldz-side.tutup{width:auto;min-width:0;height:auto;padding:6px 10px}
  .ldz-rail{flex-direction:row;justify-content:center;gap:8px}
  .ldz-rail span{writing-mode:horizontal-tb} }
.stage-bar{background:linear-gradient(var(--panel2),var(--panel));text-align:center;padding:8px;border-radius:8px;color:var(--muted);letter-spacing:3px;font-size:12px;margin-bottom:14px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:10px 0}
.legend span{display:flex;align-items:center;gap:5px}
.dotc{width:12px;height:12px;border-radius:3px;display:inline-block}
.progress{height:8px;background:var(--panel2);border-radius:5px;overflow:hidden;margin-top:6px}
.progress>div{height:100%;background:var(--accent)}
.qr{width:150px;height:150px;image-rendering:pixelated;background:#fff;padding:8px;border-radius:8px}
.empty{text-align:center;padding:40px;color:var(--muted)}
/* Dua kelas yang dipakai tapi tidak pernah punya aturan. Bukan kerusakan
   parah seperti .tbl-note di bawah — cuma tombol yang berdempetan tanpa sela
   dan angka yang tidak sejajar — tapi keduanya memang dimaksudkan bergaya. */
.pill-row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
/* Pemilih talent berbanyak di Recurring. Panel ini hidup DI DALAM modal yang
   sedang terbuka, bukan sebagai modal kedua: modal() menimpa seluruh isi
   #modalRoot, jadi popup bertingkat akan menghapus formulir yang sedang diisi
   beserta tanggal & centang hari yang sudah dipilih. */
.tal-pop{border:1px solid var(--line-hard);border-radius:9px;background:var(--panel2);
  padding:9px;margin-top:8px;max-height:190px;overflow:auto}
/* TOMBOL TALENT — bentuknya sepasang dengan tombol shift (.pick button) di
   Jadwal Shift: kotak berwarna, nama tebal, keterangan kecil di bawahnya.
   Bentuk pil abu-abu yang dipakai sebelumnya memaksa mata membaca tiap nama
   satu per satu; yang berwarna bisa dikenali sebelum dibaca. */
.tal-b{border:2px solid transparent;border-radius:10px;padding:8px 11px;cursor:pointer;
  font-family:inherit;width:auto;text-align:left;line-height:1.2;
  display:inline-flex;flex-direction:column;gap:2px;min-width:104px;
  box-shadow:0 1px 2px rgba(36,31,24,.10);transition:transform .12s,box-shadow .12s}
.tal-b b{font-size:12px;font-weight:800;letter-spacing:.01em}
.tal-b small{font-size:9.5px;font-weight:600;opacity:.85;font-variant-numeric:tabular-nums}
.tal-b:hover{transform:translateY(-1px);box-shadow:0 3px 8px rgba(36,31,24,.16)}
.tal-b.on{border-color:var(--txt);transform:scale(1.03)}
.tal-b:active{transform:scale(.97)}
/* Lembar mingguan talent — bentuknya sengaja meniru lembar Jadwal Shift:
   tujuh kolom hari di atas, tombol yang mengisi di bawah. Kru yang bolak-balik
   antara dua modul tidak perlu belajar dua tata letak untuk pekerjaan yang
   sama persis. Bedanya satu dan penting: di Jadwal Shift satu sel = satu
   shift, di sini satu HARI bisa berisi beberapa talent (pembuka, band utama,
   DJ penutup), jadi selnya menumpuk chip, bukan mengganti isi. */
.mg-hari{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:8px}
.mg-h{border:2px solid var(--line);border-radius:11px;background:var(--panel);
  padding:7px 5px 8px;min-height:96px;text-align:center;cursor:pointer;color:var(--muted);
  transition:border-color .12s,background .12s}
.mg-h:hover{border-color:var(--accent);background:var(--panel2)}
.mg-h.sel{border-color:var(--txt);background:var(--panel2);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.mg-h.jatuh{border-style:dashed;border-color:var(--accent);
  background:color-mix(in srgb,var(--accent) 14%,var(--panel))}
.mg-h small{display:block;font-size:9px;font-weight:800;letter-spacing:.08em;
  color:var(--muted);text-transform:uppercase}
.mg-h.wknd small{color:var(--red)}
.mg-h b{display:block;font-size:13px;font-weight:700;color:var(--txt);margin-bottom:5px}
.mg-h .kosong{font-size:15px;color:color-mix(in srgb,var(--muted) 45%,transparent);line-height:1.6}
/* Chip mengambil warna kategori talentnya — sama seperti sel shift di lembar
   Jadwal Shift. Itu yang membuat pola sebulan ("Jumat selalu biru") terbaca
   tanpa membaca satu nama pun. */
.mg-c{display:block;font-size:9.5px;font-weight:800;line-height:1.3;border-radius:6px;
  padding:3px 4px;margin:3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  cursor:pointer}
.mg-c.lama{opacity:.5;font-weight:600;font-style:italic;cursor:default}
.mg-tal{display:flex;gap:7px;flex-wrap:wrap;max-height:186px;overflow:auto;
  border:1.5px solid var(--line);border-radius:11px;padding:10px;background:var(--panel2)}
.mg-tal .tal-b{cursor:grab}
.mg-tal .tal-b:active{cursor:grabbing}
@media(max-width:560px){
  .mg-hari{gap:3px}
  .mg-h{min-height:74px;padding:5px 3px;border-radius:8px}
  .mg-h b{font-size:11px}
  .tal-b{min-width:0}
}
/* Lembar kehadiran talent × hari, di bawah kalender. Sel sengaja SEMPIT:
   sebulan itu 31 kolom, dan lembar yang tiap selnya memuat teks tidak akan
   pernah muat di satu layar — yang dicari orang di sini pola, bukan detail
   (siapa yang tiap Jumat, siapa yang menghilang dua minggu). Detailnya satu
   klik jauhnya di kalender di atasnya. */
.lembar{border-collapse:collapse;font-size:11px}
.lembar th,.lembar td{border:1px solid var(--line);padding:0;text-align:center}
.lembar th{background:var(--panel2);font-weight:600;color:var(--muted);
  padding:4px 0;min-width:22px;font-size:10px}
.lembar th.nm,.lembar td.nm{text-align:left;padding:4px 8px;min-width:150px;
  position:sticky;left:0;background:var(--panel);z-index:1;white-space:nowrap}
.lembar th.wknd,.lembar td.wknd{background:color-mix(in srgb,var(--muted) 9%,transparent)}
.lembar td.jml{padding:4px 7px;font-variant-numeric:tabular-nums;white-space:nowrap}
.lembar i{display:block;width:100%;height:20px;line-height:20px;font-style:normal;
  font-size:10px;font-weight:700;color:#241d05}
.lembar th .hh{display:block;font-size:8px;font-weight:700;letter-spacing:.03em;
  color:var(--muted);opacity:.75;line-height:1.1}
.lembar th.wknd .hh{color:var(--red);opacity:.9}
tr.fee-on>td{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
/* Catatan kecil di atas daftar (mis. "3 rencana menunggu keputusanmu").
   Kelas ini disalin dari Marketing tapi CSS-nya TIDAK ikut terbawa, dan
   akibatnya jauh lebih parah daripada "tampilannya kurang rapi": <svg>
   dengan viewBox tanpa width/height dan tanpa aturan CSS akan MELAR memenuhi
   lebar wadahnya — di layar 1500px ia jadi kotak ~1500×1500 yang mendorong
   seluruh daftar kartu jauh ke bawah layar. Halaman Perencanaan Event tampak
   KOSONG total padahal kartunya ada, hitungan tabnya benar, dan tidak ada
   satu pun galat di console. Sudah memakan satu sesi pelacakan penuh
   (3 Agustus 2026). Jangan hapus aturan ukuran svg di bawah. */
.tbl-note{display:flex;align-items:center;gap:8px;margin:12px 0;padding:9px 13px;border-radius:10px;
  background:var(--panel2);border:1px solid var(--line-soft);color:var(--muted);
  font-size:12px;line-height:1.5}
.tbl-note svg{width:15px;height:15px;flex:none;color:var(--accent2);opacity:.8}
.tbl-note b{color:var(--txt);font-weight:700}
.checklist label{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);color:var(--txt);font-size:13px;cursor:pointer;margin:0}
.checklist input{width:auto}
.bar-chart{display:flex;align-items:flex-end;gap:10px;height:160px;padding-top:10px}
.bar-chart .bar{flex:1;background:linear-gradient(var(--accent),var(--accent2));border-radius:5px 5px 0 0;position:relative;min-height:4px}
.bar-chart .bar span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:10px;color:var(--muted)}
.bar-chart .bar b{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:10px;color:var(--txt)}
.toast{position:fixed;bottom:24px;right:24px;background:var(--panel);border:1px solid var(--accent);color:var(--txt);padding:12px 18px;border-radius:8px;z-index:200;box-shadow:0 8px 30px rgba(0,0,0,.5);font-size:13px;animation:slideup .3s}
@keyframes slideup{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.mini{font-size:12px;color:var(--muted)}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:13px}
.kv .k{color:var(--muted)}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <!-- Struktur brand & side-user disamakan dengan modul Marketing/Reservasi:
         logo asli (bukan emoji), nama + sublabel, dan blok user di bawah. -->
    <div class="brand">
      <img id="brand-logo" alt="">
      <div><div class="bt">Laksamana Muda</div><div class="bs">Event</div></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <!-- Kaki sidebar dikosongkan.

         "Data: Tersimpan" praktis selalu berbunyi sama, jadi ia berhenti
         dibaca justru pada saat isinya berubah — dan yang benar-benar perlu
