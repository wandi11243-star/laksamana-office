    h+='<div style="display:flex;gap:6px;margin-top:12px"><button class="ldz-ib" onclick="ldzDuplicate(\''+eid+'\')">Gandakan</button>'
     +'<button class="ldz-ib" style="color:var(--red);border-color:var(--red)" onclick="ldzDelete(\''+eid+'\')">Hapus</button></div>';
  } else {
    /* Rangkuman lengkap per kategori: berapa objek, berapa pax yang muat,
       harga satuannya, dan berapa uang yang bisa masuk kalau semuanya terjual.
       Dulu kolom terakhir cuma harga satuan — angka yang tidak menjawab
       pertanyaan yang sebenarnya ditanyakan orang saat menyusun denah:
       "kalau penuh, dapat berapa?" */
    const tot=ldzCap(eid);
    const nama=ldzTierNames(eid);
    let totalUang=0, totalObj=0;
    const baris=nama.map(function(t){
      const info=ldzTierInfo(eid,t);
      /* AREA TIDAK IKUT DIHITUNG — sama seperti ldzCap() yang memasok angka
         Total. Sebelumnya baris memasukkan area sedangkan Total tidak, jadi
         tabelnya membantah dirinya sendiri: satu baris 92 pax, totalnya 83.
         Area adalah penanda zona (STAGE, EXT, tangga), bukan kursi yang dijual;
         backend ticketing pun menolaknya dengan alasan yang sama. */
      const mine=its.filter(function(i){ return i.tier===t && !ldzAdalahArea(i); });
      const cap=mine.reduce(function(a,i){ return a+(+i.capacity||1); },0);
      const uang=cap*(+info.price||0);
      totalUang+=uang; totalObj+=mine.length;
      const terjual=mine.filter(ldzTerjual).length;
      /* Kolom "Objek" DIBUANG. Jumlah kotak di layar bukan angka yang dipakai
         siapa pun untuk mengambil keputusan — yang ditanyakan selalu berapa
         orang yang muat dan berapa uangnya. Yang menggantikan tempatnya:
         berapa pax yang SUDAH terjual, karena itu yang membedakan rangkuman
         ini dari sekadar daftar harga. */
      const paxTerjual=mine.filter(ldzTerjual).reduce(function(a,i){ return a+(+i.capacity||1); },0);
      return '<tr'+(mine.length?'':' style="opacity:.5"')+'>'
        +'<td><span class="ldz-tier"><i style="background:'+info.c+'"></i>'+esc(t)+'</span></td>'
        +'<td class="mini"><b>'+cap+'</b> pax'+(paxTerjual?'<div class="mini">'+paxTerjual+' terjual</div>':'')+'</td>'
        +'<td class="mini">'+(info.price?IDR(info.price):'—')+'</td>'
        +'<td class="mini"><b>'+(uang?IDR(uang):'—')+'</b></td></tr>';
    }).join('');
    h+='<details class="ldz-lipat" open><summary>Rangkuman Denah</summary><div class="isi">'
     +'<div class="ldz-tbl">'
     +'<table><thead><tr><th>Kategori</th><th>Pax</th><th>Harga</th><th>Potensi</th></tr></thead>'
     +'<tbody>'+baris
     +'<tr><td><b>Total</b></td>'
     +'<td class="mini"><b>'+tot+' pax</b></td><td></td>'
     +'<td class="mini"><b style="color:var(--accent)">'+IDR(totalUang)+'</b></td></tr>'
     +'</tbody></table></div>'
     +'<p class="mini" style="margin-top:8px">Menghitung <b>Lantai '+ldzLantai()+'</b> saja — pindah lantai untuk melihat sisanya. Objek area (STAGE, EXT, tangga) tidak dihitung karena bukan kursi yang dijual.<br><b>Potensi</b> = kapasitas × harga, kalau seluruh kursi terjual. Kategori &amp; harganya diambil dari tab <b>Kelas Tiket</b> event ini'
     +(DB.ticketClasses.some(function(c){return c.event_id===eid;})?'':' — event ini belum punya kelas tiket, jadi yang dipakai empat tingkatan bawaan')+'.</p>'
     +'</div></details>';
  }
  h+='<div class="ldz-hint"><b>Seret</b> di area kosong untuk memblok banyak objek sekaligus.<br>'
   +'<b>Shift+klik</b> menambah/melepas satu objek · <b>klik ganda</b> ganti nomor.<br>'
   +'<b>Ctrl+Z</b> batalkan · <b>Ctrl+Y</b> ulangi · <b>Ctrl+C/V</b> salin-tempel.<br>'
   +'<b>Ctrl+A</b> pilih semua · <b>Ctrl+D</b> gandakan · <b>Delete</b> hapus · <b>panah</b> geser.<br>'
   +'<b>Panah</b> geser 1px (Shift 10px).<br>'
   +'<b>Ctrl+scroll</b> zoom · <b>Spasi+seret</b> atau <b>klik tengah</b> untuk menggeser kanvas.<br>'
   +'<b>Shift</b> saat menarik pegangan sudut menjaga rasio.</div>';
  return h;
}

/* ================= PUSTAKA TEMPLATE DENAH =================
   Menggambar ulang denah venue dari nol tiap kali ada acara adalah pekerjaan

   DISIMPAN sebagai template dan dimuat oleh event berikutnya dalam sekali klik,
   lengkap dengan posisi, ukuran, bentuk, kapasitas, dan penomorannya.

   Kenapa menyimpan denah yang sudah digambar, bukan menuliskan koordinat tiap
   kursi di dalam kode: koordinat yang disalin dari foto denah tidak akan pernah
   persis, dan begitu venue menggeser satu blok meja, kode ikut harus diubah dan
   di-deploy. Template yang lahir dari denah asli selalu cocok dengan kenyataan,
   dan yang mengurusnya orang yang memang tahu tata letaknya.

   Kategori tiket TIDAK ikut disalin apa adanya — yang disimpan namanya saja,
   lalu dipetakan ke kelas tiket milik event tujuan saat dimuat. Event yang
   berbeda menjual kelas yang berbeda; menyalin id kelas antar event akan
   membuat kursi tertaut ke tiket yang bukan miliknya. */
/* ================= DENAH BAWAAN LAKSAMANA MUDA =================
   Disusun dengan MENSKALAKAN denah cetak venue (±1,5×), bukan menaruh objek
   sesuka penata: letak tiap meja, panggung, EXT, dan ruang talent mengikuti
   proporsi gambar aslinya.

   URUTAN PENOMORAN mengikuti denah cetak, dan itu TIDAK sama dengan urutan
   menggambar yang paling nyaman:

     U1–U3 .......... 1–24     (7 + 8 + 9)
     31, 32 ......... 25–36    (6 kursi bernomor tiap meja, label 7 pax)
     24, 23, 22, 21 . 37–52    (bundar, 4 tiap meja)
     33, 34 ......... 53–64
     35 ............. 65–70
     42-43 .......... 71–75
     44 ............. 76–79
     45 ............. 80–83
     S1 ............. 84–93    S2 94–97   S3 98–107  S5 108–117
     S4 ............. 118–121  S6 122–125 41 126–129
     11–19 .......... 130–166
     1–9 ............ 167–211

   Versi sebelumnya menomori menurut urutan pembuatan, sehingga meja bundar
   mendapat 53–64 dan meja 33/34 mendapat 37–52 — tertukar dari denah cetak. Itu
   bukan soal kerapian: nomor kursi ikut tercetak di e-ticket, dan tamu memegang
   kertas bernomor yang menunjuk meja yang salah.

   Perlu diketahui: kapasitas LABEL dan jumlah KURSI BERNOMOR tidak selalu sama.
   Meja 31–34 berlabel "7 pax" tapi hanya punya 6 kursi bernomor di denah cetak
   (satu tempat memang tanpa nomor). Keduanya disimpan terpisah supaya rekap
   kapasitas tetap benar tanpa mengarang kursi bernomor yang tidak ada.

   Denah bawaan MENAMBAHKAN, tidak menghapus, dan bisa dibatalkan dengan Ctrl+Z.
   Sesudah dirapikan, simpan lewat "Simpan sebagai Template" — event berikutnya
   memakai versi rapi itu. */

/* Penempatan kursi di sekeliling meja, ditulis EKSPLISIT per meja.

   Denah cetak tidak memakai satu pola untuk semua: meja 44 punya kursi di
   empat sisi (kiri, atas, kanan, bawah), meja 42-43 punya satu di kiri lalu
   dua atas & dua bawah, dan meja ujung barisan (1 dan 9, 19) punya satu kursi
   tambahan di sisi lorong. Pola tebak-tebakan "separuh atas separuh bawah"
   tidak akan pernah cocok dengan semuanya — dan nomor kursi yang salah tempat
   ikut tercetak di e-ticket.

   Formatnya deretan sisi + jumlah, DALAM URUTAN PENOMORAN denah cetak:
     'l1,t2,b2' → 1 kiri (nomor terkecil), lalu 2 atas, lalu 2 bawah
     't2,b2,r1' → 2 atas, 2 bawah, lalu 1 di kanan (nomor terbesar)
   Sisi: t=atas, b=bawah, l=kiri, r=kanan. */
function ldzKursiSekitar(o, nomor, x, y, w, h, spek){
  const d=18, j=5;
  const bikin=function(cx,cy){ o.push({kind:'seat',shape:'circle',lbl:String(nomor.n++),x:Math.round(cx),y:Math.round(cy),w:d,h:d}); };
  const sebar=function(n,p1,p2){ const out=[]; for(let i=0;i<n;i++) out.push(p1+((p2-p1)/(n+1))*(i+1)); return out; };
  String(spek||'').split(',').forEach(function(bag){
    const sisi=bag.charAt(0), n=+bag.slice(1)||0;
    if(!n) return;
    if(sisi==='t') sebar(n,x,x+w).forEach(function(cx){ bikin(cx-d/2, y-d-j); });
    else if(sisi==='b') sebar(n,x,x+w).forEach(function(cx){ bikin(cx-d/2, y+h+j); });
    else if(sisi==='l') sebar(n,y,y+h).forEach(function(cy){ bikin(x-d-j, cy-d/2); });
    else if(sisi==='r') sebar(n,y,y+h).forEach(function(cy){ bikin(x+w+j, cy-d/2); });
  });
}
// Jumlah kursi dalam sebuah spek — dipakai memeriksa kecocokannya dengan pax.
function ldzJumlahSpek(spek){
  return String(spek||'').split(',').reduce(function(a,b){ return a+(+b.slice(1)||0); },0);
}
function ldzBawaanL1(){
  const o=[], nomor={n:1};
  const area=function(lbl,x,y,w,h){ o.push({kind:'area',shape:'rect',lbl:lbl,x:x,y:y,w:w,h:h}); };
  /* pax   = kapasitas tercetak di denah (dipakai rekap & potensi pendapatan)
     spek  = penempatan kursi bernomor, dalam urutan penomoran denah cetak */
  const meja=function(lbl,x,y,w,h,pax,shape,spek){
    o.push({kind:'table',shape:shape||'rect',lbl:lbl,x:x,y:y,w:w,h:h,cap:pax});
    if(spek) ldzKursiSekitar(o,nomor,x,y,w,h,spek);
  };
  const ext=function(no,x,y,w,h){ o.push({kind:'table',shape:'rect',lbl:'EXT '+no,x:x,y:y,w:w,h:h,cap:2}); };

  // ---- kerangka ruangan (skala ±1,5x dari denah cetak) ----
  area('MEJA DJ',780,58,160,32);
  area('STAGE',600,45,535,150);
  area('TALENT ROOM',1440,45,125,480);
  area('ENTRANCE',12,470,30,120);

  /* U1–U3 menempel dinding barat: kursi di ATAS, KIRI, lalu BAWAH — sisi kanan
     menghadap lorong, jadi tidak berkursi. Jarak antar meja memuat dua baris

function ldzBawaanL2(){
  const o=[];
  const area=function(lbl,x,y,w,h,pola,petak){ o.push({kind:'area',shape:'rect',lbl:lbl,x:x,y:y,w:w,h:h,pola:pola,petak:petak}); };
  /* Semua posisi dihitung DARI KOTAK VOID, jadi ketiga barisan kursi selalu
     menempel walau ukuran voidnya diubah. */
  const V={x:300,y:210,w:880,h:400};
  const d=18, jr=4;
  area('STAGE',Math.round(V.x+V.w/2-190),40,380,140);
  area('VOID LANTAI 2',V.x,V.y,V.w,V.h);
  let n=1;
  const nKiri=22, sKiri=V.h/nKiri;
  for(let i=0;i<nKiri;i++) o.push({kind:'seat',shape:'rect',lbl:String(n++),
    x:V.x-d-jr, y:Math.round(V.y+sKiri*i+(sKiri-d)/2), w:d,h:d});
  const nBawah=39, sBawah=V.w/nBawah;
  for(let i=0;i<nBawah;i++) o.push({kind:'seat',shape:'rect',lbl:String(n++),
    x:Math.round(V.x+sBawah*i+(sBawah-d)/2), y:V.y+V.h+jr, w:d,h:d});
  const nKanan=22, sKanan=V.h/nKanan;
  for(let i=0;i<nKanan;i++) o.push({kind:'seat',shape:'rect',lbl:String(n++),
    x:V.x+V.w+jr, y:Math.round(V.y+V.h-sKanan*(i+1)+(sKanan-d)/2), w:d,h:d});
  /* Zona REGULER digambar BERPETAK penuh seperti denah cetak: petak 26px kira-
     kira satu kursi, jadi luasnya langsung terbaca sebagai daya tampung
     walaupun kursinya tidak bernomor dan tidak dijual satu-satu. */
  area('REGULER',60,V.y,190,V.h,'petak',26);
  area('REGULER',V.x+V.w+40,V.y,190,V.h,'petak',26);
  area('TANGGA',60,V.y+V.h+40,120,60);
  area('TANGGA',V.x+V.w+40,V.y+V.h+40,120,60);
  /* Blok bawah (REGULER – OPERATOR – REGULER) DIPUSATKAN terhadap void, tidak
     lagi dipatok mulai x=120. Operator di denah cetak berada tepat di tengah
     bentang void; kalau lebar blok atau void diubah, titik tengahnya ikut
     dihitung ulang sendiri. */
  const yb=V.y+V.h+120;
  const wReg=430, wOp=120, sela=30;
  const wBlok=wReg*2+wOp+sela*2;
  const x0=Math.round(V.x+V.w/2-wBlok/2);
  area('REGULER',x0,yb,wReg,150,'petak',26);
  area('OPERATOR',x0+wReg+sela,yb,wOp,150);
  area('REGULER',x0+wReg+sela+wOp+sela,yb,wReg,150,'petak',26);
  return {kanvas:{w:1440,h:yb+180},objek:o};
}

function ldzPasangBawaan(eid){
  const e=DB.events.find(function(x){ return x.id===eid; }); if(!e) return;
  const lantai=ldzLantai();
  const tpl=(lantai==='2')?ldzBawaanL2():ldzBawaanL1();
  const namaKelas=(lantai==='2')?'Reguler+':'VIP';
  let cls=DB.ticketClasses.find(function(c){ return c.event_id===eid && c.name===namaKelas; });
  if(!cls){
    cls={id:uid(),event_id:eid,name:namaKelas,price:0,quota:0,sold:0,
         sale_start:e.start_datetime||'',sale_end:e.start_datetime||'',
         description:'Dibuat dari denah bawaan',benefit:namaKelas,is_seated:true};
    DB.ticketClasses.push(cls);
  }
  if(lantai==='2' && !DB.ticketClasses.some(function(c){ return c.event_id===eid && c.name==='Reguler'; })){
    DB.ticketClasses.push({id:uid(),event_id:eid,name:'Reguler',price:0,quota:100,sold:0,
      sale_start:e.start_datetime||'',sale_end:e.start_datetime||'',
      description:'Zona reguler tanpa nomor kursi',benefit:'Area reguler',is_seated:false});
  }
  const L=ldzMeta(eid);
  L.w=Math.max(L.w,tpl.kanvas.w); L.h=Math.max(L.h,tpl.kanvas.h);
  const baru=tpl.objek.map(function(o){
    return {id:uid(),event_id:eid,ticket_class_id:cls.id,zone:'Custom',floor:lantai,
            kind:o.kind,shape:o.shape,tier:cls.name,
            x:o.x,y:o.y,w:o.w,h:o.h,
            capacity:(o.kind==='area')?0:(o.kind==='table'?(+o.cap||0):1),
            // pola isian ikut dibawa: zona REGULER digambar berpetak penuh
            pola:o.pola||'', petak:+o.petak||0,
            table_no:o.lbl,seat_no:o.lbl,status:'Available'};
  });
  ldzPasangKeLantai(eid, baru, 'Denah Bawaan LM', function(disisakan){
    ldzSetSel([]);
    if(document.querySelector('.tabs')) renderTicketDetail(eid); else ldzRepaint(eid);
    const kursi=baru.filter(function(i){ return i.kind==='seat'; }).length;
    const meja=baru.filter(function(i){ return i.kind==='table'; }).length;
    const luas=baru.filter(function(i){ return i.kind==='area'; }).length;
    toast('✓ Denah bawaan Lantai '+lantai+' — '+kursi+' kursi bernomor, '+meja+' meja, '+luas+' area.'
      +(disisakan?' '+disisakan+' objek lama dipertahankan karena tiketnya sudah terjual.':'')
      +' Rapikan lalu Simpan sebagai Template.');
  });
}

/* Pemetaan kategori: tiap nama kategori di template dipasangkan dengan kelas
   tiket milik event ini. Bawaannya kelas bernama sama kalau ada; kalau tidak,
   kelas pertama — dan itu ditampilkan, bukan diputuskan diam-diam. */
/* Pratinjau kecil: denah template digambar ulang sebagai kotak-kotak mungil,
   diskalakan agar muat. Tanpa ini nama template ("LM Lantai 1") adalah
   satu-satunya petunjuk isinya — dan begitu ada tiga template dengan nama
   mirip, memilihnya jadi tebak-tebakan yang baru ketahuan salah sesudah
   objeknya terlanjur masuk ke denah. */
function ldzTplPreviewHTML(t){
  if(!t||!t.objek||!t.objek.length) return '<span class="mini">Template kosong.</span>';
  const W=(t.kanvas&&+t.kanvas.w)||1200, H=(t.kanvas&&+t.kanvas.h)||760;
  const lebar=320, sk=lebar/W, tinggi=Math.max(60,Math.round(H*sk));
  return '<div class="tpl-canvas" style="width:'+lebar+'px;height:'+tinggi+'px">'
   +t.objek.map(function(o){
      const warna=(o.kind==='table')?'#c9b28c':'#2f7fc4';
      return '<i style="left:'+Math.round((+o.x||0)*sk)+'px;top:'+Math.round((+o.y||0)*sk)+'px;'
       +'width:'+Math.max(2,Math.round((+o.w||40)*sk))+'px;height:'+Math.max(2,Math.round((+o.h||40)*sk))+'px;'
       +'background:'+warna+(o.shape==='circle'?';border-radius:50%':'')+'"></i>';
   }).join('')
   +'</div><div class="mini">'+t.objek.length+' objek · kanvas '+W+'×'+H+' · Lantai '+esc(t.lantai||'1')+'</div>';
}

       +kelas.map(function(c){ return '<option value="'+c.id+'"'+((sama&&sama.id===c.id)?' selected':'')+'>'+esc(c.name)+'</option>'; }).join('')
       +'</select></td></tr>';
   }).join('')
   +'</tbody></table></div>';
}

/* ---- MODE JUAL DI TAB LAYOUT ----
   Denah yang sudah dirancang kini bisa dipakai berjualan langsung, seperti
   memilih meja di modul Reservasi: klik kursinya, lalu tekan Booking. Dulu
   klik pada denah di luar mode edit hanya MEMUTAR status kursi

   pesanan, tidak ada nama pembelinya, dan tidak ada tiket maupun QR yang
   terbit. Kursi jadi "terjual" tanpa ada yang membelinya.

   Mode jual memakai pilihan yang sama dengan layar Catat Penjualan

function ldzJualAktif(){ return !window._ldzEdit && window._ldzJual; }
function ldzToggleJual(eid){
  window._ldzJual=!window._ldzJual;
  /* Dulu baris ini memaksa `_tixTab='sales'`, karena pemilih kursi memang
     tinggal di halaman Penjualan. Sejak menjual dipisah ke tabnya sendiri
     (7 Agustus 2026), paksaan itu jadi bug yang persis kebalikan maunya:
     menekan "Pesankan kursi di denah" dari tab Jual Tiket justru melempar
     orang ke halaman rekap — pemilih kursinya menyala di tab yang baru saja
     ia tinggalkan. Yang benar: nyalakan modenya, jangan pindahkan orangnya.
     Kalau dipanggil dari tab Denah & Booking, mode desain dimatikan supaya
     kedua mode tidak menyala bersamaan di kanvas yang sama. */
  if(window._ldzJual){
    window._ldzEdit=false;
    if(window._tixTab!=='jual' && window._tixTab!=='layout') window._tixTab='jual';
  }
  beliSetSel([]);
  renderTicketDetail(eid);
}
function ldzBarJualHTML(eid){
  if(!ldzJualAktif()) return '';
  const pilih=beliSel();
  const nama=pilih.map(function(id){ const x=DB.seats.find(function(s2){ return s2.id===id; }); return (x&&(x.table_no||x.seat_no))||'?'; });
  return '<div class="ldz-jual-bar">'
   +'<span>'+(pilih.length?('<b>'+pilih.length+' kursi</b> · '+esc(nama.join(', ')))
        :'Klik kursi untuk memilih — atau <b>seret di ruang kosong</b> untuk memblok banyak kursi sekaligus.')+'</span>'
   +(pilih.length?'<button class="btn ghost sm" onclick="beliSetSel([]);renderTicketDetail(\''+eid+'\')">Kosongkan</button>'
     +'<button class="btn blue sm" onclick="purchaseFlow(\''+eid+'\',true)">Booking '+pilih.length+' kursi →</button>':'')
   +'</div>';
}
function layoutBody(eid){
  window._ldzEid=eid;
  if(window._ldzTier==null) window._ldzTier='Regular';
  if(window._ldzZoom==null) window._ldzZoom=1;
  ldzSetSel(ldzSel().filter(ldzFind));   // buang sisa pilihan dari event lain
  return '<div id="ldzRoot">'+ldzInner(eid)+'</div>';
}

function seatMapBody(id){
  const seats=DB.seats.filter(s=>s.event_id===id);
  const rplus=seats.filter(s=>s.zone==='Reguler+').sort((a,b)=>a.seat_no-b.seat_no);
  const rL1=seats.filter(s=>s.zone==='Lantai 1');
  // Pemilih lantai — tampil begitu salah satu denah ada.
  window._lmFloor = window._lmFloor || (rplus.length?'2':(rL1.length?'1':'2'));
  const fl=window._lmFloor;
  // Saat read-only (Kursi Terisi Langsung di Check-In), tab lantai me-refresh denah
  // saja (renderLiveDenah) — bukan renderTicketDetail — agar scanner tak reset.
  const go=f=>window._denahRO?('window._lmFloor=\''+f+'\';renderLiveDenah(\''+id+'\')')
                            :('window._lmFloor=\''+f+'\';renderTicketDetail(\''+id+'\')');
  const tabs='<div class="lm-floors">'
    +'<button class="'+(fl==='2'?'on':'')+'" onclick="'+go('2')+'">Lantai 2 — Reguler+</button>'
    +'<button class="'+(fl==='1'?'on':'')+'" onclick="'+go('1')+'">Lantai 1 — Meja</button></div>';
  if(fl==='1') return tabs+renderL1(id);
  return tabs+renderL2Hall(id);
}
function renderL2Hall(id){
  // Objek denah kustom SENGAJA dikecualikan: tempatnya di tab Layout Kustom,
  // yang menggambarnya pada koordinat sendiri — kalau ikut ke sini ia jatuh
  // sebagai grid datar tanpa tata letak dan membingungkan.
  const seats=DB.seats.filter(s=>s.event_id===id && s.zone!=='Custom');
  const rplus=seats.filter(s=>s.zone==='Reguler+').sort((a,b)=>a.seat_no-b.seat_no);
  if(!rplus.length){
    // fallback: kalau ada seat lain (mis. VIP table lama), tetap tampilkan;
    // selalu tawarkan template LM.
    let h='<div class="card"><h3 class="sec">Denah Kursi</h3>'
      +'<p class="mini">Belum ada denah Reguler+. Buat template venue Laksamana Muda — 83 kursi bernomor mengelilingi panggung (Lantai 2)'
      +(window._denahRO?'':', atau susun denah sendiri di tab <b>Layout Kustom</b>')+'.</p>'
      +'<button class="btn" onclick="buatDenahLM(\''+id+'\')">+ Buat Denah Laksamana Muda</button>';
    if(seats.length){ h+='<div class="stage-bar" style="margin-top:16px">S T A G E</div><div class="seatmap">'
      +seats.map(s=>'<div class="seat '+seatCls(s)+'" title="'+esc(s.table_no)+' — '+s.status+'">'+esc(s.table_no)+'</div>').join('')+'</div>'; }
    return h+'</div>';
  }
  const kiri=rplus.filter(s=>s.seat_no<=23);
  const depan=rplus.filter(s=>s.seat_no>=24 && s.seat_no<=60);
  const kanan=rplus.filter(s=>s.seat_no>=61).slice().reverse();  // 83 di atas → 61 di bawah (poster)
  const terisi=rplus.filter(s=>seatCls(s)!=='available').length;
  const reg=DB.ticketClasses.find(c=>c.event_id===id && c.name==='Reguler');

  let h='<div class="card"><h3 class="sec">Denah Lantai 2 — Reguler+ <span class="mini" style="font-weight:400">('+terisi+'/'+rplus.length+' terisi)</span></h3>'
    +'<p class="mini" style="margin-bottom:10px">'+(window._denahRO
        ?'Warna kursi = status kedatangan tamu (live).'
        :'Klik kursi untuk memutar status: Tersedia → Hold → Terjual → Tersedia. Kursi yang terjual lewat pembelian dilepas lewat Refund.')+'</p>'
    +'<div class="lm-hall">'
      +'<div class="lm-stage">S T A G E</div>'
      +'<div class="lm-kiri"><span class="lm-side-lbl">REGULER +</span>'+kiri.map(seatBox).join('')+'</div>'
      +'<div class="lm-floor"><b>LANTAI 2</b><span>Area lantai / floor</span></div>'
      +'<div class="lm-kanan"><span class="lm-side-lbl">REGULER +</span>'+kanan.map(seatBox).join('')+'</div>'
      +'<div class="lm-depan">'+depan.map(seatBox).join('')+'</div>'
    +'</div>'
    +denahLegend();

  // Zona Reguler (tanpa nomor) — lantai 2 pojok + seluruh lantai 1.
  // Di Kursi Terisi Langsung (read-only) tombol +/- disembunyikan: cukup tampil angka.
  const zc = reg
    ? (window._denahRO
        ? '<div class="zc"><b>'+reg.sold+'</b> / '+reg.quota+' terjual</div>'
        : '<div class="zc"><button onclick="regulerAdj(\''+id+'\',-1)">−</button><b>'+reg.sold+'</b> / '+reg.quota+' terjual<button onclick="regulerAdj(\''+id+'\',1)">+</button></div>')
    : '<div class="mini" style="margin-top:8px">Kelas "Reguler" belum ada.</div>';
  h+='<div class="lm-zones">'
    +'<div class="lm-zone"><h4>Reguler — Lantai 1 &amp; pojok Lantai 2</h4><span class="mini">Zona bebas tanpa nomor kursi.</span>'
    +zc+'</div></div>';
  return h+'</div>';
}
/* HAPUS KELAS TIKET — dijaga dua hal yang tidak boleh dilanggar.

   1. Sudah ada yang membeli. Menghapus kelasnya membuat tiket yang sudah
      terbayar kehilangan induknya: harganya jadi nol, kuotanya lenyap, dan
      laporan penjualan tidak lagi bisa menjelaskan uang yang sudah diterima.
   2. Masih dipakai objek di denah. Kursinya akan tetap tergambar tapi tanpa
      harga — di situs customer ia muncul lalu menolak dipilih, dan tidak
      ada apa pun di layar yang menjelaskan sebabnya.

   Keduanya menolak dengan MENYEBUT ANGKANYA, bukan sekadar "tidak bisa":
   yang dibutuhkan orang saat ditolak adalah tahu apa yang harus dibereskan
   lebih dulu. */
/* JUMLAH TERJUAL DIHITUNG DARI TIKETNYA, BUKAN DARI KOLOM `sold`.

   `sold` adalah penghitung yang disimpan terpisah, dan ia bisa basi: data
   contoh bawaan memasang angka (mis. Spectator 70) tanpa satu pun baris di
   tabel tickets, dan pembatalan lama tidak selalu menurunkannya kembali.
   Memakai angka itu sebagai penjaga membuat kelas yang sebenarnya bersih
   MENOLAK dihapus dengan alasan "sudah terjual 70" — padahal di halaman
   Penjualan tidak ada satu baris pun. Tiket adalah bukti transaksinya;
   penghitung hanya cerminan yang bisa tertinggal. */
function tiketTerjual(id){
  return DB.tickets.filter(function(t){ return t.ticket_class_id===id && t.status!=='Cancelled'; }).length;
}
function delTicketClass(eid, id){
  const c = DB.ticketClasses.find(x => x.id === id); if(!c) return;
  const nyata = tiketTerjual(id);
  if(nyata > 0){
    toast('Tidak bisa dihapus — sudah ada ' + nyata + ' tiket terjual di kelas ini.');
    return;
  }
  const dipakai = DB.seats.filter(function(s2){
    if(s2.event_id !== eid) return false;
    // Objek yang sudah bertaut id dinilai dari id-nya saja: kalau tidak, objek
    // yang id-nya kelas LAIN tapi namanya kebetulan sama ikut terhitung dan
    // penghapusan yang sah jadi tertolak tanpa alasan yang bisa ditelusuri.
    return s2.ticket_class_id ? s2.ticket_class_id === id : s2.tier === c.name;
  });
  if(dipakai.length){
    /* Angkanya DIPILAH antara denah kustom dan kursi template bawaan.
       Sebelumnya keduanya dijumlah jadi satu angka bernama "objek di denah",
       dan angkanya tidak cocok dengan apa pun yang terlihat di layar: kru
       melihat 92 objek di Rangkuman Denah lalu ditolak dengan "175 objek",
       tanpa cara apa pun menemukan 83 sisanya. */
    const kustom = dipakai.filter(function(s2){ return s2.zone === 'Custom'; }).length;
    const tpl = dipakai.length - kustom;
    const bagian = [];
    if(kustom) bagian.push(kustom + ' objek di denah kustom');
    if(tpl)    bagian.push(tpl + ' kursi denah template lama');
    toast('Masih dipakai ' + bagian.join(' + ') + '. Ubah tingkatannya dulu, atau hapus denah template kalau sudah tidak dipakai.');
    return;
  }
  // Penghitung basi diberitahukan, bukan dipakai menolak — supaya angka aneh
  // di kolom Terjual tidak lagi jadi misteri yang tak bisa dijelaskan.
  const pesan = (+c.sold > 0)
    ? 'Hapus kelas tiket "' + c.name + '"?\n\nKolom Terjual tertulis ' + c.sold
      + ', tapi tidak ada satu pun tiket sungguhan di kelas ini (angka itu sisa data contoh).'
    : 'Hapus kelas tiket "' + c.name + '"?';
  if(!confirm(pesan)) return;
  DB.ticketClasses = DB.ticketClasses.filter(x => x.id !== id);
  save(); renderTicketDetail(eid); toast('Kelas tiket dihapus.');
}
/* Nama kelas dan keterangannya sering menyebut lantai yang berbeda setelah
   kelas diganti nama — dan keterangan itulah yang TAMPIL KE PEMBELI di situs
   ticketing. Tidak ditulis ulang otomatis: menebak isi kalimat orang lebih
   berisiko daripada memberitahunya, dan yang benar bisa saja namanya. */
function lantaiBentrok(c){
  if(!c) return null;
  const n=String(c.name||'').match(/lantai\s*([12])/i);
  const t=String((c.description||'')+' '+(c.benefit||'')).match(/lantai\s*([12])/i);
  if(!n||!t||n[1]===t[1]) return null;
  return {nama:n[1], teks:t[1]};
}
function ticketClassForm(eid, id){
  /* Satu form untuk BUAT dan UBAH. Sebelumnya hanya bisa membuat: salah ketik
     harga sekali berarti kelas itu menetap selamanya, dan satu-satunya jalan
     keluar adalah membuat kelas kedua — yang justru merusak, karena kursi di
     denah dicocokkan ke kelas lewat NAMA. */
  const c = id ? DB.ticketClasses.find(x => x.id === id) : null;
  const d = c || {name:'', price:100000, quota:100, benefit:'', is_seated:false,
                  sale_start:new Date().toISOString(), sale_end:''};
  modal(`<button class="close" onclick="closeModal()">×</button><h3>${c?'Ubah Kelas Tiket':'Kelas Tiket Baru'}</h3>
  <div class="grid g2">
    <div class="field"><label>Nama</label><input id="tc_name" placeholder="Regular / VIP / Early Bird" value="${esc(d.name)}"></div>
    <div class="field"><label>Harga (IDR)</label>${uangInput('tc_price',+d.price||0)}</div>
    <div class="field"><label>Kuota</label><input id="tc_quota" type="number" value="${+d.quota||1}"></div>
    <div class="field"><label>Benefit</label><input id="tc_benefit" placeholder="Free drink, seat, dll" value="${esc(d.benefit||'')}"></div>
    <div class="field" style="grid-column:1/-1"><label>Keterangan</label><input id="tc_desc" placeholder="Penjelasan singkat kelas ini" value="${esc(d.description||'')}"><div class="mini">Tampil ke pembeli di situs ticketing.</div></div>
    <div class="field"><label>Sale Start</label><input id="tc_ss" type="date" value="${dstr(new Date(d.sale_start||Date.now()))}" onchange="syncSaleWindow()"></div>
    <div class="field"><label>Sale End</label><input id="tc_se" type="date" value="${d.sale_end?dstr(new Date(d.sale_end)):''}"><div class="mini" id="tc_se_hint"></div></div>
  </div>
  <label style="display:inline-flex;gap:6px;color:var(--txt)"><input type="checkbox" id="tc_seated" style="width:auto" ${d.is_seated?'checked':''}> Seated (pilih kursi)</label>
  ${c&&+c.sold>0?`<p class="mini" style="margin-top:8px">Sudah ${c.sold} tiket terjual — kuota tidak bisa diturunkan di bawah angka itu.</p>`:''}
  ${lantaiBentrok(d)?`<p class="mini" style="margin-top:8px;color:var(--accent)">Nama kelas menyebut <b>Lantai ${lantaiBentrok(d).nama}</b>, tapi keterangan/benefitnya menyebut <b>Lantai ${lantaiBentrok(d).teks}</b>. Teks itu tampil ke pembeli.</p>`:''}
  <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn" onclick="saveTicketClass('${eid}'${c?(",'"+c.id+"'"):''})">Simpan</button></div>`,true);
}
/* Sale End tidak boleh mendahului Sale Start. Dijaga di dua lapis: kalender
   tidak mengizinkan memilih tanggal sebelum Sale Start (min), dan saat simpan
   tetap diperiksa lagi — atribut min bisa dilewati kalau tanggalnya diketik. */
function syncSaleWindow(){
  const ss=document.getElementById('tc_ss'), se=document.getElementById('tc_se');
  if(!ss||!se)return;
  se.min=ss.value||'';
  const hint=document.getElementById('tc_se_hint');
  if(se.value && ss.value && se.value<ss.value){
    se.value=''; if(hint)hint.textContent='Sale End dikosongkan — tidak boleh sebelum Sale Start.';
  } else if(hint) hint.textContent=ss.value?'Paling awal '+ss.value:'';
}
function saveTicketClass(eid, id){
  const g=x=>document.getElementById(x).value;
  const name=g('tc_name').trim();if(!name){toast('Nama wajib.');return;}
  const ss=g('tc_ss'), se=g('tc_se');
  if(!ss){toast('Sale Start wajib diisi.');return;}
  if(!se){toast('Sale End wajib diisi.');return;}
  if(se<ss){toast('⛔ Sale End ('+se+') tidak boleh sebelum Sale Start ('+ss+').');return;}
  const price=uangNilai('tc_price'), quota=+g('tc_quota');
  if(price<0){toast('Harga tidak boleh minus.');return;}
  if(quota<1){toast('Kuota minimal 1.');return;}
  const seated = document.getElementById('tc_seated').checked;
  const lama = id ? DB.ticketClasses.find(x => x.id === id) : null;
  if(lama){
    /* Kuota tidak boleh turun di bawah yang SUDAH terjual — kalau tidak,
       "sisa" jadi minus dan penjualan berikutnya ditolak dengan angka yang
       tidak masuk akal buat kasir maupun pembeli. */
    const nyata = tiketTerjual(id);
    if(quota < nyata){
      toast('Sudah terjual ' + nyata + ' tiket — kuota tidak boleh di bawah itu.');
      return;
    }
    /* Nama kelas adalah TAUTAN ke kursi di denah: objek denah menyimpan
       tingkatannya sebagai nama, bukan id. Mengganti nama tanpa ikut
       memperbarui kursinya memutus tautan itu diam-diam — kursinya tetap
       tergambar tapi kehilangan harga, dan di situs customer jadi tidak bisa
       dipilih tanpa sebab yang terlihat. */
    if(lama.name !== name){
      /* Dicocokkan lewat ID LEBIH DULU, nama hanya cadangan untuk objek lama
         yang belum sempat termigrasi. Kalau hanya mengandalkan nama, objek
         yang tingkatannya pernah diketik berbeda ejaan akan tertinggal dan
         diam-diam kehilangan harga. */
      let n = 0;
      DB.seats.forEach(function(s2){
        if(s2.event_id !== eid) return;
        if(s2.ticket_class_id === id || (!s2.ticket_class_id && s2.tier === lama.name)){
          s2.tier = name; s2.ticket_class_id = id; n++;
        }
      });
      if(n) toast(n + ' objek denah ikut dipindah ke nama "' + name + '".');
    }
    Object.assign(lama, {name, price, quota, benefit:g('tc_benefit'), description:g('tc_desc'), is_seated:seated,
      sale_start:new Date(ss).toISOString(), sale_end:new Date(se+'T23:59:59').toISOString()});
    save(); closeModal(); renderTicketDetail(eid); toast('Kelas tiket diperbarui.');
    return;
  }
  DB.ticketClasses.push({id:uid(),event_id:eid,name,price,quota,sold:0,
    sale_start:new Date(ss).toISOString(),sale_end:new Date(se+'T23:59:59').toISOString(),
    description:g('tc_desc'),benefit:g('tc_benefit'),is_seated:seated});
  save();closeModal();renderTicketDetail(eid);toast('Kelas tiket dibuat.');
}
/* Satu pembeli boleh mengambil BANYAK kursi sekaligus. Dulu satu penjualan =
   satu tiket = satu kursi, yang dipilihkan sistem (kursi Available pertama
   yang ketemu). Rombongan enam orang berarti mengulang formulir enam kali dan
   kursinya tersebar entah di mana — padahal justru rombongan yang paling
   ingin duduk berdekatan.

   Sekarang kursinya diklik langsung di denah acara itu (denah kustom kalau
   ada, template kalau tidak), persis seperti pemilih meja di modul Reservasi.
   Untuk tiket berdiri (tanpa denah) yang muncul kotak jumlah tiket. */
function purchaseFlow(eid,pakaiPilihan){
  const e=DB.events.find(x=>x.id===eid);const classes=DB.ticketClasses.filter(c=>c.event_id===eid);
  // Dipanggil dari denah (mode jual) → kursi yang sudah diklik dipertahankan.
  const bawaan=pakaiPilihan?beliSel().slice():[];
  if(!pakaiPilihan) beliSetSel([]);
  modal(`<button class="close" onclick="closeModal()">×</button><h3>Catat Penjualan Tiket — ${esc(e.title)}</h3>
  <div class="field"><label>Pilih Tiket</label><select id="pf_class" onchange="pfKelasBerubah('${eid}')">${classes.map(c=>`<option value="${c.id}" ${c.sold>=c.quota?'disabled':''}>${esc(c.name)} - ${IDR(c.price)} ${c.sold>=c.quota?'(SOLD OUT)':'('+(c.quota-c.sold)+' tersisa)'}</option>`).join('')}</select></div>
  <div id="pf_seatwrap"></div>
  <div class="grid g2">
    <div class="field"><label>Nama *</label><input id="pf_name"></div>
    <div class="field"><label>Phone *</label><input id="pf_phone" value="+628"></div>
    <div class="field"><label>Email *</label><input id="pf_email"></div>
  </div>
  <div id="pf_total" class="mini" style="margin-top:10px"></div>
  <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn blue" id="pf_go" onclick="doPurchase('${eid}')">Simpan &amp; Tandai Lunas</button></div>`,true);
  /* Kelas tiket dipilihkan dari kursi yang sudah diklik: kalau semua kursi itu
     satu tingkatan, kelas itu yang dipakai. Tanpa ini orang harus menebak
     kelas mana yang cocok dengan kursi yang baru saja dipilihnya. */
  if(bawaan.length){
    const tier=[...new Set(bawaan.map(function(id){ const x=DB.seats.find(function(s2){ return s2.id===id; }); return x&&x.tier; }))];
    const sel=document.getElementById('pf_class');
    if(sel && tier.length===1){
      const c=classes.find(function(x){ return x.name===tier[0]; });
      if(c) sel.value=c.id;
    }
  }
  pfKelasBerubah(eid);
  if(bawaan.length){ beliSetSel(bawaan); pfGambarDenah(eid); pfRingkas(eid); }
}
// Kursi yang bisa dijual untuk sebuah event (denah kustom didahulukan).
function pfKursiEvent(eid){
  const kustom=ldzItems(eid);
  if(kustom.length) return kustom;
  return DB.seats.filter(s=>s.event_id===eid && s.zone!=='Custom');
}
function pfKelasBerubah(eid){
  const wrap=document.getElementById('pf_seatwrap'); if(!wrap) return;
  const c=DB.ticketClasses.find(x=>x.id===(document.getElementById('pf_class')||{}).value);
  const adaDenah=pfKursiEvent(eid).length>0;
  beliSetSel([]);
  if(c && c.is_seated && adaDenah){
    wrap.innerHTML='<div class="field"><label>Pilih Kursi <span class="mini">(klik di denah, boleh lebih dari satu)</span></label>'
      +'<div id="pf_denah"></div><div id="pf_pilihan" class="mini" style="margin-top:6px"></div></div>';
    pfGambarDenah(eid);
  } else if(c && c.is_seated){
    wrap.innerHTML='<p class="mini" style="color:var(--red)">Kelas ini bertanda <b>Seated</b> tapi event ini belum punya denah. Buat denahnya dulu di tab Layout, atau lepas tanda Seated.</p>';
  } else {
    wrap.innerHTML='<div class="field"><label>Jumlah Tiket</label><input id="pf_qty" type="number" min="1" value="1" onchange="pfRingkas(\''+eid+'\')" oninput="pfRingkas(\''+eid+'\')"></div>';
  }
  pfRingkas(eid);
}
/* PERTANYAAN TINGKAT EVENT TIDAK BOLEH DIJAWAB DATA TINGKAT LANTAI.

   Versi sebelumnya memutuskan "pakai denah kustom atau template" lewat
   ldzItems(), yang hanya berisi objek LANTAI YANG SEDANG DIBUKA. Kalau kru
   terakhir kali membuka Lantai 2 yang masih kosong, modal Catat Penjualan
   diam-diam jatuh ke denah TEMPLATE bawaan venue — kursi yang diklik kasir
   bukan kursi yang dirancang di layout, dan tidak ada apa pun di layar yang
   memberi tahu bahwa itu denah yang berbeda.

   Keputusannya sekarang memakai ldzSemuaItems() (lintas lantai), dan kalau
   lantai yang sedang aktif kebetulan kosong, dipindah sendiri ke lantai yang
   ada isinya. */
function pfGambarDenah(eid){
  const box=document.getElementById('pf_denah'); if(!box) return;
  window._beliMode=true;
  const semua=ldzSemuaItems(eid);
  if(semua.length){
    if(!semua.some(function(o){ return ldzLantaiObjek(o)===ldzLantai(); })){
      window._ldzLantai=ldzLantaiObjek(semua[0]);
    }
    box.innerHTML=pfLantaiBar(eid)+ldzCanvasHTML(eid,false);
  } else {
    box.innerHTML=seatMapBody(eid);
  }
  window._beliMode=false;
}
/* Pemilih lantai khusus modal penjualan. TIDAK memakai ldzSetLantai(): fungsi
   itu menggambar ulang seluruh halaman Ticketing, yang berarti modal yang
   sedang diisi kasir ikut tertutup dan isian namanya hilang. */
function pfLantaiBar(eid){
  const semua=ldzSemuaItems(eid);
  const ada=[...new Set(semua.map(ldzLantaiObjek))].sort();
  if(ada.length<2) return '';
  const kini=ldzLantai();
  return '<div class="lm-floors" style="margin:0 0 10px">'+ada.map(function(f){
    const n=semua.filter(function(o){ return ldzLantaiObjek(o)===f; }).length;
    return '<button class="'+(kini===f?'on':'')+'" type="button" onclick="pfSetLantai(\''+eid+'\',\''+f+'\')">'
      +'Lantai '+esc(f)+' <span class="mini">('+n+')</span></button>';
  }).join('')+'</div>';
}
function pfSetLantai(eid,f){
  window._ldzLantai=(String(f)==='2')?'2':'1';
  pfGambarDenah(eid); pfRingkas(eid);
}
function pfRingkas(eid){
  const c=DB.ticketClasses.find(x=>x.id===(document.getElementById('pf_class')||{}).value);
  const pilih=beliSel();
  const kotak=document.getElementById('pf_pilihan');
  if(kotak) kotak.innerHTML=pilih.length
    ? '<b>'+pilih.length+' kursi:</b> '+pilih.map(id=>{const s=DB.seats.find(x=>x.id===id);return esc((s&&(s.table_no||s.seat_no))||'?');}).join(', ')
    : 'Belum ada kursi dipilih — klik meja/kursi di denah.';
  const qtyEl=document.getElementById('pf_qty');
  const n=pilih.length||(qtyEl?Math.max(1,+qtyEl.value||1):1);
  const tot=document.getElementById('pf_total');
  if(tot&&c) tot.innerHTML='<b>'+n+' tiket × '+IDR(c.price)+'</b> + biaya layanan '+IDR(5000*n)
    +' = <b style="color:var(--accent);font-size:15px">'+IDR(n*c.price+5000*n)+'</b>';
}
function doPurchase(eid){
  /* Penjaga tekan-ganda. Tombolnya menyimpan pesanan LALU menutup modal; kalau
     ditekan dua kali cepat (atau Enter ditahan), dua pesanan identik terbentuk
     dengan kursi yang sama — dan kuota ikut berkurang dua kali. Penjaganya
     dilepas lagi di tiap jalur keluar yang gagal, kalau tidak orang terkunci
     setelah satu kesalahan isian. */
  if(window._pfSibuk) return;
  const tombol=document.getElementById('pf_go');
  const lepas=function(){ window._pfSibuk=false; if(tombol){ tombol.disabled=false; tombol.textContent='Simpan & Tandai Lunas'; } };
  window._pfSibuk=true; if(tombol){ tombol.disabled=true; tombol.textContent='Menyimpan\u2026'; }
  const g=x=>{const el=document.getElementById(x);return el?el.value.trim():'';};
  const cid=g('pf_class'),name=g('pf_name'),phone=g('pf_phone');
  /* EMAIL DINORMALKAN: dibersihkan spasinya lalu dikecilkan seluruhnya.
     Bukan kerapian — inilah SATU-SATUNYA kunci pembeli ke barcode-nya.

     Situs customer mencocokkan `SELECT ... FROM orders WHERE email = :e`
     dengan email akun, dan akun disimpan huruf kecil (tix_users.email UNIQUE,
     lowercase — lihat ticketing-mysql/schema-tambahan.sql). Kasir yang
     mengetik "Budi@Gmail.com" atau menyisakan satu spasi di ujung membuat
     pesanannya TIDAK PERNAH ketemu: halaman "Tiket Saya" milik pembeli tampil
     kosong, tanpa galat di mana pun, dan tidak ada layar yang bisa
     menjelaskan kenapa tiket yang sudah dibayar tidak ada. */
  const email=g('pf_email').toLowerCase();
  if(!name||!phone||!email){toast('Nama, phone, email wajib.');lepas();return;}
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){
    toast('Email tidak valid. Ini satu-satunya cara pembeli membuka barcode-nya nanti.');lepas();return;}
  const c=DB.ticketClasses.find(x=>x.id===cid); if(!c){toast('Pilih kelas tiket dulu.');lepas();return;}
  const kursi=beliSel().slice();
  const qtyEl=document.getElementById('pf_qty');
  const jumlah=kursi.length||(qtyEl?Math.max(1,+qtyEl.value||1):1);
  if(c.is_seated && !kursi.length){toast('Pilih kursinya dulu di denah.');lepas();return;}
  /* Kuota diperiksa untuk SELURUH jumlah, bukan satu per satu — kalau tidak,
     rombongan 6 orang bisa lolos pada sisa kuota 2 dan kuota jadi minus. */
  const sisa=(+c.quota||0)-(+c.sold||0);
  if(jumlah>sisa){toast('⛔ Sisa kuota tinggal '+sisa+' tiket.');lepas();return;}
  // Kursi diperiksa ulang tepat sebelum simpan: bisa saja baru terjual.
  const bentrok=kursi.filter(id=>!beliBisaDipilih(DB.seats.find(s=>s.id===id)));
  if(bentrok.length){toast('⛔ Kursi sudah keburu terjual — pilih ulang.');pfGambarDenah(eid);lepas();return;}

  const oid=uid();
  DB.orders.push({id:oid,event_id:eid,buyer_name:name,phone,email,notes:'',
    subtotal:c.price*jumlah,fee:5000*jumlah,total:(c.price+5000)*jumlah,payment_status:'Paid',
    payment_ref:'MID-'+uid().slice(2,8).toUpperCase(),
    // Jejak pencatat: siapa kru yang menerima uangnya, dan dari layar mana.
    recorded_by:namaKru(), recorded_via:(kursi.length?'denah':'formulir'),
    expires_at:new Date(Date.now()+600000).toISOString(),created:new Date().toISOString()});

  const dibuat=[];
  for(let i=0;i<jumlah;i++){
    let seatId=null;
    if(kursi.length){ seatId=kursi[i]; const s=DB.seats.find(x=>x.id===seatId); if(s) s.status='Sold'; }
    else if(c.is_seated){ const av=DB.seats.find(s=>s.ticket_class_id===cid&&s.status==='Available'); if(av){av.status='Sold';seatId=av.id;} }
    const tk={id:uid(),order_item_id:oid,ticket_number:'LM-'+(1000+DB.tickets.length+i),
      qr_token:'QR'+uid()+oid+i,ticket_class_id:cid,seat_id:seatId,pdf_url:'eticket.pdf',status:'Valid'};
    DB.tickets.push(tk); dibuat.push(tk);
  }
  c.sold=(+c.sold||0)+jumlah;
  beliSetSel([]);
  window._pfSibuk=false;
  save();closeModal();
  toast('✓ '+jumlah+' tiket tercatat lunas'+(kursi.length?' · kursi '+kursi.map(id=>{const s=DB.seats.find(x=>x.id===id);return (s&&(s.table_no||s.seat_no))||'?';}).join(', '):'')+'.');
  /* TETAP DI TAB JUAL. Dulu dilempar ke halaman rekap — masuk akal waktu
     formnya masih pop-up (menutup modal harus mendaratkan orang di suatu
     tempat), tapi sekarang kasir hampir selalu melayani orang berikutnya di
     antrean yang sama. Formnya digambar ulang dalam keadaan kosong, dan
     denahnya ikut memperbarui kursi yang barusan terjual.
     Yang dipanggil dari tempat lain (mis. tombol Booking di bar denah tab
     Denah & Booking) tetap kembali ke tabnya sendiri. */
  if(window._tixTab!=='layout') window._tixTab='jual';
  renderTicketDetail(eid);
  // E-ticket pertama dibuka; sisanya lewat daftar pembeli — membuka 6 modal
  // bertumpuk tidak menolong siapa pun.
  setTimeout(()=>showETicket(dibuat[0].id),400);
}

  <div style="display:flex;gap:20px;flex-wrap:wrap">

    <div class="kv" style="flex:1;min-width:220px">

      <div class="k">Venue</div><div>${esc(e.venue)}</div>
      <div class="k">Waktu</div><div>${fmtDateTime(e.start_datetime)}</div>
      <div class="k">QR Token</div><div class="mini" style="word-break:break-all">${tk.qr_token.slice(0,20)}...</div>
    </div>
  </div>
  <p class="mini" style="margin-top:14px">Terms: QR single-use. Tunjukkan saat check-in.<br><b>Pengiriman otomatis belum aktif</b> — e-ticket ini masih perlu dikirim manual ke pembeli.</p>
  <!-- CARA PEMBELI MEMBUKA BARCODE-NYA SENDIRI.
       Pertanyaan yang selama ini tidak terjawab di layar mana pun: pembeli yang
       dicatat kasir tidak punya akun, jadi bagaimana ia melihat barcode-nya
       kalau QR di layar ini keburu ditutup?

       Jawabannya sudah ada dan tinggal disebutkan: situs customer mencocokkan
       pesanan lewat EMAIL, jadi pembeli cukup mendaftar/masuk memakai email
       yang sama dan tiketnya langsung muncul di "Tiket Saya". Tidak perlu akun
       dibuatkan lebih dulu — dibuatkan dari sini justru berarti menyimpan
       password yang tidak pernah dipilih orangnya.

       Emailnya ditulis apa adanya di sini supaya kasir bisa mengoreksi salah
       ketik SELAGI pembelinya masih berdiri di depan meja. Sesudah itu, satu
       huruf salah berarti tiketnya tidak akan pernah ketemu. -->
  <div class="card" style="margin-top:12px;padding:10px 12px">
    <div class="mini"><b>Pembeli membuka barcode-nya sendiri di</b>
      <b>laksamanamuda.id/ticketing</b> — daftar atau masuk memakai email
      <b style="word-break:break-all">${esc(o.email||'—')}</b>, tiketnya langsung muncul di menu
      <b>Tiket Saya</b>. ${o.email?'':'<span style="color:var(--red)">Pesanan ini belum ada emailnya — pembeli tidak akan bisa menemukannya.</span>'}</div>
  </div>
  <div class="modal-actions">
    <button class="btn ghost" onclick="copyToken('${tk.qr_token}')">Copy QR Token</button>
    <button class="btn ghost" onclick="unduhQR('${tk.id}')">Unduh QR</button>
    <button class="btn blue" onclick="kirimWA('${tk.id}')">Kirim via WhatsApp</button>
    <button class="btn" onclick="closeModal()">Tutup</button>
  </div>`,true);

function copyToken(t){navigator.clipboard&&navigator.clipboard.writeText(t);toast('QR token disalin — pakai di menu Check-In.');}

/* ---- Pengiriman e-ticket ke pembeli ----
   Belum ada pengiriman otomatis dari server, jadi jalurnya WhatsApp: pesannya
   sudah tersusun lengkap, kasir tinggal menekan kirim. Dipilih begini karena
   kasir MELIHAT SENDIRI pesannya terkirim — tidak ada kegagalan diam-diam
   seperti email yang masuk folder spam tanpa ada yang tahu.

   QR-nya diunduh terpisah sebagai gambar lalu dilampirkan, karena tautan
   wa.me hanya bisa membawa teks. */
function tiketRingkas(tid){
  const tk=DB.tickets.find(x=>x.id===tid); if(!tk)return null;
  const o=DB.orders.find(x=>x.id===tk.order_item_id);
  const c=DB.ticketClasses.find(x=>x.id===tk.ticket_class_id);
  const e=o?DB.events.find(x=>x.id===o.event_id):null;
  const seat=tk.seat_id?DB.seats.find(s=>s.id===tk.seat_id):null;
  return {tk,o,c,e,seat};
}
function kirimWA(tid){
  const r=tiketRingkas(tid); if(!r||!r.o){toast('Data tiket tidak lengkap.');return;}
  const {tk,o,c,e,seat}=r;
  const baris=[
    'Halo '+o.buyer_name+', berikut e-ticket Anda:','',
    'Nama           : '+o.buyer_name,
    'Nomor Tiket    : '+tk.ticket_number,
    'Jam            : '+(e?fmtDateTime(e.start_datetime):'-'),
    'Kategori Tiket : '+(c?c.name:'-')
  ];
  if(seat) baris.push('Seat           : '+seat.table_no);
  if(e)    baris.push('Venue          : '+esc(e.venue));
  baris.push('','Tunjukkan QR code (gambar terlampir) saat check-in.',
             'QR berlaku sekali pakai.','','Laksamana Muda Coffee & Live Space');
  const nomor=String(o.phone||'').replace(/[^0-9]/g,'').replace(/^0/,'62');
  if(!nomor){toast('Nomor WhatsApp pembeli kosong.');return;}
  window.open('https://wa.me/'+nomor+'?text='+encodeURIComponent(baris.join(String.fromCharCode(10))),'_blank','noopener');
  toast('WhatsApp dibuka - jangan lupa lampirkan gambar QR-nya.');
}
// QR disimpan sebagai PNG supaya gampang dilampirkan di WhatsApp atau email.
function unduhQR(tid){
  const r=tiketRingkas(tid); if(!r)return;
  const svg=qrSvg(r.tk.qr_token,600);
  const img=new Image();
  img.onload=function(){
    const cv=document.createElement('canvas'); cv.width=cv.height=600;
    const cx=cv.getContext('2d'); cx.fillStyle='#fff'; cx.fillRect(0,0,600,600); cx.drawImage(img,0,0);
    cv.toBlob(function(b){
      const a=document.createElement('a');
      a.href=URL.createObjectURL(b);
      a.download='QR-'+r.tk.ticket_number+'.png';
      a.click(); setTimeout(function(){URL.revokeObjectURL(a.href);},4000);
      toast('QR tersimpan sebagai '+a.download);
    });
  };
  img.onerror=function(){toast('Gagal menyiapkan gambar QR.');};
  img.src='data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(svg)));
}
/* Satu order = satu pengajuan refund yang hidup. Dulu tombolnya bisa
   ditekan berkali-kali dan tiap klik menambah baris baru, sehingga satu
   order bisa punya banyak refund Pending yang saling bertentangan. */
function refundAktif(oid){
  return DB.refunds.find(r=>r.order_id===oid && r.status!=='Rejected');
}
function requestRefund(oid){
  const ada=refundAktif(oid);
  if(ada){
    toast(ada.status==='Pending'
      ? 'Refund untuk order ini sudah diajukan — menunggu persetujuan.'
      : 'Refund untuk order ini sudah disetujui.');
    const o0=DB.orders.find(x=>x.id===oid);window._tixTab='sales';renderTicketDetail(o0.event_id);return;
  }
  const o=DB.orders.find(x=>x.id===oid);
  modal(`<button class="close" onclick="closeModal()">×</button><h3>Ajukan Refund</h3>
  <div class="kv" style="margin-bottom:14px"><div class="k">Buyer</div><div><b>${esc(o.buyer_name)}</b></div><div class="k">Nominal</div><div>${IDR(o.total)}</div></div>
  <div class="field"><label>Alasan refund *</label><textarea id="rf_reason" rows="3" placeholder="mis. acara bentrok, tiket dobel"></textarea></div>
  <p class="mini">Setelah diajukan, statusnya <b>menunggu persetujuan</b>. Pengajuan hanya bisa sekali per order.</p>
  <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn" onclick="submitRefund('${oid}')">Ajukan</button></div>`);
}
function submitRefund(oid){
  const reason=document.getElementById('rf_reason').value.trim();
  if(!reason){toast('Alasan wajib diisi.');return;}
  if(refundAktif(oid)){toast('Refund untuk order ini sudah ada.');closeModal();return;}
  const o0=DB.orders.find(x=>x.id===oid);
  /* SIAPA yang mengajukan ikut dicatat. Tanpa ini, baris di Approval Flow
     berbunyi "seseorang minta 4,2 juta dikembalikan" dan manajemen tidak punya
     tempat bertanya sebelum memutuskan. event_id disalin supaya pembersihan
     event (hapusIsiEvent) tetap menemukan pengajuannya walau pesanannya sudah
     lebih dulu terhapus. */
  DB.refunds.push({id:uid(),order_id:oid,event_id:(o0&&o0.event_id)||null,reason:reason,
    status:'Pending',oleh:namaKru(),requested_at:new Date().toISOString()});
  save();closeModal();toast('✓ Refund diajukan — menunggu keputusan manajemen di Approval Flow.');
  window._tixTab='sales'; if(o0) renderTicketDetail(o0.event_id);
}
/* Satu pesanan bisa berisi BANYAK tiket sejak pembelian multi-kursi ada.
   Versi lama memakai DB.tickets.find(...) — satu tiket saja — sehingga
   pesanan 6 kursi yang di-refund menyisakan 5 tiket berstatus Valid, 5 kursi
   tetap terjual di denah, dan kuota kelas berkurang 1 dari 6 yang seharusnya.
   Uangnya sudah dikembalikan tapi kursinya tidak pernah bisa dijual lagi. */
/* Menyetujui refund itu TIDAK bisa dibatalkan dari layar mana pun: tiketnya
   hangus, kursinya dilepas ke kolam jual, dan kuota kelasnya kembali — kursi
   yang sama bisa langsung terjual ke orang lain semenit kemudian. Karena itu
   ada satu layar penegasan yang menyebutkan angka-angkanya lebih dulu, bukan
   satu klik yang langsung mengeksekusi. */
function approveRefund(rid){
  if(!bisaSetujui()) return toast('Hanya manajemen yang bisa memutuskan refund.');
  const r=(DB.refunds||[]).find(x=>x.id===rid); if(!r||r.status!=='Pending') return;
  const o=DB.orders.find(x=>x.id===r.order_id); if(!o) return toast('Pesanannya sudah tidak ada.');
  const n=DB.tickets.filter(t=>t.order_item_id===o.id && t.status!=='Cancelled').length;
  modal('<button class="close" onclick="closeModal()">×</button><h3>Setujui Refund</h3>'
    +'<div class="kv" style="margin-bottom:12px">'
    +'<div class="k">Pembeli</div><div><b>'+esc(o.buyer_name||'—')+'</b></div>'
    +'<div class="k">Dikembalikan</div><div><b>'+IDR(o.total)+'</b></div>'
    +'<div class="k">Alasan</div><div>'+esc(r.reason||'—')+'</div></div>'
    +'<p class="mini">'+n+' tiket akan dibatalkan, kursinya dilepas, dan kuota kelasnya dikembalikan. '
    +'Ini tidak bisa dibatalkan — kursi yang sama bisa langsung terjual ke orang lain.</p>'
    +'<div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Batal</button>'
    +'<button class="btn" onclick="approveRefundYakin(\''+rid+'\')">Setujui &amp; Kembalikan</button></div>');
}
/* Satu pesanan bisa berisi BANYAK tiket sejak pembelian multi-kursi ada.
   Versi lama memakai DB.tickets.find(...) — satu tiket saja — sehingga
   pesanan 6 kursi yang di-refund menyisakan 5 tiket berstatus Valid, 5 kursi
   tetap terjual di denah, dan kuota kelas berkurang 1 dari 6 yang seharusnya.
   Uangnya sudah dikembalikan tapi kursinya tidak pernah bisa dijual lagi. */
function approveRefundYakin(rid){
  const r=(DB.refunds||[]).find(x=>x.id===rid); if(!r||r.status!=='Pending') return closeModal();
  const o=DB.orders.find(x=>x.id===r.order_id); if(!o) return closeModal();
  r.status='Approved'; r.penyetuju=namaKru();
  r.decided_at=r.approved_at=new Date().toISOString();
  o.payment_status='Refunded';
  const tiket=DB.tickets.filter(t=>t.order_item_id===o.id && t.status!=='Cancelled');
  tiket.forEach(function(tk){
    tk.status='Cancelled';
    if(tk.seat_id){ const st=DB.seats.find(x=>x.id===tk.seat_id); if(st) st.status='Available'; }
    const c=DB.ticketClasses.find(x=>x.id===tk.ticket_class_id);
    if(c&&c.sold>0) c.sold--;
  });
  save(); closeModal();
  toast('✓ Refund disetujui — '+tiket.length+' tiket dibatalkan & kursinya dilepas.');
  /* router(), BUKAN renderTicketDetail(). Keputusan ini diambil dari Approval
     Flow; memanggil renderTicketDetail akan melempar manajemen keluar ke
     halaman Ticketing event itu, kehilangan antrian yang sedang dikerjakan. */
  router();
}
function tolakRefund(rid){
  if(!bisaSetujui()) return toast('Hanya manajemen yang bisa memutuskan refund.');
  const r=(DB.refunds||[]).find(x=>x.id===rid); if(!r||r.status!=='Pending') return;
  const o=DB.orders.find(x=>x.id===r.order_id);
  modal('<button class="close" onclick="closeModal()">×</button><h3>Tolak Refund</h3>'
    +'<p class="mini">'+esc((o&&o.buyer_name)||'')+' · '+IDR((o&&o.total)||0)+'</p>'
    +'<div class="field"><label>Alasan *</label><textarea id="rf_tolak" rows="3" '
    +'placeholder="mis. tiket sudah dipakai masuk, di luar batas waktu refund"></textarea>'
    +'<div class="mini">Alasannya wajib: pembeli akan menanyakannya, dan yang menjawab '
    +'bukan orang yang menolak.</div></div>'
    +'<div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Batal</button>'
    +'<button class="btn danger" onclick="tolakRefundYakin(\''+rid+'\')">Tolak</button></div>');
}
function tolakRefundYakin(rid){
  const alasan=(document.getElementById('rf_tolak').value||'').trim();
  if(!alasan) return toast('Alasan wajib diisi.');
  const r=(DB.refunds||[]).find(x=>x.id===rid); if(!r||r.status!=='Pending') return closeModal();
  r.status='Rejected'; r.penyetuju=namaKru(); r.alasan_tolak=alasan;
  r.decided_at=new Date().toISOString();
  save(); closeModal(); toast('Refund ditolak — alasannya tercatat di riwayat.');
  router();
}

/* ============ CHECK-IN ============ */
function renderCheckin(){

  C().innerHTML=`

      <div class="seg-per">
        <button onclick="ciZoom(-1)" title="Perkecil">&minus;</button>
        <button onclick="ciZoom(0)" title="Muat selebar layar">Pas</button>
        <button onclick="ciZoom(1)" title="Perbesar">+</button>
      </div>
      <span class="mini" id="ciZoomLbl">${window._ciZoom?Math.round(window._ciZoom*100)+'%':'pas layar'}</span>
    </div>
    <div id="liveDenah">${liveDenahHTML(eid)}</div>
  </div>
  <div class="card"><h3 class="sec">📷 Scanner QR</h3>

    <div id="cam_box" class="cam-box" style="display:none">

      <div class="cam-frame"></div>
    </div>

      <button class="btn" id="cam_btn" onclick="toggleKamera()">📷 Nyalakan Kamera</button>
    </div>
    <div class="field"><input id="ci_token" placeholder="…atau tempel QR token di sini"></div>
    <button class="btn ghost" onclick="doScan(document.getElementById('ci_token').value)">Cek token ini</button>
    <div id="scanResult" style="margin-top:16px"></div>

/* ================= DAFTAR TAMU: SUDAH & BELUM CHECK-IN =================
   Pemindai menjawab "orang ini boleh masuk?". Yang tidak dijawabnya: "siapa
   saja yang belum datang?" — pertanyaan yang muncul terus-menerus menjelang
   acara mulai, dan sebelumnya hanya bisa dijawab dengan menghitung kotak merah
   di denah satu per satu.

   Daftar ini sengaja bukan sekadar tabel: di pintu masuk yang dicari selalu
   SATU nama, jadi pencarian dan saringan "belum datang" lebih penting daripada
   melihat semuanya sekaligus. Halamannya dibatasi 25 baris karena acara 500
   tiket berarti 500 baris yang harus digambar ulang tiap kali satu tamu masuk —
   itu yang dulu membuat halaman ini berat di HP. */
// 10 per halaman, sama dengan tabel lain (lihat SALES_PER_HAL).
const CI_PER_HAL=10;
let _ciFilter={q:'',mode:'belum',kelas:'',hal:1};

function ciBaris(eid){
  return ciTiket(eid).map(function(tk){
    const o=DB.orders.find(x=>x.id===tk.order_item_id)||{};
    const c=DB.ticketClasses.find(x=>x.id===tk.ticket_class_id);
    const ci=DB.checkins.find(x=>x.ticket_id===tk.id);
    return {tk:tk, nama:o.buyer_name||'Tamu', hp:o.phone||'', kelas:c?c.name:'—',
            tempat:seatTeks(tk), masuk:tk.status==='Checked-In',
            jam:ci?fmtDateTime(ci.checked_in_at):''};
  });
}
function ciTabelHTML(eid){
  const b=ciBaris(eid);
  const belum=b.filter(x=>!x.masuk).length, sudah=b.length-belum;
  const chip=(m,t,n)=>'<button class="btn sm ci-chip'+(_ciFilter.mode===m?' blue':' ghost')+'" data-m="'+m+'" '
    +'onclick="ciMode(\'' + m + '\')">'+t+' <b>'+n+'</b></button>';
  return '<div class="card" style="margin-top:16px"><h3 class="sec">🧾 Daftar Tamu</h3>'
    +'<div class="toolbar" style="margin-bottom:10px">'
      +chip('belum','Belum datang',belum)+chip('sudah','Sudah datang',sudah)+chip('semua','Semua',b.length)
      +'<span id="ciKelasWrap">'+ciPilihKelasHTML(eid)+'</span>'
      +'<input id="ci_cari" placeholder="Cari nama / no. tiket / kursi…" value="'+esc(_ciFilter.q)+'" '
        +'oninput="ciCari(this.value)" style="flex:1;min-width:180px">'
    +'</div>'
    +'<div id="ciHitungKelas">'+ciHitungKelasHTML(eid)+'</div>'
    +'<div id="ciTabelIsi">'+ciTabelIsiHTML(eid)+'</div>'
  +'</div>';
}
function ciTabelIsiHTML(eid){
  let b=ciBaris(eid);
  if(_ciFilter.mode==='belum') b=b.filter(x=>!x.masuk);
  else if(_ciFilter.mode==='sudah') b=b.filter(x=>x.masuk);
  /* Saringan kategori. Di pintu masuk, antrean VIP dan reguler dibuka lewat
     jalur berbeda — petugas jalur VIP tidak perlu (dan tidak boleh keliru
     membaca) 400 nama reguler di layarnya. */
  if(_ciFilter.kelas) b=b.filter(x=>x.kelas===_ciFilter.kelas);
  const q=_ciFilter.q.trim().toLowerCase();
  if(q) b=b.filter(x=>(x.nama+' '+x.tk.ticket_number+' '+x.tempat+' '+x.hp).toLowerCase().indexOf(q)>=0);

  if(!b.length){
    const kls=_ciFilter.kelas?' di kategori '+esc(_ciFilter.kelas):'';
    return '<div class="empty">'+(q?'Tidak ada yang cocok dengan "'+esc(_ciFilter.q)+'"'+kls+'.'
      :(_ciFilter.mode==='belum'?'Semua tamu'+kls+' sudah datang. 🎉'
                                :'Belum ada yang check-in'+kls+'.'))+'</div>';
  }

  const halMax=Math.max(1,Math.ceil(b.length/CI_PER_HAL));
  if(_ciFilter.hal>halMax) _ciFilter.hal=halMax;
  const mulai=(_ciFilter.hal-1)*CI_PER_HAL;
  const tampil=b.slice(mulai,mulai+CI_PER_HAL);

  let h='<div class="tbl-scroll"><table><thead><tr>'
   +'<th>Tamu</th><th>Tiket</th><th>Tempat</th><th>Kelas</th><th>Status</th><th></th></tr></thead><tbody>';
  tampil.forEach(function(x){
    h+='<tr><td><b>'+esc(x.nama)+'</b>'+(x.hp?'<div class="mini">'+esc(x.hp)+'</div>':'')+'</td>'
     +'<td class="mono">'+esc(x.tk.ticket_number)+'</td>'
     +'<td class="mini">'+x.tempat+'</td>'
     +'<td class="mini">'+esc(x.kelas)+'</td>'
     +'<td>'+(x.masuk
        ? '<span class="badge b-green">Sudah datang</span>'+(x.jam?'<div class="mini">'+x.jam+'</div>':'')
        : '<span class="badge b-grey">Belum datang</span>')+'</td>'
     +'<td>'+(x.masuk
        ? '<button class="btn ghost sm" onclick="batalCheckin(\''+x.tk.id+'\')">Batalkan</button>'
        : '<button class="btn sm" onclick="checkinDariDenah(\''+x.tk.id+'\')">Check-in</button>')+'</td></tr>';
  });
  h+='</tbody></table></div>';
  h+=pagerHTML(_ciFilter.hal,halMax,b.length,'tamu','ciKeHal');
  return h;
}
/* Hanya ISI tabel yang digambar ulang, bukan seluruh kartunya — kalau kotak
   pencariannya ikut dibuat ulang, fokusnya hilang dan huruf berikutnya jatuh ke
   halaman, bukan ke kotaknya. Persis alasan yang sama dengan paintCRM di
   Marketing. */
function ciPaintTabel(){
  if(!window._ciEvent) return;
  const el=document.getElementById('ciTabelIsi');
  if(el) el.innerHTML=ciTabelIsiHTML(window._ciEvent);
  /* Pita hitungan per kategori ikut digambar ulang di sini — angkanya
     berubah tiap kali ada tamu yang check-in, dan pita yang tertinggal di
     angka lama persis jenis kesalahan yang paling merugikan di pintu masuk. */
  const p=document.getElementById('ciHitungKelas');
  if(p) p.innerHTML=ciHitungKelasHTML(window._ciEvent);
}
/* Pemilih kategori dibuat dari kelas yang BENAR-BENAR punya tiket di event
   ini, bukan dari seluruh daftar kelas: kelas yang dibuat lalu tidak jadi
   dijual akan berdiri sebagai pilihan yang selalu menghasilkan tabel kosong.
   Angkanya = yang belum/sudah datang sesuai mode yang sedang aktif, jadi
   "VIP 12" berarti dua belas yang benar-benar masih ditunggu. */
function ciPilihKelasHTML(eid){
  /* Angkanya mengikuti MODE yang sedang aktif: saat "Belum datang" terpilih,
     "VIP (12)" berarti dua belas orang yang benar-benar masih ditunggu, bukan
     jumlah tiket VIP yang terjual. Itu angka yang dibaca petugas pintu. */
  let src=ciBaris(eid);
  if(_ciFilter.mode==='belum') src=src.filter(x=>!x.masuk);
  else if(_ciFilter.mode==='sudah') src=src.filter(x=>x.masuk);
  const n={};
  src.forEach(function(x){ n[x.kelas]=(n[x.kelas]||0)+1; });
  /* Daftar kategorinya diambil dari SELURUH tiket, bukan cuma yang lolos
     mode. Kalau tidak, kategori yang tamunya sudah datang semua akan lenyap
     dari pemilih justru saat petugas sedang menyaring "belum datang" — dan
     saringan yang sedang aktif ikut hilang tanpa jejak. */
  const kelas=[]; ciBaris(eid).forEach(function(x){ if(kelas.indexOf(x.kelas)<0) kelas.push(x.kelas); });
  kelas.sort();
  if(kelas.length<2) return '';        // satu kategori saja: tidak ada yang perlu disaring
  return '<select id="ci_kelas" onchange="ciKelas(this.value)" style="width:auto">'
    +'<option value="">Semua kategori ('+src.length+')</option>'
    +kelas.map(function(k){
        return '<option value="'+esc(k)+'"'+(_ciFilter.kelas===k?' selected':'')+'>'
          +esc(k)+' ('+(n[k]||0)+')</option>';
      }).join('')
    +'</select>';
}
/* Pita hitungan untuk kategori yang sedang disaring.

   Angka di dalam <option> tidak cukup: yang terbaca di situ hanya SATU angka
   (mengikuti mode yang aktif), sedangkan pertanyaan di pintu masuk selalu
   dua sekaligus — "VIP sudah berapa yang masuk, dan tinggal berapa yang
   ditunggu". Menjawabnya dengan menyuruh petugas menekan chip mode
   bolak-balik sambil membaca dropdown adalah tiga sentuhan untuk satu
   pertanyaan.

   Ditampilkan HANYA saat sebuah kategori dipilih. Untuk "Semua kategori"
   angkanya sudah ada di chip Belum/Sudah di sebelahnya, dan mengulanginya
   cuma menambah baris yang tidak membedakan apa pun. */
/* Ringkasan per kategori saat tidak ada saringan. Bentuknya sengaja BERBEDA
   dari ciHitungKelasHTML: yang ini daftar padat banyak baris, bukan satu pita
   besar. Satu pita per kategori akan mendorong tabel tamu keluar layar di HP,
   dan tabel itulah yang dipakai bekerja.

   Tiap barisnya bisa diketuk untuk langsung menyaring ke kategori itu — di
   pintu masuk, angka yang menarik perhatian dan daftar yang ingin dibuka
   sesudahnya selalu yang sama. */
function ciHitungSemuaHTML(eid){
  const b=ciBaris(eid);
  if(!b.length) return '';
  const per={};
  b.forEach(function(x){
    const k=x.kelas||'(tanpa kategori)';
    if(!per[k]) per[k]={n:0,masuk:0};
    per[k].n++; if(x.masuk) per[k].masuk++;
  });
  const nama=Object.keys(per).sort(function(x,y){ return per[y].n-per[x].n; });
  if(nama.length<2) return '';        // satu kategori: chip di atasnya sudah menjawab
  const totMasuk=b.filter(function(x){ return x.masuk; }).length;
  const totPct=Math.round(totMasuk/b.length*100);
  let h='<div class="ci-semua">'
   +'<div class="cs-head"><b>Semua kategori</b>'
     +'<span class="ci-ang ci-sudah"><b>'+totMasuk+'</b> sudah masuk</span>'
     +'<span class="ci-ang ci-belum"><b>'+(b.length-totMasuk)+'</b> belum datang</span>'
     +'<span class="mini">dari '+b.length+' tiket · '+totPct+'%</span></div>';
  nama.forEach(function(k){
    const v=per[k], pct=v.n?Math.round(v.masuk/v.n*100):0;
    h+='<div class="cs-row" title="Klik untuk menyaring ke '+esc(k)+'" onclick="ciKelas('+JSON.stringify(k).replace(/"/g,'&quot;')+')">'
      +'<span class="ldz-tier"><i style="background:'+ldzTierInfo(eid,k).c+'"></i>'+esc(k)+'</span>'
      +'<span class="cs-ang"><b class="ci-sudah">'+v.masuk+'</b> masuk</span>'
      +'<span class="cs-ang"><b class="ci-belum">'+(v.n-v.masuk)+'</b> belum</span>'
      +'<span class="mini cs-tot">'+pct+'% dari '+v.n+'</span>'
      +'<div class="ci-bar"><i style="width:'+pct+'%"></i></div>'
      +'</div>';
  });
  return h+'</div>';
}
function ciHitungKelasHTML(eid){
  /* TANPA SARINGAN KATEGORI = ringkasan SELURUH kategori.
     Sebelumnya baris ini memulangkan string kosong, jadi justru pada keadaan
     bawaan ("Semua kategori") — keadaan yang paling sering dilihat petugas
     pintu — tidak ada satu angka pun di atas tabel. Yang ditanya terus-menerus
     menjelang acara mulai persis itu: VIP sudah masuk berapa, reguler berapa,
     mana yang antreannya perlu ditambah petugas. Menjawabnya dulu berarti
     mengganti saringan satu per satu lalu mengingat angkanya sendiri. */
  if(!_ciFilter.kelas) return ciHitungSemuaHTML(eid);
  const b=ciBaris(eid).filter(function(x){ return x.kelas===_ciFilter.kelas; });
  if(!b.length) return '';
  const masuk=b.filter(function(x){ return x.masuk; }).length;
  const belum=b.length-masuk;
  const pct=b.length?Math.round(masuk/b.length*100):0;
  return '<div class="ci-hitung">'
   +'<span class="ldz-tier"><i style="background:'+ldzTierInfo(eid,_ciFilter.kelas).c+'"></i><b>'+esc(_ciFilter.kelas)+'</b></span>'
   +'<span class="ci-ang ci-sudah"><b>'+masuk+'</b> sudah masuk</span>'
   +'<span class="ci-ang ci-belum"><b>'+belum+'</b> belum datang</span>'
   +'<span class="mini">dari '+b.length+' tiket · '+pct+'%</span>'
   +'<div class="ci-bar"><i style="width:'+pct+'%"></i></div>'
   +'</div>';
}
function ciKelas(v){ _ciFilter.kelas=v; _ciFilter.hal=1; ciPaintTabel(); }
function ciCari(v){ _ciFilter.q=v; _ciFilter.hal=1; ciPaintTabel(); }
function ciHal(d){ _ciFilter.hal=Math.max(1,_ciFilter.hal+d); ciPaintTabel(); }
function ciMode(m){
  _ciFilter.mode=m; _ciFilter.hal=1;
  // Warna chip diganti langsung, bukan lewat menggambar ulang toolbar — lihat
  // alasan fokus di atas.
  document.querySelectorAll('.ci-chip').forEach(function(b){
    const on=b.dataset.m===m;
    b.classList.toggle('blue',on); b.classList.toggle('ghost',!on);
  });
  /* Pemilih kategori ikut digambar ulang — angkanya mengikuti mode, dan
     angka yang tertinggal di mode sebelumnya adalah angka yang berbohong.
     Kotak pencarian TIDAK ikut, supaya fokusnya tidak hilang. */
  const wrap=document.getElementById('ciKelasWrap');
  if(wrap && window._ciEvent) wrap.innerHTML=ciPilihKelasHTML(window._ciEvent);
  ciPaintTabel();
}

function ciStatHTML(tickets){
  const masuk=tickets.filter(t=>t.status==='Checked-In').length;
  const occ=tickets.length?Math.round(masuk/tickets.length*100):0;
  return stat('Total Tiket',tickets.length,'valid')+stat('Checked-In',masuk,'sudah datang')+stat('Keterisian',occ+'%','live');
}
function ciTiket(eid){
  return DB.tickets.filter(t=>{const o=DB.orders.find(x=>x.id===t.order_item_id);return o&&o.event_id===eid&&t.status!=='Cancelled';});
}
/* MENYEGARKAN TANPA MENGGAMBAR ULANG SELURUH HALAMAN.
   renderCheckin() membangun ulang <video>, jadi setiap satu tamu masuk kamera
   ikut mati dan dinyalakan lagi — layar berkedip, fokus kamera mengulang dari
   awal, dan pemindaian berikutnya tertunda satu-dua detik. Di antrean, itu
   terasa seperti aplikasi yang tersendat. Yang benar-benar berubah setelah
   check-in cuma angka statistik dan warna satu kursi. */
function segarkanCheckin(){
  const eid=window._ciEvent; if(!eid) return;
  const s=document.getElementById('ciStat');
  if(s) s.innerHTML=ciStatHTML(ciTiket(eid));
  const d=document.getElementById('liveDenah');
  if(d){ d.innerHTML=liveDenahHTML(eid); ciPasDenah(); }
  // Daftar tamu ikut menyesuaikan: baris yang baru masuk berpindah sendiri dari
  // "Belum datang" ke "Sudah datang" tanpa perlu menyegarkan halaman.
  ciPaintTabel();
}
/* DENAH CHECK-IN DIPASKAN KE LEBAR LAYAR.
   Kanvas denah kustom berukuran tetap (biasanya 1600px lebih) karena koordinat
   mejanya memang digambar pada kanvas sebesar itu. Di layar HP yang lebarnya
   360px, yang terlihat cuma pojok kiri atasnya — petugas mengira denahnya tidak
   muncul, padahal ia ada di luar layar. Digulir pun tidak menolong: tidak ada
   yang bisa mengenali ruangan dari potongan sebesar itu.
   Jadi kanvasnya diperkecil dengan transform sampai muat, dan kotak
   pembungkusnya dipatok setinggi hasil skala — transform tidak mengubah ukuran
   layout, jadi tanpa itu akan ada ruang kosong sepanjang tinggi aslinya. */
/* Diberi parameter wadah supaya halaman rincian kategori bisa memakainya
   juga — denahnya sama, cuma tempat menempelnya yang beda. Satu penyekala
   untuk semua: yang kedua pasti tertinggal saat rumus skalanya diperbaiki. */
function ciPasDenah(idWadah){
  const box=document.getElementById(idWadah||'liveDenah'); if(!box) return;
  const kanvas=box.querySelector('.ldz-canvas'); if(!kanvas) return;
  const wrap=kanvas.parentElement; if(!wrap) return;
  const asli  =parseFloat(kanvas.style.width)  || kanvas.offsetWidth;
  const tinggi=parseFloat(kanvas.style.height) || kanvas.offsetHeight;
  const ruang =(wrap.clientWidth||box.clientWidth||0)-24;   // padding .ldz-wrap
  if(!asli||!tinggi||ruang<=0) return;
  /* ZOOM. Bawaannya tetap "muat selebar wadah" seperti dulu (window._ciZoom
     null), tapi petugas bisa memperbesar — nomor meja di denah 1200px yang
     diperkecil jadi 340px di HP benar-benar tidak terbaca, dan itu justru
     satu-satunya cara mencatat kedatangan tanpa QR.

     Faktornya dikalikan DI ATAS skala pas-muat, bukan menggantikannya, supaya
     "1x" berarti hal yang sama di layar lebar maupun sempit. Begitu hasilnya
     melampaui ruang yang ada, wadahnya dibiarkan digulir dua sumbu — di situ
     menggulir memang yang diinginkan, berbeda dengan keadaan pas-muat yang
     batang gulirnya cuma ruang kosong (lihat catatan di bawah). */
  const pas=Math.min(1, ruang/asli);
  const zoom=+window._ciZoom||0;
  const f=zoom>0 ? pas*zoom : pas;
  kanvas.style.transformOrigin='0 0';
  if(zoom>1){
    kanvas.style.transform='scale('+f+')';
    wrap.style.height=Math.ceil(tinggi*f+24)+'px';
    wrap.style.overflow='auto';
    return;
  }
  if(f<1){
    kanvas.style.transform='scale('+f+')';
    wrap.style.height=Math.ceil(tinggi*f+24)+'px';
    /* KEDUA sumbu disembunyikan, bukan cuma mendatar. Kanvasnya memakai
       `position:relative` (lihat ldzCanvasHTML), jadi ia TETAP setinggi
       ukuran aslinya di perhitungan tata letak walau tampilannya sudah
       diperkecil — dan wadah yang tingginya sudah disetel pas itu langsung
       memunculkan batang gulir vertikal. Yang tergulir bukan denahnya
       melainkan ruang kosong di bawahnya. */
    wrap.style.overflow='hidden';
  }else{
    kanvas.style.transform='none';
    wrap.style.height=''; wrap.style.overflow='';
  }
}
/* Tombol zoom denah Check-In. 0 = kembali ke pas-muat. Batasnya 1x-4x: di
   bawah 1x denah sudah pas layar (memperkecil lagi tidak menolong siapa pun),
   di atas 4x satu meja memenuhi layar dan orientasinya hilang. */
function ciZoom(arah){
  const skr=+window._ciZoom||1;
  window._ciZoom = arah===0 ? 0 : Math.min(4, Math.max(1, +(skr+arah*0.5).toFixed(2)));
  const lbl=document.getElementById('ciZoomLbl');
  if(lbl) lbl.textContent=window._ciZoom?Math.round(window._ciZoom*100)+'%':'pas layar';
  ciPasDenah('liveDenah');
}
/* Memutar HP mengubah lebar layar; tanpa ini denahnya tetap memakai skala
   potret dan menyisakan setengah layar kosong setelah diputar. */
window.addEventListener('resize', function(){

  window._ciResize=setTimeout(function(){ ciPasDenah('liveDenah'); ciPasDenah('katDenah'); }, 150);

/* Kursi Terisi Langsung = denah venue yang sama dengan Ticketing (Lantai 1 meja &
   Lantai 2 Reguler+), tapi READ-ONLY dan diwarnai status kedatangan. Memakai
   seatMapBody dengan window._denahRO supaya tak ada duplikasi tata letak. */
function liveDenahHTML(eid){
  if(!DB.seats.some(s=>s.event_id===eid))
    return '<div class="mini">Event ini standing (tanpa seat map).</div>';
  window._denahRO=true;
  // Denah kustom (kalau event ini memakainya) ikut tampil live — warnanya
  // memakai status kedatangan yang sama dengan denah template.
  /* Event yang punya denah KUSTOM hanya menampilkan denah itu. Sebelumnya
     keduanya digambar bertumpuk, jadi petugas check-in melihat dua denah untuk
     satu ruangan — yang satu tata letak asli acara, yang satu template bawaan
     venue yang tidak dipakai malam itu. Di depan antrean tamu, dua denah yang
     saling bertentangan lebih buruk daripada tidak ada denah sama sekali. */
  const punyaKustom=ldzItems(eid).length>0;
  if(punyaKustom){
    /* _denahRO HARUS tetap true selama kanvasnya dibangun. Versi sebelumnya
       mematikannya lebih dulu, jadi tiap objek dipasangi onclick="toggleSeat()"
       — di layar Check-In, satu sentuhan pada denah memutar status kursi lalu
       memanggil renderTicketDetail(), yang MENIMPA seluruh isi halaman Check-In
       dengan halaman Ticketing. Itulah "check-in berantakan" dan "klik denah
       malah masuk ke halaman layout": halaman Ticketing terbuka pada tab
       terakhir yang dipakai, yang biasanya Layout. */
    const html='<div class="card"><h3 class="sec">Denah Kustom — Lantai '+ldzLantai()+'</h3>'
      +ldzLantaiBarLive(eid)+ldzCanvasHTML(eid,false)+'</div>';
    window._denahRO=false;
    return html;
  }
  const template=DB.seats.some(s=>s.event_id===eid && s.zone!=='Custom') ? seatMapBody(eid) : '';
  window._denahRO=false;
  return template;
}
/* Pemilih lantai untuk Kursi Terisi Langsung di Check-In.
   Denah kustom di Check-In sebelumnya hanya menggambar SATU lantai — lantai
   yang terakhir dibuka di tab Layout — tanpa cara apa pun untuk berpindah,
   jadi separuh venue tak terlihat oleh petugas.

   TIDAK memakai ldzSetLantai(): fungsi itu memanggil renderTicketDetail() kalau
   tidak menemukan #ldzRoot, dan di halaman Check-In itu berarti seluruh layar
   petugas tertimpa halaman Ticketing di tengah antrean tamu — kesalahan yang
   sama yang dulu membuat "klik denah malah masuk ke halaman layout".

   Jumlah objek dan yang sudah datang ditulis di kedua tombol, jadi keadaan
   lantai yang sedang TIDAK dibuka pun tetap terbaca tanpa harus berpindah. */
function ldzLantaiBarLive(eid){
  const semua=ldzSemuaItems(eid);
  const jml=function(f){ return semua.filter(function(i){ return ldzLantaiObjek(i)===f; }); };
  const hadir=function(f){ return jml(f).filter(function(i){ return ldzStatusCls(i)==='checked'; }).length; };
  const kini=ldzLantai();
  const tombol=function(f){
    const n=jml(f).length, h=hadir(f);
    return '<button class="'+(kini===f?'on':'')+'"'+(n?'':' disabled title="Lantai ini belum punya objek denah"')
      +' onclick="ldzSetLantaiLive(\''+eid+'\',\''+f+'\')">Lantai '+f
      +' <span class="mini">('+n+' objek'+(h?' · '+h+' hadir':'')+')</span></button>';
  };
  return '<div class="lm-floors" style="margin:0 0 10px">'+tombol('1')+tombol('2')+'</div>';
}
function ldzSetLantaiLive(eid,f){
