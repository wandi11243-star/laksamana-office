<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Guard SSO: tanpa sesi Office yang berhak buka event, langsung ke login Office. -->
<script>
(function(){try{var s=JSON.parse(localStorage.getItem('lm_session')||'null');
  var ok=s&&s.expiry&&Date.now()<s.expiry&&(s.modules||[]).some(function(m){return m==='*'||m==='event';});
  if(!ok)location.replace('../');}catch(e){location.replace('../');}})();
</script>
<title>Laksamana Muda — Event Management System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/jpeg" href="../LaksamanaMudaLogo.jpeg">
<style>
/* ============================================================
   TEMA — disamakan dengan modul Marketing & Reservasi.
   Prototipe ini awalnya bertema gelap (ala GitHub), jadi terasa seperti
   aplikasi asing saat dibuka dari portal yang sama. Nama variabelnya SENGAJA
   dipertahankan (--bg, --panel, --accent, ...) supaya seluruh CSS di bawah
   tidak perlu diubah — cukup nilainya yang dipetakan ke palet Laksamana Muda.
   Komentar di kanan = nama padanannya di modul Marketing, biar gampang dijaga
   tetap seragam kalau palet induknya berubah.
   ============================================================ */
:root{
  --bg:#ffffff;                   /* marketing --ink-950 */
  --panel:#f7f6f4;                /* marketing --ink-900 */
  --panel2:#f2f0ec;               /* marketing --ink-880 */
  --line:rgba(60,55,45,.18);      /* marketing --line-hard */
  --line-soft:rgba(60,55,45,.10); /* marketing --line-soft */
  --txt:#2a2620;                  /* marketing --sand   */
  --muted:#928c80;                /* marketing --muted  */
  --accent:#A9791F;               /* marketing --gold   */
  --accent-soft:#C8961F;          /* marketing --gold-soft */
  --accent2:#7a560f;              /* marketing --gold-deep */
  --blue:#2f7fc4;                 /* marketing --info   */
  --green:#1f9d5f;                /* marketing --ok     */
  --red:#c9432b;                  /* marketing --danger */
  --grey:#928c80;                 /* marketing --muted  */
  --purple:#7c5fc0;               /* marketing --violet */
  --orange:#b5831a;               /* marketing --warn   */
  --shadow:0 4px 18px rgba(50,42,28,.08);
  --ff-display:'Plus Jakarta Sans',system-ui,sans-serif;
  --ff-body:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--ff-body);background:var(--bg);color:var(--txt);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--ff-display)}
#app{display:flex;min-height:100vh}
/* Sidebar */
/* Sidebar disalin gayanya dari modul Marketing supaya seragam:
   latar putih, ikon SVG (bukan emoji), item ber-radius, aktif = gold-glow. */
#sidebar{width:250px;background:#ffffff;border-right:1px solid var(--line-soft);position:fixed;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.brand{padding:20px 20px 16px;display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--line-soft)}
.brand img{width:34px}
.brand .bt{font-family:var(--ff-display);font-weight:700;font-size:16px;letter-spacing:.02em;line-height:1}
.brand .bs{font-size:9px;letter-spacing:.22em;color:var(--accent);text-transform:uppercase;margin-top:3px}
.nav{padding:10px 12px;flex:1}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;color:#5c574d;text-decoration:none;font-weight:500;font-size:13px;cursor:pointer;transition:.16s}
.nav a:hover{background:var(--panel);color:var(--txt)}
.nav a.active{background:rgba(169,121,31,.13);color:var(--accent2);font-weight:600}
/* ikon SVG: ukurannya dikunci di sini supaya tiap item sejajar rapi */
.nav a svg{width:17px;height:17px;flex:none;stroke-width:1.8}
.nav .sect{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);padding:16px 12px 7px}
.side-foot{padding:10px 12px;font-size:11px;color:var(--muted)}
.side-foot button{background:none;border:1px solid var(--line);color:var(--muted);padding:4px 8px;border-radius:5px;cursor:pointer;font-size:11px;margin-top:6px}
.side-foot button:hover{border-color:var(--red);color:var(--red)}
/* blok user + logout — EMS sebelumnya tidak punya jalan keluar sama sekali */
.side-user{margin-top:auto;border-top:1px solid var(--line-soft);padding:12px;display:flex;align-items:center;gap:10px}
.su-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent-soft),var(--accent2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:none}
.su-info{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.su-info b{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.su-info span{font-size:10.5px;color:var(--muted)}
.logout-x{background:var(--panel);border:1px solid var(--line);color:var(--muted);width:32px;height:32px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;flex:none;cursor:pointer;transition:.16s}
.logout-x:hover{border-color:var(--red);color:var(--red)}
/* Main */
#main{margin-left:250px;flex:1;min-width:0}
.topbar{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 26px;display:flex;align-items:center;justify-content:space-between}
.topbar h2{font-size:18px;font-weight:600}
.topbar .crumb{font-size:12px;color:var(--muted)}
.content{padding:22px 26px 60px}
/* Components */
.row{display:flex;gap:14px;flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.stat .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.stat .val{font-size:24px;font-weight:700;margin-top:6px}
.stat .sub{font-size:11px;color:var(--muted);margin-top:2px}
h3.sec{font-size:15px;margin:22px 0 12px;display:flex;align-items:center;gap:8px}
h3.sec:first-child{margin-top:0}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px;font-weight:600}
td{padding:9px 10px;border-bottom:1px solid var(--line)}
tr:hover td{background:var(--panel2)}
.btn{background:linear-gradient(135deg,var(--accent-soft),var(--accent2));color:#fff;border:none;padding:8px 14px;border-radius:7px;font-weight:600;cursor:pointer;font-size:13px}
.btn:hover{background:var(--accent2)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn.danger{background:var(--red);color:#fff}
.btn.blue{background:var(--blue);color:#fff}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600}
.b-green{background:rgba(31,157,95,.12);color:var(--green)}
.b-red{background:rgba(201,67,43,.12);color:var(--red)}
.b-blue{background:rgba(47,127,196,.12);color:var(--blue)}
.b-grey{background:rgba(146,140,128,.15);color:var(--grey)}
.b-yellow{background:rgba(169,121,31,.13);color:var(--accent2)}
.b-purple{background:rgba(124,95,192,.12);color:var(--purple)}
.b-orange{background:rgba(181,131,26,.14);color:var(--orange)}
input,select,textarea{background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:8px 10px;border-radius:7px;font-size:13px;width:100%;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
.field{margin-bottom:12px}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.toolbar input,.toolbar select{width:auto;min-width:150px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap}
.tabs button{background:none;border:none;color:var(--muted);padding:9px 14px;cursor:pointer;font-size:13px;border-bottom:2px solid transparent;font-family:inherit}
.tabs button.active{color:var(--accent);border-bottom-color:var(--accent)}
.pill{font-size:11px;color:var(--muted);background:var(--panel2);padding:2px 8px;border-radius:20px}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent-soft),var(--accent2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.ecard{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;transition:.15s}
.ecard:hover{border-color:var(--accent);transform:translateY(-2px)}
.ecard .cover{height:110px;background:linear-gradient(135deg,var(--panel2),rgba(169,121,31,.10));display:flex;align-items:center;justify-content:center;font-size:40px;position:relative}
.ecard .body{padding:12px}
.ecard .body .t{font-weight:600;margin-bottom:4px}
.ecard .meta{font-size:12px;color:var(--muted);margin-bottom:2px}
/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:100;overflow-y:auto}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:100%;max-width:640px;padding:22px}
.modal.wide{max-width:900px}
.modal h3{margin-bottom:16px;font-size:17px}
.modal .close{float:right;cursor:pointer;color:var(--muted);font-size:20px;line-height:1;background:none;border:none}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dow{text-align:center;font-size:11px;color:var(--muted);text-transform:uppercase;padding:4px}
.cal .cell{min-height:88px;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:5px;font-size:11px}
.cal .cell .dn{color:var(--muted);font-weight:600;margin-bottom:3px}
.cal .cell.today{border-color:var(--accent)}
.cal .cell.other{opacity:.35}
.evt-dot{display:block;font-size:10px;padding:2px 5px;border-radius:4px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
/* Seat map */
.seatmap{display:flex;flex-wrap:wrap;gap:6px;padding:14px;background:var(--panel2);border-radius:10px}
.seat{width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;cursor:pointer;border:1px solid var(--line);font-weight:600}
.seat.available{background:rgba(31,157,95,.18);color:var(--green)}
.seat.sold{background:rgba(201,67,43,.2);color:var(--red)}
.seat.locked{background:rgba(169,121,31,.2);color:var(--accent)}
.seat.checked{background:var(--red);color:#fff}
.stage-bar{background:linear-gradient(var(--panel2),var(--panel));text-align:center;padding:8px;border-radius:8px;color:var(--muted);letter-spacing:3px;font-size:12px;margin-bottom:14px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:10px 0}
.legend span{display:flex;align-items:center;gap:5px}
.dotc{width:12px;height:12px;border-radius:3px;display:inline-block}
.progress{height:8px;background:var(--panel2);border-radius:5px;overflow:hidden;margin-top:6px}
.progress>div{height:100%;background:var(--accent)}
.qr{width:150px;height:150px;image-rendering:pixelated;background:#fff;padding:8px;border-radius:8px}
.empty{text-align:center;padding:40px;color:var(--muted)}
.checklist label{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);color:var(--txt);font-size:13px;cursor:pointer;margin:0}
.checklist input{width:auto}
.bar-chart{display:flex;align-items:flex-end;gap:10px;height:160px;padding-top:10px}
.bar-chart .bar{flex:1;background:linear-gradient(var(--accent),var(--accent2));border-radius:5px 5px 0 0;position:relative;min-height:4px}
.bar-chart .bar span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:10px;color:var(--muted)}
.bar-chart .bar b{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:10px;color:var(--txt)}
.toast{position:fixed;bottom:24px;right:24px;background:var(--panel);border:1px solid var(--accent);color:var(--txt);padding:12px 18px;border-radius:8px;z-index:200;box-shadow:0 8px 30px rgba(0,0,0,.5);font-size:13px;animation:slideup .3s}
@keyframes slideup{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.mini{font-size:12px;color:var(--muted)}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:13px}
.kv .k{color:var(--muted)}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <!-- Struktur brand & side-user disamakan dengan modul Marketing/Reservasi:
         logo asli (bukan emoji), nama + sublabel, dan blok user di bawah. -->
    <div class="brand">
      <img id="brand-logo" alt="">
      <div><div class="bt">Laksamana Muda</div><div class="bs">Event</div></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div>Data: <b id="syncState" style="color:var(--green)">Tersimpan</b></div>
      <button onclick="resetData()">↺ Reset data demo</button>
    </div>
    <div class="side-user">
      <div class="su-avatar" id="su-avatar">?</div>
      <div class="su-info"><b id="su-un">-</b><span id="su-ur">-</span></div>
      <button class="logout-x" title="Keluar ke Office" onclick="logout()">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      </button>
    </div>
  </aside>
  <main id="main">
    <div class="topbar">
      <div><h2 id="pageTitle">Dashboard</h2><div class="crumb" id="crumb">Laksamana Muda EMS</div></div>
      <div id="topActions"></div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>
<div id="modalRoot"></div>

/* ============ CORE: STORE (MySQL via api.php) ============
   Dulu prototipe ini menyimpan ke localStorage: data cuma ada di satu browser
   dan tiap kru punya versi sendiri. Sekarang state disimpan di MySQL lewat
   ../event-api-mysql/api.php — kontraknya sama dengan backend reservasi.

   Kalau backend perlu dipindah/dibalik, cukup ganti SATU baris di bawah. */
const API_URL = "../event-api-mysql/api.php";

/* Data contoh (5 talent, 5 event, dst) hanya diisi KALAU database masih benar-
   benar kosong. Berguna untuk mengenalkan modul ke kru.
   >>> Setelah kru mulai input data beneran, ganti ke false <<<
   supaya database yang (misalnya) dikosongkan tidak diam-diam terisi ulang
   data karangan. Data contoh yang sudah terlanjur masuk dibersihkan lewat
   tombol "Reset data demo" atau hapus barisnya di phpMyAdmin. */
const SEED_CONTOH = true;

let DB=null;
function uid(){return 'id'+Math.random().toString(36).slice(2,9);}

/* ---- lapisan API (pola sama dengan modul reservasi) ---- */
function fetchWithTimeout(url,opts,ms){
  const ctrl=new AbortController();
  const t=setTimeout(()=>ctrl.abort(),ms||20000);
  return fetch(url,Object.assign({},opts,{signal:ctrl.signal})).finally(()=>clearTimeout(t));
}
/* Semua panggilan lewat SATU antrian: tidak pernah ada dua request jalan
   bersamaan dari satu perangkat (getAll polling + saveAll gampang tabrakan). */
let _apiChain=Promise.resolve();
function apiQueue(fn){const run=_apiChain.then(fn,fn);_apiChain=run.then(()=>{},()=>{});return run;}
async function _apiGet(action){
  const url=API_URL+(API_URL.includes("?")?"&":"?")+"action="+encodeURIComponent(action)+"&t="+Date.now();
  let res;
  try{ res=await fetchWithTimeout(url,{method:"GET",redirect:"follow"},20000); }
  catch(e){ throw new Error(e.name==="AbortError"?"Server tidak merespons (timeout).":e.message); }
  const json=await res.json();
  if(!json.ok) throw new Error(json.error||"server error");
  return json.data;
}
async function _apiPost(action,data){
  let res;
  try{
    res=await fetchWithTimeout(API_URL,{
      method:"POST",redirect:"follow",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({action,data})
    },30000);
  }catch(e){ throw new Error(e.name==="AbortError"?"Server tidak merespons (timeout).":e.message); }
  const json=await res.json();
  if(!json.ok) throw new Error(json.error||"server error");
  return json.data;
}
const apiGet =action=>apiQueue(()=>_apiGet(action));
const apiPost=(action,data)=>apiQueue(()=>_apiPost(action,data));

/* ---- bentuk state (jaga-jaga kalau server balas tanpa sebagian koleksi) ---- */
const COLS=['talents','events','schedules','recurringRules','talentPayments',
            'ticketClasses','seats','orders','tickets','ideas','refunds','calendarExtra'];
function normalize(s){
  s=s||{};
  COLS.forEach(k=>{ if(!Array.isArray(s[k])) s[k]=[]; });
  if(!Array.isArray(s.checkins)) s.checkins=[];
  if(!s.eventDetails||typeof s.eventDetails!=='object') s.eventDetails={};
  if(!Array.isArray(s.entertainmentRules)||!s.entertainmentRules.length)
    s.entertainmentRules=seed().entertainmentRules;
  if(!s.role) s.role='Director';
  return s;
}

/* ---- penstempel updatedAt otomatis ----
   Server menolak baris kiriman yang lebih LAMA daripada baris di server
   (penjaga updated_at) — itu yang mencegah dua kru saling menimpa. Supaya
   penjaga itu bekerja, tiap baris yang BERUBAH harus dicap waktu.
   Daripada menambah cap di ~40 tempat mutasi satu per satu (gampang kelewat),
   di sini dibandingkan sidik jari tiap baris dengan salinan terakhir yang
   diketahui server: yang berubah saja yang dicap. */
let _snap={};
function sig(o){const c=Object.assign({},o);delete c.updatedAt;return JSON.stringify(c);}
function eachRow(fn){
  COLS.forEach(k=>(DB[k]||[]).forEach(r=>{ if(r&&r.id) fn(k+':'+r.id,r); }));
  Object.keys(DB.eventDetails||{}).forEach(eid=>{
    const d=DB.eventDetails[eid]; if(d) fn('ed:'+eid,d);
  });
}
function stampChanges(){
  const now=Date.now();
  eachRow((key,r)=>{
    if(_snap[key]===sig(r)) return;      // tidak berubah -> jangan dicap ulang
    r.updatedAt=now;
    if(!r.createdAt) r.createdAt=now;
  });
}
function refreshSnapshot(){const n={};eachRow((key,r)=>{n[key]=sig(r);});_snap=n;}

/* ---- status sinkronisasi (ditampilkan di sidebar) ---- */
function setSync(state,msg){
  const el=document.getElementById('syncState'); if(!el) return;
  const map={saving:['Menyimpan...','var(--accent)'],saved:['Tersimpan','var(--green)'],
             pending:['Menunggu...','var(--muted)'],error:['Gagal simpan','var(--red)']};
  const m=map[state]||map.saved;
  el.textContent=m[0]; el.style.color=m[1]; el.title=msg||'';
}

/* ---- simpan: dikumpulkan dulu (debounce) baru dikirim sekali ----
   save() dipanggil di banyak tempat, kadang beruntun. Tanpa penundaan, satu
   aksi bisa memicu beberapa request sekaligus. */
let _saveTimer=null,_dirty=false,_saving=false;
function save(){
  _dirty=true; setSync('pending');
  clearTimeout(_saveTimer); _saveTimer=setTimeout(syncNow,800);
}
async function syncNow(){
  if(_saving||!_dirty) return;
  _saving=true; _dirty=false; setSync('saving');
  stampChanges();
  try{
    await apiPost('saveAll',DB);
    refreshSnapshot();
    setSync('saved');
  }catch(e){
    _dirty=true;                       // biar dicoba lagi, perubahan tidak hilang
    setSync('error',e.message);
    toast('Gagal simpan: '+e.message);
  }finally{ _saving=false; }
  if(_dirty) setTimeout(syncNow,2000);
}
// Jangan biarkan perubahan terakhir hilang saat tab ditutup.
window.addEventListener('beforeunload',e=>{
  if(_dirty||_saving){ e.preventDefault(); e.returnValue=''; }
});

/* ---- muat awal ---- */
async function load(){
  const s=await apiGet('getAll');
  DB=normalize(s);
  // Database masih perawan -> isi data contoh sekali, lalu simpan ke server.
  if(SEED_CONTOH&&!DB.talents.length&&!DB.events.length){
    DB=normalize(seed());
    _snap={};
    await syncNowForce();
  }
  refreshSnapshot();
}
async function syncNowForce(){_dirty=true;await syncNow();}

/* ---- tarik perubahan kru lain ----
   Hanya saat idle: tidak sedang menyimpan, tidak ada perubahan menggantung,
   tab sedang dilihat, dan tidak ada modal terbuka (biar isian tidak hilang). */
setInterval(async()=>{
  if(_dirty||_saving||document.hidden) return;
  if(document.getElementById('modalRoot').innerHTML) return;
  try{
    const s=normalize(await apiGet('getAll'));
    if(JSON.stringify(s)===JSON.stringify(DB)) return;
    DB=s; refreshSnapshot(); router();
  }catch(e){ /* diam: polling gagal bukan alasan mengganggu kerja */ }
},20000);

function resetData(){
  if(!confirm('Reset semua data EMS ke sample awal?\n\nIni menghapus data di DATABASE, bukan cuma di browser ini — semua kru ikut terpengaruh.'))return;
  DB=normalize(seed()); _snap={};
  syncNowForce().then(()=>{router();toast('Data direset ke sample.');});
}

/* ============ HELPERS ============ */

const pad=n=>String(n).padStart(2,'0');

// deterministic pseudo-QR svg from token
// Catatan tema: warna di sini (#fff latar, #0d1117 modul) sengaja TIDAK ikut
// variabel tema. QR harus selalu gelap-di-atas-putih agar terbaca pemindai —
// kalau diikutkan palet krem/emas, kontrasnya turun dan scan bisa gagal.
function qrSvg(token){let h=0;for(let i=0;i<token.length;i++)h=(h*31+token.charCodeAt(i))>>>0;const N=15;let rng=h;const rand=()=>{rng=(rng*1103515245+12345)&0x7fffffff;return rng/0x7fffffff;};let r='<svg class="qr" viewBox="0 0 '+N+' '+N+'" xmlns="http://www.w3.org/2000/svg"><rect width="'+N+'" height="'+N+'" fill="#fff"/>';for(let y=0;y<N;y++)for(let x=0;x<N;x++){const finder=(x<4&&y<4)||(x>N-5&&y<4)||(x<4&&y>N-5);if(finder?((x===0||x===3||y===0||y===3||(x>=1&&x<=2&&y>=1&&y<=2))&&!(x===N)):rand()>0.5){r+='<rect x="'+x+'" y="'+y+'" width="1" height="1" fill="#0d1117"/>';}}r+='</svg>';return r;}

  NAV.forEach(it=>{
    if(it.s){const d=document.createElement('div');d.className='sect';d.textContent=it.s;nav.appendChild(d);return;}

function saveSchedule(){

function genRecurring(){
  const g=x=>document.getElementById(x).value;
  const dows=[...document.querySelectorAll('.r_dow:checked')].map(c=>+c.value);
  if(!dows.length){toast('Pilih minimal satu hari.');return;}
  const tid=g('r_tal'),st=g('r_start'),et=g('r_end'),fee=+g('r_fee'),type=g('r_type');
  const rid=uid();DB.recurringRules.push({id:rid,talent_id:tid,days_of_week:dows,start_time:st,end_time:et,valid_from:g('r_from'),valid_to:g('r_to'),performance_type:type,fee});
  let added=0,skipped=0;const from=new Date(g('r_from')),to=new Date(g('r_to'));
  for(let d=new Date(from);d<=to;d.setDate(d.getDate()+1)){
    if(dows.includes(d.getDay())){const ds=dstr(d);
      if(hasConflict(tid,ds,st,et)){skipped++;continue;}
      DB.schedules.push({id:uid(),talent_id:tid,event_id:null,date:ds,start_time:st,end_time:et,performance_type:type,fee,status:'Scheduled',recurring_rule_id:rid,source:'recurring'});added++;}
  }
  save();closeModal();renderSchedule();toast(`✓ ${added} jadwal dibuat${skipped?', '+skipped+' dilewati (konflik/duplikat)':''}.`);
}

      if(hasConflict(tid,ds,st,et)){skipped++;continue;}
      DB.schedules.push({id:uid(),talent_id:tid,event_id:null,date:ds,start_time:st,end_time:et,performance_type:t.category,fee,status:'Scheduled',recurring_rule_id:null,source:'monthly_generator'});added++;}}

/* ============ FEE & PAYMENT ============ */
let feeMonth=dstr(new Date()).slice(0,7);
function renderFee(){
  setTop('Fee & Pembayaran Talent','Rekap otomatis show Done × fee','');
  // build recap per talent for month
  const recap={};
  DB.schedules.filter(s=>s.date.startsWith(feeMonth)&&s.status==='Done').forEach(s=>{recap[s.talent_id]=recap[s.talent_id]||{count:0,total:0};recap[s.talent_id].count++;recap[s.talent_id].total+=s.fee;});
  const rows=Object.keys(recap).map(tid=>{const t=DB.talents.find(x=>x.id===tid);const pay=DB.talentPayments.find(p=>p.talent_id===tid&&p.period_month===feeMonth);return {t,...recap[tid],pay};});
  C().innerHTML=`
  <div class="toolbar"><label style="margin:0">Periode:</label><input type="month" value="${feeMonth}" onchange="feeMonth=this.value;renderFee()" style="width:auto">
  <span class="pill">Total show Done: ${Object.values(recap).reduce((a,r)=>a+r.count,0)}</span>
  <span class="pill">Total fee: ${IDR(Object.values(recap).reduce((a,r)=>a+r.total,0))}</span></div>
  <div class="card" style="padding:0"><table><thead><tr><th>Talent</th><th>Bank</th><th>Show Done</th><th>Total Fee</th><th>Status</th><th>Aksi</th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td><b>${esc(r.t.name)}</b><br><span class="mini">${r.t.category}</span></td><td>${esc(r.t.bank_name)} · ${esc(r.t.bank_account)}</td><td>${r.count} show</td><td><b>${IDR(r.total)}</b></td><td>${r.pay?statusBadge(r.pay.status):'<span class="mini">belum di-generate</span>'}</td>
    <td>${r.pay?(r.pay.status==='Waiting'?`<button class="btn sm" onclick="payAction('${r.pay.id}')">Bayar</button>`:`<button class="btn ghost sm" onclick="payHistory('${r.pay.id}')">Detail</button>`):`<button class="btn blue sm" onclick="genPayment('${r.t.id}',${r.total},${r.count})">Generate Payment</button>`}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">Tidak ada show Done pada periode ini.</td></tr>'}
  </tbody></table></div>`;
}
function genPayment(tid,total,count){
  DB.talentPayments.push({id:uid(),talent_id:tid,period_month:feeMonth,show_count:count,total_amount:total,status:'Waiting',bank:'',transfer_proof_url:'',pic_finance:'',paid_at:null});
  save();renderFee();toast('✓ Payment record dibuat — status Waiting '+IDR(total));
}
function payAction(pid){
  const p=DB.talentPayments.find(x=>x.id===pid);const t=DB.talents.find(x=>x.id===p.talent_id);
  modal(`<button class="close" onclick="closeModal()">×</button><h3>Proses Pembayaran — ${esc(t.name)}</h3>
  <div class="kv" style="margin-bottom:14px"><div class="k">Periode</div><div>${MONTHS[+p.period_month.slice(5)-1]} ${p.period_month.slice(0,4)}</div><div class="k">Jumlah Show</div><div>${p.show_count}</div><div class="k">Total</div><div><b>${IDR(p.total_amount)}</b></div></div>
  <div class="field"><label>Bank Tujuan</label><input id="pay_bank" value="${esc(t.bank_name)} - ${esc(t.bank_account)}"></div>
  <div class="field"><label>Bukti Transfer</label><input value="upload bukti_transfer.jpg" onclick="toast('Demo: upload bukti')" readonly style="cursor:pointer"></div>
  <div class="field"><label>PIC Finance</label><input id="pay_pic" value="Finance"></div>
  <div class="modal-actions"><button class="btn danger" onclick="rejectPay('${pid}')">Reject</button><button class="btn" onclick="markPaid('${pid}')">Set Paid</button></div>`);
}
function markPaid(pid){const p=DB.talentPayments.find(x=>x.id===pid);p.status='Paid';p.paid_at=new Date().toISOString();p.bank=document.getElementById('pay_bank').value;p.pic_finance=document.getElementById('pay_pic').value;p.transfer_proof_url='bukti.jpg';save();closeModal();renderFee();toast('✓ Paid — Performance History talent kini menampilkan Paid.');}
function rejectPay(pid){const p=DB.talentPayments.find(x=>x.id===pid);p.status='Rejected';save();closeModal();renderFee();toast('Payment ditolak.');}
function payHistory(pid){const p=DB.talentPayments.find(x=>x.id===pid);const t=DB.talents.find(x=>x.id===p.talent_id);modal(`<button class="close" onclick="closeModal()">×</button><h3>Payment History</h3><div class="kv"><div class="k">Talent</div><div>${esc(t.name)}</div><div class="k">Total</div><div>${IDR(p.total_amount)}</div><div class="k">Status</div><div>${statusBadge(p.status)}</div><div class="k">Bank</div><div>${esc(p.bank||'-')}</div><div class="k">Bukti</div><div>${esc(p.transfer_proof_url||'-')}</div><div class="k">PIC Finance</div><div>${esc(p.pic_finance||'-')}</div><div class="k">Dibayar</div><div>${p.paid_at?fmtDateTime(p.paid_at):'-'}</div></div><div class="modal-actions"><button class="btn" onclick="closeModal()">Tutup</button></div>`);}

/* ============ EVENT MANAGEMENT ============ */

const TIMELINE_PHASES=['Preparation','Marketing','Vendor','Talent','Decoration','Opening','Closing','Evaluation'];

  <div class="grid g3">
  ${list.map(e=>{const sold=DB.ticketClasses.filter(c=>c.event_id===e.id).reduce((a,c)=>a+c.sold,0);const rev=DB.orders.filter(o=>o.event_id===e.id&&o.payment_status==='Paid').reduce((a,o)=>a+o.total,0);return `<div class="ecard" onclick="location.hash='#/events/${e.id}'">
    <div class="cover">${e.poster}<span style="position:absolute;top:8px;right:8px">${statusBadge(e.status)}</span></div>
    <div class="body"><div class="t">${esc(e.title)}</div>
    <div class="meta">📅 ${fmtDateTime(e.start_datetime)}</div>
    <div class="meta">📍 ${esc(e.venue)}</div>
    <div class="meta">👤 ${esc(e.pic)}</div>

  <div class="grid g2">
    <div class="field"><label>Judul *</label><input id="e_title" value="${esc(e.title||'')}"></div>
    <div class="field"><label>Emoji Poster</label><input id="e_poster" value="${esc(e.poster||'🎪')}"></div>
    <div class="field"><label>Kategori</label><select id="e_cat">${EVT_CATS.map(c=>`<option ${e.category===c?'selected':''}>${c}</option>`).join('')}</select></div>
    <div class="field"><label>Theme</label><input id="e_theme" value="${esc(e.theme||'')}"></div>
    <div class="field"><label>Venue</label><input id="e_venue" value="${esc(e.venue||'')}"></div>
    <div class="field"><label>Kapasitas</label><input id="e_cap" type="number" value="${e.capacity||100}"></div>
    <div class="field"><label>Mulai</label><input id="e_start" type="datetime-local" value="${e.start_datetime?e.start_datetime.slice(0,16):''}"></div>
    <div class="field"><label>Selesai</label><input id="e_end" type="datetime-local" value="${e.end_datetime?e.end_datetime.slice(0,16):''}"></div>
    <div class="field"><label>PIC</label><input id="e_pic" value="${esc(e.pic||'')}"></div>
    <div class="field"><label>Co-PIC</label><input id="e_copic" value="${esc(e.co_pic||'')}"></div>
  </div>
  <div class="field"><label>Deskripsi</label><textarea id="e_desc" rows="2">${esc((e.description||'').replace(/<[^>]+>/g,''))}</textarea></div>
  <label style="display:inline-flex;gap:6px;color:var(--txt)"><input type="checkbox" id="e_tix" style="width:auto" ${e.is_ticketed?'checked':''}> Ticketed event (aktifkan modul ticketing)</label>
  <div class="modal-actions"><button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn" onclick="saveEvent('${id||''}')">Simpan</button></div>`,true);
}
function saveEvent(id){
  const g=x=>document.getElementById(x).value;
  const title=g('e_title').trim();if(!title){toast('Judul wajib.');return;}
  const data={title,poster:g('e_poster')||'🎪',category:g('e_cat'),theme:g('e_theme'),venue:g('e_venue'),capacity:+g('e_cap'),start_datetime:g('e_start')?new Date(g('e_start')).toISOString():new Date().toISOString(),end_datetime:g('e_end')?new Date(g('e_end')).toISOString():new Date().toISOString(),pic:g('e_pic'),co_pic:g('e_copic'),description:'<p>'+esc(g('e_desc'))+'</p>',is_ticketed:document.getElementById('e_tix').checked};
  if(id){Object.assign(DB.events.find(x=>x.id===id),data);}
  else{const nid=uid();data.status='Draft';data.idea_id=null;DB.events.push({id:nid,...data});
    // default timeline & tasks from template
    DB.eventDetails[nid]={timeline:Object.fromEntries(TIMELINE_PHASES.map(p=>[p,false])),rundown:[],vendors:[],budget:[],sponsors:[],tasks:[{title:'Design poster',assignee:'Marketing',due:data.start_datetime,done:false},{title:'Book talent',assignee:'Ent. Coord',due:data.start_datetime,done:false}]};
    id=nid;}
  save();closeModal();toast('✓ Event tersimpan dengan timeline & task default.');location.hash='#/events/'+id;
}
function ensureDetails(id){if(!DB.eventDetails[id])DB.eventDetails[id]={timeline:Object.fromEntries(TIMELINE_PHASES.map(p=>[p,false])),rundown:[],vendors:[],budget:[],sponsors:[],tasks:[]};return DB.eventDetails[id];}
function renderEventDetail(id){
  const e=DB.events.find(x=>x.id===id);if(!e){location.hash='#/events';return;}
  const d=ensureDetails(id);window._evtTab=window._evtTab||'info';const tab=window._evtTab;
  const locked=e.status==='Finished';
  setTop(e.title,'<a href="#/events" style="color:var(--accent)">Events</a> / '+esc(e.title),locked?statusBadge('Finished')+' <span class="mini">terkunci</span>':`<button class="btn ghost sm" onclick="cycleEventStatus('${id}')">Ubah Status</button> <button class="btn ghost sm" onclick="eventForm('${id}')">Edit</button>`);
  const tb=(k,l)=>`<button class="${tab===k?'active':''}" onclick="window._evtTab='${k}';renderEventDetail('${id}')">${l}</button>`;
  let body='';
  if(tab==='info'){const sold=DB.ticketClasses.filter(c=>c.event_id===id).reduce((a,c)=>a+c.sold,0);body=`<div class="grid g2"><div class="card"><h3 class="sec">Basic Information</h3><div class="kv">
    <div class="k">Kategori</div><div><span class="badge b-blue">${e.category}</span></div><div class="k">Theme</div><div>${esc(e.theme||'—')}</div>
    <div class="k">Venue</div><div>${esc(e.venue)}</div><div class="k">Waktu</div><div>${fmtDateTime(e.start_datetime)} – ${new Date(e.end_datetime).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}</div>
    <div class="k">Kapasitas</div><div>${e.capacity} orang</div><div class="k">PIC / Co-PIC</div><div>${esc(e.pic)} / ${esc(e.co_pic||'—')}</div>
    <div class="k">Status</div><div>${statusBadge(e.status)}</div><div class="k">Ticketed</div><div>${e.is_ticketed?'Ya · '+sold+' terjual':'Tidak'}</div></div>
    <div style="margin-top:12px" class="mini">${e.description}</div></div>
    <div class="card"><h3 class="sec">Marketing Material</h3><div class="grid g3">${['Poster','Video','Caption','Reels','Story','Ads'].map(m=>`<div class="card" style="background:var(--panel2);text-align:center;padding:12px"><div style="font-size:24px">🎨</div>${m}</div>`).join('')}</div>${e.is_ticketed?`<div style="margin-top:14px"><a class="btn blue sm" href="#/ticketing/${id}">🎟️ Kelola Ticketing →</a></div>`:''}</div></div>`;}
  else if(tab==='timeline'){body=`<div class="card"><h3 class="sec">Event Timeline (Checklist)</h3><div class="checklist">${TIMELINE_PHASES.map(p=>`<label><input type="checkbox" ${d.timeline[p]?'checked':''} ${locked?'disabled':''} onchange="toggleTimeline('${id}','${p}')"> ${p}</label>`).join('')}</div></div>`;}
  else if(tab==='rundown'){body=`<div class="card"><h3 class="sec">Rundown</h3>${!locked?`<button class="btn ghost sm" style="margin-bottom:12px" onclick="addRundown('${id}')">+ Baris</button>`:''}<table><thead><tr><th>Jam</th><th>Activity</th><th>PIC</th><th>Notes</th></tr></thead><tbody>${d.rundown.map(r=>`<tr><td>${esc(r.time)}</td><td>${esc(r.activity)}</td><td>${esc(r.pic)}</td><td>${esc(r.notes||'')}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">Belum ada rundown.</td></tr>'}</tbody></table></div>`;}
  else if(tab==='vendor'){body=`<div class="card"><h3 class="sec">Vendor</h3>${!locked?`<button class="btn ghost sm" style="margin-bottom:12px" onclick="addVendor('${id}')">+ Vendor</button>`:''}<table><thead><tr><th>Vendor</th><th>PIC</th><th>Phone</th><th>Cost</th><th>Status</th></tr></thead><tbody>${d.vendors.map(v=>`<tr><td>${esc(v.name)}</td><td>${esc(v.pic)}</td><td>${esc(v.phone)}</td><td>${IDR(v.cost)}</td><td>${statusBadge(v.status)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Belum ada vendor.</td></tr>'}</tbody></table></div>`;}
  else if(tab==='budget'){const inc=d.budget.filter(b=>b.type==='Income'),exp=d.budget.filter(b=>b.type==='Expense');const sumB=a=>a.reduce((s,b)=>s+b.budget,0),sumA=a=>a.reduce((s,b)=>s+b.actual,0);const profit=sumA(inc)-sumA(exp);body=`<div class="grid g3" style="margin-bottom:16px">${stat('Income (Actual)',IDR(sumA(inc)),'budget '+IDR(sumB(inc)))}${stat('Expense (Actual)',IDR(sumA(exp)),'budget '+IDR(sumB(exp)))}${stat('Profit',IDR(profit),profit>=0?'surplus':'defisit')}</div>
    <div class="card"><h3 class="sec">Budget — Actual vs Budget vs Variance</h3><table><thead><tr><th>Item</th><th>Tipe</th><th>Budget</th><th>Actual</th><th>Variance</th></tr></thead><tbody>${d.budget.map(b=>{const v=b.actual-b.budget;return `<tr><td>${esc(b.item)}</td><td>${b.type}</td><td>${IDR(b.budget)}</td><td>${IDR(b.actual)}</td><td style="color:${v<0?'var(--green)':v>0?'var(--red)':'var(--muted)'}">${v>0?'+':''}${IDR(v)}</td></tr>`;}).join('')||'<tr><td colspan="5" class="empty">Belum ada budget.</td></tr>'}</tbody></table></div>`;}
  else if(tab==='sponsor'){body=`<div class="card"><h3 class="sec">Sponsor</h3><table><thead><tr><th>Sponsor</th><th>Package</th><th>Nominal</th><th>Agreement</th><th>Status</th></tr></thead><tbody>${d.sponsors.map(s=>`<tr><td>${s.logo||''} ${esc(s.name)}</td><td>${esc(s.package)}</td><td>${IDR(s.nominal)}</td><td>${esc(s.agreement)}</td><td>${statusBadge(s.status)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Belum ada sponsor.</td></tr>'}</tbody></table></div>`;}
  else{body=`<div class="card"><h3 class="sec">Internal Task <span class="mini">(sinkron Task Management)</span></h3>${!locked?`<button class="btn ghost sm" style="margin-bottom:12px" onclick="addTask('${id}')">+ Task</button>`:''}<table><thead><tr><th>✓</th><th>Task</th><th>Assignee</th><th>Due Date</th></tr></thead><tbody>${d.tasks.map((t,i)=>`<tr><td><input type="checkbox" style="width:auto" ${t.done?'checked':''} onchange="toggleTask('${id}',${i})"></td><td ${t.done?'style="text-decoration:line-through;color:var(--muted)"':''}>${esc(t.title)}</td><td>${esc(t.assignee)}</td><td>${fmtDate(t.due)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">Belum ada task.</td></tr>'}</tbody></table></div>`;}
  C().innerHTML=`<div style="display:flex;gap:16px;align-items:center;margin-bottom:16px"><div style="font-size:44px">${e.poster}</div><div><h3 style="font-size:20px">${esc(e.title)}</h3><span class="mini">${e.category} · ${esc(e.venue)} · ${fmtDate(e.start_datetime)}</span></div></div>
  <div class="tabs">${tb('info','Info & Marketing')}${tb('timeline','Timeline')}${tb('rundown','Rundown')}${tb('vendor','Vendor')}${tb('budget','Budget')}${tb('sponsor','Sponsor')}${tb('task','Task')}</div>${body}`;
}
function cycleEventStatus(id){const order=['Draft','Upcoming','Today','Finished'];const e=DB.events.find(x=>x.id===id);const i=order.indexOf(e.status);if(e.status==='Cancelled'){e.status='Draft';}else if(i>=order.length-1){e.status='Cancelled';}else{e.status=order[i+1];}save();if(e.status==='Finished')toast('Event Finished → data terkunci & masuk History.');renderEventDetail(id);}
function toggleTimeline(id,p){DB.eventDetails[id].timeline[p]=!DB.eventDetails[id].timeline[p];save();}
function toggleTask(id,i){DB.eventDetails[id].tasks[i].done=!DB.eventDetails[id].tasks[i].done;save();renderEventDetail(id);}
function addRundown(id){const time=prompt('Jam (mis. 20:00)');if(!time)return;const activity=prompt('Activity');const pic=prompt('PIC')||'';DB.eventDetails[id].rundown.push({time,activity,pic,notes:''});DB.eventDetails[id].rundown.sort((a,b)=>a.time.localeCompare(b.time));save();renderEventDetail(id);}
function addVendor(id){const name=prompt('Nama vendor');if(!name)return;const cost=+prompt('Cost (IDR)')||0;DB.eventDetails[id].vendors.push({name,pic:prompt('PIC')||'',phone:'',cost,status:'Pending',attachment:''});save();renderEventDetail(id);}
function addTask(id){const title=prompt('Judul task');if(!title)return;DB.eventDetails[id].tasks.push({title,assignee:prompt('Assignee')||'',due:new Date().toISOString(),done:false});save();renderEventDetail(id);}

/* ============ TICKETING ============ */
function renderTicketing(id){
  if(id)return renderTicketDetail(id);
  setTop('Ticketing','Event ber-tiket, kelas tiket & penjualan','');
  const evs=DB.events.filter(e=>e.is_ticketed);
  C().innerHTML=`<div class="grid g2">${evs.map(e=>{const cls=DB.ticketClasses.filter(c=>c.event_id===e.id);const sold=cls.reduce((a,c)=>a+c.sold,0);const quota=cls.reduce((a,c)=>a+c.quota,0);const rev=DB.orders.filter(o=>o.event_id===e.id&&o.payment_status==='Paid').reduce((a,o)=>a+o.total,0);const pct=quota?Math.round(sold/quota*100):0;return `<div class="ecard" onclick="location.hash='#/ticketing/${e.id}'"><div class="body">
    <div style="display:flex;justify-content:space-between"><div class="t">${e.poster} ${esc(e.title)}</div>${statusBadge(e.status)}</div>
    <div class="meta">📅 ${fmtDate(e.start_datetime)} · 📍 ${esc(e.venue)}</div>
    <div style="margin-top:10px;display:flex;justify-content:space-between"><span>${sold}/${quota} tiket (${pct}%)</span><b style="color:var(--accent)">${IDR(rev)}</b></div>
    <div class="progress"><div style="width:${pct}%"></div></div>
    ${pct>=90?'<div class="mini" style="color:var(--red);margin-top:6px">⚠ Tiket hampir habis!</div>':''}
  </div></div>`;}).join('')||'<div class="empty">Belum ada event ticketed.</div>'}</div>`;
}
function renderTicketDetail(id){
  const e=DB.events.find(x=>x.id===id);if(!e){location.hash='#/ticketing';return;}
  window._tixTab=window._tixTab||'classes';const tab=window._tixTab;
  setTop(e.title+' — Ticketing','<a href="#/ticketing" style="color:var(--accent)">Ticketing</a> / '+esc(e.title),'');
  const classes=DB.ticketClasses.filter(c=>c.event_id===id);
  const tb=(k,l)=>`<button class="${tab===k?'active':''}" onclick="window._tixTab='${k}';renderTicketDetail('${id}')">${l}</button>`;
  let body='';
  if(tab==='classes'){body=`<button class="btn ghost sm" style="margin-bottom:12px" onclick="ticketClassForm('${id}')">+ Ticket Class</button>
    <div class="card" style="padding:0"><table><thead><tr><th>Class</th><th>Harga</th><th>Kuota</th><th>Terjual</th><th>Sale Window</th><th>Mode</th></tr></thead><tbody>
    ${classes.map(c=>`<tr><td><b>${esc(c.name)}</b><br><span class="mini">${esc(c.benefit)}</span></td><td>${IDR(c.price)}</td><td>${c.quota}</td><td>${c.sold} ${c.sold>=c.quota?statusBadge('Sold'):''}</td><td class="mini">${fmtDate(c.sale_start)} – ${fmtDate(c.sale_end)}</td><td>${c.is_seated?'<span class="badge b-purple">Seated</span>':'<span class="badge b-blue">Standing</span>'}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">Belum ada ticket class.</td></tr>'}

function doPurchase(eid){
  const g=x=>document.getElementById(x).value.trim();const cid=g('pf_class'),name=g('pf_name'),phone=g('pf_phone'),email=g('pf_email');
  if(!name||!phone||!email){toast('Nama, phone, email wajib.');return;}
  const c=DB.ticketClasses.find(x=>x.id===cid);
  if(c.sold>=c.quota){toast('⛔ Sold out — kuota tercapai.');return;}
  // seat hold + atomic-ish
  c.sold++;
  const oid=uid();DB.orders.push({id:oid,event_id:eid,buyer_name:name,phone,email,birthdate:g('pf_bd'),notes:'',subtotal:c.price,fee:5000,total:c.price+5000,payment_status:'Paid',payment_ref:'MID-'+uid().slice(2,8).toUpperCase(),expires_at:new Date(Date.now()+600000).toISOString(),created:new Date().toISOString()});
  let seatId=null;if(c.is_seated){const av=DB.seats.find(s=>s.ticket_class_id===cid&&s.status==='Available');if(av){av.status='Sold';seatId=av.id;}}
  const tk={id:uid(),order_item_id:oid,ticket_number:'LM-'+(1000+DB.tickets.length),qr_token:'QR'+uid()+oid,ticket_class_id:cid,seat_id:seatId,pdf_url:'eticket.pdf',status:'Valid'};DB.tickets.push(tk);
  save();closeModal();toast('✓ Paid! E-ticket + QR terkirim ke Email & WA (< 2 menit).');window._tixTab='buyers';renderTicketDetail(eid);setTimeout(()=>showETicket(tk.id),400);
}

function requestRefund(oid){const reason=prompt('Alasan refund:');if(!reason)return;DB.refunds.push({id:uid(),order_id:oid,reason,status:'Pending'});save();toast('Refund diajukan (Pending). Cek tab Refund.');const o=DB.orders.find(x=>x.id===oid);window._tixTab='refund';renderTicketDetail(o.event_id);}

function doScan(token){
  token=(token||'').trim();const res=document.getElementById('scanResult');
  const tk=DB.tickets.find(t=>t.qr_token===token);
  if(!tk||tk.status==='Cancelled'){res.innerHTML=`<div class="card" style="border-color:var(--red);background:rgba(201,67,43,.1)"><b style="color:var(--red);font-size:18px">✗ Invalid Ticket</b><div class="mini">QR tidak dikenal / dibatalkan.</div></div>`;return;}
  if(tk.status==='Checked-In'){const ci=DB.checkins.find(c=>c.ticket_id===tk.id);res.innerHTML=`<div class="card" style="border-color:var(--accent);background:rgba(169,121,31,.1)"><b style="color:var(--accent);font-size:18px">⚠ Already Checked In</b><div class="mini">Sudah scan pada ${ci?fmtDateTime(ci.checked_in_at):'-'}.</div></div>`;return;}
  tk.status='Checked-In';DB.checkins.push({id:uid(),ticket_id:tk.id,checked_in_at:new Date().toISOString(),staff:DB.role,gate:'Main',result:'Valid'});save();
  const o=DB.orders.find(x=>x.id===tk.order_item_id);
  res.innerHTML=`<div class="card" style="border-color:var(--green);background:rgba(31,157,95,.1)"><b style="color:var(--green);font-size:18px">✓ Valid</b><div class="mini">${esc(o.buyer_name)} · ${tk.ticket_number} · Checked-In</div></div>`;
  toast('✓ Check-in berhasil — occupancy update real-time.');setTimeout(renderCheckin,900);
}

let calMonth=new Date();let calFilter='all';
function renderCalendar(){
  setTop('Event Calendar','Kalender terpadu multi-sumber','');
  const y=calMonth.getFullYear(),m=calMonth.getMonth();
  const startDow=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();const todayStr=dstr(new Date());
  // aggregate items
  const items={};// date -> [{title,color,type}]
  const push=(date,title,color,type)=>{if(calFilter!=='all'&&calFilter!==type)return;(items[date]=items[date]||[]).push({title,color,type});};
  DB.events.forEach(e=>push(e.start_datetime.slice(0,10),e.poster+' '+e.title,'yellow','Event'));
  DB.schedules.forEach(s=>{const t=DB.talents.find(x=>x.id===s.talent_id);push(s.date,'🎤 '+(t?t.name:''),'green','Entertainment');});
  DB.calendarExtra.forEach(x=>push(x.date,x.title,x.color==='purple'?'purple':x.color==='orange'?'orange':x.color==='red'?'red':'blue',x.type));
  let cells='';for(let i=0;i<startDow;i++)cells+='<div class="cell other"></div>';
  for(let d=1;d<=days;d++){const ds=dstr(new Date(y,m,d));const its=items[ds]||[];cells+=`<div class="cell ${ds===todayStr?'today':''}"><div class="dn">${d}</div>${its.slice(0,4).map(it=>`<span class="evt-dot b-${it.color}">${esc(it.title)}</span>`).join('')}${its.length>4?`<span class="mini">+${its.length-4} lagi</span>`:''}</div>`;}
  const types=['all','Event','Entertainment','Reservation','Marketing','Holiday','Birthday'];
  C().innerHTML=`<div class="toolbar"><button class="btn ghost sm" onclick="calMonth=new Date(${y},${m-1},1);renderCalendar()">‹</button><b style="min-width:140px;text-align:center">${MONTHS[m]} ${y}</b><button class="btn ghost sm" onclick="calMonth=new Date(${y},${m+1},1);renderCalendar()">›</button>
  <select onchange="calFilter=this.value;renderCalendar()" style="width:auto">${types.map(t=>`<option value="${t}" ${calFilter===t?'selected':''}>${t==='all'?'Semua tipe':t}</option>`).join('')}</select>
  <button class="btn ghost sm" onclick="toast('Demo: two-way sync Google Calendar (opsional)')">🔗 Sync Google</button></div>
  <div class="legend"><span><i class="dotc" style="background:var(--accent)"></i>Event</span><span><i class="dotc" style="background:var(--green)"></i>Talent</span><span><i class="dotc" style="background:var(--purple)"></i>Reservation</span><span><i class="dotc" style="background:var(--orange)"></i>Marketing</span><span><i class="dotc" style="background:var(--red)"></i>Holiday</span><span><i class="dotc" style="background:var(--blue)"></i>Birthday</span></div>
  <div class="cal">${DOW.map(d=>`<div class="dow">${d}</div>`).join('')}${cells}</div>`;
}

function saveIdea(){const g=x=>document.getElementById(x).value;const name=g('i_name').trim();if(!name){toast('Nama wajib.');return;}DB.ideas.push({id:uid(),name,description:g('i_desc'),category:g('i_cat'),target_market:g('i_target'),budget:+g('i_budget'),potential_revenue:+g('i_rev'),difficulty:g('i_diff'),frequency:g('i_freq'),ever_executed:false,evaluations:[]});save();closeModal();renderIdeas();toast('Ide tersimpan.');}
function evalIdea(id){const i=DB.ideas.find(x=>x.id===id);const omzet=+prompt('Omzet (IDR):')||0;const attendance=+prompt('Attendance:')||0;const score=+prompt('Score 1-10:')||0;const feedback=prompt('Feedback:')||'';i.evaluations.push({executed:'Ya',omzet,attendance,feedback,score});i.ever_executed=true;save();renderIdeas();toast('Evaluasi ditambahkan.');}
function spawnEvent(id){const i=DB.ideas.find(x=>x.id===id);const nid=uid();DB.events.push({id:nid,title:i.name,description:'<p>'+esc(i.description)+'</p>',poster:'💡',category:i.category==='Music'?'Music':i.category==='Festival'?'Festival':'Community',theme:'',venue:'',start_datetime:new Date().toISOString(),end_datetime:new Date().toISOString(),capacity:100,pic:'',co_pic:'',status:'Draft',is_ticketed:false,idea_id:id});DB.eventDetails[nid]={timeline:Object.fromEntries(TIMELINE_PHASES.map(p=>[p,false])),rundown:[],vendors:[],budget:[],sponsors:[],tasks:[]};save();toast('✓ Event draft dibuat dari ide (prefill).');location.hash='#/events/'+nid;}

/* ============ EVENT HISTORY ============ */
let histFilter={year:'',cat:''};
function renderHistory(){
  setTop('Event History','Arsip event selesai (read-only)','');
  let list=DB.events.filter(e=>e.status==='Finished');
  const years=[...new Set(list.map(e=>e.start_datetime.slice(0,4)))];
  if(histFilter.year)list=list.filter(e=>e.start_datetime.startsWith(histFilter.year));
  if(histFilter.cat)list=list.filter(e=>e.category===histFilter.cat);
  C().innerHTML=`<div class="toolbar">
    <select onchange="histFilter.year=this.value;renderHistory()"><option value="">Semua tahun</option>${years.map(y=>`<option ${histFilter.year===y?'selected':''}>${y}</option>`).join('')}</select>
    <select onchange="histFilter.cat=this.value;renderHistory()"><option value="">Semua kategori</option>${EVT_CATS.map(c=>`<option ${histFilter.cat===c?'selected':''}>${c}</option>`).join('')}</select>
    <span class="pill">${list.length} event</span></div>
  <div class="grid g3">${list.map(e=>{const idea=e.idea_id?DB.ideas.find(i=>i.id===e.idea_id):null;const ev=idea&&idea.evaluations[0];return `<div class="ecard" onclick="location.hash='#/history/${e.id}'"><div class="cover">${e.poster}</div><div class="body"><div class="t">${esc(e.title)}</div><div class="meta">📅 ${fmtDate(e.start_datetime)}</div>${ev?`<div class="meta" style="color:var(--accent)">💰 ${IDR(ev.omzet)} · 👥 ${ev.attendance} · ⭐ ${ev.score}/10</div>`:'<div class="meta">Evaluasi belum ada</div>'}</div></div>`;}).join('')||'<div class="empty">Belum ada event selesai.</div>'}</div>`;
}
function renderHistoryDetail(id){
  const e=DB.events.find(x=>x.id===id);if(!e){location.hash='#/history';return;}
  const idea=e.idea_id?DB.ideas.find(i=>i.id===e.idea_id):null;const ev=idea&&idea.evaluations[0];
  const d=DB.eventDetails[id];
  setTop(e.title,'<a href="#/history" style="color:var(--accent)">History</a> / '+esc(e.title),statusBadge('Finished'));
  C().innerHTML=`<div style="display:flex;gap:16px;align-items:center;margin-bottom:16px"><div style="font-size:44px">${e.poster}</div><div><h3 style="font-size:20px">${esc(e.title)}</h3><span class="mini">${e.category} · ${esc(e.venue)} · ${fmtDate(e.start_datetime)}</span></div></div>
  <div class="grid g2"><div class="card"><h3 class="sec">📊 Hasil</h3><div class="kv">
    <div class="k">Omzet</div><div><b>${ev?IDR(ev.omzet):'—'}</b></div>
    <div class="k">Attendance</div><div>${ev?ev.attendance+' orang':'—'}</div>
    <div class="k">Score</div><div>${ev?ev.score+'/10':'—'}</div>
    <div class="k">Feedback</div><div>${ev?esc(ev.feedback):'—'}</div>
  </div></div>
  <div class="card"><h3 class="sec">🖼️ Media & Evaluasi</h3><div class="grid g3">${['📷','🎥','📸'].map(m=>`<div class="card" style="background:var(--panel2);text-align:center;font-size:28px">${m}</div>`).join('')}</div>
    <div class="kv" style="margin-top:12px"><div class="k">Problem</div><div>Sound sistem kurang di area belakang.</div><div class="k">Improvement</div><div>Upgrade PA system + tambah stage monitor.</div></div></div></div>
  ${d&&d.budget.length?`<div class="card" style="margin-top:16px"><h3 class="sec">💰 P/L</h3><table><thead><tr><th>Item</th><th>Tipe</th><th>Actual</th></tr></thead><tbody>${d.budget.map(b=>`<tr><td>${esc(b.item)}</td><td>${b.type}</td><td>${IDR(b.actual)}</td></tr>`).join('')}</tbody></table></div>`:''}`;
}

/* ============ INIT ============
   Data datang dari server, jadi boot-nya asinkron. Kalau server tidak bisa
   dihubungi, JANGAN diam-diam jalan dengan data kosong — nanti dikira datanya
   hilang. Tampilkan layar gagal + tombol coba lagi. */
/* Identitas & logo di sidebar — disamakan dengan Marketing/Reservasi.
   Nama diambil dari sesi Office (guard SSO di <head> sudah memastikan sesinya
   ada dan berhak), jadi tidak perlu login terpisah di modul ini. */
function paintSideUser(){
  let s=null; try{ s=JSON.parse(localStorage.getItem('lm_session')||'null'); }catch(_){}
  const nama=(s&&s.name)||'Kru';
  const av=document.getElementById('su-avatar'); if(av)av.textContent=initials(nama);
  const un=document.getElementById('su-un');     if(un)un.textContent=nama;
  const ur=document.getElementById('su-ur');     if(ur)ur.textContent=DB&&DB.role?DB.role:'Kru';
  const lg=document.getElementById('brand-logo');if(lg)lg.src=window.__ICON__;
}
// "Keluar" = kembali ke portal Office. Sesi Office sengaja TIDAK dihapus:
// modul lain memakainya juga, jadi menghapusnya di sini akan memaksa kru
// login ulang hanya karena menutup EMS.
function logout(){ location.replace('../'); }

(async function init(){
  try{
    await load();
    paintSideUser();
    if(!location.hash)location.hash='#/dashboard';
    router();
  }catch(e){
    document.getElementById('content').innerHTML=
      '<div class="card" style="border-color:var(--red);max-width:620px;margin:40px auto">'+
      '<h3 class="sec" style="color:var(--red)">Tidak bisa memuat data</h3>'+
      '<p class="mini">Server EMS tidak merespons, jadi tidak ada yang ditampilkan.<br>'+
      'Data kamu <b>aman di database</b> — ini cuma gagal memuat, bukan data hilang.</p>'+
      '<div class="kv" style="margin-top:12px"><div class="k">Alamat API</div><div class="mini">'+esc(API_URL)+'</div>'+
      '<div class="k">Pesan</div><div class="mini">'+esc(e.message)+'</div></div>'+
      '<div class="modal-actions"><button class="btn" onclick="location.reload()">Coba lagi</button></div></div>';
    document.getElementById('pageTitle').textContent='Gagal memuat';
  }
})();


</script>
