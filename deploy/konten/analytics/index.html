<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Konten Analytics - Laksamana Muda</title>
<link rel="icon" type="image/jpeg" href="../../assets/LaksamanaMudaLogo.jpeg">

<!-- Panel ANALYTICS modul Konten (dulu modul Campaign mandiri di /campaign/,
     dipindah ke sini 13 Okt 2026). Guard SSO: kunci izinnya TETAP `campaign`
     (panel berizin sendiri, pola HPP di Stock). SATU guard saja — guard kedua yang
     menanyakan kunci lain membuat modul terpantul balik tanpa satu pun pesan. -->
<script>
(function(){try{var s=JSON.parse(localStorage.getItem('lm_session')||'null');
  var hidup=s&&s.expiry&&Date.now()<s.expiry;
  var mods=(s&&s.modules)||[];
  var ok=hidup&&(mods.indexOf('*')>-1||mods.indexOf('campaign')>-1);
  if(!ok)location.replace('../../');}catch(e){location.replace('../../');}})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Tema bersama, token kanonik apa adanya. Modul BARU tidak punya blok :root
     sendiri (lihat catatan "Modul BARU" di assets/tema.css). -->
<link rel="stylesheet" href="../../assets/laksamana.css">

<style>
/* ===================================================================
   KONTEN ANALYTICS — kerangka (sidebar, topbar) DISALIN dari panel
   Konten Planning (deploy/konten/planning/), permintaan user 13 Okt 2026:
   "side bar menu tetap harus sama kaya yg modul konten". Kalau kerangka di
   sana diubah, salin ulang ke sini; dua panel satu modul yang sidebarnya
   berbeda terbaca sebagai dua aplikasi.
   Token warna milik modul Konten ditaruh di body (bukan :root) supaya
   tidak menimpa token tema bersama yang dipakai komponen lain.
   =================================================================== */
body{
  --k-line-soft:rgba(60,55,45,.10); --k-line-hard:rgba(60,55,45,.16);
  --k-gold-glow:rgba(169,121,31,.13); --k-txt:#2a2620; --k-txt-2:#5c574d; --k-txt-3:#928c80;
  --k-ink-800:#efedea; --k-ink-750:#e7e4df; --k-panel-3:#f4f2ee;
  --k-sh:0 4px 18px rgba(50,42,28,.06);
  --k-serif:'Plus Jakarta Sans',system-ui,sans-serif; --k-sans:'Inter',system-ui,sans-serif;
  background:#f7f6f4;font-family:var(--k-sans);font-size:14px;line-height:1.55;color:var(--k-txt);-webkit-font-smoothing:antialiased;margin:0}
h1,h2,h3,h4{font-family:var(--k-serif);font-weight:700;letter-spacing:-.02em;line-height:1.2}

#appShell{min-height:100vh}
.shell{display:grid;grid-template-columns:246px 1fr;min-height:100vh}
.sidebar{background:#ffffff;border-right:1px solid var(--k-line-soft);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow:hidden}
.sb-head{padding:18px 18px 14px;display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--k-line-soft)}
.sb-head img{width:38px;height:38px;object-fit:contain;border-radius:9px;flex:none}
.sb-head .t1{font-family:var(--k-serif);font-weight:700;font-size:15px;line-height:1.1;color:var(--k-txt)}
.sb-head .t2{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-top:2px;font-weight:600}
.sb-nav{flex:1;overflow-y:auto;padding:10px 10px 20px}
.sb-group{margin-top:14px}
.sb-group-t{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--k-txt-3);font-weight:700;padding:6px 12px 5px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;color:var(--k-txt-2);font-weight:500;font-size:13px;
  cursor:pointer;transition:.13s;position:relative;text-decoration:none}
.nav-item:hover{background:rgba(60,55,45,.05);color:var(--k-txt)}
.nav-item.active{background:var(--k-gold-glow);color:var(--gold-dim);font-weight:600}
.nav-item.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--gold)}
.nav-item .ic{width:18px;height:18px;flex:0 0 auto;opacity:.9}
.nav-item .badge{margin-left:auto;background:#c9432b;color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;
  border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.nav-mini-btn{margin-left:auto;background:none;border:1px solid var(--k-line-soft);color:var(--k-txt-3);width:30px;height:30px;border-radius:8px;flex:none;cursor:pointer;font-size:15px;display:grid;place-items:center}
.nav-mini-btn:hover{border-color:var(--gold);color:var(--gold)}
@media(max-width:900px){.nav-mini-btn{display:none}}
@media(min-width:901px){
  #appShell.nav-mini .shell{grid-template-columns:64px 1fr}
  #appShell.nav-mini .sb-head .t1,#appShell.nav-mini .sb-head .t2,#appShell.nav-mini .sb-group-t,#appShell.nav-mini .sb-user{display:none}
  #appShell.nav-mini .sb-head{justify-content:center;padding:18px 6px 14px}
  #appShell.nav-mini .nav-mini-btn{margin:0}
  #appShell.nav-mini .nav-item{justify-content:center;gap:0;padding:9px 0}
  #appShell.nav-mini .nav-item span{display:none}
  #appShell.nav-mini .nav-item .badge{position:absolute;top:2px;right:4px}
  #appShell.nav-mini .sb-nav{padding:10px 6px 20px}
}
.sb-foot{padding:12px;border-top:1px solid var(--k-line-soft);display:flex;align-items:center;gap:6px}
.sb-user{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;background:var(--k-ink-800);flex:1;min-width:0}
.sb-user .av{width:34px;height:34px;border-radius:9px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff}
.sb-user .un{font-weight:600;font-size:12.5px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-user .ur{font-size:10px;color:var(--k-txt-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.logout-x{background:var(--k-panel-3);border:1px solid var(--k-line-soft);color:var(--k-txt-3);width:32px;height:32px;border-radius:9px;flex:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.logout-x:hover{border-color:#c9432b;color:#c9432b}

.main{display:flex;flex-direction:column;min-height:100vh;min-width:0}
.topbar{height:64px;border-bottom:1px solid var(--k-line-soft);display:flex;align-items:center;gap:16px;padding:0 24px;
  background:rgba(255,255,255,.82);backdrop-filter:blur(12px);position:sticky;top:0;z-index:30}
.topbar .crumb{font-family:var(--k-serif);font-size:21px;font-weight:800;letter-spacing:-.02em;color:var(--k-txt);line-height:1.2}
.topbar .crumb small{font-family:var(--k-sans);font-size:12px;color:var(--gold-dim);font-weight:600;display:block;margin-top:0}
.topbar .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.burger{display:none;background:#fff;border:1px solid var(--k-line-soft);border-radius:10px;width:38px;height:38px;font-size:16px;cursor:pointer}
.content{padding:24px;flex:1;max-width:1500px;width:100%}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:10px;font-weight:600;font-size:13px;
  border:1px solid transparent;cursor:pointer;transition:.15s;font-family:inherit;background:var(--k-ink-750);color:var(--k-txt)}
.btn-primary{background:linear-gradient(135deg,var(--gold-2),var(--gold-dim));color:#fff;box-shadow:0 3px 12px rgba(122,86,15,.28)}
.btn-primary:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn-ghost{background:var(--k-ink-750);color:var(--k-txt);border-color:var(--k-line-hard)}
.btn-ghost:hover{background:#ddd9d2;border-color:var(--gold)}
.btn-sm{padding:7px 12px;font-size:12.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed;filter:none}
.btn-danger{background:rgba(201,67,43,.12);color:#c9432b;border-color:rgba(229,106,90,.3)}

.kartu{background:#fff;border:1px solid var(--k-line-soft);border-radius:18px;box-shadow:var(--k-sh);padding:20px;margin-bottom:18px}
.kartu h2{font-size:15px;margin-bottom:4px}
.kartu .sub{color:var(--k-txt-3);font-size:12.5px;margin-bottom:14px}
.kepala{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.kepala .r{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.stat{background:#fff;border:1px solid var(--k-line-soft);border-radius:18px;padding:17px 18px;box-shadow:var(--k-sh);position:relative;overflow:hidden}
.stat::after{content:"";position:absolute;right:-20px;top:-20px;width:80px;height:80px;border-radius:50%;background:var(--k-gold-glow);opacity:.5;pointer-events:none}
.stat .l{font-size:11.5px;color:var(--k-txt-3);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.stat .v{font-family:var(--k-serif);font-size:30px;font-weight:600;color:var(--k-txt);margin-top:6px;line-height:1}
.stat .f{font-size:11.5px;color:var(--k-txt-3);margin-top:7px}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;border-radius:6px;padding:3px 8px;letter-spacing:.3px;text-transform:uppercase}
.p-tiktok{background:#111;color:#fff}
.p-instagram{background:linear-gradient(90deg,#d6249f,#fd5949);color:#fff}
.p-youtube{background:#e02b20;color:#fff}
.p-lain{background:var(--paper);color:var(--ink-2);border:1px solid var(--line)}
.st{font-size:11px;font-weight:700;border-radius:20px;padding:2px 9px}
.st-DRAF{background:var(--paper);color:var(--muted);border:1px solid var(--line)}
.st-TERJADWAL{background:var(--info-bg);color:var(--info)}
.st-TAYANG{background:var(--ok-bg);color:var(--ok)}
.st-BATAL{background:var(--danger-bg);color:var(--danger);text-decoration:line-through}

.seg{display:inline-flex;flex-wrap:wrap;background:var(--k-ink-800);border:1px solid var(--k-line-soft);border-radius:9px;padding:3px;gap:2px}
.seg button{background:none;border:none;border-radius:6px;padding:6px 13px;font-size:12px;font-weight:600;color:var(--k-txt-3);cursor:pointer;font-family:inherit}
.seg button.on{background:var(--gold);color:#fff}

.baris{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-soft)}
.baris:last-child{border-bottom:none}
.rinci{margin:0 0 10px 38px;padding:12px 14px;background:var(--info-bg);border-radius:var(--radius-sm)}
.rinci-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.rinci-grid div{background:#fff;border-radius:8px;padding:8px 10px}
.rinci-grid b{display:block;font-size:15px;color:var(--ink)}
.rinci-grid span{font-size:11px;color:var(--muted)}
.rinci-grid i{display:block;font-style:normal;font-size:10.5px;color:var(--muted-2)}
.rinci-grid .kosong-r b{color:var(--muted-2)}
.rinci p{margin:8px 0 0;font-size:12px;color:var(--muted);line-height:1.5}
.baris .no{width:26px;height:26px;border-radius:50%;background:var(--info-bg);color:var(--info);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.baris .isi{flex:1;min-width:0}
.baris .isi b{display:block;font-size:13.5px;color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.baris .isi span{font-size:12px;color:var(--muted-2)}
.baris .ang{text-align:right;flex:none}
.baris .ang b{font-size:15px;color:var(--ink)}
.baris .ang span{display:block;font-size:11px;color:var(--muted-2)}

.akun{border:1px solid var(--k-line-soft);border-radius:14px;padding:14px 16px;background:#fbfaf9;min-height:128px}
.akun .nm{font-weight:700;color:var(--ink);margin:10px 0 2px}
.akun .ket{font-size:12px;color:var(--muted)}
.akun .aksi{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.akun-id{display:flex;align-items:center;gap:10px;margin-top:10px}
.akun-id .nm{margin:0}
.akun-av{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:0 0 40px;background:var(--line)}
.akun-cek{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:#20d5ec;color:#fff;font-size:10px;vertical-align:middle}
.akun-bio{font-size:12px;color:var(--ink);margin:8px 0 0;white-space:pre-line}
.akun-stat{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0 6px;text-align:center}
.akun-stat b{display:block;font-size:15px;color:var(--ink)}
.akun-stat span{font-size:11px;color:var(--muted)}

.ins{border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.ins .t{display:flex;align-items:center;gap:8px;justify-content:space-between}
.ins .kat{font-size:11.5px;color:var(--muted-2)}
.ins .temuan{font-size:13.5px;color:var(--ink);line-height:1.55}
.ins .aksi-ide{background:var(--info-bg);color:var(--info);border-radius:8px;padding:8px 10px;font-size:12.5px}
.ins .met{font-size:12px;color:var(--muted)}
.ins .kaki{display:flex;gap:8px;align-items:center;border-top:1px solid var(--line-soft);padding-top:10px;margin-top:auto;flex-wrap:wrap}
.ins.arsip{opacity:.6}

.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 16px}
.form .full{grid-column:1/-1}
.field input,.field select,.field textarea{padding:9px 12px;font-size:14px}
.field textarea{min-height:76px;resize:vertical}
.field .bantu{font-size:11.5px;color:var(--muted-2);margin-top:4px}

.pita{border-radius:var(--radius-sm);padding:10px 14px;font-size:13px;margin-bottom:14px;line-height:1.5}
.pita.info{background:var(--info-bg);color:var(--ink)}
.pita.warn{background:var(--warn-bg);color:var(--ink)}
.pita.err{background:var(--danger-bg);color:var(--danger)}
.pita.ok{background:var(--ok-bg);color:var(--ok)}
.kosong{text-align:center;color:var(--muted);padding:26px 10px;font-size:13.5px}

/* Kalender */
.kal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--surface)}
.kal .hd{background:var(--paper);font-size:11px;font-weight:700;color:var(--muted);padding:8px 10px;letter-spacing:.5px;border-bottom:1px solid var(--line)}
.kal .sel{min-height:104px;border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);padding:6px 7px;cursor:pointer}
.kal .sel:nth-child(7n){border-right:none}
.kal .sel:hover{background:var(--paper)}
.kal .sel.luar .tg{color:var(--muted-2)}
.kal .sel.hari .tg{background:var(--info);color:#fff;border-radius:50%;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center}
.kal .sel.pilih{outline:2px solid var(--info);outline-offset:-2px}
.kal .tg{font-size:12px;font-weight:600;color:var(--ink)}
.kal .it{font-size:11px;border-left:3px solid var(--info);background:var(--paper);border-radius:4px;padding:2px 6px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kal .it.s-DRAF{border-left-color:var(--muted-2)}
.kal .it.s-TAYANG{border-left-color:var(--ok)}
.kal .it.s-BATAL{border-left-color:var(--danger);text-decoration:line-through;opacity:.6}
.kal .it.telat{border-left-color:var(--danger);background:var(--danger-bg)}
.jd{border:1px solid var(--line);border-left:4px solid var(--info);border-radius:var(--radius-sm);padding:12px 14px;background:var(--surface)}
.jd.s-DRAF{border-left-color:var(--muted-2)}
.jd.s-TAYANG{border-left-color:var(--ok)}
.jd.telat{border-left-color:var(--danger)}
.jd .cap{font-size:12.5px;color:var(--muted);margin-top:6px;white-space:pre-wrap;max-height:84px;overflow:hidden}

/* Modal */
.modal{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(20,16,8,.42);display:flex;align-items:flex-start;justify-content:center;
  padding:40px 16px;z-index:50;overflow-y:auto}
.modal .box{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);width:100%;max-width:760px;padding:20px 22px}
.modal .box h3{font-size:17px;margin-bottom:4px}
.modal .kaki{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}

/* Riset */
.ide{border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;background:var(--surface)}
.ide .hook{background:var(--gold-soft);border-radius:8px;padding:8px 10px;font-size:13px;margin:8px 0;color:var(--ink)}
.ide .cap{font-size:12.5px;color:var(--muted);white-space:pre-wrap}
.agen{display:flex;gap:10px;align-items:center;padding:14px;background:var(--info-bg);border-radius:var(--radius);margin-bottom:14px}
.putar{width:18px;height:18px;border:2.5px solid var(--info);border-top-color:transparent;border-radius:50%;animation:putar 1s linear infinite;flex:none}
@keyframes putar{to{transform:rotate(360deg)}}

.toast{position:fixed;right:18px;bottom:18px;z-index:80;display:flex;flex-direction:column;gap:8px}
.toast div{background:var(--ink);color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;box-shadow:var(--shadow-lg);max-width:380px}
.toast div.err{background:var(--danger)}

@media (max-width:980px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:1fr}
}
@media (max-width:880px){
  .shell{grid-template-columns:1fr}
  .sidebar{position:fixed;left:-280px;top:0;width:260px;z-index:40;transition:left .2s;box-shadow:0 18px 48px rgba(50,42,28,.12)}
  .sidebar.buka{left:0}
  .burger{display:inline-flex;align-items:center;justify-content:center}
  .topbar{padding:0 14px}
  .content{padding:16px 16px 80px}
  .g2,.form{grid-template-columns:1fr}
  .kal .sel{min-height:64px}
  .kal .it{display:none}
  .kal .sel.ada::after{content:"•";color:var(--info);font-weight:800}
}
</style>
</head>
<body>
<div id="appShell">
  <div class="shell">
    <aside class="sidebar" id="side">
      <div class="sb-head">
        <img src="../../assets/laksamanamuda-warna.jpg" alt="LM" onerror="this.style.display='none'">
        <div style="flex:1;min-width:0"><div class="t1">Laksamana Muda</div><div class="t2">Konten</div></div>
        <button class="nav-mini-btn" id="navMini" type="button" title="Sembunyikan / tampilkan menu" aria-label="Sembunyikan menu">&#9776;</button>
      </div>
      <nav class="sb-nav" id="nav"></nav>
      <div class="sb-foot">
        <div class="sb-user"><span class="av" id="uAv">?</span>
          <div style="min-width:0"><div class="un" id="uNama">&mdash;</div><div class="ur" id="uKet">Office</div></div></div>
        <!-- Tidak menghapus lm_session — aturan yang sama dengan panel Konten
             Planning: ikon ini memulangkan ke pemilih modul Office. -->
        <button class="logout-x" id="keluar" type="button" title="Keluar ke Office" aria-label="Keluar ke Office">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v10"/><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/></svg>
        </button>
      </div>
    </aside>
    <div class="main">
      <div class="topbar">
        <button class="burger" id="burger" type="button" aria-label="Menu">&#9776;</button>
        <div class="crumb" id="judul">Insight Konten<small id="judulSub"></small></div>
        <div class="r" id="topAksi"></div>
      </div>
      <div class="content" id="app"><div class="kosong">Memuat…</div></div>
    </div>
  </div>
</div>
<div id="modal"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';

/* ===================== DASAR ===================== */
var API = '../../konten-api-mysql/api.php';

/* TITLES sekaligus daftar halaman yang SAH. Halaman yang tidak punya baris di
   sini memantul ke halaman pertama — pelajaran modul DW: menu yang ada tapi
   judulnya lupa ditulis terbuka sekejap lalu memantul tanpa satu pun galat. */
var TITLES = {
  insight: 'Insight Konten',
  kalender: 'Kalender & Jadwal Posting',
  riset: 'Riset Tren (AI)',
  bank: 'Bank Konten',
  pengaturan: 'Pengaturan'

/* Satu pintu ke server. Token sesi Office ikut di tiap permintaan — seluruh
   aksi Campaign berpagar sesi di backend. */
function api(action, data){
  return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: action, sesi: SESI.token || '', data: data || {} }) })
    .then(function(r){ return r.text(); })
    .then(function(t){
      /* Balasan kosong / halaman HTML biasanya berarti hosting MEMUTUS
         permintaan yang terlalu lama (AI berpikir > batas waktu server) —
         bukan backend yang belum ter-deploy. Dua sebab itu dibedakan. */
      var j; try { j = JSON.parse(t); } catch(e){
        if (!String(t || '').trim() || /timeout|time-out|504|502|503/i.test(t)) throw new Error('Server berhenti menunggu jawaban AI (batas waktu hosting terlewati). Coba lagi dengan topik yang lebih sempit, atau pilih model yang lebih cepat di Pengaturan → AI.');
        throw new Error('Balasan server bukan JSON. Backend Konten mungkin belum ter-deploy.'); }
      if (!j.ok) {
        var e = String(j.error || 'Gagal');
        /* Kodenya dibedakan supaya pesannya menyuruh hal yang benar: sesi
           habis disembuhkan masuk ulang, tanpa modul tidak. */
        if (e.indexOf('sesi_tidak_sah:') === 0) e = e.slice(15).trim();
        else if (e.indexOf('tanpa_modul:') === 0) e = e.slice(12).trim();
        else if (e.indexOf('tidak_berhak:') === 0) e = e.slice(13).trim();
        else if (e.indexOf('Aksi tidak dikenal: campaign') === 0) e = 'Backend modul Campaign belum ter-deploy di server ini.';
        throw new Error(e);
      }
      return j.data;
    });
}

/* Kartu "Contoh pola konten" (4 contoh tetap di kode) DICABUT 14 Okt 2026,
   permintaan user: isinya tidak pernah membaca data brand, dan fungsinya
   sudah digantikan Insight otomatis dari AI yang memang membaca konten

/* ---------- Formulir insight ---------- */
function formInsight(awal){
  awal = awal || {};

  bukaModal('<h3>' + (awal.id ? 'Sunting insight' : 'Catat insight baru') + '</h3>'
    + '<div class="sub" style="color:var(--muted);font-size:13px;margin-bottom:12px">Wajib ada tautan konten asli (https) dan tanggal tayangnya, supaya insight bisa ditelusuri.</div>'
    + '<div class="form">'
    + '<div class="field"><label>Platform</label><select id="f-plat">' + opsiPlat + '</select></div>'
    + '<div class="field"><label>Kategori</label><select id="f-kat">' + opsiKat + '</select></div>'
    + '<div class="field full"><label>Temuan *</label><textarea id="f-temuan" placeholder="Contoh: Hook &quot;Jangan ke Pekanbaru sebelum coba ini&quot; membuat video ditonton sampai habis.">' + esc(awal.temuan || '') + '</textarea></div>'
    + '<div class="field"><label>Tautan konten (https) *</label><input id="f-url" value="' + esc(awal.url || '') + '" placeholder="https://www.tiktok.com/@…"></div>'
    + '<div class="field"><label>Tanggal konten tayang *</label><input id="f-tgl" type="date" value="' + esc(awal.tglTayang || '') + '"></div>'
    + '<div class="field"><label>Metrik (opsional)</label><input id="f-met" value="' + esc(awal.metrik || '') + '" placeholder="21 rb views · 449 likes"></div>'
    + '<div class="field"><label>Rencana aksi (opsional)</label><input id="f-aksi" value="' + esc(awal.aksi || '') + '" placeholder="Misal: pakai hook serupa di minggu pertama"></div>'
    + '</div><div id="f-galat"></div>'
    + '<div class="kaki"><button class="btn btn-ghost" data-a="tutup">Batal</button><button class="btn btn-primary" data-a="ins-simpan">Simpan insight</button></div>');
  MODAL_DATA = { id: awal.id || '', sumber: awal.sumber || 'manual' };
}
var MODAL_DATA = null;
function nilai(id){ var el = document.getElementById(id); return el ? el.value.trim() : ''; }

function simpanInsight(){
  var d = { id: MODAL_DATA.id, sumber: MODAL_DATA.sumber, platform: nilai('f-plat'), kategori: nilai('f-kat'),
    temuan: nilai('f-temuan'), url: nilai('f-url'), tglTayang: nilai('f-tgl'), metrik: nilai('f-met'), aksi: nilai('f-aksi') };
  /* Ditahan di layar dulu supaya sebabnya terbaca sebelum kiriman berangkat;
     server memeriksanya lagi — layar bisa diakali, server tidak. */
  var kurang = [];
  if (!d.temuan) kurang.push('Temuan');
  if (!/^https:\/\/\S+$/i.test(d.url)) kurang.push('Tautan https');
  if (!/^\d{4}-\d{2}-\d{2}$/.test(d.tglTayang)) kurang.push('Tanggal tayang');
  if (kurang.length) { document.getElementById('f-galat').innerHTML = '<div class="pita err">Belum lengkap: ' + esc(kurang.join(', ')) + '.</div>'; return; }
  kirim('campaignInsightSimpan', d, 'Insight tersimpan.');
}

/* Kirim, lalu muat ulang dari server — layar tidak pernah mengaku tersimpan
   sebelum server menjawab. */
function kirim(aksi, data, pesanOk){
  var tbl = document.querySelector('#modal [data-a$="-simpan"]');
  if (tbl) { tbl.disabled = true; tbl.textContent = 'Menyimpan…'; }
  return api(aksi, data).then(function(){
    tutupModal(); toast(pesanOk);
    return muat().then(render);
  }).catch(function(e){
    if (tbl) { tbl.disabled = false; tbl.textContent = 'Simpan'; }
    var g = document.getElementById('f-galat') || document.getElementById('j-galat') || document.getElementById('b-galat');
    if (g) g.innerHTML = '<div class="pita err">' + esc(e.message) + '</div>'; else toast(e.message, true);
  });
}

/* ===================== KALENDER ===================== */
function jadwalTelat(){
  var t = hariIni(), j = jamKini();
  return (D.jadwal || []).filter(function(x){
    return x.status === 'TERJADWAL' && (x.tanggal < t || (x.tanggal === t && x.jam && x.jam <= j));
  });
}
function bulanKini(){ return ST.kalBulan || hariIni().slice(0,7); }

function vKalender(){
  var bln = bulanKini(), th = +bln.slice(0,4), bl = +bln.slice(5,7);
  var awal = new Date(Date.UTC(th, bl-1, 1));
  var geser = (awal.getUTCDay() + 6) % 7;          // Senin = kolom pertama
  var mulai = new Date(Date.UTC(th, bl-1, 1 - geser));
  var per = {};
  (D.jadwal || []).forEach(function(j){ (per[j.tanggal] = per[j.tanggal] || []).push(j); });
  var telatId = {}; jadwalTelat().forEach(function(j){ telatId[j.id] = true; });
  var sel = HARI.map(function(h){ return '<div class="hd">' + h + '</div>'; }).join('');
  var nHari = new Date(Date.UTC(th, bl, 0)).getUTCDate();
  var nSel = Math.ceil((geser + nHari) / 7) * 7;   // 5 atau 6 minggu, tidak pernah baris kosong
  for (var i = 0; i < nSel; i++) {
    var d = new Date(mulai.getTime() + i*864e5), t = d.toISOString().slice(0,10);
    var isi = (per[t] || []).slice().sort(function(a,b){ return String(a.jam).localeCompare(String(b.jam)); });
    var cls = 'sel' + (t.slice(0,7) !== bln ? ' luar' : '') + (t === hariIni() ? ' hari' : '') + (ST.kalPilih === t ? ' pilih' : '') + (isi.length ? ' ada' : '');
    sel += '<div class="' + cls + '" data-a="kal-pilih" data-v="' + t + '"><span class="tg">' + d.getUTCDate() + '</span>'
      + isi.slice(0,3).map(function(j){ return '<div class="it s-' + j.status + (telatId[j.id] ? ' telat' : '') + '" title="' + esc(j.judul) + '">' + (j.jam ? esc(j.jam) + ' ' : '') + esc(j.judul) + '</div>'; }).join('')
      + (isi.length > 3 ? '<div style="font-size:10.5px;color:var(--muted-2);margin-top:2px">+' + (isi.length-3) + ' lagi</div>' : '') + '</div>';
  }
  var telat = jadwalTelat();
  var h = '';
  /* POSTING OTOMATIS BELUM AKTIF, dan itu dikatakan di tempat yang paling
     sering dibuka. Kalender yang diam-diam tidak memposting apa pun akan
     dipercaya sampai satu jadwal promo terlewat. */
  h += '<div class="pita info"><b>Posting otomatis belum aktif.</b> TikTok mewajibkan audit aplikasi untuk Content Posting API, jadi untuk sekarang kalender ini jadi pengingat: '
    + 'saat jamnya tiba, salin caption-nya, posting dari HP, lalu tandai <b>Tayang</b> berikut tautannya.</div>';
  if (telat.length) {
    h += '<div class="kartu" style="border-color:#E7BDB8"><h2>Sudah waktunya diposting (' + telat.length + ')</h2><div class="sub">Terjadwal tapi belum ditandai tayang.</div>'
      + '<div class="grid g2">' + telat.map(kartuJadwal).join('') + '</div></div>';
  }
  h += '<div class="kartu"><div class="kepala"><div><h2>Kalender konten</h2><div class="sub">' + (D.jadwal||[]).filter(function(j){ return j.status !== 'BATAL'; }).length
    + ' konten di kalender. Bawa insight & ide riset ke sini lewat tombol Kalender / Jadwalkan.</div></div>'
    + '<div class="r"><button class="btn btn-primary btn-sm" data-a="jdw-baru">+ Jadwalkan konten</button></div></div>'
    + '<div class="kepala" style="margin-bottom:10px;align-items:center">'
    + '<button class="btn btn-ghost btn-sm" data-a="kal-geser" data-v="-1">←</button>'
    + '<b style="font-size:15px;min-width:140px;text-align:center">' + BULAN[bl-1] + ' ' + th + '</b>'
    + '<button class="btn btn-ghost btn-sm" data-a="kal-geser" data-v="1">→</button>'
    + '<div class="r"><button class="btn btn-ghost btn-sm" data-a="kal-hari">Hari ini</button></div></div>'
    + '<div class="kal">' + sel + '</div>';
  var tp = ST.kalPilih || hariIni();
  var isiHari = (per[tp] || []).slice().sort(function(a,b){ return String(a.jam).localeCompare(String(b.jam)); });
  h += '<div class="kepala" style="margin:16px 0 10px;align-items:center"><b style="color:var(--info)">' + (tp === hariIni() ? 'Hari ini' : fmtTgl(tp)) + '</b>'
    + '<div class="r"><button class="btn btn-ghost btn-sm" data-a="jdw-baru" data-v="' + tp + '">+ Jadwalkan di tanggal ini</button></div></div>'
    + (isiHari.length ? '<div class="grid g2">' + isiHari.map(kartuJadwal).join('') + '</div>' : '<div class="kosong">Belum ada konten di tanggal ini.</div>');
  return h + '</div>';
}

function formJadwal(awal){
  awal = awal || {};

  var opsiSt = STATUS.map(function(s){ return '<option value="' + s + '"' + ((awal.status || 'TERJADWAL') === s ? ' selected' : '') + '>' + STATUS_LBL[s] + '</option>'; }).join('');
  var opsiIns = '<option value="">— tidak terkait —</option>' + (D.insight || []).filter(function(i){ return +i.arsip !== 1 || i.id === awal.insightId; }).map(function(i){
    return '<option value="' + esc(i.id) + '"' + (awal.insightId === i.id ? ' selected' : '') + '>' + esc(platNorm(i.platform) + ' · ' + String(i.temuan).slice(0, 70)) + '</option>'; }).join('');

    + '<div class="form">'
    + '<div class="field"><label>Platform</label><select id="j-plat">' + opsiPlat + '</select></div>'
    + '<div class="field"><label>Status</label><select id="j-st">' + opsiSt + '</select></div>'
    + '<div class="field full"><label>Judul konten *</label><input id="j-judul" value="' + esc(awal.judul || '') + '" placeholder="Teaser DJ malam minggu"></div>'
    + '<div class="field full"><label>Caption</label><textarea id="j-cap" style="min-height:110px">' + esc(awal.caption || '') + '</textarea></div>'
    + '<div class="field"><label>Tanggal tayang *</label><input id="j-tgl" type="date" value="' + esc(awal.tanggal || hariIni()) + '"></div>'
    + '<div class="field"><label>Jam tayang (WIB)</label><input id="j-jam" type="time" value="' + esc(awal.jam || '') + '"></div>'
    + '<div class="field"><label>PIC</label><input id="j-pic" value="' + esc(awal.pic || '') + '" placeholder="Siapa yang memposting"></div>'
    + '<div class="field"><label>Tautan postingan (wajib kalau Tayang)</label><input id="j-tautan" value="' + esc(awal.tautan || '') + '" placeholder="https://…"></div>'
    + '<div class="field full"><label>Dari insight</label><select id="j-ins">' + opsiIns + '</select></div>'
    + '<div class="field full"><label>Catatan</label><input id="j-cat" value="' + esc(awal.catatan || '') + '"></div>'
    + '</div><div id="j-galat"></div>'
    + '<div class="kaki"><button class="btn btn-ghost" data-a="tutup">Batal</button><button class="btn btn-primary" data-a="jdw-simpan">Simpan jadwal</button></div>');
  MODAL_DATA = { id: awal.id || '', bankId: awal.bankId || '' };
}
function simpanJadwal(){
  var d = { id: MODAL_DATA.id, bankId: MODAL_DATA.bankId || '', platform: nilai('j-plat'), status: nilai('j-st'), judul: nilai('j-judul'), caption: document.getElementById('j-cap').value,
    tanggal: nilai('j-tgl'), jam: nilai('j-jam'), pic: nilai('j-pic'), tautan: nilai('j-tautan'), insightId: nilai('j-ins'), catatan: nilai('j-cat') };
  var kurang = [];
  if (!d.judul) kurang.push('Judul');
  if (!/^\d{4}-\d{2}-\d{2}$/.test(d.tanggal)) kurang.push('Tanggal');
  if (d.tautan && !/^https:\/\/\S+$/i.test(d.tautan)) kurang.push('Tautan harus https://');
  if (d.status === 'TAYANG' && !d.tautan) kurang.push('Tautan postingan (status Tayang)');
  if (kurang.length) { document.getElementById('j-galat').innerHTML = '<div class="pita err">Belum lengkap: ' + esc(kurang.join(', ')) + '.</div>'; return; }
  kirim('campaignJadwalSimpan', d, 'Jadwal tersimpan.');
}

  /* Galat riset MENETAP di layar sampai riset berikutnya dijalankan (14 Okt
     2026). Dulu cuma toast 7 detik — sesudah menunggu 1–2 menit orangnya
     sudah tidak menatap layar, dan yang tersisa tombol yang seolah tidak

  h += '</div>';

  var daftar = D.riset || [];

function daftarTeks(arr){ return (arr || []).map(function(x){ return '<li>' + esc(x) + '</li>'; }).join(''); }

    + '<div class="pita warn"><b>Estimasi AI, bukan data pasar.</b> Pola di bawah dibaca dari postingan brand ini; tren dan ide adalah perkiraan AI.</div>'

    h += '<h3 style="font-size:14px;margin:6px 0 10px">Pola dari konten brand</h3><div class="grid g3">' + x.pola.map(function(p){

  }
  if ((x.tren || []).length) {
    h += '<h3 style="font-size:14px;margin:18px 0 10px">Tren</h3><div class="grid g3">' + x.tren.map(function(t){
      return '<div class="ins"><div class="t"><b style="color:var(--ink);font-size:13.5px">' + esc(t.judul) + '</b><span class="kat">' + esc(t.keyakinan ? 'keyakinan ' + t.keyakinan : '') + '</span></div>'
        + '<div class="temuan" style="font-size:13px">' + esc(t.penjelasan) + '</div>' + (t.platform ? '<div class="met">' + esc(t.platform) + '</div>' : '') + '</div>'; }).join('') + '</div>';
  }
  if ((x.ide || []).length) {
    h += '<h3 style="font-size:14px;margin:18px 0 10px">Ide konten</h3><div class="grid g2">' + x.ide.map(function(d, i){

        + (d.alasan ? '<div style="font-size:12px;color:var(--muted-2);margin-top:6px">Kenapa: ' + esc(d.alasan) + '</div>' : '')
        + '<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:10px"><button class="btn btn-ghost btn-sm" data-a="ide-bank" data-r="' + esc(r.id) + '" data-i="' + i + '">＋ Simpan ke Bank</button><button class="btn btn-ghost btn-sm" data-a="ide-jadwal" data-r="' + esc(r.id) + '" data-i="' + i + '">📅 Jadwalkan</button></div></div>';
    }).join('') + '</div>';

  var bawah = '';
  if ((x.waktuTayang || []).length) bawah += '<div class="ins"><b style="font-size:13px;color:var(--ink)">Waktu tayang</b><ul style="margin-left:18px;font-size:13px">' + daftarTeks(x.waktuTayang) + '</ul></div>';
  if ((x.hashtag || []).length) bawah += '<div class="ins"><b style="font-size:13px;color:var(--ink)">Hashtag</b><div style="font-size:13px;color:var(--info)">' + esc((x.hashtag||[]).join(' ')) + '</div></div>';

  if (bawah) h += '<div class="grid g3" style="margin-top:18px">' + bawah + '</div>';
  return h + '</div>';
}

/* ===================== BANK KONTEN ===================== */
/* Content planning (14 Okt 2026, permintaan user). AI menyusun rencana dari

/* ===================== PENGATURAN ===================== */
/* AI = Meta (Muse Spark) saja — Anthropic dicabut 14 Okt 2026. Isi key tidak
   pernah ditampilkan; yang dikirim server cuma "terisi". Daftar dari server
   tetap disaring ke 'meta' supaya PHP lama yang masih memulangkan Anthropic
   tidak memunculkan kotaknya lagi. */
var AI_ISIAN = { meta: { key: 's-aikey-meta', model: 's-model-meta', ph: 'Key dari dev.meta.ai' } };
function kartuAI(s){
  var daftar = (s.ai || []).filter(function(x){ return AI_ISIAN[x.id]; });
  var blok = daftar.map(function(x){
    var f = AI_ISIAN[x.id] || {};
    return '<div><b style="font-size:13px">' + esc(x.label) + '</b>'
      + (x.dariConfig ? '<div class="pita info" style="margin-top:8px">API key dikunci di config.php server; isian key di bawah tidak dipakai.</div>' : '')
      + '<div class="form" style="margin-top:8px"><div class="field"><label>API key ' + (x.siap ? '<span class="pill">terisi</span>' : '') + '</label>'
      + '<input id="' + f.key + '" type="password" autocomplete="off" placeholder="' + (x.siap ? 'Kosongkan = tidak diubah. Ketik HAPUS untuk menghapus.' : esc(f.ph || '')) + '"></div>'
      + '<div class="field"><label>Model</label><select id="' + f.model + '">'
      + (x.model || []).map(function(m){ return '<option' + (m === x.modelPakai ? ' selected' : '') + '>' + esc(m) + '</option>'; }).join('')
      + '</select>'
      + (x.id === 'meta' ? '<div class="bantu">Model berakhiran <b>-contributor</b> jauh lebih murah karena Meta <b>boleh memakai data yang dikirim (judul & angka postingan, profil brand, topik riset) untuk melatih modelnya</b>. Pilih tanpa -contributor kalau itu tidak boleh — butuh key dengan akses standar.</div>' : '')
      + '</div></div></div>';
  }).join('');
  return '<div class="kartu"><h2>AI</h2><div class="sub">Dipakai Insight otomatis & Riset Tren. Isi key tidak pernah ditampilkan lagi sesudah disimpan.</div>' + blok + '</div>';
}
/* Kategori pola insight: satu baris satu kategori. Teks bebas, bukan daftar
   tombol — menambah/menghapus/mengurutkan cukup menyunting barisnya. */
function kartuKategori(s){
  var k = (s.kategori && s.kategori.length) ? s.kategori : KATEGORI_BAWAAN;
  return '<div class="kartu"><h2>Kategori pola insight</h2><div class="sub">Pilihan kategori di formulir Catat insight & penyaring, sekaligus daftar yang dipakai AI saat <b>Temukan insight</b>. Satu baris satu kategori, maksimal 20, tiap kategori maksimal 60 huruf.</div>'
    + '<div class="field"><textarea id="s-kategori" style="min-height:150px">' + esc(k.join('\n')) + '</textarea>'
    + '<div class="bantu">Insight lama yang kategorinya dihapus dari daftar ini <b>tidak diubah</b> — ia tetap tampil, ditandai <i>(lama)</i>.</div></div></div>';
}
function vPengaturan(){
  var s = D.setting || {};
  return '<div class="kartu"><h2>Profil brand</h2><div class="sub">Dipakai AI sebagai konteks setiap riset & analisa insight.</div>'
    + '<div class="field"><textarea id="s-profil" style="min-height:96px">' + esc(s.profil || '') + '</textarea></div></div>'
    + kartuKategori(s)
    + kartuAI(s)
    + '<div class="kartu"><h2>TikTok</h2><div class="sub">Dari TikTok for Developers: buat app, aktifkan <b>Login Kit</b> + scope <b>' + esc(String(s.tiktokScope || '').split(',').join(', ')) + '</b> — harus sama persis dengan yang dicentang di app.</div>'
    + '<div class="pita info">Daftarkan alamat ini di Login Kit → Redirect URI (dev & produksi masing-masing punya alamat sendiri):<br><b class="mono">' + esc(s.redirectUri || '') + '</b></div>'
    + (s.tiktokDariConfig ? '<div class="pita info">Client key dikunci di config.php server.</div>' : '')
    + '<div class="form"><div class="field"><label>Client key ' + (s.tiktokSiap ? '<span class="pill">terisi</span>' : '') + '</label><input id="s-ttkey" type="password" autocomplete="off" placeholder="Kosongkan = tidak diubah"></div>'
    + '<div class="field"><label>Client secret</label><input id="s-ttsecret" type="password" autocomplete="off" placeholder="Kosongkan = tidak diubah"></div></div></div>'
    + '<div id="s-galat"></div><div style="display:flex;justify-content:flex-end"><button class="btn btn-primary" data-a="set-simpan">Simpan pengaturan</button></div>';
}

/* ===================== MODAL ===================== */
function bukaModal(html){ document.getElementById('modal').innerHTML = '<div class="modal" data-a="latar"><div class="box">' + html + '</div></div>'; }
function tutupModal(){ document.getElementById('modal').innerHTML = ''; MODAL_DATA = null; }

/* ===================== AKSI ===================== */
function tiktokSync(diam){
  ST.sibuk.sync = true; if (!diam) render();
  return api('campaignTiktokSync').then(function(r){
    if (!diam) toast(r.jumlah + ' video TikTok diperbarui' + (r.riwayatSelesai ? ' — riwayat lengkap (' + r.total + ' video).' : ' — riwayat masih berlanjut (' + r.total + ' video sejauh ini).'));
  }).catch(function(e){ if (!diam) toast(e.message, true); })
    .then(function(){ ST.sibuk.sync = false; ST.topSrv = {}; return muat(); }).then(render);
}

document.addEventListener('click', function(ev){
  var el = ev.target.closest('[data-a]'); if (!el) return;
  var a = el.getAttribute('data-a'), v = el.getAttribute('data-v'), i = +el.getAttribute('data-i');
  if (a === 'latar') { if (ev.target === el) tutupModal(); return; }
  if (el.tagName === 'A' && a !== 'tutup') return;
  if (a === 'tutup') { tutupModal(); return; }
  if (a === 'top-plat') { ST.topPlat = v; ST.topHal = 1; render(); return; }
  if (a === 'top-urut') { ST.topUrut = v; ST.topHal = 1; render(); return; }
  if (a === 'top-hal') { ST.topHal = +v; render(); return; }
  if (a === 'top-rentang') { ST.topRentang = v; ST.topHal = 1; render(); return; }
  if (a === 'top-rinci') {
    var hb = ST.topSrv[topKunci()], eb = hb && hb.data && hb.data.baris ? hb.data.baris[i] : null; if (!eb) return;
    var kb = topKunciBaris(eb); ST.topBuka = ST.topBuka === kb ? '' : kb; render(); return;
  }
  if (a === 'top-ulang') { delete ST.topSrv[topKunci()]; render(); return; }
  if (a === 'ins-plat') { ST.insPlat = v; render(); return; }
  if (a === 'ins-arsip') { ST.insArsip = !ST.insArsip; render(); return; }
  if (a === 'ins-baru') { formInsight({}); return; }
  if (a === 'jadikan') {
    var hs = ST.topSrv[topKunci()], e = hs && hs.data && hs.data.baris ? hs.data.baris[i] : null; if (!e) return;
    formInsight({ platform: e.platform, url: e.url, tglTayang: e.tanggal, metrik: metrikTeks(e), sumber: e.sumber === 'tiktok' ? 'tiktok' : 'konten' });
    return;
  }
  if (a === 'usulan-pakai') { var u = ST.usulan[i]; formInsight({ platform: u.platform, kategori: u.kategori, temuan: u.temuan, url: u.url, tglTayang: u.tglTayang, metrik: u.metrik, aksi: u.aksi, sumber: 'ai' }); return; }
  if (a === 'ins-simpan') { simpanInsight(); return; }
  if (a === 'ins-ubah') { var x = D.insight[i]; formInsight({ id: x.id, platform: x.platform, kategori: x.kategori, temuan: x.temuan, url: x.url, tglTayang: x.tgl_tayang, metrik: x.metrik, aksi: x.aksi, sumber: x.sumber }); return; }
  if (a === 'ins-kal') { var y = D.insight[i]; formJadwal({ platform: platNorm(y.platform), judul: y.aksi || '', catatan: y.temuan, insightId: y.id, status: 'DRAF' }); return; }
  if (a === 'ins-arsipkan') {
    var z = D.insight[i];
    api('campaignInsightArsip', { id: z.id, arsip: +z.arsip !== 1 }).then(function(){ toast(+z.arsip === 1 ? 'Insight dipulihkan.' : 'Insight diarsipkan.'); return muat(); })
      .catch(function(e){ toast(e.message, true); }).then(render);
    return;
  }
  if (a === 'usulan') {
    ST.usulanJalan = true; ST.usulan = null; render();
    api('campaignInsightAI').then(function(r){ ST.usulan = r.usulan || []; }).catch(function(e){ toast(e.message, true); })
      .then(function(){ ST.usulanJalan = false; render(); });
    return;
  }
  if (a === 'tt-hubung') {
    api('campaignTiktokMulai').then(function(r){ location.href = r.url; }).catch(function(e){ toast(e.message, true); });
    return;
  }
  if (a === 'tt-sync') { tiktokSync(false); return; }
  if (a === 'tt-putus') {
    if (!confirm('Putuskan akun TikTok? Postingan yang sudah ditarik tetap tersimpan; sinkron otomatis berhenti sampai dihubungkan lagi.')) return;
    api('campaignTiktokPutus').then(function(){ toast('Akun TikTok diputus.'); return muat(); }).catch(function(e){ toast(e.message, true); }).then(render);
    return;
  }
  /* Kalender */
  if (a === 'kal-geser') {
    var b = bulanKini(), th = +b.slice(0,4), bl = +b.slice(5,7) + (+v);
    if (bl < 1) { bl = 12; th--; } if (bl > 12) { bl = 1; th++; }
    ST.kalBulan = th + '-' + (bl < 10 ? '0' : '') + bl; render(); return;
  }
  if (a === 'kal-hari') { ST.kalBulan = null; ST.kalPilih = hariIni(); render(); return; }
  if (a === 'kal-pilih') { ST.kalPilih = v; render(); return; }
  if (a === 'jdw-baru') { formJadwal({ tanggal: v || ST.kalPilih || hariIni() }); return; }
  if (a === 'jdw-ubah') { var j = D.jadwal[i]; formJadwal({ id: j.id, platform: j.platform, status: j.status, judul: j.judul, caption: j.caption, tanggal: j.tanggal, jam: j.jam, pic: j.pic, tautan: j.tautan, insightId: j.insight_id, catatan: j.catatan }); return; }
  if (a === 'jdw-simpan') { simpanJadwal(); return; }
  if (a === 'jdw-salin') {
    var cap = D.jadwal[i].caption || '';
    (navigator.clipboard ? navigator.clipboard.writeText(cap) : Promise.reject()).then(function(){ toast('Caption disalin.'); })
      .catch(function(){ toast('Tidak bisa menyalin otomatis. Blok caption-nya lalu salin manual.', true); });
    return;
  }
  /* Riset */
  if (a === 'riset-jalan') {
    var d = { topik: nilai('r-topik'), platform: nilai('r-plat'), catatan: nilai('r-cat') };
    if (!d.topik) { toast('Isi topik risetnya dulu.', true); return; }
    /* Isian disimpan di luar DOM: render() total, dan topik yang hilang
       sesudah riset gagal berarti mengetik ulang untuk mencoba lagi. */
    ST.risetIsi = d; ST.risetGalat = ''; ST.risetJalan = true; render();
    api('campaignRiset', d).then(function(r){ ST.risetPilih = r.id; ST.risetIsi = null; toast('Riset selesai.'); return muat(); })
      .catch(function(e){ ST.risetGalat = e.message || 'Gagal tanpa keterangan'; toast(e.message, true); }).then(function(){ ST.risetJalan = false; render(); });
    return;
  }
  if (a === 'riset-pilih') { ST.risetPilih = v; render(); return; }
  if (a === 'ide-bank') {
    var rb = (D.riset || []).filter(function(r){ return r.id === el.getAttribute('data-r'); })[0];
    var ib = rb && rb.hasil && rb.hasil.ide ? rb.hasil.ide[i] : null; if (!ib) return;
    el.disabled = true;
    api('campaignBankSimpan', { sumber: 'riset', batch: rb.id, judul: ib.judul, platform: platNorm(ib.platform), format: ib.format || '',
      hook: ib.hook || '', caption: ib.caption || '', alasan: (ib.alasan || '') + (ib.hari ? ' (saran tayang: ' + ib.hari + ')' : '') })
      .then(function(){ toast('Ide disimpan ke Bank Konten.'); el.textContent = '✓ Di Bank'; return muat(); })
      .catch(function(e){ el.disabled = false; toast(e.message, true); });
    return;
  }
  /* Bank Konten */
  if (a === 'bank-st') { ST.bankSt = v; render(); return; }
  if (a === 'bank-plat') { ST.bankPlat = v; render(); return; }
  if (a === 'bank-tambah') { formBank(); return; }
  if (a === 'bank-simpan') { simpanBank(); return; }
  if (a === 'bank-ubah') { var bu = (D.bank || [])[i]; if (bu) formBank(bu); return; }
  if (a === 'bank-jadwal') {
    var bj = (D.bank || [])[i]; if (!bj) return;
    formJadwal({ platform: platNorm(bj.platform), judul: bj.judul, caption: (bj.hook ? 'Hook: ' + bj.hook + '\n\n' : '') + (bj.caption || ''),
      tanggal: bj.tanggal || '', jam: bj.jam || '', status: 'TERJADWAL', catatan: 'Dari Bank Konten' + (bj.pilar ? ' · ' + bj.pilar : ''), bankId: bj.id });
    return;
  }
  if (a === 'bank-arsip' || a === 'bank-pulih') {
    var ba = (D.bank || [])[i]; if (!ba) return;
    el.disabled = true;
    api('campaignBankArsip', { id: ba.id, arsip: a === 'bank-arsip' }).then(function(){ toast(a === 'bank-arsip' ? 'Ide diarsipkan.' : 'Ide dipulihkan.'); return muat(); })
      .catch(function(e){ toast(e.message, true); }).then(render);
    return;
  }
  if (a === 'bank-jalan') {
    var bd = { dari: nilai('b-dari'), sampai: nilai('b-sampai'), platform: nilai('b-plat'), jumlah: nilai('b-jml'), fokus: nilai('b-fokus') };
    if (!/^\d{4}-\d{2}-\d{2}$/.test(bd.dari) || !/^\d{4}-\d{2}-\d{2}$/.test(bd.sampai)) { ST.bankIsi = bd; ST.bankGalat = 'Rentang tanggal wajib diisi.'; render(); return; }
    if (bd.sampai < bd.dari) { ST.bankIsi = bd; ST.bankGalat = 'Tanggal akhir tidak boleh sebelum tanggal awal.'; render(); return; }
    ST.bankIsi = bd; ST.bankGalat = ''; ST.bankHasil = null; ST.bankJalan = true; render();
    api('campaignBankGenerate', bd).then(function(r){ ST.bankHasil = r; ST.bankSt = 'IDE'; toast(r.jumlah + ' ide masuk ke Bank Konten.'); return muat(); })
      .catch(function(e){ ST.bankGalat = e.message || 'Gagal tanpa keterangan'; toast(e.message, true); }).then(function(){ ST.bankJalan = false; render(); });
    return;
  }
  if (a === 'ide-jadwal') {
    var rr = (D.riset || []).filter(function(r){ return r.id === el.getAttribute('data-r'); })[0];
    var ide = rr && rr.hasil && rr.hasil.ide ? rr.hasil.ide[i] : null; if (!ide) return;
    formJadwal({ platform: platNorm(ide.platform), judul: ide.judul, caption: (ide.hook ? 'Hook: ' + ide.hook + '\n\n' : '') + (ide.caption || ''), status: 'DRAF', catatan: 'Dari riset: ' + rr.topik });
    return;
  }
  /* Pengaturan */
  if (a === 'set-simpan') {
    var kat = document.getElementById('s-kategori').value.split('\n').map(function(x){ return x.trim(); }).filter(Boolean);
    if (!kat.length) { document.getElementById('s-galat').innerHTML = '<div class="pita err">Kategori pola minimal satu.</div>'; return; }
    var s = { profil: document.getElementById('s-profil').value, kategori: kat,
      aiKeyMeta: nilai('s-aikey-meta'), aiModelMeta: nilai('s-model-meta'),
      tiktokKey: nilai('s-ttkey'), tiktokSecret: nilai('s-ttsecret') };
    el.disabled = true;
    api('campaignSetting', s).then(function(){ toast('Pengaturan tersimpan.'); return muat(); })
      .catch(function(e){ document.getElementById('s-galat').innerHTML = '<div class="pita err">' + esc(e.message) + '</div>'; })
      .then(function(){ el.disabled = false; render(); });
    return;
  }
});
document.addEventListener('change', function(ev){
  var el = ev.target; if (el.getAttribute('data-a') === 'ins-kat') { ST.insKat = el.value; render(); }
  if (el.getAttribute('data-a') === 'top-dari') { ST.topDari = el.value; ST.topHal = 1; render(); }
  if (el.getAttribute('data-a') === 'top-sampai') { ST.topSampai = el.value; ST.topHal = 1; render(); }
});
document.addEventListener('keydown', function(ev){ if (ev.key === 'Escape' && MODAL_DATA) tutupModal(); });

/* ===================== BOOT ===================== */
(function(){
  var nama = (SESI.name || SESI.username || '').trim();
  document.getElementById('uNama').textContent = nama || 'Tidak dikenal';
  document.getElementById('uKet').textContent = (SESI.keterangan || '').trim() || 'Office';
  var av = document.getElementById('uAv');
  av.textContent = nama ? nama.split(/\s+/).slice(0, 2).map(function(w){ return w[0]; }).join('').toUpperCase() : '?';
  /* Warna avatar dari nama — rumus yang sama dengan avColor() panel Konten
     Planning, supaya orang yang sama berwarna sama di kedua panel. */
  var h = 0; for (var i = 0; i < nama.length; i++) h = nama.charCodeAt(i) + ((h << 5) - h);
  av.style.background = 'hsl(' + (Math.abs(h) % 360) + ',45%,46%)';
  var shell = document.getElementById('appShell');
  try { if (localStorage.getItem('lm_konten_navmini') === '1') shell.classList.add('nav-mini'); } catch(e) {}
  document.getElementById('navMini').addEventListener('click', function(){
    var mini = !shell.classList.contains('nav-mini'); shell.classList.toggle('nav-mini', mini);
    try { localStorage.setItem('lm_konten_navmini', mini ? '1' : '0'); } catch(e) {}
  });
  document.getElementById('keluar').addEventListener('click', function(){ location.href = '../../'; });
  document.getElementById('burger').addEventListener('click', function(){ document.getElementById('side').classList.toggle('buka'); });
  document.getElementById('nav').addEventListener('click', function(){ document.getElementById('side').classList.remove('buka'); });
})();
window.addEventListener('hashchange', terapkanHash);
terapkanHash();
muat().then(function(){
  terapkanHash();
  /* AUTO AMBIL INSIGHT: akun yang terhubung disinkronkan sendiri kalau
     terakhir ditarik lebih dari 6 jam lalu. Bukan cron — hosting ini tidak
     punya penjadwal yang bisa diandalkan — jadi ia berjalan saat halaman
     dibuka, diam-diam, dan galatnya disimpan server di kartu akunnya. */
  var tt = akun('tiktok');
  if (tt && tt.terhubung && (Date.now() - num(tt.sync_at)) > 6 * 3600e3) tiktokSync(true);
});

/* Kait uji (tools/uji-campaign.js). */
window.__cg = { get D(){ return D; }, set D(v){ D = v; }, ST: ST, render: render, topRentang: topRentang, topKunci: topKunci, jadwalTelat: jadwalTelat, TITLES: TITLES, muat: muat };
})();
</script>
