<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Konten Analytics - Laksamana Muda</title>
<link rel="icon" type="image/jpeg" href="../../assets/LaksamanaMudaLogo.jpeg">

<!-- Panel ANALYTICS modul Konten (dulu modul Campaign mandiri di /campaign/,
     dipindah ke sini 13 Okt 2026). Guard SSO: kunci izinnya TETAP `campaign`
     (panel berizin sendiri, pola HPP di Stock). SATU guard saja — guard kedua yang
     menanyakan kunci lain membuat modul terpantul balik tanpa satu pun pesan. -->
<script>
(function(){try{var s=JSON.parse(localStorage.getItem('lm_session')||'null');
  var hidup=s&&s.expiry&&Date.now()<s.expiry;
  var mods=(s&&s.modules)||[];
  var ok=hidup&&(mods.indexOf('*')>-1||mods.indexOf('campaign')>-1);
  if(!ok)location.replace('../../');}catch(e){location.replace('../../');}})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Tema bersama, token kanonik apa adanya. Modul BARU tidak punya blok :root
     sendiri (lihat catatan "Modul BARU" di assets/tema.css). -->
<link rel="stylesheet" href="../../assets/laksamana.css">

<style>
/* ===================================================================
   KONTEN ANALYTICS — kerangka (sidebar, topbar) DISALIN dari panel
   Konten Planning (deploy/konten/planning/), permintaan user 13 Okt 2026:
   "side bar menu tetap harus sama kaya yg modul konten". Kalau kerangka di
   sana diubah, salin ulang ke sini; dua panel satu modul yang sidebarnya
   berbeda terbaca sebagai dua aplikasi.
   Token warna milik modul Konten ditaruh di body (bukan :root) supaya
   tidak menimpa token tema bersama yang dipakai komponen lain.
   =================================================================== */
body{
  --k-line-soft:rgba(60,55,45,.10); --k-line-hard:rgba(60,55,45,.16);
  --k-gold-glow:rgba(169,121,31,.13); --k-txt:#2a2620; --k-txt-2:#5c574d; --k-txt-3:#928c80;
  --k-ink-800:#efedea; --k-ink-750:#e7e4df; --k-panel-3:#f4f2ee;
  --k-sh:0 4px 18px rgba(50,42,28,.06);
  --k-serif:'Plus Jakarta Sans',system-ui,sans-serif; --k-sans:'Inter',system-ui,sans-serif;
  background:#f7f6f4;font-family:var(--k-sans);font-size:14px;line-height:1.55;color:var(--k-txt);-webkit-font-smoothing:antialiased;margin:0}
h1,h2,h3,h4{font-family:var(--k-serif);font-weight:700;letter-spacing:-.02em;line-height:1.2}

#appShell{min-height:100vh}
.shell{display:grid;grid-template-columns:246px 1fr;min-height:100vh}
.sidebar{background:#ffffff;border-right:1px solid var(--k-line-soft);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow:hidden}
.sb-head{padding:18px 18px 14px;display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--k-line-soft)}
.sb-head img{width:38px;height:38px;object-fit:contain;border-radius:9px;flex:none}
.sb-head .t1{font-family:var(--k-serif);font-weight:700;font-size:15px;line-height:1.1;color:var(--k-txt)}
.sb-head .t2{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-top:2px;font-weight:600}
.sb-nav{flex:1;overflow-y:auto;padding:10px 10px 20px}
.sb-group{margin-top:14px}
.sb-group-t{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--k-txt-3);font-weight:700;padding:6px 12px 5px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;color:var(--k-txt-2);font-weight:500;font-size:13px;
  cursor:pointer;transition:.13s;position:relative;text-decoration:none}
.nav-item:hover{background:rgba(60,55,45,.05);color:var(--k-txt)}
.nav-item.active{background:var(--k-gold-glow);color:var(--gold-dim);font-weight:600}
.nav-item.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--gold)}
.nav-item .ic{width:18px;height:18px;flex:0 0 auto;opacity:.9}
.nav-item .badge{margin-left:auto;background:#c9432b;color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;
  border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 5px}
.nav-mini-btn{margin-left:auto;background:none;border:1px solid var(--k-line-soft);color:var(--k-txt-3);width:30px;height:30px;border-radius:8px;flex:none;cursor:pointer;font-size:15px;display:grid;place-items:center}
.nav-mini-btn:hover{border-color:var(--gold);color:var(--gold)}
@media(max-width:900px){.nav-mini-btn{display:none}}
@media(min-width:901px){
  #appShell.nav-mini .shell{grid-template-columns:64px 1fr}
  #appShell.nav-mini .sb-head .t1,#appShell.nav-mini .sb-head .t2,#appShell.nav-mini .sb-group-t,#appShell.nav-mini .sb-user{display:none}
  #appShell.nav-mini .sb-head{justify-content:center;padding:18px 6px 14px}
  #appShell.nav-mini .nav-mini-btn{margin:0}
  #appShell.nav-mini .nav-item{justify-content:center;gap:0;padding:9px 0}
  #appShell.nav-mini .nav-item span{display:none}
  #appShell.nav-mini .nav-item .badge{position:absolute;top:2px;right:4px}
  #appShell.nav-mini .sb-nav{padding:10px 6px 20px}
}
.sb-foot{padding:12px;border-top:1px solid var(--k-line-soft);display:flex;align-items:center;gap:6px}
.sb-user{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;background:var(--k-ink-800);flex:1;min-width:0}
.sb-user .av{width:34px;height:34px;border-radius:9px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff}
.sb-user .un{font-weight:600;font-size:12.5px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-user .ur{font-size:10px;color:var(--k-txt-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.logout-x{background:var(--k-panel-3);border:1px solid var(--k-line-soft);color:var(--k-txt-3);width:32px;height:32px;border-radius:9px;flex:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.logout-x:hover{border-color:#c9432b;color:#c9432b}

.main{display:flex;flex-direction:column;min-height:100vh;min-width:0}
.topbar{height:64px;border-bottom:1px solid var(--k-line-soft);display:flex;align-items:center;gap:16px;padding:0 24px;
  background:rgba(255,255,255,.82);backdrop-filter:blur(12px);position:sticky;top:0;z-index:30}
.topbar .crumb{font-family:var(--k-serif);font-size:21px;font-weight:800;letter-spacing:-.02em;color:var(--k-txt);line-height:1.2}
.topbar .crumb small{font-family:var(--k-sans);font-size:12px;color:var(--gold-dim);font-weight:600;display:block;margin-top:0}
.topbar .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.burger{display:none;background:#fff;border:1px solid var(--k-line-soft);border-radius:10px;width:38px;height:38px;font-size:16px;cursor:pointer}
.content{padding:24px;flex:1;max-width:1500px;width:100%}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:10px;font-weight:600;font-size:13px;
  border:1px solid transparent;cursor:pointer;transition:.15s;font-family:inherit;background:var(--k-ink-750);color:var(--k-txt)}
.btn-primary{background:linear-gradient(135deg,var(--gold-2),var(--gold-dim));color:#fff;box-shadow:0 3px 12px rgba(122,86,15,.28)}
.btn-primary:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn-ghost{background:var(--k-ink-750);color:var(--k-txt);border-color:var(--k-line-hard)}
.btn-ghost:hover{background:#ddd9d2;border-color:var(--gold)}
.btn-sm{padding:7px 12px;font-size:12.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed;filter:none}
.btn-danger{background:rgba(201,67,43,.12);color:#c9432b;border-color:rgba(229,106,90,.3)}

.kartu{background:#fff;border:1px solid var(--k-line-soft);border-radius:18px;box-shadow:var(--k-sh);padding:20px;margin-bottom:18px}
.kartu h2{font-size:15px;margin-bottom:4px}
.kartu .sub{color:var(--k-txt-3);font-size:12.5px;margin-bottom:14px}
.kepala{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.kepala .r{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.stat{background:#fff;border:1px solid var(--k-line-soft);border-radius:18px;padding:17px 18px;box-shadow:var(--k-sh);position:relative;overflow:hidden}
.stat::after{content:"";position:absolute;right:-20px;top:-20px;width:80px;height:80px;border-radius:50%;background:var(--k-gold-glow);opacity:.5;pointer-events:none}
.stat .l{font-size:11.5px;color:var(--k-txt-3);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.stat .v{font-family:var(--k-serif);font-size:30px;font-weight:600;color:var(--k-txt);margin-top:6px;line-height:1}
.stat .f{font-size:11.5px;color:var(--k-txt-3);margin-top:7px}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;border-radius:6px;padding:3px 8px;letter-spacing:.3px;text-transform:uppercase}
.p-tiktok{background:#111;color:#fff}
.p-instagram{background:linear-gradient(90deg,#d6249f,#fd5949);color:#fff}
.p-youtube{background:#e02b20;color:#fff}
.p-lain{background:var(--paper);color:var(--ink-2);border:1px solid var(--line)}
.st{font-size:11px;font-weight:700;border-radius:20px;padding:2px 9px}
.st-DRAF{background:var(--paper);color:var(--muted);border:1px solid var(--line)}
.st-TERJADWAL{background:var(--info-bg);color:var(--info)}
.st-TAYANG{background:var(--ok-bg);color:var(--ok)}
.st-BATAL{background:var(--danger-bg);color:var(--danger);text-decoration:line-through}

.seg{display:inline-flex;flex-wrap:wrap;background:var(--k-ink-800);border:1px solid var(--k-line-soft);border-radius:9px;padding:3px;gap:2px}
.seg button{background:none;border:none;border-radius:6px;padding:6px 13px;font-size:12px;font-weight:600;color:var(--k-txt-3);cursor:pointer;font-family:inherit}
.seg button.on{background:var(--gold);color:#fff}

.baris{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-soft)}
.baris:last-child{border-bottom:none}
.rinci{margin:0 0 10px 38px;padding:12px 14px;background:var(--info-bg);border-radius:var(--radius-sm)}
.rinci-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.rinci-grid div{background:#fff;border-radius:8px;padding:8px 10px}
.rinci-grid b{display:block;font-size:15px;color:var(--ink)}
.rinci-grid span{font-size:11px;color:var(--muted)}
.rinci-grid i{display:block;font-style:normal;font-size:10.5px;color:var(--muted-2)}
.rinci-grid .kosong-r b{color:var(--muted-2)}
.rinci p{margin:8px 0 0;font-size:12px;color:var(--muted);line-height:1.5}
.baris .no{width:26px;height:26px;border-radius:50%;background:var(--info-bg);color:var(--info);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.baris .isi{flex:1;min-width:0}
.baris .isi b{display:block;font-size:13.5px;color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.baris .isi span{font-size:12px;color:var(--muted-2)}
.baris .ang{text-align:right;flex:none}
.baris .ang b{font-size:15px;color:var(--ink)}
.baris .ang span{display:block;font-size:11px;color:var(--muted-2)}

.tbl-ik{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl-ik th{text-align:left;font-size:11px;color:var(--muted);font-weight:600;padding:8px 6px;border-bottom:1px solid var(--k-line-soft);white-space:nowrap}
.tbl-ik td{padding:8px 6px;border-bottom:1px solid var(--k-line-soft);vertical-align:middle}
.tbl-ik td.n{text-align:right;white-space:nowrap}
.tbl-ik img{width:40px;height:40px;object-fit:cover;border-radius:6px;background:var(--line)}
.naik{color:var(--ok);font-weight:700}.turun{color:var(--danger);font-weight:700}
.grafik{display:flex;align-items:flex-end;gap:2px;height:120px;padding:6px 0;border-bottom:1px solid var(--k-line-soft)}
.grafik div{flex:1;background:#c9b48a;border-radius:3px 3px 0 0;min-height:1px}
.grafik div.ik{background:var(--gold)}
.nilai{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap}
.nilai.works{background:var(--ok-bg);color:var(--ok)}
.nilai.wajar{background:var(--info-bg);color:var(--info)}
.nilai.tidak{background:var(--danger-bg);color:var(--danger)}
.nilai.kecil{background:#f1efec;color:var(--muted)}
/* Google Review (17 Okt 2026) */
.gr-item{border:1px solid var(--k-line-soft);border-radius:14px;padding:14px 16px;margin-bottom:10px;background:#fff}
.gr-item.segera{border-left:4px solid var(--danger)}
.gr-item.tinggi{border-left:4px solid #e08a1e}
.gr-kepala{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.gr-kepala .nm{font-weight:700;color:var(--ink)}
.gr-kepala .r{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.gr-av{width:34px;height:34px;border-radius:50%;object-fit:cover;flex:0 0 34px;background:var(--line);display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:13px}
.bintang{color:#e8a317;letter-spacing:1px;font-size:14px;white-space:nowrap}
.bintang i{color:#d9d5ce;font-style:normal}
.gr-teks{white-space:pre-wrap;font-size:13.5px;line-height:1.55;margin:10px 0 6px;color:var(--ink)}
.gr-balasan{background:#f7f5f1;border-radius:10px;padding:10px 12px;font-size:13px;margin-top:8px;white-space:pre-wrap}
.gr-balasan b{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px;white-space:normal}
.gr-ai{background:var(--warn-bg);border-radius:10px;padding:9px 12px;font-size:12.5px;margin-top:8px;line-height:1.5}
.gr-aksi{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.gr-kotak{margin-top:10px;border-top:1px dashed var(--k-line-soft);padding-top:10px}
.gr-kotak textarea{width:100%;min-height:110px;padding:10px 12px;font-size:13.5px;border:1px solid var(--k-line-hard);border-radius:10px;font-family:inherit;resize:vertical}
.prio{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap}
.prio.segera{background:var(--danger-bg);color:var(--danger)}
.prio.tinggi{background:#fdebd3;color:#a85d06}
.prio.sedang{background:var(--info-bg);color:var(--info)}
.prio.ok{background:var(--ok-bg);color:var(--ok)}
.gr-dist{display:grid;grid-template-columns:44px 1fr 44px;gap:6px 10px;align-items:center;font-size:12.5px}
.gr-dist .bar{height:9px;border-radius:9px;background:#f1efec;overflow:hidden}
.gr-dist .bar span{display:block;height:100%;background:#e8a317}
.gr-cari{width:100%;padding:9px 12px;border:1px solid var(--k-line-hard);border-radius:10px;font-size:13.5px;font-family:inherit}
.akun{border:1px solid var(--k-line-soft);border-radius:14px;padding:14px 16px;background:#fbfaf9;min-height:128px}
.akun .nm{font-weight:700;color:var(--ink);margin:10px 0 2px}
.akun .ket{font-size:12px;color:var(--muted)}
.akun .aksi{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.akun-id{display:flex;align-items:center;gap:10px;margin-top:10px}
.akun-id .nm{margin:0}
.akun-av{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:0 0 40px;background:var(--line)}
.akun-cek{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:#20d5ec;color:#fff;font-size:10px;vertical-align:middle}
.akun-bio{font-size:12px;color:var(--ink);margin:8px 0 0;white-space:pre-line}
.akun-stat{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0 6px;text-align:center}
.akun-stat b{display:block;font-size:15px;color:var(--ink)}
.akun-stat span{font-size:11px;color:var(--muted)}

.ins{border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.ins .t{display:flex;align-items:center;gap:8px;justify-content:space-between}
.ins .kat{font-size:11.5px;color:var(--muted-2)}
.ins .temuan{font-size:13.5px;color:var(--ink);line-height:1.55}
.ins .aksi-ide{background:var(--info-bg);color:var(--info);border-radius:8px;padding:8px 10px;font-size:12.5px}
.ins .met{font-size:12px;color:var(--muted)}
.ins .kaki{display:flex;gap:8px;align-items:center;border-top:1px solid var(--line-soft);padding-top:10px;margin-top:auto;flex-wrap:wrap}
.ins.arsip{opacity:.6}

.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 16px}
.form .full{grid-column:1/-1}
.field input,.field select,.field textarea{padding:9px 12px;font-size:14px}
.field textarea{min-height:76px;resize:vertical}
.field .bantu{font-size:11.5px;color:var(--muted-2);margin-top:4px}

.pita{border-radius:var(--radius-sm);padding:10px 14px;font-size:13px;margin-bottom:14px;line-height:1.5}
.pita.info{background:var(--info-bg);color:var(--ink)}
.pita.warn{background:var(--warn-bg);color:var(--ink)}
.pita.err{background:var(--danger-bg);color:var(--danger)}
.pita.ok{background:var(--ok-bg);color:var(--ok)}
.kosong{text-align:center;color:var(--muted);padding:26px 10px;font-size:13.5px}

/* Kalender */
.kal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--surface)}
.kal .hd{background:var(--paper);font-size:11px;font-weight:700;color:var(--muted);padding:8px 10px;letter-spacing:.5px;border-bottom:1px solid var(--line)}
.kal .sel{min-height:104px;border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);padding:6px 7px;cursor:pointer}
.kal .sel:nth-child(7n){border-right:none}
.kal .sel:hover{background:var(--paper)}
.kal .sel.luar .tg{color:var(--muted-2)}
.kal .sel.hari .tg{background:var(--info);color:#fff;border-radius:50%;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center}
.kal .sel.pilih{outline:2px solid var(--info);outline-offset:-2px}
.kal .tg{font-size:12px;font-weight:600;color:var(--ink)}
.kal .it{font-size:11px;border-left:3px solid var(--info);background:var(--paper);border-radius:4px;padding:2px 6px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kal .it.s-DRAF{border-left-color:var(--muted-2)}
.kal .it.s-TAYANG{border-left-color:var(--ok)}
.kal .it.s-BATAL{border-left-color:var(--danger);text-decoration:line-through;opacity:.6}
.kal .it.telat{border-left-color:var(--danger);background:var(--danger-bg)}
.jd{border:1px solid var(--line);border-left:4px solid var(--info);border-radius:var(--radius-sm);padding:12px 14px;background:var(--surface)}
.jd.s-DRAF{border-left-color:var(--muted-2)}
.jd.s-TAYANG{border-left-color:var(--ok)}
.jd.telat{border-left-color:var(--danger)}
.jd .cap{font-size:12.5px;color:var(--muted);margin-top:6px;white-space:pre-wrap;max-height:84px;overflow:hidden}

/* Modal */
.modal{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(20,16,8,.42);display:flex;align-items:flex-start;justify-content:center;
  padding:40px 16px;z-index:50;overflow-y:auto}
.modal .box{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);width:100%;max-width:760px;padding:20px 22px}
.modal .box h3{font-size:17px;margin-bottom:4px}
.modal .kaki{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}

/* Riset */
.ide{border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;background:var(--surface)}
.ide .hook{background:var(--gold-soft);border-radius:8px;padding:8px 10px;font-size:13px;margin:8px 0;color:var(--ink)}
.ide .cap{font-size:12.5px;color:var(--muted);white-space:pre-wrap}
.agen{display:flex;gap:10px;align-items:center;padding:14px;background:var(--info-bg);border-radius:var(--radius);margin-bottom:14px}
.putar{width:18px;height:18px;border:2.5px solid var(--info);border-top-color:transparent;border-radius:50%;animation:putar 1s linear infinite;flex:none}
@keyframes putar{to{transform:rotate(360deg)}}

.toast{position:fixed;right:18px;bottom:18px;z-index:80;display:flex;flex-direction:column;gap:8px}
.toast div{background:var(--ink);color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;box-shadow:var(--shadow-lg);max-width:380px}
.toast div.err{background:var(--danger)}

@media (max-width:980px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:1fr}
}
@media (max-width:880px){
  .shell{grid-template-columns:1fr}
  .sidebar{position:fixed;left:-280px;top:0;width:260px;z-index:40;transition:left .2s;box-shadow:0 18px 48px rgba(50,42,28,.12)}
  .sidebar.buka{left:0}
  .burger{display:inline-flex;align-items:center;justify-content:center}
  .topbar{padding:0 14px}
  .content{padding:16px 16px 80px}
  .g2,.form{grid-template-columns:1fr}
  .kal .sel{min-height:64px}
  .kal .it{display:none}
  .kal .sel.ada::after{content:"•";color:var(--info);font-weight:800}
}

<script>
(function(){
'use strict';

/* ===================== DASAR ===================== */
var API = '../../konten-api-mysql/api.php';

/* TITLES sekaligus daftar halaman yang SAH. Halaman yang tidak punya baris di
   sini memantul ke halaman pertama — pelajaran modul DW: menu yang ada tapi
   judulnya lupa ditulis terbuka sekejap lalu memantul tanpa satu pun galat. */
var TITLES = {
  insight: 'Insight Konten',
  kalender: 'Kalender & Jadwal Posting',
  riset: 'Riset Tren (AI)',
  bank: 'Bank Konten',
  tumbuh: 'Pertumbuhan Akun',
  iklan: 'Performa Iklan (Meta Ads)',
  greview: 'Google Review',
  pengaturan: 'Pengaturan'
};
var PLATFORM = ['TikTok', 'Instagram', 'YouTube'];
/* Kategori pola insight DISETEL di Pengaturan (14 Okt 2026) dan dibaca dari
   server (setting.kategori) — daftar yang SAMA dipakai prompt Temukan insight.
   KATEGORI_BAWAAN cuma cadangan selama server belum menjawab / PHP lama. */
var KATEGORI_BAWAAN = ['Hook 3 Detik & Retensi', 'Format Konten & Visual', 'Topik & Tren', 'Waktu Tayang',
  'Promo & Ajakan', 'Sentimen & Masukan', 'Kolaborasi & KOL'];
function kategoriAktif(){
  var k = D && D.setting && D.setting.kategori;
  return (k && k.length) ? k : KATEGORI_BAWAAN;
}
/* Pilihan kategori: daftar aktif + kategori LAMA yang masih dipakai insight
   (ditandai), supaya membuka/menyaring insight lama tidak diam-diam
   mengganti kategorinya ke pilihan pertama. */
function opsiKategori(terpilih, lama){
  var k = kategoriAktif().slice(), h = '';
  if (lama && lama.length) lama.forEach(function(x){ if (x && k.indexOf(x) < 0) k.push(x); });
  if (terpilih && k.indexOf(terpilih) < 0) k.push(terpilih);
  var aktif = kategoriAktif();
  k.forEach(function(x){
    h += '<option value="' + esc(x) + '"' + (x === terpilih ? ' selected' : '') + '>' + esc(x) + (aktif.indexOf(x) < 0 ? ' (lama)' : '') + '</option>';
  });
  return h;
}
var STATUS = ['DRAF', 'TERJADWAL', 'TAYANG', 'BATAL'];
var STATUS_LBL = { DRAF: 'Draf', TERJADWAL: 'Terjadwal', TAYANG: 'Tayang', BATAL: 'Batal' };
var HARI = ['SEN', 'SEL', 'RAB', 'KAM', 'JUM', 'SAB', 'MIN'];
var BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
var BLN3 = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];

function sesi(){ try{ return JSON.parse(localStorage.getItem('lm_session')||'null'); }catch(e){ return null; } }
var SESI = sesi() || {};

var D = null;            // jawaban campaignGet
var GALAT = '';          // galat muat
var VIEW = 'insight';
var ST = {
  topPlat: '', topUrut: 'views', topHal: 1, topRentang: 'semua', topDari: '', topSampai: '',
  topSrv: {}, topSibuk: '', topBuka: '', topQ: '',
  insPlat: '', insKat: '', insArsip: false,
  kalBulan: null, kalPilih: null,
  risetPilih: null, risetJalan: false, risetMulai: 0, risetGalat: '', risetIsi: null,
  usulan: null, usulanJalan: false,
  /* Periode & fokus analisa AI (29 Okt 2026). Satu objek per kartu: riset dan
     insight otomatis boleh dibaca dari periode yang berbeda. */
  /* Riset Tren TANPA pilihan periode (dicabut 29 Okt 2026, permintaan user —
     periodenya pindah ke Content Planning). Fokus kategori tetap. */
  risetPer: { r: 'semua', dari: '', sampai: '', fokus: [] },
  usulanPer: { r: '30', dari: '', sampai: '', fokus: [] },
  bankPer: { r: '30', dari: '', sampai: '', fokus: [] },
  iklanPe: '30', iklanSrv: {}, iklanSibuk: '', iklanSync: false, iklanLabel: '', iklanNilai: '', iklanStatus: '', iklanUrut: 'spend', iklanQ: '', iklanRows: [],
  tumbuhHari: 30, tumbuhPlat: 'instagram', tumbuhSrv: {}, tumbuhSibuk: '',
  iklanTampil: 'iklan', iklanBukaPost: '', iklanMed: {},
  iklanAI: null, iklanAIJalan: false, iklanAIGalat: '', iklanAIPe: '',
  bankSt: 'IDE', bankPlat: '', bankJalan: false, bankGalat: '', bankIsi: null, bankHasil: null,
  /* Google Review. Draf balasan disimpan DI LUAR DOM (grDraf) — render di
     modul ini TOTAL, dan balasan setengah jadi tidak boleh hilang tiap kali
     halaman digambar ulang. */
  grSrv: null, grSibuk: false, grSync: false, grSaring: 'tangani', grTempat: '', grQ: '', grBatas: 30,
  grBuka: '', grDraf: {}, grTandai: {}, grKirim: '', grFokus: null, grAIJalan: false, grAIGalat: '', grAIHari: 90, grDrafJalan: '',
  sibuk: {}
};

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function num(v){ var n = Number(v); return isFinite(n) ? n : 0; }
function angka(n){
  n = num(n);
  if (n >= 1e6) return (n/1e6).toFixed(1).replace('.', ',').replace(',0','') + ' jt';
  if (n >= 1e3) return (n/1e3).toFixed(1).replace('.', ',').replace(',0','') + ' rb';
  return String(Math.round(n));
}
/* Tanggal "hari ini" menurut WIB, bukan zona peramban — laptop yang zonanya
   tersetel lain tidak boleh menggeser jadwal satu hari. */
function hariIni(){ var d = new Date(Date.now() + 7*3600e3); return d.toISOString().slice(0,10); }
function jamKini(){ var d = new Date(Date.now() + 7*3600e3); return d.toISOString().slice(11,16); }
function msKeTgl(ms){ if(!ms) return ''; return new Date(num(ms) + 7*3600e3).toISOString().slice(0,10); }
function fmtTgl(t){
  if (!t || !/^\d{4}-\d{2}-\d{2}/.test(t)) return '—';
  var p = t.slice(0,10).split('-'); return (+p[2]) + ' ' + BLN3[+p[1]-1] + ' ' + p[0];
}
function fmtWaktu(ms){
  if (!ms) return '—';
  var d = new Date(num(ms) + 7*3600e3).toISOString();
  return fmtTgl(d.slice(0,10)) + ', ' + d.slice(11,16);
}
function chipPlat(p){
  var k = String(p||'').toLowerCase();
  var cls = k.indexOf('tiktok')>-1 ? 'p-tiktok' : k.indexOf('insta')>-1 ? 'p-instagram' : k.indexOf('you')>-1 ? 'p-youtube' : 'p-lain';
  return '<span class="chip ' + cls + '">' + esc(p || 'Lainnya') + '</span>';
}
function platNorm(p){
  var k = String(p||'').toLowerCase();
  if (k.indexOf('tiktok') > -1) return 'TikTok';
  if (k.indexOf('insta') > -1 || k === 'ig' || k.indexOf('reels') > -1) return 'Instagram';
  if (k.indexOf('you') > -1 || k === 'yt') return 'YouTube';
  return p || 'Lainnya';
}
function toast(pesan, err){
  var w = document.getElementById('toast'); var el = document.createElement('div');
  if (err) el.className = 'err';
  el.textContent = pesan; w.appendChild(el);
  setTimeout(function(){ el.remove(); }, err ? 7000 : 3500);
}
function admin(){ return !!(D && D.boleh && D.boleh.admin); }

/* Satu pintu ke server. Token sesi Office ikut di tiap permintaan — seluruh
   aksi Campaign berpagar sesi di backend. */
function api(action, data){
  return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: action, sesi: SESI.token || '', data: data || {} }) })
    .then(function(r){ return r.text(); })
    .then(function(t){
      /* Balasan kosong / halaman HTML biasanya berarti hosting MEMUTUS
         permintaan yang terlalu lama (AI berpikir > batas waktu server) —
         bukan backend yang belum ter-deploy. Dua sebab itu dibedakan. */
      var j; try { j = JSON.parse(t); } catch(e){
        if (!String(t || '').trim() || /timeout|time-out|504|502|503/i.test(t)) throw new Error('Server berhenti menunggu jawaban AI (batas waktu hosting terlewati). Coba lagi dengan topik yang lebih sempit, atau pilih model yang lebih cepat di Pengaturan → AI.');
        throw new Error('Balasan server bukan JSON. Backend Konten mungkin belum ter-deploy.'); }
      if (!j.ok) {
        var e = String(j.error || 'Gagal');
        /* Kodenya dibedakan supaya pesannya menyuruh hal yang benar: sesi
           habis disembuhkan masuk ulang, tanpa modul tidak. */
        if (e.indexOf('sesi_tidak_sah:') === 0) e = e.slice(15).trim();
        else if (e.indexOf('tanpa_modul:') === 0) e = e.slice(12).trim();
        else if (e.indexOf('tidak_berhak:') === 0) e = e.slice(13).trim();
        else if (e.indexOf('Aksi tidak dikenal: campaign') === 0) e = 'Backend modul Campaign belum ter-deploy di server ini.';
        throw new Error(e);
      }
      return j.data;
    });
}

function muat(){
  return api('campaignGet').then(function(d){ D = d; GALAT = ''; }).catch(function(e){ GALAT = e.message; });
}

/* ===================== ROUTER ===================== */
function terapkanHash(){
  var h = (location.hash || '').replace(/^#\/?/, '');
  VIEW = TITLES[h] ? h : 'insight';
  if (VIEW === 'pengaturan' && D && !admin()) VIEW = 'insight';
  render();
}
function go(v){ location.hash = '#' + v; }

/* Ikon & bentuk menu DISALIN dari panel Konten Planning (ICONS/icon() di
   sana) — sidebar dua panel satu modul harus terbaca sama. */
var ICONS = {
  chart:'<line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>',
  cal:'<rect x="3" y="4" width="18" height="17" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/>',
  bulb:'<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.3 1 2.5h6c0-1.2.3-1.8 1-2.5A6 6 0 0 0 12 3z"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
  box:'<path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><line x1="12" y1="13" x2="12" y2="21"/>',
  naik:'<polyline points="3 17 9 11 13 15 21 7"/><polyline points="15 7 21 7 21 13"/>',
  target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/>',
  bintang:'<polygon points="12 2 15.1 8.3 22 9.3 17 14.1 18.2 21 12 17.8 5.8 21 7 14.1 2 9.3 8.9 8.3 12 2"/>',
  list:'<line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3.5" cy="6" r="1.5"/><circle cx="3.5" cy="12" r="1.5"/><circle cx="3.5" cy="18" r="1.5"/>'
};
function icon(n){ return '<svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + (ICONS[n] || '') + '</svg>'; }
var SUBJUDUL = {
  insight: 'Postingan terpopuler, akun terhubung & insight per platform',
  kalender: 'Rencana posting & pengingat tayang',
  riset: 'Riset tren & ide konten dibantu AI',
  bank: 'Content planning dari AI, riset & ide manual — siap dijadwalkan',
  tumbuh: 'Kenaikan views, reach, interaksi & follower — dan pengaruh iklan',
  iklan: 'Iklan Facebook & Instagram: mana yang works, mana yang tidak',
  greview: 'Ulasan Google tamu: yang perlu ditangani, dibalas langsung, dan dianalisa AI',
  pengaturan: 'Profil brand, kunci AI, TikTok & Instagram'
};
function bolehPlanning(){ var m = SESI.modules || []; return m.indexOf('*') > -1 || m.indexOf('konten') > -1; }
function gambarNav(){
  var menu = [['insight','Insight','chart'],['kalender','Kalender','cal'],['riset','Riset Tren','bulb'],['bank','Bank Konten','box'],['tumbuh','Pertumbuhan','naik'],['iklan','Iklan','target'],['greview','Google Review','bintang']];
  if (admin()) menu.push(['pengaturan','Pengaturan','gear']);
  var telat = D ? jadwalTelat().length : 0;
  /* Lencana Google Review = review yang tingkatnya SEGERA dan belum
     ditangani. Hanya kalau datanya sudah pernah dimuat — memuatnya cuma demi
     lencana berarti tiap halaman menarik 3.000 review. */
  var grSegera = grHitungSegera();
  var item = function(m){
    var n = (m[0] === 'kalender' && telat) ? '<span class="badge" title="Terjadwal tapi belum ditandai tayang">' + telat + '</span>'
      : (m[0] === 'greview' && grSegera) ? '<span class="badge" title="Review yang perlu segera ditangani">' + grSegera + '</span>' : '';
    return '<a href="#' + m[0] + '" class="nav-item' + (VIEW === m[0] ? ' active' : '') + '" data-v="' + m[0] + '">' + icon(m[2]) + '<span>' + esc(m[1]) + '</span>' + n + '</a>';
  };
  /* Pindah panel tanpa kembali ke pemilih — hanya kalau orangnya memang
     berhak atas Konten Planning; tautan yang memantul balik terbaca rusak. */
  var pindah = bolehPlanning()
    ? '<div class="sb-group"><div class="sb-group-t">Panel</div><a href="../planning/" class="nav-item" data-v="">' + icon('list') + '<span>Konten Planning</span></a></div>'
    : '';
  document.getElementById('nav').innerHTML = '<div class="sb-group"><div class="sb-group-t">Analytics</div>' + menu.map(item).join('') + '</div>' + pindah;
}

function render(){
  gambarNav();
  document.getElementById('judul').firstChild.textContent = TITLES[VIEW];
  document.getElementById('judulSub').textContent = SUBJUDUL[VIEW] || '';
  document.title = TITLES[VIEW] + ' - Konten Analytics';
  /* Tombol Refresh di kanan atas DICABUT (14 Okt 2026, permintaan user): tiap
     simpan sudah memuat ulang dari server, dan Konten terpopuler punya tombol
     Coba lagi sendiri. Wadahnya dikosongkan, bukan dibuang dari markup. */
  document.getElementById('topAksi').innerHTML = '';
  var app = document.getElementById('app');
  if (GALAT && !D) { app.innerHTML = '<div class="pita err">Data tidak bisa dimuat: ' + esc(GALAT) + '</div>'; return; }
  if (!D) { app.innerHTML = '<div class="kosong">Memuat…</div>'; return; }
  var pita = '';
  var q = new URLSearchParams(location.search);
  if (q.get('tiktok')) {
    pita = '<div class="pita ' + (q.get('tiktok') === 'ok' ? 'ok' : 'err') + '">' + esc(q.get('pesan') || '') + '</div>';
  }
  if (q.get('instagram')) {
    pita = '<div class="pita ' + (q.get('instagram') === 'ok' ? 'ok' : 'err') + '">' + esc(q.get('pesan') || '') + '</div>';
  }
  if (q.get('google')) {
    pita = '<div class="pita ' + (q.get('google') === 'ok' ? 'ok' : 'err') + '">' + esc(q.get('pesan') || '') + '</div>';
  }
  app.innerHTML = pita + (VIEW === 'kalender' ? vKalender() : VIEW === 'riset' ? vRiset() : VIEW === 'bank' ? vBank() : VIEW === 'iklan' ? vIklan() : VIEW === 'greview' ? vGreview() : VIEW === 'tumbuh' ? vTumbuh() : VIEW === 'pengaturan' ? vPengaturan() : vInsight());
}

/* ===================== INSIGHT ===================== */
function akun(p){ return ((D && D.akun) || []).filter(function(a){ return a.platform === p; })[0] || null; }

/* Konten terpopuler: postingan TikTok yang ditarik dari akun terhubung DAN
   angka yang diisi tim di modul Konten (Input Performa). Yang dari TikTok
   menang kalau tautannya sama — angkanya datang langsung dari platform. */
/* Rentang tanggal tayang untuk Konten terpopuler. Dihitung dari "hari ini"
   WIB — sama dengan hariIni() — supaya "7 hari" tidak bergeser satu hari di
   laptop berzona lain. 'semua' = tanpa batas. */
function topRentang(){
  var r = ST.topRentang, kini = hariIni();
  var mundur = function(n){ var d = new Date(kini + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() - (n - 1)); return d.toISOString().slice(0,10); };
  if (r === '7' || r === '30' || r === '90') return { dari: mundur(+r), sampai: kini };
  if (r === 'bulan') return { dari: kini.slice(0,8) + '01', sampai: kini };
  if (r === 'khusus') return { dari: ST.topDari, sampai: ST.topSampai };
  return { dari: '', sampai: '' };
}
/* SATU HALAMAN dari server (campaignTop), bukan seluruh daftar — permintaan
   user 13 Okt 2026: "per page per API page aja, jadi sistemnya tidak berat".
   Jawabannya disimpan per KUNCI saringan; kegagalan IKUT dicatat di kunci
   itu, kalau tidak render -> muat -> render berputar selamanya (pelajaran
   muatReqMkt() di panel Planning). */
function topKunci(){ var r = topRentang(); return [ST.topPlat, ST.topUrut, r.dari, r.sampai, ST.topHal, ST.topQ].join('|'); }
function muatTop(){
  var k = topKunci(), r = topRentang();
  if (ST.topSrv[k] || ST.topSibuk === k) return;
  ST.topSibuk = k;
  api('campaignTop', { platform: ST.topPlat, urut: ST.topUrut, dari: r.dari, sampai: r.sampai, hal: ST.topHal, per: 10, q: ST.topQ })
    .then(function(d){ ST.topSrv[k] = { data: d }; })
    .catch(function(e){ ST.topSrv[k] = { galat: e.message }; })

/* Panel detail satu baris Konten terpopuler (13 Okt 2026). Urutan & label

var RINCI = [['reach','Reach'],['impr','Impression'],['views','Views'],['likes','Likes'],['comments','Comment'],

function topKunciBaris(e){ return e.url || (e.platform + '|' + e.tanggal + '|' + e.judul); }
function rinciHtml(e){
  /* Server lama belum memulangkan rinci — empat angka yang memang ada di
     barisnya tetap dipakai, sisanya kosong. */
  var r = e.rinci || { views:{v:e.views,s:e.sumber==='tiktok'?'api':'manual'}, likes:{v:e.likes,s:''}, comments:{v:e.comments,s:''}, shares:{v:e.shares,s:''} };
  var kurang = [];
  var kotak = RINCI.map(function(x){
    var c = r[x[0]] || {}, ada = c.v != null;
    if (!ada) kurang.push(x[1]);
    return '<div class="' + (ada ? '' : 'kosong-r') + '"><span>' + x[1] + '</span><b>' + (ada ? angka(c.v) : '—') + '</b>'
      + '<i>' + (c.s === 'api' ? (e.sumber === 'instagram' ? 'Instagram API' : 'TikTok API') : c.s === 'manual' ? 'Input Performa' : 'belum ada') + '</i></div>';
  }).join('');
  /* Yang kosong DIKATAKAN sebabnya — kotak "—" tanpa penjelasan terbaca
     sebagai data yang gagal dimuat. Sebabnya berbeda menurut sumbernya. */
  var ket = '';

    if (e.sumber === 'instagram' && !e.tercatat) {

    } else if (e.sumber === 'tiktok' && !e.tercatat) {
      ket = kurang.join(', ') + ' tidak disediakan TikTok API (yang terbuka hanya views, likes, komentar, share). '
        + 'Untuk melengkapinya, catat postingan ini sebagai konten di <b>Konten Planning</b> dengan tautan yang sama, lalu isi angkanya di <b>Input Performa</b> dari TikTok Studio.';
    } else {
      ket = kurang.join(', ') + ' belum diisi. Lengkapi di <b>Konten Planning → Input Performa</b>'

  /* Instagram API memberi angka ORGANIK saja (dokumentasi Meta: insight
     postingan yang dipromosikan tidak memuat interaksi dari iklan). Tanpa

     sebagai salah baca. */
  var org = '';

    org = 'Angka dari Instagram API adalah <b>organik</b> — views & interaksi dari iklan tidak ikut, jadi bisa lebih kecil daripada angka di aplikasi Instagram.';
    if (e.iklan) org += ' Postingan ini <b>pernah dipromosikan</b> (' + e.iklan.n + ' iklan): biaya ' + rupiah(e.iklan.spend) + ', ' + angka(e.iklan.impresi) + ' impresi'
      + (e.iklan.videoView ? ', ' + angka(e.iklan.videoView) + ' video views' : '') + ' dari iklan. Rinciannya di menu <b>Iklan</b>.';
  }
  return '<div class="rinci"><div class="rinci-grid">' + kotak + '</div>' + (ket ? '<p>' + ket + '</p>' : '') + (org ? '<p>' + org + '</p>' : '') + '</div>';

function daftarTopHtml(hasil){

    if (!ST.insArsip && +i.arsip === 1) return false;
    if (ST.insArsip && +i.arsip !== 1) return false;
    if (ST.insPlat && platNorm(i.platform) !== ST.insPlat) return false;
    if (ST.insKat && i.kategori !== ST.insKat) return false;
    return true;
  });
  var nArsip = (D.insight || []).filter(function(i){ return +i.arsip === 1; }).length;
  var seg = '<div class="seg">' + [['','Semua']].concat(PLATFORM.map(function(p){ return [p,p]; })).map(function(x){
    return '<button class="' + (ST.insPlat === x[0] ? 'on' : '') + '" data-a="ins-plat" data-v="' + esc(x[0]) + '">' + esc(x[1]) + '</button>'; }).join('')
    + '<button class="' + (ST.insArsip ? 'on' : '') + '" data-a="ins-arsip">Arsip (' + nArsip + ')</button></div>';
  var kat = '<select data-a="ins-kat" style="padding:7px 10px;border:1.5px solid var(--line);border-radius:9px;font-size:13px"><option value="">Semua kategori</option>'
    + opsiKategori(ST.insKat, (D.insight || []).map(function(i){ return i.kategori; })) + '</select>';

    return '<div class="ins' + (+i.arsip === 1 ? ' arsip' : '') + '"><div class="t">' + chipPlat(platNorm(i.platform))
      + '<span class="kat">Tayang ' + fmtTgl(i.tgl_tayang) + '</span></div>'
      + '<div class="kat">' + esc(i.kategori || '—') + (i.sumber && i.sumber !== 'manual' ? ' · dari ' + esc(i.sumber === 'ai' ? 'AI' : i.sumber === 'tiktok' ? 'TikTok' : i.sumber === 'instagram' ? 'Instagram' : 'modul Konten') : '') + '</div>'
      + '<div class="temuan">' + esc(i.temuan) + '</div>'
      + (i.aksi ? '<div class="aksi-ide">💡 ' + esc(i.aksi) + '</div>' : '')
      + (i.metrik ? '<div class="met">' + esc(platNorm(i.platform)) + ' · ' + esc(i.metrik) + '</div>' : '')
      + '<div class="kaki">' + (i.url ? '<a href="' + esc(i.url) + '" target="_blank" rel="noopener" style="font-size:12.5px">↗ Lihat konten</a>' : '')
      + '<span style="margin-left:auto"></span>'
      + '<button class="btn btn-ghost btn-sm" data-a="ins-ubah" data-i="' + idx + '">Sunting</button>'
      + '<button class="btn btn-ghost btn-sm" data-a="ins-kal" data-i="' + idx + '">📅 Kalender</button>'
      + '<button class="btn btn-ghost btn-sm" data-a="ins-arsipkan" data-i="' + idx + '">' + (+i.arsip === 1 ? 'Pulihkan' : 'Arsipkan') + '</button></div></div>';
  }).join('') + '</div>' : '<div class="kosong">' + ((D.insight||[]).length ? 'Tidak ada insight yang cocok dengan saringan.' : 'Belum ada insight. Catat dari konten terpopuler di atas, atau minta usulan dari Insight otomatis (AI).') + '</div>';
  return '<div class="kartu"><div class="kepala"><div><h2>Insight konten</h2>'
    + '<div class="sub">Pola yang terbukti jalan, lengkap dengan tautan & tanggal tayangnya, lalu jadikan bahan kalender konten.</div></div>'

var MODAL_DATA = null;
function nilai(id){ var el = document.getElementById(id); return el ? el.value.trim() : ''; }

function simpanInsight(){
  var d = { id: MODAL_DATA.id, sumber: MODAL_DATA.sumber, platform: nilai('f-plat'), kategori: nilai('f-kat'),
    temuan: nilai('f-temuan'), url: nilai('f-url'), tglTayang: nilai('f-tgl'), metrik: nilai('f-met'), aksi: nilai('f-aksi') };
  /* Ditahan di layar dulu supaya sebabnya terbaca sebelum kiriman berangkat;
     server memeriksanya lagi — layar bisa diakali, server tidak. */
  var kurang = [];

/* Kirim, lalu muat ulang dari server — layar tidak pernah mengaku tersimpan
   sebelum server menjawab. */
function kirim(aksi, data, pesanOk){
  var tbl = document.querySelector('#modal [data-a$="-simpan"]');
  if (tbl) { tbl.disabled = true; tbl.textContent = 'Menyimpan…'; }
  return api(aksi, data).then(function(){
    tutupModal(); toast(pesanOk);
    return muat().then(render);
  }).catch(function(e){
    if (tbl) { tbl.disabled = false; tbl.textContent = 'Simpan'; }
    var g = document.getElementById('f-galat') || document.getElementById('j-galat') || document.getElementById('b-galat');
    if (g) g.innerHTML = '<div class="pita err">' + esc(e.message) + '</div>'; else toast(e.message, true);
  });
}

/* ===================== KALENDER ===================== */
function jadwalTelat(){
  var t = hariIni(), j = jamKini();
  return (D.jadwal || []).filter(function(x){
    return x.status === 'TERJADWAL' && (x.tanggal < t || (x.tanggal === t && x.jam && x.jam <= j));
  });
}
function bulanKini(){ return ST.kalBulan || hariIni().slice(0,7); }

function vKalender(){
  var bln = bulanKini(), th = +bln.slice(0,4), bl = +bln.slice(5,7);
  var awal = new Date(Date.UTC(th, bl-1, 1));
  var geser = (awal.getUTCDay() + 6) % 7;          // Senin = kolom pertama
  var mulai = new Date(Date.UTC(th, bl-1, 1 - geser));
  var per = {};
  (D.jadwal || []).forEach(function(j){ (per[j.tanggal] = per[j.tanggal] || []).push(j); });
  var telatId = {}; jadwalTelat().forEach(function(j){ telatId[j.id] = true; });
  var sel = HARI.map(function(h){ return '<div class="hd">' + h + '</div>'; }).join('');
  var nHari = new Date(Date.UTC(th, bl, 0)).getUTCDate();
  var nSel = Math.ceil((geser + nHari) / 7) * 7;   // 5 atau 6 minggu, tidak pernah baris kosong
  for (var i = 0; i < nSel; i++) {
    var d = new Date(mulai.getTime() + i*864e5), t = d.toISOString().slice(0,10);
    var isi = (per[t] || []).slice().sort(function(a,b){ return String(a.jam).localeCompare(String(b.jam)); });
    var cls = 'sel' + (t.slice(0,7) !== bln ? ' luar' : '') + (t === hariIni() ? ' hari' : '') + (ST.kalPilih === t ? ' pilih' : '') + (isi.length ? ' ada' : '');
    sel += '<div class="' + cls + '" data-a="kal-pilih" data-v="' + t + '"><span class="tg">' + d.getUTCDate() + '</span>'
      + isi.slice(0,3).map(function(j){ return '<div class="it s-' + j.status + (telatId[j.id] ? ' telat' : '') + '" title="' + esc(j.judul) + '">' + (j.jam ? esc(j.jam) + ' ' : '') + esc(j.judul) + '</div>'; }).join('')
      + (isi.length > 3 ? '<div style="font-size:10.5px;color:var(--muted-2);margin-top:2px">+' + (isi.length-3) + ' lagi</div>' : '') + '</div>';
  }
  var telat = jadwalTelat();
  var h = '';
  /* POSTING OTOMATIS BELUM AKTIF, dan itu dikatakan di tempat yang paling
     sering dibuka. Kalender yang diam-diam tidak memposting apa pun akan
     dipercaya sampai satu jadwal promo terlewat. */
  h += '<div class="pita info"><b>Posting otomatis belum aktif.</b> TikTok mewajibkan audit aplikasi untuk Content Posting API, jadi untuk sekarang kalender ini jadi pengingat: '
    + 'saat jamnya tiba, salin caption-nya, posting dari HP, lalu tandai <b>Tayang</b> berikut tautannya.</div>';
  if (telat.length) {
    h += '<div class="kartu" style="border-color:#E7BDB8"><h2>Sudah waktunya diposting (' + telat.length + ')</h2><div class="sub">Terjadwal tapi belum ditandai tayang.</div>'
      + '<div class="grid g2">' + telat.map(kartuJadwal).join('') + '</div></div>';
  }
  h += '<div class="kartu"><div class="kepala"><div><h2>Kalender konten</h2><div class="sub">' + (D.jadwal||[]).filter(function(j){ return j.status !== 'BATAL'; }).length
    + ' konten di kalender. Bawa insight & ide riset ke sini lewat tombol Kalender / Jadwalkan.</div></div>'
    + '<div class="r"><button class="btn btn-primary btn-sm" data-a="jdw-baru">+ Jadwalkan konten</button></div></div>'
    + '<div class="kepala" style="margin-bottom:10px;align-items:center">'
    + '<button class="btn btn-ghost btn-sm" data-a="kal-geser" data-v="-1">←</button>'
    + '<b style="font-size:15px;min-width:140px;text-align:center">' + BULAN[bl-1] + ' ' + th + '</b>'
    + '<button class="btn btn-ghost btn-sm" data-a="kal-geser" data-v="1">→</button>'
    + '<div class="r"><button class="btn btn-ghost btn-sm" data-a="kal-hari">Hari ini</button></div></div>'
    + '<div class="kal">' + sel + '</div>';
  var tp = ST.kalPilih || hariIni();
  var isiHari = (per[tp] || []).slice().sort(function(a,b){ return String(a.jam).localeCompare(String(b.jam)); });
  h += '<div class="kepala" style="margin:16px 0 10px;align-items:center"><b style="color:var(--info)">' + (tp === hariIni() ? 'Hari ini' : fmtTgl(tp)) + '</b>'
    + '<div class="r"><button class="btn btn-ghost btn-sm" data-a="jdw-baru" data-v="' + tp + '">+ Jadwalkan di tanggal ini</button></div></div>'
    + (isiHari.length ? '<div class="grid g2">' + isiHari.map(kartuJadwal).join('') + '</div>' : '<div class="kosong">Belum ada konten di tanggal ini.</div>');
  return h + '</div>';
}

/* ===================== RISET ===================== */
/* Kategori konten = BERKAS KEMBAR PILLARS di deploy/konten/planning/ dan
   cg_pilar_daftar() di konten-mysql/lib_campaign.php. Diukur atas produksi
   29 Okt 2026: Product & Menu 38, Entertainment 31, Promotion 14, Community 4,
   Event 3 dari 93 konten. Beda satu huruf dengan server = fokusnya dibuang
   diam-diam (server menolak nilai di luar daftar). */
var KONTEN_PILAR = ['Product & Menu','Promotion','Event','Entertainment','Education','Lifestyle','BTS','Corporate','Community','Information'];
var PILAR_LABEL = { 'Product & Menu': 'F&B (Product & Menu)', 'Promotion': 'Promosi', 'Information': 'Informasi' };
function rentangPer(o){
  var kini = hariIni();
  var mundur = function(n){ var d = new Date(kini + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() - (n - 1)); return d.toISOString().slice(0,10); };
  if (o.r === '7' || o.r === '30' || o.r === '90') return { dari: mundur(+o.r), sampai: kini };
  if (o.r === 'khusus') return { dari: o.dari, sampai: o.sampai };
  return { dari: '', sampai: '' };
}
/* Kendali periode + fokus, dipakai kartu Riset Tren DAN Insight otomatis.
   Yang dikirim ke server rentang tanggalnya, bukan kata "30" — server tidak
   perlu menghitung ulang "hari ini" dengan jamnya sendiri. */
function periodeFokusHtml(k, o, tanpaPeriode){
  var seg = '<div class="seg">' + [['7','7 hari'],['30','30 hari'],['90','90 hari'],['khusus','Rentang…'],['semua','Semua waktu']].map(function(x){
    return '<button type="button" class="' + (o.r === x[0] ? 'on' : '') + '" data-a="pf-r" data-k="' + k + '" data-v="' + x[0] + '">' + x[1] + '</button>'; }).join('') + '</div>';
  var tgl = o.r === 'khusus'
    ? ' <span style="display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--k-txt-3)">'
      + '<input type="date" data-a="pf-dari" data-k="' + k + '" value="' + esc(o.dari) + '" style="padding:5px 8px;border:1px solid var(--k-line-hard);border-radius:8px;font:inherit"> s/d '
      + '<input type="date" data-a="pf-sampai" data-k="' + k + '" value="' + esc(o.sampai) + '" style="padding:5px 8px;border:1px solid var(--k-line-hard);border-radius:8px;font:inherit"></span>'
    : '';
  var chip = KONTEN_PILAR.map(function(p){
    return '<button type="button" class="' + (o.fokus.indexOf(p) >= 0 ? 'on' : '') + '" data-a="pf-fokus" data-k="' + k + '" data-v="' + esc(p) + '">' + esc(PILAR_LABEL[p] || p) + '</button>'; }).join('');
  return (tanpaPeriode ? '' : '<div class="field full"><label>Periode data yang dibaca AI</label><div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">' + seg + tgl + '</div>'
    + '<div class="bantu">Postingan brand dari periode ini yang dipakai AI sebagai dasar.</div></div>')
    + '<div class="field full"><label>Fokus kategori konten (opsional, boleh lebih dari satu)</label><div class="seg" style="flex-wrap:wrap">' + chip + '</div>'
    + '<div class="bantu">' + (o.fokus.length ? 'AI hanya menganalisa konten ' + esc(o.fokus.map(function(p){ return PILAR_LABEL[p] || p; }).join(', ')) + '.' : 'Tidak ada yang dipilih = semua kategori.')
    + ' Kategori diambil dari pilar konten di Content Planning; postingan yang belum tercatat di sana dinilai AI dari judulnya.</div></div>';
}
function kirimPer(o){
  var r = rentangPer(o);
  if (o.r === 'khusus' && (!r.dari || !r.sampai)) return null;
  return { dari: r.dari, sampai: r.sampai, fokus: o.fokus.slice() };
}
function teksMeta(m){
  if (!m) return '';
  return (m.dari ? ' · data ' + fmtTgl(m.dari) + '–' + fmtTgl(m.sampai) : ' · semua waktu')
    + (m.fokus && m.fokus.length ? ' · fokus ' + m.fokus.map(function(p){ return PILAR_LABEL[p] || p; }).join(', ') : '')
    + (m.nBukti != null ? ' · ' + m.nBukti + ' postingan dibaca' : '');
}
/* Isian riset dibaca dari DOM sebelum render: render() total, dan menekan
   satu tombol periode tidak boleh menghapus topik yang sedang diketik. */
function simpanIsiBank(){
  if (!document.getElementById('b-dari')) return;
  ST.bankIsi = { dari: nilai('b-dari'), sampai: nilai('b-sampai'), platform: nilai('b-plat'), jumlah: nilai('b-jml'), fokus: nilai('b-fokus') };
}
function perDariKunci(k){ return k === 'riset' ? ST.risetPer : k === 'bank' ? ST.bankPer : ST.usulanPer; }
function simpanIsiRiset(){
  if (!document.getElementById('r-topik')) return;
  ST.risetIsi = { topik: nilai('r-topik'), platform: nilai('r-plat'), catatan: nilai('r-cat') };
}

/* ===================== IKLAN (Meta Ads) ===================== */
/* 14 Okt 2026, permintaan user: "jadi tau ads mana yg works dan yang tidak".
   Hasil tiap iklan dipilih server menurut TUJUAN kampanyenya; penilaian
   works/tidak dibandingkan HANYA dengan iklan yang hasilnya sejenis — biaya
   per chat tidak bisa diadu dengan biaya per 1.000 jangkauan. */
var IKLAN_MIN = 50000;   /* di bawah ini datanya belum cukup untuk dinilai */
function rupiah(n){ return 'Rp' + Math.round(num(n)).toLocaleString('id-ID'); }
function biayaHasil(r){
  var n = num(r.hasil_n); if (n <= 0) return null;
  return r.hasil_label === 'Jangkauan' ? num(r.spend) / n * 1000 : num(r.spend) / n;
}
function nilaiIklan(baris){
  var med = {}, grup = {};
  baris.forEach(function(r){
    var c = biayaHasil(r);
    if (r.hasil_label && c != null && num(r.spend) >= IKLAN_MIN) (grup[r.hasil_label] = grup[r.hasil_label] || []).push(c);
  });
  Object.keys(grup).forEach(function(k){
    var a = grup[k].sort(function(x, y){ return x - y; }), m = Math.floor(a.length / 2);
    if (a.length >= 3) med[k] = a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
  });
  baris.forEach(function(r){
    var c = biayaHasil(r), m = med[r.hasil_label];
    if (num(r.spend) < IKLAN_MIN) { r._nilai = 'kecil'; r._ket = 'Biaya baru ' + rupiah(r.spend) + ' — belum cukup untuk dinilai.'; }
    else if (c == null) { r._nilai = 'tidak'; r._ket = 'Sudah ' + rupiah(r.spend) + ' tapi belum menghasilkan ' + (r.hasil_label || 'hasil') + '.'; }
    else if (m == null) { r._nilai = 'wajar'; r._ket = 'Belum ada cukup iklan sejenis (' + r.hasil_label + ') untuk dibandingkan.'; }
    else if (c <= m * 0.8) { r._nilai = 'works'; r._ket = 'Biaya per hasil ' + Math.round((1 - c / m) * 100) + '% lebih murah dari median iklan sejenis (' + rupiah(m) + ').'; }
    else if (c >= m * 1.3) { r._nilai = 'tidak'; r._ket = 'Biaya per hasil ' + Math.round((c / m - 1) * 100) + '% lebih mahal dari median iklan sejenis (' + rupiah(m) + ').'; }
    else { r._nilai = 'wajar'; r._ket = 'Sekitar median iklan sejenis (' + rupiah(m) + ').'; }
  });
  return med;
}
var NILAI_LBL = { works: 'Works', wajar: 'Wajar', tidak: 'Tidak works', kecil: 'Data belum cukup' };
var IKLAN_STATUS = { ACTIVE: 'Aktif', PAUSED: 'Dijeda', CAMPAIGN_PAUSED: 'Kampanye dijeda', ADSET_PAUSED: 'Set iklan dijeda', ARCHIVED: 'Diarsipkan', DELETED: 'Dihapus', DISAPPROVED: 'Ditolak', PENDING_REVIEW: 'Ditinjau', WITH_ISSUES: 'Bermasalah' };
/* SEDANG BERJALAN: kampanye aktif + uang, dibaca langsung dari Meta.
   Dimuat sekali per kunjungan halaman (tombol Muat ulang untuk menyegarkan);
   galatnya ikut dicatat supaya render -> muat -> render tidak berputar. */
function muatJalanIklan(paksa){
  if (!paksa && (ST.iklanJalan || ST.iklanJalanSibuk)) return;
  ST.iklanJalanSibuk = true; if (paksa) { ST.iklanJalan = null; render(); }
  api('campaignAdsJalan').then(function(d){ ST.iklanJalan = { data: d }; })
    .catch(function(e){ ST.iklanJalan = { galat: e.message }; })
    .then(function(){ ST.iklanJalanSibuk = false; if (VIEW === 'iklan') render(); });
}
var IKLAN_TUJUAN = { OUTCOME_ENGAGEMENT: 'Interaksi', OUTCOME_AWARENESS: 'Awareness', OUTCOME_TRAFFIC: 'Traffic', OUTCOME_LEADS: 'Prospek', OUTCOME_SALES: 'Penjualan', OUTCOME_APP_PROMOTION: 'Aplikasi', MESSAGES: 'Pesan', LINK_CLICKS: 'Klik tautan', POST_ENGAGEMENT: 'Interaksi', REACH: 'Jangkauan', VIDEO_VIEWS: 'Video views' };
/* Selisih hari antara dua tanggal YYYY-MM-DD (UTC, jadi zona peramban tidak
   menggeser apa pun). */
function selisihHari(a, b){ return Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 864e5); }
/* Ditulis untuk DIBACA SEKALI LIHAT (revisi user 29 Okt 2026: "buat lebih
   gampang dimengerti"): satu kartu per kampanye yang menjawab empat
   pertanyaan — sudah jalan berapa lama, berhenti kapan, budget yang diset,
   dan biaya yang sudah keluar. */
function kartuJalanIklan(){
  var J = ST.iklanJalan;
  if (!J) muatJalanIklan(false);
  var h = '<div class="kartu"><div class="kepala"><div><h2>Iklan yang sedang jalan</h2><div class="sub">Dibaca langsung dari Meta Ads'
    + (J && J.data ? ' pukul ' + esc(fmtWaktu(J.data.at).split(' ').pop()) : '') + '. Tekan ⚙ Atur iklan untuk menjeda atau mengubah budget.</div></div>'
    + '<div class="r"><button class="btn btn-ghost btn-sm" data-a="iklan-jalan-muat"' + (ST.iklanJalanSibuk ? ' disabled' : '') + '>↻ Muat ulang</button></div></div>';
  if (!J) return h + '<div class="kosong">Membaca dari Meta Ads…</div></div>';

/* PER POSTINGAN (14 Okt 2026, permintaan user: "postingan mana yang sudah
   kita iklankan dan berapa kali"). Iklan dikelompokkan menurut POSTINGAN
   yang dipromosikan — ID media Instagram, lalu kode tautan. Materi yang
   bukan postingan Instagram (dibuat khusus di Ads Manager) berdiri sendiri
   per iklan, tidak ditebak ke postingan mana pun. Saringan & cari yang sama
   berlaku; penilaiannya memakai median yang SAMA dengan tampilan per iklan. */
function kelompokPostIklan(semua){
  var peta = {}, urut = [];
  semua.forEach(function(r){
    var k = r.ig_media ? 'id:' + r.ig_media : (r.kode ? 'kd:' + r.kode : 'ad:' + r.ad_id);
    var gp = peta[k];
    if (!gp) { gp = peta[k] = { kunci: k, iklan: [], kampanye: {}, thumb: '', permalink: '', post: null, spend: 0, impresi: 0, reach: 0, klik: 0, hasil: {}, mulai: '', selesai: '', aktif: 0, bukanPost: k.indexOf('ad:') === 0 }; urut.push(gp); }
    gp.iklan.push(r);
    if (r.kampanye) gp.kampanye[r.kampanye] = 1;
    if (!gp.thumb && r.thumb) gp.thumb = r.thumb;
    if (!gp.permalink && r.permalink) gp.permalink = r.permalink;
    if (!gp.post && r.post) gp.post = r.post;
    gp.spend += num(r.spend); gp.impresi += num(r.impresi); gp.reach += num(r.reach); gp.klik += num(r.klik);
    if (r.hasil_label) gp.hasil[r.hasil_label] = (gp.hasil[r.hasil_label] || 0) + num(r.hasil_n);
    if (r.tgl_mulai && (!gp.mulai || r.tgl_mulai < gp.mulai)) gp.mulai = r.tgl_mulai;
    if (r.tgl_selesai && (!gp.selesai || r.tgl_selesai > gp.selesai)) gp.selesai = r.tgl_selesai;
    if (r.status === 'ACTIVE') gp.aktif++;
  });
  urut.forEach(function(gp){
    /* Hasil utama = jenis hasil dengan biaya terbanyak di kelompok ini. */
    var biayaLbl = {};
    gp.iklan.forEach(function(r){ if (r.hasil_label) biayaLbl[r.hasil_label] = (biayaLbl[r.hasil_label] || 0) + num(r.spend); });
    var utama = Object.keys(biayaLbl).sort(function(a, b){ return biayaLbl[b] - biayaLbl[a]; })[0] || '';
    gp.utama = utama;
    var n = gp.hasil[utama] || 0, sp = biayaLbl[utama] || 0;
    gp.cpr = n > 0 ? (utama === 'Jangkauan' ? sp / n * 1000 : sp / n) : null;
    var m = ST.iklanMed[utama];
    if (gp.spend < IKLAN_MIN) gp.nilai = 'kecil';
    else if (gp.cpr == null) gp.nilai = 'tidak';
    else if (m == null) gp.nilai = 'wajar';
    else gp.nilai = gp.cpr <= m * 0.8 ? 'works' : gp.cpr >= m * 1.3 ? 'tidak' : 'wajar';
  });
  return urut;
}

    if (u === 'cpr') { if (x.cpr == null && y.cpr == null) return 0; if (x.cpr == null) return 1; if (y.cpr == null) return -1; return x.cpr - y.cpr; }
    if (u === 'ctr') return (y.impresi ? y.klik / y.impresi : 0) - (x.impresi ? x.klik / x.impresi : 0);

      + '<div style="font-size:11.5px;color:var(--muted)">' + (gp.bukanPost ? 'Materi khusus iklan' : (p && p.tanggal ? 'Diposting ' + esc(fmtTgl(p.tanggal)) : 'Instagram'))
      + (gp.mulai ? ' · diiklankan ' + esc(fmtTgl(gp.mulai)) + (gp.selesai && gp.selesai !== gp.mulai ? ' – ' + esc(fmtTgl(gp.selesai)) : '') : '') + '</div>'

      + '<td class="n"><b>' + gp.iklan.length + 'x</b><div style="font-size:11px;color:var(--muted)">' + nKamp + ' kampanye' + (gp.aktif ? ' · ' + gp.aktif + ' aktif' : '') + '</div></td>'
      + '<td class="n">' + rupiah(gp.spend) + '</td><td class="n">' + angka(gp.impresi) + '</td>'
      + '<td class="n">' + (gp.utama ? angka(gp.hasil[gp.utama]) + '<div style="font-size:11px;color:var(--muted)">' + esc(gp.utama) + '</div>' : '—') + '</td>'
      + '<td class="n">' + (gp.cpr == null ? '—' : rupiah(gp.cpr) + (gp.utama === 'Jangkauan' ? '<div style="font-size:11px;color:var(--muted)">per 1.000</div>' : '')) + '</td>'

    if (buka) {
      h += '<tr><td></td><td colspan="9"><div class="rinci" style="margin:0"><table class="tbl-ik"><thead><tr><th>Iklan</th><th>Status</th><th>Periode</th><th class="n">Biaya</th><th class="n">Hasil</th><th class="n">Biaya / hasil</th><th>Penilaian</th><th></th></tr></thead><tbody>'
        + gp.iklan.map(function(r){
          var c = biayaHasil(r);
          return '<tr><td><b style="color:var(--ink)">' + esc(r.nama || '(tanpa nama)') + '</b><div style="font-size:11px;color:var(--muted)">' + esc(r.kampanye) + '</div></td>'
            + '<td>' + esc(IKLAN_STATUS[r.status] || r.status || '—') + '</td>'
            + '<td style="white-space:nowrap">' + (r.tgl_mulai ? esc(fmtTgl(r.tgl_mulai)) + (r.tgl_selesai ? ' – ' + esc(fmtTgl(r.tgl_selesai)) : '') : '—') + '</td>'
            + '<td class="n">' + rupiah(r.spend) + '</td><td class="n">' + (r.hasil_label ? angka(r.hasil_n) + ' ' + esc(r.hasil_label.toLowerCase()) : '—') + '</td>'
            + '<td class="n">' + (c == null ? '—' : rupiah(c)) + '</td><td><span class="nilai ' + r._nilai + '">' + NILAI_LBL[r._nilai] + '</span></td><td>' + tombolKelolaIklan(r.ad_id) + '</td></tr>';

/* ===================== PERTUMBUHAN ===================== */
/* 14 Okt 2026, permintaan user: kenaikan views, likes, reach, komentar,
   share, save & follower, dan apakah iklan berpengaruh.
   Instagram: insight AKUN per hari dari Instagram API (riwayat ditarik
   bertahap sampai 90 hari). TikTok: API-nya tidak punya insight harian, jadi
   yang ada potret follower & total likes akun tiap sinkron — kenaikannya
   selisih antar potret, dan baru mulai terkumpul sejak fitur ini ada. */
var TUMBUH_IKLAN_MIN = 10000;   /* hari dengan biaya iklan >= ini = "hari beriklan" */
function muatTumbuh(){
  var k = String(ST.tumbuhHari);
  if (ST.tumbuhSrv[k] || ST.tumbuhSibuk === k) return;
  ST.tumbuhSibuk = k;
  api('campaignTumbuh', { hari: ST.tumbuhHari }).then(function(d){ ST.tumbuhSrv[k] = { data: d }; })
    .catch(function(e){ ST.tumbuhSrv[k] = { galat: e.message }; })
    .then(function(){ if (ST.tumbuhSibuk === k) ST.tumbuhSibuk = ''; if (VIEW === 'tumbuh') render(); });
}
function tglGeser(t, n){ var d = new Date(t + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0,10); }
function pctUbah(kini, lalu){
  if (kini == null || lalu == null || lalu === 0) return '';
  var p = (kini - lalu) / lalu * 100, r = Math.round(p);
  return ' <span class="' + (p >= 0 ? 'naik' : 'turun') + '">' + (p >= 0 ? '▲' : '▼') + ' ' + Math.abs(r) + '%</span>';
}
function vTumbuh(){
  var hasil = ST.tumbuhSrv[String(ST.tumbuhHari)];
  if (!hasil) muatTumbuh();
  var seg = '<div class="seg">' + [[7,'7 hari'],[30,'30 hari'],[90,'90 hari']].map(function(x){
    return '<button class="' + (ST.tumbuhHari === x[0] ? 'on' : '') + '" data-a="tumbuh-hari" data-v="' + x[0] + '">' + x[1] + '</button>'; }).join('') + '</div>'
    + ' <div class="seg">' + [['instagram','Instagram'],['tiktok','TikTok']].map(function(x){
    return '<button class="' + (ST.tumbuhPlat === x[0] ? 'on' : '') + '" data-a="tumbuh-plat" data-v="' + x[0] + '">' + x[1] + '</button>'; }).join('') + '</div>';
  var kepala = '<div class="kartu"><div style="display:flex;flex-wrap:wrap;gap:8px">' + seg + '</div></div>';
  if (!hasil) return kepala + '<div class="kartu"><div class="kosong">Memuat…</div></div>';
  if (hasil.galat) return kepala + '<div class="kartu"><div class="pita err">Data pertumbuhan tidak bisa dimuat: ' + esc(hasil.galat) + '</div></div>';

function jumlahKol(per, dari, sampai, k){

/* PENGARUH IKLAN: rata-rata per hari di hari BERIKLAN vs hari TANPA iklan.

  var baris = [['views','Views'],['reach','Reach'],['interaksi','Interaksi'],['follower_baru','Follower baru']].map(function(x){

/* ===================== GOOGLE REVIEW =====================
   17 Okt 2026, permintaan user. Dua sumber (lihat lib_greview.php):
   Google Business Profile — seluruh review + bisa DIBALAS dari sini;
   Places API — 5 review per tarikan, baca saja. Prioritas "perlu ditangani"
   DIHITUNG di layar (grSkor), bukan disimpan: bobotnya bisa disetel ulang
   tanpa menyentuh data, dan penanda AI terbaru langsung ikut. */
function muatGreview(){
  if (ST.grSibuk) return;
  ST.grSibuk = true;
  api('campaignGoogle').then(function(d){ ST.grSrv = { data: d }; })
    .catch(function(e){ ST.grSrv = { galat: e.message }; })
    .then(function(){ ST.grSibuk = false; if (VIEW === 'greview') render(); else gambarNav(); });
}
function grSinkron(diam){
  ST.grSync = true; if (!diam) render();
  return api('campaignGoogleSync').then(function(r){
    if (!diam) toast(r.jumlah + ' review diperbarui dari Google.' + (r.galat && r.galat.length ? ' Sebagian gagal — lihat keterangan di halaman.' : ''), !!(r.galat && r.galat.length));
  }).catch(function(e){ if (!diam) toast(e.message, true); })
    .then(function(){ ST.grSync = false; ST.grSrv = null; muatGreview(); });
}
function grData(){ return ST.grSrv && ST.grSrv.data ? ST.grSrv.data : null; }
function grAIPeta(){
  var d = grData(), m = {};
  if (d && d.ai && d.ai.tangani) d.ai.tangani.forEach(function(t){ m[t.id] = t; });
  return m;
}
function grBintang(n){ n = Math.round(num(n)); var s = ''; for (var i = 1; i <= 5; i++) s += i <= n ? '★' : '<i>★</i>'; return '<span class="bintang">' + s + '</span>'; }
function grUmurHari(r){ return r.waktu_ms ? (Date.now() - num(r.waktu_ms)) / 86400e3 : 999; }
/* Skor prioritas: bintang rendah paling berat, lalu keluhan panjang ("tamu
   yang complain banyak"), lalu yang terbaru, lalu penanda AI. Yang sudah
   dibalas turun sedikit — tamunya sudah mendapat jawaban publik, tapi tindak
   lanjut di dalam belum tentu selesai. */
function grSkor(r, ai){
  if (+r.ditangani === 1) return 0;
  var bobot = { 1: 100, 2: 80, 3: 50, 4: 12, 5: 0 }[+r.rating] || 0;
  var t = ai[r.id];
  if (!bobot && !t) return 0;
  var umur = grUmurHari(r);
  var s = bobot + Math.min(25, String(r.teks || '').length / 30)
    + (umur <= 3 ? 25 : umur <= 7 ? 15 : umur <= 30 ? 5 : 0)
    + (t ? ({ segera: 40, tinggi: 25, sedang: 10 }[t.urgensi] || 0) : 0)
    - (r.balasan ? 20 : 0);
  return Math.max(0, Math.round(s));
}
function grTingkat(skor){ return skor >= 110 ? 'segera' : skor >= 75 ? 'tinggi' : skor >= 40 ? 'sedang' : ''; }
var GR_TINGKAT_LBL = { segera: 'Segera', tinggi: 'Tinggi', sedang: 'Sedang' };
function grHitungSegera(){
  var d = grData(); if (!d) return 0;
  var ai = grAIPeta();
  return (d.review || []).filter(function(r){ return grTingkat(grSkor(r, ai)) === 'segera'; }).length;
}
function grTempatNama(id){
  var d = grData(), t = d ? (d.tempat || []).filter(function(x){ return x.id === id; })[0] : null;
  return t ? (t.nama || t.id) : '';
}
/* Daftar yang tampil sesuai saringan. Bukti AI yang sedang difokuskan
   (grFokus) MENANG atas saringan lain — kalau tidak, menekan "lihat bukti"
   bisa memulangkan daftar kosong karena saringannya bertabrakan. */
function grSaring(){
  var d = grData(), ai = grAIPeta();
  var semua = (d.review || []).map(function(r){ var x = Object.assign({}, r); x._skor = grSkor(r, ai); x._tingkat = grTingkat(x._skor); return x; });
  if (ST.grTempat) semua = semua.filter(function(r){ return r.tempat_id === ST.grTempat; });
  if (ST.grFokus) {
    var f = {}; ST.grFokus.ids.forEach(function(i){ f[i] = 1; });
    return semua.filter(function(r){ return f[r.id]; });
  }
  var s = ST.grSaring, q = ST.grQ.toLowerCase();
  var out = semua.filter(function(r){
    if (s === 'tangani' && !r._tingkat) return false;
    if (s === 'rendah' && !(+r.rating <= 3)) return false;
    if (s === 'belum' && (r.balasan || r.sumber !== 'gbp')) return false;
    if (s === 'dibalas' && !r.balasan) return false;
    if (s === 'selesai' && +r.ditangani !== 1) return false;
    if (q && (String(r.penulis) + ' ' + String(r.teks || '') + ' ' + String(r.balasan || '')).toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
  if (s === 'tangani') out.sort(function(a, b){ return b._skor - a._skor || num(b.waktu_ms) - num(a.waktu_ms); });
  return out;
}

function grKartuSumber(d, s, gAkun){

      + 'Untuk menarik SELURUH review dan membalasnya dari sini, hubungkan <b>Google Business Profile</b> dengan akun Google pemilik/manager profil bisnisnya.'
      + (admin() ? (s.googleOauthSiap ? ' <button class="btn btn-primary btn-sm" data-a="gr-hubung" style="margin-left:6px">Hubungkan</button>' : ' Isi Client ID & secret-nya dulu di <a href="#pengaturan">Pengaturan</a>.') : '')
      + '</div>';
  }
  if (tempat.length) {
    h += '<div class="grid g3">' + tempat.map(function(t){
      return '<div class="akun"><div class="nm" style="margin-top:0">' + esc(t.nama || t.id) + '</div><div class="ket">' + esc(t.alamat || '') + '</div>'
        + '<div style="margin-top:8px">' + (t.rating != null ? grBintang(t.rating) + ' <b>' + num(t.rating).toFixed(1).replace('.', ',') + '</b>' : '<span class="ket">rating belum terbaca</span>')
        + (t.total != null ? ' <span class="ket">· ' + angka(t.total) + ' ulasan</span>' : '') + '</div>'
        + '<div class="ket" style="margin-top:6px">' + (t.sumber === 'gbp' ? 'Business Profile' : 'Places API') + ' · ' + esc(t.sync_at > 0 ? fmtWaktu(t.sync_at) : 'belum ditarik') + '</div>'
        + (t.galat ? '<div class="pita err" style="margin:8px 0 0">' + esc(t.galat) + '</div>' : '')
        + (/^https:\/\//i.test(t.url || '') ? '<div class="aksi"><a href="' + esc(t.url) + '" target="_blank" rel="noopener" style="font-size:12px">Buka di Google Maps ↗</a></div>' : '') + '</div>';
    }).join('') + '</div>';
  }
  return h + '</div>';
}

function grKartuRingkas(d){
  var rev = (d.review || []).filter(function(r){ return !ST.grTempat || r.tempat_id === ST.grTempat; });
  var ai = grAIPeta();
  var dist = [0, 0, 0, 0, 0, 0];
  rev.forEach(function(r){ dist[Math.max(0, Math.min(5, +r.rating))]++; });
  var segera = 0, perlu = 0, belumBalas = 0;
  rev.forEach(function(r){ var t = grTingkat(grSkor(r, ai)); if (t) perlu++; if (t === 'segera') segera++; if (r.sumber === 'gbp' && !r.balasan && +r.rating <= 3) belumBalas++; });
  var bln = rev.filter(function(r){ return grUmurHari(r) <= 30; });
  var rata = bln.length ? bln.reduce(function(a, r){ return a + num(r.rating); }, 0) / bln.length : null;
  /* Naik/turun rating Google: dari potret harian (Google tidak menyimpan
     riwayatnya, jadi baru terkumpul sejak fitur ini ada). */
  var tren = '';
  var t0 = (d.tempat || []).filter(function(t){ return +t.aktif === 1 && (!ST.grTempat || t.id === ST.grTempat); })[0];
  if (t0) {
    var hs = (d.harian || []).filter(function(x){ return x.tempat_id === t0.id && x.rating != null; });
    if (hs.length > 1) {
      var lama = hs[0], baru = hs[hs.length - 1], sel = num(baru.rating) - num(lama.rating);
      tren = 'Rating ' + (sel >= 0 ? '<span class="naik">▲ ' : '<span class="turun">▼ ') + Math.abs(sel).toFixed(2).replace('.', ',') + '</span> sejak ' + esc(fmtTgl(lama.tgl));
    }
  }
  var maks = Math.max.apply(null, dist.slice(1)) || 1;
  return '<div class="grid g4" style="margin-bottom:18px">'
    + '<div class="stat"><div class="l">Perlu segera</div><div class="v">' + segera + '</div><div class="f">dari ' + perlu + ' yang perlu ditangani</div></div>'
    + '<div class="stat"><div class="l">Keluhan belum dibalas</div><div class="v">' + belumBalas + '</div><div class="f">bintang 1–3, Business Profile</div></div>'
    + '<div class="stat"><div class="l">Rata-rata 30 hari</div><div class="v">' + (rata == null ? '—' : rata.toFixed(2).replace('.', ',')) + '</div><div class="f">' + bln.length + ' review baru' + (tren ? ' · ' + tren : '') + '</div></div>'
    + '<div class="stat"><div class="l">Sebaran bintang</div><div class="gr-dist" style="margin-top:8px">'
    + [5, 4, 3, 2, 1].map(function(b){ return '<span>' + b + ' ★</span><div class="bar"><span style="width:' + Math.round(dist[b] / maks * 100) + '%"></span></div><span style="text-align:right">' + dist[b] + '</span>'; }).join('')
    + '</div></div></div>'
    + (d.totalTersimpan > (d.review || []).length ? '<div class="pita info">Menampilkan ' + (d.review || []).length + ' review terbaru dari ' + d.totalTersimpan + ' yang tersimpan.</div>' : '');
}

function grKartuAI(d){
  var siap = D.setting && D.setting.aiSiap, A = d.ai;
  var seg = '<div class="seg">' + [[30, '30 hari'], [90, '90 hari'], [180, '180 hari'], [365, '1 tahun']].map(function(x){
    return '<button class="' + (ST.grAIHari === x[0] ? 'on' : '') + '" data-a="gr-ai-hari" data-v="' + x[0] + '">' + x[1] + '</button>'; }).join('') + '</div>';
  var h = '<div class="kartu"><div class="kepala"><div><h2>Analisa AI</h2><div class="sub">AI membaca review tamu lalu merangkum apa yang disukai, apa yang harus ditingkatkan, dan review mana yang harus segera ditangani — lengkap dengan draf balasan. Hasilnya saran; tidak ada yang terkirim ke Google tanpa ditekan.</div></div>'
    + '<div class="r">' + seg + '<button class="btn btn-primary btn-sm" data-a="gr-ai"' + (siap && !ST.grAIJalan ? '' : ' disabled') + '>' + (ST.grAIJalan ? 'Menganalisa…' : '⚡ Analisa review') + '</button></div></div>';
  if (!siap) h += '<div class="pita warn">API key AI belum diisi di Pengaturan.</div>';
  if (ST.grAIJalan) h += '<div class="agen"><div class="putar"></div><div>AI sedang membaca review… biasanya 1–2 menit.</div></div>';
  if (ST.grAIGalat && !ST.grAIJalan) h += '<div class="pita err"><b>Analisa gagal:</b> ' + esc(ST.grAIGalat) + '</div>';
  if (!A) return h + (ST.grAIJalan ? '' : '<div class="kosong">Belum ada analisa. Pilih rentang lalu tekan Analisa review.</div>') + '</div>';
  var m = A.meta || {};
  h += '<div class="sub" style="margin:4px 0 10px">Analisa ' + esc(fmtWaktu(m.at)) + (m.oleh ? ' oleh ' + esc(m.oleh) : '') + ' · ' + num(m.jumlah) + ' review, ' + num(m.hari) + ' hari terakhir'
    + (m.tempat ? ' · ' + esc(grTempatNama(m.tempat)) : '') + ' · ' + esc(m.model || '') + '</div>';
  if (A.ringkasan) h += '<div class="pita info">' + esc(A.ringkasan) + '</div>';
  if (A.sentimen) h += '<div class="sub">Sentimen: <span class="naik">' + num(A.sentimen.positif) + ' positif</span> · ' + num(A.sentimen.netral) + ' netral · <span class="turun">' + num(A.sentimen.negatif) + ' negatif</span></div>';
  var bukti = function(ids, label){ return ids && ids.length ? ' <a href="#" data-a="gr-fokus" data-v="' + esc(ids.join(',')) + '" data-l="' + esc(label) + '" style="font-size:12px">lihat ' + ids.length + ' review ↓</a>' : ''; };
  if (A.perbaikan && A.perbaikan.length) {
    h += '<h2 style="margin-top:14px">Yang harus ditingkatkan</h2><table class="tbl-ik"><thead><tr><th>Prioritas</th><th>Area</th><th>Masalah</th><th>Saran</th></tr></thead><tbody>'
      + A.perbaikan.map(function(p){
        var cls = p.prioritas === 'tinggi' ? 'segera' : p.prioritas === 'sedang' ? 'tinggi' : 'sedang';
        return '<tr><td><span class="prio ' + cls + '">' + esc(p.prioritas) + '</span></td><td>' + esc(p.area) + '</td><td><b>' + esc(p.masalah) + '</b>'
          + (p.jumlah ? '<div class="ket" style="font-size:11.5px;color:var(--muted)">disebut ±' + num(p.jumlah) + ' review</div>' : '') + bukti(p.bukti, p.masalah) + '</td><td>' + esc(p.saran) + '</td></tr>';
      }).join('') + '</tbody></table>';
  }
  if (A.kekuatan && A.kekuatan.length) {
    h += '<h2 style="margin-top:14px">Yang disukai tamu (pertahankan)</h2><ul style="margin:6px 0 0 18px;font-size:13px;line-height:1.6">'
      + A.kekuatan.map(function(k){ return '<li><b>' + esc(k.tema) + '</b> — ' + esc(k.penjelasan) + bukti(k.bukti, k.tema) + '</li>'; }).join('') + '</ul>';
  }
  if (A.tangani && A.tangani.length) {
    h += '<div class="pita warn" style="margin-top:14px"><b>' + A.tangani.length + ' review ditandai AI harus ditangani</b> — muncul paling atas di saringan <b>Perlu ditangani</b>, lengkap dengan alasan, tindakan, dan draf balasannya.'
      + bukti(A.tangani.map(function(t){ return t.id; }), 'ditandai AI') + '</div>';
  }
  return h + '</div>';
}

function grKartuDaftar(d){
  var tempat = (d.tempat || []);
  var pilihTempat = tempat.length > 1 ? '<select data-a="gr-tempat" style="padding:7px 10px;border-radius:9px;border:1px solid var(--k-line-hard);font-family:inherit">'
    + '<option value="">Semua tempat</option>' + tempat.map(function(t){ return '<option value="' + esc(t.id) + '"' + (ST.grTempat === t.id ? ' selected' : '') + '>' + esc(t.nama || t.id) + (+t.aktif === 1 ? '' : ' (nonaktif)') + '</option>'; }).join('') + '</select>' : '';

    return '<button class="' + (ST.grSaring === x[0] && !ST.grFokus ? 'on' : '') + '" data-a="gr-saring" data-v="' + x[0] + '">' + x[1] + '</button>'; }).join('') + '</div>';

function grDaftarHtml(){
  var d = grData(); if (!d) return '';
  var baris = grSaring(), ai = grAIPeta();
  var h = '';
  if (ST.grFokus) h += '<div class="pita info">Menampilkan ' + baris.length + ' review bukti: <b>' + esc(ST.grFokus.label) + '</b>. <a href="#" data-a="gr-fokus-lepas">Tampilkan semua</a></div>';
  if (!baris.length) {
    var kata = { tangani: 'Tidak ada review yang perlu ditangani. 🎉', belum: 'Semua keluhan Business Profile sudah dibalas.', rendah: 'Tidak ada review bintang 1–3.',
      dibalas: 'Belum ada review yang dibalas.', selesai: 'Belum ada review yang ditandai sudah ditangani.', semua: 'Belum ada review tersimpan. Tekan Sinkronkan.' };
    return h + '<div class="kosong">' + (ST.grQ ? 'Tidak ada review yang cocok dengan "' + esc(ST.grQ) + '".' : kata[ST.grSaring] || 'Kosong.') + '</div>';
  }
  baris.slice(0, ST.grBatas).forEach(function(r){ h += grItemHtml(r, ai[r.id]); });
