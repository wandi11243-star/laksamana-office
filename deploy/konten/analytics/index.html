  return h;
}

function grItemHtml(r, t){
  var foto = /^https:\/\//i.test(r.foto || '') ? '<img class="gr-av" src="' + esc(r.foto) + '" alt="" referrerpolicy="no-referrer">'
    : '<span class="gr-av" style="background:#9b8b72">' + esc(String(r.penulis || '?').charAt(0).toUpperCase()) + '</span>';
  var bisaBalas = r.sumber === 'gbp';
  var h = '<div class="gr-item ' + (r._tingkat || '') + '" id="gr-' + esc(r.id) + '"><div class="gr-kepala">' + foto
    + '<div><div class="nm">' + esc(r.penulis || 'Pengguna Google') + '</div><div style="font-size:12px;color:var(--muted)">' + grBintang(r.rating) + ' · ' + esc(r.waktu_ms ? fmtWaktu(r.waktu_ms) : '—')
    + (grData().tempat.length > 1 ? ' · ' + esc(grTempatNama(r.tempat_id)) : '') + '</div></div><div class="r">'
    + (r._tingkat ? '<span class="prio ' + r._tingkat + '" title="Skor prioritas ' + r._skor + '">' + GR_TINGKAT_LBL[r._tingkat] + '</span>' : '')
    + (+r.ditangani === 1 ? '<span class="prio ok">Sudah ditangani</span>' : '')
    + (r.balasan ? '<span class="prio ok">Dibalas</span>' : '')
    + (!bisaBalas ? '<span class="chip p-lain" title="Ditarik lewat Places API — tidak bisa dibalas dari sini">Places</span>' : '') + '</div></div>'
    + (r.teks ? '<div class="gr-teks">' + esc(r.teks) + '</div>' : '<div class="gr-teks" style="color:var(--muted)">(hanya memberi bintang, tanpa tulisan)</div>');
  if (t && +r.ditangani !== 1) {
    h += '<div class="gr-ai"><b>⚡ AI: ' + esc(GR_TINGKAT_LBL[t.urgensi] || t.urgensi) + '</b> — ' + esc(t.alasan)
      + (t.tindakan ? '<br><b>Tindak lanjut:</b> ' + esc(t.tindakan) : '') + '</div>';
  }
  if (r.balasan) {
    h += '<div class="gr-balasan"><b>Balasan bisnis' + (r.balasan_at > 0 ? ' · ' + esc(fmtWaktu(r.balasan_at)) : '') + (r.balasan_oleh ? ' · dikirim ' + esc(r.balasan_oleh) + ' dari sistem' : '') + '</b>' + esc(r.balasan) + '</div>';
  }
  if (+r.ditangani === 1) {
    h += '<div style="font-size:12px;color:var(--muted);margin-top:8px">✓ Ditangani ' + esc(r.tangani_oleh || '') + ' · ' + esc(fmtWaktu(r.tangani_at))
      + (r.tangani_catatan ? ' — ' + esc(r.tangani_catatan) : '') + '</div>';
  }
  h += '<div class="gr-aksi">';
  if (bisaBalas) h += '<button class="btn ' + (r.balasan ? 'btn-ghost' : 'btn-primary') + ' btn-sm" data-a="gr-buka" data-v="' + esc(r.id) + '">' + (ST.grBuka === r.id ? 'Tutup' : r.balasan ? 'Ubah balasan' : 'Balas') + '</button>';
  else if (/^https:\/\//i.test(r.url || '')) h += '<a class="btn btn-ghost btn-sm" href="' + esc(r.url) + '" target="_blank" rel="noopener">Balas di Google ↗</a>';
  h += +r.ditangani === 1 ? '<button class="btn btn-ghost btn-sm" data-a="gr-tangani-batal" data-v="' + esc(r.id) + '">Batalkan tanda ditangani</button>'
    : '<button class="btn btn-ghost btn-sm" data-a="gr-tangani" data-v="' + esc(r.id) + '">Tandai sudah ditangani</button>';
  if (bisaBalas && r.balasan && admin()) h += '<a href="#" data-a="gr-balas-hapus" data-v="' + esc(r.id) + '" style="font-size:12px;color:var(--danger)">Hapus balasan</a>';
  h += '</div>';
  if (ST.grBuka === r.id && bisaBalas) {
    var draf = ST.grDraf[r.id] != null ? ST.grDraf[r.id] : (r.balasan || '');
    var tandai = ST.grTandai[r.id] != null ? ST.grTandai[r.id] : (+r.rating <= 3);
    h += '<div class="gr-kotak"><textarea id="gr-teks" data-a="gr-ketik" data-v="' + esc(r.id) + '" maxlength="4000" placeholder="Tulis balasan… terbit publik di Google Maps atas nama bisnis.">' + esc(draf) + '</textarea>'
      + '<div class="gr-aksi">'
      + (t && t.usulanBalasan ? '<button class="btn btn-ghost btn-sm" data-a="gr-pakai-usulan" data-v="' + esc(r.id) + '">Pakai draf dari analisa AI</button>' : '')
      + '<button class="btn btn-ghost btn-sm" data-a="gr-draf-ai" data-v="' + esc(r.id) + '"' + (ST.grDrafJalan === r.id || !(D.setting && D.setting.aiSiap) ? ' disabled' : '') + '>' + (ST.grDrafJalan === r.id ? 'Menulis…' : '⚡ Buat draf AI') + '</button>'
      + '<label style="font-size:12.5px;display:inline-flex;gap:6px;align-items:center"><input type="checkbox" data-a="gr-tandai" data-v="' + esc(r.id) + '"' + (tandai ? ' checked' : '') + '> sekalian tandai sudah ditangani</label>'
      + '<button class="btn btn-primary btn-sm" style="margin-left:auto" data-a="gr-kirim" data-v="' + esc(r.id) + '"' + (ST.grKirim === r.id ? ' disabled' : '') + '>' + (ST.grKirim === r.id ? 'Mengirim…' : 'Kirim ke Google') + '</button>'
      + '</div></div>';
  }
  return h + '</div>';
}

document.addEventListener('click', function(ev){
  var el = ev.target.closest('[data-a]'); if (!el) return;
  var a = el.getAttribute('data-a'), v = el.getAttribute('data-v'), i = +el.getAttribute('data-i');
  if (a === 'latar') { if (ev.target === el) tutupModal(); return; }
  /* Tautan ber-data-a milik Google Review (href="#") ditangani di bawah dan
     masing-masing memanggil preventDefault — kalau tidak, hash jadi kosong
     dan halaman memantul ke Insight. */
  if (el.tagName === 'A' && a !== 'tutup' && a.indexOf('gr-') !== 0) return;
  if (a === 'tutup') { tutupModal(); return; }
  if (a === 'top-plat') { ST.topPlat = v; ST.topHal = 1; render(); return; }
  if (a === 'top-urut') { ST.topUrut = v; ST.topHal = 1; render(); return; }
  if (a === 'top-hal') { ST.topHal = +v; render(); return; }
  if (a === 'top-rentang') { ST.topRentang = v; ST.topHal = 1; render(); return; }
  if (a === 'top-rinci') {
    var hb = ST.topSrv[topKunci()], eb = hb && hb.data && hb.data.baris ? hb.data.baris[i] : null; if (!eb) return;
    var kb = topKunciBaris(eb); ST.topBuka = ST.topBuka === kb ? '' : kb; render(); return;
  }
  if (a === 'top-ulang') { delete ST.topSrv[topKunci()]; render(); return; }
  if (a === 'ins-plat') { ST.insPlat = v; render(); return; }
  if (a === 'ins-arsip') { ST.insArsip = !ST.insArsip; render(); return; }
  if (a === 'ins-baru') { formInsight({}); return; }
  if (a === 'jadikan') {
    var hs = ST.topSrv[topKunci()], e = hs && hs.data && hs.data.baris ? hs.data.baris[i] : null; if (!e) return;
    formInsight({ platform: e.platform, url: e.url, tglTayang: e.tanggal, metrik: metrikTeks(e), sumber: (e.sumber === 'tiktok' || e.sumber === 'instagram') ? e.sumber : 'konten' });
    return;
  }
  if (a === 'usulan-pakai') { var u = ST.usulan[i]; formInsight({ platform: u.platform, kategori: u.kategori, temuan: u.temuan, url: u.url, tglTayang: u.tglTayang, metrik: u.metrik, aksi: u.aksi, sumber: 'ai' }); return; }
  if (a === 'ins-simpan') { simpanInsight(); return; }
  if (a === 'ins-ubah') { var x = D.insight[i]; formInsight({ id: x.id, platform: x.platform, kategori: x.kategori, temuan: x.temuan, url: x.url, tglTayang: x.tgl_tayang, metrik: x.metrik, aksi: x.aksi, sumber: x.sumber }); return; }
  if (a === 'ins-kal') { var y = D.insight[i]; formJadwal({ platform: platNorm(y.platform), judul: y.aksi || '', catatan: y.temuan, insightId: y.id, status: 'DRAF' }); return; }
  if (a === 'ins-arsipkan') {
    var z = D.insight[i];
    api('campaignInsightArsip', { id: z.id, arsip: +z.arsip !== 1 }).then(function(){ toast(+z.arsip === 1 ? 'Insight dipulihkan.' : 'Insight diarsipkan.'); return muat(); })
      .catch(function(e){ toast(e.message, true); }).then(render);
    return;
  }
  if (a === 'pf-r' || a === 'pf-fokus') {
    var po = perDariKunci(el.getAttribute('data-k'));
    if (el.getAttribute('data-k') === 'riset') simpanIsiRiset();
    if (el.getAttribute('data-k') === 'bank') simpanIsiBank();
    if (a === 'pf-r') po.r = v;
    else { var fi = po.fokus.indexOf(v); if (fi >= 0) po.fokus.splice(fi, 1); else po.fokus.push(v); }
    render(); return;
  }
  if (a === 'usulan') {
    var pu = kirimPer(ST.usulanPer);
    if (!pu) { toast('Isi tanggal mulai dan akhir rentangnya dulu.', true); return; }
    ST.usulanJalan = true; ST.usulan = null; render();
    api('campaignInsightAI', pu).then(function(r){ ST.usulan = r.usulan || []; }).catch(function(e){ toast(e.message, true); })
      .then(function(){ ST.usulanJalan = false; render(); });
    return;
  }
  if (a === 'tt-hubung') {
    api('campaignTiktokMulai').then(function(r){ location.href = r.url; }).catch(function(e){ toast(e.message, true); });
    return;
  }
  if (a === 'tt-sync') { tiktokSync(false); return; }
  if (a === 'ig-hubung') {
    api('campaignIgMulai').then(function(r){ location.href = r.url; }).catch(function(e){ toast(e.message, true); });
    return;
  }
  if (a === 'ig-sync') { igSync(false); return; }
  if (a === 'iklan-pe') { ST.iklanPe = v; render(); return; }
  if (a === 'ads-kelola') { bukaKelolaIklan(v); return; }
  if (a === 'iklan-jalan-muat') { muatJalanIklan(true); return; }
  if (a === 'ads-status') {
    var ot = el.getAttribute('data-t'), oo = MODAL_DATA && MODAL_DATA.info && MODAL_DATA.info[ot]; if (!oo) return;
    ubahIklan(ot, { status: v }, (v === 'PAUSED' ? 'Jeda ' : 'Lanjutkan ') + ADS_TINGKAT[ot].toLowerCase() + ' "' + (oo.nama || oo.id) + '"?'
      + (v === 'PAUSED' && ot === 'kampanye' ? '\n\nSeluruh set iklan & iklan di dalam kampanye ini ikut berhenti.' : '')
      + (v === 'ACTIVE' ? '\n\nIklan akan kembali menghabiskan budget.' : ''));
    return;
  }
  if (a === 'ads-bud-geser') {
    var ib = document.getElementById('ads-bud-' + el.getAttribute('data-t')), ob = MODAL_DATA.info[el.getAttribute('data-t')];
    if (ib && ob) ib.value = Math.round(num(ob.budget) * parseFloat(v) / 1000) * 1000;
    return;
  }
  if (a === 'ads-budget') {
    var tb = el.getAttribute('data-t'), obb = MODAL_DATA && MODAL_DATA.info && MODAL_DATA.info[tb]; if (!obb) return;
    var baru = Math.round(num(nilai('ads-bud-' + tb)));
    if (!(baru > 0)) { toast('Isi budget baru lebih dari nol.', true); return; }
    if (baru === Math.round(num(obb.budget))) { toast('Budget-nya sama dengan sekarang.', true); return; }
    ubahIklan(tb, { budget: baru }, 'Ubah budget ' + obb.budgetJenis + ' ' + ADS_TINGKAT[tb].toLowerCase() + ' "' + (obb.nama || obb.id) + '"\n\n'
      + rupiah(obb.budget) + '  →  ' + rupiah(baru) + '\n\nBerlaku langsung di Meta Ads.');
    return;
  }
  if (a === 'iklan-nilai') { ST.iklanNilai = v; render(); return; }
  if (a === 'iklan-label') { ST.iklanLabel = v; render(); return; }
  if (a === 'iklan-sync') { iklanSinkron(false); return; }
  if (a === 'iklan-status') { ST.iklanStatus = v; render(); return; }
  if (a === 'iklan-tampil') { ST.iklanTampil = v; ST.iklanBukaPost = ''; render(); return; }
  if (a === 'iklan-buka-post') { ST.iklanBukaPost = ST.iklanBukaPost === v ? '' : v; var wb = document.getElementById('iklan-daftar'); if (wb) wb.innerHTML = tabelIklanHtml(ST.iklanRows); return; }
  /* Google Review */
  if (a === 'gr-ulang') { ST.grSrv = null; render(); return; }
  if (a === 'gr-sync') { grSinkron(false); return; }
  if (a === 'gr-hubung') { api('campaignGoogleMulai').then(function(r){ location.href = r.url; }).catch(function(e){ toast(e.message, true); }); return; }
  if (a === 'gr-putus') {
    ev.preventDefault();
    if (!confirm('Putuskan Google Business Profile? Review yang sudah ditarik tetap tersimpan; sinkron & membalas berhenti sampai dihubungkan lagi.')) return;
    api('campaignGooglePutus').then(function(){ toast('Google Business Profile diputus.'); ST.grSrv = null; return muat(); }).catch(function(e){ toast(e.message, true); }).then(render);
    return;
  }
  if (a === 'gr-saring') { ST.grSaring = v; ST.grFokus = null; ST.grBatas = 30; render(); return; }
  if (a === 'gr-lagi') { ST.grBatas += 30; grGambarDaftar(); return; }
  if (a === 'gr-fokus') {
    ev.preventDefault();
    ST.grFokus = { ids: String(v || '').split(',').filter(Boolean), label: el.getAttribute('data-l') || '' };
    ST.grBatas = 200; render();
    var kd = document.getElementById('gr-kartu-daftar'); if (kd && kd.scrollIntoView) kd.scrollIntoView({ behavior: 'smooth' });

  }
  if (a === 'gr-fokus-lepas') { ev.preventDefault(); ST.grFokus = null; ST.grBatas = 30; render(); return; }
  if (a === 'gr-ai-hari') { ST.grAIHari = +v; render(); return; }
  if (a === 'gr-ai') {
    ST.grAIJalan = true; ST.grAIGalat = ''; render();
    api('campaignGoogleAI', { hari: ST.grAIHari, tempat: ST.grTempat }).then(function(r){ var dd = grData(); if (dd) dd.ai = r; toast('Analisa selesai.'); })
      .catch(function(e){ ST.grAIGalat = e.message || 'Gagal tanpa keterangan'; })
      .then(function(){ ST.grAIJalan = false; render(); });
    return;
  }
  if (a === 'gr-buka') { ST.grBuka = ST.grBuka === v ? '' : v; grGambarDaftar(); var tx = document.getElementById('gr-teks'); if (tx) tx.focus(); return; }
  if (a === 'gr-pakai-usulan') {

  }
  if (a === 'gr-kirim') {

    var tandai = ST.grTandai[v] != null ? ST.grTandai[v] : (+rk.rating <= 3);
    ST.grKirim = v; grGambarDaftar();
    api('campaignGoogleBalas', { id: v, teks: isi }).then(function(r){
      rk.balasan = isi; rk.balasan_at = r.at; rk.balasan_oleh = SESI.name || '';
      delete ST.grDraf[v]; ST.grBuka = '';
      toast('Balasan terkirim ke Google.');

        .then(function(){ rk.ditangani = 1; rk.tangani_oleh = SESI.name || ''; rk.tangani_at = Date.now(); rk.tangani_catatan = 'Dibalas di Google'; });
    }).catch(function(e){ toast(e.message, true); })
      .then(function(){ ST.grKirim = ''; render(); });
    return;
  }
  if (a === 'gr-balas-hapus') {
    ev.preventDefault();

  if (a === 'gr-tangani' || a === 'gr-tangani-batal') {
    var rt = grCariReview(v); if (!rt) return;

    if (ya) { cat = prompt('Catatan tindak lanjut (opsional) — mis. "tamu sudah dihubungi, voucher diberikan":', ''); if (cat === null) return; }

  }
  if (a === 'gr-tempat-tambah') {

  /* Bank Konten */
  if (a === 'bank-st') { ST.bankSt = v; render(); return; }
  if (a === 'bank-plat') { ST.bankPlat = v; render(); return; }
  if (a === 'bank-tambah') { formBank(); return; }
  if (a === 'bank-simpan') { simpanBank(); return; }
  if (a === 'bank-ubah') { var bu = (D.bank || [])[i]; if (bu) formBank(bu); return; }
  if (a === 'bank-jadwal') {
    var bj = (D.bank || [])[i]; if (!bj) return;
    formJadwal({ platform: platNorm(bj.platform), judul: bj.judul, caption: (bj.hook ? 'Hook: ' + bj.hook + '\n\n' : '') + (bj.caption || ''),
      tanggal: bj.tanggal || '', jam: bj.jam || '', status: 'TERJADWAL', catatan: 'Dari Bank Konten' + (bj.pilar ? ' · ' + bj.pilar : ''), bankId: bj.id });
    return;
  }
  /* Hapus permanen: hanya ide yang sudah diarsipkan (server menegakkan juga).
     Pertanyaannya MENYEBUT judulnya — konfirmasi tanpa isi cuma melatih orang
     menekan OK. */
  if (a === 'bank-hapus') {
    var bh = (D.bank || [])[i]; if (!bh || bh.status !== 'ARSIP') return;
    if (!confirm('Hapus permanen ide "' + bh.judul + '"?\n\nTidak bisa dikembalikan. Jadwal yang pernah dibuat dari ide ini tetap ada di Kalender.')) return;
    el.disabled = true;
    api('campaignBankHapus', { id: bh.id }).then(function(){ toast('Ide dihapus.'); return muat(); })
      .catch(function(e){ el.disabled = false; toast(e.message, true); }).then(render);
    return;
  }
  if (a === 'bank-arsip' || a === 'bank-pulih') {
    var ba = (D.bank || [])[i]; if (!ba) return;
    el.disabled = true;
    api('campaignBankArsip', { id: ba.id, arsip: a === 'bank-arsip' }).then(function(){ toast(a === 'bank-arsip' ? 'Ide diarsipkan.' : 'Ide dipulihkan.'); return muat(); })
      .catch(function(e){ toast(e.message, true); }).then(render);
    return;
  }
  if (a === 'bank-jalan') {
    var bd = { dari: nilai('b-dari'), sampai: nilai('b-sampai'), platform: nilai('b-plat'), jumlah: nilai('b-jml'), fokus: nilai('b-fokus') };
    if (!/^\d{4}-\d{2}-\d{2}$/.test(bd.dari) || !/^\d{4}-\d{2}-\d{2}$/.test(bd.sampai)) { ST.bankIsi = bd; ST.bankGalat = 'Rentang tanggal wajib diisi.'; render(); return; }
    if (bd.sampai < bd.dari) { ST.bankIsi = bd; ST.bankGalat = 'Tanggal akhir tidak boleh sebelum tanggal awal.'; render(); return; }
    var bp = kirimPer(ST.bankPer);
    if (!bp) { toast('Isi tanggal mulai dan akhir periode datanya dulu.', true); return; }
    bd.dataDari = bp.dari; bd.dataSampai = bp.sampai; bd.pilar = bp.fokus;
    ST.bankIsi = bd; ST.bankGalat = ''; ST.bankHasil = null; ST.bankJalan = true; render();
    api('campaignBankGenerate', bd).then(function(r){ ST.bankHasil = r; ST.bankSt = 'IDE'; toast(r.jumlah + ' ide masuk ke Bank Konten.'); return muat(); })
      .catch(function(e){ ST.bankGalat = e.message || 'Gagal tanpa keterangan'; toast(e.message, true); }).then(function(){ ST.bankJalan = false; render(); });
    return;
  }
  if (a === 'ide-jadwal') {
    var rr = (D.riset || []).filter(function(r){ return r.id === el.getAttribute('data-r'); })[0];
    var ide = rr && rr.hasil && rr.hasil.ide ? rr.hasil.ide[i] : null; if (!ide) return;
    formJadwal({ platform: platNorm(ide.platform), judul: ide.judul, caption: (ide.hook ? 'Hook: ' + ide.hook + '\n\n' : '') + (ide.caption || ''), status: 'DRAF', catatan: 'Dari riset: ' + rr.topik });
    return;
  }
  /* Pengaturan */
  if (a === 'set-simpan') {
    var kat = document.getElementById('s-kategori').value.split('\n').map(function(x){ return x.trim(); }).filter(Boolean);
    if (!kat.length) { document.getElementById('s-galat').innerHTML = '<div class="pita err">Kategori pola minimal satu.</div>'; return; }
    var s = { profil: document.getElementById('s-profil').value, kategori: kat,
      aiKeyMeta: nilai('s-aikey-meta'), aiModelMeta: nilai('s-model-meta'),
      tiktokKey: nilai('s-ttkey'), tiktokSecret: nilai('s-ttsecret'), igId: nilai('s-igid'), igSecret: nilai('s-igsecret'),
      adsToken: nilai('s-adstoken'), adsAkun: nilai('s-adsakun'),
      googleClientId: nilai('s-gcid'), googleClientSecret: nilai('s-gcsecret'), placesKey: nilai('s-gkey'), placesIds: nilai('s-gplaces') };
    el.disabled = true;
    api('campaignSetting', s).then(function(){ toast('Pengaturan tersimpan.'); return muat(); })
      .catch(function(e){ document.getElementById('s-galat').innerHTML = '<div class="pita err">' + esc(e.message) + '</div>'; })
      .then(function(){ el.disabled = false; render(); });
    return;
  }
});

});

(function(){
  var nama = (SESI.name || SESI.username || '').trim();
  document.getElementById('uNama').textContent = nama || 'Tidak dikenal';
  document.getElementById('uKet').textContent = (SESI.keterangan || '').trim() || 'Office';
  var av = document.getElementById('uAv');
  av.textContent = nama ? nama.split(/\s+/).slice(0, 2).map(function(w){ return w[0]; }).join('').toUpperCase() : '?';
  /* Warna avatar dari nama — rumus yang sama dengan avColor() panel Konten
     Planning, supaya orang yang sama berwarna sama di kedua panel. */
  var h = 0; for (var i = 0; i < nama.length; i++) h = nama.charCodeAt(i) + ((h << 5) - h);
  av.style.background = 'hsl(' + (Math.abs(h) % 360) + ',45%,46%)';
  var shell = document.getElementById('appShell');
  try { if (localStorage.getItem('lm_konten_navmini') === '1') shell.classList.add('nav-mini'); } catch(e) {}
  document.getElementById('navMini').addEventListener('click', function(){
    var mini = !shell.classList.contains('nav-mini'); shell.classList.toggle('nav-mini', mini);
    try { localStorage.setItem('lm_konten_navmini', mini ? '1' : '0'); } catch(e) {}
  });
  document.getElementById('keluar').addEventListener('click', function(){ location.href = '../../'; });
  document.getElementById('burger').addEventListener('click', function(){ document.getElementById('side').classList.toggle('buka'); });
  document.getElementById('nav').addEventListener('click', function(){ document.getElementById('side').classList.remove('buka'); });
})();
window.addEventListener('hashchange', terapkanHash);
terapkanHash();
muat().then(function(){
  terapkanHash();
  /* AUTO AMBIL INSIGHT: akun yang terhubung disinkronkan sendiri kalau
     terakhir ditarik lebih dari 6 jam lalu. Bukan cron — hosting ini tidak
     punya penjadwal yang bisa diandalkan — jadi ia berjalan saat halaman
     dibuka, diam-diam, dan galatnya disimpan server di kartu akunnya. */
  var tt = akun('tiktok');
  if (tt && tt.terhubung && (Date.now() - num(tt.sync_at)) > 6 * 3600e3) tiktokSync(true);
  var ig = akun('instagram');
  if (ig && ig.terhubung && (Date.now() - num(ig.sync_at)) > 6 * 3600e3) igSync(true);
  var st = D && D.setting;
  if (st && st.adsSiap && (Date.now() - num(st.adsSyncAt)) > 6 * 3600e3) iklanSinkron(true);
  /* Google Review: waktu sinkron terakhirnya hidup di cg_setting dan cuma
     ikut di campaignGoogle — jadi datanya dimuat dulu (sekaligus mengisi
     lencana "segera" di sidebar), baru diputuskan perlu sinkron atau tidak. */
  var ga = akun('google');
  if (st && ((ga && ga.terhubung) || (st.placesKeyAda && st.placesIds))) {
    api('campaignGoogle').then(function(d){
      ST.grSrv = { data: d };
      if ((Date.now() - num(d.syncAt)) > 6 * 3600e3) grSinkron(true);
      else if (VIEW === 'greview') render(); else gambarNav();
    }).catch(function(){});
  }
});
