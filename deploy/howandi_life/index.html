<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<script>
/* Gerbang modul: butuh grant 'howandi_life'. Sengaja BUKAN cek superadmin, supaya
   superadmin pun bisa dikecualikan (Wandi mengelola semua modul tapi tidak diberi
   akses ke sini). */
(function(){try{var s=JSON.parse(localStorage.getItem('lm_session')||'null');
  var ok=s&&s.expiry&&Date.now()<s.expiry&&(s.modules||[]).indexOf('howandi_life')>-1;
  if(!ok)location.replace('../');}catch(e){location.replace('../');}})();
</script>
<title>Howandi Life OS — CEO Command Center</title>
<link rel="icon" type="image/jpeg" href="../assets/LaksamanaMudaLogo.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
:root{
  --bg:#F4F3EF; --panel:#FFFFFF; --panel-2:#FAF9F6; --panel-3:#F1EFE9;
  --line:#E5E2DA; --line-soft:#EDEAE3;
  --text:#1F272E; --muted:#68727B; --faint:#A0A8AF;
  --primary:#2A3742; --primary-h:#354553;
  --brass:#B0812F; --brass-bright:#C9A249; --brass-dim:#8A6522;
  --urgent:#C2691F; --overdue:#BE3B34; --go:#2C8A78; --info:#3E74A6; --violet:#7B5EA6;
  --radius:14px; --radius-sm:9px;
  --shadow:0 1px 2px rgba(31,39,46,.04), 0 10px 26px -18px rgba(31,39,46,.22);
  --disp:"Space Grotesk",system-ui,sans-serif;
  --body:"Inter",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:radial-gradient(1100px 640px at 82% -10%, rgba(176,129,47,.06), transparent 60%),radial-gradient(820px 560px at 4% 110%, rgba(62,116,166,.05), transparent 55%),var(--bg);color:var(--text);font-family:var(--body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#D8D4CB;border-radius:20px;border:3px solid transparent;background-clip:content-box}
::selection{background:rgba(176,129,47,.22)}

.app{display:grid;grid-template-columns:238px 1fr;min-height:100vh}
.rail{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:linear-gradient(180deg,#FBFAF7,#F4F3EF);display:flex;flex-direction:column;padding:20px 14px;gap:3px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 16px}
.brand .mark{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex-shrink:0;background:linear-gradient(140deg,var(--brass-bright),var(--brass-dim));color:#fff;font-family:var(--disp);font-weight:700;font-size:17px;box-shadow:0 6px 15px -7px rgba(176,129,47,.7)}
.brand .t1{font-family:var(--disp);font-weight:600;font-size:14.5px;letter-spacing:.2px;line-height:1.15}
.brand .t2{font-family:var(--mono);font-size:10px;color:var(--brass);letter-spacing:1.4px;text-transform:uppercase;margin-top:2px}
.nav-group{font-family:var(--mono);font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--faint);padding:13px 10px 5px}
.nav-item{display:flex;align-items:center;gap:11px;padding:8.5px 11px;border-radius:9px;color:var(--muted);font-size:13.5px;font-weight:500;width:100%;text-align:left;transition:background .15s,color .15s}
.nav-item:hover{background:var(--panel-3);color:var(--text)}
.nav-item.active{background:rgba(176,129,47,.12);color:var(--brass-dim)}
/* Ciutkan menu ke ikon saja (tombol ☰ di rail). Desktop only. */
.rail-mini{margin-left:auto;background:none;border:1px solid var(--line);color:var(--faint);width:30px;height:30px;border-radius:8px;flex:none;cursor:pointer;font-size:16px;display:grid;place-items:center}
.rail-mini:hover{color:var(--text);background:var(--panel-3)}
@media(max-width:960px){.rail-mini{display:none}}
@media(min-width:961px){
  .app.nav-mini{grid-template-columns:64px 1fr}
  .app.nav-mini .brand .t1,.app.nav-mini .brand .t2,.app.nav-mini .nav-group,.app.nav-mini .side-user .su-info{display:none}
  .app.nav-mini .brand{justify-content:center;padding-bottom:8px}
  .app.nav-mini .rail{padding:16px 8px}
  .app.nav-mini .nav-item{justify-content:center;gap:0;font-size:0;padding:8.5px 0}
  .app.nav-mini .nav-item .badge{position:absolute;top:0;right:2px;font-size:9px}
  .app.nav-mini .side-user{flex-direction:column;gap:8px}
  .app.nav-mini .rail-mini{margin:0 auto}
}
/* Kartu user + tombol keluar di kaki rail — pola yang sama di semua modul. */
.side-user{display:flex;align-items:center;gap:9px;margin-top:10px;padding:9px 10px;
  border:1px solid var(--line);border-radius:11px;background:var(--panel)}
.side-user .su-avatar{width:30px;height:30px;border-radius:9px;flex:none;display:flex;align-items:center;
  justify-content:center;background:var(--primary);color:#fff;font-family:var(--disp);font-size:12px;font-weight:700}
.side-user .su-info{min-width:0;flex:1}
.side-user .su-info b{display:block;font-size:12.5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-user .su-info span{font-size:10.5px;color:var(--faint)}
.logout-x{background:var(--panel-3);border:1px solid var(--line);color:var(--muted);width:30px;height:30px;
  border-radius:9px;display:inline-flex;align-items:center;justify-content:center;flex:none;cursor:pointer;transition:.16s}
.logout-x:hover{background:rgba(190,59,52,.10);color:var(--overdue);border-color:var(--overdue)}
.nav-item.active .ic{color:var(--brass)}
.nav-item .ic{width:17px;height:17px;flex-shrink:0;color:var(--faint)}
.nav-item .badge{margin-left:auto;font-family:var(--mono);font-size:10px;background:var(--panel-3);color:var(--muted);padding:1px 6px;border-radius:20px}
.nav-item.active .badge{background:rgba(176,129,47,.18);color:var(--brass-dim)}

.main{min-width:0;padding:26px 30px 96px;max-width:1180px}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.pagetitle{font-family:var(--disp);font-size:25px;font-weight:600;letter-spacing:-.3px}
.pagesub{color:var(--muted);font-size:13px;margin-top:3px}
.backlink{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px;margin-bottom:8px}
.backlink:hover{color:var(--brass-dim)}

.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:9px;font-size:13px;font-weight:500;border:1px solid var(--line);background:var(--panel);color:var(--text);transition:.15s}
.btn:hover{border-color:var(--brass-dim);background:var(--panel-2)}
.btn .ic{width:15px;height:15px}
.btn-primary{background:var(--primary);color:#fff;border:1px solid var(--primary);font-weight:600}
.btn-primary:hover{background:var(--primary-h);border-color:var(--primary-h)}
.btn-ghost{background:none;border-color:transparent;color:var(--muted)}
.btn-ghost:hover{background:var(--panel-3);color:var(--text)}
.btn-sm{padding:5px 10px;font-size:12px}

.grid{display:grid;gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 0}
.panel-title{font-family:var(--mono);font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:7px}
.panel-title .dot{width:6px;height:6px;border-radius:50%;background:var(--brass)}
.panel-b{padding:14px 16px 16px}

.cockpit{background:linear-gradient(120deg,rgba(176,129,47,.09),rgba(255,255,255,0) 46%),var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;display:grid;grid-template-columns:1.4fr 1fr;gap:22px;align-items:center;box-shadow:var(--shadow)}
.cp-date{font-family:var(--mono);font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--brass-dim)}
.cp-focus-label{font-family:var(--mono);font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--faint);margin:12px 0 5px}
.cp-focus{font-family:var(--disp);font-size:21px;font-weight:600;line-height:1.25;letter-spacing:-.3px;background:none;width:100%;border:none;color:var(--text);resize:none;outline:none}
.cp-focus::placeholder{color:var(--faint)}
.cp-focus:focus{color:var(--brass-dim)}
.dials{display:flex;gap:26px;justify-content:flex-end}
.dial{text-align:center}
.dial-label{font-family:var(--mono);font-size:9px;letter-spacing:1.3px;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
.dial-row{display:flex;gap:5px}
.seg{width:14px;height:26px;border-radius:4px;background:var(--panel-3);border:1px solid var(--line);cursor:pointer;transition:.12s}
.seg.on{background:linear-gradient(180deg,var(--brass-bright),var(--brass-dim));border-color:var(--brass)}
.seg.on.energy{background:linear-gradient(180deg,#3fae99,#236a5c);border-color:var(--go)}

.dash{grid-template-columns:repeat(12,1fr)}
.col-3{grid-column:span 3}.col-4{grid-column:span 4}.col-5{grid-column:span 5}.col-6{grid-column:span 6}.col-7{grid-column:span 7}.col-8{grid-column:span 8}.col-12{grid-column:span 12}

.stat{display:flex;flex-direction:column;gap:3px}
.stat .k{font-family:var(--mono);font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:var(--disp);font-size:24px;font-weight:600;letter-spacing:-.5px;line-height:1.05}
.stat .s{font-size:11.5px;color:var(--faint)}
.stat-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}

.trow{display:flex;align-items:center;gap:11px;padding:9px 4px;border-bottom:1px solid var(--line-soft)}
.trow:last-child{border-bottom:none}
.chk{width:19px;height:19px;border-radius:6px;border:1.5px solid #D2CDC3;flex-shrink:0;display:grid;place-items:center;transition:.15s;background:var(--panel)}
.chk:hover{border-color:var(--brass)}
.chk.done{background:var(--go);border-color:var(--go)}
.chk svg{width:11px;height:11px;color:#fff;opacity:0;transition:.15s}
.chk.done svg{opacity:1}
.t-main{min-width:0;flex:1}
.t-name{font-size:13.5px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-name.done{color:var(--faint);text-decoration:line-through}
.t-desc{font-size:11.5px;color:var(--muted);line-height:1.35;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-meta{display:flex;gap:8px;align-items:center;margin-top:3px;flex-wrap:wrap}
.tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.4px;padding:2px 6px;border-radius:5px;background:var(--panel-3);color:var(--muted);white-space:nowrap}
.tag.q-do{background:rgba(190,59,52,.12);color:#a5322c}
.tag.q-schedule{background:rgba(62,116,166,.12);color:#2f6191}
.tag.q-delegate{background:rgba(194,105,31,.13);color:#a4571a}
.tag.q-delete{background:#EEECE6;color:var(--muted)}
.tag.biz{background:rgba(176,129,47,.13);color:var(--brass-dim)}
.tag.proj{background:rgba(62,116,166,.12);color:#2f6191}
.tag.pic{background:rgba(123,94,166,.13);color:#63489a}
.tag.due{color:var(--muted)}
.tag.overdue{background:rgba(190,59,52,.14);color:#a5322c}
.t-actions{display:flex;gap:3px;opacity:0;transition:.15s}
.trow:hover .t-actions{opacity:1}
.icon-btn{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--faint);transition:.15s}
.icon-btn:hover{background:var(--panel-3);color:var(--text)}
.icon-btn svg{width:15px;height:15px}
.icon-btn.gcal:hover{color:var(--brass-dim)}

.empty{text-align:center;padding:24px 16px;color:var(--faint)}
.empty .em-t{font-size:13px;color:var(--muted);margin-bottom:3px}
.empty .em-s{font-size:12px}

.goal{padding:11px 0;border-bottom:1px solid var(--line-soft)}
.goal:last-child{border-bottom:none}
.goal-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px;gap:10px}
.goal-n{font-size:13px;font-weight:500}
.goal-v{font-family:var(--mono);font-size:11px;color:var(--muted)}
.goal-v b{color:var(--brass-dim);font-weight:600}
.gauge{height:6px;border-radius:20px;background:var(--panel-3);overflow:hidden}
.gauge > i{display:block;height:100%;border-radius:20px;background:linear-gradient(90deg,var(--brass-dim),var(--brass-bright));transition:width .5s cubic-bezier(.2,.8,.2,1)}
.gauge.go > i{background:linear-gradient(90deg,#236a5c,var(--go))}

.habits{display:flex;flex-wrap:wrap;gap:8px}
.habit{display:flex;align-items:center;gap:8px;padding:7px 11px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font-size:12.5px;transition:.15s}
.habit:hover{border-color:var(--brass-dim)}
.habit.done{background:rgba(44,138,120,.1);border-color:rgba(44,138,120,.35)}
.habit .streak{font-family:var(--mono);font-size:10px;color:var(--faint)}
.habit.done .streak{color:var(--go)}

.dump-input{display:flex;gap:8px;margin-bottom:10px}
.dump-input input{flex:1;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:9px 12px;outline:none}
.dump-input input:focus{border-color:var(--brass-dim)}
.dump-item{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--line-soft);font-size:13px;color:var(--muted)}
.dump-item:last-child{border-bottom:none}
.dump-item .d{width:5px;height:5px;border-radius:50%;background:var(--brass);flex-shrink:0}
.dump-item button{margin-left:auto;color:var(--faint);font-size:11px}
.dump-item button:hover{color:var(--overdue)}

.eisen{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.quad{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);overflow:hidden;min-height:170px;box-shadow:var(--shadow)}
.quad-h{padding:12px 15px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:9px}
.quad-h .q-badge{font-family:var(--mono);font-size:9px;letter-spacing:1px;padding:3px 8px;border-radius:6px;text-transform:uppercase;font-weight:600}
.quad-h .q-desc{font-size:11px;color:var(--faint)}
.quad-b{padding:8px 12px 12px}
.quad.do{border-top:2px solid var(--overdue)}.quad.schedule{border-top:2px solid var(--info)}.quad.delegate{border-top:2px solid var(--urgent)}.quad.delete{border-top:2px solid var(--faint)}
.q-badge.do{background:rgba(190,59,52,.12);color:#a5322c}.q-badge.schedule{background:rgba(62,116,166,.12);color:#2f6191}.q-badge.delegate{background:rgba(194,105,31,.13);color:#a4571a}.q-badge.delete{background:#EEECE6;color:var(--muted)}

.seg-nav{display:inline-flex;background:var(--panel-3);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg-nav button{padding:6px 12px;border-radius:7px;font-size:12.5px;color:var(--muted);font-weight:500;transition:.15s}
.seg-nav button.on{background:var(--panel);color:var(--brass-dim);box-shadow:0 1px 3px rgba(31,39,46,.08)}
.filterbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.filterbar select{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-size:12.5px;outline:none}
.filterbar select:focus{border-color:var(--brass-dim)}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.chip{padding:6px 13px;border-radius:20px;border:1px solid var(--line);background:var(--panel);font-size:12.5px;color:var(--muted);font-weight:500;transition:.15s}
.chip:hover{border-color:var(--brass-dim)}
.chip.on{background:rgba(176,129,47,.13);border-color:var(--brass);color:var(--brass-dim)}

.kanban{display:flex;gap:14px;overflow-x:auto;padding-bottom:12px}
.kcol{flex:0 0 262px;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;max-height:calc(100vh - 210px)}
.kcol-h{padding:12px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line-soft)}
.kcol-h .kt{font-family:var(--mono);font-size:10px;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted)}
.kcol-h .kc{font-family:var(--mono);font-size:10px;color:var(--faint);background:var(--panel);padding:1px 7px;border-radius:20px}
.kcol-b{padding:10px;overflow-y:auto;flex:1;min-height:40px}
.kcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:9px;cursor:grab;transition:.15s;box-shadow:0 1px 2px rgba(31,39,46,.03)}
.kcard:hover{border-color:var(--brass-dim)}
.kcard.dragging{opacity:.4}
.kcard-t{font-size:13px;font-weight:500;line-height:1.3;margin-bottom:8px}
.kcard-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.mini-gauge{height:4px;border-radius:20px;background:var(--panel-3);margin-top:9px;overflow:hidden}
.mini-gauge > i{display:block;height:100%;background:linear-gradient(90deg,var(--brass-dim),var(--brass-bright))}
.kcol.drop{outline:1.5px dashed var(--brass-dim);outline-offset:-4px;background:rgba(176,129,47,.05)}

.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.cal-dow{background:var(--panel);padding:9px;text-align:center;font-family:var(--mono);font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--faint)}
.cal-cell{background:var(--panel);min-height:104px;padding:7px 8px;position:relative;transition:.15s}
.cal-cell:hover{background:var(--panel-2)}
.cal-cell.other{background:var(--panel-3);color:var(--faint)}
.cal-num{font-family:var(--mono);font-size:12px;color:var(--muted);display:inline-block;margin-bottom:5px}
.cal-cell.today{background:linear-gradient(180deg,rgba(176,129,47,.08),transparent)}
.cal-cell.today .cal-num{background:var(--brass);color:#fff;width:22px;height:22px;border-radius:50%;text-align:center;line-height:22px;font-weight:600}
.cal-ev{font-size:10.5px;padding:2px 6px;border-radius:5px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border-left:2px solid}
.cal-ev.meeting{background:rgba(62,116,166,.1);border-color:var(--info);color:#2f6191}
.cal-ev.deadline{background:rgba(190,59,52,.1);border-color:var(--overdue);color:#a5322c}
.cal-ev.personal{background:rgba(44,138,120,.1);border-color:var(--go);color:#236a5c}
.cal-ev.content{background:rgba(123,94,166,.11);border-color:var(--violet);color:#63489a}
.cal-ev.event{background:rgba(176,129,47,.11);border-color:var(--brass);color:var(--brass-dim)}
.cal-more{font-size:10px;color:var(--faint)}
.calcols{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.calcol{background:var(--panel);min-height:460px;display:flex;flex-direction:column}
.calcol-h{padding:9px 10px;border-bottom:1px solid var(--line-soft);text-align:center}
.calcol-h .cd{font-family:var(--mono);font-size:9.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--faint)}
.calcol-h .cn{font-family:var(--disp);font-size:16px;font-weight:600;margin-top:2px}
.calcol-h.today .cn{color:var(--brass-dim)}
.calcol-b{padding:8px;overflow-y:auto;flex:1}
.cev{padding:6px 8px;border-radius:7px;margin-bottom:6px;border-left:3px solid;font-size:11.5px;cursor:pointer}
.cev .ct{font-family:var(--mono);font-size:9.5px;color:var(--muted);margin-bottom:1px}
.cev.meeting{background:rgba(62,116,166,.09);border-color:var(--info)}.cev.deadline{background:rgba(190,59,52,.09);border-color:var(--overdue)}.cev.personal{background:rgba(44,138,120,.09);border-color:var(--go)}.cev.content{background:rgba(123,94,166,.1);border-color:var(--violet)}.cev.event{background:rgba(176,129,47,.1);border-color:var(--brass)}

.ag-row{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-soft)}

/* ===== STORAGE — BACKEND MYSQL SENDIRI =====
   Database aplikasi = MySQL milik sendiri (howandi-life-mysql/, lihat
   README di sana). Sebelumnya Google Sheet lewat Apps Script; Sheet lama
   TIDAK dihapus, dia jadi arsip beku dan tidak dibaca lagi dari sini.
   TIDAK ADA localStorage / sessionStorage / data ter-hardcode di HTML.

   Nama variabel sengaja dipertahankan: kontrak API dibuat SAMA PERSIS
   dengan Apps Script lama (getAll/saveAll + token), jadi seluruh kode di
   bawah tidak perlu disentuh. */
const APPS_SCRIPT_URL = "../howandi-life-api-mysql/api.php";
// Token harus SAMA dengan API_TOKEN di howandi-life-mysql/config.php.
// Jujur soal kekuatannya: token ini terkirim ke browser di dalam HTML ini,
// jadi siapa pun yang membuka halaman bisa membacanya — dia menyaring
// permintaan asal-asalan, bukan menahan orang yang niat. Penjaga sebenarnya
// adalah gerbang SSO Office (lm_session) di bagian atas file.
const API_TOKEN       = "HL-5mHh8Lfu8bpiPMkgtRphSmvM";
function apiConfigured(){ return APPS_SCRIPT_URL && !APPS_SCRIPT_URL.startsWith("GANTI") && API_TOKEN && !API_TOKEN.startsWith("GANTI"); }
function _fetchTO(url,opts,ms){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms||20000);return fetch(url,Object.assign({signal:c.signal},opts)).finally(()=>clearTimeout(t));}
async function apiGetState(){
  const url=APPS_SCRIPT_URL+(APPS_SCRIPT_URL.includes('?')?'&':'?')+'action=getAll&token='+encodeURIComponent(API_TOKEN)+'&t='+Date.now();
  let r; try{ r=await _fetchTO(url,{method:'GET',redirect:'follow'},20000); }
  catch(e){ throw new Error(e.name==='AbortError'?'Server tidak merespons (timeout). Cek koneksi / URL Web App.':e.message); }
  const j=await r.json(); if(!j.ok) throw new Error(j.error||'server error'); return j.data;
}
async function apiSaveState(state){
  // Content-Type text/plain SENGAJA supaya browser tidak memicu CORS preflight
  // OPTIONS yang tidak didukung Apps Script. Token menjaga endpoint tetap aman.
  let r; try{ r=await _fetchTO(APPS_SCRIPT_URL,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'saveAll',data:state,token:API_TOKEN})},25000); }
  catch(e){ throw new Error(e.name==='AbortError'?'Server tidak merespons (timeout).':e.message); }
  const j=await r.json(); if(!j.ok) throw new Error(j.error||'server error'); return j.data;
}

/* ===== AUTH (client-side gate) ===== */
let unlocked=false;
async function hashPw(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return'f'+h.toString(16)}}
async function tryUnlock(){const pw=document.getElementById('lock-pw').value;const h=await hashPw(pw);if(h===S.auth.hash){unlocked=true;document.getElementById('lock').classList.remove('show');bootApp()}else{document.getElementById('lock-err').textContent='Password salah. Coba lagi.';document.getElementById('lock-pw').value=''}}

/* ===== STATE ===== */
let S=null,view='home',calRef=new Date(),calMode='month',taskView='matrix',finView='summary',roadView='timeline';
let taskFilterBiz='',taskFilterProject='',contentFilter='all',currentPid=null,currentBid=null,reviewView='weekly';
const uid=()=>Math.random().toString(36).slice(2,9);
const todayISO=()=>new Date().toLocaleDateString('en-CA');
function daysAgoISO(n){const d=new Date();d.setDate(d.getDate()-n);return d.toLocaleDateString('en-CA')}
function inDaysISO(n){const d=new Date();d.setDate(d.getDate()+n);return d.toLocaleDateString('en-CA')}
function monthKey(off){off=off||0;const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+off);return d.toLocaleDateString('en-CA').slice(0,7)}
function fmtMonth(mk){if(!mk)return'';const p=mk.split('-');return new Date(+p[0],+p[1]-1,1).toLocaleDateString('id-ID',{month:'short',year:'numeric'})}
const THISYEAR=new Date().getFullYear();

/* Kerangka state KOSONG (skeleton). Data contoh (bisnis, tugas, keuangan, aset,
   dll.) TIDAK lagi di HTML — sumbernya database MySQL. Saat database masih
   kosong, api.php mengirim nilai bawaan yang bentuknya sama dengan
   emptyState() di bawah, lalu simpan pertama mengisinya.
   Skeleton ini hanya dipakai migrate() & tombol Reset agar UI tak error. */
function emptyState(){
  return{
    firstRun:true,mood:3,energy:4,focus:'',weeklyTarget:'',
    auth:{enabled:false,hash:''},
    businesses:[],projects:[],tasks:[],goals:[],events:[],habits:[],dump:[],
    finance:{ledger:[]},
    channels:[],content:[],learning:[],dreams:[],roadmap:[],assets:[],reviews:[]
  };
}

function migrate(s){const b=emptyState();
  ['businesses','tasks','projects','goals','events','habits','dump','channels','content','learning','dreams','roadmap','assets','reviews'].forEach(k=>{if(!Array.isArray(s[k]))s[k]=b[k]});
  if(!s.finance||typeof s.finance!=='object')s.finance={};
  if(!Array.isArray(s.finance.ledger)){s.finance.ledger=[];if(Array.isArray(s.finance.monthly)){s.finance.monthly.forEach(r=>{s.finance.ledger.push({id:uid(),month:r.month,scope:'personal',income:r.pIncome||0,expense:r.pExpense||0,note:r.note||''});if((r.bIncome||0)||(r.bExpense||0))s.finance.ledger.push({id:uid(),month:r.month,scope:'__umum',income:r.bIncome||0,expense:r.bExpense||0,note:''})});delete s.finance.monthly}else s.finance.ledger=b.finance.ledger;}
  if(!s.auth||typeof s.auth!=='object')s.auth={enabled:false,hash:''};
  s.tasks.forEach(t=>{t.desc=t.desc||'';t.project=t.project||'';t.owner=t.owner||''});
  /* Stage 'Archive' dicabut 19 Agustus 2026 dan dilebur ke 'Done' (lihat
     STAGES). Dipindahkan di sini, bukan dibiarkan: kolomnya sudah tidak
     digambar lagi, jadi project yang tertinggal di 'Archive' akan LENYAP dari
     papan Kanban tanpa satu pun tempat yang menyebut ke mana perginya. */
  s.projects.forEach(p=>{p.pic=p.pic||'';p.team=p.team||'';p.desc=p.desc||'';if(p.stage==='Archive'){p.stage='Done';if(!p.progress)p.progress=100}});
  s.goals.forEach(g=>{g.desc=g.desc||'';g.milestone=g.milestone||''});
  s.roadmap.forEach(r=>{r.desc=r.desc||''});
  s.dreams.forEach(d=>{d.milestone=d.milestone||''});
  s.assets.forEach(a=>{a.qty=a.qty||0;a.unit=a.unit||''});
  s.reviews.forEach(r=>{if(!r.weekStart){r.weekStart=r.month?weekKey(new Date(r.month+'-01T00:00')):weekKey(new Date())}r.sPersonal=r.sPersonal||3});
  s.businesses.forEach(x=>{x.founded=x.founded||'';x.field=x.field||'';x.desc=x.desc||'';if(typeof x.revenue!=='number')x.revenue=+x.revenue||0});
  return s;
}
async function load(){
  if(!apiConfigured()) throw new Error('APPS_SCRIPT_URL / API_TOKEN belum diisi. Lihat Code.gs & README.');
  const d=await apiGetState();
  S=migrate((d&&typeof d==='object')?d:emptyState());
}
let saveT,_saving=false,_again=false;
function save(){clearTimeout(saveT);saveT=setTimeout(flushSave,400);}
async function flushSave(){
  if(!apiConfigured())return;
  if(_saving){_again=true;return;}
  _saving=true;
  try{ await apiSaveState(S); }
  catch(e){ console.error(e); toast('Gagal simpan ke database — cek koneksi'); }
  finally{ _saving=false; if(_again){_again=false;flushSave();} }
}
</script>

<script>
/* ===== HELPERS ===== */
function quadrant(t){if(t.important&&t.urgent)return{k:'do',label:'DO',desc:'Kerjakan hari ini'};if(t.important&&!t.urgent)return{k:'schedule',label:'SCHEDULE',desc:'Jadwalkan'};if(!t.important&&t.urgent)return{k:'delegate',label:'DELEGATE',desc:'Delegasikan ke tim'};return{k:'delete',label:'DELETE',desc:'Pertimbangkan hapus'}}
function isOverdue(t){return t.due&&!t.done&&t.due<todayISO()}
function fmtDue(d){if(!d)return'';const t=todayISO();if(d===t)return'Hari ini';if(d===inDaysISO(1))return'Besok';if(d===daysAgoISO(1))return'Kemarin';if(d<t)return Math.round((new Date(t)-new Date(d))/864e5)+'h lewat';return new Date(d+'T00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short'})}
function fmtRp(n){n=+n||0;const s=n<0?'-':'';n=Math.abs(n);if(n>=1e9)return s+'Rp '+(n/1e9).toFixed(n>=1e10?1:2).replace(/\.?0+$/,'')+' M';if(n>=1e6)return s+'Rp '+(n/1e6).toFixed(0)+' jt';if(n>=1e3)return s+'Rp '+(n/1e3).toFixed(0)+' rb';return s+'Rp '+n.toLocaleString('id-ID')}
function goalPct(g){if(g.invert){const st=g.start!=null?g.start:g.cur;if(st===g.target)return 100;return Math.max(0,Math.min(100,Math.round((st-g.cur)/(st-g.target)*100)))}return Math.max(0,Math.min(100,Math.round((g.cur/g.target)*100||0)))}
function toast(m){const t=document.getElementById('toast');document.getElementById('toast-msg').textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function esc(s){return(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;')}
const netWorth=()=>S.assets.reduce((a,x)=>a+(x.liab?-1:1)*(+x.value||0),0);
const totalAssets=()=>S.assets.filter(a=>!a.liab).reduce((s,a)=>s+(+a.value||0),0);
const totalLiab=()=>S.assets.filter(a=>a.liab).reduce((s,a)=>s+(+a.value||0),0);
const bizRevTotal=()=>S.businesses.reduce((s,b)=>s+(+b.revenue||0),0);
function projTasks(pid){return S.tasks.filter(t=>t.project===pid)}
function projProgress(p){const ts=projTasks(p.id);if(ts.length)return Math.round(ts.filter(t=>t.done).length/ts.length*100);return p.progress||0}
function applyTaskFilter(list){return list.filter(t=>(!taskFilterBiz||t.biz===taskFilterBiz)&&(!taskFilterProject||t.project===taskFilterProject))}

/* ===== GOOGLE CALENDAR ===== */
function pad(n){return String(n).padStart(2,'0')}
function gcalDates(date,start,end){if(start){const s=date.replace(/-/g,'')+'T'+start.replace(':','')+'00';let e;if(end){e=date.replace(/-/g,'')+'T'+end.replace(':','')+'00'}else{const p=start.split(':');e=date.replace(/-/g,'')+'T'+pad((+p[0]+1)%24)+p[1]+'00'}return s+'/'+e}const nx=new Date(date+'T00:00');nx.setDate(nx.getDate()+1);return date.replace(/-/g,'')+'/'+nx.toLocaleDateString('en-CA').replace(/-/g,'')}
function gcalLink(title,date,start,end,details){const p=new URLSearchParams({action:'TEMPLATE',text:title,dates:gcalDates(date,start,end)});if(details)p.set('details',details);return'https://calendar.google.com/calendar/render?'+p.toString()}
function openGcal(title,date,start,end,details){window.open(gcalLink(title,date,start,end,details),'_blank');toast('Membuka Google Calendar…')}
function icsBlock(t,date,start,end,desc){const dt=(d,tm)=>d.replace(/-/g,'')+(tm?('T'+tm.replace(':','')+'00'):'');let o='BEGIN:VEVENT\r\nUID:'+uid()+'@howandi-los\r\nSUMMARY:'+t.replace(/[,;]/g,' ')+'\r\n';if(start){o+='DTSTART:'+dt(date,start)+'\r\nDTEND:'+dt(date,end||start)+'\r\n'}else{const nx=new Date(date+'T00:00');nx.setDate(nx.getDate()+1);o+='DTSTART;VALUE=DATE:'+dt(date)+'\r\nDTEND;VALUE=DATE:'+dt(nx.toLocaleDateString('en-CA'))+'\r\n'}if(desc)o+='DESCRIPTION:'+desc.replace(/[,;]/g,' ')+'\r\n';return o+'END:VEVENT\r\n'}
function exportICS(){let ics='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Howandi Life OS//ID\r\nCALSCALE:GREGORIAN\r\n';S.events.forEach(e=>ics+=icsBlock(e.title,e.date,e.start,e.end,e.type));S.tasks.filter(t=>t.due&&!t.done).forEach(t=>ics+=icsBlock('⏰ '+t.name+(t.biz?' ['+t.biz+']':''),t.due,null,null,'Deadline task'));S.content.filter(c=>c.date&&c.stage!=='Posted').forEach(c=>ics+=icsBlock('🎬 '+c.title,c.date,null,null,'Content '+c.stage));ics+='END:VCALENDAR';const blob=new Blob([ics],{type:'text/calendar'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='howandi-life-os.ics';a.click();URL.revokeObjectURL(url);toast('File .ics diunduh — import ke Google Calendar')}

/* ===== RENDER ROOT ===== */
function setView(v){view=v;render();window.scrollTo(0,0);closeModal()}
function render(){
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.view===view||(view==='projectDetail'&&b.dataset.view==='projects')||(view==='bizDetail'&&b.dataset.view==='business')));
  renderMobnav();
  document.getElementById('nav-tasks').textContent=S.tasks.filter(t=>!t.done).length;
  document.getElementById('nav-proj').textContent=S.projects.filter(p=>p.stage!=='Done').length;
  const m=document.getElementById('main');
  ({home:viewHome,tasks:viewTasks,projects:viewProjects,projectDetail:viewProjectDetail,content:viewContent,goals:viewGoals,roadmap:viewRoadmap,learning:viewLearning,reviews:viewReviews,calendar:viewCalendar,finance:viewFinance,business:viewBusiness,bizDetail:viewBizDetail,settings:viewSettings}[view]||viewHome)(m);
  hydrateIcons(m);
}
function hydrateIcons(scope){scope.querySelectorAll('[data-i]').forEach(el=>{if(!el.dataset.done){el.innerHTML=svg(el.dataset.i);el.dataset.done=1}})}

function taskRow(t,opts){opts=opts||{};const q=quadrant(t);const od=isOverdue(t);const proj=t.project&&S.projects.find(p=>p.id===t.project);
  return `<div class="trow"><div class="chk ${t.done?'done':''}" onclick="toggleTask('${t.id}')">${svg('check')}</div><div class="t-main"><div class="t-name ${t.done?'done':''}">${t.name}</div>${t.desc?`<div class="t-desc">${t.desc}</div>`:''}<div class="t-meta"><span class="tag q-${q.k}">${q.label}</span>${t.biz?`<span class="tag biz">${t.biz}</span>`:''}${proj&&!opts.hideProj?`<span class="tag proj">${proj.name}</span>`:''}${t.owner?`<span class="tag pic">${t.owner}</span>`:''}${t.due?`<span class="tag ${od?'overdue':'due'}">${fmtDue(t.due)}</span>`:''}${t.est?`<span class="tag">${t.est}m</span>`:''}</div></div><div class="t-actions">${t.due?`<button class="icon-btn gcal" title="Google Calendar" onclick="openGcal('${esc(t.name)}','${t.due}',null,null,'Task')">${svg('gcal')}</button>`:''}<button class="icon-btn" onclick="openTaskModal('${t.id}')">${svg('edit')}</button><button class="icon-btn" onclick="delTask('${t.id}')">${svg('trash')}</button></div></div>`}
function goalRow(g){const p=goalPct(g);return `<div class="goal"><div class="goal-h"><span class="goal-n">${g.name}</span><span class="goal-v"><b>${g.cur.toLocaleString('id-ID')}${g.unit}</b> / ${g.target.toLocaleString('id-ID')}${g.unit}</span></div><div class="gauge ${g.area==='Health'||g.area==='Learning'?'go':''}"><i style="width:${p}%"></i></div></div>`}

/* ===== COMMAND CENTER ===== */
function viewHome(m){
  const today=todayISO();
  const overdue=S.tasks.filter(isOverdue);
  const top5=S.tasks.filter(t=>!t.done).sort((a,b)=>{const oa=isOverdue(a),ob=isOverdue(b);if(oa!==ob)return oa?-1:1;const qa=(a.important?2:0)+(a.urgent?1:0),qb=(b.important?2:0)+(b.urgent?1:0);if(qa!==qb)return qb-qa;return(a.due||'9999')<(b.due||'9999')?-1:1}).slice(0,5);
  const todayEv=S.events.filter(e=>e.date===today).sort((a,b)=>(a.start||'')<(b.start||'')?-1:1);
  const todayDl=S.tasks.filter(t=>t.due===today&&!t.done);
  const yearMiles=S.roadmap.filter(r=>r.year===THISYEAR);const yearDone=yearMiles.filter(r=>r.done).length;
  const lastMk=ledgerMonths().slice(-1)[0];const lastAg=lastMk?monthAgg(lastMk):null;
  const dateStr=new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  m.innerHTML=`
  <div class="topbar"><div><div class="pagetitle">Command Center</div><div class="pagesub">Satu halaman. Semua kondisi hari ini.</div></div><button class="btn btn-primary" onclick="openTaskModal()">${svg('plus','',15)} Task baru</button></div>
  <div class="cockpit"><div><div class="cp-date">${dateStr}</div><div class="cp-focus-label">◆ Fokus utama hari ini</div><textarea class="cp-focus" id="focus" rows="2" placeholder="Apa satu hal terpenting hari ini?">${S.focus||''}</textarea></div>
    <div class="dials"><div class="dial"><div class="dial-label">Mood</div><div class="dial-row" id="mood-dial">${[1,2,3,4,5].map(i=>`<div class="seg ${i<=S.mood?'on':''}" onclick="setDial('mood',${i})"></div>`).join('')}</div></div><div class="dial"><div class="dial-label">Energi</div><div class="dial-row" id="energy-dial">${[1,2,3,4,5].map(i=>`<div class="seg energy ${i<=S.energy?'on':''}" onclick="setDial('energy',${i})"></div>`).join('')}</div></div></div></div>
  <div class="grid dash">
    <div class="panel col-4"><div class="panel-h"><div class="panel-title"><span class="dot"></span>Wealth Snapshot</div><button class="btn btn-ghost btn-sm" onclick="setView('finance')">Detail</button></div><div class="panel-b"><div class="stat-row"><div class="stat"><span class="k">Net Worth</span><span class="v" style="color:var(--brass-dim);font-size:19px">${fmtRp(netWorth())}</span></div><div class="stat"><span class="k">Total Aset</span><span class="v" style="font-size:19px">${fmtRp(totalAssets())}</span></div><div class="stat"><span class="k">Avg Rev/thn</span><span class="v" style="font-size:19px">${fmtRp(bizRevTotal())}</span></div></div>${lastAg?`<div class="hint" style="margin-top:12px">Surplus ${fmtMonth(lastMk)}: personal <b style="color:var(--go)">${fmtRp((lastAg.pi-lastAg.pe)*1e6)}</b> · bisnis <b style="color:var(--go)">${fmtRp((lastAg.bi-lastAg.be)*1e6)}</b></div>`:''}</div></div>
    <div class="panel col-4"><div class="panel-h"><div class="panel-title"><span class="dot" style="background:var(--info)"></span>Today's Calendar</div><button class="btn btn-ghost btn-sm" onclick="setView('calendar')">Buka</button></div><div class="panel-b">${(todayEv.length||todayDl.length)?todayEv.map(e=>`<div class="ag-row"><div class="ag-time">${e.start||'—'}</div><div class="ag-bar ${e.type}"></div><div class="ag-body"><div class="t-name">${e.title}</div><div class="t-meta"><span class="tag">${e.start||''}${e.end?'–'+e.end:''}</span></div></div></div>`).join('')+todayDl.map(t=>`<div class="ag-row"><div class="ag-time">DL</div><div class="ag-bar deadline"></div><div class="ag-body"><div class="t-name">${t.name}</div><div class="t-meta"><span class="tag overdue">Deadline hari ini</span></div></div></div>`).join(''):`<div class="empty"><div class="em-t">Kalender kosong hari ini</div><div class="em-s">Nikmati ruang kosongnya.</div></div>`}</div></div>
    <div class="panel col-4"><div class="panel-h"><div class="panel-title"><span class="dot" style="background:var(--go)"></span>Target Minggu Ini</div></div><div class="panel-b"><textarea class="cp-focus" style="font-size:15px;min-height:48px" id="wtarget" placeholder="Target besar minggu ini…">${S.weeklyTarget||''}</textarea><div style="margin-top:12px"><div class="goal-h"><span class="goal-n">Task selesai</span><span class="goal-v"><b>${S.tasks.filter(t=>t.done).length}</b>/${S.tasks.length}</span></div><div class="gauge go"><i style="width:${S.tasks.length?Math.round(S.tasks.filter(t=>t.done).length/S.tasks.length*100):0}%"></i></div></div></div></div>
    <div class="panel col-8"><div class="panel-h"><div class="panel-title"><span class="dot"></span>Top 5 Task</div><button class="btn btn-ghost btn-sm" onclick="setView('tasks')">Semua task</button></div><div class="panel-b">${top5.length?top5.map(t=>taskRow(t)).join(''):`<div class="empty"><div class="em-t">Belum ada task</div></div>`}</div></div>
    <div class="panel col-4"><div class="panel-h"><div class="panel-title"><span class="dot" style="background:var(--overdue)"></span>Overdue ${overdue.length?`<span class="tag overdue">${overdue.length}</span>`:''}</div></div><div class="panel-b">${overdue.length?overdue.slice(0,5).map(t=>`<div class="trow"><div class="chk" onclick="toggleTask('${t.id}')">${svg('check')}</div><div class="t-main"><div class="t-name">${t.name}</div><div class="t-meta"><span class="tag overdue">${fmtDue(t.due)}</span>${t.biz?`<span class="tag biz">${t.biz}</span>`:''}</div></div></div>`).join(''):`<div class="empty"><div class="em-t">Tidak ada yang lewat deadline</div><div class="em-s">Kendali penuh. 🎯</div></div>`}</div></div>
    <div class="panel col-6"><div class="panel-h"><div class="panel-title"><span class="dot"></span>Goal Progress</div><button class="btn btn-ghost btn-sm" onclick="setView('goals')">Semua</button></div><div class="panel-b">${S.goals.slice(0,4).map(g=>goalRow(g)).join('')}</div></div>
    <div class="panel col-6"><div class="panel-h"><div class="panel-title"><span class="dot" style="background:var(--violet)"></span>Brain Dump / Quick Note</div></div><div class="panel-b"><div class="dump-input"><input id="dump-in" placeholder="Tulis ide, lalu Enter…" onkeydown="if(event.key==='Enter')addDump()"><button class="btn btn-primary btn-sm" onclick="addDump()">Simpan</button></div>${S.dump.length?S.dump.slice(0,6).map((d,i)=>`<div class="dump-item"><span class="d"></span><span>${d}</span><button onclick="rmDump(${i})">hapus</button></div>`).join(''):`<div class="hint">Tangkap ide dalam ≤2 tap. Triage nanti.</div>`}</div></div>
    <div class="panel col-8"><div class="panel-h"><div class="panel-title"><span class="dot" style="background:var(--go)"></span>Habit Hari Ini</div></div><div class="panel-b"><div class="habits">${S.habits.map(h=>{const done=h.dates.includes(today);return`<button class="habit ${done?'done':''}" onclick="toggleHabit('${h.id}')">${done?svg('check','',13):''}<span>${h.name}</span><span class="streak">${svg('fire','',10)} ${h.streak}</span></button>`}).join('')}</div></div></div>
    <div class="panel col-4"><div class="panel-h"><div class="panel-title"><span class="dot"></span>Roadmap ${THISYEAR}</div><button class="btn btn-ghost btn-sm" onclick="setView('roadmap')">Buka</button></div><div class="panel-b"><div class="goal-h"><span class="goal-n">Milestone tahun ini</span><span class="goal-v"><b>${yearDone}</b>/${yearMiles.length}</span></div><div class="gauge"><i style="width:${yearMiles.length?Math.round(yearDone/yearMiles.length*100):0}%"></i></div><div style="margin-top:10px">${yearMiles.slice(0,3).map(r=>`<div class="hint" style="color:var(--muted);padding:2px 0">• ${r.title}</div>`).join('')}</div></div></div>
  </div>`;
  document.getElementById('focus').addEventListener('input',e=>{S.focus=e.target.value;save()});
  document.getElementById('wtarget').addEventListener('input',e=>{S.weeklyTarget=e.target.value;save()});
}

/* ===== TASKS (with filters) ===== */
function viewTasks(m){
  const fbase=applyTaskFilter(S.tasks);
  m.innerHTML=`<div class="topbar"><div><div class="pagetitle">Tasks</div><div class="pagesub">Task & Project tersambung — task yang sama, view berbeda. Filter per bisnis/project.</div></div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><div class="seg-nav"><button class="${taskView==='matrix'?'on':''}" onclick="taskView='matrix';render()">Matrix</button><button class="${taskView==='today'?'on':''}" onclick="taskView='today';render()">Today</button><button class="${taskView==='week'?'on':''}" onclick="taskView='week';render()">Minggu ini</button><button class="${taskView==='biz'?'on':''}" onclick="taskView='biz';render()">Per Bisnis</button></div><button class="btn btn-primary" onclick="openTaskModal()">${svg('plus','',15)} Task</button></div></div>
  <div class="filterbar">${svg('tasks','',15)}<span class="hint" style="color:var(--muted)">Filter:</span>
    <select onchange="taskFilterBiz=this.value;render()"><option value="">Semua bisnis</option>${S.businesses.map(b=>`<option ${taskFilterBiz===b.name?'selected':''}>${b.name}</option>`).join('')}</select>
    <select onchange="taskFilterProject=this.value;render()"><option value="">Semua project</option>${S.projects.map(p=>`<option value="${p.id}" ${taskFilterProject===p.id?'selected':''}>${p.name}</option>`).join('')}</select>
    ${(taskFilterBiz||taskFilterProject)?`<button class="btn btn-ghost btn-sm" onclick="taskFilterBiz='';taskFilterProject='';render()">${svg('x','',13)} Reset</button>`:''}</div>
  ${taskView==='matrix'?matrixHtml(fbase):taskView==='today'?listHtml(fbase.filter(t=>t.due===todayISO()||isOverdue(t)),'Hari ini & overdue'):taskView==='week'?listHtml(fbase.filter(t=>t.due&&t.due<=inDaysISO(7)&&!t.done),'7 hari ke depan'):bizHtml(fbase)}`;
}
function matrixHtml(base){const q=(i,u)=>base.filter(t=>!t.done&&t.important===i&&t.urgent===u);const cell=(l,c,b,d)=>`<div class="quad ${c}"><div class="quad-h"><span class="q-badge ${c}">${b}</span><span class="q-desc">${d}</span><span style="margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint)">${l.length}</span></div><div class="quad-b">${l.length?l.map(t=>taskRow(t)).join(''):'<div class="empty"><div class="em-s">Kosong</div></div>'}</div></div>`;return`<div class="eisen">${cell(q(true,true),'do','DO','Penting + Mendesak')}${cell(q(true,false),'schedule','SCHEDULE','Penting + Tidak Mendesak')}${cell(q(false,true),'delegate','DELEGATE','Tidak Penting + Mendesak')}${cell(q(false,false),'delete','DELETE','Tidak Penting + Tidak Mendesak')}</div>`}
function listHtml(l,t){return`<div class="panel"><div class="panel-h"><div class="panel-title"><span class="dot"></span>${t} · ${l.length}</div></div><div class="panel-b">${l.length?l.slice().sort((a,b)=>(a.due||'9999')<(b.due||'9999')?-1:1).map(x=>taskRow(x)).join(''):'<div class="empty"><div class="em-t">Tidak ada task</div></div>'}</div></div>`}
function bizHtml(base){const g={};base.filter(t=>!t.done).forEach(t=>{(g[t.biz||'Tanpa bisnis']=g[t.biz||'Tanpa bisnis']||[]).push(t)});return Object.entries(g).map(([b,l])=>`<div class="panel" style="margin-bottom:14px"><div class="panel-h"><div class="panel-title"><span class="dot"></span>${b} · ${l.length}</div></div><div class="panel-b">${l.map(t=>taskRow(t)).join('')}</div></div>`).join('')||'<div class="empty"><div class="em-t">Belum ada task aktif</div></div>'}

/* ===== PROJECTS ===== */
/* ARCHIVE DICABUT (19 Agustus 2026) — dilebur ke Done.
   Dua kolom untuk satu maksud yang sama: keduanya berarti "sudah tidak
   dikerjakan lagi", dan bedanya tidak pernah bisa dijelaskan tanpa mengarang
   aturan. Yang terjadi di papan: project selesai tersebar di dua kolom, dan
   yang mencari salah satunya harus melihat dua tempat. Project berstage
   'Archive' yang terlanjur tersimpan dipindahkan ke 'Done' oleh migrate(). */
const STAGES=['Idea','Planning','Research','Ready','Doing','Waiting','Review','Done'];
function viewProjects(m){
  m.innerHTML=`<div class="topbar"><div><div class="pagetitle">Project Center</div><div class="pagesub">Klik project untuk lihat detail & task-nya. Drag kartu antar kolom.</div></div><button class="btn btn-primary" onclick="openProjModal()">${svg('plus','',15)} Project</button></div>
  <div class="kanban">${STAGES.map(st=>{const l=S.projects.filter(p=>p.stage===st);return`<div class="kcol" data-stage="${st}" ondragover="event.preventDefault();this.classList.add('drop')" ondragleave="this.classList.remove('drop')" ondrop="dropProj(event,'${st}')"><div class="kcol-h"><span class="kt">${st}</span><span class="kc">${l.length}</span></div><div class="kcol-b">${l.map(p=>projCard(p)).join('')}</div></div>`}).join('')}</div>`;
}
function projCard(p){const prog=projProgress(p);const nt=projTasks(p.id).length;return`<div class="kcard" draggable="true" ondragstart="dragProj(event,'${p.id}')" ondragend="this.classList.remove('dragging')" onclick="if(!event.defaultPrevented)openProjectDetail('${p.id}')"><div class="kcard-t">${p.name}</div><div class="kcard-meta">${p.biz?`<span class="tag biz">${p.biz}</span>`:''}<span class="tag ${p.priority==='High'?'q-do':p.priority==='Med'?'q-schedule':'q-delete'}">${p.priority}</span>${p.due?`<span class="tag ${p.due<todayISO()?'overdue':'due'}">${fmtDue(p.due)}</span>`:''}${nt?`<span class="tag proj">${nt} task</span>`:''}</div>${p.pic?`<div class="kcard-meta" style="margin-top:6px"><span class="tag pic">${p.pic}</span></div>`:''}<div class="mini-gauge"><i style="width:${prog}%"></i></div></div>`}
let dragId=null;
function dragProj(e,id){dragId=id;e.target.classList.add('dragging')}
function dropProj(e,st){e.preventDefault();document.querySelectorAll('.kcol').forEach(c=>c.classList.remove('drop'));const p=S.projects.find(x=>x.id===dragId);if(p){p.stage=st;if(st==='Done')p.progress=100;save();render()}}
function openProjectDetail(id){currentPid=id;view='projectDetail';render();window.scrollTo(0,0)}
function viewProjectDetail(m){
  const p=S.projects.find(x=>x.id===currentPid);if(!p){setView('projects');return}
  const ts=projTasks(p.id);const prog=projProgress(p);const done=ts.filter(t=>t.done).length;
  m.innerHTML=`<button class="backlink" onclick="setView('projects')">${svg('chevL','',14)} Semua project</button>
  <div class="topbar"><div><div class="pagetitle">${p.name}</div><div class="pagesub">${p.biz||'—'} · Stage: ${p.stage} · ${p.priority} priority${p.due?' · '+fmtDue(p.due):''}</div></div>
    <div style="display:flex;gap:8px"><button class="btn" onclick="openProjModal('${p.id}')">${svg('edit','',15)} Edit</button><button class="btn btn-primary" onclick="openTaskModal(null,{project:'${p.id}',biz:'${esc(p.biz)}'})">${svg('plus','',15)} Task ke project ini</button></div></div>
  <div class="grid dash">
    <div class="panel col-8"><div class="panel-b">${p.desc?`<div style="font-size:13.5px;color:var(--muted);line-height:1.6;margin-bottom:14px">${p.desc}</div>`:''}<div class="detail-head"><div class="stat"><span class="k">PIC</span><span class="v" style="font-size:15px">${p.pic||'—'}</span></div><div class="stat"><span class="k">Tim</span><span class="v" style="font-size:15px">${p.team||'—'}</span></div><div class="stat"><span class="k">Task selesai</span><span class="v" style="font-size:15px">${done}/${ts.length}</span></div></div><div class="goal-h" style="margin-top:6px"><span class="goal-n">Progress ${ts.length?'(otomatis dari task)':'(manual)'}</span><span class="goal-v"><b>${prog}%</b></span></div><div class="gauge"><i style="width:${prog}%"></i></div></div></div>
    <div class="panel col-4"><div class="panel-b"><div class="stat"><span class="k">Deadline</span><span class="v" style="font-size:18px">${p.due?new Date(p.due+'T00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}):'—'}</span></div>${p.due?`<button class="btn btn-sm" style="margin-top:12px" onclick="openGcal('${esc(p.name)}','${p.due}',null,null,'Project deadline')">${svg('gcal','',14)} + Google Calendar</button>`:''}</div></div>
    <div class="panel col-12"><div class="panel-h"><div class="panel-title"><span class="dot"></span>Task di project ini · ${ts.length}</div></div><div class="panel-b">${ts.length?ts.map(t=>taskRow(t,{hideProj:true})).join(''):'<div class="empty"><div class="em-t">Belum ada task</div><div class="em-s">Tambahkan task pertama untuk project ini.</div></div>'}</div></div>
  </div>`;
}

/* ===== CONTENT (with account filter) ===== */
const CSTAGES=['Idea','Script','Shoot','Editing','Scheduled','Posted'];
function viewContent(m){
  const list=contentFilter==='all'?S.content:S.content.filter(c=>c.channel===contentFilter);
  m.innerHTML=`<div class="topbar"><div><div class="pagetitle">Content Pipeline</div><div class="pagesub">Konten pribadi + side project. Pilih akun untuk fokus ke satu pipeline.</div></div><div style="display:flex;gap:8px"><button class="btn" onclick="openChannelsModal()">${svg('settings','',15)} Kelola akun</button><button class="btn btn-primary" onclick="openContentModal()">${svg('plus','',15)} Konten</button></div></div>
  <div class="chips"><button class="chip ${contentFilter==='all'?'on':''}" onclick="contentFilter='all';render()">Semua akun</button>${S.channels.map(ch=>`<button class="chip ${contentFilter===ch?'on':''}" onclick="contentFilter='${esc(ch)}';render()">${ch}</button>`).join('')}</div>
  <div class="kanban">${CSTAGES.map(st=>{const l=list.filter(c=>c.stage===st);return`<div class="kcol" data-stage="${st}" ondragover="event.preventDefault();this.classList.add('drop')" ondragleave="this.classList.remove('drop')" ondrop="dropContent(event,'${st}')"><div class="kcol-h"><span class="kt">${st}</span><span class="kc">${l.length}</span></div><div class="kcol-b">${l.map(c=>contentCard(c)).join('')||'<div class="empty" style="padding:14px 6px"><div class="em-s">—</div></div>'}</div></div>`}).join('')}</div>`;
}
function contentCard(c){return`<div class="kcard" draggable="true" ondragstart="dragContent(event,'${c.id}')" ondragend="this.classList.remove('dragging')" onclick="if(!event.defaultPrevented)openContentModal('${c.id}')"><div class="kcard-t">${c.title}</div><div class="kcard-meta"><span class="tag" style="background:rgba(123,94,166,.12);color:#63489a">${c.platform}</span>${c.date?`<span class="tag due">${fmtDue(c.date)}</span>`:''}</div><div class="kcard-meta" style="margin-top:6px"><span class="tag biz">${c.channel}</span></div></div>`}
let dragCId=null;
function dragContent(e,id){dragCId=id;e.target.classList.add('dragging')}
function dropContent(e,st){e.preventDefault();document.querySelectorAll('.kcol').forEach(c=>c.classList.remove('drop'));const c=S.content.find(x=>x.id===dragCId);if(c){c.stage=st;save();render()}}
</script>

<script>
/* ===== GOALS ===== */
function viewGoals(m){
  m.innerHTML=`<div class="topbar"><div><div class="pagetitle">Goals ${THISYEAR}</div><div class="pagesub">Target terukur (numerik) + deskripsi singkat.</div></div><button class="btn btn-primary" onclick="openGoalModal()">${svg('plus','',15)} Goal</button></div>
  <div class="grid dash">${S.goals.map(g=>{const p=goalPct(g);return`<div class="panel col-6"><div class="panel-b"><div class="goal-h" style="margin-bottom:10px"><div><div class="goal-n" style="font-size:15px">${g.name}</div><div class="tag" style="margin-top:5px;display:inline-block">${g.area}</div></div><div style="text-align:right"><div style="font-family:var(--disp);font-size:24px;font-weight:600;color:var(--brass-dim)">${p}%</div></div></div>${g.desc?`<div class="hint" style="color:var(--muted);margin-bottom:10px">${g.desc}</div>`:''}${g.milestone?`<div class="tag proj" style="display:inline-block;margin-bottom:10px;cursor:pointer" onclick="setView('roadmap')">→ Roadmap: ${milestoneLabel(g.milestone)}</div>`:''}<div class="gauge ${g.area==='Health'||g.area==='Learning'?'go':''}"><i style="width:${p}%"></i></div><div class="goal-v" style="margin-top:10px;display:flex;justify-content:space-between"><span>Sekarang: <b style="color:var(--text)">${g.cur.toLocaleString('id-ID')}${g.unit}</b></span><span>Target: <b style="color:var(--text)">${g.target.toLocaleString('id-ID')}${g.unit}</b></span></div><div style="display:flex;gap:6px;margin-top:12px"><button class="btn btn-ghost btn-sm" onclick="openGoalModal('${g.id}')">${svg('edit','',13)} Update</button><button class="btn btn-ghost btn-sm" onclick="delGoal('${g.id}')">${svg('trash','',13)}</button></div></div></div>`}).join('')}</div>`;
}

/* ===== ROADMAP & DREAMS ===== */
const DREAM_CAT={Travel:{ic:'plane',c:'#3E74A6'},Education:{ic:'cap',c:'#B0812F'},Career:{ic:'brief',c:'#2C8A78'},Experience:{ic:'sparkle',c:'#7B5EA6'},Other:{ic:'star',c:'#68727B'}};
function viewRoadmap(m){
  m.innerHTML=`<div class="topbar"><div><div class="pagetitle">Roadmap &amp; Dreams</div><div class="pagesub">Target karir & hidup per tahun, dan semua mimpi masa depan.</div></div>
    <div style="display:flex;gap:8px"><div class="seg-nav"><button class="${roadView==='timeline'?'on':''}" onclick="roadView='timeline';render()">Roadmap</button><button class="${roadView==='dreams'?'on':''}" onclick="roadView='dreams';render()">Dreams</button></div><button class="btn btn-primary" onclick="${roadView==='timeline'?'openMileModal()':'openDreamModal()'}">${svg('plus','',15)} Tambah</button></div></div>
    ${roadView==='timeline'?timelineHtml():dreamsHtml()}`;
}
function timelineHtml(){const years=[...new Set(S.roadmap.map(r=>r.year))].sort();return`<div class="panel"><div class="panel-b"><div class="tl">${years.map(y=>{const items=S.roadmap.filter(r=>r.year===y);const done=items.filter(r=>r.done).length;return`<div class="tl-year"><div class="yr">${y} <span style="font-family:var(--mono);font-size:11px;color:var(--faint);font-weight:400">· ${done}/${items.length}</span></div>${items.map(r=>{const gs=milestoneGoals(r.id),ds=milestoneDreams(r.id),mp=milestoneProgress(r);return `<div class="mile ${r.done?'done':''}"><div class="chk ${r.done?'done':''}" onclick="toggleMile('${r.id}')">${svg('check')}</div><div class="mtxt"><div class="mt1">${r.title}${gs.length?` <span class="goal-v"><b style="color:var(--brass-dim)">· ${mp}%</b></span>`:''}</div>${r.desc?`<div class="mt2">${r.desc}</div>`:''}${gs.length?`<div style="margin-top:9px">${gs.map(g=>`<div class="goal-h" style="margin-bottom:3px"><span class="goal-v" style="cursor:pointer" onclick="setView('goals')">🎯 ${g.name}</span><span class="goal-v"><b>${goalPct(g)}%</b></span></div><div class="gauge" style="margin-bottom:7px"><i style="width:${goalPct(g)}%"></i></div>`).join('')}</div>`:''}${ds.length?`<div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">${ds.map(d=>`<span class="tag ${d.status==='Done'?'':'proj'}" style="cursor:pointer" onclick="setView('roadmap')">✦ ${d.title}</span>`).join('')}</div>`:''}</div><button class="icon-btn" onclick="openMileModal('${r.id}')">${svg('edit','',14)}</button><button class="icon-btn" onclick="delMile('${r.id}')">${svg('trash','',14)}</button></div>`}).join('')}</div>`}).join('')}</div></div></div>`}
function dreamsHtml(){const labels={Travel:'Travel — Negara & Tempat',Education:'Pendidikan — Kuliah & Kursus',Career:'Karir & Bisnis',Experience:'Pengalaman',Other:'Lainnya'};return Object.keys(DREAM_CAT).map(cat=>{const l=S.dreams.filter(d=>d.cat===cat);if(!l.length)return'';const meta=DREAM_CAT[cat];return`<div class="panel" style="margin-bottom:14px"><div class="panel-h"><div class="panel-title"><span class="dot" style="background:${meta.c}"></span>${labels[cat]} · ${l.length}</div></div><div class="panel-b"><div class="grid" style="grid-template-columns:1fr 1fr">${l.map(d=>`<div class="dream ${d.status==='Done'?'done':''}"><div class="dm-ic" style="background:${meta.c}">${svg(meta.ic,'',16)}</div><div class="dm-b"><div class="dm-t">${d.title}</div><div class="dm-note">${d.status}${d.year?' · '+d.year:''}${d.note?' · '+d.note:''}</div>${d.milestone?`<div style="margin-top:5px"><span class="tag proj" style="cursor:pointer" onclick="setView('roadmap')">→ ${milestoneLabel(d.milestone)}</span></div>`:''}</div><div style="display:flex;flex-direction:column;gap:2px"><button class="icon-btn" onclick="toggleDream('${d.id}')" title="Tandai selesai">${svg('check','',14)}</button><button class="icon-btn" onclick="openDreamModal('${d.id}')">${svg('edit','',14)}</button></div></div>`).join('')}</div></div></div>`}).join('')+`<div style="text-align:center"><button class="btn" onclick="openDreamModal()">${svg('plus','',15)} Tambah mimpi</button></div>`}

/* ===== LEARNING ===== */
function viewLearning(m){const done=S.learning.filter(l=>l.status==='Selesai').length;
  m.innerHTML=`<div class="topbar"><div><div class="pagetitle">Learning &amp; Refleksi</div><div class="pagesub">Pelajaran dari buku, video, film, podcast — apa yang kamu ambil.</div></div><button class="btn btn-primary" onclick="openLearnModal()">${svg('plus','',15)} Catatan</button></div>
  <div class="gcal-banner"><div class="gi">${svg('learning','',18)}</div><div class="gt"><b>${done} selesai · ${S.learning.length} total</b><p>Tiap catatan menyimpan key takeaway supaya ilmunya nempel, bukan cuma dikonsumsi.</p></div></div>
  <div class="grid dash">${S.learning.map(l=>`<div class="col-6"><div class="learn-card"><div class="learn-h"><div><div class="learn-t">${l.title}</div><div class="learn-src">${l.type}${l.source?' · '+l.source:''} · <span style="color:${l.status==='Selesai'?'var(--go)':'var(--urgent)'}">${l.status}</span></div></div><div class="stars">${l.rating?'★'.repeat(l.rating)+'☆'.repeat(5-l.rating):''}</div></div>${l.take?`<div class="learn-take">${l.take}</div>`:'<div class="hint" style="margin-top:6px">Belum ada catatan takeaway.</div>'}<div style="display:flex;gap:6px;margin-top:12px"><button class="btn btn-ghost btn-sm" onclick="openLearnModal('${l.id}')">${svg('edit','',13)} Edit</button><button class="btn btn-ghost btn-sm" onclick="delLearn('${l.id}')">${svg('trash','',13)}</button></div></div></div>`).join('')}</div>`;
}

/* ===== MONTHLY EVALUATION ===== */
function scoreBar(label,val){return`<div class="rscore"><span class="rl">${label}</span><div class="rg"><div class="gauge ${val>=4?'go':''}"><i style="width:${val/5*100}%"></i></div></div><span class="goal-v" style="width:26px;text-align:right"><b>${val}</b>/5</span></div>`}
function viewReviews(m){
  const weeks=S.reviews.slice().sort((a,b)=>a.weekStart<b.weekStart?1:-1);
  m.innerHTML=`<div class="topbar"><div><div class="pagetitle">Evaluasi Diri</div><div class="pagesub">Review tiap minggu — recap otomatis per bulan.</div></div><div style="display:flex;gap:8px"><div class="seg-nav"><button class="${reviewView==='weekly'?'on':''}" onclick="reviewView='weekly';render()">Mingguan</button><button class="${reviewView==='recap'?'on':''}" onclick="reviewView='recap';render()">Recap Bulanan</button></div><button class="btn btn-primary" onclick="openReviewModal()">${svg('plus','',15)} Evaluasi minggu ini</button></div></div>
  ${reviewView==='weekly'?weeklyReviewsHtml(weeks):recapHtml(weeks)}`;
}
function weeklyReviewsHtml(weeks){return weeks.length?`<div class="grid dash">${weeks.map(r=>`<div class="col-6"><div class="learn-card"><div class="learn-h"><div class="learn-t">Minggu ${fmtWeek(r.weekStart)}</div><button class="icon-btn" onclick="openReviewModal('${r.id}')">${svg('edit','',15)}</button></div><div style="margin:12px 0">${scoreBar('Konten',r.sContent)}${scoreBar('Bisnis',r.sBusiness)}${scoreBar('Project',r.sProject)}${scoreBar('Personal',r.sPersonal)}</div>${r.wins?`<div style="margin-bottom:8px"><div class="panel-title" style="margin-bottom:5px"><span class="dot" style="background:var(--go)"></span>Yang berhasil</div><div class="hint" style="color:var(--muted)">${r.wins}</div></div>`:''}${r.improve?`<div><div class="panel-title" style="margin-bottom:5px"><span class="dot" style="background:var(--urgent)"></span>Perbaiki</div><div class="hint" style="color:var(--muted)">${r.improve}</div></div>`:''}<div style="display:flex;gap:6px;margin-top:12px"><button class="btn btn-ghost btn-sm" onclick="delReview('${r.id}')">${svg('trash','',13)} Hapus</button></div></div></div>`).join('')}</div>`:`<div class="panel"><div class="empty"><div class="em-t">Belum ada evaluasi mingguan</div><div class="em-s">Mulai review minggu ini untuk membangun track record.</div></div></div>`}
function recapHtml(weeks){const M={};weeks.forEach(r=>{const mk=monthOfWeek(r.weekStart);(M[mk]=M[mk]||[]).push(r)});const keys=Object.keys(M).sort().reverse();const avg=(a,k)=>Math.round(a.reduce((s,x)=>s+(x[k]||0),0)/a.length*10)/10;return keys.length?`<div class="grid dash">${keys.map(mk=>{const a=M[mk];return`<div class="col-6"><div class="learn-card"><div class="learn-h"><div class="learn-t">${fmtMonth(mk)}</div><span class="tag">${a.length} minggu</span></div><div style="margin:12px 0">${scoreBar('Konten',avg(a,'sContent'))}${scoreBar('Bisnis',avg(a,'sBusiness'))}${scoreBar('Project',avg(a,'sProject'))}${scoreBar('Personal',avg(a,'sPersonal'))}</div><div class="panel-title" style="margin-bottom:5px"><span class="dot" style="background:var(--go)"></span>Highlight bulan</div><div class="hint" style="color:var(--muted)">${a.map(r=>r.wins).filter(Boolean).map(w=>'• '+w).join('<br>')||'—'}</div><div class="panel-title" style="margin:10px 0 5px"><span class="dot" style="background:var(--urgent)"></span>Fokus perbaikan</div><div class="hint" style="color:var(--muted)">${a.map(r=>r.improve).filter(Boolean).map(w=>'• '+w).join('<br>')||'—'}</div></div></div>`}).join('')}</div>`:`<div class="panel"><div class="empty"><div class="em-t">Belum ada data recap</div><div class="em-s">Isi evaluasi mingguan dulu.</div></div></div>`}

/* ===== CALENDAR (multi-view) ===== */
const DOW=['Sen','Sel','Rab','Kam','Jum','Sab','Min'];
function weekStart(d){const x=new Date(d);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);x.setHours(0,0,0,0);return x}
function weekKey(d){return weekStart(d).toLocaleDateString('en-CA')}
function monthOfWeek(ws){return ws.slice(0,7)}
function fmtWeek(ws){const a=new Date(ws+'T00:00');const b=new Date(a);b.setDate(b.getDate()+6);return `${a.getDate()} ${a.toLocaleDateString('id-ID',{month:'short'})} – ${b.getDate()} ${b.toLocaleDateString('id-ID',{month:'short',year:'numeric'})}`}
function milestoneLabel(id){const r=S.roadmap.find(x=>x.id===id);return r?(r.year+' · '+r.title):''}
function milestoneGoals(id){return S.goals.filter(g=>g.milestone===id)}
function milestoneDreams(id){return S.dreams.filter(d=>d.milestone===id)}
function milestoneProgress(r){const gs=milestoneGoals(r.id);if(gs.length)return Math.round(gs.reduce((s,g)=>s+goalPct(g),0)/gs.length);return r.done?100:0}
function roadmapOptions(sel){return '<option value="">— Tidak terhubung —</option>'+S.roadmap.slice().sort((a,b)=>a.year-b.year).map(r=>`<option value="${r.id}" ${sel===r.id?'selected':''}>${r.year} · ${r.title}</option>`).join('')}
function rangeLabel(a,b){return `${a.getDate()} ${a.toLocaleDateString('id-ID',{month:'short'})} – ${b.getDate()} ${b.toLocaleDateString('id-ID',{month:'short',year:'numeric'})}`}
function calItems(iso){const out=[];S.events.filter(e=>e.date===iso).forEach(e=>out.push({t:e.title,type:e.type,time:e.start||'',end:e.end||'',id:e.id}));S.tasks.filter(t=>t.due===iso&&!t.done).forEach(t=>out.push({t:'⏰ '+t.name,type:'deadline',time:''}));S.content.filter(c=>c.date===iso&&c.stage!=='Posted').forEach(c=>out.push({t:'🎬 '+c.title,type:'content',time:''}));return out.sort((a,b)=>(a.time||'99')<(b.time||'99')?-1:1)}
function calColumns(start,n){let h='<div class="calcols" style="grid-template-columns:repeat('+n+',1fr)">';const today=todayISO();for(let i=0;i<n;i++){const d=new Date(start);d.setDate(d.getDate()+i);const iso=d.toLocaleDateString('en-CA');const items=calItems(iso);h+=`<div class="calcol"><div class="calcol-h ${iso===today?'today':''}"><div class="cd">${d.toLocaleDateString('id-ID',{weekday:'short'})}</div><div class="cn">${d.getDate()}</div></div><div class="calcol-b" ondblclick="openEventModal(null,'${iso}')">${items.length?items.map(it=>`<div class="cev ${it.type}" ${it.id?`onclick="openEventModal('${it.id}')"`:''}>${it.time?`<div class="ct">${it.time}${it.end?'–'+it.end:''}</div>`:''}${it.t}</div>`).join(''):'<div class="hint" style="text-align:center;padding:10px 0">—</div>'}</div></div>`}return h+'</div>'}
function viewCalendar(m){
  let label,body;
  if(calMode==='month'){const y=calRef.getFullYear(),mo=calRef.getMonth();label=calRef.toLocaleDateString('id-ID',{month:'long',year:'numeric'});body='<div class="cal-grid">'+DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('')+monthCells(y,mo)+'</div>';}
  else if(calMode==='week'){const ws=weekStart(calRef);const we=new Date(ws);we.setDate(we.getDate()+6);label=rangeLabel(ws,we);body=calColumns(ws,7);}
  else if(calMode==='few'){const st=new Date(calRef);st.setHours(0,0,0,0);const en=new Date(st);en.setDate(en.getDate()+3);label=rangeLabel(st,en);body=calColumns(st,4);}
  else{label=calRef.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});body=calColumns(calRef,1);}
  m.innerHTML=`<div class="topbar"><div><div class="pagetitle">Calendar</div><div class="pagesub">Google Calendar = single source of truth untuk waktu.</div></div><button class="btn btn-primary" onclick="openEventModal()">${svg('plus','',15)} Event</button></div>
  <div class="gcal-banner"><div class="gi">${svg('gcal','',18)}</div><div class="gt"><b>Integrasi Google Calendar</b><p>Event, deadline task & jadwal konten bisa dikirim 1-klik atau export .ics.</p></div><button class="btn" onclick="exportICS()">${svg('download','',15)} Export .ics</button></div>
  <div class="topbar" style="margin-bottom:14px"><div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><button class="icon-btn" onclick="calNav(-1)" style="background:var(--panel);border:1px solid var(--line)">${svg('chevL','',16)}</button><div style="font-family:var(--disp);font-size:17px;font-weight:600;min-width:190px;text-align:center">${label}</div><button class="icon-btn" onclick="calNav(1)" style="background:var(--panel);border:1px solid var(--line)">${svg('chevR','',16)}</button><button class="btn btn-ghost btn-sm" onclick="calRef=new Date();render()">Hari ini</button></div>
    <div class="seg-nav"><button class="${calMode==='day'?'on':''}" onclick="setCalMode('day')">1 Hari</button><button class="${calMode==='few'?'on':''}" onclick="setCalMode('few')">4 Hari</button><button class="${calMode==='week'?'on':''}" onclick="setCalMode('week')">Minggu</button><button class="${calMode==='month'?'on':''}" onclick="setCalMode('month')">Bulan</button></div></div>
  ${body}`;
}
function setCalMode(mode){calMode=mode;render()}
function calNav(dir){if(calMode==='month')calRef.setMonth(calRef.getMonth()+dir);else if(calMode==='week')calRef.setDate(calRef.getDate()+7*dir);else if(calMode==='few')calRef.setDate(calRef.getDate()+4*dir);else calRef.setDate(calRef.getDate()+dir);render()}
function monthCells(y,mo){const first=new Date(y,mo,1);let sd=(first.getDay()+6)%7;const dim=new Date(y,mo+1,0).getDate();const pd=new Date(y,mo,0).getDate();let cells='';const today=todayISO();for(let i=0;i<42;i++){let dn,cd,other=false;if(i<sd){dn=pd-sd+i+1;cd=new Date(y,mo-1,dn);other=true}else if(i>=sd+dim){dn=i-sd-dim+1;cd=new Date(y,mo+1,dn);other=true}else{dn=i-sd+1;cd=new Date(y,mo,dn)}const iso=cd.toLocaleDateString('en-CA');const items=calItems(iso);cells+=`<div class="cal-cell ${other?'other':''} ${iso===today?'today':''}" ondblclick="openEventModal(null,'${iso}')"><span class="cal-num">${dn}</span>${items.slice(0,3).map(it=>`<div class="cal-ev ${it.type}" ${it.id?`onclick="openEventModal('${it.id}')"`:''}>${it.t}</div>`).join('')}${items.length>3?`<div class="cal-more">+${items.length-3} lagi</div>`:''}</div>`}return cells}

/* ===== FINANCE ===== */
const ASSET_CATS=['Properti','Kendaraan','Kas/Bank','Crypto','Saham','Emas','Bisnis/Equity','Piutang','Lainnya','Utang'];
function viewFinance(m){
  m.innerHTML=`<div class="topbar"><div><div class="pagetitle">Finance &amp; Aset</div><div class="pagesub">Kekayaan pribadi + bisnis, ledger bulanan, dan semua aset — di mana pun tersimpan.</div></div>
    <div class="seg-nav"><button class="${finView==='summary'?'on':''}" onclick="finView='summary';render()">Ringkasan</button><button class="${finView==='monthly'?'on':''}" onclick="finView='monthly';render()">Bulanan</button><button class="${finView==='assets'?'on':''}" onclick="finView='assets';render()">Aset & Utang</button></div></div>
    ${finView==='summary'?finSummary():finView==='monthly'?finMonthly():finAssets()}`;
}
function ledgerMonths(){return [...new Set(S.finance.ledger.map(e=>e.month))].sort()}
function scopeLabel(sc){if(sc==='personal')return'Personal';if(sc==='__umum')return'Bisnis (umum)';const b=S.businesses.find(x=>x.id===sc);return b?b.name:'—'}
function monthAgg(mk){let pi=0,pe=0,bi=0,be=0;S.finance.ledger.filter(e=>e.month===mk).forEach(e=>{if(e.scope==='personal'){pi+=+e.income||0;pe+=+e.expense||0}else{bi+=+e.income||0;be+=+e.expense||0}});return{pi,pe,bi,be}}
function _v(id){const el=document.getElementById(id);return el?el.value:''}
function finSummary(){
  const cats={};S.assets.filter(a=>!a.liab).forEach(a=>{cats[a.cat]=(cats[a.cat]||0)+(+a.value||0)});const ta=totalAssets(),tl=totalLiab();
  const lm=ledgerMonths().slice(-1)[0];const ag=lm?monthAgg(lm):null;
  return`<div class="grid dash">
    <div class="panel col-4"><div class="panel-b"><div class="stat"><span class="k">Net Worth</span><span class="v" style="color:var(--brass-dim)">${fmtRp(netWorth())}</span><span class="s">Aset − Utang</span></div></div></div>
    <div class="panel col-4"><div class="panel-b"><div class="stat"><span class="k">Total Aset</span><span class="v" style="color:var(--go)">${fmtRp(ta)}</span><span class="s">${S.assets.filter(a=>!a.liab).length} pos aset</span></div></div></div>
    <div class="panel col-4"><div class="panel-b"><div class="stat"><span class="k">Total Utang</span><span class="v" style="color:var(--overdue)">${fmtRp(tl)}</span><span class="s">${S.assets.filter(a=>a.liab).length} pos utang</span></div></div></div>
    <div class="panel col-7"><div class="panel-h"><div class="panel-title"><span class="dot"></span>Komposisi Aset</div></div><div class="panel-b">${Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<div class="goal"><div class="goal-h"><span class="goal-n">${c}</span><span class="goal-v"><b>${fmtRp(v)}</b> · ${Math.round(v/ta*100)||0}%</span></div><div class="gauge"><i style="width:${Math.round(v/ta*100)||0}%"></i></div></div>`).join('')||'<div class="empty"><div class="em-t">Belum ada aset</div></div>'}</div></div>
    <div class="panel col-5"><div class="panel-h"><div class="panel-title"><span class="dot" style="background:var(--info)"></span>Cashflow ${lm?fmtMonth(lm):'—'}</div><button class="btn btn-ghost btn-sm" onclick="finView='monthly';render()">Ledger</button></div><div class="panel-b">${ag?`<div class="stat-row"><div class="stat"><span class="k">Surplus Personal</span><span class="v" style="font-size:17px;color:var(--brass-dim)">${fmtRp((ag.pi-ag.pe)*1e6)}</span></div><div class="stat"><span class="k">Surplus Bisnis</span><span class="v" style="font-size:17px;color:var(--brass-dim)">${fmtRp((ag.bi-ag.be)*1e6)}</span></div></div><div class="hint" style="margin-top:12px">Personal: masuk ${fmtRp(ag.pi*1e6)} · keluar ${fmtRp(ag.pe*1e6)}<br>Bisnis: masuk ${fmtRp(ag.bi*1e6)} · keluar ${fmtRp(ag.be*1e6)}</div>`:'<div class="empty"><div class="em-t">Belum ada catatan bulanan</div></div>'}</div></div>
  </div>`;
}
function ledEntry(mk,scope){return S.finance.ledger.find(e=>e.month===mk&&e.scope===scope)}
function finMonthly(){
  const cm=window._finMonth||monthKey(0);
  const per=ledEntry(cm,'personal')||{income:0,expense:0,note:''};
  const months=ledgerMonths().slice().reverse();
  return`<div class="panel" style="margin-bottom:16px"><div class="panel-h"><div class="panel-title"><span class="dot"></span>Input / edit — ${fmtMonth(cm)}</div></div><div class="panel-b">
    <div class="field" style="margin-bottom:14px;max-width:220px"><label>Bulan</label><input type="month" value="${cm}" onchange="window._finMonth=this.value;render()"></div>
    <div style="font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:8px">Personal (Juta Rp)</div>
    <div class="field-row3" style="margin-bottom:18px"><div class="field"><label>Pemasukan</label><input id="fm-p-in" type="number" value="${per.income||0}"></div><div class="field"><label>Pengeluaran</label><input id="fm-p-out" type="number" value="${per.expense||0}"></div><div class="field"><label>Catatan personal</label><input id="fm-p-note" value="${esc(per.note||'')}"></div></div>
    <div style="font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:8px">Per bisnis / brand (Juta Rp)</div>
    <div style="border:1px solid var(--line-soft);border-radius:10px;overflow:hidden;margin-bottom:16px">${S.businesses.map((b,i)=>{const e=ledEntry(cm,b.id)||{income:0,expense:0};return`<div style="display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:10px;align-items:center;padding:9px 12px;${i%2?'background:var(--panel-2)':''}"><div style="font-size:13px;font-weight:500">${b.name}</div><input id="fm-b-in-${b.id}" type="number" value="${e.income||0}" placeholder="masuk" style="background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;text-align:right;font-family:var(--mono)"><input id="fm-b-out-${b.id}" type="number" value="${e.expense||0}" placeholder="keluar" style="background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;text-align:right;font-family:var(--mono)"></div>`}).join('')}</div>
    <button class="btn btn-primary" onclick="saveLedgerMonth('${cm}')">${svg('check','',15)} Simpan ${fmtMonth(cm)}</button>
    <div class="hint" style="margin-top:8px">Kosongkan (0) untuk bisnis yang tidak ada transaksi bulan itu — otomatis tidak dicatat.</div>
  </div></div>
  <div class="panel"><div class="panel-h"><div class="panel-title"><span class="dot"></span>Riwayat per bulan · ${months.length} bulan</div></div><div class="panel-b" style="overflow-x:auto">
  ${months.length?months.map(mk=>{const es=S.finance.ledger.filter(e=>e.month===mk).slice().sort((a,b)=>a.scope==='personal'?-1:1);const surp=es.reduce((s,e)=>s+((+e.income||0)-(+e.expense||0)),0);return`<div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px"><div style="font-family:var(--disp);font-weight:600;font-size:14px">${fmtMonth(mk)} <button class="btn btn-ghost btn-sm" onclick="window._finMonth='${mk}';render()">${svg('edit','',12)} edit</button></div><div class="goal-v">Total surplus: <b class="${surp>=0?'pos':'neg'}">${fmtRp(surp*1e6)}</b></div></div>
    <table class="ledger"><thead><tr><th>Untuk</th><th>Masuk</th><th>Keluar</th><th>Surplus</th><th></th></tr></thead><tbody>${es.map(e=>{const s=(+e.income||0)-(+e.expense||0);return`<tr><td>${scopeLabel(e.scope)}${e.note?`<div class="hint">${e.note}</div>`:''}</td><td class="pos">${e.income}</td><td class="neg">${e.expense}</td><td class="${s>=0?'pos':'neg'}">${s}</td><td><button class="icon-btn" style="display:inline-grid" onclick="delLed('${e.id}')">${svg('trash','',13)}</button></td></tr>`}).join('')}</tbody></table></div>`}).join(''):'<div class="empty"><div class="em-t">Belum ada catatan</div></div>'}
  <div class="hint" style="margin-top:6px">Angka dalam Juta Rupiah. Surplus = masuk − keluar.</div></div></div>`;
}
function upsertLed(month,scope,income,expense,note){const ex=ledEntry(month,scope);if(!income&&!expense&&!note){if(ex)S.finance.ledger=S.finance.ledger.filter(e=>e.id!==ex.id);return}if(ex){ex.income=income;ex.expense=expense;ex.note=note}else S.finance.ledger.push({id:uid(),month,scope,income,expense,note})}
function saveLedgerMonth(cm){upsertLed(cm,'personal',+_v('fm-p-in')||0,+_v('fm-p-out')||0,_v('fm-p-note'));S.businesses.forEach(b=>upsertLed(cm,b.id,+_v('fm-b-in-'+b.id)||0,+_v('fm-b-out-'+b.id)||0,''));save();render();toast('Bulan '+fmtMonth(cm)+' tersimpan')}
function delLed(id){S.finance.ledger=S.finance.ledger.filter(e=>e.id!==id);save();render()}
function finAssets(){return`<div class="topbar" style="margin-bottom:12px"><div class="hint">Catat aset & utang beserta lokasinya — bank, wallet, properti, equity bisnis.</div><button class="btn btn-primary" onclick="openAssetModal()">${svg('plus','',15)} Aset / Utang</button></div>

      <div><div style="font-weight:600;font-size:13px;margin-bottom:3px">3. Auto 2-way via n8n <span class="tag">PRD Fase 1</span></div><p class="hint">Sinkron otomatis (W1/W3): n8n DB Trigger → Google Calendar. SSOT waktu = Calendar.</p></div>
