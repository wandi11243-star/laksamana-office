<script>
/* Pilihan project di modal Task. Yang sudah 'Done' TIDAK ikut: project selesai
   tidak menerima task baru lagi, dan menempelkannya ke sana adalah cara paling
   cepat membuat task itu hilang dari perhatian — halaman Project Center pun
   sudah tidak menghitungnya.

   SATU PENGECUALIAN, dan ini yang menahan bug diam: project yang SEDANG
   terpasang di task yang sedang disunting tetap digambar, ditandai
   "· selesai". Tanpa itu, membuka task lama milik project yang belakangan
   ditandai Done membuat <select> tidak punya option-nya sama sekali; value-nya
   jatuh ke '' dan saveTask() MELEPAS project itu dari task-nya — gara-gara HR
   membuka form untuk membetulkan satu salah ketik, tanpa satu pun pesan. */
function projOptions(cur){
  return S.projects.filter(p=>p.stage!=='Done'||p.id===cur)
    .map(p=>`<option value="${p.id}" ${cur===p.id?'selected':''}>${p.name}${p.stage==='Done'?' · selesai':''}</option>`).join('');
}
/* ===== MODALS CORE ===== */
function openModal(html){const o=document.getElementById('overlay');document.getElementById('modal').innerHTML=html;o.classList.add('show');hydrateIcons(document.getElementById('modal'))}
function closeModal(){document.getElementById('overlay').classList.remove('show')}
function modalConfirm(title,msg,onYes){window._confirmCb=onYes;openModal(`<div class="modal-h"><h3>${title}</h3><button class="icon-btn" onclick="closeModal()">${svg('x','',18)}</button></div><div class="modal-b"><p style="margin:0;color:var(--muted)">${msg}</p></div><div class="modal-f"><div></div><div style="display:flex;gap:8px"><button class="btn btn-ghost" onclick="closeModal()">Batal</button><button class="btn btn-primary" style="background:var(--overdue);border-color:var(--overdue)" onclick="window._confirmCb&&window._confirmCb()">Ya, lanjut</button></div></div>`)}
let editId=null,mUrgent=false,mImportant=false;

/* ===== TASK MODAL ===== */
function openTaskModal(id,prefill){editId=id;prefill=prefill||{};const t=id?S.tasks.find(x=>x.id===id):null;mUrgent=t?t.urgent:false;mImportant=t?t.important:true;const curBiz=t?t.biz:(prefill.biz||'');const curProj=t?t.project:(prefill.project||'');
  openModal(`<div class="modal-h"><h3>${t?'Edit Task':'Task Baru'}</h3><button class="icon-btn" onclick="closeModal()">${svg('x','',18)}</button></div><div class="modal-b">
    <div class="field"><label>Nama task</label><input id="f-name" value="${t?esc(t.name):''}" placeholder="Apa yang harus dikerjakan?" autofocus></div>
    <div class="field"><label>Detail / keterangan (opsional)</label><textarea id="f-desc" placeholder="Konteks, checklist singkat, catatan…">${t?esc(t.desc||''):''}</textarea></div>
    <div class="field-row"><div class="field"><label>Bisnis</label><select id="f-biz"><option value="">— Tanpa bisnis —</option>${S.businesses.map(b=>`<option ${curBiz===b.name?'selected':''}>${b.name}</option>`).join('')}</select></div><div class="field"><label>Project</label><select id="f-proj"><option value="">— Tanpa project —</option>${projOptions(curProj)}</select></div></div>
    <div class="field-row"><div class="field"><label>Owner / PIC</label><input id="f-owner" value="${t?esc(t.owner||''):''}" placeholder="Saya / nama tim"></div><div class="field"><label>Deadline</label><input id="f-due" type="date" value="${t?t.due||'':''}"></div></div>
    <div class="field-row"><div class="field"><label>Estimasi (menit)</label><input id="f-est" type="number" value="${t?t.est||'':''}" placeholder="mis. 30"></div><div class="field"><label>&nbsp;</label><div class="q-preview q-${quadrant({important:mImportant,urgent:mUrgent}).k}" id="q-prev" style="padding:11px"></div></div></div>
    <div class="field"><label>Prioritas (Eisenhower)</label><div class="toggles"><button class="toggle ${mImportant?'on':''}" id="tg-imp" onclick="tgl('imp')"><span class="tick">${svg('check')}</span>Penting</button><button class="toggle ${mUrgent?'on':''}" id="tg-urg" onclick="tgl('urg')"><span class="tick">${svg('check')}</span>Mendesak</button></div></div>
  </div><div class="modal-f"><div>${t?`<button class="btn btn-ghost" onclick="delTask('${t.id}');closeModal()" style="color:var(--overdue)">${svg('trash','',15)} Hapus</button>`:''}</div><div style="display:flex;gap:8px"><button class="btn btn-ghost" onclick="closeModal()">Batal</button><button class="btn btn-primary" onclick="saveTask()">${t?'Simpan':'Tambah'}</button></div></div>`);updateQPrev()}
function tgl(w){if(w==='imp')mImportant=!mImportant;else mUrgent=!mUrgent;document.getElementById('tg-imp').classList.toggle('on',mImportant);document.getElementById('tg-urg').classList.toggle('on',mUrgent);updateQPrev()}
function updateQPrev(){const q=quadrant({important:mImportant,urgent:mUrgent});const el=document.getElementById('q-prev');el.className='q-preview q-'+q.k;el.innerHTML=`${q.label}`}
function saveTask(){const name=document.getElementById('f-name').value.trim();if(!name){toast('Nama task wajib diisi');return}const data={name,desc:document.getElementById('f-desc').value,biz:document.getElementById('f-biz').value,project:document.getElementById('f-proj').value,owner:document.getElementById('f-owner').value,due:document.getElementById('f-due').value,important:mImportant,urgent:mUrgent,est:+document.getElementById('f-est').value||0};if(editId)Object.assign(S.tasks.find(t=>t.id===editId),data);else S.tasks.unshift({id:uid(),done:false,...data});save();closeModal();render();toast(editId?'Task diperbarui':'Task ditambahkan')}
function toggleTask(id){const t=S.tasks.find(x=>x.id===id);t.done=!t.done;save();render()}
function delTask(id){S.tasks=S.tasks.filter(t=>t.id!==id);save();render()}

/* ===== PROJECT MODAL ===== */
function openProjModal(id){editId=id;const p=id?S.projects.find(x=>x.id===id):null;
  openModal(`<div class="modal-h"><h3>${p?'Edit Project':'Project Baru'}</h3><button class="icon-btn" onclick="closeModal()">${svg('x','',18)}</button></div><div class="modal-b">
    <div class="field"><label>Nama project</label><input id="p-name" value="${p?esc(p.name):''}" autofocus></div>
    <div class="field"><label>Deskripsi singkat</label><textarea id="p-desc" placeholder="Tujuan & konteks project…">${p?esc(p.desc||''):''}</textarea></div>
    <div class="field-row"><div class="field"><label>Bisnis</label><select id="p-biz"><option value="">—</option>${S.businesses.map(b=>`<option ${p&&p.biz===b.name?'selected':''}>${b.name}</option>`).join('')}</select></div><div class="field"><label>Prioritas</label><select id="p-prio">${['High','Med','Low'].map(x=>`<option ${p&&p.priority===x?'selected':''}>${x}</option>`).join('')}</select></div></div>
    <div class="field-row"><div class="field"><label>PIC (penanggung jawab)</label><input id="p-pic" value="${p?esc(p.pic||''):''}" placeholder="Saya / nama"></div><div class="field"><label>Tim terlibat</label><input id="p-team" value="${p?esc(p.team||''):''}" placeholder="Ops, Marketing…"></div></div>
    <div class="field-row"><div class="field"><label>Stage</label><select id="p-stage">${STAGES.map(x=>`<option ${p&&p.stage===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Deadline</label><input id="p-due" type="date" value="${p?p.due||'':''}"></div></div>
    <div class="field"><label>Progress manual: <span id="pp-val">${p?p.progress||0:0}</span>% <span class="hint">(otomatis dari task jika ada)</span></label><input id="p-prog" type="range" min="0" max="100" value="${p?p.progress||0:0}" oninput="document.getElementById('pp-val').textContent=this.value" style="width:100%"></div>
  </div><div class="modal-f"><div>${p?`<button class="btn btn-ghost" onclick="delProj('${p.id}');closeModal();setView('projects')" style="color:var(--overdue)">${svg('trash','',15)} Hapus</button>`:''}</div><div style="display:flex;gap:8px"><button class="btn btn-ghost" onclick="closeModal()">Batal</button><button class="btn btn-primary" onclick="saveProj()">${p?'Simpan':'Tambah'}</button></div></div>`)}
function saveProj(){const name=document.getElementById('p-name').value.trim();if(!name){toast('Nama wajib diisi');return}const data={name,desc:document.getElementById('p-desc').value,biz:document.getElementById('p-biz').value,priority:document.getElementById('p-prio').value,pic:document.getElementById('p-pic').value,team:document.getElementById('p-team').value,stage:document.getElementById('p-stage').value,due:document.getElementById('p-due').value,progress:+document.getElementById('p-prog').value};if(editId)Object.assign(S.projects.find(p=>p.id===editId),data);else S.projects.unshift({id:uid(),...data});save();closeModal();render();toast(editId?'Project diperbarui':'Project ditambahkan')}
function delProj(id){S.projects=S.projects.filter(p=>p.id!==id);S.tasks.forEach(t=>{if(t.project===id)t.project=''});save();render()}

/* ===== CONTENT MODAL ===== */
function openContentModal(id){editId=id;const c=id?S.content.find(x=>x.id===id):null;
  openModal(`<div class="modal-h"><h3>${c?'Edit Konten':'Konten Baru'}</h3><button class="icon-btn" onclick="closeModal()">${svg('x','',18)}</button></div><div class="modal-b">
    <div class="field"><label>Judul / ide</label><input id="c-title" value="${c?esc(c.title):''}" autofocus></div>
    <div class="field-row"><div class="field"><label>Akun</label><select id="c-channel">${S.channels.map(ch=>`<option ${c&&c.channel===ch?'selected':(!c&&contentFilter!=='all'&&contentFilter===ch?'selected':'')}>${ch}</option>`).join('')}</select></div><div class="field"><label>Platform</label><select id="c-platform">${['Instagram','TikTok','YouTube','LinkedIn','Threads','Newsletter','Podcast'].map(p=>`<option ${c&&c.platform===p?'selected':''}>${p}</option>`).join('')}</select></div></div>
    <div class="field-row"><div class="field"><label>Stage</label><select id="c-stage">${CSTAGES.map(s=>`<option ${c&&c.stage===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Tanggal publish</label><input id="c-date" type="date" value="${c?c.date||'':''}"></div></div>
    <div class="field"><label>Catatan (hook / angle)</label><textarea id="c-notes" placeholder="Hook, CTA, angle…">${c?esc(c.notes||''):''}</textarea></div>
  </div><div class="modal-f"><div>${c?`<button class="btn btn-ghost" onclick="delContent('${c.id}');closeModal()" style="color:var(--overdue)">${svg('trash','',15)}</button>${c.date?`<button class="btn" onclick="openGcal('🎬 ${esc(c.title)}','${c.date}',null,null,'Content')">${svg('gcal','',15)} + GCal</button>`:''}`:''}</div><div style="display:flex;gap:8px"><button class="btn btn-ghost" onclick="closeModal()">Batal</button><button class="btn btn-primary" onclick="saveContent()">${c?'Simpan':'Tambah'}</button></div></div>`)}
function saveContent(){const title=document.getElementById('c-title').value.trim();if(!title){toast('Judul wajib diisi');return}const data={title,channel:document.getElementById('c-channel').value,platform:document.getElementById('c-platform').value,stage:document.getElementById('c-stage').value,date:document.getElementById('c-date').value,notes:document.getElementById('c-notes').value};if(editId)Object.assign(S.content.find(c=>c.id===editId),data);else S.content.unshift({id:uid(),...data});save();closeModal();render();toast('Konten tersimpan')}
function delContent(id){S.content=S.content.filter(c=>c.id!==id);save();render()}
function openChannelsModal(){openModal(`<div class="modal-h"><h3>Akun yang dikelola</h3><button class="icon-btn" onclick="closeModal()">${svg('x','',18)}</button></div><div class="modal-b"><div class="field"><label>Satu akun per baris</label><textarea id="ch-list" style="min-height:130px">${S.channels.join('\n')}</textarea><div class="hint" style="margin-top:6px">Contoh: @howandichandra (Personal), Podcast (Side Project). Hanya akun yang Anda kelola sendiri.</div></div></div><div class="modal-f"><div></div><div style="display:flex;gap:8px"><button class="btn btn-ghost" onclick="closeModal()">Batal</button><button class="btn btn-primary" onclick="saveChannels()">Simpan</button></div></div>`)}
function saveChannels(){S.channels=document.getElementById('ch-list').value.split('\n').map(s=>s.trim()).filter(Boolean);if(contentFilter!=='all'&&!S.channels.includes(contentFilter))contentFilter='all';save();closeModal();render();toast('Akun diperbarui')}

/* ===== GOAL MODAL ===== */
function openGoalModal(id){editId=id;const g=id?S.goals.find(x=>x.id===id):null;
  openModal(`<div class="modal-h"><h3>${g?'Update Goal':'Goal Baru'}</h3><button class="icon-btn" onclick="closeModal()">${svg('x','',18)}</button></div><div class="modal-b"><div class="field"><label>Nama goal</label><input id="g-name" value="${g?esc(g.name):''}" autofocus></div><div class="field"><label>Deskripsi singkat</label><input id="g-desc" value="${g?esc(g.desc||''):''}" placeholder="Kenapa goal ini penting…"></div><div class="field-row"><div class="field"><label>Nilai sekarang</label><input id="g-cur" type="number" value="${g?g.cur:0}"></div><div class="field"><label>Target</label><input id="g-target" type="number" value="${g?g.target:100}"></div></div><div class="field-row"><div class="field"><label>Satuan</label><input id="g-unit" value="${g?esc(g.unit):''}" placeholder=" Jt / kg / x"></div><div class="field"><label>Area</label><select id="g-area">${['Finance','Health','Content','Learning','Business','Family','Spiritual','Travel','Relationship'].map(a=>`<option ${g&&g.area===a?'selected':''}>${a}</option>`).join('')}</select></div></div><div class="field"><label>Terhubung ke milestone (Roadmap)</label><select id="g-mile">${roadmapOptions(g?g.milestone:'')}</select><div class="hint" style="margin-top:6px">Progress goal ini otomatis tampil di milestone terkait.</div></div></div><div class="modal-f"><div>${g?`<button class="btn btn-ghost" onclick="delGoal('${g.id}');closeModal()" style="color:var(--overdue)">${svg('trash','',15)} Hapus</button>`:''}</div><div style="display:flex;gap:8px"><button class="btn btn-ghost" onclick="closeModal()">Batal</button><button class="btn btn-primary" onclick="saveGoal()">${g?'Simpan':'Tambah'}</button></div></div>`)}
function saveGoal(){const name=document.getElementById('g-name').value.trim();if(!name){toast('Nama wajib diisi');return}const data={name,desc:document.getElementById('g-desc').value,cur:+document.getElementById('g-cur').value||0,target:+document.getElementById('g-target').value||1,unit:document.getElementById('g-unit').value,area:document.getElementById('g-area').value,milestone:document.getElementById('g-mile').value};if(editId)Object.assign(S.goals.find(g=>g.id===editId),data);else S.goals.push({id:uid(),...data});save();closeModal();render();toast('Goal tersimpan')}
function delGoal(id){S.goals=S.goals.filter(g=>g.id!==id);save();render()}

/* ===== ROADMAP / DREAM MODALS ===== */
function openMileModal(id){editId=id;const r=id?S.roadmap.find(x=>x.id===id):null;
  openModal(`<div class="modal-h"><h3>${r?'Edit Milestone':'Milestone Baru'}</h3><button class="icon-btn" onclick="closeModal()">${svg('x','',18)}</button></div><div class="modal-b"><div class="field"><label>Milestone (target karir/hidup)</label><input id="r-title" value="${r?esc(r.title):''}" placeholder="mis. Menikah / Beli rumah / 10 cabang" autofocus></div><div class="field"><label>Deskripsi singkat</label><input id="r-desc" value="${r?esc(r.desc||''):''}" placeholder="Detail / target ukur…"></div><div class="field"><label>Tahun target</label><input id="r-year" type="number" value="${r?r.year:THISYEAR+1}"></div></div><div class="modal-f"><div>${r?`<button class="btn btn-ghost" onclick="delMile('${r.id}');closeModal()" style="color:var(--overdue)">${svg('trash','',15)}</button>`:''}</div><div style="display:flex;gap:8px"><button class="btn btn-ghost" onclick="closeModal()">Batal</button><button class="btn btn-primary" onclick="saveMile()">${r?'Simpan':'Tambah'}</button></div></div>`)}
function saveMile(){const title=document.getElementById('r-title').value.trim();if(!title){toast('Isi milestone dulu');return}const data={title,desc:document.getElementById('r-desc').value,year:+document.getElementById('r-year').value||THISYEAR};if(editId)Object.assign(S.roadmap.find(r=>r.id===editId),data);else S.roadmap.push({id:uid(),done:false,...data});save();closeModal();render();toast('Milestone tersimpan')}
function toggleMile(id){const r=S.roadmap.find(x=>x.id===id);r.done=!r.done;save();render()}

function openDreamModal(id){editId=id;const d=id?S.dreams.find(x=>x.id===id):null;const labels={Travel:'Travel — Negara',Education:'Pendidikan — Kuliah/Kursus',Career:'Karir & Bisnis',Experience:'Pengalaman',Other:'Lainnya'};
  openModal(`<div class="modal-h"><h3>${d?'Edit Mimpi':'Mimpi Baru'}</h3><button class="icon-btn" onclick="closeModal()">${svg('x','',18)}</button></div><div class="modal-b"><div class="field"><label>Mimpi / bucket list</label><input id="d-title" value="${d?esc(d.title):''}" placeholder="mis. Kunjungi Jepang / Ambil S2" autofocus></div><div class="field-row"><div class="field"><label>Kategori</label><select id="d-cat">${Object.keys(DREAM_CAT).map(c=>`<option value="${c}" ${d&&d.cat===c?'selected':''}>${labels[c]}</option>`).join('')}</select></div><div class="field"><label>Status</label><select id="d-status">${['Someday','Planning','Done'].map(s=>`<option ${d&&d.status===s?'selected':''}>${s}</option>`).join('')}</select></div></div><div class="field-row"><div class="field"><label>Target tahun (opsional)</label><input id="d-year" value="${d?d.year||'':''}" placeholder="mis. 2027"></div><div class="field"><label>Catatan</label><input id="d-note" value="${d?esc(d.note||''):''}"></div></div><div class="field"><label>Terhubung ke milestone (Roadmap)</label><select id="d-mile">${roadmapOptions(d?d.milestone:'')}</select></div></div><div class="modal-f"><div>${d?`<button class="btn btn-ghost" onclick="delDream('${d.id}');closeModal()" style="color:var(--overdue)">${svg('trash','',15)}</button>`:''}</div><div style="display:flex;gap:8px"><button class="btn btn-ghost" onclick="closeModal()">Batal</button><button class="btn btn-primary" onclick="saveDream()">${d?'Simpan':'Tambah'}</button></div></div>`)}

function delDream(id){S.dreams=S.dreams.filter(d=>d.id!==id);save();render()}

/* ===== LEARNING MODAL ===== */
function openLearnModal(id){editId=id;const l=id?S.learning.find(x=>x.id===id):null;
  openModal(`<div class="modal-h"><h3>${l?'Edit Catatan':'Catatan Belajar'}</h3><button class="icon-btn" onclick="closeModal()">${svg('x','',18)}</button></div><div class="modal-b"><div class="field"><label>Judul</label><input id="l-title" value="${l?esc(l.title):''}" placeholder="Judul buku/video/film" autofocus></div><div class="field-row"><div class="field"><label>Tipe</label><select id="l-type">${['Buku','Video','Film','Podcast','Artikel','Course'].map(t=>`<option ${l&&l.type===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label>Sumber / penulis</label><input id="l-source" value="${l?esc(l.source||''):''}"></div></div><div class="field-row"><div class="field"><label>Status</label><select id="l-status">${['Sedang','Selesai'].map(s=>`<option ${l&&l.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Rating (0–5)</label><input id="l-rating" type="number" min="0" max="5" value="${l?l.rating||0:0}"></div></div><div class="field"><label>Key takeaway / refleksi</label><textarea id="l-take" style="min-height:100px" placeholder="Apa yang kamu ambil? Bagaimana diterapkan?">${l?esc(l.take||''):''}</textarea></div></div><div class="modal-f"><div>${l?`<button class="btn btn-ghost" onclick="delLearn('${l.id}');closeModal()" style="color:var(--overdue)">${svg('trash','',15)} Hapus</button>`:''}</div><div style="display:flex;gap:8px"><button class="btn btn-ghost" onclick="closeModal()">Batal</button><button class="btn btn-primary" onclick="saveLearn()">${l?'Simpan':'Tambah'}</button></div></div>`)}
function saveLearn(){const title=document.getElementById('l-title').value.trim();if(!title){toast('Judul wajib diisi');return}const ex=editId&&S.learning.find(x=>x.id===editId);const data={title,type:document.getElementById('l-type').value,source:document.getElementById('l-source').value,status:document.getElementById('l-status').value,rating:Math.max(0,Math.min(5,+document.getElementById('l-rating').value||0)),take:document.getElementById('l-take').value,date:ex?ex.date:todayISO()};if(editId)Object.assign(S.learning.find(l=>l.id===editId),data);else S.learning.unshift({id:uid(),...data});save();closeModal();render();toast('Catatan tersimpan')}
function delLearn(id){S.learning=S.learning.filter(l=>l.id!==id);save();render()}

/* ===== REVIEW MODAL ===== */
function openReviewModal(id){editId=id;let r=id?S.reviews.find(x=>x.id===id):null;const wk=r?r.weekStart:weekKey(new Date());if(!r){const ex=S.reviews.find(x=>x.weekStart===wk);if(ex){r=ex;editId=ex.id}}
  const R=r||{weekStart:wk,sContent:3,sBusiness:3,sProject:3,sPersonal:3,wins:'',improve:''};
  openModal(`<div class="modal-h"><h3>${r?'Edit Evaluasi':'Evaluasi Mingguan'}</h3><button class="icon-btn" onclick="closeModal()">${svg('x','',18)}</button></div><div class="modal-b"><div class="field"><label>Minggu (pilih tanggal mana saja di minggu itu)</label><input id="v-week" type="date" value="${R.weekStart}"><div class="hint" style="margin-top:6px">Otomatis dikelompokkan per minggu (Senin–Minggu) & di-recap per bulan.</div></div><div class="field-row"><div class="field"><label>Skor Konten (1–5)</label><input id="v-c" type="number" min="1" max="5" value="${R.sContent}"></div><div class="field"><label>Skor Bisnis (1–5)</label><input id="v-b" type="number" min="1" max="5" value="${R.sBusiness}"></div></div><div class="field-row"><div class="field"><label>Skor Project (1–5)</label><input id="v-p" type="number" min="1" max="5" value="${R.sProject}"></div><div class="field"><label>Skor Personal (1–5)</label><input id="v-pe" type="number" min="1" max="5" value="${R.sPersonal}"></div></div><div class="field"><label>Yang berhasil minggu ini</label><textarea id="v-wins" placeholder="Pencapaian, hal yang jalan…">${esc(R.wins)}</textarea></div><div class="field"><label>Yang perlu diperbaiki</label><textarea id="v-improve" placeholder="Perbaikan untuk minggu depan…">${esc(R.improve)}</textarea></div></div><div class="modal-f"><div>${r?`<button class="btn btn-ghost" onclick="delReview('${r.id}');closeModal()" style="color:var(--overdue)">${svg('trash','',15)} Hapus</button>`:''}</div><div style="display:flex;gap:8px"><button class="btn btn-ghost" onclick="closeModal()">Batal</button><button class="btn btn-primary" onclick="saveReview()">${r?'Simpan':'Tambah'}</button></div></div>`)}
function clamp5(v){return Math.max(1,Math.min(5,+v||3))}
function saveReview(){const wd=document.getElementById('v-week').value;if(!wd){toast('Pilih minggu');return}const weekStart=weekKey(new Date(wd+'T00:00'));const data={weekStart,sContent:clamp5(document.getElementById('v-c').value),sBusiness:clamp5(document.getElementById('v-b').value),sProject:clamp5(document.getElementById('v-p').value),sPersonal:clamp5(document.getElementById('v-pe').value),wins:document.getElementById('v-wins').value,improve:document.getElementById('v-improve').value};if(editId)Object.assign(S.reviews.find(r=>r.id===editId),data);else{const ex=S.reviews.find(r=>r.weekStart===weekStart);if(ex)Object.assign(ex,data);else S.reviews.push({id:uid(),...data})}save();closeModal();render();toast('Evaluasi tersimpan')}
function delReview(id){S.reviews=S.reviews.filter(r=>r.id!==id);save();render()}

/* ===== ASSET MODAL ===== */
function openAssetModal(id){editId=id;const a=id?S.assets.find(x=>x.id===id):null;window._liab=a?a.liab:false;
  openModal(`<div class="modal-h"><h3>${a?'Edit Aset':'Aset / Utang Baru'}</h3><button class="icon-btn" onclick="closeModal()">${svg('x','',18)}</button></div><div class="modal-b"><div class="field"><label>Nama aset</label><input id="a-name" value="${a?esc(a.name):''}" placeholder="mis. Kas BCA / Rumah / Crypto" autofocus></div><div class="field-row"><div class="field"><label>Kategori</label><select id="a-cat">${ASSET_CATS.map(c=>`<option ${a&&a.cat===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>Lokasi / di mana</label><input id="a-loc" value="${a?esc(a.loc||''):''}" placeholder="BCA / Metamask / rumah"></div></div><div class="field-row"><div class="field"><label>Jumlah / berat (opsional)</label><input id="a-qty" type="number" step="any" value="${a&&a.qty?a.qty:''}" placeholder="mis. 100 / 2"></div><div class="field"><label>Satuan</label><input id="a-unit" list="unitlist" value="${a?esc(a.unit||''):''}" placeholder="gram / hektar / m² / unit"><datalist id="unitlist"><option>gram</option><option>kg</option><option>hektar</option><option>m²</option><option>unit</option><option>% saham</option><option>lot</option><option>lembar</option><option>koin</option></datalist></div></div><div class="field"><label>Nilai / total (Rp)</label><input id="a-value" type="number" value="${a?a.value:''}" placeholder="120000000"></div><div class="field"><label>Jenis</label><div class="toggles"><button class="toggle ${!window._liab?'on':''}" id="a-asset" onclick="setLiab(false)"><span class="tick">${svg('check')}</span>Aset</button><button class="toggle ${window._liab?'on':''}" id="a-liab" onclick="setLiab(true)"><span class="tick">${svg('check')}</span>Utang</button></div></div></div><div class="modal-f"><div>${a?`<button class="btn btn-ghost" onclick="delAsset('${a.id}');closeModal()" style="color:var(--overdue)">${svg('trash','',15)}</button>`:''}</div><div style="display:flex;gap:8px"><button class="btn btn-ghost" onclick="closeModal()">Batal</button><button class="btn btn-primary" onclick="saveAsset()">${a?'Simpan':'Tambah'}</button></div></div>`)}
function setLiab(v){window._liab=v;document.getElementById('a-asset').classList.toggle('on',!v);document.getElementById('a-liab').classList.toggle('on',v);if(v)document.getElementById('a-cat').value='Utang'}
function saveAsset(){const name=document.getElementById('a-name').value.trim();if(!name){toast('Nama wajib diisi');return}const data={name,cat:document.getElementById('a-cat').value,loc:document.getElementById('a-loc').value,qty:+document.getElementById('a-qty').value||0,unit:document.getElementById('a-unit').value,value:+document.getElementById('a-value').value||0,liab:!!window._liab};if(editId)Object.assign(S.assets.find(a=>a.id===editId),data);else S.assets.push({id:uid(),...data});save();closeModal();render();toast('Aset tersimpan')}
function delAsset(id){S.assets=S.assets.filter(a=>a.id!==id);save();render()}

/* ===== EVENT MODAL ===== */
function openEventModal(id,preset){editId=id;const e=id?S.events.find(x=>x.id===id):null;
  openModal(`<div class="modal-h"><h3>${e?'Edit Event':'Event Baru'}</h3><button class="icon-btn" onclick="closeModal()">${svg('x','',18)}</button></div><div class="modal-b"><div class="field"><label>Judul</label><input id="e-title" value="${e?esc(e.title):''}" autofocus></div><div class="field-row"><div class="field"><label>Tanggal</label><input id="e-date" type="date" value="${e?e.date:(preset||todayISO())}"></div><div class="field"><label>Tipe</label><select id="e-type">${[['meeting','Meeting'],['deadline','Deadline'],['personal','Personal / Gym'],['content','Content Shoot'],['event','Event / Lainnya']].map(([v,l])=>`<option value="${v}" ${e&&e.type===v?'selected':''}>${l}</option>`).join('')}</select></div></div><div class="field-row"><div class="field"><label>Mulai</label><input id="e-start" type="time" value="${e?e.start||'':''}"></div><div class="field"><label>Selesai</label><input id="e-end" type="time" value="${e?e.end||'':''}"></div></div></div><div class="modal-f"><div>${e?`<button class="btn btn-ghost" onclick="delEvent('${e.id}');closeModal()" style="color:var(--overdue)">${svg('trash','',15)}</button><button class="btn" onclick="openGcal('${esc(e.title)}','${e.date}','${e.start||''}','${e.end||''}','Howandi Life OS')">${svg('gcal','',15)} + GCal</button>`:''}</div><div style="display:flex;gap:8px"><button class="btn btn-ghost" onclick="closeModal()">Batal</button><button class="btn btn-primary" onclick="saveEvent()">${e?'Simpan':'Tambah'}</button></div></div>`)}
function saveEvent(){const title=document.getElementById('e-title').value.trim();if(!title){toast('Judul wajib diisi');return}const data={title,date:document.getElementById('e-date').value,start:document.getElementById('e-start').value,end:document.getElementById('e-end').value,type:document.getElementById('e-type').value};const isNew=!editId;if(editId)Object.assign(S.events.find(e=>e.id===editId),data);else S.events.push({id:uid(),...data});save();closeModal();render();if(isNew){setTimeout(()=>{if(confirm('Event tersimpan. Tambahkan ke Google Calendar sekarang?'))openGcal(data.title,data.date,data.start,data.end,'Howandi Life OS')},100)}else toast('Event diperbarui')}
function delEvent(id){S.events=S.events.filter(e=>e.id!==id);save();render()}

/* ===== BUSINESS MODAL ===== */
function openBizModal(id){editId=id;const b=id?S.businesses.find(x=>x.id===id):null;
  openModal(`<div class="modal-h"><h3>${b?'Edit Bisnis':'Bisnis Baru'}</h3><button class="icon-btn" onclick="closeModal()">${svg('x','',18)}</button></div><div class="modal-b"><div class="field"><label>Nama bisnis</label><input id="b-name" value="${b?esc(b.name):''}" autofocus></div><div class="field-row"><div class="field"><label>Bidang / bergerak di</label><input id="b-field" value="${b?esc(b.field||''):''}" placeholder="mis. F&B — Restoran"></div><div class="field"><label>Tahun berdiri</label><input id="b-founded" type="number" value="${b?b.founded||'':''}" placeholder="2021"></div></div><div class="field"><label>Deskripsi singkat</label><textarea id="b-desc" placeholder="Tentang bisnis ini…">${b?esc(b.desc||''):''}</textarea></div><div class="field-row"><div class="field"><label>Avg Revenue / tahun (Rp)</label><input id="b-rev" type="number" value="${b?b.revenue||0:0}" placeholder="2400000000"></div><div class="field"><label>Life Area</label><select id="b-area">${['Business','Content','Finance','Investment','CEO','Social','Travel'].map(a=>`<option ${b&&b.area===a?'selected':''}>${a}</option>`).join('')}</select></div></div></div><div class="modal-f"><div>${b?`<button class="btn btn-ghost" onclick="delBiz('${b.id}')" style="color:var(--overdue)">${svg('trash','',15)} Hapus</button>`:''}</div><div style="display:flex;gap:8px"><button class="btn btn-ghost" onclick="closeModal()">Batal</button><button class="btn btn-primary" onclick="saveBiz()">${b?'Simpan':'Tambah'}</button></div></div>`)}
function saveBiz(){const name=document.getElementById('b-name').value.trim();if(!name){toast('Nama wajib diisi');return}const data={name,field:document.getElementById('b-field').value,founded:+document.getElementById('b-founded').value||'',desc:document.getElementById('b-desc').value,revenue:+document.getElementById('b-rev').value||0,area:document.getElementById('b-area').value};if(editId)Object.assign(S.businesses.find(b=>b.id===editId),data);else S.businesses.push({id:uid(),...data});save();closeModal();render();toast('Bisnis tersimpan')}
function delBiz(id){modalConfirm('Hapus bisnis?','Task & project yang terhubung tidak ikut terhapus.',()=>{S.businesses=S.businesses.filter(b=>b.id!==id);save();closeModal();if(view==='bizDetail')setView('business');else render()})}

/* ===== PASSWORD / AUTH ===== */
function openPwModal(isChange){openModal(`<div class="modal-h"><h3>${isChange?'Ganti Password':'Aktifkan Login'}</h3><button class="icon-btn" onclick="closeModal()">${svg('x','',18)}</button></div><div class="modal-b"><div class="field"><label>Password baru</label><input id="pw1" type="password" placeholder="Minimal 4 karakter" autofocus></div><div class="field"><label>Ulangi password</label><input id="pw2" type="password" placeholder="Ketik ulang"></div><div class="hint">Password disimpan sebagai hash di penyimpanan lokal. Kunci ini bersifat sisi-browser — untuk keamanan penuh saat hosting, tambahkan auth server.</div></div><div class="modal-f"><div></div><div style="display:flex;gap:8px"><button class="btn btn-ghost" onclick="closeModal()">Batal</button><button class="btn btn-primary" onclick="savePw()">Simpan</button></div></div>`)}
async function savePw(){const p1=document.getElementById('pw1').value,p2=document.getElementById('pw2').value;if(p1.length<4){toast('Password minimal 4 karakter');return}if(p1!==p2){toast('Password tidak sama');return}S.auth={enabled:true,hash:await hashPw(p1)};unlocked=true;save();closeModal();render();toast('Login diaktifkan')}
function disableAuth(){modalConfirm('Nonaktifkan login?','App tidak akan meminta password lagi saat dibuka.',()=>{S.auth={enabled:false,hash:''};save();closeModal();render();toast('Login dinonaktifkan')})}

/* ===== MISC ===== */
function setDial(k,v){S[k]=v;save();document.querySelectorAll('#'+k+'-dial .seg').forEach((s,i)=>s.classList.toggle('on',i<v))}
function addDump(){const el=document.getElementById('dump-in');const v=el.value.trim();if(!v)return;S.dump.unshift(v);el.value='';save();render()}
function rmDump(i){S.dump.splice(i,1);save();render()}
function toggleHabit(id){const h=S.habits.find(x=>x.id===id);const t=todayISO();if(h.dates.includes(t)){h.dates=h.dates.filter(d=>d!==t);h.streak=Math.max(0,h.streak-1)}else{h.dates.push(t);h.streak++}save();render()}

/* ===== INIT ===== */
/* Keluar = kembali ke Office. Sesi SSO (lm_session) sengaja TIDAK dihapus —
   sama seperti modul lain: ini "keluar dari modul", bukan logout dari Office.
   Office sendiri yang menyediakan logout penuh. */
function logoutOffice(){ location.replace('../'); }
/* Ciutkan menu ke ikon (desktop). Diingat per perangkat. */
function toggleNav(){
  const app=document.getElementById('app'), mini=!app.classList.contains('nav-mini');
  app.classList.toggle('nav-mini',mini);
  try{ localStorage.setItem('lm_howandi_navmini',mini?'1':'0'); }catch(e){}
}
(function(){ try{ if(localStorage.getItem('lm_howandi_navmini')==='1'){ var a=document.getElementById('app'); if(a) a.classList.add('nav-mini'); } }catch(e){} })();
// Isi kartu user di kaki rail dari sesi SSO.
function isiKartuUser(){
  let s=null; try{ s=JSON.parse(localStorage.getItem('lm_session')||'null'); }catch(e){}
  const nama=(s&&s.name)||'—', peran=(s&&(s.role||s.jabatan))||'Nahkoda';
  const av=document.getElementById('su-avatar'), un=document.getElementById('su-un'), ur=document.getElementById('su-ur');
  if(av) av.textContent=(nama.trim()[0]||'?').toUpperCase();
  if(un) un.textContent=nama;
  if(ur) ur.textContent=peran;
}
function bootApp(){document.getElementById('app').style.display='grid';document.getElementById('mobtop').style.display='';document.querySelectorAll('[data-i]').forEach(el=>{if(!el.dataset.done){el.innerHTML=svg(el.dataset.i);el.dataset.done=1}});isiKartuUser();render()}
document.querySelectorAll('.nav-item').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal()});
(async function(){
  try{ await load(); }
  catch(e){
    document.getElementById('loader').innerHTML='<div style="max-width:360px;text-align:center;font-family:system-ui,sans-serif;color:#334">'
      +'<div style="font-size:34px;font-weight:800;color:#b91c1c">!</div>'
      +'<p style="margin-top:10px;font-weight:700">Gagal terhubung ke database</p>'
      +'<p style="margin-top:6px;font-size:13px;opacity:.75">'+((e&&e.message)||e)+'</p>'
      +'<button onclick="location.reload()" style="margin-top:14px;padding:9px 18px;border-radius:8px;border:1px solid #ccc;cursor:pointer">↻ Coba lagi</button></div>';
    return;
  }
  document.getElementById('loader').style.display='none';
  if(S.auth&&S.auth.enabled&&!unlocked){document.getElementById('lock').classList.add('show');setTimeout(()=>{var el=document.getElementById('lock-pw');if(el)el.focus()},50)}else{bootApp()}
})();
</script>
