function logAct(refType,refId,action,detail){
  S.activities.unshift({id:uid('act'),refType,refId,action,detail:detail||'',by:ME?ME.name:'Sistem',at:new Date().toISOString()});
  if(S.activities.length>400)S.activities.length=400;
}
function pushNotif(type,title,body,link){
  S.notifs.unshift({id:uid('nt'),type,title,body,link:link||'',read:false,at:new Date().toISOString()});
}
function unreadNotif(){ return S.notifs.filter(n=>!n.read).length; }

/* ---------- POPUP NOTIFIKASI (dropdown lonceng) ---------- */
const NOTIF_IC={dp:'money',event:'cal',fu:'pipe',inv:'invoice',invoice:'invoice',approval:'approve',payment:'money',birthday:'star',repeat:'star',template:'task'};
const NOTIF_COL={dp:'--warn',event:'--info',fu:'--gold',inv:'--danger',invoice:'--info',approval:'--violet',payment:'--ok',birthday:'--gold',repeat:'--teal'};
function toggleNotifPop(e){
  if(e)e.stopPropagation();
  const p=$('notif-pop'); if(!p)return;
  if(p.classList.contains('on')){ p.classList.remove('on'); return; }
  paintNotifPop(); p.classList.add('on');
}
function closeNotifPop(){ const p=$('notif-pop'); if(p)p.classList.remove('on'); }
function paintNotifPop(){
  const p=$('notif-pop'); if(!p)return;
  const items=S.notifs.slice(0,8);
  const unread=unreadNotif();
  let h='<div class="np-head"><b>Notifikasi'+(unread?' <span class="tag" style="background:var(--gold);color:#fff">'+unread+'</span>':'')+'</b>'
    +(unread?'<button class="btn sm" onclick="markAllRead()">Tandai dibaca</button>':'')+'</div>';
  if(!items.length) h+='<div class="np-empty">Belum ada notifikasi. Semua terkendali. ⚓</div>';
  else{
    h+='<div class="np-list">';
    items.forEach(n=>{
      const col=NOTIF_COL[n.type]||'--muted';
      h+='<div class="np-item'+(n.read?'':' unread')+'" onclick="openNotif(\''+n.id+'\')">'
        +'<div class="np-ic" style="background:color-mix(in srgb,var('+col+') 15%,transparent);color:var('+col+')">'+svg(IC[NOTIF_IC[n.type]||'notif'])+'</div>'
        +'<div class="np-tx"><b>'+esc(n.title)+'</b><span>'+esc(n.body)+'</span><div class="np-when">'+ago(n.at)+'</div></div>'
        +(n.read?'':'<span class="np-unread"></span>')+'</div>';
    });
    h+='</div>';
  }
  h+='<div class="np-foot"><button class="btn sm" style="width:100%" onclick="closeNotifPop();go(\'notifications\')">Lihat semua notifikasi</button></div>';
  p.innerHTML=h;
}
// Klik 1 notifikasi: tandai dibaca lalu lompat ke halaman terkait
function openNotif(id){
  const n=S.notifs.find(x=>x.id===id); if(!n)return;
  if(!n.read){ n.read=true; save(); }
  closeNotifPop(); buildNav();
  $('notif-dot').style.display=unreadNotif()?'block':'none';
  if(n.link) notifGo(n.link); else go('notifications');
}

function baselineDaily(){

}

/* ============================================================
   OTOMASI
   ============================================================ */
// Event yang sudah Deal & tanggalnya lewat -> Event Done (dijalankan saat boot)
function autoCloseEvents(){
  let n=0;
  S.events.forEach(e=>{
    if(['Deal','Confirmed'].includes(e.status) && e.tanggal && daysTo(e.tanggal)<0){
      e.status='Event Done'; e.pipeCol='Deal';
      logAct('event',e.id,'Status → Event Done','otomatis: tanggal event sudah lewat');
      n++;
    }
  });
  return n;
}
// Bentrok jadwal: event lain yang sudah pasti, tanggal sama, area beririsan
function bookingConflicts(ev){
  if(!ev||!ev.tanggal) return [];
  const areaOf=x=>(x.detail&&x.detail.area)||'';
  const a=areaOf(ev);
  return S.events.filter(x=>{
    if(x.id===ev.id || x.tanggal!==ev.tanggal) return false;
    if(!['Deal','Confirmed','Event Done'].includes(x.status)) return false;
    const b=areaOf(x);
    if(!a || !b) return true;                              // area belum diisi -> tetap diperingatkan
    if(a==='Seluruh Area' || b==='Seluruh Area') return true;
    return a===b;
  });
}
// Peluang yang sudah lama tidak di-follow up (perlu ditindaklanjuti)
function lastFUDate(ev){
  const fs=S.followups.filter(f=>f.eventId===ev.id);
  if(!fs.length) return ev.createdAt||'';
  return fs.map(f=>String(f.at).slice(0,10)).sort().pop();
}
function daysSinceFU(ev){ const d=lastFUDate(ev); return d?Math.max(0,daysBetween(d,today())):0; }
function isStale(ev){ return isOpenEvent(ev) && daysSinceFU(ev) >= (+S.settings.staleDays||7); }
// Tanggal default untuk follow up berikutnya
function nextFUDate(){ const d=new Date(); d.setDate(d.getDate()+(+S.settings.fuNextDays||3)); return d.toISOString().slice(0,10); }

function $(id){return document.getElementById(id);}
function toast(title,sub,kind){
  const w=$('toasts'); const el=document.createElement('div');
  el.className='toast '+(kind||'');
  const ic = kind==='err'?IC.alert:kind==='ok'?IC.check:IC.ship;
  el.innerHTML=svg(ic,'')+'<div><div class="tt">'+esc(title)+'</div>'+(sub?'<div class="ts">'+esc(sub)+'</div>':'')+'</div>';
  el.querySelector('svg').style.color = kind==='err'?'var(--danger)':kind==='ok'?'var(--ok)':'var(--gold)';
  w.appendChild(el); setTimeout(()=>{el.style.opacity='0';el.style.transform='translateX(30px)';setTimeout(()=>el.remove(),250);},2800);
}
function modal(html,size){ const m=$('modal'); m.className='modal'+(size?(' '+size):''); m.innerHTML=html; $('modal-bg').classList.add('on'); }
// _conflictShown direset di sini juga: modal konflik bisa ditutup lewat klik latar,
// dan kalau flag-nya tersangkut true, peringatan bentrok tak akan muncul lagi.
function closeModal(){ $('modal-bg').classList.remove('on'); _conflictShown=false; }
let _confirmCb=null;
function confirmUI(opts){
  _confirmCb=opts.onYes||null;
  modal('<div class="modal-head"><div><h3>'+esc(opts.title||'Konfirmasi')+'</h3>'+(opts.sub?'<p>'+esc(opts.sub)+'</p>':'')+'</div><div class="x" onclick="closeModal()">'+svg(IC.x)+'</div></div>'
   +'<div class="modal-body"><p style="color:var(--sand-dim);line-height:1.6;margin:0">'+(opts.body||'')+'</p></div>'
   +'<div class="modal-foot"><button class="btn" onclick="closeModal()">'+esc(opts.cancel||'Batal')+'</button><button class="btn '+(opts.danger?'danger-solid':'pri')+'" onclick="confirmProceed()">'+esc(opts.ok||'Hapus')+'</button></div>');
}
function confirmProceed(){ const cb=_confirmCb; _confirmCb=null; closeModal(); if(cb)cb(); }
$('modal-bg').addEventListener('click',e=>{ if(e.target===$('modal-bg'))closeModal(); });

/* Buka halaman sesuai alamat saat aplikasi baru dimuat.
   SATU definisi dipakai kedua jalur masuk (login manual & SSO). Dulu baris
   ini digandakan di dua tempat dan KEDUANYA hanya memakai bagian [0] dari
   hash — jadi membuka ulang #event/<id> kehilangan id-nya, lalu baris
   `location.hash = view` di go() menulis ulang alamatnya jadi #event tanpa
   id. Sesudah itu halamannya rusak sampai alamatnya diketik ulang. */
function bootRoute(){
  const h = location.hash.slice(1).split('/');
  go(h[0] || 'dashboard', h[1]);
}
function go(view,param){
  const allowed=userNav(ME);
  // #event WAJIB membawa id. Tanpa id tidak ada yang bisa ditampilkan, jadi
  // diarahkan ke daftar event — bukan halaman "Event tidak ditemukan" yang
  // menyesatkan (alamat yang salah ketik/bookmark lama juga mendarat di sini).
  if(view==='event' && !param) view='events';
  if(view!=='event' && !allowed.includes(view)){ toast('Akses ditolak',ME.name+' tidak punya akses ke modul ini.','err'); view='dashboard'; }
  location.hash = view + (param?('/'+param):'');
  closeSidebar();
  document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('active',a.dataset.k===(view==='event'?'events':view)));
  const meta=TITLES[view]||TITLES.events; if(view!=='event'){ $('tb-title').textContent=meta[0]; $('tb-sub').textContent=meta[1]; }
  $('notif-dot').style.display=unreadNotif()?'block':'none';
  const V=$('view'); V.scrollTop=0; paintStaffDatalist(); paintMenuDatalist();
  const R={dashboard:renderDashboard,crm:renderCRM,pipeline:renderPipeline,events:renderEvents,event:renderEventForm,brief:renderBrief,calendar:renderCalendar,tasks:renderTasks,templates:renderTemplates,invoices:renderInvoices,approvals:renderApprovals,performance:renderPerformance,reports:renderReports,timeline:renderTimeline,notifications:renderNotifications,staff:renderStaff,menudb:renderMenuDb,users:renderUsers,settings:renderSettings};
  (R[view]||renderDashboard)(V,param);
  window.scrollTo(0,0);
}

function progressBar(v,max){ const p=Math.min(100,Math.round(v/max*100)); return '<div class="progress" style="width:100%;margin-top:2px"><div class="bar" style="width:'+p+'%"></div></div>'; }
function getCats(){ if(!S.categories) S.categories=DIVISIONS.concat(S.taskCategories||[]); return S.categories; }
function divTemplates(div){ return (S.taskTemplates||[]).filter(t=>t.div===div); }
// Template efektif untuk 1 divisi pada 1 event: Kitchen ikut menyerap cabang F&B (Prasmanan / Set Menu) sesuai pilihan event
// Job tambahan ad-hoc milik 1 event (bukan dari Template Task) — diketik langsung di Detail Job
function extraJobs(ev,div){ return (ev&&ev.extraJobs&&ev.extraJobs[div])||[]; }
function eventDivTemplates(ev,div){ let list=divTemplates(div); if(div==='Kitchen'&&ev&&ev.detail&&FB_FORMATS.includes(ev.detail.fbFormat)) list=list.concat(divTemplates(ev.detail.fbFormat)); return list.concat(extraJobs(ev,div)); }
function addExtraJob(evId,div){
  const ev=S.events.find(e=>e.id===evId); if(!ev)return;
  ev.extraJobs=ev.extraJobs||{}; ev.extraJobs[div]=ev.extraJobs[div]||[];
  ev.extraJobs[div].push({id:uid('xj'),div,task:'',pic:'',hminus:null,deadline:'',note:'',extra:true});
  save(); openDivJobs(evId,div);
}
function setExtraJob(evId,div,jobId,field,val){
  const ev=S.events.find(e=>e.id===evId); if(!ev)return;
  const j=extraJobs(ev,div).find(x=>x.id===jobId); if(!j)return;
  j[field]=(field==='hminus')?(val===''?null:Math.max(0,Math.round(+val||0))):val;
  save();
}
function delExtraJob(evId,div,jobId){
  const ev=S.events.find(e=>e.id===evId); if(!ev)return;
  const j=extraJobs(ev,div).find(x=>x.id===jobId);
  confirmUI({title:'Hapus Job Tambahan',danger:true,ok:'Hapus',
    body:'Hapus job <b>'+esc(j&&j.task?j.task:'(tanpa nama)')+'</b> dari divisi '+esc(div)+'? Job ini hanya milik event ini.',
    onYes:function(){
      ev.extraJobs[div]=extraJobs(ev,div).filter(x=>x.id!==jobId);
      if(ev.jobProgress&&ev.jobProgress[div]) delete ev.jobProgress[div][jobId];
      save(); openDivJobs(evId,div);
    }});
}
function jobProg(e,div,taskId){ return Math.max(0,Math.min(100, Math.round((e.jobProgress&&e.jobProgress[div]&&+e.jobProgress[div][taskId])||0))); }
function divProgress(e,div){ const items=eventDivTemplates(e,div); if(!items.length)return 0; return Math.round(items.reduce((a,t)=>a+jobProg(e,div,t.id),0)/items.length); }
// Progres keseluruhan = rata-rata kesiapan SEMUA divisi (divisi yang belum punya job
// / belum dikerjakan dihitung 0%), supaya konsisten dengan hitungan "X/7 divisi siap"
// dan tidak terlihat tinggi padahal sebagian besar divisi belum jalan.
function taskProgress(e){ const cats=getCats(); if(!cats.length)return 0; return Math.round(cats.reduce((a,div)=>a+divProgress(e,div),0)/cats.length); }
function setJobProg(evId,div,taskId,val){ const e=S.events.find(x=>x.id===evId); if(!e)return; e.jobProgress=e.jobProgress||{}; e.jobProgress[div]=e.jobProgress[div]||{}; e.jobProgress[div][taskId]=Math.max(0,Math.min(100,Math.round(+val||0))); save(); }

function crmData(){
  return S.clients.filter(c=>{
    if(ME.role==='marketing' && c.mktPIC!==ME.id && false)return false; // marketing sees all clients per matrix (F)
    const r=crmFilter.rel;
    if(r==='open' && !clientOpenEvents(c.id).length)return false;
    if(r && r.indexOf('stage:')===0){ const st=r.slice(6); if(!S.events.some(e=>e.clientId===c.id && e.status===st))return false; }
    if(r==='deal' && !clientWonEvents(c.id).length)return false;
    if(r==='repeat' && clientDoneEvents(c.id).length<2)return false;
    if(r==='nodeal' && clientWonEvents(c.id).length)return false;
    if(crmFilter.source && c.source!==crmFilter.source)return false;
    if(crmFilter.q){ const q=crmFilter.q.toLowerCase(); if(!(c.nama+' '+c.perusahaan+' '+c.hp+' '+(c.email||'')+' '+(c.ig||'')).toLowerCase().includes(q))return false; }
    return true;
  });
}
function clientSpending(id){ return S.events.filter(e=>e.clientId===id && e.status==='Event Done').reduce((a,e)=>a+eventFinance(e).grand,0); }
function clientEventCount(id){ return S.events.filter(e=>e.clientId===id).length; }
/* Client tidak punya status sendiri — semua tahapan hidup di event.

function isOpenEvent(e){ return OPEN_STAGES.includes(e.status); }
function clientOpenEvents(id){ return S.events.filter(e=>e.clientId===id && isOpenEvent(e)); }
function clientWonEvents(id){ return S.events.filter(e=>e.clientId===id && ['Deal','Confirmed','Event Done'].includes(e.status)); }
function clientDoneEvents(id){ return S.events.filter(e=>e.clientId===id && e.status==='Event Done'); }
function clientTags(id){
  const open=clientOpenEvents(id), won=clientWonEvents(id).length, done=clientDoneEvents(id).length;
  let h='';

/* ---------- GERBANG TAHAP PIPELINE ----------
   Informasi Dasar (D.1) wajib lengkap sebelum peluang masuk Negotiation ke atas —
   supaya tidak ada event yang dinegosiasikan tanpa tanggal/pax/area yang jelas. */
const STAGE_NEEDS_BASIC=['Negotiation','Quotation Terkirim','Deal'];
function missingBasic(ev){
  const sec=SEC_BY_ID['basic']; if(!sec)return [];
  // hanya blok "info inti" (sebelum sub-judul Dekorasi) yang mengunci kenaikan tahap —
  // dekorasi & venue kini ikut di tab ini tapi tidak wajib untuk maju tahap.
  const core=[]; for(const fl of sec.fields){ if(fl.t==='head')break; core.push(fl); }
  return core.filter(fl=>fl.req&&fieldVisible(ev,fl)).filter(fl=>{
    const v=getVal(ev,fl.k);
    return v===undefined||v===null||v===''||(Array.isArray(v)&&!v.length);
  }).map(fl=>fl.l);
}
function guardStage(ev,col){
  if(!STAGE_NEEDS_BASIC.includes(col))return true;
  const miss=missingBasic(ev);
  if(!miss.length)return true;
  toast('Lengkapi Informasi Dasar','Belum terisi: '+miss.slice(0,3).join(', ')+(miss.length>3?' (+'+(miss.length-3)+' lagi)':'')+'. Wajib sebelum tahap '+col+'.','err');
  curTab='basic'; go('event',ev.id);
  return false;
}
function setEventStage(id,col){
  const e=S.events.find(x=>x.id===id); if(!e||e.status===col)return;
  if(!guardStage(e,col))return;
  const prev=e.status; e.status=col; e.pipeCol=col;
  if(col==='Deal') genTasks(e);
  logAct('event',id,'Tahap diubah',prev+' → '+col);
  save(); toast('Tahap diperbarui',prev+' → '+col,'ok'); go('event',id);
}
function moveEventPipe(id,col){
  const e=S.events.find(x=>x.id===id); if(!e)return;
  if(!guardStage(e,col))return; // guardStage sudah mengarahkan ke tab Informasi Dasar
  e.pipeCol=col;
  const prev=e.status; e.status=col;
  logAct('event',id,'Pipeline dipindah',prev+' → '+col);
  if(col==='Deal'){ genTasks(e); toast('Deal! ⚓',e.nama+' masuk tahap eksekusi & handover divisi.','ok'); }
  save(); go('pipeline');
}
function pipeFollowUp(){
  const mine = ME.role==='marketing';
  const openEvs=S.events.filter(e=>isOpenEvent(e) && (!mine||e.mktPIC===ME.id));
  const dueEvs=openEvs.filter(e=>e.nextFU && e.nextFU<=today());
  const myFUcount=S.followups.filter(f=>(!mine||f.by===ME.id)&&f.at.slice(0,10)===today()).length;
  // nurture: client tanpa peluang aktif tapi sengaja dijadwalkan FU (after-sales / repeat)
  const nurture=S.clients.filter(c=>c.nextFU && !clientOpenEvents(c.id).length && (!mine||c.mktPIC===ME.id));
  const staleEvs=openEvs.filter(isStale);
  let h='<div class="grid g-4" style="margin-bottom:16px">'
   +stat('Progress Hari Ini',myFUcount+'/'+S.settings.fuTarget,progressBar(myFUcount,S.settings.fuTarget),'pipe')
   +stat('Jatuh Tempo Hari Ini',dueEvs.length,'peluang perlu di-follow up','clock')
   +stat('Perlu Ditindaklanjuti',staleEvs.length,'≥ '+(+S.settings.staleDays||7)+' hari belum di-follow up','alert')
   +stat('Peluang Aktif',openEvs.length,'Lead → Negotiation','flag')
   +'</div>';
  // --- antrian peluang (event) ---
  h+='<div class="card pad0" style="margin-bottom:14px"><div style="padding:16px 20px;border-bottom:1px solid var(--line-soft)"><h3 style="font-size:15px">Antrian Follow Up · Peluang Aktif</h3><div class="cell-sub">Hasil follow up langsung menggerakkan tahap event di Pipeline.</div></div>';
  if(!openEvs.length)h+=empty('Tidak ada peluang aktif','Semua event sudah Deal atau Lost. Buat peluang baru lewat Input & Event, atau lewat Catat FU → "Peluang baru".','pipe');
  else{
    // yang perlu ditindaklanjuti naik ke atas — yang paling sering hilang karena lupa, bukan ditolak
    const list=openEvs.slice().sort((a,b)=>{
      const sa=isStale(a)?0:1, sb=isStale(b)?0:1;
      if(sa!==sb) return sa-sb;
      return (a.nextFU||'9999').localeCompare(b.nextFU||'9999');
    });
    h+='<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Event</th><th>Client</th><th>Tahap</th><th>Terakhir FU</th><th>Next FU</th><th>Aksi</th></tr></thead><tbody>';
    list.forEach(e=>{ const overdue=e.nextFU&&e.nextFU<today(); const dueToday=e.nextFU===today(); const stale=isStale(e); const d=daysSinceFU(e);
      h+='<tr><td class="row-click" onclick="go(\'event\',\''+e.id+'\')"><div class="cell-strong">'+esc(e.nama)+(stale?' <span class="chip" style="background:color-mix(in srgb,var(--danger) 15%,transparent);color:var(--danger)"><span class="cd" style="background:var(--danger)"></span>Perlu ditindaklanjuti</span>':'')+'</div><div class="cell-sub">'+fmtDate(e.tanggal)+'</div></td>'
       +'<td>'+esc(clientName(e.clientId))+'</td><td>'+statusChip(e.status)+'</td>'
       +'<td class="mono" style="color:'+(stale?'var(--danger)':'inherit')+'">'+(lastFUDate(e)?d+' hari lalu':'—')+'</td>'
       +'<td class="mono" style="color:'+(overdue?'var(--danger)':dueToday?'var(--gold)':'inherit')+'">'+(e.nextFU?fmtDate(e.nextFU):'—')+(overdue?' ⚠':dueToday?' • hari ini':'')+'</td>'
       +'<td><button class="btn sm" onclick="logFollowUp(\''+e.clientId+'\',\''+e.id+'\')">'+svg(IC.plus)+'Catat FU</button></td></tr>'; });
    h+='</tbody></table></div>';
  }
  h+='</div>';
  // --- nurture / after-sales (tidak dihitung ke target harian) ---
  if(nurture.length){
    h+='<div class="card pad0"><div style="padding:16px 20px;border-bottom:1px solid var(--line-soft)"><h3 style="font-size:15px">Nurture / After-sales</h3><div class="cell-sub">Client tanpa peluang aktif tapi dijadwalkan follow up. Tidak dihitung ke target harian.</div></div>';
    h+='<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Client</th><th>Kontak</th><th>Next FU</th><th>Aksi</th></tr></thead><tbody>';
    nurture.slice().sort((a,b)=>(a.nextFU||'9999').localeCompare(b.nextFU||'9999')).forEach(c=>{

function saveFollowUp(clientId){
  const c=S.clients.find(x=>x.id===clientId);
  const target=$('fu_event').value;
  const action=$('fu_action').value, hasil=$('fu_hasil').value, note=$('fu_note').value.trim(), next=$('fu_next').value;
  let ev=null;
  if(target==='__new__'){
    const en=$('fu_enama').value.trim();
    if(!en)return toast('Nama event wajib','Isi nama peluang/event baru dulu.','err');
    const jenis=$('fu_ejenis').value, tanggal=$('fu_etanggal').value;
    ev={id:uid('e'),clientId,nama:en,jenis,tanggal,status:'Lead',pipeCol:'Lead',mktPIC:(c.mktPIC||ME.id),pax:0,invoiceSent:false,createdAt:today(),detail:{jenis,tanggal},payments:[],tasks:{}};
    S.events.unshift(ev); logAct('event',ev.id,'Peluang baru dibuat (dari Follow Up)',en);
  } else if(target!=='__umum__'){
    ev=S.events.find(e=>e.id===target);
  }
  S.followups.unshift({id:uid('f'),clientId,eventId:ev?ev.id:'',by:ME.id,action,hasil,note,at:new Date().toISOString().slice(0,16),next});
  c.lastContact=today();
  let stageBlocked='';
  if(ev){
    let stage=FU_RESULT[hasil];
    // Follow up tetap tersimpan walau D.1 belum lengkap — hanya kenaikan tahapnya yang ditahan,
    // supaya catatan hasil telepon tidak hilang cuma karena data event belum rapi.
    if(stage && stage!==ev.status && STAGE_NEEDS_BASIC.includes(stage) && missingBasic(ev).length){ stageBlocked=stage; stage=null; }
    if(stage && stage!==ev.status){
      const prev=ev.status; ev.status=stage; ev.pipeCol=stage;
      if(stage==='Deal') genTasks(ev);
      logAct('event',ev.id,'Follow up: '+action,hasil+' · '+prev+' → '+stage+(note?' · '+note:''));
    } else {
      logAct('event',ev.id,'Follow up: '+action,hasil+(note?' · '+note:''));
    }
    // otomasi jadwal: peluang yang sudah diputuskan tak perlu FU lagi
    if(['Deal','Lost'].includes(ev.status)) ev.nextFU='';
    else ev.nextFU = next || nextFUDate();
  } else {
    c.nextFU=next; // FU umum / nurture disimpan di client
    logAct('client',clientId,'Follow up umum: '+action,hasil+(note?' · '+note:''));
  }
  save(); closeModal();
  toast('Follow up dicatat',(ev?esc(ev.nama)+' → '+hasil:c.nama+' → '+hasil),'ok');
  if(stageBlocked){
    toast('Tahap belum naik','Informasi Dasar (D.1) belum lengkap — lengkapi dulu agar bisa masuk tahap '+stageBlocked+'.','err');
    curTab='basic'; go('event',ev.id); return;
  }
  go('pipeline');
}

/* ---------- Pilih seksi mana yang ikut tercetak di PDF ----------
   Tidak semua event perlu semua seksi di brief-nya. Tiap seksi punya centang
   sendiri, tersimpan di ev.detail._pdfSec. Belum pernah dicentang = ikut
   tercetak, supaya event lama tidak tiba-tiba kehilangan isi PDF-nya. */
/* Berapa isian sebuah seksi yang sudah diisi. Dipakai untuk lencana kemajuan
   di kepala seksi — form ini panjang, dan tanpa penanda begini orang harus
   menggulir seluruh tab hanya untuk tahu bagian mana yang masih kosong.
   Sub-judul, lampiran, dan field cermin tidak dihitung: bukan isian. */
function secProgress(ev,sec){
  let isi=0,total=0;
  (sec.fields||[]).forEach(fl=>{
    if(fl.t==='head'||fl.t==='files'||fl.t==='mirror'||fl.t==='salinlayout')return;
    if(!fieldVisible(ev,fl))return;
    total++;
    const v=fmtFieldVal(fl,detailVal(ev,fl));
    if(v!=null&&v!=='')isi++;
  });
  return {isi,total};
}
function pdfSecOn(ev,secId){
  const m=(ev.detail&&ev.detail._pdfSec)||{};
  return m[secId]!==false;
}
function pdfCheckHTML(ev,sec){
  const on=pdfSecOn(ev,sec.id);
  return '<label class="pdf-chk" title="Kalau dimatikan, seksi ini tidak ikut tercetak di Event Brief / PDF">'
    +'<input type="checkbox" '+(on?'checked':'')+' onchange="pdfSecToggle(\''+sec.id+'\',this.checked)">'
    +'<span>Tampil di PDF</span></label>';
}
function pdfSecToggle(secId,on){
  const ev=S.events.find(e=>e.id===_asEvId); if(!ev) return;
  ev.detail._pdfSec=ev.detail._pdfSec||{};
  ev.detail._pdfSec[secId]=!!on;
  save();
  toast('Pengaturan PDF disimpan', (SEC_BY_ID[secId]?SEC_BY_ID[secId].title:secId)+(on?' ikut tercetak.':' tidak ikut tercetak.'),'ok');
}
function fieldVisible(ev,fl){ if(!fl.cond)return true; const v=ev.detail[fl.cond.k]; if(typeof fl.cond.v==='boolean')return !!(v&&v.v!==undefined?v.v:v)===fl.cond.v; const cur=getVal(ev,fl.cond.k); if(Array.isArray(cur))return cur.includes(fl.cond.v); return cur===fl.cond.v; }
function getVal(ev,k){ const v=ev.detail[k]; if(v&&typeof v==='object'&&'v'in v)return v.v; return v; }
// Ya/Tidak + catatan; toleran terhadap data lama (string/array/yn) agar tidak hilang.
function ynnoteVal(val){
  if(val && typeof val==='object' && !Array.isArray(val) && ('v'in val||'note'in val)) return {v:val.v===true?true:(val.v===false?false:undefined), note:val.note||''};
  if(Array.isArray(val)) return {v:val.length>0, note:val.join(', ')};
  if(typeof val==='boolean') return {v:val, note:''};
  if(typeof val==='string' && val.trim()) return {v:true, note:val.trim()};
  return {v:undefined, note:''};
}

/* ---------- Tabel menu per komponen (Kitchen D.2 & Bar D.3) ----------
   Isinya mengikuti komponen yang dicentang: satu kelompok per komponen.
   Main Course & Welcome Snack punya kolom KATEGORI (karbohidrat, protein,
   sayuran, ...) karena di PDF menunya dirangkum per kategori — misalnya
   "Karbohidrat: Nasi Putih, Mie Goreng". Komponen lain cukup 3 kolom.

   Bentuk data: { "Main Course": { jam:"19:00", rows:[{kat,menu,qty,jam}] } }
   Kelompok yang komponennya dilepas centangnya TIDAK dihapus dari data —
   kalau dicentang lagi isian lamanya masih utuh. */
/* Kolom "Jenis" tampil di SEMUA kelompok. Dulu hanya Main Course & Welcome
   Snack yang dapat, tapi kelompok lain pun perlu dikelompokkan di PDF
   (mis. Welcome Drink: panas / dingin), dan ketiadaan kolomnya membuat
   tabelnya terasa beda-beda tanpa alasan yang jelas bagi pengisinya. */
const MENU_KATEGORI=['Karbohidrat','Protein','Sayuran','Pelengkap'];
/* ---------- Jadwal keluar F&B & Bar ----------
   Kolom "Jam" sudah diisi per baris di tabel Menu Final dan Daftar Menu Bar.
   Data yang sama dibalik urutannya di sini: dikelompokkan PER JAM, supaya
   pertanyaan kru di lapangan ("jam 19:30 apa yang keluar?") bisa dijawab
   tanpa membaca ulang seluruh tabel menu.

   Baris tanpa jam memakai jam kelompoknya; kalau kelompoknya juga kosong,
   baris itu dikumpulkan di bagian "Jam belum ditentukan" — sengaja tetap
   ditampilkan, karena justru itu yang perlu dibereskan sebelum acara. */
const JAM_KOSONG='—';
function jadwalKeluar(ev){
  const per={};
  const kumpul=(val,sumber)=>{
    const data=menuTblVal(val);
    Object.keys(data).forEach(g=>{
      if(g==='_teks') return;
      const gd=data[g]||{}, rows=Array.isArray(gd.rows)?gd.rows:[];
      rows.forEach(r=>{
        const menu=(r.menu||'').trim(); if(!menu) return;
        const jam=((r.jam||gd.jam||'').trim())||JAM_KOSONG;
        (per[jam]=per[jam]||[]).push({sumber,grup:g,menu,qty:(r.qty||'').trim(),
                                      ket:(r.kat||r.catatan||'').trim()});
      });
    });
  };
  kumpul(ev.detail&&ev.detail.menuFinal,'Kitchen');
  kumpul(ev.detail&&ev.detail.barMenu,'Bar');
  // Urut menaik; "belum ditentukan" ditaruh paling belakang.
  return Object.keys(per).sort((a,b)=>
      a===JAM_KOSONG?1:b===JAM_KOSONG?-1:a.localeCompare(b))
    .map(jam=>({jam,baris:per[jam]}));
}
function menuTblVal(val){ return (val && typeof val==='object' && !Array.isArray(val)) ? val : {}; }
function menuGroupsOf(ev,fl){
  // Sumbernya dibaca dari layar dulu (kalau ada) supaya centang komponen
  // langsung menambah/mengurangi kelompok tanpa menunggu simpan.
  const srcFl=fieldByKey(fl.src);
  let cur = (srcFl && $('efd_'+fl.src)) ? collectField(srcFl) : ev.detail[fl.src];
  return Array.isArray(cur)?cur:[];
}

  const jadwal=jadwalKeluar(ev);

        +(j.jam===JAM_KOSONG?'Jam belum ditentukan':esc(j.jam))

          +'<span class="jk-menu">'+esc(b.menu)+'</span>'
          +'<span class="cell-sub">'+esc(b.grup)+(b.ket?' · '+esc(b.ket):'')+(b.qty?' · '+esc(b.qty):'')+'</span></div>'
        ).join('')+'</div></div>'
    ).join('')+'</div>';
}
function menuTblHTML(ev,fl,canEdit){
  const asli=ev.detail[fl.k];
  const data=menuTblVal(asli);
  const grup=menuGroupsOf(ev,fl);
  // Menu Final dulu berupa satu kotak teks bebas. Isian lama itu ditampilkan
  // apa adanya di atas tabel supaya tidak hilang dari pandangan sebelum
  // sempat dipindahkan ke baris-baris tabel.
  const teksLama = (typeof asli==='string') ? asli : (data._teks||'');
  const lama = teksLama.trim()
    ? '<div class="menu-lama"><b>Isian lama (teks bebas)</b><pre>'+esc(teksLama)+'</pre>'
      +'<span class="cell-sub">Salin ke tabel di bawah, lalu hapus lewat tombol di samping.</span>'
      +(canEdit?' <button type="button" class="btn sm ghost" onclick="menuHapusTeksLama(\''+fl.k+'\')">Hapus teks lama</button>':'')
      +'</div>'
    : '';
  if(!grup.length) return lama+'<div class="cell-sub" style="padding:6px 0">Centang dulu komponen menunya di atas — tabelnya menyesuaikan.</div>';
  const opts={bar:!!fl.bar, grup:grup, data:data};
  return lama+grup.map(g=>menuGroupHTML(fl.k,g,data[g]||{},canEdit,opts)).join('');
}
/* Kolom pertama beda antara Kitchen dan Bar:
   - Kitchen "Jenis"   = karbohidrat/protein/sayuran, dipakai mengelompokkan
     menu di PDF ("Karbohidrat: Nasi Putih, Mie Goreng").
   - Bar     "Catatan" = kapan minumannya keluar (freeflow/lunch/dinner),
     bukan jenis bahan. Mengelompokkan minuman per bahan tidak ada gunanya. */
function menuKolom1(bar){
  return bar ? {k:'catatan', l:'Catatan', dl:'dl_barcatatan', ph:'freeflow / lunch / ketik'}
             : {k:'kat',     l:'Jenis',   dl:'dl_menukat',    ph:'pilih / ketik'};
}
function menuGroupHTML(fk,g,gd,canEdit,opts){
  opts=opts||{};
  const bar=!!opts.bar, k1=menuKolom1(bar);
  const rows=Array.isArray(gd.rows)?gd.rows:[];
  const jam=gd.jam||'', gqty=gd.qty||'';
  const body=(rows.length?rows:[{}]).map(r=>menuRowHTML(r,jam,canEdit,bar,gqty)).join('');
  // Kelompok LAIN yang sudah ada isinya — untuk disalin. Berguna saat
  // VIP Family Set dan Welcome Snack menyajikan menu yang sama.
  const lain=(opts.grup||[]).filter(x=>x!==g && opts.data && opts.data[x] && (opts.data[x].rows||[]).length);

/* Salin daftar menu dari kelompok lain. Menimpa isi kelompok ini, jadi
   dikonfirmasi dulu kalau sudah ada isinya — kehilangan ketikan orang
   karena salah pilih dropdown itu mahal. */
function menuSalinDari(sel){
  const dari=sel.value; sel.value='';
  if(!dari) return;
  const box=sel.closest('.menutbl'), tujuan=sel.closest('.mg');
  const asal=[...box.querySelectorAll('.mg')].find(function(x){ return x.dataset.g===dari; });
  if(!asal) return;
  const adaIsi=[...tujuan.querySelectorAll('tbody [data-r="menu"]')].some(function(e){ return e.value.trim(); });
  if(adaIsi && !confirm('Isi kelompok "'+tujuan.dataset.g+'" akan diganti dengan salinan dari "'+dari+'". Lanjut?')) return;
  const bar=tujuan.dataset.bar==='1', k1=menuKolom1(bar), k1a=menuKolom1(asal.dataset.bar==='1');
  const gjam=(tujuan.querySelector('[data-r="gjam"]')||{}).value||'';
  const gqty=(tujuan.querySelector('[data-r="gqty"]')||{}).value||'';
  const baris=[...asal.querySelectorAll('tbody tr')].map(function(tr){
    const v=function(r){ const e=tr.querySelector('[data-r="'+r+'"]'); return e?e.value.trim():''; };
    // Kolom pertama beda arti antara Kitchen & Bar. Kalau jenisnya beda,
    // kolom itu TIDAK ikut disalin daripada memindahkan isi yang keliru.
    const o={menu:v('menu'), qty:v('qty'), jam:v('jam')};
    o[k1.k] = (k1.k===k1a.k) ? v(k1a.k) : '';
    return o;
  }).filter(function(r){ return r.menu||r.qty; });
  if(!baris.length){ toast('Kelompok kosong','"'+dari+'" belum punya menu untuk disalin.','err'); return; }
  tujuan.querySelector('tbody').innerHTML = baris.map(function(r){ return menuRowHTML(r,gjam,true,bar,gqty); }).join('');
  menuPasangBaris(tujuan);
  if(typeof autoSaveTrigger==='function') autoSaveTrigger();
  toast('Menu disalin', baris.length+' menu dari "'+dari+'" masuk ke "'+tujuan.dataset.g+'".','ok');
}
/* Enter di baris terakhir menambah baris baru (seperti spreadsheet), dan
   baris bisa diseret untuk mengubah urutan. Dipasang ulang tiap kali tabel
   digambar, karena barisnya diganti bukan diubah. */
function menuPasangBaris(mg){
  const body=mg.querySelector('tbody'); if(!body) return;
  body.querySelectorAll('tr').forEach(function(tr){
    tr.ondragstart=function(e){ mg._seret=tr; tr.classList.add('mg-seret'); e.dataTransfer.effectAllowed='move'; };
    tr.ondragend  =function(){ tr.classList.remove('mg-seret'); mg.querySelectorAll('tr').forEach(function(x){ x.classList.remove('mg-atas'); }); };
    tr.ondragover =function(e){ e.preventDefault(); if(mg._seret&&mg._seret!==tr) tr.classList.add('mg-atas'); };
    tr.ondragleave=function(){ tr.classList.remove('mg-atas'); };
    tr.ondrop     =function(e){
      e.preventDefault(); tr.classList.remove('mg-atas');
      const s=mg._seret; if(!s||s===tr) return;
      const semua=[...body.querySelectorAll('tr')];
      // dijatuhkan ke baris yang lebih bawah -> sisipkan SESUDAHnya
      body.insertBefore(s, semua.indexOf(s) < semua.indexOf(tr) ? tr.nextSibling : tr);
      if(typeof autoSaveTrigger==='function') autoSaveTrigger();
    };
    tr.querySelectorAll('input').forEach(function(inp){
      inp.onkeydown=function(e){
        if(e.key!=='Enter') return;
        e.preventDefault();
        const baris=[...body.querySelectorAll('tr')];
        if(tr===baris[baris.length-1]){
          const tb=mg.querySelector('.rundown-act button');
          if(tb) menuAddRow(tb);
        } else {
          const berikut=tr.nextElementSibling;
          const sasaran=berikut&&berikut.querySelector('[data-r="'+inp.dataset.r+'"]');
          if(sasaran) sasaran.focus();
        }
      };
    });
  });
}
function menuPasangSemua(){
  document.querySelectorAll('.menutbl .mg').forEach(menuPasangBaris);
}

/* ---------- Salin layout dari event lain ----------
   Denah venue jarang berubah: acara berikutnya di ruang yang sama biasanya
   memakai layout yang mirip. Menyalin jauh lebih cepat daripada mengunggah
   ulang gambar yang sama.

   Yang disalin adalah PENUNJUK berkasnya (key), bukan berkasnya sendiri —
   satu gambar dipakai bersama beberapa event tanpa menggandakan isi disk.
   Penyapu berkas di server sudah menelusuri seluruh isi event, jadi gambar
   tetap hidup selama masih ada satu event yang memakainya. */
function salinLayout(evId){
  const ini=S.events.find(e=>e.id===evId); if(!ini)return;
  const punya=S.events.filter(e=>e.id!==evId &&
    ((e.detail&&e.detail.layoutFile&&e.detail.layoutFile.trim()) ||
     (e.detail&&Array.isArray(e.detail.layoutImgs)&&e.detail.layoutImgs.length)))
    .sort((a,b)=>String(b.tanggal||'').localeCompare(String(a.tanggal||'')));
  if(!punya.length){
    toast('Belum ada yang bisa disalin','Belum ada event lain yang punya catatan atau gambar layout.','err');
    return;
  }
  const baris=punya.map(e=>{
    const c=S.clients.find(x=>x.id===e.clientId);

      +'<span class="salin-nama">'+esc(e.nama||'(tanpa nama)')+'</span>'
      +'<span class="cell-sub">'+fmtDate(e.tanggal)+(c?' · '+esc(c.nama):'')
        +' · '+(n?n+' gambar':'tanpa gambar')+'</span>'
      +(e.detail.layoutFile?'<span class="salin-note">'+esc(e.detail.layoutFile.slice(0,110))+'</span>':'')
      +'</button>';

  modal('<div class="modal-head"><h3>Ambil Layout dari Event Lain</h3>'
    +'<p class="section-desc">Catatan layout & gambarnya akan disalin ke event ini. Isi yang sekarang akan diganti.</p></div>'
    +'<div class="salin-list">'+baris+'</div>'

/* Mengubah jam kelompok cukup memperbarui PLACEHOLDER tiap baris. Baris yang
   dibiarkan kosong otomatis ikut jam baru itu saat disimpan — tidak ada lagi
   nilai yang ditulis diam-diam ke dalam kotak, jadi tidak mungkin tertinggal

function collectMenuTbl(fl){
  const box=$('efd_'+fl.k); if(!box) return undefined;
  const out={};
  box.querySelectorAll('.mg').forEach(g=>{
    const jamKel=(g.querySelector('[data-r="gjam"]')||{}).value||'';
    const qtyKel=(g.querySelector('[data-r="gqty"]')||{}).value||'';
    const rows=[...g.querySelectorAll('tbody tr')].map(tr=>{
      const v=r=>{ const e=tr.querySelector('[data-r="'+r+'"]'); return e?e.value.trim():''; };
      // Jam & jumlah baris yang dibiarkan kosong = ikut kelompok. Diisi di
      // sini, bukan di kotaknya, supaya mengganti nilai kelompok otomatis
      // mengubah semua baris yang memang menumpang padanya.
      return {kat:v('kat'), catatan:v('catatan'), menu:v('menu'),
              qty:(v('qty') || qtyKel), jam:(v('jam') || jamKel)};
    }).filter(r=>r.menu||r.qty||r.kat||r.catatan);
    const jam=jamKel;
    const qtyG=(g.querySelector('[data-r="gqty"]')||{}).value||'';
    if(rows.length||jam||qtyG) out[g.dataset.g]={jam:jam, qty:qtyG, rows:rows};
  });
  // Kelompok yang komponennya sedang tidak dicentang tidak digambar, jadi
  // tidak ikut terbaca di atas — disalin balik supaya tidak hilang.
  const ev=S.events.find(e=>e.id===_asEvId);
  const asli=ev?ev.detail[fl.k]:null;
  const lama=menuTblVal(asli);
  const diLayar={}; box.querySelectorAll('.mg').forEach(g=>diLayar[g.dataset.g]=1);
  Object.keys(lama).forEach(g=>{ if(g!=='_teks' && !diLayar[g]) out[g]=lama[g]; });
  // Isian lama yang berupa teks bebas ikut dibawa, jangan sampai tertimpa
  // tabel kosong pada auto-save pertama.
  const teks = (typeof asli==='string') ? asli : lama._teks;
  if(teks && String(teks).trim()) out._teks=teks;
  return out;
}
// Centang komponen berubah -> kelompok tabelnya ikut bertambah/berkurang.
// Isian yang sudah diketik dibawa serta lewat collectMenuTbl().
function syncMenuTbl(){
  const ev=S.events.find(e=>e.id===_asEvId); if(!ev) return;
  EVENT_SCHEMA.forEach(s=>s.fields.forEach(fl=>{
    if(fl.t!=='menutbl') return;
    const box=$('efd_'+fl.k); if(!box) return;
    const isi=collectMenuTbl(fl); if(isi!==undefined) ev.detail[fl.k]=isi;
    const perlu=menuGroupsOf(ev,fl).join('␀');
    if(box.dataset.grup===perlu) return;      // susunannya sama, jangan gambar ulang
    box.dataset.grup=perlu;
    box.innerHTML=menuTblHTML(ev,fl,can('edit_event'));
    box.querySelectorAll('.mg').forEach(menuPasangBaris);
  }));
}
// Untuk PDF & Overview: dirangkum per kategori, sesuai permintaan
// "karbohidrat : nasi putih, mie goreng".
function fmtMenuTbl(val){
  if(typeof val==='string') return val.trim()||null;   // isian lama, teks bebas
  const data=menuTblVal(val); const out=[];
  if(data._teks && String(data._teks).trim()) out.push(String(data._teks).trim());
  Object.keys(data).forEach(g=>{
    if(g==='_teks') return;
    const gd=data[g]||{}; const rows=Array.isArray(gd.rows)?gd.rows:[];
    if(!rows.length && !gd.jam && !gd.qty) return;
    out.push(g+(gd.jam?' — '+gd.jam:'')+(gd.qty?' · '+gd.qty:''));
    // Kitchen dikelompokkan per Jenis; Bar per Catatan (freeflow/lunch/dst).
    // Keduanya kolom pertama tabelnya, jadi diperlakukan sama di sini.
    const perKat={};
    rows.forEach(r=>{
      const k=r.kat||r.catatan||'';
      const qty=r.qty&&r.qty!==gd.qty ? ' ('+r.qty+')' : (r.qty?' ('+r.qty+')':'');
      const isi=(r.menu||'')+qty+(r.jam&&r.jam!==gd.jam?' — '+r.jam:'');
      if(!isi.trim())return;
      (perKat[k]=perKat[k]||[]).push(isi);
    });
    Object.keys(perKat).forEach(k=>out.push('  '+(k?k+': ':'')+perKat[k].join(', ')));
  });
  return out.length?out.join('\n'):null;
}
/* ---------- Lampiran berkas (D.10) ----------

  if(lain.length){

async function uploadAttach(evId,k,inputEl){

/* Textarea yang ikut tinggi isinya. Sebelumnya tingginya dikunci 38px, jadi
   menekan Enter membuat teksnya menggulir di balik kotak sempit — orang jadi
   tidak bisa melihat catatan yang baru saja diketiknya sendiri.
   Dipanggil saat mengetik DAN sekali saat form digambar (catatan lama yang
   sudah berbaris-baris harus langsung tampil utuh). */
/* Enter melanjutkan penanda bullet baris sebelumnya, seperti aplikasi
   catatan. Baris bullet yang dibiarkan kosong lalu di-Enter akan
   menghapus bulletnya — supaya bisa keluar dari daftar tanpa harus
   menghapus tanda satu per satu. */
function bulletOtomatis(e,el){
  if(e.key!=='Enter'||e.shiftKey) return;
  const pos=el.selectionStart;
  const barisIni=el.value.slice(0,pos).split(String.fromCharCode(10)).pop();
  const m=barisIni.match(/^(\s*)([-*•]|\d+[.)])\s+/);
  if(!m) return;
  e.preventDefault();
  const kosong = barisIni.trim()===m[2];
  if(kosong){
    // keluar dari daftar: buang penanda di baris ini
    const awal=pos-barisIni.length;
    el.value=el.value.slice(0,awal)+el.value.slice(pos);
    el.selectionStart=el.selectionEnd=awal;
  } else {
    const angka=m[2].match(/^(\d+)([.)])$/);
    const tanda=angka ? (Number(angka[1])+1)+angka[2] : m[2];
    const sisip=String.fromCharCode(10)+m[1]+tanda+' ';
    el.value=el.value.slice(0,pos)+sisip+el.value.slice(el.selectionEnd);
    el.selectionStart=el.selectionEnd=pos+sisip.length;
  }
  if(typeof tumbuhkan==='function') tumbuhkan(el);
  if(typeof autoSaveTrigger==='function') autoSaveTrigger();
}
function tumbuhkan(el){
  if(!el)return;
  el.style.height='auto';
  el.style.height=Math.min(el.scrollHeight, 320)+'px';   // batas atas: jangan sampai satu catatan memenuhi layar
  if(el.scrollHeight>320) el.style.overflowY='auto';

/* ---------- Rundown: tabel Waktu × Kegiatan + isi otomatis via OCR ---------- */
function rundownRows(val){
  // Data lama berbentuk {waktu, kegiatan}; sekarang {mulai, selesai, durasi,
  // kegiatan}. `waktu` lama dipetakan jadi `mulai` supaya rundown yang sudah
  // pernah diisi tidak hilang.
  if(Array.isArray(val)) return val
    .map(r=>r&&Object.assign({}, r, {mulai: r.mulai || r.waktu || ''}))
    .filter(r=>r&&(r.mulai||r.selesai||r.durasi||r.kegiatan));
  if(typeof val==='string' && val.trim()) return rundownParseText(val);
  return [];
}
// pecah teks bebas / hasil OCR jadi baris {waktu, kegiatan}
function rundownParseText(txt){
  return String(txt).split(/\r?\n/).map(line=>{
    line=line.replace(/\s+/g,' ').trim(); if(!line)return null;
    // cocokkan pola jam di depan: "09:00", "9.00", "09:00-10:00", "09.00 – 10.00"
    const m=line.match(/^(\d{1,2}[:.]\d{2}(?:\s*[-–—]\s*\d{1,2}[:.]\d{2})?)\s*[-–—.:)\]]*\s*(.*)$/);
    if(m && m[2]) return {mulai:m[1].replace(/\./g,':').replace(/\s+/g,''), selesai:'', durasi:'', kegiatan:m[2].trim()};
    if(m) return {mulai:m[1].replace(/\./g,':').replace(/\s+/g,''), selesai:'', durasi:'', kegiatan:''};
    return {mulai:'', selesai:'', durasi:'', kegiatan:line};
  }).filter(Boolean);
}
/* Rundown sekarang 4 kolom: Mulai | Selesai | Durasi | Kegiatan.

   Hubungan ketiganya dijaga rundownHitung():
     - ketik DURASI  -> jam selesai dihitung dari jam mulai (yang diminta)
     - ubah SELESAI  -> durasi ikut menyesuaikan
   Data lama yang cuma punya {waktu, kegiatan} tetap terbaca: `waktu` dipakai
   sebagai jam mulai (lihat rundownRows). */
/* Kotak jam pada tabel rundown: memakai input jam bawaan browser, jadi ada
   ikon jam dan pemilihnya — mengetik "09:00" satu per satu itu lambat dan
   gampang salah.

   Nilai lama yang ditulis "09.00" (pakai titik) dinormalkan dulu ke "09:00",
   karena input jam bawaan hanya menerima bentuk itu.

   Kalau nilainya TIDAK berbentuk jam sama sekali — misalnya hasil OCR rundown
   lama yang berbunyi "sore" — kotaknya tetap kotak teks biasa. Kalau
   dipaksakan jadi input jam, nilainya akan hilang dari layar tanpa jejak dan
   orang mengira datanya terhapus. */
function jamCell(nama, nilai, dis, hook){
  const norm = jamKeMenit(nilai);
  if(nilai && norm===null){
    return '<input class="inp" data-r="'+nama+'" value="'+esc(nilai)+'" '
         + 'title="Bentuknya belum dikenali. Ketik ulang mis. 09:00 supaya bisa memakai pemilih jam." '
         + dis+hook+'>';
  }
  return '<input class="inp inp-jam" type="time" data-r="'+nama+'" '
       + 'value="'+(norm!==null?menitKeJam(norm):'')+'" '+dis+hook+'>';
}
function jamKeMenit(s){
  const m=String(s||'').match(/^(\d{1,2})[:.](\d{2})$/); if(!m)return null;
  const h=+m[1], mi=+m[2]; if(h>23||mi>59)return null; return h*60+mi;
}
function menitKeJam(n){
  n=((n%1440)+1440)%1440;                       // lewat tengah malam -> berputar
  return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');
}
// durasi diterima sebagai "90", "90m", "1:30", "1.5j"
function durasiKeMenit(s){
  s=String(s||'').trim().toLowerCase(); if(!s)return null;
  let m=s.match(/^(\d{1,2})[:.](\d{2})$/); if(m)return (+m[1])*60+(+m[2]);
  m=s.match(/^(\d+(?:[.,]\d+)?)\s*j(?:am)?$/); if(m)return Math.round(parseFloat(m[1].replace(',','.'))*60);
  m=s.match(/^(\d+)\s*m?(?:enit)?$/); if(m)return +m[1];
  return null;
}
function rundownHitung(el,dari){
  const tr=el.closest('tr'); if(!tr)return;
  const q=(r)=>tr.querySelector('[data-r="'+r+'"]');
  const mulai=jamKeMenit(q('mulai')&&q('mulai').value);
  if(dari==='durasi'){
    const d=durasiKeMenit(q('durasi').value);
    if(mulai!=null && d!=null) q('selesai').value=menitKeJam(mulai+d);
  } else {
    const sel=jamKeMenit(q('selesai')&&q('selesai').value);
    if(mulai!=null && sel!=null){ let d=sel-mulai; if(d<0)d+=1440; q('durasi').value=String(d); }
  }

  if(typeof autoSaveTrigger==='function') autoSaveTrigger();

/* Baris berikutnya menyambung dari jam selesai baris ini — acara memang
   berurutan, jadi mengetik ulang jam mulai tiap baris cuma pekerjaan sia-sia
   yang gampang salah ketik.

   Hanya diisi kalau baris berikutnya masih KOSONG, atau masih memuat
   sambungan lama yang belum disentuh siapa pun. Jam yang sudah diubah
   manual tidak pernah ditimpa — jeda antar acara itu hal biasa. */
function rundownSambung(tr){
  const sel=tr.querySelector('[data-r="selesai"]'); if(!sel)return;
  const next=tr.nextElementSibling; if(!next)return;
  const m=next.querySelector('[data-r="mulai"]'); if(!m)return;
  const lama=tr.dataset.sambung||'';
  if(m.value==='' || m.value===lama){
    m.value=sel.value;
    tr.dataset.sambung=sel.value;
    // rantainya diteruskan: durasi baris berikutnya ikut menghitung ulang
    const d=next.querySelector('[data-r="durasi"]');
    if(d && d.value) rundownHitung(d,'durasi');
  }
}
function rundownRowHTML(r,canEdit){
  r=r||{}; const dis=canEdit?'':'disabled';
  const ev=canEdit?' oninput="rundownHitung(this,\'durasi\')"':'';
  // 'change' ikut dipasang: memilih jam lewat ikon pemilih tidak selalu
  // memicu 'input' di semua browser, dan tanpa ini durasinya tidak terhitung.
  const es=canEdit?' oninput="rundownHitung(this,\'selesai\')" onchange="rundownHitung(this,\'selesai\')"':'';
  return '<tr>'
    +'<td>'+jamCell('mulai',   r.mulai||r.waktu||'', dis, es)+'</td>'
    +'<td>'+jamCell('selesai', r.selesai||'',        dis, es)+'</td>'
    +'<td><input class="inp" data-r="durasi" placeholder="60" title="menit — ketik ini, jam selesai terhitung sendiri" value="'+esc(r.durasi||'')+'" '+dis+ev+'></td>'
    +'<td><input class="inp" data-r="kegiatan" placeholder="Kegiatan" value="'+esc(r.kegiatan||'')+'" '+dis+'></td>'
    +(canEdit?'<td><button type="button" class="rundown-del" title="Hapus baris" onclick="rundownDelRow(this)">×</button></td>':'')

function rundownAddRow(id,row){
  const body=$(id+'_body'); if(!body)return;
  // Baris baru langsung mulai dari jam selesai baris terakhir. Kalau tabelnya
  // masih kosong, dipakai jam tamu datang dari Informasi Dasar — itu jam yang
  // hampir selalu jadi titik awal rundown.
  let sambungDari=null;
  if(!row || !row.mulai){
    const akhir=body.querySelector('tr:last-child [data-r="selesai"]');
    const awal = (akhir && akhir.value) ? akhir.value : rundownJamAwal();
    if(awal){
      row=Object.assign({}, row||{}, {mulai:awal});
      // Baris sebelumnya perlu tahu bahwa jam ini SAMBUNGAN darinya. Tanpa
      // catatan ini, mengubah durasi baris sebelumnya tidak menggeser baris
      // berikutnya — jamnya dikira sudah diketik manual.
      if(akhir && akhir.value) sambungDari=akhir.closest('tr');
    }
  }

  const tr=tmp.firstElementChild; body.appendChild(tr);
  if(sambungDari) sambungDari.dataset.sambung=row.mulai;

  // diketik berikutnya memang durasinya.
  const isi=tr.querySelector('[data-r="durasi"]'), awal2=tr.querySelector('[data-r="mulai"]');

// Jam mulai acara dari D.1, dipakai sebagai titik awal rundown.
function rundownJamAwal(ev){

/* Tab yang benar-benar tampil untuk user ini — dipakai bareng oleh render tab

/* ---------- Auto-save: simpan draft tiap kali user mengetik/ubah input ----------

function autoSaveCommit(){
  // Auto-save hanya untuk section berbasis field. Bagian Finance sengaja tidak
  // ikut: nilainya memicu hitung ulang & Approval Flow, jadi tetap butuh klik
  // Simpan yang disengaja (perilakunya sama seperti sebelum tab digabung).
  const secs=genericSecsOfTab(curTab); if(!secs.length)return;
  const ev=S.events.find(e=>e.id===_asEvId); if(!ev)return;
  secs.forEach(sec=>sec.fields.forEach(fl=>{ if(!fieldVisible(ev,fl))return; const v=collectField(fl); if(v===undefined)return; ev.detail[fl.k]=v; }));
  if(curTab==='basic'){ ev.nama=ev.detail.nama||ev.nama; ev.jenis=ev.detail.jenis||ev.jenis; ev.tanggal=ev.detail.tanggal||ev.tanggal; ev.pax=+ev.detail.pax||ev.pax; }
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(_){}
  // Sinkron ke server lewat save() (bukan POST mentah) supaya cap versi &
  // penjaga bentrok ikut berlaku. Dijeda agar tidak membanjiri tiap ketukan.
  clearTimeout(_asSrvTimer);
  _asSrvTimer=setTimeout(()=>{ save(); },4000);
  const ind=$('autosave-ind'); if(ind){ ind.textContent='✓ Tersimpan otomatis'; ind.style.opacity='1'; clearTimeout(ind._t); ind._t=setTimeout(()=>{ ind.style.opacity='0'; },1600); }
}
function saveEventTab(id,goNext){
  clearTimeout(_asTimer); // draft terakhir langsung ikut tercommit di bawah
  const ev=S.events.find(e=>e.id===id); const tab=TAB_BY_ID[curTab];
  if(!ev||!tab)return;
  const changes=[];
  genericSecsOfTab(tab.id).forEach(sec=>{
    sec.fields.forEach(fl=>{ if(!fieldVisible(ev,fl))return; const v=collectField(fl); if(v===undefined)return;
      const old=JSON.stringify(ev.detail[fl.k]); if(JSON.stringify(v)!==old)changes.push(fl.l); ev.detail[fl.k]=v; });
  });
  // Tab Finance memuat section 'finance' yang inputnya di luar EVENT_SCHEMA.
  const adaFinance=visibleSecsOfTab(tab.id).some(s=>s.id==='finance');
  if(adaFinance) collectFinanceInto(ev);

  if(curTab==='basic'){ ev.nama=ev.detail.nama||ev.nama; ev.jenis=ev.detail.jenis||ev.jenis; ev.tanggal=ev.detail.tanggal||ev.tanggal; ev.pax=+ev.detail.pax||ev.pax; }
  if(changes.length)logAct('event',id,'Detail diperbarui: '+tab.title,changes.join(', '));
  if(adaFinance) logAct('event',id,'Finance diperbarui',rp(eventFinance(ev).grand));
  const queued=syncApproval(ev); // auto-masuk Approval Flow bila total ≥ ambang
  save(); buildNav();
  toast('Tersimpan',tab.title+' disimpan.'+(adaFinance?' Grand Total: '+rp(eventFinance(ev).grand):''),'ok');
  if(queued) toast('Masuk Approval Flow',esc(ev.nama)+' menunggu persetujuan Manager (nilai ≥ ambang).','ok');

  if(isOpenEvent(ev) && !goNext) setTimeout(()=>toast('Jangan lupa tahapnya','Peluang masih "'+ev.status+'". Perbarui tahap pipeline bila sudah ada kemajuan.'),700);

  go('event',id);
}

/* ---------- APPROVAL FLOW helpers ---------- */
function approvalStatus(ev){ const f=eventFinance(ev); const discPct=f.sub?Math.round(f.disc/f.sub*100):0; return {f,discPct,need:(f.grand>=S.settings.approvalThreshold||discPct>=S.settings.discountThreshold)}; }
function approvalReason(f,discPct){ return (f.grand>=S.settings.approvalThreshold?'Nominal ≥ '+rpShort(S.settings.approvalThreshold):'')+(discPct>=S.settings.discountThreshold?((f.grand>=S.settings.approvalThreshold?' & ':'')+'Diskon '+discPct+'%'):''); }
// otomatis masukkan ke antrian approval bila total/diskon lewat ambang & belum ada entri untuk event ini
function syncApproval(ev){
  if(!ev)return false;
  const {f,discPct,need}=approvalStatus(ev);
  if(!need)return false;
  if(S.approvals.some(a=>a.eventId===ev.id))return false; // sudah ada (pending / sudah diputuskan)
  S.approvals.push({id:uid('ap'),eventId:ev.id,by:ME?ME.id:'',reason:approvalReason(f,discPct),auto:true,status:'Pending',at:new Date().toISOString(),note:''});
  pushNotif('approval','Approval dibutuhkan',ev.nama+' menunggu persetujuan Manager.','#approvals');
  return true;
}
function ajukanApproval(id){
  const ev=S.events.find(e=>e.id===id); if(!ev)return;
  if(S.approvals.some(a=>a.eventId===id&&a.status==='Pending'))return toast('Sudah diajukan','Event ini sudah ada di antrian Approval Flow.','ok');
  if(S.approvals.some(a=>a.eventId===id&&a.status!=='Pending'))return toast('Sudah diputuskan','Approval event ini sudah diproses sebelumnya.','ok');
  const {f,discPct,need}=approvalStatus(ev);
  const auto=need?approvalReason(f,discPct):'';
  modal('<div class="modal-head"><div><h3>Ajukan Approval</h3><p>'+esc(ev.nama)+' · '+rp(f.grand)+'</p></div><div class="x" onclick="closeModal()">'+svg(IC.x)+'</div></div><div class="modal-body">'
   +(need
      ? '<div class="fh" style="margin-bottom:12px;color:var(--warn)">⚠ Wajib approval — '+esc(auto)+'. Nilai melewati ambang (≥ '+rpShort(S.settings.approvalThreshold)+' atau diskon ≥ '+S.settings.discountThreshold+'%).</div>'
      : '<div class="fh" style="margin-bottom:12px">Nilai di bawah ambang (&lt; '+rpShort(S.settings.approvalThreshold)+' &amp; diskon &lt; '+S.settings.discountThreshold+'%) — approval tidak wajib, tapi boleh diajukan. Jelaskan alasannya.</div>')
   +'<div class="field"><label>Alasan Pengajuan<span class="req">*</span></label><textarea class="inp" id="ap_reason" placeholder="Kenapa event ini perlu persetujuan Manager?">'+esc(auto)+'</textarea></div>'

function submitApprovalReq(id){
  const ev=S.events.find(e=>e.id===id); if(!ev)return;
  if(S.approvals.some(a=>a.eventId===id))return toast('Sudah ada','Event ini sudah pernah diajukan.','err');

// Baca file jadi base64 murni (tanpa prefix data:...;base64,) untuk dikirim ke Apps Script.
function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>resolve(String(r.result).split(',').pop());
    r.onerror=()=>reject(new Error('read_failed'));
    r.readAsDataURL(file);
  });
}
async function savePayment(id,paymentId){
  const ev=S.events.find(e=>e.id===id);
  const existing=paymentId?(ev.payments||[]).find(x=>x.id===paymentId):null;
  const amt=+rupiahDigits($('pay_amt').value); if(!amt)return toast('Isi jumlah','Jumlah pembayaran wajib.','err');
  const fileInp=$('pay_receipt_file'), file=fileInp&&fileInp.files&&fileInp.files[0];
  const note=$('pay_note').value.trim();
  const btn=$('pay_save_btn');
  let receiptUrl=existing?(existing.receiptUrl||''):'', receiptName=note||(existing?existing.receipt:'')||'';
  if(file){
    if(file.size>8*1024*1024) return toast('File terlalu besar','Bukti transfer maksimal 8MB.','err');
    if(btn){ btn.disabled=true; btn.textContent='Mengunggah bukti...'; }
    try{
      const b64=await fileToBase64(file);
      const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify({action:'uploadReceipt',fileName:file.name,mimeType:file.type,dataBase64:b64})});
      const data=await res.json();
      if(!data||!data.ok){ if(btn){btn.disabled=false;btn.textContent=existing?'Simpan Perubahan':'Verifikasi & Simpan';} return toast('Gagal unggah','Bukti transfer gagal diunggah'+(data&&data.error?': '+data.error:'')+'. Coba lagi.','err'); }
      // Backend balas {key,name}; URL tampil dibangun dari key (file disajikan
      // oleh api.php action=receipt). Disimpan penuh agar link tetap benar.
      receiptUrl=API_URL+'?action=receipt&key='+encodeURIComponent(data.data.key);
      receiptName=note||data.data.name;
    }catch(e){
      if(btn){ btn.disabled=false; btn.textContent=existing?'Simpan Perubahan':'Verifikasi & Simpan'; }
      return toast('Gagal unggah','Tidak bisa menghubungi server untuk unggah bukti. Coba lagi.','err');
    }
  }
  let p;
  if(existing){
    Object.assign(existing,{type:$('pay_type').value,amount:amt,method:$('pay_method').value,at:$('pay_date').value,receipt:receiptName,receiptUrl:receiptUrl});
    p=existing;
    logAct('event',id,'Pembayaran diedit',p.no+' · '+p.type+' '+rp(amt));
  } else {

function deletePayment(id,paymentId){

function fmtFieldVal(fl,val){
  if(fl.t==='mirror'){
    if(Array.isArray(fl.from)) return (val==null||val==='')?null:String(val);
    const src=fieldByKey(fl.from);
    return src?fmtFieldVal(src,val):((val==null||val==='')?null:String(val));
  }
  if(val==null||val===''||(Array.isArray(val)&&!val.length))return null;
  if(fl.t==='menutbl')return fmtMenuTbl(val);
  if(fl.t==='barangtbl'){
    const rows=Array.isArray(val)?val:[]; if(!rows.length)return null;
    return rows.map(r=>(r.barang||'')+[r.tgl,r.jam].filter(Boolean).join(' ').replace(/^(.)/,' — $1')).join('\n');
  }
  if(fl.t==='itemtbl'){
    const rows=Array.isArray(val)?val:[]; if(!rows.length)return null;
    let sum=0; rows.forEach(r=>{ if(r.nominal!=='' && r.nominal!=null) sum+=+r.nominal||0; });
    const baris=rows.map(r=>(r.nama||'—')+((r.nominal!==''&&r.nominal!=null)?' — '+rp(r.nominal):''));
    if(sum) baris.push('Total: '+rp(sum));
    return baris.join('\n');
  }
  if(fl.t==='rundown'){ const rows=rundownRows(val); if(!rows.length)return null;
    return rows.map(r=>{
      const jam=[r.mulai,r.selesai].filter(Boolean).join('–');
      const dur=r.durasi?' ('+r.durasi+' mnt)':'';
      return (jam?jam+dur+' — ':'')+(r.kegiatan||'');
    }).join('\n'); }
  if(fl.t==='ynnote'){ const o=ynnoteVal(val); if(o.v===undefined&&!o.note)return null; return (o.v?'Ya':'Tidak')+(o.note?' — '+o.note:''); }
  if(fl.t==='multi')return val.join(', ');
  if(fl.t==='tog')return (val===true||(val&&val.v))?'Ya':null;
  if(fl.t==='yn'){ const v=val&&val.v!==undefined?val.v:val; return v===true?'Ya':v===false?'Tidak':null; }
  if(fl.t==='cur')return rp(val);
  if(fl.t==='num')return String(val);
  return String(val);
}

/* Overview memakai pdfNilai() — PENYAJI YANG SAMA dengan PDF. Kalau

function renderOverview(ev){

      if(pdfLewati(fl.k)) return;                        // "...Lain" sudah digabung ke induknya
      if(fl.t!=='files' && fl.t!=='mirror' && !fieldVisible(ev,fl)) return;
      if(fl.t==='mirror') return;                        // cermin: nilainya sudah dihitung di seksi asalnya

      +(window.LM_LOGO?'<img class="ov-logo" src="'+window.LM_LOGO+'" alt="">':'')

      +'<div class="ov-kop-kanan"><div class="ov-label">RANGKUMAN EVENT</div>'
        +'<div class="ov-judul">'+esc(ev.nama||'—')+'</div>'
        +'<div class="ov-tgl">'+fmtDateLong(ev.tanggal)+'</div></div>'
    +'</header>'
    +'<div class="ov-klien">'
      +'<div><b>Client</b> · '+esc(c?c.nama:'—')+(c&&c.perusahaan?' — '+esc(c.perusahaan):'')+'</div>'
      +'<div><b>Marketing PIC</b> · '+esc(userName(ev.mktPIC))+'</div>'
      +'<div><b>Jenis</b> · '+esc(ev.jenis||'—')+'</div>'
      +'<div><b>Estimasi</b> · '+(ev.pax||'—')+' pax</div>'
    +'</div>'
    +'<div class="ov-prog"><div class="ov-prog-bar"><i style="width:'+pct+'%"></i></div>'
      +'<span><b>'+totalIsi+'</b> dari '+totalField+' isian terisi ('+pct+'%)</span></div>';

  return '<div class="ov-doc">'+kop+sorot

/* ============ ALAT BANTU CETAK (PDF) ============
   Nilai yang panjang atau berbentuk tabel jauh lebih mudah dibaca sebagai
   tabel sungguhan daripada teks berbaris-baris. Fungsi di bawah dipakai
   bersama oleh PDF dan Overview supaya keduanya tidak pernah berbeda. */
const PDF_GARIS='1px solid #e5e2da';
function pdfTblBuka(kols){
  return '<table style="width:100%;border-collapse:collapse;font-size:11px;margin:4px 0 2px">'
    +'<thead><tr>'+kols.map(k=>'<th style="text-align:'+(k.r?'right':'left')
      +';padding:5px 8px;background:#F2EFE7;border:'+PDF_GARIS+';font-weight:700;color:#5b5344;'
      +(k.w?'width:'+k.w+';':'')+'">'+esc(k.l)+'</th>').join('')+'</tr></thead><tbody>';
}
function pdfTblBaris(sel,i){
  const bg=i%2?'#ffffff':'#faf9f5';
  return '<tr style="background:'+bg+'">'+sel.map(c=>'<td style="padding:5px 8px;border:'
    +PDF_GARIS+';vertical-align:top'+(c.r?';text-align:right':'')+'">'+(c.h||esc(c.v||''))+'</td>').join('')+'</tr>';

/* Rundown jadi tabel, bukan daftar baris teks. */
function pdfRundownTabel(val){
  const rows=rundownRows(val);

  rows.forEach((r,i)=>{
    h+=pdfTblBaris([{v:r.mulai||''},{v:r.selesai||''},{v:r.durasi?r.durasi+' mnt':'',r:1},

/* Apa yang keluar di jam berapa — dibalik dari tabel menu. */
function pdfJadwalTabel(ev){

                      {v:b.sumber},{v:b.menu},{v:b.grup+(b.ket?' · '+b.ket:'')},{v:b.qty,r:1}],i++);

/* Gambar lampiran ikut tercetak. Dibatasi tingginya supaya satu denah tidak
   memakan satu halaman penuh, dan diberi keterangan namanya. */
/* Hanya baris yang BENAR-BENAR memuat gambar yang dilebarkan. Lampiran
   yang isinya cuma PDF/dokumen tetap memakai tata letak dua kolom biasa —
   melebarkan daftar tautan tidak ada gunanya, malah bikin renggang. */
function pdfAdaGambar(val){ return Array.isArray(val) && val.some(fotoKah); }
function pdfGambar(arr){
  const semua=Array.isArray(arr)?arr:[];
  const g=semua.filter(fotoKah), lain=semua.filter(f=>!fotoKah(f));
  if(!semua.length) return null;
  let h='';
  if(g.length){
    /* Satu gambar = biasanya denah venue, dan itu memang harus dibaca —
       diberi lebar penuh. Lebih dari satu dibagi dua per baris, bukan
       tiga, supaya tetap cukup besar untuk melihat letak meja & panggung.
       Ukuran dalam persen, jadi ikut lebar wadahnya: kolom nilai di
       Overview maupun lebar halaman cetak. */
    const satu=g.length===1;
    h+='<div class="ov-imgs" style="display:flex;flex-wrap:wrap;gap:10px;margin:6px 0">'
      +g.map(f=>'<figure style="margin:0;flex:1 1 '+(satu?'100%':'46%')+';min-width:0">'
        +'<img src="'+esc(attachUrl(f.key))+'" alt="'+esc(f.name||'')+'" '
        +'style="width:100%;max-height:'+(satu?'520':'340')+'px;object-fit:contain;'
        +'border:'+PDF_GARIS+';border-radius:6px;background:#faf9f5">'
        +'<figcaption style="font-size:9.5px;color:#888;margin-top:3px">'+esc(f.name||'')+'</figcaption></figure>').join('')
      +'</div>';
  }
  // Berkas non-gambar (PDF rundown, dsb) TIDAK boleh hilang begitu saja —
  // tidak bisa ditampilkan sebagai gambar, tapi tetap harus terdaftar dan
  // bisa dibuka. Menghilangkannya membuat lampiran terlihat tidak ada.
  if(lain.length){
    h+='<div style="font-size:11px;margin-top:4px">'
      +lain.map(f=>'<a href="'+esc(attachUrl(f.key))+'" target="_blank" rel="noopener">'
        +esc(f.name||f.key)+'</a>').join('<br>')+'</div>';
  }
  return h||null;
}
/* Pasangan "pilihan + tulis sendiri": kalau jawabannya Lainnya, yang
   dicetak CUKUP ketikannya. Mencetak keduanya ("Lainnya" lalu "Jenis
   Dekorasi Lainnya: kain putih") membuat dokumen bertele-tele dan terbaca
   seperti dua jawaban berbeda. */
const PDF_LAINNYA={
  jenis:'jenisLain', area:'areaLain', areaPakai:'areaPakaiLain',
  decorJenis:'decorJenisLain', decorLM:'decorLMLain', fbFormat:'fbFormatLain',
  plating:'platingLain', floorTambah:'floorTambahLain', materiDesain:'materiDesainLain',
  ketentuanBill:null
};
function pdfLewati(k){
  // field "...Lain" tidak dicetak sendiri — isinya sudah digabung ke induknya
  for(const induk in PDF_LAINNYA) if(PDF_LAINNYA[induk]===k) return true;
  return false;
}
function pdfNilai(fl,ev){
  if(fl.t==='salinlayout') return {h:null};       // tombol, tidak ikut dicetak
  const val=detailVal(ev,fl);
  if(fl.t==='rundown')  return {h:pdfRundownTabel(val)};
  if(fl.t==='menutbl')  return {h:pdfMenuTabel(val)};
  if(fl.t==='barangtbl')return {h:pdfBarangTabel(val)};
  if(fl.t==='itemtbl')  return {h:pdfItemTabel(val)};
  if(fl.t==='files')    return {h:pdfGambar(val)};
  if(fl.jadwal){
    const jam=fmtFieldVal(fl,val), tbl=pdfJadwalTabel(ev);
    if(!tbl) return {h:jam?esc(String(jam)):null};
    return {h:(jam?'<div style="margin-bottom:6px">'+esc(String(jam))+'</div>':'')+tbl};
  }
  let s=fmtFieldVal(fl,val);
  if(s==null||s==='') return {h:null};
  // gabungkan "Lainnya" dengan ketikannya
  const lain=PDF_LAINNYA[fl.k];
  if(lain){
    const isi=(ev.detail[lain]||'').trim();
    if(isi){
      s=String(s).split(', ').map(x=>x==='Lainnya'?isi:x).join(', ');
      if(!s.includes(isi)) s=isi;
    }
  }
  return {h:esc(String(s)).replace(/\n/g,'<br>')};
}

let calDate=new Date(); calDate.setDate(1);
let calStatusFilter='';
function renderCalendar(V){
  const statusOpts=['Lead','Prospect','Quotation Terkirim','Negotiation','Deal','Event Done','Lost'];
  let h=pageHead('Modul F','Kalender','Satu jadwal untuk seluruh venue — hindari dobel booking.',
    '<select class="inp" style="width:auto;padding:7px 12px" onchange="calStatusFilter=this.value;go(\'calendar\')"><option value=""'+(calStatusFilter===''?' selected':'')+'>Semua status</option>'+statusOpts.map(s=>'<option'+(calStatusFilter===s?' selected':'')+'>'+s+'</option>').join('')+'</select>'
    +'<button class="btn sm" onclick="calNav(-1)">←</button><button class="btn sm" onclick="calToday()">Hari Ini</button><button class="btn sm" onclick="calNav(1)">→</button>');
  h+='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><h3 style="font-size:18px">'+MONTHS_F[calDate.getMonth()]+' '+calDate.getFullYear()+'</h3>';
  h+='<div class="pill-row" style="font-size:11px">'+Object.keys(EVENT_COLOR).slice(0,5).map(t=>'<span class="pill-row" style="gap:5px"><span style="width:9px;height:9px;border-radius:3px;background:var('+EVENT_COLOR[t]+')"></span>'+t+'</span>').join('')+'</div></div>';
  h+='<div class="cal">'+DAYS.map(d=>'<div class="dow">'+d+'</div>').join('');
  const y=calDate.getFullYear(),m=calDate.getMonth();
  const first=new Date(y,m,1).getDay(); const dim=new Date(y,m+1,0).getDate(); const prevDim=new Date(y,m,0).getDate();
  const cells=[];
  for(let i=first-1;i>=0;i--)cells.push({d:prevDim-i,other:true});
  for(let i=1;i<=dim;i++)cells.push({d:i,other:false});
  while(cells.length%7)cells.push({d:cells.length-dim-first+1,other:true});
  cells.forEach(cell=>{
    const ds=cell.other?'':y+'-'+String(m+1).padStart(2,'0')+'-'+String(cell.d).padStart(2,'0');
    const isToday=ds===today();
    const evs=cell.other?[]:S.events.filter(e=>e.tanggal===ds&&(calStatusFilter?e.status===calStatusFilter:e.status!=='Lost'));
    h+='<div class="cell'+(cell.other?' other':'')+(isToday?' today':'')+'"><div class="dn">'+cell.d+'</div>';
    evs.forEach(e=>{ const col=EVENT_COLOR[e.jenis]||'--muted'; h+='<div class="ev" style="background:color-mix(in srgb,var('+col+') 20%,transparent);border-left-color:var('+col+')" onclick="calEventPopup(\''+e.id+'\')" title="'+esc(e.nama)+'">'+esc(e.nama)+'</div>'; });
    h+='</div>';
  });
  h+='</div></div>';
  V.innerHTML=h;
}

function calToday(){ calDate=new Date(); calDate.setDate(1); go('calendar'); }

    .sort((a,b)=>a.tanggal.localeCompare(b.tanggal));

function renderTasks(V){

function delTaskCategory(name){

function decideApproval(id,decision){
  const a=S.approvals.find(x=>x.id===id); a.status=decision; a.by2=ME.id; a.decidedAt=new Date().toISOString();
  const e=S.events.find(x=>x.id===a.eventId);
  logAct('event',a.eventId,'Approval '+decision,'oleh '+ME.name);
  // Approval ditolak → peluang otomatis dianggap batal (pindah ke tahap Lost),
  // supaya event tidak nyangkut di tahap lama dan lolos ke invoice.
  if(decision==='Rejected' && e && e.status!=='Lost'){
    const prev=e.status; e.status='Lost'; e.pipeCol='Lost';
    logAct('event',a.eventId,'Tahap → Lost','otomatis: approval ditolak (dari '+prev+')');
  }
  pushNotif('approval','Approval '+decision,(e?e.nama:'')+' telah di-'+decision.toLowerCase()+'.','#event/'+a.eventId);
  save(); buildNav(); toast('Approval '+decision,(e?e.nama:''),decision==='Approved'?'ok':'err'); go('approvals');
}

  const leads=S.events.length; const deals=closed.length;
  const convRate=leads?Math.round(deals/leads*100):0;

   +stat('Repeat Customer',S.clients.filter(c=>clientEventCount(c.id)>1).length,'klien balik lagi','star')
   +'</div>';
  // Omzet 0 padahal ada event closing = biaya di tab Quotation belum diisi

  // funnel
  const funnel=[['Lead',atStage('Lead')],['Prospect',atStage('Prospect')],['Quotation Terkirim',atStage('Quotation Terkirim')],['Negotiation',atStage('Negotiation')],['Deal',deals],['Lost',atStage('Lost')]];

  const maxF=Math.max(1,...funnel.map(f=>f[1]));
  funnel.forEach(([l,n])=>{ const w=Math.round(n/maxF*100); h+='<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px"><span>'+l+'</span><span class="mono">'+n+'</span></div><div class="progress" style="height:12px"><div class="bar" style="width:'+w+'%"></div></div></div>'; });
  h+='</div>';

function renderReports(V){
  let h=pageHead('Modul K','Reporting & Analytics','Laporan revenue, pax & atribusi baseline vs uplift.',
    '<button class="btn" onclick="exportCSV()">'+svg(IC.down)+'Export CSV</button>');
  const closed=S.events.filter(e=>['Confirmed','Deal','Event Done'].includes(e.status));
  // by type
  const byType={}; closed.forEach(e=>{ byType[e.jenis]=(byType[e.jenis]||0)+eventFinance(e).grand; });
  const totalRev=Object.values(byType).reduce((a,b)=>a+b,0);
  const totalPax=closed.reduce((a,e)=>a+(+e.pax||0),0);
  h+='<div class="grid g-3" style="margin-bottom:18px">'+stat('Total Revenue',rpShort(totalRev),closed.length+' event','money')+stat('Total Pax',totalPax.toLocaleString('id-ID'),'tamu terlayani','crm')+stat('Avg per Pax',rp(totalPax?Math.round(totalRev/totalPax):0),'revenue/tamu','report')+'</div>';
  // donut by type
  h+='<div class="grid" style="grid-template-columns:1fr 1fr;align-items:start"><div class="card"><h3 style="font-size:15px;margin-bottom:16px">Revenue per Jenis Event</h3><div style="display:flex;gap:24px;align-items:center;flex-wrap:wrap">';
  h+=donutSVG(Object.entries(byType).map(([k,v])=>({label:k,val:v,color:EVENT_COLOR[k]||'--muted'})));
  h+='<div class="legend" style="flex:1">'+Object.entries(byType).map(([k,v])=>'<div class="li"><span class="lc" style="background:var('+(EVENT_COLOR[k]||'--muted')+')"></span>'+esc(k)+'<span class="lv">'+rpShort(v)+'</span></div>').join('')+'</div>';
  h+='</div></div>';
  // baseline vs uplift
  const eventDays=closed.length; const bDaily=baselineDaily();
  const eventRevenue=totalRev; const baselineTotal=bDaily*eventDays;
  const uplift=Math.max(0,eventRevenue-baselineTotal);
  h+='<div class="card"><h3 style="font-size:15px;margin-bottom:6px">Baseline vs Uplift</h3><p class="section-desc">Rumus: <b>Uplift = Revenue hari event − (Baseline harian × jumlah hari event)</b>. Baseline = omzet rata-rata venue pada hari <b>tanpa</b> event, diisi manual di Pengaturan.</p>';
  if(!bDaily){
    h+='<div style="padding:11px;background:var(--warn-bg);border-radius:9px;font-size:12px;color:var(--sand-dim)">'+svg(IC.alert)+' <b>Baseline belum diisi.</b> Uplift tidak bisa dihitung. Isi "Baseline Revenue Harian" di <b>Pengaturan</b> — angkanya harus datang dari laporan Finance (omzet hari non-event), karena sistem ini hanya mencatat event.</div></div></div>';
    V.innerHTML=h; return;
  }
  h+='<dl class="kv-list"><dt>Revenue hari event</dt><dd class="mono">'+rp(eventRevenue)+'</dd><dt>Baseline ('+eventDays+' hari × '+rpShort(bDaily)+')</dt><dd class="mono">'+rp(baselineTotal)+'</dd><dt style="color:var(--gold)">Uplift Event</dt><dd class="mono" style="color:var(--gold);font-weight:600">'+rp(uplift)+'</dd></dl>';
  h+='<div style="margin-top:12px;padding:11px;background:var(--info-bg);border-radius:9px;font-size:11.5px;color:var(--sand-dim)">'+svg(IC.alert,'')+' Rekomendasi PRD (Bagian 14, poin 6): sistem ini mencatat data mentah; perhitungan baseline/uplift final tetap diverifikasi Finance (Dina/Cindy) agar konsisten dengan laporan berjalan.</div>';
  h+='</div></div>';
  V.innerHTML=h;
}
function donutSVG(data){
  const total=data.reduce((a,d)=>a+d.val,0)||1; let off=0; const r=60,c=2*Math.PI*r;
  let segs='';
  data.forEach(d=>{ const frac=d.val/total; const len=frac*c; segs+='<circle cx="75" cy="75" r="'+r+'" fill="none" stroke="var('+d.color+')" stroke-width="26" stroke-dasharray="'+len+' '+(c-len)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 75 75)"/>'; off+=len; });
  return '<div class="donut"><svg width="150" height="150" viewBox="0 0 150 150">'+segs+'<text x="75" y="72" text-anchor="middle" fill="var(--sand)" font-size="12" font-family="Inter">Total</text><text x="75" y="90" text-anchor="middle" fill="var(--gold)" font-size="15" font-weight="700" font-family="Inter">'+rpShort(total)+'</text></svg></div>';
}
function exportCSV(){
  const rows=[['Event','Client','Jenis','Tanggal','Status','Pax','Grand Total','DP','Terbayar','Sisa','Marketing PIC']];
  S.events.forEach(e=>{ const f=eventFinance(e); rows.push([e.nama,clientName(e.clientId),e.jenis,e.tanggal,e.status,e.pax||0,f.grand,f.dp,f.paid,f.remaining,userName(e.mktPIC)]); });
  const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='laksamana_events_'+today()+'.csv'; a.click();
  toast('Export selesai','Data event diunduh sebagai CSV.','ok');
}

function menuDbBisaUbah(){ return viewPerm('menudb',ME)>=PERM_EDIT; }
/* Nama jenis & menu diketik bebas oleh pengguna, dan dipakai sebagai ARGUMEN
   di dalam onclick="...('nama')". Kutip tunggal di dalam nama (mis. "Nasi
   Uduk 'Spesial'") akan memutus string JS-nya kalau tidak dilolosi. Urutannya
   wajib: lolos untuk JS dulu (backslash), baru lolos untuk HTML — kebalikannya
   tidak menolong, karena &#39; justru dikembalikan jadi ' oleh parser HTML
   SEBELUM JS-nya dibaca. */
function escJs(s){ return esc(String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")); }
function renderMenuDb(V){
  const bisaUbah=menuDbBisaUbah(), jenis=menuDbJenis();
  let h=pageHead('Data Master','Database Menu',
    'Daftar menu yang biasa dipakai, dikelompokkan per jenis. Isinya muncul sebagai pilihan saat mengisi Menu Final (Kitchen) & Daftar Menu Bar — kolomnya tetap boleh diketik bebas.','');

    h+='<div class="card mdb-baru"><div class="eyebrow">Tambah jenis baru</div>'

      +'<input class="inp" id="mdb_jenis_baru" placeholder="mis. Karbohidrat, Dessert, Minuman" '
      +'onkeydown="if(event.key===\'Enter\'){event.preventDefault();menuDbTambahJenis();}">'
      +'<button class="btn" onclick="menuDbTambahJenis()">'+svg(IC.plus)+'Tambah Jenis</button>'
      +'</div></div>';
  }
  if(!jenis.length){
    h+=empty('Belum ada jenis menu','Tambahkan jenis dulu (mis. Karbohidrat), lalu isi menunya.','brief');
    V.innerHTML=h; return;
  }
  h+='<div class="mdb-grid">';
  jenis.forEach(j=>{
    const daftar=(S.menuDb[j]||[]).slice().sort((a,b)=>a.localeCompare(b));
    const jj=escJs(j);
    h+='<div class="card mdb-kartu"><div class="mdb-head">'
      +'<h3 class="section-title">'+esc(j)+'</h3>'
      +'<span class="cell-sub">'+daftar.length+' menu</span>'
      +(bisaUbah?'<button class="btn sm danger" title="Hapus jenis ini" onclick="menuDbHapusJenis(\''+jj+'\')">'+svg(IC.trash)+'</button>':'')
      +'</div>';
    h+='<div class="mdb-list">'+(daftar.length
      ? daftar.map(m=>'<span class="mdb-item">'+esc(m)
          +(bisaUbah?'<button type="button" title="Hapus menu ini" onclick="menuDbHapusMenu(\''+jj+'\',\''+escJs(m)+'\')">&times;</button>':'')
          +'</span>').join('')
      : '<span class="cell-sub">Belum ada menu di jenis ini.</span>')+'</div>';
    if(bisaUbah){
      h+='<div class="mdb-tambah"><input class="inp" id="mdb_'+esc(j)+'" placeholder="Tambah menu — pisahkan dengan koma" '
        +'onkeydown="if(event.key===\'Enter\'){event.preventDefault();menuDbTambahMenu(\''+jj+'\');}">'
        +'<button class="btn sm" onclick="menuDbTambahMenu(\''+jj+'\')">Tambah</button></div>';
    }
    h+='</div>';
  });
  h+='</div>';
  V.innerHTML=h;
}
function menuDbSimpan(){ save(); paintMenuDatalist(); renderMenuDb($('view')); }
function menuDbTambahJenis(){
  if(!menuDbBisaUbah()) return;
  const el=$('mdb_jenis_baru'); if(!el) return;
  const n=el.value.trim(); if(!n) return;
  if(Object.keys(S.menuDb).some(x=>x.toLowerCase()===n.toLowerCase())){
    toast('Sudah ada','Jenis "'+n+'" sudah terdaftar.','err'); return;
  }
  S.menuDb[n]=[]; el.value='';
  logAct('menudb',n,'Jenis menu ditambah',n);
  menuDbSimpan();
  toast('Jenis ditambah','"'+n+'" siap diisi menunya.','ok');
}
function menuDbHapusJenis(j){
  if(!menuDbBisaUbah()) return;
  const n=(S.menuDb[j]||[]).length;
  // Menu yang sudah TERTULIS di event tersimpan di dalam event itu sendiri,
  // bukan rujukan ke sini — jadi menghapus di sini tidak merusak event lama.
  if(!confirm('Hapus jenis "'+j+'"'+(n?' beserta '+n+' menunya':'')+' dari database?\n\n'
    +'Menu yang sudah tertulis di event TIDAK ikut terhapus — yang hilang hanya sarannya.')) return;
  delete S.menuDb[j];
  logAct('menudb',j,'Jenis menu dihapus',j+(n?' ('+n+' menu)':''));
  menuDbSimpan();
}
function menuDbTambahMenu(j){
  if(!menuDbBisaUbah()) return;
  const el=$('mdb_'+j); if(!el) return;
  // Boleh beberapa sekaligus dipisah koma — mengetik satu per satu itu lambat.
  const baru=el.value.split(',').map(x=>x.trim()).filter(Boolean);
  if(!baru.length) return;
  const ada=S.menuDb[j]||(S.menuDb[j]=[]);
  const masuk=[];
  baru.forEach(m=>{
    // Tolak duplikat yang cuma beda huruf besar-kecil — justru itu yang bikin
    // rekap per menu pecah jadi dua baris.
    if(!ada.some(x=>x.toLowerCase()===m.toLowerCase()) &&

  toast('Ditambahkan',masuk.length+' menu masuk ke "'+j+'".','ok');
}

// Tarik pegawai dari Office (API & PIN sama seperti panel Kelola Akses)
async function importOfficeStaff(){
  if(typeof window.lmaListMembers!=='function')return toast('Belum siap','Modul Kelola Akses belum termuat. Coba refresh.','err');
  toast('Memuat','Mengambil data pegawai dari Office…','ok');
  let r; try{ r=await window.lmaListMembers(); }catch(e){ return toast('Gagal','Tidak bisa menghubungi Office: '+e.message,'err'); }
  if(r===null) return; // PIN dibatalkan
  if(r.error) return toast('Gagal',r.error==='forbidden'?'PIN salah atau kamu bukan admin modul Marketing.':String(r.error),'err');
  S.staff=S.staff||[];
  let added=0,updated=0;
  (r.members||[]).forEach(m=>{
    if(!m||!m.name)return;
    let s=(m.id&&S.staff.find(x=>x.officeId===m.id))||S.staff.find(x=>String(x.name).toLowerCase()===String(m.name).toLowerCase());
    if(s){
      let ch=false;
      if(m.id&&s.officeId!==m.id){ s.officeId=m.id; ch=true; }
      if(m.name&&s.name!==m.name){ s.name=m.name; ch=true; }
      if(m.keterangan&&!s.jabatan){ s.jabatan=m.keterangan; ch=true; }
      if(m.active===false&&s.active!==false){ s.active=false; ch=true; }
      if(ch)updated++;
    } else {
      S.staff.push({id:uid('st'),officeId:m.id||'',name:m.name,div:'',jabatan:m.keterangan||'',hp:m.hp||'',source:'office',active:m.active!==false});
      added++;
    }
  });
  logAct('user','-','Data pegawai ditarik dari Office',added+' baru · '+updated+' diperbarui');
  save(); paintStaffDatalist();
  toast('Selesai',added+' pegawai baru, '+updated+' diperbarui.','ok');
  go('staff');
}

    +(canMU?'<button class="btn sm pri" onclick="saveRoleMatrix()">'+svg(IC.check)+'Simpan Matriks</button>':'')+'</div>';

      return '<td class="mx-role">'+(locked

function saveRoleMatrix(){
  if(!can('manage_users'))return toast('Akses ditolak','Kamu tidak punya izin kelola user.','err');
  S.roleAcc=S.roleAcc||{};
  Object.keys(ROLES).forEach(r=>{
