   Koordinat meja datang dari assets/venue-layouts.js — kanvas tetap 1600x1160
   yang diubah jadi persen, jadi denah ikut lebar berapa pun tanpa gepeng. */
.denah{position:relative;width:100%;padding-top:72.5%;background:var(--ink-900);
  border:1px solid var(--line);border-radius:12px;overflow:hidden}
.denah-in{position:absolute;inset:0}
.dn-fix{position:absolute;display:grid;place-items:center;text-align:center;font-size:9px;font-weight:700;
  letter-spacing:.08em;color:var(--muted);background:var(--ink-880);border:1px dashed var(--line);border-radius:6px}
.dn-meja{position:absolute;display:grid;place-items:center;gap:1px;border-radius:7px;cursor:pointer;
  border:1.5px solid var(--line-hard);background:var(--ink-880);color:var(--sand-dim);
  font-size:10px;font-weight:700;line-height:1.1;padding:2px;transition:.12s}
.dn-meja:hover{border-color:var(--gold);color:var(--sand)}
.dn-meja .dn-cap{font-size:8px;font-weight:600;opacity:.7}
/* Meja terkunci/terpilih: emas PEKAT dengan tulisan putih.
   Dulu isiannya krem (--gold-glow #F2E9D3) di atas kanvas denah yang juga
   nyaris putih (--ink-900 #F7F6F4) — tandanya nyaris tak terlihat, dan nomor
   meja 9.5px berwarna emas tua di atas krem susah dibaca. Putih di atas
   --gold-deep memberi kontras ±7:1, cukup untuk teks sekecil itu. */
.dn-meja.on{background:var(--gold-deep);border-color:var(--gold-deep);color:#fff}
.dn-meja.on .dn-cap{color:#fff;opacity:.85}
.dn-meja.on:hover{border-color:var(--gold-deep);color:#fff}
.dn-meja.off{cursor:not-allowed;opacity:.5;background:var(--danger-bg);border-color:var(--danger);color:var(--danger)}
.dn-meja.off:hover{border-color:var(--danger)}
/* Denah baca-saja di panel Detail: meja yang TIDAK dikunci sengaja dipudarkan
   supaya meja emas milik tamu itu langsung terbaca dalam sekali lihat. Kursor
   dan hover dimatikan — tanpa itu mejanya tampak bisa diklik padahal tidak. */
.dn-meja.dn-pudar{cursor:default;opacity:.42}
.dn-meja.dn-pudar:hover{border-color:var(--line-hard);color:var(--sand-dim)}
div.dn-meja{cursor:default}   /* <div> hanya dipakai mode baca-saja; <button> tetap bisa diklik */
.dn-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--sand-dim);margin-top:10px}
.dn-legend i{width:12px;height:12px;border-radius:3px;display:inline-block;vertical-align:-2px;margin-right:5px}

/* baris centang "perusahaan baru" di form Reservasi VIP */
.vip-cek{display:flex;align-items:center;gap:7px;margin-top:8px;font-size:12px;
  font-weight:600;color:var(--sand-dim);cursor:pointer}
.vip-cek input{width:14px;height:14px;accent-color:var(--gold);cursor:pointer}
/* --- ringkasan slot di pemilih meja Reservasi VIP --- */
.vip-ringkas{margin-top:14px;padding:12px 14px;background:var(--ink-900);border:1px solid var(--line);border-radius:11px}
.vip-slot-chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:9px}
.vip-chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;
  border-radius:999px;background:var(--gold-glow);color:var(--gold-deep);border:1px solid var(--gold-deep)}
.vip-chip i{font-style:normal;font-weight:600;font-size:10.5px;opacity:.8}
.vip-slot-total{font-size:12.5px;color:var(--sand-dim)}
.vip-slot-total.kurang{color:var(--warn)}
/* --- daftar meja yang sudah dikunci, dibaca sebelum memilih --- */
.vip-terkunci{margin-top:12px;padding:10px 13px;border-radius:11px;
  background:var(--danger-bg);border:1px solid var(--danger);color:var(--danger)}
.vip-terkunci.kosong{background:var(--ink-900);border-color:var(--line);color:var(--sand-dim)}
.vip-terkunci b{font-size:12.5px;display:block;margin-bottom:7px}
.vip-terkunci-list{display:flex;flex-wrap:wrap;gap:7px}
.vip-tk{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;
  padding:3px 9px;border-radius:999px;background:var(--ink-900);border:1px solid var(--danger);color:var(--sand)}
.vip-tk i{font-style:normal;font-weight:800;color:var(--danger)}

.vip-lantai{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
.vip-lantai button{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;

/* ---- bentuk state: pastikan default & array selalu ada ----
   DB kosong balas settings {} — tanpa ini, DEFAULT_SETTINGS (mis. serviceCharge,
   dpPercent) hilang dan perhitungan finance jadi kacau. */
const MKT_COLS=['clients','events','followups','approvals','users','staff',
                'taskTemplates','taskCategories','categories','notifs','activities','vip'];
// Data LAMA (sebelum matriks None/Lihat/Ubah): s.roleNav[role]=[view,...],
// s.rolePerms[role]=[action,...], keduanya array terpisah. Naikkan jadi
// s.roleAcc[role]={view:0|1|2} — view yang tadinya di roleNav dapat minimal
// PERM_VIEW, dan kalau aksi si view (lihat ACTION_VIEW) ada di rolePerms lama,
// naik ke PERM_EDIT. Supaya migrasi TIDAK diam-diam mengunci siapa pun.
function migrateRoleAcc(oldNav, oldPerms){
  const acc={};
  permViewKeys().forEach(v=>{
    const sawNav=Array.isArray(oldNav)&&oldNav.includes(v);
    const action=Object.keys(ACTION_VIEW).find(a=>ACTION_VIEW[a]===v);
    const sawEdit=action&&Array.isArray(oldPerms)&&oldPerms.includes(action);
    acc[v]=sawEdit?PERM_EDIT:(sawNav?PERM_VIEW:PERM_NONE);
  });
  return acc;
}
function normalizeState(s){
  s=s||{};
  MKT_COLS.forEach(k=>{ if(!Array.isArray(s[k])) s[k]=[]; });
  /* Database menu: { "Karbohidrat":["Nasi Putih",...], ... }
     Belum pernah ada  -> isi contoh awal supaya halamannya tidak kosong melompong.
     Sudah ada tapi []  -> itu objek KOSONG yang pulang dari PHP sebagai array
     (json_decode assoc tidak bisa membedakan {} dan []). Jadikan objek lagi;
     JANGAN dikembalikan ke contoh awal, karena berarti isinya memang sengaja
     dikosongkan oleh pengguna. */
  /* KATALOG — materi presentasi (gambar + judul + subjudul + deskripsi).
     Sengaja TIDAK dimasukkan ke MKT_COLS: MKT_COLS menandai koleksi yang
     disimpan per-baris dengan penjaga bentrok, sedangkan katalog pulang-pergi
     sebagai satu blok lewat jalur 'extra:' di backend. Menaruhnya di MKT_COLS
     akan menyelipkan baseUpdatedAt ke tiap baris untuk penjaga yang tidak ada
     di sisi server. */
  if(!Array.isArray(s.katalog)) s.katalog=[];
  s.katalog=s.katalog.filter(function(x){ return x&&typeof x==='object'; }).map(function(x){
    return {id:x.id||uid('kat'), judul:String(x.judul==null?'':x.judul),
            sub:String(x.sub==null?'':x.sub), desc:String(x.desc==null?'':x.desc),
            key:x.key||'', name:x.name||'', at:x.at||new Date().toISOString(), by:x.by||''};
  });
  if(s.menuDb===undefined||s.menuDb===null) s.menuDb=MENU_DB_AWAL();
  else if(typeof s.menuDb!=='object'||Array.isArray(s.menuDb)) s.menuDb={};
  /* Naikkan item menu lama (string) jadi {n,h}. Dilakukan sekali saat memuat
     supaya yang TERSIMPAN pun seragam — tanpa ini bentuk campur bertahan
     selamanya dan tiap pembaca harus ingat menormalkannya. Nilai yang bukan
     array (mis. objek kosong dari PHP) dikembalikan jadi array. */
  Object.keys(s.menuDb).forEach(function(j){
    var a=s.menuDb[j];
    if(!Array.isArray(a)){ s.menuDb[j]=[]; return; }
    s.menuDb[j]=a.map(function(x){
      if(typeof x==='string') return {n:x.trim(), h:null};
      if(x && typeof x==='object'){
        var n=String(x.n!=null?x.n:(x.nama!=null?x.nama:'')).trim();
        var h=(x.h===undefined||x.h===null||x.h==='')?null:(+x.h||0);
        return {n:n, h:h};
      }
      return null;
    }).filter(function(x){ return x && x.n; });
  });
  /* fbFormats & fbSubs pulang lewat jalur 'extra:' backend, jadi TIDAK ikut
     MKT_COLS. Yang dipaksa di sini hanya "harus array kalau ada" — bukan diisi
     bibit, karena [] di sini berarti pengguna memang menghapus semuanya.
     Pembibitannya ada di getFbFormats(). */
  if(s.fbFormats!==undefined && !Array.isArray(s.fbFormats)) s.fbFormats=[];
  if(!Array.isArray(s.fbSubs)) s.fbSubs=[];
  /* MIGRASI: progres job Format F&B pindah dari kunci 'Kitchen' ke kunci
     formatnya sendiri.

     Dulu item Prasmanan/Set Menu dirender DI DALAM kartu Kitchen, jadi
     setJobProg/setJobMeta menyimpannya sebagai jobProgress['Kitchen'][id].
     Sekarang item itu dibaca di bawah jobProgress['Prasmanan'][id]. Tanpa
     dipindahkan, seluruh progres F&B yang sudah dicentang tim akan terbaca 0%
     lagi — tidak ada error, tidak ada yang tahu, cuma pekerjaan yang seolah
     belum pernah dikerjakan. Itu kerusakan paling mahal di modul ini.

     Aman diulang: setelah dipindah, kuncinya tidak ada lagi di 'Kitchen'.
     Yang dipindah HANYA id yang memang milik template ber-div Format F&B —
     job Kitchen sendiri dan job tambahan tidak tersentuh. */
  (function(){
    const fmt=Array.isArray(s.fbFormats)?s.fbFormats:FB_FORMATS_DEFAULT;
    const milik={};
    (s.taskTemplates||[]).forEach(t=>{ if(t&&t.id&&fmt.indexOf(t.div)>-1) milik[t.id]=t.div; });
    if(!Object.keys(milik).length) return;
    (s.events||[]).forEach(ev=>{
      ['jobProgress','jobMeta'].forEach(k=>{
        const kotak=ev&&ev[k];
        const dapur=kotak&&kotak.Kitchen;
        if(!dapur||typeof dapur!=='object'||Array.isArray(dapur)) return;
        Object.keys(dapur).forEach(id=>{
          const f=milik[id]; if(!f) return;
          // {} kosong pulang dari PHP sebagai [] — jangan ditempeli properti.
          if(!kotak[f]||typeof kotak[f]!=='object'||Array.isArray(kotak[f])) kotak[f]={};
          if(!(id in kotak[f])) kotak[f][id]=dapur[id];
          delete dapur[id];
        });
      });
    });
  })();
  s.settings=Object.assign({}, DEFAULT_SETTINGS, s.settings||{});
  if(typeof s.baseline!=='number') s.baseline=0;
  if(!s.roleAcc||typeof s.roleAcc!=='object'){
    s.roleAcc={};
    if(s.roleNav||s.rolePerms){ // data lama ada: naikkan per role yang pernah diatur
      const roles=new Set([...Object.keys(s.roleNav||{}),...Object.keys(s.rolePerms||{})]);
      roles.forEach(r=>{ s.roleAcc[r]=migrateRoleAcc((s.roleNav||{})[r],(s.rolePerms||{})[r]); });
    }
  }
  /* VIEW BARU DI MATRIKS YANG SUDAH TERSIMPAN. Menambahkan menu baru ke NAV_DEF
     ikut menambah barisnya di matriks izin — tapi matriks yang SUDAH pernah
     disimpan tidak punya kunci itu. viewPerm() mengembalikan PERM_NONE untuk
     kunci yang hilang, sementara editor matriksnya menampilkan `?? PERM_VIEW`.
     Akibatnya layar Hak Akses bilang "Lihat" padahal menunya tidak muncul sama
     sekali, dan tidak ada cara menebaknya dari layar. Diisi di sini dengan
     default rolenya, sekali tiap kali data dimuat. */
  if(s.roleAcc&&typeof s.roleAcc==='object'){
    Object.keys(s.roleAcc).forEach(function(r){
      const acc=s.roleAcc[r]; if(!acc||typeof acc!=='object')return;
      permViewKeys().forEach(function(v){ if(typeof acc[v]!=='number') acc[v]=roleDefaultPerm(r,v); });
    });
  }
  (Array.isArray(s.users)?s.users:[]).forEach(function(u){
    if(!u||!u.acc||typeof u.acc!=='object')return;
    permViewKeys().forEach(function(v){ if(typeof u.acc[v]!=='number') u.acc[v]=roleDefaultPerm(u.role,v); });
  });
  delete s.rolePerms; delete s.roleNav; // bentuk lama dibuang, sudah pindah ke roleAcc
  // Per-user override: u.nav/u.perms (array) -> u.acc ({view:0|1|2}).
  (s.users||[]).forEach(u=>{
    if((Array.isArray(u.nav)||Array.isArray(u.perms)) && (!u.acc||typeof u.acc!=='object')){
      u.acc=migrateRoleAcc(u.nav,u.perms);
    }
    delete u.nav; delete u.perms;
  });
  /* MIGRASI: daftar pegawai (s.staff) dilebur ke daftar user (s.users).
     Dulu keduanya daftar orang yang sama tapi hidup terpisah — s.staff hanya
     terisi kalau ada yang menekan "Tarik dari Office", jadi rutin ketinggalan.
     Sekarang satu daftar saja.

     Yang dipindah hanya kolom yang TIDAK dimiliki user itu: divisi, jabatan,
     dan No. HP yang mungkin sudah dirapikan tangan. Baris s.staff yang tidak
     punya padanan user (pegawai yang ditambah manual dan memang tidak punya
     akun) tetap ikut masuk sebagai user nonaktif-akses — namanya harus tetap
     bisa dipilih jadi PIC di event lama. Aman diulang: sesudahnya s.staff
     kosong, jadi pemuatan berikutnya tidak menemukan apa pun untuk dipindah. */
  if(Array.isArray(s.staff) && s.staff.length){
    s.users=Array.isArray(s.users)?s.users:[];
    s.staff.forEach(st=>{
      if(!st||!st.name) return;
      const u=s.users.find(x=>x&&String(x.name||'').toLowerCase()===String(st.name).toLowerCase());
      if(u){
        if(st.div&&!u.div) u.div=st.div;
        if(st.jabatan&&!u.jabatan) u.jabatan=st.jabatan;
        if(st.hp&&!u.hp) u.hp=st.hp;
      } else {
        s.users.push({id:st.officeId||st.id||('st_'+Math.random().toString(36).slice(2,9)),
          name:st.name, div:st.div||'', jabatan:st.jabatan||'', hp:st.hp||'',
          /* Tanpa `acc` sendiri: hak aksesnya mengikuti bawaan role, sama
             seperti user baru mana pun. Menuliskan acc:{} justru berarti
             "semua menu Tak Terlihat" dan orangnya terkunci diam-diam. */
          role:'operational', active:st.active!==false});
      }
    });
    s.staff=[];
  }
  return s;
}

/* ---- penstempel updatedAt + baseUpdatedAt ----
   Server menolak baris yang lebih lama daripada versi di server (penjaga
   bentrok). Supaya itu bekerja, tiap baris yang BERUBAH harus:
     - updatedAt = sekarang        (menandai versi baru)
     - baseUpdatedAt = versi yang KITA muat dari server saat itu
   Baris yang tidak berubah tidak dicap, jadi tidak menabrak kerja orang lain.
   Membandingkan sidik jari tiap baris dengan salinan terakhir dari server,
   supaya tidak perlu menandai perubahan di puluhan tempat mutasi satu per satu. */
let _snap={}, _serverVer={};
function _sig(o){ const c=Object.assign({},o); delete c.updatedAt; delete c.baseUpdatedAt; return JSON.stringify(c); }
function _eachRow(obj,fn){ MKT_COLS.forEach(k=>(obj[k]||[]).forEach(r=>{ if(r&&r.id) fn(k+':'+r.id, r); })); }
function _dirty(key,r){ return _snap[key]!==_sig(r); }   // beda dari versi server terakhir
// Cap updatedAt pada baris yang BERUBAH. baseUpdatedAt SENGAJA tidak disentuh di
// sini — itu metadata kiriman, dibangun di buildPayload() dan tidak pernah masuk
// objek S (kalau bocor ke S, save berikutnya mengirim base basi -> bentrok palsu).
function stampChanges(){
  const now=Date.now();
  _eachRow(S,(key,r)=>{
    if(!_dirty(key,r)) return;
    r.updatedAt = now;
    if(!r.createdAt) r.createdAt = now;
  });
}
// Salinan S untuk dikirim: baris yang berubah diberi baseUpdatedAt = versi yang
// kita pegang dari server. S sendiri tetap bersih dari baseUpdatedAt.
function buildPayload(){
  const p = JSON.parse(JSON.stringify(S));
  _eachRow(p,(key,r)=>{ if(_dirty(key,r)) r.baseUpdatedAt = _serverVer[key] || 0; });
  return p;
}
/* ---------- Selamatkan perubahan yang belum sampai ke server ----------
   Dipanggil saat halaman dibuka DAN penanda "belum naik" masih ada.

   Cara amannya: mulai dari data server sebagai kebenaran, lalu kembalikan
   HANYA baris lokal yang benar-benar lebih baru (atau yang belum ada sama
   sekali di server), lalu kirim. Server sudah punya penjaga per-baris, jadi
   dia yang memutuskan mana yang boleh masuk — bukan kita menebak di sini.

   Baris yang di server ternyata LEBIH BARU tidak ditimpa. Itu berarti orang
   lain sudah menyimpan sesudah kita, dan menimpanya diam-diam justru
   memindahkan kehilangan data ke orang itu. Baris seperti itu dikumpulkan
   dan dilaporkan, supaya kru tahu persis apa yang perlu diulang.

   Catatan sengaja: baris yang DIHAPUS secara lokal tapi masih ada di server
   akan muncul kembali. Itu pilihan sadar — data hidup lagi masih bisa
   dihapus ulang, data hilang tidak bisa dikembalikan. */
async function pulihkanBelumNaik(srv){
  let lok=null;
  try{ lok=JSON.parse(localStorage.getItem(KEY)); }catch(_){ lok=null; }
  if(!lok || typeof lok!=='object'){ tandaiSudahNaik(); return; }
  lok=normalizeState(lok);

  const verSrv={}; _eachRow(srv,(key,r)=>{ verSrv[key]=r.updatedAt||0; });
  const indexSrv={}; MKT_COLS.forEach(k=>{ indexSrv[k]={}; (srv[k]||[]).forEach(r=>{ if(r&&r.id) indexSrv[k][r.id]=r; }); });

  const dipulihkan=[], kalah=[];
  MKT_COLS.forEach(k=>{
    (lok[k]||[]).forEach(r=>{
      if(!r||!r.id) return;
      const key=k+':'+r.id, adaDiSrv=indexSrv[k][r.id];
      const tLok=r.updatedAt||0, tSrv=verSrv[key]||0;
      if(!adaDiSrv){                       // baru dibuat, server belum punya
        S[k].push(r); dipulihkan.push({koleksi:k, nama:r.nama||r.name||r.id});
      }else if(tLok>tSrv){                 // kita lebih baru
        const i=S[k].findIndex(x=>x&&x.id===r.id);
        if(i>=0) S[k][i]=r;
        dipulihkan.push({koleksi:k, nama:r.nama||r.name||r.id});
      }else if(tLok<tSrv && _sig(r)!==_sig(adaDiSrv)){
        kalah.push({koleksi:k, nama:r.nama||r.name||r.id});   // server lebih baru & isinya beda
      }
    });
  });

  if(!dipulihkan.length){
    // Tidak ada yang perlu diselamatkan — penandanya memang sisa yang basi.
    tandaiSudahNaik();
    if(kalah.length) showSaveConflict(kalah);
    return;
  }
  await kirimPemulihan(dipulihkan.length, kalah);
}
/* Kiriman pemulihan sengaja TIDAK lewat save(): save() memakai stampChanges()
   yang akan mencap ulang updatedAt jadi "sekarang", sehingga perubahan lama
   kita tampak lebih baru daripada perubahan orang lain yang sebenarnya
   menyusul belakangan. Cap waktu aslinya harus dipertahankan. */
async function kirimPemulihan(jumlah, kalah){
  try{
    const res=await fetch(API_URL,{method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'saveAll', data:buildPayload()}), redirect:'follow'});
    const j=await res.json();
    if(j && j.ok && j.data){
      tandaiSudahNaik(); API_READY=true; setSyncBadge('ok'); refreshSnapshot();
      const bentrok=(j.data.bentrok||[]).concat(kalah);
      toast('Perubahan tertunda diselamatkan',
            jumlah+' data yang belum sempat naik sudah masuk ke database.','ok');
      if(bentrok.length) showSaveConflict(bentrok);
    }else{
      API_READY=false; setSyncBadge('err'); jadwalkanKirimUlang();
    }
  }catch(e){
    API_READY=false; setSyncBadge('err'); jadwalkanKirimUlang();
  }
}
function refreshSnapshot(){
  const snap={}, ver={};
  _eachRow(S,(key,r)=>{ snap[key]=_sig(r); ver[key]=r.updatedAt||0; });
  _snap=snap; _serverVer=ver;
}

// Ambil data dari server (GET). Fallback ke cache lokal bila gagal.
async function apiLoad(){
  try{
    const res = await fetch(API_URL+'?action=getAll&t='+Date.now(), {method:'GET', redirect:'follow'});
    const json = await res.json();
    if(!json || !json.ok) throw new Error((json&&json.error)||'Respons server tidak valid');
    const srv = normalizeState(json.data);
    /* PENTING. Dulu baris ini langsung `S = srv` lalu menimpa cache — dan
       perubahan lokal yang belum sempat naik ke server lenyap di situ tanpa
       pesan apa pun. Itu sebabnya dua browser bisa menampilkan isi berbeda:
       yang satu masih memegang perubahan lokal, yang satunya tidak pernah
       menerimanya karena memang tidak pernah sampai ke database. */
    S = srv;
    API_READY = true;
    refreshSnapshot();                            // versi server = acuan
    if(adaBelumNaik()) await pulihkanBelumNaik(srv);
    localStorage.setItem(KEY, JSON.stringify(S)); // simpan cache
  }catch(e){
    // Gagal online -> pakai cache lokal, atau state kosong ber-default.
    try{ S = JSON.parse(localStorage.getItem(KEY)); }catch(_){ S=null; }
    S = normalizeState(S);
    API_READY = false;
  }
  refreshSnapshot();   // catat versi awal untuk penjaga bentrok
}
// Simpan seluruh state ke server (POST) + cache lokal. Tidak memblokir UI.
/* Server menulis PER-BARIS: baris yang tidak berubah tidak tersentuh, dan baris
   yang KITA ubah ditolak kalau orang lain sudah menyimpannya duluan (server
   balas daftar `bentrok`). Jadi tidak ada lagi timpa-buta seluruh database. */
let saveInFlight=false, savePending=false;
function save(){
  stampChanges();                                // cap baris yang berubah SEBELUM cache/simpan
  localStorage.setItem(KEY, JSON.stringify(S));  // cache dulu (instan)
  tandaiBelumNaik();                             // dianggap belum sampai sampai server bilang ok
  if(saveInFlight){ savePending=true; return; }  // hindari dua POST balapan dari tab yang sama
  saveInFlight=true;
  const body={action:'saveAll', data:buildPayload()};  // baseUpdatedAt dibangun di sini, bukan di S
  fetch(API_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'}, // simple request, hindari preflight CORS
    body: JSON.stringify(body),
    redirect:'follow'
  })
  .then(r=>r.json())
  .then(j=>{
    if(j && j.ok && j.data){
      const bentrok=(j.data.bentrok||[]);
      if(bentrok.length){
        // Sebagian perubahan ditolak karena orang lain menyimpan duluan.
        API_READY=false; setSyncBadge('conflict');
        showSaveConflict(bentrok);
      }else{
        API_READY=true; setSyncBadge('ok');
        tandaiSudahNaik();      // server sudah menerima — penanda boleh dicabut
        _ulangJeda=0;
        refreshSnapshot();     // versi kita kini = versi server
      }
    }else{
      API_READY=false; setSyncBadge('err');
      console.warn('Simpan ditolak server:', j && j.error);
      jadwalkanKirimUlang();
    }
  })
  .catch(err=>{ API_READY=false; setSyncBadge('err'); console.warn('Gagal sinkron ke server:', err);
                jadwalkanKirimUlang(); })
  .finally(()=>{ saveInFlight=false; if(savePending){ savePending=false; save(); } });
}

/* ---------- Kirim ulang otomatis ----------
   Dulu kiriman yang gagal berhenti di situ: badge merah muncul lalu diam
   selamanya. Kalau kru tidak menyadarinya dan tidak mengedit apa pun lagi,
   perubahan itu tidak pernah naik ke server.

   Jedanya dinaikkan bertahap supaya browser tidak menggedor server yang
   sedang bermasalah, tapi tetap ada batas atas — kalau jedanya terus naik,
   sambungan yang sudah pulih baru ketahuan setengah jam kemudian. */
let _ulangJeda=0, _ulangTimer=null;
const ULANG_TANGGA=[4000,10000,25000,60000];
function jadwalkanKirimUlang(){
  if(_ulangTimer || !adaBelumNaik()) return;
  const jeda=ULANG_TANGGA[Math.min(_ulangJeda,ULANG_TANGGA.length-1)];
  _ulangJeda++;
  _ulangTimer=setTimeout(()=>{ _ulangTimer=null; if(adaBelumNaik()) save(); }, jeda);
}
/* Tiga pemicu langsung, tanpa menunggu jeda: koneksi kembali, tab dibuka
   lagi, atau kru menekan badge merahnya. Menunggu timer saat sambungan
   jelas-jelas sudah pulih itu menunda tanpa alasan. */
function cobaKirimSekarang(){
  if(!adaBelumNaik()) return;
  _ulangJeda=0;
  if(_ulangTimer){ clearTimeout(_ulangTimer); _ulangTimer=null; }
  save();
}
window.addEventListener('online', cobaKirimSekarang);

/* Peringatan sebelum tab ditutup. Satu-satunya pertahanan terakhir kalau
   servernya memang sedang mati: kru tahu pekerjaannya belum aman SEBELUM
   menutup browser, bukan besok pagi saat datanya sudah tidak ada. */
window.addEventListener('beforeunload', function(e){
  if(!adaBelumNaik()) return;
  e.preventDefault(); e.returnValue='';   // teksnya ditentukan browser
  return '';
});
// Sebagian perubahan ditolak karena orang lain menyimpan baris yang sama duluan.
// Jangan timpa diam-diam — tunjukkan apa yang bentrok, lalu sarankan muat ulang.
let _conflictShown=false;
function showSaveConflict(bentrok){
  if(_conflictShown)return; _conflictShown=true;
  const daftar=bentrok.slice(0,8).map(b=>'<li>'+esc(b.nama||b.id)+' <span class="cell-sub">('+esc(b.koleksi)+')</span></li>').join('');
  const lbh=bentrok.length>8?'<li>…dan '+(bentrok.length-8)+' lagi</li>':'';
  modal('<div class="modal-head"><div><h3>Sebagian Perubahan Tidak Tersimpan</h3><p>Orang lain sudah menyimpan data yang sama lebih dulu</p></div></div>'
   +'<div class="modal-body">'
   +'<div class="tbl-note" style="margin-top:0;border-color:var(--danger);color:var(--danger)">'+svg(IC.alert)
     +'<span>Perubahanmu pada data berikut <em>belum tersimpan</em> karena orang lain menyimpannya lebih dulu:</span></div>'
   +'<ul style="margin:12px 0 0 18px;line-height:1.9">'+daftar+lbh+'</ul>'
   +'<p style="color:var(--sand-dim);line-height:1.6;margin-top:14px">Amannya: muat ulang untuk mengambil versi terbaru, lalu ulangi perubahanmu di data itu. Perubahanmu pada data <em>lain</em> sudah tersimpan.</p>'
   +'</div><div class="modal-foot">'
   +'<button class="btn pri" onclick="reloadFromServer()">Muat ulang (disarankan)</button>'
   +'</div>','wide');
}
function reloadFromServer(){ closeModal(); location.reload(); }
// Badge hanya tampil kalau ADA masalah — kalau semua lancar, topbar tetap bersih.
function setSyncBadge(state){
  const el=document.getElementById('sync-badge'); if(!el)return;
  if(state==='ok'){ el.hidden=true; el.className='sync-badge'; return; }
  el.hidden=false;
  el.className='sync-badge '+(state==='conflict'?'conflict':'err');
  el.textContent = state==='conflict' ? 'Belum tersimpan — bentrok' : 'Belum masuk database — mencoba lagi…';
  el.title = state==='conflict'
    ? 'Server sudah lebih baru. Muat ulang lalu ulangi perubahanmu.'
    : 'Perubahan masih di browser ini dan akan dikirim ulang otomatis. Klik untuk mencoba sekarang.';
  // Badge bisa ditekan: menunggu jeda padahal sambungan sudah pulih itu
  // menunda tanpa alasan, dan kru yang melihat badge merah ingin berbuat
  // sesuatu — bukan cuma menonton.
  if(state!=='conflict'){ el.style.cursor='pointer'; el.onclick=cobaKirimSekarang; }
  else { el.style.cursor=''; el.onclick=null; }
}
/* Data hanya dibaca sekali saat boot, jadi tab yang lama dibiarkan terbuka akan
   memegang versi usang lalu menimpa kerja orang lain saat menyimpan. Saat tab
   kembali aktif, cek apakah server sudah lebih baru. */
async function refreshIfStale(){
  if(!S || saveInFlight || _conflictShown) return;
  // Jangan menimpa perubahan yang belum sempat naik ke server (mis. sedang
  // mengetik lalu pindah tab); tampilan baru boleh diganti kalau kita bersih.
  if(savePending) return;
  // Menyegarkan tampilan saat masih ada yang belum naik akan menimpa
  // perubahan itu dengan data server — persis kebocoran yang ditutup di sini.
  if(adaBelumNaik()){ cobaKirimSekarang(); return; }
  try{
    const res=await fetch(API_URL+'?action=getAll&t='+Date.now(),{method:'GET',redirect:'follow'});
    const j=await res.json();
    if(!j||!j.ok||!j.data) return;
    const srv=normalizeState(j.data);
    // Bandingkan hanya data yang berarti (buang metadata versi yang selalu beda).
    if(JSON.stringify(srv)===JSON.stringify(S)) return;   // tidak ada perubahan
    S=srv; localStorage.setItem(KEY,JSON.stringify(S)); refreshSnapshot();
    setSyncBadge('ok'); buildNav(); paintStaffDatalist(); paintMenuDatalist(); refreshView();
    toast('Data disegarkan','Ada perubahan dari kru lain — tampilan diperbarui.','ok');
  }catch(e){ /* offline: biarkan, badge diurus oleh save() */ }
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') refreshIfStale(); });

/* ---------- FORMAT HELPERS ---------- */
/* SATU format uang untuk seluruh modul: "Rp 1.500.000" — angka penuh, dengan
   spasi sesudah "Rp" sesuai penulisan resmi rupiah.

   rpShort DULU meringkas jadi "Rp1,5jt" / "Rp850rb". Itu dibuang: ringkasan
   membulatkan (Rp1.549.000 dan Rp1.451.000 sama-sama tertulis "Rp1,5jt"), dan
   orang jadi harus membuka halaman lain untuk tahu angka sebenarnya. Namanya
   dipertahankan sebagai alias supaya tidak ada satu pun pemanggil yang
   terlewat dan diam-diam kembali memakai format lama. */
const rp = n => 'Rp '+(Number(n)||0).toLocaleString('id-ID');
const rpShort = rp;
// Input uang: tampil dengan titik ribuan + prefix "Rp", tapi disimpan sebagai angka murni.
const rupiahDigits = s => String(s==null?'':s).replace(/\D/g,'');
const rupiahGroup  = d => d.replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const rupiahFmt    = n => { const d=rupiahDigits(n); return d?rupiahGroup(d):''; };
function onRupiahInput(el){ const d=rupiahDigits(el.value); el.value=d?rupiahGroup(d):''; }
function rupiahInputHTML(id,val,dis,extra){ return '<div class="cur-wrap"><span class="cur-pre">Rp</span><input class="inp cur-inp" type="text" inputmode="numeric" id="'+id+'" value="'+rupiahFmt(val)+'" placeholder="0" oninput="onRupiahInput(this)" '+(dis||'')+(extra||'')+'></div>'; }
const MONTHS=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const MONTHS_F=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const DAYS=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
// Nama hari penuh untuk kop dokumen & PDF — di sana ruangnya cukup dan
// bentuk lengkap terbaca lebih resmi daripada singkatan.
const DAYS_F=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
/* Tanggal SELALU menyebut harinya. Acara berbeda perlakuannya antara Sabtu
   dan Selasa, dan menghitung sendiri dari angka tanggal itu sumber salah
   paham yang mahal saat menjadwalkan kru. */
function fmtDate(d){ if(!d)return '—'; const x=new Date(d+'T00:00:00');
  return DAYS[x.getDay()]+', '+x.getDate()+' '+MONTHS[x.getMonth()]+' '+x.getFullYear(); }
function fmtDateLong(d){ if(!d)return '—'; const x=new Date(d+'T00:00:00'); return DAYS_F[x.getDay()]+', '+x.getDate()+' '+MONTHS_F[x.getMonth()]+' '+x.getFullYear(); }
/* Tanggal (YYYY-MM-DD) menurut JAM DINDING SETEMPAT, bukan UTC.
   ------------------------------------------------------------------
   Dulu today() memakai `new Date().toISOString().slice(0,10)`. toISOString
   selalu mengembalikan UTC, dan Indonesia UTC+7 — jadi setiap hari antara
   00:00 dan 07:00 WIB aplikasi mengira hari ini masih KEMARIN.

   Akibatnya nyata dan sudah terjadi: event yang dibuat pagi buta memakai
   tanggal bawaan form (= today() = kemarin), lalu begitu modul dibuka lagi
   selepas pukul 07:00 WIB, today() maju sehari dan autoCloseEvents membaca
   event itu sebagai "tanggalnya sudah lewat" — event yang baru saja
   dikonfirmasi Deal berubah sendiri jadi Event Done, di hari yang sama.

   Selain itu ia menggeser: hitungan H-, "Event Hari Ini" di Dashboard,
   follow up jatuh tempo, dan invoice overdue.

   Dipakai lewat satu tempat ini supaya tidak ada lagi yang menghitung sendiri
   dengan toISOString. */
function tglLokal(d){
  d=d||new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function today(){ return tglLokal(); }
/* Kedua sisi berupa 'YYYY-MM-DD' yang di-parse sebagai tengah malam UTC, jadi
   selisihnya tepat kelipatan hari dan tidak terpengaruh pergeseran musim. */
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
function daysTo(d){ return daysBetween(today(),d); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function ago(dt){ const s=Math.floor((Date.now()-new Date(dt))/1000); if(s<60)return 'baru saja'; if(s<3600)return Math.floor(s/60)+' mnt lalu'; if(s<86400)return Math.floor(s/3600)+' jam lalu'; return Math.floor(s/86400)+' hr lalu'; }

// Office (backend v3) sudah TANPA konsep role: lm_session tak lagi punya field
// `role`, akses murni per-modul (Grants) + admin modul (Admins). Jadi role
// internal Marketing tak bisa lagi diturunkan dari role Office; default yang
// masuk akal untuk siapa pun yang diberi akses modul ini adalah 'marketing'
// (mayoritas anggotanya memang marketing), owner/manager mengoreksi manual di
// Staff bila ada pengecualian (finance, operational, dst).
// Cocokkan identitas Office ke user Marketing (id lalu nama). Bila belum ada,
// sediakan user sementara in-memory dengan role default 'marketing'.
function resolveOfficeUser(s){
  let u = (S.users||[]).find(x=>x.id===s.userId)
       || (S.users||[]).find(x=>String(x.name).toLowerCase()===String(s.name).toLowerCase());
  if(!u){
    u = { id:s.userId, name:s.name, role:'marketing', active:true };
    if(!S.users) S.users=[];
    S.users.push(u);   // in-memory; ikut tersimpan saat ada save() berikutnya
  }
  return u;
}
// Auto-tarik seluruh pegawai dari database user Office tiap kali modul dibuka,
// supaya Data Pegawai & dropdown PIC selalu ikut kenyataan tanpa perlu ada yang
// menekan tombol tarik. Tanpa PIN: kedua endpoint di sisi server sengaja dibuat
// tanpa gerbang kredensial — isinya cuma nama, tim, no HP & status aktif; tidak
// ada PIN atau data modul lain yang terekspos.
// Kegagalan (offline) sengaja tidak menghentikan boot: app tetap jalan dengan
// data yang sudah ada, sync dicoba lagi sesi berikutnya.
/* Dua panggilan, dua peran yang berbeda:
     listDivisiRoster  -> SELURUH pegawai di database user Office (nama, no HP,
                          keterangan/tim, aktif). Inilah sumber Data Pegawai.
     listModuleRoster  -> siapa yang Office beri akses ke modul Marketing, dan
                          siapa admin modulnya. Dipakai hanya untuk role.
   Keduanya tanpa PIN. Dulu hanya listModuleRoster yang dipanggil, jadi kru yang
   belum diberi akses Marketing tidak pernah muncul, dan No. HP tidak pernah
   ikut sama sekali — itu sebab kolom No. HP & Divisi selalu kosong. */
async function ambilOffice(payload){
  /* Batas waktu: panggilan Office pernah terukur 16-23 detik dan tanpa penjaga
     ini bisa menggantung tanpa akhir. Sinkronisasi sudah non-blocking di sini,
     jadi ini murni agar tidak ada permintaan yang menggantung selamanya. */
  const stop=new AbortController();
  const jam=setTimeout(()=>stop.abort(),25000);
  const res=await fetchOffice({method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(payload),signal:stop.signal}).finally(()=>clearTimeout(jam));
  const data=await res.json();
  return (data&&data.ok)?(data.members||[]):null;
}
/* Hasil sinkronisasi terakhir di sesi ini. TIDAK masuk S: ini keadaan sesi,
   bukan data kantor — kalau ikut tersimpan, tiap orang yang membuka modul akan
   menulis ulang baris yang sama ke server tanpa ada yang berubah. */
let rosterSync={ status:'jalan', at:null, baru:0, ubah:0, pesan:'' };
/* Dipanggil sendiri tiap modul dibuka. TIDAK ADA TOMBOL SINKRON — daftar
   pegawai bukan sesuatu yang perlu diminta; ia harus benar begitu halaman
   terbuka. Halaman Pegawai & Akses ikut memicunya lagi kalau sinkronisasi
   terakhir gagal atau sudah basi (lihat renderStaff). */
async function autoSyncOfficeRoster(){
  rosterSync={ status:'jalan', at:null, baru:0, ubah:0, pesan:'' };
  try{
    const semua=await ambilOffice({action:'listDivisiRoster'});
    if(!semua){ rosterSync={ status:'gagal', at:new Date(), baru:0, ubah:0, pesan:'Office menolak permintaan roster.' }; segarkanStaff(); return; }
    // Anggota modul: dipakai untuk role saja, dan boleh gagal sendirian —
    // daftar pegawainya tetap tersinkron walau bagian ini tak terjawab.
    let anggota=null;
    try{ anggota=await ambilOffice({action:'listModuleRoster',module:'marketing'}); }catch(_){}
    const adminModul={}, anggotaModul={};
    (anggota||[]).forEach(m=>{ if(!m||!m.id)return; anggotaModul[m.id]=true; if(m.isModuleAdmin) adminModul[m.id]=true; });

    /* ROLE MENGIKUTI JABATAN DI OFFICE (Kelola User -> kolom keterangan).
       Sebelum ini role hanya ditebak dari keanggotaan modul: siapa pun yang
       diberi akses modul Marketing jadi role Marketing, sisanya Operational.
       Akibatnya orang yang jabatannya Finance atau Manager tetap tercatat
       Marketing hanya karena diberi akses, dan papan Marketing Performance
       menghitung mereka sebagai tim penjualan.

       Sekarang jabatanlah yang menentukan (lihat roleDariJabatan). Keanggotaan
       modul tinggal jadi cadangan untuk jabatan yang tidak terbaca:
         admin modul Office        -> Super Admin (itu memang setelan akses)
         jabatan terbaca           -> role sesuai jabatan
         jabatan tak terbaca       -> anggota modul: Marketing, selainnya Operational */
    const roleSeharusnya=m=>{
      /* Admin modul di Office tetap didahulukan: itu pemberian akses yang
         disengaja, dan kalau ikut dikosongkan gara-gara kolom Tim belum diisi,
         orang yang berwenang mengisi Tim justru terkunci di luar. */
      if(adminModul[m.id]) return 'super_admin';
      /* TIM KOSONG -> JANGAN SENTUH role yang sudah ada (null = biarkan).
         Role menyesuaikan Tim hanya kalau Tim-nya memang terisi; kolom yang
         belum diisi di Office bukan alasan mencabut akses orang yang selama ini
         bekerja normal. Tanpa null di sini, satu kolom kosong di sistem lain
         bisa mengunci seisi tim tanpa ada yang tahu sebabnya. */
      if(!String(m.keterangan||'').trim()) return null;
      return roleDariJabatan(m.keterangan) || (anggotaModul[m.id] ? 'marketing' : 'operational');
    };

    let baru=0, ubah=0, tanpaDiv=0, roleBerubah=[];
    semua.forEach(m=>{
      if(!m||!m.id&&!m.name)return;
      const hp=hpDariOffice(m), div=divisiDariKeterangan(m.keterangan);
      if(!div) tanpaDiv++;
      let u=(m.id&&S.users.find(x=>x.id===m.id))
          || S.users.find(x=>String(x.name||'').toLowerCase()===String(m.name||'').toLowerCase());
      if(!u){
        S.users.push({id:m.id||uid('u'),name:m.name||'(tanpa nama)',div,jabatan:m.keterangan||'',hp,
          role:roleSeharusnya(m),active:m.active!==false});
        baru++;
        return;
      }
      let ch=false;
      /* ROLE IKUT JABATAN, termasuk untuk orang yang SUDAH ada. Dulu role lama
         tidak pernah disentuh, jadi mengganti jabatan seseorang di Office tidak
         berpengaruh apa pun di sini dan keduanya diam-diam berselisih.

         Konsekuensinya harus disadari: role yang diubah manual lewat matriks
         Hak Akses akan dikembalikan mengikuti jabatan saat modul dibuka lagi.
         Jabatan di Office adalah sumbernya — kalau seseorang perlu role lain,
         ubah jabatannya di Office, bukan di sini. Tiap perubahan dicatat di
         Timeline & Audit Log supaya tidak terjadi diam-diam. */
      // null = Tim kosong, role dibiarkan apa adanya (lihat roleSeharusnya).
      const roleBaru=roleSeharusnya(m);
      if(roleBaru!==null && u.role!==roleBaru){
        roleBerubah.push(u.name+': '+namaRole(u.role)+' → '+namaRole(roleBaru));
        u.role=roleBaru; ch=true;
      }
      // Satukan ke id Office (dulu hanya mengisi id kosong, lihat konten/akademi).
      if(m.id&&u.id!==m.id){ u.id=m.id; ch=true; }
      if(m.name&&u.name!==m.name){ u.name=m.name; ch=true; }
      /* No. HP: Office yang jadi acuan, jadi nomor yang berubah di Office IKUT
         berubah di sini. Ini yang dulu tidak pernah terjadi. */
      if(hp&&u.hp!==hp){ u.hp=hp; ch=true; }
      /* Jabatan: Office yang jadi acuan, SELALU. Dulu hanya diisi bila masih
         kosong — sekarang role diturunkan darinya, jadi jabatan basi berarti
         role basi juga. */
      if(m.keterangan&&u.jabatan!==m.keterangan){ u.jabatan=m.keterangan; ch=true; }
      /* Divisi: hanya diisi kalau masih kosong. Office tidak punya kolom divisi
         sendiri — nilainya TEBAKAN dari teks bebas `keterangan`, dan tebakan
         tidak boleh menimpa divisi yang sudah dipilih orang secara sadar. */
      if(div&&!u.div){ u.div=div; ch=true; }
      if(u.active!==(m.active!==false)){ u.active=(m.active!==false); ch=true; }
      if(ch) ubah++;
    });
    if(baru||ubah){
      logAct('user','-','Data pegawai disinkronkan dari Office',baru+' baru · '+ubah+' diperbarui');
      // Perubahan role dicatat terpisah & terperinci: ini menyangkut siapa boleh
      // membuka apa, jadi harus bisa ditelusuri satu per satu di Audit Log.
      if(roleBerubah.length) logAct('user','-','Role menyesuaikan Tim di Office',roleBerubah.join(' · '));
      save(); buildNav(); paintStaffDatalist();
    }
    const pesan=[];
    if(roleBerubah.length) pesan.push(roleBerubah.length+' role disesuaikan dengan Tim di Office.');
    /* Dulu berbunyi "isi manual lewat tombol edit". Kolom itu sudah tidak bisa
       disunting dari sini — satu-satunya perbaikan yang benar ada di Office. */
    if(tanpaDiv) pesan.push(tanpaDiv+' orang belum punya Tim di Office — role mereka jatuh ke bawaan sampai kolom Tim-nya diisi di sana.');
    rosterSync={ status:'ok', at:new Date(), baru, ubah, pesan: pesan.join(' ') };
    segarkanStaff();
  }catch(e){
    /* Offline / Office tak terjangkau: TIDAK menghentikan apa pun. App tetap
       jalan dengan data yang sudah ada; kegagalannya dilaporkan di halaman
       Pegawai & Akses, bukan lewat toast yang mengganggu tiap kali buka modul
       dari jaringan yang buruk. */
    rosterSync={ status:'gagal', at:new Date(), baru:0, ubah:0, pesan:e.message };
    segarkanStaff();
  }
}

/* ---------- HAK AKSES ----------
   Satu matriks per (nav view, role): None(0) / Lihat(1) / Ubah(2). Menyatukan
   dua sistem lama yang terpisah (nav[] = menu apa yang tampil, PERM_DEF[] =
   aksi apa yang boleh diubah) — dulu bisa ada role dengan izin ubah tapi menu-
   nya sendiri tak kelihatan (nyaris tak berguna). Sekarang satu angka per view.

   Beberapa aksi lama (PERM_DEF) dipakai di LEBIH dari satu view (mis. edit_event
   dicek di renderEvents, renderEventForm, DAN renderField — semua tiga tampilan
   dari "membuka/mengurus event"). Diikat ke SATU view utama (lihat ACTION_VIEW)
   — dulu memang satu flag untuk semuanya, jadi ini bukan perilaku baru, cuma
   pengelompokan ulang cek yang sama ke satu baris matriks.

   del_client DIPULIHKAN: dulu ia dibuang justru karena tak pernah dicek di mana
   pun — Database Client memang belum punya tombol hapus. Sekarang punya, jadi
   aksinya kembali. Urutannya di ACTION_VIEW penting: ia harus SESUDAH
   edit_client, lihat catatan di roleDefaultPerm().

   Bisa di-override per user lewat User Management (u.nav lama diganti u.acc =
   {view:0|1|2}, lihat migrasi di bootApp). Super Admin sengaja tidak bisa
   dibatasi supaya tak ada yang terkunci dari sistem. */
const PERM_NONE=0, PERM_VIEW=1, PERM_EDIT=2;
const PERM_OPT=[['0','Tak Terlihat'],['1','Lihat'],['2','Boleh Ubah']];
// Aksi (nama lama, dipakai di seluruh kode via can('...')) -> view pemiliknya.
const ACTION_VIEW={
  edit_client:'crm', del_client:'crm', del_event:'events', edit_event:'events',
  verify_payment:'invoices', approve:'approvals', manage_users:'users',
  edit_task:'tasks', edit_template:'templates', edit_staff:'staff',
  edit_vip:'vip',
  edit_katalog:'katalog'
};
function permViewKeys(){ return NAV_DEF.filter(x=>x.k).map(x=>x.k); }
// default bawaan per role (dipakai bila matriks belum pernah diubah). Cakupan
// role SAMA seperti rules PERM_DEF lama, dipetakan ke view lewat ACTION_VIEW —
// dan beberapa view lama (crm, events, dst) juga otomatis Lihat bagi siapa pun
// yang tadinya ada di ROLES[role].nav bawaan, supaya "role X bisa buka Y" tetap
// sama seperti sebelum matriks ini ada.
function roleDefaultPerm(role, view){
  if(role==='super_admin') return PERM_EDIT;
  const legacyEditRules={
    edit_client:['marketing'].includes(role),
    del_client:false,
    del_event:false,
    edit_event:['marketing','manager'].includes(role),
    verify_payment:['finance'].includes(role),
    approve:['manager'].includes(role),
    manage_users:false,
    edit_task:['operational','marketing','finance','manager'].includes(role),
    edit_template:['operational','marketing','finance','manager'].includes(role),
    edit_staff:['marketing','manager'].includes(role),
    // Reservasi VIP dikerjakan tim marketing; manager ikut supaya bisa mengoreksi.
    edit_vip:['marketing','manager'].includes(role),
    // Katalog = materi jualan; yang menyusunnya marketing, manager mengoreksi.
    edit_katalog:['marketing','manager'].includes(role)
  };
  /* HANYA aksi PERTAMA yang memetakan ke view ini yang dilihat. Jadi urutan
     ACTION_VIEW menentukan default: aksi yang legacy-nya `false` dan berdiri
     paling depan akan menutup aksi di belakangnya. Karena itu del_client
     ditaruh SESUDAH edit_client — kalau dibalik, default 'crm' untuk marketing
     turun dari Boleh Ubah jadi Lihat saja tanpa ada yang mengubah matriksnya. */
  const action=Object.keys(ACTION_VIEW).find(a=>ACTION_VIEW[a]===view);
  const canSeeByDefault=(ROLES[role]&&Array.isArray(ROLES[role].nav)&&ROLES[role].nav.includes(view));
  if(action && legacyEditRules[action]) return PERM_EDIT;
  return canSeeByDefault ? PERM_VIEW : PERM_NONE;
}
function roleDefaultPerms(role){ const p={}; permViewKeys().forEach(v=>{ p[v]=roleDefaultPerm(role,v); }); return p; }
// hasil matriks (S.roleAcc) menimpa default; Super Admin selalu penuh
function roleAcc(role){
  if(role==='super_admin'){ const p={}; permViewKeys().forEach(v=>p[v]=PERM_EDIT); return p; }
  return (S.roleAcc && S.roleAcc[role] && typeof S.roleAcc[role]==='object') ? S.roleAcc[role] : roleDefaultPerms(role);
}
/* TIM KOSONG TIDAK MENAHAN AKSES. Role menyesuaikan Tim kalau Tim-nya ada;
   kalau kosong, role tersimpan dipakai apa adanya. Versi sebelumnya menahan
   akses siapa pun yang Tim-nya belum diisi, dan itu terlalu keras untuk data
   yang memang belum rapi — orang jadi tak bisa bekerja gara-gara satu kolom
   di sistem lain. */
// hak akses per user: override user (bila ada) > matriks role
function userAcc(u){
  if(!u) return {};
  if(u.role==='super_admin') return roleAcc('super_admin');
  return (u.acc && typeof u.acc==='object') ? u.acc : roleAcc(u.role);
}
function viewPerm(view, u){ const acc=userAcc(u); const v=acc[view]; return typeof v==='number' ? v : PERM_NONE; }
// nav/perms lama (array-based) DIBUANG — dipertahankan hanya sebagai NAMA fungsi
// supaya seluruh kode lama yang memanggilnya (buildNav, can()) tak perlu diubah
// satu-satu, cuma isinya yang sekarang baca dari acc.
function userNav(u){ if(!u)return []; return permViewKeys().filter(v=>viewPerm(v,u)>=PERM_VIEW); }
function userPerms(u){
  if(!u)return [];
  return Object.keys(ACTION_VIEW).filter(a=>viewPerm(ACTION_VIEW[a],u)>=PERM_EDIT);
}
function hasCustomAccess(u){ return (u.acc&&typeof u.acc==='object')||Array.isArray(u.nav)||Array.isArray(u.perms); }
function can(action){ if(!ME)return false; if(ME.role==='super_admin')return true; return userPerms(ME).includes(action); }

const SEC_BY_ID = Object.fromEntries(EVENT_SCHEMA.map(s=>[s.id,s]));

/* ============================================================
   TAB = pengelompokan section (11 section D.1-D.11 -> 3 tab)
   ------------------------------------------------------------
   Dulu 1 section = 1 tab, jadi ada 12 tab. Sekarang dikelompokkan jadi 3:
   Informasi Dasar / Finance / Operasional.

   EVENT_SCHEMA sengaja TIDAK diubah. Alasannya penting: hak akses melekat di
   section (`div` = divisi yang boleh lihat, `fin` = sembunyikan dari kru
   operasional). Kalau section dilebur jadi satu daftar field, aturan itu ikut
   hilang — kru Kitchen jadi melihat field Bar/Security, dan ketentuan
   pembayaran klien bocor ke kru Floor. Dengan tab sebagai lapisan di ATAS
   section, tampilannya bergabung tapi penyaringnya tetap utuh:
   satu tab bisa berisi beberapa section, dan section yang tidak boleh dilihat
   user ini tetap tidak dirender.

   Tab yang seluruh section-nya tidak terlihat -> tabnya ikut disembunyikan. */
/* Urutan sengaja: Informasi Dasar -> Operasional -> Finance -> Overview.
   Mengikuti alur kerja nyata (isi dasar, siapkan operasional, baru uang),
   dan Finance tetap di belakang karena section-nya `fin:1` — tersembunyi
   dari kru operasional, jadi bagi mereka tab terakhir yang terlihat adalah
   Operasional lalu langsung Overview.

   Overview TIDAK punya section: dia rangkuman dari isian tab-tab sebelumnya
   (lihat renderOverview). Karena `secs` kosong, visibleTabs() akan
   menyembunyikannya kalau tidak diberi penanda `always`. */
const TAB_DEF = [
  { id:'basic',       n:'1', title:'Informasi Dasar', secs:['basic'] },
  { id:'operasional', n:'2', title:'Operasional',
    secs:['kitchen','bar','floor','security','brief','design','attach','pic'] },
  { id:'finance',     n:'3', title:'Finance',         secs:['cashier','finance'] },
  { id:'overview',    n:'4', title:'Overview',        secs:[], always:1 }
];
const TAB_BY_ID = Object.fromEntries(TAB_DEF.map(t=>[t.id,t]));
// Section milik satu tab yang boleh dilihat user ini (urut sesuai TAB_DEF.secs).
function visibleSecsOfTab(tabId){
  const tab=TAB_BY_ID[tabId]; if(!tab)return [];
  const vis=visibleSections();
  return tab.secs.map(id=>vis.find(s=>s.id===id)).filter(Boolean);
}
// `always` untuk tab tanpa section (Overview) — dia merangkum isian tab lain,
// jadi tidak boleh ikut tersembunyi hanya karena secs-nya kosong.
function visibleTabs(){ return TAB_DEF.filter(t=>t.always || visibleSecsOfTab(t.id).length>0); }
function nextTabId(cur){
  const l=visibleTabs(), i=l.findIndex(t=>t.id===cur);
  return (i>=0 && i<l.length-1) ? l[i+1].id : null;
}
// Section berbasis field biasa (finance punya renderer & alur simpan sendiri).
function genericSecsOfTab(tabId){ return visibleSecsOfTab(tabId).filter(s=>s.id!=='finance'); }
/* ============================================================
   FINANCE LOGIC (Bagian 9 & D.10)
   ============================================================ */
// Nilai Ya/Tidak (yn) -> boolean, dengan default bila belum diisi.
function ynBool(val,def){ if(val&&typeof val==='object'&&'v'in val)return val.v===true; if(typeof val==='boolean')return val; return def===true; }
// Biaya F&B otomatis = Pax × Budget per Pax. Bila budget/pax kosong, pakai nilai
// lama biayaFB (agar data event lama tidak hilang).
/* Pax dibaca dari ev.detail.pax DAN ev.pax. Keduanya memang ada: form menulis
   ke detail.pax, lalu saveEventTab() menyalinnya ke ev.pax untuk daftar & tabel.
   Salinan itu hanya terjadi saat tab Informasi Dasar disimpan — jadi event yang
   pax-nya masuk lewat jalan lain (modal "Event Baru" versi lama, peluang yang
   lahir dari Follow Up, data pindahan) punya ev.pax terisi sementara detail.pax
   kosong. Dulu rumus ini hanya melihat detail.pax, sehingga F&B diam-diam jadi
   NOL dan seluruh biaya makanan hilang dari Grand Total — padahal label di tab
   Finance tetap memajang "100 pax × Budget/Pax" karena label membaca ev.pax.
   Angka yang hilang persis sebesar bagian terbesar tagihan. */
/* Angka yang dipakai Kasir (D.8) adalah yang paling dekat dengan kenyataan
   hari-H: "Estimasi Tamu + Penambahan OTS" sudah termasuk tamu yang datang
   mendadak, dan "Deal per Pax" adalah harga yang benar-benar disepakati —
   bukan budget awal di Informasi Dasar. Karena itu keduanya dipakai lebih dulu;
   Pax & Budget/Pax (D.1) tinggal jadi cadangan untuk event yang tab Kasirnya
   belum diisi.

   estimasiOTS bertipe teks bebas, jadi ditulis orang bermacam-macam: "152",
   "150 + 2 OTS", "±150". Semua angka di dalamnya dijumlahkan — itu tepat untuk
   bentuk "150 + 2" dan tetap benar untuk "152" yang berdiri sendiri. */
function paxDariTeks(v){
  const angka=String(v==null?'':v).match(/\d+/g);
  return angka?angka.reduce((a,n)=>a+(+n||0),0):0;
}
function fbPax(ev){ const d=ev.detail||{}; return paxDariTeks(d.estimasiOTS)||+d.pax||+ev.pax||0; }
function fbHargaPax(ev){ const d=ev.detail||{}; return +d.dealPax||+d.budgetPax||0; }
function fbOtomatis(ev){ return Math.round(fbPax(ev)*fbHargaPax(ev)); }
/* Membaca kotak F&B di tab Finance. Kotak itu SELALU memajang angka (lihat
   financeTab), jadi "kosong" bukan lagi satu-satunya tanda "ikut otomatis":
   angka yang PERSIS SAMA dengan hitungan otomatis juga berarti tidak ditimpa.
   Tanpa aturan ini, sekadar membuka tab Finance lalu menekan Simpan akan
   membekukan F&B pada angka saat itu — koreksi pax atau harga per pax di tab
   Kasir sesudahnya tidak akan berpengaruh apa pun, diam-diam. */
function fbDariKotak(ev,teks){
  const d=rupiahDigits(teks);
  if(d==='') return '';
  return (+d===fbOtomatis(ev)) ? '' : (+d);
}
/* fbManual = timpaan manual dari tab Finance. Kosong (''/null/undefined) berarti
   "ikut hitungan otomatis"; angka 0 yang sengaja diketik tetap dihormati. */
function fbDitimpa(ev){ const v=(ev.detail||{}).fbManual; return v!==''&&v!=null&&!isNaN(+v); }
/* Jumlah seluruh baris tabel Harga Deal (Jumlah x Harga Deal). */
function fbDealTotal(ev){
  const rows=(ev&&ev.detail&&ev.detail.fbDeal)||[];
  if(!Array.isArray(rows)) return 0;
  return rows.reduce(function(a,r){ return a+((+r.jumlah||0)*(+r.harga||0)); },0);
}
function fbDealAktif(ev){
  const d=(ev&&ev.detail)||{};
  return ynBool(d.fbDealOn,false) && fbDealTotal(ev)>0;
}
function eventFbCost(ev){
  const d=ev.detail||{};
  /* Urutan kewenangan, dari yang paling disengaja ke yang paling otomatis:
       1. fbManual  — angka yang diketik langsung di kotak F&B tab Finance
       2. fbDeal    — tabel harga deal per jenis makanan (kalau dinyalakan)
       3. pax x harga per pax
       4. biayaFB lama (data event sebelum kedua cara di atas ada)
     Yang lebih disengaja selalu menang; kalau tidak, angka yang diketik tangan
     bisa ditimpa diam-diam oleh hitungan otomatis. */
  if(fbDitimpa(ev)) return +d.fbManual||0;
  if(fbDealAktif(ev)) return fbDealTotal(ev);
  const pax=fbPax(ev), bp=fbHargaPax(ev);
  return bp>0 ? Math.round(pax*bp) : (+d.biayaFB||0);
}
function eventSubtotal(ev){ const d=ev.detail||{}; return eventFbCost(ev)+(+d.sewaVenue||0)+(+d.biayaTeknis||0)+(+d.biayaLain||0); }
function eventFinance(ev){
  const st=S.settings, d=ev.detail||{};
  const fb=eventFbCost(ev);
  const sub=eventSubtotal(ev);
  const disc=+d.diskon||0;
  const afterDisc=Math.max(0,sub-disc);
  const svcOn=ynBool(d.svcApply,true);                 // biaya service opsional
  const service=svcOn?Math.round(afterDisc*st.serviceCharge/100):0;
  const taxPct=+st.pb1||0;
  const taxInc=ynBool(d.taxInclude,false);             // harga sudah termasuk pajak?
  let tax,grand;
  if(taxInc){ grand=afterDisc+service; tax=Math.round(grand*taxPct/(100+taxPct)); } // pajak sudah di dalam harga
  else { tax=Math.round((afterDisc+service)*taxPct/100); grand=afterDisc+service+tax; }
  /* DP MEMAKAI NOMINAL, bukan persentase. Di lapangan yang disepakati dengan
     client selalu berupa angka rupiah ("DP 5 juta"), bukan persen; persentase
     memaksa marketing menghitung mundur, dan angka hasil pembulatannya tidak
     pernah sama dengan yang benar-benar ditransfer.

     Sumbernya Deposit — Nominal di tab Kasir (dipakai kalau sistem bayarnya DP).
     Kalau belum diisi, DP jatuh ke persentase bawaan seperti dulu supaya event
     lama tidak kehilangan angkanya begitu saja. */
  const dpNom=+d.depositNominal||0;
  const dpPct=ev.dpPercent||st.dpPercent;
  const dp=dpNom>0?dpNom:Math.round(grand*dpPct/100);
  const dpDariNominal=dpNom>0;
  const paid=(ev.payments||[]).reduce((a,p)=>a+(+p.amount||0),0);
  const remaining=Math.max(0,grand-paid);
  return {sub,fb,disc,afterDisc,svcOn,service,taxPct,taxInc,tax,grand,dpPct,dp,dpDariNominal,paid,remaining};
}
/* ---------- NOMOR INVOICE & KWITANSI ----------
   Dulu nomor invoice dihitung dari posisi baris (String(1000+i)) sehingga bergeser
   tiap ada event baru — nomor yang sudah dikirim ke klien jadi tidak cocok.
   Sekarang nomor diberikan sekali lalu disimpan di event (ev.invNo) / pembayaran (p.no). */
function nextSeq(key){ const n=Math.max(1,+S.settings[key]||1); S.settings[key]=n+1; return n; }
function ensureInvNos(evs){
  let changed=false;
  evs.forEach(e=>{ if(!e.invNo){ e.invNo=S.settings.invPrefix+String(nextSeq('invSeq')).padStart(4,'0'); changed=true; } });
  if(changed) save();
}
function invoiceNo(ev){ return (ev&&ev.invNo)||'—'; }
function kwitansiNo(){ return (S.settings.kwPrefix||'KW/')+String(nextSeq('kwSeq')).padStart(4,'0'); }
function invStatus(ev){
  const f=eventFinance(ev);
  if(f.grand===0)return 'Draft';
  if(f.remaining<=0)return 'Paid';
  if(f.paid>0)return 'Pending';
  // no payment: check overdue (H-7)
  if(ev.tanggal && daysTo(ev.tanggal)<7 && ['Confirmed','Deal'].includes(ev.status))return 'Overdue';
  return ev.invoiceSent?'Sent':'Draft';
}

/* ---------- ACTIVITY & NOTIF ---------- */
function logAct(refType,refId,action,detail){
  S.activities.unshift({id:uid('act'),refType,refId,action,detail:detail||'',by:ME?ME.name:'Sistem',at:new Date().toISOString()});
  if(S.activities.length>400)S.activities.length=400;
}
function pushNotif(type,title,body,link){
  S.notifs.unshift({id:uid('nt'),type,title,body,link:link||'',read:false,at:new Date().toISOString()});
}
function unreadNotif(){ return S.notifs.filter(n=>!n.read).length; }

/* ---------- POPUP NOTIFIKASI (dropdown lonceng) ---------- */
const NOTIF_IC={dp:'money',event:'cal',fu:'pipe',inv:'invoice',invoice:'invoice',approval:'approve',payment:'money',birthday:'star',repeat:'star',template:'task'};
const NOTIF_COL={dp:'--warn',event:'--info',fu:'--gold',inv:'--danger',invoice:'--info',approval:'--violet',payment:'--ok',birthday:'--gold',repeat:'--teal'};
function toggleNotifPop(e){
  if(e)e.stopPropagation();
  const p=$('notif-pop'); if(!p)return;
  if(p.classList.contains('on')){ p.classList.remove('on'); return; }
  paintNotifPop(); p.classList.add('on');
}
function closeNotifPop(){ const p=$('notif-pop'); if(p)p.classList.remove('on'); }
function paintNotifPop(){
  const p=$('notif-pop'); if(!p)return;
  const items=S.notifs.slice(0,8);
  const unread=unreadNotif();
  let h='<div class="np-head"><b>Notifikasi'+(unread?' <span class="tag" style="background:var(--gold);color:#fff">'+unread+'</span>':'')+'</b>'
    +(unread?'<button class="btn sm" onclick="markAllRead()">Tandai dibaca</button>':'')+'</div>';
  if(!items.length) h+='<div class="np-empty">Belum ada notifikasi. Semua terkendali. ⚓</div>';
  else{
    h+='<div class="np-list">';
    items.forEach(n=>{
      const col=NOTIF_COL[n.type]||'--muted';
      h+='<div class="np-item'+(n.read?'':' unread')+'" onclick="openNotif(\''+n.id+'\')">'
        +'<div class="np-ic" style="background:color-mix(in srgb,var('+col+') 15%,transparent);color:var('+col+')">'+svg(IC[NOTIF_IC[n.type]||'notif'])+'</div>'
        +'<div class="np-tx"><b>'+esc(n.title)+'</b><span>'+esc(n.body)+'</span><div class="np-when">'+ago(n.at)+'</div></div>'
        +(n.read?'':'<span class="np-unread"></span>')+'</div>';
    });
    h+='</div>';

   ============================================================ */
/* Event yang sudah Deal & tanggalnya benar-benar lewat -> Event Done.
   Dijalankan sekali saat boot.

   TENGGANG SATU HARI (bukan langsung H+1). Dulu syaratnya `daysTo < 0`, jadi
   sebuah event ditutup tepat lewat tengah malam — padahal di venue ini acara
   rutin baru bubar setelah tengah malam, dan tim masih menuntaskan checklist
   keesokan harinya. Menutupnya saat itu berarti mengunci event yang secara
   nyata masih berjalan.

   Angkanya diselaraskan dengan handoverEvents(), yang memang masih menampilkan
   event sampai H+2 di papan Task Divisi. Sebelum ini keduanya berselisih:
   papan masih menganggapnya aktif sementara statusnya sudah Event Done. */
const TENGGANG_TUTUP_HARI = 2;   // ditutup mulai H+2
function autoCloseEvents(){
  let n=0;
  S.events.forEach(e=>{
    if(['Deal','Confirmed'].includes(e.status) && e.tanggal && daysTo(e.tanggal) <= -TENGGANG_TUTUP_HARI){
      e.status='Event Done'; e.pipeCol='Event Done';
      logAct('event',e.id,'Status → Event Done','otomatis: tanggal event sudah lewat lebih dari sehari');
      n++;
    }
  });
  return n;
}
// Bentrok jadwal: event lain yang sudah pasti, tanggal sama, area beririsan
function bookingConflicts(ev){
  if(!ev||!ev.tanggal) return [];
  const areaOf=x=>(x.detail&&x.detail.area)||'';
  const a=areaOf(ev);
  return S.events.filter(x=>{
    if(x.id===ev.id || x.tanggal!==ev.tanggal) return false;
    if(!['Deal','Confirmed','Event Done'].includes(x.status)) return false;
    const b=areaOf(x);
    if(!a || !b) return true;                              // area belum diisi -> tetap diperingatkan
    if(a==='Seluruh Area' || b==='Seluruh Area') return true;
    return a===b;
  });
}
// Peluang yang sudah lama tidak di-follow up (perlu ditindaklanjuti)
function lastFUDate(ev){
  const fs=S.followups.filter(f=>f.eventId===ev.id);
  if(!fs.length) return ev.createdAt||'';
  return fs.map(f=>String(f.at).slice(0,10)).sort().pop();
}
function daysSinceFU(ev){ const d=lastFUDate(ev); return d?Math.max(0,daysBetween(d,today())):0; }
function isStale(ev){ return isOpenEvent(ev) && daysSinceFU(ev) >= (+S.settings.staleDays||7); }
// Tanggal default untuk follow up berikutnya

   toast — dipakai untuk "Urungkan". Panggilan lama yang cuma mengirim tiga
   argumen tidak berubah perilakunya sama sekali.
   Toast beraksi bertahan lebih lama (7 detik): 2,8 detik cukup untuk MEMBACA
   pemberitahuan, tapi tidak cukup untuk sadar salah hapus lalu memutuskan

function toast(title,sub,kind,aksi){
  const w=$('toasts'); const el=document.createElement('div');
  el.className='toast '+(kind||'');
  const ic = kind==='err'?IC.alert:kind==='ok'?IC.check:IC.ship;
  el.innerHTML=svg(ic,'')+'<div><div class="tt">'+esc(title)+'</div>'+(sub?'<div class="ts">'+esc(sub)+'</div>':'')+'</div>';
  el.querySelector('svg').style.color = kind==='err'?'var(--danger)':kind==='ok'?'var(--ok)':'var(--gold)';
  let umur=2800;
  if(aksi && aksi.label && typeof aksi.fn==='function'){
    umur=7000;
    const b=document.createElement('button');
    b.type='button'; b.className='toast-aksi'; b.textContent=aksi.label;
    b.onclick=function(){ el.remove(); aksi.fn(); };
    el.appendChild(b);
  }
  w.appendChild(el); setTimeout(()=>{el.style.opacity='0';el.style.transform='translateX(30px)';setTimeout(()=>el.remove(),250);},umur);
}

function go(view,param){

  // Isi yang boleh disentuh tetap dipilah di dalam halamannya.
  if(view==='staff' && !allowed.includes('staff') && allowed.includes('users')) allowed=allowed.concat('staff');
  /* TIDAK PUNYA SATU HALAMAN PUN. Dulu jalur ini jatuh ke 'dashboard' dan
     dashboard-nya tetap digambar, jadi orang yang seharusnya belum boleh masuk
     tetap melihat isi modul. Sekarang dihentikan di sini dengan keterangan apa

  if(!allowed.length){

    return;

/* ============================================================
   DAFTAR TUGAS PER EVENT — dropdown di baris Upcoming Event
   ------------------------------------------------------------
   Menggantikan "Papan To-Do Task" yang dulu berdiri sendiri di bawah
   Dashboard. Papan itu mengumpulkan tugas dari SEMUA event jadi satu daftar
   panjang, lalu tiap baris harus menyebut nama eventnya sendiri supaya jelas
   milik siapa — padahal daftar Upcoming Event tepat di atasnya sudah
   menyebutkan event yang sama. Dua tempat, satu isi.

   Sekarang tugas menempel pada eventnya: klik panah di baris event, daftar
   tugasnya terbuka di situ juga. Tidak ada lagi kolom "Event" yang mengulang,
   dan pertanyaan "event ini sudah siap belum" dijawab di tempat pertanyaannya
   muncul.

   Yang ditampilkan per tugas: status selesai (bisa dicentang), nama, kelompok
   (sub kategori), PIC, dan tenggatnya. */
let dashTaskBuka={};
function toggleDashTask(id){
  if(dashTaskBuka[id]) delete dashTaskBuka[id]; else dashTaskBuka[id]=1;
  refreshView();     // posisi gulir dipertahankan, lihat _gulirUlang
}
// Tanggal jatuh tempo efektif: deadline yang diisi, kalau kosong dihitung dari
// H-<n> terhadap tanggal event, kalau itu pun kosong ya tanggal eventnya.
function tugasJatuhTempo(e,div,tpl){
  const dl=jobField(e,div,tpl,'deadline');
  if(dl) return dl;
  if(tpl.hminus!=null && e.tanggal){
    const d=new Date(e.tanggal+'T00:00:00');
    /* tglLokal, BUKAN toISOString: `new Date('2026-08-05T00:00:00')` itu tengah
       malam SETEMPAT, dan di UTC+7 toISOString-nya mundur ke tanggal
       sebelumnya — H-3 akan tercetak sehari lebih awal dari seharusnya. */
    if(!isNaN(d.getTime())){ d.setDate(d.getDate()-Math.max(0,+tpl.hminus||0)); return tglLokal(d); }
  }
  return e.tanggal||'';
}
/* Seluruh tugas satu event, urut: yang BELUM selesai lebih dulu (itu yang
   perlu ditindak), lalu menurut tenggat. Kru operasional hanya melihat sub
   kategori divisinya, sama seperti di papan Task Divisi — bukan aturan baru,
   cuma dibawa ikut ke sini. */
function eventTaskItems(e){
  const opDiv=ME.role==='operational'?ME.div:null;
  const out=[];
  genTasks(e);
  eventCats(e).concat([FREE_DIV]).forEach(div=>{
    eventDivTemplates(e,div).forEach(tpl=>{
      if(opDiv && !tpl.extra && (tpl.sub||'')!==opDiv) return;
      out.push({div,tpl,
        pic:jobField(e,div,tpl,'pic'),
        selesai:jobSelesai(e,div,tpl.id),
        jatuh:tugasJatuhTempo(e,div,tpl)});
    });
  });
  out.sort((a,b)=>(a.selesai?1:0)-(b.selesai?1:0) || String(a.jatuh).localeCompare(String(b.jatuh)));
  return out;
}
function eventTaskListHTML(e){
  const items=eventTaskItems(e);
  const bisaUbah=can('edit_task');
  if(!items.length){
    return '<div class="tugas-panel"><div class="cell-sub" style="margin:0">'
      +(eventCats(e).length
        ? 'Belum ada tugas untuk event ini. Susun standarnya di Template Task, atau tambahkan langsung di Task Divisi.'
        : 'Event ini belum memilih <b>Format F&amp;B</b>, jadi belum punya daftar tugas standar. Isi dulu di tab Kitchen, atau susun tugas bebas di Task Divisi.')
      +'</div></div>';
  }
  const belum=items.filter(x=>!x.selesai).length;
  let h='<div class="tugas-panel"><div class="tugas-kepala">'
    +'<span>'+(items.length-belum)+' dari '+items.length+' tugas selesai'+(belum?' · <b>'+belum+' belum</b>':' ⚓')+'</span>'
    +'<button class="btn sm" onclick="event.stopPropagation();openTaskEvent(\''+e.id+'\')">Buka papan to-do</button></div>';
  items.forEach(x=>{
    const a="'"+e.id+"','"+escJs(x.div)+"','"+x.tpl.id+"'";
    const telat=!x.selesai && x.jatuh && daysTo(x.jatuh)<0;
    const grup=x.div===FREE_DIV?(x.tpl.sub||'Tugas bebas'):(x.tpl.sub||x.div);
    h+='<div class="tugas-baris'+(x.selesai?' is-done':'')+'">'
      +(bisaUbah
        ? '<button class="papan-cek'+(x.selesai?' on':'')+'" title="'+(x.selesai?'Tandai belum selesai':'Tandai selesai')+'" onclick="event.stopPropagation();toggleJobSelesai('+a+')">'+(x.selesai?svg(IC.check):'')+'</button>'
        : '<span class="papan-cek'+(x.selesai?' on':'')+'">'+(x.selesai?svg(IC.check):'')+'</span>')
      +'<div class="tugas-isi"><div class="tugas-nama">'+esc(x.tpl.task||'(tanpa nama)')+'</div>'
        +'<div class="cell-sub" style="margin:0">'+esc(grup)
          +(x.jatuh?' · '+(telat?'<b style="color:var(--danger)">lewat tenggat '+fmtDate(x.jatuh)+'</b>':fmtDate(x.jatuh)):'')+'</div></div>'
      +'<span class="tugas-pic'+(x.pic?'':' kosong')+'">'+esc(x.pic||'PIC belum diisi')+'</span>'
      +'</div>';
  });
  return h+'</div>';
}
const KOL_UPCOMING=[
  {t:'', w:'32px'},
  {k:'nama',    t:'Event',    v:e=>e.nama},
  {k:'tanggal', t:'Tanggal',  v:e=>e.tanggal, cls:'mono', def:1},
  {k:'pax',     t:'Pax',      v:e=>+e.pax||0, cls:'mono', turun:1},
  {k:'siap',    t:'Kesiapan', v:e=>eventItemCount(e).pct, turun:1}
  // kolom chevron kanan dihapus: barisnya tidak lagi menuju halaman event,
  // jadi tanda "buka halaman" itu justru menjanjikan hal yang tidak terjadi.
];
function stat(label,val,sub,icon){
  return '<div class="card stat"><div class="sl">'+label+'</div><div class="sv num">'+val+'</div><div class="sd">'+sub+'</div><div class="si">'+svg(IC[icon])+'</div></div>';
}
function progressBar(v,max){ const p=Math.min(100,Math.round(v/max*100)); return '<div class="progress" style="width:100%;margin-top:2px"><div class="bar" style="width:'+p+'%"></div></div>'; }
/* Daftar divisi. Array KOSONG harus diperlakukan sama dengan "belum
   diisi" — dulu syaratnya cuma `!S.categories`, dan [] itu truthy.
   normalizeState() menuliskan [] di setiap pemuatan (categories ada di
   MKT_COLS), jadi daftar divisi tidak pernah terisi lagi setelah sekali
   tersimpan kosong: halaman Task Divisi tampil tanpa satu pun divisi, dan
   tidak ada tempat untuk mengisi apa pun. */
function getCats(){
  if(!Array.isArray(S.categories) || !S.categories.length)
    S.categories=DIVISIONS.concat(S.taskCategories||[]);
  return S.categories;
}
/* Daftar Format F&B yang berlaku. Syaratnya SENGAJA berbeda dari getCats() di
   atas: di sini `!Array.isArray` saja, tanpa `|| !length`.

   getCats() terpaksa memakai `!length` karena `categories` ada di MKT_COLS,
   dan normalizeState() menuliskan [] ke setiap kunci MKT_COLS pada tiap
   pemuatan — tanpa `!length` daftarnya tidak akan pernah terisi lagi.
   `fbFormats` TIDAK ada di MKT_COLS (ia pulang lewat jalur 'extra:' backend),
   jadi [] yang datang dari server memang [] betulan. Kalau di sini ikut
   memakai `!length`, kategori yang sengaja dihapus habis akan hidup lagi
   sendiri setiap kali halaman dibuka. */
function getFbFormats(){
  if(!Array.isArray(S.fbFormats)) S.fbFormats=FB_FORMATS_DEFAULT.slice();
  return S.fbFormats;
}
/* ---------- SUB KATEGORI ----------
   Satu tingkat di antara kategori dan item to-do:
     Prasmanan  ->  Appetizer  ->  [item, item, item]

   Disimpan sebagai ARRAY DATAR {id, div, nama}, bukan objek {div:[nama,...]}.
   Alasannya bukan selera: json_decode($x,true) di PHP tidak bisa membedakan {}
   dari [], jadi objek yang kebetulan kosong pulang sebagai array dan properti
   yang ditempelkan ke situ hilang tanpa pesan apa pun. Array datar tidak punya
   masalah itu.

   Sub kategori disimpan TERPISAH dari template, bukan diturunkan dari
   t.sub yang ada — supaya sub kategori kosong tetap bisa dibuat lebih dulu,
   lalu diisi item belakangan. */
function getSubs(){ if(!Array.isArray(S.fbSubs)) S.fbSubs=[]; return S.fbSubs; }
function subsOf(div){ return getSubs().filter(x=>x&&x.div===div); }
/* Item tanpa sub kategori tetap sah dan tidak disembunyikan — semua template
   yang sudah ada dibuat sebelum tingkat ini ada. Mereka berkumpul di kelompok
   tanpa nama yang selalu tampil paling atas. */
function subDivTemplates(div,sub){ return (S.taskTemplates||[]).filter(t=>t.div===div && (t.sub||'')===(sub||'')); }
function divTemplates(div){ return (S.taskTemplates||[]).filter(t=>t.div===div); }
// Template efektif untuk 1 divisi pada 1 event: Kitchen ikut menyerap cabang F&B (Prasmanan / Set Menu) sesuai pilihan event
// Job tambahan ad-hoc milik 1 event (bukan dari Template Task) — diketik langsung di Detail Job
function extraJobs(ev,div){ return (ev&&ev.extraJobs&&ev.extraJobs[div])||[]; }
/* Job tambahan kini hanya dibuat dari satu tempat: papan to-do di halaman
   Task Divisi. Dulu ada cabang kedua yang membuka modal Detail Job kalau
   ada modal sedang terbuka — modal itu sudah tidak ada pintunya lagi, dan
   membiarkan cabangnya berarti modal Detail Job bisa muncul tiba-tiba di
   atas modal LAIN yang kebetulan sedang dibuka. */
function gambarUlangJob(evId,div){ refreshView(); }
/* Format F&B BERDIRI SENDIRI, bukan cabang Kitchen.
   Dulu item Prasmanan/Set Menu dilipat masuk ke daftar job Kitchen, seolah
   formatnya cuma tambahan pekerjaan dapur. Bukan begitu: begitu client memilih
   Prasmanan, SELURUH template to-do untuk event itu datang dari kategori
   Prasmanan — ia kategori setara, bukan lampiran divisi lain. */
function eventDivTemplates(ev,div){ return divTemplates(div).concat(extraJobs(ev,div)); }
/* ---------- KATEGORI TASK DIVISI: HANYA FORMAT F&B ----------
   Satu event punya SATU kategori to-do: Format F&B yang dipilihnya. Client
   yang memilih Prasmanan mendapat seluruh daftar to-do Prasmanan — divisi
   (Kitchen, Bar, Floor, ...) hidup sebagai SUB KATEGORI di dalamnya, bukan
   sebagai kategori sejajar.

   Kembalikan [] kalau formatnya belum dipilih atau sudah tidak terdaftar.
   Papan to-do lalu menampilkan pesan yang menyuruh mengisi Format F&B dulu —
   itu jujur, dan bisa ditindaklanjuti. Memaksa kategori cadangan hanya akan
   menaruh pekerjaan di tempat yang salah.

   CATATAN: getCats() TIDAK ikut dibuang. Ia tetap daftar DIVISI ORGANISASI —
   dipakai untuk divisi pegawai, divisi akun, penyaring seksi form, dan
   penyaring papan bagi user operational. Yang berubah hanya perannya di Task
   Divisi: divisi bukan lagi kategori to-do. */
function eventCats(ev){
  const f=ev&&ev.detail&&ev.detail.fbFormat;
  return (f && getFbFormats().includes(f)) ? [f] : [];
}
// Sub kategori yang berlaku untuk satu event = sub milik Format F&B-nya.
function eventSubs(ev){ const c=eventCats(ev); return c.length?subsOf(c[0]):[]; }
function addExtraJob(evId,div,sub){
  const ev=S.events.find(e=>e.id===evId); if(!ev)return;
  ev.extraJobs=ev.extraJobs||{}; ev.extraJobs[div]=ev.extraJobs[div]||[];
  const baru={id:uid('xj'),div,sub:sub||'',task:'',pic:'',hminus:null,deadline:'',note:'',extra:true};
  ev.extraJobs[div].push(baru);
  // Halaman digambar ulang di tempat (posisi gulir dipertahankan), lalu kotak
  // nama item yang baru ini yang mendapat kursor — langsung bisa diketik.
  _fokusJob=baru.id;
  save(); gambarUlangJob(evId,div);
}
/* Tugas bebas: dipakai saat event TIDAK memilih Format F&B — kru tetap bisa
   menyusun daftar tugasnya sendiri dengan sub kategori bebas. Disimpan di
   extraJobs['_bebas'] (bentuk sama dengan job tambahan biasa, ada field sub). */
const FREE_DIV='_bebas';
function addFreeTask(evId){
  const el=$('fb_sub'); const sub=el?el.value.trim():'';
  addExtraJob(evId,FREE_DIV,sub);
  if(el) el.value='';
}
function setExtraJob(evId,div,jobId,field,val){
  const ev=S.events.find(e=>e.id===evId); if(!ev)return;
  const j=extraJobs(ev,div).find(x=>x.id===jobId); if(!j)return;
  j[field]=(field==='hminus')?(val===''?null:Math.max(0,Math.round(+val||0))):val;
  save();
}
function delExtraJob(evId,div,jobId){
  const ev=S.events.find(e=>e.id===evId); if(!ev)return;
  const j=extraJobs(ev,div).find(x=>x.id===jobId);
  confirmUI({title:'Hapus Job Tambahan',danger:true,ok:'Hapus',
    body:'Hapus job <b>'+esc(j&&j.task?j.task:'(tanpa nama)')+'</b> dari divisi '+esc(div)+'? Job ini hanya milik event ini.',
    onYes:function(){
      ev.extraJobs[div]=extraJobs(ev,div).filter(x=>x.id!==jobId);
      if(ev.jobProgress&&ev.jobProgress[div]) delete ev.jobProgress[div][jobId];
      save(); gambarUlangJob(evId,div);
    }});
}
/* PIC, deadline, dan catatan per EVENT.

   Template Task itu standar yang berlaku untuk semua event; yang berubah
   per event adalah siapa yang kebagian dan kapan tenggatnya. Sebelum ini
   ketiganya hanya bisa diubah lewat Template Task — artinya mengganti PIC
   di satu event ikut mengubah SEMUA event. Nilai di sini menimpa template
   hanya untuk event ini; kalau belum pernah diisi, template yang dipakai. */
function jobMeta(e,div,taskId){
  return (e.jobMeta && e.jobMeta[div] && e.jobMeta[div][taskId]) || {};
}
function jobField(e,div,tpl,field){
  const o=jobMeta(e,div,tpl.id);
  return (o[field]!==undefined && o[field]!=='') ? o[field] : (tpl[field]||'');
}
function setJobMeta(evId,div,taskId,field,val){
  const e=S.events.find(x=>x.id===evId); if(!e)return;
  e.jobMeta=e.jobMeta||{}; e.jobMeta[div]=e.jobMeta[div]||{};
  e.jobMeta[div][taskId]=e.jobMeta[div][taskId]||{};
  e.jobMeta[div][taskId][field]=val;
  save();
}
/* Selesai = 100%. Satu angka saja yang jadi sumber kebenaran; kalau status
   "selesai" disimpan terpisah dari progress, keduanya pasti berselisih. */
function jobSelesai(e,div,taskId){ return jobProg(e,div,taskId)>=100; }
function toggleJobSelesai(evId,div,taskId){
  const e=S.events.find(x=>x.id===evId); if(!e)return;
  setJobProg(evId,div,taskId, jobSelesai(e,div,taskId)?0:100);
  refreshView();
}
/* Hitungan item untuk satu event: dipakai di kartu daftar maupun di kepala
   papan, jadi angkanya tidak mungkin berbeda antara dua tempat itu. */
function eventItemCount(e){
  let total=0, selesai=0;
  eventCats(e).forEach(div=>eventDivTemplates(e,div).forEach(tpl=>{
    total++; if(jobSelesai(e,div,tpl.id)) selesai++;
  }));
  return {total,selesai,pct: total?Math.round(selesai/total*100):0};
}
function jobProg(e,div,taskId){ return Math.max(0,Math.min(100, Math.round((e.jobProgress&&e.jobProgress[div]&&+e.jobProgress[div][taskId])||0))); }
function divProgress(e,div){ const items=eventDivTemplates(e,div); if(!items.length)return 0; return Math.round(items.reduce((a,t)=>a+jobProg(e,div,t.id),0)/items.length); }
/* Kesiapan satu SUB kategori. Sejak divisi turun jadi sub kategori, inilah
   satuan yang dulu dijawab divProgress per divisi: "Kitchen sudah berapa
   persen?" sekarang berarti sub kategori Kitchen di dalam format event. */
function subProgress(e,cat,sub){
  const items=eventDivTemplates(e,cat).filter(t=>(t.sub||'')===(sub||''));
  if(!items.length)return 0;
  return Math.round(items.reduce((a,t)=>a+jobProg(e,cat,t.id),0)/items.length);
}
// Progres keseluruhan = rata-rata kesiapan SEMUA divisi (divisi yang belum punya job

// dan tidak terlihat tinggi padahal sebagian besar divisi belum jalan.
function taskProgress(e){ const cats=eventCats(e); if(!cats.length)return 0; return Math.round(cats.reduce((a,div)=>a+divProgress(e,div),0)/cats.length); }
function setJobProg(evId,div,taskId,val){ const e=S.events.find(x=>x.id===evId); if(!e)return; e.jobProgress=e.jobProgress||{}; e.jobProgress[div]=e.jobProgress[div]||{}; e.jobProgress[div][taskId]=Math.max(0,Math.min(100,Math.round(+val||0))); save(); }
/* rngFill() DIBUANG bersama slider progress per item. setJobProg() sendiri
   DIPERTAHANKAN: ia masih dipakai toggleJobSelesai() (0 atau 100), dan data
   lama yang terlanjur bernilai 37% tetap terbaca — divProgress() menghitungnya
   apa adanya, jadi tidak ada angka yang tiba-tiba berubah. */
/* Posisi gulir yang harus dipulihkan sesudah gambar ulang. Diisi HANYA oleh
   refreshView() — yaitu saat halaman yang sama digambar ulang. go() yang
