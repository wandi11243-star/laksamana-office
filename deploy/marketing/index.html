        +'</div>':'')
      +'</figure>';
  }).join('')+'</div>';
  V.innerHTML=h;
}

/* ---------- menyusun isi katalog ---------- */
async function katUpload(inputEl){
  const files=[...(inputEl.files||[])]; if(!files.length)return;
  S.katalog=katalogList();
  let ok=0;
  for(const f of files){
    if(!fotoKah(f)){ toast('Harus gambar',esc(f.name)+' bukan file gambar.','err'); continue; }
    if(f.size>8*1024*1024){ toast('File terlalu besar',esc(f.name)+' lebih dari 8MB.','err'); continue; }
    try{
      const b64=await fileToBase64(f);
      const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify({action:'uploadReceipt',fileName:f.name,mimeType:f.type,dataBase64:b64})});
      const d=await res.json();
      if(!d||!d.ok) throw new Error((d&&d.error)||'ditolak server');
      /* Judul diisi dari nama berkas tanpa ekstensi — bukan dibiarkan kosong.
         Mengunggah 20 foto lalu menghadapi 20 kartu "Belum ada judul" yang
         serupa membuat orang harus membuka satu-satu untuk tahu mana yang mana. */
      const tebakJudul=String(f.name).replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').trim();
      S.katalog.push({id:uid('kat'),judul:tebakJudul,sub:'',desc:'',key:d.data.key,
                      name:f.name,at:new Date().toISOString(),by:(ME&&ME.name)||''});
      ok++;
    }catch(e){ toast('Gagal unggah',esc(f.name)+': '+e.message,'err'); }
  }
  inputEl.value='';
  if(!ok)return;
  save(); logAct('katalog','',ok+' slide katalog ditambahkan','');
  refreshView();
  toast('Slide ditambahkan',ok+' gambar masuk katalog. Rapikan judul & deskripsinya lewat tombol Edit.','ok');
}
function katEdit(id){
  const it=katalogList().find(x=>x.id===id); if(!it)return;
  const url=katFoto(it);
  modal('<div class="modal-head"><div><h3>Slide Katalog</h3><p>Judul, subjudul & deskripsi yang tampil saat presentasi</p></div>'
   +'<div class="x" onclick="closeModal()">'+svg(IC.x)+'</div></div>'
   +'<div class="modal-body">'
     +(url?'<img src="'+esc(url)+'" alt="" style="width:100%;height:170px;object-fit:cover;border-radius:10px;border:1px solid var(--line-hard);margin-bottom:14px" onerror="gambarHilang(this)">':'')
     +'<div class="form-grid">'
       +'<div class="field full"><label>Judul</label><input class="inp" id="kat_judul" value="'+esc(it.judul||'')+'" placeholder="mis. Area Indoor Full AC"></div>'
       +'<div class="field full"><label>Subjudul</label><input class="inp" id="kat_sub" value="'+esc(it.sub||'')+'" placeholder="mis. Sepenuhnya ber-AC"><div class="fh">Satu baris penegas di bawah judul. Boleh dikosongkan.</div></div>'
       +'<div class="field full"><label>Deskripsi</label><textarea class="inp" id="kat_desc" rows="4" placeholder="Penjelasan singkat yang dibacakan ke client…">'+esc(it.desc||'')+'</textarea></div>'
       +'<div class="field full"><label>Ganti Gambar</label><input class="inp" type="file" id="kat_file" accept="image/*"><div class="fh">Biarkan kosong kalau gambarnya tidak diubah. Maks 8MB.</div></div>'
     +'</div>'
   +'</div>'
   +'<div class="modal-foot"><button class="btn" onclick="closeModal()">Batal</button>'
   +'<button class="btn pri" onclick="katSimpan(\''+esc(id)+'\')">Simpan</button></div>');
}
async function katSimpan(id){
  const it=katalogList().find(x=>x.id===id); if(!it)return;
  it.judul=$('kat_judul').value.trim();
  it.sub=$('kat_sub').value.trim();
  it.desc=$('kat_desc').value;
  const fEl=$('kat_file'), f=fEl&&fEl.files&&fEl.files[0];
  if(f){
    if(!fotoKah(f)) return toast('Harus gambar',esc(f.name)+' bukan file gambar.','err');
    if(f.size>8*1024*1024) return toast('File terlalu besar','Maksimal 8MB.','err');
    try{
      const b64=await fileToBase64(f);
      const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify({action:'uploadReceipt',fileName:f.name,mimeType:f.type,dataBase64:b64})});
      const d=await res.json();
      if(!d||!d.ok) throw new Error((d&&d.error)||'ditolak server');
      it.key=d.data.key; it.name=f.name;
    }catch(e){ return toast('Gagal unggah',e.message,'err'); }
  }
  save(); logAct('katalog',id,'Slide katalog disimpan',it.judul||'(tanpa judul)');
  closeModal(); refreshView(); toast('Slide tersimpan','','ok');
}
function katHapus(id){
  const it=katalogList().find(x=>x.id===id); if(!it)return;
  confirmUI({title:'Hapus slide katalog?',sub:it.judul||it.name||'(tanpa judul)',
    body:'Slide ini akan hilang dari halaman Katalog dan dari presentasi.',
    ok:'Hapus',danger:true,onYes:function(){
      S.katalog=katalogList().filter(x=>x.id!==id);
      save(); logAct('katalog',id,'Slide katalog dihapus',it.judul||'');
      refreshView(); toast('Slide dihapus','','ok');
    }});
}
/* Urutan kartu = urutan slide, jadi menggeser harus tersedia di halaman ini.
   Tombol naik/turun, bukan seret: seret butuh titik pegangan yang jelas dan
   mudah salah picu di kartu yang seluruh gambarnya sudah bisa diklik. */
function katGeser(i,arah){
  const arr=katalogList(); const j=i+arah;
  if(j<0||j>=arr.length)return;
  const t=arr[i]; arr[i]=arr[j]; arr[j]=t;
  S.katalog=arr; save(); refreshView();
}

/* ---------- MODE PRESENTASI ----------
   Dibuat sekali lalu dipakai ulang. Overlay-nya ditempel ke <body>, BUKAN ke
   #view: tiap render halaman mengganti innerHTML #view seluruhnya, dan
   presentasi yang hidup di dalamnya akan ikut terhapus. */
let _katIdx=0, _katAuto=null, _katSepi=null;
function katShow(i){
  const arr=katalogList();
  if(!arr.length) return toast('Katalog kosong','Tambahkan slide dulu sebelum presentasi.','err');
  _katIdx=Math.max(0,Math.min(arr.length-1,+i||0));
  if(!$('kat-show')) document.body.insertAdjacentHTML('beforeend','<div id="kat-show" class="kat-show"></div>');
  const box=$('kat-show');
  box.classList.add('on'); box.classList.remove('tanpa-cap','sepi');
  katPaint();
  /* Fullscreen dipanggil dari klik tombol, jadi gerakan usernya sah. Kalau
     ditolak, presentasinya tetap jalan sebagai overlay penuh — karena itu
     penolakannya ditelan, bukan dilaporkan sebagai kegagalan. */
  if(box.requestFullscreen) box.requestFullscreen().catch(function(){});
  document.addEventListener('keydown',katKey,true);
  document.addEventListener('fullscreenchange',katFsChange);
  katSepiMulai();
}
function katSlides(){ return katalogList(); }
function katPaint(){
  const box=$('kat-show'); if(!box)return;
  const arr=katSlides(); if(!arr.length) return katClose();
  if(_katIdx>=arr.length) _katIdx=arr.length-1;
  const it=arr[_katIdx], url=katFoto(it);
  const banyak=arr.length;
  const adaCap=!!(it.judul||it.sub||it.desc);
  box.classList.toggle('ada-cap',adaCap);
  /* Orientasi slide yang sudah pernah diukur dipasang SEBELUM gambarnya
     digambar. Tanpa ini, kembali ke slide potret memperlihatkan tata letak
     lanskap sekejap dulu sampai onload berbunyi — dan pada gambar yang sudah
     ada di cache, kedipan itu justru paling terlihat. */
  if(_katPotret[it.id]!==undefined) box.classList.toggle('potret',_katPotret[it.id]);
  box.innerHTML=
    '<div class="kat-stage">'
      +(url?'<img src="'+esc(url)+'" alt="'+esc(it.judul||'')+'" onload="katUkur(this)" onerror="this.remove()">'
           :'<div class="kat-nogbr">Slide tanpa gambar</div>')
    +'</div>'
    +'<div class="kat-zone kiri" title="Slide sebelumnya" onclick="katPrev()"></div>'
    +'<div class="kat-zone kanan" title="Slide berikutnya" onclick="katNext()"></div>'
    +'<div class="kat-bar">'
      +'<button class="kat-hit" title="Sebelumnya (←)" onclick="katPrev()">‹</button>'
      +'<button class="kat-hit" title="Berikutnya (→ / Spasi)" onclick="katNext()">›</button>'
      +'<span class="kat-cnt">'+(_katIdx+1)+' / '+banyak+'</span>'
      +'<span class="kat-sp"></span>'
      +'<button class="kat-hit'+(_katAuto?' on':'')+'" title="Jalan otomatis 6 detik per slide (P)" onclick="katAuto()">'+(_katAuto?'‖':'▶')+'</button>'
      +'<button class="kat-hit" title="Sembunyikan / tampilkan teks (C)" onclick="katCap()">'+svg(IC.eye)+'</button>'
      +'<button class="kat-hit" title="Layar penuh (F)" onclick="katFs()">⛶</button>'
      +'<button class="kat-hit" title="Tutup presentasi (Esc)" onclick="katClose()">'+svg(IC.x)+'</button>'
    +'</div>'
    +((it.judul||it.sub||it.desc)?'<div class="kat-cap">'
      +(it.judul?'<h2>'+esc(it.judul)+'</h2>':'')
      +(it.sub?'<div class="kat-cap-sub">'+esc(it.sub)+'</div>':'')
      +(it.desc?'<p>'+esc(it.desc)+'</p>':'')
    +'</div>':'')
    /* Titik navigasi hanya kalau jumlahnya masih bisa dibidik. Di atas 20 slide
       titiknya jadi terlalu rapat untuk diklik dan cuma menambah keramaian —
       penghitung "12 / 30" sudah lebih informatif di sana. */
    +(banyak>1&&banyak<=20?'<div class="kat-dots">'+arr.map(function(_,k){
        return '<i class="'+(k===_katIdx?'on':'')+'" title="Slide '+(k+1)+'" onclick="katKe('+k+')"></i>';
      }).join('')+'</div>':'')
    +'<div class="kat-help">← → pindah · C teks · P otomatis · Esc keluar</div>';
  /* Muat gambar slide berikutnya di latar. Tanpa ini, tiap "next" pada foto
     besar menampilkan panggung hitam dulu selama gambarnya diunduh — paling
     terasa justru saat presentasi di depan client. */
  const nx=arr[_katIdx+1];
  if(nx&&nx.key){ const pre=new Image(); pre.src=katFoto(nx); }
}
/* Orientasi hanya bisa diketahui sesudah gambarnya dimuat (naturalWidth /
   naturalHeight), jadi diukur di onload lalu diingat per slide. Ambang 1,05
   supaya gambar yang hampir persegi tidak bolak-balik antara dua tata letak. */
const _katPotret={};
function katUkur(img){
  const box=$('kat-show'); if(!box||!box.classList.contains('on'))return;
  const arr=katSlides(), it=arr[_katIdx]; if(!it)return;
  if(!img.naturalWidth||!img.naturalHeight)return;
  const potret=img.naturalHeight > img.naturalWidth*1.05;
  _katPotret[it.id]=potret;
  box.classList.toggle('potret',potret);
}
function katKe(i){
  const arr=katSlides(); if(!arr.length)return;
  _katIdx=(i+arr.length)%arr.length;
  katPaint(); katSepiMulai();
}
function katNext(){ katKe(_katIdx+1); }
function katPrev(){ katKe(_katIdx-1); }
function katCap(){ const b=$('kat-show'); if(b) b.classList.toggle('tanpa-cap'); }
function katAuto(){
  if(_katAuto){ clearInterval(_katAuto); _katAuto=null; }
  else _katAuto=setInterval(katNext,6000);
  katPaint();
}
function katFs(){
  const box=$('kat-show'); if(!box)return;
  if(document.fullscreenElement) document.exitFullscreen&&document.exitFullscreen();
  else box.requestFullscreen&&box.requestFullscreen().catch(function(){});
}
/* Keluar dari fullscreen lewat F11 / Esc bawaan browser harus ikut menutup
   presentasinya. Kalau tidak, orang mendarat di overlay hitam yang masih
   menutupi aplikasi dan terlihat seperti modul yang menggantung. */
function katFsChange(){ if(!document.fullscreenElement && $('kat-show') && $('kat-show').classList.contains('on')) katClose(); }
function katClose(){
  const box=$('kat-show');
  if(_katAuto){ clearInterval(_katAuto); _katAuto=null; }
  if(_katSepi){ clearTimeout(_katSepi); _katSepi=null; }
  document.removeEventListener('keydown',katKey,true);
  document.removeEventListener('fullscreenchange',katFsChange);
  if(box){ box.classList.remove('on'); box.innerHTML=''; }
  if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(function(){});
}
/* Bilah tombol & titik memudar setelah 2,5 detik tanpa gerakan mouse, supaya
   yang tersisa di layar client hanya gambar dan teksnya. */
function katSepiMulai(){
  const box=$('kat-show'); if(!box)return;
  box.classList.remove('sepi');
  clearTimeout(_katSepi);
  _katSepi=setTimeout(function(){ const b=$('kat-show'); if(b&&b.classList.contains('on')) b.classList.add('sepi'); },2500);
}
document.addEventListener('mousemove',function(){ const b=$('kat-show'); if(b&&b.classList.contains('on')) katSepiMulai(); });
function katKey(e){
  const box=$('kat-show'); if(!box||!box.classList.contains('on'))return;
  const k=e.key;
  if(k==='Escape'){ e.preventDefault(); e.stopPropagation(); return katClose(); }
  if(k==='ArrowRight'||k==='ArrowDown'||k===' '||k==='PageDown'||k==='Enter'){ e.preventDefault(); e.stopPropagation(); return katNext(); }
  if(k==='ArrowLeft'||k==='ArrowUp'||k==='Backspace'||k==='PageUp'){ e.preventDefault(); e.stopPropagation(); return katPrev(); }
  if(k==='Home'){ e.preventDefault(); return katKe(0); }
  if(k==='End'){ e.preventDefault(); return katKe(katSlides().length-1); }
  if(k==='f'||k==='F'){ e.preventDefault(); return katFs(); }
  if(k==='c'||k==='C'){ e.preventDefault(); return katCap(); }
  if(k==='p'||k==='P'){ e.preventDefault(); return katAuto(); }
}

async function uploadVenueFoto(inputEl){

        body:JSON.stringify({action:'uploadReceipt',fileName:f.name,mimeType:f.type,dataBase64:b64})});
      const d=await res.json();

/* Textarea yang ikut tinggi isinya. Sebelumnya tingginya dikunci 38px, jadi
   menekan Enter membuat teksnya menggulir di balik kotak sempit — orang jadi
   tidak bisa melihat catatan yang baru saja diketiknya sendiri.
   Dipanggil saat mengetik DAN sekali saat form digambar (catatan lama yang
   sudah berbaris-baris harus langsung tampil utuh). */
/* Enter melanjutkan penanda bullet baris sebelumnya, seperti aplikasi
   catatan. Baris bullet yang dibiarkan kosong lalu di-Enter akan
   menghapus bulletnya — supaya bisa keluar dari daftar tanpa harus
   menghapus tanda satu per satu. */
function bulletOtomatis(e,el){
  if(e.key!=='Enter'||e.shiftKey) return;
  const pos=el.selectionStart;
  const barisIni=el.value.slice(0,pos).split(String.fromCharCode(10)).pop();
  const m=barisIni.match(/^(\s*)([-*•]|\d+[.)])\s+/);
  if(!m) return;
  e.preventDefault();
  const kosong = barisIni.trim()===m[2];
  if(kosong){
    // keluar dari daftar: buang penanda di baris ini
    const awal=pos-barisIni.length;
    el.value=el.value.slice(0,awal)+el.value.slice(pos);
    el.selectionStart=el.selectionEnd=awal;
  } else {
    const angka=m[2].match(/^(\d+)([.)])$/);
    const tanda=angka ? (Number(angka[1])+1)+angka[2] : m[2];
    const sisip=String.fromCharCode(10)+m[1]+tanda+' ';
    el.value=el.value.slice(0,pos)+sisip+el.value.slice(el.selectionEnd);
    el.selectionStart=el.selectionEnd=pos+sisip.length;
  }
  if(typeof tumbuhkan==='function') tumbuhkan(el);
  if(typeof autoSaveTrigger==='function') autoSaveTrigger();
}
function tumbuhkan(el){
  if(!el)return;
  el.style.height='auto';
  el.style.height=Math.min(el.scrollHeight, 320)+'px';   // batas atas: jangan sampai satu catatan memenuhi layar
  if(el.scrollHeight>320) el.style.overflowY='auto';
}
function tumbuhkanSemua(){
  const c=$('ev-tab-content'); if(!c)return;
  c.querySelectorAll('textarea.ynnote-note').forEach(tumbuhkan);
}
/* Nilai di luar daftar dikembalikan ke nilai sebelumnya. Tanpa ini, salah
   ketik satu huruf diam-diam menyimpan pilihan yang tidak dikenal, dan
   field bersyarat yang bergantung padanya berhenti bekerja tanpa pesan. */
/* ================= COMBO PILIH-SAMBIL-KETIK =================
   Satu komponen dipakai tiga tempat: field 'sel' di form event, kotak PIC
   (daftar pegawai), dan pencarian client di form Event Baru. Nilainya tetap
   tersimpan di <input> biasa, jadi seluruh pembaca form yang sudah ada
   (collectField, autoSaveCommit) tidak perlu tahu apa-apa soal komponen ini. */
const COMBO_OPSI={};
function comboHTML(id,opsi,nilai,dis,ph,extra){
  COMBO_OPSI[id]=(opsi||[]).slice();
  return '<div class="combo" id="cb_'+id+'">'
    +'<input class="inp" id="'+id+'" value="'+esc(nilai==null?'':nilai)+'" autocomplete="off" '
      +'placeholder="'+esc(ph||'pilih / ketik untuk mencari')+'" '
      +(dis?'disabled ':'')
      +'oninput="comboSaring(\''+id+'\')" onfocus="comboBuka(\''+id+'\',true)" '
      +'onkeydown="comboKey(event,\''+id+'\')" '+(extra||'')+'>'

function rundownRows(val){

  return String(txt).split(/\r?\n/).map(line=>{
    line=line.replace(/\s+/g,' ').trim(); if(!line)return null;
    // cocokkan pola jam di depan: "09:00", "9.00", "09:00-10:00", "09.00 – 10.00"
    const m=line.match(/^(\d{1,2}[:.]\d{2}(?:\s*[-–—]\s*\d{1,2}[:.]\d{2})?)\s*[-–—.:)\]]*\s*(.*)$/);

   Kalau nilainya TIDAK berbentuk jam sama sekali — misalnya hasil OCR rundown

function jamCell(nama, nilai, dis, hook){
  const norm = jamKeMenit(nilai);
  if(nilai && norm===null){
    return '<input class="inp" data-r="'+nama+'" value="'+esc(nilai)+'" '
         + 'title="Bentuknya belum dikenali. Ketik ulang mis. 09:00 supaya bisa memakai pemilih jam." '
         + dis+hook+'>';
  }
  return '<input class="inp inp-jam" type="time" data-r="'+nama+'" '
       + 'value="'+(norm!==null?menitKeJam(norm):'')+'" '+dis+hook+'>';

function jamKeMenit(s){
  const m=String(s||'').match(/^(\d{1,2})[:.](\d{2})$/); if(!m)return null;
  const h=+m[1], mi=+m[2]; if(h>23||mi>59)return null; return h*60+mi;

function menitKeJam(n){
  n=((n%1440)+1440)%1440;                       // lewat tengah malam -> berputar

// durasi diterima sebagai "90", "90m", "1:30", "1.5j"
function durasiKeMenit(s){
  s=String(s||'').trim().toLowerCase(); if(!s)return null;
  let m=s.match(/^(\d{1,2})[:.](\d{2})$/); if(m)return (+m[1])*60+(+m[2]);
  m=s.match(/^(\d+(?:[.,]\d+)?)\s*j(?:am)?$/); if(m)return Math.round(parseFloat(m[1].replace(',','.'))*60);

function rundownHitung(el,dari){

    if(mulai!=null && d!=null) q('selesai').value=menitKeJam(mulai+d);
  } else {

  secs.forEach(sec=>sec.fields.forEach(fl=>{ if(!fieldVisible(ev,fl))return; const v=collectField(fl); if(v===undefined)return; ev.detail[fl.k]=v; }));
  if(curTab==='basic'){ ev.nama=ev.detail.nama||ev.nama; ev.jenis=ev.detail.jenis||ev.jenis; ev.tanggal=ev.detail.tanggal||ev.tanggal; ev.pax=+ev.detail.pax||ev.pax; }
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(_){}
  // Sinkron ke server lewat save() (bukan POST mentah) supaya cap versi &
  // penjaga bentrok ikut berlaku. Dijeda agar tidak membanjiri tiap ketukan.
  clearTimeout(_asSrvTimer);
  _asSrvTimer=setTimeout(()=>{ save(); },4000);
  const ind=$('autosave-ind'); if(ind){ ind.textContent='✓ Tersimpan otomatis'; ind.style.opacity='1'; clearTimeout(ind._t); ind._t=setTimeout(()=>{ ind.style.opacity='0'; },1600); }
  segarkanRingkas(ev);
}
/* PENYELAMAT BERKALA — menyimpan tiap 20 detik selama form event terbuka, tanpa
   menunggu ketikan berikutnya.

   Auto-save berbasis ketikan sudah ada, tapi ia hanya berbunyi SESUDAH ada
   perubahan: kalau orang mengetik satu angka lalu berpindah memikirkan sesuatu,
   penyimpanannya memang sudah jalan — tapi kalau browser tertutup di tengah
   isian yang belum sempat memicu event (mis. nilai ditempel lewat menu klik
   kanan pada sebagian browser), isinya hilang. Denyut 20 detik menutup celah
   itu tanpa membebani: yang dikirim ke server tetap lewat save() yang berjeda,
   jadi denyut ini paling banyak menghasilkan satu penulisan localStorage. */
let _asDenyut=null;
function autoSaveDenyutMulai(){
  clearInterval(_asDenyut);
  _asDenyut=setInterval(function(){
    if(!_asEvId) return;
    if(!$('ev-tab-content')) return;              // form sudah ditutup
    if(document.getElementById('modal-bg') && document.getElementById('modal-bg').classList.contains('on')) return; // sedang ada dialog
    autoSaveCommit();
  },20000);
}
function autoSaveDenyutStop(){ clearInterval(_asDenyut); _asDenyut=null; }
/* Ringkasan di atas form ikut hidup saat mengetik. Tanpa ini angkanya baru
   benar setelah render ulang penuh, dan strip yang memajang "29/37" padahal
   isian ke-30 baru saja diketik lebih buruk daripada tidak ada strip sama
   sekali — kru memakainya justru untuk tahu sisa yang belum diisi.
   Digambar ulang isinya saja, bukan lewat go(), supaya fokus ketikan dan
   posisi kursor tidak lompat. */
function segarkanRingkas(ev){
  const lama=document.querySelector('.rk-card'); if(!lama)return;
  const baru=ringkasIsianHTML(ev); if(!baru)return;
  const tmp=document.createElement('div'); tmp.innerHTML=baru;
  lama.replaceWith(tmp.firstElementChild);
}
function saveEventTab(id,goNext){
  clearTimeout(_asTimer); // draft terakhir langsung ikut tercommit di bawah
  const ev=S.events.find(e=>e.id===id); const tab=TAB_BY_ID[curTab];
  if(!ev||!tab)return;
  const changes=[];
  genericSecsOfTab(tab.id).forEach(sec=>{
    sec.fields.forEach(fl=>{ if(!fieldVisible(ev,fl))return; const v=collectField(fl); if(v===undefined)return;
      const old=JSON.stringify(ev.detail[fl.k]); if(JSON.stringify(v)!==old)changes.push(fl.l); ev.detail[fl.k]=v; });
  });
  // Tab Finance memuat section 'finance' yang inputnya di luar EVENT_SCHEMA.
  const adaFinance=visibleSecsOfTab(tab.id).some(s=>s.id==='finance');
  if(adaFinance) collectFinanceInto(ev);
  // sync top-level fields
  if(curTab==='basic'){ ev.nama=ev.detail.nama||ev.nama; ev.jenis=ev.detail.jenis||ev.jenis; ev.tanggal=ev.detail.tanggal||ev.tanggal; ev.pax=+ev.detail.pax||ev.pax; }
  if(changes.length)logAct('event',id,'Detail diperbarui: '+tab.title,changes.join(', '));
  if(adaFinance) logAct('event',id,'Finance diperbarui',rp(eventFinance(ev).grand));
  /* Dulu di sini ada syncApproval(): diskon ≥ ambang otomatis melempar event
     ke Approval Flow. DIHAPUS — approval di modul ini tinggal satu, yaitu
     Surat Penawaran sebelum dikirim ke klien. Menyimpan detail harga tidak
     lagi memicu antrian apa pun. */
  save(); buildNav();
  toast('Tersimpan',tab.title+' disimpan.'+(adaFinance?' Grand Total: '+rp(eventFinance(ev).grand):''),'ok');
  // pengingat: detailing tidak mengunci tahap, jadi ingatkan kalau peluang belum dipindah
  // (hanya saat simpan biasa — kalau sedang "Simpan & Lanjut" toast ini justru mengganggu alur)
  if(isOpenEvent(ev) && !goNext) setTimeout(()=>toast('Jangan lupa tahapnya','Peluang masih "'+ev.status+'". Perbarui tahap pipeline bila sudah ada kemajuan.'),700);
  if(goNext){ const nx=nextTabId(curTab); if(nx) curTab=nx; }
  go('event',id);
}
function setTask(evId,div,status){
  const ev=S.events.find(e=>e.id===evId); genTasks(ev);
  ev.tasks[div]={status,by:ME.name,at:new Date().toISOString()};
  logAct('event',evId,'Task '+div+' → '+status,'');
  if(status==='Done')toast('Divisi siap','Divisi '+div+' dikonfirmasi Done.','ok');
  save(); go('event',evId);
}
function setTaskProgress(evId,div,val){
  const ev=S.events.find(e=>e.id===evId); if(!ev)return; genTasks(ev);
  const p=Math.max(0,Math.min(100,Math.round(+val||0)));
  const prev=ev.tasks[div]||{};
  ev.tasks[div]={...prev,progress:p,status:(p>=100?'Done':p>0?'On Progress':'Pending'),by:ME.name,at:new Date().toISOString()};
  logAct('event',evId,'Progress '+div+' → '+p+'%','');
  save();
}
/* ---------- APPROVAL FLOW ----------
   SATU approval saja di modul ini: **Surat Penawaran**, disetujui manajemen
   SEBELUM dikirim ke klien dan sebelum negosiasi dimulai. Lihat buatPenawaran()
   / ajukanPenawaran() / putusPenawaran().

   Dua pemicu approval lain sudah DIHAPUS atas keputusan bisnis:
     1. Ambang NOMINAL (dulu: grand total ≥ Rp25 jt otomatis butuh persetujuan)
        — event besar tidak lagi tertahan hanya karena nilainya besar.
     2. Ambang DISKON (diskon ≥ N% otomatis masuk antrian "Negosiasi Harga")
        — persetujuannya sudah terjadi lebih dulu, saat Surat Penawaran
        disetujui. Meminta approval kedua untuk harga yang sama berarti
        menahan pekerjaan dua kali untuk satu keputusan.

   `S.approvals` sengaja TIDAK dihapus: baris yang terlanjur ada tetap
   ditampilkan di Approval Flow (dan yang masih Pending tetap bisa diputuskan
   lewat decideApproval) supaya tidak ada perkara yang hilang diam-diam. Yang
   berhenti adalah PEMBUATAN baris baru — tidak ada lagi jalan masuk ke sana. */
function confirmEvent(id){
  const ev=S.events.find(e=>e.id===id);
  /* Matriks PIC Hari-H (D.11) dulu MENOLAK konfirmasi Deal bila belum terisi.
     Sekarang hanya diingatkan: PIC sering baru ditentukan setelah deal-nya
     pasti, jadi menahan Deal karenanya membalik urutan kerja yang sebenarnya. */
  const missing=['picKoordinator','picMOD','picAcara'].filter(k=>!ev.detail[k]);
  // otomasi: cegah dobel booking — minta konfirmasi ulang bila bentrok
  const clash=bookingConflicts(ev);
  if(clash.length && !confirm('BENTROK JADWAL\n\n'+fmtDate(ev.tanggal)+' sudah ada '+clash.length+' event lain:\n'+clash.map(x=>'• '+x.nama+' ('+((x.detail&&x.detail.area)||'area belum diisi')+')').join('\n')+'\n\nTetap konfirmasi Deal?')) return;
  ev.status='Deal'; ev.pipeCol='Deal';
  genTasks(ev);
  toast('Event Confirmed ⚓','Handover ke divisi & invoice bisa diterbitkan.','ok');
  if(missing.length) setTimeout(()=>toast('Matriks PIC belum lengkap','PIC Hari-H (D.11) di tab Operasional masih kosong — isi sebelum hari-H.'),900);
  logAct('event',id,'Status → Confirmed','');
  pushNotif('event','Handover baru',ev.nama+' siap dibriefing ke seluruh divisi.','#event/'+id);
  save(); buildNav(); go('event',id);
}

/* ---------- TANDAI EVENT SELESAI ----------
   Sebelum ini satu-satunya cara sebuah event jadi "Event Done" adalah
   autoCloseEvents() yang jalan sendiri di H+2 — tidak ada tombolnya di mana
   pun. Akibatnya event yang acaranya sudah bubar hari itu juga tetap tercatat
   "Deal" sampai lewat tenggang, dan orang mengira sistemnya tidak bisa. */
function tandaiSelesai(id){
  const ev=S.events.find(e=>e.id===id); if(!ev)return;
  if(!can('edit_event'))return toast('Akses ditolak','Kamu tidak punya izin mengubah event.','err');
  const f=eventFinance(ev);
  const sisa=f.remaining>0?f.remaining:0;
  const tugas=eventItemCount(ev);
  confirmUI({
    title:'Tandai Event Selesai?',
    sub:ev.nama+' · '+fmtDate(ev.tanggal),
    ok:'Ya, Event Selesai',
    body:'Statusnya berubah jadi <b>Event Done</b>: event keluar dari daftar peluang aktif dan '
      +'omzetnya dihitung sebagai belanja klien.'
      +(sisa?'<br><br><b style="color:var(--danger)">Sisa tagihan '+rp(sisa)+' belum lunas.</b> '
         +'Menandai selesai TIDAK menutup tagihannya — invoice tetap berjalan.':'')
      +(tugas.total&&tugas.selesai<tugas.total?'<br><br>Masih ada <b>'+(tugas.total-tugas.selesai)+' tugas divisi</b> yang belum dicentang.':''),
    onYes:()=>{
      const prev=ev.status;

      save(); toast('Event selesai ⚓',ev.nama+' ditandai Event Done.','ok'); go('event',id);
    }});

/* ============================================================
   PENAWARAN (Surat Penawaran) — alur:
     Buat + Upload PDF → Ajukan → (Manager/Approver) Setujui/Tolak
     → Kirim ke Client → Deal (detailing)
   Menempel di ev.penawaran. Suratnya TIDAK lagi digenerate sistem: Marketing
   membuat sendiri PDF-nya lalu MENGUNGGAH berkasnya di sini (ev.penawaran.file),
   dan siapa pun tinggal membukanya untuk dibaca. Berkas disimpan di server lewat
   uploadReceipt, sama seperti lampiran event & bukti transfer.
   Keputusan Setujui/Tolak hanya untuk role Manager / Approver (can('approve'));
   Marketing tidak bisa mengirim sebelum status 'Disetujui'.

const PEN_STATUS={
  'Draft':{c:'--muted',t:'Draft'},

  'Terkirim':{c:'--violet',t:'Terkirim ke Client'}
};
const MAKS_PDF_PENAWARAN=40*1024*1024;
function penStatus(ev){ return (ev&&ev.penawaran&&ev.penawaran.status)||null; }
/* Penerima approval = role "Manager / Approver" saja (can('approve')). Super
   Admin ikut lolos karena can() memang selalu meloloskannya — itu akun pemilik
   sistem, bukan role tambahan yang bisa diberikan ke orang lain. */
function bisaPutusPenawaran(){ return can('approve'); }
function penFile(ev){ return (ev&&ev.penawaran&&ev.penawaran.file)||null; }
const ROMAWI=['','I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII'];
function noSuratBaru(){

async function simpanPenawaran(id){
  const ev=S.events.find(e=>e.id===id); if(!ev)return;
  const p=ev.penawaran||{};
  const inp=$('pen_file'), file=inp&&inp.files&&inp.files[0];
  const btn=$('pen_save_btn');
  if(file){
    if(!/\.pdf$/i.test(file.name)&&file.type!=='application/pdf')return toast('Harus PDF','Surat penawaran diunggah dalam format PDF.','err');
    /* Batasnya 40MB — lebih longgar dari lampiran lain (8MB) karena surat
       penawaran sering penuh gambar venue/layout beresolusi tinggi. Sisi server
       punya batas yang sama di save_receipt(); post_max_size PHP juga harus
       ≥ 60M (base64 membengkakkan ~33%), lihat marketing-mysql/.user.ini. */
    if(file.size>MAKS_PDF_PENAWARAN)return toast('File terlalu besar','Berkas PDF maksimal '+(MAKS_PDF_PENAWARAN/1048576)+'MB — punyamu '+(file.size/1048576).toFixed(1)+'MB.','err');
    if(btn){ btn.disabled=true; btn.textContent='Mengunggah PDF… 0%'; }
    try{
      // Bertahap: berkas puluhan MB tidak akan lolos kalau dikirim sekaligus.
      const d=await unggahBertahap(file,pct=>{ if(btn) btn.textContent='Mengunggah PDF… '+pct+'%'; });
      p.file={key:d.key,name:file.name,size:file.size,at:new Date().toISOString(),by:(ME&&ME.name)||''};
    }catch(e){
      if(btn){ btn.disabled=false; btn.textContent='Simpan'; }
      return toast('Gagal unggah','Berkas PDF tidak berhasil diunggah: '+e.message,'err');
    }
  }
  p.noSurat=$('pen_no').value.trim();
  p.validUntil=$('pen_vu').value;
  p.note=$('pen_note').value.trim();
  // Draft baru, atau kembali ke Draft setelah revisi dari Ditolak.
  p.status='Draft';
  ev.penawaran=p;
  logAct('event',id,'Penawaran disimpan',p.noSurat+(file?' · PDF diunggah':''));
  save(); closeModal();
  toast('Penawaran disimpan','No. '+p.noSurat+(p.file?' — ajukan approval ke Manager.':' — unggah PDF-nya dulu sebelum bisa diajukan.'),'ok');
  go('event',id);
}

// `dari` = halaman pemanggil, supaya Manager yang memutuskan dari meja Approval

function putusPenawaran(id,decision,dari){
  if(!bisaPutusPenawaran())return toast('Bukan Approver','Persetujuan penawaran hanya bisa dari role Manager / Approver.','err');
  const ev=S.events.find(e=>e.id===id); if(!ev||!ev.penawaran)return;

  const p=ev.penawaran;

  save(); buildNav(); toast('Penawaran '+decision, ev.nama, decision==='Disetujui'?'ok':'err');

/* ---------- PERHITUNGAN IKUT HIDUP SAAT MENGETIK ----------
   Dulu angka di panel kanan baru bergerak SESUDAH klik Simpan. Orang mengetik
   "Lain-lain 2.500.000", melihat Grand Total tidak berubah, dan menyimpulkan
   angkanya tidak ikut dihitung — padahal cuma layarnya yang belum digambar
   ulang. Sekarang panelnya menghitung ulang tiap ketukan.

   Yang dihitung adalah SALINAN event, bukan event aslinya: menyimpan tetap
   butuh klik Simpan yang disengaja (nilai finance memicu hitung ulang di
   invoice & laporan, jadi tidak boleh berubah hanya karena kursor lewat).
   Salinannya dangkal dengan detail disalin sendiri — kalau ev.detail ikut
   dipakai bersama, mengetik akan mengubah data asli tanpa disimpan. */
function finBayangan(ev){
  const b=Object.assign({},ev,{detail:Object.assign({},ev.detail)});
  ['sewaVenue','biayaTeknis','biayaLain','diskon'].forEach(k=>{
    const el=$('efd_'+k); if(!el)return;
    const d=rupiahDigits(el.value); b.detail[k]=d===''?'':(+d);
  });
  const elFb=$('efd_fbManual'); if(elFb) b.detail.fbManual=fbDariKotak(ev,elFb.value);
  const sv=segVal('efd_svcApply'); if(sv!==undefined)b.detail.svcApply=sv;
  const tx=segVal('efd_taxInclude'); if(tx!==undefined)b.detail.taxInclude=tx;
  const dp=$('efd_dpPercent'); if(dp)b.dpPercent=+dp.value||S.settings.dpPercent;
  // Mode & isi tabel Harga Deal, supaya angka di panel kanan ikut yang di layar
  // sekarang — bukan yang terakhir disimpan.
  const dOn=$('efd_fbDealOn'); if(dOn) b.detail.fbDealOn=dOn.classList.contains('on');
  const dRows=dealBaca('efd_fbDeal'); if(dRows!==undefined) b.detail.fbDeal=dRows;
  return b;
}

// Baca file jadi base64 murni (tanpa prefix data:...;base64,) untuk dikirim ke Apps Script.
function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>resolve(String(r.result).split(',').pop());
    r.onerror=()=>reject(new Error('read_failed'));
    r.readAsDataURL(file);
  });
}
/* Kegagalan unggah dulu muncul sebagai pesan yang menyesatkan: kalau server
   membalas HTML (413 dari web server, halaman error hosting, dsb), res.json()
   melempar "Unexpected token '<'" — dan orang mencari-cari kesalahan di
   berkasnya, padahal masalahnya di server. Di sini badan balasan dibaca
   sebagai teks dulu, jadi status HTTP & isi balasannya ikut terbaca. */
async function kirimApi(payload){
  const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(payload)});
  const teks=await res.text();
  let d=null; try{ d=JSON.parse(teks); }catch(e){}
  if(!d){
    if(res.status===413) throw new Error('server menolak kiriman karena terlalu besar (HTTP 413)');
    throw new Error('server membalas bukan JSON (HTTP '+res.status+'): '+teks.slice(0,120).replace(/\s+/g,' '));
  }
  if(!d.ok) throw new Error(d.error||'ditolak server');
  return d.data;
}
/* Unggah BERTAHAP — potongan ~2MB per permintaan.
   Alasannya bukan kerapian: mengirim berkas besar dalam satu POST tidak bisa
   diandalkan di shared hosting. Base64 membengkakkan ukuran ~33%, lalu
   post_max_size PHP (bawaan 8M) MEMBUANG seluruh body sebelum PHP jalan —
   batas yang tidak bisa diubah dari kode aplikasi. Dengan dipotong, unggahan
   40MB tetap jalan walau batas server tidak pernah dinaikkan. */
const CHUNK_UNGGAH=2*1024*1024;
async function unggahBertahap(file,onProgress){
  const uploadId=uid('up')+'-'+Date.now().toString(36);
  const total=Math.max(1,Math.ceil(file.size/CHUNK_UNGGAH));
  let hasil=null;
  for(let i=0;i<total;i++){
    const potong=file.slice(i*CHUNK_UNGGAH,(i+1)*CHUNK_UNGGAH);
    const b64=await fileToBase64(potong);
    hasil=await kirimApi({action:'uploadChunk',uploadId,seq:i,last:(i===total-1),
      dataBase64:b64,fileName:file.name,mimeType:file.type||'application/octet-stream'});
    if(onProgress) onProgress(Math.round((i+1)/total*100));
  }
  if(!hasil||!hasil.key) throw new Error('server tidak mengembalikan key berkas');
  return hasil;
}
async function savePayment(id,paymentId){
  const ev=S.events.find(e=>e.id===id);
  const existing=paymentId?(ev.payments||[]).find(x=>x.id===paymentId):null;
  const amt=+rupiahDigits($('pay_amt').value); if(!amt)return toast('Isi jumlah','Jumlah pembayaran wajib.','err');
  const fileInp=$('pay_receipt_file'), file=fileInp&&fileInp.files&&fileInp.files[0];
  const note=$('pay_note').value.trim();
  const btn=$('pay_save_btn');
  let receiptUrl=existing?(existing.receiptUrl||''):'', receiptName=note||(existing?existing.receipt:'')||'';
  if(file){
    if(file.size>8*1024*1024) return toast('File terlalu besar','Bukti transfer maksimal 8MB.','err');
    if(btn){ btn.disabled=true; btn.textContent='Mengunggah bukti...'; }
    try{
      const b64=await fileToBase64(file);
      const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify({action:'uploadReceipt',fileName:file.name,mimeType:file.type,dataBase64:b64})});
      const data=await res.json();
      if(!data||!data.ok){ if(btn){btn.disabled=false;btn.textContent=existing?'Simpan Perubahan':'Verifikasi & Simpan';} return toast('Gagal unggah','Bukti transfer gagal diunggah'+(data&&data.error?': '+data.error:'')+'. Coba lagi.','err'); }
      // Backend balas {key,name}; URL tampil dibangun dari key (file disajikan
      // oleh api.php action=receipt). Disimpan penuh agar link tetap benar.
      receiptUrl=API_URL+'?action=receipt&key='+encodeURIComponent(data.data.key);
      receiptName=note||data.data.name;
    }catch(e){
      if(btn){ btn.disabled=false; btn.textContent=existing?'Simpan Perubahan':'Verifikasi & Simpan'; }
      return toast('Gagal unggah','Tidak bisa menghubungi server untuk unggah bukti. Coba lagi.','err');
    }
  }
  let p;
  if(existing){
    Object.assign(existing,{type:$('pay_type').value,amount:amt,method:$('pay_method').value,at:$('pay_date').value,receipt:receiptName,receiptUrl:receiptUrl});
    p=existing;
    logAct('event',id,'Pembayaran diedit',p.no+' · '+p.type+' '+rp(amt));
  } else {
    // Invoice tetap 1 per event; tiap pembayaran dapat KWITANSI bernomor sendiri.
    p={id:uid('p'),no:kwitansiNo(),type:$('pay_type').value,amount:amt,method:$('pay_method').value,at:$('pay_date').value,receipt:receiptName,receiptUrl:receiptUrl,verified:true,by:ME.name};
    ev.payments=ev.payments||[]; ev.payments.push(p);
    logAct('event',id,'Pembayaran diverifikasi',p.no+' · '+p.type+' '+rp(amt));
    pushNotif('payment','Pembayaran masuk',ev.nama+': '+p.type+' '+rp(amt)+' terverifikasi.','#event/'+id);
  }
  const f=eventFinance(ev);
  save(); closeModal();
  toast(existing?'Pembayaran diperbarui':'Pembayaran tercatat',p.no+' · '+(f.remaining<=0?'Lunas! ⚓':'Sisa '+rp(f.remaining)),'ok');
  curTab='finance'; go('event',id); // mendarat di tab Finance: daftar pembayaran & kwitansi ada di sana
}
function deletePayment(id,paymentId){
  if(!(can('verify_payment')||ME.role==='super_admin'))return toast('Akses ditolak','Kamu tidak punya izin menghapus pembayaran.','err');
  const ev=S.events.find(e=>e.id===id); if(!ev)return;
  const p=(ev.payments||[]).find(x=>x.id===paymentId); if(!p)return;
  if(!confirm('Hapus pembayaran '+(p.no||'')+' · '+p.type+' '+rp(p.amount)+'? Tindakan ini tidak bisa dibatalkan.'))return;
  ev.payments=ev.payments.filter(x=>x.id!==paymentId);

  toast('Pembayaran dihapus','Sisa sekarang '+rp(eventFinance(ev).remaining),'ok');

}

function fmtFieldVal(fl,val){
  if(fl.t==='mirror'){
    if(Array.isArray(fl.from)) return (val==null||val==='')?null:String(val);
    const src=fieldByKey(fl.from);
    return src?fmtFieldVal(src,val):((val==null||val==='')?null:String(val));
  }
  if(val==null||val===''||(Array.isArray(val)&&!val.length))return null;
  if(fl.t==='menutbl')return fmtMenuTbl(val);
  if(fl.t==='barangtbl'){
    const rows=Array.isArray(val)?val:[]; if(!rows.length)return null;
    return rows.map(r=>(r.barang||'')+[r.tgl,r.jam].filter(Boolean).join(' ').replace(/^(.)/,' — $1')).join('\n');
  }
  if(fl.t==='itemtbl'){
    const rows=Array.isArray(val)?val:[]; if(!rows.length)return null;
    let sum=0; rows.forEach(r=>{ if(r.nominal!=='' && r.nominal!=null) sum+=+r.nominal||0; });
    const baris=rows.map(r=>(r.nama||'—')+((r.nominal!==''&&r.nominal!=null)?' — '+rp(r.nominal):''));
    if(sum) baris.push('Total: '+rp(sum));
    return baris.join('\n');
  }
  if(fl.t==='rundown'){ const rows=rundownRows(val); if(!rows.length)return null;
    return rows.map(r=>{
      const jam=[r.mulai,r.selesai].filter(Boolean).join('–');
      const dur=r.durasi?' ('+r.durasi+' mnt)':'';
      return (jam?jam+dur+' — ':'')+(r.kegiatan||'');
    }).join('\n'); }
  if(fl.t==='ynnote'){ const o=ynnoteVal(val); if(o.v===undefined&&!o.note)return null; return (o.v?'Ya':'Tidak')+(o.note?' — '+o.note:''); }
  if(fl.t==='multi')return val.join(', ');
  if(fl.t==='tog')return (val===true||(val&&val.v))?'Ya':null;
  if(fl.t==='yn'){ const v=val&&val.v!==undefined?val.v:val; return v===true?'Ya':v===false?'Tidak':null; }
  if(fl.t==='cur')return rp(val);
  if(fl.t==='num')return String(val);
  return String(val);
}

      if(pdfLewati(fl.k)) return;                        // "...Lain" sudah digabung ke induknya

        +'<div class="ov-tgl">'+fmtDateLong(ev.tanggal)+'</div></div>'

    +'<div class="ov-klien">'
      +'<div><b>Client</b> · '+esc(c?c.nama:'—')+(c&&c.perusahaan?' — '+esc(c.perusahaan):'')+'</div>'
      +'<div><b>Marketing PIC</b> · '+esc(userName(ev.mktPIC))+'</div>'
      +'<div><b>Jenis</b> · '+esc(ev.jenis||'—')+'</div>'
      +'<div><b>Estimasi</b> · '+(ev.pax||'—')+' pax</div>'

  return '<div class="ov-doc">'+kop+sorot

/* ============ ALAT BANTU CETAK (PDF) ============

const PDF_GARIS='1px solid #e5e2da';

/* Barang masuk (Security) juga lebih terbaca sebagai tabel. */
function pdfBarangTabel(val){
  const rows=Array.isArray(val)?val:[];
  if(!rows.length) return null;
  let h=pdfTblBuka([{l:'Barang'},{l:'Tanggal',w:'150px'},{l:'Jam',w:'70px'}]);

/* Item tambahan (Kasir) — nama + nominal. */
function pdfItemTabel(val){
  const rows=Array.isArray(val)?val:[];
  if(!rows.length) return null;
  let total=0;
  let h=pdfTblBuka([{l:'Item'},{l:'Nominal',w:'130px',r:1}]);
  rows.forEach((r,i)=>{
    if(r.nominal!==''&&r.nominal!=null) total+=+r.nominal||0;
    h+=pdfTblBaris([{v:r.nama||'—'},{v:(r.nominal!==''&&r.nominal!=null)?rp(r.nominal):'',r:1}],i);

    +'<td style="padding:5px 8px;border:'+PDF_GARIS+';text-align:right;font-weight:700">'+rp(total)+'</td></tr>';
  return h+'</tbody></table>';
}
/* Gambar lampiran ikut tercetak. Dibatasi tingginya supaya satu denah tidak
   memakan satu halaman penuh, dan diberi keterangan namanya. */
/* Hanya baris yang BENAR-BENAR memuat gambar yang dilebarkan. Lampiran
   yang isinya cuma PDF/dokumen tetap memakai tata letak dua kolom biasa —
   melebarkan daftar tautan tidak ada gunanya, malah bikin renggang. */
function pdfAdaGambar(val){ return Array.isArray(val) && val.some(fotoKah); }
function pdfGambar(arr){
  const semua=Array.isArray(arr)?arr:[];
  const g=semua.filter(fotoKah), lain=semua.filter(f=>!fotoKah(f));
  if(!semua.length) return null;
  let h='';
  if(g.length){
    /* Satu gambar = biasanya denah venue, dan itu memang harus dibaca —
       diberi lebar penuh. Lebih dari satu dibagi dua per baris, bukan
       tiga, supaya tetap cukup besar untuk melihat letak meja & panggung.
       Ukuran dalam persen, jadi ikut lebar wadahnya: kolom nilai di
       Overview maupun lebar halaman cetak. */
    const satu=g.length===1;
    h+='<div class="ov-imgs" style="display:flex;flex-wrap:wrap;gap:10px;margin:6px 0">'
      +g.map(f=>'<figure style="margin:0;flex:1 1 '+(satu?'100%':'46%')+';min-width:0">'
        +'<img src="'+esc(attachUrl(f.key))+'" alt="'+esc(f.name||'')+'" '
        +'style="width:100%;max-height:'+(satu?'520':'340')+'px;object-fit:contain;'
        +'border:'+PDF_GARIS+';border-radius:6px;background:#faf9f5">'
        +'<figcaption style="font-size:9.5px;color:#888;margin-top:3px">'+esc(f.name||'')+'</figcaption></figure>').join('')
      +'</div>';
  }
  // Berkas non-gambar (PDF rundown, dsb) TIDAK boleh hilang begitu saja —
  // tidak bisa ditampilkan sebagai gambar, tapi tetap harus terdaftar dan
  // bisa dibuka. Menghilangkannya membuat lampiran terlihat tidak ada.
  if(lain.length){
    h+='<div style="font-size:11px;margin-top:4px">'
      +lain.map(f=>'<a href="'+esc(attachUrl(f.key))+'" target="_blank" rel="noopener">'
        +esc(f.name||f.key)+'</a>').join('<br>')+'</div>';
  }
  return h||null;
}
/* Pasangan "pilihan + tulis sendiri": kalau jawabannya Lainnya, yang
   dicetak CUKUP ketikannya. Mencetak keduanya ("Lainnya" lalu "Jenis
   Dekorasi Lainnya: kain putih") membuat dokumen bertele-tele dan terbaca
   seperti dua jawaban berbeda. */
const PDF_LAINNYA={
  jenis:'jenisLain', area:'areaLain', areaPakai:'areaPakaiLain',
  decorJenis:'decorJenisLain', decorLM:'decorLMLain', fbFormat:'fbFormatLain',
  plating:'platingLain', floorTambah:'floorTambahLain', materiDesain:'materiDesainLain',
  ketentuanBill:null
};
function pdfLewati(k){
  // field "...Lain" tidak dicetak sendiri — isinya sudah digabung ke induknya
  for(const induk in PDF_LAINNYA) if(PDF_LAINNYA[induk]===k) return true;
  return false;
}
function pdfNilai(fl,ev){
  if(fl.t==='salinlayout') return {h:null};       // tombol, tidak ikut dicetak
  const val=detailVal(ev,fl);
  if(fl.t==='rundown')  return {h:pdfRundownTabel(val)};
  if(fl.t==='menutbl')  return {h:pdfMenuTabel(val,fl.bar)};
  if(fl.t==='barangtbl')return {h:pdfBarangTabel(val)};
  if(fl.t==='itemtbl')  return {h:pdfItemTabel(val)};
  if(fl.t==='files')    return {h:pdfGambar(val)};
  if(fl.jadwal){
    const jam=fmtFieldVal(fl,val), tbl=pdfJadwalTabel(ev);
    if(!tbl) return {h:jam?esc(String(jam)):null};
    return {h:(jam?'<div style="margin-bottom:6px">'+esc(String(jam))+'</div>':'')+tbl};
  }
  let s=fmtFieldVal(fl,val);
  if(s==null||s==='') return {h:null};
  // gabungkan "Lainnya" dengan ketikannya
  const lain=PDF_LAINNYA[fl.k];
  if(lain){
    const isi=(ev.detail[lain]||'').trim();
    if(isi){
      s=String(s).split(', ').map(x=>x==='Lainnya'?isi:x).join(', ');
      if(!s.includes(isi)) s=isi;
    }
  }
  return {h:esc(String(s)).replace(/\n/g,'<br>')};
}

/* Menunggu semua <img> di wadah selesai dimuat (atau gagal) sebelum dicetak.
   Lampiran gambar diambil dari server (api.php?action=receipt), jadi saat
   innerHTML baru diisi gambarnya BELUM ada isinya — kalau window.print()
   langsung dipanggil, dialog cetak memotret dokumen yang gambarnya masih
   kosong dan PDF-nya keluar tanpa denah/layout. Diberi batas waktu supaya
   satu berkas yang mati tidak membuat tombol Print seolah tidak berfungsi. */
function tungguGambar(area,batasMs){
  const imgs=[...area.querySelectorAll('img')].filter(im=>!im.complete||!im.naturalWidth);
  if(!imgs.length) return Promise.resolve();
  const semua=Promise.all(imgs.map(im=>new Promise(res=>{
    im.addEventListener('load',res,{once:true});
    im.addEventListener('error',res,{once:true});   // gambar rusak jangan menahan cetak
  })));
  return Promise.race([semua,new Promise(res=>setTimeout(res,batasMs||6000))]);
}
async function printBrief(){
  const area=$('print-area');
  area.innerHTML=window._printDoc||'';
  /* display:none tidak menghentikan pemuatan gambar, tapi loading="lazy" bisa —
     wadah cetak tidak pernah masuk viewport, jadi paksa eager. */
  area.querySelectorAll('img').forEach(im=>{ im.loading='eager'; im.decoding='sync'; });
  // Kabari kalau memang ada yang ditunggu — tanpa ini tombol Print terasa mati
  // beberapa detik saat lampirannya besar.
  if([...area.querySelectorAll('img')].some(im=>!im.complete||!im.naturalWidth))
    toast('Menyiapkan dokumen','Memuat gambar lampiran dulu supaya ikut tercetak.','ok');
  await tungguGambar(area);
  /* Dikosongkan lagi sesudah dialog cetak selesai. CSS sudah menyembunyikannya
     dari layar, tapi menyisakan satu dokumen penuh di DOM berarti gambar &
     tabelnya tetap dimuat dan ikut terbaca pembaca layar tanpa alasan.
     onafterprint dipasang sekali saja — kalau tidak, tiap kali tombol Print
     ditekan akan menumpuk satu pendengar baru. */
  window.print();
}
window.addEventListener('afterprint',function(){

});

  const statusOpts=['Lead','Prospect','Quotation Terkirim','Negotiation','Deal','Event Done','Lost'];

  h+='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><h3 style="font-size:18px">'+MONTHS_F[calDate.getMonth()]+' '+calDate.getFullYear()+'</h3>';

  h+='<div class="cal">'+DAYS.map(d=>'<div class="dow">'+d+'</div>').join('');
  const y=calDate.getFullYear(),m=calDate.getMonth();
  const first=new Date(y,m,1).getDay(); const dim=new Date(y,m+1,0).getDate(); const prevDim=new Date(y,m,0).getDate();
  const cells=[];
  for(let i=first-1;i>=0;i--)cells.push({d:prevDim-i,other:true});
  for(let i=1;i<=dim;i++)cells.push({d:i,other:false});
  while(cells.length%7)cells.push({d:cells.length-dim-first+1,other:true});
  cells.forEach(cell=>{
    const ds=cell.other?'':y+'-'+String(m+1).padStart(2,'0')+'-'+String(cell.d).padStart(2,'0');
    const isToday=ds===today();
    const evs=cell.other?[]:S.events.filter(e=>e.tanggal===ds&&(calStatusFilter?e.status===calStatusFilter:e.status!=='Lost'));
    h+='<div class="cell'+(cell.other?' other':'')+(isToday?' today':'')+'"><div class="dn">'+cell.d+'</div>';

    h+='</div>';
  });
  h+='</div></div>';
  V.innerHTML=h;
}

    h+='<div class="cell-sub papan-kosong">Belum ada tugas. Tambahkan di bawah.</div>';
  }
  if(bisaUbah) h+='<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">'
    +'<input class="inp" id="fb_sub" placeholder="Sub kategori (mis. Persiapan, Hari-H)…" style="max-width:280px" onkeydown="if(event.key===\'Enter\'){event.preventDefault();addFreeTask(\''+e.id+'\');}">'
    +'<button class="btn sm" onclick="addFreeTask(\''+e.id+'\')">'+svg(IC.plus)+'Tambah tugas</button></div>';
  return h+'</div>';
}
function taskBoard(e,cats,subFilter){
  const bisaUbah=can('edit_task');
  const c=eventItemCount(e);
  if(!cats.length) return freeBoard(e);
  let h='<div class="card papan-total">'
    +'<div class="papan-total-l"><div class="eyebrow">Progres Keseluruhan</div>'
      +'<div class="progress" style="margin-top:8px"><div class="bar" style="width:'+c.pct+'%"></div></div></div>'
    +'<div class="papan-total-r"><div class="papan-pct">'+c.pct+'%</div>'
      +'<div class="papan-frac"><b>'+c.selesai+'</b>/'+c.total+'</div>'
      +'<div class="eyebrow">item selesai</div></div></div>';

  let hmOpts=''; for(let i=0;i<=120;i+=5) hmOpts+='<option value="'+i+'">';
  h+='<datalist id="xj_hm_opts">'+hmOpts+'</datalist>';

  cats.forEach(div=>{
    const items=eventDivTemplates(e,div).filter(t=>!subFilter||t.extra||(t.sub||'')===subFilter);
    const sel=items.filter(tpl=>jobSelesai(e,div,tpl.id)).length;
    const pr=subFilter?subProgress(e,div,subFilter):divProgress(e,div);
    const dj=escJs(div);
    h+='<div class="card papan-sec">'
      +'<div class="papan-sec-h"><h3 class="papan-sec-t">'+esc(div)+(subFilter?' · '+esc(subFilter):'')+'</h3>'
        +'<span class="cell-sub papan-frac-kecil">'+sel+'/'+items.length+'</span>'
        +'<div class="progress papan-sec-bar"><div class="bar" style="width:'+pr+'%"></div></div>'
        +'<span class="papan-sec-pct">'+pr+'%</span></div>';
    if(!items.length){
      h+='<div class="cell-sub papan-kosong">Belum ada job. Tambahkan di bawah, atau susun standarnya di Template Task.</div>';
    }else{
      h+='<div class="tbl-wrap"><table class="tbl papan-tbl"><thead><tr>'
        +'<th style="width:34px"></th><th>Item</th><th style="width:74px">Timeline</th>'
        +'<th style="width:150px">PIC</th><th style="width:150px">Deadline</th>'
        +'<th>Catatan</th>'
        +(bisaUbah?'<th style="width:80px"></th>':'')+'</tr></thead><tbody>';
      /* Baris judul sub kategori disisipkan di TENGAH tabel, bukan dibuat tabel
         terpisah per kelompok: kolom PIC/Deadline/Progress harus tetap lurus
         dari atas ke bawah.

         Itemnya dikelompokkan ulang supaya tiap sub kategori muncul sekali —
         kalau hanya menandai "sub berganti" pada urutan aslinya, sub yang
         itemnya berselang-seling akan mencetak judul yang sama berkali-kali.
         Pengurutannya STABIL: urutan di dalam satu kelompok tetap seperti
         aslinya, dan job tambahan tetap di paling bawah.

         Urutan kelompok diambil dari sub kategori milik SEMUA div yang
         menyumbang item — untuk Kitchen itu berarti sub milik Kitchen sendiri
         plus sub milik cabang F&B yang sedang aktif. */
      const kolom=6+(bisaUbah?1:0);
      /* Item TAMBAHAN ikut dikelompokkan menurut sub kategorinya, sama seperti
         item dari template. Dulu sub-nya dipaksa kosong di sini (`tpl.extra?'':…`)
         sehingga semua item tambahan jatuh ke satu tumpukan di dasar tabel —
         itulah sebabnya "Tambah Item" terasa tidak bisa per grouping padahal
         datanya sejak awal punya field `sub`. Di dalam satu kelompok, item
         template tetap di atas dan tambahan menyusul di bawahnya. */
      const urutSub=[''];
      [...new Set(items.map(t=>t.div))].forEach(d=>subsOf(d).forEach(sc=>{ if(urutSub.indexOf(sc.nama)<0) urutSub.push(sc.nama); }));
      // Sub yang sudah tidak terdaftar lagi tetap dapat kelompoknya (di ekor), bukan hilang.
      items.forEach(t=>{ const sb=t.sub||''; if(urutSub.indexOf(sb)<0) urutSub.push(sb); });
      const urut=[];
      urutSub.forEach(nm=>{
        items.forEach(t=>{ if(!t.extra && (t.sub||'')===nm) urut.push(t); });
        items.forEach(t=>{ if(t.extra  && (t.sub||'')===nm) urut.push(t); });
      });
      let subKini=null;
      urut.forEach(tpl=>{
        const id=tpl.id, a="'"+e.id+"','"+dj+"','"+id+"'";
        const subIni=tpl.sub||'';
        if(subIni!==subKini){
          subKini=subIni;
          if(subIni) h+='<tr class="papan-subhead"><td colspan="'+kolom+'">'+esc(subIni)
            +(bisaUbah?'<button type="button" class="sub-tambah" title="Tambah item ke '+esc(subIni)+'" onclick="addExtraJob(\''+e.id+'\',\''+dj+'\',\''+escJs(subIni)+'\')">'+svg(IC.plus)+'item</button>':'')
            +'</td></tr>';
        }
        const done=jobSelesai(e,div,id);
        /* Label "cabang" DIBUANG bersama pelipatan ke Kitchen. Dulu ia menandai
           item yang div-nya berbeda dari kartu tempatnya menumpang; sekarang
           tidak ada lagi item yang menumpang — Format F&B punya kartunya
           sendiri, jadi tpl.div selalu sama dengan div dan labelnya tidak akan
           pernah muncul lagi. */
        const tag=tpl.extra?' <span class="tag" style="background:var(--gold-glow);color:var(--gold-deep)">tambahan</span>':'';
        h+='<tr class="papan-row'+(done?' is-done':'')+'">'
          +'<td>'+(bisaUbah
              ? '<button class="papan-cek'+(done?' on':'')+'" title="'+(done?'Tandai belum selesai':'Tandai selesai')+'" '
                +'onclick="toggleJobSelesai('+a+')">'+(done?svg(IC.check):'')+'</button>'
              : '<span class="papan-cek'+(done?' on':'')+'">'+(done?svg(IC.check):'')+'</span>')+'</td>'
          // Nama job: yang dari template ikut template (diubah di Template Task
          // supaya berlaku untuk semua event); yang tambahan diketik di sini.
          +'<td>'+(tpl.extra&&bisaUbah
              ? '<input class="inp jb-in" data-job="'+id+'" value="'+esc(tpl.task||'')+'" placeholder="Nama item…" onchange="setExtraJob('+a+',\'task\',this.value)">'
              : '<span class="papan-nama">'+esc(tpl.task||'(tanpa nama)')+'</span>'+tag)+'</td>'
          +'<td>'+(tpl.extra&&bisaUbah
              ? '<input class="inp jb-in" type="number" min="0" step="5" list="xj_hm_opts" value="'+(tpl.hminus!=null?tpl.hminus:'')+'" placeholder="H-" onchange="setExtraJob('+a+',\'hminus\',this.value)">'
              : '<span class="papan-tl">'+(tpl.hminus!=null?'H-'+tpl.hminus:'—')+'</span>')+'</td>'
          +'<td>'+picSelectHTML(jobField(e,div,tpl,'pic'),
              (tpl.extra?'setExtraJob('+a+',&quot;pic&quot;,this.value)':'setJobMeta('+a+',&quot;pic&quot;,this.value)'),
              bisaUbah)+'</td>'
          +'<td><input class="inp jb-in" type="date" value="'+esc(jobField(e,div,tpl,'deadline'))+'" '
              +(bisaUbah?'onchange="'+(tpl.extra?'setExtraJob('+a+',\'deadline\',this.value)':'setJobMeta('+a+',\'deadline\',this.value)')+'"':'disabled')+'></td>'
          +'<td><input class="inp jb-in" placeholder="Catatan…" value="'+esc(jobField(e,div,tpl,'note'))+'" '
              +(bisaUbah?'onchange="'+(tpl.extra?'setExtraJob('+a+',\'note\',this.value)':'setJobMeta('+a+',\'note\',this.value)')+'"':'disabled')+'></td>'
          +(bisaUbah?'<td><div class="pill-row" style="flex-wrap:nowrap">'
              +'<button class="btn sm" title="Ingatkan PIC via WhatsApp" onclick="remindWA('+a+')">'+svg(IC.wa)+'</button>'
              +(tpl.extra?'<button class="btn sm" title="Hapus item tambahan" onclick="delExtraJob('+a+')">'+svg(IC.trash)+'</button>':'')
              +'</div></td>':'')
          +'</tr>';
      });
      h+='</tbody></table></div>';
    }
    /* Tombol di kaki kartu menambah item TANPA sub kategori. Untuk menambah ke
       dalam sebuah kelompok, tombolnya menempel di judul kelompok itu — di sana
       jelas ke mana itemnya akan mendarat. */
    if(bisaUbah)
      h+='<button class="papan-tambah" onclick="addExtraJob(\''+e.id+'\',\''+dj+'\')">'+svg(IC.plus)+'Tambah item tanpa sub kategori…</button>';
    h+='</div>';
  });
  return h;
}

/* ============================================================
   TEMPLATE TASK — per divisi (Task, PIC, Deadline, Catatan, Progress)
   ============================================================ */
function hminusBadge(v){ return v!=null?'<span class="tag" style="background:var(--info-bg);color:var(--info)">H-'+v+'</span>':'—'; }
/* Satu tabel item to-do. Dipakai dua kali per kategori: sekali untuk item yang
   belum masuk sub kategori mana pun, dan sekali untuk tiap sub kategori. */
function tmplTable(div,sub,canEdit){
  const items=subDivTemplates(div,sub);
  const dj=escJs(div), sj=escJs(sub||'');
  if(!items.length) return '<div class="cell-sub" style="padding:4px 0 8px">Belum ada item.'
    +(canEdit?' <button class="btn sm" style="margin-left:6px" onclick="newTemplateTask(\''+dj+'\',\'\',\''+sj+'\')">'+svg(IC.plus)+'Tambah item</button>':'')+'</div>';
  let h='<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Task</th><th>PIC</th><th>H-</th><th>Deadline</th><th>Catatan</th>'+(canEdit?'<th></th>':'')+'</tr></thead><tbody>';
  items.forEach(t=>{
    h+='<tr><td class="cell-strong">'+esc(t.task)+'</td><td>'+esc(t.pic||'—')+'</td><td class="mono">'+hminusBadge(t.hminus!=null?t.hminus:null)+'</td><td class="mono">'+(t.deadline?fmtDate(t.deadline):'—')+'</td><td class="cell-sub">'+esc(t.note||'')+'</td>'
      +(canEdit?'<td><div class="pill-row"><button class="btn sm" onclick="newTemplateTask(\''+dj+'\',\''+t.id+'\')">'+svg(IC.edit)+'</button><button class="btn sm" onclick="delTemplateTask(\''+t.id+'\')">'+svg(IC.trash)+'</button></div></td>':'')+'</tr>';
  });
  return h+'</tbody></table></div>';
}
/* Kartu satu kategori. Isinya tiga tingkat:
     kategori  ->  sub kategori  ->  item to-do
   Sub kategori bersifat OPSIONAL — item lama yang tidak punya sub tetap tampil
   di kelompok tanpa nama paling atas, bukan disembunyikan. */
/* delFn = nama fungsi penghapus kategori ini ('delTaskCategory' /
   'delFbFormat'), atau '' kalau kategorinya memang tidak boleh dihapus.
   Dulu parameter ini boolean `deletable` dan penghapusnya dipatok
   delTaskCategory — begitu ada kategori jenis kedua (Format F&B) yang
   pembersihannya berbeda, boolean itu tidak cukup lagi. */
/* extraBtn = HTML tombol tambahan khusus jenis kartu ini (ubah nama, salin).
   Kartu kategori lama tidak mendapatkannya: mengubah namanya percuma karena ia
   memang sedang menunggu dipindah, dan menyalin dari/ke sana cuma menambah
   tempat yang harus dibereskan. */
function tmplCard(div,canEdit,delFn,subtitle,extraBtn){
  const items=divTemplates(div), subs=subsOf(div), dj=escJs(div);
  const tutup=tmplDitutup(div);
  /* Judulnya sendiri yang jadi tombol buka/tutup — sasaran klik yang besar dan
     jelas. Jumlah item & sub tetap tampil saat tertutup, supaya menutup tidak
     berarti kehilangan gambaran isinya. */
  let h='<div class="card'+(tutup?' tmpl-tutup':'')+'" style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;'+(tutup?'':'margin-bottom:12px')+'">'
    +'<button type="button" class="tmpl-judul" aria-expanded="'+(tutup?'false':'true')+'" onclick="toggleTmplCard(&quot;'+esc(dj)+'&quot;)" title="'+(tutup?'Buka':'Tutup')+' isi kategori ini">'
    +'<span class="tmpl-kar">'+svg(IC.chevR)+'</span>'
    +'<span style="min-width:0"><h3 style="font-size:16px">'+esc(div)+' <span class="tag">'+items.length+'</span>'
    +(subs.length?' <span class="tag">'+subs.length+' sub</span>':'')+'</h3>'+(subtitle?'<div class="cell-sub" style="margin-top:3px">'+subtitle+'</div>':'')+'</span></button><div class="pill-row">'
    +(canEdit?(extraBtn||''):'')
    +(canEdit?'<button class="btn sm" onclick="newSubCat(\''+dj+'\')">'+svg(IC.plus)+'Sub Kategori</button>':'')
    +(canEdit?'<button class="btn sm pri" onclick="newTemplateTask(\''+dj+'\')">'+svg(IC.plus)+'Tambah Task</button>':'')
    +(canEdit&&delFn?'<button class="btn sm" onclick="'+delFn+'(\''+dj+'\')">'+svg(IC.trash)+'</button>':'')+'</div></div>';
  /* Tertutup = isinya TIDAK digambar sama sekali, bukan disembunyikan CSS.
     Halaman ini bisa memuat ratusan baris tabel; menggambar semuanya lalu
     menyembunyikannya membuat halaman berat tanpa ada yang melihatnya. */
  if(tutup) return h+'</div>';
  if(!items.length && !subs.length) h+='<div class="cell-sub" style="padding:6px 0">—</div>';
  else{
    // Item tanpa sub kategori: hanya ditampilkan kalau memang ada isinya, supaya
    // kategori yang sudah rapi ber-sub tidak menyisakan kelompok kosong.
    if(subDivTemplates(div,'').length){
      if(subs.length) h+='<div class="eyebrow" style="margin:2px 0 6px">Tanpa sub kategori</div>';
      h+=tmplTable(div,'',canEdit);
    }
    subs.forEach(sc=>{
      const n=subDivTemplates(div,sc.nama).length;
      /* Urutan sub kategori diatur dengan menarik KEPALANYA. Yang draggable
         hanya kepala, bukan seluruh blok: kalau bloknya ikut, memilih teks di
         dalam tabel dan menekan tombolnya akan ikut memicu drag. */
      h+='<div class="sc-head'+(canEdit?' bisa-tarik':'')+'"'+(canEdit?' draggable="true"':'')
        +' data-sc="'+esc(sc.id)+'" data-scdiv="'+esc(div)+'">'
        +(canEdit?'<span class="sc-grip" title="Tarik untuk mengubah urutan">&#8942;&#8942;</span>':'')
        +'<div class="cell-strong" style="font-size:13.5px;flex:1;min-width:0">'+esc(sc.nama)+' <span class="tag">'+n+'</span></div>'
        +(canEdit?'<div class="pill-row"><button class="btn sm" draggable="false" onclick="newTemplateTask(\''+dj+'\',\'\',\''+escJs(sc.nama)+'\')">'+svg(IC.plus)+'Item</button>'
          +'<button class="btn sm" draggable="false" onclick="renameSubCat(\''+sc.id+'\')">'+svg(IC.edit)+'</button>'
          +'<button class="btn sm" draggable="false" onclick="delSubCat(\''+sc.id+'\')">'+svg(IC.trash)+'</button></div>':'')
        +'</div>';
      h+=tmplTable(div,sc.nama,canEdit);
    });
  }
  return h+'</div>';
}
/* ---------- KATEGORI DITUTUP / DIBUKA ----------
   Disimpan di localStorage, BUKAN di S. Ini keadaan tampilan milik satu orang
   di satu browser: kalau ikut S, menutup Prasmanan di layar sendiri akan ikut
   menutupnya di layar semua orang begitu tersinkron — perubahan data kantor
   untuk sesuatu yang cuma soal enak dilihat. Gagal baca/tulis tidak boleh
   menjatuhkan halaman, jadi semuanya dibungkus try. */
const KEY_TUTUP = KEY + '_tmpl_tutup';
let tmplTutup = (function(){ try{ return JSON.parse(localStorage.getItem(KEY_TUTUP)||'{}')||{}; }catch(_){ return {}; } })();
function simpanTutup(){ try{ localStorage.setItem(KEY_TUTUP, JSON.stringify(tmplTutup)); }catch(_){} }
/* BAWAANNYA TERTUTUP. Sebelumnya semua kategori terbuka begitu halaman dibuka,
   sehingga ratusan baris tabel tergambar sekaligus dan yang dicari justru
   tenggelam. Sekarang halaman ini membuka sebagai daftar kategori; isinya
   dibuka satu per satu sesuai yang sedang dikerjakan.

   Nilainya disimpan EKSPLISIT (0 = dibuka, 1 = ditutup), bukan "ada/tidak ada
   kuncinya". Dengan bawaan tertutup, menghapus kunci berarti kembali tertutup —
   jadi kategori yang sengaja dibuka tidak akan pernah bisa bertahan. */
function tmplDitutup(div){ return tmplTutup[div]!==0; }
function toggleTmplCard(div){
  tmplTutup[div] = tmplDitutup(div) ? 0 : 1;
  simpanTutup(); go('templates');
}
/* Buka/tutup SEMUA sekaligus. Dengan kategori yang banyak, membuka satu per
   satu untuk mencari sesuatu lebih lama daripada sekadar menggulir. */
function toggleSemuaTmpl(){
  const semua=getFbFormats().concat(kategoriLama());
  const adaTerbuka=semua.some(d=>!tmplDitutup(d));
  tmplTutup={};
  semua.forEach(d=>{ tmplTutup[d]= adaTerbuka ? 1 : 0; });
  simpanTutup(); go('templates');
}
/* Kategori lama = template yang div-nya masih nama DIVISI, sisa dari waktu
   divisi masih jadi kategori to-do. Tidak dihapus dan tidak dipindah
   diam-diam: menebak formatnya salah berarti menaruh pekerjaan di event yang
   keliru, dan menghapusnya berarti membuang daftar yang sudah disusun tim. */
function kategoriLama(){
  return getCats().filter(d=>divTemplates(d).length || subsOf(d).length);
}
function renderTemplates(V){
  const canEdit=can('edit_template');
  const fmts=getFbFormats(), lama=kategoriLama();
  let h=pageHead('Template','Template Task','Standar to-do per Format F&B — jadi acuan handover & isi papan Task Divisi.',
    (function(){
      const semua=fmts.concat(lama);
      const adaTerbuka=semua.some(d=>!tmplDitutup(d));
      return (semua.length?'<button class="btn" onclick="toggleSemuaTmpl()">'
        +(adaTerbuka?'Tutup semua':'Buka semua')+'</button>':'')
        +(canEdit?'<button class="btn pri" onclick="newFbFormat()">'+svg(IC.plus)+'Tambah Kategori</button>':'');
    })());
  h+='<div class="tbl-note" style="margin:0 0 14px">'+svg(IC.alert)
   +'<span>Tiap event mengambil <b>satu kategori</b> to-do — kategori yang dipakai mengikuti isian <em>Format F&amp;B</em> di form event. Event yang memilih <em>Prasmanan</em> mendapat seluruh daftar di bawah kartu Prasmanan; divisi (Kitchen, Bar, Floor, &hellip;) jadi <b>sub kategori</b> di dalamnya.</span></div>';
  if(!fmts.length) h+='<div class="card cell-sub">Belum ada kategori. Tambahkan satu supaya event bisa memilihnya dan punya daftar to-do.</div>';
  fmts.forEach(fmt=>{
    const fj=escJs(fmt);
    const tombol='<button class="btn sm" title="Salin isi dari kategori lain" onclick="salinKategori(\''+fj+'\')">'+svg(IC.copy)+'Salin dari</button>'
      +'<button class="btn sm" title="Ubah nama kategori" onclick="renameFbFormat(\''+fj+'\')">'+svg(IC.edit)+'</button>';
    h+=tmplCard(fmt,canEdit,'delFbFormat','Seluruh to-do event yang kategorinya <b>'+esc(fmt)+'</b>.',tombol);
  });

  if(lama.length){
    h+='<div class="eyebrow" style="margin:24px 2px 8px">Kategori lama — belum dipindah</div>'
     +'<div class="tbl-note" style="margin:0 0 12px">'+svg(IC.alert)
     +'<span>Ini template dari waktu divisi masih jadi kategori to-do. Isinya <b>tidak hilang</b> dan tidak dipindah otomatis — menebak kategorinya salah berarti menaruh pekerjaan di event yang keliru. Pindahkan sendiri ke kategori yang sesuai; item beserta progres yang sudah tercatat ikut pindah.</span></div>';
    lama.forEach(d=>{
      const n=divTemplates(d).length;
      h+='<div class="card" style="margin-bottom:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap">'
       +'<div style="flex:1;min-width:180px"><b style="font-size:14px">'+esc(d)+'</b>'
       +'<div class="cell-sub">'+n+' item to-do'+(subsOf(d).length?' · '+subsOf(d).length+' sub kategori':'')+'</div></div>'
       +(canEdit&&fmts.length?'<select class="inp" style="max-width:200px" id="pl_'+esc(d)+'">'
          +fmts.map(f=>'<option>'+esc(f)+'</option>').join('')+'</select>'
        +'<button class="btn sm pri" onclick="pindahKategoriLama(\''+escJs(d)+'\')">Pindahkan</button>':'')
       +'</div>';
      // Isinya ditampilkan penuh, bukan cuma dihitung: memindahkan sesuatu tanpa
      // bisa melihat isinya lebih dulu adalah cara membuat orang menebak.
      h+=tmplCard(d,canEdit,'delTaskCategory');
    });
  }
  V.innerHTML=h;
  if(canEdit) bindSubDrag();
}
/* ---------- URUTAN SUB KATEGORI (tarik-lepas) ----------
   Urutannya = urutan di S.fbSubs, dan itu JUGA urutan tampil di papan to-do
   (taskBoard mengelompokkan menurut daftar sub). Jadi menata di sini sekaligus
   menata urutan kerja tim di lapangan — bukan cuma kosmetik halaman ini. */
let scDragId=null;
function bindSubDrag(){
  document.querySelectorAll('.sc-head.bisa-tarik').forEach(el=>{
    el.addEventListener('dragstart',e=>{ scDragId=el.dataset.sc; el.classList.add('sc-drag');
      try{ e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',scDragId); }catch(_){} });
    el.addEventListener('dragend',()=>{ el.classList.remove('sc-drag');
      document.querySelectorAll('.sc-over').forEach(x=>x.classList.remove('sc-over')); });
    el.addEventListener('dragover',e=>{
      /* Hanya di dalam kategori yang SAMA. Menyeret sub Prasmanan ke Set Menu
         bukan "mengurutkan" melainkan memindahkan — akibatnya lain (itemnya
         ikut berpindah event), jadi jangan sampai kejadian tanpa disengaja. */
      const asal=document.querySelector('.sc-head[data-sc="'+scDragId+'"]');
      if(!asal || asal.dataset.scdiv!==el.dataset.scdiv || asal===el) return;
      e.preventDefault(); el.classList.add('sc-over');
    });
    el.addEventListener('dragleave',()=>el.classList.remove('sc-over'));
    el.addEventListener('drop',e=>{ e.preventDefault(); el.classList.remove('sc-over');
      reorderSub(scDragId, el.dataset.sc); });
  });
}
function reorderSub(dragId,targetId){
  if(!dragId||dragId===targetId) return;
  const subs=getSubs();
  const a=subs.find(x=>x.id===dragId), b=subs.find(x=>x.id===targetId);
  if(!a||!b||a.div!==b.div) return;
  /* Ditata di dalam SLOT milik kategori ini saja: S.fbSubs memuat sub dari
     semua kategori sekaligus, jadi mengurutkan seluruh array akan mengacak
     urutan kategori lain yang tidak sedang disentuh. */
  const slot=[]; subs.forEach((x,i)=>{ if(x.div===a.div) slot.push(i); });
  const urut=slot.map(i=>subs[i]);
  const ia=urut.indexOf(a), ib=urut.indexOf(b);
  urut.splice(ia,1);
  const ib2=urut.indexOf(b);
  // ditarik ke BAWAH -> mendarat sesudah sasaran; ke ATAS -> sebelum sasaran.
  urut.splice(ia<ib?ib2+1:ib2, 0, a);
  slot.forEach((gi,k)=>{ subs[gi]=urut[k]; });
  save(); logAct('template','-','Urutan sub kategori diubah',a.div+' · '+a.nama);
  go('templates');
}
/* Pindahkan satu kategori lama (divisi) menjadi SUB KATEGORI di dalam sebuah
   Format F&B. Yang ikut pindah: templatenya, sub kategori yang sudah ada di
   dalamnya, dan progres/meta job yang sudah tercatat di event. */
function pindahKategoriLama(div){
  const el=$('pl_'+div); const fmt=el?el.value:'';
  if(!fmt) return toast('Pilih kategori','Pilih kategori tujuan dulu.','err');
  const items=divTemplates(div), subLama=subsOf(div);
  confirmUI({title:'Pindahkan Kategori',sub:div+' → '+fmt,ok:'Pindahkan',
    body:'Pindahkan <b>'+esc(div)+'</b> ('+items.length+' item) menjadi sub kategori di dalam <b>'+esc(fmt)+'</b>?'
      +(subLama.length?'<br><br>'+subLama.length+' sub kategori di dalamnya akan digabung namanya jadi "'+esc(div)+' — <i>nama sub</i>", supaya tidak ada yang tertimpa.':'')
      +'<br><br>Progres yang sudah tercatat di event ber-format '+esc(fmt)+' ikut pindah.',
    onYes:function(){
      /* Sub lama tidak bisa langsung jadi sub baru begitu saja: nama yang sama
         bisa sudah dipakai di format tujuan. Digabung dengan awalan nama
         divisinya — bertele-tele tapi tidak ada yang diam-diam tertimpa. */
      const petaSub={};
      subLama.forEach(sc=>{ petaSub[sc.nama]=div+' — '+sc.nama; });
      const adaSub=subsOf(fmt).map(x=>x.nama);
      const perlu=[div].concat(Object.keys(petaSub).map(k=>petaSub[k]));
      perlu.forEach(nm=>{ if(adaSub.indexOf(nm)<0){ getSubs().push({id:uid('sc'),div:fmt,nama:nm}); adaSub.push(nm); } });
      items.forEach(t=>{ t.sub=petaSub[t.sub||'']||div; t.div=fmt; });
      S.fbSubs=getSubs().filter(x=>x.div!==div);
      S.categories=getCats().filter(x=>x!==div);
      /* Progres & meta job disimpan per kategori. Item yang tadinya dibaca di
         bawah kunci divisi kini dibaca di bawah kunci format — kalau kuncinya
         tidak ikut dipindah, centang yang sudah ada terbaca 0% lagi. Hanya
         event ber-format itu yang dipindah; event lain tidak memakai item ini. */
      const ids=items.map(t=>t.id);
      S.events.forEach(ev=>{
        if(!ev||!ev.detail||ev.detail.fbFormat!==fmt) return;
        ['jobProgress','jobMeta'].forEach(k=>{
          const kotak=ev[k], asal=kotak&&kotak[div];
          if(!asal||typeof asal!=='object'||Array.isArray(asal)) return;
          if(!kotak[fmt]||typeof kotak[fmt]!=='object'||Array.isArray(kotak[fmt])) kotak[fmt]={};
          ids.forEach(id=>{ if(id in asal && !(id in kotak[fmt])){ kotak[fmt][id]=asal[id]; delete asal[id]; } });
        });
      });
      save(); logAct('template','-','Kategori lama dipindah',div+' → '+fmt+' · '+items.length+' item');
      toast('Dipindahkan',div+' kini sub kategori di dalam '+fmt+'.','ok'); go('templates');
    }});
}

function renameFbFormat(name){

function saveRenameFbFormat(){
  const lama=$('rf_lama').value;
  let baru=($('rf_name').value||'').replace(/['"\\]/g,'').trim();
  if(!baru)return toast('Nama wajib','Isi nama kategori dulu.','err');
  if(baru===lama){ closeModal(); return; }
  if(getFbFormats().concat(getCats()).concat(['Lainnya']).some(c=>String(c).toLowerCase()===baru.toLowerCase()))
    return toast('Sudah ada','Nama itu sudah dipakai.','err');
  const daftar=getFbFormats();
  daftar[daftar.indexOf(lama)]=baru;
  (S.taskTemplates||[]).forEach(t=>{ if(t.div===lama) t.div=baru; });
  getSubs().forEach(x=>{ if(x.div===lama) x.div=baru; });
  let nEv=0;
  S.events.forEach(ev=>{
    if(!ev) return;
    if(ev.detail && ev.detail.fbFormat===lama){ ev.detail.fbFormat=baru; nEv++; }
    /* Kunci per-kategori ikut berganti nama. Kalau tidak, progres yang sudah
       dicentang tetap tersimpan di bawah nama lama dan terbaca 0% lagi. */
    ['jobProgress','jobMeta','tasks'].forEach(k=>{
      const kotak=ev[k];
      if(!kotak||typeof kotak!=='object'||Array.isArray(kotak)) return;
      if(!(lama in kotak)) return;
      if(!(baru in kotak)) kotak[baru]=kotak[lama];
      delete kotak[lama];
    });
  });
  save(); closeModal(); logAct('template','-','Nama kategori diubah',lama+' → '+baru+(nEv?' · '+nEv+' event ikut':''));
  toast('Tersimpan','Kategori "'+lama+'" jadi "'+baru+'".','ok'); go('templates');
}

function doSalinKategori(){
  const target=$('sk_target').value, sumber=$('sk_sumber').value;
  if(!sumber||sumber===target) return toast('Pilih sumber','Pilih kategori asal dulu.','err');
  // Sub kategori disalin lebih dulu supaya urutannya ikut, bukan tersusun acak
  // menurut urutan itemnya.
  const adaSub=subsOf(target).map(x=>x.nama);
  let nSub=0;
  subsOf(sumber).forEach(sc=>{
    if(adaSub.indexOf(sc.nama)>-1) return;
    getSubs().push({id:uid('sc'),div:target,nama:sc.nama}); adaSub.push(sc.nama); nSub++;
  });
  /* Kunci pembanding = sub + nama task. Tanpa ini, menekan Salin dua kali
     menggandakan seluruh daftar dan orang harus menghapusnya satu per satu. */
  S.taskTemplates=S.taskTemplates||[];
  const sudah={};
  divTemplates(target).forEach(t=>{ sudah[(t.sub||'')+'␀'+(t.task||'')]=1; });
  let nBaru=0, nLewat=0;
  divTemplates(sumber).forEach(t=>{
    const kunci=(t.sub||'')+'␀'+(t.task||'');
    if(sudah[kunci]){ nLewat++; return; }
    sudah[kunci]=1; nBaru++;
    S.taskTemplates.push({id:uid('tt'),div:target,sub:t.sub||'',task:t.task||'',
      pic:t.pic||'',hminus:(t.hminus!=null?t.hminus:null),deadline:t.deadline||'',note:t.note||''});
  });
  save(); closeModal();
  logAct('template','-','Isi kategori disalin',sumber+' → '+target+' · '+nBaru+' item'+(nLewat?' ('+nLewat+' dilewati)':''));
  toast('Tersalin',nBaru+' item'+(nSub?' & '+nSub+' sub kategori':'')+' masuk ke '+target+(nLewat?' · '+nLewat+' dilewati karena sudah ada':'')+'.','ok');
  go('templates');
}

/* ============================================================
   PURCHASE ORDER — kirim kebutuhan pembelian ke papan BD OS
   ------------------------------------------------------------
   Halaman ini TIDAK punya database sendiri. Barisnya ditulis langsung ke
   database BD OS lewat ../bd-api-mysql/api.php, dan sesudah terkirim
   dikelola sepenuhnya di sana (Purchasing → PR Mingguan). Marketing cuma
   pintu masuk tambahan.

   Sengaja begitu: kalau Marketing menyimpan salinannya sendiri, akan ada dua
   daftar kebutuhan yang sama-sama bisa diubah, dan lembar PR yang dicetak tim
   purchasing tidak lagi bisa dipercaya sebagai satu-satunya kebenaran.

   Aksinya `addPo`, BUKAN `saveAll`. saveAll merekonsiliasi — baris yang tidak
   ikut di kiriman akan DIHAPUS, dan Marketing tidak pernah memegang state BD
   seutuhnya. Satu panggilan saveAll dari sini cukup untuk mengosongkan papan
   purchasing BD.
   ============================================================ */
const BD_API = '../bd-api-mysql/api.php';

function poRibuan(n){ return (+n||0).toLocaleString('id-ID'); }
function poBacaRp(el){ return parseInt(String(el.value).replace(/\D/g,''),10)||0; }
function poFmtRp(el){
  var digitSebelum=String(el.value).slice(0,el.selectionStart).replace(/\D/g,'').length;
  var digit=String(el.value).replace(/\D/g,'').replace(/^0+(?=\d)/,'').slice(0,15);
  el.value = digit ? (+digit).toLocaleString('id-ID') : '';
  var i=0,n=0;
  while(i<el.value.length && n<digitSebelum){ if(el.value.charCodeAt(i)>=48&&el.value.charCodeAt(i)<=57) n++; i++; }
  el.selectionStart=el.selectionEnd=i;
}
function poAkhirMinggu(){
  var d=new Date();
  d.setDate(d.getDate()+(7-((d.getDay()+6)%7)-1));
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
