function poKirimKeBD(){
  var need=document.getElementById('bp_need').value;
  var div=document.getElementById('bp_div').value;
  var ev=document.getElementById('bp_event').value;
  var items=[];
  document.querySelectorAll('#bp_rows tr').forEach(function(tr){
    var nama=(tr.querySelector('.bp-item').value||'').trim();
    if(!nama) return;
    var alasan=(tr.querySelector('.bp-note').value||'').trim();
    items.push({
      item:nama,
      qty:+tr.querySelector('.bp-qty').value||1,
      unit:(tr.querySelector('.bp-unit').value||'').trim()||'Unit',
      amount:poBacaRp(tr.querySelector('.bp-amount')),
      needBy:need, div:div, status:'Diajukan', vendor:'', prId:null,
      /* `by` dikosongkan: itu id kru di tabel people milik BD, dan Marketing
         tidak mengenalnya. Namanya dikirim sebagai teks lewat `byName`, dan
         BD OS menampilkannya apa adanya. Mengarang id akan membuat kolom
         Peminta menunjuk orang yang salah — lebih buruk daripada teks biasa. */
      by:'', byName:(ME&&ME.name)||'Marketing',
      input:(ME&&ME.name)||'Marketing', sumber:'Marketing',
      note:alasan+(ev?(alasan?' · ':'')+'Event: '+ev:'')
    });
  });
  if(!items.length){ toast('Belum ada baris','Isi minimal satu nama item.','err'); return; }

  var btn=document.getElementById('bp_kirim');
  btn.disabled=true; btn.textContent='Mengirim…';
  var stop=new AbortController();
  var jam=setTimeout(function(){stop.abort();},20000);
  fetch(BD_API,{method:'POST',redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'addPo',items:items}), signal:stop.signal})
    .then(function(r){return r.text();})
    .then(function(teks){
      clearTimeout(jam);
      var j=null; try{ j=JSON.parse(teks); }catch(e){}
      if(!j)    throw new Error('BD OS membalas bukan JSON — backend bd-api-mysql belum terpasang?');
      if(!j.ok) throw new Error(j.error||'ditolak BD OS');
      var n=(j.data&&j.data.added)||0;
      document.getElementById('bp_hasil').innerHTML=
        '<div class="ov-sorot" style="margin:0"><div class="ov-sorot-t">TERKIRIM</div>'+
        n+' item masuk ke papan Purchasing BD OS berstatus Diajukan. '+
        'Tim purchasing yang melanjutkan dari sana.</div>';
      document.getElementById('bp_rows').innerHTML=poBarisMkt()+poBarisMkt()+poBarisMkt();
      toast('Terkirim',n+' item masuk ke BD OS.','ok');
    })
    .catch(function(e){
      clearTimeout(jam);
      var pesan=e.name==='AbortError'?'BD OS tidak menjawab dalam 20 detik':e.message;
      document.getElementById('bp_hasil').innerHTML=
        '<div class="ov-sorot" style="margin:0;border-left-color:var(--red)"><div class="ov-sorot-t">GAGAL TERKIRIM</div>'+
        esc(pesan)+'<br><b>Isian di atas tidak dihapus</b> — perbaiki penyebabnya lalu tekan Kirim lagi.</div>';
      toast('Gagal terkirim',pesan,'err');
    })
    .then(function(){ btn.disabled=false; btn.textContent='Kirim ke BD OS'; });
}

/* ============================================================
   MODUL I — APPROVAL FLOW
   ============================================================ */
/* Halaman ini adalah MEJA PUTUSAN MANAJEMEN — dan sekarang SATU TABEL.

   Dulu tiga tabel bertumpuk di satu halaman: "Surat Penawaran Menunggu
   Persetujuan", "Sudah Diputuskan", dan "Negosiasi Harga". Ketiganya menjawab
   pertanyaan yang sama ("apa yang perlu saya putuskan, dan apa yang sudah"),
   tapi dengan kolom berbeda-beda, tiga pager sendiri-sendiri, dan tiga urutan
   yang tidak nyambung. Untuk tahu apakah semua sudah beres, mata harus turun
   naik tiga kali.

   Sekarang satu daftar: tiap baris adalah satu PERKARA yang menunggu atau sudah
   diputuskan manajemen, apa pun jenisnya. Jenisnya jadi kolom, bukan tabel
   terpisah. Satu pager, satu pengurutan, satu penyaring status. */
const NEGO_STATUS={
  'Pending' :{c:'--warn',  t:'Menunggu Approval'},
  'Approved':{c:'--ok',    t:'Disetujui'},
  'Rejected':{c:'--danger',t:'Ditolak'}
};
let apprFilter='';   // '' = semua · 'antri' = masih menunggu · 'putus' = sudah diputuskan
function setApprFilter(v){ apprFilter=v; TBL_HAL.approval=1; go('approvals'); }
/* Satu bentuk baris untuk dua sumber yang berbeda. Penyeragaman dilakukan di
   SINI, sekali — bukan di dalam kode gambar, supaya pengurutan & penyaringan
   bekerja sama untuk keduanya tanpa cabang if di mana-mana. */
function approvalRows(){
  const out=[];
  S.events.forEach(e=>{
    const st=penStatus(e);
    // Draft belum diajukan ke siapa pun, jadi belum jadi perkara di meja ini.
    if(!st||st==='Draft') return;
    const p=e.penawaran||{};
    out.push({
      jenis:'Surat Penawaran', kind:'pen', rid:e.id, ev:e,
      perkara:p.noSurat||'—',
      sub:p.validUntil?('berlaku s/d '+fmtDate(p.validUntil)):'',
      catatan:p.note||'',
      tolakNote:(st==='Ditolak'?(p.rejectNote||''):''),
      nilai:eventFinance(e).grand,
      olehId:p.submittedBy, pada:p.submittedAt||'',
      status:st, peta:PEN_STATUS, antri:(st==='Menunggu Approval'),
      putusId:p.decidedBy, putusPada:p.decidedAt||'',
      file:p.file||null
    });
  });
  // Baris yang eventnya sudah terhapus disaring DI SINI, bukan saat menggambar —
  // kalau tidak, satu halaman bisa berisi lebih sedikit baris daripada yang
  // dijanjikan pager.
  S.approvals.forEach(a=>{
    const e=S.events.find(x=>x.id===a.eventId); if(!e) return;
    out.push({
      jenis:'Negosiasi Harga', kind:'nego', rid:a.id, ev:e,
      perkara:a.reason||'—', sub:'', catatan:'',
      tolakNote:(a.status==='Rejected'?(a.note||''):''),

function decideApproval(id,decision){
  const a=S.approvals.find(x=>x.id===id); a.status=decision; a.by2=ME.id; a.decidedAt=new Date().toISOString();
  const e=S.events.find(x=>x.id===a.eventId);
  logAct('event',a.eventId,'Approval '+decision,'oleh '+ME.name);
  // Approval ditolak → peluang otomatis dianggap batal (pindah ke tahap Lost),
  // supaya event tidak nyangkut di tahap lama dan lolos ke invoice.
  if(decision==='Rejected' && e && e.status!=='Lost'){
    const prev=e.status; e.status='Lost'; e.pipeCol='Lost';
    logAct('event',a.eventId,'Tahap → Lost','otomatis: approval ditolak (dari '+prev+')');
  }
  pushNotif('approval','Approval '+decision,(e?e.nama:'')+' telah di-'+decision.toLowerCase()+'.','#event/'+a.eventId);
  save(); buildNav(); toast('Approval '+decision,(e?e.nama:''),decision==='Approved'?'ok':'err'); go('approvals');
}

/* ============================================================
   MODUL VIP — RESERVASI RUANG VIP  (tersambung ke modul Reservasi)
   ------------------------------------------------------------
   Dua jenis, dan bedanya HANYA di pelaporan:

     Assisted — marketing yang mencarikan & menutup dealnya. Nominal
                pendapatannya diketik sendiri oleh marketing dan IKUT dihitung
                sebagai omzet orang itu di Marketing Performance.
     Regular  — marketing cuma membantu membookingkan. TIDAK ada nominal dan
                TIDAK ikut dihitung sebagai pencapaian siapa pun.

   Keduanya sama-sama DITULIS ke database modul Reservasi supaya mejanya
   benar-benar terkunci untuk seluruh kru, bukan cuma tercatat di Marketing.
   ============================================================ */
const RSV_API = "../reservasi-api-mysql/api.php";

/* Tarik seluruh data Reservasi. Dipakai untuk dua hal: tahu meja mana yang
   sudah terpakai pada tanggal itu, dan mendapat nomor versi (_ver) yang wajib
   ikut dikirim saat menulis. */
async function rsvAmbil(){
  const url=RSV_API+(RSV_API.includes('?')?'&':'?')+'action=getAll&t='+Date.now();
  const stop=new AbortController();
  const jam=setTimeout(()=>stop.abort(),25000);
  const res=await fetch(url,{method:'GET',signal:stop.signal}).finally(()=>clearTimeout(jam));
  const j=await res.json();
  if(!j||!j.ok) throw new Error((j&&j.error)||'Modul Reservasi tidak menjawab.');
  return j.data||{};
}
/* Menulis balik ke Reservasi.

   INI BAGIAN YANG PALING GAMPANG MERUSAK DATA ORANG LAIN, jadi mengikuti
   disiplin yang sama dengan modul Reservasi sendiri: saveAll mengirim SELURUH
   state, sementara kru lain mungkin sedang menyimpan juga. Karena itu:
     1. tarik data terbaru + nomor versinya (_ver),
     2. sisipkan HANYA baris baru kita ke salinan data itu,
     3. kirim dengan baseVer; kalau server bilang conflict, artinya ada yang
        menyelip menyimpan lebih dulu — ulangi dari langkah 1.
   Yang TIDAK boleh dilakukan: menyimpan state hasil tarikan lama. Reservasi
   yang dibuat kru lain di sela-sela itu akan hilang tanpa jejak. */
async function rsvSisipkan(buatRecord){
  for(let coba=0;coba<6;coba++){
    const d=await rsvAmbil();
    const baseVer=(d&&d._ver!==undefined)?d._ver:null;
    const rec=buatRecord(d);
    if(rec&&rec.__batal) return rec;
    const data=Object.assign({},d);
    delete data._ver;
    data.reservations=(Array.isArray(d.reservations)?d.reservations.slice():[]);
    data.reservations.push(rec);
    const res=await fetch(RSV_API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'saveAll',data,baseVer})});
    const j=await res.json();
    if(j&&j.conflict) continue;                       // kru lain menyelip, ulangi
    if(!j||!j.ok) throw new Error((j&&j.error)||'Gagal menyimpan ke Reservasi.');
    return {ok:true,rec};
  }
  throw new Error('Terlalu banyak tabrakan simpan di Reservasi — coba sekali lagi.');
}
/* Meja yang sudah terpakai pada satu tanggal. Field `table` di Reservasi berisi
   daftar dipisah koma (satu tamu bisa memakai beberapa meja), jadi dipecah. */
function rsvMejaTerpakai(d,tanggal){
  const out={};
  (d&&d.reservations||[]).forEach(r=>{
    if(!r||r.date!==tanggal) return;
    /* Status yang MEMBEBASKAN meja. Dulu di sini tertulis 'batal' — istilah
       Indonesia yang tidak pernah ada di modul Reservasi; kosakatanya
       Pending / Confirmed / Datang / Cancelled / No-show. Akibatnya syarat ini
       tak pernah cocok dengan apa pun: tamu yang sudah membatalkan tetap
       memblokir mejanya di pemilih meja Reservasi VIP, dan vipSimpanKunci()
       ikut menolak simpan dengan alasan bentrok yang sebenarnya tidak ada.
       'batal' tetap ditoleransi kalau-kalau ada data lama bertulisan begitu. */
    const st=String(r.status||'').toLowerCase();
    if(st==='cancelled'||st==='no-show'||st==='noshow'||st==='batal') return;
    // Tamu sudah pulang → mejanya bebas lagi, sama seperti occupiedMap() di sana.
    if(r.leftAt) return;
    String(r.table||'').split(',').map(x=>x.trim()).filter(Boolean).forEach(m=>{ out[m]=r.name||'terpakai'; });
  });
  return out;
}
/* Daftar meja yang bisa dipilih. Denah lengkapnya hidup di kode modul
   Reservasi, jadi TIDAK disalin ke sini — yang disalin pasti lambat laun
   berbeda. Yang dipakai: daftar meja dari master Reservasi (sumber yang sama
   dipakai form reservasi di sana), digabung dengan meja yang benar-benar muncul
   di data reservasi supaya meja denah custom ikut terbaca. */
function rsvDaftarMeja(d){
  const set=[];
  const tambah=m=>{ m=String(m||'').trim(); if(m&&set.indexOf(m)<0)set.push(m); };
  ((d&&d.master&&d.master.tables)||[]).forEach(tambah);
  const lay=(d&&d.master&&d.master.layouts)||{};
  Object.keys(lay).forEach(k=>((lay[k]&&lay[k].tables)||[]).forEach(t=>tambah(t&&t.id)));
  (d&&d.reservations||[]).forEach(r=>String(r.table||'').split(',').forEach(tambah));
  return set;
}

let VIP_FORM=null;         // draft yang sedang diisi (belum tersimpan)
let vipFilter='';

   Sebelumnya Reservasi VIP hanya mengenal denah lantai 1 (Weekday/Weekend
   mengikuti tanggal), padahal modul Reservasi punya lebih dari itu: Weekday,
   Weekend, Lantai 2, dan template custom apa pun yang dibuat kru di sana.
   Akibatnya meja lantai 2 tidak pernah bisa dikunci dari Marketing, dan denah
   Weekday tidak bisa dilihat pada hari Sabtu walaupun ruangannya memang ditata
   begitu untuk acara itu.

   '' berarti IKUT TANGGAL (weekday/weekend/override) — itu bawaannya, karena
   denah hari itulah yang benar sembilan dari sepuluh kali. */
let VIP_LAYOUT='';
/* Data Reservasi hasil pengambilan terakhir. Disimpan supaya tombol pindah
   denah menggambar ulang dari data yang SUDAH ada — menembak server lagi tiap
   kali orang menengok denah lain membuat tombolnya terasa berat, dan bisa gagal
   di tengah pemilihan yang belum tersimpan. */
let VIP_RSV=null;
let VIP_MEJA_LT={};        // {idMeja: 1|2} — lantai fisik, dipakai chip ringkasan

function vipKosong(){
  return {id:uid('vip'),jenis:'Assisted',nama:'',clientId:'',perusahaan:'',tanggal:today(),jamMulai:'',jamSelesai:'',
    hp:'',paxMin:'',paxMax:'',layoutReq:'',tv:false,speaker:false,nominal:'',clientBaru:false,
    meja:[],mktPIC:(ME?ME.id:''),catatan:'',resId:'',kirimAt:'',createdAt:new Date().toISOString(),createdBy:(ME?ME.name:'')};
}
/* Nominal HANYA berlaku untuk Assisted. Regular yang pernah diketik nominalnya
   lalu dipindah ke Regular tidak boleh diam-diam tetap terhitung di laporan. */
function vipNominal(v){ return (v&&v.jenis==='Assisted') ? (+v.nominal||0) : 0; }
// Assisted yang nominalnya belum diketik. Bukan galat, cuma pekerjaan yang
// belum selesai, dan harus kelihatan supaya tidak ada omzet yang lupa dicatat.
function vipBelumNominal(v){ return v&&v.jenis==='Assisted' && !(+v.nominal); }
function vipPax(v){ return +(v&&v.paxMax) || +(v&&v.paxMin) || 0; }
/* Perusahaan datang dari Database Client, bukan diketik bebas. Yang disimpan
   clientId-nya, jadi nama perusahaan yang dikoreksi di CRM ikut terkoreksi di
   sini — teks bebas akan membeku pada ejaan saat itu dan lambat laun berselisih.
   `perusahaan` yang lama tetap dibaca sebagai cadangan supaya catatan yang
   sudah ada tidak kehilangan isinya. */
function vipPerusahaan(v){
  const c=v&&v.clientId?S.clients.find(x=>x.id===v.clientId):null;
  if(c) return c.perusahaan||c.nama||'';
  return (v&&v.perusahaan)||'';
}
// Label di kotak pencarian client — satu tempat, dipakai mengisi datalist DAN
// membaca balik pilihannya, jadi keduanya tidak mungkin berbeda bentuk.
function vipClientLabel(c){
  const pt=(c.perusahaan&&c.perusahaan!==c.nama)?c.perusahaan:'';
  return c.nama+(pt?' — '+pt:'')+(c.hp?' ('+c.hp+')':'');
}
function vipClientDariLabel(teks){
  const t=String(teks||'').trim();
  if(!t) return '';
  const c=S.clients.find(x=>vipClientLabel(x)===t);
  return c?c.id:null;      // null = diketik tapi tidak dikenali
}
function vipJam(v){ return [v.jamMulai,v.jamSelesai].filter(Boolean).join(' - ')||'—'; }

function vipClientBaruToggle(){

/* Simpan perubahan TANPA menyentuh modul Reservasi. Yang bisa diubah dari sini
   memang cuma keterangannya (nama, HP, jam, catatan, nominal); meja dan
   kuncian di Reservasi tetap milik jalur "Ubah Meja & Kunci". */
function vipSimpanSaja(){
  const galat=vipKumpulkan();
  if(galat) return toast('Belum lengkap',galat,'err');
  const f=VIP_FORM;
  const i=(S.vip||[]).findIndex(x=>x.id===f.id);
  if(i<0) return toast('Belum pernah dikunci','Reservasi ini belum tersimpan — pakai "Pilih Meja & Kunci".','err');
  vipPastikanClient(f);
  S.vip[i]=JSON.parse(JSON.stringify(f));
  logAct('vip',f.id,'Reservasi VIP diperbarui',f.nama+' · '+fmtDate(f.tanggal));
  save(); closeModal();
  toast('Tersimpan',f.nama+' diperbarui.'+(f.resId?' Meja & kuncian di modul Reservasi tidak berubah.':''),'ok');
  go('vip');
}
function vipPilihJenis(btn,jenis){
  [...btn.parentNode.children].forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  VIP_FORM.jenis=jenis;
  const w=$('vip_nominal_wrap'); if(w) w.style.display=(jenis==='Assisted')?'block':'none';
}
/* Kumpulkan isian form. Dikembalikan sebagai pesan galat (string) supaya
   pemanggilnya yang memutuskan mau diapakan. */
function vipKumpulkan(){
  const f=VIP_FORM; if(!f)return 'Form tidak terbuka.';
  const g=id=>{ const el=$(id); return el?el.value.trim():''; };
  f.nama=g('vip_nama'); f.tanggal=g('vip_tanggal');
  /* Client: kosong berarti memang tidak ditautkan. Diketik tapi tidak cocok
     dengan satu pun baris CRM = kemungkinan besar salah ketik, jadi DITOLAK
     ketimbang diam-diam disimpan sebagai tidak bertaut. */
  const cek=$('vip_clientBaru');
  f.clientBaru=!!(cek&&cek.checked);
  if(f.clientBaru){
    /* Perusahaan baru: yang disimpan dulu teksnya. Barisnya BARU dibuat di CRM
       saat reservasinya benar-benar disimpan (vipPastikanClient) — kalau
       dibuat sekarang, setiap orang yang membuka form lalu batal akan
       meninggalkan client sampah di Database Client. */
    f.perusahaan=g('vip_perusahaanBaru');
    f.clientId='';
    if(!f.perusahaan) return 'Nama perusahaan baru wajib diisi — atau lepas centangnya.';
  }else{
    const cid=vipClientDariLabel(g('vip_client'));
    if(cid===null) return 'Client tidak dikenali — pilih dari daftar yang muncul saat mengetik, atau kosongkan.';
    f.clientId=cid;
    f.perusahaan=cid?'':f.perusahaan;   // ditautkan -> namanya selalu dibaca dari CRM
  }
  f.hp=g('vip_hp'); f.jamMulai=g('vip_jamMulai'); f.jamSelesai=g('vip_jamSelesai');
  // Nomor client dipakai kalau kotaknya masih kosong — mengetik ulang nomor yang
  // sudah ada di CRM cuma menambah peluang salah ketik. Yang sudah diisi tidak
  // pernah ditimpa: tamu VIP kadang memakai nomor PIC lain.
  if(!f.hp && f.clientId){ const c=S.clients.find(x=>x.id===f.clientId); if(c&&c.hp) f.hp=c.hp; }
  f.paxMin=g('vip_paxMin'); f.paxMax=g('vip_paxMax');
  f.layoutReq=g('vip_layoutReq'); f.catatan=g('vip_catatan');
  const sv=segVal('vip_tv'); if(sv!==undefined)f.tv=sv.v;
  const ss=segVal('vip_speaker'); if(ss!==undefined)f.speaker=ss.v;
  const n=$('vip_nominal'); if(n) f.nominal=rupiahDigits(n.value)===''?'':(+rupiahDigits(n.value));
  if(!f.nama) return 'Atas Nama wajib diisi.';
  if(!f.tanggal) return 'Tanggal wajib diisi.';

     acaranya jalan, jadi memaksanya di depan cuma memancing orang mengarang
     angka supaya formnya mau lanjut. Yang belum terisi ditandai di daftar. */

/* Menautkan reservasi ke Database Client, membuat barisnya kalau perlu.
   Dipanggil tepat sebelum menyimpan, dari kedua jalur simpan.

   Perusahaan yang namanya SUDAH ada dipakai ulang, tidak dibuat dua kali:
   yang paling sering terjadi bukan perusahaan betul-betul baru, tapi orang
   yang tidak menemukannya di kotak pencarian lalu mencentang "baru". */
function vipPastikanClient(f){
  if(!f||!f.clientBaru||!f.perusahaan) return;
  const nm=String(f.perusahaan).trim().toLowerCase();
  const ada=(S.clients||[]).find(c=>String(c.perusahaan||'').trim().toLowerCase()===nm
                                  || String(c.nama||'').trim().toLowerCase()===nm);
  if(ada){
    f.clientId=ada.id; f.clientBaru=false; f.perusahaan='';
    if(!ada.hp&&f.hp){ ada.hp=f.hp; }
    return;
  }
  const nc={id:uid('c'),createdAt:today(),lastContact:today(),
    nama:f.nama||f.perusahaan,perusahaan:f.perusahaan,pic:'',hp:f.hp||'',
    email:'',ig:'',alamat:'',source:'Reservasi VIP',
    mktPIC:f.mktPIC||(ME?ME.id:''),birthday:'',nextFU:'',catatan:'Dibuat otomatis dari Reservasi VIP.'};
  S.clients.unshift(nc);
  logAct('client',nc.id,'Client baru dari Reservasi VIP',nc.perusahaan+' · '+(nc.nama||''));
  f.clientId=nc.id; f.clientBaru=false; f.perusahaan='';
}

/* Denah mana yang dipakai untuk sebuah tanggal. Aturannya SAMA dengan modul
   Reservasi supaya kedua modul menggambar denah yang sama untuk hari yang sama:
   kalau ada override manual untuk tanggal itu pakai itu; kalau tidak, akhir
   pekan (Jumat/Sabtu) pakai denah Weekend, selebihnya Weekday. Denah hasil edit
   yang tersimpan di server (master.layouts) menimpa yang bawaan. */
function vipDenahKey(d,tanggal,pilihan){
  /* Denah yang dipilih manual menang atas denah harian. Denah selain
     weekday/weekend tidak kenal tanggal sama sekali — sama seperti
     LAYOUT_LANTAI di modul Reservasi. */
  const k=(pilihan===undefined?VIP_LAYOUT:pilihan);
  if(k && vipDenah(d,k)) return k;
  return vipDenahKeyOtomatis(d,tanggal);
}
/* Semua denah yang tersedia — persis daftar yang dipakai modul Reservasi:
   tiga bawaan + template custom yang dibuat kru di sana (master.layouts).
   Disalin daftarnya, bukan definisinya: definisi meja tetap satu sumber. */
const VIP_DENAH_BAWAAN=['weekday','weekend','lantai2'];
const VIP_DENAH_LABEL={weekday:'Weekday · Lt.1', weekend:'Weekend · Lt.1', lantai2:'Lantai 2'};
function vipDenahKeys(d){
  const keys=VIP_DENAH_BAWAAN.slice();
  const custom=(d&&d.master&&d.master.layouts)||{};
  if(custom&&!Array.isArray(custom)) Object.keys(custom).forEach(k=>{ if(keys.indexOf(k)<0) keys.push(k); });
  // Denah yang definisinya kosong tidak ditawarkan: tombol yang membuka denah
  // kosong hanya membuat orang mengira dendanya rusak.
  return keys.filter(k=>{ const L=vipDenah(d,k); return L&&Array.isArray(L.tables)&&L.tables.length; });
}
function vipDenahLabel(d,key){
  const L=vipDenah(d,key);
  return (L&&L.name)||VIP_DENAH_LABEL[key]||key;
}
/* Lantai fisik sebuah denah. Dipakai penanda Lt.1/Lt.2 pada chip ringkasan —
   template custom mengikuti namanya, dan kalau namanya tidak menyebut lantai
   dianggap lantai 1 (denah venue ini memang bertumpu di lantai 1). */
function vipDenahLantai(d,key){
  if(key==='lantai2') return 2;
  return /lantai\s*2|lt\.?\s*2/i.test(vipDenahLabel(d,key))?2:1;
}
/* Denah yang mengikuti TANGGAL, tanpa melihat pilihan manual. Dipakai untuk
   menandai denah "hari ini" di daftar tombol. */
function vipDenahKeyOtomatis(d,tanggal){
  const ov=(d&&d.master&&d.master.layoutOverrides)||{};
  if(ov&&ov[tanggal]&&vipDenah(d,ov[tanggal])) return ov[tanggal];
  const hari=new Date(tanggal+'T00:00:00').getDay();
  return (hari===5||hari===6)?'weekend':'weekday';
}
/* Denah mana yang harus DITAMPILKAN untuk reservasi yang sudah tersimpan.
   Panel Detail cuma tahu daftar meja yang dikunci, bukan lantainya — dan
   menggambar denah lantai 1 untuk reservasi lantai 2 menghasilkan denah yang
   semua mejanya pudar tanpa satu pun yang tersorot, yang terbaca sebagai
   "mejanya hilang". Jadi dipilih denah yang paling banyak memuat mejanya. */
function vipDenahKunci(d,tanggal,dipilih){
  const otomatis=vipDenahKeyOtomatis(d,tanggal);
  const cocok=k=>{
    const L=vipDenah(d,k); if(!L||!Array.isArray(L.tables)) return -1;
    const id={}; L.tables.forEach(t=>{ id[t.id]=1; });
    return (dipilih||[]).filter(m=>id[m]).length;
  };
  /* Semua denah dipertimbangkan, bukan cuma dua. Denah harian dipakai sebagai
     patokan awal supaya reservasi biasa tetap digambar di denah hari itu saat
     mejanya kebetulan ada di beberapa denah sekaligus. */
  let terbaik=otomatis, nilai=cocok(otomatis);
  vipDenahKeys(d).forEach(function(k){
    const n=cocok(k);
    if(n>nilai){ nilai=n; terbaik=k; }
  });
  return terbaik;
}
function vipDenah(d,key){
  const custom=(d&&d.master&&d.master.layouts)||{};
  if(custom&&!Array.isArray(custom)&&custom[key]) return custom[key];
  return (window.LM_VENUE_LAYOUTS||{})[key]||null;
}
/* Gambar denah. Meja yang sudah dipesan tamu lain dimatikan; sisanya bisa
   diklik untuk dikunci. Dikembalikan string kosong bila denahnya tidak ada,
   supaya pemanggilnya bisa jatuh ke daftar tombol biasa — kehilangan denah
   tidak boleh berarti kehilangan kemampuan memesan meja. */
/* Kapasitas meja ditulis bebas di denah: "4", "4-5", "10-12". Yang dipakai
   angka TERBESAR — itu jumlah orang yang benar-benar muat, dan meremehkan
   kapasitas justru membuat orang memesan meja lebih banyak dari perlu. */
function mejaKapasitas(cap){
  const angka=String(cap==null?'':cap).match(/[0-9]+/g);
  return angka?Math.max.apply(null,angka.map(Number)):0;
}
let VIP_CAP={};   // {idMeja: kapasitas} untuk denah yang sedang tampil
/* Ringkasan slot: tiap meja terpilih beserta kapasitasnya, lalu totalnya
   dibandingkan dengan jumlah tamu. Tanpa ini orang harus menjumlah sendiri di
   kepala dan baru sadar kurang meja saat tamunya sudah datang. */
function vipRingkasSlotHTML(){
  const f=VIP_FORM, pilih=f.meja||[], butuh=vipPax(f);
  if(!pilih.length) return '<span class="cell-sub">Belum ada meja dipilih — klik meja di denah.</span>';
  const total=pilih.reduce(function(a,m){ return a+(VIP_CAP[m]||0); },0);
  let h='<div class="vip-slot-chips">';
  pilih.forEach(function(m){
    // Lantainya ikut ditulis: "12" di lantai 1 dan "62" di lantai 2 sama-sama
    // angka pendek, dan tanpa penanda ini daftar meja campuran tidak bisa
    // dibaca sebagai dua lantai yang berbeda.
    const lt=VIP_MEJA_LT[m];
    h+='<span class="vip-chip">'+esc(m)+(lt?'<i>Lt.'+lt+'</i>':'')
      +(VIP_CAP[m]?'<i>'+VIP_CAP[m]+' org</i>':'<i>? org</i>')+'</span>';
  });
  h+='</div>';
  const kurang=butuh&&total<butuh;
  h+='<div class="vip-slot-total'+(kurang?' kurang':'')+'">'
   +'<b>Total '+total+' slot</b> dari '+pilih.length+' meja'
   +(butuh?' · butuh '+butuh+' orang'+(kurang?' — <b>kurang '+(butuh-total)+' slot</b>':' · cukup'):'')
   +'</div>';
  return h;
}
function vipSegarkanRingkas(){
  const el=$('vip_ringkas'); if(el) el.innerHTML=vipRingkasSlotHTML();
  // Hitungan "n dipilih" di tombol lantai ikut disegarkan; kalau tidak, angka

/* opts.tanggal  — dipakai panel Detail, yang tidak punya VIP_FORM.
   opts.bacaSaja — denah cuma dipandang: mejanya tidak bisa diklik. Dipakai saat
                   melihat reservasi lama; menggambar ulang denah yang bisa
                   diklik di sana akan mengundang orang mengubah kunciannya dari
                   layar yang niatnya cuma membaca. */
function vipDenahHTML(d,terpakai,dipilih,opts){
  opts=opts||{};
  const tgl=opts.tanggal||(VIP_FORM&&VIP_FORM.tanggal)||today();
  const bacaSaja=!!opts.bacaSaja;
  const kunci=bacaSaja?vipDenahKunci(d,tgl,dipilih):vipDenahKey(d,tgl);
  const L=vipDenah(d,kunci);
  if(!L||!Array.isArray(L.tables)||!L.tables.length) return '';
  /* VIP_CAP milik pemilih meja. Denah baca-saja (panel Detail) TIDAK boleh
     menimpanya: kalau Detail dibuka sementara draft form masih hidup, ringkasan
     slot form ikut memakai kapasitas denah tanggal lain.

     Kapasitas dikumpulkan dari DUA LANTAI sekaligus, bukan cuma dari denah yang
     sedang tergambar. Kalau tidak, memilih meja di lantai 1 lalu menengok
     lantai 2 membuat ringkasan slot berubah jadi "? org" untuk meja yang tadi
     sudah dipilih — seolah pilihannya rusak. */
  if(!bacaSaja){
    VIP_CAP={}; VIP_MEJA_LT={};
    vipDenahKeys(d).forEach(function(k){
      const X=vipDenah(d,k); if(!X||!Array.isArray(X.tables)) return;
      const lt=vipDenahLantai(d,k);
      X.tables.forEach(function(t){
        VIP_CAP[t.id]=mejaKapasitas(t.cap);
        // Meja yang muncul di beberapa denah: lantainya sama saja, jadi yang
        // pertama menang dan sisanya tidak perlu menimpa.
        if(!VIP_MEJA_LT[t.id]) VIP_MEJA_LT[t.id]=lt;
      });
    });
  }
  const W=window.LM_SEAT_W||1600, H=window.LM_SEAT_H||1160;
  const px=v=>(v/W*100).toFixed(3)+'%', py=v=>(v/H*100).toFixed(3)+'%';
  let h='<div class="denah"><div class="denah-in">';
  (L.fixed||[]).forEach(fx=>{
    h+='<div class="dn-fix" style="left:'+px(fx.x)+';top:'+py(fx.y)+';width:'+px(fx.w)+';height:'+py(fx.h)+'">'+esc(fx.label||'')+'</div>';
  });
  L.tables.forEach(t=>{
    const off=!!terpakai[t.id] && dipilih.indexOf(t.id)<0;
    const on=dipilih.indexOf(t.id)>=0;
    const st='left:'+px(t.x)+';top:'+py(t.y)+';width:'+px(t.w)+';height:'+py(t.h);
    const judul=esc(t.id+(t.cap?' · '+t.cap+' pax':''));
    if(bacaSaja){
      h+='<div class="dn-meja'+(on?' on':'')+(on?'':' dn-pudar')+'" style="'+st+'" data-meja="'+esc(t.id)+'" title="'+judul+'">'
        +'<span>'+esc(t.id)+'</span>'+(t.cap?'<span class="dn-cap">'+esc(t.cap)+'</span>':'')+'</div>';
      return;
    }
    h+='<button type="button" class="dn-meja'+(on?' on':'')+(off?' off':'')+'" style="'+st+'" data-meja="'+esc(t.id)+'" '
      +(off?'disabled title="Dipesan '+esc(terpakai[t.id])+'"'
           :'onclick="vipToggleMeja(this,\''+escJs(t.id)+'\')" title="'+esc(t.id+(t.cap?' · '+t.cap+' pax':''))+'"')
      +'><span>'+esc(t.id)+'</span>'+(t.cap?'<span class="dn-cap">'+esc(t.cap)+'</span>':'')+'</button>';
  });
  h+='</div></div>';
  if(bacaSaja){
    h+='<div class="dn-legend"><span><i style="background:var(--gold-deep);border:1.5px solid var(--gold-deep)"></i>Meja yang dikunci</span>'
     +'<span class="cell-sub">Denah: '+esc(L.name||kunci)+'</span></div>';
    return h;
  }
  h+='<div class="dn-legend"><span><i style="background:var(--ink-880);border:1.5px solid var(--line-hard)"></i>Kosong</span>'
   +'<span><i style="background:var(--gold-deep);border:1.5px solid var(--gold-deep)"></i>Dipilih</span>'
   +'<span><i style="background:var(--danger-bg);border:1.5px solid var(--danger)"></i>Sudah dipesan</span>'
   +'<span class="cell-sub">Denah: '+esc(L.name||kunci)+'</span></div>';
  return h;
}
/* Pindah denah tanpa mengambil ulang data Reservasi — pilihan meja yang sudah
   dibuat di denah sebelumnya TIDAK hilang, karena yang berubah cuma yang
   digambar; daftar f.meja tetap utuh. Satu reservasi memang boleh memakai meja

function vipSetDenah(k){

/* Tombol denah — SEMUA denah yang dikenal modul Reservasi, bukan cuma dua:
   Weekday, Weekend, Lantai 2, plus template custom yang dibuat kru di sana.
   Denah yang sesuai tanggalnya ditandai "hari ini" supaya orang tahu mana yang
   akan dipakai kalau ia tidak memilih apa-apa, dan jumlah meja terpilih ditulis
   di tiap tombol — tanpa itu, meja yang sudah dikunci di denah sebelah tidak
   terlihat sama sekali dan orang mengira pilihannya hilang saat berpindah. */
function vipDenahBarHTML(){
  const d=VIP_RSV||{}, f=VIP_FORM||{}, dipilih=f.meja||[];
  const tgl=f.tanggal||today();
  const otomatis=vipDenahKeyOtomatis(d,tgl);
  const aktif=vipDenahKey(d,tgl);
  return vipDenahKeys(d).map(function(k){
    const L=vipDenah(d,k);
    const id={}; (L&&L.tables||[]).forEach(t=>{ id[t.id]=1; });
    const n=dipilih.filter(m=>id[m]).length;

      +esc(vipDenahLabel(d,k))

      +'</button>';

/* Daftar meja yang SUDAH DIKUNCI pada tanggal itu, ditulis apa adanya.
   Sebelumnya keterangan ini cuma ada di tooltip meja merah — harus ditunjuk

/* LIHAT DULU, PILIH BELAKANGAN.

function vipPilihMejaUI(d){

async function vipSimpanKunci(){
  const f=VIP_FORM; if(!f)return;
  if(!(f.meja||[]).length) return toast('Meja belum dipilih','Pilih minimal satu meja supaya bisa dikunci di Reservasi.','err');

  try{
    const hasil=await rsvSisipkan(function(d){
      // Diperiksa ULANG di dalam putaran simpan: meja bisa saja baru diambil
      // orang lain di sela-sela kita memilih.
      const terpakai=rsvMejaTerpakai(d,f.tanggal);
      const bentrok=(f.meja||[]).filter(m=>terpakai[m]);
      if(bentrok.length) return {__batal:true,bentrok};
      const now=Date.now();
      const catatan=['RESERVASI RUANG VIP ('+f.jenis+')',
        vipPerusahaan(f)?'Perusahaan: '+vipPerusahaan(f):'',
        f.layoutReq?'Request layout: '+f.layoutReq:'',

        f.catatan||'',
        'Dari modul Marketing — PIC '+userName(f.mktPIC)].filter(Boolean).join('\n');
      return {
        id:'vip-'+f.id, name:f.nama, phone:f.hp, date:f.tanggal, time:f.jamMulai,
        pax:vipPax(f), table:(f.meja||[]).join(', '), sharing:false,
        category:'Corporate / Gathering', foodReq:'', drinkReq:'',
        dpStatus:'Belum', dpMethod:'', dpAmount:0, dpProofData:'', dpProofName:'',
        docReqData:'', docReqName:'', source:'Marketing', picType:'Marketing',
        picName:userName(f.mktPIC), member:false, memberNo:'',
        /* 'Confirmed', BUKAN 'Booking'. Kosakata status modul Reservasi cuma
           Pending/Confirmed/Datang/Cancelled/No-show; status di luar itu tidak
           punya warna di denah, tidak pernah cocok dengan penyaring status, dan
           tidak terhitung benar di rekap "Belum Datang". Reservasi VIP yang
           mejanya sudah dikunci memang setara Confirmed. */
        notes:catatan, vip:true, status:'Confirmed',
        actualPax:0, checkinAt:0, leftAt:0, arrivals:[],
        createdBy:(ME?ME.name:'Marketing'), createdAt:now, updatedAt:now, followups:[]
      };
    });
    if(hasil&&hasil.__batal){
      if(btn){ btn.disabled=false; btn.innerHTML=svg(IC.check)+'Simpan &amp; Kunci di Reservasi'; }
      return toast('Meja keburu diambil','Meja '+hasil.bentrok.join(', ')+' baru saja dipesan tamu lain. Pilih meja lain.','err');
    }
    vipPastikanClient(f);
    f.resId=hasil.rec.id; f.kirimAt=new Date().toISOString();
    const lama=(S.vip||[]).findIndex(x=>x.id===f.id);
    if(lama>=0) S.vip[lama]=f; else { S.vip=S.vip||[]; S.vip.unshift(f); }
    logAct('vip',f.id,'Reservasi VIP '+f.jenis,f.nama+' · '+fmtDate(f.tanggal)+' · meja '+(f.meja||[]).join(', ')+(f.jenis==='Assisted'?' · '+rp(vipNominal(f)):''));
    save(); closeModal(); buildNav();
    toast('Terkunci di Reservasi ⚓',f.nama+' · meja '+(f.meja||[]).join(', ')+' sudah dipesan atas nama ini.','ok');
    go('vip');
  }catch(e){
    if(btn){ btn.disabled=false; btn.innerHTML=svg(IC.check)+'Simpan &amp; Kunci di Reservasi'; }
    toast('Gagal menyimpan',e.message,'err');
  }
}

/* Denah yang digambar di atas baru tebakan: tanpa data server, vipDenahKey()
   hanya bisa menyimpulkan weekday/weekend dari tanggalnya. Denah yang BENAR-
   BENAR dipakai saat mejanya dulu dipilih bisa denah custom atau override
   tanggal yang tersimpan di modul Reservasi. Jadi ditarik di belakang layar
   lalu digambar ulang — Detail tetap terbuka seketika, dan kalau Reservasi
   sedang tak terjangkau yang tampil tetap denah bawaan, bukan kotak kosong. */
/* Cache pendek KHUSUS jalur baca-saja. rsvAmbil() menarik SELURUH data
   Reservasi; tanpa ini, buka-tutup panel Detail sepuluh kali = sepuluh kali
   getAll. Yang dipakai dari data itu cuma bentuk denah (master.layouts &
   layoutOverrides) — nyaris tak pernah berubah dalam hitungan detik, jadi
   basi 60 detik tidak berbahaya. Pemilih meja SENGAJA tidak ikut memakai
   cache ini: di sana yang dibaca justru meja mana yang baru saja diambil
   orang lain, dan data basi di sana berarti meja terpesan dua kali. */
let RSV_DENAH_CACHE={d:null,at:0};
async function vipDetailDenahAsli(v){
  let d;
  if(RSV_DENAH_CACHE.d && Date.now()-RSV_DENAH_CACHE.at<60000){ d=RSV_DENAH_CACHE.d; }
  else{
    try{ d=await rsvAmbil(); }catch(e){ return; }
    RSV_DENAH_CACHE={d:d,at:Date.now()};
  }
  const el=$('vip_det_denah');
  // modal sudah ditutup, atau user keburu membuka Detail reservasi lain
  if(!el || el.getAttribute('data-vip')!==v.id) return;
  const h=vipDenahHTML(d,{},(v.meja||[]),{tanggal:v.tanggal, bacaSaja:true});
  if(h) el.innerHTML=h;
}

function renderReports(V){
  let h=pageHead('Modul K','Reporting & Analytics','Laporan revenue & pax dari event yang sudah closing.',
    '<button class="btn" onclick="exportCSV()">'+svg(IC.down)+'Export CSV</button>');
  const closed=S.events.filter(e=>['Confirmed','Deal','Event Done'].includes(e.status));
  // by type
  // Dikelompokkan per jenis yang DITAMPILKAN: dua event "Lainnya" dengan
  // ketikan berbeda memang dua kategori berbeda, bukan satu tumpukan.
  const byType={}; closed.forEach(e=>{ const k=jenisEvent(e)||'—'; byType[k]=(byType[k]||0)+eventFinance(e).grand; });
  const totalRev=Object.values(byType).reduce((a,b)=>a+b,0);
  const totalPax=closed.reduce((a,e)=>a+(+e.pax||0),0);
  h+='<div class="grid g-3" style="margin-bottom:18px">'+stat('Total Revenue',rpShort(totalRev),closed.length+' event','money')+stat('Total Pax',totalPax.toLocaleString('id-ID'),'tamu terlayani','crm')+stat('Avg per Pax',rp(totalPax?Math.round(totalRev/totalPax):0),'revenue/tamu','report')+'</div>';
  // donut by type
  /* Dulu kartu donat ini berbagi baris dua kolom dengan kartu "Baseline vs
     Uplift". Kartu itu dibuang (lihat catatan di bawah), jadi donatnya berdiri
     sendiri selebar halaman — bukan setengah baris dengan sisi kanan kosong. */
  h+='<div class="card"><h3 style="font-size:15px;margin-bottom:16px">Revenue per Jenis Event</h3><div style="display:flex;gap:24px;align-items:center;flex-wrap:wrap">';
  h+=donutSVG(Object.entries(byType).map(([k,v])=>({label:k,val:v,color:EVENT_COLOR[k]||'--muted'})));
  h+='<div class="legend" style="flex:1">'+Object.entries(byType).map(([k,v])=>'<div class="li"><span class="lc" style="background:var('+(EVENT_COLOR[k]||'--muted')+')"></span>'+esc(k)+'<span class="lv">'+rpShort(v)+'</span></div>').join('')+'</div>';
  h+='</div></div>';
  /* KARTU "BASELINE VS UPLIFT" DIBUANG.
     Uplift = Revenue hari event − (Baseline harian × jumlah hari event).
     Dua sebab angkanya tidak bisa dipercaya, jadi lebih baik tidak ditampilkan
     sama sekali daripada dipakai orang untuk mengambil keputusan:
     1. Baseline-nya diketik manual di Pengaturan — modul ini tidak tahu omzet
        hari non-event, jadi hasilnya cuma sebaik tebakan yang mengisinya.
     2. "jumlah hari event" dihitung dari BANYAKNYA event closed, bukan hari
        kalender unik. Dua event di tanggal yang sama memotong baseline dua
        kali, dan uplift-nya jadi lebih kecil dari yang sebenarnya.
     Kotak isian "Baseline Revenue Harian" di Pengaturan ikut dihapus. Angka
     lama di S.baseline sengaja TIDAK dibuang dari state — kalau suatu saat
     perhitungannya diperbaiki, datanya masih ada. */
  V.innerHTML=h;
}
function donutSVG(data){
  const total=data.reduce((a,d)=>a+d.val,0)||1; let off=0; const r=60,c=2*Math.PI*r;
  let segs='';
  data.forEach(d=>{ const frac=d.val/total; const len=frac*c; segs+='<circle cx="75" cy="75" r="'+r+'" fill="none" stroke="var('+d.color+')" stroke-width="26" stroke-dasharray="'+len+' '+(c-len)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 75 75)"/>'; off+=len; });
  /* Angka penuh ("Rp 125.000.000") jauh lebih panjang dari ringkasan lama
     ("Rp125,0jt"), jadi hurufnya dikecilkan agar tetap muat di lubang donat. */
  return '<div class="donut"><svg width="150" height="150" viewBox="0 0 150 150">'+segs+'<text x="75" y="72" text-anchor="middle" fill="var(--sand)" font-size="11" font-family="Inter">Total</text><text x="75" y="90" text-anchor="middle" fill="var(--gold)" font-size="11" font-weight="700" font-family="Inter">'+rp(total)+'</text></svg></div>';
}
function exportCSV(){
  const rows=[['Event','Client','Jenis','Tanggal','Status','Pax','Grand Total','DP','Terbayar','Sisa','Marketing PIC']];
  S.events.forEach(e=>{ const f=eventFinance(e); rows.push([e.nama,clientName(e.clientId),e.jenis,e.tanggal,e.status,e.pax||0,f.grand,f.dp,f.paid,f.remaining,userName(e.mktPIC)]); });
  const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='laksamana_events_'+today()+'.csv'; a.click();
  toast('Export selesai','Data event diunduh sebagai CSV.','ok');
}

/* ---------- BENTUK ITEM MENU ----------
   Dulu tiap menu cuma STRING nama. Sekarang {n:nama, h:harga} supaya harga
   jual per porsi ikut tercatat.

   Data lama (string murni) TIDAK dibuang dan tidak perlu migrasi merusak: ia
   dinaikkan saat dibaca lewat mdbNorm(). Harga yang belum diisi bernilai null
   — dibedakan dari 0, karena beberapa menu memang gratis (Mineral, Coca Cola)
   dan itu bukan hal yang sama dengan "belum dihargai". */
function mdbNorm(x){
  if(typeof x==='string') return {n:x, h:null};
  if(x && typeof x==='object'){
    var n=String(x.n!=null?x.n:(x.nama!=null?x.nama:'')).trim();
    var h=(x.h===undefined||x.h===null||x.h==='')?null:(+x.h||0);
    return {n:n, h:h};
  }
  return {n:'', h:null};
}
/* Baca angka rupiah dari ketikan/tempelan: "Rp6,000", "6.000", "6000" → 6000.
   Semua non-digit dibuang — harga di sini selalu rupiah bulat, dan pemisah
   ribuannya bisa titik ATAU koma tergantung dari mana disalin. Kosong → null
   ("belum dihargai"), bukan 0 ("gratis"). */
function mdbAngka(v){
  var t=String(v==null?'':v).replace(/[^0-9]/g,'');
  return t===''?null:(+t);
}
function mdbItems(j){ return ((S.menuDb||{})[j]||[]).map(mdbNorm).filter(i=>i.n); }
function mdbSet(j,arr){ S.menuDb[j]=arr.map(i=>({n:i.n, h:(i.h==null?null:+i.h)})); }

function menuDbSemuaMenu(){

  return out.sort((a,b)=>a.localeCompare(b));
}

/* ============================================================
   MENU KALKULATOR — scratchpad harga jual & diskon
   ------------------------------------------------------------
   Bukan quotation resmi (itu di Event Brief). Ini alat cepat: pilih menu dari
   Database Menu, isi JUMLAH PORSI tiap menu & jumlah pax, lihat harga jual per
   pax; lalu masukkan harga deal customer per pax → diskonnya berapa persen.

   YANG DIINPUT ADALAH PORSI (pcs), BUKAN "qty per pax".
   Ini menjawab kasus nyata "100 pax tapi menunya cuma 80 pcs". Dengan model
   lama orang harus mengetik 0,8 — angka yang tidak pernah muncul di mana pun:
   tidak di pesanan dapur, tidak di nota. Salah ketik 0,8 jadi 8 pun tidak
   kelihatan salah. Sekarang yang diketik persis angka yang dipesan (80), dan
   rasio per pax ditampilkan sebagai TURUNAN di bawah kotaknya — berguna untuk
   membandingkan kepadatan porsi antar menu, tapi tidak perlu dihitung sendiri.

   Rumusnya jadi lurus:
     subtotal baris = harga satuan × porsi
     harga jual/pax = total seluruh baris ÷ jumlah pax
   Menu yang porsinya tidak sama dengan jumlah pax (80 dari 100) otomatis
   terhitung benar, tanpa perlakuan khusus.

   TIDAK disimpan ke server — murni hitung-hitungan di layar. Sengaja: harga
   coret-coret negosiasi tidak perlu jadi data kantor, dan tanpa persistensi
   tidak ada yang bisa rusak. State-nya transient di KALK. */
var KALK={ rows:[{ref:'',pcs:100}], pax:100, deal:null };
/* Baris lama memakai {qty} = porsi per pax. Diubah sekali ke {pcs} supaya tidak
   ada dua bentuk yang harus diingat tiap pembaca. */
function kalkNormalRows(){
  var pax=+KALK.pax||0;
  KALK.rows.forEach(function(r){
    if(r.pcs===undefined){ r.pcs=Math.max(0,Math.round((+r.qty||0)*(pax||1))); }
    delete r.qty;
  });
}

/* Label yang dilihat orang di kotak pencarian. Satu tempat saja: dipakai untuk
   MENGISI datalist dan untuk MEMBACA balik pilihannya, jadi keduanya tidak
   mungkin berbeda bentuk. */
function kalkLabel(m){ return m.kat+' - '+m.n+(m.h==null?' (harga -)':' ('+rp(m.h)+')'); }
function kalkLabelRef(ref){
  if(!ref) return '';
  var i=String(ref).indexOf('|'); if(i<0) return '';
  var kat=ref.slice(0,i), nama=ref.slice(i+1);
  var it=mdbItems(kat).filter(function(x){return x.n===nama;})[0];
  return it?kalkLabel({kat:kat,n:nama,h:it.h}):'';
}
/* Kosong -> baris dikosongkan. Cocok -> dipakai. Tidak dikenali -> TIDAK diam-
   diam dibuang: kotaknya dikembalikan ke pilihan sebelumnya dan orangnya
   diberi tahu, karena ketikan setengah jadi yang hilang tanpa pesan terasa
   seperti aplikasi rusak. */
function kalkPilihMenu(i,el){
  if(!KALK.rows[i]) return;
  var teks=String(el.value||'').trim();
  if(!teks){ kalkSetRow(i,'ref',''); return; }
  var m=kalkMenuAll().filter(function(x){return kalkLabel(x)===teks;})[0];
  if(!m){
    el.value=kalkLabelRef(KALK.rows[i].ref);
    toast('Menu tidak dikenali','Pilih dari daftar yang muncul saat mengetik.','err');
    return;
  }
  kalkSetRow(i,'ref',m.kat+'|'+m.n);
}
function kalkSamakanPax(i){
  if(!KALK.rows[i]) return;
  KALK.rows[i].pcs=Math.max(0,Math.round(+KALK.pax||0));
  renderKalkulator($('view'));
}
function kalkHargaRef(ref){
  if(!ref) return null;
  var i=String(ref).indexOf('|'); if(i<0) return null;
  var it=mdbItems(ref.slice(0,i)).filter(function(x){return x.n===ref.slice(i+1);})[0];
  return it?it.h:null;
}
function kalkSet(k,v){
  if(k==='pax') KALK.pax=Math.max(0,Math.round(+v||0));
  else if(k==='deal'){ var t=String(v).replace(/[^0-9]/g,''); KALK.deal=(t===''?null:+t); }
  kalkHitung();
}
function kalkSetRow(i,k,v){
  if(!KALK.rows[i]) return;
  if(k==='pcs') KALK.rows[i].pcs=Math.max(0,Math.round(+v||0));
  else KALK.rows[i][k]=v;
  kalkHitung();
}
// Baris baru bawaannya sebanyak pax — asumsi paling umum, dan tinggal diubah.
function kalkBarisBaru(){ return {ref:'',pcs:Math.max(0,Math.round(+KALK.pax||0))}; }
function kalkTambahRow(){ KALK.rows.push(kalkBarisBaru()); renderKalkulator($('view')); }
function kalkHapusRow(i){ KALK.rows.splice(i,1); if(!KALK.rows.length) KALK.rows.push(kalkBarisBaru()); renderKalkulator($('view')); }
/* Hitung ulang TANPA menggambar ulang halaman — hanya menulis ke sel hasil,
   jadi kotak yang sedang diketik (deal, qty) tidak kehilangan fokus. */
function kalkHitung(){
  kalkNormalRows();
  var pax=+KALK.pax||0, sub=0, adaHargaKosong=false;
  var body=$('kalk_body'); if(!body) return;
  var tr=body.querySelectorAll('tr');
  KALK.rows.forEach(function(r,i){
    var harga=kalkHargaRef(r.ref);
    var pcs=+r.pcs||0;
    var baris=harga==null?0:harga*pcs;          // subtotal = harga satuan × porsi
    if(r.ref && harga==null) adaHargaKosong=true;
    if(harga!=null) sub+=baris;
    var row=tr[i]; if(!row) return;
    row.querySelector('.kalk-harga').textContent = harga==null?'—':rp(harga);
    row.querySelector('.kalk-rowsub').textContent = (harga==null||!r.ref)?'—':rp(baris);
    /* Rasio per pax: turunan, ditampilkan supaya porsi antar menu bisa
       dibandingkan ("yang ini cuma 0,8 per orang"). Tidak pernah diketik. */
    var rs=row.querySelector('.kalk-perpax-baris');
    if(rs){
      if(!pax||!pcs) rs.textContent='—';
      else{
        var per=pcs/pax;
        rs.textContent='= '+(per%1?per.toFixed(2).replace('.',','):per)+' porsi / pax'
          +(pcs<pax?'  ·  '+(pax-pcs)+' pax tidak kebagian':'');
      }
    }
  });
  /* Harga jual per pax = total seluruh menu dibagi jumlah tamu. DIBULATKAN:
     pembagian hampir selalu menyisakan pecahan (Rp 1.234.567 ÷ 100), dan harga
     per pax berkoma bukan angka yang dipakai siapa pun saat menawar. */
  var perPax = pax ? Math.round(sub/pax) : 0;
  var set=function(id,v){ var el=$(id); if(el) el.textContent=v; };
  var totalPcs=KALK.rows.reduce(function(a,r){ return a+(r.ref?(+r.pcs||0):0); },0);
  set('kalk_pcs', totalPcs.toLocaleString('id-ID')+' pcs');
  set('kalk_sub', rp(sub)+(adaHargaKosong?'  ⚠':''));
  set('kalk_perpax', rp(perPax)+' / pax');
  // diskon dari harga deal
  var deal=KALK.deal;
  if(deal==null || perPax<=0){
    set('kalk_selisih','—'); set('kalk_totaldeal','—');
    var d0=$('kalk_diskon'); if(d0){ d0.textContent='—'; d0.className=''; d0.style.fontWeight='700'; d0.style.color=''; }
    return;
  }
  var selisih=perPax-deal;                 // + = customer bayar lebih murah (diskon)
  var pct=selisih/perPax*100;
  set('kalk_selisih', (selisih>=0?'−':'+')+rp(Math.abs(selisih))+' / pax');
  set('kalk_totaldeal', rp(deal*pax));
  var d=$('kalk_diskon'); if(d){
    if(Math.abs(pct)<0.005){ d.textContent='Tanpa diskon (harga sama)'; d.style.color='var(--muted)'; }
    else if(pct>0){ d.textContent='Diskon '+pct.toFixed(pct%1?2:0)+'%'; d.style.color='var(--ok)'; }
    else{ d.textContent='Markup '+Math.abs(pct).toFixed(pct%1?2:0)+'% (deal di atas harga jual)'; d.style.color='var(--danger)'; }
  }
}

/* Saringan dikerjakan LANGSUNG DI DOM, bukan lewat render ulang. Menggambar
   ulang halaman tiap ketukan akan membuang fokus dari kotak pencariannya
   sendiri — kata kedua tidak akan pernah bisa diketik. */
function menuDbSaring(q,bersihkan){
  _mdbCari=q||'';
  const kotak=$('mdb_cari');
  if(bersihkan && kotak){ kotak.value=''; kotak.focus(); }
  const kata=_mdbCari.trim().toLowerCase();
  const grid=$('mdb_grid'); if(!grid) return;
  let cocokMenu=0, kartuTampil=0;
  [...grid.querySelectorAll('.mdb-kartu')].forEach(k=>{
    const namaJenis=k.dataset.jenis||'';
    const jenisCocok = kata && namaJenis.includes(kata);
    const items=[...k.querySelectorAll('.mdb-item')];
    let ada=0;
    items.forEach(it=>{
      // Jenis yang namanya cocok menampilkan SELURUH isinya — mencari
      // "dessert" lalu cuma melihat menu bernama "dessert" itu tidak berguna.
      const tampil = !kata || jenisCocok || (it.dataset.menu||'').includes(kata);
      it.hidden=!tampil; if(tampil) ada++;
    });
    cocokMenu+=ada;
    const kosongAsli=k.querySelector('.mdb-kosong');
    const nihil=k.querySelector('.mdb-nihil');
    const tampilKartu = !kata || jenisCocok || ada>0;
    k.hidden=!tampilKartu; if(tampilKartu) kartuTampil++;
    if(nihil) nihil.hidden = !(kata && ada===0 && !kosongAsli);
    if(kosongAsli) kosongAsli.hidden = !!kata;
  });
  const lbl=$('mdb_hasil');
  if(lbl) lbl.textContent = kata
    ? cocokMenu+' menu cocok di '+kartuTampil+' jenis'
    : '';
  const nihilAll=$('mdb_nihil_all'); if(nihilAll) nihilAll.hidden = !(kata && kartuTampil===0);
}

/* ---------- IMPOR DAFTAR MENU (tempel dari spreadsheet) ----------
   Mengetik puluhan menu satu per satu itu lambat dan rawan salah ketik. Ini
   menerima tempelan langsung dari Excel/Sheets dengan susunan kolom:
     NO | KATEGORI | NAMA MENU | SATUAN | HARGA
   Bentuk ringkas 2–3 kolom (KATEGORI | NAMA | HARGA) juga diterima.

   KATEGORI KOSONG DIWARISKAN dari baris di atasnya — di spreadsheet aslinya
   baris lanjutan memang dikosongkan, dan kalau tidak diwariskan menu-menu itu
   akan mendarat di kategori bernama "Fried Wonton". */
function mdbParseTempel(teks){
  var out=[], katTerakhir='', lewat=0;
  String(teks||'').split(/\r?\n/).forEach(function(baris){
    if(!baris.trim()) return;
    var sel=baris.split('\t').map(function(x){return String(x).trim();});
    if(sel.length===1) sel=baris.split(/\s{2,}/).map(function(x){return String(x).trim();});
    var kat,nama,harga;
    if(sel.length>=4){ kat=sel[1]; nama=sel[2]; harga=sel[4]!==undefined?sel[4]:sel[3]; }
    else { kat=sel[0]; nama=sel[1]; harga=sel[2]; }
    if(!nama){ lewat++; return; }
    // baris judul tabel
    if(/^nama\s*menu$/i.test(nama) || /^kategori$/i.test(kat)){ lewat++; return; }
    if(kat) katTerakhir=kat; else kat=katTerakhir;
    if(!kat){ lewat++; return; }
    var h=null;
    if(harga!==undefined && String(harga).trim()!==''){
      h=mdbAngka(harga);      // "Rp0" tetap 0 — gratis, bukan "belum dihargai"
    }
    out.push({kat:kat, n:nama, h:h});
  });
  return {baris:out, lewat:lewat};
}

function menuDbImporJalan(){

/* confirmUI, bukan confirm() bawaan browser. Sisa aplikasi memakai dialog

function menuDbTambahMenu(j){
  if(!menuDbBisaUbah()) return;
  const el=$('mdb_'+j); if(!el) return;
  // Boleh beberapa sekaligus dipisah koma — mengetik satu per satu itu lambat.
  /* "Nama = harga" boleh, harga boleh dilewat. Pemisah harga pakai '=' bukan
     ':' supaya nama menu yang memang memuat ':' tidak terpotong. */
  const baru=el.value.split(',').map(x=>x.trim()).filter(Boolean).map(x=>{
    const p=x.split('=');
    const n=p[0].trim();
    const h=p.length>1?mdbAngka(p.slice(1).join('=')):null;
    return {n:n, h:(p.length>1 && n)?(h||0):null};
  }).filter(x=>x.n);
  if(!baru.length) return;
  if(!Array.isArray(S.menuDb[j])) S.menuDb[j]=[];
  const ada=S.menuDb[j].map(mdbNorm);
  const masuk=[];
  baru.forEach(m=>{
    // Tolak duplikat yang cuma beda huruf besar-kecil — justru itu yang bikin
    // rekap per menu pecah jadi dua baris.
    if(!ada.some(x=>x.n.toLowerCase()===m.n.toLowerCase()) &&
       !masuk.some(x=>x.n.toLowerCase()===m.n.toLowerCase())){ ada.push(m); masuk.push(m); }
  });
  mdbSet(j,ada);
  el.value='';
  if(!masuk.length){ toast('Tidak ada yang baru','Semua menu itu sudah ada di "'+j+'".','err'); return; }
  logAct('menudb',j,'Menu ditambah',j+': '+masuk.map(x=>x.n).join(', '));
  _mdbFokus='mdb_'+j;          // render ulang mengembalikan fokus ke kotak ini
  menuDbSimpan();
  toast('Ditambahkan',masuk.length+' menu masuk ke "'+j+'".','ok');
}
/* Hapus TANPA dialog, tapi BISA DIURUNGKAN. Tombol × di tiap pil kecil dan
   menempel pada namanya, jadi salah tekan itu wajar — dan sebelumnya menu
   langsung lenyap, harus diketik ulang. Dialog konfirmasi per pil akan
   menyiksa saat merapikan sepuluh item sekaligus, jadi yang dipakai
   "urungkan": cepat untuk yang disengaja, tetap aman untuk yang tidak. */
function menuDbHapusMenu(j,m){
  if(!menuDbBisaUbah()) return;
  const arr=mdbItems(j);
  const posisi=arr.findIndex(x=>x.n===m);      // dikembalikan ke tempat semula
  if(posisi<0) return;
  const item=arr[posisi];                      // HARGANYA ikut disimpan untuk urungkan
  mdbSet(j,arr.filter((x,i)=>i!==posisi));
  logAct('menudb',j,'Menu dihapus',j+': '+m);
  menuDbSimpan();
  toast('Menu dihapus','"'+m+'" dari '+j,'ok',{label:'Urungkan',fn:function(){
    if(!menuDbBisaUbah()) return;
    const kini=mdbItems(j);
    if(kini.some(x=>x.n.toLowerCase()===m.toLowerCase())) return;   // sudah ada lagi
    kini.splice(Math.min(posisi,kini.length),0,item);
    mdbSet(j,kini);
    logAct('menudb',j,'Penghapusan menu diurungkan',j+': '+m);
    menuDbSimpan();
    toast('Dikembalikan','"'+m+'" kembali ke '+j,'ok');
  }});
}
/* Ubah harga langsung dari tabel. Kotak dikosongkan = harga belum diisi (null),
   BUKAN nol — "belum dihargai" berbeda dari "gratis", dan beberapa menu memang
   Rp0 (Mineral, Coca Cola). */
function menuDbSetHarga(j,m,val){
  if(!menuDbBisaUbah()) return;
  const arr=mdbItems(j);
  const it=arr.filter(x=>x.n===m)[0]; if(!it) return;
  const kosong=String(val==null?'':val).trim()==='';
  const baru=kosong?null:(mdbAngka(val)||0);
  if(it.h===baru) return;
  it.h=baru; mdbSet(j,arr);
  logAct('menudb',j,'Harga menu diubah',j+': '+m+' → '+(baru==null?'(kosong)':rp(baru)));
  save(); paintMenuDatalist();
  toast('Harga disimpan',m+' — '+(baru==null?'dikosongkan':rp(baru)),'ok');
}

/* Office membalas nomor HP di field `noHp` — lihat aksi_list_divisi_roster()
   di account-mysql. Kode lama membaca `m.hp`, yang tidak pernah ada, jadi
   nomornya SELALU kosong. Dibaca lewat satu tempat ini supaya tidak salah lagi;
   `hp` tetap diterima kalau suatu saat backend mengirim nama itu. */
function hpDariOffice(m){ return String((m&&(m.noHp||m.hp))||'').trim(); }
/* Office TIDAK punya kolom divisi tersendiri: tim/divisi kru ditulis sebagai
   teks bebas di kolom `keterangan` (mis. "Event", "Bar", "Marketing Event").
   Itu sebabnya kolom Divisi selalu kosong — tidak ada yang menurunkannya.
   Dicocokkan sebagai KATA UTUH ke daftar divisi Marketing (getCats()), cara
   yang sama dipakai modul Kompas untuk menurunkan tim PIC-nya. Kata utuh,
   bukan potongan, supaya "Barista" tidak terbaca sebagai divisi "Bar". */
/* ---------- JABATAN OFFICE -> ROLE MARKETING ----------
   Office (Kelola User) hanya punya satu kolom teks bebas `keterangan` untuk
   jabatan: "Marketing & Digital", "Finance", "Event Manager", "Barista", dst.
   Role di Pegawai & Akses diturunkan dari teks itu.

   URUTAN PENTING dan sengaja begini: yang lebih berkuasa diperiksa lebih dulu.
   "Marketing Manager" harus jadi Manager / Approver, bukan Marketing — kalau
   urutannya dibalik, orang yang berwenang menyetujui penawaran justru kehilangan
   hak approval-nya. Dicocokkan sebagai KATA UTUH supaya "Barista" tidak terbaca
   sebagai "bar" dan "Administrasi" tidak terbaca sebagai "admin". */
const ROLE_JABATAN=[
  [['super','admin'],'super_admin'], [['administrator'],'super_admin'], [['it'],'super_admin'],
  [['owner'],'manager'], [['direktur'],'manager'], [['director'],'manager'],
  [['manager'],'manager'], [['manajer'],'manager'], [['gm'],'manager'],
  [['kepala'],'manager'], [['supervisor'],'manager'], [['approver'],'manager'],
  [['finance'],'finance'], [['keuangan'],'finance'], [['accounting'],'finance'],
  [['akunting'],'finance'], [['kasir'],'finance'], [['cashier'],'finance'],
  [['marketing'],'marketing'], [['sales'],'marketing'], [['penjualan'],'marketing']
];
function roleDariJabatan(ket){
  const kata=String(ket||'').toLowerCase().split(/[^a-z0-9]+/i).filter(Boolean);
  if(!kata.length) return '';
  const cocok=ROLE_JABATAN.find(([kunci])=>kunci.every(k=>kata.indexOf(k)>=0));
  return cocok?cocok[1]:'';
}
/* TIM seseorang, apa adanya seperti diketik di Office -> Kelola User -> kolom
   "Tim / Keterangan". Disimpan di `u.jabatan` (nama field lama, dari zaman
   kolom itu masih disebut jabatan) dan jatuh ke `u.div` untuk kru lama yang
   terlanjur tersimpan sebelum kolom itu ikut disinkronkan. Satu tempat baca
   supaya tampilan, penurunan role, dan penyaring tim tidak pernah berselisih. */
function timUser(u){ return String((u&&u.jabatan)||(u&&u.div)||'').trim(); }
/* Apakah orang ini anggota TIM MARKETING?
   Kolom "Tim / Keterangan" di Office adalah satu-satunya sumber: isinya
   "Marketing", "Kitchen", "Bar", "Floor", boleh ditambah keterangan lain.
   Dicocokkan sebagai KATA UTUH, jadi "Marketing Manager" dan "Sales &
   Partnership" tetap terbaca Tim Marketing — beda dengan roleDariJabatan()
   yang sengaja mendahulukan kata berkuasa ("manager") supaya hak approval
   tidak hilang. Dua pertanyaan yang berbeda: roleDariJabatan menjawab "boleh
   apa", fungsi ini menjawab "tim mana", dan Marketing Performance memakai
   yang kedua. Bidang `div` ikut dibaca karena di situlah divisi hasil
   terjemahan tersimpan untuk kru lama. */
function timMarketing(u){
  const kata=timUser(u).toLowerCase().split(/[^a-z0-9]+/i).filter(Boolean);
  return kata.indexOf('marketing')>=0 || kata.indexOf('sales')>=0 || kata.indexOf('penjualan')>=0;
}
function divisiDariKeterangan(ket){
  const kata=String(ket||'').toLowerCase().split(/[^a-z0-9]+/i).filter(Boolean);
  if(!kata.length) return '';
  return getCats().find(d=>{
    const dl=String(d).toLowerCase().split(/[^a-z0-9]+/i).filter(Boolean);
    return dl.length && dl.every(w=>kata.indexOf(w)>=0);
  })||'';
}

   ROLE & HAK AKSES — isi bagian bawah halaman Pegawai & Akses

// Tombol siklus di matriks Hak Akses: klik geser None(0) -> Lihat(1) -> Ubah(2) -> None.

    +(canMU?'<button class="btn sm pri" onclick="saveRoleMatrix()">'+svg(IC.check)+'Simpan Matriks</button>':'')+'</div>';

      const locked=r==='super_admin'||!canMU;

      return '<td class="mx-role">'+(locked

        :'<button type="button" class="perm-btn" data-v="'+val+'" data-role="'+r+'" data-view="'+v+'" title="'+PERM_OPT[val][1]+' — klik untuk ubah" onclick="cyclePerm(this)">'+['None','Lihat','Ubah'][val]+'</button>')+'</td>';
    }).join('')+'</tr>';
  });
  h+='</tbody></table></div>';
  h+='<div class="tbl-note">'+svg(IC.alert)+'<span>Kolom <em>Super Admin</em> terkunci penuh — supaya tidak ada yang bisa terkunci dari sistem.</span></div>';

function saveRoleMatrix(){
  if(!can('manage_users'))return toast('Akses ditolak','Kamu tidak punya izin kelola user.','err');
  S.roleAcc=S.roleAcc||{};
  Object.keys(ROLES).forEach(r=>{
    if(r==='super_admin')return; // selalu penuh
    const acc={};
    document.querySelectorAll('.perm-btn[data-role="'+r+'"]').forEach(btn=>{ acc[btn.dataset.view]=Number(btn.dataset.v); });
    if((acc.dashboard??PERM_NONE)<PERM_VIEW) acc.dashboard=PERM_VIEW; // selalu punya pintu masuk
    S.roleAcc[r]=acc;
  });
  logAct('user','-','Matriks hak akses role diperbarui','');
  save(); buildNav(); toast('Matriks disimpan','Hak akses per role diperbarui.','ok'); go('staff');
}
/* importOfficeUsers() DIBUANG bersama tombol "Tarik dari Office".
   Ia menarik hanya ANGGOTA MODUL Marketing dan menuntut PIN admin, jadi kru
   yang belum diberi akses modul ini tidak pernah ikut — persis keluhan "kenapa
   datanya belum terupdate". Penggantinya autoSyncOfficeRoster(), yang membaca
   seluruh database user tanpa PIN dan jalan sendiri tiap modul dibuka. */
function roleCell(u,canMU){
  if(!canMU) return esc(namaRole(u.role));
  /* Pilihan kosong ikut ditawarkan. Tanpa itu, orang tanpa Tim tampil seolah
     ber-role Super Admin (pilihan pertama yang tersorot karena tak ada yang
     cocok), dan tidak ada cara mencabut akses seseorang dari layar ini. */
  return '<select class="inp" style="padding:5px 8px;font-size:12px;min-width:150px" onchange="changeUserRole(\''+u.id+'\',this.value)">'
    +'<option value=""'+(u.role?'':' selected')+'>Belum ada akses</option>'
    +Object.entries(ROLES).map(([k,v])=>'<option value="'+k+'"'+(u.role===k?' selected':'')+'>'+esc(v.t)+'</option>').join('')+'</select>';
}
function changeUserRole(id,role){
  if(!can('manage_users'))return toast('Akses ditolak','Kamu tidak punya izin kelola user.','err');
  const u=S.users.find(x=>x.id===id); if(!u)return;
  if(role&&!ROLES[role])return;      // '' sah: mencabut akses
  const old=u.role; if(old===role)return;
  /* Divisi TIDAK lagi ikut terhapus saat role berubah. Dulu ia cuma dipakai
     untuk menyaring papan Task Divisi bagi role Operational, jadi dibuang
     begitu rolenya bukan itu. Sekarang divisi adalah data pegawai — mengubah
     role seseorang jadi Manager tidak membuat dia berhenti bekerja di Bar. */
  u.role=role;
  // namaRole(), bukan ROLES[..].t: role kosong (akses dicabut) tidak punya
  // baris di ROLES dan dulu melempar TypeError tepat saat pencabutan disimpan.
  logAct('user',u.id,'Role diubah',namaRole(old)+' → '+namaRole(role));
  save(); buildNav(); toast('Role diperbarui',u.name+' sekarang '+namaRole(role).toLowerCase()+'.','ok'); go('staff');
}
function openUserAccess(id){
  const u=S.users.find(x=>x.id===id); if(!u)return;
  const isSA=u.role==='super_admin';
  const acc=userAcc(u);
  let b='';
  if(isSA) b+='<div class="tbl-note">'+svg(IC.alert)+'<span><em>Super Admin</em> selalu punya akses penuh dan tidak bisa dibatasi — supaya tidak ada yang terkunci dari sistem.</span></div>';
  b+=permLegend();
  b+='<div class="field"><label>Hak akses per menu</label><div class="tbl-wrap" id="ua_acc"><table class="tbl"><tbody>'
    +permViewKeys().map(v=>{
      const m=NAV_DEF.find(x=>x.k===v);
      const val=isSA?PERM_EDIT:(acc[v]??PERM_NONE);
      return '<tr><td class="cell-strong">'+esc(m.t)+'</td><td class="mx-role">'
        +(isSA?'<button type="button" class="perm-btn" data-v="2" disabled title="Super Admin selalu akses penuh">Ubah</button>'

   +(isSA?'':'<button class="btn pri" onclick="saveUserAccess(\''+u.id+'\')">Simpan</button>')+'</div>','wide');
}
function saveUserAccess(id){
  const u=S.users.find(x=>x.id===id); if(!u)return;
  const acc={};
  document.querySelectorAll('#ua_acc .perm-btn[data-view]').forEach(btn=>{ acc[btn.dataset.view]=Number(btn.dataset.v); });
  if((acc.dashboard??PERM_NONE)<PERM_VIEW) acc.dashboard=PERM_VIEW; // selalu punya pintu masuk
  u.acc=acc; delete u.nav; delete u.perms; // buang bentuk lama (array) — sudah diganti u.acc
  const nView=Object.values(acc).filter(v=>v>=PERM_VIEW).length, nEdit=Object.values(acc).filter(v=>v>=PERM_EDIT).length;
  logAct('user',u.id,'Hak akses diperbarui',nView+' menu terlihat · '+nEdit+' boleh diubah');
  save(); closeModal(); buildNav(); toast('Hak akses disimpan','Akses '+u.name+' diperbarui.','ok'); go('staff');
}
function resetUserAccess(id){
  const u=S.users.find(x=>x.id===id); if(!u)return;
  delete u.acc; delete u.nav; delete u.perms;
  logAct('user',u.id,'Hak akses direset','kembali ke default role '+ROLES[u.role].t);
  save(); closeModal(); buildNav(); toast('Direset','Akses '+u.name+' kembali ke default role.','ok'); go('staff');
}

function saveSettings(){
  const g=(k,f)=>f?parseFloat($('set_'+k).value):$('set_'+k).value;
  // discountThreshold DIBUANG bersama approval berbasis ambang diskon. Kotaknya
  // sudah tidak ada di halaman ini — membacanya berarti `null.value` dan
  // seluruh Simpan Pengaturan gagal tanpa pesan.
  Object.assign(S.settings,{dpPercent:+$('set_dp').value,pb1:+$('set_pb1').value,serviceCharge:+$('set_service').value,fuTarget:+$('set_fu').value,invPrefix:$('set_inv').value,kwPrefix:$('set_kw').value,waBooking:$('set_wa').value,fuNextDays:+$('set_funext').value||3,staleDays:+$('set_stale').value||7});
  // S.baseline TIDAK dibaca lagi: kotaknya sudah tidak ada di halaman ini, dan
  // membacanya berarti `null.value` — persis kegagalan diam yang sudah pernah
  // terjadi pada discountThreshold di atas.
  save(); toast('Tersimpan','Pengaturan diperbarui.','ok');
}
// Kembali ke pemilih modul Office. Sesi Office (lm_session) sengaja TIDAK
// dihapus supaya user bisa pindah modul tanpa login ulang; sign-out penuh
// hanya lewat tombol Keluar di Office.
function logout(){ localStorage.removeItem('lm_me'); location.replace('../'); }

/* ============================================================
   INIT
   ============================================================ */
async function boot(){
  // Identitas hanya dari Office (SSO). Sembunyikan layar login lokal sejak awal
  // supaya tak berkedip sebelum auto-login.
  $('login').style.display='none';
  await apiLoad();
  // pastikan semua koleksi ada (data lama mungkin belum punya taskTemplates dll)
  ['users','staff','clients','events','followups','activities','notifs','approvals','taskTemplates','taskCategories'].forEach(k=>{ if(!Array.isArray(S[k])) S[k]=[]; });
  // setting baru mungkin belum ada di data lama -> isi dari default
  S.settings = Object.assign({}, DEFAULT_SETTINGS, S.settings||{});
  // Migrasi sekali jalan: DP standar kini 50% (dari sebelumnya 30%). Setelah ini
  // masih bisa diubah manual di Pengaturan; flag mencegah pemaksaan berulang.
  if(!S.settings._dp50){ S.settings.dpPercent=50; S.settings._dp50=true; }
  // Migrasi sekali jalan: buang user contoh bawaan seed lama ('u_nahkoda').
  // Identitas asli hanya datang dari Office, jadi user dummy ini menyesatkan.
  if(S.users.some(u=>u.id==='u_nahkoda')){
    S.users=S.users.filter(u=>u.id!=='u_nahkoda');
    S.clients.forEach(c=>{ if(c.mktPIC==='u_nahkoda') c.mktPIC=''; });
    S.events.forEach(e=>{ if(e.mktPIC==='u_nahkoda') e.mktPIC=''; });
    logAct('user','-','User contoh dibersihkan','Nahkoda (data bawaan) dihapus dari daftar user');
    save();
  }
  // otomasi: tutup event yang tanggalnya sudah lewat
  if(autoCloseEvents()>0) save();
  // sembunyikan layar loading
  const ls=document.getElementById('api-loading-screen'); if(ls)ls.style.display='none';
  window.LM_LOGO=window.__LOGO__; window.LM_ICON=window.__ICON__;
  $('login-logo').src=window.__LOGO__; $('brand-logo').src=window.__ICON__;
  initLogin();
  // Gerbang SSO: identitas datang dari Office (lm_session). Tanpa sesi yang
  // berhak, gate di atas <head> sudah memulangkan ke portal; di sini kita
  // langsung masuk sebagai user Office tanpa layar login lokal.
  const office = readLmSession();
  if(office){
    const u = resolveOfficeUser(office);
    // Office v3 tak lagi mengirim `role` (lihat resolveOfficeUser), jadi satu-satunya
    // sinyal identitas yang masih hidup dari Office adalah adminModules (siapa admin
    // modul ini). Admin modul Office -> super_admin; selain itu role tersimpan
    // DIPERTAHANKAN (tidak ditimpa tiap boot) supaya koreksi manual owner di Staff
    // tidak diam-diam hilang.
    const oAdm = office.adminModules||[];
    const effRole = (oAdm.includes('*')||oAdm.includes('marketing')) ? 'super_admin' : (u.role || 'marketing');
    if(u.role!==effRole){
      logAct('user',u.id,'Role disinkronkan dari sesi Office',namaRole(u.role)+' → '+namaRole(effRole));
      u.role=effRole; save();
    }
    ME = u; // referensi langsung ke record tersimpan, bukan salinan
    localStorage.setItem('lm_me', u.id);
    $('login').style.display='none'; $('app').classList.add('on');
    buildNav(); updateTopUser(); bootRoute();
    autoSyncOfficeRoster(); // tanpa await: render dulu, sync roster jalan di belakang
  }
}
</script>

<!-- ===== Part B: Kelola Akses Office (membership modul, self-contained) =====
     Muncul hanya untuk admin modul ini (adminModules dari lm_session mengandung
     '*' atau MODULE_KEY). Menulis Grants lewat Office Apps Script. Server membatasi
     setiap tulisan ke modul milik pemanggil (requireModuleAdmin_). marketing -->
<div id="lmaModal" class="lma-modal" hidden>
  <div class="lma-card">
    <div class="lma-head">
      <div><div class="lma-title">Kelola Akses Modul</div><div class="lma-sub" id="lmaSub"></div></div>
      <button type="button" class="lma-x" id="lmaClose" aria-label="Tutup">&#10005;</button>
    </div>
    <label class="lma-adv"><input type="checkbox" id="lmaAdv"> Mode lanjutan (atur pengecualian grant/deny per orang)</label>
    <div class="lma-list" id="lmaList"></div>
  </div>
</div>
<style>
.lma-launch{display:block;margin:0 12px 10px;border:1px solid #7A560F;border-radius:10px;padding:9px 12px;font-family:'Inter',system-ui,sans-serif;font-size:13px;font-weight:700;color:#fff;background:linear-gradient(135deg,#C8961F,#7A560F);box-shadow:0 4px 12px rgba(122,86,15,.25);cursor:pointer;text-align:center}
.lma-launch:hover{filter:brightness(1.06)}
.lma-launch[hidden]{display:none}
.lma-modal[hidden]{display:none}
.lma-modal{position:fixed;inset:0;z-index:9000;display:flex;align-items:flex-start;justify-content:center;padding:24px;background:rgba(42,38,32,.5);backdrop-filter:blur(3px);overflow-y:auto}
.lma-card{width:100%;max-width:520px;margin:auto;background:#fff;border:1px solid #E7E1D3;border-radius:16px;box-shadow:0 18px 48px rgba(50,42,28,.22);font-family:'Inter',system-ui,sans-serif}
.lma-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 20px;border-bottom:1px solid #E7E1D3}
.lma-title{font-weight:800;font-size:17px;color:#2A2620}
.lma-sub{font-size:12.5px;color:#5C574D;margin-top:2px}
.lma-x{width:32px;height:32px;border:1px solid #E7E1D3;border-radius:9px;background:#fff;color:#5C574D;cursor:pointer;font-size:15px}
.lma-x:hover{border-color:#C9432B;color:#C9432B;background:#F8E4DF}
.lma-adv{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:#2A2620;padding:12px 20px 4px;cursor:pointer}
.lma-adv input{width:15px;height:15px;accent-color:#A9791F}
.lma-list{padding:8px 20px 20px;display:flex;flex-direction:column;gap:7px}
.lma-row{display:flex;align-items:center;gap:11px;border:1px solid #E7E1D3;border-radius:11px;padding:9px 12px}
.lma-av{width:34px;height:34px;flex:none;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:12px;background:linear-gradient(135deg,#C8961F,#7A560F)}
.lma-info{flex:1;min-width:0}
.lma-info b{font-size:13.5px;color:#2A2620;display:block}
.lma-info span{font-size:11px;color:#5C574D}
.lma-src{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;border-radius:20px;padding:1px 7px;border:1px solid #E7E1D3;color:#5C574D;background:#F2E9D3;flex:none}
.lma-toggle{position:relative;width:42px;height:24px;flex:none;border-radius:20px;background:#E7E1D3;border:none;cursor:pointer;transition:background .15s}
.lma-toggle::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.lma-toggle.on{background:#1F9D5F}
.lma-toggle.on::after{left:20px}
.lma-empty{padding:20px;text-align:center;color:#5C574D;font-size:13px}
.lma-actions{display:flex;gap:5px;flex:none}
.lma-mini{border:1px solid #E7E1D3;background:#fff;border-radius:8px;font-size:11px;font-weight:700;padding:5px 9px;cursor:pointer;color:#5C574D}
.lma-mini.act-grant.on{background:#E4F5EC;color:#1F9D5F;border-color:#1F9D5F}
.lma-mini.act-deny.on{background:#F8E4DF;color:#C9432B;border-color:#C9432B}
@media(max-width:860px){.lma-launch{display:none}}

<script>
(function(){
  var MODULE_KEY = "marketing";
  // OFFICE_WEBAPP_URL: dideklarasikan sekali di atas (dipakai bareng autoSyncOfficeRoster).
  var creds=null, MEMBERS=[], ADV=false;
  function sess(){ try{ return JSON.parse(localStorage.getItem('lm_session')||'null'); }catch(e){ return null; } }
  function adminsThis(){ var s=sess(); var a=(s&&s.adminModules)||[]; return a.indexOf('*')>-1 || a.indexOf(MODULE_KEY)>-1; }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function initials(n){ return String(n||'?').trim().split(/\s+/).slice(0,2).map(function(w){return w[0]||'';}).join('').toUpperCase(); }
  async function call(action, extra){
    var s=sess(); if(!s) return {ok:false,error:'no_session'};
    if(!creds){ var pin=prompt('Masukkan PIN Anda untuk mengelola akses modul:'); if(!pin) return null; creds={name:s.name, pin:String(pin).trim()}; }
    var res=await fetchOffice({method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(Object.assign({action:action, callerName:creds.name, callerPin:creds.pin}, extra||{}))});
    return res.json();
  }
  function render(){
    var list=document.getElementById('lmaList');
    if(!MEMBERS.length){ list.innerHTML='<div class="lma-empty">Belum ada user.</div>'; return; }
    list.innerHTML=MEMBERS.map(function(m,i){
      var src = m.source==='grant' ? 'khusus' : (m.access ? 'role' : '');
      var ctrl = ADV
        ? '<div class="lma-actions"><button class="lma-mini act-grant'+(m.access&&m.source==='grant'?' on':'')+'" data-i="'+i+'" data-act="grant">Grant</button>'
          + '<button class="lma-mini act-deny'+(!m.access&&m.source==='grant'?' on':'')+'" data-i="'+i+'" data-act="deny">Deny</button></div>'
        : '<button class="lma-toggle'+(m.access?' on':'')+'" data-i="'+i+'" data-act="toggle" aria-label="Akses"></button>';
      return '<div class="lma-row"><div class="lma-av">'+esc(initials(m.name))+'</div>'
        + '<div class="lma-info"><b>'+esc(m.name)+(m.active?'':' <span style="color:#928C80">(nonaktif)</span>')+'</b>'
        + '<span>'+esc(m.keterangan||'')+'</span></div>'
        + (src?'<span class="lma-src">'+src+'</span>':'') + ctrl + '</div>';
    }).join('');
  }
  async function load(){
    var list=document.getElementById('lmaList');
    list.innerHTML='<div class="lma-empty">Memuat&#8230;</div>';
    var data=await call('listModuleMembers',{module:MODULE_KEY});
    if(data===null){ document.getElementById('lmaModal').hidden=true; return false; }  // batal PIN
    if(!data.ok){ creds=null; list.innerHTML='<div class="lma-empty">'+(data.error==='forbidden'?'PIN salah atau Anda bukan admin modul ini.':('Gagal: '+esc(data.error)))+'</div>'; return false; }
    MEMBERS=data.members||[]; render(); return true;
  }
  async function setAccess(i, access){
    var m=MEMBERS[i]; if(!m) return;
    var data=await call('setModuleAccess',{module:MODULE_KEY, userId:m.id, access:access});
    if(data===null) return;
    if(!data.ok){ alert(data.error==='forbidden'?'Tidak berwenang untuk modul ini.':('Gagal: '+data.error)); return; }
    await load();
  }
  // Dipakai User Management untuk menarik daftar user asli dari database Office.
  // null = user membatalkan PIN; {error} = gagal; {members} = berhasil.
  window.lmaListMembers=async function(){
    var data=await call('listModuleMembers',{module:MODULE_KEY});
    if(data===null) return null;
    if(!data.ok){ creds=null; return {error:data.error||'gagal'}; }
    return {members:data.members||[]};
  };
  window.openKelolaAkses=async function(){
    document.getElementById('lmaSub').textContent='Modul '+MODULE_KEY+'. Aktifkan untuk memberi akses membuka modul ini.';
    document.getElementById('lmaModal').hidden=false;
    await load();
  };
  document.addEventListener('click', function(e){
    var t=e.target;
    if(t.id==='lmaLaunch'){ window.openKelolaAkses(); return; }
    if(t.id==='lmaClose'||t.id==='lmaModal'){ document.getElementById('lmaModal').hidden=true; return; }
    var btn=t.closest ? t.closest('[data-act]') : null; if(!btn) return;
    var i=+btn.dataset.i, act=btn.dataset.act, m=MEMBERS[i]; if(!m) return;
    if(act==='toggle') setAccess(i, !m.access);
    else if(act==='grant') setAccess(i, true);
    else if(act==='deny') setAccess(i, false);
  });
  document.addEventListener('change', function(e){ if(e.target && e.target.id==='lmaAdv'){ ADV=e.target.checked; render(); } });
  // Launcher "Kelola Akses" (grant/deny akses Office ke modul ini) SENGAJA tidak
  // pernah ditampilkan di Marketing — superadmin sudah mengelola ini dari konsol
  // Kelola Akses di landing page, jadi tombol duplikat di sini tidak diperlukan.
  // window.lmaListMembers tetap terpasang untuk pemakai lain di masa depan;
  // halaman Pegawai & Akses TIDAK lagi memakainya — ia menarik roster lewat
  // autoSyncOfficeRoster() yang membaca seluruh database user tanpa PIN.
})();
</script>
