/* ============================================================
   TABEL: PENGURUTAN + HALAMAN
   ------------------------------------------------------------
   Satu mesin untuk semua tabel daftar di modul ini. Tiap tabel cukup
   mendeklarasikan KOLOMnya sekali:

     const KOL=[{k:'nama', t:'Client', v:c=>c.nama},
                {k:'nilai',t:'Total',  v:c=>c.total, cls:'mono', turun:1, def:1},
                {t:''}];                       // kolom tanpa v = tidak bisa diurut

   lalu memakai tblHead(kunci,KOL) untuk kepalanya, tblUrut() untuk isinya,
   tblPage()/tblPagerHtml() untuk halamannya. Menaruhnya di satu tempat berarti
   perilaku pengurutan & paginasi tidak akan berbeda-beda antar halaman.

   Dua perilaku yang disengaja:
   - Pager TIDAK digambar kalau isinya cuma satu halaman, jadi tabel pendek
     tetap bersih seperti sebelumnya.
   - Nomor halaman DIJEPIT ke jumlah halaman yang ada. Tanpa ini, menyaring
     dari 200 baris jadi 5 baris sementara kita di halaman 8 akan menampilkan
     tabel kosong yang terlihat seperti data hilang.

   Keadaannya (halaman aktif & kolom urut) sengaja hanya hidup di memori
   sesi ini — bukan di S. Ini pilihan tampilan satu orang; kalau ikut S, ia
   akan tersimpan ke server dan mengubah tampilan semua orang.
   ============================================================ */
const TBL_PER_HAL_DEF=25;
// Baris yang tinggi (banyak chip / teks berparagraf) diberi jatah lebih sedikit.
const TBL_PER_HAL={crm:15, events:15, invoices:15, approval:15, pegawai:20, timeline:30, riwayat:20,
                   todo:10, upcoming:10};   // dua ini menumpang di Dashboard, jangan sampai mendominasi
const TBL_HAL={};      // kunci -> nomor halaman aktif
const TBL_SIG={};      // kunci -> sidik jari saringan terakhir
const TBL_SORT={};     // kunci -> {k, arah}
const TBL_RENDER={};   // kunci -> penggambar ulang khusus (kalau tabelnya dicat parsial)
function tblPerHal(k){ return TBL_PER_HAL[k]||TBL_PER_HAL_DEF; }
function tblGambar(k){ const f=TBL_RENDER[k]; if(f) f(); else refreshView(); }
/* sig = sidik jari saringan (opsional). Kalau saringannya berubah, halaman
   balik ke 1 — kalau cuma datanya bertambah/berkurang, posisi halaman
   DIPERTAHANKAN supaya sinkronisasi latar tidak melempar pembaca ke awal. */
function tblPage(arr,k,sig){
  if(sig!==undefined && TBL_SIG[k]!==sig){ TBL_SIG[k]=sig; TBL_HAL[k]=1; }
  const per=tblPerHal(k), total=arr.length;
  const maxHal=Math.max(1,Math.ceil(total/per));
  const hal=Math.min(Math.max(1,TBL_HAL[k]||1),maxHal);
  const mulai=(hal-1)*per, akhir=Math.min(mulai+per,total);
  return {hal,maxHal,mulai,akhir,total,items:arr.slice(mulai,akhir)};
}
function tblSetPage(k,n){ TBL_HAL[k]=Number(n)||1; tblGambar(k); }
// Navigasi bernomor. Halaman yang jauh dari halaman aktif diringkas jadi "…"
// supaya barisnya tidak melebar tak terkendali saat datanya ribuan.
function tblPagerHtml(p,k){
  if(p.maxHal<=1) return '';
  const nomor=[];
  for(let i=1;i<=p.maxHal;i++){
    if(i===1||i===p.maxHal||Math.abs(i-p.hal)<=1) nomor.push(i);
    else if(nomor[nomor.length-1]!=='…') nomor.push('…');
  }
  return '<div class="tbl-pager"><span class="cell-sub" style="margin:0">'+(p.mulai+1)+'–'+p.akhir+' dari '+p.total+'</span>'
    +'<div class="tbl-pager-nav">'
    +'<button class="btn sm"'+(p.hal<=1?' disabled':'')+' title="Halaman sebelumnya" onclick="tblSetPage(\''+k+'\','+(p.hal-1)+')">‹</button>'
    +nomor.map(n=>n==='…'?'<span class="tbl-pager-gap">…</span>'
      :'<button class="btn sm'+(n===p.hal?' pri':'')+'" onclick="tblSetPage(\''+k+'\','+n+')">'+n+'</button>').join('')
    +'<button class="btn sm"'+(p.hal>=p.maxHal?' disabled':'')+' title="Halaman berikutnya" onclick="tblSetPage(\''+k+'\','+(p.hal+1)+')">›</button>'
    +'</div></div>';
}
/* Kolom urut aktif. Kalau belum pernah dipilih (atau kolomnya sudah tidak ada
   lagi karena tabelnya berubah), dipakai kolom bertanda `def`, atau kolom
   pertama yang bisa diurut. `turun:1` = bawaannya menurun (mis. nominal &
   tanggal — yang terbesar/terbaru hampir selalu yang dicari lebih dulu). */
function tblUrutState(k,kolom){
  const bisa=kolom.filter(c=>c.k&&c.v);
  if(!bisa.length) return null;
  let s=TBL_SORT[k];
  if(!s || !bisa.some(c=>c.k===s.k)){
    const d=bisa.find(c=>c.def)||bisa[0];
    s={k:d.k,arah:d.turun?-1:1};
    TBL_SORT[k]=s;
  }
  return s;
}
function tblSortKlik(k,key){
  const s=TBL_SORT[k];
  TBL_SORT[k]=(s&&s.k===key)?{k:key,arah:-s.arah}:{k:key,arah:1};
  TBL_HAL[k]=1;                 // urutan baru: mulai lagi dari halaman pertama
  tblGambar(k);
}
function tblUrut(rows,k,kolom){
  const s=tblUrutState(k,kolom); if(!s) return rows;
  const c=kolom.find(x=>x.k===s.k); if(!c||!c.v) return rows;
  /* Angka dibandingkan sebagai angka, sisanya sebagai teks dengan aturan
     bahasa Indonesia + numeric:true — supaya "Item 2" datang sebelum
     "Item 10", dan huruf besar/kecil tidak mengacak urutan nama. */
  return rows.slice().sort((a,b)=>{
    const va=c.v(a), vb=c.v(b);
    const kosongA=(va==null||va===''), kosongB=(vb==null||vb==='');
    if(kosongA&&kosongB) return 0;
    if(kosongA) return 1;        // yang kosong selalu di bawah, arah apa pun
    if(kosongB) return -1;
    const r=(typeof va==='number'&&typeof vb==='number')
      ? va-vb
      : String(va).localeCompare(String(vb),'id',{numeric:true,sensitivity:'base'});
    return r*s.arah;
  });
}
function tblHead(k,kolom){
  const s=tblUrutState(k,kolom);
  return '<thead><tr>'+kolom.map(c=>{
    const atr=(c.cls?' class="'+c.cls+'"':'')+(c.w?' style="width:'+c.w+'"':'');
    if(!c.k||!c.v) return '<th'+atr+'>'+(c.t||'')+'</th>';
    const aktif=s&&s.k===c.k;
    return '<th'+atr+'><button type="button" class="th-sort'+(aktif?' on':'')+'" '
      +'onclick="tblSortKlik(\''+k+'\',\''+escJs(c.k)+'\')" '
      +'title="Urutkan menurut '+esc(c.t||c.k)+'">'+esc(c.t||'')
      +'<span class="th-ar">'+(aktif?(s.arah>0?'▲':'▼'):'↕')+'</span></button></th>';
  }).join('')+'</tr></thead>';
}

function crmData(){
  return S.clients.filter(c=>{
    if(ME.role==='marketing' && c.mktPIC!==ME.id && false)return false; // marketing sees all clients per matrix (F)
    const r=crmFilter.rel;
    if(r==='open' && !clientOpenEvents(c.id).length)return false;
    if(r && r.indexOf('stage:')===0){ const st=r.slice(6); if(!S.events.some(e=>e.clientId===c.id && e.status===st))return false; }
    if(r==='deal' && !clientWonEvents(c.id).length)return false;
    if(r==='repeat' && clientDoneEvents(c.id).length<2)return false;
    if(r==='nodeal' && clientWonEvents(c.id).length)return false;

/* ---------- HAPUS CLIENT (permanen, konfirmasi ketat) ----------
   Melengkapi CRUD Database Client, yang sebelumnya hanya C-R-U.

   DUA PENJAGA, dan yang pertama lebih penting daripada yang kedua:

   1. CLIENT YANG MASIH PUNYA EVENT TIDAK BISA DIHAPUS SAMA SEKALI. Bukan
      diperingatkan — DITOLAK. Event menyimpan clientId, dan nama kliennya
      dibaca ulang lewat clientName() di belasan tempat: daftar event, kanban
      pipeline, invoice, brief, quotation, papan Task Divisi, dan ekspor
      laporan. Kalau clientnya hilang, semua itu berubah jadi "—" tanpa satu
      pun pesan galat — persis jenis kerusakan senyap yang sudah pernah mahal
      di modul ini. Kaskade juga bukan jawaban: menghapus client tidak boleh
      diam-diam ikut membuang event beserta jejak uangnya.
      Jalan keluarnya ditunjukkan, bukan cuma dilarang: daftar eventnya
      ditampilkan dan bisa dibuka langsung dari sini.

   2. Kalau sudah bersih dari event, namanya harus DIKETIK PERSIS — sama
      seperti hapus event. Klik "Ya" terlalu murah untuk tindakan permanen.

   Riwayat follow up umum ikut terhapus, dan jumlahnya disebut lebih dulu di
   layar konfirmasi supaya tidak ada yang hilang tanpa diketahui. */
function delClient(id){
  const c=S.clients.find(x=>x.id===id); if(!c)return;
  if(!can('del_client'))return toast('Akses ditolak','Kamu tidak punya izin menghapus client. Atur di User Management → Matriks Hak Akses.','err');
  const evs=S.events.filter(e=>e.clientId===id);
  const fus=S.followups.filter(f=>f.clientId===id);
  const kepala='<div class="modal-head"><div><h3>Hapus Client Permanen</h3><p>'+esc(c.nama)+' · '+esc(c.perusahaan||'Perorangan')+'</p></div><div class="x" onclick="closeModal()">'+svg(IC.x)+'</div></div>';

  if(evs.length){
    /* Ditolak, bukan diperingatkan. Tombol hapusnya memang tidak ada di sini —
       satu-satunya jalan maju adalah membereskan eventnya lebih dulu. */
    const sp=clientSpending(id);
    modal(kepala
     +'<div class="modal-body">'
     +'<div class="tbl-note" style="margin-top:0;border-color:var(--danger);color:var(--danger)">'+svg(IC.alert)
       +'<span>Client ini <em>tidak bisa dihapus</em> karena masih memegang <b>'+evs.length+' event</b>'
       +(sp?' dengan total belanja '+rp(sp):'')+'. Menghapusnya akan membuat event-event itu kehilangan nama client '
       +'di daftar event, pipeline, invoice, brief, dan laporan — tanpa pesan galat apa pun.</span></div>'
     +'<div class="tbl-note">'+svg(IC.alert)+'<span>Pindahkan event ke client lain, atau hapus event-nya lebih dulu (butuh izin hapus event). Sesudah client ini tidak memegang event mana pun, tombol hapus akan muncul.</span></div>'
     +'<h4 style="font-size:14px;margin:16px 0 10px">Event yang masih terhubung ('+evs.length+')</h4>'
     +'<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Event</th><th>Tanggal</th><th>Tahap</th><th></th></tr></thead><tbody>'
     +evs.map(e=>'<tr><td class="cell-strong">'+esc(e.nama)+'</td><td class="mono">'+fmtDate(e.tanggal)+'</td><td>'+statusChip(e.status)+'</td>'
       +'<td><button class="btn sm" onclick="closeModal();go(\'event\',\''+e.id+'\')">Buka</button></td></tr>').join('')
     +'</tbody></table></div>'
     +'</div><div class="modal-foot"><button class="btn" onclick="closeModal()">Tutup</button>'
     +'<button class="btn pri" onclick="closeModal();viewClient(\''+id+'\')">Kembali ke client</button></div>');
    return;
  }

  modal(kepala
   +'<div class="modal-body">'
   +'<div class="tbl-note" style="margin-top:0">'+svg(IC.alert)+'<span>Tindakan ini <em>permanen</em> dan <em>tidak bisa dibatalkan</em>. Data di bawah ikut terhapus.</span></div>'
   +'<dl class="kv-list" style="margin-top:14px">'
     +'<dt>Kontak</dt><dd class="mono">'+esc(c.hp||'—')+'</dd>'
     +'<dt>Source</dt><dd>'+esc(c.source||'—')+'</dd>'
     +'<dt>Event terhubung</dt><dd class="mono">0 · aman dihapus</dd>'
     +'<dt>Riwayat follow up</dt><dd class="mono"'+(fus.length?' style="color:var(--danger);font-weight:600"':'')+'>'+fus.length+(fus.length?' · ikut terhapus':'')+'</dd>'
     +'<dt>Terdaftar sejak</dt><dd class="mono">'+fmtDate(c.createdAt)+'</dd>'
   +'</dl>'
   +'<div class="field" style="margin-top:16px"><label>Ketik <b>'+esc(c.nama)+'</b> untuk konfirmasi<span class="req">*</span></label>'
   +'<input class="inp" id="delc_confirm" autocomplete="off" placeholder="'+esc(c.nama)+'" data-n="'+esc(c.nama)+'" oninput="var b=document.getElementById(\'delc_btn\'); b.disabled = !namaCocok(this.value,this.dataset.n)"></div>'
   +'</div><div class="modal-foot"><button class="btn" onclick="closeModal()">Batal</button>'
   +'<button class="btn danger-solid" id="delc_btn" disabled onclick="doDelClient(\''+id+'\')">'+svg(IC.trash)+'Hapus permanen</button></div>');
  setTimeout(function(){ var el=$('delc_confirm'); if(el)el.focus(); },40);
}
function doDelClient(id){
  const c=S.clients.find(x=>x.id===id); if(!c)return;
  if(!can('del_client'))return toast('Akses ditolak','Kamu tidak punya izin menghapus client.','err');
  const el=$('delc_confirm');
  if(!el||!namaCocok(el.value,c.nama))return toast('Nama tidak cocok','Ketik nama client persis seperti tertulis.','err');
  /* Diperiksa ULANG di sini, bukan hanya saat modal dibuka. Modal bisa dibiarkan
     terbuka sementara event baru dibuat di tab lain — dan kalau itu terjadi,
     penjaganya harus tetap menolak. */
  const evs=S.events.filter(e=>e.clientId===id);
  if(evs.length){ closeModal(); return toast('Dibatalkan','Client ini sekarang memegang '+evs.length+' event. Bereskan event-nya lebih dulu.','err'); }
  const nFU=S.followups.filter(f=>f.clientId===id).length;
  S.clients=S.clients.filter(x=>x.id!==id);
  S.followups=S.followups.filter(f=>f.clientId!==id);
  logAct('client','-','Client dihapus permanen',c.nama+(c.perusahaan?' · '+c.perusahaan:'')+' · '+nFU+' follow up · oleh '+ME.name);
  save(); closeModal();
  toast('Client dihapus',c.nama+' dihapus permanen.','ok'); go('crm');
}

function pipeStatusOfEv(e){
  /* Status 'Event Done' dibaca lebih dulu daripada pipeCol, dan sengaja
     mengembalikan nilai yang TIDAK cocok dengan kolom mana pun — itulah cara
     event selesai tersaring keluar dari kanban. autoCloseEvents() versi lama
     menutup event sambil menyetel pipeCol='Deal'; kalau pipeCol dibaca lebih
     dulu, event lama itu justru muncul di kolom Deal seolah masih berjalan. */
  if(e.status==='Event Done')return 'Event Done';
  if(e.pipeCol)return e.pipeCol;
  const m={Confirmed:'Deal'};
  return m[e.status] || (PIPE_COLS.includes(e.status)?e.status:'Lead');
}
function pipeKanban(){
  const cols=PIPE_COLS;
  const colColor={Lead:'--muted',Prospect:'--info',Negotiation:'--warn','Quotation Terkirim':'--violet',Deal:'--ok',Lost:'--danger'};
  const mine=ME.role==='marketing';
  let h='<div class="kanban">';

    const items=S.events.filter(e=>pipeStatusOfEv(e)===col && (!mine||e.mktPIC===ME.id));

    items.forEach(e=>{ const val=eventFinance(e).grand;

    h+='</div></div>';
  });
  h+='</div>';
  return h;
}
let dragId=null;
function bindKanban(){
  document.querySelectorAll('.kcard').forEach(card=>{
    card.addEventListener('dragstart',e=>{ dragId=card.dataset.id; card.style.opacity='.4'; e.stopPropagation(); });
    card.addEventListener('dragend',()=>{ card.style.opacity='1'; });
  });
  document.querySelectorAll('.kcol-body').forEach(body=>{
    body.addEventListener('dragover',e=>{ e.preventDefault(); body.closest('.kcol').classList.add('drag-over'); });
    body.addEventListener('dragleave',()=>body.closest('.kcol').classList.remove('drag-over'));
    body.addEventListener('drop',e=>{ e.preventDefault(); body.closest('.kcol').classList.remove('drag-over');
      const col=body.dataset.col; moveEventPipe(dragId,col); });
  });
}

/* ---------- HAPUS EVENT (permanen, konfirmasi ketat) ----------
   Menghapus event ikut membuang pembayaran/kwitansi, follow up, dan antrian approval-nya,
   jadi konfirmasinya menuntut nama event diketik persis — bukan sekadar klik "Ya". */
/* Nama yang diketik dibandingkan SETELAH dinormalkan: spasi di ujung dibuang,
   deretan spasi/tab/nbsp dijadikan satu spasi biasa, huruf besar-kecil diabaikan.

   Ini bukan pelonggaran demi kenyamanan, melainkan perbaikan bug. Pembanding
   lama berbunyi `this.value.trim() !== e.nama` — sisi kiri dipangkas, sisi
   kanan tidak. Event (dan client) yang namanya tersimpan dengan spasi di ujung
   — paling sering dari tempel-salin — JADI TIDAK BISA DIHAPUS SELAMANYA:
   spasinya tak terlihat di layar, jadi yang tampak cuma tombol Hapus yang tidak
   mau menyala berapa kali pun namanya diketik ulang. Nbsp dari salinan dokumen
   berakibat sama, dan bahkan tidak dibersihkan trim().

   Gerbangnya sendiri tetap ada — namanya harus tetap diketik, bukan sekadar
   klik "Ya". Yang dilonggarkan hanya yang tidak bisa dilihat mata. */
function namaCocok(a,b){
  const n=x=>String(x==null?'':x).replace(/[\s ]+/g,' ').trim().toLowerCase();
  return n(a)===n(b);
}
function delEvent(id){

   +(paid?'<div class="tbl-note" style="border-color:var(--danger);color:var(--danger)">'+svg(IC.alert)+'<span>Event ini <em>sudah menerima pembayaran '+rp(paid)+'</em>. Menghapusnya berarti membuang jejak uang masuk — pastikan Finance sudah tahu.</span></div>':'')
   +'<div class="field" style="margin-top:16px"><label>Ketik <b>'+esc(e.nama)+'</b> untuk konfirmasi<span class="req">*</span></label>'
   +'<input class="inp" id="del_confirm" autocomplete="off" placeholder="'+esc(e.nama)+'" data-n="'+esc(e.nama)+'" oninput="var b=document.getElementById(\'del_btn\'); b.disabled = !namaCocok(this.value,this.dataset.n)"></div>'

/* ---------- PENGINGAT TAHAP PIPELINE ----------
   Dulu ini GERBANG: Informasi Dasar (D.1) yang belum lengkap MENOLAK kenaikan
   tahap dan melempar orang ke tab Informasi Dasar. Terlalu mengunci — tahap
   pipeline itu catatan kemajuan negosiasi, bukan sertifikat kelengkapan data,
   dan datanya di lapangan memang sering baru lengkap belakangan. Sekarang tahap
   SELALU boleh naik; yang kurang cuma diingatkan lewat toast. */
const STAGE_NEEDS_BASIC=['Negotiation','Quotation Terkirim','Deal'];
function missingBasic(ev){
  const sec=SEC_BY_ID['basic']; if(!sec)return [];
  // hanya blok "info inti" (sebelum sub-judul Dekorasi) yang mengunci kenaikan tahap —
  // dekorasi & venue kini ikut di tab ini tapi tidak wajib untuk maju tahap.
  const core=[]; for(const fl of sec.fields){ if(fl.t==='head')break; core.push(fl); }
  return core.filter(fl=>fl.req&&fieldVisible(ev,fl)).filter(fl=>{
    const v=getVal(ev,fl.k);
    return v===undefined||v===null||v===''||(Array.isArray(v)&&!v.length);
  }).map(fl=>fl.l);
}
/* Mengingatkan, TIDAK menahan. Ditunda sedikit supaya tidak menumpuk di atas
   toast "Tahap diperbarui" yang muncul lebih dulu. */
function ingatkanStage(ev,col){
  if(!STAGE_NEEDS_BASIC.includes(col))return;
  const miss=missingBasic(ev); if(!miss.length)return;
  setTimeout(()=>toast('Data dasar belum lengkap','Belum terisi: '+miss.slice(0,3).join(', ')+(miss.length>3?' (+'+(miss.length-3)+' lagi)':'')+'. Tahapnya tetap naik — lengkapi kalau sempat.'),700);
}
function setEventStage(id,col){
  const e=S.events.find(x=>x.id===id); if(!e||e.status===col)return;
  const prev=e.status; e.status=col; e.pipeCol=col;
  if(col==='Deal') genTasks(e);
  logAct('event',id,'Tahap diubah',prev+' → '+col);
  save(); toast('Tahap diperbarui',prev+' → '+col,'ok'); ingatkanStage(e,col); go('event',id);
}
function moveEventPipe(id,col){
  const e=S.events.find(x=>x.id===id); if(!e)return;
  ingatkanStage(e,col);
  e.pipeCol=col;
  const prev=e.status; e.status=col;
  logAct('event',id,'Pipeline dipindah',prev+' → '+col);
  if(col==='Deal'){ genTasks(e); toast('Deal! ⚓',e.nama+' masuk tahap eksekusi & handover divisi.','ok'); }
  save(); go('pipeline');
}
function pipeFollowUp(){
  const mine = ME.role==='marketing';
  const openEvs=S.events.filter(e=>isOpenEvent(e) && (!mine||e.mktPIC===ME.id));
  const dueEvs=openEvs.filter(e=>e.nextFU && e.nextFU<=today());
  const myFUcount=S.followups.filter(f=>(!mine||f.by===ME.id)&&f.at.slice(0,10)===today()).length;
  // nurture: client tanpa peluang aktif tapi sengaja dijadwalkan FU (after-sales / repeat)
  const nurture=S.clients.filter(c=>c.nextFU && !clientOpenEvents(c.id).length && (!mine||c.mktPIC===ME.id));
  const staleEvs=openEvs.filter(isStale);
  let h='<div class="grid g-4" style="margin-bottom:16px">'
   +stat('Progress Hari Ini',myFUcount+'/'+S.settings.fuTarget,progressBar(myFUcount,S.settings.fuTarget),'pipe')
   +stat('Jatuh Tempo Hari Ini',dueEvs.length,'peluang perlu di-follow up','clock')
   +stat('Perlu Ditindaklanjuti',staleEvs.length,'≥ '+(+S.settings.staleDays||7)+' hari belum di-follow up','alert')
   +stat('Peluang Aktif',openEvs.length,'Lead → Negotiation','flag')
   +'</div>';
  // --- antrian peluang (event) ---
  h+='<div class="card pad0" style="margin-bottom:14px"><div style="padding:16px 20px;border-bottom:1px solid var(--line-soft)"><h3 style="font-size:15px">Antrian Follow Up · Peluang Aktif</h3><div class="cell-sub">Hasil follow up langsung menggerakkan tahap event di Pipeline.</div></div>';
  if(!openEvs.length)h+=empty('Tidak ada peluang aktif','Semua event sudah Deal atau Lost. Buat peluang baru lewat Input & Event, atau lewat Catat FU → "Peluang baru".','pipe');
  else{
    // yang perlu ditindaklanjuti naik ke atas — yang paling sering hilang karena lupa, bukan ditolak
    const list=openEvs.slice().sort((a,b)=>{
      const sa=isStale(a)?0:1, sb=isStale(b)?0:1;
      if(sa!==sb) return sa-sb;
      return (a.nextFU||'9999').localeCompare(b.nextFU||'9999');
    });
    h+='<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Event</th><th>Client</th><th>Tahap</th><th>Terakhir FU</th><th>Next FU</th><th>Aksi</th></tr></thead><tbody>';
    list.forEach(e=>{ const overdue=e.nextFU&&e.nextFU<today(); const dueToday=e.nextFU===today(); const stale=isStale(e); const d=daysSinceFU(e);
      h+='<tr><td class="row-click" onclick="go(\'event\',\''+e.id+'\')"><div class="cell-strong">'+esc(e.nama)+(stale?' <span class="chip" style="background:color-mix(in srgb,var(--danger) 15%,transparent);color:var(--danger)"><span class="cd" style="background:var(--danger)"></span>Perlu ditindaklanjuti</span>':'')+'</div><div class="cell-sub">'+fmtDate(e.tanggal)+'</div></td>'
       +'<td>'+esc(clientName(e.clientId))+'</td><td>'+statusChip(e.status)+'</td>'

       +'<td><button class="btn sm" onclick="logFollowUp(\''+e.clientId+'\',\''+e.id+'\')">'+svg(IC.plus)+'Catat FU</button></td></tr>'; });
    h+='</tbody></table></div>';

    h+='<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Client</th><th>Kontak</th><th>Next FU</th><th>Aksi</th></tr></thead><tbody>';
    nurture.slice().sort((a,b)=>(a.nextFU||'9999').localeCompare(b.nextFU||'9999')).forEach(c=>{
      h+='<tr><td class="row-click" onclick="viewClient(\''+c.id+'\')"><div class="cell-strong">'+esc(c.nama)+'</div><div class="pill-row">'+clientTags(c.id)+'</div></td>'
       +'<td>'+esc(c.hp||'—')+'</td><td class="mono">'+fmtDate(c.nextFU)+'</td>'
       +'<td><button class="btn sm" onclick="logFollowUp(\''+c.id+'\')">'+svg(IC.plus)+'Catat FU</button></td></tr>'; });
    h+='</tbody></table></div></div>';
  }
  return h;
}
/* Follow Up menempel ke EVENT (peluang). Kalau belum ada peluang, bisa dibuat
   di sini juga, atau dicatat sebagai FU umum/after-sales (tak mengubah status). */
function logFollowUp(clientId,presetEventId){

  const sel=presetEventId||(open[0]?open[0].id:'__new__');

   +(prevFU.length?('<details style="margin-bottom:14px"><summary style="cursor:pointer;font-size:12.5px;font-weight:600;color:var(--sand-dim)">Riwayat follow up sebelumnya ('+prevFU.length+')</summary><div style="margin-top:8px;max-height:220px;overflow:auto">'
     +prevFU.map(f=>{ const fe=S.events.find(x=>x.id===f.eventId); return '<div style="font-size:12px;padding:7px 0;border-bottom:1px solid var(--line-soft)"><div class="cell-sub">'+f.at.replace('T',' ')+' · '+esc(userName(f.by))+' · '+(fe?esc(fe.nama):'Umum / after-sales')+'</div><div><b>'+esc(f.action)+'</b> → '+esc(f.hasil)+'</div>'+(f.note?'<div class="cell-sub">'+esc(f.note)+'</div>':'')+'</div>'; }).join('')
   +'</div></details>'):'')
   +'<div class="field"><label>Follow up ini untuk<span class="req">*</span></label><select class="inp" id="fu_event" onchange="fuEventChange()">'
     + open.map(e=>'<option value="'+e.id+'"'+(sel===e.id?' selected':'')+'>'+esc(e.nama)+' · '+esc(e.status)+' · '+fmtDate(e.tanggal)+'</option>').join('')
     + '<option value="__new__"'+(sel==='__new__'?' selected':'')+'>+ Peluang baru (buat event)</option>'
     + '<option value="__umum__">Umum / after-sales (tidak mengubah status)</option>'
   +'</select><div class="fh">Hasil follow up akan menggerakkan tahap event yang dipilih di Pipeline.</div></div>'
   +'<div id="fu_newev" style="display:none"><div class="form-grid">'+ff('Nama Event','fu_enama','','text',1)
     +'<div class="field"><label>Jenis Event</label><select class="inp" id="fu_ejenis">'+EVENT_TYPES.map(t=>'<option>'+t+'</option>').join('')+'</select></div>'
     +'<div class="field"><label>Tanggal (perkiraan)</label><input class="inp" type="date" id="fu_etanggal" value="'+today()+'"></div>'
   +'</div></div>'
   +'<div class="form-grid"><div class="field"><label>Jenis Aktivitas</label><select class="inp" id="fu_action"><option>Call</option><option>WA</option><option>Meeting</option><option>Visit</option><option>Email</option></select></div>'
   +'<div class="field"><label>Hasil</label><select class="inp" id="fu_hasil">'+Object.keys(FU_RESULT).map(k=>'<option>'+k+'</option>').join('')+'</select></div>'
   +'<div class="field full"><label>Catatan</label><textarea class="inp" id="fu_note" placeholder="Ringkasan hasil follow up..."></textarea></div>'
   +'<div class="field full"><label>Jadwalkan Follow Up Berikutnya</label><input class="inp" type="date" id="fu_next" value="'+nextFUDate()+'"><div class="fh">Otomatis +'+(+S.settings.fuNextDays||3)+' hari (atur di Pengaturan). Kosongkan bila peluang sudah Deal/Lost.</div></div></div>'
   +'</div><div class="modal-foot"><button class="btn" onclick="closeModal()">Batal</button><button class="btn pri" onclick="saveFollowUp(\''+clientId+'\')">Simpan Follow Up</button></div>');

}
function fuEventChange(){
  const el=$('fu_newev'); if(el) el.style.display = ($('fu_event').value==='__new__')?'block':'none';
}
function saveFollowUp(clientId){
  const c=S.clients.find(x=>x.id===clientId);
  const target=$('fu_event').value;
  const action=$('fu_action').value, hasil=$('fu_hasil').value, note=$('fu_note').value.trim(), next=$('fu_next').value;
  let ev=null;
  if(target==='__new__'){
    const en=$('fu_enama').value.trim();
    if(!en)return toast('Nama event wajib','Isi nama peluang/event baru dulu.','err');
    const jenis=$('fu_ejenis').value, tanggal=$('fu_etanggal').value;
    ev={id:uid('e'),clientId,nama:en,jenis,tanggal,status:'Lead',pipeCol:'Lead',mktPIC:(c.mktPIC||ME.id),pax:0,invoiceSent:false,createdAt:today(),detail:{jenis,tanggal},payments:[],tasks:{}};
    S.events.unshift(ev); logAct('event',ev.id,'Peluang baru dibuat (dari Follow Up)',en);
  } else if(target!=='__umum__'){
    ev=S.events.find(e=>e.id===target);
  }
  S.followups.unshift({id:uid('f'),clientId,eventId:ev?ev.id:'',by:ME.id,action,hasil,note,at:new Date().toISOString().slice(0,16),next});
  c.lastContact=today();
  if(ev){
    const stage=FU_RESULT[hasil];
    // Hasil follow up langsung menaikkan tahap, lengkap atau belum datanya —
    // kalau ada yang kurang, ingatkanStage() cuma memberi tahu.
    if(stage && stage!==ev.status){
      ingatkanStage(ev,stage);
      const prev=ev.status; ev.status=stage; ev.pipeCol=stage;
      if(stage==='Deal') genTasks(ev);
      logAct('event',ev.id,'Follow up: '+action,hasil+' · '+prev+' → '+stage+(note?' · '+note:''));
    } else {
      logAct('event',ev.id,'Follow up: '+action,hasil+(note?' · '+note:''));
    }
    // otomasi jadwal: peluang yang sudah diputuskan tak perlu FU lagi
    if(['Deal','Lost'].includes(ev.status)) ev.nextFU='';
    else ev.nextFU = next || nextFUDate();
  } else {
    c.nextFU=next; // FU umum / nurture disimpan di client
    logAct('client',clientId,'Follow up umum: '+action,hasil+(note?' · '+note:''));
  }
  save(); closeModal();
  toast('Follow up dicatat',(ev?esc(ev.nama)+' → '+hasil:c.nama+' → '+hasil),'ok');
  go('pipeline');
}

  return c.nama+(c.perusahaan&&c.perusahaan!==c.nama?' — '+c.perusahaan:'')+(c.hp?' ('+c.hp+')':'');

     +'<div style="display:flex;align-items:center;gap:10px;color:var(--warn)">'+svg(IC.alert,'')+'<div style="color:var(--sand)"><b style="font-size:13px">Peluang masih di tahap '+esc(ev.status)+'</b><div class="cell-sub">Boleh diisi kapan saja — tapi kalau sudah ada kemajuan, jangan lupa perbarui tahapnya.</div></div></div>'
     +(canEdit?'<div style="display:flex;align-items:center;gap:8px"><span class="cell-sub">Pindah ke</span><select class="inp" style="width:auto;padding:7px 12px" onchange="setEventStage(\''+ev.id+'\',this.value)">'
        +PIPE_COLS.map(s=>'<option'+(s===ev.status?' selected':'')+'>'+s+'</option>').join('')
       +'</select></div>':'')
     +'</div>';
  }

  // finance strip
  h+='<div class="grid g-4" style="margin-bottom:18px">'
   +'<div class="card stat"><div class="sl">Grand Total</div><div class="sv num" style="font-size:24px">'+rpShort(f.grand)+'</div><div class="sd">'+rp(f.grand)+'</div></div>'
   +'<div class="card stat"><div class="sl">DP'+(f.dpDariNominal?'':' '+f.dpPct+'%')+'</div><div class="sv num" style="font-size:24px">'+rpShort(f.dp)+'</div><div class="sd">'+(f.paid>=f.dp?'✓ terpenuhi':'belum masuk')+'</div></div>'
   /* "Sisa" adalah Grand Total dikurangi yang SUDAH dibayar — itu angka yang
      ditanyakan client dan finance, dan sekarang ditulis besar di kartunya
      sendiri alih-alih jadi keterangan kecil di bawah "Terbayar". */
   +'<div class="card stat"><div class="sl">Sisa Tagihan</div><div class="sv num" style="font-size:24px">'+rpShort(f.remaining)+'</div><div class="sd">terbayar '+rpShort(f.paid)+' dari '+rpShort(f.grand)+'</div></div>'
   +'<div class="card stat"><div class="sl">Kesiapan Divisi</div><div class="sv num" style="font-size:24px">'+taskProgress(ev)+'%</div><div class="sd">'+eventCats(ev).filter(d=>divProgress(ev,d)>=100).length+'/'+eventCats(ev).length+' kategori</div></div>'
   +'</div>';

  // Kartu Penawaran — unggah PDF, approval Manager, lalu kirim ke client (di atas detailing).
  h+=penawaranCard(ev,canEdit);

  // riwayat follow up peluang ini — supaya bisa ditelusuri langsung dari halaman
  // event, tidak cuma dari Database Client (yang menggabung semua event client itu).
  { const evFUs=S.followups.filter(fu=>fu.eventId===ev.id).sort((a,b)=>b.at.localeCompare(a.at));
    h+='<div class="card" style="margin-bottom:18px"><h4 style="font-size:14px;margin-bottom:10px">Riwayat Follow Up ('+evFUs.length+')</h4>';
    if(!evFUs.length) h+='<div class="muted">Belum ada follow up untuk peluang ini.</div>';
    else { h+='<div class="timeline">'+evFUs.map(fu=>'<div class="tl-item"><div class="tl-t">'+fu.at.replace('T',' ')+' · '+esc(userName(fu.by))+'</div><div class="tl-a">'+esc(fu.action)+' → '+esc(fu.hasil)+'</div><div class="tl-d">'+esc(fu.note||'')+'</div></div>').join('')+'</div>'; }

  // Ringkasan pengisian — di ATAS form, sebelum tab. Overview yang utuh tetap
  // ada sebagai tab tersendiri; yang ini versi ringkasnya supaya keadaan
  // pengisian terlihat tanpa perlu berpindah tab dulu.
  h+=ringkasIsianHTML(ev);

  // tabs
  h+='<div class="tabs" id="ev-tabs">';
  visibleTabs().forEach(tab=>{
    h+='<div class="tab '+(curTab===tab.id?'active':'')+'" data-sec="'+tab.id+'" onclick="switchEventTab(\''+tab.id+'\',\''+ev.id+'\')"><span class="tn">'+tab.n+'</span>'+esc(tab.title)+'</div>';
  });
  h+='</div>';

  h+='<div id="ev-tab-content"></div>';
  V.innerHTML=h;
  renderEventTab(ev,canEdit);
}
function switchEventTab(secId,evId){
  const ev=S.events.find(e=>e.id===evId); if(!ev)return;
  simpanGulir();                       // ingat posisi tab yang DITINGGALKAN
  curTab=secId;
  const tabsEl=$('ev-tabs'); if(tabsEl) tabsEl.querySelectorAll('.tab').forEach(el=>el.classList.toggle('active',el.dataset.sec===secId));
  renderEventTab(ev,can('edit_event'));
  // posisikan konten tepat di bawah tab strip sticky — tidak lompat ke atas halaman
  const c=$('ev-tab-content'); const th=(tabsEl?tabsEl.offsetHeight:44)+64;
  if(c){ const y=c.getBoundingClientRect().top+window.scrollY-th; window.scrollTo({top:Math.max(0,y)}); }
}
/* Posisi gulir diingat PER TAB. Form ini panjang; kembali dari tab lain
   lalu terlempar ke paling atas berarti menggulir ulang mencari tempat
   terakhir mengetik. */
const _gulir={};
function simpanGulir(){
  const v=$('view'); if(v && curTab) _gulir[curTab]=v.scrollTop||0;
}
function pulihkanGulir(){
  const v=$('view'); if(!v) return;
  const y=_gulir[curTab]||0;
  // Setelah innerHTML diganti, tingginya baru terhitung pada frame berikutnya.
  frameBerikutnya(()=>{ v.scrollTop=y; });
}
function renderEventTab(ev,canEdit){
  const tab=TAB_BY_ID[curTab]; if(!tab)return;
  // Overview: rangkuman baca-saja dari isian tab lain, bukan formulir.
  if(tab.id==='overview'){ $('ev-tab-content').innerHTML=renderOverview(ev); pulihkanGulir(); return; }
  const secs=visibleSecsOfTab(tab.id);
  if(!secs.length){ $('ev-tab-content').innerHTML=''; return; }
  // Satu tab bisa memuat beberapa section: tiap section jadi satu kartu
  // (sub-judul), dan yang tidak boleh dilihat user ini sudah tersaring di
  // visibleSecsOfTab — jadi tidak perlu cek hak akses lagi di sini.
  let h='';
  secs.forEach(sec=>{
    const isi=secProgress(ev,sec);
    h+='<div class="card sec-card"><div class="sec-head">'
      +'<div class="sec-id">'+esc(sec.n)+'</div>'
      +'<div class="sec-t"><h3 class="section-title">'+esc(sec.title)+'</h3>'
        +'<p class="section-desc">'+esc(sec.desc)+'</p></div>'
      +'<div class="sec-act">'
        +(isi.total?'<span class="sec-prog'+(isi.isi===isi.total?' penuh':'')+'" title="'+isi.isi+' dari '+isi.total+' isian sudah terisi">'
           +'<span class="sec-bar"><i style="width:'+Math.round(isi.isi/isi.total*100)+'%"></i></span>'
           +isi.isi+'/'+isi.total+'</span>':'')
        +(canEdit?pdfCheckHTML(ev,sec):'')
      +'</div></div>';
    if(sec.id==='finance'){ h+=financeTab(ev,canEdit)+'</div>'; return; }
    h+='<div class="form-grid">';
    sec.fields.forEach(fl=>{ h+=renderField(ev,fl,canEdit); });
    h+='</div>';
    /* DIHAPUS: kartu "Kesiapan divisi X — N% siap" yang dulu menempel di bawah
       setiap section milik sebuah divisi.

       Versi sebelumnya sudah menurunkannya jadi ANGKA saja tanpa tombol masuk
       ke job — dan itu tetap tidak pada tempatnya. Form ini isian MARKETING:
       detail acara yang dijual ke klien. Kesiapan divisi milik divisi
       pelaksana, angkanya berubah karena pekerjaan orang lain, dan tidak ada
       satu pun yang bisa dilakukan terhadapnya dari layar ini. Yang tersisa
       cuma bar 0% menganggur di tengah isian — terbaca seperti tugas marketing
       yang tertunggak, padahal bukan.

       Kesiapan divisi dibaca di halaman Task Divisi (papan lengkapnya) dan di
       Radar (lintas modul). Keduanya memang dibuat untuk itu. */
    h+='</div>';
  });
  if(canEdit){
    const nx=nextTabId(tab.id);
    // Satu tombol simpan untuk SELURUH tab — termasuk bagian Finance kalau ada,
    // supaya tidak ada dua tombol simpan yang membingungkan dalam satu layar.
    h+='<div style="margin-top:16px;display:flex;justify-content:flex-end;align-items:center;gap:10px;flex-wrap:wrap">'
     +'<span id="autosave-ind" class="autosave-ind"></span>'
     +'<button class="btn" onclick="saveEventTab(\''+ev.id+'\')">'+svg(IC.check)+'Simpan '+esc(tab.title)+'</button>'
     +(nx?'<button class="btn pri" onclick="saveEventTab(\''+ev.id+'\',true)">Simpan &amp; Lanjut · '+esc(TAB_BY_ID[nx].title)+svg(IC.chevR)+'</button>':'')
     +'</div>';
  }
  $('ev-tab-content').innerHTML=h;
  if(canEdit) autoSaveBind(ev);
}
function taskMap(){ const m={}; Object.keys(TASK_STATUS).forEach(k=>m[k]={c:TASK_STATUS[k],t:k}); return m; }
/* ---------- Pilih seksi mana yang ikut tercetak di PDF ----------
   Tidak semua event perlu semua seksi di brief-nya. Tiap seksi punya centang
   sendiri, tersimpan di ev.detail._pdfSec. Belum pernah dicentang = ikut
   tercetak, supaya event lama tidak tiba-tiba kehilangan isi PDF-nya. */
/* Berapa isian sebuah seksi yang sudah diisi. Dipakai untuk lencana kemajuan
   di kepala seksi — form ini panjang, dan tanpa penanda begini orang harus
   menggulir seluruh tab hanya untuk tahu bagian mana yang masih kosong.
   Sub-judul, lampiran, dan field cermin tidak dihitung: bukan isian. */
function secProgress(ev,sec){
  let isi=0,total=0;
  (sec.fields||[]).forEach(fl=>{
    if(fl.t==='head'||fl.t==='files'||fl.t==='mirror'||fl.t==='salinlayout')return;
    if(!fieldVisible(ev,fl))return;
    total++;
    const v=fmtFieldVal(fl,detailVal(ev,fl));
    if(v!=null&&v!=='')isi++;
  });
  return {isi,total};
}
/* ---------- Ringkasan isian, di ATAS form ----------
   Sebelumnya keadaan pengisian hanya terlihat setelah masuk tab Overview,
   atau sepotong-sepotong dari angka kecil di kepala tiap seksi. Untuk tahu
   "sisa apa lagi yang belum saya isi" kru harus membuka tab satu per satu.

   Strip ini menjawabnya sekali lihat: total terisi, lalu tiap seksi sebagai
   chip yang bisa diklik untuk lompat ke tabnya. Warnanya tiga tingkat —
   kosong, sebagian, penuh — supaya yang belum tersentuh langsung menonjol.
   Seksi yang tidak punya isian sama sekali (mis. hanya berisi lampiran)
   dilewati; menampilkan "0/0" cuma kebisingan. */
function ringkasIsian(ev){
  const out=[];
  visibleTabs().forEach(tab=>{
    if(tab.id==='overview') return;
    visibleSecsOfTab(tab.id).forEach(sec=>{
      const p=secProgress(ev,sec);
      if(!p.total) return;
      out.push({tab:tab.id, n:sec.n, title:sec.title, isi:p.isi, total:p.total});
    });
  });
  return out;
}
function ringkasIsianHTML(ev){
  const secs=ringkasIsian(ev);
  if(!secs.length) return '';
  const isi=secs.reduce((a,s)=>a+s.isi,0), total=secs.reduce((a,s)=>a+s.total,0);
  const pct=total?Math.round(isi/total*100):0;
  const kurang=secs.filter(s=>s.isi<s.total).length;
  const chip=s=>{
    const penuh=s.isi>=s.total, kosong=s.isi===0;
    const kelas=penuh?'penuh':(kosong?'kosong':'sebagian');
    const w=s.total?Math.round(s.isi/s.total*100):0;
    return '<button type="button" class="rk-chip '+kelas+'" title="'+esc(s.title)+' — '+s.isi+' dari '+s.total+' isian terisi"'
      +' onclick="switchEventTab(\''+s.tab+'\',\''+ev.id+'\')">'
      +'<span class="rk-n">'+esc(s.n)+'</span>'
      +'<span class="rk-t">'+esc(s.title)+'</span>'
      +'<span class="rk-f num">'+s.isi+'/'+s.total+'</span>'
      +'<span class="rk-bar"><i style="width:'+w+'%"></i></span>'
      +'</button>';
  };
  return '<div class="card rk-card">'
    +'<div class="rk-head">'
      +'<div class="rk-kiri"><div class="eyebrow">Ringkasan Pengisian</div>'
        +'<div class="rk-angka"><b class="num">'+isi+'</b><span class="num">/'+total+'</span>'
        +'<span class="rk-pct num">'+pct+'%</span></div></div>'
      +'<div class="rk-ket">'+(kurang
          ? kurang+' seksi masih ada yang kosong'
          : 'Semua isian sudah lengkap')+'</div>'
    +'</div>'
    +'<div class="rk-prog"><i style="width:'+pct+'%"></i></div>'
    +'<div class="rk-chips">'+secs.map(chip).join('')+'</div>'
  +'</div>';
}
function pdfSecOn(ev,secId){
  const m=(ev.detail&&ev.detail._pdfSec)||{};
  return m[secId]!==false;
}
function pdfCheckHTML(ev,sec){
  const on=pdfSecOn(ev,sec.id);
  return '<label class="pdf-chk" title="Kalau dimatikan, seksi ini tidak ikut tercetak di Event Brief / PDF">'
    +'<input type="checkbox" '+(on?'checked':'')+' onchange="pdfSecToggle(\''+sec.id+'\',this.checked)">'
    +'<span>Tampil di PDF</span></label>';
}
function pdfSecToggle(secId,on){
  const ev=S.events.find(e=>e.id===_asEvId); if(!ev) return;
  ev.detail._pdfSec=ev.detail._pdfSec||{};
  ev.detail._pdfSec[secId]=!!on;
  save();
  toast('Pengaturan PDF disimpan', (SEC_BY_ID[secId]?SEC_BY_ID[secId].title:secId)+(on?' ikut tercetak.':' tidak ikut tercetak.'),'ok');
}
function fieldVisible(ev,fl){ if(!fl.cond)return true; const v=ev.detail[fl.cond.k]; if(typeof fl.cond.v==='boolean')return !!(v&&v.v!==undefined?v.v:v)===fl.cond.v; const cur=getVal(ev,fl.cond.k); if(Array.isArray(cur))return cur.includes(fl.cond.v); return cur===fl.cond.v; }
function getVal(ev,k){ const v=ev.detail[k]; if(v&&typeof v==='object'&&'v'in v)return v.v; return v; }
// Ya/Tidak + catatan; toleran terhadap data lama (string/array/yn) agar tidak hilang.
function ynnoteVal(val){
  if(val && typeof val==='object' && !Array.isArray(val) && ('v'in val||'note'in val)) return {v:val.v===true?true:(val.v===false?false:undefined), note:val.note||''};
  if(Array.isArray(val)) return {v:val.length>0, note:val.join(', ')};
  if(typeof val==='boolean') return {v:val, note:''};
  if(typeof val==='string' && val.trim()) return {v:true, note:val.trim()};
  return {v:undefined, note:''};
}
/* Pilihan sebuah field boleh berupa daftar mati ATAU fungsi yang dipanggil saat
   render — untuk daftar yang bisa diubah pengguna (mis. Format F&B). Dibaca
   lewat satu pintu ini supaya 'sel' dan 'multi' tidak berbeda perilaku, dan
   supaya menambah field berdaftar-hidup berikutnya tidak perlu menyentuh
   renderField lagi. selCek() tidak perlu diubah: ia membaca <datalist> di DOM,
   bukan skemanya. */
function fieldOpts(fl){
  const o=fl&&fl.o;
  const list=(typeof o==='function')?o():o;
  return Array.isArray(list)?list:[];
}

  const lbl='<label>'+esc(fl.l)+(fl.req?'<span class="req">*</span>':'')+'</label>';

    const bodyH=(rows.length?rows:[{}]).map(r=>itemRowHTML(r,canEdit)).join('');
    inp='<div class="rundown-wrap" id="'+id+'">'
       +'<table class="rundown-tbl"><thead><tr><th>Nama Item</th><th style="width:170px">Nominal</th>'+(canEdit?'<th style="width:34px"></th>':'')+'</tr></thead>'
       +'<tbody id="'+id+'_body">'+bodyH+'</tbody></table>'
       +(canEdit?'<div class="rundown-act"><button type="button" class="btn sm" onclick="itemAddRow(\''+id+'\')">'+svg(IC.plus)+'Tambah Item</button>'
          +'<span class="cell-sub" id="'+id+'_tot"></span></div>':'')
       +'</div>';
  } else if(fl.t==='dealtbl'){
    inp=dealTblHTML(id,ev,val,canEdit);
  } else if(fl.t==='barangtbl'){
    const rows=Array.isArray(val)?val:[];
    const bodyH=(rows.length?rows:[{}]).map(r=>barangRowHTML(r,canEdit)).join('');
    inp='<div class="rundown-wrap" id="'+id+'">'
       +'<table class="rundown-tbl"><thead><tr><th>Barang</th><th style="width:120px">Tanggal</th><th style="width:96px">Jam</th>'+(canEdit?'<th style="width:34px"></th>':'')+'</tr></thead>'
       +'<tbody id="'+id+'_body">'+bodyH+'</tbody></table>'
       +(canEdit?'<div class="rundown-act"><button type="button" class="btn sm" onclick="barangAddRow(\''+id+'\')">'+svg(IC.plus)+'Tambah Baris</button></div>':'')
       +'</div>';
  } else if(fl.t==='salinlayout'){
    inp=canEdit
      ? '<button type="button" class="btn sm ghost" onclick="salinLayout(\''+ev.id+'\')">'
        +svg(IC.brief)+'Pilih event untuk disalin</button>'
      : '<span class="cell-sub">—</span>';
  } else if(fl.t==='menutbl'){
    // data-grup dicatat sejak awal supaya syncMenuTbl() tidak menggambar ulang
    // (dan menghilangkan fokus) padahal susunan kelompoknya belum berubah.
    inp='<div class="menutbl" id="'+id+'" data-src="'+esc(fl.src)+'" data-grup="'+esc(menuGroupsOf(ev,fl).join(' '))+'">'
       +menuTblHTML(ev,fl,canEdit)+'</div>';
  } else if(fl.t==='files'){
    // Berkas diurus di luar alur form biasa: unggah/hapus langsung menyimpan
    // ke server (lihat uploadAttach/delAttach), jadi collectField melewatinya.
    inp='<div id="'+id+'">'
       +'<div id="'+id+'_list">'+attachListHTML(ev.id,fl.k,val,canEdit)+'</div>'
       +(canEdit?'<label class="attach-add">'+svg(IC.plus)+'Tambah Berkas'
          +'<input type="file" multiple hidden onchange="uploadAttach(\''+ev.id+'\',\''+fl.k+'\',this)">'
          +'</label>':'')
       +'</div>';
  }
  return '<div class="'+cls+'" id="efw_'+fl.k+'"'+(hide?' style="display:none"':'')+'>'+lbl+inp+help+'</div>';
}
/* ---------- Tabel menu per komponen (Kitchen D.2 & Bar D.3) ----------
   Isinya mengikuti komponen yang dicentang: satu kelompok per komponen.
   Main Course & Welcome Snack punya kolom KATEGORI (karbohidrat, protein,
   sayuran, ...) karena di PDF menunya dirangkum per kategori — misalnya
   "Karbohidrat: Nasi Putih, Mie Goreng". Komponen lain cukup 3 kolom.

   Bentuk data: { "Main Course": { jam:"19:00", rows:[{kat,menu,qty,jam}] } }
   Kelompok yang komponennya dilepas centangnya TIDAK dihapus dari data —
   kalau dicentang lagi isian lamanya masih utuh. */
/* Kolom "Jenis" tampil di SEMUA kelompok. Dulu hanya Main Course & Welcome
   Snack yang dapat, tapi kelompok lain pun perlu dikelompokkan di PDF
   (mis. Welcome Drink: panas / dingin), dan ketiadaan kolomnya membuat
   tabelnya terasa beda-beda tanpa alasan yang jelas bagi pengisinya. */
const MENU_KATEGORI=['Karbohidrat','Protein','Sayuran','Pelengkap'];
/* ---------- Jadwal keluar F&B & Bar ----------
   Kolom "Jam" sudah diisi per baris di tabel Menu Final dan Daftar Menu Bar.
   Data yang sama dibalik urutannya di sini: dikelompokkan PER JAM, supaya
   pertanyaan kru di lapangan ("jam 19:30 apa yang keluar?") bisa dijawab
   tanpa membaca ulang seluruh tabel menu.

   Baris tanpa jam memakai jam kelompoknya; kalau kelompoknya juga kosong,
   baris itu dikumpulkan di bagian "Jam belum ditentukan" — sengaja tetap
   ditampilkan, karena justru itu yang perlu dibereskan sebelum acara. */
const JAM_KOSONG='—';
function jadwalKeluar(ev){
  const per={};
  const kumpul=(val,sumber)=>{
    const data=menuTblVal(val);
    Object.keys(data).forEach(g=>{
      if(g==='_teks') return;
      const gd=data[g]||{}, rows=Array.isArray(gd.rows)?gd.rows:[];
      rows.forEach(r=>{
        const menu=(r.menu||'').trim(); if(!menu) return;
        const jam=((r.jam||gd.jam||'').trim())||JAM_KOSONG;
        (per[jam]=per[jam]||[]).push({sumber,grup:g,menu,qty:(r.qty||'').trim(),
                                      ket:(r.kat||r.catatan||'').trim()});
      });
    });
  };
  kumpul(ev.detail&&ev.detail.menuFinal,'Kitchen');
  kumpul(ev.detail&&ev.detail.barMenu,'Bar');
  // Urut menaik; "belum ditentukan" ditaruh paling belakang.
  return Object.keys(per).sort((a,b)=>
      a===JAM_KOSONG?1:b===JAM_KOSONG?-1:a.localeCompare(b))
    .map(jam=>({jam,baris:per[jam]}));
}
function menuTblVal(val){ return (val && typeof val==='object' && !Array.isArray(val)) ? val : {}; }
/* Kelompok bawaan untuk tabel menu yang TIDAK punya field komponen lagi
   (Daftar Menu Bar, sejak barJenis dihapus). Tabelnya tetap butuh satu nama
   kelompok karena datanya tersimpan per-kelompok; namanya tidak ditampilkan
   sebagai judul di PDF supaya tidak jadi baris kosong yang membingungkan. */
const GRUP_TUNGGAL='Menu Bar';
function menuGroupsOf(ev,fl){
  /* Tanpa `src`, kelompoknya tidak datang dari centangan mana pun. Yang
     dipakai: SEMUA kelompok yang datanya sudah ada + kelompok tunggal.
     Membaca kelompok lama dari datanya sendiri itu wajib — event lama
     menyimpan menu bar di bawah 'Welcome Drink', 'Beverage', dst. Kalau
     hanya kelompok tunggal yang digambar, menu itu masih tersimpan
     (collectMenuTbl menyalin balik kelompok yang tidak di layar) tapi tak
     seorang pun bisa melihat atau mengubahnya lagi — hilang tanpa jejak
     dari sudut pandang pengguna. */
  if(!fl.src){
    const punya=Object.keys(menuTblVal(ev.detail[fl.k])).filter(g=>g!=='_teks');
    return punya.includes(GRUP_TUNGGAL) ? punya : punya.concat(GRUP_TUNGGAL);
  }
  // Sumbernya dibaca dari layar dulu (kalau ada) supaya centang komponen
  // langsung menambah/mengurangi kelompok tanpa menunggu simpan.
  const srcFl=fieldByKey(fl.src);
  let cur = (srcFl && $('efd_'+fl.src)) ? collectField(srcFl) : ev.detail[fl.src];
  return Array.isArray(cur)?cur:[];
}
/* Tampilan jadwal di layar. Bentuknya sengaja sama dengan yang dicetak,
   supaya yang dilihat kru di layar persis yang keluar di PDF. */
function jadwalKeluarHTML(ev){
  const jadwal=jadwalKeluar(ev);
  if(!jadwal.length) return '<div class="cell-sub" style="margin-top:8px">'
    +'Belum ada menu yang dijadwalkan. Isi kolom Jam di tabel Menu Final / Daftar Menu Bar.</div>';
  return '<div class="jk-wrap">'+jadwal.map(j=>
      '<div class="jk-blok"><div class="jk-jam">'
        +(j.jam===JAM_KOSONG?'Jam belum ditentukan':esc(j.jam))
        +'<span class="cell-sub">'+j.baris.length+' item</span></div>'
      +'<div class="jk-isi">'+j.baris.map(b=>
          '<div class="jk-baris"><span class="jk-tag jk-'+(b.sumber==='Bar'?'bar':'kit')+'">'+b.sumber+'</span>'
          +'<span class="jk-menu">'+esc(b.menu)+'</span>'
          +'<span class="cell-sub">'+esc(b.grup)+(b.ket?' · '+esc(b.ket):'')+(b.qty?' · '+esc(b.qty):'')+'</span></div>'
        ).join('')+'</div></div>'
    ).join('')+'</div>';
}
function menuTblHTML(ev,fl,canEdit){
  const asli=ev.detail[fl.k];
  const data=menuTblVal(asli);
  const grup=menuGroupsOf(ev,fl);
  // Menu Final dulu berupa satu kotak teks bebas. Isian lama itu ditampilkan
  // apa adanya di atas tabel supaya tidak hilang dari pandangan sebelum
  // sempat dipindahkan ke baris-baris tabel.
  const teksLama = (typeof asli==='string') ? asli : (data._teks||'');
  const lama = teksLama.trim()
    ? '<div class="menu-lama"><b>Isian lama (teks bebas)</b><pre>'+esc(teksLama)+'</pre>'
      +'<span class="cell-sub">Salin ke tabel di bawah, lalu hapus lewat tombol di samping.</span>'
      +(canEdit?' <button type="button" class="btn sm ghost" onclick="menuHapusTeksLama(\''+fl.k+'\')">Hapus teks lama</button>':'')
      +'</div>'
    : '';
  if(!grup.length) return lama+'<div class="cell-sub" style="padding:6px 0">Centang dulu komponen menunya di atas — tabelnya menyesuaikan.</div>';
  const opts={bar:!!fl.bar, grup:grup, data:data};
  return lama+grup.map(g=>menuGroupHTML(fl.k,g,data[g]||{},canEdit,opts)).join('');
}
/* Kolom pertama HANYA ada untuk Kitchen ("Jenis") — dipakai mengelompokkan
   menu di PDF ("Karbohidrat: Nasi Putih, Mie Goreng").

   Bar TIDAK punya kolom pertama lagi. Dulu ada "Catatan" (freeflow/lunch), tapi
   kapan minuman keluar sudah ditulis di kolom Jam ("9.30 (Free Flow)"), jadi
   Catatan selalu kosong dan cuma menyempitkan kolom Menu. Dikembalikan null,
   dan setiap perender kolom pertama melewatinya saat null.

   Data lama yang terlanjur punya r.catatan dibiarkan apa adanya — tidak
   dirender, tidak menghalangi apa pun, dan tidak perlu migrasi yang berisiko. */
function menuKolom1(bar){
  return bar ? null
             : {k:'kat', l:'Jenis', dl:'dl_menukat', ph:'pilih / ketik'};
}
function menuGroupHTML(fk,g,gd,canEdit,opts){
  opts=opts||{};
  const bar=!!opts.bar, k1=menuKolom1(bar);
  const rows=Array.isArray(gd.rows)?gd.rows:[];
  const jam=gd.jam||'', gqty=gd.qty||'';
  const body=(rows.length?rows:[{}]).map(r=>menuRowHTML(r,jam,canEdit,bar,gqty)).join('');
  // Kelompok LAIN yang sudah ada isinya — untuk disalin. Berguna saat
  // VIP Family Set dan Welcome Snack menyajikan menu yang sama.
  const lain=(opts.grup||[]).filter(x=>x!==g && opts.data && opts.data[x] && (opts.data[x].rows||[]).length);
  const salin=(canEdit && lain.length)
    ? '<select class="inp mg-salin" onchange="menuSalinDari(this)" title="Salin daftar menu dari kelompok lain">'
      +'<option value="">Salin dari…</option>'+lain.map(x=>'<option>'+esc(x)+'</option>').join('')+'</select>'
    : '';
  return '<div class="mg" data-g="'+esc(g)+'"'+(bar?' data-bar="1"':'')+'>'
    +'<div class="mg-head">'
      +'<span class="mg-t">'+esc(g)+'</span>'
      +(canEdit?'<button type="button" class="btn sm ghost" onclick="menuJamToggle(this)">Jam &amp; jumlah kelompok</button>':'')
      +'<input class="inp mg-jam" data-r="gjam" value="'+esc(jam)+'" placeholder="jam, mis. 09.00 (freeflow)" '
        +(jam?'':'style="display:none"')+' '+(canEdit?'':'disabled')+' oninput="menuJamIsi(this)">'
      +'<input class="inp mg-jam" data-r="gqty" value="'+esc(gqty)+'" placeholder="jumlah, mis. 100" '
        +(gqty?'':'style="display:none"')+' '+(canEdit?'':'disabled')+' oninput="menuQtyIsi(this)">'
      +salin
    +'</div>'
    +'<table class="rundown-tbl"><thead><tr>'
      +(canEdit?'<th style="width:26px"></th>':'')
      +(k1?'<th style="width:150px">'+k1.l+'</th>':'')
      +'<th>Menu</th><th style="width:96px">Jumlah</th><th style="width:130px">Jam</th>'
      +(canEdit?'<th style="width:34px"></th>':'')
    +'</tr></thead><tbody>'+body+'</tbody></table>'
    +(canEdit?'<div class="rundown-act"><button type="button" class="btn sm" onclick="menuAddRow(this)">'+svg(IC.plus)+'Tambah Baris</button>'
       +'<span class="cell-sub">Enter di baris terakhir menambah baris. Seret ⋮⋮ untuk mengubah urutan.</span></div>':'')
    +'</div>';
}
function menuRowHTML(r,gjam,canEdit,bar,gqty){
  r=r||{}; const dis=canEdit?'':'disabled';
  const k1=menuKolom1(bar);
  /* Kolom jam & jumlah sengaja DIBIARKAN KOSONG dan cuma menampilkan nilai
     kelompok sebagai placeholder. Kosong berarti "ikut kelompok" —
     collectMenuTbl yang mengisinya saat disimpan. */
  return '<tr'+(canEdit?' draggable="true"':'')+'>'
    +(canEdit?'<td class="mg-drag" title="Seret untuk mengubah urutan">&#8942;&#8942;</td>':'')
    +(k1?'<td><input class="inp" list="'+k1.dl+'" data-r="'+k1.k+'" value="'+esc(r[k1.k]||'')+'" placeholder="'+k1.ph+'" '+dis+'></td>':'')
    +'<td><input class="inp" list="dl_menunama" data-r="menu" value="'+esc(r.menu||'')+'" placeholder="nama menu" '+dis+'></td>'
    +'<td><input class="inp" data-r="qty" value="'+esc(r.qty||'')+'" placeholder="'+esc(gqty||'ikut kelompok')+'" title="Kosongkan untuk ikut jumlah kelompok" '+dis+'></td>'
    +'<td><input class="inp" data-r="jam" value="'+esc(r.jam||'')+'" placeholder="'+esc(gjam||'ikut jam kelompok')+'" title="Kosongkan untuk ikut jam kelompok" '+dis+'></td>'
    +(canEdit?'<td><button type="button" class="rundown-del" title="Hapus baris" onclick="menuDelRow(this)">×</button></td>':'')
    +'</tr>';
}
/* Jumlah kelompok: sama seperti jam — hanya memperbarui placeholder, tidak
   menulis diam-diam ke tiap kotak. */
function menuQtyIsi(inp){
  const g=inp.closest('.mg'), baru=inp.value;
  g.querySelectorAll('tbody [data-r="qty"]').forEach(function(e){ e.placeholder = baru || 'ikut kelompok'; });
}
/* Salin daftar menu dari kelompok lain. Menimpa isi kelompok ini, jadi
   dikonfirmasi dulu kalau sudah ada isinya — kehilangan ketikan orang
   karena salah pilih dropdown itu mahal. */
function menuSalinDari(sel){
  const dari=sel.value; sel.value='';
  if(!dari) return;
  const box=sel.closest('.menutbl'), tujuan=sel.closest('.mg');
  const asal=[...box.querySelectorAll('.mg')].find(function(x){ return x.dataset.g===dari; });
  if(!asal) return;
  const adaIsi=[...tujuan.querySelectorAll('tbody [data-r="menu"]')].some(function(e){ return e.value.trim(); });
  if(adaIsi && !confirm('Isi kelompok "'+tujuan.dataset.g+'" akan diganti dengan salinan dari "'+dari+'". Lanjut?')) return;
  const bar=tujuan.dataset.bar==='1', k1=menuKolom1(bar), k1a=menuKolom1(asal.dataset.bar==='1');
  const gjam=(tujuan.querySelector('[data-r="gjam"]')||{}).value||'';
  const gqty=(tujuan.querySelector('[data-r="gqty"]')||{}).value||'';
  const baris=[...asal.querySelectorAll('tbody tr')].map(function(tr){
    const v=function(r){ const e=tr.querySelector('[data-r="'+r+'"]'); return e?e.value.trim():''; };
    // Kolom pertama beda arti antara Kitchen & Bar. Kalau jenisnya beda,
    // kolom itu TIDAK ikut disalin daripada memindahkan isi yang keliru.
    const o={menu:v('menu'), qty:v('qty'), jam:v('jam')};
    // Kolom pertama cuma ada di Kitchen. Disalin hanya kalau KEDUA sisi Kitchen;
    // Bar tidak punya kolom ini lagi (k1 null).
    if(k1) o[k1.k] = (k1a && k1.k===k1a.k) ? v(k1a.k) : '';
    return o;
  }).filter(function(r){ return r.menu||r.qty; });
  if(!baris.length){ toast('Kelompok kosong','"'+dari+'" belum punya menu untuk disalin.','err'); return; }
  tujuan.querySelector('tbody').innerHTML = baris.map(function(r){ return menuRowHTML(r,gjam,true,bar,gqty); }).join('');
  menuPasangBaris(tujuan);
  if(typeof autoSaveTrigger==='function') autoSaveTrigger();
  toast('Menu disalin', baris.length+' menu dari "'+dari+'" masuk ke "'+tujuan.dataset.g+'".','ok');
}
/* Enter di baris terakhir menambah baris baru (seperti spreadsheet), dan
   baris bisa diseret untuk mengubah urutan. Dipasang ulang tiap kali tabel
   digambar, karena barisnya diganti bukan diubah. */
function menuPasangBaris(mg){
  const body=mg.querySelector('tbody'); if(!body) return;
  body.querySelectorAll('tr').forEach(function(tr){
    tr.ondragstart=function(e){ mg._seret=tr; tr.classList.add('mg-seret'); e.dataTransfer.effectAllowed='move'; };
    tr.ondragend  =function(){ tr.classList.remove('mg-seret'); mg.querySelectorAll('tr').forEach(function(x){ x.classList.remove('mg-atas'); }); };
    tr.ondragover =function(e){ e.preventDefault(); if(mg._seret&&mg._seret!==tr) tr.classList.add('mg-atas'); };
    tr.ondragleave=function(){ tr.classList.remove('mg-atas'); };
    tr.ondrop     =function(e){
      e.preventDefault(); tr.classList.remove('mg-atas');
      const s=mg._seret; if(!s||s===tr) return;
      const semua=[...body.querySelectorAll('tr')];
      // dijatuhkan ke baris yang lebih bawah -> sisipkan SESUDAHnya
      body.insertBefore(s, semua.indexOf(s) < semua.indexOf(tr) ? tr.nextSibling : tr);
      if(typeof autoSaveTrigger==='function') autoSaveTrigger();
    };
    tr.querySelectorAll('input').forEach(function(inp){
      inp.onkeydown=function(e){
        if(e.key!=='Enter') return;
        e.preventDefault();
        const baris=[...body.querySelectorAll('tr')];
        if(tr===baris[baris.length-1]){
          const tb=mg.querySelector('.rundown-act button');
          if(tb) menuAddRow(tb);
        } else {
          const berikut=tr.nextElementSibling;
          const sasaran=berikut&&berikut.querySelector('[data-r="'+inp.dataset.r+'"]');
          if(sasaran) sasaran.focus();
        }
      };
    });
  });
}
function menuPasangSemua(){
  document.querySelectorAll('.menutbl .mg').forEach(menuPasangBaris);
}
/* ---------- Item tambahan / pesanan khusus (Kasir D.8) ----------
   Nama item dan nominalnya diketik berdampingan supaya Finance bisa membaca
   isi "Lain-lain" tanpa menebak. Nominal memakai input rupiah yang sama
   dengan field mata uang lain. */
function itemRowHTML(r,canEdit){
  r=r||{}; const dis=canEdit?'':'disabled';
  return '<tr>'
    +'<td><input class="inp" data-r="nama" value="'+esc(r.nama||'')+'" placeholder="mis. Entertainment charge" '+dis+'></td>'
    +'<td><input class="inp" data-r="nominal" inputmode="numeric" value="'+esc(r.nominal?rp(r.nominal):'')+'" placeholder="Rp 0" '+dis+' oninput="itemRupiah(this)"></td>'
    +(canEdit?'<td><button type="button" class="rundown-del" title="Hapus item" onclick="itemDelRow(this)">×</button></td>':'')
    +'</tr>';
}
function itemRupiah(el){
  const d=rupiahDigits(el.value);
  el.value = d===''?'':rp(+d);
  itemTotal(el.closest('.rundown-wrap'));
}
/* ================= TABEL HARGA DEAL PER JENIS MAKANAN =================
   Empat kolom: Keterangan Makanan, Jumlah, Harga Deal, Total (= Jumlah x Harga
   Deal, dihitung sendiri dan tidak bisa diketik). Seluruh Total dijumlahkan
   jadi biaya F&B, lalu masuk Grand Total lewat eventSubtotal().

   Kolom Keterangan memakai combo berisi nama hidangan yang SUDAH diketik di
   Menu Final (D.2 Kitchen) dan Daftar Menu Bar (D.3) — bukan daftar bebas.
   Mengetik ulang nama menu di sini berarti dua sumber kebenaran untuk satu
   hidangan, dan begitu salah satu diubah, harga deal menempel pada nama yang
   sudah tidak ada. Tetap boleh diketik bebas untuk hal yang belum masuk menu. */
function dealNamaMenu(ev){
  const out=[];
  const ambil=function(v){
    if(!Array.isArray(v)) return;
    v.forEach(function(r){
      if(!r) return;
      const nm=(typeof r==='string')?r:(r.nama||r.menu||r.item||'');
      if(nm && out.indexOf(nm)<0) out.push(nm);
    });
  };
  const d=(ev&&ev.detail)||{};
  ambil(d.menuFinal); ambil(d.barMenu);
  return out;
}
function dealRowHTML(ev,r,canEdit,idx){
  r=r||{}; const dis=canEdit?'':'disabled';
  const cid='dealnm_'+idx;
  const jml=+r.jumlah||0, harga=+r.harga||0;
  return '<tr>'
    +'<td>'+(canEdit
        ? comboHTML(cid,dealNamaMenu(ev),r.nama||'',false,'pilih / ketik nama hidangan','data-r="nama"')
        : '<input class="inp" data-r="nama" value="'+esc(r.nama||'')+'" disabled>')+'</td>'
    +'<td><input class="inp" data-r="jumlah" type="number" min="0" value="'+(jml||'')+'" placeholder="0" '+dis+' oninput="dealHitung(this)"></td>'
    +'<td><input class="inp" data-r="harga" inputmode="numeric" value="'+esc(harga?rp(harga):'')+'" placeholder="Rp 0" '+dis+' oninput="itemRupiah(this);dealHitung(this)"></td>'
    +'<td class="mono" data-r="total" style="text-align:right;white-space:nowrap">'+(jml&&harga?rp(jml*harga):'—')+'</td>'
    +(canEdit?'<td><button type="button" class="rundown-del" title="Hapus baris" onclick="dealDelRow(this)">×</button></td>':'')
    +'</tr>';
}
// Menghitung ulang satu baris + total tabelnya. Dipanggil tiap ketukan.
function dealHitung(el){
  const tr=el.closest('tr'); if(!tr) return;
  const j=+((tr.querySelector('[data-r="jumlah"]')||{}).value)||0;
  const hRaw=(tr.querySelector('[data-r="harga"]')||{}).value||'';
  const h=+rupiahDigits(hRaw)||0;
  const sel=tr.querySelector('[data-r="total"]');

/* ---------- Salin layout dari event lain ----------
   Denah venue jarang berubah: acara berikutnya di ruang yang sama biasanya
   memakai layout yang mirip. Menyalin jauh lebih cepat daripada mengunggah
   ulang gambar yang sama.

   Yang disalin adalah PENUNJUK berkasnya (key), bukan berkasnya sendiri —
   satu gambar dipakai bersama beberapa event tanpa menggandakan isi disk.
   Penyapu berkas di server sudah menelusuri seluruh isi event, jadi gambar
   tetap hidup selama masih ada satu event yang memakainya. */
function salinLayout(evId){
  const ini=S.events.find(e=>e.id===evId); if(!ini)return;
  const punya=S.events.filter(e=>e.id!==evId &&
    ((e.detail&&e.detail.layoutFile&&e.detail.layoutFile.trim()) ||
     (e.detail&&Array.isArray(e.detail.layoutImgs)&&e.detail.layoutImgs.length)))
    .sort((a,b)=>String(b.tanggal||'').localeCompare(String(a.tanggal||'')));
  if(!punya.length){
    toast('Belum ada yang bisa disalin','Belum ada event lain yang punya catatan atau gambar layout.','err');
    return;
  }
  const baris=punya.map(e=>{
    const c=S.clients.find(x=>x.id===e.clientId);
    const n=(e.detail.layoutImgs||[]).length;
    return '<button type="button" class="salin-item" onclick="salinLayoutDari(\''+evId+'\',\''+e.id+'\')">'
      +'<span class="salin-nama">'+esc(e.nama||'(tanpa nama)')+'</span>'
      +'<span class="cell-sub">'+fmtDate(e.tanggal)+(c?' · '+esc(c.nama):'')
        +' · '+(n?n+' gambar':'tanpa gambar')+'</span>'
      +(e.detail.layoutFile?'<span class="salin-note">'+esc(e.detail.layoutFile.slice(0,110))+'</span>':'')
      +'</button>';
  }).join('');
  modal('<div class="modal-head"><h3>Ambil Layout dari Event Lain</h3>'
    +'<p class="section-desc">Catatan layout & gambarnya akan disalin ke event ini. Isi yang sekarang akan diganti.</p></div>'
    +'<div class="salin-list">'+baris+'</div>'
    +'<div class="modal-foot"><button class="btn ghost" onclick="closeModal()">Batal</button></div>');
}
function salinLayoutDari(evId,dariId){
  const ini=S.events.find(e=>e.id===evId), dari=S.events.find(e=>e.id===dariId);
  if(!ini||!dari)return;
  const adaIsi=(ini.detail.layoutFile||'').trim() || (ini.detail.layoutImgs||[]).length;
  if(adaIsi && !confirm('Catatan & gambar layout event ini akan DIGANTI dengan salinan dari "'
      +(dari.nama||'event lain')+'". Lanjut?')) return;
  ini.detail.layoutFile=dari.detail.layoutFile||'';
  // salinan daftar, bukan rujukan ke array yang sama — kalau tidak, menghapus
  // satu gambar di sini ikut menghapusnya di event asalnya.
  ini.detail.layoutImgs=(dari.detail.layoutImgs||[]).map(f=>Object.assign({},f));
  logAct('event',evId,'Layout disalin','dari '+(dari.nama||dariId));

function collectMenuTbl(fl){
  const box=$('efd_'+fl.k); if(!box) return undefined;
  const out={};
  box.querySelectorAll('.mg').forEach(g=>{
    const jamKel=(g.querySelector('[data-r="gjam"]')||{}).value||'';
    const qtyKel=(g.querySelector('[data-r="gqty"]')||{}).value||'';
    const rows=[...g.querySelectorAll('tbody tr')].map(tr=>{
      const v=r=>{ const e=tr.querySelector('[data-r="'+r+'"]'); return e?e.value.trim():''; };
      // Jam & jumlah baris yang dibiarkan kosong = ikut kelompok. Diisi di
      // sini, bukan di kotaknya, supaya mengganti nilai kelompok otomatis
      // mengubah semua baris yang memang menumpang padanya.
      return {kat:v('kat'), catatan:v('catatan'), menu:v('menu'),
              qty:(v('qty') || qtyKel), jam:(v('jam') || jamKel)};
    }).filter(r=>r.menu||r.qty||r.kat||r.catatan);
    const jam=jamKel;
    const qtyG=(g.querySelector('[data-r="gqty"]')||{}).value||'';
    if(rows.length||jam||qtyG) out[g.dataset.g]={jam:jam, qty:qtyG, rows:rows};
  });
  // Kelompok yang komponennya sedang tidak dicentang tidak digambar, jadi
  // tidak ikut terbaca di atas — disalin balik supaya tidak hilang.
  const ev=S.events.find(e=>e.id===_asEvId);
  const asli=ev?ev.detail[fl.k]:null;
  const lama=menuTblVal(asli);
  const diLayar={}; box.querySelectorAll('.mg').forEach(g=>diLayar[g.dataset.g]=1);
  Object.keys(lama).forEach(g=>{ if(g!=='_teks' && !diLayar[g]) out[g]=lama[g]; });
  // Isian lama yang berupa teks bebas ikut dibawa, jangan sampai tertimpa
  // tabel kosong pada auto-save pertama.
  const teks = (typeof asli==='string') ? asli : lama._teks;
  if(teks && String(teks).trim()) out._teks=teks;
  return out;
}
// Centang komponen berubah -> kelompok tabelnya ikut bertambah/berkurang.
// Isian yang sudah diketik dibawa serta lewat collectMenuTbl().

  EVENT_SCHEMA.forEach(s=>s.fields.forEach(fl=>{

    const box=$('efd_'+fl.k); if(!box) return;
    const isi=collectMenuTbl(fl); if(isi!==undefined) ev.detail[fl.k]=isi;
    const perlu=menuGroupsOf(ev,fl).join('␀');
    if(box.dataset.grup===perlu) return;      // susunannya sama, jangan gambar ulang
    box.dataset.grup=perlu;

    box.querySelectorAll('.mg').forEach(menuPasangBaris);
  }));
}
// Untuk PDF & Overview: dirangkum per kategori, sesuai permintaan
// "karbohidrat : nasi putih, mie goreng".
function fmtMenuTbl(val){
  if(typeof val==='string') return val.trim()||null;   // isian lama, teks bebas
  const data=menuTblVal(val); const out=[];
  if(data._teks && String(data._teks).trim()) out.push(String(data._teks).trim());
  Object.keys(data).forEach(g=>{
    if(g==='_teks') return;
    const gd=data[g]||{}; const rows=Array.isArray(gd.rows)?gd.rows:[];
    if(!rows.length && !gd.jam && !gd.qty) return;
    const kepala=(g===GRUP_TUNGGAL?'':g)+(gd.jam?' — '+gd.jam:'')+(gd.qty?' · '+gd.qty:'');
    if(kepala.trim()) out.push(kepala.trim());
    // Kitchen dikelompokkan per Jenis; Bar per Catatan (freeflow/lunch/dst).
    // Keduanya kolom pertama tabelnya, jadi diperlakukan sama di sini.
    const perKat={};
    rows.forEach(r=>{
      const k=r.kat||r.catatan||'';
      const qty=r.qty&&r.qty!==gd.qty ? ' ('+r.qty+')' : (r.qty?' ('+r.qty+')':'');
      const isi=(r.menu||'')+qty+(r.jam&&r.jam!==gd.jam?' — '+r.jam:'');
      if(!isi.trim())return;
      (perKat[k]=perKat[k]||[]).push(isi);
    });
    Object.keys(perKat).forEach(k=>out.push('  '+(k?k+': ':'')+perKat[k].join(', ')));
  });
  return out.length?out.join('\n'):null;
}
/* ---------- Lampiran berkas (D.10) ----------
   Berkas disimpan di server sendiri (disk, di luar web root) lewat api.php —
   pola sama dengan bukti transfer & foto reservasi. Yang tersimpan di data
   event hanya penunjuknya: {key,name,size,at,by}. */
function fmtSize(b){ b=+b||0; if(b<1024)return b+' B'; if(b<1048576)return (b/1024).toFixed(0)+' KB'; return (b/1048576).toFixed(1)+' MB'; }
function attachUrl(key){ return API_URL+'?action=receipt&key='+encodeURIComponent(key); }
/* Berkasnya tidak ada di server. Ikon gambar patah bawaan browser tidak
   memberi tahu apa pun — kru mengira aplikasinya rusak atau koneksinya
   bermasalah, lalu memuat ulang berkali-kali. Diganti keterangan jujur
   supaya jelas yang hilang adalah BERKASNYA, catatannya masih ada, dan
   jalan keluarnya unggah ulang. */
function gambarHilang(img){
  const fig=img.closest('figure'); if(!fig || fig.dataset.hilang) return;

  (a||img).outerHTML='<div class="att-hilang" title="'+esc(nama)+'">'
    +'<b>Berkas tidak ditemukan</b>'
    +'<span>Catatannya masih tersimpan, tapi berkasnya tidak ada lagi di server. Unggah ulang untuk memulihkan.</span>'
    +'</div>';
}
function attachListHTML(evId,k,arr,canEdit){
  arr=Array.isArray(arr)?arr:[];
  if(!arr.length) return '<div class="cell-sub" style="padding:6px 0">Belum ada berkas dilampirkan.</div>';
  // Gambar ditampilkan sebagai pratinjau, bukan cuma tautan unduh — rundown,
  // layout & denah area jauh lebih cepat dibaca kalau langsung kelihatan.
  // Berkas non-gambar (PDF, dsb) tetap tampil sebagai tautan seperti biasa.
  const gambar = arr.filter(fotoKah);
  const lain   = arr.filter(f=>!fotoKah(f));
  let h='';
  if(gambar.length){
    h+='<div class="att-imgs">'+gambar.map(f=>

      +'<a href="'+esc(attachUrl(f.key))+'" target="_blank" rel="noopener" title="Buka ukuran penuh">'
        +'<img src="'+esc(attachUrl(f.key))+'" alt="'+esc(f.name||'gambar')+'" loading="lazy" onerror="gambarHilang(this)">'
      +'</a>'
      +'<figcaption>'+esc(f.name||f.key)+'</figcaption>'
      +(canEdit?'<button type="button" class="att-img-del" title="Hapus gambar" onclick="delAttach(\''+evId+'\',\''+k+'\',\''+esc(f.key)+'\')">×</button>':'')
      +'</figure>').join('')+'</div>';
  }
  if(lain.length){
    h+='<div class="attach-list">'+lain.map(f=>
       '<div class="attach-item">'
      +'<a href="'+esc(attachUrl(f.key))+'" download="'+esc(f.name||'berkas')+'" target="_blank" rel="noopener" class="attach-name">'
        +svg(IC.brief)+'<span>'+esc(f.name||f.key)+'</span></a>'
      +'<span class="cell-sub attach-meta">'+fmtSize(f.size)+(f.by?' · '+esc(f.by):'')+'</span>'
      +(canEdit?'<button type="button" class="btn sm danger" title="Hapus berkas" onclick="delAttach(\''+evId+'\',\''+k+'\',\''+esc(f.key)+'\')">'+svg(IC.trash)+'</button>':'')
      +'</div>').join('')+'</div>';

  return h;

// Gambar dikenali dari nama berkasnya (server menyimpan tanpa mime asli).
function fotoKah(f){ return /\.(png|jpe?g|gif|webp|bmp|avif)$/i.test(String((f&&f.name)||'')); }
function repaintAttach(evId,k){
  const ev=S.events.find(e=>e.id===evId); if(!ev)return;

async function uploadAttach(evId,k,inputEl){
  const files=[...(inputEl.files||[])]; if(!files.length)return;
  const ev=S.events.find(e=>e.id===evId); if(!ev)return;
  // Rekam dulu isian form yang sedang diketik, supaya tidak hilang saat kita menyimpan.
  autoSaveCommit();
  ev.detail[k]=Array.isArray(ev.detail[k])?ev.detail[k]:[];
  let ok=0;
  for(const f of files){
    if(f.size>8*1024*1024){ toast('File terlalu besar',esc(f.name)+' lebih dari 8MB.','err'); continue; }
    try{
      const b64=await fileToBase64(f);
      const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify({action:'uploadReceipt',fileName:f.name,mimeType:f.type,dataBase64:b64})});
      const d=await res.json();
      if(!d||!d.ok) throw new Error((d&&d.error)||'ditolak server');
      ev.detail[k].push({key:d.data.key,name:f.name,size:f.size,at:new Date().toISOString(),by:(ME&&ME.name)||''});
      ok++;
    }catch(e){ toast('Gagal unggah',esc(f.name)+': '+e.message,'err'); }
  }
  inputEl.value='';                       // biar file yang sama bisa dipilih lagi
  if(!ok)return;
  logAct('event',evId,'Lampiran ditambahkan',files.slice(0,3).map(f=>f.name).join(', ')+(files.length>3?' +'+(files.length-3):''));
  save(); repaintAttach(evId,k);
  toast('Berkas terlampir',ok+' berkas tersimpan di server.','ok');
}
function delAttach(evId,k,key){
  const ev=S.events.find(e=>e.id===evId); if(!ev)return;
  const f=(ev.detail[k]||[]).find(x=>x.key===key);
  if(!confirm('Hapus lampiran "'+((f&&f.name)||key)+'" dari event ini?'))return;
  autoSaveCommit();
  ev.detail[k]=(ev.detail[k]||[]).filter(x=>x.key!==key);
  logAct('event',evId,'Lampiran dihapus',(f&&f.name)||key);
  save(); repaintAttach(evId,k);
  toast('Lampiran dihapus','','ok');
}

function katFoto(it){ return it&&it.key?attachUrl(it.key):''; }

    +(canEdit?'<label class="btn">'+svg(IC.plus)+'Tambah Slide<input type="file" accept="image/*" multiple hidden onchange="katUpload(this)"></label>':'');

            +'<span class="kat-no">'+(i+1)+'</span></div>'
          :'<div class="kat-kosong">Tanpa gambar · slide teks</div>')

        +'<h3'+(it.judul?'':' class="kosong"')+'>'+esc(it.judul||'Belum ada judul')+'</h3>'
        +(it.sub?'<div class="kat-sub">'+esc(it.sub)+'</div>':'')
        +(it.desc?'<p>'+esc(it.desc)+'</p>':'')

      +(canEdit?'<div class="kat-act">'
          +'<button class="btn" title="Naikkan urutan" onclick="katGeser('+i+',-1)"'+(i===0?' disabled':'')+'>↑</button>'
          +'<button class="btn" title="Turunkan urutan" onclick="katGeser('+i+',1)"'+(i===arr.length-1?' disabled':'')+'>↓</button>'
          +'<span class="kat-sp"></span>'
