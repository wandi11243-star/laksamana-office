<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<meta name="theme-color" content="#A9791F">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Akademi Laksamana, Training dan Standardisasi Kru</title>
<link rel="icon" type="image/jpeg" href="../assets/LaksamanaMudaLogo.jpeg">
<!-- Guard SSO: tanpa sesi Office yang berhak buka akademi, langsung ke login Office. -->
<script>
(function(){try{var s=JSON.parse(localStorage.getItem('lm_session')||'null');
  var ok=s&&s.expiry&&Date.now()<s.expiry&&(s.modules||[]).some(function(m){return m==='*'||m==='akademi';});
  if(!ok)location.replace('../');}catch(e){location.replace('../');}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/laksamana.css">
<style>
/* Token Akademi dipetakan ke design system Office (laksamana.css). Nilai variabel
   diarahkan ke palet Office (paper hangat, gold dalam, Plus Jakarta Sans) sehingga
   seluruh aturan di bawah ikut re-theme tanpa ditulis ulang. Nama variabel lama
   dipertahankan supaya perubahan minim. Aturan copy: tanpa em dash, tanpa middle dot. */
:root{
  --ink:#2A2620; --ink2:#3A3428; --ink3:#4A4234;
  --gold:#C8961F; --gold2:#A9791F; --cream:#F7F6F4; --cream2:#F2E9D3;
  --white:#FFFFFF; --line:#E7E1D3; --line-dark:rgba(169,121,31,.22);
  --ok:#1F9D5F; --warn:#B5831A; --bad:#C9432B; --info:#2F7FC4;
  --muted:#5C574D; --muted-dark:#928C80;
  --radius:16px; --shadow:0 4px 18px rgba(50,42,28,.06);
  --font-d:'Plus Jakarta Sans',system-ui,sans-serif; --font-b:'Inter',system-ui,-apple-system,sans-serif;
}
html,body{height:100%}
body{font-family:var(--font-b);background:var(--cream);color:var(--ink);font-size:15px;-webkit-font-smoothing:antialiased}
button{border:none;background:none}
input,select,textarea{font-family:var(--font-b);font-size:14px}
h1,h2,h3{font-family:var(--font-d);letter-spacing:-.02em}

/* ========== FORM & BUTTON (dipakai di seluruh app) ========== */
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;background:var(--white);outline:none;transition:border .15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:10px;font-weight:700;font-size:14px;transition:transform .1s,box-shadow .15s}
.btn:active{transform:scale(.98)}
.btn-gold{background:var(--gold);color:var(--ink);box-shadow:0 4px 14px rgba(200,150,31,.30)}
.btn-gold:hover{box-shadow:0 6px 20px rgba(200,150,31,.45)}
.btn-ink{background:var(--ink);color:var(--gold)}
.btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn-danger{background:var(--danger-bg);color:var(--bad)}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:8px}
.btn-block{width:100%}

/* ========== APP SHELL ========== */
#appView{display:none;min-height:100vh}
/* ---------- Layar muat ----------
   #appView baru ditampilkan setelah boot selesai, dan boot menunggu roster
   Office (Apps Script) yang bisa makan 11-18 DETIK. Tanpa ini, kru menatap
   layar PUTIH KOSONG selama itu dan mengira modulnya rusak.
   Ditulis langsung di HTML (bukan dibuat JS) supaya tampil SEKETIKA, bahkan
   sebelum satu baris skrip pun jalan. */
#bootScreen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;background:var(--cream);z-index:9999;text-align:center;padding:24px}
#bootScreen .ring{width:34px;height:34px;border:3px solid rgba(200,150,31,.25);border-top-color:var(--gold);
  border-radius:50%;animation:bootSpin .8s linear infinite}
@keyframes bootSpin{to{transform:rotate(360deg)}}
#bootScreen .t{font-family:var(--font-d);font-weight:700;font-size:15px;color:var(--ink)}
#bootScreen .s{font-size:12.5px;color:var(--muted-dark);max-width:320px;line-height:1.5}
#bootScreen .slow{font-size:12.5px;color:var(--muted);max-width:340px;line-height:1.5;display:none}
#bootScreen.is-slow .slow{display:block}
.shell{display:flex;min-height:100vh}
.sidebar{width:242px;flex:none;background:var(--white);border-right:1px solid var(--line);color:var(--text);padding:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar::-webkit-scrollbar{width:6px}
.sidebar::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
.side-brand{display:flex;align-items:center;gap:11px;padding:18px 18px 14px;border-bottom:1px solid var(--line);margin-bottom:6px}
.side-brand img{width:38px;height:38px;object-fit:contain;border-radius:9px;flex:none}
.side-brand .t{font-family:var(--font-d);font-weight:700;font-size:16px;color:var(--ink);line-height:1.1}
.side-brand .s{font-family:var(--font-b);font-size:9.5px;color:var(--gold);text-transform:uppercase;letter-spacing:.18em;margin-top:2px}
.nav-sec{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--muted-dark);padding:16px 24px 7px}
.nav-item{display:flex;align-items:center;gap:11px;width:calc(100% - 24px);margin:0 12px 1px;padding:10px 12px;border-radius:10px;color:var(--text);font-size:14px;font-weight:500;text-align:left;position:relative;transition:background .13s,color .13s}
.nav-item:hover{background:var(--cream)}
.nav-item.active{background:var(--gold-soft);color:var(--gold2);font-weight:600}
.nav-item.active::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--gold)}
.nav-item .ic{width:20px;display:flex;align-items:center;justify-content:center;flex:none}
.nav-item .ic svg{width:18px;height:18px}
.side-user{margin-top:auto;border-top:1px solid var(--line);padding:12px;display:flex;align-items:center;gap:10px}
.side-user .avatar{width:36px;height:36px;border-radius:10px;background:var(--gold);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.side-user .info{line-height:1.25;flex:1;min-width:0}
.side-user .n{display:block;font-weight:700;color:var(--ink);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-user .r{color:var(--muted);font-size:11px}
.side-user .logout-x{background:var(--cream);border:1px solid var(--line);color:var(--muted);width:32px;height:32px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
.side-user .logout-x:hover{background:var(--danger-bg,#F8E4DF);color:var(--danger,#C9432B);border-color:#E7BDB8}
.side-user .logout-x svg{width:16px;height:16px}
.side-user .sync-line{width:100%;margin-top:8px}
.main{flex:1;min-width:0;padding:24px;max-width:1440px;width:100%;margin:0 auto}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.topbar h2{font-size:26px;font-weight:700;letter-spacing:-.02em}
.topbar .sub{color:var(--muted);font-size:14px;margin-top:2px}

/* mobile */
.mobile-top{display:none}
.mobile-nav{display:none}
@media(max-width:860px){
  .shell{display:block}
  .sidebar{display:none}
  .main{padding:16px 14px 90px}
  .mobile-top{display:flex;align-items:center;justify-content:space-between;background:var(--white);color:var(--ink);border-bottom:1px solid var(--line);padding:13px 16px;position:sticky;top:0;z-index:40}
  .mobile-top .t{font-family:var(--font-d);font-weight:700;font-size:15px}
  .mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--white);border-top:1px solid var(--line);box-shadow:0 -4px 18px rgba(50,42,28,.06);z-index:40}
  .mobile-nav button{flex:1;padding:9px 2px 11px;color:var(--muted);font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none}
  .mobile-nav button .ic{display:flex;align-items:center;justify-content:center}
  .mobile-nav button .ic svg{width:19px;height:19px}
  .mobile-nav button.active{color:var(--gold2)}
  .topbar h2{font-size:21px}
}

/* ========== COMPONENTS ========== */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1000px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.g4,.g3,.g2{grid-template-columns:1fr}}
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.card h3{font-size:18px;font-weight:600;margin-bottom:10px}
.stat{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--gold);z-index:1}
.stat::after{content:"";position:absolute;top:-26px;right:-26px;width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at center,var(--gold-soft),transparent 68%);opacity:.7;pointer-events:none}
.stat .v,.stat .l{position:relative;z-index:1}
.stat .v{font-family:var(--font-d);font-size:30px;font-weight:700;line-height:1}
.stat .v .ic-inline{width:28px;height:28px;vertical-align:-2px}
.stat .l{font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-top:6px}
/* Ikon garis sebaris teks: sejajar baseline, warna ikut teks. */
.ic-inline{display:inline-block;vertical-align:-.15em;flex:none}
.badge .ic-inline{width:13px;height:13px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700}
.b-gold{background:var(--gold-soft);color:var(--gold2)}
.b-ok{background:var(--ok-bg);color:var(--ok)}
.b-warn{background:var(--warn-bg);color:var(--warn)}
.b-bad{background:var(--danger-bg);color:var(--bad)}
.b-info{background:var(--info-bg);color:var(--info)}
.b-ink{background:var(--ink);color:var(--gold)}
.b-mut{background:var(--cream2);color:var(--muted)}
.progress{height:8px;background:var(--cream2);border-radius:99px;overflow:hidden}
.progress>div{height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold));border-radius:99px;transition:width .4s}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;padding:11px 13px;font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:#fff;background:var(--ink);white-space:nowrap}
td{padding:11px 13px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover{background:var(--gold-soft)}
.table-wrap{overflow-x:auto;background:var(--white);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{padding:7px 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--white);font-size:12.5px;font-weight:600;color:var(--muted);transition:all .12s}
.chip:hover{border-color:var(--gold-2);background:var(--gold-soft)}
.chip.active{background:var(--gold-soft);color:var(--gold2);border-color:var(--gold-2)}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .big{margin-bottom:10px;color:var(--muted-dark);opacity:.7;display:flex;justify-content:center}
.empty .big .ic-inline{width:34px;height:34px}

/* materi card */
.mat-card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:9px;cursor:pointer;transition:transform .12s,box-shadow .15s;position:relative}
.mat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.mat-card .ty{color:var(--gold2)}
.mat-card .ty .ic-inline{width:24px;height:24px;vertical-align:middle}
.mat-card .ti{font-weight:700;font-size:14.5px;line-height:1.35}
.mat-card .me{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.mat-done{position:absolute;top:12px;right:12px}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(11,27,43,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(2px)}
.modal{background:var(--cream);border-radius:18px;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;padding:24px}
.modal.wide{max-width:860px}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.modal-head h3{font-size:20px;font-weight:700}
.modal-x{font-size:22px;color:var(--muted);padding:2px 8px;border-radius:8px}
.modal-x:hover{background:var(--cream2)}
.video-frame{position:relative;width:100%;padding-top:56.25%;border-radius:12px;overflow:hidden;background:#000;margin-bottom:14px}
.video-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.modul-body{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:20px;font-size:14.5px;line-height:1.75;white-space:pre-wrap}
.sop-step{display:flex;gap:11px;align-items:flex-start;background:var(--white);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.sop-step input{width:19px;height:19px;margin-top:1px;accent-color:var(--gold2);flex-shrink:0}
.sop-step .tx{font-size:14px;line-height:1.55}
.quiz-q{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.quiz-q .qt{font-weight:700;margin-bottom:11px;font-size:14.5px;line-height:1.4}
.quiz-opt{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1.5px solid var(--line);border-radius:9px;margin-bottom:7px;cursor:pointer;font-size:14px;transition:all .1s}
.quiz-opt:hover{border-color:var(--gold2)}
.quiz-opt.sel{border-color:var(--gold2);background:var(--gold-soft)}
.quiz-opt.correct{border-color:var(--ok);background:var(--ok-bg)}
.quiz-opt.wrong{border-color:var(--bad);background:var(--danger-bg)}
.quiz-opt input{accent-color:var(--gold2)}
.menu-hero{background:linear-gradient(135deg,var(--ink),var(--ink3));color:var(--cream);border-radius:14px;padding:22px;margin-bottom:14px}
.menu-hero .nm{font-family:var(--font-d);font-size:24px;font-weight:700;color:var(--gold)}
.menu-hero .pr{font-size:15px;margin-top:4px;font-weight:700}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:13.5px;margin-bottom:10px}
.kv .k{font-weight:800;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding-top:2px}
.script-box{background:var(--gold-soft);border:1.5px dashed var(--gold2);border-radius:11px;padding:14px;font-size:14px;line-height:1.6;font-style:italic}

/* cert */
.cert{border:3px double var(--gold2);border-radius:14px;background:var(--white);padding:34px 24px;text-align:center}
.cert .h{font-family:var(--font-d);font-size:13px;letter-spacing:.25em;text-transform:uppercase;color:var(--gold2);font-weight:700}
.cert .n{font-family:var(--font-d);font-size:30px;font-weight:700;margin:10px 0 4px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--gold);padding:12px 22px;border-radius:99px;font-weight:700;font-size:13.5px;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.35);animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translateX(-50%) translateY(14px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.form-grid{grid-template-columns:1fr}}
.list-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--cream2)}
.list-row:last-child{border-bottom:none}
.org-col{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.org-col .oh{background:var(--ink);color:var(--gold);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.org-col .oh .nm{font-weight:800;font-size:14px}
.org-person{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--cream2);font-size:13px}
.org-person:last-child{border-bottom:none}
.org-pic{background:var(--gold-soft)}
.org-line{width:2px;height:20px;background:var(--gold2);margin:0 auto}
.prog-item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--white);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:8px}
.prog-item .t{font-size:13.5px;font-weight:600;line-height:1.35}
.sync-dot{display:inline-block;width:9px;height:9px;border-radius:99px;background:var(--muted)}
.sync-dot.ok{background:var(--ok)}.sync-dot.pending{background:var(--warn)}.sync-dot.error{background:var(--bad)}
.guide-step{display:flex;gap:10px;margin-bottom:10px;font-size:13.5px;line-height:1.55}
.guide-step .n{flex-shrink:0;width:22px;height:22px;border-radius:99px;background:var(--ink);color:var(--gold);font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center}
@media print{.sidebar,.mobile-top,.mobile-nav,.topbar,.no-print{display:none!important}.main{padding:0}}
</style>
</head>
<body>

<!-- Layar muat: tampil seketika, ditutup oleh showApp() saat app siap.
     Sengaja HTML biasa (bukan dibuat JS) supaya sudah terlihat bahkan sebelum
     skrip di bawah dieksekusi. -->
<div id="bootScreen">
  <div class="ring"></div>
  <div class="t">Menyiapkan Akademi</div>
  <div class="s">Memuat materi & data kru…</div>
  <div class="slow">Menyinkronkan roster kru dari Office — ini kadang butuh sampai 15 detik.
    Materi tetap terbuka walau sinkron ini gagal.</div>
</div>

<!-- ============ APP ============
     Tidak ada layar login di modul ini. Identitas datang dari Office (SSO,
     lm_session); head guard di atas memblokir akses tanpa hak. -->
<div id="appView">
  <div class="mobile-top">
    <div class="t">Akademi Laksamana</div>
    <button onclick="doLogout()" style="color:var(--muted-dark);font-size:12px;font-weight:700">Keluar</button>
  </div>
  <div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main" id="main"></main>
  </div>
  <nav class="mobile-nav" id="mobileNav"></nav>
</div>

<div id="modalRoot"></div>

<script>
'use strict';
/* =====================================================
   AKADEMI LAKSAMANA, Training Management System
   Laksamana Muda Coffee & Live Space, Pekanbaru
   Single-file PWA, vanilla JS, localStorage
   ===================================================== */

var DB_KEY = 'lm_akademi_v1';
var SESSION_KEY = 'lm_akademi_session';
// URL /exec identitas Office (Sheet "Database User"), sama dengan modul lain.
// Dipakai autoSyncOfficeRoster: menarik kru yang sudah diberi akses modul
// `akademi` di Kelola Akses Office supaya muncul di Kelola Kru walau belum pernah
// login. Read-only, tanpa PIN (server listModuleRoster_).
var OFFICE_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbyy1hlJPVfV_Xu3o4-2EhjbP4MI0QylphLgmf0Cj7Ve4fJ006tdls9_TYhEMpkVmPGsuA/exec";
var DB = null;
var VIEW = 'dashboard';
var VIEW_ARG = null;

/* ---------- divisions ----------
   Divisi & tipe materi memakai KUNCI ikon (ic), bukan emoji. Ikon dirender
   inline sebagai SVG garis lewat svgIcon(), seragam dengan sidebar & modul lain
   (reservasi, konten). Tidak ada emoji di UI. */
var DEFAULT_DIVISIONS = [
  {id:'service',  name:'Service / FOH',        ic:'bell'},
  {id:'kitchen',  name:'Galangan Dapur',       ic:'chef'},
  {id:'bar',      name:'Galangan Bar',         ic:'cup'},
  {id:'marketing',name:'Marketing & Digital',  ic:'megaphone'},
  {id:'sales',    name:'Sales & Event',        ic:'handshake'},
  {id:'finance',  name:'Finance & Admin',      ic:'chart'}
];
var DIVISIONS = DEFAULT_DIVISIONS;
var TYPES = {
  video:{label:'Video',ic:'clapper',badge:'b-info'},
  modul:{label:'Modul',ic:'book',badge:'b-gold'},
  sop:  {label:'SOP',ic:'clipboard',badge:'b-ink'},
  menu: {label:'Menu Baru',ic:'plate',badge:'b-warn'},
  quiz: {label:'Kuis',ic:'quiz',badge:'b-ok'}
};
var CATS = [

/* ---------- store ---------- */
/* ================= SUMBER DATA: MySQL ( ../akademi-api-mysql/api.php ) =======
   Dulu data akademi HANYA di localStorage tiap browser: progress kru terkurung
   di device-nya sendiri, dan hilang kalau cache dibersihkan. Sekarang satu data
   dipakai semua device. localStorage TETAP dipakai — tapi turun pangkat jadi
   cadangan offline, bukan sumber kebenaran.
   Kalau backend perlu dibalik, cukup ganti SATU baris di bawah. */
var API_URL = '../akademi-api-mysql/api.php';

// Muat dari cache lokal saja (dipakai saat offline / server tak terjangkau).
function loadDB(){
  try{ var raw=localStorage.getItem(DB_KEY); if(raw){ DB=JSON.parse(raw); } }catch(e){}
  if(!DB) DB=seedDB();
  migrateDB();
  DIVISIONS=DB.divisions;
  saveDB(true);
}

/* Muat dari server. Ini yang jadi sumber kebenaran sejak sekarang.
   Gagal (offline/server mati) -> jatuh ke cache lokal, app tetap bisa dipakai;
   perubahan menyusul terkirim saat koneksi kembali. */
function loadFromServer(){
  var ctrl=new AbortController();
  var timer=setTimeout(function(){ctrl.abort();},15000);
  return fetch(API_URL+'?action=getAll&t='+Date.now(), {signal:ctrl.signal})
    .then(function(r){return r.json();})
    .then(function(j){
      if(!j || !j.ok || !j.data) throw new Error((j&&j.error)||'respons tidak valid');
      DB=j.data;
      migrateDB();                      // isi bagian yang belum ada (divisi dll)
      DIVISIONS=DB.divisions;
      try{ localStorage.setItem(DB_KEY, JSON.stringify(DB)); }catch(e){}
      refreshSnapshot();                // catat versi awal utk penjaga bentrok
      setSyncBadge('ok');
      SERVER_OK=true;
    })
    .catch(function(e){
      // Jangan kosongkan layar hanya karena server sedang tidak bisa dihubungi.
      console.warn('Gagal muat dari server, pakai cache lokal:', e.message);
      SERVER_OK=false; setSyncBadge('error');
      loadDB();
      refreshSnapshot();
    })
    .finally(function(){ clearTimeout(timer); });
}
var SERVER_OK=false;

/* ---- Penstempel updatedAt + baseUpdatedAt ----
   Server menolak baris yang sudah disalip kru lain. Supaya penjaga itu bekerja,
   baris yang BERUBAH harus dicap: updatedAt = sekarang, baseUpdatedAt = versi
   yang kita muat dari server. Membandingkan sidik jari tiap baris dengan
   salinan terakhir dari server, supaya tidak perlu menandai perubahan di
   puluhan tempat satu per satu. */
var AK_COLS=['users','divisions','materials','programs'];
var _snap={}, _serverVer={};
function _sig(o){ var c={}; for(var k in o){ if(k!=='updatedAt'&&k!=='baseUpdatedAt') c[k]=o[k]; } return JSON.stringify(c); }
function _eachRow(obj,fn){
  AK_COLS.forEach(function(k){ (obj[k]||[]).forEach(function(r){ if(r&&r.id) fn(k+':'+r.id, r); }); });
}
function _dirty(key,r){ return _snap[key]!==_sig(r); }
function stampChanges(){
  var now=Date.now();
  _eachRow(DB,function(key,r){ if(_dirty(key,r)) r.updatedAt=now; });
}
// Salinan untuk dikirim: baris yang berubah diberi baseUpdatedAt. DB sendiri
// tetap bersih dari baseUpdatedAt (kalau bocor, save berikutnya kirim base basi
// -> bentrok palsu).
function buildPayload(){
  var p=JSON.parse(JSON.stringify(DB));
  _eachRow(p,function(key,r){ if(_dirty(key,r)) r.baseUpdatedAt=_serverVer[key]||0; });
  return p;
}
function refreshSnapshot(){
  var snap={}, ver={};
  _eachRow(DB,function(key,r){ snap[key]=_sig(r); ver[key]=r.updatedAt||0; });
  _snap=snap; _serverVer=ver;
}
function migrateDB(){
  if(!DB.divisions || !DB.divisions.length) DB.divisions=DEFAULT_DIVISIONS.map(function(d){return {id:d.id,name:d.name,ic:d.ic}});
  // v2->v3: divisi lama menyimpan emoji di 'icon'; petakan ke kunci SVG 'ic'.
  DB.divisions.forEach(function(d){ if(!d.ic) d.ic = DIV_IC[d.id] || 'dot'; if('icon' in d) delete d.icon; });
  // v2->v3: buang PIN dari kru; login sepenuhnya lewat Office (SSO).
  (DB.users||[]).forEach(function(u){ if('pin' in u) delete u.pin; });
  if(!DB.programs) DB.programs=[];
  if(!DB.progProg) DB.progProg={};
  if(!DB.settings) DB.settings={passingDefault:80};
  if(DB.settings.syncUrl==null) DB.settings.syncUrl='';
  if(DB.settings.syncKey==null) DB.settings.syncKey='';
  if(DB.settings.syncAuto==null) DB.settings.syncAuto=true;
  if(!DB.updatedAt) DB.updatedAt=Date.now();
  DB.version=2;
}
function saveDB(skipSync){
  try{
    if(!skipSync){ DB.updatedAt=Date.now(); }
    localStorage.setItem(DB_KEY, JSON.stringify(DB));
  }catch(e){ console.error('save fail',e); }
  if(!skipSync) scheduleSync();
}
function logAct(action, detail){
  DB.activity.unshift({ts:Date.now(), userId:(currentUser()?currentUser().id:'-'), action:action, detail:detail});
  if(DB.activity.length>500) DB.activity.length=500;
  saveDB();
}
function currentUser(){
  var sid=null; try{ sid=localStorage.getItem(SESSION_KEY); }catch(e){}
  if(!sid) return null;
  return DB.users.find(function(u){return u.id===sid && u.active;})||null;
}
// OFFICE_IS_ADMIN: benar bila sesi Office mengelola modul akademi (adminModules
// mengandung '*' atau 'akademi'). Diset saat boot. Mengangkat user jadi admin
// modul untuk sesi ini tanpa mengubah role tersimpan di DB.users.
var OFFICE_IS_ADMIN = false;
// Admin = admin modul dari Office (adminModules '*'/'akademi' = Admin/Howandi/Wandi).
// Peran internal 'admin' tidak lagi memberi menu admin; hanya Office yang menentukan.
function isAdmin(u){ return OFFICE_IS_ADMIN; }
// Manager = admin modul, atau PIC divisi (peran internal manager) untuk lihat progress tim.
function isManager(u){ return OFFICE_IS_ADMIN || (u && u.role==='manager'); }
// Halaman khusus admin modul (bagian sidebar "Kontrol").
var ADMIN_VIEWS = ['anjungan','kelolaMateri','kelolaProgram','kelolaKru','log','sync'];
// canView: gerbang hak akses per halaman. Dipakai render() supaya membuka view
// terlarang lewat go()/URL tetap jatuh ke Beranda, tidak cuma tombolnya disembunyikan.
function canView(view, u){
  if(ADMIN_VIEWS.indexOf(view)>-1) return isAdmin(u);
  if(view==='tim') return isManager(u);
  return true;
}

/* ===== Integrasi identitas Office (SSO) =====
   Akademi tidak lagi punya login sendiri. Identitas datang dari Office lewat
   lm_session; kru dicocokkan ke daftar DB.users milik modul (id lalu nama).
   Kru baru disediakan sementara in-memory dengan role default dari role Office;
   admin merapikan role permanen di Kelola Kru. Sejalan dgn pola Pattern B
   (konten, reservasi) di office-playbook. */
function readLmSession(){
  try{
    var s=JSON.parse(localStorage.getItem('lm_session')||'null');
    if(!s||!s.expiry||Date.now()>s.expiry) return null;
    var m=s.modules||[];
    if(!(m.indexOf('*')>-1||m.indexOf('akademi')>-1)) return null;
    return s;
  }catch(e){ return null; }
}
// Peta role Office -> role internal Akademi (admin / manager / staff).
var OFFICE_TO_AKADEMI_ROLE = {
  owner:'admin', admin:'admin', manager:'manager',
  kitchen:'staff', purchasing:'staff', konten:'staff', host:'staff',
  cashier:'staff', marketing:'staff', reservasi:'staff'
};
function resolveAkademiUser(s){
  var u = DB.users.find(function(x){return x.id===s.userId;})
       || DB.users.find(function(x){return String(x.name).toLowerCase()===String(s.name).toLowerCase();});
  if(!u){
    u = { id:s.userId, name:s.name, role:(OFFICE_TO_AKADEMI_ROLE[s.role]||'staff'),
          division:'all', title:'', active:true };
    DB.users.push(u);   // in-memory; ikut tersimpan saat saveDB() berikutnya
  }
  return u;
}

/* Tarik kru yang SUDAH diberi akses modul `akademi` di Kelola Akses Office,
   supaya muncul di Kelola Kru walau belum pernah login sendiri. Sebelumnya kru
   cuma muncul saat dia login (resolveAkademiUser), jadi admin tak bisa menyiapkan
   divisi/role orang baru sampai yang bersangkutan buka modul. Pola sama dengan
   Marketing & Staff Performance. Read-only, tanpa PIN. Kru baru dibuat sebagai
   staff division 'all' (default), admin merapikan di Kelola Kru. Non-blocking. */
function autoSyncOfficeRoster(){
  if(!OFFICE_WEBAPP_URL) return Promise.resolve();
  /* BATAS WAKTU 25 DETIK. Sebelumnya 10 detik, padahal Apps Script Office diukur
     merespons 11-18 detik — jadi sinkron ini nyaris SELALU keburu dibatalkan,
     diam-diam (.catch di bawah menelannya) dan roster tak pernah diperbarui.
     Itulah sebabnya roster lama ('Aditya Setiadi', 'Kru Service 01') tak kunjung
     hilang walau kodenya sudah benar.
     Boot MENUNGGU panggilan ini, tapi kru tidak menatap layar kosong: lewat 3
     detik bootScreen memasang penanda 'is-slow' yang menjelaskan apa yang
     ditunggu. Kalau Office benar-benar mati, 25 detik itu batas akhirnya, lalu
     app tetap terbuka memakai data lokal. */
  var ctrl = new AbortController();
  var timer = setTimeout(function(){ ctrl.abort(); }, 25000);
  return fetch(OFFICE_WEBAPP_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      signal: ctrl.signal,
      body:JSON.stringify({action:'listModuleRoster', module:'akademi'})})
    .finally(function(){ clearTimeout(timer); })
    .then(function(r){return r.json();})
    .then(function(data){
      if(!data || !data.ok || !Array.isArray(data.members)) return;
      var changed=false;
      var idOffice={};                       // id yang SAH menurut Office
      data.members.forEach(function(m){
        if(!m || !m.id) return;
        idOffice[m.id]=true;
        /* Cocokkan id dulu, baru nama. Pencocokan nama itu jalur ADOPSI: baris
           roster lama yang namanya sama persis dipakai ulang (id-nya ditimpa id
           Office di bawah), jadi divisi & jabatannya tidak hilang. Cuma cocok
           kalau namanya identik — 'Adit' vs 'Aditya Setiadi' tidak, itulah asal
           roster kembar yang ada sekarang. */
        var u = DB.users.find(function(x){return x.id===m.id;})
             || DB.users.find(function(x){return String(x.name||'').toLowerCase()===String(m.name||'').toLowerCase();});
        if(!u){
          DB.users.push({ id:m.id, name:m.name||'(tanpa nama)',
            role:(m.isModuleAdmin?'admin':'staff'), division:'all', title:'',
            active:(m.active!==false) });
          changed=true;
        }else{
          if(!u.id && m.id){ u.id=m.id; changed=true; }
          if(m.name && u.name!==m.name){ u.name=m.name; changed=true; }
          if(m.isModuleAdmin && u.role!=='admin'){ u.role='admin'; changed=true; }
          if(m.active===false && u.active!==false){ u.active=false; changed=true; }
          // Kru yang tadinya dimatikan lalu diberi akses lagi di Office: hidupkan.
          if(m.active!==false && u.active===false){ u.active=true; changed=true; }
        }
      });
      /* Office = SATU-SATUNYA sumber kebenaran daftar kru. Dulu sinkron ini cuma
         MENAMBAH, tak pernah mematikan, jadi roster lama (mis. 'Aditya Setiadi',
         'Kru Service 01') menumpuk berdampingan dengan kru Office ('Adit') dan
         ikut tampil di Kelola Kru / Progress Tim. Kru di luar roster Office
         dinonaktifkan, BUKAN dihapus: progress-nya tetap utuh dan bisa hidup lagi
         begitu aksesnya dikembalikan di Kelola Akses. */
      /* Jaring pengaman: roster KOSONG hampir pasti salah konfigurasi (grant
         terhapus, modul salah nama), bukan "semua kru resign". Kalau diteruskan,
         satu jawaban kosong mematikan seluruh kapal sekaligus. Lebih aman
         membiarkan roster apa adanya. */
      if(data.members.length){
        DB.users.forEach(function(u){
          if(!idOffice[u.id] && u.active!==false){ u.active=false; changed=true; }
        });
      }
      if(changed){ logAct('user','Roster kru disinkronkan dari Office'); }   // logAct sudah saveDB()
    })
    .catch(function(){ /* Office tak terjangkau: lewati diam-diam */ });
}

/* ---------- progress helpers ---------- */
function getProg(userId, matId){
  var p=DB.progress[userId]; return p?p[matId]:null;
}
function setProg(userId, matId, data){
  if(!DB.progress[userId]) DB.progress[userId]={};
  var cur=DB.progress[userId][matId]||{};
  for(var k in data) cur[k]=data[k];
  DB.progress[userId][matId]=cur; saveDB();
}
function matsForUser(u){
  return DB.materials.filter(function(m){
    if(!m.published) return false;
    if(u.division==='all') return true;
    return m.division.indexOf('all')>-1 || m.division.indexOf(u.division)>-1;
  });
}
function isDone(u, m){
  var p=getProg(u.id, m.id);
  if(!p) return false;
  if(m.type==='quiz') return p.passed===true;
  return p.status==='done';
}
function userStats(u){
  var mats=matsForUser(u);
  var mand=mats.filter(function(m){return m.mandatory});
  var doneAll=mats.filter(function(m){return isDone(u,m)}).length;
  var doneMand=mand.filter(function(m){return isDone(u,m)}).length;
  return {total:mats.length, done:doneAll, mandTotal:mand.length, mandDone:doneMand,
    pct: mats.length? Math.round(doneAll/mats.length*100):0,
    mandPct: mand.length? Math.round(doneMand/mand.length*100):100,
    certified: mand.length>0 && doneMand===mand.length};
}

  logAct('logout', 'Turun kapal');

  // dihapus supaya user bisa pindah modul tanpa login ulang. Sign-out penuh
  // hanya lewat tombol Keluar di Office.
  location.replace('../');
  return;
}

/* ---------- material viewer ---------- */
function closeModal(){ PROG_CTX=null; document.getElementById('modalRoot').innerHTML=''; }
function modal(html, wide){
  document.getElementById('modalRoot').innerHTML =
    '<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal'+(wide?' wide':'')+'">'+html+'</div></div>';
}
function ytId(url){
  if(!url) return null;
  var m=url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/);
  return m?m[1]:null;
}
function openMaterial(id, progId){
  var u=currentUser(); var m=DB.materials.find(function(x){return x.id===id});
  if(!m) return;
  PROG_CTX = progId||null;
  var t=TYPES[m.type];
  var inScope = matsForUser(u).some(function(x){return x.id===m.id});
  OPEN_SCOPE = inScope;
  var done = PROG_CTX ? progItemDone(u, PROG_CTX, m.id) : isDone(u,m);
  var head='<div class="modal-head"><div><span class="badge '+t.badge+'">'+typeIcon(m.type)+' '+t.label+'</span>'+
    (m.mandatory?' <span class="badge b-bad">Wajib</span>':'')+
    (PROG_CTX?' <span class="badge b-info">'+svgIcon('calendar')+' Program Bulanan</span>':'')+
    '<h3 style="margin-top:8px">'+esc(m.title)+'</h3>'+
    '<div style="font-size:12px;color:var(--muted);margin-top:4px">Untuk: '+m.division.map(divName).join(', ')+'</div></div>'+
    '<button class="modal-x" onclick="closeModal()">'+svgIcon('x',18)+'</button></div>';
  var body='';
  var scopeNote = inScope ? '' : '<div style="background:var(--info-bg);color:var(--info);border-radius:9px;padding:10px 13px;font-size:12.5px;font-weight:600;margin-bottom:12px;display:flex;gap:7px;align-items:flex-start">'+svgIcon('read')+' <span>Mode Baca, materi ini milik divisi lain. Kamu bebas mempelajarinya, tapi tidak masuk hitungan progress/sertifikasimu.</span></div>';
  if(m.type==='modul'){
    body='<div class="modul-body">'+esc(m.body)+'</div>'+doneBtn(m,done);
  }
  else if(m.type==='video'){
    var vid=ytId(m.videoUrl);
    body = vid
      ? '<div class="video-frame"><iframe src="https://www.youtube.com/embed/'+vid+'" allowfullscreen allow="accelerometer; autoplay; encrypted-media; picture-in-picture"></iframe></div>'
      : '<div class="card">Link video: <a href="'+esc(m.videoUrl)+'" target="_blank" rel="noopener">'+esc(m.videoUrl)+'</a></div>';
    if(m.desc) body+='<div style="font-size:13.5px;color:var(--muted);margin-bottom:12px">'+esc(m.desc)+'</div>';
    body+=doneBtn(m,done,'Saya sudah menonton video ini sampai selesai');
  }
  else if(m.type==='sop'){
    var p=getProg(u.id,m.id)||{};
    body='<div style="font-size:13px;color:var(--muted);margin-bottom:12px">Baca & centang setiap langkah. Setelah semua dicentang, konfirmasi komitmenmu di bawah.</div>';
    body+=m.steps.map(function(s,i){
      return '<label class="sop-step"><input type="checkbox" class="sopChk" '+(done?'checked disabled':'')+' onchange="sopCheck(\''+m.id+'\')"><div class="tx"><b>'+(i+1)+'.</b> '+esc(s)+'</div></label>';
    }).join('');
    if(done){
      body+='<div class="badge b-ok" style="margin-top:10px">'+svgIcon('check')+' Dikonfirmasi '+fmtDT(p.completedAt)+'</div>';
    } else if(!inScope){
      body+='';
    } else {
      body+='<button id="sopAckBtn" class="btn btn-gold btn-block" style="margin-top:12px" disabled onclick="completeMaterial(\''+m.id+'\')">Saya sudah membaca, paham, dan berkomitmen menjalankan SOP ini</button>';
    }
  }
  else if(m.type==='menu'){
    var mn=m.menu||{};
    body='<div class="menu-hero"><div style="font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted-dark)">'+esc(mn.category||'')+'</div>'+
      '<div class="nm">'+esc(mn.name||m.title)+'</div><div class="pr" style="color:var(--gold)">'+esc(mn.price||'')+'</div>'+
      '<div style="font-size:13.5px;margin-top:9px;line-height:1.6">'+esc(mn.desc||'')+'</div></div>'+
      '<div class="card" style="margin-bottom:12px"><div class="kv">'+
      '<div class="k">Komposisi</div><div>'+esc(mn.ingredients||'-')+'</div>'+
      '<div class="k">Alergen</div><div><b>'+esc(mn.allergens||'-')+'</b></div>'+
      '<div class="k">Catatan Ops</div><div>'+esc(mn.notes||'-')+'</div></div></div>'+
      '<div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--gold2);margin-bottom:6px">Selling Script (hafalkan gayanya, bukan kata per kata)</div>'+
      '<div class="script-box">'+esc(mn.selling||'-')+'</div>'+
      doneBtn(m,done,'Saya sudah mempelajari produk ini (komposisi, alergen, script)');
  }
  else if(m.type==='quiz'){
    body=renderQuizIntro(u,m);
  }
  modal(head+scopeNote+body, m.type==='quiz'||m.type==='menu');
}
function doneBtn(m,done,label){
  if(typeof OPEN_SCOPE!=='undefined' && OPEN_SCOPE===false) return '';
  if(done) return '<div style="margin-top:14px"><span class="badge b-ok">'+svgIcon('check')+' Sudah diselesaikan</span></div>';
  return '<button class="btn btn-gold btn-block" style="margin-top:14px" onclick="completeMaterial(\''+m.id+'\')">'+svgIcon('check')+' '+(label||'Tandai selesai')+'</button>';
}
function sopCheck(){
  var chks=document.querySelectorAll('.sopChk');
  var all=true; chks.forEach(function(c){ if(!c.checked) all=false; });
  var b=document.getElementById('sopAckBtn'); if(b) b.disabled=!all;
}
function completeMaterial(id){
  var u=currentUser(); var m=DB.materials.find(function(x){return x.id===id});
  setProg(u.id, id, {status:'done', completedAt:Date.now()});
  if(PROG_CTX) markProgDone(u.id, PROG_CTX, id, null);
  logAct('selesai', 'Menyelesaikan '+TYPES[m.type].label+': '+m.title);
  closeModal(); toast('Materi selesai. Kerja bagus, Pelaut!');
  var st=userStats(u);
  if(st.certified && !u._certToasted){ toast('Semua materi wajib selesai, kamu tersertifikasi.'); }
  render();
}

/* ---------- quiz ---------- */
var quizState=null;
function renderQuizIntro(u,m){
  var p=getProg(u.id,m.id)||{};
  var h='';
  if(PROG_CTX && !progItemDone(u,PROG_CTX,m.id) && p.passed) h+='<div class="badge b-info" style="margin-bottom:10px">'+svgIcon('repeat')+' Refresher program bulan ini, kerjakan ulang meski dulu sudah lulus</div>';
  h+='<div class="card" style="margin-bottom:14px"><div class="kv">'+
    '<div class="k">Jumlah Soal</div><div>'+m.questions.length+' pertanyaan pilihan ganda</div>'+
    '<div class="k">Nilai Lulus</div><div>'+(m.passing||DB.settings.passingDefault)+'%</div>'+
    '<div class="k">Percobaan</div><div>'+(p.attempts||0)+'x '+(p.score!=null?('skor terakhir <b>'+p.score+'%</b> '+(p.passed?'LULUS':'belum lulus')):'')+'</div></div></div>';
  if(OPEN_SCOPE===false){
    h+='<button class="btn btn-ghost btn-block" onclick="startQuiz(\''+m.id+'\',true)">'+svgIcon('target')+' Coba Kuis (Mode Latihan, skor tidak disimpan)</button>';
  } else {
    h+='<button class="btn btn-gold btn-block" onclick="startQuiz(\''+m.id+'\')">'+(p.attempts?svgIcon('repeat')+' Ulangi Kuis':svgIcon('play')+' Mulai Kuis')+'</button>';
  }
  return h;
}
function startQuiz(id, practice){
  var m=DB.materials.find(function(x){return x.id===id});
  quizState={matId:id, answers:new Array(m.questions.length).fill(null), practice:!!practice};
  var h='<div class="modal-head"><h3>'+esc(m.title)+'</h3><button class="modal-x" onclick="closeModal()">'+svgIcon('x',18)+'</button></div>';
  h+=m.questions.map(function(q,qi){
    return '<div class="quiz-q"><div class="qt">'+(qi+1)+'. '+esc(q.q)+'</div>'+
      q.opts.map(function(o,oi){
        return '<label class="quiz-opt" id="q'+qi+'o'+oi+'"><input type="radio" name="q'+qi+'" onchange="pickAns('+qi+','+oi+')"> '+esc(o)+'</label>';
      }).join('')+'</div>';
  }).join('');
  h+='<button class="btn btn-gold btn-block" onclick="submitQuiz()">Kumpulkan Jawaban</button>';
  modal(h, true);
}
function pickAns(qi,oi){
  quizState.answers[qi]=oi;
  var m=DB.materials.find(function(x){return x.id===quizState.matId});
  m.questions[qi].opts.forEach(function(_,i){
    var el=document.getElementById('q'+qi+'o'+i);
    if(el) el.classList.toggle('sel', i===oi);
  });
}
function submitQuiz(){
  var u=currentUser();
  var m=DB.materials.find(function(x){return x.id===quizState.matId});
  if(quizState.answers.some(function(a){return a===null})){ toast('Masih ada soal yang belum dijawab'); return; }
  var correct=0;
  m.questions.forEach(function(q,i){ if(quizState.answers[i]===q.a) correct++; });
  var score=Math.round(correct/m.questions.length*100);
  var passing=m.passing||DB.settings.passingDefault;
  var passed=score>=passing;
  if(!quizState.practice){
    var p=getProg(u.id,m.id)||{};
    setProg(u.id, m.id, {attempts:(p.attempts||0)+1, score:score, passed:passed||p.passed===true, lastAt:Date.now(), completedAt: passed?Date.now():(p.completedAt||null)});
    if(PROG_CTX && passed) markProgDone(u.id, PROG_CTX, m.id, score);
    logAct('kuis', m.title+', skor '+score+'% ('+(passed?'LULUS':'belum lulus')+')');
  }
  var h='<div class="modal-head"><h3>'+(quizState.practice?'Hasil Latihan':(passed?'Lulus':'Belum Lulus'))+'</h3><button class="modal-x" onclick="closeModal();render()">'+svgIcon('x',18)+'</button></div>';
  h+='<div class="cert" style="margin-bottom:14px"><div class="h">Hasil Kuis</div><div class="n">'+score+'%</div>'+
    '<div style="font-size:13px;color:var(--muted)">'+correct+' dari '+m.questions.length+' benar, nilai lulus '+passing+'%</div>'+
    '<div style="margin-top:10px">'+(quizState.practice?'<span class="badge b-info">Mode Latihan, skor tidak disimpan</span>':(passed?'<span class="badge b-ok">'+svgIcon('check')+' LULUS, standar tercapai</span>':'<span class="badge b-warn">Pelajari lagi materinya, lalu ulangi. Kamu pasti bisa.</span>'))+'</div></div>';
  h+='<div style="font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px">Review Jawaban</div>';
  h+=m.questions.map(function(q,qi){
    var ua=quizState.answers[qi]; var ok=ua===q.a;
    return '<div class="quiz-q"><div class="qt" style="display:flex;gap:7px;align-items:baseline"><span>'+(qi+1)+'. '+esc(q.q)+'</span><span style="color:var('+(ok?'--ok':'--bad')+');flex:none">'+svgIcon(ok?'check':'x')+'</span></div>'+
      q.opts.map(function(o,oi){
        var cls= oi===q.a?'correct':(oi===ua && !ok?'wrong':'');
        return '<div class="quiz-opt '+cls+'">'+esc(o)+(oi===q.a?' <b style="margin-left:auto;font-size:11px">JAWABAN BENAR</b>':'')+'</div>';
      }).join('')+'</div>';
  }).join('');
  h+='<button class="btn btn-ink btn-block" onclick="closeModal();render()">Selesai</button>';
  modal(h, true);
}

function saveMaterial(id, type){
  var title=document.getElementById('fTitle').value.trim();
  if(!title){ toast('Judul wajib diisi'); return; }
  var divs=[]; document.querySelectorAll('.fDiv:checked').forEach(function(c){divs.push(c.value)});
  if(!divs.length){ toast('Pilih minimal satu divisi'); return; }
  if(divs.indexOf('all')>-1) divs=['all'];
  var m = id ? DB.materials.find(function(x){return x.id===id}) : {id:uid('m'), type:type, createdAt:Date.now(), published:true};
  m.title=title; m.division=divs;
  m.cat=document.getElementById('fCat').value;
  m.mandatory=document.getElementById('fMand').value==='1';
  if(type==='modul') m.body=document.getElementById('fBody').value;
  if(type==='video'){ m.videoUrl=document.getElementById('fVideo').value.trim(); m.desc=document.getElementById('fDesc').value; }
  if(type==='sop'){
    m.steps=document.getElementById('fSteps').value.split('\n').map(function(s){return s.trim()}).filter(Boolean);
    if(!m.steps.length){ toast('SOP butuh minimal satu langkah'); return; }
  }
  if(type==='menu'){
    m.menu={name:document.getElementById('fMName').value, price:document.getElementById('fMPrice').value,
      category:document.getElementById('fMCat').value, desc:document.getElementById('fMDesc').value,
      ingredients:document.getElementById('fMIng').value, allergens:document.getElementById('fMAll').value,
      selling:document.getElementById('fMSell').value, notes:document.getElementById('fMNotes').value};
  }
  if(type==='quiz'){
    var qs=editQ.filter(function(q){return q.q.trim() && q.opts.filter(function(o){return o.trim()}).length>=2});
    if(!qs.length){ toast('Kuis butuh minimal satu soal lengkap'); return; }
    m.questions=qs.map(function(q){return {q:q.q.trim(), opts:q.opts.map(function(o){return o.trim()}).filter(Boolean), a:Math.min(q.a, q.opts.filter(Boolean).length-1)}});
    m.passing=parseInt(document.getElementById('fPassing').value)||DB.settings.passingDefault;
  }
  if(!id) DB.materials.push(m);
  logAct(id?'edit_materi':'tambah_materi', m.title);
  saveDB(); closeModal(); render(); toast('Materi tersimpan');
}

var PROG_CTX=null;

/* ---------- bulan helpers ---------- */
function bulanLabel(mk){ var d=new Date(mk+'-01T00:00:00'); return d.toLocaleDateString('id-ID',{month:'long',year:'numeric'}); }
function currentMonthKey(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function nextMonthKey(mk){ var d=new Date(mk+'-01T00:00:00'); d.setMonth(d.getMonth()+1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function lastDayOf(mk){ var d=new Date(mk+'-01T00:00:00'); var ld=new Date(d.getFullYear(), d.getMonth()+1, 0); return ld.getFullYear()+'-'+String(ld.getMonth()+1).padStart(2,'0')+'-'+String(ld.getDate()).padStart(2,'0'); }

/* ---------- program helpers ---------- */
function progMats(p){ return p.materialIds.map(function(id){return DB.materials.find(function(m){return m.id===id})}).filter(function(m){return m && m.published}); }
function progMatsForUser(u,p){
  return progMats(p).filter(function(m){
    if(u.division==='all') return true;
    return m.division.indexOf('all')>-1 || m.division.indexOf(u.division)>-1;
  });
}
function progItemDone(u,progId,matId){ var pp=DB.progProg[u.id]; var r=pp&&pp[progId]&&pp[progId][matId]; return !!(r&&r.done); }
function markProgDone(userId,progId,matId,score){
  if(!DB.progProg[userId]) DB.progProg[userId]={};
  if(!DB.progProg[userId][progId]) DB.progProg[userId][progId]={};
  var r={done:true, at:Date.now()}; if(score!=null) r.score=score;
  DB.progProg[userId][progId][matId]=r; saveDB();
}
function programUserStats(u,p){
  var mats=progMatsForUser(u,p);
  var done=mats.filter(function(m){return progItemDone(u,p.id,m.id)}).length;
  return {total:mats.length, done:done, pct: mats.length?Math.round(done/mats.length*100):100};
}
function programAvg(p){
  var kru=DB.users.filter(function(k){return k.active && k.role!=='admin'});
  var vals=[]; kru.forEach(function(k){ var s=programUserStats(k,p); if(s.total>0) vals.push(s.pct); });
  return vals.length? Math.round(vals.reduce(function(a,b){return a+b},0)/vals.length) : 0;
}

/* ---------- SYNC LAMA (Apps Script) — TIDAK DIPAKAI LAGI ----------
   pushDB()/pullDB() di bawah menyimpan ke Google Apps Script lewat
   settings.syncUrl, yang tidak pernah diisi siapa pun. Digantikan
   pushToServer()/loadFromServer() yang langsung ke MySQL, tanpa perlu
   pengaturan. Dibiarkan sebagai rujukan; tidak ada tombol yang memanggilnya. */
function setSyncBadge(state){
  SYNC_STATE=state;
  var d=document.getElementById('syncDot'); if(d) d.className='sync-dot '+state;
  var t=document.getElementById('syncTxt'); if(t) t.textContent={ok:'tersinkron',pending:'menunggu…',error:'gagal',off:'off'}[state]||state;
  var s=document.getElementById('syncStatusLine');
  if(s) s.innerHTML='<span class="sync-dot '+state+'"></span> '+({ok:'Tersinkron dengan server',pending:'Perubahan menunggu dikirim…',error:'Gagal terhubung, cek URL/kunci/koneksi',off:'Belum terhubung'}[state]||state);
}
/* Kirim ke MySQL. Dulu ini bergantung syncUrl yang harus diisi manual tiap kru
   (dan tidak pernah diisi) — sekarang selalu jalan, tanpa pengaturan apa pun. */
function scheduleSync(){
  setSyncBadge('pending');
  clearTimeout(SYNC_TIMER);
  SYNC_TIMER=setTimeout(pushToServer, 1500);
}
var _pushBusy=false, _pushLagi=false;
function pushToServer(){
  if(_pushBusy){ _pushLagi=true; return; }   // hindari dua POST balapan
  _pushBusy=true;
  stampChanges();
  fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'saveAll', data:buildPayload()})})
    .then(function(r){return r.json();})
    .then(function(j){
      if(!j || !j.ok || !j.data) throw new Error((j&&j.error)||'ditolak server');
      var bentrok=j.data.bentrok||[];
      if(bentrok.length){
        // Kru lain sudah mengubah baris yang sama duluan. Jangan timpa diam-diam.
        setSyncBadge('error');
        toast('Sebagian perubahan tidak tersimpan — '+bentrok.length+' data sudah diubah kru lain. Muat ulang halaman.');
      }else{
        setSyncBadge('ok'); SERVER_OK=true;
        refreshSnapshot();               // versi kita kini = versi server
      }
    })
    .catch(function(e){
      // Tetap aman: perubahan sudah ada di localStorage, dicoba lagi nanti.
      setSyncBadge('error'); SERVER_OK=false;
      console.warn('Gagal kirim ke server:', e.message);
    })
    .finally(function(){
      _pushBusy=false;
      if(_pushLagi){ _pushLagi=false; scheduleSync(); }
    });
}
function pushDB(manual){
  var url=DB.settings.syncUrl;
  if(!url){ if(manual) toast('Isi URL server dulu di pengaturan'); return; }
  setSyncBadge('pending');
  try{
    fetch(url, {method:'POST', body: JSON.stringify({action:'push', key:DB.settings.syncKey||'', db:DB})})
      .then(function(r){return r.json()})
      .then(function(res){
        if(res && res.ok){ setSyncBadge('ok'); if(manual) toast('Data terkirim ke server'); }
        else { setSyncBadge('error'); if(manual) toast('Server menolak: '+(res&&res.error?res.error:'cek kunci')); }
      })
      .catch(function(){ setSyncBadge('error'); if(manual) toast('Gagal kirim, cek koneksi/URL'); });
  }catch(e){ setSyncBadge('error'); }
}
function pullDB(silent){
  var url=DB.settings.syncUrl;
  if(!url){ if(!silent) toast('Isi URL server dulu di pengaturan'); return Promise.resolve(); }
  try{
    return fetch(url+(url.indexOf('?')>-1?'&':'?')+'action=pull&key='+encodeURIComponent(DB.settings.syncKey||''))
      .then(function(r){return r.json()})
      .then(function(res){
        if(res && res.ok && res.db){
          if((res.db.updatedAt||0) > (DB.updatedAt||0)){
            var keep={u:DB.settings.syncUrl, k:DB.settings.syncKey, a:DB.settings.syncAuto};
            DB=res.db; migrateDB();
            DB.settings.syncUrl=keep.u; DB.settings.syncKey=keep.k; DB.settings.syncAuto=keep.a;
            DIVISIONS=DB.divisions;
            saveDB(true);
            if(currentUser()) render();
            if(!silent) toast('Data terbaru diambil dari server');
          } else if(!silent) toast('Data lokal sudah paling baru');
          setSyncBadge('ok');
        } else if(res && res.ok){
          if(!silent) toast('Server masih kosong, klik "Kirim ke Server" dulu dari device utama');
          setSyncBadge('ok');
        } else { setSyncBadge('error'); if(!silent) toast('Server menolak: '+(res&&res.error?res.error:'cek kunci')); }
      })
      .catch(function(){ setSyncBadge('error'); if(!silent) toast('Gagal ambil data, cek koneksi/URL'); });
  }catch(e){ setSyncBadge('error'); return Promise.resolve(); }
}
/* testSync() & saveSyncSettings() DIBUANG: keduanya membaca kolom URL/Kunci
   Apps Script yang sudah tidak ada di halaman. Data akademi kini otomatis ke
   MySQL — tidak ada yang perlu diatur kru. */

// Ambil ulang dari database, buang perubahan lokal yang belum terkirim.
function ambilDariServer(){
  toast('Mengambil dari database…');
  loadFromServer().then(function(){
    if(SERVER_OK){ toast('Data terbaru diambil dari database'); render(); }
    else toast('Gagal terhubung ke database, cek koneksi');
  });
}

function vSync(u){
  var h='<div class="topbar"><div><h2>Sinkronisasi & Backup</h2><div class="sub">Data akademi tersimpan di database server, dipakai bersama semua device</div></div></div>';
  h+='<div class="card" style="margin-bottom:16px"><h3>Status</h3>'+
    '<div id="syncStatusLine" style="font-size:14px;font-weight:600;margin-bottom:6px"><span class="sync-dot '+SYNC_STATE+'"></span> '+
    ({ok:'Tersinkron dengan database',pending:'Perubahan menunggu dikirim…',error:'Gagal terhubung ke database — perubahan tersimpan sementara di perangkat ini',off:'Belum terhubung'}[SYNC_STATE]||'')+'</div>'+
    '<div style="font-size:12px;color:var(--muted)">Perubahan terakhir: '+fmtDT(DB.updatedAt)+'</div>'+
    '<div style="font-size:12px;color:var(--muted);margin-top:8px">Server: <span class="mono">'+esc(API_URL)+'</span></div></div>';
  h+='<div class="card" style="margin-bottom:16px"><h3>Database</h3>'+
    '<div style="font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:12px">'+
      'Semua perubahan (materi, kru, progress belajar) otomatis tersimpan ke database dan langsung terlihat di device lain. '+
      'Tidak ada yang perlu diatur.<br><br>'+
      '<b>Dulu:</b> data hanya tersimpan di browser masing-masing kru — progress tiap orang terkurung di device-nya, dan hilang kalau cache dibersihkan.'+
    '</div>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap">'+
    '<button class="btn btn-gold" onclick="pushToServer()">'+svgIcon('cloud')+' Kirim Sekarang</button>'+
    '<button class="btn btn-ghost" onclick="ambilDariServer()">'+svgIcon('cloud')+' Ambil Ulang dari Server</button></div></div>';
  h+='<div class="card" style="margin-bottom:16px"><h3>Backup Manual</h3>'+
    '<div style="font-size:13px;color:var(--muted);margin-bottom:12px">Unduh seluruh data (kru, materi, progress, program) sebagai file JSON, bisa diarsipkan atau dipindahkan ke device lain.</div>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-ghost" onclick="exportJSON()">Unduh Backup (.json)</button>'+
    '<button class="btn btn-ghost" onclick="importJSON()">Pulihkan dari Backup</button></div></div>';
  // Router (render()) yang menulis ke #main: view HARUS mengembalikan string.
  // Sebelumnya fungsi ini menulis sendiri lalu `return;` kosong, jadi router
  // menimpanya dengan "undefined".
  return h;
  /* Panduan pasang Apps Script DIHAPUS: data akademi kini di MySQL,
     tidak ada lagi yang perlu diatur manual oleh kru. */

}
function exportJSON(){
  var data=JSON.stringify(DB, null, 1);
  try{
    var blob=new Blob([data],{type:'application/json'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='akademi_laksamana_backup_'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    toast('Backup diunduh');
  }catch(e){
    modal('<div class="modal-head"><h3>Backup JSON</h3><button class="modal-x" onclick="closeModal()">'+svgIcon('x',18)+'</button></div><div class="field"><textarea rows="14" onclick="this.select()">'+esc(data)+'</textarea></div><div style="font-size:12px;color:var(--muted)">Salin semua teks di atas dan simpan sebagai file .json</div>', true);
  }
}
function importJSON(){
  modal('<div class="modal-head"><h3>Pulihkan dari Backup</h3><button class="modal-x" onclick="closeModal()">'+svgIcon('x',18)+'</button></div>'+
    '<div class="field"><label>Tempel isi file backup .json di sini</label><textarea id="impTxt" rows="12" placeholder="{ ... }"></textarea></div>'+
    '<div style="font-size:12.5px;color:var(--bad);margin-bottom:12px;display:flex;gap:6px;align-items:flex-start">'+svgIcon('alert')+' <span>Ini akan MENGGANTI seluruh data di device ini dengan isi backup.</span></div>'+
    '<button class="btn btn-gold btn-block" onclick="doImportJSON()">Pulihkan Data</button>', true);
}
function doImportJSON(){
  try{
    var d=JSON.parse(document.getElementById('impTxt').value);
    if(!d.users || !d.materials) throw new Error('format tidak dikenal');
    DB=d; migrateDB(); DIVISIONS=DB.divisions; saveDB(true);
    logAct('restore','Data dipulihkan dari backup JSON');
    closeModal(); render(); toast('Data berhasil dipulihkan');
  }catch(e){ toast('File backup tidak valid: '+e.message); }
}



/* ---------- VIEW: perpustakaan (semua divisi) ---------- */
var perpusFilter={q:'', div:'all', type:'all'};
function setPerpus(k,v){ perpusFilter[k]=v; render(); }
function perpusSearch(v){ perpusFilter.q=v; renderPerpusGrid(); }
function vPerpus(u){
  var h='<div class="topbar"><div><h2>Perpustakaan Laksamana</h2><div class="sub">Semua materi training lintas divisi, belajar apa pun, kapan pun. Materi di luar divisimu terbuka dalam Mode Baca.</div></div></div>';
  h+='<div class="field" style="max-width:420px"><input placeholder="Cari judul materi…" value="'+esc(perpusFilter.q)+'" oninput="perpusSearch(this.value)"></div>';
  h+='<div class="chip-row"><button class="chip'+(perpusFilter.div==='all'?' active':'')+'" onclick="setPerpus(\'div\',\'all\')">'+svgIcon('globe')+' Semua Divisi</button>'+
    DIVISIONS.map(function(d){
      return '<button class="chip'+(perpusFilter.div===d.id?' active':'')+'" onclick="setPerpus(\'div\',\''+d.id+'\')">'+divIcon(d.id)+' '+esc(d.name)+'</button>';
    }).join('')+'</div>';
  h+='<div class="chip-row"><button class="chip'+(perpusFilter.type==='all'?' active':'')+'" onclick="setPerpus(\'type\',\'all\')">Semua Tipe</button>'+
    Object.keys(TYPES).map(function(k){
      return '<button class="chip'+(perpusFilter.type===k?' active':'')+'" onclick="setPerpus(\'type\',\''+k+'\')">'+typeIcon(k)+' '+TYPES[k].label+'</button>';
    }).join('')+'</div>';
  h+='<div id="perpusGrid"></div>';
  setTimeout(renderPerpusGrid,0);
  return h;
}
function renderPerpusGrid(){
  var el=document.getElementById('perpusGrid'); if(!el) return;
  var u=currentUser();
  var q=perpusFilter.q.toLowerCase();
  var mine=matsForUser(u).map(function(m){return m.id});
  var list=DB.materials.filter(function(m){
    if(!m.published) return false;
    if(perpusFilter.type!=='all' && m.type!==perpusFilter.type) return false;
    if(perpusFilter.div!=='all' && m.division.indexOf('all')===-1 && m.division.indexOf(perpusFilter.div)===-1) return false;
    if(q && m.title.toLowerCase().indexOf(q)===-1) return false;
    return true;
  }).sort(function(a,b){return b.createdAt-a.createdAt});
  if(!list.length){ el.innerHTML='<div class="empty"><div class="big">'+svgIcon('compass',34)+'</div>Tidak ada materi yang cocok dengan pencarian.</div>'; return; }
  el.innerHTML='<div style="font-size:12px;color:var(--muted);margin-bottom:10px">'+list.length+' materi ditemukan</div>'+
    '<div class="grid g3">'+list.map(function(m){
      var t=TYPES[m.type]; var inScope=mine.indexOf(m.id)>-1; var done=inScope&&isDone(u,m);
      return '<div class="mat-card" onclick="openMaterial(\''+m.id+'\')">'+
        (done?'<span class="mat-done badge b-ok">'+svgIcon('check')+' Selesai</span>':(!inScope?'<span class="mat-done badge b-info">'+svgIcon('read')+' Mode Baca</span>':''))+
        '<div class="ty">'+typeIcon(m.type,24)+'</div><div class="ti">'+esc(m.title)+'</div>'+
        '<div class="me"><span class="badge '+t.badge+'">'+t.label+'</span>'+
        (m.mandatory&&inScope?'<span class="badge b-bad">Wajib</span>':'')+
        '<span class="badge b-mut">'+m.division.map(divIcon).join(' ')+'</span></div></div>';
    }).join('')+'</div>';
}

/* ---------- init (SSO) ----------
   Identitas dari Office. Head guard di <head> sudah memblokir yang tak berhak,
   jadi di sini kita cukup resolve kru lalu langsung masuk (tanpa login/PIN lokal). */
function bootAkademi(){
  var office=readLmSession();
  if(!office){ location.replace('../'); return; }     // jaring pengaman kedua
  var oAdm=office.adminModules||[];
  OFFICE_IS_ADMIN = oAdm.indexOf('*')>-1 || oAdm.indexOf('akademi')>-1;
  var u=resolveAkademiUser(office);
  try{ localStorage.setItem(SESSION_KEY, u.id); }catch(e){}
  logAct('login', u.name+' naik kapal');
  VIEW='dashboard'; VIEW_ARG=null;
  showApp();
}
// Tarik roster Office (kru ber-akses akademi) SEBELUM resolve user, supaya kru
// baru sudah ada dan tidak terduplikasi. Non-blocking terhadap kegagalan.
// Urutannya sengaja dipertahankan (roster dulu, baru resolve) — kalau dibalik,
// kru yang login pertama kali bisa dibuatkan user baru lalu DIGANDAKAN oleh
// roster. Yang ditambahkan cuma batas waktu di autoSyncOfficeRoster().
function bootAkademiWithRoster(){
  // Kalau lewat 3 detik, beri tahu kru apa yang sedang ditunggu — diam terlalu
  // lama membuat orang mengira modulnya rusak lalu me-refresh berulang.
  var lambat=setTimeout(function(){
    var bs=document.getElementById('bootScreen'); if(bs) bs.classList.add('is-slow');
  },3000);
  var selesai=function(){ clearTimeout(lambat); bootAkademi(); };
  // Roster Office (Apps Script) TERUKUR 16-23 detik. Hanya perlu DITUNGGU bila
  // kru belum dikenal — sebab cuma di kasus itu resolveAkademiUser membuat user
  // baru yang bisa digandakan oleh roster. Kru yang sudah terdaftar (mayoritas)
  // langsung masuk; roster tetap disegarkan di latar belakang.
  var _s = (typeof readLmSession==='function') ? readLmSession() : null;
  var _dikenal = _s && DB && DB.users && DB.users.some(function(x){
    return x.id===_s.userId || String(x.name).toLowerCase()===String(_s.name).toLowerCase();
  });
  if(_dikenal){ autoSyncOfficeRoster(); selesai(); }
  else { autoSyncOfficeRoster().then(selesai).catch(selesai); }
}
/* Boot: MySQL dulu (sumber kebenaran), baru roster Office, baru masuk.
   loadFromServer() sudah menangani kegagalan sendiri — jatuh ke cache lokal,
   jadi app tetap terbuka walau server sedang tidak bisa dihubungi. */
loadFromServer().then(bootAkademiWithRoster);
