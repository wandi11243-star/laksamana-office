<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>POS Laksamana Muda</title>
<link rel="icon" href="../assets/laksamana-mark.png">
<!-- Gerbang Office: POS hanya untuk pemegang kunci 'pos' di Kelola Akses
     (atau '*'). Ditaruh di <head> supaya tidak satu baris pun sempat jalan.
     PIN kasir di dalam POS tetap berlaku sesudahnya — gerbang ini menjawab
     "boleh membuka POS", PIN menjawab "siapa yang sedang berdiri di kasir". -->
<script>
(function(){try{
  var s=JSON.parse(localStorage.getItem('lm_session')||'null');
  var hidup=s&&s.expiry&&Date.now()<s.expiry;
  var punya=hidup&&(s.modules||[]).some(function(m){return m==='*'||m==='pos';});
  if(!punya)location.replace('../');
}catch(e){location.replace('../');}})();
</script>
<!--
  POS Laksamana Muda — PROTOTIPE (27 Oktober 2026, permintaan user).

  HTML SAJA, tanpa backend. Yang perlu diketahui sebelum menyentuhnya:
  - MENU dari HPP & Resep PRODUKSI (resep Menu Jadi yang aktif & berharga),
    disalin ke menu-data.js oleh tools/pos-menu-dari-hpp.js. Menu baru di HPP
    baru muncul di sini sesudah alat itu dijalankan lagi.
  - OMSET 2026 Januari–September dari Rekapitulasi PB1 Bulanan (rekap-2026.js,
    hasil tools/pos-rekap-dari-docx.js), per tanggal apa adanya. Tanggal yang
    belum ada di rekap diperkirakan dari bulan terakhir rekap.
  - TRANSAKSI yang dibayar di sini tersimpan di localStorage peramban ini
    saja, dan TIDAK masuk Office (Finance > Omset, Cashier, Analytics).
    Perangkat lain tidak melihatnya.
-->
<style>
:root{
  --navy:#1d2b45; --navy2:#26385a; --gold:#b8862b; --gold2:#9d7020;
  --bg:#e9edf3; --panel:#fff; --line:#d9dee7; --txt:#1c2330; --mut:#6b7486;
  --ok:#1e9e5a; --err:#c8423a; --soft:#f3f5f9;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--txt);font:14px/1.4 "Segoe UI",Roboto,Arial,sans-serif}
button{font:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
input{font:inherit}
.rp{font-variant-numeric:tabular-nums}

/* ===== LOGIN ===== */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login{display:flex;width:100%;max-width:1180px;background:var(--panel);border-radius:6px;box-shadow:0 2px 12px rgba(0,0,0,.08);overflow:hidden}
.login-left{flex:1;padding:22px 20px;display:flex;flex-direction:column;min-height:560px}
.login-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.login-head b{font-size:16px}
.login-head .sp{flex:1}
.shift b.open{color:#1550d6}
.qs{flex:1;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.qs-head{background:#eee;padding:20px 18px;font-size:20px}
.qs-body{flex:1;display:flex;flex-direction:column}
.qs-empty{flex:1;display:flex;align-items:center;justify-content:center;color:#333}
.qs-row{display:flex;gap:12px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line)}
.qs-row:hover{background:var(--soft)}
.qs-row .n{flex:1}
.qs-foot{display:flex;justify-content:flex-end;align-items:center;gap:24px;padding:10px 18px;color:var(--mut);font-size:13px}
.qs-foot button{background:none;border:0;font-size:18px;color:#555;padding:2px 8px}
.login-right{width:300px;border-left:1px solid var(--line);padding:30px 20px;display:flex;flex-direction:column;align-items:stretch}
.login-logo{display:block;width:170px;margin:4px auto 26px}
.pin-box{border:1px solid var(--line);border-radius:4px;padding:10px 12px;position:relative;margin-bottom:10px}
.pin-box label{position:absolute;top:-9px;left:10px;background:#fff;padding:0 4px;font-size:12px;color:var(--mut)}
.pin-box .dots{height:26px;font-size:22px;letter-spacing:4px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pad button{height:56px;background:#fff;border:1px solid var(--line);border-radius:3px;font-size:19px}
.pad button:hover{background:var(--soft)}
.pad .blank{visibility:hidden}
.btn-signin{margin-top:16px;height:58px;border:0;border-radius:3px;background:var(--navy);color:#fff;font-size:17px;font-weight:600;letter-spacing:.5px}
.login-err{color:var(--err);font-size:13px;min-height:18px;margin-top:8px;text-align:center}
.login-hint{font-size:12px;color:var(--mut);text-align:center}
.ver{margin-top:auto;text-align:right;color:#333;font-size:14px}

/* ===== SHELL ===== */
/* Sidebar & topbar DIPATOK (sticky): halaman order lebih tinggi daripada
   layar, dan sidebar yang ikut tergulir membuat tombolnya "naik" keluar
   layar beserta logonya (keluhan user 27 Okt 2026). */
.shell{display:flex;min-height:100vh;align-items:flex-start}
.side{width:76px;background:#1a2233;display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:2px;flex:none;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:20}
.side .mk{width:38px;height:38px;margin:4px 0 12px;object-fit:contain}
.side button{width:76px;min-height:62px;border:0;background:none;color:#b8c0d0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-left:3px solid transparent;padding:6px 2px;font-size:11px;line-height:1.15}
.side button:hover{color:#fff;background:rgba(255,255,255,.04)}
.side button.on{color:#fff;border-left-color:var(--gold);background:rgba(255,255,255,.08)}
.side button svg{width:22px;height:22px;flex:none}
.side .sp{flex:1}
.main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:100vh}
.top{height:60px;background:var(--navy);color:#fff;display:flex;align-items:center;gap:22px;padding:0 20px;flex:none;position:sticky;top:0;z-index:15}
.pill{background:#fff;color:var(--ok);border-radius:20px;padding:6px 14px;font-weight:600;font-size:14px}
.pill i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ok);margin-right:6px}
.top .sp{flex:1}
.top .it{display:flex;align-items:center;gap:6px;font-size:17px;white-space:nowrap}
.top button.it{background:none;border:0;color:#fff}
.content{flex:1;display:flex;gap:14px;padding:14px;min-height:0}

/* ===== ORDER ===== */
.col-l{flex:1.55;display:flex;flex-direction:column;gap:10px;min-width:0}
.col-r{flex:1;display:flex;flex-direction:column;gap:8px;min-width:320px}
.rowf{display:flex;gap:10px;align-items:flex-end}
.fld label{display:block;font-weight:700;font-size:15px;margin-bottom:6px}
.btn{border:0;border-radius:3px;height:42px;padding:0 18px;background:var(--navy2);color:#fff;font-size:15px;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.btn.gold{background:var(--gold)}
.btn.gold:hover{background:var(--gold2)}
.btn.ghost{background:#d6dbe3;color:#555;box-shadow:none}
.btn.red{background:var(--err)}
.btn.line{background:#fff;color:var(--navy2);border:1px solid var(--navy2)}
.inp{height:42px;border:1px solid var(--line);border-radius:3px;padding:0 12px;width:100%;background:#fff}
.card{background:var(--panel);border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.searchbar{display:flex;gap:8px;padding:12px;align-items:center}
.searchbar .sbox{flex:1;display:flex;align-items:center;border:1px solid var(--line);border-radius:3px;background:#fff}
.searchbar .sbox span{padding:0 12px;color:#555}
.searchbar .sbox input{flex:1;border:0;height:42px;outline:0;background:transparent}
.pager{display:flex;align-items:center;gap:8px;white-space:nowrap}
.cat-title{padding:4px 14px 8px;color:var(--gold2);font-weight:700;font-size:16px;display:flex;align-items:center;gap:10px}
.cat-title button{background:none;border:0;color:var(--navy2);font-weight:600;padding:0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:0 12px 14px;align-content:start;min-height:420px;background:#f6f7f9;padding-top:12px}
.tile{height:88px;background:#fff;border:0;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.14);padding:8px 10px;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px}
.tile:hover{box-shadow:0 2px 7px rgba(0,0,0,.2)}
.tile.on{background:#111;color:#fff}
.tile small{color:var(--gold2);font-weight:600}
.tile .cnt{font-size:12px;color:var(--mut)}
.grid-empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:60px 0}
.actbar{display:flex;gap:10px}
.actbar .btn{flex:1;height:54px}
.modes{display:flex;gap:8px}
.modes .btn{height:44px}
.modes .btn.on{background:var(--gold)}
.cart{flex:1;min-height:300px;display:flex;flex-direction:column}
/* Tanpa max-height: kartunya flex:1 mengisi kolom, jadi daftar yang dibatasi
   meninggalkan ruang kosong DI BAWAH tombol Bayar. min-height:0 supaya
   daftar yang panjang menggulir di dalam, bukan mendorong tombolnya keluar. */
.cart-list{flex:1;min-height:0;overflow:auto}
.cart-empty{height:100%;min-height:260px;display:flex;align-items:center;justify-content:center;font-size:16px}
.ci{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid #eef0f4}
.ci.sel{background:#fff7e6}
.ci .n{flex:1;min-width:0}
.ci .n b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci .n span{color:var(--mut);font-size:13px}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:28px;height:28px;border:1px solid var(--line);background:#fff;border-radius:3px}
.qty b{min-width:22px;text-align:center}
.ci .tot{width:90px;text-align:right}
.ci .del{border:0;background:none;color:var(--err);font-size:16px}
.totals{display:flex;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--line);font-size:13px}
.totals div{text-align:center}.totals div:first-child{text-align:left}.totals div:last-child{text-align:right}
.totals b{display:block}
.totals .v{font-size:17px}
.cart-act{display:flex}
.cart-act .btn{height:62px;border-radius:0;flex:1}
.save{height:58px;font-size:17px;width:100%}

/* ===== PAYMENT ===== */
.pay-l{flex:1.5;display:flex;flex-direction:column;gap:12px;min-width:0}
.pay-r{flex:1;display:flex;flex-direction:column;gap:8px;min-width:330px}
.methods{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:12px;align-content:start;min-height:330px;background:#f6f7f9}
.mth{height:110px;border:0;border-radius:3px;background:var(--navy2);color:#fff;font-weight:700;font-size:16px;letter-spacing:.3px;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.mth.promo{background:var(--gold)}
.mth:hover{filter:brightness(1.08)}
.paysum{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;padding:12px}
.paysum label{font-weight:700;font-size:15px}
.ro{height:48px;border-radius:3px;background:#e5e8ee;display:flex;align-items:center;justify-content:flex-end;padding:0 14px;font-size:20px;font-weight:600}
.lines{padding:0 12px 10px}
.lines div{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--line)}
.receipt-wrap{flex:1;background:#d5d9e0;padding:14px;overflow:auto;max-height:68vh;border-radius:3px}
.receipt{background:#fff;width:100%;max-width:400px;margin:0 auto;padding:16px 22px;font-size:13.5px;box-shadow:2px 2px 6px rgba(0,0,0,.25)}
.receipt img{display:block;width:120px;margin:0 auto 6px}
.receipt .c{text-align:center}
.receipt .r{display:flex;justify-content:space-between}
.receipt .kv{display:grid;grid-template-columns:70px 10px 1fr}
.receipt .hr{border-top:1px dashed #555;margin:6px 0}
.receipt .t{display:grid;grid-template-columns:1fr 110px;text-align:right}
.receipt .t span:first-child{padding-right:6px}

/* ===== MODAL ===== */
.mback{position:fixed;inset:0;top:0;left:0;right:0;bottom:0;background:rgba(10,15,25,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:4px;width:100%;max-width:860px;box-shadow:0 10px 40px rgba(0,0,0,.35);overflow:hidden;max-height:94vh;display:flex;flex-direction:column}
.modal.sm{max-width:480px}
.mh{background:var(--navy);color:#fff;padding:16px 20px;font-size:22px;font-weight:600}
.mb{padding:16px 20px;overflow:auto}
.mf{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--line);align-items:center}
.mf .msg{flex:1;color:var(--ok);font-size:22px;font-weight:600;display:flex;align-items:center;gap:10px}
.cash-top{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cash-top label{font-weight:700;display:block;margin-bottom:6px}
.cash-in{display:flex}
.cash-in input{flex:1;height:48px;border:1px solid var(--navy2);border-radius:3px 0 0 3px;text-align:right;padding:0 12px;font-size:20px}
.cash-in button{width:56px;border:0;background:var(--navy2);color:#fff;font-size:20px;border-radius:0 3px 3px 0}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 10px}
.quick button{height:62px;border:0;border-radius:3px;background:var(--gold);color:#fff;font-weight:700;font-size:17px}
.denom{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.denom button{height:56px;border:0;border-radius:3px;background:var(--navy2);color:#fff;font-weight:700;font-size:15px}
.kpad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.kpad button{height:42px;border:1px solid var(--line);background:#fff;border-radius:3px;font-size:17px}
.ptbl{width:100%;border-collapse:collapse}
.ptbl th{background:#f1f2f5;text-align:left;padding:10px 12px;font-size:15px}
.ptbl td{padding:12px;border-bottom:1px solid var(--line);font-size:15px}
.ptbl .num{text-align:right}
.xbtn{border:0;background:var(--err);color:#fff;width:46px;height:38px;border-radius:3px;font-size:18px}
.csum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 16px;margin-top:18px}
.csum label{font-size:15px;display:block;margin-bottom:4px}
.csum .chg label{font-weight:800}
.csum .arrows{display:flex}
.csum .arrows button{flex:1;height:46px;border:0;background:var(--navy2);color:#fff;font-size:18px}
.ok-ico{width:30px;height:30px;border-radius:50%;background:var(--ok);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:18px}
.opt{display:flex;flex-wrap:wrap;gap:8px}
.opt button{height:44px;padding:0 18px;border:1px solid var(--line);background:#fff;border-radius:3px}
.opt button.on{background:var(--gold);color:#fff;border-color:var(--gold)}
.note{background:#fff8e8;border:1px solid #f0d9a5;color:#7a5a12;padding:10px 12px;border-radius:3px;font-size:13px}

/* ===== LAPORAN / RIWAYAT ===== */
.page{flex:1;display:flex;flex-direction:column;gap:12px;min-width:0}
.ph{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ph h2{margin:0;font-size:20px;flex:1}
.ph select{height:40px;border:1px solid var(--line);border-radius:3px;padding:0 10px;background:#fff}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:#fff;border-radius:4px;padding:14px 16px;box-shadow:0 1px 3px rgba(0,0,0,.08);border-top:3px solid var(--gold)}
.kpi .l{color:var(--mut);font-size:12.5px;text-transform:uppercase;letter-spacing:.4px}
.kpi .v{font-size:21px;font-weight:700;margin-top:4px}
.kpi .f{color:var(--mut);font-size:12px;margin-top:2px}
.tbl{width:100%;border-collapse:collapse;background:#fff}
.tbl th{background:var(--navy);color:#fff;font-weight:600;text-align:left;padding:10px 12px;font-size:13px}
.tbl td{padding:9px 12px;border-bottom:1px solid #eef0f4}
.tbl .num{text-align:right}
.tbl tr.we td{background:#fbf7ee}
.tbl tr.today td{background:#eaf6ef}
.tbl tfoot td{font-weight:700;background:#f1f2f5}
.tbl tbody tr.klik{cursor:pointer}
.tbl tbody tr.klik:hover td{background:var(--soft)}
.chip{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;background:#e8ecf3}
.chip.we{background:#f6e7c4;color:#7a5a12}
.chip.pos{background:#d6f0e1;color:#13603a}
.muted{color:var(--mut)}
.bars{display:flex;align-items:flex-end;gap:3px;height:120px;padding:10px 14px 4px}
.bars div{flex:1;background:var(--navy2);border-radius:2px 2px 0 0;min-height:2px}
.bars div.we{background:var(--gold)}
.bars div.today{background:var(--ok)}
/* ===== DENAH MEJA ===== */
.denah{position:relative;width:100%;aspect-ratio:1600/1160;background:#f4f1ea;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.denah .fx{position:absolute;background:#dcd6c8;color:#7a7263;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:3px;letter-spacing:.4px}
.seat{position:absolute;border:0;border-radius:5px;color:#fff;font-weight:700;font-size:clamp(9px,1.05vw,13px);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;box-shadow:0 1px 2px rgba(0,0,0,.25);padding:0}
.seat small{font-weight:500;font-size:.78em;opacity:.85}
.seat:hover{filter:brightness(1.12);outline:2px solid #111}
.seat.z-dark{background:#3b3f4a}.seat.z-green{background:#2f7d5b}.seat.z-diamond{background:#6a4fb3}.seat.z-vip{background:#b8862b}
.seat.z-wood{background:#8a5a34}.seat.z-blue{background:#2e5a9a}.seat.z-ext{background:#4a7a8c}
.seat.isi{background:#c8423a !important}
.seat.pilih{outline:3px solid #111;outline-offset:2px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{height:38px;padding:0 16px;border:1px solid var(--line);background:#fff;border-radius:3px}
.tabs button.on{background:var(--navy2);color:#fff;border-color:var(--navy2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}

/* ===== PENGATURAN ===== */
.frm{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.frm .full{grid-column:1/-1}
.frm label{display:block;font-weight:600;font-size:13px;margin-bottom:5px}
.frm select{height:42px;border:1px solid var(--line);border-radius:3px;padding:0 10px;width:100%;background:#fff}
.err-txt{color:var(--err);font-size:13px;min-height:18px}
.tog{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.sbtn{height:32px;padding:0 12px;border:1px solid var(--line);background:#fff;border-radius:3px;font-size:13px}
.sbtn:hover{background:var(--soft)}
.chip.off{background:#f3d9d6;color:#8a2a22}
.chip.ubah{background:#e6ddf7;color:#4a3390}
.pg{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:10px 12px;color:var(--mut);font-size:13px}
.pg button{height:32px;min-width:34px;border:1px solid var(--line);background:#fff;border-radius:3px}
@media (max-width:1000px){
  .content{flex-direction:column}.col-r,.pay-r{min-width:0}
  .grid{grid-template-columns:repeat(2,1fr)}.methods{grid-template-columns:repeat(2,1fr)}
  .login{flex-direction:column}.login-right{width:auto;border-left:0;border-top:1px solid var(--line)}
  .kpis{grid-template-columns:repeat(2,1fr)}.top .it.hide-m{display:none}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>

<script src="menu-data.js"></script>
<script src="rekap-2026.js"></script>
<script src="../assets/venue-layouts.js"></script>
<script>
"use strict";
/* ================= KONSTANTA ================= */
const OUTLET = { kode:'LKSOU', nama:'Laksamana Muda', station:'A' };
const LOGO = '../assets/laksamana-muda.png';
const MARK = '../assets/laksamana-mark.png';
const PB1_PCT = 10;    // dipakai perkiraan omset harian (rekap: pajak = 10% omset)
const TAHUN = 2026;    // permintaan user: POS ini hanya memajang tahun 2026
const KEY = 'lm_pos_v1';
const SKEY = 'lm_pos_set_v1';   // pengaturan POS (menu, pengguna, pajak) — HANYA di POS ini
const METODE = ['CASH','QRIS','EDC BCA','EDC MANDIRI','EDC BRI','TRANSFER','GOFOOD','GRABFOOD','OTHER VOUCHER'];
const PER_HAL = 16;

/* ================= PENGATURAN POS =================
   Seluruh perubahan dari halaman Pengaturan (harga/nama/kategori menu, menu

/* ================= SINKRON KE SERVER (27 Okt 2026) =================
   Order & setelan bersama disimpan di server (kompas-api-mysql, aksi
   posList/posSimpan/posSetting) supaya komputer kasir lain melihat data yang
   sama. localStorage TETAP dipakai sebagai salinan & antrean: order yang
   belum terkirim ditandai _naik=false dan dikirim ulang begitu jaringan
   kembali — kasir tidak boleh berhenti melayani karena WiFi putus.
   _base = versi server yang dipegang order ini; server menolak kiriman yang
   base-nya sudah basi (order keburu diubah di perangkat lain), dan yang
   ditolak diganti versi server — bukan ditimpa. */
const API_POS = '../kompas-api-mysql/api.php';
const SYNC = { sedang: false, gagal: '', terakhir: 0, ver: -1 };
function sesiToken() {
  try { const s = JSON.parse(localStorage.getItem('lm_session') || 'null'); return (s && s.token) || ''; } catch (e) { return ''; }
}
async function apiPos(action, extra) {
  const r = await fetch(API_POS, { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(Object.assign({ action: action, sesi: sesiToken() }, extra || {})) });
  const t = await r.text();
  let j; try { j = JSON.parse(t); } catch (e) { throw new Error('Balasan server bukan JSON (HTTP ' + r.status + ')'); }
  return j;
}
function tandaiOrder(o) { o.updatedAt = Math.max(Date.now(), (+o.updatedAt || 0) + 1); o._naik = false; }
function belumNaik() { return DB.orders.filter(o => o._naik === false).length; }
async function kirimAntre() {
  for (const o of DB.orders.filter(x => x._naik === false)) {
    const kirim = Object.assign({}, o); delete kirim._naik; delete kirim._base;
    const j = await apiPos('posSimpan', { order: kirim, base: +o._base || 0 });
    if (j.ok) { o._naik = true; o.updatedAt = j.data.updatedAt; o._base = j.data.updatedAt; }
    else if (j.konflik && j.server) {
      const i = DB.orders.findIndex(x => x.id === o.id);
      DB.orders[i] = Object.assign(j.server, { _naik: true, _base: j.server.updatedAt });
      toast('Order ' + (o.no || '') + ' sudah diubah di perangkat lain — versi terbaru dipakai.');
    } else throw new Error(j.error || 'Gagal menyimpan order.');
    simpan();
  }
}
async function kirimSetBersama() {
  const j = await apiPos('posSetting', { data: { users: SET.users, menu: SET.menu, menuBaru: SET.menuBaru, sc: SET.sc, pb1: SET.pb1 } });
  if (!j.ok) throw new Error(j.error || 'Gagal menyimpan pengaturan.');
  SET._belum = false; SET.ts = j.data.ts; simpanSet(true);
}
async function tarikServer() {
  const j = await apiPos('posList', { dari: TAHUN + '-01-01' });
  if (!j.ok) throw new Error(j.error || 'Gagal membaca data server.');
  const d = j.data || {};
  let berubah = false;
  const srv = {}; (d.orders || []).forEach(o => { srv[o.id] = o; });
  DB.orders.forEach((o, i) => {
    const so = srv[o.id];
    if (so) {
      if (o._naik !== false && (+so.updatedAt || 0) !== (+o._base || 0)) {
        DB.orders[i] = Object.assign(so, { _naik: true, _base: so.updatedAt }); berubah = true;
      }
      delete srv[o.id];
    } else if (o._naik !== false && o._naik !== true) {
      o._naik = false;   // transaksi lama dari sebelum sinkron: ikut dikirim
    }
  });
  Object.keys(srv).forEach(id => { DB.orders.push(Object.assign(srv[id], { _naik: true, _base: srv[id].updatedAt })); berubah = true; });
  if (berubah) simpan();
  // Setelan bersama: yang lebih baru menang; yang belum terkirim dikirim.
  const ss = d.setting;
  if (SET._belum || !ss) { if (SET._belum || !ss) await kirimSetBersama(); }
  else if ((+ss.ts || 0) > (+SET.ts || 0)) {
    if (Array.isArray(ss.users) && ss.users.length) SET.users = ss.users;
    SET.menu = (ss.menu && typeof ss.menu === 'object' && !Array.isArray(ss.menu)) ? ss.menu : {};
    SET.menuBaru = Array.isArray(ss.menuBaru) ? ss.menuBaru : [];
    if (isFinite(ss.sc)) SET.sc = +ss.sc;
    if (isFinite(ss.pb1)) SET.pb1 = +ss.pb1;
    SET.ts = +ss.ts; simpanSet(true); bangunMenu(); berubah = true;
    if (USER) { const u = SET.users.find(x => x.id === USER.id && x.aktif !== false); if (!u) { USER = null; VIEW = 'login'; } else { USER.nama = u.nama; USER.role = u.role; } }
  }
  return berubah;
}
async function sinkron() {
  if (SYNC.sedang) return;
  SYNC.sedang = true; segarBadge();
  let berubah = false;
  try {
    if (belumNaik()) await kirimAntre();
    berubah = await tarikServer();
    if (belumNaik()) await kirimAntre();
    SYNC.gagal = ''; SYNC.terakhir = Date.now();
  } catch (e) { SYNC.gagal = e.message || String(e); }
  SYNC.sedang = false;
  segarBadge();
  // Gambar ulang hanya di layar baca, tanpa modal terbuka, dan tidak sedang
  // mengetik — penggambaran ulang total membuang fokus kotak isian.
  const ae = document.activeElement;
  if (berubah && !($('modal') && $('modal').innerHTML) && ['login', 'terbuka', 'riwayat', 'laporan'].includes(VIEW) && !(ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName))) render();
}
let _sinkT = null;
function sinkronNanti() { clearTimeout(_sinkT); _sinkT = setTimeout(sinkron, 300); }
function badgeTeks() {
  const n = belumNaik();
  if (SYNC.sedang) return '⟳ Sinkron…';
  if (SYNC.gagal) return '⚠ Offline' + (n ? ' · ' + n + ' belum terkirim' : '');
  if (n || SET._belum) return '⏳ ' + (n || '') + ' belum terkirim';
  return SYNC.terakhir ? '✓ Tersinkron' : '…';
}
function segarBadge() {
  const b = $('sinkBadge'); if (!b) return;
  b.textContent = badgeTeks();
  b.title = SYNC.gagal ? 'Server tidak terjangkau: ' + SYNC.gagal + '. Data tetap tersimpan di komputer ini dan dikirim otomatis.' : 'Data POS tersimpan di server dan terlihat di komputer kasir lain.';
  b.style.color = SYNC.gagal ? '#ffb4a8' : '';
}

/* ================= HITUNGAN =================
   SATU tempat yang menjumlahkan struk; layar order, layar bayar, struk, dan
   laporan semuanya membaca hasil fungsi ini. */
function hitung(o) {
  const sub = o.items.reduce((s, x) => s + x.harga * x.qty, 0);
  const scPct = o.scPct != null ? +o.scPct : SET.sc;
  const pb1Pct = o.pb1Pct != null ? +o.pb1Pct : SET.pb1;
  const disc = Math.round(sub * (o.diskon || 0) / 100) + (o.diskonRp || 0);
  const dasar = sub - disc;
  // scRp/pb1Rp hanya dipakai bill terakhir rincian harian (lihat
  // transaksiHari) supaya jumlah hari itu sama persis dengan rekapnya.
  const sc = o.scRp != null ? o.scRp : Math.round(dasar * scPct / 100);
  const pb1 = o.pb1Rp != null ? o.pb1Rp : Math.round((dasar + sc) * pb1Pct / 100);
  const bill = dasar + sc + pb1;
  const grand = Math.ceil(bill / 100) * 100;
  const bayar = (o.payments || []).reduce((s, p) => s + p.amount, 0);
  return { sub, disc, dasar, sc, pb1, bill, rounding: grand - bill, grand, bayar, scPct, pb1Pct, omset: dasar + sc,
    outstanding: Math.max(0, grand - bayar), kembali: Math.max(0, bayar - grand),
    qty: o.items.reduce((s, x) => s + x.qty, 0) };
}

/* ================= OMSET 2026 =================
   Januari–September 2026 dari Rekapitulasi PB1 Bulanan (rekap-2026.js, hasil
   tools/pos-rekap-dari-docx.js) — angka per tanggal APA ADANYA, jumlahnya
   sudah dicocokkan dengan baris TOTAL dokumen saat alat itu dijalankan.
   Tanggal yang belum ada di rekap (Oktober sampai kemarin) diperkirakan dari
   bulan TERAKHIR yang ada di rekap: rata-rata weekday/weekend-nya, digeser
   ±8% secara DETERMINISTIK per tanggal dan dibulatkan ke Rp100.000 seperti
   rekapnya. Angka satu tanggal karena itu selalu sama tiap halaman dibuka. */
const REKAP = window.POS_REKAP || {};
function rekapTgl(iso) {
  const b = REKAP[iso.slice(0, 7)]; if (!b) return null;
  const r = b.hari.find(x => x[0] === +iso.slice(8, 10));
  return r ? { omset: r[1], pajak: r[2], we: !!r[3] } : null;
}
const POLA = (() => {
  const ks = Object.keys(REKAP).sort(); const b = ks.length ? REKAP[ks[ks.length - 1]] : null;
  if (!b) return { wd: 5000000, we: 6000000 };
  const wd = b.hari.filter(x => !x[3]), we = b.hari.filter(x => x[3]);
  const avg = a => a.length ? a.reduce((s, x) => s + x[1], 0) / a.length : 0;
  return { wd: avg(wd) || avg(b.hari), we: avg(we) || avg(b.hari) };
})();
function acak(seed) { let x = seed | 0; x = Math.imul(x ^ (x >>> 16), 0x45d9f3b); x = Math.imul(x ^ (x >>> 16), 0x45d9f3b); return ((x ^ (x >>> 16)) >>> 0) / 4294967296; }
function omsetPerkiraan(iso) {
  const d = new Date(iso + 'T00:00:00');
  const we = d.getDay() === 0 || d.getDay() === 6;
  const v = (we ? POLA.we : POLA.wd) * (0.92 + acak(+iso.replace(/-/g, '')) * 0.16);
  const omset = Math.round(v / 100000) * 100000;
  return { omset, pajak: Math.round(omset * PB1_PCT / 100), we };
}
// Omset satu tanggal: hari ini dari transaksi POS sungguhan, sebelumnya dari
// rekap. Dicampur di satu hari, angka rekap menenggelamkan transaksi yang
// barusan diketik dan tidak ada yang bisa memeriksa POS-nya.
function omsetHari(iso) {
  const kini = hariIniIso();
  const d = new Date(iso + 'T00:00:00');
  const we = d.getDay() === 0 || d.getDay() === 6;
  if (iso < kini) { const r = rekapTgl(iso); return Object.assign({ sumber: r ? 'rekap' : 'kira' }, r || omsetPerkiraan(iso)); }
  if (iso > kini) return null;
  const paid = DB.orders.filter(o => o.status === 'paid' && o.tgl === iso);
  let omset = 0, pajak = 0;
  paid.forEach(o => { const t = hitung(o); omset += t.dasar + t.sc; pajak += t.pb1; });
  return { omset, pajak, trx: paid.length, we, sumber: 'pos' };
}

const MEJA_SEMUA = (() => {

// Jumat–Minggu memakai denah Weekend, sama dengan modul Reservasi.
const denahLt1 = iso => { const g = new Date(iso + 'T00:00:00').getDay(); return (g === 0 || g === 5 || g === 6) ? 'weekend' : 'weekday'; };

/* ================= RINCIAN TRANSAKSI PER HARI =================
   Hari ini & hari yang punya transaksi POS: transaksi sungguhan.
   Hari dari rekap: rincian bill DISUSUN dari menu, deterministik per
   tanggal (selalu sama tiap dibuka), dan JUMLAHNYA DIPAKSA SAMA PERSIS dengan
   omset & pajak hari itu di rekap — bill terakhir menutup selisihnya lewat
   diskon, scRp, dan pb1Rp. Dengan begitu total di Riwayat = total baris
   Laporan untuk tanggal yang sama. */
function rng(seed) {
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const KASIR_HARIAN = ['Andy', 'Tasya', 'Gita', 'Faila'];
const METODE_BOBOT = [['QRIS', 34], ['Cash', 22], ['EDC BCA', 12], ['EDC MANDIRI', 8], ['EDC BRI', 6], ['TRANSFER', 4], ['GOFOOD', 7], ['GRABFOOD', 7]];
const TRX_CACHE = {};
function transaksiHari(iso) {
  const r = omsetHari(iso); if (!r) return [];
  const asli = DB.orders.filter(o => o.status === 'paid' && o.tgl === iso);
  if (r.sumber === 'pos' || asli.length) return asli.slice().sort((a, b) => a.paidAt - b.paidAt);
  if (TRX_CACHE[iso]) return TRX_CACHE[iso];
  const R = r.omset, P = r.pajak;
  const pool = BASE_MENU.filter(m => m.kat !== 'Compliment' && m.harga > 0);
  if (!R || !pool.length) return (TRX_CACHE[iso] = []);
  const rnd = rng(+iso.replace(/-/g, '') * 7919);
  const ambil = a => a[Math.floor(rnd() * a.length)];
  const nilai = items => { const s = items.reduce((t, x) => t + x.harga * x.qty, 0); return s + Math.round(s * 5 / 100); };
  const satu = () => { const m = ambil(pool); return { id: m.id, nama: m.nama, harga: m.harga, qty: rnd() < 0.2 ? 2 : 1 }; };
  const gabung = items => { const o = []; items.forEach(x => { const y = o.find(z => z.id === x.id); if (y) y.qty += x.qty; else o.push(x); }); return o; };
  const bills = []; let sisa = R;
  while (sisa > 250000 && bills.length < 400) {
    let it = []; const n = 1 + Math.floor(rnd() * 4);
    for (let i = 0; i < n; i++) it.push(satu());
    it = gabung(it);
    while (it.length > 1 && nilai(it) > sisa - 60000) it.pop();
    if (nilai(it) > sisa - 60000) break;
    bills.push({ items: it }); sisa -= nilai(it);
  }
  // Bill penutup: item ditambah sampai nilainya cukup, sisanya jadi diskon.
  let it = [], guard = 0;
  while (nilai(it) < sisa && guard++ < 300) it.push(satu());
  it = gabung(it);
  const sub = it.reduce((t, x) => t + x.harga * x.qty, 0);
  const dasar = Math.min(sub, Math.round(sisa / 1.05));
  bills.push({ items: it, diskonRp: sub - dasar, scRp: sisa - dasar, akhir: true });
  // Jam bill tersebar 10:00–23:45, diurutkan.
  const menit = bills.map(() => 600 + Math.floor(Math.pow(rnd(), 0.8) * 825)).sort((a, b) => a - b);
  const totBobot = METODE_BOBOT.reduce((s, x) => s + x[1], 0);
  const metode = () => { let v = rnd() * totBobot; for (const [m, b] of METODE_BOBOT) { v -= b; if (v <= 0) return m; } return 'QRIS'; };
  const t0 = new Date(iso + 'T00:00:00').getTime();
  let pjLain = 0;
  const hasil = bills.map((b, i) => {
    const at = t0 + menit[i] * 60000 + Math.floor(rnd() * 60) * 1000;
    const qs = rnd() < 0.35;
    const o = { id: 'h' + iso.replace(/-/g, '') + '-' + (i + 1), no: 'S' + OUTLET.kode + Math.floor(at / 1000),
      meja: qs ? 'Quick Service' : ambil(MEJA_SEMUA), notes: '', pax: 1 + Math.floor(rnd() * 4),
      mode: qs && rnd() < 0.4 ? 'TAKE AWAY' : 'DINE IN', items: b.items, diskon: 0, diskonRp: b.diskonRp || 0,
      payments: [], status: 'paid', kasir: ambil(KASIR_HARIAN), at, paidAt: at, tgl: iso, scPct: 5, pb1Pct: 10 };
    if (b.akhir) { o.scRp = b.scRp; o.pb1Rp = P - pjLain; }
    const h = hitung(o);
    if (!b.akhir) pjLain += h.pb1;
    const m = o.mode === 'TAKE AWAY' && rnd() < 0.5 ? (rnd() < 0.5 ? 'GOFOOD' : 'GRABFOOD') : metode();
    o.payments = [{ method: m, amount: m === 'Cash' ? Math.ceil(h.grand / 50000) * 50000 : h.grand }];
    return o;
  });
  return (TRX_CACHE[iso] = hasil);
}
function cariOrder(id) {

  for (const k in TRX_CACHE) { const x = TRX_CACHE[k].find(y => y.id === id); if (x) return x; }

}

/* CETAK STRUK — lewat iframe tersembunyi berisi dokumen SENDIRI.
   Peramban tidak bisa bicara langsung ke printer LAN (port 9100); yang bisa
   adalah printer yang SUDAH DIPASANG di Windows. Jadi printer kasir LAN
   dipasang sekali di Windows (Tambah printer -> alamat IP), dan dari sini
   kita cukup memanggil print() atas dokumen yang ukurannya PAS kertas:
   @page selebar 58/80mm, margin nol, tinggi mengikuti isi. Dulu struk
   dicetak lewat @media print halaman utama — ukuran halamannya A4, jadi
   printer thermal menerima satu "halaman" setinggi A4 (kertas terbuang)
   dan sebagian driver memotong isinya.
   Gambar logo DITUNGGU dulu sebelum print(): dicetak sebelum termuat, struk
   pertama keluar tanpa logo. */
function kolomStruk() {
  const k = Math.round(+SET.printer.kolom || 0);
  return k >= 24 && k <= 64 ? k : (+SET.printer.lebar === 58 ? 32 : 42);
}
// Struk sebagai baris teks: isi & urutannya SAMA dengan struk() — yang beda
// cuma bentuknya. Angka di kanan, label di kiri, nama panjang dibungkus.
function strukTeks(o, K) {
  const h = hitung(o), t = new Date(o.paidAt || o.at);
  const L = [];
  const pot = (x, n) => String(x).length > n ? String(x).slice(0, n) : String(x);
  const tengah = x => { x = pot(x, K); const sp = Math.floor((K - x.length) / 2); return ' '.repeat(sp) + x; };
  const kr = (a, b) => { a = String(a); b = String(b); if (a.length + b.length + 1 > K) { L.push(pot(a, K)); a = ''; } return a + ' '.repeat(Math.max(1, K - a.length - b.length)) + b; };
  const bungkus = x => { const out = []; let baris = ''; String(x).split(/\s+/).forEach(w => { if ((baris + ' ' + w).trim().length > K) { if (baris) out.push(baris); baris = w; } else baris = (baris + ' ' + w).trim(); }); if (baris) out.push(baris); return out; };
  const garis = () => L.push('-'.repeat(K));
  const kv = (a, b) => L.push(pot((a + '         ').slice(0, 8) + ': ' + b, K));
  L.push(tengah('LAKSAMANA MUDA'), tengah('Coffee & Live Space'), tengah('Jl. Soekarno Hatta No. 39'));
  garis();
  kv('Order', o.no || '-');
  kv('Tanggal', pad2(t.getDate()) + '-' + pad2(t.getMonth() + 1) + '-' + t.getFullYear() + ' ' + jamDari(t));
  kv('Table', o.meja + ' - ' + o.mode);
  kv('Pax', o.pax);
  kv('Cashier', o.kasir);
  garis();
  o.items.forEach(x => {
    bungkus(x.nama).forEach(b => L.push(b));
    L.push(kr('  ' + x.qty + ' x ' + fmt2(x.harga), fmt2(x.harga * x.qty)));
  });
  garis();
  L.push(h.qty + ' items');
  garis();
  L.push(kr('Subtotal', fmt2(h.sub)));
  L.push(kr('Bill Discount', fmt2(h.disc)));
  L.push(kr('SC ' + h.scPct + '%', fmt2(h.sc)));
  L.push(kr('PB1 Total', fmt2(h.pb1)));
  L.push(kr('Billing Total', fmt2(h.bill)));
  L.push(kr('Rounding', fmt2(h.rounding)));
  garis();
  L.push(kr('GRAND TOTAL', fmt2(h.grand)));
  if ((o.payments || []).length) {
    garis();
    o.payments.forEach(p => L.push(kr(p.method, fmt2(p.amount))));
    L.push(kr('Change', fmt2(h.kembali)));
  }
  if (o.notes) { garis(); bungkus('Catatan: ' + o.notes).forEach(b => L.push(b)); }
  if (SET.printer.kaki) { garis(); bungkus(SET.printer.kaki).forEach(b => L.push(tengah(b))); }
  L.push('', '', '');
  return L.join('\n');
}
function dokStruk(isi) {
  const p = SET.printer, w = +p.lebar === 58 ? 58 : 80;
  if (p.mode !== 'grafis') {
    // Lebar huruf Courier = 0,6 em; ukurannya dihitung supaya K kolom pas
    // di area cetak (lebar kertas dikurangi ~4mm tepi mesin).
    const K = kolomStruk(), em = ((w - 8) / K / 0.6).toFixed(2);
    return '<!doctype html><html><head><meta charset="utf-8"><title>Struk</title><style>@page{size:' + w + 'mm auto;margin:0}' +
      'html,body{margin:0;padding:0;background:#fff;color:#000}body{width:' + w + 'mm}' +
      'pre{margin:0;padding:0 4mm;font:' + em + 'mm/1.25 "Courier New",Courier,monospace;white-space:pre;page-break-after:always}pre:last-child{page-break-after:auto}' +
      '</style></head><body>' + isi + '</body></html>';
  }
  const css = '@page{size:' + w + 'mm auto;margin:0}' +
    'html,body{margin:0;padding:0;background:#fff;color:#000}' +
    // Huruf & susunan SAMA dengan pratinjau di layar (.receipt) — permintaan
    // user: struk cetak "persis seperti di gambar". Hanya rapi lewat driver
    // printer struk (POS-80 dsb); driver Generic / Text Only membuangnya.
    'body{width:' + w + 'mm;font:' + (w === 58 ? '11px' : '12.5px') + '/1.4 "Segoe UI",Roboto,Arial,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}b{font-weight:700}' +
    '.receipt{padding:2mm ' + (w === 58 ? '2mm' : '3.5mm') + ' 6mm;page-break-after:always}.receipt:last-child{page-break-after:auto}' +
    '.receipt img{display:' + (p.logo ? 'block' : 'none') + ';width:' + (w === 58 ? '30mm' : '38mm') + ';margin:0 auto 2mm;filter:grayscale(1) contrast(1.4)}' +
    '.c{text-align:center}.r{display:flex;justify-content:space-between;gap:4px}.kv{display:grid;grid-template-columns:' + (w === 58 ? '15mm' : '18mm') + ' 8px 1fr}' +
    '.hr{border-top:1px dashed #000;margin:1.5mm 0}.t{display:grid;grid-template-columns:1fr ' + (w === 58 ? '22mm' : '28mm') + ';text-align:right}.t span:first-child{padding-right:6px}.muted{color:#000}';
  return '<!doctype html><html><head><meta charset="utf-8"><base href="' + esc(location.href) + '"><title>Struk</title><style>' + css + '</style></head><body>' + isi + '</body></html>';
}
function cetakStruk(o) {
  const ord = o || CUR; if (!ord) return;
  const n = Math.max(1, Math.min(3, +SET.printer.salinan || 1));
  let isi = ''; for (let i = 0; i < n; i++) isi += SET.printer.mode !== 'grafis' ? '<pre>' + esc(strukTeks(ord, kolomStruk())) + '</pre>' : struk(ord);
  let fr = document.getElementById('frCetak');
  if (fr) fr.remove();
  fr = document.createElement('iframe');
  fr.id = 'frCetak'; fr.setAttribute('aria-hidden', 'true');
  fr.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden';
  document.body.appendChild(fr);
  const d = fr.contentWindow.document;
  d.open(); d.write(dokStruk(isi)); d.close();
  let sudah = false;
  const jalan = () => {
    if (sudah) return; sudah = true;
    try { fr.contentWindow.focus(); fr.contentWindow.print(); } catch (e) { toast('Gagal membuka dialog cetak.'); }
  };
  const tunggu = [...d.images].filter(im => !im.complete);
  if (!tunggu.length || !SET.printer.logo || SET.printer.mode !== 'grafis') setTimeout(jalan, 50);
  else { let sisa = tunggu.length; tunggu.forEach(im => { im.onload = im.onerror = () => { if (--sisa <= 0) jalan(); }; }); setTimeout(jalan, 2500); }
}

let RIW_HAL = 1, RIW_KASIR = '', RIW_MTD = '';
const RIW_PER = 20;
function vRiwayat() {
  const kini = hariIniIso();

  if (RIW_TGL < TAHUN + '-01-01') RIW_TGL = TAHUN + '-01-01';

    (Object.keys(perM).length ? '<div class="card" style="padding:10px 12px;display:flex;gap:8px;flex-wrap:wrap">' + Object.keys(perM).sort((a, b) => perM[b].v - perM[a].v).map(k => '<span class="chip">' + esc(k) + ' · ' + perM[k].n + ' trx · Rp ' + fmt(perM[k].v) + '</span>').join('') + '</div>' : '') +

    '<select class="inp" style="width:170px" onchange="RIW_KASIR=this.value;RIW_HAL=1;render()"><option value="">Semua kasir</option>' + kasirs.map(k => '<option' + (k === RIW_KASIR ? ' selected' : '') + '>' + esc(k) + '</option>').join('') + '</select>' +

/* ---------- LAPORAN 2026 ---------- */
function vLaporan() {
  const kini = hariIniIso();
  const blnMaks = Number(kini.slice(5, 7)) - 1;
  if (LAP_BLN > blnMaks) LAP_BLN = blnMaks;
  const nHari = new Date(TAHUN, LAP_BLN + 1, 0).getDate();
  const baris = [];
  for (let d = 1; d <= nHari; d++) {
    const iso = TAHUN + '-' + pad2(LAP_BLN + 1) + '-' + pad2(d);
    const r = omsetHari(iso); if (!r) break;
    baris.push(Object.assign({ iso }, r));
  }
  const tot = baris.reduce((s, r) => s + r.omset, 0);
  const trxBln = baris.reduce((s, r) => s + transaksiHari(r.iso).length, 0);
  // Bulan yang seluruh harinya dari rekap memakai TOTAL pajak dokumennya:
  // pajak harian di dokumen dibulatkan per baris, jadi jumlahnya bisa selisih
  // beberapa rupiah dari TOTAL yang tertulis (Februari: 3 rupiah).
  const dok = REKAP[TAHUN + '-' + pad2(LAP_BLN + 1)];
  const semuaRekap = baris.length === nHari && baris.every(r => r.sumber === 'rekap');
  const pj = semuaRekap && dok && dok.totalPajak != null ? dok.totalPajak : baris.reduce((s, r) => s + r.pajak, 0);
  const rata = a => a.length ? a.reduce((s, r) => s + r.omset, 0) / a.length : 0;
  const rWd = rata(baris.filter(r => !r.we && r.sumber !== 'pos')), rWe = rata(baris.filter(r => r.we && r.sumber !== 'pos'));
  let ytd = 0;
  for (let m = 0; m <= blnMaks; m++) {
    const n = new Date(TAHUN, m + 1, 0).getDate();
    for (let d = 1; d <= n; d++) { const r = omsetHari(TAHUN + '-' + pad2(m + 1) + '-' + pad2(d)); if (!r) break; ytd += r.omset; }
  }
  const maks = Math.max(1, ...baris.map(r => r.omset));
  const bars = baris.map(r => '<div class="' + (r.sumber === 'pos' ? 'today' : r.we ? 'we' : '') + '" style="height:' + Math.max(2, r.omset / maks * 100) + '%" title="' + esc(tglPanjang(r.iso)) + ': Rp ' + fmt(r.omset) + '"></div>').join('');
  const rows = baris.map((r, i) => '<tr class="klik ' + (r.sumber === 'pos' ? 'today' : r.we ? 'we' : '') + '" title="Lihat detail transaksi" onclick="lihatHari(\'' + r.iso + '\')"><td>' + (i + 1) + '</td><td>' + tglPanjang(r.iso) + ' <span class="muted">›</span></td><td class="num">' + transaksiHari(r.iso).length + '</td><td class="num rp">' + fmt(r.omset) + '</td><td class="num rp">' + fmt(r.pajak) + '</td><td><span class="chip ' + (r.we ? 'we' : '') + '">' + (r.we ? 'Weekend' : 'Weekday') + '</span>' + (r.sumber === 'pos' ? ' <span class="chip pos">POS hari ini</span>' : '') + '</td></tr>').join('');
  return '<div class="page"><div class="ph"><h2>Rekapitulasi Omset & PB1 · ' + TAHUN + '</h2><select onchange="LAP_BLN=+this.value;render()">' +
    BULAN.slice(0, blnMaks + 1).map((b, i) => '<option value="' + i + '"' + (i === LAP_BLN ? ' selected' : '') + '>' + b + ' ' + TAHUN + '</option>').join('') + '</select></div>' +
    '<div class="kpis"><div class="kpi"><div class="l">Omset ' + BULAN[LAP_BLN] + '</div><div class="v rp">Rp ' + fmt(tot) + '</div><div class="f">' + baris.length + ' hari</div></div>' +
    '<div class="kpi"><div class="l">PB1 ' + BULAN[LAP_BLN] + ' (' + PB1_PCT + '%)</div><div class="v rp">Rp ' + fmt(pj) + '</div></div>' +
    '<div class="kpi"><div class="l">Rata-rata / hari</div><div class="v rp">Rp ' + fmt(baris.length ? tot / baris.length : 0) + '</div><div class="f">weekday Rp ' + fmt(rWd) + ' · weekend Rp ' + fmt(rWe) + '</div></div>' +
    '<div class="kpi"><div class="l">Omset Jan – ' + BLN3[blnMaks] + ' ' + TAHUN + '</div><div class="v rp">Rp ' + fmt(ytd) + '</div></div></div>' +
    '<div class="card"><div class="bars">' + bars + '</div></div>' +
    '<div class="card"><div class="muted" style="padding:10px 12px">Klik tanggal untuk melihat detail transaksi hari itu.</div><table class="tbl"><thead><tr><th>No</th><th>Tanggal</th><th class="num">Transaksi</th><th class="num">Omset</th><th class="num">Pajak</th><th>Keterangan</th></tr></thead><tbody>' + rows +
    '</tbody><tfoot><tr><td></td><td>Total</td><td class="num">' + fmt(trxBln) + '</td><td class="num rp">' + fmt(tot) + '</td><td class="num rp">' + fmt(pj) + '</td><td></td></tr></tfoot></table></div></div>';
}

      '<td class="num rp">' + fmt(m.harga) + (asli && asli.harga !== +m.harga ? '<br><small class="muted">HPP: ' + fmt(asli.harga) + '</small>' : '') + '</td><td>' + tanda + '</td>' +
      '<td><label class="tog"><input type="checkbox" ' + (m.aktif !== false ? 'checked' : '') + ' onchange="togMenu(\'' + esc(m.id) + '\',this.checked)"> ' + (m.aktif !== false ? 'Aktif' : 'Nonaktif') + '</label></td>' +
      '<td><button class="sbtn" onclick="editMenu(\'' + esc(m.id) + '\')">✎ Ubah</button></td></tr>';
  }).join('') : '<tr><td colspan="6" class="muted" style="text-align:center;padding:30px">Tidak ada menu yang cocok.</td></tr>';
  return '<table class="tbl"><thead><tr><th>Menu</th><th>Kategori</th><th class="num">Harga</th><th>Sumber</th><th>Status</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>' +
    '<div class="pg"><span>' + (d.length ? ((SM_HAL - 1) * SM_PER + 1) + '–' + Math.min(SM_HAL * SM_PER, d.length) : 0) + ' dari ' + d.length + ' menu</span><button onclick="SM_HAL--;gambarSm()" ' + (SM_HAL <= 1 ? 'disabled' : '') + '>‹</button><span>' + SM_HAL + ' / ' + nHal + '</span><button onclick="SM_HAL++;gambarSm()" ' + (SM_HAL >= nHal ? 'disabled' : '') + '>›</button></div>';
}
// Mengetik di kotak cari hanya menggambar ulang tabelnya — kotaknya tetap.
function gambarSm() { const t = $('smTabel'); if (t) t.innerHTML = tabelSm(); else render(); }
// Menyimpan perubahan menu HPP sebagai SELISIH dari aslinya.
function setMenu(id, nilai) {
  const baru = SET.menuBaru.find(x => x.id === id);
  if (baru) { Object.assign(baru, nilai); }
  else {
    const asli = BASE_MENU.find(x => x.id === id); if (!asli) return;
    const o = Object.assign({}, SET.menu[id] || {}, nilai);
    Object.keys(o).forEach(k => { if (k === 'aktif' ? o[k] !== false : o[k] === asli[k]) delete o[k]; });
    if (Object.keys(o).length) SET.menu[id] = o; else delete SET.menu[id];
  }
  simpanSet(); bangunMenu();
}
function togMenu(id, on) { setMenu(id, { aktif: !!on }); gambarSm(); }
function editMenu(id) {
  const m = id ? menuSemua().find(x => x.id === id) : { id: '', nama: '', kat: '', harga: 0, aktif: true, asal: 'pos' };
  if (!m) return;
  const kats = [...new Set(menuSemua().map(x => x.kat))].sort();
  const asli = m.asal === 'hpp' ? BASE_MENU.find(x => x.id === m.id) : null;
  modal('<div class="modal sm"><div class="mh">' + (id ? 'Ubah Menu' : 'Tambah Menu') + '</div><div class="mb"><div class="frm">' +
    '<div class="full"><label>Nama menu</label><input id="emNama" class="inp" value="' + esc(m.nama) + '"></div>' +
    '<div><label>Kategori</label><input id="emKat" class="inp" list="emKatList" value="' + esc(m.kat) + '"><datalist id="emKatList">' + kats.map(k => '<option value="' + esc(k) + '">').join('') + '</datalist></div>' +
    '<div><label>Harga jual (Rp)</label><input id="emHarga" class="inp" inputmode="numeric" value="' + (+m.harga || '') + '"></div>' +
    '<div class="full"><label class="tog"><input id="emAktif" type="checkbox" ' + (m.aktif !== false ? 'checked' : '') + '> Aktif (tampil di layar order)</label></div>' +
    (asli ? '<div class="full muted">Data HPP: ' + esc(asli.nama) + ' · ' + esc(asli.kat) + ' · Rp ' + fmt(asli.harga) + '</div>' : '') +
    '<div class="full err-txt" id="emErr"></div></div></div><div class="mf">' +
    (asli && SET.menu[m.id] ? '<button class="btn line" style="margin-right:auto" onclick="pulihkanMenu(\'' + esc(m.id) + '\')">↺ Kembalikan ke data HPP</button>' : '') +
    (m.asal === 'pos' && id ? '<button class="btn red" style="margin-right:auto" onclick="hapusMenuPos(\'' + esc(m.id) + '\')">Hapus menu tambahan</button>' : '') +
    '<button class="btn ghost" onclick="tutupModal()">Batal</button><button class="btn gold" onclick="simpanMenu(\'' + esc(id) + '\')">✓ Simpan</button></div></div>');
}
function simpanMenu(id) {
  const nama = $('emNama').value.trim(), kat = $('emKat').value.trim(), harga = Math.round(+String($('emHarga').value).replace(/\D/g, '') || 0), aktif = $('emAktif').checked;
  const err = !nama ? 'Nama menu wajib diisi.' : !kat ? 'Kategori wajib diisi.' : harga <= 0 ? 'Harga harus lebih dari 0.' : '';
  if (err) { $('emErr').textContent = err; return; }
  if (id) setMenu(id, { nama, kat, harga, aktif });
  else { SET.menuBaru.push({ id: 'p' + Date.now().toString(36), nama, kat, harga, aktif, jenis: '', kode: '' }); simpanSet(); bangunMenu(); }
  tutupModal(); toast('Menu disimpan di POS.'); render();
}
function pulihkanMenu(id) { delete SET.menu[id]; simpanSet(); bangunMenu(); tutupModal(); render(); }
function hapusMenuPos(id) {
  if (!confirm('Hapus menu tambahan ini dari POS? (Hanya menu yang ditambahkan di POS; data HPP tidak tersentuh.)')) return;
  SET.menuBaru = SET.menuBaru.filter(x => x.id !== id); simpanSet(); bangunMenu(); tutupModal(); render();
}
function adminAktifLain(id) { return SET.users.some(u => u.id !== id && u.role === 'admin' && u.aktif !== false); }
function editUser(id) {
  const u = id ? SET.users.find(x => x.id === id) : { id: '', nama: '', role: 'kasir', pin: '', aktif: true };
  if (!u) return;
  modal('<div class="modal sm"><div class="mh">' + (id ? 'Ubah Pengguna' : 'Tambah Pengguna') + '</div><div class="mb"><div class="frm">' +
    '<div class="full"><label>Nama</label><input id="euNama" class="inp" value="' + esc(u.nama) + '"></div>' +
    '<div><label>Peran</label><select id="euRole"><option value="kasir"' + (u.role !== 'admin' ? ' selected' : '') + '>Kasir</option><option value="admin"' + (u.role === 'admin' ? ' selected' : '') + '>Admin</option></select></div>' +
    '<div><label>PIN (4–6 angka)</label><input id="euPin" class="inp" inputmode="numeric" maxlength="6" value="' + esc(u.pin) + '"></div>' +
    '<div class="full"><label class="tog"><input id="euAktif" type="checkbox" ' + (u.aktif !== false ? 'checked' : '') + '> Aktif (bisa login)</label></div>' +
    '<div class="full err-txt" id="euErr"></div></div></div><div class="mf"><button class="btn ghost" onclick="tutupModal()">Batal</button><button class="btn gold" onclick="simpanUser(\'' + esc(id) + '\')">✓ Simpan</button></div></div>');
}
function simpanUser(id) {
  const nama = $('euNama').value.trim(), role = $('euRole').value, pin = $('euPin').value.trim(), aktif = $('euAktif').checked;
  let err = !nama ? 'Nama wajib diisi.' : !/^\d{4,6}$/.test(pin) ? 'PIN harus 4–6 angka.' : '';
  if (!err && SET.users.some(x => x.id !== id && x.pin === pin)) err = 'PIN ini sudah dipakai pengguna lain.';
  // Admin terakhir tidak boleh hilang — kalau hilang, tidak ada yang bisa
  // membuka Pengaturan lagi dari POS ini.
  if (!err && id && (role !== 'admin' || !aktif) && SET.users.find(x => x.id === id).role === 'admin' && !adminAktifLain(id)) err = 'Harus tetap ada minimal satu Admin aktif.';
  if (err) { $('euErr').textContent = err; return; }
  if (id) Object.assign(SET.users.find(x => x.id === id), { nama, role, pin, aktif });
  else SET.users.push({ id: 'u' + Date.now().toString(36), nama, role, pin, aktif });
  simpanSet();
  if (USER && USER.id === id) { USER.nama = nama; USER.role = role; if (!aktif || role !== 'admin') VIEW = 'order'; }
  tutupModal(); toast('Pengguna disimpan.'); render();
}
function simpanPrinter() {
  const kol = Math.round(+$('prKolom').value || 0);
  SET.printer = { lebar: +$('prLebar').value === 58 ? 58 : 80, salinan: +$('prSalin').value || 1, otomatis: $('prOto').checked, logo: $('prLogo').checked, kaki: $('prKaki').value.trim(),
    mode: $('prMode').value === 'grafis' ? 'grafis' : 'teks', kolom: kol >= 24 && kol <= 64 ? kol : (+$('prLebar').value === 58 ? 32 : 42) };
  simpanSet(true); toast('Setelan printer disimpan.'); render();
}
function simpanPajak() {
  const sc = +String($('stSc').value).replace(',', '.'), pb = +String($('stPb').value).replace(',', '.');
  if (!isFinite(sc) || !isFinite(pb) || sc < 0 || pb < 0 || sc > 50 || pb > 50) { $('stErr').textContent = 'Isi persen 0–50.'; return; }
  SET.sc = sc; SET.pb1 = pb; simpanSet();
  if (CUR && CUR.status === 'draft') { CUR.scPct = sc; CUR.pb1Pct = pb; }
  toast('Persen disimpan.'); render();
}

/* ================= BOOT ================= */
muat();
muatSet();
bangunMenu();
try {
  const u = sessionStorage.getItem('lm_pos_user');
  const x = u && SET.users.find(z => z.id === u && z.aktif !== false);
  if (x) { USER = { id: x.id, nama: x.nama, role: x.role }; CUR = orderBaru(); VIEW = 'order'; }
} catch (e) {}
document.addEventListener('keydown', e => {
  if (VIEW !== 'login' || USER) return;
  if (/^\d$/.test(e.key)) pinTekan(e.key);
  else if (e.key === 'Backspace') pinTekan('B');
  else if (e.key === 'Enter') signIn();
});
setInterval(() => { const j = $('jam'); if (j) j.textContent = jamTeks(); }, 1000);
setInterval(sinkron, 15000);
window.addEventListener('online', sinkron);
window.addEventListener('focus', () => { if (Date.now() - SYNC.terakhir > 5000) sinkron(); });
sinkron();
if (!BASE_MENU.length) document.body.insertAdjacentHTML('afterbegin', '<div class="note" style="margin:10px">Daftar menu (menu-data.js) tidak termuat. Muat ulang halaman.</div>');
render();
</script>
</body>
</html>
