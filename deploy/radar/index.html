      kvRow('PIC',esc(e.pic||''))+
      kvRow('Co-PIC',esc(e.co_pic||''))+'</div>';
    if(e.theme||e.is_ticketed!==undefined) h+='<div class="kv">'+kvRow('Tema',esc(e.theme||''))+kvRow('Tiketing',e.is_ticketed?'Ya':'Tidak')+'</div>';
    /* tanpaTag(): deskripsi acara diketik di editor kaya modul Event, jadi
       isinya "<p>…</p>". esc() TETAP dipakai sesudahnya — yang dibuang cuma
       tag-nya, bukan penjagaannya. */
    var desc=e.description?tanpaTag(e.description):'';
    if(desc) h+='<div style="font-size:13px;color:var(--sand-dim);line-height:1.6;margin:8px 0 14px;padding:12px 14px;background:#fff;border:1px solid var(--line-soft);border-radius:10px;white-space:pre-wrap">'+esc(desc)+'</div>';
    if(tal.length){
      h+='<div class="sec-h" style="margin-top:6px"><h2>Talent terjadwal</h2><span class="rule"></span></div>';
      tal.forEach(function(t){ h+='<div style="display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line-soft)">'+
        '<b style="flex:1;font-size:13px">'+esc(t.nama)+'</b>'+(t.jam?'<span class="muted" style="font-size:11.5px;font-family:var(--mono)">'+esc(t.jam)+'</span>':'')+
        (t.tipe?' '+pill(t.tipe,'p-mute'):'')+'</div>'; });
    }
  }
  h+='<div class="muted no-print" style="font-size:11px;margin-top:14px">Radar hanya menampilkan. Perubahan dilakukan di modul asalnya.</div>';
  h+='</div>';
  return h;
}

/* ---------- HALAMAN: EVENT (agenda gabungan) ----------
   Semua agenda dari Marketing + Event dalam satu daftar, disaring dan dicari.
   Tetap read-only: klik membuka panel detail; mengubah tetap di modul asal. */
/* Tab Event hanya memuat acara yang SUDAH PASTI JALAN — tahapan jualan
   Marketing (Lead / Prospect / Quotation / Negotiation / Lost) dan Draft /
   Cancelled dari modul Event tidak pernah muncul di sini. Papan ini dibaca
   untuk menyiapkan operasional, dan peluang yang belum tentu jadi cuma
   menambah baris yang tidak boleh disiapkan apa-apa. Pipeline penjualannya
   tetap ada di modul Marketing, tempatnya memang di sana. */
/* Terbuka di mode HARIAN pada hari ini. Yang paling sering ditanyakan saat
   membuka tab ini adalah "hari ini ada apa", dan Bulanan tinggal satu klik. */
/* `waktu` HANYA berlaku di mode Bulanan. Sebulan penuh mencampur acara yang
   sudah lewat dengan yang belum, dan yang lewat selalu lebih banyak menjelang
   akhir bulan — papan koordinasi jadi didominasi acara yang tidak perlu
   disiapkan siapa pun lagi. Mode Harian tidak butuh pemisahan ini: satu hari
   seluruhnya lewat atau seluruhnya belum, jadi saklarnya hanya akan
   menghasilkan satu ember kosong. */
/* Terbuka di MINGGUAN (permintaan user 4 Agustus 2026). Koordinasi acara
   dikerjakan per minggu — rapat Senin membahas "minggu ini", bukan hari ini
   dan bukan sebulan penuh. Harian terlalu sempit untuk merencanakan, bulanan
   terlalu ramai untuk dibaca sekali lihat. */
var fAg={view:'grid', sumber:'', status:'', fb:'', q:'', waktu:'akan',
         mode:'minggu', tgl:todayISO(), mgg:seninMinggu(todayISO()), bln:bulanISO()};
/* Acara "sudah lewat" ditentukan TANGGAL, bukan status. Acara kemarin yang
   statusnya masih Upcoming (lupa ditutup) tetap acara yang sudah lewat, dan
   membiarkannya di daftar akan datang membuat kru menyiapkan sesuatu yang
   sudah usai. Statusnya sendiri tetap dipajang apa adanya — justru supaya yang
   lupa ditutup itu kelihatan. */
function agSudahLewat(a){ return dDay(a.tgl) < 0; }
function agSelesai(a){ return /done|finish/i.test(String((a&&a.status)||'')); }
/* Daftar sebelum dipisah akan-datang / sudah-lewat. Dipakai juga untuk
   menghitung isi kedua ember, supaya angka di tombolnya tidak mungkin berbeda
   dari isi daftarnya. */
function agendaTersaringDasar(){
  var list=agendaTampil().filter(function(a){return dalamPeriode(a.tgl,fAg);});
  if(fAg.sumber) list=list.filter(function(a){return a.sumber===fAg.sumber;});
  if(fAg.status) list=list.filter(function(a){return String(a.status||'')===fAg.status;});
  list=list.filter(function(a){return cocokFb(a,fAg.fb);});
  if(fAg.q){var q=fAg.q.toLowerCase();
    list=list.filter(function(a){return (a.judul+' '+(a.tempat||'')+' '+(a.jenis||'')).toLowerCase().indexOf(q)>-1;});}
  return list;
}
function agendaTersaring(){
  var list=agendaTersaringDasar();
  /* Mode HARIAN tidak dipisah: satu hari seluruhnya lewat atau seluruhnya
     belum, jadi saklarnya cuma akan menghasilkan satu ember kosong. Mingguan
     IKUT dipisah sejak mingguan jadi tampilan bawaan — kalau tidak, layar
     pertama yang dilihat orang kembali penuh acara yang sudah selesai, persis
     keadaan yang pemisahan ini dibuat untuk memperbaiki. */
  if(fAg.mode==='hari') return list;
  return list.filter(function(a){ return fAg.waktu==='lewat' ? agSudahLewat(a) : !agSudahLewat(a); });
}
/* Saklar Akan Datang / Sudah Lewat, lengkap dengan jumlah isinya masing-masing
   supaya tidak ada yang perlu berpindah dulu untuk tahu ada isinya atau tidak.
   Jumlah yang SELESAI ikut ditulis di ember "sudah lewat" — itu pertanyaan
   yang selalu menyusul begitu daftarnya dibuka. */
function swWaktuAgenda(akan,lewat){
  var selesai=lewat.filter(agSelesai).length;
  return '<div class="vsw no-print">'+
    '<button class="'+(fAg.waktu==='lewat'?'':'on')+'" onclick="APP.fAg(\'waktu\',\'akan\')">Akan Datang ('+akan.length+')</button>'+
    '<button class="'+(fAg.waktu==='lewat'?'on':'')+'" onclick="APP.fAg(\'waktu\',\'lewat\')">Sudah Lewat ('+lewat.length+
      (selesai?' · '+selesai+' selesai':'')+')</button></div>';
}
/* Saklar grid/tabel. Dua tampilan untuk daftar yang SAMA — grid untuk melihat
   sedikit acara dengan konteksnya (kesiapan divisi, jam, tempat), tabel untuk
   membandingkan banyak acara pada kolom yang sejajar, terutama pax. */
function swView(fn,aktif){
  return '<div class="vsw no-print">'+
    '<button class="'+(aktif==='grid'?'on':'')+'" onclick="APP.'+fn+'(\'view\',\'grid\')">'+ico('grid')+'Grid</button>'+
    '<button class="'+(aktif==='tabel'?'on':'')+'" onclick="APP.'+fn+'(\'view\',\'tabel\')">'+ico('list')+'Tabel</button></div>';
}
function tabelAgenda(list){
  var total=list.length;
  var h='<div class="tw"><table><thead><tr><th>Tanggal</th><th>Jam</th><th>Acara</th><th>Sumber</th>'+
        '<th>Tempat</th><th>Format F&amp;B</th><th>Jenis</th><th style="text-align:right">Pax</th><th>Status</th></tr></thead><tbody>';
  pgIris('agenda',list).forEach(function(a){
    var d=dDay(a.tgl);
    h+='<tr class="clk" onclick="APP.detail(\'ag\',\''+a.sumber+'\',\''+esc(a.id)+'\')">'+
      '<td style="white-space:nowrap">'+fTglP(a.tgl)+'<div style="font-size:10px;color:var(--muted)">'+esc(dLabel(d))+'</div></td>'+
      '<td class="num" style="font-family:var(--mono);font-size:12px">'+esc(a.jam||'—')+'</td>'+
      '<td><b>'+esc(a.judul)+'</b></td>'+
      '<td>'+badgeSumber(a.sumber)+'</td>'+
      '<td>'+esc(a.tempat||'—')+'</td>'+
      '<td>'+(a.fb?pill(a.fb,'p-teal'):'<span class="muted">—</span>')+'</td>'+
      '<td>'+esc(a.jenis||'—')+'</td>'+
      '<td class="num" style="text-align:right"><b>'+(+a.pax||0)+'</b></td>'+
      '<td>'+(a.status?pill(a.status,/done|finish/i.test(a.status)?'p-teal':'p-go'):'—')+'</td></tr>';
  });
  return h+'</tbody></table></div>'+pager('agenda',total,'acara');
}
function vAgendaList(){
  var h=pitaGagal();
  var dasar=agendaTersaringDasar();
  var bulanan=(fAg.mode!=='hari');   // mingguan & bulanan sama-sama dipisah akan/lewat
  var akan  = bulanan ? dasar.filter(function(a){return !agSudahLewat(a);}) : dasar;
  var lewat = bulanan ? dasar.filter(agSudahLewat) : [];
  var list=agendaTersaring();
  var paxMkt=list.filter(function(a){return a.sumber==='mkt';}).reduce(function(s,a){return s+(+a.pax||0);},0);
  var paxEvt=list.filter(function(a){return a.sumber==='evt';}).reduce(function(s,a){return s+(+a.pax||0);},0);
  /* Pax VIP DIHITUNG tapi SENGAJA TIDAK dijumlahkan ke Total pax, dan itu
     dikatakan di kartunya. Reservasi VIP mengunci meja di database Reservasi
     juga, jadi tamunya bisa terhitung dua kali — sekali di sini, sekali
     lewat baris reservasi. Angka yang mungkin berganda lebih buruk daripada
     angka yang jelas-jelas dipisah: yang pertama tidak akan dipertanyakan
     siapa pun. */
  var paxVip=list.filter(function(a){return a.sumber==='vip';}).reduce(function(s,a){return s+(+a.pax||0);},0);
  h+='<div class="card no-print" style="margin-bottom:14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:13px 18px">'+
     '<span class="eyebrow">Periode</span>'+kendaliPeriode('fAg',fAg)+
     '<div style="flex:1"></div>'+
     '<span class="muted" style="font-size:12px">'+esc(labelPeriode(fAg))+'</span></div>';
  h+='<div class="grid g4" style="margin-bottom:15px">'+
    stat('Acara tampil', list.length, labelPeriode(fAg)+(bulanan?(fAg.waktu==='lewat'?' · sudah lewat':' · akan datang'):''),'')+
    stat('Pax Marketing', paxMkt, list.filter(function(a){return a.sumber==='mkt';}).length+' event klien','')+
    stat('Pax Event', paxEvt, list.filter(function(a){return a.sumber==='evt';}).length+' acara modul Event','tl')+
    stat('Reservasi VIP', list.filter(function(a){return a.sumber==='vip';}).length,
         paxVip+' pax (perkiraan atas) · tidak ikut Total','se')+
    stat('Total pax', paxMkt+paxEvt, 'Marketing + Event','se')+
  '</div>';
  h+='<div class="filters">'+
    '<input class="finp" placeholder="Cari nama, tempat, jenis…" value="'+esc(fAg.q)+'" oninput="APP.fAg(\'q\',this.value)" style="min-width:210px">'+
    '<select class="finp" onchange="APP.fAg(\'sumber\',this.value)"><option value="">Semua sumber</option>'+
      '<option value="mkt"'+(fAg.sumber==='mkt'?' selected':'')+'>Marketing</option>'+
      '<option value="evt"'+(fAg.sumber==='evt'?' selected':'')+'>Event</option>'+
      '<option value="vip"'+(fAg.sumber==='vip'?' selected':'')+'>Reservasi VIP</option></select>'+
    '<select class="finp" onchange="APP.fAg(\'status\',this.value)"><option value="">Semua status</option>'+
      statusPasti().map(function(s){return '<option'+(fAg.status===s?' selected':'')+'>'+esc(s)+'</option>';}).join('')+'</select>'+
    selFb('fAg',fAg.fb)+
    '<div style="flex:1"></div>'+(bulanan?swWaktuAgenda(akan,lewat):'')+swView('fAg',fAg.view)+
  '</div>';
  h+='<div class="muted no-print" style="font-size:11.5px;margin:-6px 0 13px;line-height:1.6">'+
     (bulanan?'Terbuka di <b>Akan Datang</b>. Acara yang tanggalnya sudah lewat pindah ke <b>Sudah Lewat</b> — tetap bisa dibuka, lengkap dengan mana yang berstatus selesai. ':'')+
     'Hanya acara yang sudah pasti jalan — <b>Marketing:</b> Deal &amp; Event Done · <b>Event:</b> Upcoming, Today &amp; Finished · '+
     '<b>Reservasi VIP:</b> semua yang belum dibatalkan. '+
     'Tahapan jualan (Lead, Prospect, Quotation, Negotiation, Lost) dan Draft/Cancelled tidak ditampilkan di sini.</div>';
  /* Ember yang kosong sementara ember satunya berisi diberi jalan keluar yang
     bisa diklik. Tanpa itu, membuka bulan yang sudah lewat menghasilkan
     "tidak ada acara" — padahal acaranya ada semua, cuma di ember sebelah. */
  if(!list.length && bulanan){
    var lain=(fAg.waktu==='lewat')?akan:lewat;
    if(lain.length) return h+'<div class="card"><div class="empty"><b>'+
      (fAg.waktu==='lewat'?'Tidak ada acara yang sudah lewat':'Tidak ada acara yang akan datang')+'</b>'+
      'Di '+esc(labelPeriode(fAg))+' ada <b>'+lain.length+'</b> acara di '+
      (fAg.waktu==='lewat'?'Akan Datang':'Sudah Lewat')+'.'+
      '<div style="margin-top:12px"><button class="btn sm" onclick="APP.fAg(\'waktu\',\''+(fAg.waktu==='lewat'?'akan':'lewat')+'\')">'+
      'Lihat '+(fAg.waktu==='lewat'?'yang akan datang':'yang sudah lewat')+'</button></div></div></div>';
  }
  if(!list.length) return h+kosong('Tidak ada acara yang cocok','Ubah periode, filter, atau kata kuncinya.');
  if(fAg.view==='tabel') return h+tabelAgenda(list);
  h+='<div class="grid g2" style="gap:12px">';
  pgIris('agenda',list).forEach(function(a){ h+=agendaCard(a); });
  return h+'</div>'+pager('agenda',list.length,'acara');
}

/* ---------- HALAMAN: RESERVASI ----------
   Dibangun dengan konsep yang sama dengan tab Event: saklar grid/tabel,
   kendali periode Harian|Bulanan bergaya Kompas, dan hanya booking yang HIDUP.

   Mode Harian di sini menggantikan "lembar harian" lama yang dipicu pemilih
   tanggal terpisah: satu pemilih waktu saja di layar ini, dan kalau modenya
   Harian maka halaman ini memang lembar tengok hari itu.

   "Hidup" = bukan Cancelled dan bukan No-show. Keduanya tidak akan datang,
   jadi membiarkannya di daftar operasional membuat jumlah booking dan pax
   terbaca lebih besar dari kenyataan — persis kesalahan yang dulu bikin floor
   menyiapkan meja untuk tamu yang sudah membatalkan. Jejaknya tidak hilang:
   pilih statusnya di penyaring untuk memunculkannya kembali. */
/* Sama seperti tab Event: terbuka di mode MINGGUAN (4 Agustus 2026). Sebelumnya
   Harian, supaya lembar tengok hari ini langsung siap begitu tab dibuka. Yang
   dibutuhkan ternyata lebih sering gambaran seminggu — berapa booking Jumat dan
   Sabtu sudah masuk, mana malam yang masih kosong. Lembar harian tidak hilang:
   tekan Harian, dan tanggalnya masih tanggal yang tadi dilihat. */
var fRs={view:'tabel', status:'', kategori:'', q:'',
         mode:'minggu', tgl:todayISO(), mgg:seninMinggu(todayISO()), bln:bulanISO()};
function resHidup(r){ return !resBatal(r) && !resNoShow(r); }
function resTersaring(){
  var list=(D.rsv&&D.rsv.reservations||[]).filter(function(r){return r&&r.date;});
  /* Penyaring status yang dipilih EKSPLISIT menang atas aturan "hanya yang
     hidup" — kalau tidak, memilih "Cancelled" menghasilkan daftar kosong tanpa
     sebab yang terlihat. */
  if(fRs.status) list=list.filter(function(r){return String(r.status||'')===fRs.status;});
  else list=list.filter(resHidup);
  list=list.filter(function(r){return dalamPeriode(r.date,fRs);});
  if(fRs.kategori) list=list.filter(function(r){return String(r.category||'')===fRs.kategori;});
  if(fRs.q){var q=fRs.q.toLowerCase();
    list=list.filter(function(r){return ((r.name||'')+' '+(r.phone||'')+' '+(r.table||'')).toLowerCase().indexOf(q)>-1;});}
  list.sort(function(a,b){return a.date===b.date?(String(a.time||'')<String(b.time||'')?-1:1):(a.date<b.date?-1:1);});
  return list;
}
/* Kartu reservasi — padanan agendaCard() untuk tampilan grid. Yang ditonjolkan
   pax, karena itu yang dipakai floor menghitung meja. */
function resCard(r){
  var st=String(r.status||'—');
  var c=/datang|seat|duduk/i.test(st)?'p-go':(resBatal(r)||resNoShow(r)?'p-bad':'p-warn');
  var dp=(+r.dpAmount||0);
  return '<button type="button" class="rc" onclick="APP.detail(\'rs\',\''+esc(r.id)+'\')">'+
    '<span class="rc-h"><span class="rc-t">'+esc(r.time||'--:--')+'</span>'+
      '<span class="rc-n">'+esc(r.name||'—')+'</span>'+
      '<span class="rc-p">'+(+r.pax||0)+'<span style="font-size:10px;font-weight:600;color:var(--muted)"> pax</span></span></span>'+
    '<span class="rc-m">'+
      '<span>'+ico('cal')+fTglP(r.date)+'</span>'+
      (r.table?'<span>'+ico('pin')+esc(r.table)+'</span>':'')+
      (r.category?'<span>'+esc(r.category)+'</span>':'')+'</span>'+
    '<span class="pill-row">'+pill(st,c)+
      (r.vip?pill('VIP','p-vip'):'')+
      (radarBolehUang()?(dp?pill(rp(dp),'p-go'):(/lunas/i.test(String(r.dpStatus||''))?pill('Lunas','p-go'):pill('DP belum','p-mute'))):'')+'</span>'+
    (r.notes?'<span style="display:block;font-size:11px;color:var(--muted);margin-top:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(r.notes)+'</span>':'')+
    '</button>';
}
function vResList(){
  var all=(D.rsv&&D.rsv.reservations||[]);
  var stSet={}, katSet={};
  all.forEach(function(r){ if(r.status)stSet[r.status]=1; if(r.category)katSet[r.category]=1; });
  var list=resTersaring();
  /* '' saat mode Bulanan. Semua bagian "lembar harian" di bawah bergantung
     pada nilai ini, jadi satu tempat saja yang memutuskan. */
  var hari=fRs.mode==='hari'?fRs.tgl:'';
  var h=pitaGagal();
  h+='<div class="card no-print" style="margin-bottom:14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:13px 18px">'+
     '<span class="eyebrow">Periode</span>'+kendaliPeriode('fRs',fRs)+
     '<div style="flex:1"></div>'+
     '<span class="muted" style="font-size:12px">'+esc(labelPeriode(fRs))+'</span></div>';
  /* LEMBAR HARIAN — briefing harian dilebur ke sini, menu "Briefing" terpisah
     dihapus. Begitu modenya Harian, halaman ini berubah jadi lembar tengok
     harian: siapa saja tamunya, permintaan khususnya, siap dikirim WA atau
     dicetak. Di mode Bulanan ia tetap daftar penuh seperti biasa. */
  if(hari){
    var ags=agendaTgl(hari);
    h+='<div class="card no-print" style="margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 18px">'+
      '<b style="font-size:13.5px">Lembar harian</b><span class="muted" style="font-size:12.5px">'+fTgl(hari)+'</span>'+
      '<div style="flex:1"></div>'+
      '<button class="btn sm" onclick="APP.waResHarian(\''+esc(hari)+'\')">'+ico('wa')+'Kirim ke WhatsApp</button>'+
      '<button class="btn pri sm" onclick="window.print()">'+ico('print')+'Cetak</button></div>';
    h+='<div class="card gold" style="margin-bottom:14px">'+
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap">'+
      '<div><div class="eyebrow">Laksamana Muda Coffee &amp; Live Space</div>'+
      '<h2 style="font-size:20px;margin:5px 0 3px">Reservasi Harian</h2>'+
      '<div class="muted" style="font-size:12.5px">'+fTgl(hari)+'</div></div>'+
      '<div style="text-align:right;font-size:11.5px;color:var(--muted)">Dicetak '+nowStamp()+'<br>oleh '+esc((sesi()||{}).name||'—')+'</div></div>'+
      /* Agenda hari itu disebut satu baris sebagai KONTEKS — tim floor perlu
         tahu ada acara besar malam itu. Bukan digabung ke hitungan tamu. */
      (ags.length?'<div class="muted" style="font-size:12px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line-soft)">Agenda hari ini: '+
        ags.map(function(a){return esc(a.judul)+(a.jam?' ('+esc(a.jam)+')':'');}).join(' · ')+'</div>':'')+
      '</div>';
  }
  var blmKonf=list.filter(function(r){return /pending|menunggu/i.test(String(r.status||''));}).length;
  h+='<div class="grid g4" style="margin-bottom:15px">'+
    stat(hari?'Booking hari itu':'Reservasi tampil', list.length, labelPeriode(fRs),'')+
    stat('Total pax', paxRes(list), 'tanpa yang batal & no-show','se')+
    (hari
      ? stat('Meja terpakai', list.filter(function(r){return r.table;}).length, 'dari booking hari itu','tl')
      : stat('Belum konfirmasi', blmKonf, 'perlu tindak lanjut', blmKonf?'rd':''))+
    stat('VIP / Korporat', list.filter(function(r){return r.vip||/vip|korporat/i.test(String(r.category||''));}).length, 'butuh perhatian khusus','tl')+
  '</div>';
  h+='<div class="filters no-print">'+
    '<input class="finp" placeholder="Cari nama, nomor, meja…" value="'+esc(fRs.q)+'" oninput="APP.fRs(\'q\',this.value)" style="min-width:200px">'+
    '<select class="finp" onchange="APP.fRs(\'status\',this.value)"><option value="">Hanya yang hidup</option>'+
      Object.keys(stSet).sort().map(function(s){return '<option'+(fRs.status===s?' selected':'')+'>'+esc(s)+'</option>';}).join('')+'</select>'+
    '<select class="finp" onchange="APP.fRs(\'kategori\',this.value)"><option value="">Semua kategori</option>'+
      Object.keys(katSet).sort().map(function(s){return '<option'+(fRs.kategori===s?' selected':'')+'>'+esc(s)+'</option>';}).join('')+'</select>'+

function humanKey(k){ return String(k||'').replace(/^m_/,'').replace(/([a-z0-9])([A-Z])/g,'$1 $2').replace(/[_-]+/g,' ').replace(/\s+/g,' ').trim().replace(/^./,function(c){return c.toUpperCase();}); }

/* Rangkum tabel menu ({grup:{rows,jam,qty}} + _teks) jadi teks ringkas. */
function fmtMenuLike(o){
  var out=[];
  if(o._teks && String(o._teks).trim()) out.push(String(o._teks).trim());
  Object.keys(o).forEach(function(g){
    if(g==='_teks') return;
    var gd=o[g]||{}, rows=Array.isArray(gd.rows)?gd.rows:[];
    if(!rows.length && !gd.jam && !gd.qty) return;
    var kepala=(g==='__grup__'?'':g)+(gd.jam?' — '+gd.jam:'')+(gd.qty?' · '+gd.qty:'');
    if(kepala.trim()) out.push(kepala.trim());
    rows.forEach(function(r){
      var isi=(r.menu||'')+(r.qty?' ('+r.qty+')':'')+(r.jam&&r.jam!==gd.jam?' — '+r.jam:'');
      var kat=r.kat||r.catatan||'';
      if(isi.trim()) out.push('  '+(kat?kat+': ':'')+isi.trim());
    });

}
/* Format satu nilai apa pun MENURUT BENTUKNYA — bukan menurut tipe skema, supaya
   tahan kalau Marketing mengubah bentuk field. */
/* BUANG TAG HTML DARI TEKS (21 Agustus 2026).
   Deskripsi acara datang dari editor kaya di modul Event, jadi isinya
   "<p>Satu malam spesial…</p>". Radar menggambarnya lewat esc() — yang memang
   benar, supaya isian tidak bisa menyuntikkan markup — tapi akibatnya TAG-nya
   ikut terbaca sebagai tulisan di tengah kalimat.

   Yang dibuang cuma tag & entitasnya; isinya tetap utuh. Perhentian baris
   dipertahankan sebagai "\n" karena tabel detail memakai white-space:pre-wrap,
   jadi paragraf tetap terpisah tanpa satu pun tag. */
function tanpaTag(s){
  return String(s==null?'':s)
    .replace(/<br\s*\/?>/gi,'\n')
    .replace(/<\/(p|div|li|h[1-6]|tr)>/gi,'\n')
    .replace(/<li[^>]*>/gi,'• ')
    .replace(/<[^>]+>/g,'')
    .replace(/&nbsp;/gi,' ')
    .replace(/&lt;/gi,'<').replace(/&gt;/gi,'>')
    .replace(/&quot;/gi,'"').replace(/&#0?39;/gi,"'")
    /* &amp; TERAKHIR. Kalau lebih dulu, "&amp;lt;" berubah jadi "&lt;" lalu
       jadi "<" — teks yang memang ingin menulis "&lt;" jadi hilang. */
    .replace(/&amp;/gi,'&')
    .replace(/[ \t]+\n/g,'\n')
    .replace(/\n{3,}/g,'\n\n')
    .trim();
}
/* ---------- LAMPIRAN BERKAS (21 Agustus 2026) ----------
   Bentuk tersimpannya {key,name,size,at,by}. `key` adalah kunci di penyimpanan
   modul MARKETING, dan berkasnya disajikan endpoint yang sama yang dipakai
   Marketing sendiri (api.php?action=receipt). Radar boleh membacanya: folder
   tetangga, origin yang sama, dan permintaannya cuma membaca.

   Jalurnya diturunkan dari SUMBER — bukan ditulis ulang sebagai string kedua.
   Alamat backend Marketing sudah tercatat sekali di sana, dan dua salinan
   berarti yang satu akan tertinggal saat foldernya berganti nama; gejalanya
   seluruh lampiran jadi gambar patah tanpa satu pun galat yang menyebut
   sebabnya. */
function lampiranUrl(key){
  var mkt=SUMBER.filter(function(s){return s.id==='mkt';})[0];
  var basis=(mkt&&mkt.url)||'../marketing-api-mysql/api.php';
  return basis+'?action=receipt&key='+encodeURIComponent(String(key==null?'':key));
}
function adalahLampiran(v){
  return Array.isArray(v) && v.length && v[0] && typeof v[0]==='object'
         && ('key' in v[0]) && ('name' in v[0]);
}
/* Gambar digambar sebagai GAMBAR, berkas lain jadi tautan. Pembedanya
   ekstensi nama, bukan tipe MIME: yang tersimpan memang cuma namanya, dan
   menebak dari `key` (yang berakhiran .png untuk semua jenis) akan membuat
   PDF ikut dipasang sebagai <img> yang selalu patah. */
function fmtLampiranHTML(v){
  var isi=v.map(function(f){
    var nama=String((f&&f.name)||'berkas');
    var url=lampiranUrl(f&&f.key);
    if(/\.(png|jpe?g|gif|webp|bmp|avif)$/i.test(nama)){
      return '<figure style="margin:0">'+
        '<a href="'+esc(url)+'" target="_blank" rel="noopener">'+
        '<img src="'+esc(url)+'" alt="'+esc(nama)+'" loading="lazy" onerror="APP.lampiranGagal(this)" '+
        'style="width:100%;display:block;border-radius:9px;border:1px solid var(--line-soft);background:#fff"></a>'+
        '<figcaption class="muted" style="font-size:10.5px;margin-top:4px;word-break:break-word">'+esc(nama)+'</figcaption>'+
      '</figure>';
    }
    return '<a href="'+esc(url)+'" target="_blank" rel="noopener" '+
      'style="display:block;padding:9px 11px;border:1px solid var(--line-soft);border-radius:9px;'+
      'font-size:12px;word-break:break-word">'+esc(nama)+'</a>';
  });
  return '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px">'+
         isi.join('')+'</div>';
}
function fmtDetVal(v){
  if(v==null) return '';
  if(typeof v==='boolean') return v?'Ya':'Tidak';
  if(typeof v==='number') return String(v);
  if(typeof v==='string') return tanpaTag(v);
  if(Array.isArray(v)){
    if(!v.length) return '';
    if(typeof v[0]==='object' && v[0]){
      /* LAMPIRAN BERKAS — TIDAK dibuang, digambar sebagai gambarnya
         (21 Agustus 2026). Sempat dijatuhkan begitu saja karena bentuknya
         {key,name,size,at,by} jatuh ke JSON.stringify di ekor fungsi ini dan
         tercetak mentah di tabel; tapi membuangnya berarti layout & voucher
         yang justru dipakai menyiapkan acara ikut hilang dari papan ini.

         Yang dipulangkan di sini tetap TEKS (nama berkasnya) — fungsi ini
         dipakai juga oleh pemanggil yang meng-esc() hasilnya. Gambarnya
         dirakit terpisah oleh fmtLampiranHTML() lewat detailFields(), yang
         memulangkan HTML siap pakai sebagai unsur ketiga. */
      if(adalahLampiran(v)) return v.map(function(f){return String(f&&f.name||'berkas');}).join(', ');
      /* RINCIAN TAGIHAN — dibuang. Bentuknya {desc,jumlah,harga,jenis}, dan
         nasibnya sama: JSON mentah di layar. Lagi pula Radar papan koordinasi,
         bukan papan finance (lihat catatan di bagian angka) — rincian biaya
         per item memang bukan isinya. */
      if('desc' in v[0] && ('harga' in v[0] || 'jumlah' in v[0])) return '';
      if('kegiatan' in v[0] || 'mulai' in v[0]) return v.map(function(r){var j=[r.mulai,r.selesai].filter(Boolean).join('–');return (j?j+' — ':'')+tanpaTag(r.kegiatan||'');}).filter(function(x){return x.trim();}).join('\n');
      if('barang' in v[0]) return v.map(function(r){return tanpaTag(r.barang||'')+([r.tgl,r.jam].filter(Boolean).length?' — '+[r.tgl,r.jam].filter(Boolean).join(' '):'');}).filter(function(x){return x.trim();}).join('\n');
      if('nama' in v[0]) return v.map(function(r){return tanpaTag(r.nama||'')+((radarBolehUang()&&r.nominal!=null&&r.nominal!=='')?' — '+rp(r.nominal):'');}).join('\n');
      /* Ekor: yang berbentuk teks tetap digambar, OBJEK YANG TIDAK DIKENAL
         DIJATUHKAN. Dulu di sini JSON.stringify — dan itulah sumber semua
         baris JSON mentah di layar: bentuk data baru mana pun di modul asal
         langsung muncul apa adanya di papan ini, tanpa ada yang mengubah
         Radar. Baris yang hilang jauh lebih baik daripada baris berisi JSON:
         yang hilang bisa ditanyakan, yang JSON cuma bikin orang berhenti
         percaya halamannya. */
      return v.map(function(x){return typeof x==='string'?tanpaTag(x):'';})
              .filter(function(x){return x!=='';}).join(', ');
    }
    return v.map(function(x){return tanpaTag(x);}).filter(function(x){return x!=='';}).join(', ');
  }
  if(typeof v==='object'){
    if(('rows' in v) || ('_teks' in v)) return fmtMenuLike(v);
    // ynnote / yn / tog: {v:bool, note?}
    if('v' in v){ var s=v.v===true?'Ya':(v.v===false?'Tidak':''); if(v.note) s+=(s?' — ':'')+v.note; return s; }
    // objek grup menu tanpa penanda 'rows' di level atas
    return fmtMenuLike(v);
  }
  return '';
}
/* Daftar [label, teks] untuk SEMUA field terisi milik satu event Marketing,
   urut sesuai skema (MKT_LABEL), field tak dikenal menyusul di ekor. */
/* Barisnya [label, teks, html?]. Unsur ketiga hanya ada untuk lampiran
   berkas — itulah satu-satunya isian yang perlu digambar, bukan ditulis.
   Pemanggil memakai row[2] kalau ada dan meng-esc(row[1]) kalau tidak, jadi
   penjagaan terhadap markup di isian teks tidak ikut longgar. */
function detailFields(ev){
  var d=(ev&&ev.detail)||{}, out=[], lihat={};
  var uang=radarBolehUang();
  var baris=function(k){
    if(!uang && radarKunciUang(k)) return;   // non-Head: nominal harga/DP/pelunasan tidak digambar
    var v=d[k];
    var t=fmtDetVal(v); if(t==='') return;
    out.push(adalahLampiran(v) ? [detLabel(k), t, fmtLampiranHTML(v)] : [detLabel(k), t]);
  };
  Object.keys(MKT_LABEL).forEach(function(k){
    if(DET_SKIP[k]) return; lihat[k]=1;
    if(!(k in d)) return;
    baris(k);
  });
  Object.keys(d).forEach(function(k){
    if(lihat[k]||DET_SKIP[k]||k.charAt(0)==='_') return;
    baris(k);
  });
  return out;
}

/* Isian yang DISOROT saat kartu event ditekan (permintaan user 5 Agustus 2026).

var SOROT_MKT=[

function sorotanEvent(ev){
  var d=(ev&&ev.detail)||{}, blok=[];
  SOROT_MKT.forEach(function(p){
    if(!(p[0] in d)) return;
    var t=fmtDetVal(d[p[0]]);
    if(!t || !String(t).trim()) return;
    blok.push('<div class="sorot"><div class="sorot-h">'+p[1]+'</div>'+
              '<div class="sorot-b">'+esc(t)+'</div></div>');
  });
  if(!blok.length) return '';
  return '<div class="sec-h" style="margin-top:0"><h2>Yang perlu disiapkan</h2><span class="rule"></span></div>'+
         '<div class="sorot-wrap">'+blok.join('')+'</div>';
}

/* Tab KOORDINASI dibuang 21 Agustus 2026 (permintaan tim) bersama kartu
   "Fokus koordinasi berikutnya" di halaman Radar. Isinya matriks kesiapan
   lintas divisi, "divisi yang belum bergerak", dan beban per PIC — semuanya
   turunan progres job yang dikerjakan di modul Marketing (Task Divisi), dan
   papan yang cuma memantulkannya balik tidak pernah jadi tempat siapa pun
   bertindak. Kesiapan per divisi TETAP ADA di panel detail event, tempat ia
   memang dibaca saat menyiapkan satu acara.

   Alamat lama '#koordinasi' otomatis jatuh ke Radar lewat penjaga di go(). */
/* ---------- PROMO (baca dari modul BD OS) ----------
   Radar hanya MEMBACA, seperti seluruh isi modul ini. Yang mendaftarkan dan
   menyunting promo adalah BD OS → Promotion; di sini isinya cuma ditampilkan
   supaya seluruh kru tahu promo apa yang sedang dan akan berjalan tanpa perlu
   diberi akses ke modul BD.

   Yang ditampilkan SENGAJA hanya "Berlangsung" dan "Akan Datang". Promo yang
   sudah berakhir maupun yang sedang dijeda tidak berlaku hari ini, dan
   menampilkannya di papan yang dibaca sekilas oleh kru lantai akan membuat
   tamu dijanjikan promo yang tidak bisa ditebus. Jumlahnya tetap disebut di
   kaki daftar supaya daftar yang pendek tidak terbaca sebagai data yang hilang.

   Status DIHITUNG di sini dari tanggal, tidak dibaca dari field tersimpan —
   sama seperti di BD. Status yang tersimpan akan basi tiap tengah malam, dan
   tidak ada penjadwal di hosting ini yang bisa diandalkan memperbaruinya.

   Peta label di bawah HARUS sepadan dengan PROMO_TIPE di deploy/bd/index.html.
   Kalau ada tipe baru di sana yang belum ada di sini, barisnya TETAP tampil
   dengan kunci mentahnya — bukan hilang. Promo yang lenyap dari papan tanpa
   satu pun pesan adalah kegagalan yang tidak terlihat dari layar, dan itu
   kelas bug yang paling mahal di repo ini. */
var PROMO_TIPE={
  partner_kartu:  {l:'Kartu / Komunitas',    i:'💳'},
  partner_sekolah:{l:'Sekolah / Organisasi', i:'🎓'},
  tiktok:         {l:'TikTok / Voucher',     i:'🎵'},
  in_house:       {l:'Promo Laksamana',      i:'🍽️'},
  happy_hour:     {l:'Happy Hour',           i:'🕒'},
  event:          {l:'Event / Musiman',      i:'🎉'}
};
function promoTipe(k){ return PROMO_TIPE[k]||{l:String(k||'Lainnya'),i:'🏷️'}; }
/* Kategori & hari berlaku — bentuk baru sejak 26 Agustus 2026. Sama seperti
   PROMO_TIPE di atas: petanya disalin dari BD, dan nilai yang tidak dikenal
   TETAP tampil apa adanya alih-alih hilang. */
var PROMO_KAT={diskon:{l:'Diskon',i:'🏷️'},free_item:{l:'Free Item',i:'🎁'}};
function promoKat(k){ return k?(PROMO_KAT[k]||{l:String(k),i:'🏷️'}):null; }
var PROMO_HARI=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
/* `hari` sekarang array indeks 0–6; versi pertama menyimpannya sebagai teks
   bebas ("Senin-Jumat"). Yang berbentuk teks tetap digambar apa adanya —
   promo lama tidak boleh kehilangan keterangannya cuma karena bentuknya
   berubah. */
function promoHariTeks(h){
  if(Array.isArray(h)){
    var a=h.map(Number).filter(function(n){return n>=0&&n<=6;});
    if(!a.length) return 'Setiap hari';
    if(a.length===7) return 'Setiap hari';
    return a.slice().sort(function(x,y){return x-y;}).map(function(i){return PROMO_HARI[i];}).join(', ');
  }
  return String(h||'')||'Setiap hari';
}
function promoHari(){ var d=new Date(); d.setHours(0,0,0,0); return d; }
function promoTgl(s){ if(!s) return null; var d=new Date(s+'T00:00:00'); return isNaN(d)?null:d; }
function promoStatus(p){
  if(p.paused) return 'paused';
  var t=promoHari(), a=promoTgl(p.mulai), b=promoTgl(p.selesai);
  if(a && t<a) return 'upcoming';
  if(b && t>b) return 'ended';
  return 'running';
}
function promoSisa(p){
  var t=promoHari(), a=promoTgl(p.mulai), b=promoTgl(p.selesai), st=promoStatus(p), H=86400000;
  if(st==='upcoming'){ var n=Math.ceil((a-t)/H); return n<=1?'Mulai besok':'Mulai dalam '+n+' hari'; }
  if(st==='running'&&b){ var m=Math.ceil((b-t)/H); return m<=0?'Berakhir hari ini':'Sisa '+m+' hari'; }
  return '';
}
function promoTglPendek(s){
  var d=promoTgl(s); if(!d) return '—';
  return d.getDate()+' '+BULAN[d.getMonth()].slice(0,3);
}
function promoSemua(){
  var v=D.bd&&D.bd.promos;
  return Array.isArray(v)?v:[];
}
var fPromo={q:'',tipe:''};

  var h=pitaGagal();
  var semua=promoSemua();
  var aktif=semua.filter(function(p){var s=promoStatus(p);return s==='running'||s==='upcoming';});
  var arsip=semua.length-aktif.length;

  var list=aktif.slice();
  if(fPromo.tipe) list=list.filter(function(p){return (p.tipe||'')===fPromo.tipe;});

    return [p.nama,p.benefit,p.partner,p.kode,p.ketentuan,p.outlet].join(' ').toLowerCase().indexOf(q)>-1;

     dengan daftar di BD — dua papan yang menampilkan data sama dengan urutan

  list.sort(function(a,b){
    var sa=promoStatus(a)==='running'?0:1, sb=promoStatus(b)==='running'?0:1;
    if(sa!==sb) return sa-sb;

      }).join('')+'</select>'+
  '</div>';

  if(!list.length){
    h+='<div class="card"><div class="empty">'+
      (semua.length
        ? (aktif.length ? '<b>Tidak ada promo yang cocok</b>Ubah kata pencarian atau penyaring tipenya.'
                        : '<b>Tidak ada promo yang berlaku saat ini</b>Semua promo yang terdaftar sudah berakhir atau sedang dijeda.')
        : '<b>Belum ada promo terdaftar</b>Promo didaftarkan tim BD di modul BD OS → Promotion, dan langsung muncul di sini.')+
      '</div></div>';
  } else {
    h+='<div class="grid g3">'+list.map(function(p){
      var st=promoStatus(p), tp=promoTipe(p.tipe), kt=promoKat(p.kategori);

      var kuota=(+p.kuota>0)?((+p.kuota)+' pemakaian'):'';

        '</div>'+
        baris('🏷️',esc(tp.l))+
        baris('📅',promoHariTeks(p.hari))+
        baris('🕒',jam)+
        baris('📍',p.outlet)+
        baris('🤝',p.partner)+
        baris('👤',p.lmPIC)+
        baris('🎟️',kuota)+
        (p.ketentuan?'<details style="margin-top:9px"><summary class="muted" style="cursor:pointer;font-size:12px">Ketentuan</summary>'+
          '<div class="muted" style="font-size:12px;white-space:pre-wrap;margin-top:6px">'+esc(p.ketentuan)+'</div></details>':'')+
      '</div>';
    }).join('')+'</div>';
  }

  h+='<div class="muted" style="font-size:12px;margin-top:12px">'+
     'Menampilkan promo yang <b>berlangsung</b> dan <b>akan datang</b> saja'+
     (arsip?' · '+arsip+' promo lain sudah berakhir atau sedang dijeda':'')+
     ' · didaftarkan tim BD di <b>BD OS → Promotion</b>.</div>';
  return h;
}
var NAV=[['radar','Radar','radar'],['kalender','Kalender Terpadu','cal'],
         ['agenda','Event','star'],['reservasi','Reservasi','book'],
         ['promo','Promo','tag']];
var JUDUL={radar:['Pusat Koordinasi','Radar'],kalender:['Tiga Modul, Satu Jadwal','Kalender Terpadu'],
           agenda:['Marketing + Event','Daftar Event'],reservasi:['Dari Modul Reservasi','Reservasi'],
           detail:['Detail Lengkap Event','Detail Event'],
           promo:['Dari BD OS','Promo Berjalan & Akan Datang']};
function render(){
  /* Bagian "Modul Sumber" (tautan keluar ke Marketing/Event/Reservasi) DIHAPUS.
     Radar berdiri sendiri — semua detail dibaca di sini, tidak melempar kru ke
     modul lain. SUMBER[] tetap dipakai untuk MENARIK data (lihat muat()), hanya
     tautan navigasinya yang tidak ditampilkan. */
  $('#nav').innerHTML='<div class="nav-l">Papan</div>'+
    NAV.map(function(n){return '<button class="nl'+(page===n[0]?' on':'')+'" onclick="APP.go(\''+n[0]+'\')">'+ico(n[2])+n[1]+'</button>';}).join('');
  $('#navFoot').innerHTML='Radar hanya membaca.<br>Perubahan dilakukan di modul asalnya.';
  /* Halaman tak dikenal dinormalkan ke Radar SEBELUM judulnya dipasang.
     Sejak tab Koordinasi dibuang, '#koordinasi' masih tersimpan sebagai
     pintasan di peramban orang; tanpa baris ini judul topbar-nya kosong
     melompong walau isinya benar. */
  if(!JUDUL[page]) page='radar';
  var j=JUDUL[page]||['',''];
  $('#tbSub').textContent=j[0]; $('#tbTitle').textContent=j[1];
  var s=sesi()||{};
  $('#uAv').textContent=initial(s.name); $('#uNama').textContent=s.name||'—';
  $('#uRole').textContent=(s.keterangan||'Kru');
  $('#suAvatar').textContent=initial(s.name); $('#suNama').textContent=s.name||'—';
  $('#suRole').textContent=(s.keterangan||'Kru');
  var v=$('#view');
  if(page==='radar') v.innerHTML=vRadar();
  else if(page==='kalender') v.innerHTML=vKalender();
  else if(page==='agenda') v.innerHTML=vAgendaList();
  else if(page==='reservasi') v.innerHTML=vResList();
  else if(page==='detail') v.innerHTML=vDetailEvent();
  else if(page==='promo') v.innerHTML=vPromo();
  /* Halaman tak dikenal jatuh ke Radar, tidak dibiarkan kosong. Sejak tab
     Koordinasi dibuang, '#koordinasi' yang masih tersimpan sebagai pintasan
     di peramban orang akan mendarat di sini — dan layar putih tanpa satu pun
     pesan terbaca sebagai modul yang rusak. */
  else { page='radar'; v.innerHTML=vRadar(); }
  window.scrollTo(0,0);
}
/* tickClock() DIHAPUS bersama jam dinding di topbar.

   Penyegaran otomatis yang menggantikan tombol "Segarkan". Sengaja SENYAP —
   tidak ada toast, karena toast tiap 5 menit di layar yang memang dibiarkan
   menyala seharian itu gangguan, bukan informasi.

   Dua pengaman supaya penyegaran tidak menyambar orang yang sedang membaca:
   panel detail yang terbuka menunda penyegaran sampai putaran berikutnya, dan
   posisi gulir dikembalikan sesudah render() (render selalu melompat ke atas —
   itu benar untuk pindah halaman, salah untuk penyegaran di tempat). */
var SEGAR_MS = 5*60*1000;
function segarSenyap(){
  var drw=document.getElementById('drw');
  if(drw && drw.classList.contains('on')) return;   // sedang dibaca, tunggu putaran berikutnya
  var y=window.scrollY||0;
  muat().then(function(){ render(); window.scrollTo(0,y); }, function(){});
}

/* ---------- APP ---------- */
var APP={
  go:function(p){ page=p; render(); },
  /* Penyaring tab Promo. Kotak pencarian TIDAK menggambar ulang lewat
     render() penuh: render() membangun ulang seluruh halaman termasuk kotak
     itu sendiri, dan fokus kursor lompat keluar pada huruf pertama yang
     diketik. Hanya isi #view yang diganti, dan fokus dikembalikan ke kotaknya
     berikut posisi kursornya. */
  fPromo:function(k,v){
    fPromo[k]=v;
    if(k!=='q'){ render(); return; }
    var el=document.activeElement, pos=el&&el.selectionStart;
    $('#view').innerHTML=vPromo();
    var baru=$('#view').querySelector('.finp');
    if(baru){ baru.focus(); try{ baru.setSelectionRange(pos,pos); }catch(e){} }
  },
  calNav:function(n){ var m=calCur.m+n,y=calCur.y; if(m<0){m=11;y--;} if(m>11){m=0;y++;} calCur={y:y,m:m}; render(); },
  calNow:function(){ var d=new Date(); calCur={y:d.getFullYear(),m:d.getMonth()}; render(); },
  detailPenuh:function(sum,id){ detailRef={sumber:sum,id:String(id)}; page='detail'; render(); },
  /* Dipanggil dari atribut onerror sebuah <img> lampiran. HARUS lewat APP:
     seluruh skrip modul ini terbungkus IIFE, dan penangan sebaris dicari di
     lingkup global — `onerror="lampiranGagal(this)"` akan melempar
     ReferenceError yang tidak terlihat siapa pun, lalu ikon gambar patah
     bawaan peramban yang tertinggal di layar.

     Berkasnya memang bisa tidak ada: yang tersimpan di data cuma kuncinya, dan
     Marketing boleh menghapus berkasnya kapan saja. Ikon patah membuat kru
     mengira Radar-nya rusak lalu memuat ulang berkali-kali; keterangan jujur
     menyebut yang hilang BERKASNYA, dan catatannya masih ada. */
  lampiranGagal:function(img){
    var fig=img.closest?img.closest('figure'):null;
    if(!fig || fig.dataset.hilang) return;
    fig.dataset.hilang='1';
    var nama=img.getAttribute('alt')||'berkas';
    fig.innerHTML='<div style="padding:12px;border:1px dashed var(--line-soft);border-radius:9px;'+
      'font-size:11px;color:var(--muted);text-align:center" title="'+esc(nama)+'">'+
      '<b style="display:block;color:var(--sand-dim)">Berkas tidak ada</b>'+esc(nama)+'</div>';
  },
  /* Pintasan dari kartu "Hari ini" — membuka Reservasi yang sudah tersaring ke
     hari ini, menggantikan tombol "lembar briefing" yang lama. */
  /* Pintasan dari kartu "Hari ini": buka Reservasi dalam mode Harian pada
     tanggal hari ini. Modenya WAJIB ikut disetel — menaruh tanggalnya saja
     tidak berpengaruh apa-apa selama halaman itu masih di mode Bulanan. */
  resHariIni:function(){ fRs.mode='hari'; fRs.tgl=todayISO(); pgReset(); page='reservasi'; render(); },
  /* Tiap perubahan penyaring MENYETEL ULANG nomor halaman. Tanpa ini, mengetik
     kata kunci baru sementara masih di halaman 7 menghasilkan layar kosong yang
     terlihat seperti "tidak ada datanya" — padahal datanya ada di halaman 1.
     Saklar grid/tabel ikut disetel ulang: dua tampilan itu memuat jumlah baris
     yang sama, tapi tetap lebih jelas kembali ke awal saat bentuknya berganti. */
  fAg:function(k,v){ setPeriode(fAg,k,v); pgReset(); render(); },
  fRs:function(k,v){ setPeriode(fRs,k,v); pgReset(); render(); },
  fRd:function(k,v){ setPeriode(fRd,k,v); pgReset(); render(); },
  /* Chip sumber kalender itu saklar nyala/mati, bukan pilihan tunggal — orang
     sering mau melihat "Marketing + Reservasi saja" sekaligus. */
  fCal:function(k){ fCal[k]=!fCal[k]; render(); },
  /* Posisi gulir dikembalikan sesudah render(): render selalu melompat ke atas
     — itu benar untuk pindah halaman, salah untuk pindah nomor halaman. Di
     Radar tabel "Reservasi hari ini" duduk jauh di bawah, dan
     melompat ke puncak tiap menekan "2" membuat pagernya tidak bisa dipakai. */
  pg:function(kunci,hal){
    var y=window.scrollY||0;
    PG[kunci]=Math.max(1,hal);
    render();
    window.scrollTo(0,y);
  },
  buka:function(sum,id){ APP.detailPenuh(sum,id); },
  detail:function(kind,a,b){
    if(kind==='ag'){
      var ag=AGENDA.filter(function(x){return x.sumber===a && String(x.id)===String(b);})[0];
      if(!ag){ toast('Tidak ditemukan','Agenda mungkin sudah berubah di modul asalnya.'); return; }
      drawerAgenda(ag);
    }else{
      var r=(D.rsv&&D.rsv.reservations||[]).filter(function(x){return String(x.id)===String(a);})[0];
      if(!r){ toast('Tidak ditemukan','Reservasi mungkin sudah berubah di modul asalnya.'); return; }
      drawerRes(r);
    }
  },
  tutupDetail:function(){ $('#drw').classList.remove('on'); $('#scrim').classList.remove('on'); },
  /* "Keluar" = kembali ke pemilih modul Office. Sesi Office (lm_session)
     sengaja TIDAK dihapus — modul lain memakainya juga, jadi menghapusnya di
     sini memaksa kru login ulang hanya karena menutup Radar. Perilakunya
     disamakan dengan Marketing, Event, BD, dan HR. */
  logout:function(){ location.replace('../'); },
  /* Tombol "Segarkan" di topbar sudah dibuang; penyegaran rutin kini dikerjakan
     segarSenyap() tanpa toast. Versi bertoast ini DIPERTAHANKAN sebagai jalan
     manual — dipanggil dari pesan "coba muat ulang" di halaman kosong, dan
     berguna saat menguji dari konsol. */
  muatUlang:function(){
    toast('Menyegarkan','Menarik ulang data dari ketiga modul.');
    muat().then(function(){
      render();
      if(GAGAL.length) toast('Sebagian gagal', GAGAL.map(function(g){return g.nama;}).join(', ')+' tidak terhubung.');
      else toast('Data segar','Marketing, Event, dan Reservasi terbaca.');
    });
  },
  /* WA harian FOKUS RESERVASI (briefing dilebur ke halaman Reservasi). Agenda
     hari itu tetap disebut satu baris sebagai konteks untuk tim floor. */
  waResHarian:function(iso){
    iso=iso||todayISO(); var ags=agendaTgl(iso), rs=resTgl(iso);
    var t='*RESERVASI '+fTgl(iso).toUpperCase()+'*\nLaksamana Muda Coffee & Live Space\n\n';
    if(ags.length) t+='Agenda hari ini: '+ags.map(function(a){return a.judul+(a.jam?' ('+a.jam+')':'');}).join(', ')+'\n\n';
    t+='TAMU: '+rs.length+' booking, '+paxRes(rs)+' pax\n';
    if(!rs.length) t+='(belum ada reservasi)\n';
    rs.slice().sort(function(a,b){return String(a.time||'')<String(b.time||'')?-1:1;}).forEach(function(r){
      t+='- '+(r.time||'-')+' '+(r.name||'-')+' ('+(+r.pax||0)+' pax'+(r.table?', '+r.table:'')+')'+
         (r.notes?'\n   Catatan: '+r.notes:'')+'\n';
    });
    window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank','noopener');
  }
};
window.APP=APP;

/* ---------- INIT ---------- */
function init(){
  muat().then(function(){
    $('#loading').style.display='none';
    $('#app').style.display='grid';
    render();
    setInterval(segarSenyap,SEGAR_MS);
    document.addEventListener('keydown',function(e){ if(e.key==='Escape') APP.tutupDetail(); });
    if(GAGAL.length) toast('Sebagian sumber gagal', GAGAL.map(function(g){return g.nama;}).join(', ')+' tidak terhubung.');
  }, function(e){
    $('#loadTxt').textContent='Gagal memuat: '+(e&&e.message||e);
  });
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init); else init();
})();
</script>
