        <div style="display:flex;gap:5px;margin-bottom:14px">
          <button class="btn btn-danger btn-sm evdel" data-i="${i}">✕</button>
        </div>
      </div>
      ${panelOb(r,i,'ev')}
      </div>`).join('')||'<div class="helper" style="margin-bottom:8px">Belum ada data event.</div>';
    bind('evf','ev',drawEv);
    bindOb('ev',drawEv);
    /* Tombol "Atur kasir shift" DIHAPUS dari section ini (7 Agustus 2026).
       Event tidak lagi memotong kasir, jadi membiarkan tombolnya tampil cuma
       membuat orang mengira pilihannya masih menentukan sesuatu — persis
       kesalahan yang dulu dibuat dengan kotak Free Entry. Baris event lama
       yang sudah menyimpan `shift` tidak dihapus datanya; ia cuma tidak lagi
       dibaca oleh potonganHari(). */
    document.querySelectorAll('.evdel').forEach(b=>b.onclick=()=>{hapusBaris('ev',+b.dataset.i,drawEv);});
    formatAllRp(document.getElementById('bd_ev'));
  }
  /* Menghapus baris. Baris OTOMATIS harus sekaligus dicatat di `d.bd.abaikan`,
     kalau tidak ia muncul lagi begitu halaman digambar ulang dan orangnya akan
     menghapusnya berkali-kali tanpa pernah berhasil. Daftar abaikan disimpan
     saat itu juga — bukan menunggu "Simpan Breakdown" — karena hari yang belum
     balance tidak bisa disimpan, dan justru di hari seperti itulah orang
     membuang baris event yang batal. */
  function hapusBaris(key,i,redraw){
    const r=state[key][i]; if(!r) return;
    state[key].splice(i,1);
    if(r.srcId){
      d.bd.abaikan=Array.isArray(d.bd.abaikan)?d.bd.abaikan:[];
      if(d.bd.abaikan.indexOf(r.srcId)<0){ d.bd.abaikan.push(r.srcId); save(); }
      pitaSumber();
    }
    redraw(); calc();
  }
  function drawKs(){
    document.getElementById('bd_ks').innerHTML=state.ks.map((r,i)=>`
      <div class="brow ks">
        <div class="field"><label>${esc(empName('kasir',r.kasirId))} — omset bruto</label><input data-i="${i}" data-f="amount" class="ksf mono rp" inputmode="numeric" value="${r.amount||0}" ${r.off?'disabled style="opacity:.5"':''}></div>
        <div class="field"><label>Diskon diberikan (−)</label><input data-i="${i}" data-f="disc" class="ksf mono rp" inputmode="numeric" value="${r.disc||0}" ${r.off?'disabled style="opacity:.5"':''} title="Diskon bill yang diberikan kasir ini ke tamu — tidak dihitung sebagai omsetnya"></div>
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:14px;cursor:pointer"><input type="checkbox" class="ksoff" data-i="${i}" ${r.off?'checked':''}> OFF (libur)</label>
        <button type="button" class="btn btn-sm btn-ghost kssisa" data-i="${i}" style="margin-bottom:14px" ${r.off?'disabled style="margin-bottom:14px;opacity:.4"':''} title="Isi sisa omset yang belum dialokasikan ke kasir ini">sisa</button>
      </div>`).join('')||'<div class="empty" style="padding:20px 10px">Belum ada kasir. Nama muncul otomatis setelah akun di Office diberi Tim/Keterangan <b>kasir</b>.</div>';
    // Satu penangan untuk dua kolom — bedanya cuma field tujuannya. Jangan
    // menggambar ulang section di sini: nominalnya sedang diketik, dan redraw
    // akan merebut fokus dari kotaknya (jebakan yang sama dengan segarkanBagi).
    document.querySelectorAll('.ksf').forEach(inp=>inp.oninput=()=>{state.ks[+inp.dataset.i][inp.dataset.f]=num(inp.value);calc();});
    /* Centang OFF juga MENCABUT kasir itu dari seluruh baris shift marketing &
       event. Kalau tidak: potongannya tetap dibagi ke orang yang libur, padahal
       kartu Efek ke Realisasi Kasir cuma menampilkan kasir non-OFF — jadi
       sebagian potongan hilang dari rekap tanpa ada yang tahu. Section B/C ikut
       digambar ulang karena angka di tombol potongannya berubah. */
    document.querySelectorAll('.ksoff').forEach(c=>c.onchange=()=>{
      const i=+c.dataset.i;
      state.ks[i].off=c.checked;
      if(c.checked){ state.ks[i].amount=0; state.ks[i].disc=0; buangDariShift(state.ks[i].kasirId); }
      drawKs(); drawMk(); drawEv(); calc();
    });
    document.querySelectorAll('.kssisa').forEach(b=>b.onclick=()=>isiSisa(+b.dataset.i));
    formatAllRp(document.getElementById('bd_ks'));
  }
  /* Satu baris saja, tanpa OFF (self order tidak libur) dan tanpa nama PIC.
     Tombol "sisa" tetap ada: pada hari yang omsetnya banyak lewat barcode,
     jauh lebih cepat mengisi kasir dulu lalu melempar sisanya ke sini. */
  function drawSo(){
    document.getElementById('bd_so').innerHTML=`
      <div class="brow so">
        <div class="field"><label>Self Order — omset bruto</label><input data-f="amount" class="sof mono rp" inputmode="numeric" value="${state.so.amount||0}"></div>
        <div class="field"><label>Diskon diberikan (−)</label><input data-f="disc" class="sof mono rp" inputmode="numeric" value="${state.so.disc||0}" title="Diskon bill pada pesanan yang masuk lewat barcode"></div>
        <button type="button" class="btn btn-sm btn-ghost" id="so_sisa" style="margin-bottom:14px" title="Isi sisa omset yang belum dialokasikan ke Self Order">sisa</button>
      </div>`;
    document.querySelectorAll('.sof').forEach(inp=>inp.oninput=()=>{state.so[inp.dataset.f]=num(inp.value);calc();});
    document.getElementById('so_sisa').onclick=()=>{
      const cur=num(state.so.amount)-num(state.so.disc);
      state.so.amount=Math.max(0, net-(sumDiakui()-cur))+num(state.so.disc);
      drawSo(); calc();
    };
    formatAllRp(document.getElementById('bd_so'));
  }
  // Kotak yang isinya nominal, bukan teks. `tax`/`service` masuk daftar ini
  // sejak Section B punya tiga kolom angka (7 Agustus 2026) — tanpa itu
  // keduanya tersimpan sebagai STRING "1.500.000" dan num() di porsiPic
  // membacanya benar tapi save() menulis bentuk yang tidak konsisten.
  const KOTAK_RP=['amount','tax','service','obAmount','obTax','obService'];
  function bind(cls,key,redraw){
    document.querySelectorAll('.'+cls).forEach(inp=>{
      inp.oninput=inp.onchange=()=>{
        const i=+inp.dataset.i,f=inp.dataset.f;
        const rp=KOTAK_RP.indexOf(f)>-1;
        state[key][i][f]=rp?num(inp.value):inp.value;
        if(rp) segarkanBagi(key,i);
        calc();
      };
    });
  }
  /* Yang divalidasi terhadap omset net sekarang HANYA section kasir. Dulu
     ketiga section dijumlahkan; sejak omset kasir memuat event juga (30 Juli
     2026), menjumlahkan marketing & event ke sini berarti menghitung uang yang
     sama dua kali. */
  /* Yang dijumlahkan adalah omset yang DIAKUI (bruto − diskon), bukan bruto:
     diskon tidak pernah jadi omset siapa pun, dan omset net harian di atas
     juga sudah dikurangi diskon. Menjumlahkan bruto di sini akan membuat
     Breakdown menuntut angka sebesar gross — tidak akan pernah balance.
     Self Order ikut dijumlahkan walau bukan omset kasir: uangnya nyata dan
     ikut membentuk omset net, jadi tanpa itu hari yang ada self order-nya
     tidak akan pernah bisa balance. */
  function sumKasirSaja(){ return state.ks.reduce((s,r)=>s+(r.off?0:omsetKasir(r)),0); }
  function sumDiakui(){ return sumKasirSaja()+num(state.so.amount)-num(state.so.disc); }
  // Total diskon yang sudah diatribusikan, kasir maupun Self Order.
  // Pembandingnya angka Discount di Input Omset Harian (d.discount).
  function sumDiskon(){ return state.ks.reduce((s,r)=>s+diskonKasir(r),0)+num(state.so.disc); }
  // Isi otomatis omset yang BELUM dialokasikan (net − kasir lain) ke satu baris
  // kasir. Hanya untuk section kasir: baris marketing/event tidak mengisi total
  // apa pun lagi, jadi "sisa" di sana tidak punya arti dan tombolnya dihapus.
  // Yang diisikan BRUTO: sisanya dihitung atas angka diakui, lalu diskon baris
  // ini ditambahkan kembali supaya bruto − diskon tepat menutup sisa itu.
  function isiSisa(i){
    const row=state.ks[i]; if(!row || row.off) return;
    const cur=omsetKasir(row);
    row.amount=Math.max(0, net-(sumDiakui()-cur))+num(row.disc);
    drawKs(); calc();
  }
  /* Rincian efek potongan per kasir. Bukan hiasan: potongannya tidak terlihat
     di angka yang diinput sama sekali (omset kasir tetap utuh), jadi tanpa
     kartu ini orang tidak punya cara memastikan potongannya jatuh ke kasir yang
     benar selain membuka halaman Performa Kasir sesudah menyimpan. */
  function kartuEfek(){
    const rows=state.ks.filter(r=>!r.off);
    // Hari yang seluruh kasirnya OFF tapi ada self order tetap perlu kartu ini
    // — omsetnya ada, cuma tidak ada yang mengakuinya sebagai kasir.
    if(!rows.length && !num(state.so.amount)) return '';
    // Hanya baris MARKETING — event tidak memotong kasir lagi (lihat porsiPic).
    const pot=id=>state.mk.reduce((s,r)=>{const b=potonganBaris(r);return s+(b.ids.indexOf(id)>-1?b.per:0);},0);
    /* Open Bill: dibaca dari `state`, bukan dari d.bd — yang sedang diketik
       belum tersimpan, dan kartu ini justru dipakai untuk memeriksa sebelum
       menyimpan. Kolomnya TIDAK ikut menambah/mengurangi Realisasi; ia
       keterangan, lihat catatan panjang di obTotal(). */
    const ob=id=>[...state.mk,...state.ev]
      .filter(r=>obAktif(r)&&r.obKasirId===id)
      .reduce((s,r)=>s+obTotal(r),0);
    const obNama=id=>[...state.mk,...state.ev]
      .filter(r=>obAktif(r)&&r.obKasirId===id&&obTotal(r)>0)
      .map(r=>r.eventName||'event tanpa nama');
    const isi=rows.map(r=>{
      const p=pot(r.kasirId), dc=diskonKasir(r), real=omsetKasir(r)-p, o=ob(r.kasirId);
      const nm=obNama(r.kasirId);
      return `<tr><td>${esc(empName('kasir',r.kasirId))}</td><td class="num mono">${fmtRp(num(r.amount))}</td><td class="num mono">${dc?'−'+fmtRp(dc):'<span class="muted">—</span>'}</td><td class="num mono">${p?'−'+fmtRp(p):'<span class="muted">—</span>'}</td><td class="num mono"><b>${fmtRp(real)}</b></td><td class="num mono">${o?`${fmtRp(o)}${nm.length?`<div style="font-size:11px;font-weight:600;opacity:.7">${esc(nm.join(', '))}</div>`:''}`:'<span class="muted">—</span>'}</td></tr>`;
    }).join('');
    const tob=rows.reduce((s,r)=>s+ob(r.kasirId),0);
    /* Open Bill yang belum ditunjuk kasirnya. Kalau didiamkan, nominalnya tetap
       diakui untuk PIC tapi tidak ada satu pun kasir yang tercatat melayaninya
       — persis kesalahan yang dulu terjadi pada baris tanpa kasir shift. */
    const obYatim=[...state.mk,...state.ev].filter(r=>obAktif(r)&&obTotal(r)>0&&!r.obKasirId);
    const tp=rows.reduce((s,r)=>s+pot(r.kasirId),0);
    const tk=rows.reduce((s,r)=>s+num(r.amount),0)+num(state.so.amount);
    const td=rows.reduce((s,r)=>s+diskonKasir(r),0)+num(state.so.disc);
    /* Self Order ditempelkan sebagai baris terakhir walau bukan realisasi
       kasir: tanpa itu TOTAL kartu ini tidak akan sama dengan omset net dan
       orang akan mengira ada omset yang hilang. Ditandai jelas supaya tidak
       terbaca sebagai nama kasir. */
    const barisSo=(num(state.so.amount)||num(state.so.disc))
      ? `<tr style="color:var(--muted)"><td><i>Self Order (tanpa kasir)</i></td><td class="num mono">${fmtRp(num(state.so.amount))}</td><td class="num mono">${num(state.so.disc)?'−'+fmtRp(num(state.so.disc)):'—'}</td><td class="num mono">—</td><td class="num mono"><b>${fmtRp(num(state.so.amount)-num(state.so.disc))}</b></td><td class="num mono">—</td></tr>`
      : '';
    return `<div class="card"><h3>Efek ke Realisasi Kasir</h3>
      <div class="card-sub">Rincian lengkap ada di sini, bukan di halaman Performa Kasir — di sana yang tampil hanya angka finalnya. Diskon yang diberikan seorang kasir tidak pernah jadi omsetnya.</div>
      ${obYatim.length?`<div class="notice warn">⚠ ${obYatim.length} Open Bill belum ditunjuk kasirnya (${esc(obYatim.map(r=>r.eventName||'event tanpa nama').join(', '))}) senilai <b>${fmtRp(obYatim.reduce((s,r)=>s+obTotal(r),0))}</b>. Nominalnya tetap diakui untuk PIC, tapi tidak ada kasir yang tercatat melayaninya.</div>`:''}
      <div class="tbl-wrap"><table>
        <thead><tr><th>Kasir</th><th class="num" style="width:130px">Omset Bruto</th><th class="num" style="width:130px">Diskon Diberikan</th><th class="num" style="width:130px">Potongan Event</th><th class="num" style="width:130px">Realisasi</th><th class="num" style="width:150px">Open Bill</th></tr></thead>
        <tbody>${isi}${barisSo}</tbody>
        <tfoot><tr style="font-weight:800;border-top:2px solid var(--line)"><td>TOTAL</td><td class="num mono">${fmtRp(tk)}</td><td class="num mono">${td?'−'+fmtRp(td):'Rp0'}</td><td class="num mono">${tp?'−'+fmtRp(tp):'Rp0'}</td><td class="num mono">${fmtRp(tk-td-tp)}</td><td class="num mono">${tob?fmtRp(tob):'Rp0'}</td></tr></tfoot>
      </table></div>
      <div class="helper" style="margin:10px 0 0">Kolom <b>Open Bill</b> tidak menambah maupun mengurangi Realisasi di sebelahnya — uangnya sudah ada di dalam Omset Bruto kasir itu. Ia menandai bagian mana yang datang dari pesanan tambahan event, dan event mana. Nominal yang sama juga diakui untuk PIC event-nya, dan <b>tidak dipotong</b> dari kasir mana pun.</div></div>`;
  }
  function calc(){
    const tot=sumDiakui(), diff=net-tot, ok=Math.abs(diff)<1;
    document.getElementById('bd_efek').innerHTML=kartuEfek();
    /* Baris bernominal yang shift-nya belum ditentukan. Ini TIDAK mengunci
       simpan — omset kasirnya sendiri bisa saja sudah benar dan balance, dan
       mengunci di sini berarti angka yang sudah betul tidak bisa disimpan.
       Tapi peringatannya sekarang menyebut akibatnya terang-terangan: potongan
       yang tidak dibebankan membuat uang yang sama dihitung dua kali. */
    const belum=state.mk.filter(r=>num(r.amount)>0&&potonganBaris(r).pembagi<=0);
    /* Atribusi diskon TIDAK mengunci simpan — beda dengan balance omset. Kalau
       dikunci, hari yang alokasi omsetnya sudah benar jadi tidak bisa disimpan
       cuma gara-gara diskonnya belum dirinci, dan orang akan mengakalinya
       dengan menaruh seluruh diskon di satu kasir sembarangan. Yang perlu
       adalah peringatan yang menyebut akibatnya. */
    const dTot=sumDiskon(), dHari=num(d.discount), dSel=dHari-dTot;
    const lebihan=state.ks.filter(r=>!r.off&&num(r.disc)>num(r.amount));
    if(num(state.so.disc)>num(state.so.amount)) lebihan.push({kasirId:null,self:true});
    const namaLebihan=lebihan.map(r=>r.self?'Self Order':esc(empName('kasir',r.kasirId))).join(', ');
    const perDiskon = lebihan.length
      ? `<div class="notice bad">⚠ ${namaLebihan} diberi diskon lebih besar daripada omset brutonya sendiri. Kolom omset harus diisi <b>bruto</b> (sebelum diskon), bukan setoran bersihnya.</div>`
      : (dHari!==dTot
        ? `<div class="notice warn">⚠ Diskon yang sudah diatribusikan <b>${fmtRp(dTot)}</b>, sedangkan Discount di Input Omset Harian <b>${fmtRp(dHari)}</b> — ${dSel>0?`masih ada ${fmtRp(dSel)} yang belum ditulis atas nama kasir mana pun (atau Self Order)`:`kelebihan ${fmtRp(-dSel)}`}. Selama belum cocok, tidak ada catatan siapa yang memberi diskon itu — meski total omsetnya tetap benar.</div>`
        : (dHari>0?`<div class="notice ok">✓ Seluruh diskon ${fmtRp(dHari)} sudah tercatat atas nama pemberinya.</div>`:''));
    document.getElementById('bd_warn').innerHTML = perDiskon + (belum.length
      ? `<div class="notice warn">⚠ ${belum.length} baris <b>marketing</b> belum ditentukan kasir shift-nya${belum.some(r=>r.eventName)?` (${esc(belum.filter(r=>r.eventName).map(r=>r.eventName).join(', '))})`:''}. Potongan <b>${fmtRp(belum.reduce((s,r)=>s+potongKasir(r),0))}</b> tidak dibebankan ke kasir mana pun, jadi omset itu terhitung dua kali — sekali di realisasi PIC, sekali di realisasi kasir. Klik tombol potongan pada barisnya.</div>`
      : '');
    document.getElementById('bd_balance').innerHTML=`
      <div class="bnums">
        <div class="bi">Total Omset Diakui<b class="mono">${fmtRp(tot)}</b></div>
        <div class="bi">Total Omset (net)<b class="mono">${fmtRp(net)}</b></div>
        <div class="bi">Self Order<b class="mono">${fmtRp(num(state.so.amount)-num(state.so.disc))}</b></div>
        <div class="bi">Diskon Tercatat<b class="mono" style="color:${dHari===dTot?'var(--ok)':'var(--muted)'}">${fmtRp(dTot)} / ${fmtRp(dHari)}</b></div>
        <div class="bi">Selisih<b class="mono" style="color:${ok?'var(--ok)':'var(--danger)'}">${diff===0?'Rp0':(diff>0?'Kurang '+fmtRp(diff):'Lebih '+fmtRp(-diff))}</b></div>
      </div>
      <div style="display:flex;gap:10px;align-items:center">
        ${ok?'<span class="status ok"><span class="d"></span>Valid, siap disimpan</span>':'<span class="status bad"><span class="d"></span>Belum Balance</span>'}
        <button class="btn btn-primary" id="bd_save" ${ok?'':'disabled'}>Simpan Breakdown</button>
      </div>`;
    document.getElementById('bd_save').onclick=()=>{
      // `abaikan` ikut dibawa — ia BUKAN bagian dari `state`, dan menulis d.bd
      // dari nol tanpa menyalinnya membuat baris otomatis yang sudah dibuang
      // muncul lagi begitu halaman digambar ulang.
      d.bd={marketing:state.mk,event:state.ev,kasir:state.ks,self:state.so,abaikan:d.bd.abaikan||[]};d.bdValid=true;save();render();
    };
  }
  // tiket:false ditulis eksplisit — baris tanpa field ini (data sebelum 28 Juli
  // 2026) juga dibaca sebagai non-ticketing, jadi keduanya konsisten.
  document.getElementById('add_mk').onclick=()=>{state.mk.push({picId:DB.employees.marketing[0]?.id,eventName:'',amount:0,tax:0,service:0,tiket:false,dw:0,shift:[]});drawMk();calc();};
  // Baris event TIDAK diberi `shift`: section ini tidak punya pengaturan kasir
  // lagi, jadi field kosong yang tak pernah diisi cuma jadi umpan salah baca.
  document.getElementById('add_ev').onclick=()=>{state.ev.push({picId:DB.employees.event[0]?.id,eventName:'',amount:0,tiket:false,dw:0});drawEv();calc();};
  drawMk();drawEv();drawKs();drawSo();calc();

  /* Penarikan event otomatis dijalankan PALING AKHIR, sesudah halaman lengkap
     tergambar. Menunggunya lebih dulu berarti Breakdown baru muncul setelah
     dua modul lain menjawab — dan kalau salah satunya mati, halaman ini ikut
     menggantung padahal isinya sama sekali tidak bergantung padanya. */
  pitaSumber();
  const pasang=()=>{
    // Render lama, atau user sudah pindah halaman/tanggal — jangan sentuh DOM.
    if(tokenRender!==BD_RENDER || CURRENT!=='breakdown' || bdDate!==EVHARI.tgl) return;
    pitaSumber();
    if(serapOtomatis()){ drawMk(); drawEv(); calc(); }
  };
  muatEventHari(bdDate,pasang);
}

/* Nama bulan untuk label periode. Dulu tinggal di blok Performa; blok itu
   pindah ke Finance 11 Agustus 2026, sedangkan fungsi ini tetap dipakai
   labelRentang() di setiap halaman. */
function labelPeriode(mk){
  const [y,m]=String(mk).split("-");
  const d=new Date(Number(y),Number(m)-1,1);
  return isNaN(d)?mk:d.toLocaleDateString("id-ID",{month:"long",year:"numeric"});
}

/* Sinkron PIC dari Office OTOMATIS (tanpa PIN) berdasarkan Tim/Keterangan.
   Memakai listDivisiRoster — endpoint terbuka yang hanya membalas nama +
   keterangan. Kru yang timnya Marketing/Event/Kasir ditambahkan ke daftar PIC
   divisi yang sesuai. NON-DESTRUKTIF: cuma menambah yang belum ada (cocok
   officeUserId atau nama), target & PIC manual tidak disentuh. Dijalankan
   diam-diam saat modul dibuka. */
async function syncPicOffice(){
  if(!DB) return;
  try{
    const r=await fetch('../../account-api-mysql/api.php',{method:'POST',redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'listDivisiRoster'})});
    const j=await r.json();
    if(!j||!j.ok||!Array.isArray(j.members)) return;
    let changed=false;
    ['marketing','event','kasir'].forEach(divi=>{
      j.members.forEach(u=>{
        if(u.active===false) return;
        const ket=String(u.keterangan||'').toLowerCase().split(/[\s,;/]+/);
        if(ket.indexOf(divi)<0) return;                 // kata divisi utuh
        const nama=String(u.name||'').trim(); if(!nama) return;
        const ada=DB.employees[divi].some(e=>e.officeUserId===u.id || String(e.name||'').trim().toLowerCase()===nama.toLowerCase());
        if(!ada){ DB.employees[divi].push({id:divi[0]+Date.now().toString(36)+Math.floor(Math.random()*1e4),name:nama,target:0,officeUserId:u.id}); changed=true; }
      });
    });
    if(changed){ save(); if(CURRENT==='target') render(); }
  }catch(e){ /* Office diam → biarkan; PIC yang sudah tersimpan tetap ada */ }
}

/* ============ KELOLA AKSES KRU ============
   Daftar siapa saja yang PUNYA akses modul kompas, ditarik dari database
   account lewat `listModuleRoster` — endpoint TANPA gerbang PIN (identitas
   sudah dijamin sesi Office). Read-only: menambah/menghapus akses dilakukan
   di "Kelola Akses" milik Office, bukan di sini. */
let AKSES_ROSTER=null, AKSES_ERR='';
async function muatAkses(){
  const stop=new AbortController(); const jam=setTimeout(()=>stop.abort(),8000);
  try{
    const r=await fetch('../../account-api-mysql/api.php',{method:'POST',redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'listModuleRoster',module:'kompas'}),signal:stop.signal});
    clearTimeout(jam);
    const t=await r.text(); let j=null; try{ j=JSON.parse(t); }catch(e){}
    if(!j) throw new Error('Office membalas bukan JSON (account-api-mysql belum terpasang?)');
    if(!j.ok) throw new Error(j.error||'ditolak');
    if(!Array.isArray(j.members)) throw new Error('balasan tanpa daftar anggota');
    AKSES_ROSTER=j.members; AKSES_ERR='';
  }catch(e){ clearTimeout(jam); AKSES_ROSTER=null; AKSES_ERR=(e.name==='AbortError'?'Office tidak menjawab dalam 8 detik':e.message); }
  if(CURRENT==='akses') viewAkses();
}
function viewAkses(){
  const el=document.getElementById('app-view');
  const meNama=(CURRENT_USER&&CURRENT_USER.name)||'';
  const initial=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase();
  if(AKSES_ROSTER===null && !AKSES_ERR){
    el.innerHTML=`<div class="card"><div class="empty"><div class="big">⏳</div>Memuat daftar akses dari Office…</div></div>`;
    muatAkses(); return;
  }
  const rows=(AKSES_ROSTER||[]).slice().sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')));
  el.innerHTML=`
    <div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap">
      <div><h3>Pemegang Akses Modul Kompas</h3><div class="card-sub" style="margin:0">Ditarik dari database Office. Menambah/menghapus akses dan menaikkan level dilakukan di <b>Kelola Akses</b> milik Office, bukan di sini.</div></div>
      <button class="btn btn-ghost btn-sm" onclick="AKSES_ROSTER=null;AKSES_ERR='';viewAkses()">↻ Segarkan</button>
    </div>
    <div class="notice info">🔑 <div><b>Dua level tampilan.</b>
      <b>Operasional</b> hanya melihat grup menu Operasional (Input Omset, Report Daily, Compliment, Breakdown) — cocok untuk kasir.
      <b>Super Admin</b> melihat semuanya: Operasional, Dashboard, Performa, dan Sistem.
      Levelnya mengikuti status <b>admin modul</b> di Office: kru yang dijadikan admin Kompas (atau admin global) otomatis Super Admin, selain itu Operasional.</div></div>
    ${AKSES_ERR?`<div class="notice bad">⚠ Gagal memuat: ${esc(AKSES_ERR)}</div>`:`
    <div class="card" style="padding:0;overflow:hidden">
      <div class="tbl-wrap"><table>
        <thead><tr><th>Nama</th><th>Tim / Keterangan</th><th>Status</th><th>Level Tampilan</th></tr></thead>
        <tbody>${rows.length?rows.map(m=>{const penuh=!!m.isModuleAdmin;return `<tr>
          <td><div style="display:flex;align-items:center;gap:10px">
            <span style="width:30px;height:30px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--gold-2),var(--gold-dim));color:#fff;font-weight:800;font-size:11px">${esc(initial(m.name))}</span>
            <b>${esc(m.name||'(tanpa nama)')}</b>${meNama&&String(m.name||'').toLowerCase()===meNama.toLowerCase()?' <span class="chip info" style="margin-left:4px">kamu</span>':''}</div></td>
          <td class="muted" style="font-size:12.5px">${esc(m.keterangan||'—')}</td>
          <td>${m.active===false?'<span class="chip warn">nonaktif</span>':'<span class="muted" style="font-size:12px">—</span>'}</td>
          <td>${penuh?'<span class="chip ok">Super Admin — semua menu</span>':'<span class="chip info">Operasional saja</span>'}</td>
        </tr>`;}).join(''):`<tr><td colspan="4" class="empty">Belum ada kru dengan akses modul Kompas. Beri akses lewat Kelola Akses di Office.</td></tr>`}</tbody>
      </table></div>
    </div>
    <div class="foot" style="font-size:12px;color:var(--muted);margin-top:2px">${rows.length} kru memegang akses Kompas · ${rows.filter(m=>m.isModuleAdmin).length} di antaranya Super Admin.</div>`}`;
}

/* Factory option Chart.js (lineOpts/barOpts/pieOpts) dan money() DIHAPUS
   11 Agustus 2026: sesudah Dashboard & Performa pindah ke Finance, modul ini
   tidak lagi menggambar satu grafik pun. Chart.js dari CDN ikut dilepas dari
   <head> -- 200 KB yang dulu diunduh tiap kali kasir membuka halaman input. */

/* ---- init: muat dari server, lalu jalankan ---- */
function boot(){
  CURRENT_USER=bacaSesi();
  if(!CURRENT_USER){ location.replace('../../'); return; }
  const av=document.getElementById('suAvatar'), nm=document.getElementById('suName');
  if(av) av.textContent=(String(CURRENT_USER.name||'?').trim()[0]||'?').toUpperCase();
  if(nm) nm.textContent=CURRENT_USER.name||'—';
  pasangMenu();   // sembunyikan grup menu di luar level user SEBELUM halaman digambar
  setSync('load');
  render();   // tampilkan status "memuat"
  apiGet().then(data=>{
    DB=normalizeDB(data);
    setSync('ok');
    PERIOD=DB.daily.length?monthKeyOf(DB.daily[DB.daily.length-1].date):monthKeyOf(todayISO());
    inputDate=todayISO();
    const dibersihkan=purgeSeedKasir(DB);   // buang PIC contoh "Kasir 1/2/3"
    go('input');
    if(dibersihkan) save();
    syncPicOffice();   // tarik PIC per divisi dari Office (otomatis, tanpa PIN)
  }, err=>{
    // Jaringan gagal → pakai salinan lokal kalau ada, biar tetap bisa dilihat.
    let cache=null; try{ cache=JSON.parse(localStorage.getItem(CACHE_KEY)||'null'); }catch(e){}
    DB=normalizeDB(cache||seed());
    setSync('err','Offline — memakai salinan lokal, perubahan akan disinkronkan saat online');
    PERIOD=DB.daily.length?monthKeyOf(DB.daily[DB.daily.length-1].date):monthKeyOf(todayISO());
    purgeSeedKasir(DB);   // rapikan tampilan; simpannya nanti saat online
    go('input');
  });
}
boot();
</script>
