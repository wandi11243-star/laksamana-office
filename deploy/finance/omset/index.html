      ${rows.length?`<div class="tbl-wrap"><table>${rows.join('')}</table></div>`:`<div class="helper" style="margin:6px 0 0">${kosong}</div>`}
    </div>`;
  const rBaru=bh.listBaru.map(b=>`<tr>
    <td><b>${esc(b.nama)}</b> <span class="chip mute">${esc(bonTipeNama(b.tipe))}</span>${b.bill||b.picName?`<div class="muted" style="font-size:11px">${esc(b.bill||'')}${b.bill&&b.picName?' · ':''}${b.picName?'PIC '+esc(b.picName):''}</div>`:''}</td>
    <td class="muted" style="font-size:12px">POS: ${esc(payName(b.payKey))}</td>
    <td class="num mono" style="color:var(--danger)">${fmtSel(-num(b.nominal))}</td></tr>`);
  const rLunas=bh.listLunas.map(b=>`<tr>
    <td><b>${esc(b.nama)}</b>${b.bill?`<div class="muted" style="font-size:11px">${esc(b.bill)}</div>`:''}</td>
    <td class="muted" style="font-size:12px">bill ${esc(b.date)} · ${esc(payName(b.lunasPayKey))}</td>
    <td class="num mono" style="color:var(--ok)">${fmtSel(num(b.nominal))}</td></tr>`);
  return `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap">
        <div><h3>Penjelasan Selisih Hari Ini</h3>
        <div class="card-sub">Bon &amp; pelunasan yang jatuh pada tanggal ini.</div></div>
        <button class="btn btn-ghost btn-sm" onclick="go('piutang')">Buka halaman Piutang →</button>
      </div>
      <div style="margin-top:12px">${catatanSelisihHari(bh)}</div>
      <div class="grid g2" style="align-items:start">
        <div class="tbl-wrap"><table>
          ${baris('Bon baru hari ini (uang belum diterima)',fmtSel(-bh.totBaru),'var(--danger)')}
          ${baris('Pelunasan bon hari lain, diterima hari ini',fmtSel(bh.totLunas),'var(--ok)')}
          <tr style="font-weight:800;border-top:2px solid var(--line)">
            <td>Selisih yang <u>SEHARUSNYA</u> terjadi</td>
            <td class="num mono"><span class="js-harus">Rp0</span></td></tr>
          ${baris('Selisih sebenarnya (Actual − POS)','<span id="bn_sel">Rp0</span>')}
          <tr style="font-weight:800;border-top:2px solid var(--line)">
            <td>= Sisa yang belum terjelaskan</td>
            <td class="num mono"><span id="bn_sisa">Rp0</span></td></tr>
        </table>
        <div class="helper" style="margin-top:8px">Total piutang belum lunas seluruh tanggal: <b>${fmtRp(totOpen)}</b> dari ${jmlOrang} orang.</div></div>
        <div style="display:grid;gap:12px">
          ${daftar('Bon baru hari ini',rBaru,'Tidak ada bon baru pada tanggal ini.')}
          ${daftar('Pelunasan diterima hari ini',rLunas,'Tidak ada pelunasan pada tanggal ini.')}
        </div>
      </div>
    </div>`;
}

/* ============ 1b. PIUTANG / BON ============
   Kenapa halaman ini ada: POS tidak mengenal "belum bayar". Supaya bill bisa
   ditutup, kasir terpaksa memilih SATU metode pembayaran padahal uangnya belum
   masuk — biasanya Cash. Akibatnya Report Daily hari itu selalu terlihat kurang
   sebesar bon tersebut, dan sebelum halaman ini ada tidak ada apa pun di layar
   yang menjelaskan kenapa; selisihnya terbaca seperti uang hilang.

   Yang dicatat karena itu ada tiga: nominalnya, SIAPA yang berhutang, dan
   metode POS sementara yang dipakai menutup billnya. Yang ketiga bukan
   kelengkapan — tanpanya selisih hanya bisa dijelaskan di tingkat total, dan
   metode MANA yang kurang tetap tidak ketahuan.

   Pelunasan SENGAJA dicatat pada tanggal uangnya diterima, bukan dimundurkan
   ke tanggal bill. Uangnya memang masuk hari itu; memundurkannya akan mengubah
   report yang sudah disubmit dan tetap meninggalkan hari pelunasan kelebihan
   uang tanpa sebab. Itu persis keluhan yang melahirkan halaman ini: 3 bon lama
   dilunasi sekaligus, dan report hari itu berlebih. Sekarang kelebihan itu
   muncul sebagai kolom "Pelunasan (+)" dengan nama orangnya. */
let bonDate=todayISO();
let BON_TAB='open';   // 'open' | 'lunas'
/* Hasil pengelompokan render terakhir. Tombol Lunasi merujuk grup lewat indeks
   ("g0", "g1"), bukan lewat nama: nama tamu bisa memuat kutip dan tanda baca
   yang merusak atribut HTML, dan indeks tidak pernah bisa. */
let BON_GRUP=[];
let BON_EDIT=null;   // id bon yang sedang diubah; null = form dalam mode tambah
const BON_TIPE=[{k:'tamu',n:'Tamu'},{k:'owner',n:'Owner'},{k:'staff',n:'Staff'},{k:'lain',n:'Lainnya'}];
const bonTipeNama=k=>{ const t=BON_TIPE.find(x=>x.k===k); return t?t.n:'Lainnya'; };
const payName=k=>{ const p=PAYS.find(x=>x.k===k); return p?p.n:(k||'—'); };
function bonSemua(){ return DB.piutang||[]; }
function bonBelum(){ return bonSemua().filter(b=>b.status!=='lunas'); }
function bonBaruOn(date){ return bonSemua().filter(b=>b.date===date); }
function bonLunasOn(date){ return bonSemua().filter(b=>b.status==='lunas'&&b.lunasDate===date); }
/* Ringkasan satu tanggal, per metode pembayaran — inilah yang dipakai Report
   Daily. Bon yang dibuat DAN dilunasi pada hari yang sama sengaja ikut di
   kedua ember: kalau metodenya sama keduanya saling meniadakan (memang benar,
   uangnya keluar-masuk di hari yang sama), kalau berbeda selisih antar
   metodenya justru yang harus terlihat. */
function bonRingkasHari(date){
  const baru={},lunas={}; let totBaru=0,totLunas=0;
  const listBaru=bonBaruOn(date), listLunas=bonLunasOn(date);
  listBaru.forEach(b=>{ const n=num(b.nominal); baru[b.payKey]=(baru[b.payKey]||0)+n; totBaru+=n; });
  listLunas.forEach(b=>{ const n=num(b.nominal); lunas[b.lunasPayKey]=(lunas[b.lunasPayKey]||0)+n; totLunas+=n; });
  return {baru,lunas,totBaru,totLunas,listBaru,listLunas,ada:listBaru.length>0||listLunas.length>0};
}
/* Bon belum lunas dikelompokkan per orang. Kuncinya nama (huruf kecil, tanpa
   spasi tepi) + tipe, supaya "Pak Budi" dan "pak budi " tidak jadi dua orang —
   nama diketik ulang tiap kali, dan itu satu-satunya pengait yang ada. */
function bonGrupBelum(){
  const map=new Map();
  bonBelum().forEach(b=>{
    const key=String(b.nama||'').trim().toLowerCase()+'|'+b.tipe;
    if(!map.has(key)) map.set(key,{nama:b.nama,tipe:b.tipe,items:[],total:0});
    const g=map.get(key); g.items.push(b); g.total+=num(b.nominal);
  });
  const arr=[...map.values()];
  arr.forEach(g=>g.items.sort((a,b)=>a.date<b.date?-1:1));
  arr.sort((a,b)=>b.total-a.total);
  return arr;
}

/* Ubah bon: form di atas halaman berganti mode, terisi nilai bon ini. Tanggal
   bill dipegang oleh kalender, jadi bonDate ikut dipindahkan ke tanggal bon —
   kalau tidak, menyimpan tanpa menyentuh kalender akan diam-diam memindahkan
   bonnya ke tanggal yang sedang dilihat. */
function editBon(id){
  const b=(DB.piutang||[]).find(x=>x.id===id);

  BON_EDIT=id; bonDate=b.date; PERIOD=monthKeyOf(b.date);

}

  function hitungGrup(gid){

/* Lunasi bon yang dicentang dalam satu grup sekaligus — kasus "3 bill satu
   orang, dibayar barengan" memang bentuk normalnya, bukan pengecualian. */
function lunasiGrup(gid){
  const el=document.getElementById('app-view');
  const g=BON_GRUP[parseInt(String(gid).slice(1),10)];
  if(!g) return;
  const dicentang=[...el.querySelectorAll(`.bnck[data-g="${gid}"]:checked`)];
  const box=document.getElementById('bnerr_'+gid);
  if(!dicentang.length){ if(box) box.innerHTML='<div class="notice bad">⚠ Belum ada bon yang dicentang.</div>'; return; }
  const tglEl=el.querySelector(`.bn-tgl[data-g="${gid}"]`);
  const tgl=(tglEl&&tglEl.value)||todayISO();
  const payEl=el.querySelector(`.bn-pay[data-g="${gid}"]`);
  const pay=(payEl&&payEl.value)||'cash';
  const tot=dicentang.reduce((s,x)=>s+num(x.dataset.nom),0);
  const ids=new Set(dicentang.map(x=>x.dataset.id));
  if(!confirm(`Lunasi ${ids.size} bon atas nama ${g.nama} senilai ${fmtRp(tot)}?\n\nUang dicatat masuk pada ${dateLabel(tgl)} lewat ${payName(pay)}. Report Daily tanggal itu akan menampilkannya sebagai pelunasan.`)) return;
  (DB.piutang||[]).forEach(b=>{
    if(!ids.has(b.id)) return;
    b.status='lunas'; b.lunasDate=tgl; b.lunasPayKey=pay;
    b.lunasBy=CURRENT_USER?CURRENT_USER.name:''; b.lunasAt=Date.now();
  });
  save(); render();
}
/* Salah tanggal / salah metode pelunasan diperbaiki dengan mengembalikannya ke
   belum lunas lalu melunasi ulang — bukan dengan menyunting diam-diam, supaya
   report hari yang salah ikut kembali benar. */
function batalLunas(id){
  if(!confirm('Kembalikan bon ini ke status BELUM LUNAS?\n\nPelunasannya akan hilang dari Report Daily tanggal tersebut.')) return;
  (DB.piutang||[]).forEach(b=>{
    if(b.id!==id) return;
    b.status='open'; b.lunasDate=''; b.lunasPayKey=''; b.lunasBy=''; b.lunasAt=0;
  });
  save(); render();
}
function hapusBon(id){
  if(!confirm('Hapus catatan bon ini?\n\nSelisih Report Daily tanggal billnya akan kembali tidak terjelaskan.')) return;
  DB.piutang=(DB.piutang||[]).filter(b=>b.id!==id);
  if(BON_EDIT===id) BON_EDIT=null;   // jangan tinggalkan form menunjuk bon yang sudah tidak ada
  save(); render();
}
/* Nama owner dibuang dari DAFTAR PILIHAN saja. Bon yang terlanjur memakai nama
   itu sengaja dibiarkan utuh — hutangnya tetap ada walaupun namanya tidak
   dipakai lagi untuk input baru. Dirujuk lewat indeks, bukan nama, supaya
   tanda kutip pada nama tidak pernah bisa merusak atribut onclick. */
function hapusOwner(i){
  const nama=(DB.owners||[])[i];
  if(!nama) return;
  if(!confirm('Hapus "'+nama+'" dari daftar owner?\n\nBon yang sudah terlanjur atas nama itu TIDAK ikut terhapus.')) return;
  DB.owners.splice(i,1);
  save(); render();
}

/* ============ 1c. COMPLIMENT ============
   Di luar kalkulasi metode pembayaran: ini catatan SIAPA yang merelakan omset
   dan untuk apa. PIC-nya ditarik dari akun Office ber-Tim/Keterangan
   Marketing/Office/Event, ditambah "Tamu" yang bukan orang — compliment untuk
   tamu umum tidak boleh membebani realisasi siapa pun. */
let compDate=todayISO();
let COMP_ROSTER=null, COMP_ROSTER_ERR='';
/* Peta Tim/Keterangan MENTAH dari Office (kunci '#id' dan '@nama' → teks apa
   adanya), diisi berbarengan dengan COMP_ROSTER dari balasan yang sama.
   Dipisah karena COMP_ROSTER sudah TERSARING: ia hanya menyimpan divisi yang
   dikenal COMP_DIV, jadi akun ber-keterangan "kasir floor" tersimpan sebagai
   divs:['kasir'] — persis sama dengan kasir murni, tidak bisa dibedakan lagi.
   Penyaringan Performa Kasir butuh teks aslinya. Lihat kasirMurni(). */
let KET_MAP=null;
function ambilRoster(){
  if(COMP_ROSTER!==null) return Promise.resolve(COMP_ROSTER);
  return fetch('../../account-api-mysql/api.php',{method:'POST',redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'listDivisiRoster'})})
    .then(r=>r.json())
    .then(j=>{
      if(!j||!j.ok||!Array.isArray(j.members)) throw new Error(j&&j.error||'balasan tidak dikenal');
      /* `divs` (JAMAK) sejak Office boleh memberi satu orang lebih dari satu
         tim. Sebelumnya cuma `div` = kecocokan PERTAMA menurut urutan COMP_DIV,
         jadi orang ber-keterangan "Kasir, Marketing" tercatat sebagai marketing
         saja — dan hilang dari daftar PIC compliment yang khusus kasir tanpa
         ada yang bisa menebak sebabnya. `div` dipertahankan untuk tampilan
         ringkas (chip di tabel) dan data lama. */
      /* Diisi SEBELUM penyaringan di bawah, dan tanpa membuang yang nonaktif:
         ini kamus keterangan, bukan daftar orang yang boleh dipilih. */
      KET_MAP={};
      j.members.forEach(u=>{
        const teks=String(u.keterangan||'');
        if(u.id!=null&&u.id!=='') KET_MAP['#'+u.id]=teks;
        const nm=String(u.name||'').trim().toLowerCase();
        if(nm) KET_MAP['@'+nm]=teks;
      });
      COMP_ROSTER=j.members.map(u=>{
        if(u.active===false) return null;
        const ket=String(u.keterangan||'').toLowerCase().split(/[\s,;/]+/);
        const divs=COMP_DIV.filter(dv=>ket.indexOf(dv)>-1);
        if(!divs.length) return null;
        return {id:u.id,name:String(u.name||'').trim(),div:divs[0],divs};
      }).filter(u=>u&&u.name);
      COMP_ROSTER_ERR='';
      return COMP_ROSTER;
    })
    .catch(e=>{ COMP_ROSTER_ERR=e.message||'gagal'; COMP_ROSTER=[]; return COMP_ROSTER; });
}
function compsOn(date){ return (DB.compliments||[]).filter(c=>c.date===date); }
/* Divisi seorang PEMBERI compliment. 'office' DITAMBAHKAN 7 Agustus 2026:
   sebelumnya hanya marketing/event yang bisa dipilih, sehingga compliment yang
   diputuskan manajemen (mis. M. Tegar Junindri, Wandi Pranata, Howandi
   Chandra) tidak punya tempat sama sekali dan terpaksa dicatat sebagai "Tamu"
   — yang artinya tidak ada seorang pun tercatat sebagai pemberinya.

   Namanya SENGAJA tidak ditulis di kode: daftarnya ikut Tim/Keterangan akun
   Office, jadi orang baru muncul sendiri dan orang yang keluar hilang sendiri.
   Daftar nama di kode akan basi tanpa ada yang menyadarinya.

   Pemberi ber-divisi 'office' tidak memotong realisasi siapa pun — ia tidak
   punya baris di DB.employees.marketing/event, jadi tidak ada target yang bisa
   dipotong. Catatannya tetap ada, dan itu memang yang dibutuhkan. */
function divPemberi(u){
  const d=(u&&u.divs)||[(u&&u.div)||''];
  return d.indexOf('marketing')>-1?'marketing'
       :(d.indexOf('event')>-1?'event'
       :(d.indexOf('office')>-1?'office':''));
}
/* DUA PIC, dua pertanyaan yang berbeda (permintaan user 5 Agustus 2026):
     PIC Kasir   — siapa yang menutup bill-nya di POS. Selalu kasir.
     PIC Pemberi — siapa yang MEMBERIKAN compliment itu (marketing / event).
   Dua-duanya boleh "Tamu". Yang ber-PIC Tamu tidak memotong realisasi siapa
   pun — itulah gunanya: compliment untuk tamu umum memang bukan beban orang.

   Sebelum ini hanya ada satu PIC, jadi compliment yang diputuskan marketing
   tapi ditutup kasir harus dipilih salah satu, dan yang tidak dipilih tidak
   pernah terlihat menanggungnya. */
let COMP_EDIT='';   // id catatan yang sedang diubah; '' = sedang menambah baru
function compById(id){ return (DB.compliments||[]).find(c=>c.id===id)||null; }
function editCompliment(id){
  const c=compById(id); if(!c) return;
  // Catatan tanggal lain: pindahkan dulu tanggal aktifnya, kalau tidak formnya
  // terisi tapi daftarnya menampilkan hari yang berbeda.
  COMP_EDIT=id; compDate=c.date; render(); window.scrollTo(0,0);
}
function batalEditCompliment(){ COMP_EDIT=''; render(); }

/* ---- PENCOCOKAN KE REPORT DAILY (7 Agustus 2026) ----
   Compliment dan Member Deposit sama-sama "metode pembayaran" di Report Daily
   yang tidak membawa uang masuk: barangnya keluar, bill-nya ditutup tanpa
   setoran. Karena itu total catatan Compliment hari itu HARUS sama dengan
   POS Compliment + POS Member Deposit hari yang sama.

   Sebelum ini tidak ada satu layar pun yang membandingkan keduanya, jadi
   catatan yang kurang satu baris baru ketahuan saat rekap bulanan — kalau
   ketahuan sama sekali. Yang membuatnya berbahaya: selisihnya selalu berarti
   ada barang keluar yang tidak dibebankan ke PIC mana pun.

   Yang dipakai angka POS, bukan Actual. Actual itu uang yang benar-benar ada,
   dan compliment memang tidak pernah punya uangnya — membandingkan ke sana
   akan selalu selisih sebesar nilainya sendiri. Toleransi Rp5.000 yang berlaku
   di Report Daily TIDAK dipakai di sini: itu toleransi untuk uang yang
   berpindah antar metode, sedangkan ini dua catatan atas kejadian yang sama
   persis — kalau beda, memang ada baris yang belum diinput. */
function angkaRD(date, totalComp){
  const rec=repOf(date);
  const comp=repPay(rec,'compliment').pos;
  const dep=repPay(rec,'member_dep').pos;
  const total=comp+dep;
  const selisih=num(totalComp)-total;
  return { ada:!!rec, comp, dep, total, catat:num(totalComp), selisih, cocok:!!rec && selisih===0 };
}
function kartuCocokRD(rd){
  if(!rd.ada) return `<div class="notice info">ℹ️ <b>Report Daily tanggal ini belum diisi.</b> Total compliment di bawah belum bisa dicocokkan. Isi Compliment &amp; Member Deposit di menu <b>Report Daily</b>, lalu angkanya harus sama persis dengan total di sini.</div>`;
  if(rd.cocok) return `<div class="notice ok">✓ Cocok dengan Report Daily — Compliment ${fmtRp(rd.comp)} + Member Deposit ${fmtRp(rd.dep)} = <b>${fmtRp(rd.total)}</b>.</div>`;
  const kurang=rd.selisih<0;
  return `<div class="notice bad">⚠ <b>Tidak cocok dengan Report Daily.</b> Catatan di halaman ini <b>${fmtRp(rd.catat)}</b>, sedangkan POS Compliment ${fmtRp(rd.comp)} + Member Deposit ${fmtRp(rd.dep)} = <b>${fmtRp(rd.total)}</b> — ${kurang
      ? `masih ada ${fmtRp(-rd.selisih)} yang belum ditulis catatannya di sini, jadi barang segitu keluar tanpa PIC yang menanggungnya`
      : `catatan di sini kelebihan ${fmtRp(rd.selisih)} dibanding angka mesin kasir`}. Perbaiki salah satunya sebelum bulan ditutup.</div>`;
}

          <td>${!c.pemberiName||c.pemberiDiv==='tamu'?'<span class="chip">Tamu</span>':`${esc(c.pemberiName)} <span class="muted" style="font-size:11px">· ${esc(c.pemberiDiv)}</span><div style="margin-top:3px">${

    </div>`;
  // Total hidup: dijumlah ulang tiap ketikan di ketiga kotak angka.
  const hitungTotal=()=>{
    const sub=num(document.getElementById('c_sub').value);
    const tax=num(document.getElementById('c_tax').value);
    const svc=num(document.getElementById('c_svc').value);
    document.getElementById('c_total').innerHTML =
      `Total compliment: <b class="mono">${fmtRp(sub+tax+svc)}</b>` +
      `<span class="muted" style="font-size:12px"> &nbsp;(sub total ${fmtRp(sub)} + tax ${fmtRp(tax)} + service ${fmtRp(svc)})</span>` +
      `<br><span class="muted" style="font-size:12px">Yang memotong realisasi: <b>${fmtRp(sub)}</b> — tax &amp; service charge bukan omset siapa pun. Langsung berlaku untuk <b>PIC Kasir</b>; untuk <b>PIC Pemberi</b> menunggu persetujuan di Performa.</span>`;
    return sub+tax+svc;
  };
  ['c_sub','c_tax','c_svc'].forEach(id=>document.getElementById(id).addEventListener('input',hitungTotal));
  hitungTotal();
  const batal=document.getElementById('c_batal');
  if(batal) batal.addEventListener('click',batalEditCompliment);
  document.getElementById('c_add').addEventListener('click',()=>{
    const nama=(document.getElementById('c_nama').value||'').trim();
    const subTotal=num(document.getElementById('c_sub').value);
    const tax=num(document.getElementById('c_tax').value);
    const service=num(document.getElementById('c_svc').value);
    const nominal=subTotal+tax+service;
    const picId=document.getElementById('c_pic').value;
    const pemberiId=document.getElementById('c_pemberi').value;
    const box=document.getElementById('c_err');
    const errs=[];
    if(!nama) errs.push('Nama compliment wajib diisi.');
    if(nominal<=0) errs.push('Sub total, tax, dan service charge tidak boleh nol semua.');
    if(errs.length){ box.innerHTML='<div class="notice bad">⚠ '+errs.join(' ')+'</div>'; return; }
    const u=kasirRoster.find(x=>x.id===picId);
    const pv=pemberiRoster.find(x=>x.id===pemberiId);
    /* `nominal` TETAP disimpan sebagai jumlahnya, bukan dihitung ulang di tempat
       lain: rekap bulanan, laporan WA, dan kartu rincian semuanya membaca field
       itu. Yang memotong realisasi PIC bukan angka ini melainkan subTotal —
       lihat compPotong(). */
    const isi={
      date:compDate, nama, subTotal, tax, service, nominal,
      picName:u?u.name:'Tamu', picOfficeId:u?u.id:'', picDiv:u?'kasir':'tamu',
      pemberiName:pv?pv.name:'Tamu', pemberiOfficeId:pv?pv.id:'', pemberiDiv:pv?divPemberi(pv):'tamu'
    };
    DB.compliments=DB.compliments||[];
    const lama=COMP_EDIT?compById(COMP_EDIT):null;
    if(lama){
      /* Yang TIDAK ditimpa: id, siapa yang mencatat, dan kapan. Baris yang
         diperbaiki tetap milik pencatat aslinya — mengganti `by` dengan nama
         orang yang mengoreksi menghapus jejak siapa yang sebenarnya
         memberikan compliment itu. `alasan` catatan lama juga dipertahankan. */
      /* Putusan potong/tidak DIPERTAHANKAN selama pemberinya orang yang sama.
         Kalau pemberinya diganti, putusannya ikut direset ke 'menunggu':
         keputusan itu diambil atas nama orang lain, dan membiarkannya menempel
         berarti memotong realisasi orang yang tidak pernah diputuskan. */
      const gantiPemberi = String(lama.pemberiOfficeId||'')!==String(isi.pemberiOfficeId||'')
                        || String(lama.pemberiName||'')!==String(isi.pemberiName||'');
      const putusanLama = gantiPemberi ? null : {
        pemberiStatus: lama.pemberiStatus, putusOleh: lama.putusOleh, putusAt: lama.putusAt
      };
      Object.assign(lama, isi);
      if(putusanLama) Object.assign(lama, putusanLama);
      else { lama.pemberiStatus='menunggu'; lama.putusOleh=''; lama.putusAt=0; }
      lama.ubahOleh=CURRENT_USER?CURRENT_USER.name:'';
      lama.ubahAt=Date.now();
      COMP_EDIT='';
    }else{
      // pemberiStatus mulai 'menunggu' — sisi pemberi tidak pernah memotong
      // sebelum ada yang memutuskannya di halaman Performa.
      DB.compliments.push(Object.assign({
        id:'c'+Date.now().toString(36)+Math.floor(Math.random()*1e4), alasan:'',
        pemberiStatus:'menunggu', putusOleh:'', putusAt:0,
        by:CURRENT_USER?CURRENT_USER.name:'', at:Date.now()
      }, isi));
    }
    save(); render();
  });
  // Roster belum ada → ambil sekali, lalu gambar ulang supaya dropdown terisi.
  if(COMP_ROSTER===null) ambilRoster().then(()=>{ if(CURRENT==='compliment') render(); });
}
function hapusCompliment(id){
  if(!confirm('Hapus catatan compliment ini?')) return;
  if(COMP_EDIT===id) COMP_EDIT='';   // jangan tinggalkan form menunjuk baris yang sudah tiada
  DB.compliments=(DB.compliments||[]).filter(c=>c.id!==id);
  save(); render();
}

/* Compliment memotong REALISASI PIC (keputusan 27 Juli 2026), bukan targetnya.
   Yang ber-PIC "Tamu" tidak memotong siapa pun. Pencocokan ke PIC kompas lewat
   officeUserId dulu — nama bisa berubah ejaannya di Office, id tidak. */
function compsBulan(monthKey){ return (DB.compliments||[]).filter(c=>monthKeyOf(c.date)===monthKey); }
/* Daftar compliment yang membebani satu PIC. Dipisah dari compPic() supaya
   halaman Performa bisa memajang rinciannya — angka potongan saja bikin PIC
   bertanya-tanya "dipotong apa", dan jawabannya cuma ada di halaman lain. */
/* Penyaringnya dipisah dari sumber daftarnya supaya rentang mana pun bisa
   dipakai — sebulan (compListPic) maupun rentang aktif yang bisa cuma sehari
   (compListPicRentang). Tanpa pemisahan ini, halaman Performa versi harian
   akan memotong realisasi memakai compliment SEBULAN penuh. */
/* Berapa yang dipotong sebuah compliment dari realisasi PIC-nya.
   SUB TOTAL saja (permintaan user 5 Agustus 2026), bukan totalnya: tax dan
   service charge bukan omset siapa pun — keduanya titipan yang memang tidak
   pernah diakui sebagai pencapaian, jadi memotongnya berarti menghukum PIC
   untuk uang yang tak pernah jadi haknya.

   Catatan LAMA tidak punya rincian; nominal-nya tetap dipakai apa adanya
   supaya angka bulan-bulan yang sudah ditutup tidak berubah surut. */
function compPotong(c){ return c && c.subTotal!=null ? num(c.subTotal) : num(c&&c.nominal); }
/* Cocok kalau `emp` adalah PIC KASIR-nya ATAU PEMBERI-nya.
   Satu compliment sekarang menyebut dua orang, dan dua-duanya menanggung:
   kasir karena barang keluar lewat mejanya, marketing/event karena dialah yang
   memutuskan memberikannya. Keduanya dinilai di halaman Performa yang berbeda,
   jadi tidak ada satu angka pun yang terpotong dua kali di tempat yang sama.
   Sisi yang ber-PIC "Tamu" tidak menunjuk siapa pun, jadi tidak pernah cocok. */
function compCocok(emp, div, oid, pnama){
  if(!emp || div==='tamu') return false;
  if(emp.officeUserId && oid) return oid===emp.officeUserId;
  if(!pnama) return false;
  return String(pnama).trim().toLowerCase()===String(emp.name||'').trim().toLowerCase();
}
function compIsPicKasir(c, emp){ return compCocok(emp, c.picDiv, c.picOfficeId, c.picName); }
function compIsPemberi(c, emp){ return compCocok(emp, c.pemberiDiv, c.pemberiOfficeId, c.pemberiName); }
/* ---- APPROVAL SISI PEMBERI (7 Agustus 2026) ----
   Sisi PIC KASIR tetap memotong otomatis: barang benar-benar keluar lewat
   mejanya, tidak ada yang perlu diputuskan. Sisi PEMBERI (marketing/event)
   TIDAK lagi langsung memotong — sering kali compliment memang alat kerja
   marketing untuk menutup deal, dan memotongnya otomatis berarti menghukum
   orang atas biaya yang justru menghasilkan omset. Sekarang harus diputus
   dulu di halaman Performa Marketing/Event.

   Catatan LAMA (tanpa field ini) dibaca sebagai 'menunggu', jadi potongannya
   ikut lepas surut. Disengaja: memilih 'potong' sebagai default berarti
   menerapkan keputusan yang belum pernah diambil siapa pun, dan angka yang
   sudah telanjur memotong itulah yang dikeluhkan. Bulan lama bisa dirapikan
   dengan memutuskannya satu per satu di halaman Performa. */
function compStatusPemberi(c){
  const s=String((c&&c.pemberiStatus)||'menunggu');
  return (s==='potong'||s==='tidak')?s:'menunggu';
}
/* Compliment yang membebani `emp`. Sisi pemberi cuma ikut kalau sudah
   DIPUTUS potong. */
function compFilterPic(list, emp){
  if(!emp) return [];
  return list.filter(c=>
    compIsPicKasir(c, emp) ||
    (compIsPemberi(c, emp) && compStatusPemberi(c)==='potong'));
}
/* Semua compliment yang MENYEBUT emp sebagai pemberi, apa pun status
   putusannya. Dipakai kartu approval di Performa — yang sudah diputus pun
   tetap tampil supaya keputusannya bisa dibalik. */
function compListPemberi(list, emp){
  if(!emp) return [];
  return list.filter(c=>compIsPemberi(c, emp));
}
function putusCompliment(id, status){
  const c=compById(id); if(!c) return;
  c.pemberiStatus = status==='potong'?'potong':'tidak';
  c.putusOleh = CURRENT_USER?CURRENT_USER.name:'';
  c.putusAt = Date.now();
  save(); render();
}
function compListPic(monthKey, emp){ return compFilterPic(compsBulan(monthKey), emp); }
function compPic(monthKey, emp){
  return compListPic(monthKey, emp).reduce((s,c)=>s+compPotong(c),0);
}
/* Versi yang mengikuti saklar Harian/Bulanan. Dipakai halaman analitik. */
function compListPicRentang(emp){ return compFilterPic(compsRentang(), emp); }
function compPicRentang(emp){ return compListPicRentang(emp).reduce((s,c)=>s+compPotong(c),0); }

/* Kartu keputusan potong/tidak untuk compliment yang PEMBERI-nya PIC divisi
   ini. Ditaruh di halaman Performa, bukan di halaman Compliment: yang berhak
   memutuskan bukan kasir yang menginputnya, dan halaman Performa memang cuma
   terbuka untuk level penuh.

   Yang sudah diputus TETAP ditampilkan. Kartu yang cuma memajang antrean
   membuat keputusan yang keliru tidak bisa dibatalkan tanpa menghapus lalu
   menginput ulang catatannya — dan itu menghapus jejak siapa pencatat asalnya. */
function kartuApprovalCompliment(divi, list){
  const rentang=compsRentang();
  const rows=[];
  list.forEach(e=>compListPemberi(rentang, e).forEach(c=>{
    if(!rows.some(x=>x.c.id===c.id)) rows.push({c, emp:e});
  }));
  const labDiv=divi==='marketing'?'Marketing':'Event';
  if(!rows.length){
    return `<div class="card"><h3>🎁 Persetujuan Potongan Compliment</h3>
      <div class="empty" style="padding:18px 10px">Tidak ada compliment yang diberikan PIC ${esc(labDiv)} pada periode ini.</div></div>`;
  }
  rows.sort((a,b)=>a.c.date<b.c.date?-1:1);
  const menunggu=rows.filter(x=>compStatusPemberi(x.c)==='menunggu');
  const dipotong=rows.filter(x=>compStatusPemberi(x.c)==='potong');
  const nilaiTunggu=menunggu.reduce((s,x)=>s+compPotong(x.c),0);
  const nilaiPotong=dipotong.reduce((s,x)=>s+compPotong(x.c),0);
  const chip=st=>st==='potong'?'<span class="chip bad">Dipotong</span>'
              :st==='tidak'?'<span class="chip ok">Tidak dipotong</span>'
              :'<span class="chip">Menunggu</span>';
  const isi=rows.map(({c,emp})=>{
    const st=compStatusPemberi(c);
    const rinci=(c.subTotal!=null||c.tax!=null||c.service!=null)
      ? `sub ${fmtRp(num(c.subTotal))} + tax ${fmtRp(num(c.tax))} + svc ${fmtRp(num(c.service))}`
      : esc(c.alasan||'—');
    return `<tr>
      <td>${esc(c.date)}</td>
      <td><b>${esc(c.nama||'—')}</b><div class="muted" style="font-size:11px">${rinci}</div></td>
      <td>${esc(emp.name)}</td>
      <td class="num mono">${fmtRp(compPotong(c))}</td>
      <td>${chip(st)}${c.putusOleh?`<div class="muted" style="font-size:11px">${esc(c.putusOleh)}</div>`:''}</td>
      <td><div class="mini-actions">
        <button class="btn btn-xs ${st==='potong'?'btn-danger':''}" onclick="putusCompliment('${esc(c.id)}','potong')" title="Potong realisasi ${esc(emp.name)} sebesar ${fmtRp(compPotong(c))}">Potong</button>
        <button class="btn btn-xs" onclick="putusCompliment('${esc(c.id)}','tidak')" title="Biarkan realisasi ${esc(emp.name)} utuh">Tidak</button>
      </div></td>
    </tr>`;
  }).join('');
  return `<div class="card">
    <h3>🎁 Persetujuan Potongan Compliment</h3>
    <div class="card-sub">Compliment yang <b>diberikan</b> PIC ${esc(labDiv)} tidak memotong realisasinya sampai diputus di sini. ${
      menunggu.length?`<b>${menunggu.length} menunggu keputusan</b> senilai ${fmtRp(nilaiTunggu)}.`:'Semua sudah diputus.'} Yang sudah dipotong ${fmtRp(nilaiPotong)} — itulah yang muncul di kotak Realisasi &amp; Rincian Compliment di atas.</div>
    <div class="tbl-wrap"><table>
      <thead><tr><th style="width:110px">Tanggal</th><th>Compliment</th><th style="width:150px">Pemberi</th><th class="num" style="width:140px">Nilai Potong</th><th style="width:140px">Status</th><th style="width:130px"></th></tr></thead>
      <tbody>${isi}</tbody>
    </table></div>
    <div class="helper" style="margin-top:10px">Angkanya <b>Sub Total</b> — tax &amp; service charge tidak pernah ikut dipotong. Keputusan boleh diubah kapan saja; realisasi langsung ikut berubah.</div>
  </div>`;
}

/* ---- Alur omset: KASIR DULU, event MEMOTONG (keputusan 30 Juli 2026) ----
   Ini pembalikan arah dari aturan 28 Juli. Baca ini sebelum mengubah apa pun
   di bawah, karena dua model itu memakai bentuk data yang sama persis dan
   angkanya cuma bisa dibedakan dari cara membacanya.

   MODEL SEKARANG. Semua uang masuk lewat meja kasir — termasuk tiket event dan
   tagihan gathering. Jadi yang diisi lebih dulu di Breakdown adalah omset per
   KASIR, dan totalnya sendiri sudah harus sama dengan omset net hari itu.
   Marketing & event tidak menambah total apa pun: barisnya MEMOTONG omset
   kasir yang kena shift event tersebut.

   Centang yang dulu bernama "Ticketing" sejak 30 Juli 2026 DITULIS "Free Entry"
   di layar. Yang berubah hanya labelnya; nama fieldnya tetap `r.tiket` dan
   artinya tetap sama (potongan 50%), jadi tidak ada migrasi data. Komentar di
   bawah memakai istilah baru.

     • baris TANPA centang Free Entry → SELURUH nominalnya dipotong dari kasir
       shift, dan seluruhnya diakui untuk PIC.
     • baris DICENTANG Free Entry     → hanya SEPARUH yang dipotong dari kasir
       shift, dan separuh itu juga yang diakui untuk PIC. Separuh sisanya tetap
       milik kasir — tiketnya dijual atas nama event, tapi yang melayani
       penjualan dan tamunya kasir.

   Karena potongan kasir = porsi PIC (uang yang sama, cuma berpindah pemilik),
   jumlah seluruh realisasi tetap sama dengan omset net. Itu invariannya, dan
   itu yang harus tetap benar sesudah perubahan apa pun di bawah.

   MODEL LAMA (28 Juli 2026, sudah tidak dipakai): kasir diisi walk-in MURNI,
   ketiga section dijumlahkan harus sama dengan net, dan separuh omset free entry
   DITAMBAHKAN ke kasir shift sebagai bagi hasil. Persis kebalikan arah
   potongannya.

   Data lama TIDAK dimigrasi — bentuknya memang tidak berubah, hanya artinya.
   Konsekuensinya disengaja dan sudah diterima (preseden yang sama diambil saat
   aturan 28 Juli naik): hari-hari yang diisi dengan model lama akan tampak
   kurang balance di Breakdown, karena omset kasirnya belum memuat event. Hari
   seperti itu diberi peringatan sendiri di halaman Breakdown supaya orang tahu
   harus mengisi ulang omset kasirnya, bukan mengira angkanya rusak.

   Semua halaman WAJIB lewat fungsi-fungsi di bawah. Sempat ada empat tempat
   berbeda yang menjumlahkan r.amount sendiri-sendiri; kalau satu terlewat,
   realisasi orang yang sama beda antara Performa dan Ranking. */
/* PEMBAGIAN 50/50 DIHAPUS (1 Agustus 2026).
   Marketing, event, dan ticketing sekarang diakui PENUH untuk PIC-nya, dan
   penuh pula yang dipotong dari kasir shift. Tidak ada lagi baris yang cuma
   separuh.

   Centang "Free Entry" (nama field `r.tiket`) yang dulu menentukan pembagian
   itu SUDAH TIDAK DIPAKAI dan kotaknya dibuang dari layar — membiarkannya
   tampil sementara ia tidak lagi memengaruhi apa pun cuma membuat orang
   mengira omsetnya masih dibagi dua.

   Field-nya sendiri TIDAK dihapus dari data lama: membacanya sekarang
   menghasilkan angka penuh, jadi hari-hari lama otomatis ikut aturan baru
   tanpa migrasi. Invariannya tetap sama seperti sebelumnya — potongan kasir =
   porsi PIC (uang yang sama, cuma berpindah pemilik), jadi jumlah seluruh
   realisasi tetap sama dengan omset net. */

/* ATURAN 7 AGUSTUS 2026 — marketing dan event TIDAK LAGI SAMA.
   Sampai kemarin kedua section memakai satu rumus yang sama persis. Sekarang
   tidak, dan itu sebabnya `divi` WAJIB dikirim ke porsiPic(): memanggilnya
   tanpa divi akan diam-diam memberi PIC event dua kali lipat haknya, tanpa
   error apa pun dan tanpa ada satu halaman pun yang melaporkannya.

   MARKETING — nilai event punya tiga komponen, dan ketiganya diakui:
     realisasi PIC   = omset + tax + service
     dipotong kasir  = omset SAJA
   Kenapa yang dipotong hanya omsetnya: omset kasir di Section A itu angka NET
   (tax & service charge memang di luar omset, lihat netOf/taxSvcOf). Memotong
   tax & service dari sana berarti mengurangi realisasi kasir dengan uang yang
   tidak pernah jadi omsetnya — dan Breakdown tidak akan pernah balance lagi.

   EVENT — diakui SEPARUH, dan kasir tidak dipotong sama sekali:
     realisasi PIC   = omset / 2
     dipotong kasir  = 0
   Event tidak punya kolom tax/service dan tidak punya pengaturan kasir shift:
   kasir tetap dapat perhitungan target penuh atas omset event, tidak ada
   potongan. Konsekuensinya invarian lama (potongan kasir = porsi PIC) SUDAH
   TIDAK BERLAKU untuk event — separuh nilai event sekarang memang sengaja
   diakui dua kali: penuh untuk kasir, separuh untuk PIC event. Itu keputusan
   user, bukan kelalaian; jangan "diperbaiki" dengan mengembalikan potongannya.

   Data lama TIDAK dimigrasi, sama seperti dua perubahan aturan sebelumnya:
   bentuk datanya tidak berubah, hanya cara membacanya. Baris event lama yang
   terlanjur menyimpan `shift` dibiarkan — potonganHari() tidak lagi membacanya. */
/* ---- OPEN BILL (11 Agustus 2026) ----
   Pesanan tambahan tamu event yang dibayar langsung ke kasir, di luar paket
   yang disepakati marketing. Dicentang per baris event, punya omset/tax/service
   sendiri, dan menyebut kasir yang melayaninya.

   Aturannya diputuskan user 11 Agustus 2026 dan sengaja beda dari nominal
   paket: nominal Open Bill DIAKUI untuk PIC event/marketing, tapi kasir
   TIDAK dipotong sepeser pun. Jadi ia memang diakui dua kali — penuh untuk
   kasir (uangnya sudah ada di omset brutonya) dan penuh untuk PIC. Sama
   polanya dengan aturan 50% Section C: itu keputusan, bukan kelalaian, jangan
   "diperbaiki" dengan menambahkannya ke potongKasir().

   Kasir yang dipilih tidak mendapat penambahan angka apa pun — uangnya sudah
   masuk omset brutonya hari itu. Yang ia dapat adalah PENGAKUAN bernama:
   Open Bill event X sekian, muncul di kartu Efek ke Realisasi Kasir dan di
   Performa Kasir. Menambahkannya lagi ke realisasi berarti satu uang dihitung
   dua kali di sisi kasir juga. */
function obAktif(r){ return !!(r && r.ob); }
function obTotal(r){ return obAktif(r) ? num(r.obAmount)+num(r.obTax)+num(r.obService) : 0; }
function porsiPic(r, divi){
  if(divi==='event') return Math.round(num(r.amount)/2)+obTotal(r);
  return num(r.amount)+num(r.tax)+num(r.service)+obTotal(r);
}
/* Yang benar-benar dipotong dari kasir shift. Dipisah dari porsiPic() karena
   sejak 7 Agustus 2026 keduanya bukan angka yang sama lagi (lihat di atas).
   Hanya dipakai baris MARKETING — event tidak memotong siapa pun.
   Open Bill TIDAK ikut di sini, dengan sengaja (lihat obTotal). */
function potongKasir(r){ return num(r.amount); }
/* Open Bill yang diakui atas nama satu kasir pada satu hari, dari kedua
   section. Angka ini TIDAK mengubah realisasi — ia keterangan, lihat obTotal. */
function openBillHari(d,kasirId){
  return openBillList(d).reduce((s,x)=>s+(x.kasirId===kasirId?x.total:0),0);
}
/* Rincian Open Bill satu hari: [{kasirId,eventName,total,divi}]. Dipakai
   kartu Efek ke Realisasi Kasir di sini dan Performa Kasir di modul Cashier. */
function openBillList(d){
  const out=[];
  [['marketing','marketing'],['event','event']].forEach(([key,divi])=>{
    ((d.bd&&d.bd[key])||[]).forEach(r=>{
      if(!obAktif(r)) return;
      const t=obTotal(r); if(t<=0 && !r.obKasirId) return;
      out.push({kasirId:r.obKasirId||'', eventName:r.eventName||'', total:t, divi});
    });
  });
  return out;
}
/* Potongan yang ditanggung kasir karena SATU baris event, dibagi per SHIFT —
   bukan rata ke semua kasir yang masuk hari itu. Kasir yang masuk tapi tidak
   kebagian shift event tersebut tidak ikut dipotong.

   Yang dipotong = porsiPic(r), yaitu uang yang sama yang diakui untuk PIC.
   Bukan kebetulan: omsetnya sudah tercatat penuh di baris kasir, jadi memotong
   lebih kecil dari yang diakui PIC berarti uang yang sama dihitung dua kali.

   DW TIDAK IKUT MEMBAGI potongan ini — beda dari aturan 28 Juli yang lama, dan
   ini perbedaan yang paling mudah salah kalau kodenya disamakan begitu saja.
   Alasannya: section kasir di Breakdown hanya punya baris untuk kasir TETAP,
   jadi setoran DW pun ikut tercatat di baris kasir tetap yang menaunginya.
   Kalau DW dijadikan pembagi, sebagian potongan tidak dibebankan ke siapa pun
   sementara omsetnya tetap ada di baris kasir tetap — realisasi kasir jadi
   lebih besar dari yang seharusnya dan totalnya melebihi omset net. Jumlah DW
   tetap disimpan (`r.dw`) karena berguna sebagai catatan operasional shift,
   tapi tidak lagi memengaruhi angka.

   Baris yang shift-nya belum diisi mengembalikan pembagi 0 → potongannya tidak
   dibebankan ke siapa pun. UI menandainya merah supaya ketahuan, daripada
   diam-diam membebankannya ke orang yang tidak bertugas. */
function potonganBaris(r){
  const total=potongKasir(r);
  const ids=Array.isArray(r.shift)?r.shift.filter(Boolean):[];
  const dw=Math.max(0,num(r.dw));
  const pembagi=ids.length;
  if(total<=0||pembagi<=0) return {per:0,ids:[],dw,pembagi,total:Math.max(total,0)};
  return {per:Math.round(total/pembagi),ids,dw,pembagi,total};
}
/* Total potongan yang ditanggung satu kasir tetap dari seluruh event pada satu
   hari. Dipakai apa adanya oleh Performa Kasir, Ranking, dan Analytics. */
/* Sejak 7 Agustus 2026 hanya baris MARKETING yang dibaca di sini. Section
   event tidak lagi memotong kasir sama sekali (lihat porsiPic), jadi
   memasukkan d.bd.event ke perulangan ini akan menghidupkan kembali potongan
   yang sudah sengaja dihapus — termasuk pada baris event lama yang `shift`-nya
   terlanjur tersimpan. Berlaku surut ke bulan-bulan yang sudah lewat: realisasi
   kasir pada hari yang ada event-nya jadi lebih besar dari sebelumnya. */
function potonganHari(d,kasirId){
  let s=0;
  (d.bd?.marketing||[]).forEach(r=>{
    const b=potonganBaris(r);
    if(b.ids.indexOf(kasirId)>-1) s+=b.per;
  });
  return s;
}
/* Baris bernominal yang shift-nya belum ditentukan. Dipakai untuk peringatan di
   Breakdown dan Performa Kasir. Filter `r.tiket` yang dulu ada di sini DIHAPUS:
   sekarang setiap baris event memotong kasir, bukan cuma yang free entry, jadi
   semuanya butuh shift. */
function barisTanpaShift(d){
  return (d.bd?.marketing||[])
    .filter(r=>num(r.amount)>0 && potonganBaris(r).pembagi<=0);
}

/* Modal penentuan kasir shift satu baris event — merekalah yang dipotong.
   Namanya masih modalBagiHasil() supaya diff-nya kecil. Mengembalikan lewat callback
   supaya pemanggilnya yang memutuskan kapan menggambar ulang — baris breakdown
   sedang diisi, jadi redraw yang tidak perlu akan merebut fokus.

   `kasirAktif` = daftar kasir yang BOLEH dicentang hari itu, dikirim oleh
   pemanggil. Dulu modal ini selalu memakai seluruh DB.employees.kasir, jadi kasir
   yang sudah dicentang OFF (libur) di Section A tetap ikut muncul dan bisa
   dibebani potongan. Akibatnya fatal dan tidak kelihatan: potongannya dibagi ke
   orang yang omsetnya nol, sementara kartu Efek ke Realisasi Kasir hanya
   menampilkan kasir non-OFF — jadi sebagian potongan lenyap dari rekap. */
function modalBagiHasil(row, labelEvent, simpan, kasirAktif){
  const kasir=Array.isArray(kasirAktif)?kasirAktif:(DB.employees.kasir||[]);
  const sah=new Set(kasir.map(k=>k.id));
  /* Kolom "Jumlah DW Kasir" DIHAPUS dari modal ini (3 Agustus 2026).
     Ia sudah lama tidak memengaruhi angka apa pun — keterangannya sendiri
     berbunyi "catatan operasional saja" — sementara ia berdiri paling atas dan
     mendapat fokus otomatis saat modal dibuka. Akibatnya kotak pertama yang
     dilihat dan diketik orang justru satu-satunya kotak yang tidak
     berpengaruh, sedangkan pilihan kasir yang menentukan pembagian ada di
     bawahnya. Sekarang modal ini menanyakan satu hal saja: siapa kasir yang
     bertugas saat event itu.

     `row.dw` yang sudah tersimpan TIDAK dihapus dari data — ia tidak dibaca
     oleh perhitungan mana pun (lihat potonganBaris), jadi membiarkannya lebih
     aman daripada menulis ulang data lama demi kerapian. */
  let pilih=new Set((Array.isArray(row.shift)?row.shift.filter(Boolean):[]).filter(id=>sah.has(id)));
  // Yang dipotong kolom OMSET saja — tax & service marketing tidak ikut.
  const potong=potongKasir(row);

  const ovl=document.createElement('div');
  ovl.className='ovl';
  ovl.innerHTML=`
    <div class="mdl">
      <div class="mdl-h">
        <h3>Potongan Kasir Shift</h3>
        <div class="sub">${esc(labelEvent||'Event tanpa nama')} · nilai ${fmtRp(num(row.amount))} · dipotong dari kasir <b>${fmtRp(potong)}</b></div>
      </div>
      <div class="mdl-b">
        <div>
          <label style="display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px">Kasir yang bertugas saat event ini</label>
          <div class="helper" style="margin-bottom:2px">Centang kasir yang menginput omset saat event berlangsung — merekalah yang dipotong. Kasir yang masuk hari itu tapi beda shift tidak kena. Kasir yang dicentang <b>OFF</b> di Section A tidak ditampilkan di sini.</div>
          ${kasir.length?`<div class="kslist" id="bh_ks">${kasir.map(k=>`
            <label class="kschip${pilih.has(k.id)?' on':''}" data-id="${esc(k.id)}"><input type="checkbox" ${pilih.has(k.id)?'checked':''}> ${esc(k.name)}</label>`).join('')}</div>`
          :`<div class="empty" style="padding:16px 10px">Tidak ada kasir yang bisa dibebani — semua kasir dicentang OFF (libur) hari ini, atau belum ada kasir terdaftar.</div>`}
        </div>
        <div class="notice info" id="bh_prev" style="margin-top:18px"></div>
      </div>
      <div class="mdl-f">
        <button class="btn btn-ghost" id="bh_batal">Batal</button>
        <button class="btn btn-primary" id="bh_ok">Simpan Pembagian</button>
      </div>
    </div>`;
  document.body.appendChild(ovl);

  const prev=()=>{
    const pembagi=pilih.size;
    const per=pembagi>0?Math.round(potong/pembagi):0;
    const box=ovl.querySelector('#bh_prev');
    box.className='notice '+(pembagi>0?'info':'warn');
    /* Isinya DIBUNGKUS satu elemen blok. `.notice` itu display:flex, jadi
       tiap potongan teks dan tiap penebalan di dalamnya menjadi flex item
       sendiri — hasilnya kalimatnya pecah jadi kolom-kolom sempit yang saling
       bertumpuk, bukan satu paragraf. Terlihat jelas di layar kasir 3
       Agustus 2026. Satu pembungkus = satu flex item = paragraf normal.
       (Tag-nya sengaja tidak ditulis di komentar ini: pemeriksa struktur
       menghitung tag mentah, dan menyebutnya di sini membuat hitungannya
       timpang tanpa ada yang salah di markup-nya.) */
    box.innerHTML = pembagi>0
      ? `<div>${fmtRp(potong)} ÷ ${pembagi} kasir = <b>${fmtRp(per)}</b> dipotong dari masing-masing.<br>
         Nominal itu pindah jadi realisasi <b>${esc(labelEvent||'event ini')}</b>; omset kasir yang sudah diinput tidak diubah, hanya realisasinya yang berkurang.</div>`
      : `<div>⚠ Belum ada kasir yang dicentang. Kalau dibiarkan, potongan ${fmtRp(potong)} tidak dibebankan ke siapa pun — omset yang sama akan terhitung dua kali: sekali di realisasi PIC, sekali di realisasi kasir.</div>`;
  };
  ovl.querySelectorAll('.kschip').forEach(c=>c.addEventListener('click',e=>{
    // Klik pada <label> sudah men-toggle checkbox di dalamnya; jangan
    // di-toggle dua kali. Baca keadaan checkbox-nya saja setelah klik.
    setTimeout(()=>{
      const cb=c.querySelector('input');
      if(cb.checked) pilih.add(c.dataset.id); else pilih.delete(c.dataset.id);
      c.classList.toggle('on',cb.checked);
      prev();
    },0);
  }));
  const tutup=()=>{ try{document.body.removeChild(ovl);}catch(_){} };
  ovl.querySelector('#bh_batal').onclick=tutup;
  ovl.addEventListener('click',e=>{ if(e.target===ovl) tutup(); });
  ovl.querySelector('#bh_ok').onclick=()=>{
    row.shift=[...pilih];   // row.dw dibiarkan apa adanya — lihat catatan di atas
    tutup(); if(simpan) simpan();
  };
  prev();
  // Fokus otomatis ke centang kasir pertama: itu satu-satunya isian di modal ini.
  setTimeout(()=>{ const c=ovl.querySelector('.kschip input'); if(c) c.focus(); },30);
}

/* ============ EVENT HARI ITU, DITARIK DARI MODUL LAIN ============
   Ditambahkan 11 Agustus 2026 atas permintaan user: event yang sudah dibuat
   marketing/event untuk tanggal itu muncul sendiri di Breakdown, lengkap
   dengan nama PIC, nama event, dan nilai yang sudah dihitung marketing —
   supaya orang finance tidak mengetik ulang tiga hal yang sudah ada di modul
   sebelah, dan supaya event yang terlewat tidak diam-diam hilang dari alokasi.

   ENDPOINT-NYA SEMPIT, bukan getAll: `?action=eventsHari&tgl=`. getAll
   memulangkan seluruh database marketing (megabyte, tumbuh tiap bulan) dan
   halaman ini dibuka tiap hari. Lihat catatan panjang di events_hari() pada
   marketing-mysql/lib_marketing_mysql.php.

   Yang ditarik hanya event yang SUDAH JADI — marketing: 'Deal' & 'Event Done';
   event internal: apa pun kecuali yang masih rencana. Penyaringannya dikerjakan
   di server, jadi jangan menyaring ulang di sini dengan daftar status kedua
   yang pasti akan ketinggalan zaman.

   TIDAK PERNAH MELEMPAR, dan tidak pernah membuat halaman kosong. Backend
   marketing/event yang mati tidak boleh membuat orang finance berhenti bisa
   mengalokasikan omset hari itu — paling jauh satu pita peringatan. Pola yang
   sama dengan muatDW() di modul Jadwal. */
const MKT_API='../../marketing-api-mysql/api.php';
const EVT_API='../../event-api-mysql/api.php';
/* Satu tanggal saja yang disimpan: pindah tanggal berarti tarik ulang. Hari
   yang sedang dikerjakan hampir selalu satu, dan cache per-tanggal yang
   menumpuk justru menyimpan angka basi dari marketing yang baru saja direvisi. */
let EVHARI={tgl:null,st:'idle',mk:[],ev:[],galat:'',antre:[]};
/* Nomor gambar-ulang halaman Breakdown. Penarikan event itu asinkron, jadi
   balasannya bisa datang SESUDAH halaman digambar ulang (ganti tanggal, klik
   OFF, simpan). Tanpa penanda ini, penangan milik render lama akan menulis
   `state` lama ke DOM baru — baris yang sudah dibuang hidup lagi, dan angka
   yang baru diketik tertimpa. Tiap render menaikkan angkanya; penangan yang
   nomornya sudah tidak sama diam saja. */
let BD_RENDER=0;
function evhFetch(url,ms){
  const stop=new AbortController(); const jam=setTimeout(()=>stop.abort(),ms||9000);
  return fetch(url,{method:'GET',redirect:'follow',signal:stop.signal})
    .then(r=>{ clearTimeout(jam); return r.text(); })
    .then(t=>{ let j=null; try{ j=JSON.parse(t); }catch(e){}
      if(!j) throw new Error('balasan bukan JSON');
      if(!j.ok) throw new Error(j.error||'ditolak');
      return j.data||{}; });
}
function muatEventHari(tgl,sesudah){
  /* Permintaan yang sedang berjalan TIDAK diulang — tapi penangannya wajib
     ikut diantre. Kalau tidak, halaman yang digambar ulang saat penarikan
     masih jalan akan berhenti selamanya di pita "Mengambil event…", karena
     yang membereskannya cuma penangan milik render yang sudah usang. */
  if(EVHARI.tgl===tgl && EVHARI.st==='muat'){ if(sesudah) EVHARI.antre.push(sesudah); return; }
  if(EVHARI.tgl===tgl && EVHARI.st==='ok'){ if(sesudah) sesudah(); return; }
  EVHARI={tgl,st:'muat',mk:[],ev:[],galat:'',antre:sesudah?[sesudah]:[]};
  const q='?action=eventsHari&tgl='+encodeURIComponent(tgl)+'&t='+Date.now();
  /* allSettled, bukan all: satu modul yang mati tidak boleh menghapus hasil
     modul satunya. Dua-duanya gagal barulah dilaporkan sebagai galat. */
  Promise.allSettled([evhFetch(MKT_API+q),evhFetch(EVT_API+q)]).then(([m,e])=>{
    if(EVHARI.tgl!==tgl) return;   // user sudah pindah tanggal duluan
    const gagal=[];
    if(m.status==='fulfilled'){
      EVHARI.mk=Array.isArray(m.value.events)?m.value.events:[];
      EVHARI.set=m.value.settings||null;
    } else gagal.push('marketing ('+(m.reason&&m.reason.message||'gagal')+')');
    if(e.status==='fulfilled') EVHARI.ev=Array.isArray(e.value.events)?e.value.events:[];
    else gagal.push('event ('+(e.reason&&e.reason.message||'gagal')+')');
    EVHARI.galat=gagal.join(' · ');
    EVHARI.st=gagal.length===2?'galat':'ok';
    const antre=EVHARI.antre.slice(); EVHARI.antre=[];
    antre.forEach(f=>{ try{ f(); }catch(e){} });
  });
}

/* ---- SALINAN RUMUS NILAI EVENT MILIK MODUL MARKETING ----
   Sumbernya `eventFinance()` dkk di deploy/marketing/index.html. Disalin apa
   adanya, bukan dihitung di backend: rumusnya bercabang banyak (timpaan
   manual, tabel harga deal, tabel rincian, pax x harga, pajak inklusif,
   service opsional) dan menulis ulang cabang sebanyak itu di PHP berarti dua
   rumus yang PASTI berbeda diam-diam begitu salah satunya disentuh.

   KALAU RUMUS DI MARKETING BERUBAH, UBAH DI SINI JUGA. Gejala kalau lupa:
   angka "nilai dari Marketing" di baris otomatis beda dari yang tertulis di
   Surat Penawaran, tanpa ada yang salah di kedua layar. Angka ini cuma
   pembanding — ia tidak pernah masuk perhitungan omset sendiri — jadi
   selisihnya tidak merusak apa pun, hanya membingungkan. */
function mkYn(val,def){ if(val&&typeof val==='object'&&'v' in val) return val.v===true; if(typeof val==='boolean') return val; return def===true; }
function mkPaxTeks(v){ const a=String(v==null?'':v).match(/\d+/g); return a?a.reduce((x,n)=>x+(+n||0),0):0; }
function mkFbPax(d,pax){ return mkPaxTeks(d.estimasiOTS)||+d.pax||+pax||0; }
function mkFbHarga(d){ return +d.dealPax||+d.budgetPax||0; }
function mkFbOtomatis(d,pax){ return Math.round(mkFbPax(d,pax)*mkFbHarga(d)); }
function mkFbDitimpa(d){ const v=d.fbManual; return v!==''&&v!=null&&!isNaN(+v); }
function mkFbDealTotal(d){ const rows=d.fbDeal; if(!Array.isArray(rows)) return 0;
  return rows.reduce((a,r)=>a+((+r.jumlah||0)*(+r.harga||0)),0); }
function mkFbDealAktif(d){ return mkYn(d.fbDealOn,false) && mkFbDealTotal(d)>0; }
function mkFbCost(d,pax){
  if(mkFbDitimpa(d)) return +d.fbManual||0;
  if(mkFbDealAktif(d)) return mkFbDealTotal(d);
  const bp=mkFbHarga(d);
  return bp>0 ? Math.round(mkFbPax(d,pax)*bp) : (+d.biayaFB||0);
}
function mkRinciTotal(d){ const rows=d.rincianItem; if(!Array.isArray(rows)) return 0;
  return rows.reduce((a,r)=>a+((r.jenis||'bayar')==='bayar' ? ((+r.jumlah||0)||1)*(+r.harga||0) : 0),0); }
function mkRinciAktif(d){ return mkYn(d.rincianOn,false) && Array.isArray(d.rincianItem) && d.rincianItem.length>0; }
function mkSubtotal(d,pax){
  if(mkRinciAktif(d)) return mkRinciTotal(d);
  return mkFbCost(d,pax)+(+d.sewaVenue||0)+(+d.biayaTeknis||0)+(+d.biayaLain||0);
}
/* Memulangkan tiga angka yang bentuknya PERSIS sama dengan tiga kolom Section
   B: omset (sesudah diskon), service, tax. */
function mkFinance(ev,set){
  const d=(ev&&ev.detail)||{};
  const sub=mkSubtotal(d,ev&&ev.pax);
  const afterDisc=Math.max(0,sub-(+d.diskon||0));
  const svcPct=set&&set.serviceCharge!=null?+set.serviceCharge:5;
  const taxPct=set&&set.pb1!=null?+set.pb1:10;
  const service=mkYn(d.svcApply,true)?Math.round(afterDisc*svcPct/100):0;
  let tax,grand;
  if(mkYn(d.taxInclude,false)){ grand=afterDisc+service; tax=Math.round(grand*taxPct/(100+taxPct)); }
  else { tax=Math.round((afterDisc+service)*taxPct/100); grand=afterDisc+service+tax; }
  return {omset:afterDisc,service,tax,grand};
}

/* ============ 2. BREAKDOWN SUMBER OMSET ============ */
let bdDate=null;
// Penghapus konfirmasi "pembagian tersimpan". Di luar viewBreakdown supaya
// timer dari render sebelumnya tidak menghapus pesan render berikutnya.
let bagiInfoTimer=null;

/* ---- Kalender kustom (bukan input type=date bawaan Chrome). Satu
   implementasi dipakai dua tempat, dibedakan lewat `key`:
     'in' → Tanggal di Input Omset Harian
     'bd' → Pilih Hari di Breakdown
   Semua tanggal terbuka; tanggal yang sudah ada omset diberi titik. */
const CAL_MON=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const CAL_REG={
  in:{ box:'i_cal',  get:()=>inputDate,          set:ds=>{ inputDate=ds; PERIOD=monthKeyOf(ds); } },
  bd:{ box:'bd_cal', get:()=>bdDate||todayISO(), set:ds=>{ bdDate=ds; } },
  rp:{ box:'rp_cal', get:()=>repDate,            set:ds=>{ repDate=ds; PERIOD=monthKeyOf(ds); } },
  cp:{ box:'cp_cal', get:()=>compDate,           set:ds=>{ compDate=ds; PERIOD=monthKeyOf(ds); } },
  bn:{ box:'bn_cal', get:()=>bonDate,            set:ds=>{ bonDate=ds; PERIOD=monthKeyOf(ds); } }
};
const CAL_ST={ in:{open:false,month:null}, bd:{open:false,month:null}, rp:{open:false,month:null}, cp:{open:false,month:null}, bn:{open:false,month:null} };
function ymdLocal(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dateLabel(ds){ const d=new Date(ds+'T00:00:00'); return isNaN(d)?ds:d.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'short',year:'numeric'}); }
function paintCal(key){ const el=document.getElementById(CAL_REG[key].box); if(el) el.innerHTML=calInner(key); }
function calToggle(key){ const s=CAL_ST[key]; s.open=!s.open; if(s.open){ const [y,m]=CAL_REG[key].get().split('-').map(Number); s.month=new Date(y,m-1,1); } paintCal(key); }
function calNav(key,delta){ const s=CAL_ST[key]; if(!s.month) s.month=new Date(); s.month=new Date(s.month.getFullYear(),s.month.getMonth()+(+delta),1); paintCal(key); }
function calPickDay(key,ds){ CAL_ST[key].open=false; CAL_REG[key].set(ds); render(); }
function calQuick(key,off){ const d=new Date(); d.setDate(d.getDate()+off); calPickDay(key,ymdLocal(d)); }
function calInner(key){
  const st=CAL_ST[key], sel=CAL_REG[key].get()||todayISO();
  const btn=`<button type="button" class="calbtn" onclick="calToggle('${key}')"><span>📅 ${dateLabel(sel)}</span><span style="opacity:.55">▾</span></button>`;
  if(!st.open) return btn;
  if(!st.month){ const [yy,mm]=sel.split('-').map(Number); st.month=new Date(yy,mm-1,1); }
  const y=st.month.getFullYear(), mo=st.month.getMonth();
  const startDow=new Date(y,mo,1).getDay(), dim=new Date(y,mo+1,0).getDate(), prevDim=new Date(y,mo,0).getDate();
  const DOW=['MIN','SEN','SEL','RAB','KAM','JUM','SAB'];
  let cells='';
  for(let i=startDow-1;i>=0;i--) cells+=`<button class="calday off" disabled>${prevDim-i}</button>`;
  for(let dd=1;dd<=dim;dd++){
    const ds=`${y}-${String(mo+1).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
    const cls=['calday']; if(ds===todayISO())cls.push('today'); if(ds===sel)cls.push('sel'); if(getDay(ds))cls.push('caldata');
    cells+=`<button class="${cls.join(' ')}" onclick="calPickDay('${key}','${ds}')">${dd}</button>`;
  }
  return btn+`<div class="calback" onclick="calToggle('${key}')"></div><div class="calpop">
    <div class="calhead"><button class="calnav" onclick="calNav('${key}',-1)">‹</button><b>${CAL_MON[mo]} ${y}</b><button class="calnav" onclick="calNav('${key}',1)">›</button></div>
    <div class="calgrid">${DOW.map(d=>`<div class="caldow">${d}</div>`).join('')}${cells}</div>
    <div class="calquick"><button onclick="calPickDay('${key}','${todayISO()}')">Hari Ini</button><button onclick="calQuick('${key}',-1)">Kemarin</button><button onclick="calToggle('${key}')">Tutup</button></div>
  </div>`;
}

function viewBreakdown(){
  CAL_ST.bd.open=false;   // selalu mulai tertutup saat halaman digambar ulang
  const tokenRender=++BD_RENDER;   // lihat catatan di BD_RENDER
  const el=document.getElementById('app-view');
  const days=daysOfMonth(PERIOD);
  if(!bdDate) bdDate=days.length?days[days.length-1].date:todayISO();
  const d=getDay(bdDate);
  const pickBar=`<div class="card" style="display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap">
      <div><h3>Alokasi Sumber Omset</h3><div class="card-sub">Isi omset per kasir dulu — totalnya harus tepat sama dengan Total Omset net harian. <b>Marketing</b> memotong kasir yang kena shift-nya; <b>Event</b> tidak memotong siapa pun.</div></div>
      <div class="field" style="margin:0"><label>Pilih Hari</label><div class="calwrap" id="bd_cal">${calInner('bd')}</div></div>
    </div>`;
  if(!d){
    el.innerHTML=pickBar+`<div class="card"><div class="empty"><div class="big">🧮</div>Belum ada omset untuk <b>${esc(dateLabel(bdDate))}</b>.<br>Input omsetnya dulu di menu <b>Input Omset Harian</b>, atau pilih tanggal lain di atas.</div></div>`;
    return;
  }
  const net=netOf(d);
  d.bd=d.bd||{marketing:[],event:[],kasir:[],self:{amount:0,disc:0}};
  if(!d.bd.self||typeof d.bd.self!=='object') d.bd.self={amount:0,disc:0};
  /* Event otomatis yang sudah dibuang orangnya. Tanpa daftar ini, baris yang
     dihapus akan muncul lagi tiap kali halaman dibuka — dan itu bukan cuma
     menjengkelkan: event yang memang tidak jadi hari itu akan terus-menerus
     minta diisi, sampai orang menyerah dan mengisinya nol supaya diam. */
  if(!Array.isArray(d.bd.abaikan)) d.bd.abaikan=[];
  // pastikan baris kasir ada untuk semua kasir
  const kasirRows=DB.employees.kasir.map(k=>{ const ex=d.bd.kasir.find(r=>r.kasirId===k.id); return ex||{kasirId:k.id,amount:0,disc:0,off:false}; });

  /* Hari yang diisi dengan MODEL LAMA (sebelum 30 Juli 2026): dulu ketiga
     section dijumlahkan sama dengan net, jadi omset kasirnya walk-in murni dan
     belum memuat event. Tandanya khas dan bisa dikenali dengan pasti — kasir
     sendiri kurang dari net, tapi kasir + marketing + event tepat sama dengan
     net. Disebutkan terang-terangan supaya orang tahu harus menaikkan omset
     kasirnya, bukan mengira Breakdown-nya rusak. */
  const ksIsi=kasirRows.reduce((s,r)=>s+(r.off?0:omsetKasir(r)),0)+selfOmset(d);
  const mkEvIsi=[...d.bd.marketing,...d.bd.event].reduce((s,r)=>s+num(r.amount),0);
  const polaLama = mkEvIsi>0 && Math.abs(net-(ksIsi+mkEvIsi))<1 && Math.abs(net-ksIsi)>=1;

  el.innerHTML=pickBar+`
    <div class="card">
      <div class="notice info">ℹ️ Total Omset net <b>${fmtRp(net)}</b>${d.discount>0?` (sesudah diskon ${fmtRp(d.discount)})`:''}. Service charge + tax ${fmtRp(taxSvcOf(d))} tidak masuk breakdown.</div>
      ${(()=>{const cs=compsOn(bdDate).filter(c=>c.picDiv!=='tamu');
        return cs.length?`<div class="notice warn">🎁 Ada ${cs.length} compliment hari ini yang membebani PIC, <b>${fmtRp(cs.reduce((s,c)=>s+compPotong(c),0))}</b> menurut <b>Sub Total</b>-nya (tax &amp; service charge tidak ikut dipotong). Angka ini <b>memotong realisasi</b> PIC bersangkutan di Performa &amp; Ranking — alokasi breakdown di bawah tidak perlu dikurangi sendiri.<br><span style="opacity:.85">${cs.map(c=>`${esc(c.picName)} ${fmtRp(compPotong(c))}`).join(' · ')}</span></div>`:'';})()}

      ${polaLama?`<div class="notice warn">🔄 Hari ini diisi dengan <b>aturan lama</b>: omset kasir masih walk-in murni (${fmtRp(ksIsi)}), belum memuat omset event yang ${fmtRp(mkEvIsi)}. Aturan sekarang: <b>omset kasir sendiri</b> yang harus sama dengan net ${fmtRp(net)}, karena tiket &amp; tagihan event pun lewat meja kasir. Naikkan nominal kasir yang bertugas sampai balance — baris marketing &amp; event di bawah biarkan apa adanya, sekarang perannya memotong.</div>`:''}

      <span class="divlabel ks">Section A — Omset per Kasir <span style="opacity:.75;font-weight:600">(isi ini dulu)</span></span>
      <div class="helper" style="margin-bottom:10px">Semua uang lewat meja kasir, <b>termasuk tiket event dan tagihan gathering</b> — jadi isi omset apa adanya sesuai setoran tiap kasir. Kolom <b>Omset diisi BRUTO</b> (sebelum diskon), lalu diskon bill yang diberikan kasir itu diisi di kolom sebelahnya; yang diakui = bruto − diskon. Total <b>yang diakui</b> inilah yang harus sama dengan omset net; section B dan C di bawah tidak menambah total, tapi <b>memotong</b> dari kasir yang kena shift-nya. Centang OFF jika kasir libur, nominal otomatis nol.</div>
      <div id="bd_ks"></div>

      <span class="divlabel so" style="margin-top:20px">Self Order <span style="opacity:.75;font-weight:600">(tanpa kasir)</span></span>
      <div class="helper" style="margin-bottom:10px">Tamu memesan sendiri lewat <b>barcode</b> di meja — tidak ada kasir yang melayani, jadi nominalnya <b>bukan omset kasir mana pun</b>: tidak masuk Performa Kasir, tidak kena potongan event, tidak ikut menghitung bonus. Uangnya tetap harus dialokasikan di sini supaya harian ini balance. Laporannya digabung ke <b>Analytics</b> dan <b>Dashboard Omset</b>.</div>
      <div id="bd_so"></div>

      <span class="divlabel mk" style="margin-top:24px">Section B — Marketing <span style="opacity:.75;font-weight:600">(memotong kasir shift)</span></span>
      <div class="helper" style="margin-bottom:10px">Nilai event marketing dipecah tiga: <b>Omset</b>, <b>Tax</b>, dan <b>Service</b>. Realisasi PIC di Performa Marketing = <b>ketiganya dijumlahkan</b>. Yang dipotong dari kasir shift <b>hanya kolom Omset</b> — tax &amp; service charge memang di luar omset net, jadi memotongnya dari kasir berarti mengurangi omset yang tidak pernah ada. Tentukan kasir shift-nya lewat tombol potongan di baris tersebut.<br>Event yang sudah berstatus <b>Deal</b> di modul Marketing muncul sendiri di bawah — nama PIC, nama event, dan nilainya sudah terisi; yang perlu diisi tinggal nominal yang benar-benar masuk.</div>
      <div id="bd_src"></div>
      <div id="bd_mk"></div>
      <button class="btn btn-ghost btn-sm" id="add_mk">+ Tambah Data Marketing</button>

      <span class="divlabel ev" style="margin-top:24px">Section C — Event Internal <span style="opacity:.75;font-weight:600">(diakui 50%, kasir tidak dipotong)</span></span>
      <div class="helper" style="margin-bottom:10px">Beda dari Section B. Yang diakui untuk target PIC event <b>separuh nominalnya</b>, dihitung otomatis — tidak perlu diisi manual. Kasir <b>tidak dipotong sama sekali</b>: omset event tetap dihitung penuh untuk target kasir yang menerimanya, jadi section ini tidak punya pengaturan kasir shift. Event yang sudah <b>Upcoming</b>/<b>Event Done</b> di modul Event muncul sendiri dengan nama &amp; PIC-nya; nominalnya diisi tangan karena modul Event memang tidak menyimpan nilai rupiah. <b>Open Bill diakui penuh</b>, tidak ikut dibagi dua.</div>
      <div id="bd_ev"></div>
      <button class="btn btn-ghost btn-sm" id="add_ev">+ Tambah Data Event</button>
    </div>
    <div id="bd_info"></div>
    <div id="bd_efek"></div>
    <div id="bd_warn"></div>
    <div class="balance-bar" id="bd_balance"></div>`;

  const state={mk:JSON.parse(JSON.stringify(d.bd.marketing)),ev:JSON.parse(JSON.stringify(d.bd.event)),ks:JSON.parse(JSON.stringify(kasirRows)),so:JSON.parse(JSON.stringify(d.bd.self))};

  /* Cabut satu kasir dari seluruh baris shift marketing & event. Dipakai saat
     kasir dicentang OFF, dan sekali saat halaman dibuka untuk merapikan data
     lama yang terlanjur menyimpan kasir OFF di dalam shift. */
  function buangDariShift(id){
    [...state.mk,...state.ev].forEach(r=>{
      if(Array.isArray(r.shift)) r.shift=r.shift.filter(x=>x!==id);
    });
  }
  // Data lama: kasir yang di-OFF-kan sesudah shift-nya terlanjur diisi. Dibersihkan
  // di `state` saja — perubahannya baru ikut tersimpan kalau user memang menyimpan.
  // Baris yang jadi tanpa shift akan muncul sendiri di peringatan calc().
  state.ks.filter(r=>r.off).forEach(r=>buangDariShift(r.kasirId));

  const mkSelect=(list,sel)=>list.map(e=>`<option value="${e.id}" ${e.id===sel?'selected':''}>${esc(e.name)}</option>`).join('');

  /* ---- MENYERAP EVENT HARI ITU DARI MODUL MARKETING & EVENT ----
     Baris otomatis ditandai `srcId` ("mkt:<id>" / "evt:<id>"). Penanda itulah
     yang mencegah baris yang sama masuk dua kali saat halaman digambar ulang,
     dan yang menghubungkannya ke daftar `abaikan` kalau orangnya membuangnya.

     PIC dicocokkan lewat NAMA, bukan id. Id PIC di modul marketing itu id
     user marketing, sedangkan Section B memakai id pegawai milik modul ini —
     dua ruang id yang berbeda, dan tidak ada tabel yang memetakan keduanya.
     Nama adalah satu-satunya yang sama, karena keduanya sama-sama datang dari
     roster Office. Yang tidak ketemu dibiarkan memakai PIC pertama seperti
     baris manual; namanya tetap ditulis di pita sumber supaya orangnya tahu
     harus membetulkan pilihan siapa. */
  function cocokPic(divi,nama){
    const n=String(nama||'').trim().toLowerCase();
    if(!n) return null;
    const e=(DB.employees[divi]||[]).find(x=>String(x.name||'').trim().toLowerCase()===n);
    return e?e.id:null;
  }
  function serapOtomatis(){
    if(EVHARI.tgl!==bdDate || EVHARI.st!=='ok') return false;
    const abai=new Set(d.bd.abaikan||[]);
    let tambah=0;
    const sudahAda=key=>[...state.mk,...state.ev].some(r=>r.srcId===key);
    EVHARI.mk.forEach(ev=>{
      const key='mkt:'+ev.id;
      if(abai.has(key)||sudahAda(key)) return;
      const f=mkFinance(ev,EVHARI.set);
      state.mk.push({picId:cocokPic('marketing',ev.picName)||undefined,
        eventName:ev.nama||'', amount:0, tax:0, service:0, shift:[],
        srcId:key, srcPic:ev.picName||'', srcNominal:f.grand,
        srcOmset:f.omset, srcTax:f.tax, srcService:f.service});
      tambah++;
    });
    EVHARI.ev.forEach(ev=>{
      const key='evt:'+ev.id;
      if(abai.has(key)||sudahAda(key)) return;
      /* Modul event tidak menyimpan nilai rupiah event, jadi tidak ada
         srcNominal di sini — yang dihemat cuma nama event & PIC-nya. */
      state.ev.push({picId:cocokPic('event',ev.picName)||undefined,
        eventName:ev.nama||'', amount:0, shift:[],
        srcId:key, srcPic:ev.picName||''});
      tambah++;
    });
    return tambah>0;
  }
  /* Pita status penarikan. Ditaruh di atas Section B karena di situlah baris
     otomatisnya muncul. */
  function pitaSumber(){
    const box=document.getElementById('bd_src'); if(!box) return;
    if(EVHARI.tgl!==bdDate || EVHARI.st==='muat'){
      box.innerHTML=`<div class="notice info">⏳ Mengambil event ${esc(dateLabel(bdDate))} dari modul Marketing &amp; Event…</div>`; return;
    }
    if(EVHARI.st==='galat'){
      box.innerHTML=`<div class="notice warn">⚠ Daftar event otomatis tidak bisa diambil (${esc(EVHARI.galat)}). Breakdown tetap bisa diisi seperti biasa — tambahkan barisnya manual.</div>`; return;
    }
    const n=EVHARI.mk.length+EVHARI.ev.length;
    const dibuang=(d.bd.abaikan||[]).length;
    box.innerHTML = n
      ? `<div class="notice ok">✓ ${n} event berstatus <b>Deal</b>/<b>Upcoming</b> ditemukan untuk ${esc(dateLabel(bdDate))} — barisnya sudah dibuatkan di bawah, tinggal diisi nominalnya.${EVHARI.galat?` <span style="opacity:.8">(${esc(EVHARI.galat)} tidak terbaca)</span>`:''}${dibuang?` <span style="opacity:.8">· ${dibuang} baris pernah dibuang dan tidak dimunculkan lagi.</span>`:''}</div>`
      : `<div class="notice info">ℹ️ Tidak ada event berstatus Deal/Upcoming di modul Marketing &amp; Event untuk ${esc(dateLabel(bdDate))}.${EVHARI.galat?` <span style="opacity:.8">(${esc(EVHARI.galat)} tidak terbaca)</span>`:''}</div>`;
  }

  /* Ringkasan potongan per baris. Sekarang muncul di SEMUA baris, tidak lagi
     hanya yang free entry: setiap baris event memotong kasir, centang Free Entry
     cuma menentukan besarnya (50% atau 100%). */
  function tombolBagi(r,i,key){
    const b=potonganBaris(r);
    const belum=num(r.amount)>0 && b.pembagi<=0;
    // Baris yang nominalnya masih 0 belum punya apa-apa untuk dipotong — jangan
    // ditandai merah, itu keadaan normal saat baris baru ditambahkan.
    const isi = b.pembagi<=0
      ? `<b>Atur kasir shift</b>${belum?'potongan belum dibebankan':'belum ditentukan'}`
      : `<b>−${fmtRp(b.per)} / kasir</b>${b.ids.length} kasir shift${b.dw?` · ${b.dw} DW`:''}`;
    return `<button type="button" class="bhbtn ${key}bagi${belum?' kosong':''}" data-i="${i}" title="Atur kasir yang kena shift event ini — merekalah yang dipotong">${isi}</button>`;
  }
  /* Nominal omset diubah → besar potongan per kasir ikut berubah, jadi tombolnya
     harus ikut berubah saat itu juga. Sebelumnya tombol hanya digambar ulang oleh
     drawMk/drawEv, sehingga sesudah "Simpan Pembagian" angkanya membeku pada
     nominal LAMA dan orang mengira pembagiannya tidak mengikuti omset baru —
     padahal yang disimpan memang cuma daftar kasir shift, pembagiannya selalu
     dihitung ulang dari nominal terakhir.
     Tombolnya ditambal di tempat, bukan lewat drawMk/drawEv: menggambar ulang
     section saat nominalnya sedang diketik akan merebut fokus dari kolomnya. */
  function segarkanBagi(key,i){
    const r=state[key][i]; if(!r) return;
    /* Angka "Diakui PIC" ikut ditambal di sini, dengan alasan yang sama seperti
       tombolnya: ia dihitung dari kotak yang sedang diketik, jadi menunggu
       drawMk/drawEv berarti angkanya membeku pada nominal lama — dan section
       marketing sekarang punya TIGA kotak yang membentuknya. */
    const box=document.querySelector('#bd_'+key+' .'+key+'diakui[data-i="'+i+'"]');
    if(box) box.textContent=fmtRp(porsiPic(r, key==='ev'?'event':'marketing'));
    const btn=document.querySelector('#bd_'+key+' .'+key+'bagi[data-i="'+i+'"]');
    if(!btn) return;
    const tmp=document.createElement('div');
    tmp.innerHTML=tombolBagi(r,i,key);
    const baru=tmp.firstElementChild;
    btn.className=baru.className;
    btn.innerHTML=baru.innerHTML;
  }
  /* Kasir yang boleh dibebani potongan hari ini = yang TIDAK dicentang OFF di
     Section A. Dibaca dari `state.ks`, bukan dari DB, supaya centang OFF yang
     baru saja diklik (belum disimpan) langsung berlaku di modal. */
  function kasirAktif(){
    const off=new Set(state.ks.filter(r=>r.off).map(r=>r.kasirId));
    return (DB.employees.kasir||[]).filter(k=>!off.has(k.id));
  }
  /* Dipakai bersama dua section. Modal mengubah baris di `state` langsung,
     jadi sesudahnya cukup gambar ulang section itu dan hitung ulang. */
  function bukaBagi(key,i){
    const arr=state[key], row=arr[i]; if(!row) return;
    modalBagiHasil(row, row.eventName, ()=>{
      (key==='mk'?drawMk:drawEv)(); calc();
      /* "Simpan Pembagian" harus LANGSUNG berlaku, tidak menunggu tombol
         Simpan Breakdown di bawah — sebelumnya pembagiannya cuma hidup di
         `state`, jadi orang yang menutup halaman sesudah menekan Simpan
         Pembagian kehilangan pilihannya tanpa peringatan apa pun.
         `bdValid` tidak dinaikkan begitu saja: alokasi omsetnya bisa saja
         belum balance, jadi flagnya diisi apa adanya supaya tidak berbohong
         soal hari yang sebenarnya masih selisih. */
      // `abaikan` ikut dibawa — ia BUKAN bagian dari `state`, dan menulis d.bd
      // dari nol tanpa menyalinnya membuat baris otomatis yang sudah dibuang
      // muncul lagi begitu halaman digambar ulang.
      d.bd={marketing:state.mk,event:state.ev,kasir:state.ks,self:state.so,abaikan:d.bd.abaikan||[]};
      d.bdValid=Math.abs(net-sumDiakui())<1;
      save();
      const b=potonganBaris(row), box=document.getElementById('bd_info');
      if(box){
        box.innerHTML=`<div class="notice ok">✓ Shift <b>${esc(row.eventName||'event tanpa nama')}</b> tersimpan — ${b.pembagi>0?`${fmtRp(b.per)} dipotong dari masing-masing ${b.ids.length} kasir shift`:'belum ada kasir yang dibebani'}.</div>`;
        clearTimeout(bagiInfoTimer);
        bagiInfoTimer=setTimeout(()=>{ const x=document.getElementById('bd_info'); if(x) x.innerHTML=''; },6000);
      }
    }, kasirAktif());
  }
  /* Pita di atas baris otomatis: dari mana asalnya, PIC yang tertulis di modul
     sumber, dan nilai yang sudah dihitung marketing. Nilai itu PEMBANDING,
     bukan angka yang dipakai — tombol "salin" yang memindahkannya ke kolom,
     supaya angka dari modul sebelah tidak pernah masuk ke perhitungan omset
     tanpa ada orang yang menyetujuinya. */
  function pitaBaris(r,i,key){
    if(!r.srcId) return '';
    const dari=r.srcId.slice(0,3)==='mkt'?'Marketing':'Event';
    const pic=r.srcPic?` · PIC di ${dari}: <b>${esc(r.srcPic)}</b>`:'';
    const nilai=num(r.srcNominal)>0
      ? ` · nilai menurut ${dari}: <b>${fmtRp(num(r.srcNominal))}</b> <button type="button" class="btn btn-ghost btn-sm ${key}salin" data-i="${i}" title="Isikan Omset, Tax, dan Service dari angka Marketing">salin ke kolom</button>`
      : '';
    return `<div class="esrc"><span class="tag">otomatis</span>dari modul ${dari}${pic}${nilai}</div>`;
  }
  /* Panel Open Bill. Kotaknya baru muncul setelah dicentang — kalau selalu
     tampil, tiap event polos ikut memajang empat kotak kosong dan halaman ini
     jadi dua kali lebih panjang untuk hari yang tidak punya open bill sama
     sekali (mayoritas hari). */
  function panelOb(r,i,key){
    const on=obAktif(r);
    const kasir=kasirAktif();
    const opsi=`<option value="">— pilih kasir —</option>`+kasir.map(k=>`<option value="${esc(k.id)}" ${r.obKasirId===k.id?'selected':''}>${esc(k.name)}</option>`).join('');
    const cek=`<label class="obtoggle${on?' on':''}"><input type="checkbox" class="${key}obc" data-i="${i}" ${on?'checked':''}> Open Bill</label>`;
    if(!on) return cek;
    const t=obTotal(r);
    return cek+`
      <div class="brow ob">
        <div class="field"><label>OB — Omset</label><input data-i="${i}" data-f="obAmount" class="${key}f mono rp" inputmode="numeric" value="${r.obAmount||0}"></div>
        <div class="field"><label>OB — Tax</label><input data-i="${i}" data-f="obTax" class="${key}f mono rp" inputmode="numeric" value="${r.obTax||0}"></div>
        <div class="field"><label>OB — Service</label><input data-i="${i}" data-f="obService" class="${key}f mono rp" inputmode="numeric" value="${r.obService||0}"></div>
        <div class="field"><label>Kasir yang menginput</label><select data-i="${i}" data-f="obKasirId" class="${key}f">${opsi}</select></div>
        <div class="field"><label>Open Bill</label><div class="mono" style="padding:9px 0;font-weight:800">${fmtRp(t)}</div></div>
      </div>
      <div class="helper" style="margin:0 0 10px">${t>0&&!r.obKasirId?'⚠ <b>Belum ada kasir yang dipilih</b> — nominal ini akan diakui untuk PIC tanpa ada kasir yang tercatat melayaninya. ':''}Nominal Open Bill <b>ikut diakui untuk PIC</b> dan <b>tidak dipotong dari kasir mana pun</b>: uangnya memang sudah masuk omset bruto kasir hari itu. Kasir yang dipilih mendapat pengakuan Open Bill atas nama event ini di Performa Kasir.</div>`;
  }
  /* Penangan yang sama untuk dua section: centang Open Bill dan tombol salin.
     Redraw penuh memang dilakukan di sini — dua-duanya menambah/menghapus
     kotak isian, jadi tidak ada fokus ketikan yang bisa direbut. */
  function bindOb(key,redraw){
    document.querySelectorAll('.'+key+'obc').forEach(c=>c.onchange=()=>{
      const r=state[key][+c.dataset.i];
      r.ob=c.checked;
      /* Angka TIDAK dinolkan saat centangnya dicabut. Orang mencabut centang
         untuk melihat efeknya lalu memasangnya lagi; menghapus tiga kotak
         yang baru diketik karena itu adalah kehilangan kerja tanpa peringatan.
         obTotal() sudah memulangkan 0 selama `ob` mati, jadi angka yang
         tertinggal tidak pernah ikut dihitung. */
      redraw(); calc();
    });
    document.querySelectorAll('.'+key+'salin').forEach(b=>b.onclick=()=>{
      const r=state[key][+b.dataset.i];
      r.amount=num(r.srcOmset); r.tax=num(r.srcTax); r.service=num(r.srcService);
      redraw(); calc();
    });
  }
  function drawMk(){
    document.getElementById('bd_mk').innerHTML=state.mk.map((r,i)=>`
      <div class="ebox${r.srcId?' auto':''}">
      ${pitaBaris(r,i,'mk')}
      <div class="brow mk">
        <div class="field"><label>Marketing</label><select data-i="${i}" data-f="picId" class="mkf">${mkSelect(DB.employees.marketing,r.picId||DB.employees.marketing[0]?.id)}</select></div>
        <div class="field"><label>Nama Event</label><input data-i="${i}" data-f="eventName" class="mkf" placeholder="cth. Mitsubishi Gathering" value="${esc(r.eventName||'')}"></div>
        <div class="field"><label>Nominal Omset</label><input data-i="${i}" data-f="amount" class="mkf mono rp" inputmode="numeric" value="${r.amount||0}" title="Hanya kolom ini yang dipotong dari kasir shift"></div>
        <div class="field"><label>Tax</label><input data-i="${i}" data-f="tax" class="mkf mono rp" inputmode="numeric" value="${r.tax||0}" title="Ikut diakui untuk PIC, tapi tidak dipotong dari kasir"></div>
        <div class="field"><label>Service</label><input data-i="${i}" data-f="service" class="mkf mono rp" inputmode="numeric" value="${r.service||0}" title="Ikut diakui untuk PIC, tapi tidak dipotong dari kasir"></div>
        <div class="field"><label>Diakui PIC</label><div class="mono mkdiakui" data-i="${i}" style="padding:9px 0;font-weight:800">${fmtRp(porsiPic(r,'marketing'))}</div></div>
        ${tombolBagi(r,i,'mk')}
        <div style="display:flex;gap:5px;margin-bottom:14px">
          <button class="btn btn-danger btn-sm mkdel" data-i="${i}">✕</button>
        </div>
      </div>
      ${panelOb(r,i,'mk')}
      </div>`).join('')||'<div class="helper" style="margin-bottom:8px">Belum ada data marketing.</div>';
    bind('mkf','mk',drawMk);
    bindOb('mk',drawMk);
    /* Penangan centang Free Entry DIHAPUS bersama kotaknya: sejak pembagian
       50/50 dibuang, ia tidak lagi memengaruhi angka apa pun. Pembukaan modal
       shift saat nominal terisi tapi shift kosong tetap ada di penangan
       nominalnya (lihat bind di atas). */
    document.querySelectorAll('.mkbagi').forEach(b=>b.onclick=()=>bukaBagi('mk',+b.dataset.i));
    document.querySelectorAll('.mkdel').forEach(b=>b.onclick=()=>{hapusBaris('mk',+b.dataset.i,drawMk);});
    formatAllRp(document.getElementById('bd_mk'));
  }
  function drawEv(){
    document.getElementById('bd_ev').innerHTML=state.ev.map((r,i)=>`
      <div class="ebox${r.srcId?' auto':''}">
      ${pitaBaris(r,i,'ev')}
      <div class="brow mk">
        <div class="field"><label>PIC Event</label><select data-i="${i}" data-f="picId" class="evf">${mkSelect(DB.employees.event,r.picId||DB.employees.event[0]?.id)}</select></div>
        <div class="field"><label>Nama Event</label><input data-i="${i}" data-f="eventName" class="evf" placeholder="cth. Live Music Anniversary" value="${esc(r.eventName||'')}"></div>
        <div class="field"><label>Nominal</label><input data-i="${i}" data-f="amount" class="evf mono rp" inputmode="numeric" value="${r.amount||0}"></div>
        <div class="field"><label>Diakui PIC</label><div class="mono evdiakui" data-i="${i}" style="padding:9px 0;font-weight:800">${fmtRp(porsiPic(r,'event'))}</div></div>
