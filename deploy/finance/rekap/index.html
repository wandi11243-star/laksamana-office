<!-- Guard SSO. Syaratnya HARUS sama persis dengan bacaSesi() di bawah; kalau
     salah satu diubah, ubah keduanya. Ditaruh di <head> supaya halaman tidak
     sempat tergambar sedikit pun bagi yang tidak berhak — penjaga sebenarnya
     tetap di sisi Office, `modules` dibuat server saat login.

     JALURNYA '../../' (dua tingkat), sama seperti panel omset & kas: berkas
     ini ada di deploy/finance/rekap/, jadi yang tertinggal satu tingkat
     mendarat di pemilih panel, bukan di Office. -->
<script>
(function(){try{
  var s=JSON.parse(localStorage.getItem('lm_session')||'null');
  var hidup=s&&s.expiry&&Date.now()<s.expiry;
  var punyaModul=hidup&&(s.modules||[]).some(function(m){return m==='*'||m==='rekap';});
  if(!punyaModul)location.replace('../../');
}catch(e){location.replace('../../');}})();
</script>

<style>
/* ===== TEMA OFFICE LAKSAMANA — sama dengan panel omset & kas ===== */
:root{
  --ink:#2A2620; --ink-2:#3A3428;
  --gold:#A9791F; --gold-2:#C8961F; --gold-dim:#7A560F;
  --gold-soft:#F2E9D3; --gold-glow:rgba(169,121,31,.13);
  --paper:#F7F6F4; --surface:#FFFFFF; --line:#E7E1D3;
  --line-soft:rgba(60,55,45,.10);
  --text:#2A2620; --muted:#5C574D; --muted-2:#928C80;
  --ok:#1F9D5F; --ok-bg:#E4F5EC;
  --warn:#B5831A; --warn-bg:#F7EFDB;
  --danger:#C9432B; --danger-bg:#F8E4DF;
  --info:#2F7FC4; --info-bg:#E4EFF8;
  --violet:#7C5FC0; --violet-bg:#ECE6F7;
  --teal:#1F9D8F; --teal-bg:#E2F4F2;
  --radius:16px; --radius-sm:10px;
  --shadow:0 4px 18px rgba(50,42,28,.06);
  --ring:0 0 0 3px rgba(227,160,8,.18); --ease:cubic-bezier(.16,1,.3,1);
  --serif:'Plus Jakarta Sans',system-ui,sans-serif;
  --sans:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:radial-gradient(900px 480px at 50% -12%,rgba(227,160,8,.09),transparent 60%),var(--paper);
  color:var(--text);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
h1,h2,h3{font-family:var(--serif);font-weight:700;letter-spacing:-.02em;line-height:1.18;color:var(--ink)}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
a{color:var(--info)}

.btn{border:none;border-radius:var(--radius-sm);padding:10px 16px;font-weight:600;font-size:13.5px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:filter .15s var(--ease)}
.btn:focus-visible{outline:none;box-shadow:var(--ring)}
.btn-primary{background:linear-gradient(135deg,var(--gold-2),var(--gold-dim));color:#fff;box-shadow:0 3px 12px rgba(122,86,15,.28)}
.btn-primary:hover{filter:brightness(1.06)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;filter:none}
.btn-ghost{background:var(--surface);border:1.5px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--gold-2);background:var(--gold-soft)}
.btn-sm{padding:7px 11px;font-size:12.5px}

/* ===== KEPALA HALAMAN ===== */
.top{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line);
  padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:800;color:var(--ink)}
.brand .mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--gold-2),var(--gold-dim));
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px}
.brand small{display:block;font-family:var(--sans);font-size:11px;font-weight:600;color:var(--muted-2);letter-spacing:.4px}
.top .sp{flex:1}
.top select{padding:8px 11px;border:1.5px solid var(--line);border-radius:9px;background:var(--surface);
  font-size:13.5px;font-weight:600;color:var(--ink)}
.top select:focus{outline:none;border-color:var(--gold);box-shadow:var(--ring)}
.sync{font-size:12px;font-weight:600;color:var(--muted)}
.sync.ok{color:var(--ok)} .sync.err{color:var(--danger)}

/* ===== KARTU RINGKAS ===== */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.stat .lab{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted-2)}
.stat .val{font-family:var(--serif);font-size:20px;font-weight:800;margin-top:3px}
.stat .foot{font-size:11.5px;color:var(--muted);margin-top:2px}
.stat.accent{background:var(--gold-soft);border-color:var(--gold-2)}
.stat.baik .val{color:var(--ok)} .stat.buruk .val{color:var(--danger)}

.notice{border-radius:var(--radius-sm);padding:11px 14px;font-size:13px;margin-bottom:12px;display:flex;gap:9px}
.notice.info{background:var(--info-bg);color:#215d90}
.notice.ok{background:var(--ok-bg);color:#146b45}
.notice.warn{background:var(--warn-bg);color:#8a6412}
.notice.bad{background:var(--danger-bg);color:#93301e}

/* ===== TABEL REKAP =====
   Lebar tabelnya memang jauh melebihi layar (51 kolom di berkas Excel-nya),
   jadi yang digulir adalah WADAHNYA, bukan halaman. Dua kolom pertama
   (Tanggal & Total Penjualan) dibekukan supaya baris tidak pernah kehilangan
   identitasnya waktu digulir ke kanan — tanpa itu, orang harus menggulir
   balik ke kiri tiap kali ingin tahu ini tanggal berapa. */
.tabelbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:auto;max-height:calc(100vh - 300px)}
table{border-collapse:separate;border-spacing:0;font-size:12.5px;white-space:nowrap}
thead th{position:sticky;top:0;z-index:12;background:var(--gold-soft);color:var(--ink-2);
  font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;
  padding:8px 10px;border-bottom:1.5px solid var(--line);text-align:right}
thead tr.grup th{top:0;z-index:14;font-size:10px;background:var(--surface);border-bottom:1px solid var(--line);
  text-align:center;color:var(--muted-2)}
thead tr.kol th{top:26px;z-index:12}
thead th.kiri{text-align:left}
tbody td{padding:6px 10px;border-bottom:1px solid var(--line-soft);text-align:right}
tbody td.kiri{text-align:left}
tbody tr:hover td{background:rgba(242,233,211,.35)}
tfoot td{position:sticky;bottom:0;z-index:12;background:var(--gold-soft);font-weight:800;
  padding:9px 10px;border-top:1.5px solid var(--line);text-align:right}
/* Kolom beku */
.bek1{position:sticky;left:0;z-index:13;background:var(--surface)}
.bek2{position:sticky;left:96px;z-index:13;background:var(--surface)}
thead .bek1,thead .bek2{z-index:16;background:var(--gold-soft)}
tfoot .bek1,tfoot .bek2{z-index:16;background:var(--gold-soft)}
tbody tr:hover .bek1,tbody tr:hover .bek2{background:#FBF8F1}
/* Pemisah antar kelompok bank supaya 51 kolom tidak terbaca sebagai satu bubur */
.sekat{border-left:2px solid var(--line)}
.num-in{width:104px;padding:4px 7px;border:1.5px solid var(--line);border-radius:7px;
  text-align:right;font-size:12px;background:var(--surface)}
.num-in:focus{outline:none;border-color:var(--gold);box-shadow:var(--ring)}
.cek{width:16px;height:16px;accent-color:var(--gold);cursor:pointer}
.sel-ok{color:var(--muted-2)}
.sel-beda{color:var(--danger);font-weight:700}
.kosong{padding:40px 20px;text-align:center;color:var(--muted)}
.kosong .big{font-size:34px;margin-bottom:8px}

/* Bilah simpan menempel di bawah — 30 baris tidak muat di layar, dan tombol
   simpan yang harus dicari dengan menggulir ke dasar adalah tombol yang lupa
   ditekan. */
.simpanbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);
  border-top:1px solid var(--line);padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  box-shadow:0 -6px 20px rgba(50,42,28,.07)}
.simpanbar .ket{flex:1;font-size:12.5px;color:var(--muted)}
@media(max-width:640px){
  .wrap{padding:14px 12px 96px}
  .top{padding:10px 12px}
  .bek2{position:static}
}

<div class="simpanbar">
  <div class="ket" id="ket-simpan">Yang disimpan dari layar ini hanya <b>MDR</b>, <b>Setor</b>, dan centang <b>Input ESB</b>. Angka POS/Actual tetap milik Daily Report.</div>
  <button class="btn btn-primary" id="btn-simpan" disabled>💾 Simpan Perubahan</button>
</div>

<script>
/* ======================================================================
   REKAP PENJUALAN — panel ketiga modul Finance (12 Agustus 2026)

   Menggantikan berkas Excel "Penjualan 2026", sheet per bulan (07'26 dst):
   satu baris per hari, mencocokkan apa yang tercatat di ESB dengan apa yang
   benar-benar masuk ke bank/kas.

   DARI MANA ANGKANYA. Hampir semuanya SUDAH ADA dan tidak diketik lagi di
   sini — dibaca dari blob kompas yang sama dengan dua panel Finance lainnya:

     Total Penjualan   omset bruto Input Omset Harian (daily[].omzet_*)
     ESB per metode    reports[tgl].pay[metode].pos     ← Daily Report
     Aktual per metode reports[tgl].pay[metode].actual  ← Daily Report

   Yang MILIK panel ini sendiri cuma tiga, dan cuma tiga ini yang ditulis:
     MDR per bank, penanda Setor, dan centang Input ESB.

   KENAPA `pay` TIDAK BISA DIUBAH DARI SINI. Kalau dua layar boleh menulis
   satu angka yang sama, yang belakangan menang tanpa ada yang tahu — dan
   Daily Report punya jejak submit, catatan bon, serta validasi selisih yang
   tidak ada di sini. Panel ini menandai dan menghitung, tidak mengetik ulang.

   MENYIMPAN LEWAT ENDPOINT SEMPIT `simpanRekap`, bukan saveAll. saveAll
   mengirim SELURUH state, jadi satu penyimpanan dari layar yang salinannya
   sudah basi akan menimpa omset dan breakdown yang baru saja diubah orang di
   panel sebelah — alasan yang sama persis dengan yang membuat panel Kas
   dilarang menulis blob ini. Lihat catatan panjang di simpan_rekap().
   ====================================================================== */
const API_URL='../../kompas-api-mysql/api.php';
const SESSION_KEY='lm_session';
const CACHE_KEY='lm_rekap_cache_v1';

const $=id=>document.getElementById(id);
const num=v=>{const n=parseInt(String(v).replace(/[^0-9-]/g,''),10);return isNaN(n)?0:n;};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtRp=n=>'Rp'+Math.round(n||0).toLocaleString('id-ID');
/* Nol ditulis sebagai "—", bukan "Rp0". Tabel selebar ini punya ratusan sel
   kosong; "Rp0" di semuanya membuat mata tidak bisa menemukan angka yang
   benar-benar ada. */
const rp0=n=>(!n?'<span style="color:var(--muted-2)">—</span>':fmtRp(n));
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const monthKeyOf=ds=>String(ds||'').slice(0,7);
const MONTHS_F=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const labelBulan=ym=>{const b=String(ym||'').split('-');return (MONTHS_F[(+b[1])-1]||'?')+' '+(b[0]||'');};
const DAYS=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
function labelHari(ds){ const d=new Date(ds+'T00:00:00'); return DAYS[d.getDay()]+', '+d.getDate(); }
function hariDalamBulan(ym){
  const [y,m]=ym.split('-').map(Number);
  const n=new Date(y,m,0).getDate(); const out=[];
  for(let i=1;i<=n;i++) out.push(ym+'-'+String(i).padStart(2,'0'));
  return out;
}

let CURRENT_USER=null;
function bacaSesi(){
  try{
    const s=JSON.parse(localStorage.getItem(SESSION_KEY)||'null');
    if(!s||!s.expiry||Date.now()>=s.expiry) return null;
    const m=s.modules||[];
    if(m.indexOf('*')<0 && m.indexOf('rekap')<0) return null;
    const adm=s.adminModules||[];
    return {id:s.userId,name:s.name,isAdmin:(adm.indexOf('*')>-1||adm.indexOf('rekap')>-1)};
  }catch(e){ return null; }
}

let DB=null, PERIODE=monthKeyOf(todayISO());
/* Suntingan yang BELUM tersimpan, dipisah dari DB. Dipisah dengan sengaja:
   selama belum tersimpan, layar harus bisa menunjukkan mana yang berubah, dan
   kegagalan simpan tidak boleh meninggalkan DB yang berbeda dari server. */
let UBAH={};
let SIMPAN_JALAN=false;

/* ---- metode pembayaran, SAMA KUNCINYA dengan PAYS di Daily Report ----
   Kunci yang meleset satu huruf memulangkan 0 tanpa galat apa pun, dan
   kolomnya akan terlihat "memang kosong hari itu". Kalau PAYS di
   deploy/finance/omset/index.html berubah, samakan di sini. */
function pay(rec,k,f){ const p=(rec&&rec.pay&&rec.pay[k])||{}; return num(p[f]); }

/* ---- KELOMPOK "INPUT ESB" ----
   Tiap kelompok = satu centang di berkas Excel-nya (kolom J, L, S, Z, AI, AK,
   AM, AO, AY). Yang dikunci ke ESB adalah NOMINAL ADJUST kelompok itu:

     - Kelompok yang punya sisi ESB dan sisi Aktual (cash, bri, mandiri, bca)
       → adjust-nya SELISIH keduanya. Itulah angka yang dimasukkan ke ESB
         supaya sistem cocok dengan setoran sebenarnya.
     - Kelompok yang cuma punya sisi Aktual (QR Order, Transfer, Gofood,
       Grabfood, Error) → tidak ada pembanding, jadi adjust-nya nominal itu
       sendiri.

   `esbKeys` menyebut kunci Daily Report yang membentuk tiap sisi. Dipisah
   begini supaya penjumlahan kolom, penjumlahan kaki tabel, dan nominal yang
   dihitung saat dicentang MUSTAHIL berbeda — ketiganya membaca daftar ini. */
const GRUP=[
  {k:'cash',     n:'Cash',      warna:'ok',      esb:['cash'],                    akt:['cash']},
  {k:'qr_order', n:'QR Order',  warna:'info',    esb:[],                          akt:['qris_esb']},
  {k:'bri',      n:'BRI',       warna:'info',    esb:['edc_bri','qris_bri'],      akt:['edc_bri','qris_bri'],         mdr:'bri'},
  {k:'mandiri',  n:'Mandiri',   warna:'warn',    esb:['edc_mandiri','qris_mandiri'], akt:['edc_mandiri','qris_mandiri'], mdr:'mandiri'},
  {k:'bca',      n:'BCA',       warna:'violet',  esb:['edc_bca','qris_bca'],      akt:['edc_bca','qris_bca'],         mdr:'bca'},
  {k:'transfer', n:'Transfer',  warna:'teal',    esb:[],                          akt:['transfer_uob']},
  {k:'gofood',   n:'Gofood',    warna:'danger',  esb:[],                          akt:['gofood']},
  {k:'grabfood', n:'Grabfood',  warna:'danger',  esb:[],                          akt:['grabfood']},
  {k:'error',    n:'Error',     warna:'danger',  esb:[],                          akt:['error_customer','error_floor','error_kasir','error_bar']}
];
/* Kolom Aktual yang membentuk REKAP AKTUAL, yaitu pembanding Total Penjualan.
   Isinya SELURUH metode yang ada di Daily Report kecuali dua di bawah, dan
   itu keputusan yang perlu ditulis alasannya:

     error_customer  — berkas Excel-nya TIDAK memasukkannya ke rumus Rekap
       Aktual (kolom D) pada 28 dari 30 hari; dua hari yang memasukkannya
       (baris 15 & 16) justru yang menyimpang. Diikuti yang mayoritas.
     error_kitchen   — tidak punya kolom sama sekali di berkas itu.

   Keduanya TETAP DITAMPILKAN sebagai kolom sendiri supaya uangnya tidak
   hilang dari pandangan — yang tidak ikut cuma penjumlahannya. */
const AKT_LUAR=['error_customer','error_kitchen'];
function semuaKunciPay(){
  const out=[];
  GRUP.forEach(g=>g.akt.forEach(k=>{ if(out.indexOf(k)<0) out.push(k); }));
  ['compliment','member_dep','voucher','error_kitchen'].forEach(k=>{ if(out.indexOf(k)<0) out.push(k); });
  return out;
}
const PAY_REKAP=semuaKunciPay().filter(k=>AKT_LUAR.indexOf(k)<0);

/* ---- pembacaan satu hari ---- */
function recOf(tgl){ return (DB&&DB.reports&&DB.reports[tgl])||null; }
function omsetOf(tgl){
  const d=(DB&&DB.daily||[]).find(x=>x.date===tgl);
  if(!d) return 0;
  /* Bruto − diskon, sama dengan netOf() di panel omset. Kalau dipakai bruto
     saja, Total Penjualan akan selalu lebih besar dari Rekap Aktual sebesar
     diskon hari itu dan setiap hari terlihat selisih.

     NAMA FIELD-nya `food`/`bev`/`lainnya`, BUKAN omzet_*. Salah nama di sini
     tidak melempar apa pun — num(undefined) memulangkan 0 — jadi Total
     Penjualan akan diam-diam nol sebulan penuh dan seluruh kolom Selisih
     terlihat sebesar Rekap Aktual. Samakan dengan grossOf() di panel omset. */
  return num(d.food)+num(d.bev)+num(d.lainnya)-num(d.discount);
}
/* Nilai tersimpan, ditimpa suntingan yang belum disimpan. Satu fungsi untuk
   ketiganya supaya tabel, kaki tabel, dan kartu ringkas tidak pernah membaca
   dua sumber yang berbeda. */
function mdrOf(tgl,bank){
  const u=UBAH[tgl]; if(u&&u.mdr&&u.mdr[bank]!==undefined) return num(u.mdr[bank]);
  const r=recOf(tgl); return num(r&&r.mdr&&r.mdr[bank]);
}
function setorOf(tgl){
  const u=UBAH[tgl]; if(u&&u.setor!==undefined) return !!u.setor;
  const r=recOf(tgl); return !!(r&&r.setor);
}
function esbOf(tgl,grup){
  const u=UBAH[tgl]; if(u&&u.esb&&u.esb[grup]!==undefined) return !!u.esb[grup];
  const r=recOf(tgl); return !!(r&&r.esb&&r.esb[grup]);
}
function setUbah(tgl,jalan,nilai){
  UBAH[tgl]=UBAH[tgl]||{};
  if(jalan.length===1) UBAH[tgl][jalan[0]]=nilai;
  else { UBAH[tgl][jalan[0]]=UBAH[tgl][jalan[0]]||{}; UBAH[tgl][jalan[0]][jalan[1]]=nilai; }
  segarkanSimpan();
}
function adaUbah(){ return Object.keys(UBAH).length>0; }

/* ---- angka satu hari ---- */
function hitungHari(tgl){
  const r=recOf(tgl);
  const sisi=(daftar,f)=>daftar.reduce((s,k)=>s+pay(r,k,f),0);
  const g={};
  GRUP.forEach(x=>{
    const esbN=sisi(x.esb,'pos'), aktN=sisi(x.akt,'actual');
    /* Kelompok tanpa sisi ESB tidak punya selisih — bukan "selisih nol".
       Menulisnya nol membuat kolom Selisih terlihat sudah dicocokkan padahal
       tidak ada yang dicocokkan. */
    g[x.k]={esb:esbN, akt:aktN, punyaEsb:x.esb.length>0,
            selisih:x.esb.length?esbN-aktN:null,
            adjust:x.esb.length?esbN-aktN:aktN};
  });
  const rekapAkt=PAY_REKAP.reduce((s,k)=>s+pay(r,k,'actual'),0);
  const jual=omsetOf(tgl);
  return {r,g,rekapAkt,jual,selisihTotal:jual-rekapAkt,
          comp:pay(r,'compliment','actual'), mdep:pay(r,'member_dep','actual'),
          vou:pay(r,'voucher','actual'), errCust:pay(r,'error_customer','actual'),
          errKit:pay(r,'error_kitchen','actual'),
          adaData:!!r || jual!==0};
}

/* ====================== TAMPILAN ====================== */
function setSync(st,msg){
  const el=$('sync'); if(!el) return;
  el.className='sync'+(st==='ok'?' ok':st==='err'?' err':'');
  el.textContent=msg||(st==='ok'?'✓ Tersambung':st==='err'?'✕ Gagal':'Memuat…');
}
function isiPeriode(){
  const set={};
  (DB&&DB.daily||[]).forEach(d=>{ const b=monthKeyOf(d.date); if(/^\d{4}-\d{2}$/.test(b)) set[b]=1; });
  Object.keys((DB&&DB.reports)||{}).forEach(t=>{ const b=monthKeyOf(t); if(/^\d{4}-\d{2}$/.test(b)) set[b]=1; });
  set[monthKeyOf(todayISO())]=1;
  const list=Object.keys(set).sort().reverse();
  if(list.indexOf(PERIODE)<0) PERIODE=list[0];
  $('periode').innerHTML=list.map(b=>`<option value="${b}"${b===PERIODE?' selected':''}>${esc(labelBulan(b))}</option>`).join('');
}
function segarkanSimpan(){
  const n=Object.keys(UBAH).length;
  $('btn-simpan').disabled=(n===0||SIMPAN_JALAN);
  $('ket-simpan').innerHTML = n
    ? `<b style="color:var(--warn)">${n} hari punya perubahan yang belum disimpan.</b> Yang disimpan hanya MDR, Setor, dan centang Input ESB.`
    : 'Yang disimpan dari layar ini hanya <b>MDR</b>, <b>Setor</b>, dan centang <b>Input ESB</b>. Angka POS/Actual tetap milik Daily Report.';
}

function render(){
  if(!DB){ $('isi').innerHTML='<div class="tabelbox"><div class="kosong"><div class="big">⏳</div>Memuat data dari server…</div></div>'; return; }
  const hari=hariDalamBulan(PERIODE);
  const baris=hari.map(t=>({tgl:t,h:hitungHari(t)})).filter(x=>x.h.adaData);

  /* ---- kartu ringkas ---- */
  let jual=0,akt=0,adj=0,adjKunci=0,nSetor=0;
  baris.forEach(({tgl,h})=>{
    jual+=h.jual; akt+=h.rekapAkt;
    GRUP.forEach(g=>{
      const a=h.g[g.k].adjust;
      adj+=a;
      if(esbOf(tgl,g.k)) adjKunci+=a;
    });
    if(setorOf(tgl)) nSetor++;
  });
  const sel=jual-akt;
  $('kartu').innerHTML=
     kartu('Total Penjualan',fmtRp(jual),baris.length+' hari ada data','accent')
    +kartu('Rekap Aktual',fmtRp(akt),'jumlah seluruh kolom Aktual','')
    +kartu('Total Selisih',fmtRp(sel),'Penjualan − Rekap Aktual',Math.abs(sel)<1?'baik':'buruk')
    /* Inilah "nominal yang dihitung kalau sudah dicentang" — permintaan user
       12 Agustus 2026. Yang dijumlahkan nominal ADJUST tiap kelompok yang
       centang Input ESB-nya sudah menyala, jadi angka ini menjawab satu
       pertanyaan: berapa yang sudah benar-benar dikunci di ESB bulan ini. */
    +kartu('Adjust Terkunci di ESB',fmtRp(adjKunci),
        (adj-adjKunci===0?'seluruhnya sudah diinput':fmtRp(adj-adjKunci)+' belum diinput'),
        (adj-adjKunci===0?'baik':''))
    +kartu('Sudah Setor',nSetor+' / '+baris.length,'hari yang cash-nya sudah disetor','');

  if(!baris.length){
    $('isi').innerHTML='<div class="tabelbox"><div class="kosong"><div class="big">🗓️</div>Belum ada data omset maupun Daily Report untuk <b>'+esc(labelBulan(PERIODE))+'</b>.<br>Isi dulu di panel <b>Input Omset Harian</b>.</div></div>';
    segarkanSimpan(); return;
  }

  /* ---- kepala tabel: dua tingkat ----
     Tingkat pertama nama kelompok, tingkat kedua nama kolom. Tanpa tingkat
     pertama, "ESB / Aktual / Selisih / Input ESB" berulang sembilan kali dan
     tidak ada cara tahu yang mana milik bank mana. */
  let g1='<tr class="grup"><th class="bek1"></th><th class="bek2"></th><th colspan="3"></th>';
  let g2='<tr class="kol"><th class="bek1 kiri">Tanggal</th><th class="bek2">Total Penjualan</th>'
        +'<th>Rekap Aktual</th><th>Total Selisih</th><th>Setor</th>';
  GRUP.forEach(g=>{
    const n=(g.esb.length?3:1)+(g.mdr?1:0)+1;   // ESB+Aktual+Selisih / Aktual, +MDR, +Input ESB
    g1+=`<th class="sekat" colspan="${n}" style="color:var(--${g.warna})">${esc(g.n)}</th>`;
    if(g.esb.length){
      g2+=`<th class="sekat">ESB</th><th>Aktual</th>`;
      if(g.mdr) g2+=`<th>MDR</th>`;
      g2+=`<th>Selisih</th><th>Input ESB</th>`;
    }else{
      g2+=`<th class="sekat">Aktual</th><th>Input ESB</th>`;
    }
  });
  g1+='<th class="sekat" colspan="5">Lain-lain (tidak dicentang)</th></tr>';
  g2+='<th class="sekat">Compliment</th><th>Member Deposit</th><th>Voucher</th><th>Error Customer</th><th>Error Kitchen</th></tr>';

  /* ---- badan tabel ---- */
  let tb='';
  const tot={jual:0,akt:0,sel:0,comp:0,mdep:0,vou:0,errC:0,errK:0,g:{}};
  GRUP.forEach(g=>tot.g[g.k]={esb:0,akt:0,mdr:0,sel:0,cek:0});
  baris.forEach(({tgl,h})=>{
    tot.jual+=h.jual; tot.akt+=h.rekapAkt; tot.sel+=h.selisihTotal;
    tot.comp+=h.comp; tot.mdep+=h.mdep; tot.vou+=h.vou; tot.errC+=h.errCust; tot.errK+=h.errKit;
    tb+=`<tr>
      <td class="bek1 kiri"><b>${esc(labelHari(tgl))}</b></td>
      <td class="bek2 mono">${rp0(h.jual)}</td>
      <td class="mono">${rp0(h.rekapAkt)}</td>
      <td class="mono ${Math.abs(h.selisihTotal)<1?'sel-ok':'sel-beda'}">${rp0(h.selisihTotal)}</td>
      <td><input type="checkbox" class="cek" data-tgl="${tgl}" data-jenis="setor" ${setorOf(tgl)?'checked':''} title="Cash hari ini sudah disetor"></td>`;
    GRUP.forEach(g=>{
      const x=h.g[g.k];
      tot.g[g.k].esb+=x.esb; tot.g[g.k].akt+=x.akt;
      if(x.selisih!==null) tot.g[g.k].sel+=x.selisih;
      if(esbOf(tgl,g.k)) tot.g[g.k].cek++;
      if(g.esb.length){
        const m=g.mdr?mdrOf(tgl,g.mdr):0;
        if(g.mdr) tot.g[g.k].mdr+=m;
        tb+=`<td class="mono sekat">${rp0(x.esb)}</td><td class="mono">${rp0(x.akt)}</td>`;
        if(g.mdr) tb+=`<td><input class="num-in mono" inputmode="numeric" data-tgl="${tgl}" data-mdr="${g.mdr}" value="${m||''}" placeholder="0"></td>`;
        tb+=`<td class="mono ${Math.abs(x.selisih)<1?'sel-ok':'sel-beda'}">${rp0(x.selisih)}</td>`;
      }else{
        tb+=`<td class="mono sekat">${rp0(x.akt)}</td>`;
      }
      tb+=`<td><input type="checkbox" class="cek" data-tgl="${tgl}" data-esb="${g.k}" ${esbOf(tgl,g.k)?'checked':''} title="Nominal adjust ${esc(g.n)} (${fmtRp(x.adjust)}) sudah dikunci di ESB"></td>`;
    });
    tb+=`<td class="mono sekat">${rp0(h.comp)}</td><td class="mono">${rp0(h.mdep)}</td>`
      +`<td class="mono">${rp0(h.vou)}</td><td class="mono">${rp0(h.errCust)}</td><td class="mono">${rp0(h.errKit)}</td></tr>`;
  });

  /* ---- kaki tabel ---- */
  let tf=`<tr><td class="bek1 kiri">TOTAL</td><td class="bek2 mono">${rp0(tot.jual)}</td>`
    +`<td class="mono">${rp0(tot.akt)}</td>`
    +`<td class="mono ${Math.abs(tot.sel)<1?'':'sel-beda'}">${rp0(tot.sel)}</td>`
    +`<td class="mono">${baris.filter(b=>setorOf(b.tgl)).length}</td>`;
  GRUP.forEach(g=>{
    const t=tot.g[g.k];
    if(g.esb.length){
      tf+=`<td class="mono sekat">${rp0(t.esb)}</td><td class="mono">${rp0(t.akt)}</td>`;
      if(g.mdr) tf+=`<td class="mono">${rp0(t.mdr)}</td>`;
      tf+=`<td class="mono ${Math.abs(t.sel)<1?'':'sel-beda'}">${rp0(t.sel)}</td>`;
    }else{
      tf+=`<td class="mono sekat">${rp0(t.akt)}</td>`;
    }
    tf+=`<td class="mono">${t.cek}/${baris.length}</td>`;
  });
  tf+=`<td class="mono sekat">${rp0(tot.comp)}</td><td class="mono">${rp0(tot.mdep)}</td>`
    +`<td class="mono">${rp0(tot.vou)}</td><td class="mono">${rp0(tot.errC)}</td><td class="mono">${rp0(tot.errK)}</td></tr>`;

  $('isi').innerHTML='<div class="tabelbox"><table><thead>'+g1+g2+'</thead><tbody>'+tb+'</tbody><tfoot>'+tf+'</tfoot></table></div>'
    +'<div class="notice info" style="margin-top:12px"><div><b>Angka ESB &amp; Aktual dibaca dari Daily Report</b> di panel Input Omset Harian — tidak bisa diubah dari sini, supaya satu angka tidak ditulis dua layar. Yang diisi di sini cuma <b>MDR</b>, <b>Setor</b>, dan centang <b>Input ESB</b>. Centang Input ESB berarti nominal <em>adjust</em> kelompok itu (selisih ESB−Aktual, atau nominalnya sendiri untuk kelompok tanpa pembanding) sudah dikunci di ESB; jumlahnya ada di kartu <b>Adjust Terkunci di ESB</b> di atas.</div></div>';

  pasangPenangan();
  segarkanSimpan();
}
function kartu(lab,val,foot,kelas){
  return `<div class="stat ${kelas||''}"><div class="lab">${esc(lab)}</div><div class="val mono">${val}</div><div class="foot">${foot}</div></div>`;
}
function pasangPenangan(){
  document.querySelectorAll('input[data-jenis="setor"]').forEach(c=>{
    c.onchange=()=>{ setUbah(c.dataset.tgl,['setor'],c.checked); };
  });
  document.querySelectorAll('input[data-esb]').forEach(c=>{
    c.onchange=()=>{
      setUbah(c.dataset.tgl,['esb',c.dataset.esb],c.checked);
      /* Kartu ringkas digambar ulang, tabelnya TIDAK: angka "Adjust Terkunci"
         berubah tiap centang, tapi menggambar ulang seluruh tabel akan
         menggulirkannya kembali ke kiri-atas dan merebut fokus dari kotak MDR
         yang mungkin sedang diketik. */
      segarkanKartu();
    };
  });
  document.querySelectorAll('input[data-mdr]').forEach(inp=>{
    inp.oninput=()=>{ setUbah(inp.dataset.tgl,['mdr',inp.dataset.mdr],num(inp.value)); };
  });
}
/* Menggambar ulang HANYA kartu ringkas. Sengaja memakai jalan yang sama
   dengan render() (hitungHari + esbOf) supaya angkanya mustahil berbeda. */
function segarkanKartu(){
  const baris=hariDalamBulan(PERIODE).map(t=>({tgl:t,h:hitungHari(t)})).filter(x=>x.h.adaData);
  let jual=0,akt=0,adj=0,adjKunci=0,nSetor=0;
  baris.forEach(({tgl,h})=>{
    jual+=h.jual; akt+=h.rekapAkt;
    GRUP.forEach(g=>{ const a=h.g[g.k].adjust; adj+=a; if(esbOf(tgl,g.k)) adjKunci+=a; });
    if(setorOf(tgl)) nSetor++;
  });
  const sel=jual-akt;
  $('kartu').innerHTML=
     kartu('Total Penjualan',fmtRp(jual),baris.length+' hari ada data','accent')
    +kartu('Rekap Aktual',fmtRp(akt),'jumlah seluruh kolom Aktual','')
    +kartu('Total Selisih',fmtRp(sel),'Penjualan − Rekap Aktual',Math.abs(sel)<1?'baik':'buruk')
    +kartu('Adjust Terkunci di ESB',fmtRp(adjKunci),
        (adj-adjKunci===0?'seluruhnya sudah diinput':fmtRp(adj-adjKunci)+' belum diinput'),
        (adj-adjKunci===0?'baik':''))
    +kartu('Sudah Setor',nSetor+' / '+baris.length,'hari yang cash-nya sudah disetor','');
}

/* ====================== SIMPAN ====================== */
function fetchTimeout(url,opts,ms){
  const c=new AbortController(); const t=setTimeout(()=>c.abort(),ms||25000);
  opts=opts||{}; opts.signal=c.signal;
  return fetch(url,opts).then(r=>{clearTimeout(t);return r;},e=>{clearTimeout(t);throw e;});
}
function simpan(){
  if(SIMPAN_JALAN||!adaUbah()) return;
  SIMPAN_JALAN=true;
  const btn=$('btn-simpan'); const semula=btn.innerHTML;
  btn.disabled=true; btn.innerHTML='Menyimpan…';
  const kiriman=JSON.parse(JSON.stringify(UBAH));
  fetchTimeout(API_URL,{method:'POST',redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'simpanRekap',data:{hari:kiriman,by:(CURRENT_USER&&CURRENT_USER.name)||''}})},40000)
    .then(r=>r.text())
    .then(t=>{
      let j=null; try{ j=JSON.parse(t); }catch(e){}
      if(!j) throw new Error('balasan bukan JSON (kompas-api-mysql belum diperbarui?)');
      if(!j.ok) throw new Error(j.error||'ditolak server');
      /* DB baru disamakan SETELAH server mengiyakan, dan hanya untuk yang
         benar-benar dikirim. Kalau disamakan lebih dulu, kegagalan simpan
         meninggalkan layar yang memajang angka baru padahal server masih
         angka lama — tanpa cara melihatnya sampai halaman dimuat ulang. */
      DB.reports=DB.reports||{};
      Object.keys(kiriman).forEach(tgl=>{
        const u=kiriman[tgl];
        const r=DB.reports[tgl]=DB.reports[tgl]||{};
        if(u.setor!==undefined) r.setor=!!u.setor;
        if(u.mdr){ r.mdr=r.mdr||{}; Object.keys(u.mdr).forEach(b=>{ r.mdr[b]=num(u.mdr[b]); }); }
        if(u.esb){ r.esb=r.esb||{}; Object.keys(u.esb).forEach(g=>{ r.esb[g]=!!u.esb[g]; }); }
      });
      UBAH={};
      try{ localStorage.setItem(CACHE_KEY,JSON.stringify(DB)); }catch(e){}
      const tk=(j.data&&j.data.takDikenal)||[];
      pesan(tk.length
        ? `<div class="notice warn"><div>⚠ Tersimpan, tapi ${tk.length} penanda tidak dikenal server (<b>${esc(tk.join(', '))}</b>) dan <b>tidak ikut disimpan</b> — kemungkinan backend kompas belum diperbarui.</div></div>`
        : `<div class="notice ok"><div>✓ Tersimpan${(j.data&&j.data.ubah)?` — ${j.data.ubah} perubahan pada ${j.data.hari} hari`:''}.</div></div>`);
      render();
    })
    .catch(err=>{
      pesan(`<div class="notice bad"><div>✕ Gagal menyimpan: ${esc((err&&err.message)||'gagal')}. Perubahannya <b>masih tersimpan di layar ini</b> dan belum hilang — coba lagi setelah jaringan pulih.</div></div>`);
    })
    .then(()=>{ SIMPAN_JALAN=false; btn.innerHTML=semula; segarkanSimpan(); });
}
let pesanTimer=null;
function pesan(html){
  $('pesan').innerHTML=html;
  clearTimeout(pesanTimer);
  /* Pesan galat TIDAK ikut dihapus otomatis: yang berhasil boleh lewat, yang
     gagal harus tetap terbaca sampai orangnya bertindak. */
  if(html.indexOf('notice bad')<0) pesanTimer=setTimeout(()=>{ $('pesan').innerHTML=''; },7000);
}

/* ====================== BOOT ====================== */
function apiGet(){
  return fetchTimeout(API_URL+'?action=getAll&t='+Date.now(),{method:'GET',redirect:'follow'})
    .then(r=>r.text())
    .then(t=>{ let j=null; try{ j=JSON.parse(t); }catch(e){}
      if(!j) throw new Error('balasan bukan JSON');
      if(!j.ok) throw new Error(j.error||'server error');
      return j.data||{}; });
}
function normalize(d){
  d=(d&&typeof d==='object'&&!Array.isArray(d))?d:{};
  if(!Array.isArray(d.daily)) d.daily=[];
  if(!d.reports||typeof d.reports!=='object'||Array.isArray(d.reports)) d.reports={};
  return d;
}
function boot(){
  CURRENT_USER=bacaSesi();
  if(!CURRENT_USER){ location.replace('../../'); return; }
  $('periode').onchange=e=>{
    /* Perubahan yang belum disimpan TIDAK dibuang diam-diam saat pindah bulan.
       UBAH disimpan per tanggal, jadi ia tetap utuh dan tetap ikut terkirim —
       yang berubah cuma bulan yang sedang dilihat. Bilah simpan tetap menyebut
       berapa hari yang menunggu, termasuk hari di bulan lain. */
    PERIODE=e.target.value; render();
  };
  $('btn-simpan').onclick=simpan;
  setSync('load');
  render();
  apiGet().then(d=>{
    DB=normalize(d);
    setSync('ok');
    try{ localStorage.setItem(CACHE_KEY,JSON.stringify(DB)); }catch(e){}
    isiPeriode(); render();
  }, err=>{
    /* Jaringan gagal → pakai salinan lokal kalau ada. Panel ini read-mostly,
       jadi salinan basi masih jauh lebih berguna daripada layar kosong —
       asalkan disebut terang-terangan bahwa yang dilihat salinan. */
    let cache=null; try{ cache=JSON.parse(localStorage.getItem(CACHE_KEY)||'null'); }catch(e){}
    DB=normalize(cache);
    setSync('err','✕ Offline');
    pesan(`<div class="notice bad"><div>✕ Tidak bisa membaca data dari server (${esc((err&&err.message)||'gagal')}). ${cache?'Yang ditampilkan <b>salinan lokal</b> dan mungkin sudah basi.':'Belum ada salinan lokal, jadi tabelnya kosong.'} Jangan menyimpan sebelum sambungannya pulih.</div></div>`);
    isiPeriode(); render();
  });
}
boot();
</script>
