<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#F7F6F4">
<title>Rekap Penjualan · Laksamana Muda</title>
<link rel="icon" href="../../assets/LaksamanaMudaLogo.jpeg">

<!-- Guard SSO. Syaratnya HARUS sama persis dengan bacaSesi() di bawah; kalau
     salah satu diubah, ubah keduanya. Ditaruh di <head> supaya halaman tidak
     sempat tergambar sedikit pun bagi yang tidak berhak — penjaga sebenarnya
     tetap di sisi Office, `modules` dibuat server saat login.

     JALURNYA '../../' (dua tingkat), sama seperti panel omset & kas: berkas
     ini ada di deploy/finance/rekap/, jadi yang tertinggal satu tingkat
     mendarat di pemilih panel, bukan di Office. -->
<script>
(function(){try{
  var s=JSON.parse(localStorage.getItem('lm_session')||'null');
  var hidup=s&&s.expiry&&Date.now()<s.expiry;
  var punyaModul=hidup&&(s.modules||[]).some(function(m){return m==='*'||m==='rekap';});
  if(!punyaModul)location.replace('../../');
}catch(e){location.replace('../../');}})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== TEMA & KERANGKA — DISALIN DARI PANEL KAS KECIL (../kas/) =====
   12 Agustus 2026, permintaan user: "tampilan rekap penjualan disamakan dengan
   kas kecil". Sebelumnya panel ini berdiri dengan bilah atas sendiri (satu
   baris judul + pemilih bulan) sementara dua panel Finance lainnya memakai
   sidebar + topbar — jadi berpindah panel terasa berpindah aplikasi.

   Nama kelas sengaja disamakan PERSIS dengan kas (.app .sidebar .nav .main
   .topbar .view .card .stat .seg .notice .empty .field .btn), bukan ditiru
   bentuknya saja. Kalau nanti tema kas berubah, menyalin blok CSS-nya ke sini
   cukup — tidak perlu mencocokkan nama satu per satu. */
:root{
  --ink:#2A2620; --ink-2:#3A3428; --ink-3:#4A4234;
  --gold:#A9791F; --gold-2:#C8961F; --gold-dim:#7A560F;
  --gold-soft:#F2E9D3; --gold-glow:rgba(169,121,31,.13);
  --paper:#F7F6F4; --surface:#FFFFFF; --line:#E7E1D3;
  --line-soft:rgba(60,55,45,.10); --line-hard:rgba(60,55,45,.18);
  --text:#2A2620; --muted:#5C574D; --muted-2:#928C80;
  --ok:#1F9D5F; --ok-bg:#E4F5EC;
  --warn:#B5831A; --warn-bg:#F7EFDB;
  --danger:#C9432B; --danger-bg:#F8E4DF;
  --info:#2F7FC4; --info-bg:#E4EFF8;
  --violet:#7C5FC0; --violet-bg:#ECE6F7;
  --teal:#1F9D8F; --teal-bg:#E2F4F2;
  --radius:16px; --radius-sm:10px; --radius-lg:20px;
  --shadow:0 4px 18px rgba(50,42,28,.06); --shadow-lg:0 18px 48px rgba(50,42,28,.12);
  --ring:0 0 0 3px rgba(227,160,8,.18); --ease:cubic-bezier(.16,1,.3,1);
  --font-display:'Plus Jakarta Sans',system-ui,sans-serif;
  --font-body:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:var(--font-display); --sans:var(--font-body); --sidebar-w:248px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);
  background:radial-gradient(900px 480px at 50% -12%, rgba(227,160,8,.09), transparent 60%),var(--paper);
  color:var(--text);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
h1,h2,h3,h4{font-family:var(--serif);font-weight:700;letter-spacing:-.02em;line-height:1.18;color:var(--ink)}
a{color:var(--info)}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.hidden{display:none !important}
@keyframes lm-rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.rise{animation:lm-rise .5s var(--ease) both}

.btn{border:none;border-radius:var(--radius-sm);padding:11px 17px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:filter .15s var(--ease),transform .1s var(--ease)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:none;box-shadow:var(--ring)}
.btn-sm{padding:8px 12px;font-size:13px}
.btn-xs{padding:5px 9px;font-size:12px;border-radius:8px}
.btn-primary{background:linear-gradient(135deg,var(--gold-2),var(--gold-dim));color:#fff;box-shadow:0 3px 12px rgba(122,86,15,.28)}
.btn-primary:hover{filter:brightness(1.06)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;filter:none}
.btn-ghost{background:var(--surface);border:1.5px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--gold-2);background:var(--gold-soft)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--ink-2);background:var(--gold-soft);border:1px solid var(--line);border-radius:20px;padding:3px 9px}
.pill .dot{width:5px;height:5px;border-radius:50%;background:var(--gold);flex:none}
.field{text-align:left;margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:6px}
.field input,.field select{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);font-size:15px;transition:border-color .15s,box-shadow .15s}
.field input:focus,.field select:focus{outline:none;border-color:var(--gold);box-shadow:var(--ring)}

/* ===== LAYOUT (sama dengan kas) ===== */
.app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);flex:none;background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 18px}
.brand .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--gold-2),var(--gold-dim));display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:800;color:#fff;font-size:18px;flex:none}
.brand .bt{font-family:var(--serif);font-weight:800;font-size:16px;color:var(--ink);letter-spacing:-.02em;line-height:1.1}
.brand .bs{font-size:10.5px;color:var(--muted-2);letter-spacing:.5px;margin-top:2px}
.nav{flex:1}
.nav-group{margin-top:14px}
.nav-label{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted-2);padding:0 10px 7px}
.nav a{position:relative;display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;color:var(--muted);text-decoration:none;font-size:13.5px;font-weight:500;margin-bottom:2px;transition:background .13s,color .13s;cursor:pointer}
.nav a:hover{background:var(--paper);color:var(--ink)}
.nav a.active{background:var(--gold-soft);color:var(--gold-dim);font-weight:600}
.nav a.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--gold)}
.nav a .ico{width:18px;display:flex;align-items:center;justify-content:center;flex:none}
.nav a .ico svg{width:17px;height:17px;stroke-width:1.9;opacity:.85}
.nav a.active .ico svg{opacity:1}
@media(min-width:621px){
  .app.nav-mini .sidebar{width:72px}
  .app.nav-mini .brand .bt,.app.nav-mini .brand .bs,.app.nav-mini .nav-label,.app.nav-mini .su-info{display:none}
  .app.nav-mini .brand{justify-content:center;padding:6px 0 18px}
  .app.nav-mini .nav a{justify-content:center;gap:0;font-size:0;padding:9px 0}
  .app.nav-mini .nav a .ico{font-size:16px;width:auto}
  .app.nav-mini .side-user{flex-direction:column;gap:8px;padding:10px 6px}
}
@media(max-width:620px){#navMiniBtn{display:none}}
.side-user{display:flex;align-items:center;gap:9px;margin-top:12px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
.su-avatar{width:32px;height:32px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--gold-2),var(--gold-dim));color:#fff;font-family:var(--serif);font-weight:800;font-size:14px}
.su-info{min-width:0;flex:1}
.su-info b{display:block;font-size:12.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.su-info span{font-size:10.5px;color:var(--muted-2)}
.logout-x{background:var(--surface);border:1px solid var(--line);color:var(--muted);width:32px;height:32px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;flex:none;transition:.16s}
.logout-x:hover{background:var(--danger-bg);color:var(--danger);border-color:var(--danger)}
.logout-x svg{width:16px;height:16px}
.main{flex:1;min-width:0;padding:26px 30px 60px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.topbar h1{font-size:23px}
.topbar .sub{font-size:13px;color:var(--muted);margin-top:3px}
.month-pick{display:flex;align-items:center;gap:10px}
.month-pick input{padding:9px 11px;border:1.5px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);font-size:14px;font-weight:600;color:var(--ink)}
.sync{font-size:11.5px;font-weight:600;color:var(--muted-2);display:inline-block;max-width:340px;line-height:1.45;text-align:right;overflow-wrap:anywhere}
.sync.ok{color:var(--ok)} .sync.err{color:var(--danger)} .sync.saving{color:var(--warn)}
.hamb{display:none}
@media(max-width:620px){.hamb{display:inline-flex}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 22px;margin-bottom:18px}
.card h3{font-size:16px;margin-bottom:4px}
.card .card-sub{font-size:12.5px;color:var(--muted);margin-bottom:16px}
.row-in{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));margin-bottom:18px}
@media(max-width:620px){.sidebar{position:fixed;z-index:50;transform:translateX(-100%);transition:transform .2s}.sidebar.open{transform:none}.main{padding:18px}}

/* stat cards — pita emas tipis di tepi atas (gaya kas/Marketing) */
.stat{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:17px 18px;box-shadow:var(--shadow)}
.stat::before{content:'';position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--gold-2),var(--gold-dim))}
.stat .lab{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:6px}
.stat .val{font-family:var(--serif);font-weight:700;font-size:22px;color:var(--ink);margin-top:8px;letter-spacing:-.02em;line-height:1.1;overflow-wrap:anywhere}
.stat .foot{font-size:12px;color:var(--muted);margin-top:8px}
.stat.accent{background:linear-gradient(135deg,var(--gold-2),var(--gold-dim));color:#fff;border:none}
.stat.accent::before{display:none}
.stat.accent .lab{color:rgba(255,255,255,.72)}
.stat.accent .val{color:#fff}
.stat.accent .foot{color:rgba(255,255,255,.72)}
.stat.baik .val{color:var(--ok)} .stat.buruk .val{color:var(--danger)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;border-radius:20px;padding:3px 9px}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.bad{background:var(--danger-bg);color:var(--danger)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.mute{background:var(--paper);color:var(--muted);border:1px solid var(--line)}
.notice{padding:11px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;margin-bottom:14px;display:flex;gap:9px;align-items:flex-start}
.notice.ok{background:var(--ok-bg);color:#146c42}
.notice.bad{background:var(--danger-bg);color:#8f2718}
.notice.info{background:var(--info-bg);color:#1a5a91}
.notice.warn{background:var(--warn-bg);color:#7a5a10}
.empty{text-align:center;padding:40px 20px;color:var(--muted-2)}
.empty .big{font-size:34px;margin-bottom:8px}
/* Sub-tab. Rekap (baca) dan Input Harian (isi) SENGAJA dipisah jadi dua
   sub-tab di dalam satu menu, bukan dua menu sidebar dan bukan satu layar
   bertumpuk — pola tetap di repo ini (lihat gantiSub di stock/usage). Yang
   cuma ingin melihat rekap tidak boleh harus melewati isian dulu, dan centang
   yang tersenggol di halaman rekap bisa menyimpan sesuatu yang tidak
   diniatkan. */
.seg{display:inline-flex;background:var(--gold-soft);border-radius:10px;padding:3px;gap:2px;margin-bottom:16px;flex-wrap:wrap}
.seg button{border:none;background:transparent;padding:7px 15px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* tabel biasa (halaman Input Harian) — sama dengan kas */
.tbl-wrap{overflow-x:auto}
.tbl-wrap table{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl-wrap th{text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:10px 12px;border-bottom:2px solid var(--line);white-space:nowrap}
.tbl-wrap td{padding:9px 12px;border-bottom:1px solid var(--line);color:var(--text)}
.tbl-wrap td.num,.tbl-wrap th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl-wrap tbody tr:hover{background:var(--gold-soft)}
.kkd input{width:100%;padding:8px 9px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);font-size:13.5px;text-align:right}
.kkd input:focus{outline:none;border-color:var(--gold);box-shadow:var(--ring)}

/* ===== REKAP BULANAN — HALAMAN, BUKAN LEMBAR EXCEL =====
   12 Agustus 2026, permintaan user: "jangan fully table, buat lebih page UX
   friendly". Versi pertama panel ini memindahkan berkas Excel apa adanya: satu
   tabel 51 kolom yang digulir ke samping dengan dua kolom dibekukan. Itu jujur
   terhadap sumbernya tapi tidak terbaca — tiap pertanyaan sesederhana "tanggal
   3 selisihnya kenapa" menuntut menggulir melewati 40 kolom yang tidak
   ditanyakan, dan di ponsel praktis mustahil.

   Bentuk sekarang tiga lapis, dari yang paling sering ditanya ke yang paling
   jarang:
     1. kartu bulan          — enam angka yang dibuka orang tiap pagi
     2. kartu per kelompok   — POS vs Aktual sebulan, per metode bayar
     3. daftar harian        — satu baris per hari, DIKEMBANGKAN saat diklik
                               menjadi rincian sembilan kelompok hari itu
   Tidak ada satu pun gulir mendatar, dan angka yang jarang dilihat (compliment,
   member deposit, voucher, error) tidak lagi memakan tempat di baris utama —
   ia muncul di dalam rincian yang dibuka. */
.sel-ok{color:var(--muted-2)}
.sel-beda{color:var(--danger);font-weight:700}

/* --- lapis 2: kartu per kelompok pembayaran --- */
.gwrap{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(232px,1fr))}
.gcard{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--surface);padding:14px 15px}
.gcard::before{content:'';position:absolute;inset:0 0 auto 0;height:3px;background:var(--c,var(--gold))}
.gcard .gh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.gcard .gh b{font-family:var(--serif);font-size:14.5px;color:var(--c,var(--ink))}
.gr{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:12.5px;padding:3px 0}
.gr span{color:var(--muted)}
.gr b{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink)}
.gr.tepi{border-top:1px dashed var(--line);margin-top:6px;padding-top:7px}
.gbar{height:6px;border-radius:20px;background:var(--gold-soft);overflow:hidden;margin-top:10px}
.gbar>i{display:block;height:100%;border-radius:20px;background:var(--c,var(--gold))}
.gnote{font-size:11px;color:var(--muted-2);margin-top:6px}

/* --- lapis 3: daftar harian yang bisa dibuka --- */
.hlist{display:flex;flex-direction:column;gap:8px}
.hrow{display:grid;gap:10px;align-items:center;width:100%;text-align:left;
  grid-template-columns:88px repeat(4,minmax(88px,1fr)) auto 18px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:11px 13px;transition:border-color .13s,background .13s}
.hrow:hover{border-color:var(--gold-2);background:var(--gold-soft)}
.hrow.buka{border-color:var(--gold);background:var(--gold-soft)}
.hrow .hd b{display:block;font-family:var(--serif);font-size:14px;color:var(--ink);line-height:1.15}
.hrow .hd span{font-size:11px;color:var(--muted-2)}
.hn .lab{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted-2)}
.hn b{font-size:13.5px;font-variant-numeric:tabular-nums;color:var(--ink);font-weight:700}
.hb{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.hch{font-size:15px;color:var(--muted-2);transition:transform .16s var(--ease);justify-self:end}
.hrow.buka .hch{transform:rotate(180deg);color:var(--gold-dim)}
/* Rincian satu hari. Tidak digambar sampai barisnya diklik — 31 hari × 9
   kelompok yang digambar di muka membuat halaman berat tanpa ada yang
   membacanya. */
.hdet{border:1px solid var(--gold-2);border-top:none;border-radius:0 0 var(--radius-sm) var(--radius-sm);
  background:var(--paper);padding:14px;margin-top:-9px}
.hdet .dg{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(198px,1fr))}
.dtile{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--c,var(--gold));
  border-radius:var(--radius-sm);padding:10px 12px}
.dtile .dh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.dtile .dh b{font-size:13px;color:var(--c,var(--ink))}
.dtile .dr{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:2px 0;color:var(--muted)}
.dtile .dr b{color:var(--ink);font-variant-numeric:tabular-nums}
.dlain{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;padding-top:11px;border-top:1px dashed var(--line);font-size:12px;color:var(--muted)}
.dlain b{display:block;color:var(--ink);font-variant-numeric:tabular-nums;font-size:13px}
@media(max-width:900px){
  .hrow{grid-template-columns:1fr 1fr;row-gap:8px}
  .hrow .hd{grid-column:1/-1}
  .hb{grid-column:1/-1;justify-content:flex-start}
  .hch{display:none}
}

/* Bilah simpan menempel di dasar halaman Input Harian — bentuknya sama dengan
   .balance-bar di kas. Tombol simpan yang harus dicari dengan menggulir ke
   dasar adalah tombol yang lupa ditekan. */
.simpanbar{position:sticky;bottom:0;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--radius);
  padding:13px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:var(--shadow-lg);margin-top:8px}
.simpanbar .ket{flex:1;font-size:12.5px;color:var(--muted);min-width:220px}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">R</div>
      <div><div class="bt">REKAP</div><div class="bs">PENJUALAN · FINANCE</div></div>
    </div>
    <nav class="nav">
      <div class="nav-group">
        <div class="nav-label">Penjualan</div>
        <a class="active" data-view="rekap"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 9v12M3 15h18"/></svg></span> Rekap Penjualan</a>
      </div>
    </nav>
    <div class="side-user">
      <div class="su-avatar" id="suAvatar">?</div>
      <div class="su-info"><b id="suName">—</b><span>rekap</span></div>
      <button class="logout-x" title="Keluar ke Office" aria-label="Keluar ke Office" onclick="location.replace('../../')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v10"/><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/></svg>
      </button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="btn btn-ghost btn-sm hamb" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>

      <button type="button" data-tab="rekap" class="active">Rekap Bulanan</button>
      <button type="button" data-tab="input">Input Harian</button>

  </main>
</div>

<script>
/* ======================================================================
   REKAP PENJUALAN — panel ketiga modul Finance (12 Agustus 2026)

   Menggantikan berkas Excel "Penjualan 2026", sheet per bulan (07'26 dst):
   satu baris per hari, mencocokkan apa yang tercatat di POS dengan apa yang
   benar-benar masuk ke bank/kas.

   "ESB" SUDAH TIDAK DIPAKAI SEBAGAI KATA (12 Agustus 2026, permintaan user):
   di seluruh layar namanya POS. Yang dimaksud tetap sistem kasir yang sama,
   dan angkanya tetap datang dari Daily Report yang diinput di panel Input
   Omset Harian — bukan dari export mentah POS.

   DARI MANA ANGKANYA. Hampir semuanya SUDAH ADA dan tidak diketik lagi di
   sini — dibaca dari blob kompas yang sama dengan dua panel Finance lainnya:

     Total Penjualan   omset bruto Input Omset Harian (food+bev+lainnya−disc)
     POS per metode    reports[tgl].pay[metode].pos     ← Daily Report
     Aktual per metode reports[tgl].pay[metode].actual  ← Daily Report

   Yang MILIK panel ini sendiri cuma tiga, dan cuma tiga ini yang ditulis:
     MDR per bank, penanda Setor, dan centang Input POS.

   MDR MENGURANGI AKTUAL (12 Agustus 2026, permintaan user). Angka `actual`
   dari Daily Report adalah nominal transaksi KOTOR; yang benar-benar mendarat
   di rekening sudah dipotong MDR bank. Jadi di seluruh panel ini:

     Aktual (bersih) = actual − MDR      → dipakai kolom Aktual, Selisih,
     Rekap Aktual    = Σ actual − Σ MDR    Adjust, kaki tabel, dan kartu.

   Akibat yang memang diharapkan: hari yang POS-nya sudah cocok sempurna tetap
   memperlihatkan Total Selisih sebesar MDR-nya. Itu memang biaya bank, bukan
   selisih yang harus dicari — jangan "diperbaiki" dengan mengembalikan aktual
   ke kotor.

   KENAPA `pay` TIDAK BISA DIUBAH DARI SINI. Kalau dua layar boleh menulis
   satu angka yang sama, yang belakangan menang tanpa ada yang tahu — dan
   Daily Report punya jejak submit, catatan bon, serta validasi selisih yang
   tidak ada di sini. Panel ini menandai dan menghitung, tidak mengetik ulang.

   MENYIMPAN LEWAT ENDPOINT SEMPIT `simpanRekap`, bukan saveAll. saveAll
   mengirim SELURUH state, jadi satu penyimpanan dari layar yang salinannya
   sudah basi akan menimpa omset dan breakdown yang baru saja diubah orang di
   panel sebelah — alasan yang sama persis dengan yang membuat panel Kas
   dilarang menulis blob ini. Lihat catatan panjang di simpan_rekap().
   ====================================================================== */
const API_URL='../../kompas-api-mysql/api.php';
const SESSION_KEY='lm_session';
const CACHE_KEY='lm_rekap_cache_v1';

/* Nama field penanda "Input POS" DI DALAM DATA tetap `esb` — kata itu sudah
   diganti di layar, tapi kuncinya TIDAK ikut diganti, dengan dua alasan:
     1. penanda yang sudah tersimpan sejak panel ini lahir akan hilang tanpa
        migrasi kalau kuncinya berubah;
     2. deploy FTP di repo ini sudah dikenal bisa berhasil sebagian (frontend
        naik, backend tidak). Backend lama membaca `esb`; kunci baru akan
        DIABAIKAN DIAM-DIAM olehnya, jadi centang orang hilang tanpa satu pun
        pesan galat. Kunci lama tidak punya risiko itu.
   Satu tempat saja supaya tidak tersebar sebagai kata "esb" di mana-mana. */
const KEY_TANDA='esb';

const $=id=>document.getElementById(id);
const num=v=>{const n=parseInt(String(v).replace(/[^0-9-]/g,''),10);return isNaN(n)?0:n;};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtRp=n=>'Rp'+Math.round(n||0).toLocaleString('id-ID');
/* Nol ditulis sebagai "—", bukan "Rp0". Tabel selebar ini punya ratusan sel
   kosong; "Rp0" di semuanya membuat mata tidak bisa menemukan angka yang
   benar-benar ada. */
const rp0=n=>(!n?'<span style="color:var(--muted-2)">—</span>':fmtRp(n));
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const monthKeyOf=ds=>String(ds||'').slice(0,7);
const MONTHS_F=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const labelBulan=ym=>{const b=String(ym||'').split('-');return (MONTHS_F[(+b[1])-1]||'?')+' '+(b[0]||'');};
const DAYS=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
function labelHari(ds){ const d=new Date(ds+'T00:00:00'); return DAYS[d.getDay()]+', '+d.getDate(); }
function labelTglPanjang(ds){ const d=new Date(ds+'T00:00:00');
  return DAYS[d.getDay()]+', '+d.getDate()+' '+MONTHS_F[d.getMonth()]+' '+d.getFullYear(); }
function hariDalamBulan(ym){
  const [y,m]=ym.split('-').map(Number);
  const n=new Date(y,m,0).getDate(); const out=[];
  for(let i=1;i<=n;i++) out.push(ym+'-'+String(i).padStart(2,'0'));
  return out;
}

let CURRENT_USER=null;
function bacaSesi(){
  try{
    const s=JSON.parse(localStorage.getItem(SESSION_KEY)||'null');
    if(!s||!s.expiry||Date.now()>=s.expiry) return null;
    const m=s.modules||[];
    if(m.indexOf('*')<0 && m.indexOf('rekap')<0) return null;
    const adm=s.adminModules||[];
    return {id:s.userId,name:s.name,isAdmin:(adm.indexOf('*')>-1||adm.indexOf('rekap')>-1)};
  }catch(e){ return null; }
}

let DB=null, PERIODE=monthKeyOf(todayISO()), TANGGAL=todayISO(), TAB='rekap';
/* Suntingan yang BELUM tersimpan, dipisah dari DB. Dipisah dengan sengaja:
   selama belum tersimpan, layar harus bisa menunjukkan mana yang berubah, dan
   kegagalan simpan tidak boleh meninggalkan DB yang berbeda dari server.
   Bentuknya: UBAH[tgl] = {setor:bool, mdr:{bank:n}, tanda:{grup:bool}} */
let UBAH={};
let SIMPAN_JALAN=false;

/* ---- metode pembayaran, SAMA KUNCINYA dengan PAYS di Daily Report ----
   Kunci yang meleset satu huruf memulangkan 0 tanpa galat apa pun, dan
   kolomnya akan terlihat "memang kosong hari itu". Kalau PAYS di
   deploy/finance/omset/index.html berubah, samakan di sini. Kunci `qris_esb`
   masih bernama begitu di DATA (labelnya di panel omset sudah "QRIS POS") —
   mengganti kuncinya berarti seluruh riwayat Daily Report jadi nol. */
function pay(rec,k,f){ const p=(rec&&rec.pay&&rec.pay[k])||{}; return num(p[f]); }

/* ---- KELOMPOK "INPUT POS" ----
   Tiap kelompok = satu centang di berkas Excel-nya (kolom J, L, S, Z, AI, AK,
   AM, AO, AY). Yang dikunci ke POS adalah NOMINAL ADJUST kelompok itu:

     - Kelompok yang punya sisi POS dan sisi Aktual (cash, bri, mandiri, bca)
       → adjust-nya SELISIH keduanya. Itulah angka yang dimasukkan ke POS
         supaya sistem cocok dengan setoran sebenarnya.
     - Kelompok yang cuma punya sisi Aktual (QR Order, Transfer, Gofood,
       Grabfood, Error) → tidak ada pembanding, jadi adjust-nya nominal itu
       sendiri.

   `pos` menyebut kunci Daily Report yang membentuk tiap sisi. Dipisah begini
   supaya penjumlahan kolom, penjumlahan kaki tabel, dan nominal yang dihitung
   saat dicentang MUSTAHIL berbeda — ketiganya membaca daftar ini. */
const GRUP=[
  {k:'cash',     n:'Cash',      warna:'ok',      pos:['cash'],                    akt:['cash']},
  {k:'qr_order', n:'QR Order',  warna:'info',    pos:[],                          akt:['qris_esb']},
  {k:'bri',      n:'BRI',       warna:'info',    pos:['edc_bri','qris_bri'],      akt:['edc_bri','qris_bri'],         mdr:'bri'},
  {k:'mandiri',  n:'Mandiri',   warna:'warn',    pos:['edc_mandiri','qris_mandiri'], akt:['edc_mandiri','qris_mandiri'], mdr:'mandiri'},
  {k:'bca',      n:'BCA',       warna:'violet',  pos:['edc_bca','qris_bca'],      akt:['edc_bca','qris_bca'],         mdr:'bca'},
  {k:'transfer', n:'Transfer',  warna:'teal',    pos:[],                          akt:['transfer_uob']},
  {k:'gofood',   n:'Gofood',    warna:'danger',  pos:[],                          akt:['gofood']},
  {k:'grabfood', n:'Grabfood',  warna:'danger',  pos:[],                          akt:['grabfood']},
  {k:'error',    n:'Error',     warna:'danger',  pos:[],                          akt:['error_customer','error_floor','error_kasir','error_bar']}
];
const BANK=GRUP.filter(g=>g.mdr).map(g=>g.mdr);   // ['bri','mandiri','bca']
/* Kolom Aktual yang membentuk REKAP AKTUAL, yaitu pembanding Total Penjualan.
   Isinya SELURUH metode yang ada di Daily Report kecuali dua di bawah, dan
   itu keputusan yang perlu ditulis alasannya:

     error_customer  — berkas Excel-nya TIDAK memasukkannya ke rumus Rekap
       Aktual (kolom D) pada 28 dari 30 hari; dua hari yang memasukkannya
       (baris 15 & 16) justru yang menyimpang. Diikuti yang mayoritas.
     error_kitchen   — tidak punya kolom sama sekali di berkas itu.

   Keduanya TETAP DITAMPILKAN sebagai kolom sendiri supaya uangnya tidak
   hilang dari pandangan — yang tidak ikut cuma penjumlahannya. */
const AKT_LUAR=['error_customer','error_kitchen'];
function semuaKunciPay(){
  const out=[];
  GRUP.forEach(g=>g.akt.forEach(k=>{ if(out.indexOf(k)<0) out.push(k); }));
  ['compliment','member_dep','voucher','error_kitchen'].forEach(k=>{ if(out.indexOf(k)<0) out.push(k); });
  return out;
}
const PAY_REKAP=semuaKunciPay().filter(k=>AKT_LUAR.indexOf(k)<0);

/* ---- pembacaan satu hari ---- */
function recOf(tgl){ return (DB&&DB.reports&&DB.reports[tgl])||null; }
function omsetOf(tgl){
  const d=(DB&&DB.daily||[]).find(x=>x.date===tgl);
  if(!d) return 0;
  /* Bruto − diskon, sama dengan netOf() di panel omset. Kalau dipakai bruto
     saja, Total Penjualan akan selalu lebih besar dari Rekap Aktual sebesar
     diskon hari itu dan setiap hari terlihat selisih.

     NAMA FIELD-nya `food`/`bev`/`lainnya`, BUKAN omzet_*. Salah nama di sini
     tidak melempar apa pun — num(undefined) memulangkan 0 — jadi Total
     Penjualan akan diam-diam nol sebulan penuh dan seluruh kolom Selisih
     terlihat sebesar Rekap Aktual. Samakan dengan grossOf() di panel omset. */
  return num(d.food)+num(d.bev)+num(d.lainnya)-num(d.discount);
}
/* Nilai tersimpan, ditimpa suntingan yang belum disimpan. Satu fungsi untuk
   ketiganya supaya tabel, kaki tabel, dan kartu ringkas tidak pernah membaca
   dua sumber yang berbeda. */
function mdrOf(tgl,bank){
  const u=UBAH[tgl]; if(u&&u.mdr&&u.mdr[bank]!==undefined) return num(u.mdr[bank]);
  const r=recOf(tgl); return num(r&&r.mdr&&r.mdr[bank]);
}
function setorOf(tgl){
  const u=UBAH[tgl]; if(u&&u.setor!==undefined) return !!u.setor;
  const r=recOf(tgl); return !!(r&&r.setor);
}
function tandaOf(tgl,grup){
  const u=UBAH[tgl]; if(u&&u.tanda&&u.tanda[grup]!==undefined) return !!u.tanda[grup];
  const r=recOf(tgl); return !!(r&&r[KEY_TANDA]&&r[KEY_TANDA][grup]);
}
function setUbah(tgl,jalan,nilai){
  UBAH[tgl]=UBAH[tgl]||{};
  if(jalan.length===1) UBAH[tgl][jalan[0]]=nilai;
  else { UBAH[tgl][jalan[0]]=UBAH[tgl][jalan[0]]||{}; UBAH[tgl][jalan[0]][jalan[1]]=nilai; }
}
function adaUbah(){ return Object.keys(UBAH).length>0; }

/* ---- angka satu hari ----
   SATU-SATUNYA tempat MDR dikurangkan. Tabel bulanan, kaki tabel, kartu
   ringkas, dan halaman Input Harian semuanya lewat sini, jadi mustahil ada
   satu layar yang masih memakai aktual kotor sementara yang lain sudah
   bersih. */
function hitungHari(tgl){
  const r=recOf(tgl);
  const sisi=(daftar,f)=>daftar.reduce((s,k)=>s+pay(r,k,f),0);
  const g={};
  GRUP.forEach(x=>{
    const posN=sisi(x.pos,'pos');
    const kotor=sisi(x.akt,'actual');
    const mdrN=x.mdr?mdrOf(tgl,x.mdr):0;
    const aktN=kotor-mdrN;
    /* Kelompok tanpa sisi POS tidak punya selisih — bukan "selisih nol".
       Menulisnya nol membuat kolom Selisih terlihat sudah dicocokkan padahal
       tidak ada yang dicocokkan. */
    g[x.k]={pos:posN, kotor:kotor, mdr:mdrN, akt:aktN, punyaPos:x.pos.length>0,
            selisih:x.pos.length?posN-aktN:null,
            adjust:x.pos.length?posN-aktN:aktN};
  });
  const mdrTotal=BANK.reduce((s,b)=>s+mdrOf(tgl,b),0);
  const rekapAkt=PAY_REKAP.reduce((s,k)=>s+pay(r,k,'actual'),0)-mdrTotal;
  const jual=omsetOf(tgl);
  return {r,g,mdrTotal,rekapAkt,jual,selisihTotal:jual-rekapAkt,
          comp:pay(r,'compliment','actual'), mdep:pay(r,'member_dep','actual'),
          vou:pay(r,'voucher','actual'), errCust:pay(r,'error_customer','actual'),
          errKit:pay(r,'error_kitchen','actual'),
          adaData:!!r || jual!==0};
}
/* Ringkasan sebulan. Dipakai kartu di kedua sub-tab supaya angkanya tidak
   mungkin berbeda antara "Rekap Bulanan" dan bilah info di "Input Harian". */
function ringkasBulan(){
  const baris=hariDalamBulan(PERIODE).map(t=>({tgl:t,h:hitungHari(t)})).filter(x=>x.h.adaData);
  let jual=0,akt=0,mdr=0,adj=0,adjKunci=0,nSetor=0;
  /* Totalan per kelompok DAN totalan lain-lain ikut dihitung di sini, bukan di
     penggambarnya: kartu kelompok dan rincian harian membaca daftar yang sama,
     jadi tidak mungkin ada dua tempat yang menjumlahkan dengan cara berbeda. */
  const g={}; GRUP.forEach(x=>g[x.k]={pos:0,kotor:0,mdr:0,akt:0,sel:0,adj:0,cek:0,punyaPos:x.pos.length>0});
  const lain={comp:0,mdep:0,vou:0,errC:0,errK:0};
  baris.forEach(({tgl,h})=>{
    jual+=h.jual; akt+=h.rekapAkt; mdr+=h.mdrTotal;
    lain.comp+=h.comp; lain.mdep+=h.mdep; lain.vou+=h.vou; lain.errC+=h.errCust; lain.errK+=h.errKit;
    GRUP.forEach(x=>{
      const s=h.g[x.k], t=g[x.k];
      t.pos+=s.pos; t.kotor+=s.kotor; t.mdr+=s.mdr; t.akt+=s.akt; t.adj+=s.adjust;
      if(s.selisih!==null) t.sel+=s.selisih;
      adj+=s.adjust;
      if(tandaOf(tgl,x.k)){ t.cek++; adjKunci+=s.adjust; }
    });
    if(setorOf(tgl)) nSetor++;
  });
  return {baris,jual,akt,mdr,adj,adjKunci,nSetor,sel:jual-akt,g,lain};
}

/* ====================== KERANGKA ====================== */
function setSync(st,msg){
  const el=$('syncBox'); if(!el) return;
  el.className='sync'+(st==='ok'?' ok':st==='err'?' err':st==='saving'?' saving':'');
  el.textContent=msg||(st==='ok'?'✓ Tersambung':st==='err'?'✕ Gagal':'Memuat…');
}
function toggleNav(){ $('app').classList.toggle('nav-mini'); }
const SUB_TITLE={
  rekap:'Cocokkan POS dengan setoran bank — pengganti berkas Excel "Penjualan 2026"',
  input:'MDR, penanda Setor, dan centang Input POS untuk satu hari'
};
function gantiTab(t){
  TAB=(t==='input')?'input':'rekap';
  document.querySelectorAll('#subtab button').forEach(b=>b.classList.toggle('active',b.dataset.tab===TAB));
  $('pageSub').textContent=SUB_TITLE[TAB];
  $('sidebar').classList.remove('open');
  render();
}
function isiPeriode(){
  /* Pemilih bulan bawaan peramban (sama dengan kas), bukan <select> berisi
     bulan yang kebetulan ada datanya: bulan yang belum punya data pun harus
     bisa dibuka — MDR & penanda Setor kadang diisi sebelum Daily Report-nya. */
  $('periodPick').value=PERIODE;
}

/* ====================== SUB-TAB 1: REKAP BULANAN ====================== */
function kartu(lab,val,foot,kelas){
  return `<div class="stat ${kelas||''}"><div class="lab">${esc(lab)}</div><div class="val mono">${val}</div><div class="foot">${foot}</div></div>`;
}
function kartuBulan(R){
  return `<div class="row-in">`
    +kartu('Total Penjualan',fmtRp(R.jual),R.baris.length+' hari ada data','accent')
    +kartu('Rekap Aktual',fmtRp(R.akt),'seluruh kolom Aktual, sudah dipotong MDR','')
    +kartu('Total MDR',fmtRp(R.mdr),'biaya bank yang mengurangi aktual','')
    +kartu('Total Selisih',fmtRp(R.sel),'Penjualan − Rekap Aktual',Math.abs(R.sel)<1?'baik':'buruk')
    /* Yang dijumlahkan nominal ADJUST tiap kelompok yang centang Input POS-nya
       sudah menyala, jadi angka ini menjawab satu pertanyaan: berapa yang sudah
       benar-benar dikunci di POS bulan ini. */
    +kartu('Adjust Terkunci di POS',fmtRp(R.adjKunci),
        (R.adj-R.adjKunci===0?'seluruhnya sudah diinput':fmtRp(R.adj-R.adjKunci)+' belum diinput'),
        (R.adj-R.adjKunci===0?'baik':''))
    +kartu('Sudah Setor',R.nSetor+' / '+R.baris.length,'hari yang cash-nya sudah disetor','')
    +`</div>`;
}
const chipSelisih=v=>(Math.abs(v)<1
  ? '<span class="chip ok">cocok</span>'
  : `<span class="chip bad">${esc(fmtRp(v))}</span>`);

function viewRekap(){
  const R=ringkasBulan();
  let html=kartuBulan(R);
  if(adaUbah()) html+=`<div class="notice warn"><div>⚠ <b>${Object.keys(UBAH).length} hari punya perubahan yang belum disimpan.</b> Angka di bawah sudah memperhitungkannya. Buka sub-tab <b>Input Harian</b> untuk menyimpan.</div></div>`;

  if(!R.baris.length){
    return html+'<div class="card"><div class="empty"><div class="big">🗓️</div>Belum ada data omset maupun Daily Report untuk <b>'+esc(labelBulan(PERIODE))+'</b>.<br>Isi dulu di panel <b>Input Omset Harian</b>.</div></div>';
  }

  /* ---- lapis 2: satu kartu per kelompok pembayaran ---- */
  html+=`<div class="card"><h3>Per Metode Pembayaran</h3>
    <div class="card-sub">Sebulan penuh, ${R.baris.length} hari. Aktual di sini sudah dipotong MDR.</div>
    <div class="gwrap">`;
  GRUP.forEach(g=>{
    const t=R.g[g.k];
    const pers=R.baris.length?Math.round(t.cek/R.baris.length*100):0;
    html+=`<div class="gcard" style="--c:var(--${g.warna})">
      <div class="gh"><b>${esc(g.n)}</b>${t.punyaPos?chipSelisih(t.sel):'<span class="chip mute">tanpa pembanding</span>'}</div>
      ${t.punyaPos?`<div class="gr"><span>POS</span><b>${fmtRp(t.pos)}</b></div>`:''}
      <div class="gr"><span>Aktual${t.mdr?' (bersih)':''}</span><b>${fmtRp(t.akt)}</b></div>
      ${t.mdr?`<div class="gr"><span>MDR</span><b>−${fmtRp(t.mdr)}</b></div>`:''}
      <div class="gr tepi"><span>Adjust</span><b>${fmtRp(t.adj)}</b></div>
      <div class="gbar"><i style="width:${pers}%"></i></div>
      <div class="gnote">Input POS ${t.cek}/${R.baris.length} hari (${pers}%)</div>
    </div>`;
  });
  html+=`</div></div>`;

  /* ---- lapis 3: daftar harian, rinciannya dibuka saat diklik ---- */
  html+=`<div class="card"><h3>Rincian Harian</h3>
    <div class="card-sub">Klik satu hari untuk melihat rincian sembilan kelompok pembayarannya. Dari sana ada tombol untuk langsung mengisi MDR &amp; penandanya.</div>
    <div class="hlist">`;
  R.baris.forEach(({tgl,h})=>{
    const nCek=GRUP.filter(g=>tandaOf(tgl,g.k)).length;
    html+=`<button type="button" class="hrow" data-tgl="${tgl}" aria-expanded="false">
        <div class="hd"><b>${esc(labelHari(tgl))}</b><span>${esc(MONTHS_F[+PERIODE.split('-')[1]-1]||'')}</span></div>
        <div class="hn"><span class="lab">Penjualan</span><b>${rp0(h.jual)}</b></div>
        <div class="hn"><span class="lab">Rekap Aktual</span><b>${rp0(h.rekapAkt)}</b></div>
        <div class="hn"><span class="lab">MDR</span><b>${rp0(h.mdrTotal)}</b></div>
        <div class="hn"><span class="lab">Selisih</span><b class="${Math.abs(h.selisihTotal)<1?'sel-ok':'sel-beda'}">${rp0(h.selisihTotal)}</b></div>
        <div class="hb">${setorOf(tgl)?'<span class="chip ok">✓ Setor</span>':'<span class="chip mute">belum setor</span>'}
          <span class="chip ${nCek===GRUP.length?'ok':(nCek?'warn':'mute')}">POS ${nCek}/${GRUP.length}</span></div>
        <span class="hch">⌄</span>
      </button>
      <div class="hdet hidden" id="det-${tgl}"></div>`;
  });
  html+=`</div></div>`;

  html+=`<div class="notice info"><div><b>Angka POS &amp; Aktual dibaca dari Daily Report</b> di panel Input Omset Harian — tidak bisa diubah dari sini, supaya satu angka tidak ditulis dua layar. <b>Aktual sudah dipotong MDR.</b> Untuk mengisi MDR atau menandai Setor / Input POS, buka sub-tab <b>Input Harian</b>.</div></div>`;
  return html;
}

/* Rincian satu hari — digambar saat barisnya dibuka, bukan di muka. */
function detailHari(tgl){
  const h=hitungHari(tgl);
  let html='<div class="dg">';
  GRUP.forEach(g=>{
    const x=h.g[g.k];
    html+=`<div class="dtile" style="--c:var(--${g.warna})">
      <div class="dh"><b>${esc(g.n)}</b>${tandaOf(tgl,g.k)?'<span class="chip ok">✓ Input POS</span>':'<span class="chip mute">belum diinput</span>'}</div>
      ${x.punyaPos?`<div class="dr"><span>POS</span><b>${rp0(x.pos)}</b></div>`:''}
      <div class="dr"><span>Aktual${x.mdr?' kotor':''}</span><b>${rp0(x.kotor)}</b></div>
      ${x.mdr?`<div class="dr"><span>MDR</span><b>−${fmtRp(x.mdr)}</b></div><div class="dr"><span>Aktual bersih</span><b>${rp0(x.akt)}</b></div>`:''}
      ${x.punyaPos?`<div class="dr"><span>Selisih</span><b class="${Math.abs(x.selisih)<1?'sel-ok':'sel-beda'}">${rp0(x.selisih)}</b></div>`:''}
      <div class="dr"><span>Adjust</span><b>${rp0(x.adjust)}</b></div>
    </div>`;
  });
  html+='</div>';
  /* Lain-lain tidak ikut Rekap Aktual (lihat AKT_LUAR & PAY_REKAP), jadi
     tempatnya di kaki rincian — terlihat, tapi tidak ikut mengaburkan angka
     yang dicocokkan. */
  html+=`<div class="dlain">
      <div>Compliment<b>${rp0(h.comp)}</b></div>
      <div>Member Deposit<b>${rp0(h.mdep)}</b></div>
      <div>Voucher<b>${rp0(h.vou)}</b></div>
      <div>Error Customer<b>${rp0(h.errCust)}</b></div>
      <div>Error Kitchen<b>${rp0(h.errKit)}</b></div>
      <div style="flex:1"></div>
      <button class="btn btn-ghost btn-sm" data-isi="${tgl}">✎ Isi MDR &amp; penanda hari ini</button>
    </div>`;
  return html;
}
function bukaHari(tgl){
  const det=$('det-'+tgl); if(!det) return;
  const row=document.querySelector('.hrow[data-tgl="'+tgl+'"]');
  const buka=det.classList.contains('hidden');
  if(buka && !det.dataset.isi){ det.innerHTML=detailHari(tgl); det.dataset.isi='1'; }
  det.classList.toggle('hidden',!buka);
  if(row){ row.classList.toggle('buka',buka); row.setAttribute('aria-expanded',buka?'true':'false'); }
}

/* ====================== SUB-TAB 2: INPUT HARIAN ====================== */
function viewInput(){
  const h=hitungHari(TANGGAL);
  const nUbah=Object.keys(UBAH).length;

  let html=`<div class="card">
    <h3>Hari yang diisi</h3>
    <div class="card-sub">Semua isian di halaman ini milik tanggal yang dipilih. Perubahan di tanggal lain tidak hilang saat berpindah — semuanya ikut terkirim sekali Simpan.</div>
    <div style="display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap">
      <div class="field" style="margin-bottom:0;min-width:210px"><label for="tglPick">Tanggal</label>
        <input type="date" id="tglPick" value="${TANGGAL}"></div>
      <button class="btn btn-ghost" id="tglKemarin">← Hari sebelumnya</button>
      <button class="btn btn-ghost" id="tglBesok">Hari berikutnya →</button>
      <button class="btn btn-ghost" id="tglHariIni">Hari ini</button>
    </div>
  </div>`;

  html+=`<div class="row-in">`
    +kartu('Total Penjualan',fmtRp(h.jual),esc(labelTglPanjang(TANGGAL)),'accent')
    +kartu('Rekap Aktual',`<span id="o-akt">${fmtRp(h.rekapAkt)}</span>`,'sudah dipotong MDR','')
    +kartu('Total MDR',`<span id="o-mdr">${fmtRp(h.mdrTotal)}</span>`,'biaya bank hari ini','')
    +kartu('Selisih',`<span id="o-sel">${fmtRp(h.selisihTotal)}</span>`,'Penjualan − Rekap Aktual','')
    +`</div>`;

  if(!h.r) html+=`<div class="notice warn"><div>⚠ Daily Report tanggal ini <b>belum ada</b>, jadi seluruh angka POS &amp; Aktual masih nol. MDR dan penandanya tetap boleh diisi sekarang — urutan kerjanya di lapangan memang tidak selalu report dulu.</div></div>`;

  html+=`<div class="card">
    <h3>Setoran Cash</h3>
    <div class="card-sub">Penanda bahwa cash hari ini sudah disetor ke bank.</div>
    <label style="display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;cursor:pointer">
      <input type="checkbox" id="cekSetor" ${setorOf(TANGGAL)?'checked':''} style="width:17px;height:17px;accent-color:var(--gold);cursor:pointer">
      Cash tanggal ${esc(labelTglPanjang(TANGGAL))} sudah disetor
    </label>
  </div>`;

  html+=`<div class="card">
    <h3>MDR &amp; Penanda Input POS</h3>
    <div class="card-sub">MDR mengurangi nilai Aktual kelompoknya. Centang <b>Input POS</b> berarti nominal <em>adjust</em> kelompok itu — selisih POS − Aktual, atau nominalnya sendiri untuk kelompok tanpa pembanding — sudah dikunci di POS.</div>
    <div class="tbl-wrap kkd"><table><thead><tr>
      <th>Kelompok</th><th class="num">POS</th><th class="num">Aktual (kotor)</th>
      <th class="num" style="width:130px">MDR</th><th class="num">Aktual (bersih)</th>
      <th class="num">Selisih</th><th class="num">Adjust</th><th style="text-align:center">Input POS</th>
    </tr></thead><tbody>`;
  GRUP.forEach(g=>{
    const x=h.g[g.k];
    html+=`<tr>
      <td><b style="color:var(--${g.warna})">${esc(g.n)}</b></td>
      <td class="num mono">${x.punyaPos?rp0(x.pos):'<span style="color:var(--muted-2)">—</span>'}</td>
      <td class="num mono">${rp0(x.kotor)}</td>
      <td class="num">${g.mdr
          ? `<input inputmode="numeric" data-mdr="${g.mdr}" value="${x.mdr||''}" placeholder="0" aria-label="MDR ${esc(g.n)}">`
          : '<span style="color:var(--muted-2)">—</span>'}</td>
      <td class="num mono" id="o-net-${g.k}">${rp0(x.akt)}</td>
      <td class="num mono ${x.selisih===null?'':(Math.abs(x.selisih)<1?'sel-ok':'sel-beda')}" id="o-sel-${g.k}">${x.selisih===null?'<span style="color:var(--muted-2)">—</span>':rp0(x.selisih)}</td>
      <td class="num mono" id="o-adj-${g.k}">${rp0(x.adjust)}</td>
      <td style="text-align:center"><input type="checkbox" data-tanda="${g.k}" ${tandaOf(TANGGAL,g.k)?'checked':''} style="width:16px;height:16px;accent-color:var(--gold);cursor:pointer"></td>
    </tr>`;
  });
  html+=`</tbody></table></div></div>`;

  html+=`<div class="simpanbar">
    <div class="ket" id="ket-simpan">${nUbah
      ? `<b style="color:var(--warn)">${nUbah} hari punya perubahan yang belum disimpan.</b> Yang disimpan hanya MDR, Setor, dan centang Input POS.`
      : 'Yang disimpan dari layar ini hanya <b>MDR</b>, <b>Setor</b>, dan centang <b>Input POS</b>. Angka POS/Aktual tetap milik Daily Report.'}</div>
    <button class="btn btn-primary" id="btn-simpan"${(nUbah&&!SIMPAN_JALAN)?'':' disabled'}>💾 Simpan Perubahan</button>
  </div>`;
  return html;
}

/* Memperbarui HANYA angka turunan di halaman Input Harian. Tabelnya TIDAK
   digambar ulang: mengetik MDR mengubah Aktual bersih, Selisih, Adjust, dan
   keempat kartu sekaligus, dan render() penuh akan merebut fokus dari kotak
   yang sedang diketik pada karakter pertama. */
function segarkanTurunan(){
  if(TAB!=='input') return;
  const h=hitungHari(TANGGAL);
  const set=(id,html)=>{ const el=$(id); if(el) el.innerHTML=html; };
  set('o-akt',fmtRp(h.rekapAkt)); set('o-mdr',fmtRp(h.mdrTotal)); set('o-sel',fmtRp(h.selisihTotal));
  GRUP.forEach(g=>{
    const x=h.g[g.k];
    set('o-net-'+g.k,rp0(x.akt));
    set('o-adj-'+g.k,rp0(x.adjust));
    const s=$('o-sel-'+g.k);
    if(s){
      s.innerHTML=(x.selisih===null?'<span style="color:var(--muted-2)">—</span>':rp0(x.selisih));
      s.className='num mono '+(x.selisih===null?'':(Math.abs(x.selisih)<1?'sel-ok':'sel-beda'));
    }
  });
  segarkanSimpan();
}
function segarkanSimpan(){
  const n=Object.keys(UBAH).length;
  const btn=$('btn-simpan'); if(btn) btn.disabled=(n===0||SIMPAN_JALAN);
  const ket=$('ket-simpan'); if(!ket) return;
  ket.innerHTML = n
    ? `<b style="color:var(--warn)">${n} hari punya perubahan yang belum disimpan.</b> Yang disimpan hanya MDR, Setor, dan centang Input POS.`
    : 'Yang disimpan dari layar ini hanya <b>MDR</b>, <b>Setor</b>, dan centang <b>Input POS</b>. Angka POS/Aktual tetap milik Daily Report.';
}

/* ====================== RENDER ====================== */
function render(){
  const el=$('app-view');
  if(!DB){ el.innerHTML='<div class="card"><div class="empty"><div class="big">⏳</div>Memuat data dari server…</div></div>'; return; }
  el.classList.remove('rise'); void el.offsetWidth; el.classList.add('rise');
  el.innerHTML=(TAB==='input')?viewInput():viewRekap();
  if(TAB==='input') pasangPenangan();
}
function geserTanggal(n){
  const d=new Date(TANGGAL+'T00:00:00'); d.setDate(d.getDate()+n);
  pilihTanggal(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'));
}
function pilihTanggal(ds){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(ds||'')) return;
  TANGGAL=ds;
  /* Mengubah tanggal ikut memindahkan PERIODE. Tanpa itu, kembali ke sub-tab
     Rekap akan menampilkan bulan lama padahal orangnya baru saja mengisi hari
     di bulan lain — dan tidak ada apa pun di layar yang menjelaskan kenapa.
     (Pola yang sama dipakai datePick di panel kas.) */
  PERIODE=monthKeyOf(TANGGAL); isiPeriode();
  render();
}
function pasangPenangan(){
  const tp=$('tglPick'); if(tp) tp.onchange=e=>pilihTanggal(e.target.value);
  const bk=$('tglKemarin'); if(bk) bk.onclick=()=>geserTanggal(-1);
  const bb=$('tglBesok');   if(bb) bb.onclick=()=>geserTanggal(1);
  const bh=$('tglHariIni'); if(bh) bh.onclick=()=>pilihTanggal(todayISO());
  const cs=$('cekSetor');   if(cs) cs.onchange=()=>{ setUbah(TANGGAL,['setor'],cs.checked); segarkanSimpan(); };
  document.querySelectorAll('input[data-tanda]').forEach(c=>{
    c.onchange=()=>{ setUbah(TANGGAL,['tanda',c.dataset.tanda],c.checked); segarkanSimpan(); };
  });
  document.querySelectorAll('input[data-mdr]').forEach(inp=>{
    inp.oninput=()=>{ setUbah(TANGGAL,['mdr',inp.dataset.mdr],num(inp.value)); segarkanTurunan(); };
  });
  const bs=$('btn-simpan'); if(bs) bs.onclick=simpan;
}
/* Klik di halaman Rekap ditangani secara DELEGASI dari #app-view, bukan
   dipasang ulang ke tiap baris sesudah render: barisnya bisa 31 buah dan
   rinciannya lahir belakangan (saat dibuka), jadi penangan yang dipasang
   sekali di wadah adalah satu-satunya yang tidak pernah ketinggalan elemen
   baru. Wadahnya sendiri tidak pernah diganti — yang diganti isinya. */
function pasangDelegasi(){
  $('app-view').addEventListener('click',e=>{
    const isi=e.target.closest('[data-isi]');
    if(isi){ pilihTanggal(isi.dataset.isi); gantiTab('input'); return; }
    const row=e.target.closest('.hrow');
    if(row) bukaHari(row.dataset.tgl);
  });
}

/* ====================== SIMPAN ====================== */
function fetchTimeout(url,opts,ms){
  const c=new AbortController(); const t=setTimeout(()=>c.abort(),ms||25000);
  opts=opts||{}; opts.signal=c.signal;
  return fetch(url,opts).then(r=>{clearTimeout(t);return r;},e=>{clearTimeout(t);throw e;});
}
function simpan(){
  if(SIMPAN_JALAN||!adaUbah()) return;
  SIMPAN_JALAN=true;
  const btn=$('btn-simpan'); const semula=btn?btn.innerHTML:'';
  if(btn){ btn.disabled=true; btn.innerHTML='Menyimpan…'; }
  setSync('saving','Menyimpan…');
  const kiriman=JSON.parse(JSON.stringify(UBAH));
  /* `tanda` di layar → `esb` di kawat. Lihat catatan KEY_TANDA di atas: yang
     berganti nama cuma katanya, bukan bentuk datanya. */
  const badan={};
  Object.keys(kiriman).forEach(tgl=>{
    const u=kiriman[tgl], o={};
    if(u.setor!==undefined) o.setor=u.setor;
    if(u.mdr) o.mdr=u.mdr;
    if(u.tanda) o[KEY_TANDA]=u.tanda;
    badan[tgl]=o;
  });
  fetchTimeout(API_URL,{method:'POST',redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'simpanRekap',data:{hari:badan,by:(CURRENT_USER&&CURRENT_USER.name)||''}})},40000)
    .then(r=>r.text())
    .then(t=>{
      let j=null; try{ j=JSON.parse(t); }catch(e){}
      if(!j) throw new Error('balasan bukan JSON (kompas-api-mysql belum diperbarui?)');
      if(!j.ok) throw new Error(j.error||'ditolak server');
      /* DB baru disamakan SETELAH server mengiyakan, dan hanya untuk yang
         benar-benar dikirim. Kalau disamakan lebih dulu, kegagalan simpan
         meninggalkan layar yang memajang angka baru padahal server masih
         angka lama — tanpa cara melihatnya sampai halaman dimuat ulang. */
      DB.reports=DB.reports||{};
      Object.keys(kiriman).forEach(tgl=>{
        const u=kiriman[tgl];
        const r=DB.reports[tgl]=DB.reports[tgl]||{};
        if(u.setor!==undefined) r.setor=!!u.setor;
        if(u.mdr){ r.mdr=r.mdr||{}; Object.keys(u.mdr).forEach(b=>{ r.mdr[b]=num(u.mdr[b]); }); }
        if(u.tanda){ r[KEY_TANDA]=r[KEY_TANDA]||{}; Object.keys(u.tanda).forEach(g=>{ r[KEY_TANDA][g]=!!u.tanda[g]; }); }
      });
      UBAH={};
      try{ localStorage.setItem(CACHE_KEY,JSON.stringify(DB)); }catch(e){}
      setSync('ok');
      const tk=(j.data&&j.data.takDikenal)||[];
      pesan(tk.length
        ? `<div class="notice warn"><div>⚠ Tersimpan, tapi ${tk.length} penanda tidak dikenal server (<b>${esc(tk.join(', '))}</b>) dan <b>tidak ikut disimpan</b> — kemungkinan backend kompas belum diperbarui.</div></div>`
        : `<div class="notice ok"><div>✓ Tersimpan${(j.data&&j.data.ubah)?` — ${j.data.ubah} perubahan pada ${j.data.hari} hari`:''}.</div></div>`);
      render();
    })
    .catch(err=>{
      setSync('err','✕ Gagal menyimpan');
      pesan(`<div class="notice bad"><div>✕ Gagal menyimpan: ${esc((err&&err.message)||'gagal')}. Perubahannya <b>masih tersimpan di layar ini</b> dan belum hilang — coba lagi setelah jaringan pulih.</div></div>`);
    })
    .then(()=>{
      SIMPAN_JALAN=false;
      const b=$('btn-simpan'); if(b&&semula) b.innerHTML=semula;
      segarkanSimpan();
    });
}
let pesanTimer=null;
function pesan(html){
  $('pesan').innerHTML=html;
  clearTimeout(pesanTimer);
  /* Pesan galat TIDAK ikut dihapus otomatis: yang berhasil boleh lewat, yang
     gagal harus tetap terbaca sampai orangnya bertindak. */
  if(html.indexOf('notice bad')<0) pesanTimer=setTimeout(()=>{ $('pesan').innerHTML=''; },7000);
}

/* ====================== BOOT ====================== */
function apiGet(){
  return fetchTimeout(API_URL+'?action=getAll&t='+Date.now(),{method:'GET',redirect:'follow'})
    .then(r=>r.text())
    .then(t=>{ let j=null; try{ j=JSON.parse(t); }catch(e){}
      if(!j) throw new Error('balasan bukan JSON');
      if(!j.ok) throw new Error(j.error||'server error');
      return j.data||{}; });
}
function normalize(d){
  d=(d&&typeof d==='object'&&!Array.isArray(d))?d:{};
  if(!Array.isArray(d.daily)) d.daily=[];
  if(!d.reports||typeof d.reports!=='object'||Array.isArray(d.reports)) d.reports={};
  return d;
}
function boot(){
  CURRENT_USER=bacaSesi();
  if(!CURRENT_USER){ location.replace('../../'); return; }
  $('suName').textContent=CURRENT_USER.name||'—';
  $('suAvatar').textContent=String(CURRENT_USER.name||'?').trim().charAt(0).toUpperCase()||'?';
  document.querySelectorAll('#subtab button').forEach(b=>b.addEventListener('click',()=>gantiTab(b.dataset.tab)));
  pasangDelegasi();
  $('periodPick').addEventListener('change',e=>{
    /* Perubahan yang belum disimpan TIDAK dibuang diam-diam saat pindah bulan.
       UBAH disimpan per tanggal, jadi ia tetap utuh dan tetap ikut terkirim —
       yang berubah cuma bulan yang sedang dilihat. */
    if(!/^\d{4}-\d{2}$/.test(e.target.value||'')) return;
    PERIODE=e.target.value; render();
  });
  isiPeriode();
  setSync('load');
  render();
  apiGet().then(d=>{
    DB=normalize(d);
    setSync('ok');
    try{ localStorage.setItem(CACHE_KEY,JSON.stringify(DB)); }catch(e){}
    render();
  }, err=>{
    /* Jaringan gagal → pakai salinan lokal kalau ada. Panel ini read-mostly,
       jadi salinan basi masih jauh lebih berguna daripada layar kosong —
       asalkan disebut terang-terangan bahwa yang dilihat salinan. */
    let cache=null; try{ cache=JSON.parse(localStorage.getItem(CACHE_KEY)||'null'); }catch(e){}
    DB=normalize(cache);
    setSync('err','✕ Offline');
    pesan(`<div class="notice bad"><div>✕ Tidak bisa membaca data dari server (${esc((err&&err.message)||'gagal')}). ${cache?'Yang ditampilkan <b>salinan lokal</b> dan mungkin sudah basi.':'Belum ada salinan lokal, jadi tabelnya kosong.'} Jangan menyimpan sebelum sambungannya pulih.</div></div>`);
    render();
  });
}
boot();
</script>
