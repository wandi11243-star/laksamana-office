      Keputusan potong / tidak diambil di <b>modul Kompas</b>; di sini hanya ditampilkan hasilnya.</div>
  </div>`;
}

/* ---- Alur omset: KASIR DULU, event MEMOTONG (keputusan 30 Juli 2026) ----
   Ini pembalikan arah dari aturan 28 Juli. Baca ini sebelum mengubah apa pun
   di bawah, karena dua model itu memakai bentuk data yang sama persis dan
   angkanya cuma bisa dibedakan dari cara membacanya.

   MODEL SEKARANG. Semua uang masuk lewat meja kasir — termasuk tiket event dan
   tagihan gathering. Jadi yang diisi lebih dulu di Breakdown adalah omset per
   KASIR, dan totalnya sendiri sudah harus sama dengan omset net hari itu.
   Marketing & event tidak menambah total apa pun: barisnya MEMOTONG omset
   kasir yang kena shift event tersebut.

   Centang yang dulu bernama "Ticketing" sejak 30 Juli 2026 DITULIS "Free Entry"
   di layar. Yang berubah hanya labelnya; nama fieldnya tetap `r.tiket` dan
   artinya tetap sama (potongan 50%), jadi tidak ada migrasi data. Komentar di
   bawah memakai istilah baru.

     • baris TANPA centang Free Entry → SELURUH nominalnya dipotong dari kasir
       shift, dan seluruhnya diakui untuk PIC.
     • baris DICENTANG Free Entry     → hanya SEPARUH yang dipotong dari kasir
       shift, dan separuh itu juga yang diakui untuk PIC. Separuh sisanya tetap
       milik kasir — tiketnya dijual atas nama event, tapi yang melayani
       penjualan dan tamunya kasir.

   Karena potongan kasir = porsi PIC (uang yang sama, cuma berpindah pemilik),
   jumlah seluruh realisasi tetap sama dengan omset net. Itu invariannya, dan
   itu yang harus tetap benar sesudah perubahan apa pun di bawah.

   MODEL LAMA (28 Juli 2026, sudah tidak dipakai): kasir diisi walk-in MURNI,
   ketiga section dijumlahkan harus sama dengan net, dan separuh omset free entry
   DITAMBAHKAN ke kasir shift sebagai bagi hasil. Persis kebalikan arah
   potongannya.

   Data lama TIDAK dimigrasi — bentuknya memang tidak berubah, hanya artinya.
   Konsekuensinya disengaja dan sudah diterima (preseden yang sama diambil saat
   aturan 28 Juli naik): hari-hari yang diisi dengan model lama akan tampak
   kurang balance di Breakdown, karena omset kasirnya belum memuat event. Hari
   seperti itu diberi peringatan sendiri di halaman Breakdown supaya orang tahu
   harus mengisi ulang omset kasirnya, bukan mengira angkanya rusak.

   Semua halaman WAJIB lewat fungsi-fungsi di bawah. Sempat ada empat tempat
   berbeda yang menjumlahkan r.amount sendiri-sendiri; kalau satu terlewat,
   realisasi orang yang sama beda antara Performa dan Ranking. */
/* PEMBAGIAN 50/50 DIHAPUS (1 Agustus 2026).
   Marketing, event, dan ticketing sekarang diakui PENUH untuk PIC-nya, dan
   penuh pula yang dipotong dari kasir shift. Tidak ada lagi baris yang cuma
   separuh.

   Centang "Free Entry" (nama field `r.tiket`) yang dulu menentukan pembagian
   itu SUDAH TIDAK DIPAKAI dan kotaknya dibuang dari layar — membiarkannya
   tampil sementara ia tidak lagi memengaruhi apa pun cuma membuat orang
   mengira omsetnya masih dibagi dua.

   Field-nya sendiri TIDAK dihapus dari data lama: membacanya sekarang
   menghasilkan angka penuh, jadi hari-hari lama otomatis ikut aturan baru
   tanpa migrasi. Invariannya tetap sama seperti sebelumnya — potongan kasir =
   porsi PIC (uang yang sama, cuma berpindah pemilik), jadi jumlah seluruh
   realisasi tetap sama dengan omset net. */

/* ATURAN 7 AGUSTUS 2026 — marketing dan event TIDAK LAGI SAMA.
   Sampai kemarin kedua section memakai satu rumus yang sama persis. Sekarang
   tidak, dan itu sebabnya `divi` WAJIB dikirim ke porsiPic(): memanggilnya
   tanpa divi akan diam-diam memberi PIC event dua kali lipat haknya, tanpa
   error apa pun dan tanpa ada satu halaman pun yang melaporkannya.

   MARKETING — nilai event punya tiga komponen, dan ketiganya diakui:
     realisasi PIC   = omset + tax + service
     dipotong kasir  = omset SAJA
   Kenapa yang dipotong hanya omsetnya: omset kasir di Section A itu angka NET
   (tax & service charge memang di luar omset, lihat netOf/taxSvcOf). Memotong
   tax & service dari sana berarti mengurangi realisasi kasir dengan uang yang
   tidak pernah jadi omsetnya — dan Breakdown tidak akan pernah balance lagi.

   EVENT — diakui SEPARUH, dan kasir tidak dipotong sama sekali:
     realisasi PIC   = omset / 2
     dipotong kasir  = 0
   Event tidak punya kolom tax/service dan tidak punya pengaturan kasir shift:
   kasir tetap dapat perhitungan target penuh atas omset event, tidak ada
   potongan. Konsekuensinya invarian lama (potongan kasir = porsi PIC) SUDAH
   TIDAK BERLAKU untuk event — separuh nilai event sekarang memang sengaja
   diakui dua kali: penuh untuk kasir, separuh untuk PIC event. Itu keputusan
   user, bukan kelalaian; jangan "diperbaiki" dengan mengembalikan potongannya.

   Data lama TIDAK dimigrasi, sama seperti dua perubahan aturan sebelumnya:
   bentuk datanya tidak berubah, hanya cara membacanya. Baris event lama yang
   terlanjur menyimpan `shift` dibiarkan — potonganHari() tidak lagi membacanya. */
function porsiPic(r, divi){
  if(divi==='event') return Math.round(num(r.amount)/2);
  return num(r.amount)+num(r.tax)+num(r.service);
}
/* Yang benar-benar dipotong dari kasir shift. Dipisah dari porsiPic() karena
   sejak 7 Agustus 2026 keduanya bukan angka yang sama lagi (lihat di atas).
   Hanya dipakai baris MARKETING — event tidak memotong siapa pun. */
function potongKasir(r){ return num(r.amount); }
/* Potongan yang ditanggung kasir karena SATU baris event, dibagi per SHIFT —
   bukan rata ke semua kasir yang masuk hari itu. Kasir yang masuk tapi tidak
   kebagian shift event tersebut tidak ikut dipotong.

   Yang dipotong = porsiPic(r), yaitu uang yang sama yang diakui untuk PIC.
   Bukan kebetulan: omsetnya sudah tercatat penuh di baris kasir, jadi memotong
   lebih kecil dari yang diakui PIC berarti uang yang sama dihitung dua kali.

   DW TIDAK IKUT MEMBAGI potongan ini — beda dari aturan 28 Juli yang lama, dan
   ini perbedaan yang paling mudah salah kalau kodenya disamakan begitu saja.
   Alasannya: section kasir di Breakdown hanya punya baris untuk kasir TETAP,
   jadi setoran DW pun ikut tercatat di baris kasir tetap yang menaunginya.
   Kalau DW dijadikan pembagi, sebagian potongan tidak dibebankan ke siapa pun
   sementara omsetnya tetap ada di baris kasir tetap — realisasi kasir jadi
   lebih besar dari yang seharusnya dan totalnya melebihi omset net. Jumlah DW
   tetap disimpan (`r.dw`) karena berguna sebagai catatan operasional shift,
   tapi tidak lagi memengaruhi angka.

   Baris yang shift-nya belum diisi mengembalikan pembagi 0 → potongannya tidak
   dibebankan ke siapa pun. UI menandainya merah supaya ketahuan, daripada
   diam-diam membebankannya ke orang yang tidak bertugas. */
function potonganBaris(r){
  const total=potongKasir(r);
  const ids=Array.isArray(r.shift)?r.shift.filter(Boolean):[];
  const dw=Math.max(0,num(r.dw));
  const pembagi=ids.length;
  if(total<=0||pembagi<=0) return {per:0,ids:[],dw,pembagi,total:Math.max(total,0)};
  return {per:Math.round(total/pembagi),ids,dw,pembagi,total};
}
/* Total potongan yang ditanggung satu kasir tetap dari seluruh event pada satu
   hari. Dipakai apa adanya oleh Performa Kasir, Ranking, dan Analytics. */
/* Sejak 7 Agustus 2026 hanya baris MARKETING yang dibaca di sini. Section
   event tidak lagi memotong kasir sama sekali (lihat porsiPic), jadi
   memasukkan d.bd.event ke perulangan ini akan menghidupkan kembali potongan
   yang sudah sengaja dihapus — termasuk pada baris event lama yang `shift`-nya
   terlanjur tersimpan. Berlaku surut ke bulan-bulan yang sudah lewat: realisasi
   kasir pada hari yang ada event-nya jadi lebih besar dari sebelumnya. */
function potonganHari(d,kasirId){
  let s=0;
  (d.bd?.marketing||[]).forEach(r=>{
    const b=potonganBaris(r);
    if(b.ids.indexOf(kasirId)>-1) s+=b.per;
  });
  return s;
}
/* Baris bernominal yang shift-nya belum ditentukan. Dipakai untuk peringatan di
   Breakdown dan Performa Kasir. Filter `r.tiket` yang dulu ada di sini DIHAPUS:
   sekarang setiap baris event memotong kasir, bukan cuma yang free entry, jadi
   semuanya butuh shift. */
function barisTanpaShift(d){
  return (d.bd?.marketing||[])
    .filter(r=>num(r.amount)>0 && potonganBaris(r).pembagi<=0);
}

/* Modal penentuan kasir shift satu baris event — merekalah yang dipotong.
   Namanya masih modalBagiHasil() supaya diff-nya kecil. Mengembalikan lewat callback
   supaya pemanggilnya yang memutuskan kapan menggambar ulang — baris breakdown
   sedang diisi, jadi redraw yang tidak perlu akan merebut fokus.

   `kasirAktif` = daftar kasir yang BOLEH dicentang hari itu, dikirim oleh
   pemanggil. Dulu modal ini selalu memakai seluruh DB.employees.kasir, jadi kasir
   yang sudah dicentang OFF (libur) di Section A tetap ikut muncul dan bisa
   dibebani potongan. Akibatnya fatal dan tidak kelihatan: potongannya dibagi ke
   orang yang omsetnya nol, sementara kartu Efek ke Realisasi Kasir hanya
   menampilkan kasir non-OFF — jadi sebagian potongan lenyap dari rekap. */
function modalBagiHasil(row, labelEvent, simpan, kasirAktif){
  const kasir=Array.isArray(kasirAktif)?kasirAktif:(DB.employees.kasir||[]);
  const sah=new Set(kasir.map(k=>k.id));
  /* Kolom "Jumlah DW Kasir" DIHAPUS dari modal ini (3 Agustus 2026).
     Ia sudah lama tidak memengaruhi angka apa pun — keterangannya sendiri
     berbunyi "catatan operasional saja" — sementara ia berdiri paling atas dan
     mendapat fokus otomatis saat modal dibuka. Akibatnya kotak pertama yang
     dilihat dan diketik orang justru satu-satunya kotak yang tidak
     berpengaruh, sedangkan pilihan kasir yang menentukan pembagian ada di
     bawahnya. Sekarang modal ini menanyakan satu hal saja: siapa kasir yang
     bertugas saat event itu.

     `row.dw` yang sudah tersimpan TIDAK dihapus dari data — ia tidak dibaca
     oleh perhitungan mana pun (lihat potonganBaris), jadi membiarkannya lebih
     aman daripada menulis ulang data lama demi kerapian. */
  let pilih=new Set((Array.isArray(row.shift)?row.shift.filter(Boolean):[]).filter(id=>sah.has(id)));
  // Yang dipotong kolom OMSET saja — tax & service marketing tidak ikut.
  const potong=potongKasir(row);

  const ovl=document.createElement('div');
  ovl.className='ovl';
  ovl.innerHTML=`
    <div class="mdl">
      <div class="mdl-h">
        <h3>Potongan Kasir Shift</h3>
        <div class="sub">${esc(labelEvent||'Event tanpa nama')} · nilai ${fmtRp(num(row.amount))} · dipotong dari kasir <b>${fmtRp(potong)}</b></div>
      </div>
      <div class="mdl-b">
        <div>
          <label style="display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px">Kasir yang bertugas saat event ini</label>
          <div class="helper" style="margin-bottom:2px">Centang kasir yang menginput omset saat event berlangsung — merekalah yang dipotong. Kasir yang masuk hari itu tapi beda shift tidak kena. Kasir yang dicentang <b>OFF</b> di Section A tidak ditampilkan di sini.</div>
          ${kasir.length?`<div class="kslist" id="bh_ks">${kasir.map(k=>`
            <label class="kschip${pilih.has(k.id)?' on':''}" data-id="${esc(k.id)}"><input type="checkbox" ${pilih.has(k.id)?'checked':''}> ${esc(k.name)}</label>`).join('')}</div>`
          :`<div class="empty" style="padding:16px 10px">Tidak ada kasir yang bisa dibebani — semua kasir dicentang OFF (libur) hari ini, atau belum ada kasir terdaftar.</div>`}
        </div>
        <div class="notice info" id="bh_prev" style="margin-top:18px"></div>
      </div>
      <div class="mdl-f">
        <button class="btn btn-ghost" id="bh_batal">Batal</button>
        <button class="btn btn-primary" id="bh_ok">Simpan Pembagian</button>
      </div>
    </div>`;
  document.body.appendChild(ovl);

  const prev=()=>{
    const pembagi=pilih.size;
    const per=pembagi>0?Math.round(potong/pembagi):0;
    const box=ovl.querySelector('#bh_prev');
    box.className='notice '+(pembagi>0?'info':'warn');
    /* Isinya DIBUNGKUS satu elemen blok. `.notice` itu display:flex, jadi
       tiap potongan teks dan tiap penebalan di dalamnya menjadi flex item
       sendiri — hasilnya kalimatnya pecah jadi kolom-kolom sempit yang saling
       bertumpuk, bukan satu paragraf. Terlihat jelas di layar kasir 3
       Agustus 2026. Satu pembungkus = satu flex item = paragraf normal.
       (Tag-nya sengaja tidak ditulis di komentar ini: pemeriksa struktur
       menghitung tag mentah, dan menyebutnya di sini membuat hitungannya
       timpang tanpa ada yang salah di markup-nya.) */
    box.innerHTML = pembagi>0
      ? `<div>${fmtRp(potong)} ÷ ${pembagi} kasir = <b>${fmtRp(per)}</b> dipotong dari masing-masing.<br>
         Nominal itu pindah jadi realisasi <b>${esc(labelEvent||'event ini')}</b>; omset kasir yang sudah diinput tidak diubah, hanya realisasinya yang berkurang.</div>`
      : `<div>⚠ Belum ada kasir yang dicentang. Kalau dibiarkan, potongan ${fmtRp(potong)} tidak dibebankan ke siapa pun — omset yang sama akan terhitung dua kali: sekali di realisasi PIC, sekali di realisasi kasir.</div>`;
  };
  ovl.querySelectorAll('.kschip').forEach(c=>c.addEventListener('click',e=>{
    // Klik pada <label> sudah men-toggle checkbox di dalamnya; jangan
    // di-toggle dua kali. Baca keadaan checkbox-nya saja setelah klik.
    setTimeout(()=>{
      const cb=c.querySelector('input');
      if(cb.checked) pilih.add(c.dataset.id); else pilih.delete(c.dataset.id);
      c.classList.toggle('on',cb.checked);
      prev();
    },0);
  }));
  const tutup=()=>{ try{document.body.removeChild(ovl);}catch(_){} };
  ovl.querySelector('#bh_batal').onclick=tutup;
  ovl.addEventListener('click',e=>{ if(e.target===ovl) tutup(); });
  ovl.querySelector('#bh_ok').onclick=()=>{
    row.shift=[...pilih];   // row.dw dibiarkan apa adanya — lihat catatan di atas
    tutup(); if(simpan) simpan();
  };
  prev();
  // Fokus otomatis ke centang kasir pertama: itu satu-satunya isian di modal ini.
  setTimeout(()=>{ const c=ovl.querySelector('.kschip input'); if(c) c.focus(); },30);
}

/* ============ 2. BREAKDOWN SUMBER OMSET ============ */
let bdDate=null;
// Penghapus konfirmasi "pembagian tersimpan". Di luar viewBreakdown supaya
// timer dari render sebelumnya tidak menghapus pesan render berikutnya.
let bagiInfoTimer=null;

/* ---- Kalender kustom (bukan input type=date bawaan Chrome). Satu
   implementasi dipakai dua tempat, dibedakan lewat `key`:
     'in' → Tanggal di Input Omset Harian
     'bd' → Pilih Hari di Breakdown
   Semua tanggal terbuka; tanggal yang sudah ada omset diberi titik. */
const CAL_MON=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const CAL_REG={
  in:{ box:'i_cal',  get:()=>inputDate,          set:ds=>{ inputDate=ds; PERIOD=monthKeyOf(ds); } },
  bd:{ box:'bd_cal', get:()=>bdDate||todayISO(), set:ds=>{ bdDate=ds; } },
  rp:{ box:'rp_cal', get:()=>repDate,            set:ds=>{ repDate=ds; PERIOD=monthKeyOf(ds); } },
  cp:{ box:'cp_cal', get:()=>compDate,           set:ds=>{ compDate=ds; PERIOD=monthKeyOf(ds); } },
  bn:{ box:'bn_cal', get:()=>bonDate,            set:ds=>{ bonDate=ds; PERIOD=monthKeyOf(ds); } }
};
const CAL_ST={ in:{open:false,month:null}, bd:{open:false,month:null}, rp:{open:false,month:null}, cp:{open:false,month:null}, bn:{open:false,month:null} };
function ymdLocal(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dateLabel(ds){ const d=new Date(ds+'T00:00:00'); return isNaN(d)?ds:d.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'short',year:'numeric'}); }
function paintCal(key){ const el=document.getElementById(CAL_REG[key].box); if(el) el.innerHTML=calInner(key); }
function calToggle(key){ const s=CAL_ST[key]; s.open=!s.open; if(s.open){ const [y,m]=CAL_REG[key].get().split('-').map(Number); s.month=new Date(y,m-1,1); } paintCal(key); }
function calNav(key,delta){ const s=CAL_ST[key]; if(!s.month) s.month=new Date(); s.month=new Date(s.month.getFullYear(),s.month.getMonth()+(+delta),1); paintCal(key); }
function calPickDay(key,ds){ CAL_ST[key].open=false; CAL_REG[key].set(ds); render(); }
function calQuick(key,off){ const d=new Date(); d.setDate(d.getDate()+off); calPickDay(key,ymdLocal(d)); }
function calInner(key){
  const st=CAL_ST[key], sel=CAL_REG[key].get()||todayISO();
  const btn=`<button type="button" class="calbtn" onclick="calToggle('${key}')"><span>📅 ${dateLabel(sel)}</span><span style="opacity:.55">▾</span></button>`;
  if(!st.open) return btn;
  if(!st.month){ const [yy,mm]=sel.split('-').map(Number); st.month=new Date(yy,mm-1,1); }
  const y=st.month.getFullYear(), mo=st.month.getMonth();
  const startDow=new Date(y,mo,1).getDay(), dim=new Date(y,mo+1,0).getDate(), prevDim=new Date(y,mo,0).getDate();
  const DOW=['MIN','SEN','SEL','RAB','KAM','JUM','SAB'];
  let cells='';
  for(let i=startDow-1;i>=0;i--) cells+=`<button class="calday off" disabled>${prevDim-i}</button>`;
  for(let dd=1;dd<=dim;dd++){
    const ds=`${y}-${String(mo+1).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
    const cls=['calday']; if(ds===todayISO())cls.push('today'); if(ds===sel)cls.push('sel'); if(getDay(ds))cls.push('caldata');
    cells+=`<button class="${cls.join(' ')}" onclick="calPickDay('${key}','${ds}')">${dd}</button>`;
  }
  return btn+`<div class="calback" onclick="calToggle('${key}')"></div><div class="calpop">
    <div class="calhead"><button class="calnav" onclick="calNav('${key}',-1)">‹</button><b>${CAL_MON[mo]} ${y}</b><button class="calnav" onclick="calNav('${key}',1)">›</button></div>
    <div class="calgrid">${DOW.map(d=>`<div class="caldow">${d}</div>`).join('')}${cells}</div>
    <div class="calquick"><button onclick="calPickDay('${key}','${todayISO()}')">Hari Ini</button><button onclick="calQuick('${key}',-1)">Kemarin</button><button onclick="calToggle('${key}')">Tutup</button></div>
  </div>`;
}

let RINGKAS_OMSET=null;

/* PDF lewat DIALOG CETAK BROWSER (Save as PDF), bukan pustaka pembuat PDF.
   Alasannya sama seperti Report Achievement yang sudah memakai cara ini:
   tidak menambah dependensi CDN (jszip pernah dibuang dari modul lain karena

   rapi di lembar cetak lain, dan di HP pun tetap bisa "Simpan sebagai PDF".
   Menumpang #printSheet + @media print yang sudah ada. */
/* ---- Bahan bersama kedua lembar cetak ----
   Sebelum ini tiap fungsi cetak menyusun kepalanya sendiri, dan keduanya sudah
   sempat berbeda: satu menulis "KOMPAS" sebagai brand, satu "LAKSAMANA MUDA".
   Sekarang satu sumber, jadi kop yang diperbaiki sekali berlaku untuk semua
   lembar yang keluar dari modul ini. */
const DOC_ALAMAT='Jl. Soekarno Hatta No. 39, Payung Sekaki, Pekanbaru';
function lembarKop(label, judul, sub){
  /* Logo dirujuk lewat jalur relatif, bukan data URI. Berkas ini di-deploy
     berdampingan dengan ../assets, dan dialog cetak Chrome memuat gambar
     same-origin apa adanya — menyalinnya jadi data URI cuma menambah ~140 KB
     ke berkas yang sudah besar. */
  return `<div class="ph">
    <div class="ph-l">
      <img class="ph-logo" src="../assets/LaksamanaMudaLogo.jpeg" alt="">
      <div>
        <div class="ph-nama">Laksamana Muda</div>
        <div class="ph-sub">COFFEE &amp; LIVE SPACE</div>
        <div class="ph-alamat">${DOC_ALAMAT}</div>

      <div class="ph-judul">${esc(judul)}</div>
      ${sub?`<div class="ph-tgl">${esc(sub)}</div>`:''}

}
function lembarKaki(){
  return `<div class="kaki">
    <div>Laksamana Muda Coffee &amp; Live Space · Modul KOMPAS</div>
    <div>Dicetak ${esc(new Date().toLocaleString('id-ID',{dateStyle:'long',timeStyle:'short'}))}${CURRENT_USER?` oleh ${esc(CURRENT_USER.name)}`:''}</div>
  </div>`;
}
/* Satu seksi bertajuk berisi baris label → nilai.
   `rows` = [judulBaris, nilai, keteranganKecil?, kelasBaris?]; baris bernilai
   falsy dilewati supaya pemanggil bisa menulis kondisi langsung di dalam array
   tanpa membangun daftarnya bertahap. Isinya HTML apa adanya — pemanggil yang
   meng-esc, karena hampir semuanya sudah angka hasil fmtRp(). */
function lembarSeksi(judul, rows){
  const isi=rows.filter(Boolean).map(r=>`<tr${r[3]?` class="${r[3]}"`:''}>
      <td class="k">${r[0]}${r[2]?`<div class="n">${r[2]}</div>`:''}</td>
      <td class="v">${r[1]}</td></tr>`).join('');
  return `<div class="sect"><div class="sect-h">${esc(judul)}</div><table><tbody>${isi}</tbody></table></div>`;
}
/* Pita angka utama. `boxes` = [label, nilai, keterangan?, tandai?].
   Empat kotak sebaris menggantikan satu seksi empat baris: tingginya sepertiga
   dan justru lebih mudah dibaca, karena inilah angka yang dicari orang lebih
   dulu sebelum membaca apa pun di lembar ini. */
function lembarKpi(boxes){
  return `<div class="kpi">${boxes.filter(Boolean).map(b=>`<div${b[3]?' class="em"':''}>
      <div class="l">${b[0]}</div><div class="v">${b[1]}</div>
      ${b[2]?`<div class="f">${b[2]}</div>`:''}</div>`).join('')}</div>`;
}
/* Tabel data yang barisnya DIPECAH jadi beberapa kolom berdampingan.
   Satu-satunya cara memuat rincian sebulan di satu halaman — lihat catatan
   panjang di blok @media print. `nKol` itu batas atas: bulan pendek atau PIC
   dengan sedikit event otomatis memakai kolom lebih sedikit, supaya tidak ada
   kolom yang berdiri hampir kosong di sebelah kolom penuh. */
function lembarTabelKolom(judul, thead, baris, nKol, kosong){
  if(!baris.length){
    return `<div class="sect"><div class="sect-h">${esc(judul)}</div>
      <table><tbody><tr><td style="padding:9px 11px;color:#777">${esc(kosong||'Belum ada data pada periode ini.')}</td></tr></tbody></table></div>`;
  }
  // Minimal 8 baris per kolom: memecah 6 baris jadi 3 kolom cuma menghasilkan
  // tiga tabel dua baris yang lebih sulit dibaca daripada satu tabel utuh.
  const kol=Math.max(1, Math.min(nKol, Math.ceil(baris.length/8)));
  const per=Math.ceil(baris.length/kol);
  const potong=[];
  for(let i=0;i<baris.length;i+=per) potong.push(baris.slice(i,i+per));
  return `<div class="sect data"><div class="sect-h">${esc(judul)}</div>
    <div class="kolomN n${potong.length}">${potong.map(c=>`<table>${thead}<tbody>${c.join('')}</tbody></table>`).join('')}</div></div>`;
}

    +(r.harian?'':lembarTabelKolom(

function viewBulanan(){
  const el=document.getElementById('app-view');
  const days=rentangAktif();
  const target=targetRentang();
  const real=days.reduce((s,d)=>s+netOf(d),0);
  const tax=days.reduce((s,d)=>s+taxSvcOf(d),0);
  const svcOnly=days.reduce((s,d)=>s+num(d.service_charge),0);
  const taxOnly=days.reduce((s,d)=>s+num(d.tax),0);
  const compBulan=compsRentang().reduce((s,c)=>s+num(c.nominal),0);
  const disc=days.reduce((s,d)=>s+num(d.discount),0);
  /* Self Order digabung ke sini (dan ke Analytics) sesuai permintaan user
     3 Agustus 2026 — laporannya memang berbeda dari kasir, jadi ia tidak
     muncul di Performa Kasir sama sekali. `real` tidak ditambah: self order
     BAGIAN dari omset net, bukan tambahan di atasnya. */
  const self=days.reduce((s,d)=>s+selfOmset(d),0);
  const selfPct=pct(self,real);
  const ach=pct(real,target), selisih=target-real;
  const T={food:0,bev:0,lainnya:0,traffic:0,bill:0,qfood:0,qbev:0,qothers:0};
  days.forEach(d=>{T.food+=num(d.food);T.bev+=num(d.bev);T.lainnya+=num(d.lainnya);T.traffic+=num(d.traffic);T.bill+=num(d.bill);T.qfood+=num(d.qty_food);T.qbev+=num(d.qty_bev);T.qothers+=num(d.qty_others);});
  const totalItem=T.qfood+T.qbev+T.qothers;
  /* KPI bulanan — semuanya dibagi Total Bill (jumlah transaksi) */
  const upt=T.bill>0?totalItem/T.bill:0;   // Unit Per Transaction  = total item ÷ total bill
  const atv=T.bill>0?real/T.bill:0;        // Average Transaction Value = total sales ÷ total bill
  const aps=T.bill>0?T.traffic/T.bill:0;   // Average Party Size    = total traffic ÷ total bill
  /* Target per HARI untuk tabel & grafik harian. Di mode harian ia sama dengan
     target rentangnya (rentangnya memang satu hari), jadi tidak dihitung dua
     kali dengan cara yang bisa berbeda. */
  const dtgt=modeHarian()?target:dailyTarget(PERIOD);

  /* RASIO KOMPOSISI (permintaan user 7 Agustus 2026).
     Penyebutnya Food+Beverage+Lainnya (gross komposisi), BUKAN omset net.
     Kalau dibagi net, ketiga rasionya berjumlah lebih dari 100% pada hari yang
     ada diskonnya — diskon mengurangi net tapi tidak mengurangi satu pun dari
     ketiga komponen, jadi angkanya benar sendiri-sendiri tapi mustahil dibaca
     sebagai komposisi. Dengan gross, ketiganya selalu tepat 100%. */
  const kompo=T.food+T.bev+T.lainnya;
  const rFood=pct(T.food,kompo), rBev=pct(T.bev,kompo), rLain=pct(T.lainnya,kompo);

  /* PENCAPAIAN BULAN BERJALAN (permintaan user 7 Agustus 2026).
     Selalu dihitung, termasuk saat layar sedang di mode HARIAN — justru di
     sanalah ia berguna: orang yang membuka laporan satu hari tetap perlu tahu
     bulannya sudah sampai mana. Di mode bulanan angkanya memang sama persis
     dengan kotak Target/Realisasi di atas, dan itu bukan pengulangan yang
     merugikan: laporan WA & PDF membacanya dari sini, jadi satu-satunya
     sumber angka bulanan cuma ada satu. */
  const bKey=modeHarian()?monthKeyOf(VIEWDATE):PERIOD;
  const bDays=daysOfMonth(bKey);
  const bReal=bDays.reduce((s,d)=>s+netOf(d),0);
  const bTarget=num(DB.settings.companyMonthlyTarget);
  const bulan={key:bKey,label:labelPeriode(bKey),target:bTarget,real:bReal,
               ach:pct(bReal,bTarget),sisa:bTarget-bReal,hari:bDays.length};
  const rows=days.map(d=>{const n=netOf(d);return `<tr><td>${d.date.slice(8)} ${HARI[new Date(d.date).getDay()].slice(0,3)}</td><td class="num mono">${fmtRp(dtgt)}</td><td class="num mono">${fmtRp(n)}</td><td class="num mono">${pct(n,dtgt).toFixed(0)}%</td><td>${n>=dtgt?'<span class="status ok"><span class="d"></span></span>':'<span class="status bad"><span class="d"></span></span>'}</td></tr>`;}).join('');

  /* Angka yang dipajang disimpan di satu tempat supaya lembar PDF dan ringkasan
     WhatsApp memakai HASIL YANG SAMA dengan layar — bukan menghitung ulang
     sendiri. Dua perhitungan untuk satu angka pasti berbeda cepat atau lambat
     (satu ikut diperbaiki, satu terlupa), dan laporan yang beda dari layar
     adalah laporan yang tidak bisa dipercaya lagi setelahnya.
     Diisi di sini, dibaca tombol di bawah — tombolnya cuma ada selama view ini
     terpasang, jadi ia tidak pernah bisa dibaca sebelum terisi. */
  RINGKAS_OMSET={label:labelRentang(),harian:modeHarian(),
                 target,real,ach,selisih,tax,svcOnly,taxOnly,compBulan,disc,self,selfPct,
                 T,totalItem,upt,atv,aps,dtgt,
                 kompo,rFood,rBev,rLain,bulan,
                 hari:days.map(d=>({date:d.date,net:netOf(d)}))};

  el.innerHTML=`
    <div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
      <div><h3>Laporan ${esc(labelRentang())}</h3><div class="card-sub">Simpan sebagai PDF, atau kirim ringkasannya lewat WhatsApp</div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-ghost btn-sm" onclick="waDashboardOmset()">💬 Kirim WhatsApp</button>
        <button class="btn btn-primary btn-sm" onclick="cetakDashboardOmset()">📄 Simpan PDF</button>
      </div>
    </div>
    <div class="grid g4">
      <div class="stat accent"><div class="lab">Target ${modeHarian()?'Hari':'Bulan'}</div><div class="val sm mono">${fmtRp(target)}</div></div>
      <div class="stat"><div class="lab">Realisasi</div><div class="val sm mono">${fmtRp(real)}</div></div>
      <div class="stat"><div class="lab">Achievement</div><div class="val">${ach.toFixed(0)}%</div><div class="foot">${real>=target?'<span class="chip ok">Achieve</span>':'<span class="chip bad">Belum</span>'}</div></div>
      <div class="stat"><div class="lab">${selisih>0?'Harus Dikejar':'Surplus'}</div><div class="val sm mono">${fmtRp(Math.abs(selisih))}</div></div>
    </div>
    <div class="card">
      <div class="prog ${real>=target?'ok':''}"><i style="width:${Math.min(ach,100)}%"></i></div>
      <div class="foot" style="font-size:12.5px;color:var(--muted);margin-top:9px">Realisasi ${fmtRp(real)} dari target ${fmtRp(target)} · ${modeHarian()?(days.length?'data hari ini sudah diinput':'<b>belum ada data hari ini</b>'):`${days.length} hari terinput`}.</div>
    </div>
    <!-- Pencapaian bulan berjalan. Hanya digambar di mode HARIAN — di mode
         bulanan angkanya sama persis dengan kotak di atas, dan memajang dua
         kartu beridentik isi membuat orang mencari-cari bedanya. Laporan WA &
         PDF tetap memuatnya di kedua mode (lihat RINGKAS_OMSET.bulan). -->
    ${modeHarian()?`<div class="card">
      <h3>📅 Pencapaian Bulan Berjalan — ${esc(bulan.label)}</h3>
      <div class="card-sub">Akumulasi ${bulan.hari} hari yang sudah diinput bulan ini, di luar tanggal yang sedang dilihat kalau tanggalnya belum diinput.</div>
      <div class="grid g4" style="margin-bottom:12px">

        <div class="stat"><div class="lab">Achievement Bulanan</div><div class="val">${bulan.ach.toFixed(0)}%</div><div class="foot">${bulan.real>=bulan.target?'<span class="chip ok">Achieve</span>':'<span class="chip bad">Belum</span>'}</div></div>
        <div class="stat"><div class="lab">${bulan.sisa>0?'Sisa Dikejar':'Surplus'}</div><div class="val sm mono">${fmtRp(Math.abs(bulan.sisa))}</div></div>
      </div>
      <div class="prog ${bulan.real>=bulan.target?'ok':''}"><i style="width:${Math.min(bulan.ach,100)}%"></i></div>
    </div>`:''}
    <div class="card">
      <h3>🍽️ Rasio Komposisi Omset</h3>
      <div class="card-sub">Porsi tiap komponen terhadap Food + Beverage + Lainnya (${fmtRp(kompo)}) — bukan terhadap omset net, supaya ketiganya selalu tepat 100% walau ada diskon.</div>
      <div class="grid g3">

/* ============ 5. PERFORMA MARKETING / EVENT ============
   Report achievement disimpan sebagai PDF (dialog cetak browser → Save as
   PDF), lalu dikirim sendiri ke PIC lewat aplikasi apa pun.

   Dulu ada tombol "Kirim ke PIC" yang membuka wa.me berisi ringkasan teks;
   dihapus 28 Juli 2026 atas permintaan user. Ikut terhapus: peta nomor HP dari
   account-api-mysql (pastikanNoHp/noHpPic), waLink(), dan pesanAchievement().
   Kalau suatu saat mau dihidupkan lagi, ambil dari riwayat git — jangan
   ditulis ulang dari nol. */
function labelPeriode(mk){
  const [y,m]=String(mk).split('-');
  const d=new Date(Number(y),Number(m)-1,1);
  return isNaN(d)?mk:d.toLocaleDateString('id-ID',{month:'long',year:'numeric'});
}
/* Lembar cetak. Dikosongkan lagi sesudah dialog ditutup supaya tidak ada sisa
   node yang ikut tercetak di percetakan berikutnya. */
function cetakAchievement(divi,e,a,ach,tgt){
  /* Lembar cetak hanya memuat SATU angka per event (permintaan 28 Juli 2026).
     Yang dihapus: tabel Klasifikasi Omset Event, kolom nilai kotor event,
     kolom Jenis, dan kata "Diakui" pada judul kolom — yang perlu dibaca PIC
     cuma angka yang benar-benar masuk ke realisasinya, bukan cara
     menghitungnya.

     Compliment juga tidak dipajang sebagai tabel sendiri; potongannya
     ditempelkan ke event yang TANGGALNYA SAMA. Yang tidak ketemu pasangannya
     — compliment di hari tanpa event, atau yang nilainya melebihi porsi event
     hari itu — tidak hilang: TOTAL memakai a.real yang sudah bersih, jadi
     angkanya selalu sama dengan kotak Realisasi di atas sekalipun baris-
     barisnya kebetulan tidak persis berjumlah segitu.

     Rincian per compliment tetap bisa dilihat di layar lewat kartuCompliment(). */
  const perPic=a.events.some(ev=>ev.pic);   // benar hanya pada segmen "Semua PIC"
  const kunci=(date,pic)=>perPic?(date+'|'+String(pic||'').trim().toLowerCase()):date;
  const sisaComp={};
  (a.compRows||[]).forEach(c=>{ const k=kunci(c.date,c.picName); sisaComp[k]=(sisaComp[k]||0)+compPotong(c); });
  const rows=[...a.events].sort((x,y)=>x.date<y.date?-1:1).map(ev=>{
    // Dipotong sebatas porsi event itu saja — baris bernilai minus lebih
    // membingungkan daripada selisih yang diserap di baris TOTAL.
    const k=kunci(ev.date,ev.pic||e.name);
    const pot=Math.min(sisaComp[k]||0, ev.porsi);
    sisaComp[k]=(sisaComp[k]||0)-pot;
    // Kolom Jenis (Free Entry/Non-Free Entry) sengaja tidak dicetak: itu cara
    // menghitung, bukan hasil, dan PIC tidak perlu tahu dari lembar ini.
    return `<tr><td>${esc(ev.date)}</td><td>${esc(ev.name||'—')}${ev.pic?` (${esc(ev.pic)})`:''}</td><td class="num">${fmtRp(ev.porsi-pot)}</td></tr>`;
  });   // ARRAY, bukan string — lembarTabelKolom yang memecahnya jadi kolom
  const tgtDipakai = tgt===undefined?num(e.target):tgt;
  const labDiv = divi==='marketing'?'Marketing':'Event';
  const sheet=document.getElementById('printSheet');
  sheet.innerHTML=
    lembarKop('Report Achievement', e.name, `Performa ${labDiv} · ${labelRentang()}`)
    +`<div class="meta">
      <div><b>PIC</b>: ${esc(e.name)}</div>
      <div><b>Divisi</b>: ${esc(labDiv)}</div>
      <div><b>Periode</b>: ${esc(labelRentang())}</div>
      <div><b>Mode</b>: ${modeHarian()?'Harian':'Bulanan'}</div>
    </div>`
    +lembarKpi([
      [`Target ${modeHarian()?'Harian':'Bulanan'}`, fmtRp(tgtDipakai),
        modeHarian()?'dari bulanan '+fmtRp(num(e.target)):null],
      ['Realisasi', fmtRp(a.real), a.comp?'dipotong compliment '+fmtRp(a.comp):'tanpa potongan compliment'],
      ['Achievement', ach.toFixed(1)+'%', a.real>=tgtDipakai?'target tercapai':'belum tercapai'],
      ['Jumlah Event', String(a.events.length), null, true]
    ])
    // Sampai dua kolom. PIC dengan puluhan event tetap bisa tumpah ke halaman
    // kedua — nama event panjang tidak bisa dipadatkan lebih jauh tanpa
    // memotongnya, dan event yang tidak bisa dikenali namanya tidak ada guna.
    +lembarTabelKolom('Rincian Event — total '+fmtRp(a.real),
        '<thead><tr><th style="width:58px">Tanggal</th><th>Nama Event</th><th class="num" style="width:88px">Diakui</th></tr></thead>',
        rows, 2, 'Belum ada event pada periode ini.')
    +`<div class="note"><b>Cara membaca nominalnya.</b> Kolom Diakui adalah yang benar-benar masuk realisasi — ${divi==='marketing'
        ? 'omset ditambah tax &amp; service charge event tersebut'
        : 'separuh nilai event, sesuai aturan pengakuan event internal'}, dan sudah dikurangi compliment yang menjadi tanggungan PIC pada tanggal yang sama.</div>`
    +lembarKaki();
  window.print();
  setTimeout(()=>{ sheet.innerHTML=''; },500);
}

/* ============ 6. PERFORMA KASIR ============ */
/* ---- BONUS KASIR (skema SDM, dokumen "Skema Target & Bonus — Tim Kasir") ----
   Tangga bonus dari omset yang DIAKUI untuk kasir itu sendiri — yaitu angka
   Realisasi di halaman ini: omset kasir dikurangi potongan event/marketing dan
   dikurangi compliment yang PIC-nya dia.

   PER KASIR, bukan bonus tim yang dibagi menurut jam shift. Dokumen SDM-nya
   menyebut dua cara yang berbeda (Bagian 2 & 3 per kasir, Bagian 4.3 tim
   dibagi proporsional); yang dipakai di sini per kasir, sesuai keputusan user
   1 Agustus 2026 — sistem sudah memisahkan omset asli tiap kasir, jadi tidak
   perlu ditaksir lewat jam kerja.

   Batas atas TIDAK dipatok. Dokumen berhenti di Rp 250 juta, tapi omset di
   atas itu tetap berhak atas level tertinggi — memotongnya jadi "tidak dapat
   bonus" justru menghukum kasir yang paling berprestasi. Nilainya bisa
   dikalibrasi ulang (dokumen menyebutnya benchmark, bukan target final), dan
   satu-satunya tempat mengubahnya adalah tabel ini. */
const BONUS_KASIR=[
  { min:200000000, bonus:500000, label:'Level 4' },
  { min:150000000, bonus:300000, label:'Level 3' },
  { min:100000000, bonus:150000, label:'Level 2' },
  { min: 80000000, bonus: 50000, label:'Level 1' },
];
function bonusKasir(real){
  const t=BONUS_KASIR.find(x=>real>=x.min);
  if(t) return { ...t, next:BONUS_KASIR[BONUS_KASIR.indexOf(t)-1]||null };
  return { min:0, bonus:0, label:'Standar kerja', next:BONUS_KASIR[BONUS_KASIR.length-1] };
}
/* Baris ringkasan Performa Kasir. Target, omset diakui, achievement, bonus,
   dan jarak ke level berikutnya digabung jadi SATU baris (permintaan user
   3 Agustus 2026). Sebelumnya terpisah dua kartu — kotak stat di atas dan
   kotak bonus di bawah — dan keduanya sama-sama memajang "Omset Diakui"
   dengan angka yang sama, jadi orang harus membandingkan dua tempat untuk
   menjawab satu pertanyaan: "capaian saya sekarang bagaimana". */
function baguRingkasKasir(a, tgt, ach, harian, targetBulanan){
  const b=bonusKasir(a.real);
  const kurang=b.next?Math.max(0,b.next.min-a.real):0;
  return `<div class="grid g5">

    <div class="stat ${b.bonus?'accent':''}"><div class="lab">Bonus Saat Ini</div><div class="val sm mono">${fmtRp(b.bonus)}</div><div class="foot">${esc(b.label)}</div></div>

function viewKasir(){
  const el=document.getElementById('app-view');
  const days=rentangAktif();
  const list=DB.employees.kasir;
  const agg={};
  list.forEach(k=>agg[k.id]={real:0,masuk:0,off:0,hist:[],potong:0});
  days.forEach(d=>{
    (d.bd?.kasir||[]).forEach(r=>{if(agg[r.kasirId]){
      if(r.off){agg[r.kasirId].off++;agg[r.kasirId].hist.push({date:d.date,real:0,off:true});}
      else{
        // Potongan dihitung dari shift tiap baris event, bukan dari kehadiran
        // hari itu: kasir yang masuk tapi tidak kena shift event tidak dipotong.
        const potong=potonganHari(d,r.kasirId);
        /* `real` sudah bersih: bruto − diskon yang dia berikan − potongan
           event. Riwayat di bawah SENGAJA hanya memajang angka ini, tidak
           lagi memecahnya jadi kolom omset + kolom potongan (permintaan user
           3 Agustus 2026): kasir membaca deretan potongan sebagai hukuman,
           padahal yang menentukan bonusnya cuma angka finalnya. Rinciannya
           tidak hilang — ada di kartu "Efek ke Realisasi Kasir" di Breakdown,
           tempat orang yang memang perlu memeriksa akan mencarinya. */
        const real=omsetKasir(r)-potong;
        agg[r.kasirId].real+=real;
        agg[r.kasirId].potong+=potong;
        agg[r.kasirId].masuk++;
        agg[r.kasirId].hist.push({date:d.date,real,off:false});
      }
    }});
  });
  // sama seperti Performa & Ranking: compliment memotong realisasi. Barisnya
  // disimpan juga supaya rinciannya bisa dipajang, bukan cuma angka potongan.
  list.forEach(k=>{
    const cr=compListPicRentang(k);
    agg[k.id].compRows=cr;
    agg[k.id].comp=cr.reduce((s,c)=>s+compPotong(c),0);
    agg[k.id].real-=agg[k.id].comp;
    /* Compliment ikut diturunkan di hari kejadiannya, bukan cuma dari total.
       Sejak riwayat memajang angka final, jumlah kolomnya HARUS sama dengan
       Realisasi di kotak atas — kalau tidak, dua angka di halaman yang sama
       bercerita beda dan tidak ada yang tahu mana yang benar.
       Compliment pada hari yang tidak punya baris kasir (mis. dia OFF) tetap
       dimunculkan sebagai barisnya sendiri supaya nominalnya tidak lenyap. */
    const perTgl={};
    cr.forEach(c=>{ perTgl[c.date]=(perTgl[c.date]||0)+compPotong(c); });
    agg[k.id].hist.forEach(h=>{ if(perTgl[h.date]){ h.real-=perTgl[h.date]; delete perTgl[h.date]; } });
    Object.keys(perTgl).forEach(dt=>agg[k.id].hist.push({date:dt,real:-perTgl[dt],off:false,extra:true}));
  });
  const seg='<button class="active" data-k="__all__">🧮 Semua</button>'+list.map(k=>`<button data-k="${k.id}">${esc(k.name)}</button>`).join('');
  /* Hari yang punya baris event tanpa kasir shift. Potongannya tidak dibebankan
     ke siapa pun, jadi realisasi kasir di bawah lebih BESAR dari seharusnya —
     sebut alasannya, jangan biarkan angkanya tampak wajar. */
  const hariBelum=days.filter(d=>barisTanpaShift(d).length);
  const peringatan=hariBelum.length
    ? `<div class="notice warn">⚠ ${hariBelum.length} hari punya baris event yang belum ditentukan kasir shift-nya (${esc(hariBelum.slice(0,5).map(d=>d.date).join(', '))}${hariBelum.length>5?', …':''}). Potongannya belum dibebankan ke kasir mana pun, jadi realisasi di bawah masih terlalu besar — atur di <b>Breakdown Sumber</b> pada tanggal tersebut.</div>`
    : '';
  el.innerHTML=`<div class="card" style="padding:12px 16px"><div class="card-sub" style="margin:0">Menampilkan <b>${modeHarian()?'satu hari':'satu bulan'}</b> · ${esc(labelRentang())}</div></div>`+peringatan+(list.length?`<div class="seg" id="ks_seg">${seg}</div>`:'')+`<div id="ks_body"></div>`;
  const draw=kid=>{
    let k,a;
    if(kid==='__all__'){
      k={name:'Semua Kasir', target:list.reduce((s,x)=>s+num(x.target),0)};
      a={real:0,masuk:0,off:0,hist:[],comp:0,compRows:[],potong:0};
      list.forEach(x=>{const g=agg[x.id];if(!g)return;a.real+=g.real;a.masuk+=g.masuk;a.off+=g.off;a.potong+=(g.potong||0);a.comp+=(g.comp||0);(g.compRows||[]).forEach(c=>a.compRows.push(c));g.hist.forEach(h=>a.hist.push(Object.assign({kasir:x.name},h)));});
    } else { k=list.find(x=>x.id===kid); a=agg[kid]; }
    if(!k||!a) return;
    const tgt=targetPic(k.target);   // bulanan diproporsikan di mode harian
    const ach=pct(a.real,tgt),avg=a.masuk>0?a.real/a.masuk:0;
    const rows=[...a.hist].sort((x,y)=>x.date<y.date?-1:1).map(h=>`<tr><td>${h.date}${h.kasir?` <span class="muted" style="font-size:11px">· ${esc(h.kasir)}</span>`:''}</td><td class="num mono">${h.off&&!h.real?'<span class="muted">—</span>':fmtRp(h.real)}</td><td>${h.extra?'<span class="chip warn">Compliment</span>':h.off?'<span class="chip warn">OFF</span>':'<span class="chip ok">Masuk</span>'}</td></tr>`).join('');
    document.getElementById('ks_body').innerHTML=`
      ${baguRingkasKasir(a, tgt, ach, modeHarian(), k.target)}
      <div class="card"><div class="prog ${a.real>=tgt?'ok':''}"><i style="width:${Math.min(ach,100)}%"></i></div><div class="foot" style="margin-top:8px;font-size:12.5px;color:var(--muted)">Progress target · omset diakui ${fmtRp(a.real)} dari ${fmtRp(tgt)} · ${a.masuk} hari masuk, ${a.off} hari OFF (rata-rata ${fmtRp(avg)}/hari)</div></div>
      <div class="grid g2" style="align-items:start">
        <div class="card"><h3>Omset Harian</h3><div class="chart-box sm"><canvas id="ks_chart"></canvas></div></div>
        <div class="card"><h3>Riwayat</h3><div class="card-sub">${a.masuk} hari masuk, ${a.off} hari OFF · angka per hari sudah <b>final</b>, jumlahnya tepat sama dengan Omset Diakui di atas</div><div class="tbl-wrap"><table><thead><tr><th>Tanggal</th><th class="num">Omset Diakui</th><th>Status</th></tr></thead><tbody>${rows||'<tr><td colspan="3" class="empty">Belum ada data.</td></tr>'}</tbody></table></div></div>
      </div>
      ${kartuBonusKasir(a.real, kid==='__all__')}
      ${kartuCompliment(a.compRows||[], kid==='__all__')}`;
    clearChartsExcept();
    const h=[...a.hist].sort((x,y)=>x.date<y.date?-1:1);
    // Batangnya memakai angka final yang sama dengan riwayat supaya totalnya
    // sama dengan Omset Diakui di kotak atas; kalau memakai bruto, grafiknya
    // bercerita lain dari tabel tepat di sebelahnya.
    if(h.length)charts.push(new Chart(document.getElementById('ks_chart'),{type:'bar',data:{labels:h.map(x=>x.date.slice(8)),datasets:[{data:h.map(x=>x.real),backgroundColor:'#1F9D8F',borderRadius:5}]},options:barOpts()}));
    else emptyCanvas('ks_chart','Belum ada data');
  };
  document.querySelectorAll('#ks_seg button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#ks_seg button').forEach(x=>x.classList.remove('active'));b.classList.add('active');draw(b.dataset.k);});
  if(list.length)draw('__all__'); else document.getElementById('ks_body').innerHTML='<div class="card"><div class="empty">Belum ada kasir. Muncul otomatis dari Tim/Keterangan di Office.</div></div>';
}

/* ============ KAS KECIL ============
   Pengganti lembar spreadsheet yang selama ini dipakai finance. Yang DIBAWA
   dari lembar itu cuma cara berpikirnya (satu baris = satu transaksi, saldo
   berjalan per pos); bentuk kisi-nya sengaja TIDAK ditiru.

   Tiga hal yang di lembar dikerjakan tangan dan di sini dihitung mesin:

   1. SALDO. Di lembar, kolom Saldo diketik/diseret rumusnya, dan begitu ada
      baris disisipkan di tengah, saldo di bawahnya diam-diam salah. Di sini
      saldo TIDAK PERNAH DISIMPAN — selalu dihitung ulang dari seluruh riwayat
      pos itu, urut tanggal lalu urut id. Menyisipkan transaksi bertanggal
      mundur otomatis menggeser saldo semua baris sesudahnya.

   2. PEMBAGIAN KE POS. Satu belanja bisa dibayar sebagian dari Kas Kecil dan
      sebagian lewat PO — di lembar itu tampak sebagai dua angka di dua blok
      kolom yang berjauhan, dan tidak ada yang menjamin jumlahnya sama dengan
      nilai transaksinya. Di sini pembagian itu bagian dari transaksinya
      sendiri (trx.baris), dan totalnya ditampilkan hidup saat mengetik.

   3. POS DAN KATEGORI ADALAH DATA, bukan kolom. Menambah pos ketiga di lembar
      berarti menyisipkan tiga kolom dan memperbaiki semua rumus; di sini
      cukup menambah baris di halaman Pos & Kategori.

   Ditulis granular (satu transaksi = satu panggilan simpan), BUKAN pola
   save() kirim-seluruh-state seperti Kompas. Alasannya sama dengan modul
   jadwal & dw: beberapa orang finance mencatat di jam yang berdekatan, dan
   blob satu baris membuat yang menyimpan belakangan menghapus catatan yang
   lain tanpa satu pun pesan galat. Untuk data uang itu tidak bisa diterima. */

let KK=null;          // {pos:[],kategori:[],trx:[]} — null = belum termuat
let KK_ERR='';
let KK_SIBUK=false;   // ada tulisan yang sedang jalan; tombol dikunci
let KK_EDIT=null;     // id transaksi yang sedang diubah; null = mode tambah
let KK_FILTER={pos:'',kat:'',q:'',belum:false};

function kkApi(action,payload){
  const isi=Object.assign({action:action},payload||{});
  if(CURRENT_USER&&CURRENT_USER.name) isi.oleh=CURRENT_USER.name;
  /* `action` dikirim di query string DAN di body. Query string supaya
     permintaan yang gagal masih bisa dikenali dari access log server — log
     tidak pernah memuat body POST, dan tanpa itu satu-satunya jejak galat
     500 adalah baris "POST /api.php" yang sama untuk sembilan aksi berbeda.
     Content-Type text/plain, bukan application/json: sama seperti seluruh
     modul lain di repo ini, supaya tidak memicu preflight CORS. */
  return fetch(API_KK_URL+'?action='+encodeURIComponent(action),{
    method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(isi)
  }).then(function(r){
    /* Balasan dibaca sebagai TEKS dulu, baru diurai — bukan r.json() langsung.
       Waktu backend mati sebelum sempat membalas JSON (config belum ada, galat
       fatal PHP, folder salah), yang datang adalah halaman HTML server. Dengan
       r.json() satu-satunya yang sampai ke layar adalah "HTTP 500", dan
       penyebabnya — yang tertulis jelas di badan balasan — hilang. Sudah
       memakan satu putaran pada 10 Agustus 2026. */
    return r.text().then(function(teks){
      var d=null;
      try{ d=JSON.parse(teks); }catch(e){}
      if(!d){
        var cuplik=String(teks||'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim().slice(0,200);
        throw new Error('HTTP '+r.status+' — balasan bukan JSON'+(cuplik?': '+cuplik:' (kosong)'));
      }
      if(!d.ok) throw new Error(d.error||'ditolak server');
      return d.data||{};
    });
  });
}
function muatKk(){
  KK_ERR='';
  return kkApi('getAll').then(function(d){
    KK={pos:d.pos||[],kategori:d.kategori||[],trx:d.trx||[]};
    if(CURRENT.indexOf('kk_')===0) render();
  },function(e){
    /* KK tetap null, dan itu yang membedakan "belum termuat" dari "kosong".
       Halaman kas kecil menampilkan galatnya apa adanya — jangan diganti
       tabel kosong, karena tabel kosong terbaca sebagai "belum ada transaksi"
       dan itu kebohongan yang mahal untuk data uang. */
    KK_ERR=String(e&&e.message||e);
    if(CURRENT.indexOf('kk_')===0) render();
  });
}
/* Setiap tulisan diikuti muat ulang, bukan menambal KK di memori. Menambal
   lokal berarti layar menampilkan keadaan yang belum tentu tersimpan — dan
   untuk kas, yang benar adalah apa yang ada di server. */
function kkKirim(action,payload,pesanGagal){
  if(KK_SIBUK) return;
  KK_SIBUK=true; render();
  kkApi(action,payload).then(function(){
    KK_SIBUK=false; return muatKk();
  },function(e){
    KK_SIBUK=false;
    KK_ERR=(pesanGagal||'Gagal menyimpan')+': '+String(e&&e.message||e);
    render();
  });
}

function kkPosAktif(){ return (KK&&KK.pos||[]).filter(function(p){return p.aktif!==false;}).sort(function(a,b){return (a.urut||0)-(b.urut||0);}); }
function kkKatAktif(){ return (KK&&KK.kategori||[]).filter(function(k){return k.aktif!==false;}).sort(function(a,b){return (a.urut||0)-(b.urut||0);}); }
function kkPosNama(id){ const p=(KK&&KK.pos||[]).find(function(x){return String(x.id)===String(id);}); return p?p.nama:'—'; }
function kkKatNama(id){ if(!id) return '—'; const k=(KK&&KK.kategori||[]).find(function(x){return String(x.id)===String(id);}); return k?k.nama:'—'; }

/* Urutan baku seluruh buku: tanggal, lalu id. Dipakai untuk saldo berjalan
   MAUPUN untuk tampilan, supaya angka saldo di layar selalu milik baris yang
   sedang dilihat — dua urutan berbeda adalah cara termudah membuat kolom
   saldo terlihat acak. */
function kkUrut(a,b){
  if(a.tgl!==b.tgl) return a.tgl<b.tgl?-1:1;
  return (a.id||0)-(b.id||0);
}
function kkSemua(){ return (KK&&KK.trx||[]).slice().sort(kkUrut); }
function kkNilai(t,posId){
  /* Nilai satu transaksi untuk satu pos (atau seluruh pos bila posId kosong).
     Balikannya {debet,kredit} — bukan satu angka bertanda, karena buku kas
     memang menampilkan dua kolom dan menggabungkannya lebih dulu berarti
     kehilangan informasi yang justru dicari saat mencocokkan. */
  let d=0,k=0;
  (t.baris||[]).forEach(function(b){
    if(posId && String(b.pos_id)!==String(posId)) return;
    d+=num(b.debet); k+=num(b.kredit);
  });
  return {debet:d,kredit:k};
}
/* Saldo BERJALAN untuk tiap transaksi, dihitung sekali untuk seluruh riwayat
   lalu dipetakan per id. Dihitung dari awal waktu, bukan dari awal periode
   yang sedang dilihat: saldo kas kecil bulan Juni memang lanjutan bulan Mei,
   dan memulainya dari nol tiap bulan membuat angkanya tidak berarti apa-apa. */
function kkPetaSaldo(posId){
  const peta={}; let s=0;
  kkSemua().forEach(function(t){
    const v=kkNilai(t,posId);
    if(posId && v.debet===0 && v.kredit===0){ peta[t.id]=null; return; }  // pos ini tidak tersentuh
    s+=v.debet-v.kredit; peta[t.id]=s;
  });
  return peta;
}
function kkSaldoPos(posId){
  return kkSemua().reduce(function(s,t){ const v=kkNilai(t,posId); return s+v.debet-v.kredit; },0);
}
function kkRentang(){
  /* Buku Kas mengikuti pemilih periode di topbar (PERIOD / VIEWDATE), sama
     seperti seluruh halaman lain di modul ini. */
  const semua=kkSemua();
  return modeHarian() ? semua.filter(function(t){return t.tgl===VIEWDATE;})
                      : semua.filter(function(t){return monthKeyOf(t.tgl)===PERIOD;});
}
function kkTerpakai(t){
  const q=String(KK_FILTER.q||'').toLowerCase();
  if(KK_FILTER.pos){ const v=kkNilai(t,KK_FILTER.pos); if(v.debet===0&&v.kredit===0) return false; }
  if(KK_FILTER.kat && String(t.kategori_id||'')!==String(KK_FILTER.kat)) return false;
  if(KK_FILTER.belum && t.input && t.bon) return false;
  if(q && String(t.keterangan||'').toLowerCase().indexOf(q)<0) return false;
  return true;
}
function kkSetFilter(k,v){ KK_FILTER[k]=v; render(); }

/* Total dihitung ulang tiap ketikan dan ditulis LANGSUNG ke DOM, tidak lewat
   render(): render menggambar ulang seluruh halaman dan itu membuang fokus
   beserta posisi kursor di kotak yang sedang diketik. Pola yang sama dipakai
   paintCRM & kalkHitung di modul marketing. */
function kkHitungTotal(){
  if(!KK) return;
  let tot=0;
  kkPosAktif().forEach(function(p){
    const inp=document.getElementById('kk_p_'+p.id);
    if(inp) tot+=num(inp.value);
  });
  const box=document.getElementById('kk_total');
  if(box) box.textContent=fmtRp(tot);
  const sel=document.getElementById('kk_arah');
  const wrap=document.getElementById('kk_totalBox');
  if(wrap) wrap.className='notice '+(tot>0?((sel&&sel.value==='debet')?'ok':'info'):'warn');
}
function kkSimpan(){
  if(KK_SIBUK) return;
  const tgl=(document.getElementById('kk_tgl')||{}).value||'';
  const ket=String((document.getElementById('kk_ket')||{}).value||'').trim();
  const kat=(document.getElementById('kk_kat')||{}).value||'';
  const arah=(document.getElementById('kk_arah')||{}).value||'kredit';
  const baris=[];
  kkPosAktif().forEach(function(p){
    const n=num((document.getElementById('kk_p_'+p.id)||{}).value);
    if(n>0) baris.push({pos_id:p.id,debet:arah==='debet'?n:0,kredit:arah==='kredit'?n:0});
  });
  /* Tiga penolakan di depan, sebelum menyentuh jaringan. Semuanya keadaan yang
     di lembar spreadsheet menghasilkan baris diam-diam salah, bukan galat. */
  if(!tgl){ KK_ERR='Tanggal belum diisi.'; render(); return; }
  if(!ket){ KK_ERR='Keterangan belum diisi — buku kas tanpa keterangan tidak bisa diperiksa siapa pun.'; render(); return; }
  if(!baris.length){ KK_ERR='Belum ada nominal di satu pos pun. Isi minimal satu.'; render(); return; }
  KK_ERR='';
  const id=KK_EDIT;
  KK_EDIT=null;
  CURRENT='kk_buku';
  document.querySelectorAll('.nav a').forEach(function(a){ a.classList.toggle('active',a.dataset.view==='kk_buku'); });
  document.getElementById('pageTitle').textContent=TITLES.kk_buku[0];
  document.getElementById('pageSub').textContent=TITLES.kk_buku[1];
  kkKirim('simpanTrx',{
    id:id||null, tgl:tgl, keterangan:ket, kategori_id:kat||null,
    input:(document.getElementById('kk_input')||{}).checked?1:0,
    bon:(document.getElementById('kk_bon')||{}).checked?1:0,
    baris:baris
  },'Gagal menyimpan transaksi');
}

        '<h3>Pos Pembayaran</h3><div class="card-sub">Tiap pos punya saldo berjalan sendiri</div>'+
        '<div class="tbl-wrap"><table><tbody>'+daftar(pos,pakaiPos,'kkHapusPos','kkAktifkanPos','Belum ada pos.')+'</tbody></table></div>'+
        '<div style="display:flex;gap:8px;margin-top:14px">'+
          '<input id="kk_posNama" placeholder="Nama pos baru" style="flex:1;padding:9px 11px;border:1.5px solid var(--line);border-radius:8px">'+
          '<button class="btn btn-primary btn-sm" onclick="kkSimpanPos()" '+(KK_SIBUK?'disabled':'')+'>Tambah</button>'+
        '</div></div>'+
      '<div class="card" style="margin:0">'+
        '<h3>Kategori Belanja</h3><div class="card-sub">Untuk menyaring &amp; merekap, tidak memengaruhi saldo</div>'+
        '<div class="tbl-wrap"><table><tbody>'+daftar(kat,pakaiKat,'kkHapusKat','kkAktifkanKat','Belum ada kategori.')+'</tbody></table></div>'+
        '<div style="display:flex;gap:8px;margin-top:14px">'+
          '<input id="kk_katNama" placeholder="Nama kategori baru" style="flex:1;padding:9px 11px;border:1.5px solid var(--line);border-radius:8px">'+
          '<button class="btn btn-primary btn-sm" onclick="kkSimpanKat()" '+(KK_SIBUK?'disabled':'')+'>Tambah</button>'+
        '</div></div>'+
    '</div>';
}

/* ---- chart option factories ---- */
const money=v=>fmtRpShort(v);
function lineOpts(){return{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top',labels:{font:{family:'Inter'},boxWidth:12}}},scales:{y:{ticks:{callback:money,font:{family:'Inter'}}},x:{ticks:{font:{family:'Inter'}}}}};}
function barOpts(horizontal){return{indexAxis:horizontal?'y':'x',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{[horizontal?'x':'y']:{ticks:{callback:money,font:{family:'Inter'}}},[horizontal?'y':'x']:{ticks:{font:{family:'Inter'}}}}};}
function pieOpts(){return{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{font:{family:'Inter'},boxWidth:12,padding:10}},tooltip:{callbacks:{label:c=>c.label+': '+fmtRp(c.raw)}}}};}

/* ---- init: muat dari server, lalu jalankan ---- */
function boot(){
  CURRENT_USER=bacaSesi();
  if(!CURRENT_USER){ location.replace('../'); return; }
  const av=document.getElementById('suAvatar'), nm=document.getElementById('suName');
  if(av) av.textContent=(String(CURRENT_USER.name||'?').trim()[0]||'?').toUpperCase();
  if(nm) nm.textContent=CURRENT_USER.name||'—';
  pasangMenu();   // sembunyikan grup menu di luar level user SEBELUM halaman digambar
  setSync('load');
  render();   // tampilkan status "memuat"
  apiGet().then(data=>{
    DB=normalizeDB(data);
    setSync('ok');
    PERIOD=DB.daily.length?monthKeyOf(DB.daily[DB.daily.length-1].date):monthKeyOf(todayISO());
    const dibersihkan=purgeSeedKasir(DB);   // buang PIC contoh "Kasir 1/2/3"
    go('kk_buku');
    if(dibersihkan) save();
    /* syncPicOffice() dari Kompas SENGAJA TIDAK dibawa ke sini. Fungsi itu
       MENAMBAH PIC baru ke DB.employees lalu menyimpannya — pekerjaan
       pemeliharaan roster yang memang milik Kompas, dan Finance tidak pernah
       menulis blob itu (lihat save()). Memanggilnya di sini cuma akan
       menambah PIC di memori yang lenyap saat halaman ditutup, plus satu
       permintaan jaringan yang tidak menghasilkan apa-apa.

       Ini bukan pilihan gaya: fungsinya sempat ikut terbuang bersama halaman
       Pengaturan Target padahal panggilannya tertinggal di sini, dan
       akibatnya ReferenceError memutus rantai .then ini — go('kk_buku')
       sudah jalan, tapi muatKk() di bawah TIDAK PERNAH dipanggil. Gejalanya
       persis "Memuat kas kecil…" yang tidak pernah selesai, tanpa satu pun
       pesan galat di layar. Ditemukan harness 10 Agustus 2026. */
    muatKk();          // Kas Kecil datang dari backend SENDIRI, bukan blob Kompas
  }, err=>{
    // Jaringan gagal → pakai salinan lokal kalau ada, biar tetap bisa dilihat.
    let cache=null; try{ cache=JSON.parse(localStorage.getItem(CACHE_KEY)||'null'); }catch(e){}
    DB=normalizeDB(cache||seed());
    setSync('err','Offline — memakai salinan lokal, perubahan akan disinkronkan saat online');
    PERIOD=DB.daily.length?monthKeyOf(DB.daily[DB.daily.length-1].date):monthKeyOf(todayISO());
    purgeSeedKasir(DB);   // rapikan tampilan; simpannya nanti saat online
    go('kk_buku');
    /* Kas Kecil tetap dicoba walau blob Kompas gagal: keduanya backend yang
       BERBEDA, dan yang satu mati tidak berarti yang lain ikut mati. Tanpa
       baris ini, Dashboard Omset yang bermasalah membuat Buku Kas ikut kosong
       tanpa ada satu pun pesan yang menyebut Kas Kecil. */
    muatKk();
  });
}
boot();
</script>
