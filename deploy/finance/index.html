<!DOCTYPE html>
<html lang="id">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#F7F6F4">
<title>FINANCE · Laksamana Muda</title>
<link rel="icon" href="../assets/LaksamanaMudaLogo.jpeg">

<!-- Guard SSO: cukup punya akses modul `finance` (atau '*'). Dijaga di sini
     supaya halaman tidak sempat tergambar sedikit pun bagi yang tidak berhak.
     Penjaga sebenarnya tetap di sisi Office: `modules`/`adminModules` dibuat
     server saat login, bukan diketik browser.

     Syaratnya HARUS SAMA PERSIS dengan bacaSesi() di bawah; kalau salah satu
     diubah, ubah keduanya. Di modul Kompas — asal salinan berkas ini — kedua
     tempat itu pernah tidak sinkron, dan akibatnya orang yang sudah diberi
     akses di Kelola Akses tetap dilempar balik ke Office sebelum satu baris
     pun sempat jalan, tanpa satu pun gejala yang bisa dilihat dari Office. -->
<script>
(function(){try{
  var s=JSON.parse(localStorage.getItem('lm_session')||'null');
  var hidup=s&&s.expiry&&Date.now()<s.expiry;
  var punyaModul=hidup&&(s.modules||[]).some(function(m){return m==='*'||m==='finance';});
  if(!punyaModul)location.replace('../');
}catch(e){location.replace('../');}})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ===== TEMA OFFICE LAKSAMANA (emas di atas krem/putih, tanpa hitam) ===== */
:root{
  --ink:#2A2620; --ink-2:#3A3428; --ink-3:#4A4234;
  --gold:#A9791F; --gold-2:#C8961F; --gold-dim:#7A560F;
  --gold-soft:#F2E9D3; --gold-glow:rgba(169,121,31,.13);
  --paper:#F7F6F4; --surface:#FFFFFF; --line:#E7E1D3;
  --line-soft:rgba(60,55,45,.10); --line-hard:rgba(60,55,45,.18);
  --text:#2A2620; --muted:#5C574D; --muted-2:#928C80;
  --ok:#1F9D5F; --ok-bg:#E4F5EC; --ok-bg-t:rgba(31,157,95,.12);
  --warn:#B5831A; --warn-bg:#F7EFDB; --warn-bg-t:rgba(181,131,26,.14);
  --danger:#C9432B; --danger-bg:#F8E4DF; --danger-bg-t:rgba(201,67,43,.12);
  --info:#2F7FC4; --info-bg:#E4EFF8; --info-bg-t:rgba(47,127,196,.12);
  --violet:#7C5FC0; --violet-bg:#ECE6F7; --violet-bg-t:rgba(124,95,192,.12);
  --teal:#1F9D8F; --teal-bg:#E2F4F2; --teal-bg-t:rgba(31,157,143,.12);
  --radius:16px; --radius-sm:10px; --radius-lg:20px;
  --shadow:0 4px 18px rgba(50,42,28,.06); --shadow-lg:0 18px 48px rgba(50,42,28,.12);
  --ring:0 0 0 3px rgba(227,160,8,.18); --ease:cubic-bezier(.16,1,.3,1);
  --font-display:'Plus Jakarta Sans',system-ui,sans-serif;
  --font-body:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:var(--font-display); --sans:var(--font-body); --sidebar-w:248px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans);
  background:radial-gradient(900px 480px at 50% -12%, rgba(227,160,8,.09), transparent 60%),var(--paper);
  color:var(--text); font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased; min-height:100vh;
}
h1,h2,h3,h4{font-family:var(--serif); font-weight:700; letter-spacing:-.02em; line-height:1.18; color:var(--ink)}
a{color:var(--info)}
button{font-family:inherit; cursor:pointer}
input,select,textarea{font-family:inherit}
.mono{font-variant-numeric:tabular-nums; font-feature-settings:"tnum"}
.hidden{display:none !important}
@keyframes lm-rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.rise{animation:lm-rise .5s var(--ease) both}
.btn{border:none;border-radius:var(--radius-sm);padding:11px 17px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:filter .15s var(--ease),transform .1s var(--ease)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:none;box-shadow:var(--ring)}
.btn-block{width:100%}
.btn-sm{padding:8px 12px;font-size:13px}
.btn-xs{padding:5px 9px;font-size:12px;border-radius:8px}
.btn-primary{background:linear-gradient(135deg,var(--gold-2),var(--gold-dim));color:#fff;box-shadow:0 3px 12px rgba(122,86,15,.28)}
.btn-primary:hover{filter:brightness(1.06)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;filter:none}
.btn-ghost{background:var(--surface);border:1.5px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--gold-2);background:var(--gold-soft)}
.btn-danger{background:var(--danger-bg);color:var(--danger);border:1.5px solid rgba(201,67,43,.25)}
.btn-danger:hover{filter:brightness(.98)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--ink-2);background:var(--gold-soft);border:1px solid var(--line);border-radius:20px;padding:3px 9px}
.pill .dot{width:5px;height:5px;border-radius:50%;background:var(--gold);flex:none}
.field{text-align:left;margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);font-size:15px;transition:border-color .15s,box-shadow .15s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--gold);box-shadow:var(--ring)}

/* ===== LAYOUT ===== */
.app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);flex:none;background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 18px}
.brand .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--gold-2),var(--gold-dim));display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:800;color:#fff;font-size:18px;flex:none}
.brand .bt{font-family:var(--serif);font-weight:800;font-size:16px;color:var(--ink);letter-spacing:-.02em;line-height:1.1}
.brand .bs{font-size:10.5px;color:var(--muted-2);letter-spacing:.5px;margin-top:2px}
.nav{flex:1}
.nav-group{margin-top:14px}
.nav-label{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted-2);padding:0 10px 7px}
.nav a{position:relative;display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;color:var(--muted);text-decoration:none;font-size:13.5px;font-weight:500;margin-bottom:2px;transition:background .13s,color .13s}
.nav a:hover{background:var(--paper);color:var(--ink)}
/* Menu aktif: latar krem lembut + garis emas di kiri (samakan dgn Reservasi/
   BD OS), BUKAN blok kuning penuh. */
.nav a.active{background:var(--gold-soft);color:var(--gold-dim);font-weight:600}
.nav a.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--gold)}
.nav a .ico{width:18px;display:flex;align-items:center;justify-content:center;flex:none}
.nav a .ico svg{width:17px;height:17px;stroke-width:1.9;opacity:.85}
.nav a.active .ico svg{opacity:1}
/* Ciutkan ke ikon saja (tombol ☰). Label/teks disembunyikan, ikon tetap.
   Hanya di desktop — di layar sempit sidebar sudah off-canvas. */
@media(min-width:621px){
  .app.nav-mini .sidebar{width:72px}
  .app.nav-mini .brand .bt,.app.nav-mini .brand .bs,.app.nav-mini .nav-label,.app.nav-mini .su-info{display:none}
  .app.nav-mini .brand{justify-content:center;padding:6px 0 18px}
  .app.nav-mini .nav a{justify-content:center;gap:0;font-size:0;padding:9px 0}
  .app.nav-mini .nav a .ico{font-size:16px;width:auto}
  .app.nav-mini .side-user{flex-direction:column;gap:8px;padding:10px 6px}
}
@media(max-width:620px){#navMiniBtn{display:none}}
/* kartu user + tombol keluar di kaki sidebar — pola sama seperti modul lain */
.side-user{display:flex;align-items:center;gap:9px;margin-top:12px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
.su-avatar{width:32px;height:32px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--gold-2),var(--gold-dim));color:#fff;font-family:var(--serif);font-weight:800;font-size:14px}
.su-info{min-width:0;flex:1}
.su-info b{display:block;font-size:12.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.su-info span{font-size:10.5px;color:var(--muted-2)}
.logout-x{background:var(--surface);border:1px solid var(--line);color:var(--muted);width:32px;height:32px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;flex:none;transition:.16s}
.logout-x:hover{background:var(--danger-bg);color:var(--danger);border-color:var(--danger)}
.logout-x svg{width:16px;height:16px}
.main{flex:1;min-width:0;padding:26px 30px 60px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.topbar h1{font-size:23px}
.topbar .sub{font-size:13px;color:var(--muted);margin-top:3px}
.month-pick{display:flex;align-items:center;gap:10px}
.month-pick input{padding:9px 11px;border:1.5px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);font-size:14px;font-weight:600;color:var(--ink)}
/* Saklar Harian / Bulanan. Bentuk segmented supaya terbaca sebagai DUA
   keadaan dari satu hal, bukan dua tombol aksi yang berdiri sendiri. */
.modesw{display:inline-flex;gap:3px;background:var(--paper);border:1.5px solid var(--line);border-radius:var(--radius-sm);padding:3px}
.modesw button{border:none;background:transparent;padding:6px 12px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;transition:background .15s,color .15s}
.modesw button:hover{color:var(--ink)}
.modesw button.on{background:var(--surface);color:var(--gold-dim);box-shadow:0 1px 4px rgba(50,42,28,.12)}
/* Pesan galat simpan sekarang membawa sebab asli dari server (bisa sepanjang
   "SQLSTATE[HY000] [1044] Access denied..."), jadi span-nya harus boleh
   membungkus dan memotong kata panjang, bukan melebarkan header. */
.sync{font-size:11.5px;font-weight:600;color:var(--muted-2);display:inline-block;max-width:340px;line-height:1.45;text-align:right;overflow-wrap:anywhere}
.sync.ok{color:var(--ok)} .sync.err{color:var(--danger)} .sync.saving{color:var(--warn)}
.view{max-width:1180px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 22px;margin-bottom:18px}
.card h3{font-size:16px;margin-bottom:4px}
.card .card-sub{font-size:12.5px;color:var(--muted);margin-bottom:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
/* g5 dipakai baris ringkasan Performa Kasir: target, omset diakui,
   achievement, bonus, dan jarak ke level berikutnya dibaca sebagai SATU
   cerita, jadi dipajang satu baris — bukan dipecah ke dua kartu yang
   masing-masing mengulang "Omset Diakui". */
.g5{grid-template-columns:repeat(5,1fr)}
@media(max-width:1200px){.g5{grid-template-columns:repeat(3,1fr)}}
@media(max-width:900px){.g2,.g3,.g4,.g5{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.g2,.g3,.g4,.g5{grid-template-columns:1fr}.sidebar{position:fixed;z-index:50;transform:translateX(-100%);transition:transform .2s}.sidebar.open{transform:none}.main{padding:18px}}
.row-in{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}

/* stat cards — pita emas tipis di tepi atas (gaya Marketing) */
.stat{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:17px 18px;box-shadow:var(--shadow)}
.stat::before{content:'';position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--gold-2),var(--gold-dim))}
.stat .lab{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:6px}
.stat .val{font-family:var(--serif);font-weight:700;font-size:26px;color:var(--ink);margin-top:8px;letter-spacing:-.02em;line-height:1}
.stat .val.sm{font-size:19px}
.stat .foot{font-size:12px;color:var(--muted);margin-top:8px}
.stat.accent{background:linear-gradient(135deg,var(--gold-2),var(--gold-dim));color:#fff;border:none}
.stat.accent::before{display:none}
.stat.accent .lab{color:rgba(255,255,255,.72)}
.stat.accent .val{color:#fff}
.stat.accent .foot{color:rgba(255,255,255,.72)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;border-radius:20px;padding:3px 9px}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.bad{background:var(--danger-bg);color:var(--danger)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.info{background:var(--info-bg);color:var(--info)}
/* Netral — untuk label yang bukan status baik/buruk, mis. Non-Free Entry.
   .chip polos tidak punya background sama sekali, jadi jangan dipakai telanjang. */
.chip.mute{background:var(--paper);color:var(--muted);border:1px solid var(--line)}

/* progress */
.prog{height:9px;border-radius:20px;background:var(--gold-soft);overflow:hidden;margin-top:9px}
.prog>i{display:block;height:100%;border-radius:20px;background:linear-gradient(90deg,var(--gold-2),var(--gold-dim));transition:width .5s var(--ease)}
.prog.ok>i{background:linear-gradient(90deg,#28b06e,var(--ok))}

/* table */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:10px 12px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);color:var(--text)}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto}
tbody tr:hover{background:var(--gold-soft)}

/* status badge */
.status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600}
.status .d{width:9px;height:9px;border-radius:50%;flex:none}
.status.ok .d{background:var(--ok)}
.status.ok{color:var(--ok)}
.status.bad .d{background:var(--danger)}
.status.bad{color:var(--danger)}

/* breakdown row */
.brow{display:grid;gap:10px;align-items:end;margin-bottom:10px}
.brow.mk{grid-template-columns:1.1fr 1.3fr .9fr auto auto auto}
.brow.ks{grid-template-columns:1.2fr .9fr 1fr auto}
.brow.so{grid-template-columns:1.2fr .9fr auto}
.brow .field{margin-bottom:0}
@media(max-width:760px){.brow.mk,.brow.ks,.brow.so{grid-template-columns:1fr}}
/* Centang Free Entry (dulu "Ticketing") di baris breakdown. Dibuat setinggi field di sebelahnya
   supaya tidak melayang saat baris ikut memanjang. */
.tkbox{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;padding-bottom:9px}
.tkbox input{cursor:pointer}
.tkbox.on{color:var(--gold-dim)}
/* Tombol ringkasan potongan di baris breakdown. Merah kalau shift-nya belum
   diisi — tanpa itu potongannya tidak dibebankan ke siapa pun dan omset yang
   sama diam-diam terhitung dua kali. */
.bhbtn{border:1px dashed var(--line);background:var(--surface);border-radius:9px;padding:7px 10px;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;margin-bottom:9px;line-height:1.35;text-align:left}
.bhbtn:hover{border-color:var(--gold);color:var(--gold-dim)}
.bhbtn.kosong{border-color:var(--danger);color:var(--danger)}
.bhbtn b{display:block;font-size:12.5px;color:var(--text)}
.bhbtn.kosong b{color:var(--danger)}

/* ---- Modal ---- */
.ovl{position:fixed;inset:0;background:rgba(15,18,24,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:80}
.mdl{background:var(--surface);border-radius:var(--radius);max-width:560px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.mdl-h{padding:18px 22px 12px;border-bottom:1px solid var(--line)}
.mdl-h h3{font-size:16px;margin:0}
.mdl-h .sub{font-size:12.5px;color:var(--muted);margin-top:4px}
.mdl-b{padding:18px 22px}
.mdl-f{padding:14px 22px 18px;display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid var(--line)}
.kslist{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-top:8px}
.kschip{display:flex;align-items:center;gap:9px;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;font-size:13px;font-weight:600;cursor:pointer}
.kschip:hover{border-color:var(--gold)}
.kschip.on{border-color:var(--gold);background:var(--gold-soft);color:var(--gold-dim)}
.mini-lab{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-bottom:8px}
/* Mode UBAH catatan compliment. Kartu form dan barisnya di daftar ditandai
   bersamaan — tanpa itu, form yang sudah terisi terlihat persis seperti form
   tambah-baru, dan orang menekan Simpan mengira sedang menambah. */
.card.edit-on{border-color:var(--accent,#C9A227);box-shadow:0 0 0 2px rgba(201,162,39,.16)}
tr.baris-edit{background:rgba(201,162,39,.10)}
.mini-actions{display:inline-flex;gap:5px;align-items:center}
.balance-bar{position:sticky;bottom:0;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--radius);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:16px;box-shadow:var(--shadow-lg);flex-wrap:wrap;margin-top:8px}
.balance-bar .bnums{display:flex;gap:26px;flex-wrap:wrap}
.balance-bar .bnums .bi{font-size:12px;color:var(--muted)}
.balance-bar .bnums .bi b{display:block;font-family:var(--serif);font-size:16px;color:var(--ink);font-weight:800;margin-top:2px}
.notice{padding:11px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;margin-bottom:14px;display:flex;gap:9px;align-items:flex-start}
.notice.ok{background:var(--ok-bg);color:#146c42}
.notice.bad{background:var(--danger-bg);color:#8f2718}
.notice.info{background:var(--info-bg);color:#1a5a91}
.notice.warn{background:var(--warn-bg);color:#7a5a10}
.empty{text-align:center;padding:40px 20px;color:var(--muted-2)}
.empty .big{font-size:34px;margin-bottom:8px}
.seg{display:inline-flex;background:var(--gold-soft);border-radius:10px;padding:3px;gap:2px;margin-bottom:16px;flex-wrap:wrap}
.seg button{border:none;background:transparent;padding:7px 15px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.divlabel{display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:3px 9px;border-radius:6px;margin-bottom:12px}
.divlabel.mk{background:var(--info-bg);color:var(--info)}
.divlabel.ev{background:var(--violet-bg);color:var(--violet)}
.divlabel.ks{background:var(--teal-bg);color:var(--teal)}
.divlabel.so{background:var(--gold-soft);color:var(--gold)}
.hamb{display:none}
@media(max-width:620px){.hamb{display:inline-flex}}
.chart-box{position:relative;height:280px}
.chart-box.sm{height:230px}
.helper{font-size:11.5px;color:var(--muted-2);margin-top:4px}
.tax-note{background:var(--warn-bg-t);border:1px dashed rgba(181,131,26,.4);border-radius:var(--radius-sm);padding:10px 13px;font-size:12.5px;color:#7a5a10;margin-top:6px}
.leader{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--radius-sm);border:1px solid var(--line);margin-bottom:9px;background:var(--surface)}
.leader .rank{width:30px;height:30px;border-radius:50%;background:var(--gold-soft);color:var(--gold-dim);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px;flex:none}

/* ---- Lembar cetak (Dashboard Omset & Report Achievement) ----
   WAJIB display:none di layar. Isinya diisi tepat sebelum window.print(), dan
   tanpa aturan ini lembarnya ikut menempel di bawah halaman sesudah dialog
   cetak ditutup. Ditampilkan hanya di dalam @media print.

   GAYA DOKUMEN LAKSAMANA (7 Agustus 2026, permintaan user berikut contoh
   lembarnya). Sebelum ini lembar kompas memakai gaya generik: garis hitam,
   kotak abu berbingkai, tanpa kop. Sekarang bentuknya sama dengan lembar
   Konfirmasi Detail Acara yang sudah dipakai Marketing dan lembar PR di BD —
   kop berlogo, nama serif, pita emas, kartu meta krem, seksi bertajuk.
   Yang menerima laporan ini orang yang sama yang menerima lembar-lembar itu;
   dokumen yang tiba dengan tata letak asing memaksa mereka membaca ulang dari
   nol. Rujukan gaya: buildBriefDoc() di deploy/marketing/index.html dan blok
   .doc-* di deploy/bd/index.html.

   print-color-adjust:exact WAJIB ada. Tanpa itu Chrome membuang SEMUA warna
   latar saat mencetak kecuali user sendiri mencentang "Background graphics" —
   dan yang keluar adalah lembar putih polos tanpa kartu meta, tanpa pita
   emas, tanpa seksi: persis gaya lama yang sedang diganti. Pita emas dan
   bingkai seksi sengaja dibuat dari `border` (border selalu tercetak), jadi
   sekalipun aturan ini diabaikan peramban lain, kerangka dokumennya tetap
   berdiri. */
#printSheet{display:none}
@media print{
  /* Sembunyikan aplikasi, sisakan lembar. visibility saja tidak cukup —
     sidebar tetap memesan ruang dan lembarnya terdorong ke halaman 2. */
  .app,.topbar{display:none!important}
  /* SATU HALAMAN (permintaan user 7 Agustus 2026). Lembar versi pertama
     menumpuk enam seksi satu kolom lalu 31 baris rincian harian di bawahnya —
     hampir tiga halaman untuk laporan yang isinya dua puluhan angka.

     Tiga hal yang membuatnya muat sekarang: ukuran diturunkan menyeluruh,
     seksi disusun DUA KOLOM (.kolom2), dan tabel rincian harian dipecah jadi
     tiga kolom berdampingan (.kolom3) — 31 baris bertumpuk memakan ~450px
     sedangkan yang tersisa di bawah seksi cuma ~250px.

     Ini pengetatan tata letak, BUKAN jaminan. Bulan 31 hari dengan seluruh
     seksi terisi muat; PIC dengan puluhan event di Report Achievement tetap
     bisa tumpah ke halaman kedua. Yang dijaga di sana: barisnya tidak
     terbelah di tengah (page-break-inside pada tr). */
  @page{size:A4 portrait;margin:10mm}
  #printSheet{display:block!important;color:#0C1826;
    font-family:Inter,-apple-system,'Segoe UI',system-ui,sans-serif;
    font-size:9.5px;line-height:1.5;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}

  /* --- KOP --- */
  #printSheet .ph{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;
    border-bottom:2.5px solid #F7BB0E;padding-bottom:10px;margin-bottom:11px}
  #printSheet .ph-l{display:flex;gap:11px;align-items:center;min-width:0}
  #printSheet .ph-logo{width:52px;height:52px;object-fit:contain;flex:none}
  #printSheet .ph-nama{font-family:Georgia,'Times New Roman',serif;font-size:17px;font-weight:700;
    line-height:1.15;letter-spacing:-.01em}
  #printSheet .ph-sub{font-size:7px;letter-spacing:.2em;color:#C8940A;font-weight:700;margin-top:2px}
  #printSheet .ph-alamat{font-size:8px;color:#666;margin-top:3px;line-height:1.45;max-width:200px}
  #printSheet .ph-r{text-align:right;max-width:56%}
  #printSheet .ph-label{font-size:7.5px;letter-spacing:.16em;color:#C8940A;font-weight:700;text-transform:uppercase}
  #printSheet .ph-judul{font-family:Georgia,'Times New Roman',serif;font-size:15.5px;font-weight:700;
    margin-top:3px;line-height:1.2}
  #printSheet .ph-tgl{font-size:8.5px;color:#555;margin-top:2px}

  /* --- KARTU META (krem, empat kolom satu baris) --- */
  #printSheet .meta{background:#F6F4EE;border:1px solid #EAE5D9;border-radius:8px;
    padding:8px 13px;margin-bottom:10px;display:grid;
    grid-template-columns:repeat(4,1fr);gap:3px 16px;font-size:8.5px}
  #printSheet .meta b{font-weight:700}

  /* --- PITA KPI (angka utama, empat kotak sebaris) --- */
  #printSheet .kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}
  #printSheet .kpi>div{border:1px solid #E3DFD5;border-radius:8px;padding:6px 10px}
  #printSheet .kpi .l{font-size:7px;text-transform:uppercase;letter-spacing:.08em;color:#777}
  #printSheet .kpi .v{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.25}
  #printSheet .kpi .f{font-size:7.5px;color:#888}
  #printSheet .kpi>div.em{background:#FBF3D8;border-color:#EBD9A2}

  /* --- SEKSI BERTAJUK --- */
  #printSheet .kolom2{display:grid;grid-template-columns:1fr 1fr;gap:9px;align-items:start}
  #printSheet .sect{border:1px solid #E3DFD5;border-radius:8px;overflow:hidden;
    margin-bottom:9px;page-break-inside:avoid}
  #printSheet .kolom2>div>.sect:last-child{margin-bottom:0}
  #printSheet .sect-h{background:#F1EEE7;padding:6px 11px;font-weight:700;font-size:9.5px;
    border-bottom:1px solid #E3DFD5}
  #printSheet table{width:100%;border-collapse:collapse;font-size:9px}
  #printSheet .sect td{padding:4.5px 11px;border-bottom:1px solid #EFECE4;vertical-align:top}
  #printSheet .sect tr:last-child td{border-bottom:none}
  #printSheet .sect td.k{color:#6B6B6B;width:52%}
  #printSheet .sect td.v{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
  /* Keterangan kecil di bawah label. Kelasnya menempel di div DI DALAM td,
     jadi selektornya tidak boleh `td.n` — itu tidak pernah cocok. */
  #printSheet .sect .n{color:#888;font-weight:400;font-size:8px;margin-top:1px}
  /* Baris yang menutup satu seksi (TOTAL / GRAND) diberi latar emas tipis. */
  #printSheet .sect tr.sum td{background:#FBF3D8;font-weight:700;border-top:1px solid #EBD9A2}

  /* --- TABEL DATA, boleh dipecah beberapa kolom berdampingan --- */
  #printSheet .sect thead th{background:#F1EEE7;font-size:7px;text-transform:uppercase;
    letter-spacing:.07em;color:#555;padding:5px 9px;text-align:left;
    border-bottom:1px solid #E3DFD5;white-space:nowrap}
  #printSheet .sect th.num,#printSheet .sect td.num{text-align:right;font-variant-numeric:tabular-nums}
  #printSheet .sect tfoot td{background:#F6F4EE;font-weight:700;border-top:1px solid #E3DFD5}
  #printSheet .sect.data{page-break-inside:auto}
  #printSheet .sect.data tr{page-break-inside:avoid}
  #printSheet .kolomN{display:grid}
  #printSheet .kolomN.n2{grid-template-columns:1fr 1fr}
  #printSheet .kolomN.n3{grid-template-columns:1fr 1fr 1fr}
  /* Garis pemisah antar kolom tabel — tanpa ini tiga kolom angka berdempetan
     terbaca sebagai satu tabel enam kolom yang urutannya kacau. */
  #printSheet .kolomN>table+table{border-left:1px solid #E3DFD5}
  #printSheet .kolomN td{padding:3.5px 9px}

  /* --- PITA CATATAN KUNING (satu baris saja) --- */
  #printSheet .note{background:#FBF3D8;border:1px solid #EBD9A2;border-radius:8px;
    padding:7px 12px;margin-bottom:9px;font-size:8.5px;line-height:1.55}
  #printSheet .note b{color:#8A6A12}

  /* --- KAKI --- */
  #printSheet .kaki{display:flex;justify-content:space-between;gap:18px;
    border-top:1px solid #E3DFD5;margin-top:11px;padding-top:6px;
    font-size:7.5px;color:#8A8A8A}
}
</style>

<script>
/* =========================================================
   FINANCE — engine

   Modul ini DISALIN DARI KOMPAS (10 Agustus 2026), bukan ditulis dari nol,
   dengan alasan yang sama seperti modul Cashier: Dashboard Omset dan Performa
   Marketing/Event/Kasir yang diminta di sini ADALAH halaman Kompas, dan
   DATABASENYA MEMANG SATU. API_URL di bawah tetap kompas-api-mysql, jadi
   angka di Finance dan di Kompas tidak mungkin berbeda — tidak ada yang perlu
   disalin, disinkronkan, atau dicocokkan.

   DUA BACKEND, dan itu disengaja:
     API_URL    → ../kompas-api-mysql/api.php  : omset, target, compliment,
                  performa. HANYA DIBACA dari sini (lihat catatan di save()).
     API_KK_URL → ../finance-api-mysql/api.php : Kas Kecil. Milik modul ini
                  sendiri, karena tidak ada hubungannya dengan omset dan
                  menumpangkannya ke blob Kompas berarti dua modul menulis
                  satu baris yang sama.

   Konsekuensi yang harus diingat saat menyunting: kalau menyentuh Dashboard
   Omset atau Performa, sunting KEDUANYA (deploy/kompas/index.html dan berkas
   ini) — dua berkas yang menggambar data yang sama dengan bentuk berbeda
   adalah cara paling senyap untuk membuat dua modul melaporkan angka beda.

   Yang TIDAK dibawa ke sini: Input Omset, Report Daily, Piutang, Compliment,
   Breakdown, Analytics, Ranking PIC, Pengaturan Target. Itu pekerjaan Kompas
   dan Cashier; Finance hanya membacanya sebagai angka jadi.

   Omset (net) = Food + Beverage + Lainnya − Discount
   Compliment = catatan terpisah; memotong REALISASI PIC penanggungnya
   ========================================================= */
const API_URL='../kompas-api-mysql/api.php';
const API_KK_URL='../finance-api-mysql/api.php';
/* Cache TERPISAH dari Kompas walau isinya blob yang sama. Dulu sempat dipakai
   kunci yang sama, dan akibatnya: membuka Finance saat offline menampilkan
   salinan yang ditinggalkan Kompas — termasuk kalau salinan itu jauh lebih
   tua. Kunci sendiri membuat tiap modul jujur soal kapan ia terakhir online. */
const CACHE_KEY='lm_finance_cache_v1';
const SESSION_KEY='lm_session';
const fmtRp=n=>'Rp'+Math.round(n||0).toLocaleString('id-ID');
/* Nominal BERTANDA untuk kolom selisih. fmtRp() menempelkan minus di belakang
   "Rp" ("Rp-9.001") karena tandanya ikut ke dalam toLocaleString — di kolom
   yang justru isinya sering negatif itu terbaca salah sekilas. */
const fmtSel=n=>{ n=Math.round(n||0); return (n>0?'+':n<0?'−':'')+'Rp'+Math.abs(n).toLocaleString('id-ID'); };
const fmtRpShort=n=>{n=n||0;if(Math.abs(n)>=1e9)return 'Rp'+(n/1e9).toFixed(1).replace('.0','')+'M';if(Math.abs(n)>=1e6)return 'Rp'+(n/1e6).toFixed(1).replace('.0','')+'jt';if(Math.abs(n)>=1e3)return 'Rp'+Math.round(n/1e3)+'rb';return 'Rp'+Math.round(n);};
const pct=(a,b)=>b>0?(a/b*100):0;
// Semua nominal di modul ini bilangan BULAT (rupiah/jumlah), dan input rupiah
// diformat dengan titik pemisah ribuan. Jadi titik DIBUANG (bukan dianggap
// desimal) supaya "3.000.000" terbaca 3000000, bukan 3.
const num=v=>{const n=parseInt(String(v).replace(/[^0-9-]/g,''),10);return isNaN(n)?0:n;};
const HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const daysInMonth=(y,m)=>new Date(y,m,0).getDate();
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const monthKeyOf=iso=>iso.slice(0,7);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---- Format rupiah untuk input nominal (angka + pemisah ribuan titik) ----
   Inputan diberi class "rp": nilainya diformat hidup saat diketik, dan num()
   (yang membuang non-digit) tetap membacanya benar. */
function fmtRpInput(v){ var d=String(v==null?'':v).replace(/[^0-9]/g,''); return d?Number(d).toLocaleString('id-ID'):''; }
function formatAllRp(root){ (root||document).querySelectorAll('input.rp').forEach(function(el){ el.value=fmtRpInput(el.value); }); }
document.addEventListener('input',function(e){
  var el=e.target; if(!el||!el.classList||!el.classList.contains('rp')) return;
  var before=el.value.length, caret=el.selectionStart;
  el.value=fmtRpInput(el.value);
  var delta=el.value.length-before;
  try{ el.setSelectionRange(Math.max(0,caret+delta), Math.max(0,caret+delta)); }catch(_){}
});

/* ---- Nol langsung tergantikan saat mulai mengetik ----
   Hampir semua kotak angka di modul ini mulai dari "0". Tanpa ini kru harus
   menghapus nolnya sendiri tiap kali mengisi — dan kalau lupa, hasilnya "05"
   yang terbaca 5 di kotak rupiah tapi tetap terlihat salah, dan benar-benar
   jadi "05" di kotak biasa (traffic/bill/qty) yang tidak lewat formatter. */
function kotakAngka(el){
  return !!el && el.tagName==='INPUT' && !!el.classList &&
         (el.classList.contains('rp') || el.classList.contains('ci') || el.getAttribute('inputmode')==='numeric');
}
function pilihKalauNol(el){ if(kotakAngka(el) && num(el.value)===0){ try{ el.select(); }catch(_){} } }
document.addEventListener('focusin',function(e){ pilihKalauNol(e.target); });
// Klik membatalkan select() dari focusin, jadi dipilih ulang sesudah klik
// selesai. Aman: hanya berlaku saat isinya nol, yang memang tidak ada yang
// perlu ditunjuk kursornya.
document.addEventListener('mouseup',function(e){
  var el=e.target;
  if(kotakAngka(el) && el.selectionStart===el.selectionEnd) pilihKalauNol(el);
});
// Jaring pengaman untuk kotak TANPA class "rp" (traffic, bill, qty): buang nol
// di depan begitu ada angka lain diketik.
document.addEventListener('input',function(e){
  var el=e.target;
  if(!kotakAngka(el) || el.classList.contains('rp')) return;   // yang "rp" sudah dirapikan formatter di atas
  var bersih=String(el.value).replace(/[^0-9]/g,'').replace(/^0+(?=\d)/,'');
  if(bersih!==el.value) el.value=bersih;
});

/* ENAM BARIS BARU (permintaan user 8 Agustus 2026): Gofood dan lima baris

/* Batas toleransi selisih, dinaikkan ke Rp5.000 pada 3 Agustus 2026 atas
   permintaan user.

   Yang dinilai adalah TOTAL, bukan per metode. Selisih antar metode itu wajar
   dan sering: tamu bayar lewat QRIS lalu uangnya dikembalikan tunai, atau
   pembayaran tercatat di metode yang keliru lalu ditutup dengan metode lain.
   Dalam kasus seperti itu satu metode lebih dan satunya kurang dengan nominal
   yang sama — totalnya tetap nol, dan tidak ada uang yang hilang.

   Karena itu Rp5.000 ke bawah TIDAK dipermasalahkan sama sekali, dan di atas

   submit akan membuat kasir mengarang angka Actual supaya bisa pulang, dan
   report yang cocok tapi karangan jauh lebih berbahaya daripada report yang
   selisih tapi jujur. */
const SELISIH_TOLERANSI=5000;
/* Tim/Keterangan Office yang boleh jadi PIC compliment, + "Tamu" yang bukan
   orang: compliment ber-PIC Tamu tidak memotong realisasi siapa pun. */
/* 'kasir' DITAMBAHKAN 1 Agustus 2026. Sebelumnya kasir tidak bisa dipilih
   sebagai PIC sama sekali, sehingga compliment yang diinput kasir sendiri
   tidak pernah bisa dibebankan kepadanya — potongannya sudah lama ada di
   Performa Kasir (agg[k].real -= comp) tapi angkanya SELALU NOL karena tidak
   pernah ada compliment ber-PIC kasir. Akibatnya barang yang keluar tanpa
   uang masuk tetap terhitung sebagai omset yang diakui kasir. */
const COMP_DIV=['marketing','office','event','kasir'];
const PIC_TAMU='__tamu__';

/* Default awal — dipakai kalau server masih kosong. Daftar PIC SENGAJA kosong:
   nama Marketing/Event/Kasir ditarik otomatis dari akun Office yang divisinya
   sudah di-define (lihat syncPicOffice), bukan diisi contoh dari sini.
   Data omset harian mulai kosong. */
function seed(){
  return {
    settings:{ companyMonthlyTarget:300000000, useWorkingDays:false, workingDaysPerMonth:26 },
    employees:{ marketing:[], event:[], kasir:[] },
    daily:[],
    reports:{},      // "YYYY-MM-DD" -> {pay:{<kunci>:{pos,actual}}, by, at, submitted}
    compliments:[],  // [{id,date,nama,alasan,nominal,picName,picOfficeId,picDiv,by,at}]
    piutang:[],      // [{id,date,nama,tipe,bill,nominal,payKey,picName,picOfficeId,picDiv,status,lunasDate,lunasPayKey,lunasBy,lunasAt,by,at}]
    /* Daftar owner untuk dropdown bon. Diisi contoh yang memang ada supaya
       kasir tidak mengetik ulang nama yang sama tiap malam dengan ejaan yang
       berbeda-beda — itu yang membuat satu orang muncul jadi tiga baris
       hutang terpisah. Bisa ditambah & dihapus dari halaman Piutang. */
    owners:['Bu Julita','Pak Darwi','Pak Howandi','Pak Andry']
  };
}
/* Jaga bentuk data supaya view tidak pernah menemui field hilang. */
function normalizeDB(d){
  d=(d&&typeof d==='object'&&!Array.isArray(d))?d:{};
  const s=seed();
  if(!d.settings||typeof d.settings!=='object'||Array.isArray(d.settings)) d.settings=s.settings;
  else for(const k in s.settings) if(d.settings[k]===undefined||d.settings[k]===null) d.settings[k]=s.settings[k];
  if(!d.employees||typeof d.employees!=='object'||Array.isArray(d.employees)) d.employees=JSON.parse(JSON.stringify(s.employees));
  else ['marketing','event','kasir'].forEach(k=>{ if(!Array.isArray(d.employees[k])) d.employees[k]=s.employees[k]; });
  if(!Array.isArray(d.daily)) d.daily=[];
  if(!d.reports||typeof d.reports!=='object'||Array.isArray(d.reports)) d.reports={};
  if(!Array.isArray(d.compliments)) d.compliments=[];
  /* Bon/piutang. Bentuk & normalisasinya HARUS sama persis dengan
     deploy/cashier/index.html — dua modul menulis blob yang sama, dan kalau
     hanya satu yang mengisi bidang yang hilang, modul satunya yang akan
     menemui `undefined` dan halamannya blank. */
  if(!Array.isArray(d.piutang)) d.piutang=[];
  d.piutang.forEach(b=>{
    if(b.status!=='lunas') b.status='open';
    if(b.tipe===undefined) b.tipe='tamu';
    if(b.payKey===undefined) b.payKey='cash';
    if(b.bill===undefined) b.bill='';
    b.nominal=num(b.nominal);
    /* Bon berstatus lunas TANPA tanggal pelunasan tidak boleh ada: Report Daily
       menjumlahkan pelunasan berdasarkan lunasDate, jadi baris seperti itu akan
       hilang dari semua hari dan uangnya seolah tidak pernah masuk. Jatuhkan ke
       tanggal billnya — hari terdekat yang pasti benar-benar ada. */
    if(b.status==='lunas'){
      if(!b.lunasDate) b.lunasDate=b.date;
      if(!b.lunasPayKey) b.lunasPayKey=b.payKey;
    }
  });
  /* `d.penyesuaian` pernah ada di sini (input penyesuaian dana manual) dan
     DIBUANG 3 Agustus 2026 atas permintaan user: begitu penilaiannya pindah
     ke total, kasus yang dulu perlu dicatat manual — refund yang memindahkan
     uang dari QRIS ke Cash — sudah tertutup sendiri karena totalnya nol.
     Barisnya sengaja tidak dihapus dari blob: tidak ada yang membacanya, dan
     menghapus data lama demi kerapian tidak pernah sepadan. */
  /* Daftar owner. Kalau kuncinya hilang, dikembalikan ke bawaan; kalau
     ARRAY-nya kosong dibiarkan kosong — user memang boleh menghapus semuanya,
     dan mengembalikan nama yang baru saja dibuang itu perilaku yang menyebalkan. */
  if(!Array.isArray(d.owners)) d.owners=s.owners.slice();
  d.owners=d.owners.map(x=>String(x||'').trim()).filter(Boolean);
  /* Migrasi: "Total Tax & Service" dulu SATU angka (tax_service). Sekarang
     dipecah jadi service_charge + tax. Nilai lama seluruhnya dianggap tax —
     menebak pembagiannya justru mengarang angka yang tidak pernah diinput. */
  d.daily.forEach(x=>{
    if(x.service_charge===undefined && x.tax===undefined && x.tax_service!==undefined){
      x.tax=num(x.tax_service); x.service_charge=0;
    }
    if(x.service_charge===undefined) x.service_charge=0;
    if(x.tax===undefined) x.tax=0;
    /* Baris kasir sebelum 3 Agustus 2026 tidak punya `disc`. Diisi 0, bukan
       ditebak dari x.discount: nominalnya memang tidak pernah dicatat per
       kasir, dan membagi ratanya akan mengarang angka yang tidak diinput
       siapa pun. Lihat catatan omsetKasir(). */
    if(x.bd&&Array.isArray(x.bd.kasir)) x.bd.kasir.forEach(r=>{ if(r.disc===undefined) r.disc=0; });
    // Ember Self Order, sama alasannya: hari sebelum 3 Agustus 2026 tidak
    // punya bidang ini dan nilainya memang nol — tidak ada omset yang pindah.
    if(x.bd&&(!x.bd.self||typeof x.bd.self!=='object'||Array.isArray(x.bd.self))) x.bd.self={amount:0,disc:0};
  });
  return d;
}

/* Bersih-bersih PIC contoh "Kasir 1/2/3" bawaan seed versi lama. Daftar kasir
   sekarang datang dari akun Office yang divisinya di-define, jadi placeholder
   ini tidak dipakai lagi. Baris breakdown miliknya ikut dibuang HANYA kalau
   nominalnya nol — kalau ternyata pernah dipakai, PIC-nya dibiarkan supaya
   omset yang sudah dialokasikan tidak hilang diam-diam. Idempoten: sekali
   bersih, panggilan berikutnya tidak melakukan apa-apa. */
function purgeSeedKasir(d){
  const contoh=e=>/^k[123]$/.test(String(e.id||'')) && /^kasir\s*\d+$/i.test(String(e.name||'').trim()) && !e.officeUserId;
  const kandidat=(d.employees.kasir||[]).filter(contoh);
  if(!kandidat.length) return false;
  const terpakai=new Set();
  (d.daily||[]).forEach(day=>(day.bd&&Array.isArray(day.bd.kasir)?day.bd.kasir:[]).forEach(r=>{ if(num(r.amount)>0) terpakai.add(r.kasirId); }));
  const buang=new Set(kandidat.filter(e=>!terpakai.has(e.id)).map(e=>e.id));
  if(!buang.size) return false;
  d.employees.kasir=d.employees.kasir.filter(e=>!buang.has(e.id));
  (d.daily||[]).forEach(day=>{ if(day.bd&&Array.isArray(day.bd.kasir)) day.bd.kasir=day.bd.kasir.filter(r=>!buang.has(r.kasirId)); });
  return true;
}

let DB=null;

/* ---- lapisan API ---- */
let SAVE_TIMER=null, SAVING=false, DIRTY=false, RETRY_TIMER=null, RETRY_KE=0;
function setSync(st,msg){
  const el=document.getElementById('syncBox'); if(!el) return;
  el.className='sync'+(st==='err'?' err':st==='ok'?' ok':st==='saving'?' saving':'');
  el.innerHTML=msg||(st==='ok'?'✓ Tersimpan':st==='saving'?'Menyimpan…':st==='load'?'Memuat…':'');
}
function fetchTimeout(url,opts,ms){
  const c=new AbortController(); const t=setTimeout(()=>c.abort(),ms||25000);
  opts=opts||{}; opts.signal=c.signal;
  return fetch(url,opts).then(r=>{clearTimeout(t);return r;},e=>{clearTimeout(t);throw e;});
}
function apiGet(){
  return fetchTimeout(API_URL+'?action=getAll&t='+Date.now(),{method:'GET',redirect:'follow'})
    .then(r=>r.json()).then(j=>{ if(!j.ok) throw new Error(j.error||'server error'); return j.data; });
}
function apiSave(state){
  return fetchTimeout(API_URL,{method:'POST',redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'saveAll',data:state})},40000)
    .then(r=>r.json()).then(j=>{ if(!j.ok) throw new Error(j.error||'server error'); return j.data; });
}
/* FINANCE TIDAK PERNAH MENULIS BLOB KOMPAS. Fungsi ini sengaja dibiarkan ada
   tapi dilumpuhkan, bukan dihapus, karena kode yang disalin dari Kompas masih
   memanggilnya di beberapa tempat — dan fungsi yang hilang akan menjatuhkan
   seluruh halaman dengan ReferenceError alih-alih tidak melakukan apa-apa.

   Alasannya: saveAll mengirim SELURUH state, jadi satu penyimpanan dari
   Finance yang salinannya sudah basi akan menimpa omset, target, dan
   compliment yang baru saja diubah orang di Kompas — dan tidak ada satu pun
   pesan yang muncul, karena dari sisi server itu penyimpanan yang sah.
   Finance cuma membaca; yang ditulisnya adalah Kas Kecil, lewat backend
   sendiri (lihat kkKirim). */
function save(){
  try{ localStorage.setItem(CACHE_KEY,JSON.stringify(DB)); }catch(e){}   // salinan lokal saja
}
/* Percobaan ulang kalau simpan gagal. Sebelumnya retry dijaga `if(DIRTY)`,
   padahal DIRTY baru saja di-set false di awal kirim() — jadi syaratnya tidak
   pernah benar dan "mencoba lagi…" itu bohong: datanya diam di localStorage
   sampai ada suntingan berikutnya. Sekarang dijadwalkan tanpa syarat, dengan
   jeda menanjak supaya server yang sedang bermasalah tidak dihujani. */
const RETRY_JEDA=[5000,10000,20000,40000,60000];
function jadwalkanUlang(){
  clearTimeout(RETRY_TIMER);
  const jeda=RETRY_JEDA[Math.min(RETRY_KE,RETRY_JEDA.length-1)];
  RETRY_KE++;
  RETRY_TIMER=setTimeout(kirim,jeda);
  return jeda;
}
function kirim(){
  if(SAVING){ SAVE_TIMER=setTimeout(kirim,700); return; }
  SAVING=true; DIRTY=false;
  apiSave(DB).then(()=>{
    SAVING=false; RETRY_KE=0; clearTimeout(RETRY_TIMER);
    setSync(DIRTY?'saving':'ok'); if(DIRTY) kirim();
  },err=>{
    SAVING=false;
    /* Sebab aslinya WAJIB ikut tampil. Pesan generik bikin galat konfigurasi
       (mis. MySQL 1044 "Access denied ... to database") tidak bisa dibedakan
       dari jaringan putus, dan itu memakan waktu diagnosa yang tidak perlu. */
    const sebab=(err&&err.message?String(err.message):'penyebab tidak diketahui').slice(0,200);
    const detik=Math.round(jadwalkanUlang()/1000);
    setSync('err',`Gagal simpan — tersimpan lokal, coba lagi ${detik}s.<br><span style="opacity:.85;font-size:11px">${esc(sebab)}</span>`);
  });
}

/* ---- derived helpers ----
   Rokok & Videotron DIHAPUS 27 Juli 2026 atas permintaan. Aman dilakukan
   karena saat itu database dev maupun produksi belum berisi satu pun baris
   omset, jadi tidak ada total historis yang berubah diam-diam. Field lamanya
   sengaja tidak di-DROP dari data yang mungkin tersimpan — cuma tidak
   dihitung lagi. */
function grossOf(d){ return num(d.food)+num(d.bev)+num(d.lainnya); }
function netOf(d){ return grossOf(d)-num(d.discount); }
/* Tax & service ADA DI LUAR omset (tidak menambah/mengurangi netOf), tapi
   tetap ditagihkan ke tamu. Jadi yang harus disamai total pembayaran di
   Report Daily adalah netOf + tax + service, bukan netOf saja. */
function taxSvcOf(d){ return num(d.service_charge)+num(d.tax); }
function tagihanOf(d){ return netOf(d)+taxSvcOf(d); }
function avgSpendOf(d){ const b=num(d.bill); return b>0?netOf(d)/b:0; }
function itemsOf(d){ return num(d.qty_food)+num(d.qty_bev)+num(d.qty_others); }

/* ---- DISKON BILL PER KASIR (3 Agustus 2026) ----
   Dulu diskon cuma SATU angka harian di Input Omset: ia mengurangi omset net,
   tapi tidak ada catatan siapa kasir yang memberikannya. Akibatnya siapa pun
   yang mengisi Breakdown bebas menaruh pengurangannya di kasir mana saja —
   kasir yang tidak memberi diskon bisa ikut menanggung, dan yang memberi bisa
   lolos. Sekarang tiap baris kasir punya `disc` sendiri:

     amount = omset BRUTO kasir itu (sebelum diskon)
     disc   = diskon bill yang DIA berikan ke tamu
     diakui = amount − disc     ← inilah yang masuk pengakuan omset

   Dua invarian yang dijaga Breakdown: Σ(amount−disc) = omset net harian, dan
   Σ(disc) = angka Discount di Input Omset Harian.

   Data sebelum tanggal ini punya disc=0 dan amount yang sudah neto, jadi
   amount−disc = amount — angkanya tidak berubah sama sekali, tidak perlu
   migrasi. Yang hilang cuma atribusinya, dan itu memang tidak pernah ada. */
function omsetKasir(r){ return num(r&&r.amount)-num(r&&r.disc); }
function diskonKasir(r){ return r&&r.off?0:num(r&&r.disc); }

/* ---- SELF ORDER (3 Agustus 2026) ----
   Tamu memesan sendiri lewat barcode di meja: uangnya masuk tanpa ada kasir
   yang melayani. Karena itu ia BUKAN omset kasir mana pun — tidak masuk
   Performa Kasir, tidak kena potongan event, tidak ikut menghitung bonus.
   Tapi uangnya nyata dan harus dialokasikan, kalau tidak Breakdown tidak akan
   pernah balance pada hari yang ada self order-nya.

   Jadi ia berdiri sebagai ember sendiri di Section A: satu baris per hari,
   `{amount, disc}` dengan aturan yang sama seperti baris kasir (amount bruto,
   disc = diskon bill yang diberikan lewat jalur ini). Laporannya digabung ke
   Analytics dan Dashboard Omset saja, sesuai permintaan user. */
function selfRow(d){ return (d&&d.bd&&d.bd.self)||{amount:0,disc:0}; }
function selfOmset(d){ const s=selfRow(d); return num(s.amount)-num(s.disc); }
function selfDiskon(d){ return num(selfRow(d).disc); }
/* angka desimal (UPT, party size) — 2 angka di belakang koma, gaya id-ID */
const fmtDec=n=>(isFinite(n)?n:0).toLocaleString('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2});
/* Pembagi hari sebulan — dipakai bareng oleh target harian perusahaan DAN
   proporsi target per PIC saat halaman dilihat per hari. Satu tempat, supaya
   "target harian" tidak pernah berarti dua angka berbeda di dua halaman. */
function pembagiHari(monthKey){
  const [y,m]=monthKey.split('-').map(Number);
  return DB.settings.useWorkingDays?DB.settings.workingDaysPerMonth:daysInMonth(y,m);
}
function dailyTarget(monthKey){
  const div=pembagiHari(monthKey);
  return div>0?DB.settings.companyMonthlyTarget/div:0;
}
function daysOfMonth(monthKey){ return DB.daily.filter(d=>monthKeyOf(d.date)===monthKey).sort((a,b)=>a.date<b.date?-1:1); }
function getDay(date){ return DB.daily.find(d=>d.date===date); }
function empName(div,id){ const e=(DB.employees[div]||[]).find(x=>x.id===id); return e?e.name:'—'; }

/* ============ RENTANG TAMPILAN: HARIAN vs BULANAN ============
   Halaman analitik (Dashboard Omset, Analytics, Ranking, Performa) dulu selalu
   sebulan. Sekarang keempatnya bisa dilihat per HARI juga — dan semuanya
   membaca rentangnya dari SATU fungsi di bawah, bukan masing-masing memanggil
   daysOfMonth(PERIOD) sendiri. Alasannya sama seperti porsiPic(): pernah ada
   empat tempat yang menjumlahkan sendiri-sendiri, dan yang satu terlewat
   membuat angka orang yang sama berbeda antar halaman.

   Halaman INPUT (Input Omset, Report Daily, Compliment, Breakdown) TIDAK ikut
   saklar ini — masing-masing punya pemilih tanggalnya sendiri di dalam
   kartunya, dan mereka mengubah satu hari, bukan membaca rentang. */
let VIEWMODE='bulan';                 // 'bulan' | 'hari'
let VIEWDATE=todayISO();              // hari yang dilihat saat VIEWMODE==='hari'
const VIEW_ANALITIK=['bulanan','analytics','summary','marketing','event','kasir'];

function modeHarian(){ return VIEWMODE==='hari'; }
/* Daftar hari yang dianalisis. Mode harian mengembalikan array 0 atau 1 elemen
   — array kosong (bukan null) supaya seluruh view yang me-reduce/map tetap
   jalan apa adanya tanpa penjagaan tambahan di tiap tempat. */
function rentangAktif(){
  if(!modeHarian()) return daysOfMonth(PERIOD);
  const d=getDay(VIEWDATE);
  return d?[d]:[];
}
function labelRentang(){
  return modeHarian()?dateLabel(VIEWDATE):labelPeriode(PERIOD);
}
/* Target perusahaan untuk rentang yang sedang dilihat. */
function targetRentang(){
  return modeHarian()?dailyTarget(monthKeyOf(VIEWDATE)):DB.settings.companyMonthlyTarget;
}
/* Target seorang PIC untuk rentang yang sedang dilihat. Target yang disimpan
   selalu BULANAN, jadi mode harian membaginya dengan pembagi yang sama yang
   dipakai target harian perusahaan. Kalau tidak diproporsikan, achievement
   harian tiap orang akan tampil ~1/30 dan semua orang terlihat gagal total
   tiap hari — angka yang benar secara aritmetika tapi tidak berarti apa pun. */
function targetPic(bulanan){
  if(!modeHarian()) return num(bulanan);
  const div=pembagiHari(monthKeyOf(VIEWDATE));
  return div>0?num(bulanan)/div:0;
}
/* Compliment dalam rentang aktif. compsBulan/compsOn sudah ada; ini cuma
   memilih yang mana yang berlaku supaya view tidak perlu bercabang sendiri. */
function compsRentang(){
  return modeHarian()?compsOn(VIEWDATE):compsBulan(PERIOD);
}

function setViewMode(m){
  VIEWMODE=(m==='hari')?'hari':'bulan';
  /* Hari yang dipilih diselaraskan ke PERIOD yang sedang aktif supaya
     berpindah ke mode harian tidak melompat ke bulan lain tanpa diminta.
     Kalau bulan itu ada datanya, ambil hari TERAKHIR yang terinput — itu
     yang hampir selalu dicari, bukan tanggal 1. */
  if(modeHarian() && monthKeyOf(VIEWDATE)!==PERIOD){
    const ds=daysOfMonth(PERIOD);
    VIEWDATE=ds.length?ds[ds.length-1].date:(PERIOD+'-01');
  }
  render();
}
/* Menampilkan kendali yang sesuai halaman & mode. Dipanggil dari render(),
   bukan dari tiap view: kalau tiap view mengaturnya sendiri, halaman yang
   lupa akan mewarisi kendali halaman sebelumnya. */
function syncKendaliPeriode(){
  const analitik=VIEW_ANALITIK.indexOf(CURRENT)>=0;
  const sw=document.getElementById('modeSw');
  const mp=document.getElementById('periodPick');
  const dp=document.getElementById('datePick');
  const lb=document.getElementById('periodLabel');
  if(sw) sw.style.display=analitik?'inline-flex':'none';
  const pakaiHari=analitik&&modeHarian();
  if(mp) mp.style.display=pakaiHari?'none':'';
  if(dp) dp.style.display=pakaiHari?'':'none';
  if(lb) lb.innerHTML='<span class="dot"></span> '+(pakaiHari?'Tanggal':'Periode');
  const bh=document.getElementById('modeHari'), bb=document.getElementById('modeBulan');
  if(bh) bh.className=modeHarian()?'on':'';
  if(bb) bb.className=modeHarian()?'':'on';
  if(mp) mp.value=PERIOD;
  if(dp) dp.value=VIEWDATE;
}

let compDate=todayISO();
let COMP_ROSTER=null, COMP_ROSTER_ERR='';
function ambilRoster(){
  if(COMP_ROSTER!==null) return Promise.resolve(COMP_ROSTER);
  return fetch('../account-api-mysql/api.php',{method:'POST',redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'listDivisiRoster'})})
    .then(r=>r.json())
    .then(j=>{
      if(!j||!j.ok||!Array.isArray(j.members)) throw new Error(j&&j.error||'balasan tidak dikenal');
      /* `divs` (JAMAK) sejak Office boleh memberi satu orang lebih dari satu
         tim. Sebelumnya cuma `div` = kecocokan PERTAMA menurut urutan COMP_DIV,
         jadi orang ber-keterangan "Kasir, Marketing" tercatat sebagai marketing
         saja — dan hilang dari daftar PIC compliment yang khusus kasir tanpa
         ada yang bisa menebak sebabnya. `div` dipertahankan untuk tampilan
         ringkas (chip di tabel) dan data lama. */
      COMP_ROSTER=j.members.map(u=>{
        if(u.active===false) return null;
        const ket=String(u.keterangan||'').toLowerCase().split(/[\s,;/]+/);
        const divs=COMP_DIV.filter(dv=>ket.indexOf(dv)>-1);
        if(!divs.length) return null;
        return {id:u.id,name:String(u.name||'').trim(),div:divs[0],divs};
      }).filter(u=>u&&u.name);
      COMP_ROSTER_ERR='';
      return COMP_ROSTER;
    })
    .catch(e=>{ COMP_ROSTER_ERR=e.message||'gagal'; COMP_ROSTER=[]; return COMP_ROSTER; });
}
function compsOn(date){ return (DB.compliments||[]).filter(c=>c.date===date); }
/* Divisi seorang PEMBERI compliment. 'office' DITAMBAHKAN 7 Agustus 2026:
   sebelumnya hanya marketing/event yang bisa dipilih, sehingga compliment yang
   diputuskan manajemen (mis. M. Tegar Junindri, Wandi Pranata, Howandi
   Chandra) tidak punya tempat sama sekali dan terpaksa dicatat sebagai "Tamu"
   — yang artinya tidak ada seorang pun tercatat sebagai pemberinya.

   Namanya SENGAJA tidak ditulis di kode: daftarnya ikut Tim/Keterangan akun
   Office, jadi orang baru muncul sendiri dan orang yang keluar hilang sendiri.
   Daftar nama di kode akan basi tanpa ada yang menyadarinya.

   Pemberi ber-divisi 'office' tidak memotong realisasi siapa pun — ia tidak
   punya baris di DB.employees.marketing/event, jadi tidak ada target yang bisa
   dipotong. Catatannya tetap ada, dan itu memang yang dibutuhkan. */
function divPemberi(u){
  const d=(u&&u.divs)||[(u&&u.div)||''];
  return d.indexOf('marketing')>-1?'marketing'
       :(d.indexOf('event')>-1?'event'
       :(d.indexOf('office')>-1?'office':''));
}
/* DUA PIC, dua pertanyaan yang berbeda (permintaan user 5 Agustus 2026):
     PIC Kasir   — siapa yang menutup bill-nya di POS. Selalu kasir.
     PIC Pemberi — siapa yang MEMBERIKAN compliment itu (marketing / event).
   Dua-duanya boleh "Tamu". Yang ber-PIC Tamu tidak memotong realisasi siapa
   pun — itulah gunanya: compliment untuk tamu umum memang bukan beban orang.

   Sebelum ini hanya ada satu PIC, jadi compliment yang diputuskan marketing
   tapi ditutup kasir harus dipilih salah satu, dan yang tidak dipilih tidak
   pernah terlihat menanggungnya. */
let COMP_EDIT='';   // id catatan yang sedang diubah; '' = sedang menambah baru
function compById(id){ return (DB.compliments||[]).find(c=>c.id===id)||null; }
function editCompliment(id){

}
function batalEditCompliment(){ COMP_EDIT=''; render(); }

/* ---- PENCOCOKAN KE REPORT DAILY (7 Agustus 2026) ----
   Compliment dan Member Deposit sama-sama "metode pembayaran" di Report Daily
   yang tidak membawa uang masuk: barangnya keluar, bill-nya ditutup tanpa
   setoran. Karena itu total catatan Compliment hari itu HARUS sama dengan
   POS Compliment + POS Member Deposit hari yang sama.

   Sebelum ini tidak ada satu layar pun yang membandingkan keduanya, jadi
   catatan yang kurang satu baris baru ketahuan saat rekap bulanan — kalau
   ketahuan sama sekali. Yang membuatnya berbahaya: selisihnya selalu berarti
   ada barang keluar yang tidak dibebankan ke PIC mana pun.

   Yang dipakai angka POS, bukan Actual. Actual itu uang yang benar-benar ada,
   dan compliment memang tidak pernah punya uangnya — membandingkan ke sana
   akan selalu selisih sebesar nilainya sendiri. Toleransi Rp5.000 yang berlaku
   di Report Daily TIDAK dipakai di sini: itu toleransi untuk uang yang
   berpindah antar metode, sedangkan ini dua catatan atas kejadian yang sama
   persis — kalau beda, memang ada baris yang belum diinput. */
function compsBulan(monthKey){ return (DB.compliments||[]).filter(c=>monthKeyOf(c.date)===monthKey); }
/* Daftar compliment yang membebani satu PIC. Dipisah dari compPic() supaya
   halaman Performa bisa memajang rinciannya — angka potongan saja bikin PIC
   bertanya-tanya "dipotong apa", dan jawabannya cuma ada di halaman lain. */
/* Penyaringnya dipisah dari sumber daftarnya supaya rentang mana pun bisa
   dipakai — sebulan (compListPic) maupun rentang aktif yang bisa cuma sehari
   (compListPicRentang). Tanpa pemisahan ini, halaman Performa versi harian
   akan memotong realisasi memakai compliment SEBULAN penuh. */
/* Berapa yang dipotong sebuah compliment dari realisasi PIC-nya.
   SUB TOTAL saja (permintaan user 5 Agustus 2026), bukan totalnya: tax dan
   service charge bukan omset siapa pun — keduanya titipan yang memang tidak
   pernah diakui sebagai pencapaian, jadi memotongnya berarti menghukum PIC
   untuk uang yang tak pernah jadi haknya.

   Catatan LAMA tidak punya rincian; nominal-nya tetap dipakai apa adanya
   supaya angka bulan-bulan yang sudah ditutup tidak berubah surut. */
function compPotong(c){ return c && c.subTotal!=null ? num(c.subTotal) : num(c&&c.nominal); }
/* Cocok kalau `emp` adalah PIC KASIR-nya ATAU PEMBERI-nya.
   Satu compliment sekarang menyebut dua orang, dan dua-duanya menanggung:
   kasir karena barang keluar lewat mejanya, marketing/event karena dialah yang
   memutuskan memberikannya. Keduanya dinilai di halaman Performa yang berbeda,
   jadi tidak ada satu angka pun yang terpotong dua kali di tempat yang sama.
   Sisi yang ber-PIC "Tamu" tidak menunjuk siapa pun, jadi tidak pernah cocok. */
function compCocok(emp, div, oid, pnama){
  if(!emp || div==='tamu') return false;
  if(emp.officeUserId && oid) return oid===emp.officeUserId;
  if(!pnama) return false;
  return String(pnama).trim().toLowerCase()===String(emp.name||'').trim().toLowerCase();
}
function compIsPicKasir(c, emp){ return compCocok(emp, c.picDiv, c.picOfficeId, c.picName); }
function compIsPemberi(c, emp){ return compCocok(emp, c.pemberiDiv, c.pemberiOfficeId, c.pemberiName); }
/* ---- APPROVAL SISI PEMBERI (7 Agustus 2026) ----
   Sisi PIC KASIR tetap memotong otomatis: barang benar-benar keluar lewat
   mejanya, tidak ada yang perlu diputuskan. Sisi PEMBERI (marketing/event)
   TIDAK lagi langsung memotong — sering kali compliment memang alat kerja
   marketing untuk menutup deal, dan memotongnya otomatis berarti menghukum
   orang atas biaya yang justru menghasilkan omset. Sekarang harus diputus
   dulu di halaman Performa Marketing/Event.

   Catatan LAMA (tanpa field ini) dibaca sebagai 'menunggu', jadi potongannya
   ikut lepas surut. Disengaja: memilih 'potong' sebagai default berarti
   menerapkan keputusan yang belum pernah diambil siapa pun, dan angka yang
   sudah telanjur memotong itulah yang dikeluhkan. Bulan lama bisa dirapikan
   dengan memutuskannya satu per satu di halaman Performa. */
function compStatusPemberi(c){
  const s=String((c&&c.pemberiStatus)||'menunggu');
  return (s==='potong'||s==='tidak')?s:'menunggu';
}
/* Compliment yang membebani `emp`. Sisi pemberi cuma ikut kalau sudah
   DIPUTUS potong. */
function compFilterPic(list, emp){
  if(!emp) return [];
  return list.filter(c=>
    compIsPicKasir(c, emp) ||
    (compIsPemberi(c, emp) && compStatusPemberi(c)==='potong'));
}
/* Semua compliment yang MENYEBUT emp sebagai pemberi, apa pun status
   putusannya. Dipakai kartu approval di Performa — yang sudah diputus pun
   tetap tampil supaya keputusannya bisa dibalik. */
function compListPemberi(list, emp){
  if(!emp) return [];
  return list.filter(c=>compIsPemberi(c, emp));
}
function putusCompliment(id, status){
  const c=compById(id); if(!c) return;
  c.pemberiStatus = status==='potong'?'potong':'tidak';
  c.putusOleh = CURRENT_USER?CURRENT_USER.name:'';
  c.putusAt = Date.now();
  save(); render();
}
function compListPic(monthKey, emp){ return compFilterPic(compsBulan(monthKey), emp); }
function compPic(monthKey, emp){
  return compListPic(monthKey, emp).reduce((s,c)=>s+compPotong(c),0);
}
/* Versi yang mengikuti saklar Harian/Bulanan. Dipakai halaman analitik. */
function compListPicRentang(emp){ return compFilterPic(compsRentang(), emp); }
function compPicRentang(emp){ return compListPicRentang(emp).reduce((s,c)=>s+compPotong(c),0); }
/* Kartu rincian compliment, dipakai bersama Performa Marketing/Event/Kasir.
   `judulPic` diisi saat menampilkan gabungan banyak PIC (segmen "Semua"),
   supaya ketahuan potongan itu milik siapa. */
function kartuCompliment(rows, pakaiKolomPic){
  const total=rows.reduce((s,c)=>s+compPotong(c),0);
  if(!rows.length) return `<div class="card"><h3>Rincian Compliment</h3><div class="empty" style="padding:18px 10px">Tidak ada compliment yang membebani pada periode ini.</div></div>`;
  const baris=[...rows].sort((a,b)=>a.date<b.date?-1:1).map(c=>`<tr>
      <td>${esc(c.date)}</td>
      ${pakaiKolomPic?`<td>${esc(c.picName||'—')}</td>`:''}
      <td><b>${esc(c.nama||'—')}</b></td>
      <!-- Kolom ini dulu "Alasan". Sejak input compliment dipecah jadi
           Sub Total / Tax / Service (5 Agustus 2026) alasannya tidak lagi
           diminta, jadi yang ditampilkan rinciannya. Catatan lama tetap
           menunjukkan alasannya — datanya masih ada, cuma tidak diisi lagi. -->
      <td class="muted" style="font-size:12px">${
        (c.subTotal!=null||c.tax!=null||c.service!=null)
          ? `sub ${fmtRp(num(c.subTotal))} + tax ${fmtRp(num(c.tax))} + svc ${fmtRp(num(c.service))}`
          : esc(c.alasan||'—')}</td>
      <td class="num mono">${fmtRp(compPotong(c))}</td>
    </tr>`).join('');
  return `<div class="card">
    <h3>Rincian Compliment</h3>
    <!-- Angkanya SUB TOTAL, bukan nilai penuh compliment-nya: itulah yang
         benar-benar dipotong (lihat compPotong). Menyebut nilai penuh di sini
         akan membuat kartu ini tidak pernah cocok dengan kotak Realisasi. -->
    <div class="card-sub">${rows.length} compliment, dipotong ${fmtRp(total)} dari Realisasi di atas — dihitung dari <b>Sub Total</b>, tax &amp; service charge tidak ikut.</div>
    <div class="tbl-wrap"><table>
      <thead><tr><th style="width:110px">Tanggal</th>${pakaiKolomPic?'<th>PIC</th>':''}<th>Compliment</th><th>Rincian</th><th class="num" style="width:150px">Dipotong</th></tr></thead>
      <tbody>${baris}</tbody>
      <tfoot><tr style="font-weight:800;border-top:2px solid var(--line)"><td colspan="${pakaiKolomPic?4:3}">TOTAL POTONGAN</td><td class="num mono">${fmtRp(total)}</td></tr></tfoot>
    </table></div>
  </div>`;
}

/* Kartu keputusan potong/tidak untuk compliment yang PEMBERI-nya PIC divisi
   ini. Ditaruh di halaman Performa, bukan di halaman Compliment: yang berhak
   memutuskan bukan kasir yang menginputnya, dan halaman Performa memang cuma
   terbuka untuk level penuh.

   Yang sudah diputus TETAP ditampilkan. Kartu yang cuma memajang antrean
   membuat keputusan yang keliru tidak bisa dibatalkan tanpa menghapus lalu
   menginput ulang catatannya — dan itu menghapus jejak siapa pencatat asalnya. */
function kartuApprovalCompliment(divi, list){
  const rentang=compsRentang();
  const rows=[];
  list.forEach(e=>compListPemberi(rentang, e).forEach(c=>{
    if(!rows.some(x=>x.c.id===c.id)) rows.push({c, emp:e});
  }));
  const labDiv=divi==='marketing'?'Marketing':'Event';
  if(!rows.length){
    return `<div class="card"><h3>🎁 Persetujuan Potongan Compliment</h3>
      <div class="empty" style="padding:18px 10px">Tidak ada compliment yang diberikan PIC ${esc(labDiv)} pada periode ini.</div></div>`;
  }
  rows.sort((a,b)=>a.c.date<b.c.date?-1:1);
  const menunggu=rows.filter(x=>compStatusPemberi(x.c)==='menunggu');
  const dipotong=rows.filter(x=>compStatusPemberi(x.c)==='potong');
  const nilaiTunggu=menunggu.reduce((s,x)=>s+compPotong(x.c),0);
  const nilaiPotong=dipotong.reduce((s,x)=>s+compPotong(x.c),0);
  const chip=st=>st==='potong'?'<span class="chip bad">Dipotong</span>'
              :st==='tidak'?'<span class="chip ok">Tidak dipotong</span>'
              :'<span class="chip">Menunggu</span>';
  const isi=rows.map(({c,emp})=>{
    const st=compStatusPemberi(c);
    const rinci=(c.subTotal!=null||c.tax!=null||c.service!=null)
      ? `sub ${fmtRp(num(c.subTotal))} + tax ${fmtRp(num(c.tax))} + svc ${fmtRp(num(c.service))}`
      : esc(c.alasan||'—');
    return `<tr>
      <td>${esc(c.date)}</td>
      <td><b>${esc(c.nama||'—')}</b><div class="muted" style="font-size:11px">${rinci}</div></td>
      <td>${esc(emp.name)}</td>
      <td class="num mono">${fmtRp(compPotong(c))}</td>
      <td>${chip(st)}${c.putusOleh?`<div class="muted" style="font-size:11px">${esc(c.putusOleh)}</div>`:''}</td>
    </tr>`;
  }).join('');
  return `<div class="card">
    <h3>🎁 Persetujuan Potongan Compliment</h3>
    <div class="card-sub">Compliment yang <b>diberikan</b> PIC ${esc(labDiv)} tidak memotong realisasinya sampai diputus. ${

    <div class="tbl-wrap"><table>

      <tbody>${isi}</tbody>
    </table></div>
    <!-- TOMBOL PUTUSAN SENGAJA TIDAK ADA DI FINANCE. Halaman ini menggambar
         data Kompas yang sama persis, jadi tombolnya BISA saja dipasang dan
         akan bekerja — justru itu masalahnya: keputusan potongan compliment
         diambil di Performa Kompas oleh orang yang memegang divisinya, dan
