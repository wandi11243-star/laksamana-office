<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#F7F6F4">
<title>Kompas Laksamana — Target &amp; Omset Tracker</title>
<link rel="icon" href="../assets/LaksamanaMudaLogo.jpeg">

<!-- Guard SSO: modul ini HANYA untuk superadmin (Howandi, Wandi, Admin).
     Dijaga di sini supaya halaman tidak sempat tergambar sedikit pun bagi
     yang tidak berhak. Penjaga sebenarnya tetap di sisi Office: `modules`
     dan `adminModules` dibuat server saat login, bukan diketik browser. -->
<script>
(function(){try{
  var s=JSON.parse(localStorage.getItem('lm_session')||'null');
  var hidup=s&&s.expiry&&Date.now()<s.expiry;
  var superadmin=hidup&&(s.adminModules||[]).indexOf('*')>-1;
  var punyaModul=hidup&&(s.modules||[]).some(function(m){return m==='*'||m==='kompas';});
  if(!(superadmin&&punyaModul))location.replace('../');
}catch(e){location.replace('../');}})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* TEMA TERANG — diselaraskan dengan Marketing & Radar (emas di atas krem/putih).
   NAMA variabel SENGAJA dipertahankan meski artinya kini terbalik: --ink dulu
   latar tergelap, sekarang permukaan putih; --cream dulu teks terang, sekarang
   teks gelap. Membalik nilainya di sini jauh lebih aman daripada mengganti
   ratusan pemakaian di seluruh berkas. Palet nilainya sama dengan Radar. */
:root{
  --ink:#FFFFFF; --ink2:#FFFFFF; --ink3:#F2F0EA; --line:rgba(60,55,45,.14);
  --gold:#A9791F; --gold2:#7A560F; --cream:#2A2620; --muted:#6B6456;
  --good:#12703F; --warn:#8A6412; --bad:#B93A22; --blue:#2367AE;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{background:linear-gradient(180deg,#F7F6F4 0%,#F2F0EA 100%); color:var(--cream);
  font-family:'Inter',system-ui,-apple-system,sans-serif; font-size:14px; min-height:100vh;}
h1,h2,.brand-name,.card-title,.kpi-val{font-family:'Plus Jakarta Sans',system-ui,sans-serif;letter-spacing:-.01em;}
h2{font-size:20px; color:var(--gold2);}
label{display:block; font-size:12px; color:var(--muted); margin:8px 0 4px; font-weight:500;}
input,select,textarea{background:var(--ink); border:1px solid var(--line); color:var(--cream);
  border-radius:8px; padding:8px 10px; font-size:14px; font-family:inherit; width:100%;}
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--gold);}
input[type=date],input[type=month],input[type=time]{color-scheme:light;}
.btn{border:none; border-radius:8px; padding:10px 18px; font-size:14px; font-weight:600;
  cursor:pointer; font-family:inherit; transition:filter .15s;}
.btn:hover{filter:brightness(1.15);}
.btn.gold{background:linear-gradient(135deg,#9A6E14,var(--gold2)); color:#fff;}
.btn.ghost{background:transparent; border:1px solid var(--line); color:var(--cream);}
.btn.sm{padding:4px 10px; font-size:12px;}
.btn.w100{width:100%; margin-top:16px;}
/* pemuat awal */
.boot{display:flex; align-items:center; justify-content:center; min-height:100vh; text-align:center; padding:20px;}
.boot-in{max-width:340px;}
.boot-ic{font-size:44px; color:var(--gold); margin-bottom:10px; display:block;}
.boot h1{font-family:'Plus Jakarta Sans',system-ui,sans-serif; font-size:20px; letter-spacing:1px; color:var(--gold2);}
.boot p{color:var(--muted); font-size:12.5px; margin-top:8px; line-height:1.6;}
.boot .btn{margin-top:16px;}
/* shell */
.topbar{display:flex; justify-content:space-between; align-items:center; padding:14px 22px;
  background:var(--ink2); border-bottom:1px solid var(--line); flex-wrap:wrap; gap:10px;}
/* .brand & .user-chip DIBUANG bersama topbar lama: identitas kini di kaki
   sidebar (.side-user), dan brand-nya di .side-brand. */
.brand-ic{font-size:28px; color:var(--gold);}
.brand-name{font-size:16px; letter-spacing:2px; color:var(--gold2);}
.brand-sub{font-size:11px; color:var(--muted);}
.topbar-right{display:flex; gap:10px; align-items:center;}
.sync{font-size:11px; color:var(--muted);}
.sync b{color:var(--good);}
.sync.err b{color:var(--bad);}
/* ---------- RANGKA SIDEBAR (disamakan dgn Reservasi/Marketing/Radar) ---------- */
#app{display:flex; min-height:100vh; align-items:stretch;}
.sidebar{width:236px; flex:none; background:var(--ink2); border-right:1px solid var(--line);
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh; z-index:40;}
.side-brand{display:flex; align-items:center; gap:11px; padding:18px 18px 14px; border-bottom:1px solid var(--line);}
.side-nav{flex:1; overflow-y:auto; padding:10px 12px; display:flex; flex-direction:column; gap:3px;}
.side-nav::-webkit-scrollbar{width:6px}
.side-nav::-webkit-scrollbar-thumb{background:var(--line); border-radius:6px}
.side-user{margin-top:auto; border-top:1px solid var(--line); padding:12px; display:flex; align-items:center; gap:10px;}
.side-user .su-avatar{width:36px; height:36px; border-radius:10px; flex:none; display:flex; align-items:center;
  justify-content:center; font-weight:700; font-size:13px; color:#fff;
  background:linear-gradient(140deg,var(--gold),var(--gold2));}
.side-user .su-info{line-height:1.25; flex:1; min-width:0;}
.side-user .su-info b{display:block; font-size:13.5px; color:var(--cream); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.side-user .su-info span{display:block; font-size:11px; color:var(--muted);}
.logout-x{background:transparent; border:1px solid var(--line); color:var(--muted); width:32px; height:32px;
  border-radius:9px; display:inline-flex; align-items:center; justify-content:center; flex:none; cursor:pointer; transition:.16s;}
.logout-x:hover{background:rgba(185,58,34,.08); color:var(--bad); border-color:var(--bad);}
.logout-x svg{width:16px; height:16px;}
.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.tb-title{font-family:'Plus Jakarta Sans',system-ui,sans-serif; font-size:19px; color:var(--gold2);}
/* .nav lama (mendatar) tidak dipakai lagi; .side-nav yang berlaku. */
.nav{display:none;}
/* Tombol menu jadi baris penuh di sidebar, bukan pil mendatar. */
.nav-btn{width:100%; background:transparent; border:1px solid transparent; color:var(--muted);
  padding:10px 12px; border-radius:10px; cursor:pointer; font-size:13.5px; font-weight:500;
  font-family:inherit; display:flex; align-items:center; gap:10px; text-align:left; white-space:nowrap;}
.nav-btn:hover{color:var(--cream); background:var(--ink3);}
.nav-btn.active{background:var(--gold-glow,rgba(169,121,31,.12)); color:var(--gold2); font-weight:600;}
.nav-ic{margin-right:6px;}
.view{padding:22px; max-width:1180px; margin:0 auto;}
.foot{text-align:center; color:var(--muted); font-size:11px; padding:20px;}
.view-head{display:flex; justify-content:space-between; align-items:flex-end; gap:16px; margin-bottom:16px; flex-wrap:wrap;}
.view-head .muted{font-family:'Inter',sans-serif; font-size:12px; font-weight:400;}
.pick-row{display:flex; align-items:center; gap:8px;}
.pick-row label{margin:0;}
.pick-row input{width:auto;}
.pick-inline{display:flex; align-items:center; gap:8px; margin:12px 0;}
.pick-inline label{margin:0;}
.pick-inline input{width:auto;}
/* cards */
.card{background:var(--ink2); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:16px;}
.card-title{font-size:15px; color:var(--gold2); margin-bottom:12px;}
.card-title .muted{font-family:'Inter',sans-serif; font-size:11px; font-weight:400;}
.two-col{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
@media(max-width:820px){.two-col{grid-template-columns:1fr;}}
.notice{background:rgba(232,182,76,.1); border:1px solid rgba(232,182,76,.4); border-radius:10px; padding:10px 14px; margin-bottom:14px; font-size:13px;}
.notice.ok{background:rgba(62,201,138,.08); border-color:rgba(62,201,138,.35);}
.muted{color:var(--muted);}
.small-p{font-size:12px; line-height:1.6;}
.ok-txt{color:var(--good);} .warn-txt{color:var(--warn);} .gold-txt{color:var(--gold2);}
/* KPI */
.kpi-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px;}
.kpi-grid.small{margin-top:12px; grid-template-columns:repeat(auto-fill,minmax(170px,1fr));}
.kpi-grid.four{grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); margin-bottom:16px;}
.kpi{background:linear-gradient(160deg,var(--ink3) 0%,var(--ink) 100%); border:1px solid var(--line); border-radius:12px; padding:12px; position:relative; overflow:hidden;}
.kpi::before{content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,var(--gold),transparent);}
.kpi-label{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px;}
.kpi-val{font-size:20px; color:var(--cream); margin:6px 0 4px;}
.kpi-of{font-size:13px; color:var(--muted);}
.kpi-tgt{font-size:11px; color:var(--muted); margin-bottom:6px;}
.kpi-formula{font-size:10px; color:var(--muted); margin-top:4px;}
.kpi.small .kpi-val{font-size:16px;}
/* progress */
.pbar{height:7px; background:var(--ink3); border-radius:4px; overflow:hidden; display:flex; margin-top:6px;}
.pfill{height:100%; border-radius:4px;}
.pfill.good{background:linear-gradient(90deg,#2a9d6f,var(--good));}
.pfill.warn{background:linear-gradient(90deg,#b98a2e,var(--warn));}
.pfill.bad{background:linear-gradient(90deg,#b04a40,var(--bad));}
.pfill.na{background:var(--line);}
.pover{height:100%; background:repeating-linear-gradient(45deg,var(--gold),var(--gold) 3px,var(--gold2) 3px,var(--gold2) 6px);}
/* badges */
.badge{display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:600;}
.badge.good{background:rgba(62,201,138,.15); color:var(--good);}
.badge.warn{background:rgba(232,182,76,.15); color:var(--warn);}
.badge.bad{background:rgba(232,106,94,.15); color:var(--bad);}
.badge.na{background:var(--ink3); color:var(--muted);}
.badge.gold-b{background:rgba(201,162,77,.2); color:var(--gold2);}
/* tables */
.tbl{width:100%; border-collapse:collapse; font-size:13px;}
.tbl th{color:var(--muted); text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.5px;
  padding:7px 8px; border-bottom:1px solid var(--line);}
.tbl td{padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:middle;}
.tbl tfoot td{border-top:2px solid var(--line); border-bottom:none;}
.tbl .r, .tbl th.r{text-align:right;}
.tbl.compact td,.tbl.compact th{padding:4px 6px; font-size:12px;}
.tbl tr.wknd td{background:rgba(201,162,77,.05);}
.tbl tr.empty-row td{padding:3px 8px; font-size:11px;}
.tbl .sub{font-size:10px; color:var(--muted);}
.tbl-scroll{overflow-x:auto;}
.tbl input{padding:6px 8px; font-size:13px;}
/* forms */
.form-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:6px 14px;}
.ev-form{margin-top:12px; padding-top:12px; border-top:1px dashed var(--line);}
.ev-add{display:flex; align-items:flex-end;}
.save-row{display:flex; gap:12px; align-items:center; margin:16px 0; flex-wrap:wrap;}
.recon-live{font-size:12px; color:var(--muted);}
.recon{font-size:13px;}
.recon-ok{border-color:rgba(62,201,138,.4);}
.recon-warn{border-color:rgba(232,106,94,.5); background:rgba(232,106,94,.06);}
.formula-note{font-size:11px; color:var(--muted); margin-top:10px; line-height:1.6;}
.chk{display:inline-flex; align-items:center; gap:6px; margin:0; font-size:13px; color:var(--cream);}
.chk input{width:auto;}
/* milestones */
.mile{margin-bottom:12px;}
.mile-head{display:flex; justify-content:space-between; font-size:13px; margin-bottom:2px;}
.mile-head span{color:var(--muted); font-size:12px;}
.mile-big{margin-bottom:4px;}
.mile-now{font-family:'Plus Jakarta Sans',system-ui,sans-serif; font-size:24px; color:var(--gold2);}
.mile-to{color:var(--muted); font-size:13px;}
.stones{display:flex; justify-content:space-between; margin:14px 0 8px;}
.stone{text-align:center; flex:1;}
.stone-dot{width:26px; height:26px; border-radius:50%; background:var(--ink3); border:2px solid var(--line);
  margin:0 auto 4px; line-height:22px; font-size:12px; color:var(--good);}
.stone.hit .stone-dot{background:rgba(62,201,138,.15); border-color:var(--good);}
.stone-lbl{font-size:11px; color:var(--muted); line-height:1.4;}
.stone-lbl span{font-size:9px;}
.mk-stats{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-top:12px; font-size:13px;}
/* report */
.chip-row{display:flex; gap:8px; flex-wrap:wrap;}
.chip{background:var(--ink); border:1px solid var(--line); color:var(--muted); border-radius:20px;
  padding:6px 14px; cursor:pointer; font-size:13px; font-family:inherit;}
.chip.active{background:rgba(201,162,77,.15); border-color:var(--gold); color:var(--gold2);}
.wa-preview{background:#FBFAF7; border:1px solid var(--line); border-radius:12px; padding:16px;
  white-space:pre-wrap; font-family:'Inter',sans-serif; font-size:13px; line-height:1.65; max-height:480px; overflow-y:auto;}
canvas{width:100%; display:block;}
/* Di layar sempit sidebar turun jadi bilah menu mendatar di ATAS konten —
   sidebar 236px akan memakan hampir separuh layar HP. Blok identitas &
   tombol Keluar ikut pindah ke bilah itu, jadi Keluar tetap terjangkau. */
@media(max-width:820px){
  #app{flex-direction:column;}
  .sidebar{width:100%; height:auto; position:static; flex-direction:row; align-items:center;
    border-right:none; border-bottom:1px solid var(--line); gap:8px; padding-right:10px; overflow-x:auto;}
  .side-brand{border-bottom:none; padding:10px 12px; flex:none;}
  .side-nav{flex-direction:row; overflow-x:auto; padding:8px 4px; gap:4px;}
  .nav-btn{width:auto; white-space:nowrap; padding:8px 12px;}
  .side-user{margin-top:0; border-top:none; padding:8px 4px; flex:none;}
  .side-user .su-info{display:none;}
}
@media(max-width:640px){
  .view{padding:12px;}
  .mk-stats{grid-template-columns:1fr;}
}
</style>

<body>
<div id="app"><div class="boot"><div class="boot-in"><span class="boot-ic">&#9784;</span>
<h1>KOMPAS LAKSAMANA</h1><p>Memuat data dari server&hellip;</p></div></div></div>
<script>
/* ============================================================
   KOMPAS LAKSAMANA — Target & Omset Tracking System
   PT Laksamana Indonesia Nusantara · Laksamana Muda Coffee & Live Space

   Perbedaan dari versi mandiri:
   - Identitas & hak akses dari Office (lm_session), bukan login sendiri.
     Modul ini khusus superadmin, jadi tidak ada lagi tabel user/PIN di sini.
   - Data di MySQL lewat kompas-api-mysql, bukan localStorage. localStorage
     hanya dipakai sebagai salinan sementara supaya halaman tetap tampil
     saat jaringan putus.
   ============================================================ */
(function(){
'use strict';

var API_URL = '../kompas-api-mysql/api.php';
var CACHE_KEY = 'lm_kompas_cache_v1';
var SESSION_KEY = 'lm_session';
var DAYS_ID = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
var MONTHS_ID = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
var METRIC_DEFS = [
  {key:'omsetTotal', label:'Omset Total', unit:'idr', split:true},
  {key:'omsetFood',  label:'Omset Makanan', unit:'idr', split:true},
  {key:'omsetBev',   label:'Omset Minuman', unit:'idr', split:true},
  {key:'traffic',    label:'Traffic (Pengunjung)', unit:'num', split:true},
  {key:'pax',        label:'Jumlah Pax', unit:'num', split:true},
  {key:'transaksi',  label:'Jumlah Transaksi', unit:'num', split:true},
  {key:'review',     label:'Google Review Baru', unit:'num', split:false}
];

function uid(prefix){ return prefix + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function defaultState(){
  return {
    settings: {
      venueName: 'Laksamana Muda Coffee & Live Space',
      dayWeights: {'0':1.2,'1':0.8,'2':0.8,'3':0.9,'4':1.0,'5':1.3,'6':1.5},
      bonusTiers: [ {minPct:100,bonusPct:1.5}, {minPct:110,bonusPct:2.5}, {minPct:120,bonusPct:4.0} ],
      eventTypes: ['Live Music','Corporate','Private / Birthday','Community','Wedding / Engagement','Nobar / Screening','Konser','Lainnya']
    },
    cashiers: [ {id:'c1',name:'Kasir 1',active:true}, {id:'c2',name:'Kasir 2',active:true}, {id:'c3',name:'Kasir 3',active:true} ],
    pics: [ {id:'p1',name:'Devani',active:true}, {id:'p2',name:'Aurel',active:true} ],
    targets: {}, daily: {}, log: []
  };
}

/* ---------- state & bentuknya ---------- */
var S = null;
function normalize(s){
  var d = defaultState();
  s = s || {};
  if(!s.settings || typeof s.settings!=='object' || Array.isArray(s.settings)) s.settings = {};
  for(var k in d.settings) if(s.settings[k]===undefined || s.settings[k]===null) s.settings[k] = d.settings[k];
  // Objek kosong bisa datang sebagai [] dari JSON; kalau dibiarkan array,
  // menempelkan properti ke dalamnya akan hilang saat disimpan.
  if(!s.targets || typeof s.targets!=='object' || Array.isArray(s.targets)) s.targets = {};
  if(!s.daily   || typeof s.daily!=='object'   || Array.isArray(s.daily))   s.daily = {};
  if(!Array.isArray(s.cashiers)) s.cashiers = d.cashiers;
  if(!Array.isArray(s.pics))     s.pics = d.pics;
  if(!Array.isArray(s.log))      s.log = [];
  return s;
}

/* ---------- lapisan API ---------- */
var SYNC = 'idle', SAVE_TIMER = null, SAVING = false, DIRTY = false;
function setSync(st, msg){
  SYNC = st;
  var el = document.getElementById('syncBox');
  if(!el) return;
  el.className = 'sync' + (st==='err' ? ' err' : '');
  el.innerHTML = msg || (st==='ok' ? 'Data: <b>tersimpan</b>' : st==='saving' ? 'Menyimpan…' : '');
}
function fetchTimeout(url, opts, ms){
  var ctrl = new AbortController();
  var t = setTimeout(function(){ ctrl.abort(); }, ms||25000);
  opts = opts || {}; opts.signal = ctrl.signal;
  return fetch(url, opts).then(function(r){ clearTimeout(t); return r; },
                               function(e){ clearTimeout(t); throw e; });
}
function apiGet(){
  return fetchTimeout(API_URL+'?action=getAll&t='+Date.now(), {method:'GET',redirect:'follow'})
    .then(function(r){ return r.json(); })
    .then(function(j){ if(!j.ok) throw new Error(j.error||'server error'); return j.data; });
}
function apiSave(state){
  return fetchTimeout(API_URL, {method:'POST', redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({action:'saveAll', data:state})}, 40000)
    .then(function(r){ return r.json(); })
    .then(function(j){ if(!j.ok) throw new Error(j.error||'server error'); return j.data; });
}
/* Simpan ditunda sebentar lalu dikirim sekali — mengetik di form input
   tidak boleh memicu satu request per ketukan. */
function save(){
  DIRTY = true;
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify(S)); }catch(e){}
  setSync('saving');
  clearTimeout(SAVE_TIMER);
  SAVE_TIMER = setTimeout(kirim, 1200);
}
function kirim(){
  if(SAVING){ SAVE_TIMER = setTimeout(kirim, 800); return; }
  SAVING = true; DIRTY = false;
  apiSave(S).then(function(){
    SAVING = false;
    setSync(DIRTY ? 'saving' : 'ok');
    if(DIRTY) kirim();
  }, function(err){
    SAVING = false;
    setSync('err', 'Gagal simpan: <b>'+escapeHtml(err.message)+'</b> — data aman di perangkat, coba lagi.');
    setTimeout(function(){ if(DIRTY!==false) kirim(); }, 8000);
  });
}
function logAction(action, detail){
  S.log.unshift({at:new Date().toISOString(), by:(CURRENT_USER?CURRENT_USER.name:'?'), action:action, detail:detail||''});
  if(S.log.length>300) S.log.length = 300;
}

/* ---------- format ---------- */
function fmtIDR(n){
  n = Math.round(Number(n)||0);
  var neg = n<0; n = Math.abs(n);
  var s = String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  return (neg?'-':'')+'Rp '+s;
}
function fmtNum(n){ n = Math.round(Number(n)||0); return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'.'); }
function fmtMetric(v, unit){ return unit==='idr' ? fmtIDR(v) : fmtNum(v); }
function fmtPct(x){ if(!isFinite(x)) return '—'; return (Math.round(x*10)/10).toFixed(1).replace('.',',')+'%'; }
function parseNum(v){
  if(typeof v === 'number') return v;
  if(!v) return 0;
  return Number(String(v).replace(/[^\d\-]/g,''))||0;
}
function todayStr(){
  var d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function monthKeyOf(dateStr){ return dateStr.slice(0,7); }
function dateLabel(dateStr){
  var p = dateStr.split('-');
  var d = new Date(Number(p[0]), Number(p[1])-1, Number(p[2]));
  return DAYS_ID[d.getDay()]+', '+Number(p[2])+' '+MONTHS_ID[Number(p[1])-1]+' '+p[0];
}
function monthLabel(mk){ var p = mk.split('-'); return MONTHS_ID[Number(p[1])-1]+' '+p[0]; }
function daysInMonth(mk){ var p = mk.split('-'); return new Date(Number(p[0]), Number(p[1]), 0).getDate(); }
function dowOf(dateStr){ var p = dateStr.split('-'); return new Date(Number(p[0]), Number(p[1])-1, Number(p[2])).getDay(); }
function dateStrOf(mk, day){ return mk+'-'+String(day).padStart(2,'0'); }
function escapeHtml(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ============================================================
   MESIN HITUNG — target bulanan dibagi ke harian pakai bobot hari.
   dailyTarget(d, metric) = target bulanan × bobot(d) ÷ Σ bobot sebulan
   Override per tanggal menang atas pembagian otomatis.
   ============================================================ */
function getMonthTarget(mk){ return S.targets[mk] || null; }
function ensureMonthTarget(mk){
  if(!S.targets[mk]){
    S.targets[mk] = {omsetTotal:0,omsetFood:0,omsetBev:0,traffic:0,pax:0,transaksi:0,review:0,
      cashier:{}, marketing:{}, eventCount:0, eventOmset:0, overrides:{}};
  }
  var t = S.targets[mk];
  if(!t.cashier   || typeof t.cashier!=='object'   || Array.isArray(t.cashier))   t.cashier = {};
  if(!t.marketing || typeof t.marketing!=='object' || Array.isArray(t.marketing)) t.marketing = {};
  if(!t.overrides || typeof t.overrides!=='object' || Array.isArray(t.overrides)) t.overrides = {};
  return t;
}
function weightOf(dateStr){
  var w = S.settings.dayWeights[String(dowOf(dateStr))];
  return (typeof w === 'number' && w>0) ? w : 1;
}
function sumWeights(mk){
  var n = daysInMonth(mk), total = 0;
  for(var d=1; d<=n; d++) total += weightOf(dateStrOf(mk,d));
  return total;
}
function dailyTarget(dateStr, key){
  var mk = monthKeyOf(dateStr), t = getMonthTarget(mk);
  if(!t) return 0;
  var ov = t.overrides && t.overrides[dateStr];
  if(ov && typeof ov[key] === 'number') return ov[key];
  var monthly = Number(t[key])||0, def = null;
  for(var i=0;i<METRIC_DEFS.length;i++){ if(METRIC_DEFS[i].key===key){ def=METRIC_DEFS[i]; break; } }
  if(def && !def.split) return monthly / daysInMonth(mk);
  var sw = sumWeights(mk);
  return sw>0 ? monthly * weightOf(dateStr) / sw : 0;
}
function cashierDailyTarget(dateStr, cashierId){
  var mk = monthKeyOf(dateStr), t = getMonthTarget(mk);
  if(!t || !t.cashier) return 0;
  var monthly = Number(t.cashier[cashierId])||0, sw = sumWeights(mk);
  return sw>0 ? monthly * weightOf(dateStr) / sw : 0;
}

/* ---------- catatan harian ---------- */
function getEntry(dateStr){ return S.daily[dateStr] || null; }
function blankEntry(){
  return {traffic:0, pax:0, transaksi:0, omsetFood:0, omsetBev:0, omsetLain:0,
    review:0, reviewTotal:0, cashierSales:{}, marketingSales:{}, events:[], notes:'',
    updatedAt:null, updatedBy:null, updatedAtMs:0};
}
function entryTotalOmset(e){
  if(!e) return 0;
  return (Number(e.omsetFood)||0)+(Number(e.omsetBev)||0)+(Number(e.omsetLain)||0);
}
function entryMetric(e, key){
  if(!e) return 0;
  if(key==='omsetTotal') return entryTotalOmset(e);
  return Number(e[key])||0;
}
function sumObj(o){ var t=0; if(!o) return 0; for(var k in o){ if(o.hasOwnProperty(k)) t += Number(o[k])||0; } return t; }
function entryEventOmset(e){
  var t=0; if(!e||!e.events) return 0;
  for(var i=0;i<e.events.length;i++) t += Number(e.events[i].omset)||0;
  return t;
}
function entryRecon(e){
  var attributed = sumObj(e.cashierSales) + sumObj(e.marketingSales) + entryEventOmset(e);
  return { attributed: attributed, total: entryTotalOmset(e), diff: entryTotalOmset(e) - attributed };
}

/* ---------- agregat bulanan ---------- */
function monthDates(mk){
  var n = daysInMonth(mk), arr = [];
  for(var d=1; d<=n; d++) arr.push(dateStrOf(mk,d));
  return arr;
}
function mtdActual(mk, key, uptoDate){
  var t=0, dates=monthDates(mk);
  for(var i=0;i<dates.length;i++){
    if(uptoDate && dates[i]>uptoDate) break;
    var e = getEntry(dates[i]); if(e) t += entryMetric(e,key);
  }
  return t;
}
function mtdCashier(mk, cashierId, uptoDate){
  var t=0, dates=monthDates(mk);
  for(var i=0;i<dates.length;i++){
    if(uptoDate && dates[i]>uptoDate) break;
    var e = getEntry(dates[i]);
    if(e && e.cashierSales) t += Number(e.cashierSales[cashierId])||0;
  }
  return t;
}
function mtdMarketing(mk, picId, uptoDate){
  var t=0, dates=monthDates(mk);
  for(var i=0;i<dates.length;i++){
    if(uptoDate && dates[i]>uptoDate) break;
    var e = getEntry(dates[i]);
    if(e && e.marketingSales) t += Number(e.marketingSales[picId])||0;
  }
  return t;
}
function monthEvents(mk, uptoDate){
  var arr=[], dates=monthDates(mk);
  for(var i=0;i<dates.length;i++){
    if(uptoDate && dates[i]>uptoDate) break;
    var e = getEntry(dates[i]);
    if(e && e.events) for(var j=0;j<e.events.length;j++){
      var ev = e.events[j];
      arr.push({date:dates[i], name:ev.name, type:ev.type, timeStart:ev.timeStart, timeEnd:ev.timeEnd,
                pic:ev.pic, omset:Number(ev.omset)||0, pax:Number(ev.pax)||0});
    }
  }
  return arr;
}
function daysWithData(mk, uptoDate){
  var c=0, dates=monthDates(mk);
  for(var i=0;i<dates.length;i++){
    if(uptoDate && dates[i]>uptoDate) break;
    if(getEntry(dates[i])) c++;
  }
  return c;
}
function lastDataDate(mk){
  var dates=monthDates(mk), last=null;
  for(var i=0;i<dates.length;i++){ if(getEntry(dates[i])) last=dates[i]; }
  return last;
}
function projectMonth(mk, key, uptoDate){
  var actual = mtdActual(mk, key, uptoDate), elapsedW = 0, dates = monthDates(mk);
  for(var i=0;i<dates.length;i++){
    if(uptoDate && dates[i]>uptoDate) break;
    if(getEntry(dates[i])) elapsedW += weightOf(dates[i]);
  }
  if(elapsedW<=0) return null;
  return actual / elapsedW * sumWeights(mk);
}
function bonusFor(actual, target){
  if(!target || target<=0) return {pct:0, bonus:0, tier:null, ach:null};
  var ach = actual/target*100;
  var tiers = S.settings.bonusTiers.slice().sort(function(a,b){return a.minPct-b.minPct;});
  var hit = null;
  for(var i=0;i<tiers.length;i++){ if(ach >= tiers[i].minPct) hit = tiers[i]; }
  if(!hit) return {pct:0, bonus:0, tier:null, ach:ach};
  return {pct:hit.bonusPct, bonus:actual*hit.bonusPct/100, tier:hit, ach:ach};
}
function achClass(pct){
  if(pct==null || !isFinite(pct)) return 'na';
  if(pct>=100) return 'good';
  if(pct>=80) return 'warn';
  return 'bad';
}
function progressBar(actual, target){
  var pct = (target>0)? Math.min(actual/target*100,130) : 0;
  var cls = achClass(target>0? actual/target*100 : null);
  return '<div class="pbar"><div class="pfill '+cls+'" style="width:'+Math.min(pct,100)+'%"></div>'+
    (pct>100?'<div class="pover" style="width:'+Math.min(pct-100,30)+'%"></div>':'')+'</div>';
}

  try{
    var s = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
    if(!s || !s.expiry || Date.now() >= s.expiry) return null;
    if((s.adminModules||[]).indexOf('*') < 0) return null;

    var m = s.modules || [];
    if(m.indexOf('*') < 0 && m.indexOf('kompas') < 0) return null;

function drawTrend(canvasId, mk){
  var cv = document.getElementById(canvasId);
  if(!cv || !cv.getContext) return;
  var ctx = cv.getContext('2d'); if(!ctx) return;
  var W = cv.width = cv.parentNode ? Math.max(cv.parentNode.clientWidth-32, 320) : 640;
  var H = cv.height = 180;
  var dates = monthDates(mk);
  var vals = dates.map(function(ds){ return entryMetric(getEntry(ds),'omsetTotal'); });
  var tgts = dates.map(function(ds){ return dailyTarget(ds,'omsetTotal'); });
  var maxV = Math.max(1, Math.max.apply(null, vals.concat(tgts)));
  var pad = 8, bw = (W-pad*2)/dates.length;
  ctx.clearRect(0,0,W,H);
  for(var i=0;i<dates.length;i++){
    var h = vals[i]/maxV*(H-30), dow = dowOf(dates[i]);
    ctx.fillStyle = (dow===0||dow===6) ? 'rgba(169,121,31,0.85)' : 'rgba(35,103,174,0.75)';
    if(vals[i]>0) ctx.fillRect(pad+i*bw+1, H-20-h, Math.max(bw-2,1), h);
    if(i%5===0 || i===dates.length-1){
      ctx.fillStyle = 'rgba(107,100,86,0.75)'; ctx.font = '9px Inter, sans-serif';
      ctx.fillText(String(i+1), pad+i*bw, H-6);
    }
  }
  ctx.strokeStyle = '#A9791F'; ctx.lineWidth = 1.5; ctx.setLineDash([4,3]); ctx.beginPath();
  for(var j=0;j<dates.length;j++){
    var y = H-20-(tgts[j]/maxV*(H-30)), x = pad+j*bw+bw/2;
    if(j===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.stroke(); ctx.setLineDash([]);
}

function readEntryForm(){
  var e = blankEntry();
  e.omsetFood = parseNum(document.getElementById('inFood').value);
  e.omsetBev  = parseNum(document.getElementById('inBev').value);
  e.omsetLain = parseNum(document.getElementById('inLain').value);
  e.traffic   = parseNum(document.getElementById('inTraffic').value);
  e.pax       = parseNum(document.getElementById('inPax').value);
  e.transaksi = parseNum(document.getElementById('inTrx').value);
  e.review    = parseNum(document.getElementById('inRev').value);
  e.reviewTotal = parseNum(document.getElementById('inRevTot').value);
  S.cashiers.forEach(function(c){ var f = document.getElementById('cash_'+c.id); if(f) e.cashierSales[c.id] = parseNum(f.value); });
  S.pics.forEach(function(p){ var f = document.getElementById('pic_'+p.id); if(f) e.marketingSales[p.id] = parseNum(f.value); });
  e.events = DRAFT_EVENTS.slice();
  e.notes = document.getElementById('inNotes').value;
  return e;
}
/* Menambah/menghapus event menggambar ulang form, jadi isian yang sudah
   diketik harus ditahan dulu supaya tidak hilang. Tulisan sementara ke
   S.daily di bawah SELALU dikembalikan setelah digambar — tanpa itu, data
   akan terlihat "ada" padahal belum pernah disimpan ke server. */
function simpanDraftLaluGambarUlang(){
  var el = document.getElementById('view');
  var tersimpan = getEntry(SEL_DATE);
  var draft = readEntryForm();
  var adaSebelumnya = !!tersimpan;
  S.daily[SEL_DATE] = draft;
  if(tersimpan){ draft.updatedAt = tersimpan.updatedAt; draft.updatedBy = tersimpan.updatedBy; }
  renderInput(el);
  if(!adaSebelumnya) delete S.daily[SEL_DATE]; else S.daily[SEL_DATE] = tersimpan;
}
function updateReconLive(){
  var box = document.getElementById('reconLive'); if(!box) return;
  var rc = entryRecon(readEntryForm());
  var ok = Math.abs(rc.diff) <= Math.max(0.01*rc.total, 50000);
  box.innerHTML = 'Atribusi (kasir+marketing+event): <b>'+fmtIDR(rc.attributed)+'</b> vs total: <b>'+fmtIDR(rc.total)+'</b> &middot; selisih '+
    '<b class="'+(ok?'ok-txt':'warn-txt')+'">'+fmtIDR(rc.diff)+'</b>';
}
function saveEntry(){
  var e = readEntryForm();
  e.updatedAt = new Date().toISOString();
  e.updatedBy = CURRENT_USER ? CURRENT_USER.name : '?';
  e.updatedAtMs = Date.now();          // dipakai server sebagai penjaga tabrakan
  S.daily[SEL_DATE] = e;
  logAction('input_harian', SEL_DATE+' · omset total '+fmtIDR(entryTotalOmset(e)));
  save();
  DRAFT_EVENTS = null;
  alert('Data '+dateLabel(SEL_DATE)+' tersimpan.');
  VIEW = 'dashboard'; renderApp();
}

      '<div><label>Jumlah Event / bulan</label>'+numInput('tg_eventCount', tv.eventCount||0)+'</div>'+
      '<div><label>Omset Event / bulan</label>'+moneyInput('tg_eventOmset', tv.eventOmset||0)+'</div></div>'+
      '<div class="formula-note">Target harian = target bulanan &times; bobot hari &divide; &Sigma; bobot bulan ini (&Sigma; '+monthLabel(mk)+' = '+(Math.round(sumWeights(mk)*100)/100)+'). Atur bobot di Settings.</div></div>'+
    '<div class="two-col">'+
      '<div class="card"><div class="card-title">Target per Cashier / bulan</div><table class="tbl"><tbody>'+(cashRows||'<tr><td class="muted">Tambah cashier di Settings</td></tr>')+'</tbody></table><div id="cashSumNote" class="formula-note"></div></div>'+

    '<div class="save-row"><button class="btn gold" id="btnSaveTarget">Simpan Target '+monthLabel(mk)+'</button>'+

    '<div class="card"><div class="card-title">Kalender Target Harian (Omset Total)</div>'+
      '<div class="tbl-scroll"><table class="tbl compact"><thead><tr><th>Tgl</th><th class="r">Target</th><th class="r">Aktual</th><th>Capaian</th><th></th></tr></thead><tbody>'+calRows+'</tbody></table></div></div>';

  bindMoneyFormat(el);
  document.getElementById('tgMonth').onchange = function(){ SEL_MONTH = this.value || monthKeyOf(todayStr()); renderView(); };
  document.getElementById('btnSaveTarget').onclick = function(){ saveTargets(mk); };
  document.getElementById('btnCopyPrev').onclick = function(){ copyPrevTargets(mk); };
  var ovs = el.querySelectorAll('[data-ovr]');
  for(var i=0;i<ovs.length;i++){
    ovs[i].onclick = function(){
      var ds = this.getAttribute('data-ovr'), cur = dailyTarget(ds,'omsetTotal');
      var v = prompt('Override target omset total '+dateLabel(ds)+' (kosongkan untuk hapus override)', String(Math.round(cur)));
      if(v===null) return;
      var tt = ensureMonthTarget(mk);
      if(v.trim()===''){ if(tt.overrides[ds]) delete tt.overrides[ds].omsetTotal; }
      else { tt.overrides[ds] = tt.overrides[ds]||{}; tt.overrides[ds].omsetTotal = parseNum(v); }
      tt.updatedAtMs = Date.now();
      logAction('override_target', ds); save(); renderView();
    };
  }
  var noteEl = document.getElementById('cashSumNote');
  if(noteEl && t){
    var sumC = 0; for(var cid in t.cashier){ sumC += Number(t.cashier[cid])||0; }
    var sumM = 0; for(var pid in t.marketing){ sumM += Number(t.marketing[pid])||0; }
    var ops = (Number(t.omsetTotal)||0) - sumM - (Number(t.eventOmset)||0);
    noteEl.innerHTML = '&Sigma; target cashier = <b>'+fmtIDR(sumC)+'</b> &middot; porsi ops (total &minus; marketing &minus; event) = <b>'+fmtIDR(ops)+'</b>'+

  }
}
function saveTargets(mk){
  var t = ensureMonthTarget(mk);
  METRIC_DEFS.forEach(function(m){ t[m.key] = parseNum(document.getElementById('tg_'+m.key).value); });
  t.eventCount = parseNum(document.getElementById('tg_eventCount').value);
  t.eventOmset = parseNum(document.getElementById('tg_eventOmset').value);
  S.cashiers.forEach(function(c){ var f = document.getElementById('tgc_'+c.id); if(f) t.cashier[c.id] = parseNum(f.value); });
  S.pics.forEach(function(p){ var f = document.getElementById('tgp_'+p.id); if(f) t.marketing[p.id] = parseNum(f.value); });
  t.updatedAtMs = Date.now();
  logAction('set_target', mk+' · omset total '+fmtIDR(t.omsetTotal));
  save(); alert('Target '+monthLabel(mk)+' tersimpan.'); renderView();
}
function copyPrevTargets(mk){
  var p = mk.split('-'), y = Number(p[0]), m = Number(p[1])-1;
  if(m===0){ y--; m=12; }
  var prev = y+'-'+String(m).padStart(2,'0'), pt = getMonthTarget(prev);
  if(!pt){ alert('Bulan '+monthLabel(prev)+' belum punya target.'); return; }
  var copy = JSON.parse(JSON.stringify(pt));
  copy.overrides = {}; copy.updatedAtMs = Date.now();
  S.targets[mk] = copy;
  logAction('copy_target', prev+' -> '+mk);
  save(); renderView();
}

function renderCashier(el){
  var mk = SEL_MONTH, t = getMonthTarget(mk), last = lastDataDate(mk);
  var d = (monthKeyOf(SEL_DATE)===mk) ? SEL_DATE : (last || dateStrOf(mk,1));

      for(var i=0;i<dates.length;i++){ if(dates[i]>last) break; if(getEntry(dates[i])) elapsedW += weightOf(dates[i]); }
      if(elapsedW>0) proj = mtdCashier(mk,c.id,last)/elapsedW*sumWeights(mk);
    }
    var b = bonusFor(mtdAct, tgt);
    var te = getEntry(d), todayAct = (te && te.cashierSales) ? (Number(te.cashierSales[c.id])||0) : 0;
    return {c:c, mtd:mtdAct, tgt:tgt, proj:proj, b:b, todayAct:todayAct, todayTgt:cashierDailyTarget(d, c.id)};
  }).sort(function(a,b2){ return ((b2.b.ach||0)-(a.b.ach||0)) || (b2.mtd-a.mtd); });

  }).join('');

function pctTxt(actual, target){ if(!target || target<=0) return '-'; return fmtPct(actual/target*100); }
function achEmoji(actual, target){
  if(!target || target<=0) return '[--]';
  var p = actual/target*100;
  if(p>=100) return '[OK]'; if(p>=80) return '[..]'; return '[!!]';
}
function waDailyFull(d){
  var e = getEntry(d); if(!e) return null;
  var mk = monthKeyOf(d), t = getMonthTarget(mk);
  var tot = entryTotalOmset(e), dTgt = dailyTarget(d,'omsetTotal');

  var mtdOm = mtdActual(mk,'omsetTotal',d), mTgt = t? Number(t.omsetTotal)||0 : 0;
  var proj = projectMonth(mk,'omsetTotal',d);

  var L = [];
  L.push('*LAKSAMANA MUDA - DAILY REPORT*');
  L.push(dateLabel(d)); L.push('');
  L.push('*OMSET*');
  L.push(achEmoji(tot,dTgt)+' Total: *'+fmtIDR(tot)+'* ('+pctTxt(tot,dTgt)+' dari target '+fmtIDR(dTgt)+')');
  L.push('Makanan: '+fmtIDR(e.omsetFood)+' ('+pctTxt(e.omsetFood, dailyTarget(d,'omsetFood'))+')');
  L.push('Minuman: '+fmtIDR(e.omsetBev)+' ('+pctTxt(e.omsetBev, dailyTarget(d,'omsetBev'))+')');

  L.push(''); L.push('*ATRIBUSI*');

  L.push('Marketing: '+fmtIDR(mkOm));
  L.push('Event: '+fmtIDR(evOm)+(e.events.length? ' ('+e.events.length+' event)':''));
  L.push(''); L.push('*TRAFFIC & TAMU*');
  L.push(achEmoji(e.traffic, dailyTarget(d,'traffic'))+' Traffic: '+fmtNum(e.traffic)+' orang ('+pctTxt(e.traffic, dailyTarget(d,'traffic'))+')');
  L.push('Pax: '+fmtNum(e.pax)+' ('+pctTxt(e.pax, dailyTarget(d,'pax'))+')');
  L.push('Transaksi: '+fmtNum(e.transaksi)+' bill ('+pctTxt(e.transaksi, dailyTarget(d,'transaksi'))+')');
  L.push('Avg bill: '+fmtIDR(avgBill)+' | Avg/pax: '+fmtIDR(ads));
  L.push('Google Review: +'+fmtNum(e.review)+(e.reviewTotal? ' (total '+fmtNum(e.reviewTotal)+')':''));
  if(e.events.length){
    L.push(''); L.push('*EVENT HARI INI*');
    e.events.forEach(function(ev){
      L.push('- '+ev.name+' ('+ev.type+', '+(ev.timeStart||'')+'-'+(ev.timeEnd||'')+') - '+fmtIDR(ev.omset)+', '+fmtNum(ev.pax)+' pax'+(ev.pic?' | PIC '+ev.pic:''));
    });
  }
  L.push(''); L.push('*MTD '+monthLabel(mk).toUpperCase()+'* (s/d tgl '+Number(d.slice(8))+')');
  L.push(achEmoji(mtdOm,mTgt)+' Omset: *'+fmtIDR(mtdOm)+'* / '+fmtIDR(mTgt)+' ('+pctTxt(mtdOm,mTgt)+')');

  L.push('Review MTD: +'+fmtNum(mtdActual(mk,'review',d))+' / target '+fmtNum(t?t.review:0));
  if(e.notes){ L.push(''); L.push('Catatan: '+e.notes); }

function waDailyShort(d){

function waMonthly(mk){

  }).sort(function(a,b){return b.act-a.act;}).forEach(function(r,i){

function waTeam(mk, team){
  var t = getMonthTarget(mk), L = [];
  if(team==='cashier'){
    L.push('*UPDATE TARGET CASHIER - '+monthLabel(mk)+'*'); L.push('');
    S.cashiers.filter(function(c){return c.active;}).forEach(function(c){
      var act = mtdCashier(mk,c.id,null), tgt = t&&t.cashier? Number(t.cashier[c.id])||0:0;
      var b = bonusFor(act,tgt);
      L.push(achEmoji(act,tgt)+' *'+c.name+'*: '+fmtIDR(act)+' / '+fmtIDR(tgt)+' ('+pctTxt(act,tgt)+')'+(b.tier? ' - est. bonus '+fmtIDR(b.bonus):''));
    });
    L.push(''); L.push('Semangat Kru! Capai 100% untuk masuk tier bonus.');
  } else if(team==='marketing'){
    L.push('*UPDATE TARGET MARKETING - '+monthLabel(mk)+'*'); L.push('');
    S.pics.filter(function(p){return p.active;}).forEach(function(p){
      var act = mtdMarketing(mk,p.id,null), tgt = t&&t.marketing? Number(t.marketing[p.id])||0:0;
      var b = bonusFor(act,tgt), sisa = Math.max(tgt-act,0);
      L.push(achEmoji(act,tgt)+' *'+p.name+'*: '+fmtIDR(act)+' menuju '+fmtIDR(tgt)+' ('+pctTxt(act,tgt)+') | sisa '+fmtIDR(sisa)+(b.tier?' - est. bonus '+fmtIDR(b.bonus):''));
    });
    L.push(''); L.push('Gas terus, Pelaut Muda!');
  } else {
    var evs = monthEvents(mk,null), evOm = evs.reduce(function(a,ev){return a+ev.omset;},0);
    var b2 = bonusFor(evOm, t?Number(t.eventOmset)||0:0);
    L.push('*UPDATE TARGET EVENT - '+monthLabel(mk)+'*'); L.push('');
    L.push(achEmoji(evs.length,t?t.eventCount:0)+' Jumlah event: '+evs.length+' / '+fmtNum(t?t.eventCount:0));
    L.push(achEmoji(evOm,t?t.eventOmset:0)+' Omset event: '+fmtIDR(evOm)+' / '+fmtIDR(t?t.eventOmset:0)+' ('+pctTxt(evOm,t?t.eventOmset:0)+')');

    evs.slice(-5).reverse().forEach(function(ev){
      L.push('- '+ev.date.slice(8)+'/'+ev.date.slice(5,7)+' '+ev.name+' - '+fmtIDR(ev.omset));
    });
  }
  return L.join('\n');
}

function buildReport(d, mk){
  if(REPORT_TYPE==='daily-full') return waDailyFull(d);
  if(REPORT_TYPE==='daily-short') return waDailyShort(d);
  if(REPORT_TYPE==='monthly') return waMonthly(mk);
  if(REPORT_TYPE==='team-cashier') return waTeam(mk,'cashier');
  if(REPORT_TYPE==='team-marketing') return waTeam(mk,'marketing');
  return waTeam(mk,'event');
}
function copyText(txt, btn){
  function done(){ if(btn){ var o=btn.textContent; btn.textContent='Ter-copy!'; setTimeout(function(){btn.textContent=o;},1500);} }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done, function(){ fallbackCopy(txt); done(); });
  } else { fallbackCopy(txt); done(); }
}
function fallbackCopy(txt){
  var ta = document.createElement('textarea');
  ta.value = txt; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
}

function exportCsv(mk){
  var head = ['tanggal','hari','omset_total_idr','target_harian_idr','capaian_pct','omset_makanan_idr','omset_minuman_idr','omset_lain_idr','traffic','pax','transaksi','review_baru','omset_kasir_ops_idr','omset_marketing_idr','omset_event_idr','jumlah_event','catatan'];
  var lines = [head.join(',')];
  monthDates(mk).forEach(function(ds){
    var e = getEntry(ds); if(!e) return;
    var tot = entryTotalOmset(e), dTgt = dailyTarget(ds,'omsetTotal');
    lines.push([ds, DAYS_ID[dowOf(ds)], Math.round(tot), Math.round(dTgt),
      dTgt>0? (tot/dTgt*100).toFixed(1) : '',
      Math.round(e.omsetFood||0), Math.round(e.omsetBev||0), Math.round(e.omsetLain||0),
      e.traffic||0, e.pax||0, e.transaksi||0, e.review||0,
      Math.round(sumObj(e.cashierSales)), Math.round(sumObj(e.marketingSales)), Math.round(entryEventOmset(e)),
      (e.events||[]).length, '"'+String(e.notes||'').replace(/"/g,'""')+'"'].join(','));
  });
  var blob = new Blob(['﻿'+lines.join('\n')], {type:'text/csv;charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'rekap-omset-laksamana-'+mk+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
}

function renderSettings(el){
  var wRows = [1,2,3,4,5,6,0].map(function(dw){
    return '<tr><td>'+DAYS_ID[dw]+'</td><td><input type="number" step="0.1" min="0.1" id="w_'+dw+'" value="'+S.settings.dayWeights[String(dw)]+'"></td></tr>';
  }).join('');
  var tierRows = S.settings.bonusTiers.map(function(t,i){
    return '<tr><td>&ge; <input type="number" id="tier_min_'+i+'" value="'+t.minPct+'" style="width:70px"> %</td>'+
      '<td>bonus <input type="number" step="0.1" id="tier_pct_'+i+'" value="'+t.bonusPct+'" style="width:70px"> % dari omset personal</td>'+
      '<td><button class="btn ghost sm" data-tierdel="'+i+'">&times;</button></td></tr>';
  }).join('');
  var cashRows = S.cashiers.map(function(c,i){
    return '<tr><td><input type="text" id="cname_'+i+'" value="'+escapeHtml(c.name)+'"></td>'+
      '<td><label class="chk"><input type="checkbox" id="cact_'+i+'"'+(c.active?' checked':'')+'> aktif</label></td></tr>';
  }).join('');
  var picRowsS = S.pics.map(function(p,i){
    return '<tr><td><input type="text" id="pname_'+i+'" value="'+escapeHtml(p.name)+'"></td>'+
      '<td><label class="chk"><input type="checkbox" id="pact_'+i+'"'+(p.active?' checked':'')+'> aktif</label></td></tr>';
  }).join('');
  var logRows = S.log.slice(0,30).map(function(l){
    return '<tr><td class="muted">'+escapeHtml(String(l.at).slice(0,16).replace('T',' '))+'</td><td>'+escapeHtml(l.by)+'</td><td>'+escapeHtml(l.action)+'</td><td class="muted">'+escapeHtml(l.detail)+'</td></tr>';
  }).join('');

  el.innerHTML =
    '<div class="view-head"><h2>Settings <span class="muted">&mdash; semua angka di bawah default kalibrasi, review setelah 2-3 bulan data nyata</span></h2></div>'+
    '<div class="notice">Pengguna &amp; hak akses diatur di <b>Office</b>, bukan di sini. Modul ini hanya bisa dibuka superadmin.</div>'+
    '<div class="two-col">'+
      '<div class="card"><div class="card-title">Bobot Hari (auto-split target)</div>'+
        '<table class="tbl"><thead><tr><th>Hari</th><th>Bobot</th></tr></thead><tbody>'+wRows+'</tbody></table>'+
        '<div class="formula-note">Bobot lebih tinggi = target harian lebih besar. Contoh: Sabtu 1.5 vs Senin 0.8 berarti target Sabtu sekitar 88% lebih tinggi.</div></div>'+
      '<div class="card"><div class="card-title">Tier Bonus</div>'+
        '<table class="tbl"><tbody>'+tierRows+'</tbody></table>'+
        '<button class="btn ghost sm" id="btnAddTier">+ Tambah tier</button>'+
        '<div class="formula-note">Berlaku untuk cashier, PIC marketing, dan team event. Tier tertinggi yang tercapai yang dipakai.</div></div>'+
    '</div>'+
    '<div class="two-col">'+
      '<div class="card"><div class="card-title">Daftar Cashier</div><table class="tbl"><tbody>'+cashRows+'</tbody></table><button class="btn ghost sm" id="btnAddCash">+ Tambah cashier</button></div>'+
      '<div class="card"><div class="card-title">Daftar PIC Marketing</div><table class="tbl"><tbody>'+picRowsS+'</tbody></table><button class="btn ghost sm" id="btnAddPic">+ Tambah PIC</button></div>'+
    '</div>'+
    '<div class="card"><div class="card-title">Jenis Event</div><input type="text" id="evtTypes" value="'+escapeHtml(S.settings.eventTypes.join(', '))+'"><div class="formula-note">Pisahkan dengan koma.</div></div>'+
    '<div class="save-row"><button class="btn gold" id="btnSaveSettings">Simpan Settings</button></div>'+
    '<div class="two-col">'+
      '<div class="card"><div class="card-title">Cadangan Data</div>'+
        '<button class="btn ghost" id="btnBackup">Unduh Backup JSON</button>'+
        '<div class="formula-note">Data utama tersimpan di server (database). Unduhan ini cuma salinan untuk arsip, bukan syarat supaya data aman.</div></div>'+
      '<div class="card"><div class="card-title">Jejak Aktivitas (30 terakhir)</div><div class="tbl-scroll" style="max-height:220px"><table class="tbl compact"><tbody>'+(logRows||'<tr><td class="muted">Belum ada aktivitas</td></tr>')+'</tbody></table></div></div>'+
    '</div>';

  document.getElementById('btnSaveSettings').onclick = function(){ saveSettings(false); };
  document.getElementById('btnAddTier').onclick = function(){ saveSettings(true); S.settings.bonusTiers.push({minPct:130,bonusPct:5}); save(); renderView(); };
  document.getElementById('btnAddCash').onclick = function(){ saveSettings(true); S.cashiers.push({id:uid('c'),name:'Kasir '+(S.cashiers.length+1),active:true,updatedAtMs:Date.now()}); save(); renderView(); };
  document.getElementById('btnAddPic').onclick = function(){ saveSettings(true); S.pics.push({id:uid('p'),name:'PIC Baru',active:true,updatedAtMs:Date.now()}); save(); renderView(); };
  var tds = el.querySelectorAll('[data-tierdel]');
  for(var i=0;i<tds.length;i++){ tds[i].onclick = function(){ S.settings.bonusTiers.splice(Number(this.getAttribute('data-tierdel')),1); save(); renderView(); }; }
  document.getElementById('btnBackup').onclick = function(){
    var blob = new Blob([JSON.stringify(S,null,2)], {type:'application/json'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'kompas-laksamana-backup-'+todayStr()+'.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
  };
}
function saveSettings(silent){
  [1,2,3,4,5,6,0].forEach(function(dw){
    var f = document.getElementById('w_'+dw);
    if(f) S.settings.dayWeights[String(dw)] = Number(f.value)||1;
  });
  S.settings.bonusTiers.forEach(function(t,i){
    var mi = document.getElementById('tier_min_'+i), pc = document.getElementById('tier_pct_'+i);
    if(mi) t.minPct = Number(mi.value)||0;
    if(pc) t.bonusPct = Number(pc.value)||0;
  });
  S.cashiers.forEach(function(c,i){
    var n = document.getElementById('cname_'+i), a = document.getElementById('cact_'+i);
    if(n && n.value.trim() && n.value.trim()!==c.name){ c.name = n.value.trim(); c.updatedAtMs = Date.now(); }
    if(a && a.checked!==c.active){ c.active = a.checked; c.updatedAtMs = Date.now(); }
  });
  S.pics.forEach(function(p,i){
    var n = document.getElementById('pname_'+i), a = document.getElementById('pact_'+i);
    if(n && n.value.trim() && n.value.trim()!==p.name){ p.name = n.value.trim(); p.updatedAtMs = Date.now(); }
    if(a && a.checked!==p.active){ p.active = a.checked; p.updatedAtMs = Date.now(); }
  });
  var et = document.getElementById('evtTypes');
  if(et) S.settings.eventTypes = et.value.split(',').map(function(s){return s.trim();}).filter(function(s){return s;});
  if(!silent){
    logAction('update_settings','');
    save(); alert('Settings tersimpan.'); renderView();
  }
}

/* ---------- MULAI ---------- */
function tampilkanGagal(pesan){
  document.getElementById('app').innerHTML =
    '<div class="boot"><div class="boot-in"><span class="boot-ic">&#9784;</span>'+
    '<h1>KOMPAS LAKSAMANA</h1>'+
    '<p>Tidak bisa memuat data dari server.<br><b>'+escapeHtml(pesan)+'</b></p>'+
    '<button class="btn gold" onclick="location.reload()">Coba Lagi</button> '+
    '<button class="btn ghost" onclick="location.replace(\'../\')">Kembali ke Office</button></div></div>';
}
function init(){
  if(!bacaSesi()){ keOffice(); return; }
  apiGet().then(function(data){
    S = normalize(data);
    setSync('ok');
    renderApp();
  }, function(err){
    /* Server tidak terjangkau: pakai salinan terakhir kalau ada, supaya
       angka kemarin masih bisa dilihat. Yang TIDAK dilakukan: memulai dari
       data kosong lalu menyimpannya — itu akan menimpa data server dengan
       kekosongan begitu jaringan kembali. */
    var cache = null;
    try{ cache = JSON.parse(localStorage.getItem(CACHE_KEY)||'null'); }catch(e){}
    if(cache){
      S = normalize(cache);
      renderApp();
      setSync('err','Offline &mdash; menampilkan <b>salinan terakhir</b>. Jangan input dulu sampai tersambung.');
    } else {
      tampilkanGagal(err.message);
    }
  });
}
/* Dibuka untuk pengujian otomatis. Hanya fungsi hitung — tidak ada jalan
   pintas yang bisa dipakai melewati penjaga akses, karena penjaganya ada di
   <head> dan sudah berjalan sebelum baris ini. */
window.KOMPAS = {
  dailyTarget:dailyTarget, cashierDailyTarget:cashierDailyTarget, sumWeights:sumWeights,
  bonusFor:bonusFor, ensureMonthTarget:ensureMonthTarget, entryRecon:entryRecon,
  mtdActual:mtdActual, projectMonth:projectMonth, normalize:normalize,
  get state(){ return S; }
};
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
})();
