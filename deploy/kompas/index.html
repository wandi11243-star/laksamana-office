<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#F7F6F4">
<title>KOMPAS · Laksamana Muda</title>
<link rel="icon" href="../assets/LaksamanaMudaLogo.jpeg">

<!-- Guard SSO: modul ini HANYA untuk superadmin. Dijaga di sini supaya halaman
     tidak sempat tergambar sedikit pun bagi yang tidak berhak. Penjaga
     sebenarnya tetap di sisi Office: `modules`/`adminModules` dibuat server saat
     login, bukan diketik browser. -->
<script>
(function(){try{
  var s=JSON.parse(localStorage.getItem('lm_session')||'null');
  var hidup=s&&s.expiry&&Date.now()<s.expiry;
  var superadmin=hidup&&(s.adminModules||[]).indexOf('*')>-1;
  var punyaModul=hidup&&(s.modules||[]).some(function(m){return m==='*'||m==='kompas';});
  if(!(superadmin&&punyaModul))location.replace('../');
}catch(e){location.replace('../');}})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ===== TEMA OFFICE LAKSAMANA (emas di atas krem/putih, tanpa hitam) ===== */
:root{
  --ink:#2A2620; --ink-2:#3A3428; --ink-3:#4A4234;
  --gold:#A9791F; --gold-2:#C8961F; --gold-dim:#7A560F;
  --gold-soft:#F2E9D3; --gold-glow:rgba(169,121,31,.13);
  --paper:#F7F6F4; --surface:#FFFFFF; --line:#E7E1D3;
  --line-soft:rgba(60,55,45,.10); --line-hard:rgba(60,55,45,.18);
  --text:#2A2620; --muted:#5C574D; --muted-2:#928C80;
  --ok:#1F9D5F; --ok-bg:#E4F5EC; --ok-bg-t:rgba(31,157,95,.12);
  --warn:#B5831A; --warn-bg:#F7EFDB; --warn-bg-t:rgba(181,131,26,.14);
  --danger:#C9432B; --danger-bg:#F8E4DF; --danger-bg-t:rgba(201,67,43,.12);
  --info:#2F7FC4; --info-bg:#E4EFF8; --info-bg-t:rgba(47,127,196,.12);
  --violet:#7C5FC0; --violet-bg:#ECE6F7; --violet-bg-t:rgba(124,95,192,.12);
  --teal:#1F9D8F; --teal-bg:#E2F4F2; --teal-bg-t:rgba(31,157,143,.12);
  --radius:16px; --radius-sm:10px; --radius-lg:20px;
  --shadow:0 4px 18px rgba(50,42,28,.06); --shadow-lg:0 18px 48px rgba(50,42,28,.12);
  --ring:0 0 0 3px rgba(227,160,8,.18); --ease:cubic-bezier(.16,1,.3,1);
  --font-display:'Plus Jakarta Sans',system-ui,sans-serif;
  --font-body:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:var(--font-display); --sans:var(--font-body); --sidebar-w:248px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans);
  background:radial-gradient(900px 480px at 50% -12%, rgba(227,160,8,.09), transparent 60%),var(--paper);
  color:var(--text); font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased; min-height:100vh;
}
h1,h2,h3,h4{font-family:var(--serif); font-weight:700; letter-spacing:-.02em; line-height:1.18; color:var(--ink)}
a{color:var(--info)}
button{font-family:inherit; cursor:pointer}
input,select,textarea{font-family:inherit}
.mono{font-variant-numeric:tabular-nums; font-feature-settings:"tnum"}
.hidden{display:none !important}
@keyframes lm-rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.rise{animation:lm-rise .5s var(--ease) both}
.btn{border:none;border-radius:var(--radius-sm);padding:11px 17px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:filter .15s var(--ease),transform .1s var(--ease)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:none;box-shadow:var(--ring)}
.btn-block{width:100%}
.btn-sm{padding:8px 12px;font-size:13px}
.btn-xs{padding:5px 9px;font-size:12px;border-radius:8px}
.btn-primary{background:linear-gradient(135deg,var(--gold-2),var(--gold-dim));color:#fff;box-shadow:0 3px 12px rgba(122,86,15,.28)}
.btn-primary:hover{filter:brightness(1.06)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;filter:none}
.btn-ghost{background:var(--surface);border:1.5px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--gold-2);background:var(--gold-soft)}
.btn-danger{background:var(--danger-bg);color:var(--danger);border:1.5px solid rgba(201,67,43,.25)}
.btn-danger:hover{filter:brightness(.98)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--ink-2);background:var(--gold-soft);border:1px solid var(--line);border-radius:20px;padding:3px 9px}
.pill .dot{width:5px;height:5px;border-radius:50%;background:var(--gold);flex:none}
.field{text-align:left;margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);font-size:15px;transition:border-color .15s,box-shadow .15s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--gold);box-shadow:var(--ring)}

/* ===== LAYOUT ===== */
.app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);flex:none;background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 18px}
.brand .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--gold-2),var(--gold-dim));display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:800;color:#fff;font-size:18px;flex:none}
.brand .bt{font-family:var(--serif);font-weight:800;font-size:16px;color:var(--ink);letter-spacing:-.02em;line-height:1.1}
.brand .bs{font-size:10.5px;color:var(--muted-2);letter-spacing:.5px;margin-top:2px}
.nav{flex:1}
.nav-group{margin-top:14px}
.nav-label{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted-2);padding:0 10px 7px}
.nav a{position:relative;display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;color:var(--muted);text-decoration:none;font-size:13.5px;font-weight:500;margin-bottom:2px;transition:background .13s,color .13s}
.nav a:hover{background:var(--paper);color:var(--ink)}
/* Menu aktif: latar krem lembut + garis emas di kiri (samakan dgn Reservasi/
   BD OS), BUKAN blok kuning penuh. */
.nav a.active{background:var(--gold-soft);color:var(--gold-dim);font-weight:600}
.nav a.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--gold)}
.nav a .ico{width:18px;display:flex;align-items:center;justify-content:center;flex:none}
.nav a .ico svg{width:17px;height:17px;stroke-width:1.9;opacity:.85}
.nav a.active .ico svg{opacity:1}
/* Ciutkan ke ikon saja (tombol ☰). Label/teks disembunyikan, ikon tetap.
   Hanya di desktop — di layar sempit sidebar sudah off-canvas. */
@media(min-width:621px){
  .app.nav-mini .sidebar{width:72px}
  .app.nav-mini .brand .bt,.app.nav-mini .brand .bs,.app.nav-mini .nav-label,.app.nav-mini .su-info{display:none}
  .app.nav-mini .brand{justify-content:center;padding:6px 0 18px}
  .app.nav-mini .nav a{justify-content:center;gap:0;font-size:0;padding:9px 0}
  .app.nav-mini .nav a .ico{font-size:16px;width:auto}
  .app.nav-mini .side-user{flex-direction:column;gap:8px;padding:10px 6px}
}
@media(max-width:620px){#navMiniBtn{display:none}}
/* kartu user + tombol keluar di kaki sidebar — pola sama seperti modul lain */
.side-user{display:flex;align-items:center;gap:9px;margin-top:12px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
.su-avatar{width:32px;height:32px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--gold-2),var(--gold-dim));color:#fff;font-family:var(--serif);font-weight:800;font-size:14px}
.su-info{min-width:0;flex:1}
.su-info b{display:block;font-size:12.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.su-info span{font-size:10.5px;color:var(--muted-2)}
.logout-x{background:var(--surface);border:1px solid var(--line);color:var(--muted);width:32px;height:32px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;flex:none;transition:.16s}
.logout-x:hover{background:var(--danger-bg);color:var(--danger);border-color:var(--danger)}
.logout-x svg{width:16px;height:16px}
.main{flex:1;min-width:0;padding:26px 30px 60px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.topbar h1{font-size:23px}
.topbar .sub{font-size:13px;color:var(--muted);margin-top:3px}
.month-pick{display:flex;align-items:center;gap:10px}
.month-pick input{padding:9px 11px;border:1.5px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);font-size:14px;font-weight:600;color:var(--ink)}
/* Pesan galat simpan sekarang membawa sebab asli dari server (bisa sepanjang
   "SQLSTATE[HY000] [1044] Access denied..."), jadi span-nya harus boleh
   membungkus dan memotong kata panjang, bukan melebarkan header. */
.sync{font-size:11.5px;font-weight:600;color:var(--muted-2);display:inline-block;max-width:340px;line-height:1.45;text-align:right;overflow-wrap:anywhere}
.sync.ok{color:var(--ok)} .sync.err{color:var(--danger)} .sync.saving{color:var(--warn)}
.view{max-width:1180px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 22px;margin-bottom:18px}
.card h3{font-size:16px;margin-bottom:4px}
.card .card-sub{font-size:12.5px;color:var(--muted);margin-bottom:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.g2,.g3,.g4{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.g2,.g3,.g4{grid-template-columns:1fr}.sidebar{position:fixed;z-index:50;transform:translateX(-100%);transition:transform .2s}.sidebar.open{transform:none}.main{padding:18px}}
.row-in{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}

/* stat cards — pita emas tipis di tepi atas (gaya Marketing) */
.stat{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:17px 18px;box-shadow:var(--shadow)}
.stat::before{content:'';position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--gold-2),var(--gold-dim))}
.stat .lab{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:6px}
.stat .val{font-family:var(--serif);font-weight:700;font-size:26px;color:var(--ink);margin-top:8px;letter-spacing:-.02em;line-height:1}
.stat .val.sm{font-size:19px}
.stat .foot{font-size:12px;color:var(--muted);margin-top:8px}
.stat.accent{background:linear-gradient(135deg,var(--gold-2),var(--gold-dim));color:#fff;border:none}
.stat.accent::before{display:none}
.stat.accent .lab{color:rgba(255,255,255,.72)}
.stat.accent .val{color:#fff}
.stat.accent .foot{color:rgba(255,255,255,.72)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;border-radius:20px;padding:3px 9px}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.bad{background:var(--danger-bg);color:var(--danger)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.info{background:var(--info-bg);color:var(--info)}
/* Netral — untuk label yang bukan status baik/buruk, mis. Non-Ticketing.
   .chip polos tidak punya background sama sekali, jadi jangan dipakai telanjang. */
.chip.mute{background:var(--paper);color:var(--muted);border:1px solid var(--line)}

/* progress */
.prog{height:9px;border-radius:20px;background:var(--gold-soft);overflow:hidden;margin-top:9px}
.prog>i{display:block;height:100%;border-radius:20px;background:linear-gradient(90deg,var(--gold-2),var(--gold-dim));transition:width .5s var(--ease)}
.prog.ok>i{background:linear-gradient(90deg,#28b06e,var(--ok))}

/* table */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:10px 12px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);color:var(--text)}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto}
tbody tr:hover{background:var(--gold-soft)}

/* status badge */
.status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600}
.status .d{width:9px;height:9px;border-radius:50%;flex:none}
.status.ok .d{background:var(--ok)}
.status.ok{color:var(--ok)}
.status.bad .d{background:var(--danger)}
.status.bad{color:var(--danger)}

/* breakdown row */
.brow{display:grid;gap:10px;align-items:end;margin-bottom:10px}
.brow.mk{grid-template-columns:1.1fr 1.4fr 1fr auto auto}
.brow.ks{grid-template-columns:1.3fr 1fr auto}
.brow .field{margin-bottom:0}
@media(max-width:760px){.brow.mk,.brow.ks{grid-template-columns:1fr}}
/* Centang Ticketing di baris breakdown. Dibuat setinggi field di sebelahnya
   supaya tidak melayang saat baris ikut memanjang. */
.tkbox{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;padding-bottom:9px}
.tkbox input{cursor:pointer}
.tkbox.on{color:var(--gold-dim)}
.mini-lab{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-bottom:8px}
.balance-bar{position:sticky;bottom:0;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--radius);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:16px;box-shadow:var(--shadow-lg);flex-wrap:wrap;margin-top:8px}
.balance-bar .bnums{display:flex;gap:26px;flex-wrap:wrap}
.balance-bar .bnums .bi{font-size:12px;color:var(--muted)}
.balance-bar .bnums .bi b{display:block;font-family:var(--serif);font-size:16px;color:var(--ink);font-weight:800;margin-top:2px}
.notice{padding:11px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;margin-bottom:14px;display:flex;gap:9px;align-items:flex-start}
.notice.ok{background:var(--ok-bg);color:#146c42}
.notice.bad{background:var(--danger-bg);color:#8f2718}
.notice.info{background:var(--info-bg);color:#1a5a91}
.notice.warn{background:var(--warn-bg);color:#7a5a10}
.empty{text-align:center;padding:40px 20px;color:var(--muted-2)}
.empty .big{font-size:34px;margin-bottom:8px}
.seg{display:inline-flex;background:var(--gold-soft);border-radius:10px;padding:3px;gap:2px;margin-bottom:16px;flex-wrap:wrap}
.seg button{border:none;background:transparent;padding:7px 15px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.divlabel{display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:3px 9px;border-radius:6px;margin-bottom:12px}
.divlabel.mk{background:var(--info-bg);color:var(--info)}
.divlabel.ev{background:var(--violet-bg);color:var(--violet)}
.divlabel.ks{background:var(--teal-bg);color:var(--teal)}
.hamb{display:none}
@media(max-width:620px){.hamb{display:inline-flex}}
.chart-box{position:relative;height:280px}
.chart-box.sm{height:230px}
.helper{font-size:11.5px;color:var(--muted-2);margin-top:4px}
.tax-note{background:var(--warn-bg-t);border:1px dashed rgba(181,131,26,.4);border-radius:var(--radius-sm);padding:10px 13px;font-size:12.5px;color:#7a5a10;margin-top:6px}
.leader{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--radius-sm);border:1px solid var(--line);margin-bottom:9px;background:var(--surface)}
.leader .rank{width:30px;height:30px;border-radius:50%;background:var(--gold-soft);color:var(--gold-dim);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px;flex:none}
.leader.top1 .rank{background:linear-gradient(135deg,#f4c752,#c8961f);color:#fff}
.leader .ln{font-weight:700;font-size:14px}
.leader .lm{font-size:11.5px;color:var(--muted)}
.leader .lspace{flex:1}

/* ===== Kalender kustom (bukan date picker bawaan browser) ===== */
.calwrap{position:relative}
.calbtn{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);font-size:15px;font-weight:600;text-align:left;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:220px}
.calbtn:hover{border-color:var(--gold)}
/* di dalam grid form (row-in) tombolnya ikut lebar kolom, jangan memaksa 220px */
.row-in .calbtn{min-width:0}
.row-in .calpop{left:0;right:auto;max-width:min(300px,86vw)}
.calback{position:fixed;inset:0;z-index:55}
.calpop{position:absolute;z-index:60;top:calc(100% + 6px);right:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);padding:14px;width:300px}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calhead b{font-family:var(--serif);font-size:15px;color:var(--ink)}
.calnav{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:16px;display:grid;place-items:center;color:var(--muted)}
.calnav:hover{border-color:var(--gold);color:var(--gold-dim)}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.caldow{font-size:10px;font-weight:700;color:var(--muted-2);text-transform:uppercase;padding:5px 0;letter-spacing:.4px}
.calday{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;border:none;background:none;color:var(--text);position:relative}
.calday:hover{background:var(--gold-soft)}
.calday.off{color:var(--muted-2);opacity:.45;cursor:default}
.calday.off:hover{background:none}
.calday.today{color:var(--gold-dim);font-weight:800}
.calday.sel{background:linear-gradient(135deg,var(--gold-2),var(--gold-dim));color:#fff}
.calday.caldata::after{content:'';position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--gold)}
.calday.sel.caldata::after{background:#fff}
.calquick{display:flex;gap:6px;margin-top:10px}
.calquick button{flex:1;padding:7px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-size:12px;font-weight:600;cursor:pointer;color:var(--text)}
.calquick button:hover{background:var(--gold-soft);border-color:var(--gold)}

/* ---- Lembar cetak Report Achievement ----
   WAJIB display:none di layar. Isinya diisi tepat sebelum window.print(), dan
   tanpa aturan ini lembarnya ikut menempel di bawah halaman sesudah dialog
   cetak ditutup. Ditampilkan hanya di dalam @media print. */
#printSheet{display:none}
@media print{
  /* Sembunyikan aplikasi, sisakan lembar. visibility saja tidak cukup —
     sidebar tetap memesan ruang dan lembarnya terdorong ke halaman 2. */
  .app,.topbar{display:none!important}
  #printSheet{display:block!important;font-family:Inter,system-ui,sans-serif;color:#111}
  #printSheet .ph{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2.5px solid #111;padding-bottom:10px;margin-bottom:18px}
  #printSheet .ph h1{font-size:19px;margin:0 0 3px;letter-spacing:.2px}
  #printSheet .ph .sub{font-size:11.5px;color:#555}
  #printSheet .ph .brand{font-size:12px;font-weight:800;letter-spacing:1.5px;text-align:right}
  #printSheet h2{font-size:13px;margin:20px 0 8px;text-transform:uppercase;letter-spacing:.6px;color:#444}

<script>
/* =========================================================
   KOMPAS — engine
   Omset (net) = Food + Beverage + Lainnya − Discount
   Service Charge & Tax = di luar omset, diakumulasi bulanan, TAPI ikut
     ditagihkan ke tamu → jadi pembanding setoran kasir di Report Daily
   Discount = diakumulasi bulanan
   Compliment = catatan terpisah; memotong REALISASI PIC penanggungnya

   Data disimpan di server (kompas-api-mysql) sebagai satu blob JSON,
   dengan salinan lokal (localStorage) untuk tampil saat jaringan putus.
   ========================================================= */
const API_URL='../kompas-api-mysql/api.php';
const CACHE_KEY='lm_kompas_cache_v2';
const SESSION_KEY='lm_session';
const fmtRp=n=>'Rp'+Math.round(n||0).toLocaleString('id-ID');
/* Nominal BERTANDA untuk kolom selisih. fmtRp() menempelkan minus di belakang
   "Rp" ("Rp-9.001") karena tandanya ikut ke dalam toLocaleString — di kolom
   yang justru isinya sering negatif itu terbaca salah sekilas. */
const fmtSel=n=>{ n=Math.round(n||0); return (n>0?'+':n<0?'−':'')+'Rp'+Math.abs(n).toLocaleString('id-ID'); };
const fmtRpShort=n=>{n=n||0;if(Math.abs(n)>=1e9)return 'Rp'+(n/1e9).toFixed(1).replace('.0','')+'M';if(Math.abs(n)>=1e6)return 'Rp'+(n/1e6).toFixed(1).replace('.0','')+'jt';if(Math.abs(n)>=1e3)return 'Rp'+Math.round(n/1e3)+'rb';return 'Rp'+Math.round(n);};
const pct=(a,b)=>b>0?(a/b*100):0;
// Semua nominal di modul ini bilangan BULAT (rupiah/jumlah), dan input rupiah
// diformat dengan titik pemisah ribuan. Jadi titik DIBUANG (bukan dianggap
// desimal) supaya "3.000.000" terbaca 3000000, bukan 3.
const num=v=>{const n=parseInt(String(v).replace(/[^0-9-]/g,''),10);return isNaN(n)?0:n;};
const HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const daysInMonth=(y,m)=>new Date(y,m,0).getDate();
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const monthKeyOf=iso=>iso.slice(0,7);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---- Format rupiah untuk input nominal (angka + pemisah ribuan titik) ----
   Inputan diberi class "rp": nilainya diformat hidup saat diketik, dan num()
   (yang membuang non-digit) tetap membacanya benar. */
function fmtRpInput(v){ var d=String(v==null?'':v).replace(/[^0-9]/g,''); return d?Number(d).toLocaleString('id-ID'):''; }
function formatAllRp(root){ (root||document).querySelectorAll('input.rp').forEach(function(el){ el.value=fmtRpInput(el.value); }); }
document.addEventListener('input',function(e){
  var el=e.target; if(!el||!el.classList||!el.classList.contains('rp')) return;
  var before=el.value.length, caret=el.selectionStart;
  el.value=fmtRpInput(el.value);
  var delta=el.value.length-before;
  try{ el.setSelectionRange(Math.max(0,caret+delta), Math.max(0,caret+delta)); }catch(_){}
});

/* ---- Nol langsung tergantikan saat mulai mengetik ----
   Hampir semua kotak angka di modul ini mulai dari "0". Tanpa ini kru harus
   menghapus nolnya sendiri tiap kali mengisi — dan kalau lupa, hasilnya "05"
   yang terbaca 5 di kotak rupiah tapi tetap terlihat salah, dan benar-benar
   jadi "05" di kotak biasa (traffic/bill/qty) yang tidak lewat formatter. */
function kotakAngka(el){
  return !!el && el.tagName==='INPUT' && !!el.classList &&
         (el.classList.contains('rp') || el.classList.contains('ci') || el.getAttribute('inputmode')==='numeric');
}
function pilihKalauNol(el){ if(kotakAngka(el) && num(el.value)===0){ try{ el.select(); }catch(_){} } }
document.addEventListener('focusin',function(e){ pilihKalauNol(e.target); });
// Klik membatalkan select() dari focusin, jadi dipilih ulang sesudah klik
// selesai. Aman: hanya berlaku saat isinya nol, yang memang tidak ada yang
// perlu ditunjuk kursornya.
document.addEventListener('mouseup',function(e){
  var el=e.target;
  if(kotakAngka(el) && el.selectionStart===el.selectionEnd) pilihKalauNol(el);
});
// Jaring pengaman untuk kotak TANPA class "rp" (traffic, bill, qty): buang nol
// di depan begitu ada angka lain diketik.
document.addEventListener('input',function(e){
  var el=e.target;
  if(!kotakAngka(el) || el.classList.contains('rp')) return;   // yang "rp" sudah dirapikan formatter di atas
  var bersih=String(el.value).replace(/[^0-9]/g,'').replace(/^0+(?=\d)/,'');
  if(bersih!==el.value) el.value=bersih;
});

/* Ciutkan / lebarkan menu samping (tombol ☰). Diingat per perangkat. */
function toggleNav(){
  const app=document.querySelector('.app'), mini=!app.classList.contains('nav-mini');
  app.classList.toggle('nav-mini',mini);
  try{ localStorage.setItem('lm_kompas_navmini',mini?'1':'0'); }catch(e){}
}
(function(){ try{ if(localStorage.getItem('lm_kompas_navmini')==='1') document.querySelector('.app').classList.add('nav-mini'); }catch(e){} })();

/* Identitas dari Office (lm_session).

   LEVEL AKSES — dulu modul ini superadmin-saja. Sekarang kasir perlu mengisi
   Report Daily & Compliment tanpa boleh melihat target/performa siapa pun.
   Dasar penentuannya Tim/Keterangan akun Office, yang SUDAH ikut di lm_session
   (field `keterangan`), jadi gerbangnya tetap sinkron — tidak perlu memanggil
   roster dan menunggu jaringan sebelum tahu boleh masuk atau tidak.

     adminModules '*'  → 'full' : semua grup menu (termasuk Sistem)
     selain itu        → 'ops'  : HANYA grup Operasional

   Yang bukan superadmin sengaja jatuh ke 'ops', bukan ditolak: hak paling
   kecil adalah default yang aman, dan kalau keterangannya belum diisi di
   Office kasir tetap bisa bekerja. */
let CURRENT_USER=null;
const LEVEL_GRUP={ ops:['Operasional'], full:['Operasional','Dashboard','Performa','Sistem'] };
function bacaSesi(){
  try{
    const s=JSON.parse(localStorage.getItem(SESSION_KEY)||'null');
    if(!s||!s.expiry||Date.now()>=s.expiry) return null;
    const m=s.modules||[];
    if(m.indexOf('*')<0 && m.indexOf('kompas')<0) return null;
    // Admin global ('*') MAUPUN admin modul kompas dapat level penuh — sepadan
    // dengan flag isModuleAdmin yang dipakai roster Office di Kelola Akses.
    const adm=s.adminModules||[];
    const level=(adm.indexOf('*')>-1||adm.indexOf('kompas')>-1) ? 'full' : 'ops';
    return {id:s.userId,name:s.name,keterangan:s.keterangan||'',level};
  }catch(e){ return null; }
}
function levelSaya(){ return CURRENT_USER?CURRENT_USER.level:'ops'; }
function bolehLihat(view){ return VIEW_GRUP[view] ? LEVEL_GRUP[levelSaya()].indexOf(VIEW_GRUP[view])>-1 : false; }
/* Sembunyikan grup menu yang tidak boleh dilihat. Dijalankan sesudah sesi
   dibaca, sebelum halaman pertama digambar. */
function pasangMenu(){
  const boleh=LEVEL_GRUP[levelSaya()];
  document.querySelectorAll('.nav-group').forEach(g=>{
    const nama=(g.querySelector('.nav-label')||{}).textContent||'';
    g.style.display = boleh.indexOf(nama.trim())>-1 ? '' : 'none';
  });
  const badge=document.querySelector('.su-info span');
  if(badge) badge.textContent = levelSaya()==='full' ? 'super admin' : 'operasional';
}

/* Peta view -> grup menu. Sumber tunggal untuk sidebar DAN untuk router:
   menyembunyikan menu saja tidak cukup, karena view masih bisa dicapai lewat
   go() dari kode lain. bolehLihat() memakai peta ini juga. */
const VIEW_GRUP={
  input:'Operasional', report:'Operasional', compliment:'Operasional', breakdown:'Operasional',
  bulanan:'Dashboard', analytics:'Dashboard', summary:'Dashboard',
  marketing:'Performa', event:'Performa', kasir:'Performa',
  target:'Sistem', akses:'Sistem'
};

/* Metode pembayaran Report Daily. Urutannya sengaja alfabetis seperti yang
   dipakai kasir di POS supaya mudah dicocokkan baris per baris. */
const PAYS=[
  {k:'cash',        n:'Cash'},
  {k:'compliment',  n:'Compliment'},
  {k:'edc_bca',     n:'EDC BCA'},
  {k:'edc_mandiri', n:'EDC Mandiri'},
  {k:'grabfood',    n:'Grabfood'},
  {k:'member_dep',  n:'Member Deposit'},
  {k:'qris_bri',    n:'QRIS BRI'},
  {k:'qris_esb',    n:'QRIS ESB'},
  {k:'qris_mandiri',n:'QRIS Mandiri'}
];
/* Batas selisih yang masih boleh disubmit. "Selisih 3 digit terakhir" =
   di bawah seribu rupiah — beda pembulatan, bukan uang hilang. Rp1.000 ke
   atas tombol submit dikunci. */
const SELISIH_TOLERANSI=1000;
/* Tim/Keterangan Office yang boleh jadi PIC compliment, + "Tamu" yang bukan
   orang: compliment ber-PIC Tamu tidak memotong realisasi siapa pun. */
const COMP_DIV=['marketing','office','event'];
const PIC_TAMU='__tamu__';

/* Default awal — dipakai kalau server masih kosong. Daftar PIC SENGAJA kosong:
   nama Marketing/Event/Kasir ditarik otomatis dari akun Office yang divisinya
   sudah di-define (lihat syncPicOffice), bukan diisi contoh dari sini.
   Data omset harian mulai kosong. */
function seed(){
  return {
    settings:{ companyMonthlyTarget:300000000, useWorkingDays:false, workingDaysPerMonth:26 },
    employees:{ marketing:[], event:[], kasir:[] },
    daily:[],
    reports:{},      // "YYYY-MM-DD" -> {pay:{<kunci>:{pos,actual}}, by, at, submitted}
    compliments:[]   // [{id,date,nama,alasan,nominal,picName,picOfficeId,picDiv,by,at}]
  };
}
/* Jaga bentuk data supaya view tidak pernah menemui field hilang. */
function normalizeDB(d){
  d=(d&&typeof d==='object'&&!Array.isArray(d))?d:{};
  const s=seed();
  if(!d.settings||typeof d.settings!=='object'||Array.isArray(d.settings)) d.settings=s.settings;
  else for(const k in s.settings) if(d.settings[k]===undefined||d.settings[k]===null) d.settings[k]=s.settings[k];
  if(!d.employees||typeof d.employees!=='object'||Array.isArray(d.employees)) d.employees=JSON.parse(JSON.stringify(s.employees));
  else ['marketing','event','kasir'].forEach(k=>{ if(!Array.isArray(d.employees[k])) d.employees[k]=s.employees[k]; });
  if(!Array.isArray(d.daily)) d.daily=[];
  if(!d.reports||typeof d.reports!=='object'||Array.isArray(d.reports)) d.reports={};
  if(!Array.isArray(d.compliments)) d.compliments=[];
  /* Migrasi: "Total Tax & Service" dulu SATU angka (tax_service). Sekarang
     dipecah jadi service_charge + tax. Nilai lama seluruhnya dianggap tax —
     menebak pembagiannya justru mengarang angka yang tidak pernah diinput. */
  d.daily.forEach(x=>{
    if(x.service_charge===undefined && x.tax===undefined && x.tax_service!==undefined){
      x.tax=num(x.tax_service); x.service_charge=0;
    }
    if(x.service_charge===undefined) x.service_charge=0;
    if(x.tax===undefined) x.tax=0;
  });
  return d;
}

/* Bersih-bersih PIC contoh "Kasir 1/2/3" bawaan seed versi lama. Daftar kasir
   sekarang datang dari akun Office yang divisinya di-define, jadi placeholder
   ini tidak dipakai lagi. Baris breakdown miliknya ikut dibuang HANYA kalau
   nominalnya nol — kalau ternyata pernah dipakai, PIC-nya dibiarkan supaya
   omset yang sudah dialokasikan tidak hilang diam-diam. Idempoten: sekali
   bersih, panggilan berikutnya tidak melakukan apa-apa. */
function purgeSeedKasir(d){
  const contoh=e=>/^k[123]$/.test(String(e.id||'')) && /^kasir\s*\d+$/i.test(String(e.name||'').trim()) && !e.officeUserId;
  const kandidat=(d.employees.kasir||[]).filter(contoh);
  if(!kandidat.length) return false;
  const terpakai=new Set();
  (d.daily||[]).forEach(day=>(day.bd&&Array.isArray(day.bd.kasir)?day.bd.kasir:[]).forEach(r=>{ if(num(r.amount)>0) terpakai.add(r.kasirId); }));
  const buang=new Set(kandidat.filter(e=>!terpakai.has(e.id)).map(e=>e.id));
  if(!buang.size) return false;
  d.employees.kasir=d.employees.kasir.filter(e=>!buang.has(e.id));
  (d.daily||[]).forEach(day=>{ if(day.bd&&Array.isArray(day.bd.kasir)) day.bd.kasir=day.bd.kasir.filter(r=>!buang.has(r.kasirId)); });
  return true;
}

let DB=null;

/* ---- lapisan API ---- */
let SAVE_TIMER=null, SAVING=false, DIRTY=false, RETRY_TIMER=null, RETRY_KE=0;
function setSync(st,msg){
  const el=document.getElementById('syncBox'); if(!el) return;
  el.className='sync'+(st==='err'?' err':st==='ok'?' ok':st==='saving'?' saving':'');
  el.innerHTML=msg||(st==='ok'?'✓ Tersimpan':st==='saving'?'Menyimpan…':st==='load'?'Memuat…':'');
}
function fetchTimeout(url,opts,ms){
  const c=new AbortController(); const t=setTimeout(()=>c.abort(),ms||25000);
  opts=opts||{}; opts.signal=c.signal;
  return fetch(url,opts).then(r=>{clearTimeout(t);return r;},e=>{clearTimeout(t);throw e;});
}
function apiGet(){
  return fetchTimeout(API_URL+'?action=getAll&t='+Date.now(),{method:'GET',redirect:'follow'})
    .then(r=>r.json()).then(j=>{ if(!j.ok) throw new Error(j.error||'server error'); return j.data; });
}
function apiSave(state){
  return fetchTimeout(API_URL,{method:'POST',redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'saveAll',data:state})},40000)
    .then(r=>r.json()).then(j=>{ if(!j.ok) throw new Error(j.error||'server error'); return j.data; });
}
/* Simpan ditunda sebentar lalu dikirim sekali — mengetik di form tidak boleh
   memicu satu request per ketukan. */
function save(){
  DIRTY=true;
  DB._savedBy=CURRENT_USER?CURRENT_USER.name:'';
  try{ localStorage.setItem(CACHE_KEY,JSON.stringify(DB)); }catch(e){}
  setSync('saving');
  clearTimeout(SAVE_TIMER);
  clearTimeout(RETRY_TIMER);   // suntingan baru sudah menjadwalkan kirim sendiri
  SAVE_TIMER=setTimeout(kirim,1000);
}
/* Percobaan ulang kalau simpan gagal. Sebelumnya retry dijaga `if(DIRTY)`,
   padahal DIRTY baru saja di-set false di awal kirim() — jadi syaratnya tidak
   pernah benar dan "mencoba lagi…" itu bohong: datanya diam di localStorage
   sampai ada suntingan berikutnya. Sekarang dijadwalkan tanpa syarat, dengan
   jeda menanjak supaya server yang sedang bermasalah tidak dihujani. */
const RETRY_JEDA=[5000,10000,20000,40000,60000];
function jadwalkanUlang(){
  clearTimeout(RETRY_TIMER);
  const jeda=RETRY_JEDA[Math.min(RETRY_KE,RETRY_JEDA.length-1)];
  RETRY_KE++;
  RETRY_TIMER=setTimeout(kirim,jeda);
  return jeda;
}
function kirim(){
  if(SAVING){ SAVE_TIMER=setTimeout(kirim,700); return; }
  SAVING=true; DIRTY=false;
  apiSave(DB).then(()=>{
    SAVING=false; RETRY_KE=0; clearTimeout(RETRY_TIMER);
    setSync(DIRTY?'saving':'ok'); if(DIRTY) kirim();
  },err=>{
    SAVING=false;
    /* Sebab aslinya WAJIB ikut tampil. Pesan generik bikin galat konfigurasi
       (mis. MySQL 1044 "Access denied ... to database") tidak bisa dibedakan
       dari jaringan putus, dan itu memakan waktu diagnosa yang tidak perlu. */
    const sebab=(err&&err.message?String(err.message):'penyebab tidak diketahui').slice(0,200);
    const detik=Math.round(jadwalkanUlang()/1000);
    setSync('err',`Gagal simpan — tersimpan lokal, coba lagi ${detik}s.<br><span style="opacity:.85;font-size:11px">${esc(sebab)}</span>`);
  });
}

/* ---- derived helpers ----
   Rokok & Videotron DIHAPUS 27 Juli 2026 atas permintaan. Aman dilakukan
   karena saat itu database dev maupun produksi belum berisi satu pun baris
   omset, jadi tidak ada total historis yang berubah diam-diam. Field lamanya
   sengaja tidak di-DROP dari data yang mungkin tersimpan — cuma tidak
   dihitung lagi. */
function grossOf(d){ return num(d.food)+num(d.bev)+num(d.lainnya); }
function netOf(d){ return grossOf(d)-num(d.discount); }
/* Tax & service ADA DI LUAR omset (tidak menambah/mengurangi netOf), tapi
   tetap ditagihkan ke tamu. Jadi yang harus disamai total pembayaran di
   Report Daily adalah netOf + tax + service, bukan netOf saja. */
function taxSvcOf(d){ return num(d.service_charge)+num(d.tax); }
function tagihanOf(d){ return netOf(d)+taxSvcOf(d); }
function avgSpendOf(d){ const b=num(d.bill); return b>0?netOf(d)/b:0; }
function itemsOf(d){ return num(d.qty_food)+num(d.qty_bev)+num(d.qty_others); }
/* angka desimal (UPT, party size) — 2 angka di belakang koma, gaya id-ID */
const fmtDec=n=>(isFinite(n)?n:0).toLocaleString('id-ID',{minimumFractionDigits:2,maximumFractionDigits:2});
function dailyTarget(monthKey){
  const [y,m]=monthKey.split('-').map(Number);
  const div=DB.settings.useWorkingDays?DB.settings.workingDaysPerMonth:daysInMonth(y,m);
  return div>0?DB.settings.companyMonthlyTarget/div:0;
}
function daysOfMonth(monthKey){ return DB.daily.filter(d=>monthKeyOf(d.date)===monthKey).sort((a,b)=>a.date<b.date?-1:1); }
function getDay(date){ return DB.daily.find(d=>d.date===date); }
function empName(div,id){ const e=(DB.employees[div]||[]).find(x=>x.id===id); return e?e.name:'—'; }

function saveDaily(){
  const date=inputDate;
  const rec={date,food:num(v('i_food')),bev:num(v('i_bev')),lainnya:num(v('i_lainnya')),discount:num(v('i_discount')),service_charge:num(v('i_svc')),tax:num(v('i_tax')),traffic:num(v('i_traffic')),bill:num(v('i_bill')),qty_food:num(v('i_qfood')),qty_bev:num(v('i_qbev')),qty_others:num(v('i_qothers'))};
  const errs=[];
  ['food','bev','lainnya','discount','service_charge','tax','traffic','bill','qty_food','qty_bev','qty_others'].forEach(k=>{if(rec[k]<0)errs.push('Nilai tidak boleh negatif.');});
  if(grossOf(rec)===0)errs.push('Pendapatan tidak boleh kosong.');
  if(rec.discount>grossOf(rec))errs.push('Diskon melebihi total pendapatan.');
  if(rec.traffic<rec.bill)errs.push('Traffic harus ≥ jumlah Bill.');
  /* Gerbang selisih ditegakkan di sini juga, bukan cuma lewat tombol yang
     di-disable: tombol bisa dilewati (Enter di form, atau saveDaily dipanggil
     dari tempat lain), dan yang menjaga data harus jalur simpannya. */
  const rp0=repOf(date);
  if(rp0){
    const setoran0=PAYS.reduce((s,p)=>s+repPay(rp0,p.k).actual,0);
    const abs0=Math.abs(tagihanOf(rec)-setoran0);
    if(abs0>=SELISIH_TOLERANSI)
      errs.push(`Selisih ${fmtRp(abs0)} terhadap Report Daily (setoran ${fmtRp(setoran0)}) melebihi batas ${fmtRp(SELISIH_TOLERANSI)}.`);
  }
  const box=document.getElementById('i_err');
  if(errs.length){box.innerHTML='<div class="notice bad">⚠ '+[...new Set(errs)].join(' ')+'</div>';return;}
  const ex=getDay(date);
  if(ex){Object.assign(ex,rec);} else {rec.bd={marketing:[],event:[],kasir:[]};rec.bdValid=false;DB.daily.push(rec);}
  save();
  box.innerHTML='<div class="notice ok">✓ Tersimpan. '+(ex?'Data diperbarui.':'Lanjut ke Breakdown untuk alokasi sumber omset.')+'</div>';
  inputDate=date;PERIOD=monthKeyOf(date);
  setTimeout(()=>render(),700);
}

/* ============ 1b. REPORT DAILY (KASIR) ============

   membingungkan: selama admin belum menginput omset, tagihannya Rp0 sehingga
   selisihnya sama dengan seluruh setoran (mis. +Rp9.430.148 merah) — seolah
   kasir salah besar padahal pekerjaannya sudah benar. Pencocokan ke omset

        </tr>`;}).join('')}</tbody>
        <tfoot><tr style="font-weight:800;border-top:2px solid var(--line)">
          <td>TOTAL</td><td class="num mono" id="rt_pos">Rp0</td><td class="num mono" id="rt_act">Rp0</td><td class="num mono" id="rt_sel">Rp0</td>
        </tr></tfoot>
      </table></div>
    </div>
    <div class="grid g3">
      <div class="stat accent"><div class="lab">Total POS</div><div class="val sm mono" id="rc_pos">Rp0</div><div class="foot">angka dari mesin kasir</div></div>
      <div class="stat"><div class="lab">Total Actual</div><div class="val sm mono" id="rc_act">Rp0</div><div class="foot">uang & mutasi yang benar-benar ada</div></div>
      <div class="stat" id="rc_box"><div class="lab">Selisih POS vs Actual</div><div class="val sm mono" id="rc_sel">Rp0</div><div class="foot" id="rc_foot"></div></div>
    </div>
    <div id="rp_err"></div>
    <div style="display:flex;gap:10px;align-items:center;margin-top:6px;flex-wrap:wrap">
      <button class="btn btn-primary" id="rp_save">${rec&&rec.submitted?'Update Report':'Submit Report'}</button>
      <div class="helper" style="margin:0">PIC: <b>${esc(CURRENT_USER?CURRENT_USER.name:'—')}</b>${rec&&rec.by?` · terakhir disimpan oleh <b>${esc(rec.by)}</b>${rec.at?` (${fmtWaktu(rec.at)})`:''}`:''}</div>
    </div>`;

  const hitung=()=>{
    let tp=0,ta=0;
    PAYS.forEach(p=>{
      const pos=num(inputVal(p.k,'pos')), act=num(inputVal(p.k,'actual'));
      tp+=pos; ta+=act;
      const s=act-pos;
      const c=document.getElementById('rs_'+p.k);
      c.textContent=fmtSel(s);
      c.style.color = s===0?'var(--muted)' : (s>0?'var(--ok)':'var(--danger)');
      c.style.fontWeight = s===0?'500':'800';
    });
    document.getElementById('rt_pos').textContent=fmtRp(tp);
    document.getElementById('rt_act').textContent=fmtRp(ta);
    const tsel=ta-tp;
    const tf=document.getElementById('rt_sel');
    tf.textContent=fmtSel(tsel);
    tf.style.color = tsel===0?'var(--muted)':(tsel>0?'var(--ok)':'var(--danger)');
    /* Ringkasan bawah = pengulangan baris TOTAL, murni POS vs Actual. Tidak
       ada lagi pembanding ke omset di halaman ini, dan submit tidak pernah
       dikunci: kasir mengisi lebih dulu, sering sebelum omset harian ada. */
    const abs=Math.abs(tsel);
    document.getElementById('rc_pos').textContent=fmtRp(tp);
    document.getElementById('rc_act').textContent=fmtRp(ta);
    document.getElementById('rc_sel').textContent=fmtSel(tsel);
    document.getElementById('rc_box').style.background =
      tsel===0?'var(--ok-bg-t)' : abs<SELISIH_TOLERANSI?'var(--warn-bg-t)':'var(--danger-bg-t)';
    document.getElementById('rc_foot').innerHTML = tsel===0
      ? 'POS dan Actual cocok ✓'
      : abs<SELISIH_TOLERANSI
        ? `beda pembulatan (&lt; ${fmtRp(SELISIH_TOLERANSI)})`
        : tsel>0 ? 'uang lebih dari catatan mesin — cek metode yang selisihnya besar'
                 : 'uang kurang dari catatan mesin — cek metode yang selisihnya besar';
    return {tp,ta,sel:tsel,abs};
  };
  function inputVal(k,f){ const e=el.querySelector(`.rf[data-k="${k}"][data-f="${f}"]`); return e?e.value:0; }
  el.querySelectorAll('.rf').forEach(i=>i.addEventListener('input',hitung));
  document.getElementById('rp_save').addEventListener('click',()=>{
    const h=hitung();
    const box=document.getElementById('rp_err');
    const pay={};
    PAYS.forEach(p=>{ pay[p.k]={pos:num(inputVal(p.k,'pos')),actual:num(inputVal(p.k,'actual'))}; });
    DB.reports=DB.reports||{};
    DB.reports[repDate]={pay,by:CURRENT_USER?CURRENT_USER.name:'',at:Date.now(),submitted:true};
    save();
    box.innerHTML=`<div class="notice ok">✓ Report ${esc(dateLabel(repDate))} tersimpan${h.abs?` dengan selisih POS vs Actual ${fmtRp(h.abs)}`:''}.</div>`;
    setTimeout(()=>render(),700);
  });
  hitung();
}
function fmtWaktu(ts){ const d=new Date(ts); return isNaN(d)?'':d.toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); }

/* ============ 1c. COMPLIMENT ============
   Di luar kalkulasi metode pembayaran: ini catatan SIAPA yang merelakan omset
   dan untuk apa. PIC-nya ditarik dari akun Office ber-Tim/Keterangan
   Marketing/Office/Event, ditambah "Tamu" yang bukan orang — compliment untuk
   tamu umum tidak boleh membebani realisasi siapa pun. */
let compDate=todayISO();
let COMP_ROSTER=null, COMP_ROSTER_ERR='';
function ambilRoster(){
  if(COMP_ROSTER!==null) return Promise.resolve(COMP_ROSTER);
  return fetch('../account-api-mysql/api.php',{method:'POST',redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'listDivisiRoster'})})
    .then(r=>r.json())
    .then(j=>{
      if(!j||!j.ok||!Array.isArray(j.members)) throw new Error(j&&j.error||'balasan tidak dikenal');
      COMP_ROSTER=j.members.filter(u=>{
        if(u.active===false) return false;
        const ket=String(u.keterangan||'').toLowerCase().split(/[\s,;/]+/);
        return COMP_DIV.some(dv=>ket.indexOf(dv)>-1);
      }).map(u=>{
        const ket=String(u.keterangan||'').toLowerCase().split(/[\s,;/]+/);
        return {id:u.id,name:String(u.name||'').trim(),div:COMP_DIV.find(dv=>ket.indexOf(dv)>-1)||''};
      }).filter(u=>u.name);
      COMP_ROSTER_ERR='';
      return COMP_ROSTER;
    })
    .catch(e=>{ COMP_ROSTER_ERR=e.message||'gagal'; COMP_ROSTER=[]; return COMP_ROSTER; });
}
function compsOn(date){ return (DB.compliments||[]).filter(c=>c.date===date); }

function hapusCompliment(id){

/* Compliment memotong REALISASI PIC (keputusan 27 Juli 2026), bukan targetnya.
   Yang ber-PIC "Tamu" tidak memotong siapa pun. Pencocokan ke PIC kompas lewat
   officeUserId dulu — nama bisa berubah ejaannya di Office, id tidak. */
function compsBulan(monthKey){ return (DB.compliments||[]).filter(c=>monthKeyOf(c.date)===monthKey); }
/* Daftar compliment yang membebani satu PIC. Dipisah dari compPic() supaya
   halaman Performa bisa memajang rinciannya — angka potongan saja bikin PIC
   bertanya-tanya "dipotong apa", dan jawabannya cuma ada di halaman lain. */
function compListPic(monthKey, emp){
  if(!emp) return [];
  const nama=String(emp.name||'').trim().toLowerCase();
  return compsBulan(monthKey).filter(c=>{
    if(c.picDiv==='tamu') return false;
    if(emp.officeUserId && c.picOfficeId) return c.picOfficeId===emp.officeUserId;
    return String(c.picName||'').trim().toLowerCase()===nama;
  });
}
function compPic(monthKey, emp){
  return compListPic(monthKey, emp).reduce((s,c)=>s+num(c.nominal),0);
}
/* Kartu rincian compliment, dipakai bersama Performa Marketing/Event/Kasir.
   `judulPic` diisi saat menampilkan gabungan banyak PIC (segmen "Semua"),
   supaya ketahuan potongan itu milik siapa. */
function kartuCompliment(rows, pakaiKolomPic){
  const total=rows.reduce((s,c)=>s+num(c.nominal),0);
  if(!rows.length) return `<div class="card"><h3>Rincian Compliment</h3><div class="empty" style="padding:18px 10px">Tidak ada compliment yang membebani pada periode ini.</div></div>`;
  const baris=[...rows].sort((a,b)=>a.date<b.date?-1:1).map(c=>`<tr>
      <td>${esc(c.date)}</td>
      ${pakaiKolomPic?`<td>${esc(c.picName||'—')}</td>`:''}
      <td><b>${esc(c.nama||'—')}</b></td>
      <td>${esc(c.alasan||'—')}</td>
      <td class="num mono">${fmtRp(num(c.nominal))}</td>
    </tr>`).join('');
  return `<div class="card">
    <h3>Rincian Compliment</h3>
    <div class="card-sub">${rows.length} compliment senilai ${fmtRp(total)} — sudah dipotong dari Realisasi di atas.</div>
    <div class="tbl-wrap"><table>
      <thead><tr><th style="width:110px">Tanggal</th>${pakaiKolomPic?'<th>PIC</th>':''}<th>Compliment</th><th>Alasan</th><th class="num" style="width:130px">Nominal</th></tr></thead>
      <tbody>${baris}</tbody>
      <tfoot><tr style="font-weight:800;border-top:2px solid var(--line)"><td colspan="${pakaiKolomPic?4:3}">TOTAL POTONGAN</td><td class="num mono">${fmtRp(total)}</td></tr></tfoot>
    </table></div>
  </div>`;
}

/* ============ 2. BREAKDOWN SUMBER OMSET ============ */
let bdDate=null;

/* ---- Kalender kustom (bukan input type=date bawaan Chrome). Satu
   implementasi dipakai dua tempat, dibedakan lewat `key`:
     'in' → Tanggal di Input Omset Harian
     'bd' → Pilih Hari di Breakdown
   Semua tanggal terbuka; tanggal yang sudah ada omset diberi titik. */
const CAL_MON=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const CAL_REG={
  in:{ box:'i_cal',  get:()=>inputDate,          set:ds=>{ inputDate=ds; PERIOD=monthKeyOf(ds); } },
  bd:{ box:'bd_cal', get:()=>bdDate||todayISO(), set:ds=>{ bdDate=ds; } },
  rp:{ box:'rp_cal', get:()=>repDate,            set:ds=>{ repDate=ds; PERIOD=monthKeyOf(ds); } },
  cp:{ box:'cp_cal', get:()=>compDate,           set:ds=>{ compDate=ds; PERIOD=monthKeyOf(ds); } }
};
const CAL_ST={ in:{open:false,month:null}, bd:{open:false,month:null}, rp:{open:false,month:null}, cp:{open:false,month:null} };
function ymdLocal(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dateLabel(ds){ const d=new Date(ds+'T00:00:00'); return isNaN(d)?ds:d.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'short',year:'numeric'}); }
function paintCal(key){ const el=document.getElementById(CAL_REG[key].box); if(el) el.innerHTML=calInner(key); }
function calToggle(key){ const s=CAL_ST[key]; s.open=!s.open; if(s.open){ const [y,m]=CAL_REG[key].get().split('-').map(Number); s.month=new Date(y,m-1,1); } paintCal(key); }
function calNav(key,delta){ const s=CAL_ST[key]; if(!s.month) s.month=new Date(); s.month=new Date(s.month.getFullYear(),s.month.getMonth()+(+delta),1); paintCal(key); }
function calPickDay(key,ds){ CAL_ST[key].open=false; CAL_REG[key].set(ds); render(); }
function calQuick(key,off){ const d=new Date(); d.setDate(d.getDate()+off); calPickDay(key,ymdLocal(d)); }
function calInner(key){
  const st=CAL_ST[key], sel=CAL_REG[key].get()||todayISO();
  const btn=`<button type="button" class="calbtn" onclick="calToggle('${key}')"><span>📅 ${dateLabel(sel)}</span><span style="opacity:.55">▾</span></button>`;
  if(!st.open) return btn;
  if(!st.month){ const [yy,mm]=sel.split('-').map(Number); st.month=new Date(yy,mm-1,1); }
  const y=st.month.getFullYear(), mo=st.month.getMonth();
  const startDow=new Date(y,mo,1).getDay(), dim=new Date(y,mo+1,0).getDate(), prevDim=new Date(y,mo,0).getDate();
  const DOW=['MIN','SEN','SEL','RAB','KAM','JUM','SAB'];
  let cells='';
  for(let i=startDow-1;i>=0;i--) cells+=`<button class="calday off" disabled>${prevDim-i}</button>`;
  for(let dd=1;dd<=dim;dd++){
    const ds=`${y}-${String(mo+1).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
    const cls=['calday']; if(ds===todayISO())cls.push('today'); if(ds===sel)cls.push('sel'); if(getDay(ds))cls.push('caldata');
    cells+=`<button class="${cls.join(' ')}" onclick="calPickDay('${key}','${ds}')">${dd}</button>`;
  }
  return btn+`<div class="calback" onclick="calToggle('${key}')"></div><div class="calpop">
    <div class="calhead"><button class="calnav" onclick="calNav('${key}',-1)">‹</button><b>${CAL_MON[mo]} ${y}</b><button class="calnav" onclick="calNav('${key}',1)">›</button></div>
    <div class="calgrid">${DOW.map(d=>`<div class="caldow">${d}</div>`).join('')}${cells}</div>
    <div class="calquick"><button onclick="calPickDay('${key}','${todayISO()}')">Hari Ini</button><button onclick="calQuick('${key}',-1)">Kemarin</button><button onclick="calToggle('${key}')">Tutup</button></div>
  </div>`;
}

      <span class="divlabel mk">Section A — Marketing</span>

    </div>

  const state={mk:JSON.parse(JSON.stringify(d.bd.marketing)),ev:JSON.parse(JSON.stringify(d.bd.event)),ks:JSON.parse(JSON.stringify(kasirRows))};

  const mkSelect=(list,sel)=>list.map(e=>`<option value="${e.id}" ${e.id===sel?'selected':''}>${esc(e.name)}</option>`).join('');
  function drawMk(){

    bind('mkf','mk',drawMk);

    document.querySelectorAll('.mktk').forEach(c=>c.onchange=()=>{state.mk[+c.dataset.i].tiket=c.checked;c.parentElement.classList.toggle('on',c.checked);});
    document.querySelectorAll('.mkdel').forEach(b=>b.onclick=()=>{state.mk.splice(+b.dataset.i,1);drawMk();calc();});
    document.querySelectorAll('.mksisa').forEach(b=>b.onclick=()=>isiSisa('mk',+b.dataset.i));
    formatAllRp(document.getElementById('bd_mk'));
  }
  function drawEv(){
    document.getElementById('bd_ev').innerHTML=state.ev.map((r,i)=>`
      <div class="brow mk">
        <div class="field"><label>PIC Event</label><select data-i="${i}" data-f="picId" class="evf">${mkSelect(DB.employees.event,r.picId||DB.employees.event[0]?.id)}</select></div>
        <div class="field"><label>Nama Event</label><input data-i="${i}" data-f="eventName" class="evf" placeholder="cth. Live Music Anniversary" value="${esc(r.eventName||'')}"></div>
        <div class="field"><label>Nominal</label><input data-i="${i}" data-f="amount" class="evf mono rp" inputmode="numeric" value="${r.amount||0}"></div>
        <label class="tkbox${r.tiket?' on':''}" title="Centang jika omset ini berasal dari penjualan tiket"><input type="checkbox" class="evtk" data-i="${i}" ${r.tiket?'checked':''}> Ticketing</label>
        <div style="display:flex;gap:5px;margin-bottom:14px">
          <button type="button" class="btn btn-sm btn-ghost evsisa" data-i="${i}" title="Isi sisa omset yang belum dialokasikan ke sini">sisa</button>
          <button class="btn btn-danger btn-sm evdel" data-i="${i}">✕</button>
        </div>
      </div>`).join('')||'<div class="helper" style="margin-bottom:8px">Belum ada data event.</div>';
    bind('evf','ev',drawEv);
    document.querySelectorAll('.evtk').forEach(c=>c.onchange=()=>{state.ev[+c.dataset.i].tiket=c.checked;c.parentElement.classList.toggle('on',c.checked);});
    document.querySelectorAll('.evdel').forEach(b=>b.onclick=()=>{state.ev.splice(+b.dataset.i,1);drawEv();calc();});
    document.querySelectorAll('.evsisa').forEach(b=>b.onclick=()=>isiSisa('ev',+b.dataset.i));
    formatAllRp(document.getElementById('bd_ev'));
  }
  function drawKs(){
    document.getElementById('bd_ks').innerHTML=state.ks.map((r,i)=>`
      <div class="brow ks">
        <div class="field"><label>${esc(empName('kasir',r.kasirId))}</label><input data-i="${i}" data-f="amount" class="ksf mono rp" inputmode="numeric" value="${r.amount||0}" ${r.off?'disabled style="opacity:.5"':''}></div>
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:14px;cursor:pointer"><input type="checkbox" class="ksoff" data-i="${i}" ${r.off?'checked':''}> OFF (libur)</label>
        <button type="button" class="btn btn-sm btn-ghost kssisa" data-i="${i}" style="margin-bottom:14px" ${r.off?'disabled style="margin-bottom:14px;opacity:.4"':''} title="Isi sisa omset yang belum dialokasikan ke kasir ini">sisa</button>
      </div>`).join('')||'<div class="empty" style="padding:20px 10px">Belum ada kasir. Nama muncul otomatis setelah akun di Office diberi Tim/Keterangan <b>kasir</b>.</div>';
    document.querySelectorAll('.ksf').forEach(inp=>inp.oninput=()=>{state.ks[+inp.dataset.i].amount=num(inp.value);calc();});
    document.querySelectorAll('.ksoff').forEach(c=>c.onchange=()=>{const i=+c.dataset.i;state.ks[i].off=c.checked;if(c.checked)state.ks[i].amount=0;drawKs();calc();});
    document.querySelectorAll('.kssisa').forEach(b=>b.onclick=()=>isiSisa('ks',+b.dataset.i));
    formatAllRp(document.getElementById('bd_ks'));
  }
  function bind(cls,key,redraw){
    document.querySelectorAll('.'+cls).forEach(inp=>{
      inp.oninput=inp.onchange=()=>{const i=+inp.dataset.i,f=inp.dataset.f;state[key][i][f]=f==='amount'?num(inp.value):inp.value;calc();};
    });
  }
  function sumState(){ return state.mk.reduce((s,r)=>s+num(r.amount),0)+state.ev.reduce((s,r)=>s+num(r.amount),0)+state.ks.reduce((s,r)=>s+(r.off?0:num(r.amount)),0); }
  // Isi otomatis nominal yang BELUM dialokasikan (net − total field lain) ke satu
  // baris. Dipakai lewat tombol "sisa" begitu field lain sudah diisi.
  function isiSisa(key,i){
    const row=state[key][i]; if(!row || (key==='ks'&&row.off)) return;
    const cur = num(row.amount);
    row.amount = Math.max(0, net-(sumState()-cur));
    (key==='mk'?drawMk:key==='ev'?drawEv:drawKs)(); calc();
  }
  function calc(){
    const tot=sumState(), diff=net-tot, ok=Math.abs(diff)<1;
    document.getElementById('bd_balance').innerHTML=`
      <div class="bnums">
        <div class="bi">Total Breakdown<b class="mono">${fmtRp(tot)}</b></div>
        <div class="bi">Total Omset (net)<b class="mono">${fmtRp(net)}</b></div>
        <div class="bi">Selisih<b class="mono" style="color:${ok?'var(--ok)':'var(--danger)'}">${diff===0?'Rp0':(diff>0?'Kurang '+fmtRp(diff):'Lebih '+fmtRp(-diff))}</b></div>
      </div>
      <div style="display:flex;gap:10px;align-items:center">
        ${ok?'<span class="status ok"><span class="d"></span>Valid, siap disimpan</span>':'<span class="status bad"><span class="d"></span>Belum Balance</span>'}
        <button class="btn btn-primary" id="bd_save" ${ok?'':'disabled'}>Simpan Breakdown</button>
      </div>`;
    document.getElementById('bd_save').onclick=()=>{
      d.bd={marketing:state.mk,event:state.ev,kasir:state.ks};d.bdValid=true;save();render();
    };
  }
  // tiket:false ditulis eksplisit — baris tanpa field ini (data sebelum 28 Juli
  // 2026) juga dibaca sebagai non-ticketing, jadi keduanya konsisten.
  document.getElementById('add_mk').onclick=()=>{state.mk.push({picId:DB.employees.marketing[0]?.id,eventName:'',amount:0,tiket:false});drawMk();calc();};
  document.getElementById('add_ev').onclick=()=>{state.ev.push({picId:DB.employees.event[0]?.id,eventName:'',amount:0,tiket:false});drawEv();calc();};
  drawMk();drawEv();drawKs();calc();
}

      <div class="stat"><div class="lab">${selisih>0?'Harus Dikejar':'Surplus'}</div><div class="val sm mono">${fmtRp(Math.abs(selisih))}</div></div>

/* ============ 5. PERFORMA MARKETING / EVENT ============
   Report achievement bisa dikirim ke PIC-nya. Dua langkah, dan memang harus
   dua langkah: WhatsApp tidak bisa dititipi lampiran lewat tautan wa.me — yang
   bisa dikirim lewat tautan hanya TEKS. Jadi tombolnya memisahkan "simpan PDF"
   (dialog cetak browser → Save as PDF) dari "kirim WhatsApp" (ringkasan teks +
   chat PIC terbuka, lampirkan PDF-nya sendiri). Jangan digabung jadi satu
   tombol yang seolah-olah mengirim PDF otomatis — itu janji yang tidak bisa
   ditepati browser. */
let NOHP_OFFICE=null;
/* Peta nomor WhatsApp dari database user Office. Dikunci dua arah: lewat
   officeUserId (pasti) dan lewat nama huruf kecil (untuk PIC lama yang
   terlanjur tersimpan sebelum ada officeUserId). */
async function pastikanNoHp(){
  if(NOHP_OFFICE) return NOHP_OFFICE;
  const peta={id:{},nama:{}};
  try{
    const r=await fetch('../account-api-mysql/api.php',{method:'POST',redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'listDivisiRoster'})});
    const j=await r.json();
    if(j&&j.ok&&Array.isArray(j.members)) j.members.forEach(u=>{
      const no=String(u.noHp||'').trim(); if(!no) return;
      peta.id[u.id]=no;
      peta.nama[String(u.name||'').trim().toLowerCase()]=no;
    });
  }catch(e){ /* Office diam → peta kosong, tombolnya yang menjelaskan */ }
  NOHP_OFFICE=peta;
  return peta;
}
function noHpPic(e,peta){
  return (e.officeUserId&&peta.id[e.officeUserId]) ||
         peta.nama[String(e.name||'').trim().toLowerCase()] || '';
}
/* 08xx → 628xx. wa.me menolak nomor berawalan 0. */
function waLink(no,msg){
  let n=String(no||'').replace(/\D/g,'');
  if(n.startsWith('0')) n='62'+n.slice(1);
  return 'https://wa.me/'+n+(msg?('?text='+encodeURIComponent(msg)):'');
}
function labelPeriode(mk){
  const [y,m]=String(mk).split('-');
  const d=new Date(Number(y),Number(m)-1,1);
  return isNaN(d)?mk:d.toLocaleDateString('id-ID',{month:'long',year:'numeric'});
}

function pesanAchievement(divi,e,a,ach){
  const baris=[
    `*Report Achievement — ${e.name}*`,
    `Performa ${divi==='marketing'?'Marketing':'Event'} · ${labelPeriode(PERIOD)}`,
    '',
    `Target      : ${fmtRp(e.target)}`,
    `Realisasi   : ${fmtRp(a.real)}`,
    `Achievement : ${ach.toFixed(0)}% (${a.real>=e.target?'ACHIEVE':'belum achieve'})`,
    `Jumlah event: ${a.events.length}`,
    `  • Ticketing     : ${fmtRp(a.events.filter(x=>x.tiket).reduce((s,x)=>s+x.amount,0))} (${a.events.filter(x=>x.tiket).length} event)`,
    `  • Non-Ticketing : ${fmtRp(a.events.filter(x=>!x.tiket).reduce((s,x)=>s+x.amount,0))} (${a.events.filter(x=>!x.tiket).length} event)`
  ];
  if(a.comp) baris.push(`Catatan     : realisasi sudah dipotong compliment ${fmtRp(a.comp)}`);
  if(a.real<e.target) baris.push(`Kurang      : ${fmtRp(e.target-a.real)} lagi untuk capai target`);
  baris.push('', 'Rincian lengkapnya menyusul dalam lampiran PDF.');
  return baris.join('\n');
}
function viewPerforma(divi){
  const el=document.getElementById('app-view');
  const days=daysOfMonth(PERIOD);
  const list=DB.employees[divi];
  const agg={};
  list.forEach(e=>agg[e.id]={real:0,events:[]});
  days.forEach(d=>{(d.bd?.[divi]||[]).forEach(r=>{if(agg[r.picId]){agg[r.picId].real+=num(r.amount);agg[r.picId].events.push({date:d.date,name:r.eventName,amount:num(r.amount),tiket:!!r.tiket});}});});
  // Compliment memotong realisasi PIC penanggungnya (yang ber-PIC "Tamu" tidak).
  // Barisnya ikut disimpan, bukan cuma totalnya, supaya bisa dirinci di bawah.
  list.forEach(e=>{
    const cr=compListPic(PERIOD,e);
    agg[e.id].compRows=cr;
    agg[e.id].comp=cr.reduce((s,c)=>s+num(c.nominal),0);
    agg[e.id].real-=agg[e.id].comp;
  });
  const seg='<button class="active" data-pic="__all__">🧮 Semua</button>'+list.map(e=>`<button data-pic="${e.id}">${esc(e.name)}</button>`).join('');
  el.innerHTML=`
    <div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap">
      <div><h3>Report Achievement</h3><div class="card-sub" id="pf_ket">Simpan sebagai PDF, lalu kirim ke PIC lewat WhatsApp.</div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-ghost" id="pf_pdf">📄 Simpan PDF</button>
        <button class="btn btn-primary" id="pf_wa">💬 Kirim ke PIC</button>
      </div>
    </div>
    <div id="pf_wa_err"></div>
    <div class="seg" id="pf_seg">${seg}</div><div id="pf_body"></div>`;
  /* PIC yang sedang ditampilkan. Tombol cetak/WA ada DI LUAR #pf_body supaya
     tidak perlu dipasang ulang tiap ganti segmen, jadi datanya dititipkan ke
     sini oleh drawPic. */
  let SEL=null;
  const drawPic=pid=>{
    let e,a;
    if(pid==='__all__'){
      e={name:'Semua PIC', target:list.reduce((s,x)=>s+num(x.target),0)};
      a={real:0,events:[],comp:0,compRows:[]};
      list.forEach(x=>{const g=agg[x.id];if(!g)return;a.real+=g.real;a.comp+=(g.comp||0);(g.compRows||[]).forEach(c=>a.compRows.push(c));g.events.forEach(ev=>a.events.push(Object.assign({pic:x.name},ev)));});
    } else { e=list.find(x=>x.id===pid); a=agg[pid]; }
    if(!e||!a) return;
    const ach=pct(a.real,e.target), cnt=a.events.length, avg=cnt>0?a.real/cnt:0;
    const top=[...a.events].sort((x,y)=>y.amount-x.amount)[0];
    SEL={e,a,ach,semua:pid==='__all__'};
    aturTombolKirim();
    /* Pemisahan ticketing vs non-ticketing. Realisasi & achievement tetap
       memakai TOTAL keduanya — pemisahan ini baru soal tampilan. */
    const evTk=a.events.filter(ev=>ev.tiket), evNon=a.events.filter(ev=>!ev.tiket);
    const realTk=evTk.reduce((s,x)=>s+x.amount,0), realNon=evNon.reduce((s,x)=>s+x.amount,0);
    const rows=[...a.events].sort((x,y)=>x.date<y.date?-1:1).map(ev=>`<tr><td>${ev.date}</td><td>${esc(ev.name||'—')}${ev.pic?` <span class="muted" style="font-size:11px">· ${esc(ev.pic)}</span>`:''}</td><td>${ev.tiket?'<span class="chip info">Ticketing</span>':'<span class="chip mute">Non-Ticketing</span>'}</td><td class="num mono">${fmtRp(ev.amount)}</td></tr>`).join('');
    document.getElementById('pf_body').innerHTML=`
      <div class="grid g4">
        <div class="stat accent"><div class="lab">Target Bulanan</div><div class="val sm mono">${fmtRp(e.target)}</div></div>
        <div class="stat"><div class="lab">Realisasi</div><div class="val sm mono">${fmtRp(a.real)}</div><div class="foot">${a.comp?`sudah dipotong compliment ${fmtRp(a.comp)}`:'tanpa potongan compliment'}</div></div>
        <div class="stat"><div class="lab">Achievement</div><div class="val sm">${ach.toFixed(0)}%</div><div class="foot">${a.real>=e.target?'<span class="chip ok">Achieve</span>':'<span class="chip bad">Belum</span>'}</div></div>
        <div class="stat"><div class="lab">Jumlah Event</div><div class="val sm">${cnt}</div><div class="foot">avg ${fmtRp(avg)}/event</div></div>
      </div>
      <div class="card"><div class="prog ${a.real>=e.target?'ok':''}"><i style="width:${Math.min(ach,100)}%"></i></div><div class="foot" style="margin-top:8px;font-size:12.5px;color:var(--muted)">${top?('Top event: <b>'+esc(top.name||'—')+'</b> · '+fmtRp(top.amount)):'Belum ada event.'}</div></div>
      <div class="grid g2">
        <div class="stat"><div class="lab">Ticketing</div><div class="val sm mono">${fmtRp(realTk)}</div><div class="foot">${evTk.length} event · ${pct(realTk,realTk+realNon).toFixed(0)}% dari omset event</div></div>
        <div class="stat"><div class="lab">Non-Ticketing</div><div class="val sm mono">${fmtRp(realNon)}</div><div class="foot">${evNon.length} event · ${pct(realNon,realTk+realNon).toFixed(0)}% dari omset event</div></div>
      </div>
      <div class="grid g2" style="align-items:start">
        <div class="card"><h3>Omset per Event</h3><div class="chart-box sm"><canvas id="pf_chart"></canvas></div></div>
        <div class="card"><h3>Daftar Event</h3><div class="card-sub">${cnt} event bulan ini</div><div class="tbl-wrap"><table><thead><tr><th>Tanggal</th><th>Nama Event</th><th>Jenis</th><th class="num">Nominal</th></tr></thead><tbody>${rows||'<tr><td colspan="4" class="empty">Belum ada event.</td></tr>'}</tbody></table></div></div>
      </div>
      ${kartuCompliment(a.compRows||[], pid==='__all__')}`;
    clearChartsExcept();
    if(cnt){
      const evs=[...a.events].sort((x,y)=>y.amount-x.amount).slice(0,8);
      charts.push(new Chart(document.getElementById('pf_chart'),{type:'bar',data:{labels:evs.map(x=>x.name||x.date),datasets:[{data:evs.map(x=>x.amount),backgroundColor:divi==='marketing'?'#2F7FC4':'#7C5FC0',borderRadius:5}]},options:barOpts(true)}));
    } else emptyCanvas('pf_chart','Belum ada event');
  };
  /* "Semua PIC" bukan orang, jadi tidak punya nomor WhatsApp — tombol kirim
     dimatikan, bukan disembunyikan, supaya jelas kenapa tidak bisa diklik. */
  function aturTombolKirim(){
    const wa=document.getElementById('pf_wa'), ket=document.getElementById('pf_ket');
    if(!wa||!SEL) return;
    wa.disabled=SEL.semua;
    wa.style.opacity=SEL.semua?'.45':'';
    wa.style.cursor=SEL.semua?'not-allowed':'';
    wa.title=SEL.semua?'Pilih satu PIC dulu — "Semua" tidak punya nomor tujuan':'';
    if(ket) ket.textContent=SEL.semua
      ? 'Rekap semua PIC bisa disimpan PDF. Untuk mengirim ke WhatsApp, pilih satu PIC dulu.'
      : `Report ${SEL.e.name} — simpan sebagai PDF, lalu kirim ke WhatsApp-nya.`;
  }
  document.getElementById('pf_pdf').onclick=()=>{
    if(SEL) cetakAchievement(divi,SEL.e,SEL.a,SEL.ach);
  };
  document.getElementById('pf_wa').onclick=async()=>{
    if(!SEL||SEL.semua) return;
    const box=document.getElementById('pf_wa_err');
    box.innerHTML='<div class="notice info">Mengambil nomor WhatsApp dari database user…</div>';
    const peta=await pastikanNoHp();
    const no=noHpPic(SEL.e,peta);
    if(!no){
      box.innerHTML=`<div class="notice warn">⚠ Nomor WhatsApp <b>${esc(SEL.e.name)}</b> belum terdaftar. Isi <b>No. HP</b> pada akun yang bersangkutan di <b>Office → Kelola User</b>, lalu muat ulang halaman ini.</div>`;
      return;
    }
    box.innerHTML=`<div class="notice ok">✓ Chat ${esc(SEL.e.name)} (${esc(no)}) dibuka di tab baru. Ringkasannya sudah terisi — lampirkan PDF-nya sendiri, karena tautan WhatsApp tidak bisa membawa berkas.</div>`;
    window.open(waLink(no,pesanAchievement(divi,SEL.e,SEL.a,SEL.ach)),'_blank');
  };
  document.querySelectorAll('#pf_seg button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#pf_seg button').forEach(x=>x.classList.remove('active'));b.classList.add('active');drawPic(b.dataset.pic);});
  if(list.length)drawPic('__all__');
  else{
    document.getElementById('pf_body').innerHTML='<div class="card"><div class="empty">Belum ada PIC. Muncul otomatis dari Tim/Keterangan di Office.</div></div>';
    // Tanpa PIC tidak ada yang bisa dicetak maupun dikirim.
    document.getElementById('pf_pdf').closest('.card').style.display='none';
  }
}

/* ============ 7. SUMMARY / RANKING ============ */
function viewSummary(){
  const el=document.getElementById('app-view');
  const days=daysOfMonth(PERIOD);
  /* Realisasi SUDAH dikurangi compliment yang jadi tanggungan PIC itu, supaya
     ranking di sini memakai angka yang sama dengan halaman Performa. */
  const realBy=(divi,id)=>{
    let s=0;days.forEach(d=>(d.bd?.[divi]||[]).forEach(r=>{const key=divi==='kasir'?r.kasirId:r.picId;if(key===id&&!r.off)s+=num(r.amount);}));
    return s-compPic(PERIOD,(DB.employees[divi]||[]).find(e=>e.id===id));
  };
  const mkTable=(divi,list)=>{
    const rows=list.map(e=>{const real=realBy(divi,e.id),ach=pct(real,e.target);return{e,real,ach};}).sort((a,b)=>b.ach-a.ach);
    return rows.map(r=>`<tr><td><b>${esc(r.e.name)}</b></td><td class="num mono">${fmtRp(r.e.target)}</td><td class="num mono">${fmtRp(r.real)}</td><td class="num">${r.ach.toFixed(0)}%</td><td>${r.real>=r.e.target?'<span class="chip ok">Achieve</span>':'<span class="chip bad">Belum</span>'}</td></tr>`).join('');
  };
  const all=[];
  [['marketing','Marketing'],['event','Event'],['kasir','Kasir']].forEach(([divi,lab])=>DB.employees[divi].forEach(e=>{const real=realBy(divi,e.id);all.push({name:e.name,div:lab,ach:pct(real,e.target),real,target:e.target});}));
  all.sort((a,b)=>b.ach-a.ach);
  const lb=all.map((r,i)=>`<div class="leader ${i===0?'top1':''}"><div class="rank">${i+1}</div><div><div class="ln">${esc(r.name)} <span class="pill" style="margin-left:4px">${r.div}</span></div><div class="lm">${fmtRp(r.real)} / ${fmtRp(r.target)}</div></div><div class="lspace"></div><div style="text-align:right"><div class="ln">${r.ach.toFixed(0)}%</div><div class="lm">${r.real>=r.target?'Achieve':'Belum'}</div></div></div>`).join('');
  el.innerHTML=`
    <div class="card"><h3>🏆 Top Performer Bulanan</h3><div class="card-sub">Leaderboard berdasarkan persentase achievement</div>${lb||'<div class="empty">Belum ada data.</div>'}</div>
    <div class="card"><span class="divlabel mk">Marketing</span><div class="tbl-wrap"><table><thead><tr><th>Nama</th><th class="num">Target</th><th class="num">Realisasi</th><th class="num">Ach</th><th>Status</th></tr></thead><tbody>${mkTable('marketing',DB.employees.marketing)}</tbody></table></div></div>
    <div class="card"><span class="divlabel ev">Event</span><div class="tbl-wrap"><table><thead><tr><th>Nama</th><th class="num">Target</th><th class="num">Realisasi</th><th class="num">Ach</th><th>Status</th></tr></thead><tbody>${mkTable('event',DB.employees.event)}</tbody></table></div></div>
    <div class="card"><span class="divlabel ks">Kasir</span><div class="tbl-wrap"><table><thead><tr><th>Nama</th><th class="num">Target</th><th class="num">Realisasi</th><th class="num">Ach</th><th>Status</th></tr></thead><tbody>${mkTable('kasir',DB.employees.kasir)}</tbody></table></div></div>`;
}

  };
  function divCard(divi,label,cls){
    const rows=DB.employees[divi].map(e=>`<tr><td><b>${esc(e.name)}</b></td><td class="num"><input class="mono rp" id="tg_${e.id}" inputmode="numeric" value="${e.target}" style="width:180px;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;text-align:right"></td></tr>`).join('');
    return `<div class="card"><span class="divlabel ${cls}">${label}</span><div class="card-sub">Target bulanan masing-masing PIC. Nama datang otomatis dari Office.</div>
      <div class="tbl-wrap"><table><thead><tr><th>Nama</th><th class="num">Target Bulanan (Rp)</th></tr></thead><tbody>${rows||'<tr><td colspan="2" class="empty">Belum ada — muncul otomatis setelah kru diberi Tim/Keterangan di Office.</td></tr>'}</tbody></table></div>
    </div>`;
  }
}

/* Sinkron PIC dari Office OTOMATIS (tanpa PIN) berdasarkan Tim/Keterangan.
   Memakai listDivisiRoster — endpoint terbuka yang hanya membalas nama +
   keterangan. Kru yang timnya Marketing/Event/Kasir ditambahkan ke daftar PIC
   divisi yang sesuai. NON-DESTRUKTIF: cuma menambah yang belum ada (cocok
   officeUserId atau nama), target & PIC manual tidak disentuh. Dijalankan
   diam-diam saat modul dibuka. */
async function syncPicOffice(){
  if(!DB) return;
  try{
    const r=await fetch('../account-api-mysql/api.php',{method:'POST',redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'listDivisiRoster'})});
    const j=await r.json();
    if(!j||!j.ok||!Array.isArray(j.members)) return;
    let changed=false;
    ['marketing','event','kasir'].forEach(divi=>{
      j.members.forEach(u=>{
        if(u.active===false) return;
        const ket=String(u.keterangan||'').toLowerCase().split(/[\s,;/]+/);
        if(ket.indexOf(divi)<0) return;                 // kata divisi utuh
        const nama=String(u.name||'').trim(); if(!nama) return;
        const ada=DB.employees[divi].some(e=>e.officeUserId===u.id || String(e.name||'').trim().toLowerCase()===nama.toLowerCase());
        if(!ada){ DB.employees[divi].push({id:divi[0]+Date.now().toString(36)+Math.floor(Math.random()*1e4),name:nama,target:0,officeUserId:u.id}); changed=true; }
      });
    });
    if(changed){ save(); if(CURRENT==='target') render(); }
  }catch(e){ /* Office diam → biarkan; PIC yang sudah tersimpan tetap ada */ }
}

/* ============ KELOLA AKSES KRU ============
   Daftar siapa saja yang PUNYA akses modul kompas, ditarik dari database
   account lewat `listModuleRoster` — endpoint TANPA gerbang PIN (identitas
   sudah dijamin sesi Office). Read-only: menambah/menghapus akses dilakukan
   di "Kelola Akses" milik Office, bukan di sini. */
let AKSES_ROSTER=null, AKSES_ERR='';
async function muatAkses(){
  const stop=new AbortController(); const jam=setTimeout(()=>stop.abort(),8000);
  try{
    const r=await fetch('../account-api-mysql/api.php',{method:'POST',redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'listModuleRoster',module:'kompas'}),signal:stop.signal});
    clearTimeout(jam);
    const t=await r.text(); let j=null; try{ j=JSON.parse(t); }catch(e){}
    if(!j) throw new Error('Office membalas bukan JSON (account-api-mysql belum terpasang?)');
    if(!j.ok) throw new Error(j.error||'ditolak');
    if(!Array.isArray(j.members)) throw new Error('balasan tanpa daftar anggota');
    AKSES_ROSTER=j.members; AKSES_ERR='';
  }catch(e){ clearTimeout(jam); AKSES_ROSTER=null; AKSES_ERR=(e.name==='AbortError'?'Office tidak menjawab dalam 8 detik':e.message); }
  if(CURRENT==='akses') viewAkses();
}
function viewAkses(){
  const el=document.getElementById('app-view');
  const meNama=(CURRENT_USER&&CURRENT_USER.name)||'';
  const initial=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase();
  if(AKSES_ROSTER===null && !AKSES_ERR){
    el.innerHTML=`<div class="card"><div class="empty"><div class="big">⏳</div>Memuat daftar akses dari Office…</div></div>`;
    muatAkses(); return;
  }
  const rows=(AKSES_ROSTER||[]).slice().sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')));
  el.innerHTML=`
    <div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap">
      <div><h3>Pemegang Akses Modul Kompas</h3><div class="card-sub" style="margin:0">Ditarik dari database Office. Menambah/menghapus akses dan menaikkan level dilakukan di <b>Kelola Akses</b> milik Office, bukan di sini.</div></div>
      <button class="btn btn-ghost btn-sm" onclick="AKSES_ROSTER=null;AKSES_ERR='';viewAkses()">↻ Segarkan</button>
    </div>
    <div class="notice info">🔑 <div><b>Dua level tampilan.</b>
      <b>Operasional</b> hanya melihat grup menu Operasional (Input Omset, Report Daily, Compliment, Breakdown) — cocok untuk kasir.
      <b>Super Admin</b> melihat semuanya: Operasional, Dashboard, Performa, dan Sistem.
      Levelnya mengikuti status <b>admin modul</b> di Office: kru yang dijadikan admin Kompas (atau admin global) otomatis Super Admin, selain itu Operasional.</div></div>
    ${AKSES_ERR?`<div class="notice bad">⚠ Gagal memuat: ${esc(AKSES_ERR)}</div>`:`
    <div class="card" style="padding:0;overflow:hidden">
      <div class="tbl-wrap"><table>
        <thead><tr><th>Nama</th><th>Tim / Keterangan</th><th>Status</th><th>Level Tampilan</th></tr></thead>
        <tbody>${rows.length?rows.map(m=>{const penuh=!!m.isModuleAdmin;return `<tr>
          <td><div style="display:flex;align-items:center;gap:10px">
            <span style="width:30px;height:30px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--gold-2),var(--gold-dim));color:#fff;font-weight:800;font-size:11px">${esc(initial(m.name))}</span>
            <b>${esc(m.name||'(tanpa nama)')}</b>${meNama&&String(m.name||'').toLowerCase()===meNama.toLowerCase()?' <span class="chip info" style="margin-left:4px">kamu</span>':''}</div></td>
          <td class="muted" style="font-size:12.5px">${esc(m.keterangan||'—')}</td>
          <td>${m.active===false?'<span class="chip warn">nonaktif</span>':'<span class="muted" style="font-size:12px">—</span>'}</td>
          <td>${penuh?'<span class="chip ok">Super Admin — semua menu</span>':'<span class="chip info">Operasional saja</span>'}</td>
        </tr>`;}).join(''):`<tr><td colspan="4" class="empty">Belum ada kru dengan akses modul Kompas. Beri akses lewat Kelola Akses di Office.</td></tr>`}</tbody>
      </table></div>
    </div>
    <div class="foot" style="font-size:12px;color:var(--muted);margin-top:2px">${rows.length} kru memegang akses Kompas · ${rows.filter(m=>m.isModuleAdmin).length} di antaranya Super Admin.</div>`}`;
}

/* ---- chart option factories ---- */
const money=v=>fmtRpShort(v);
function lineOpts(){return{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top',labels:{font:{family:'Inter'},boxWidth:12}}},scales:{y:{ticks:{callback:money,font:{family:'Inter'}}},x:{ticks:{font:{family:'Inter'}}}}};}
function barOpts(horizontal){return{indexAxis:horizontal?'y':'x',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{[horizontal?'x':'y']:{ticks:{callback:money,font:{family:'Inter'}}},[horizontal?'y':'x']:{ticks:{font:{family:'Inter'}}}}};}
function pieOpts(){return{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{font:{family:'Inter'},boxWidth:12,padding:10}},tooltip:{callbacks:{label:c=>c.label+': '+fmtRp(c.raw)}}}};}

/* ---- init: muat dari server, lalu jalankan ---- */
function boot(){
  CURRENT_USER=bacaSesi();
  if(!CURRENT_USER){ location.replace('../'); return; }
  const av=document.getElementById('suAvatar'), nm=document.getElementById('suName');
  if(av) av.textContent=(String(CURRENT_USER.name||'?').trim()[0]||'?').toUpperCase();
  if(nm) nm.textContent=CURRENT_USER.name||'—';
  pasangMenu();   // sembunyikan grup menu di luar level user SEBELUM halaman digambar
  setSync('load');
  render();   // tampilkan status "memuat"
  apiGet().then(data=>{
    DB=normalizeDB(data);
    setSync('ok');
    PERIOD=DB.daily.length?monthKeyOf(DB.daily[DB.daily.length-1].date):monthKeyOf(todayISO());
    inputDate=todayISO();
    const dibersihkan=purgeSeedKasir(DB);   // buang PIC contoh "Kasir 1/2/3"
    go('input');
    if(dibersihkan) save();
    syncPicOffice();   // tarik PIC per divisi dari Office (otomatis, tanpa PIN)
  }, err=>{
    // Jaringan gagal → pakai salinan lokal kalau ada, biar tetap bisa dilihat.
    let cache=null; try{ cache=JSON.parse(localStorage.getItem(CACHE_KEY)||'null'); }catch(e){}
    DB=normalizeDB(cache||seed());
    setSync('err','Offline — memakai salinan lokal, perubahan akan disinkronkan saat online');
    PERIOD=DB.daily.length?monthKeyOf(DB.daily[DB.daily.length-1].date):monthKeyOf(todayISO());
    purgeSeedKasir(DB);   // rapikan tampilan; simpannya nanti saat online
    go('input');
  });
}
boot();
</script>
