        'title="'+esc(e.jenis+' — '+e.title)+(e.geser?' (seret untuk pindah tanggal)':'')+'">'+esc(e.title)+'</span>';

/* ============ KRU BD ============
   TIDAK ADA tombol "tambah kru" di sini, dan itu disengaja. Siapa yang boleh
   masuk BD OS ditentukan di Office (Kelola Akses), bukan di modul ini —
   memberi modul ini tombol tambah berarti membuat daftar kedua yang bisa
   berbeda dari daftar akses sesungguhnya, dan yang lebih buruk: mengundang
   orang mengira menambah nama di sini sudah memberi orang itu akses. */
function vTim(){
  var h=head('Kru BD',SUB.tim[2],
    '<button class="btn" onclick="APP.segarkanKru()">'+ic('refresh')+'Segarkan dari Office</button>');

  h+='<div class="notice">Daftar ini datang dari <b>database account</b> — isinya '+
    'persis pemegang hak akses modul <code>bd</code>. Menambah/menghapus orang dilakukan di '+
    '<b>Kelola Akses</b> di Office, bukan di sini. Yang diatur di halaman ini hanya '+
    '<b>jabatan, divisi, dan atasan</b>, karena tiga hal itu tidak dikenal Office — '+
    'padahal atasanlah yang menentukan siapa melihat task siapa.</div>';

  if(!DB.people.length) return h+'<div class="card"><div class="card-b">'+
    kosong('Belum ada kru dengan akses modul ini',
      'Beri akses modul `bd` lewat Kelola Akses di Office, lalu tekan Segarkan.')+'</div></div>';

  var byBoss={};
  DB.people.forEach(function(p){ (byBoss[p.boss||'']=byBoss[p.boss||'']||[]).push(p); });
  var baris=[];
  /* Digambar berjenjang (atasan dulu, anak buah menjorok) supaya struktur
     yang menentukan visibilitas task terlihat, bukan cuma daftar nama. */
  (function gambar(bossId,level){
    (byBoss[bossId]||[]).forEach(function(p){
      baris.push({p:p,level:level});
      gambar(p.id,level+1);
    });
  })('',0);
  /* Kru yang atasannya menunjuk id yang sudah tidak ada tidak boleh hilang
     dari layar — justru merekalah yang perlu dibetulkan. */
  DB.people.forEach(function(p){
    if(!baris.some(function(b){return b.p.id===p.id;})) baris.push({p:p,level:0,yatim:true});
  });

  return h+'<div class="tw"><table><thead><tr><th>Nama</th><th>Jabatan</th><th>Divisi</th><th>Atasan</th>'+
    '<th>Task aktif</th><th>Akses</th><th></th></tr></thead><tbody>'+
    baris.map(function(b){
      var p=b.p;
      var nAktif=DB.tasks.filter(function(t){return punyaPic(t,p.id)&&!selesai(t);}).length;
      var nLewat=DB.tasks.filter(function(t){return punyaPic(t,p.id)&&lewat(t);}).length;
      var akses = p.tanpaAkses ? pill('dicabut','p-bad')
                : (p.active===false ? pill('nonaktif','p-mute') : pill('aktif','p-go'));
      return '<tr class="clk" onclick="APP.orangModal(\''+p.id+'\')">'+
        '<td style="padding-left:'+(13+b.level*18)+'px"><span class="mini-av" style="margin-right:8px">'+esc(inisial(p.name))+'</span>'+
          '<span class="nm">'+esc(p.name)+'</span>'+(AKU&&AKU.id===p.id?' '+pill('kamu','p-gold'):'')+'</td>'+
        '<td><span class="mut">'+esc(p.role||'—')+'</span></td>'+
        '<td>'+(p.div?tagDiv(p.div):'<span class="mut">belum diatur</span>')+'</td>'+
        '<td><span class="mut">'+esc(p.boss?P(p.boss).name:(b.yatim?'(atasan tidak ditemukan)':'—'))+'</span></td>'+
        '<td><span class="num">'+nAktif+'</span>'+(nLewat?' '+pill(nLewat+' lewat','p-bad'):'')+'</td>'+
        '<td>'+akses+'</td>'+
        /* Tombol hapus HANYA untuk baris yang aksesnya sudah dicabut DAN tidak
           lagi memegang pekerjaan apa pun. Selama masih ada task atas namanya,
           menghapus berarti membuang jejak siapa mengerjakan apa. */
        '<td>'+((p.tanpaAkses&&!nAktif)?'<button class="iconbtn" title="Hapus dari daftar" '+
          'onclick="event.stopPropagation();APP.hapusOrang(\''+p.id+'\')">'+ic('trash')+'</button>':'')+'</td></tr>';
    }).join('')+'</tbody></table></div>';
}

function simpanOrang(id){
  var g=function(x){return document.getElementById(x);};
  var orang=DB.people.find(function(x){return x.id===id;});
  if(!orang) return;
  var boss=g('k_boss').value;
  /* Cegah lingkaran atasan (A atasan B, B atasan A). Tanpa penjagaan ini,
     bawahan() memanggil dirinya tanpa henti dan seluruh halaman membeku —
     bukan pesan error, cuma tab yang mati. */
  if(boss){
    var jalan=boss, langkah=0;
    while(jalan&&langkah++<200){
      if(jalan===id){ toast('Atasan melingkar — orang ini sudah jadi atasan dari kru tersebut.'); return; }
      var nx=DB.people.find(function(x){return x.id===jalan;});
      jalan=nx?nx.boss:'';
    }
  }
  // Hanya tiga field milik BD OS yang ditulis. name/active/tanpaAkses sengaja
  // tidak disentuh — pemiliknya database account.
  orang.role=g('k_role').value.trim();
  orang.div =g('k_div').value;
  orang.boss=boss;
  save(); closeModal(); kenali(); render(); toast('Data kru diperbarui');
}
function hapusOrang(id){
  var dipakai=DB.tasks.filter(function(t){return punyaPic(t,id);}).length
             +DB.projects.filter(function(p){return punyaPic(p,id);}).length
             +DB.po.filter(function(p){return p.pic===id;}).length
             +DB.routines.filter(function(r){return r.pic===id;}).length;
  /* Menghapus kru yang masih memegang pekerjaan membuat barisnya jadi PIC "—"
     yang tidak bisa ditelusuri lagi. Halaman Kru hanya menampilkan tombol ini
     untuk baris yang aksesnya dicabut DAN tidak memegang task aktif, tapi
     pemeriksaannya diulang di sini: yang menghitung task aktif saja bisa
     meloloskan orang yang masih tercatat di project/PO/routine. */
  if(dipakai){
    toast('Tidak bisa dihapus — masih tercatat sebagai PIC di '+dipakai+' baris.');
    return;
  }
  if(!confirm('Hapus '+P(id).name+' dari daftar kru BD?\n\n'+
    'Ini tidak mencabut apa pun di Office. Kalau akses modulnya diberikan lagi, '+
    'barisnya akan muncul kembali saat disegarkan.')) return;
  DB.people=DB.people.filter(function(p){return p.id!==id;});
  DB.people.forEach(function(p){ if(p.boss===id) p.boss=''; });
  save(); closeModal(); kenali(); render(); toast('Kru dihapus dari daftar BD');
}

/* ============ CARI ============
   Pencarian ringan: menyaring apa yang sedang tampil terasa ajaib tapi
   membingungkan (kenapa papan Eisenhower tiba-tiba kosong?). Jadi yang
   dilakukan adalah melompat ke hal yang paling cocok. */
var _cariTimer=null;
function cari(q){
  clearTimeout(_cariTimer);
  _cariTimer=setTimeout(function(){
    q=String(q||'').trim().toLowerCase();
    if(q.length<3) return;
    var p=DB.projects.find(function(x){return String(x.name).toLowerCase().indexOf(q)>-1;});
    if(p){ bukaProject(p.id); return; }
    var t=DB.tasks.find(function(x){return String(x.name).toLowerCase().indexOf(q)>-1;});
    if(t){ taskModal(t.id); return; }
    var o=DB.po.find(function(x){return String(x.item).toLowerCase().indexOf(q)>-1;});
    if(o){ poModal(o.id); }
  },420);
}

    else if(apa==='div')fDiv=nilai; else if(apa==='proj')fProj=nilai;

    render();
  },
  projModal:projModal, simpanProj:simpanProj, hapusProj:hapusProj,
  togglePic:function(el){ el.classList.toggle('on'); },
  /* Pemformat rupiah sambil mengetik. Posisi kursor dijaga dengan MENGHITUNG
     DIGIT sebelum kursor, bukan menyimpan indeksnya: menyisipkan satu titik
     pemisah menggeser semua indeks di belakangnya, dan kursor yang melompat
     ke ujung tiap ketikan membuat angka mustahil dikoreksi di tengah. */
  fmtRp:function(el){
    var digitSebelum=String(el.value).slice(0,el.selectionStart).replace(/\D/g,'').length;
    var digit=String(el.value).replace(/\D/g,'').replace(/^0+(?=\d)/,'').slice(0,15);
    el.value = digit ? (+digit).toLocaleString('id-ID') : '';
    var i=0,n=0;
    while(i<el.value.length && n<digitSebelum){ if(el.value.charCodeAt(i)>=48&&el.value.charCodeAt(i)<=57) n++; i++; }
    el.selectionStart=el.selectionEnd=i;
  },
  filterProj:function(apa,nilai){
    if(apa==='reset'){ pScope='tim'; pDiv=''; fPics=[]; }
    else if(apa==='scope') pScope=nilai;
    else if(apa==='div')   pDiv=nilai;
    render();

     keadaan dan satu penyetel. */
  togglePicFilter:function(id){
    if(!id){ fPics=[]; }
    else{
      var i=fPics.indexOf(id);
      if(i>-1) fPics.splice(i,1); else fPics.push(id);
    }
    render();

      tr.querySelector('.q-unit').value='Unit';

      return;
    }
    tr.remove(); nomoriBarisReq();
  },
  buatPr:buatPr, bukaPr:bukaPr, hapusPr:hapusPr, prModal:prModal, simpanPr:simpanPr,
  setPrArsip:function(v){ prLihatArsip=!!v; render(); },
  /* Centang TIDAK memicu render ulang — halaman yang menggambar ulang dirinya
     tiap centang akan menggulung balik ke atas dan menghapus pilihan yang
     sedang disusun. Yang diperbarui cuma tulisan di tombolnya. */
  hitungPilihPr:function(){
    var semua=document.querySelectorAll('.pick').length;
    var n=document.querySelectorAll('.pick:checked').length;
    var b=document.getElementById('btnBuatPr');
    if(b) b.innerHTML=ic('plus')+(n?'Buat PR dari '+n+' item':'Pilih item dulu');
    /* Kotak di kepala tabel mengikuti isinya: penuh saat semua tercentang,
       setengah (indeterminate) saat sebagian. Kotak kepala yang tetap penuh
       padahal barisnya tinggal separuh memberi tahu hal yang keliru. */
    document.querySelectorAll('.pickall').forEach(function(el){
      el.checked = n>0 && n===semua;
      el.indeterminate = n>0 && n<semua;
    });
  },
  pilihSemuaPr:function(on){
    document.querySelectorAll('.pick').forEach(function(el){ el.checked=!!on; });
    window.APP.hitungPilihPr();
  },
  statusPr:statusPr, setujuPr:setujuPr, lepasDariPr:lepasDariPr, masukkanKePr:masukkanKePr,
  isiRealisasi:isiRealisasi,
  /* Pengurus set penyetuju. Semuanya dijaga adminModul() — sama seperti
     tombol-tombolnya di layar, karena tombol yang disembunyikan masih bisa
     dipanggil dari konsol. */
  tambahSet:function(){
    if(!adminModul()) return toast('Hanya admin BD yang bisa mengubah susunan penyetuju');
    approverSets().push({id:uid('as'),nama:'Set baru',bawaan:false,orang:[]});
    save(); render();
  },
  hapusSet:function(id){
    if(!adminModul()) return toast('Hanya admin BD yang bisa mengubah susunan penyetuju');
    var s=approverSets(), st=s.find(function(x){return x.id===id;});
    if(!st||st.bawaan) return;
    var dipakai=(DB.pr||[]).filter(function(p){return p.setId===id;}).length;
    if(!confirm('Hapus set "'+(st.nama||'')+'"?'+(dipakai?'\n\n'+dipakai+' lembar PR memakainya dan akan kembali ke set bawaan.':''))) return;
    (DB.pr||[]).forEach(function(p){ if(p.setId===id) delete p.setId; });
    DB.approverSets=s.filter(function(x){return x.id!==id;});
    save(); render(); toast('Set dihapus');
  },
  setNamaSet:function(id,v){
    if(!adminModul()) return;
    var st=approverSets().find(function(x){return x.id===id;});
    if(st){ st.nama=String(v||'').trim()||'Tanpa nama'; save(); }
  },
  jadikanSetBawaan:function(id){
    if(!adminModul()) return toast('Hanya admin BD yang bisa mengubah susunan penyetuju');
    approverSets().forEach(function(x){ x.bawaan = (x.id===id); });
    save(); render(); toast('Set bawaan diganti');
  },
  tambahKeSet:function(id){
    if(!adminModul()) return toast('Hanya admin BD yang bisa mengubah susunan penyetuju');
    var st=approverSets().find(function(x){return x.id===id;}); if(!st) return;
    var sel=document.getElementById('add_'+id); if(!sel||!sel.value) return;
    st.orang=st.orang||[];
    // Satu orang tidak boleh dua kali di set yang sama — dua kotak tanda
    // tangan atas nama orang yang sama tidak berarti apa-apa.
    if(st.orang.indexOf(sel.value)>-1) return toast('Orang itu sudah ada di set ini');
    st.orang.push(sel.value); save(); render();
  },
  hapusDariSet:function(id,pid){
    if(!adminModul()) return toast('Hanya admin BD yang bisa mengubah susunan penyetuju');
    var st=approverSets().find(function(x){return x.id===id;}); if(!st) return;
    st.orang=(st.orang||[]).filter(function(x){return x!==pid;});
    save(); render();
  },
  pilihSetPr:function(v){
    var pr=DB.pr.find(function(x){return x.id===prAktif;}); if(!pr) return;
    if(v) pr.setId=v; else delete pr.setId;
    save(); render();
  },
  /* Cetak dipanggil setelah satu putaran render selesai. Tanpa jeda, Chrome
     kadang membuka dialog cetak sebelum gambar kop selesai dimuat, dan
     lembarnya tercetak tanpa logo. */
  /* Nama berkas PDF-nya diambil peramban dari <title> halaman — tidak ada
     jalan lain, tidak ada parameter di window.print() untuk itu. Jadi judulnya
     ditukar sebentar lalu dikembalikan. Sebelumnya PDF-nya lahir bernama
     "BD OS — Laksamana Muda.pdf" untuk SETIAP PR, dan folder unduhan finance
     penuh berkas bernama sama yang harus dibuka satu per satu untuk tahu isinya.

     Dikembalikan lewat DUA jalur: `afterprint` (yang benar) dan satu timer
     cadangan. Sebagian peramban tidak pernah membangkitkan afterprint kalau
     dialog cetaknya dibatalkan — dan judul yang tidak pernah pulih membuat
     seluruh tab tetap bernama "Purchase Order PR-012" sampai halaman dimuat
     ulang. */
  cetakPr:function(){
    var pr=DB.pr.find(function(x){return x.id===prAktif;});
    var judulLama=document.title;
    var no=String((pr&&pr.no)||'').trim();
    /* Karakter yang dilarang di nama berkas Windows dibuang, bukan diganti
       garis bawah: nomor PR isinya angka & strip, dan yang aneh-aneh di sana
       hampir pasti salah ketik. */
    document.title='Purchase Order '+(no?('PR-'+no):'(tanpa nomor)').replace(/[\\/:*?"<>|]/g,'');
    var pulih=function(){
      document.title=judulLama;
      window.removeEventListener('afterprint',pulih);
    };
    window.addEventListener('afterprint',pulih);
    setTimeout(function(){ window.print(); }, 120);
    setTimeout(pulih, 60000);   // cadangan: dialog cetak yang dibatalkan
  },
  setPoMode:function(m){poMode=m;render();},
  geserMingguPo:function(n){ poMinggu = n===0 ? 0 : poMinggu+n; render(); },
  pilihMinggu:function(i){ poMinggu=i; render(); },
  agendaModal:agendaModal, simpanAgenda:simpanAgenda, hapusAgenda:hapusAgenda,
  dragCal:dragCal, dropCal:dropCal,
  geserBulan:function(n){calRef=new Date(calRef.getFullYear(),calRef.getMonth()+n,1);render();},
  bulanIni:function(){var d=new Date();calRef=new Date(d.getFullYear(),d.getMonth(),1);render();},
  orangModal:orangModal, simpanOrang:simpanOrang, hapusOrang:hapusOrang,
  segarkanKru:function(){
    toast('Mengambil daftar kru dari Office…');
    sinkronRoster(false).then(function(ok){
      cetakIdentitas(); render();
      if(ok) toast('Daftar kru diperbarui — '+DB.people.filter(function(p){return !p.tanpaAkses;}).length+' kru berakses');
    });
  }
};

/* ============ BOOT ============ */
function cetakIdentitas(){
  var s=sesi()||{};
  var nama=s.name||'Kru';
  $('#su-avatar').textContent=inisial(nama);
  $('#su-un').textContent=nama;
  $('#su-ur').textContent=AKU?((AKU.role||'Kru')+' · '+(AKU.div||'')):'Kru Task Management';
}
function layarGagal(pesan){
  $('#loading').style.display='none';
  $('#app').style.display='';
  /* Identitas tetap dicetak walau server mati: namanya datang dari sesi
     Office di localStorage, bukan dari API. Sidebar yang menampilkan "?" saat
     galat membuat kru mengira sesinya ikut bermasalah — padahal tidak. */
  cetakIdentitas();
  $('#view').innerHTML='<div class="card" style="border-color:var(--danger);max-width:640px;margin:40px auto">'+
    '<div class="card-h"><h3 style="color:var(--danger)">Tidak bisa memuat data</h3></div>'+
    /* Sengaja TIDAK menjanjikan "data kamu aman di database". Penyebab
       tersering layar ini muncul justru saat backend belum terpasang sama
       sekali — belum ada database untuk diamankan, dan janji yang salah
       membuat orang berhenti mencari penyebabnya. */
    '<div class="card-b"><p style="color:var(--muted);line-height:1.6">BD OS tidak bisa bicara dengan '+
    'backendnya, jadi tidak ada yang ditampilkan. Ini kegagalan <b>memuat</b> — tidak ada yang terhapus. '+
    'Pesan di bawah menyebut penyebabnya.</p>'+
    '<div style="margin-top:12px;font-size:12.5px"><div class="stat-l">Alamat API</div>'+
    '<div style="font-family:var(--mono);font-size:12px">'+esc(API_URL)+'</div>'+
    '<div class="stat-l" style="margin-top:8px">Pesan</div><div>'+esc(pesan)+'</div></div>'+
    '<div style="margin-top:16px;display:flex;gap:10px"><button class="btn pri" onclick="location.reload()">'+
    ic('refresh')+'Coba lagi</button><button class="btn" onclick="logout()">Kembali ke Office</button></div>'+
    '</div></div>';
  $('#tbTitle').textContent='Gagal memuat';
  $('#tbSub').textContent='Kesalahan';
}
/* Urutannya penting dan bukan kebetulan:
     1. state BD dari MySQL
     2. roster dari database account  -> baris people lahir di sini
     3. kenali()                      -> AKU sudah bisa ditemukan sebelum
                                         apa pun digambar

   Roster yang GAGAL tidak menghentikan boot — sinkronRoster() menelan
   galatnya dan menyimpannya di ROSTER_PESAN untuk ditampilkan sebagai pita.
   Papan kerja yang mogok total gara-gara layanan lain sedang batuk lebih
   merugikan daripada daftar kru yang ketinggalan sehari. */
apiGet('getAll').then(function(s){
  DB=normalize(s);
  return sinkronRoster(true);
}).then(function(){
  segarkanSnapshot();
  kenali();
  cetakIdentitas();
  // Halaman awal dari alamat (#purchasing dari Marketing, bookmark, dst).
  var awal=bacaAlamat(); if(awal) view=awal;
  $('#loading').style.display='none';
  $('#app').style.display='';
  render();
},function(e){ layarGagal(e.message||String(e)); });

})();
</script>
</body>
</html>
