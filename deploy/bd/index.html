function simpanTask(id){
  var g=function(x){return document.getElementById(x);};
  var nama=g('m_name').value.trim();
  if(!nama){ g('m_name').focus(); toast('Nama task wajib diisi.'); return; }
  var data={name:nama,desc:g('m_desc').value.trim(),div:g('m_div').value,
    status:g('m_status').value,priority:g('m_prio').value,type:g('m_type').value,
    deadline:g('m_due').value,project:g('m_proj').value||null,
    important:g('tg_imp').classList.contains('on'),urgent:g('tg_urg').classList.contains('on')};
  /* Sub-task tanpa teks dibuang: baris kosong cuma membuat hitungan x/y
     tidak pernah bisa genap. */
  data.subtasks=_subDraft.map(function(x){return {id:x.id,t:String(x.t||'').trim(),done:!!x.done};})
                .filter(function(x){return x.t;});
  data.dependsOn=_depDraft.filter(function(d){return d!==id && taskById(d);});
  if(data.status==='Done' && !cekBolehDone({id:id,name:nama},data.dependsOn)){ g('m_status').focus(); return; }
  var t;
  if(id){
    t=DB.tasks.find(function(x){return x.id===id;});
    Object.assign(t,data);
  }else{
    t=Object.assign({id:uid('t'),progress:0},data);
    DB.tasks.push(t);
  }
  segarkanProgress(t);
  /* Lewat setPics(), bukan Object.assign — `pic` dan `pics` harus selalu
     ditulis bersamaan supaya kolom SQL tidak menunjuk orang yang sudah
     dilepas dari task. */
  setPics(t,bacaPic('m_pics'));
  save(); closeModal(); render(); toast(id?'Task diperbarui':'Task ditambahkan');
}

/* ============ SUB-TASK & URUTAN (DEPENDENSI) ============
   Permintaan user 6 Oktober 2026: modul ini bukan lagi papan BD saja tapi
   task management umum — per project ada task, tiap task boleh punya
   sub-task, dan sebuah task baru boleh Done kalau task yang ditunggunya sudah
   Done lebih dulu.

   Keduanya disimpan DI DALAM baris task (`subtasks`, `dependsOn`), bukan
   tabel baru: backend menyimpan seluruh baris sebagai JSON di kolom `data`,
   jadi field baru ikut sendiri tanpa satu pun migrasi SQL yang bisa
   tertinggal di produksi.

   YANG DITAHAN HANYA "DONE". Mulai mengerjakan (Doing) task yang masih
   menunggu tetap boleh — persiapan sering jalan paralel — tapi menyatakan
   selesai sebelum prasyaratnya selesai adalah persis kesalahan urutan yang
   ingin dicegah. Penjaganya SATU (cekBolehDone), dipakai keempat jalan ke
   Done: centang di daftar, Simpan di modal, dan seret kartu di Board. */
function subs(t){ return (t&&Array.isArray(t.subtasks)) ? t.subtasks : []; }
function subHitung(t){ var s=subs(t); return {n:s.length, d:s.filter(function(x){return x&&x.done;}).length}; }
function deps(t){ return (t&&Array.isArray(t.dependsOn)) ? t.dependsOn : []; }
function taskById(id){ return DB.tasks.find(function(x){return x.id===id;}); }
/* Task yang masih menghalangi. Prasyarat yang sudah DIHAPUS tidak ikut
   menghalangi — kalau ikut, task itu terkunci selamanya oleh sesuatu yang
   tidak bisa dibuka siapa pun. */
function penghalang(t){ return deps(t).map(taskById).filter(function(d){ return d && !selesai(d); }); }
function penunggu(id){ return DB.tasks.filter(function(t){ return deps(t).indexOf(id)>-1; }); }
/* Apakah task a (langsung atau lewat rantai) menunggu task b. Dipakai menolak
   lingkaran: A menunggu B yang menunggu A berarti keduanya tidak akan pernah
   bisa Done, dan tidak ada satu layar pun yang menjelaskan kenapa. */
function menungguTransitif(aId,bId,seen){
  seen=seen||{}; if(seen[aId]) return false; seen[aId]=1;
  return deps(taskById(aId)).some(function(d){ return d===bId || menungguTransitif(d,bId,seen); });
}
function namaPendek(t){ return '"'+String(t.name||'').slice(0,40)+'"'; }
function cekBolehDone(t,daftarDeps){
  var h=(daftarDeps?daftarDeps.map(taskById):deps(t).map(taskById))
          .filter(function(d){ return d && d.id!==t.id && !selesai(d); });
  if(!h.length) return true;
  toast(namaPendek(t)+' belum bisa Done — selesaikan dulu: '+h.map(namaPendek).join(', '));
  return false;
}
/* Progress task yang punya sub-task DIHITUNG dari sub-task-nya, bukan diketik:
   angka yang diketik tangan selalu ketinggalan dari kenyataan (alasan yang
   sama dengan projProgress). */
function subDaftarHtml(t){
  if(!SUB_BUKA[t.id] || !subs(t).length) return '';
  return '<div class="subdrop" onclick="event.stopPropagation()" ondragstart="event.preventDefault()">'+subs(t).map(function(x,i){
    return '<label class="subdi"><input type="checkbox"'+(x.done?' checked':'')+
      ' onchange="APP.subLangsung(\''+t.id+'\','+i+',this.checked)"><span class="'+(x.done?'done':'')+'">'+esc(x.t)+'</span></label>';
  }).join('')+'</div>';
}
function subBuka(id){ SUB_BUKA[id]=!SUB_BUKA[id]; render(); }
function subLangsung(id,i,on){
  var t=taskById(id); if(!t||!subs(t)[i]) return;
  t.subtasks[i].done=!!on; segarkanProgress(t);
  save(); render();
}
/* doneAt dicatat saat task jadi Done dan dibuang saat dibuka lagi. Itulah
   "waktunya berhenti": task selesai tidak lagi menghitung mundur/lewat —
   deadline-nya digambar hijau dengan tanggal mati (tagDeadline). */
function segarkanProgress(t){
  if(selesai(t)){ t.progress=100; if(!t.doneAt) t.doneAt=todayISO(); return; }
  delete t.doneAt;
  var h=subHitung(t);
  if(h.n) t.progress=Math.round(h.d/h.n*100);
  else if(t.progress===100) t.progress=0;
}
/* Sub-task bisa dibuka seperti dropdown langsung dari baris/kartunya, dan
   dicentang di sana tanpa membuka modal. Keadaan terbukanya di luar DOM
   (SUB_BUKA) karena render di modul ini TOTAL. */
var SUB_BUKA={};
function tagDeadline(t){
  if(selesai(t)){
    var ket='Selesai'+(t.doneAt?' '+fTgl(t.doneAt):'');
    return '<span class="tag ok" title="'+esc(ket+(t.deadline?' · deadline '+fTgl(t.deadline):''))+'">✓ '+
      (t.deadline?fTgl(t.deadline):ket)+'</span>';
  }
  return t.deadline?'<span class="tag'+(lewat(t)?' overdue':'')+'">'+fDue(t.deadline)+'</span>':'';
}
function tagSubDep(t,tanpaKunci){
  var h=subHitung(t), hal=selesai(t)?[]:penghalang(t);
  return (h.n?'<button type="button" class="tag subtog'+(h.d===h.n?' sub-ok':'')+(SUB_BUKA[t.id]?' on':'')+'" '+
      'title="Lihat sub-task" onclick="event.stopPropagation();APP.subBuka(\''+t.id+'\')" '+
      'ondragstart="event.stopPropagation()">☑ '+h.d+'/'+h.n+' '+(SUB_BUKA[t.id]?'▴':'▾')+'</button>':'')+
    (hal.length&&!tanpaKunci?'<span class="tag lock" title="Menunggu: '+esc(hal.map(function(x){return x.name;}).join(', '))+'">🔒 tunggu '+hal.length+'</span>':'');
}

/* ---- isian sub-task & urutan di modal ----
   Hidup di luar DOM (_subDraft/_depDraft) dan baru masuk ke task saat Simpan:
   kalau langsung menyunting t.subtasks, menekan Batal tetap menyimpan
   perubahannya pada save() berikutnya. Yang digambar ulang hanya WADAHNYA,
   supaya kotak "sub-task baru" yang sedang diketik tidak kehilangan fokus. */
var _subDraft=[], _depDraft=[], _modalTaskId=null;
function subGambar(){
  var el=document.getElementById('m_subs'); if(!el) return;
  var h=subHitung({subtasks:_subDraft});
  var lbl=document.getElementById('m_subsN'); if(lbl) lbl.textContent=h.n?(h.d+'/'+h.n+' selesai'):'';
  el.innerHTML=_subDraft.length?_subDraft.map(function(s,i){
    return '<div class="subrow">'+
      '<input type="checkbox"'+(s.done?' checked':'')+' onchange="APP.subCentang('+i+',this.checked)">'+
      '<input class="subt'+(s.done?' done':'')+'" value="'+esc(s.t)+'" oninput="APP.subUbah('+i+',this.value)">'+
      '<button type="button" class="iconbtn" title="Hapus sub-task" onclick="APP.subHapus('+i+')">'+ic('x',13)+'</button></div>';
  }).join(''):'<div class="muted" style="font-size:12.5px;padding:4px 2px">Belum ada sub-task.</div>';
}
function subTambah(){
  var inp=document.getElementById('m_subBaru'); if(!inp) return;
  var v=inp.value.trim(); if(!v){ inp.focus(); return; }
  _subDraft.push({id:uid('s'),t:v,done:false});
  inp.value=''; subGambar(); inp.focus();
}
function subCentang(i,on){ if(_subDraft[i]){ _subDraft[i].done=!!on; subGambar(); } }
function subUbah(i,v){ if(_subDraft[i]) _subDraft[i].t=v; }
function subHapus(i){ _subDraft.splice(i,1); subGambar(); }

function depGambar(){
  var el=document.getElementById('m_deps'); if(!el) return;
  var sel=document.getElementById('m_proj'), proj=(sel&&sel.value)||null, self=_modalTaskId;
  var calon=DB.tasks.filter(function(x){
    if(x.id===self) return false;
    if(_depDraft.indexOf(x.id)>-1) return true;          // yang sudah dipilih selalu tampil
    if((x.project||null)!==proj) return false;
    return !(self && menungguTransitif(x.id,self));     // tolak lingkaran
  }).sort(function(a,b){

    return;
  }
  el.innerHTML=calon.map(function(x){

/* ============ BOARD (ala Trello) ============
   Satu kolom per status, kartu = task. Dipilih per project karena itu bentuk
   kerja yang diminta ("per project bisa di-setting task dan sub-task-nya");
   "Semua project" tetap ada untuk yang ingin melihat seluruh pekerjaannya.

   Bukan pengganti halaman Tasks — matriks Eisenhower tetap di sana. Board
   menjawab "sampai mana", Tasks menjawab "mana yang duluan". */
var bProj='', bScope='tim', _dragBoard=null, _bSeret=0, _bFokus=null;
function boardTasks(){
  return saringLingkup(DB.tasks,bScope).filter(cocokPic).filter(function(t){
    if(!bProj) return true;
    if(bProj==='__none__') return !t.project;
    return t.project===bProj;
  });
}
/* Urutan baku seluruh daftar task: deadline TERDEKAT di paling atas,
   yang tanpa deadline paling bawah (bukan paling atas — task tanpa tenggat
   bukan yang paling mendesak), lalu nama supaya urutannya tidak berubah-ubah
   tiap render. */
function urutDeadline(a,b){
  var da=a.deadline||'9999-99-99', db=b.deadline||'9999-99-99';
  if(da!==db) return da<db?-1:1;
  return String(a.name||'').localeCompare(String(b.name||''));
}
/* ARSIP = task yang sudah Done. Tidak dihapus dan tidak dipindah ke mana
   pun — cuma disembunyikan dari tampilan bawaan, dan "Semua"/"Arsip"
   memunculkannya lagi. Penanda arsipnya status Done itu sendiri, bukan
   field baru: dua penanda untuk satu keadaan pasti menyimpang (task yang
   dibuka lagi dari Done tapi lupa dicabut arsipnya hilang dari papan). */
function saringArsip(list,mode){
  if(mode==='arsip') return list.filter(selesai);
  if(mode==='semua') return list;
  return list.filter(function(t){return !selesai(t);});
}
function segArsip(mode,aksi,list){
  var nA=list.filter(function(t){return !selesai(t);}).length, nD=list.length-nA;
  return '<div class="seg">'+[['aktif','Aktif',nA],['arsip','Arsip (Done)',nD],['semua','Semua',list.length]].map(function(x){
    return '<button class="'+(mode===x[0]?'on':'')+'" onclick="'+aksi.replace('$',x[0])+'">'+x[1]+' <span class="num">'+x[2]+'</span></button>';
  }).join('')+'</div>';
}
/* Kanban satu daftar task. proj = project tujuan kartu yang ditambah lewat
   "+ Tambah kartu" (null = tanpa project). Di mode Aktif kolom Done TETAP
   ada sebagai tempat menjatuhkan kartu — tanpa itu tidak ada cara
   menyelesaikan task dari papan — tapi isinya diringkas jadi jumlah arsip. */
function kanbanHtml(base,proj,tampilProj,arsip){
  var kolom=arsip==='arsip'?['Done']:STATUS_FLOW;
  return '<div class="kanban board">'+kolom.map(function(st){
    var l=base.filter(function(t){return (t.status||'To Do')===st;}).sort(urutDeadline);
    var sembunyi=(st==='Done'&&arsip==='aktif');
    var tampil=sembunyi?[]:l;
    return '<div class="kcol"><div class="kcol-h"><span class="kt">'+st+'</span><span class="kc num">'+l.length+'</span></div>'+
      '<div class="kcol-b" ondragover="event.preventDefault();this.classList.add(\'drop\')" '+
      'ondragleave="this.classList.remove(\'drop\')" ondrop="APP.dropBoard(event,\''+st+'\')">'+
      tampil.map(function(t){return boardCard(t,tampilProj);}).join('')+
      (sembunyi?'<div class="karsip">'+(l.length?l.length+' task Done diarsipkan':'Seret kartu ke sini kalau sudah selesai')+'</div>':'')+
      '</div>'+
      (st==='Done'?'':'<div class="kadd"><input data-kadd="'+esc(st)+'" placeholder="+ Tambah kartu, Enter…" '+
        'onkeydown="if(event.key===\'Enter\'){event.preventDefault();APP.boardTambah(this,\''+st+'\','+(proj?'\''+proj+'\'':'null')+');}"></div>')+
      '</div>';
  }).join('')+'</div>';
}
var bArsip='aktif';

        return '<option value="'+p.id+'"'+(bProj===p.id?' selected':'')+'>'+esc(p.name)+'</option>';}).join('')+'</select>'+

function boardCard(t,tampilProj){
  var pr=tampilProj&&t.project&&DB.projects.find(function(p){return p.id===t.project;});

/* ============ PROJECTS ============ */
function projTasks(pid){return DB.tasks.filter(function(t){return t.project===pid;});}
function projBeres(p){ return !!p && p.stage==='Completed'; }

/* Kotak pilihan project — dipakai task, koordinasi, dan purchase order.
   Project yang sudah Completed TIDAK ditawarkan lagi: pekerjaan baru untuk
   project yang sudah ditutup hampir selalu salah tempat, dan daftar yang
   terus memanjang membuat project yang masih jalan susah dicari.

   Yang SUDAH tertaut tetap digambar, ditandai "(selesai)". Tanpa pengecualian
   itu, membuka form sebuah task lama diam-diam MELEPAS project-nya begitu
   Simpan ditekan — <select> tanpa <option> yang cocok jatuh ke pilihan
   pertama, dan pilihan pertama di sini adalah "tanpa project". */
function opsiProject(terpilih,labelKosong){
  var out='<option value="">'+esc(labelKosong||'— tanpa project —')+'</option>';
  DB.projects.forEach(function(p){
    var beres=projBeres(p);
    if(beres && p.id!==terpilih) return;
    out+='<option value="'+p.id+'"'+(terpilih===p.id?' selected':'')+'>'+
      esc(p.name)+(beres?' (selesai)':'')+'</option>';
  });
  return out;
}

/* Project ditutup = seluruh task-nya ikut selesai.
   Sebelumnya project bisa berdiri di kolom Completed sementara task-nya masih
   "Doing", dan task itu tetap muncul tiap pagi di papan "hari ini & overdue"
   — pekerjaan hantu yang tidak akan dikerjakan siapa pun karena projectnya
   sudah tutup, sekaligus membuat progress project mentok di bawah 100%.

   Dipanggil HANYA saat stage berpindah ke Completed, bukan tiap render: task
   yang sengaja dibuka lagi sesudahnya tidak boleh ditutup ulang sendiri. */
function tuntaskanTaskProject(pid){
  var n=0;
  projTasks(pid).forEach(function(t){
    if(selesai(t)) return;
    t.status='Done'; t.progress=100; t.doneAt=todayISO(); n++;
  });
  return n;
}
/* Progress dihitung dari TASK kalau ada, baru jatuh ke milestone. Bukan angka
   yang diketik manual: persen yang diketik tangan selalu ketinggalan dari
   kenyataan dan tidak ada yang tahu kapan terakhir diperbarui. */
function projProgress(p){
  var ts=projTasks(p.id);
  if(ts.length) return Math.round(ts.filter(selesai).length/ts.length*100);
  var m=p.milestones||[];
  if(m.length) return Math.round(m.filter(function(x){return x.done;}).length/m.length*100);
  return 0;
}

/* Milestone diketik sebagai teks banyak-baris, bukan daftar dinamis. Bentuknya
   sederhana dan bisa disalin dari catatan rapat; status selesainya TIDAK ikut
   di teks ini supaya mengedit nama milestone tidak diam-diam mereset centang
   yang sudah ada — pencocokannya per nama, lihat di bawah. */
function bacaMilestone(teks,lama){
  return String(teks||'').split('\n').map(function(b){return b.trim();}).filter(Boolean).map(function(b){
    var q=b.split('|');
    var nama=(q[0]||'').trim();
    var tgl=(q[1]||'').trim();
    var sebelum=(lama||[]).find(function(m){return m.t===nama;});
    return {t:nama,date:/^\d{4}-\d{2}-\d{2}$/.test(tgl)?tgl:'',done:sebelum?!!sebelum.done:false};
  });
}
function simpanProj(id){
  var g=function(x){return document.getElementById(x).value;};
  var nama=g('p_name').trim();
  if(!nama){ toast('Nama project wajib diisi.'); return; }
  var lama=id?(DB.projects.find(function(x){return x.id===id;}).milestones||[]):[];
  var data={name:nama,desc:g('p_desc').trim(),div:g('p_div'),type:g('p_type').trim()||'Internal',
    stage:g('p_stage'),start:g('p_start'),end:g('p_end'),
    budget:bacaRp('p_budget'),spent:bacaRp('p_spent'),health:g('p_health'),
    milestones:bacaMilestone(g('p_ms'),lama)};
  var p, dulu='';
  if(id){ p=DB.projects.find(function(x){return x.id===id;}); dulu=p.stage; Object.assign(p,data); }
  else  { p=Object.assign({id:uid('p')},data); DB.projects.push(p); }
  setPics(p,bacaPic('p_pics'));
  /* Sesudah setPics, sebelum save: task yang ikut ditutup harus ikut terkirim
     dalam satu simpanan yang sama. Menutupnya sesudah save() berarti layar
     sudah menampilkan Done sementara servernya belum tahu. */
  var ikut=(p.stage==='Completed'&&dulu!=='Completed')?tuntaskanTaskProject(p.id):0;
  save(); closeModal(); render();
  toast((id?'Project diperbarui':'Project ditambahkan')+(ikut?' — '+ikut+' task ikut jadi Done':''));
}
function hapusProj(id){
  if(!confirm('Hapus project ini? Task-nya TIDAK ikut terhapus — hanya dilepas dari project.')) return;
  DB.projects=DB.projects.filter(function(p){return p.id!==id;});
  /* Task/PO/koordinasi yang menunjuk project ini dilepas tautannya, bukan
     ikut dihapus. Membiarkan id project yang sudah tidak ada akan membuat
     penyaring "per project" menampilkan baris hantu tanpa nama. */
  DB.tasks.forEach(function(t){ if(t.project===id) t.project=null; });
  DB.po.forEach(function(o){ if(o.project===id) o.project=null; });
  DB.coord.forEach(function(c){ if(c.project===id) c.project=null; });
  save(); closeModal(); view='projects'; render(); toast('Project dihapus');
}

   mengganti nama field. */
const PROMO_TIPE={
  partner_kartu:  {l:'Kartu / Komunitas',    i:'💳'},
  partner_sekolah:{l:'Sekolah / Organisasi', i:'🎓'},
  tiktok:         {l:'TikTok / Voucher',     i:'🎵'},
  in_house:       {l:'Promo Laksamana',      i:'🍽️'},
  happy_hour:     {l:'Happy Hour',           i:'🕒'},
  event:          {l:'Event / Musiman',      i:'🎉'}
};
/* Kategori — BEDA dari tipe, dan sengaja dipisah. Tipe menjawab "promo ini
   datang dari mana / untuk siapa" (kerjasama kartu, sekolah, TikTok…);
   kategori menjawab "tamu dapat apa". Satu promo TikTok bisa berupa diskon
   maupun free item, jadi menggabungkan keduanya akan memaksa memilih salah
   satu yang salah. */
const PROMO_KAT={
  diskon:   {l:'Diskon',    i:'🏷️'},
  free_item:{l:'Free Item', i:'🎁'}
};
function promoTipe(k){ return PROMO_TIPE[k]||{l:k||'—',i:'🏷️'}; }
function promoKat(k){ return PROMO_KAT[k]||null; }
/* Hari berlaku disimpan sebagai ARRAY INDEKS 0–6 (0=Minggu), bukan teks bebas
   seperti versi pertama ("Senin-Jumat"). Teks bebas tidak bisa disaring, tidak
   bisa dibandingkan, dan dua orang menuliskannya dengan tiga ejaan berbeda.
   Nilai teks warisan tetap DIGAMBAR apa adanya — lihat promoHariTeks. */
const PROMO_HARI=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
const PROMO_HARI_PANJANG=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
function promoHariArr(h){ return Array.isArray(h)?h.map(Number).filter(function(n){return n>=0&&n<=6;}):[]; }
function promoHariTeks(h){
  if(Array.isArray(h)){
    var a=promoHariArr(h);
    if(!a.length) return '';
    if(a.length===7) return 'Setiap hari';
    return a.slice().sort(function(x,y){return x-y;}).map(function(i){return PROMO_HARI[i];}).join(', ');
  }
  return String(h||'');   // warisan: teks bebas dari versi pertama
}
/* Outlet: daftar tertutup + jalan keluar. "Laksamana Muda" satu-satunya yang
   pasti ada; sisanya diketik sendiri lewat pilihan "Lainnya…". Nilai yang
   pernah diketik ikut jadi pilihan di form berikutnya (lihat promoOutletOpsi)
   supaya cabang kedua tidak perlu diketik ulang dengan ejaan yang berbeda. */
const PROMO_OUTLET_BAWAAN='Laksamana Muda';
function promoOutletOpsi(terpilih){
  var ada=[PROMO_OUTLET_BAWAAN];
  (DB.promos||[]).forEach(function(p){
    var o=String(p.outlet||'').trim();
    if(o && ada.indexOf(o)<0) ada.push(o);
  });
  var t=String(terpilih||'').trim();
  if(t && ada.indexOf(t)<0) ada.push(t);
  return ada;
}
/* Status dihitung dari tanggal tiap kali dibaca, TIDAK PERNAH disimpan.
   Status tersimpan akan basi sendiri setiap tengah malam, dan tidak ada
   penjadwal di hosting ini yang bisa diandalkan untuk memperbaruinya —
   promo yang sudah berakhir akan terus tertulis "Berlangsung" di Radar
   sampai ada yang membuka lalu menyimpannya ulang. */
const PROMO_ST={running:['Berlangsung','p-go'],upcoming:['Akan Datang','p-teal'],
                ended:['Selesai','p-mute'],paused:['Dijeda','p-warn']};
function promoHari(){ var d=new Date(); d.setHours(0,0,0,0); return d; }
function promoTgl(s){ if(!s) return null; var d=new Date(s+'T00:00:00'); return isNaN(d)?null:d; }
function promoStatus(p){
  if(p.paused) return 'paused';
  var t=promoHari(), a=promoTgl(p.mulai), b=promoTgl(p.selesai);
  if(a && t<a) return 'upcoming';
  if(b && t>b) return 'ended';
  return 'running';
}
function promoSisa(p){
  var t=promoHari(), a=promoTgl(p.mulai), b=promoTgl(p.selesai), st=promoStatus(p), H=86400000;
  if(st==='upcoming') return 'Mulai dalam '+Math.ceil((a-t)/H)+' hari';
  if(st==='running'&&b){ var n=Math.ceil((b-t)/H); return n<=0?'Berakhir hari ini':'Sisa '+n+' hari'; }
  if(st==='ended') return 'Sudah berakhir';
  if(st==='paused') return 'Sementara dijeda';
  return '';
}
function promoPeriode(p){
  var f=function(s){ var d=promoTgl(s); return d?(d.getDate()+' '+BULAN[d.getMonth()].slice(0,3)+' '+d.getFullYear()):'—'; };
  return f(p.mulai)+' → '+f(p.selesai);
}
function promoJam(p){ return (p.jamMulai||p.jamSelesai)?((p.jamMulai||'—')+' – '+(p.jamSelesai||'—')):''; }
/* Urutan: yang perlu diperhatikan lebih dulu. Berlangsung, lalu Akan Datang
   (yang paling dekat di atas), lalu dijeda, lalu yang sudah selesai. Diurut
   di satu tempat supaya daftar di modul ini dan di Radar tidak pernah
   memberi urutan yang berbeda untuk data yang sama. */
const PROMO_URUT={running:0,upcoming:1,paused:2,ended:3};
function promoSort(a,b){
  var sa=PROMO_URUT[promoStatus(a)], sb=PROMO_URUT[promoStatus(b)];
  if(sa!==sb) return sa-sb;
  return String(a.mulai||'').localeCompare(String(b.mulai||''));
}
var promoFil='all', promoTipeFil='', promoCari='';
function promoTerlihat(){
  var out=DB.promos.slice();
  if(promoFil!=='all') out=out.filter(function(p){return promoStatus(p)===promoFil;});
  if(promoTipeFil) out=out.filter(function(p){return (p.tipe||'')===promoTipeFil;});
  var q=promoCari.trim().toLowerCase();
  if(q) out=out.filter(function(p){
    return [p.nama,p.benefit,p.partner,p.kode,p.ketentuan,p.lmPIC].join(' ').toLowerCase().indexOf(q)>-1;
  });
  return out.sort(promoSort);
}

function promoHariUbah(){

/* Gambar DIKECILKAN di peramban sebelum disimpan, bukan diunggah apa adanya.
   Poster dari HP rutin 2–5 MB; menyimpannya utuh berarti setiap orang yang
   membuka BD OS maupun Radar mengunduhnya lagi setiap kali — daftar promo
   ikut di getAll. 800px sudah lebih dari cukup untuk dibaca di layar, dan
   mutunya diturunkan bertahap sampai muat di bawah 400 KB.

   Gagal di tahap mana pun HARUS bersuara: gambar yang diam-diam tidak
   tersimpan baru ketahuan saat promonya dibuka orang lain dan posternya
   kosong. */
function promoPoster(inp){
  var f=inp&&inp.files&&inp.files[0]; if(!f) return;
  if(!/^image\//.test(f.type||'')){ toast('Berkasnya bukan gambar.'); inp.value=''; return; }
  var fr=new FileReader();
  fr.onerror=function(){ toast('Berkasnya gagal dibaca.'); };
  fr.onload=function(){
    var img=new Image();
    img.onerror=function(){ toast('Gambarnya tidak bisa dibaca — coba format JPG atau PNG.'); };
    img.onload=function(){
      try{
        var maks=800, w=img.width||0, h=img.height||0;
        if(!w||!h){ toast('Ukuran gambarnya tidak terbaca.'); return; }
        if(w>maks||h>maks){ var s=Math.min(maks/w,maks/h); w=Math.round(w*s); h=Math.round(h*s); }
        var c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        var mutu=[0.75,0.6,0.45], hasil='';
        for(var i=0;i<mutu.length;i++){ hasil=c.toDataURL('image/jpeg',mutu[i]); if(hasil.length<=400000) break; }
        if(!hasil || hasil.length>400000){ toast('Gambarnya masih terlalu besar — pakai poster yang lebih sederhana.'); return; }
        _pPoster=hasil; promoPosterPrev();
        toast('Poster siap (± '+Math.round(hasil.length/1024)+' KB)');
      }catch(e){ toast('Gagal memproses gambar: '+(e&&e.message||e)); }
    };
    img.src=fr.result;
  };
  fr.readAsDataURL(f);
}
function simpanPromo(id){
  var g=function(x){var e=document.getElementById(x);return e?String(e.value).trim():'';};
  var nama=g('p_nama'), mulai=g('p_mulai'), selesai=g('p_selesai');
  if(!nama){ toast('Nama promo wajib diisi.'); return; }
  if(!mulai||!selesai){ toast('Tanggal mulai & selesai wajib diisi.'); return; }
  /* Tanggal terbalik ditolak DI SINI, bukan dibiarkan lalu diperbaiki saat
     dibaca: promoStatus() akan memulangkan 'ended' untuk promo yang belum
     mulai, dan Radar akan menyembunyikannya dari seluruh kru tanpa satu pun
     pesan yang menyebutkan sebabnya. */
  if(selesai<mulai){ toast('Tanggal selesai tidak boleh sebelum tanggal mulai.'); return; }
  var adaJam=!!(document.getElementById('p_adaJam')||{}).checked;
  var outlet=g('p_outlet');
  if(outlet==='__lain'){
    outlet=g('p_outletLain');
    if(!outlet){ toast('Nama outlet barunya belum diisi.'); return; }
  }
  var data={
    nama:nama, tipe:g('p_tipe')||'in_house', kategori:g('p_kategori')||'diskon',
    benefit:g('p_benefit'),
    mulai:mulai, selesai:selesai,
    jamMulai:adaJam?g('p_jamMulai'):'', jamSelesai:adaJam?g('p_jamSelesai'):'',
    hari:promoHariTerpilih().sort(function(a,b){return a-b;}),
    outlet:outlet, partner:g('p_partner'), partnerPIC:g('p_partnerPIC'),
    partnerKontak:g('p_partnerKontak'), lmPIC:g('p_lmPIC'), kode:g('p_kode').toUpperCase(),
    kuota:Math.max(0,+g('p_kuota')||0),
    ketentuan:g('p_ketentuan'), poster:_pPoster||''
  };
  if(id){
    /* `paused` TIDAK ikut di data: ia diubah lewat tombol Jeda, dan form ini
       tidak punya kotaknya. Object.assign yang membawa paused:false akan
       diam-diam mengaktifkan kembali promo yang sengaja dijeda begitu ada yang
       membetulkan satu huruf di namanya. */
    Object.assign(DB.promos.find(function(x){return x.id===id;}),data);
  } else {
    DB.promos.unshift(Object.assign({id:uid('pr'),paused:false,dibuatOleh:((sesi()||{}).name||''),dibuatAt:Date.now()},data));
  }
  _pPoster='';
  save(); closeModal(); render(); toast(id?'Promo diperbarui':'Promo ditambahkan');
}
function togglePromo(id){
  var p=DB.promos.find(function(x){return x.id===id;}); if(!p) return;
  p.paused=!p.paused; save(); render();

  toast(p.paused?'Promo dijeda':'Promo diaktifkan lagi');

function hapusPromo(id){

  if(!confirm('Hapus promo "'+p.nama+'"?\n\nIa juga akan hilang dari modul Radar untuk seluruh kru.')) return;
  DB.promos=DB.promos.filter(function(x){return x.id!==id;});
  save(); closeModal(); render(); toast('Promo dihapus');
}

/* ============ PROMO: EXPORT & IMPORT EXCEL ============
   Permintaan user 27 Agustus 2026: daftar promo yang sudah berjalan ada di
   sistem POS, dan mengetiknya ulang satu per satu ke sini tidak masuk akal.

   KENAPA CSV, BUKAN .xlsx. Alasannya sama persis dengan Database Client di
   modul Marketing (lihat komentar panjang di crmExport sana): berkas ini
   BOLAK-BALIK — diekspor dari POS, disunting di Excel, lalu diimpor ke sini —
   dan MEMBACA .xlsx berarti membongkar ZIP lalu mengurai XML-nya di peramban.
   Ekspor .xlsx yang tidak bisa diimpor balik adalah perjalanan satu arah yang
   menipu. Excel membuka CSV dengan dobel-klik seperti berkas Excel lain; dari
   POS tinggal Save As → CSV.

   Dua hal yang membuat CSV-nya terbuka rapi di Excel, dan keduanya sering
   dilupakan: `﻿` di depan (tanpa itu huruf beraksen jadi mojibake di
   Excel Windows) dan baris `sep=,` (Excel berbahasa Indonesia memakai titik
   koma sebagai pemisah daftar, jadi CSV berkoma masuk seluruhnya ke KOLOM
   PERTAMA — yang terlihat orang bukan galat, melainkan lembar berisi satu
   kolom panjang, dan kesimpulannya "eksporannya rusak"). */

/* SATU daftar kolom, dipakai MENULIS berkas dan MEMBACANYA kembali. Dua daftar
   terpisah pasti bergeser lambat laun, dan yang bergeser diam-diam adalah isi
   kolom mana masuk ke bidang mana.

   `b`     = bidang di data. Kolom TANPA `b` adalah keterangan sekali baca:
             ikut ditulis supaya lembarnya berguna dibaca manusia, dan
             diabaikan sepenuhnya saat impor.
   `alias` = nama kolom LAIN yang dianggap sama. Inilah yang membuat berkas
             mentah dari POS bisa langsung diimpor tanpa disunting judulnya —
             pemetaan yang diminta user: Promotion Notes → Nama Promo,
             Start/End Date → tanggal, Discount → benefit. */
const PROMO_CSV_KOL=[
  /* ID ikut ditulis, dan inilah yang membuat impor bisa MEMPERBARUI alih-alih
     selalu menambah. Boleh kosong (baris baru dari POS yang tidak punya id
     kita) — pencocokannya lalu jatuh ke nama promonya. */
  {k:'ID',b:'id'},
  {k:'Nama Promo',b:'nama',alias:['Promotion Notes','Promotion Master Code','Nama','Promo','Nama Promosi']},
  {k:'Tanggal Mulai',b:'mulai',alias:['Start Date','Mulai','Tgl Mulai'],baca:promoCsvTgl},
  {k:'Tanggal Selesai',b:'selesai',alias:['End Date','Selesai','Tgl Selesai'],baca:promoCsvTgl},
  {k:'Benefit / nilai diskon',b:'benefit',alias:['Discount','Diskon','Benefit','Nilai Diskon'],baca:promoCsvDiskon},
  /* --- di bawah ini KETERANGAN saja: ditulis, tidak pernah dibaca --- */
  {k:'Tipe',tulis:function(p){ return promoTipe(p.tipe).l; }},
  {k:'Kategori',tulis:function(p){ var k=promoKat(p.kategori); return k?k.l:''; }},
  {k:'Status',tulis:function(p){ return PROMO_ST[promoStatus(p)][0]; }},
  {k:'Hari Berlaku',tulis:function(p){ return promoHariTeks(p.hari)||'Setiap hari'; }},
  {k:'Jam',tulis:function(p){ return promoJam(p); }},
  {k:'Outlet',tulis:function(p){ return p.outlet||''; }},
  {k:'Kode',tulis:function(p){ return p.kode||''; }},
  {k:'Kuota',tulis:function(p){ return +p.kuota||0; }},
  {k:'PIC Laksamana',tulis:function(p){ return p.lmPIC||''; }},
  {k:'Syarat & Ketentuan',tulis:function(p){ return p.ketentuan||''; }}
];
function promoCsvKunci(s){ return String(s==null?'':s).replace(/\s+/g,' ').trim().toLowerCase(); }

/* Tanggal dari POS berbentuk "17-08-2026 02:30". Yang disimpan modul ini
   "YYYY-MM-DD"; jamnya dibuang — promo berjam khusus diatur lewat centang jam
   di formulir, dan jam dari kolom tanggal POS itu jam pembuatan datanya,
   bukan jam berlakunya.

   HARI-DULU atau BULAN-DULU tidak bisa selalu dipastikan dari angkanya
   ("03-05-2026" sah dibaca dua-duanya). Yang bisa dipastikan dipakai lebih
   dulu: angka > 12 hanya mungkin hari. Sisanya dianggap HARI-DULU, karena
   itulah bentuk yang dipakai POS ini dan cara orang Indonesia menulis
   tanggal. Disebutkan di layar pratinjau supaya bisa diperiksa sebelum
   diterapkan — tanggal yang tertukar tidak melempar apa pun, ia cuma
   memindahkan promo ke bulan lain. */
function promoCsvTgl(v){
  var s=String(v==null?'':v).trim();
  if(!s||s==='-') return '';
  var pad=function(n){ return String(n).padStart(2,'0'); };
  var m=/^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s);
  if(m) return m[1]+'-'+pad(m[2])+'-'+pad(m[3]);
  m=/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/.exec(s);
  if(m){
    var a=+m[1], b=+m[2];
    if(b>12 && a<=12) return m[3]+'-'+pad(a)+'-'+pad(b);   // pasti bulan-dulu
    return m[3]+'-'+pad(b)+'-'+pad(a);                     // hari-dulu (bawaan)
  }
  return '';
}
/* "17,00 %" → "17%", "Rp 30.000" dibiarkan, "-" jadi kosong. Dirapikan
   seperlunya saja: yang di kolom Discount adalah nilai promonya, dan
   menerjemahkannya jadi kalimat ("Diskon 17%") berarti mengarang kata yang
   tidak ada di sumbernya. */
function promoCsvDiskon(v){
  var s=String(v==null?'':v).trim();
  if(!s||s==='-'||s==='—') return '';
  /* "17,00 %" → "17%". Dua langkah, dan yang kedua bukan kerapian: desimal
     nolnya dibuang lebih dulu, lalu SPASI SEBELUM % ikut dirapatkan. Versi
     pertama menyimpan spasinya di dalam tangkapan dan memulangkan "17 %" —
     benar isinya, tapi di kartu promo terbaca sebagai dua hal. Tarif berkoma
     yang bukan nol ("17,5 %") sengaja dibiarkan apa adanya selain spasinya. */
  s=s.replace(/(\d)[,.]00\s*%/,'$1%').replace(/\s+%/,'%');
  return s.replace(/\s+/g,' ').trim();
}

/* Penulis & pengurai CSV. Disalin sepadan dari modul Marketing — bukan
   di-import, karena modul di repo ini berdiri sendiri-sendiri sebagai satu
   berkas HTML. Kalau salah satunya diperbaiki, yang lain perlu ikut. */
function promoUnduhCsv(baris,namaBerkas){
  var csv=baris.map(function(r){
    return r.map(function(sel){ return '"'+String(sel==null?'':sel).replace(/"/g,'""')+'"'; }).join(',');
  }).join('\r\n');
  var blob=new Blob(['﻿sep=,\r\n'+csv],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=namaBerkas; a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); },2000);
}
/* Pengurai yang menghormati tanda kutip. Bukan split(','): kolom Syarat &
   Ketentuan hampir selalu memuat koma, dan pemisahan naif memotong satu promo
   jadi beberapa kolom melenceng — seluruh sisa barisnya masuk ke bidang yang
   salah tanpa satu pun galat. */
function promoParseCsv(teks){
  var t=String(teks||'').replace(/^﻿/,''), pisah='';
  var m=/^sep=(.)\r?\n/i.exec(t);
  if(m){ pisah=m[1]; t=t.slice(m[0].length); }
  if(!pisah){
    /* Ditebak dari baris judul: pemisah yang paling banyak muncul DI LUAR
       tanda kutip menang. Excel berbahasa Indonesia menyimpan dengan titik
       koma, yang berbahasa Inggris dengan koma, dan berkas yang sama
       bolak-balik antara keduanya di satu kantor. */
    var kepala=t.split(/\r?\n/)[0]||'', hit={',':0,';':0,'\t':0}, luar=true;
    for(var i=0;i<kepala.length;i++){
      var ch=kepala[i];
      if(ch==='"') luar=!luar;
      else if(luar && hit[ch]!==undefined) hit[ch]++;
    }
    pisah=[',',';','\t'].sort(function(a,b){ return hit[b]-hit[a]; })[0];
    if(!hit[pisah]) pisah=',';
  }
  var baris=[], sel='', row=[], dalam=false;
  for(var j=0;j<t.length;j++){
    var c=t[j];
    if(dalam){
      if(c==='"'){ if(t[j+1]==='"'){ sel+='"'; j++; } else dalam=false; }
      else sel+=c;
    }
    else if(c==='"') dalam=true;
    else if(c===pisah){ row.push(sel); sel=''; }
    else if(c==='\n'){ row.push(sel); baris.push(row); row=[]; sel=''; }
    else if(c!=='\r') sel+=c;
  }
  if(sel!=='' || row.length){ row.push(sel); baris.push(row); }
  return baris.filter(function(r){ return r.some(function(x){ return String(x).trim()!==''; }); });
}

function promoExport(){
  var data=promoTerlihat();
  if(!data.length){ toast('Tidak ada yang diekspor — longgarkan dulu penyaringnya.'); return; }
  var baris=[PROMO_CSV_KOL.map(function(k){ return k.k; })];
  data.forEach(function(p){
    baris.push(PROMO_CSV_KOL.map(function(kol){
      if(kol.tulis) return kol.tulis(p);
      return p[kol.b]==null?'':p[kol.b];
    }));
  });
  var hariIni=new Date();
  var iso=hariIni.getFullYear()+'-'+String(hariIni.getMonth()+1).padStart(2,'0')+'-'+String(hariIni.getDate()).padStart(2,'0');
  promoUnduhCsv(baris,'promo_'+iso+'.csv');
  toast(data.length+' promo diunduh — buka di Excel, sunting, lalu Import untuk mengembalikannya.');
}
/* TEMPLATE KOSONG (2 Oktober 2026, permintaan user): lembar untuk diisi promo
   baru lalu diimpor. Kolomnya DITURUNKAN dari PROMO_CSV_KOL — hanya yang punya
   `b` (yang memang DIBACA impor), tanpa ID. Ditulis tangan, kolom template dan
   kolom yang dibaca impor akan bergeser suatu hari, dan yang diisi orang di
   kolom yang tidak dibaca hilang tanpa satu pun galat.
   - ID tidak ikut: baris template selalu promo BARU, dan kolom ID kosong cuma
     membuat orang bertanya harus diisi apa.
   - Kolom keterangan (tipe, kategori, hari, outlet…) SENGAJA tidak ikut:
     impor mengabaikannya, jadi menawarkannya di lembar isian berarti
     menjanjikan sesuatu yang tidak akan tersimpan.
   - TIDAK ada baris contoh: baris contoh yang lupa dihapus ikut terimpor
     sebagai promo sungguhan dan muncul di Radar seluruh kru. Format tanggal
     disebut di toast dan di layar pratinjau impor. */
function promoTemplate(){
  var kepala=PROMO_CSV_KOL.filter(function(k){ return k.b && k.b!=='id'; }).map(function(k){ return k.k; });
  promoUnduhCsv([kepala],'template_promo.csv');
  toast('Template diunduh. Isi satu promo per baris — tanggal ditulis hari-bulan-tahun (mis. 17-08-2026) — lalu tekan Import Excel.');
}
function promoImportPilih(){
  var inp=document.createElement('input');
  inp.type='file'; inp.accept='.csv,.txt,text/csv';
  inp.onchange=function(){
    var f=inp.files&&inp.files[0]; if(!f) return;
    var fr=new FileReader();
    fr.onload=function(){ promoImportBaca(String(fr.result||''),f.name); };
    fr.onerror=function(){ toast('Berkasnya tidak bisa dibuka. Dari Excel: Save As → CSV UTF-8.'); };
    fr.readAsText(f,'utf-8');
  };
  inp.click();
}
/* Rencana impor yang sedang menunggu keputusan di layar pratinjau. Disimpan
   di luar modal karena tombol Terapkan ada di modal itu, dan membangun ulang
   rencananya dari berkas berarti membaca berkasnya dua kali — yang kedua bisa
   berbeda kalau orangnya menyunting sambil menunggu. */
var PROMO_IMPOR=null;
function promoImportBaca(teks,namaBerkas){
  var baris=promoParseCsv(teks);
  if(baris.length<2){ toast('Tidak ada satu baris data pun di bawah baris judul.'); return; }
  var kepala=baris[0].map(promoCsvKunci);
  /* Kolom dicari lewat namanya sendiri LALU alias-aliasnya, berurutan. Urutan
     itu penting: berkas POS punya "Promotion Notes" DAN "Promotion Master
     Code", dan yang diminta user adalah yang pertama. */
  var idx={};
  PROMO_CSV_KOL.forEach(function(kol){
    if(!kol.b) return;
    var calon=[kol.k].concat(kol.alias||[]);
    for(var i=0;i<calon.length;i++){
      var p=kepala.indexOf(promoCsvKunci(calon[i]));
      if(p>=0){ idx[kol.b]=p; break; }
    }
  });
  if(idx.nama===undefined){
    toast('Kolom nama promo tidak ketemu. Judulnya harus "Nama Promo" atau "Promotion Notes".');
    return;
  }
  var ambil=function(r,b){ return idx[b]===undefined?'':String(r[idx[b]]==null?'':r[idx[b]]).trim(); };
  var baru=[], ubah=[], lewat=[];
  var petaNama={};
  DB.promos.forEach(function(p){ petaNama[promoCsvKunci(p.nama)]=p; });

  baris.slice(1).forEach(function(r,i){
    var nama=ambil(r,'nama');
    if(!nama){ lewat.push({no:i+2,nama:'(kosong)',sebab:'Nama promo kosong'}); return; }
    var mulai=promoCsvTgl(ambil(r,'mulai')), selesai=promoCsvTgl(ambil(r,'selesai'));
    if(!mulai||!selesai){ lewat.push({no:i+2,nama:nama,sebab:'Tanggal mulai/selesai tidak terbaca'}); return; }
    /* Tanggal terbalik ditolak di sini, bukan diperbaiki diam-diam: promo
       yang selesainya sebelum mulai akan dihitung 'ended' dan lenyap dari
       Radar tanpa satu pun pesan. */
    if(selesai<mulai){ lewat.push({no:i+2,nama:nama,sebab:'Tanggal selesai sebelum tanggal mulai'}); return; }
    var benefit=promoCsvDiskon(ambil(r,'benefit'));
    var id=ambil(r,'id');
    var lama=(id && DB.promos.find(function(p){return p.id===id;})) || petaNama[promoCsvKunci(nama)] || null;
    var isi={nama:nama,mulai:mulai,selesai:selesai,benefit:benefit};
    if(lama) ubah.push({id:lama.id,lamaNama:lama.nama,isi:isi});
    else baru.push(isi);
  });

  if(!baru.length && !ubah.length){
    toast('Tidak ada baris yang bisa dipakai — '+lewat.length+' dilewati.');
  }
  PROMO_IMPOR={baru:baru,ubah:ubah,lewat:lewat,berkas:namaBerkas};
  promoImportPratinjau();
}
function promoImportPratinjau(){
  var r=PROMO_IMPOR; if(!r) return;
  var tabel=function(judul,rows,isi){
    if(!rows.length) return '';
    return '<div class="field"><label>'+esc(judul)+' ('+rows.length+')</label>'+
      '<div class="tw" style="max-height:210px;overflow:auto"><table><tbody>'+
      rows.slice(0,80).map(isi).join('')+
      (rows.length>80?'<tr><td colspan="4" class="mut">…dan '+(rows.length-80)+' baris lagi</td></tr>':'')+
      '</tbody></table></div></div>';
  };
  showModal(
    '<div class="modal-h"><h3>Pratinjau Import</h3>'+
      '<button class="x" onclick="closeModal()">'+ic('x')+'</button></div>'+
    '<div class="modal-b">'+
      '<div class="mut" style="font-size:12.5px;margin-bottom:10px">Berkas <b>'+esc(r.berkas)+'</b>. '+
        'Yang diambil dari berkas hanya <b>nama promo, tanggal mulai, tanggal selesai, dan benefit/diskon</b> — '+
        'kolom lain diabaikan. Promo yang sudah ada dicocokkan lewat ID, lalu lewat namanya.</div>'+
      '<div class="notice warn" style="margin-bottom:12px">📅 Tanggal berbentuk <b>17-08-2026</b> dibaca sebagai '+
        '<b>hari-bulan-tahun</b>. Periksa sekilas di daftar bawah sebelum menerapkan — tanggal yang tertukar tidak '+
        'menimbulkan galat, ia cuma memindahkan promonya ke bulan lain.</div>'+
      tabel('Promo baru',r.baru,function(x){
        return '<tr><td><b>'+esc(x.nama)+'</b></td><td class="mut">'+esc(x.mulai)+' → '+esc(x.selesai)+'</td>'+
          '<td class="mut">'+esc(x.benefit||'—')+'</td></tr>';
      })+
      tabel('Diperbarui',r.ubah,function(x){
        return '<tr><td><b>'+esc(x.isi.nama)+'</b></td><td class="mut">'+esc(x.isi.mulai)+' → '+esc(x.isi.selesai)+'</td>'+
          '<td class="mut">'+esc(x.isi.benefit||'—')+'</td></tr>';
      })+
      tabel('Dilewati',r.lewat,function(x){
        return '<tr><td class="mut">baris '+x.no+'</td><td>'+esc(x.nama)+'</td><td class="mut">'+esc(x.sebab)+'</td></tr>';
      })+
      /* Disebut TERANG-TERANGAN: promo baru dari POS lahir tanpa tipe,
         kategori, hari, outlet, maupun ketentuan — dan tanpa kalimat ini
         orang akan mengira impornya gagal separuh. */
      (r.baru.length?'<div class="notice info">Promo baru masuk sebagai <b>Promo Laksamana</b>, berlaku setiap hari, '+
        'di <b>'+esc(PROMO_OUTLET_BAWAAN)+'</b>, tanpa kategori & ketentuan. Lengkapi lewat tombol Ubah sesudah ini.</div>':'')+
    '</div>'+
    '<div class="modal-f">'+
      '<button class="btn" onclick="closeModal()">Batal</button>'+
      ((r.baru.length||r.ubah.length)
        ? '<button class="btn pri" onclick="APP.promoImportTerapkan()">Terapkan '+(r.baru.length+r.ubah.length)+' baris</button>'
        : '')+
    '</div>',true);
}
function promoImportTerapkan(){
  var r=PROMO_IMPOR; if(!r) return;
  r.ubah.forEach(function(x){
    var p=DB.promos.find(function(y){return y.id===x.id;});
    /* HANYA empat bidang yang ditimpa. Promo yang sudah dilengkapi di sini —
       poster, ketentuan, hari, kategori — tidak boleh hilang cuma karena
       berkas POS tidak punya kolomnya. */
    if(p) Object.assign(p,x.isi);
  });
  r.baru.forEach(function(x){
    DB.promos.unshift({
      id:uid('pr'), nama:x.nama, tipe:'in_house', kategori:'', benefit:x.benefit,
      mulai:x.mulai, selesai:x.selesai, jamMulai:'', jamSelesai:'', hari:[],
      outlet:PROMO_OUTLET_BAWAAN, partner:'', partnerPIC:'', partnerKontak:'',
      lmPIC:(AKU&&AKU.name)||((sesi()||{}).name)||'', kode:'', kuota:0,
      ketentuan:'', poster:'', paused:false,
      dibuatOleh:((sesi()||{}).name||''), dibuatAt:Date.now()
    });
  });
  var n=r.baru.length, u=r.ubah.length;
  PROMO_IMPOR=null;
  save(); closeModal(); render();
  toast('Import selesai — '+n+' promo baru, '+u+' diperbarui.');
}

/* ============ PURCHASING ============
   Dua peran dalam satu halaman, dan itu disengaja:

   - SIAPA PUN boleh mengajukan request order (tombol "Request Order").
     Formnya pendek — barang, jumlah, kapan dibutuhkan, alasan — karena
     pemintanya belum tahu vendor maupun harga, dan memaksanya menebak dua
     hal itu cuma menghasilkan angka karangan yang lalu dipercaya orang lain.
   - Tim purchasing melengkapinya lewat form penuh (vendor, nilai, status).

   Keduanya baris yang SAMA, bukan dua tabel. Request yang disetujui bukan
   dokumen baru; ia PO yang sama yang berpindah status, sehingga jejak dari
   permintaan sampai barang diterima tidak pernah putus. */
var poFilter='', poMode='pr', poMinggu=0;

/* Senin sebagai awal minggu, sama dengan kalender. */
function awalMinggu(iso){
  var d=pDate(iso||todayISO());
  d.setDate(d.getDate()-((d.getDay()+6)%7));
  return isoOf(d);
}
function geserMinggu(iso,n){ var d=pDate(iso); d.setDate(d.getDate()+n*7); return isoOf(d); }
function akhirMinggu(iso){ var d=pDate(awalMinggu(iso)); d.setDate(d.getDate()+6); return isoOf(d); }
function labelMinggu(senin){
  var m=pDate(senin), a=new Date(m); a.setDate(a.getDate()+6);
  return m.getDate()+' '+BLN[m.getMonth()]+' – '+a.getDate()+' '+BLN[a.getMonth()]+' '+a.getFullYear();
}
/* Nama peminta. `by` (id kru dari database account) diutamakan; `byName`
   dipakai untuk baris yang datang dari modul lain — Marketing tidak mengenal
   id kru BD, jadi ia mengirim namanya sebagai teks. Mengarang id di sana akan
   membuat kolom Peminta menunjuk orang yang salah, dan itu lebih buruk
   daripada teks biasa. */
function poRequester(p){
  if(p.by && P(p.by).id) return P(p.by).name;
  if(p.byName) return p.byName;
  return p.pic ? P(p.pic).name : '—';
}

function vPurchasing(){
  var berjalan=DB.po.filter(function(p){return !poBeres(p);});
  var nilai=berjalan.reduce(function(s,p){return s+(+p.amount||0);},0);
  var perluApproval=DB.po.filter(function(p){return !poBeres(p)&&p.status==='Diajukan';}).length;

  var h=head('Purchasing',SUB.purchasing[2],
    '<div class="seg">'+
      '<button class="'+(poMode==='daftar'||poMode==='setuju'?'':'on')+'" onclick="APP.setPoMode(\'pr\')">PR &amp; Rekap Mingguan</button>'+
      '<button class="'+(poMode==='daftar'?'on':'')+'" onclick="APP.setPoMode(\'daftar\')">Semua Item</button>'+
      '<button class="'+(poMode==='setuju'?'on':'')+'" onclick="APP.setPoMode(\'setuju\')">Penyetuju</button>'+
    '</div>'+
    '<button class="btn pri" onclick="APP.requestModal()">'+ic('plus')+'Request Order</button>');

  h+='<div class="stats">'+
    stat('Total PO',DB.po.length,DB.po.filter(poBeres).length+' sudah selesai','')+
    stat('Perlu approval',perluApproval,'status Diajukan',perluApproval?'wa':'gr')+
    stat('Nilai berjalan',fRpPenuh(nilai),'belum selesai','tl')+
  '</div>';

  /* PR Mingguan dan Rekap DIGABUNG jadi satu lembar (20 Agustus 2026).
     Dua tab untuk satu pekerjaan yang sama: yang menyusun PR minggu ini
     selalu perlu melihat rekap kebutuhan minggu itu juga, dan bolak-balik
     antar-tab membuat orang menyusun lembar sambil menghafal angkanya.
     Urutannya lembar PR dulu, rekap di bawahnya — yang dikerjakan di atas,
     yang dilihat sebagai konteks di bawah.

     poMode selain 'daftar'/'setuju' jatuh ke sini, termasuk 'minggu' yang
     tidak lagi punya tombol: nilai lama yang tersisa di sesi berjalan tidak
     boleh menghasilkan halaman kosong. */
  return h+(poMode==='setuju'?vPenyetuju()
          :poMode==='daftar'?poDaftar()
          :vPrList()+
            '<div style="margin:26px 0 12px;display:flex;align-items:center;gap:10px">'+
              '<h2 style="margin:0;font-size:15px;font-weight:700">Rekap kebutuhan mingguan</h2>'+
              '<span class="muted" style="font-size:12px">apa yang harus dikeluarkan minggu itu</span>'+
            '</div>'+
            poRekapMingguan());
}

function poDaftar(){
  var list=poFilter?DB.po.filter(function(p){return p.status===poFilter;}):DB.po;
  return '<div class="filters"><span class="flabel">'+ic('cart',14)+' Status</span>'+
      '<select onchange="APP.setPoFilter(this.value)"><option value="">Semua status</option>'+
        PO_FLOW.map(function(s){return '<option'+(poFilter===s?' selected':'')+'>'+s+'</option>';}).join('')+'</select>'+
      (poFilter?'<button class="btn sm" onclick="APP.setPoFilter(\'\')">'+ic('x',12)+'Reset</button>':'')+
    '</div>'+
    (list.length?poTabel(list)
    :'<div class="card"><div class="card-b">'+kosong('Tidak ada PO',poFilter?'Tidak ada PO berstatus '+poFilter+'.':'')+'</div></div>');
}

/* ---- PENANDA "SUDAH DIPROSES" = BARIS SELESAI ----
   `status` (Draft → Diajukan → Approved → Dibeli → Diterima) adalah posisi
   barang di alur pembelian. Penanda `proses` dulu berdiri SENDIRI di
   sampingnya: purchasing menandai mana yang sudah ditindaklanjuti, tapi
   statusnya tidak ikut bergerak.

   Sampai 20 Agustus 2026 itu justru membuat daftarnya berbohong. Barang yang
   sudah diurus sampai tuntas tetap berstatus Draft/Diajukan dengan kolom
   Butuh memerah "3h lewat", jadi lembar purchasing terbaca sebagai tumpukan
   keterlambatan yang sebenarnya sudah beres — dan yang benar-benar telat
   tenggelam di antaranya.

   Sekarang penandanya MENGGERAKKAN status ke tahap terakhir (PO_SELESAI), dan
   tanggal butuhnya tidak lagi digambar sebagai tenggat. Status sebelumnya
   disimpan di `statusSebelum` supaya centang yang salah tekan bisa dibatalkan
   tanpa kehilangan posisi barang di alurnya — mengembalikannya ke 'Draft'
   akan menghapus fakta bahwa barang itu sudah pernah di-approve.

   Disimpan di field `proses` + jejak siapa/kapan. Backend menyimpan seluruh
   baris sebagai JSON di kolom `data`, jadi field baru tidak butuh migrasi. */
function poBeres(p){ return !!p.proses || p.status===PO_SELESAI; }
function poProsesSel(p){
  var on=!!p.proses;
  var judul=on
    ? 'Sudah diproses'+(p.prosesBy?' oleh '+p.prosesBy:'')+(p.prosesAt?' · '+fWaktu(p.prosesAt):'')+' — klik untuk batalkan'
    : 'Klik kalau barang ini sudah diproses — statusnya jadi '+PO_SELESAI;
  return '<span class="pill '+(on?'p-go':'p-mute')+'" role="button" tabindex="0" style="cursor:pointer;user-select:none"'+
    ' title="'+esc(judul)+'"'+
    ' onclick="event.stopPropagation();APP.togglePoProses(\''+p.id+'\')">'+
    (on?'✓ Done':'Belum')+'</span>';
}
function togglePoProses(id){
  var p=DB.po.find(function(x){return x.id===id;}); if(!p) return;
  p.proses=!p.proses;
  // Jejaknya ikut dibersihkan saat penandanya dilepas — meninggalkan nama dan
  // jam pada baris yang statusnya "Belum" membuat tooltip berbohong.
  if(p.proses){
    p.prosesAt=Date.now(); p.prosesBy=(AKU&&AKU.name)||'';
    if(p.status!==PO_SELESAI){ p.statusSebelum=p.status; p.status=PO_SELESAI; }
  }else{
    delete p.prosesAt; delete p.prosesBy;
    /* Hanya dikembalikan kalau statusnya memang masih yang kita pasang.
       Kalau sesudah dicentang orang mengubah statusnya sendiri lewat modal,
       pilihan orang itu yang menang. */
    if(p.status===PO_SELESAI && p.statusSebelum) p.status=p.statusSebelum;
    delete p.statusSebelum;
  }
  save(); render();
}

function poTabel(list){
  return '<div class="tw"><table><thead><tr><th>Item</th><th>Peminta</th><th>Diinput</th><th>Vendor</th><th>Qty</th><th>Nilai</th>'+
    '<th>Divisi</th><th>Butuh</th><th>Proses</th><th>Status</th><th></th></tr></thead><tbody>'+
    list.map(function(p){
      var pr=p.project&&DB.projects.find(function(x){return x.id===p.project;});
      var beres=poBeres(p);
      var telat=!beres&&sisaHari(p.needBy)<0;
      /* Nilai 0 pada request yang belum diproses BUKAN "gratis" — belum
         dihitung. Menampilkannya sebagai "Rp 0" membuat rekap mingguan
         terbaca seolah minggu itu tidak memakan biaya apa pun. */
      var belumDihitung=(!(+p.amount)) && (p.status==='Draft'||p.status==='Diajukan');
      return '<tr class="clk" onclick="APP.poModal(\''+p.id+'\')">'+
        '<td><span class="nm">'+esc(p.item)+'</span>'+
          (pr?'<div class="tag proj" style="margin-top:3px;display:inline-block">'+esc(pr.name)+'</div>':'')+
          (p.note?'<div class="mut" style="font-size:11.5px;margin-top:2px">'+esc(p.note)+'</div>':'')+'</td>'+
        '<td><span class="mut">'+esc(poRequester(p))+'</span>'+
          /* Asal modul ditandai. Baris dari Marketing tidak punya id kru BD,
             jadi tanpa penanda ini "kenapa Peminta-nya cuma teks" jadi
             pertanyaan yang tidak ada jawabannya di layar. */
          (p.sumber?'<div><span class="tag">dari '+esc(p.sumber)+'</span></div>':'')+'</td>'+
        /* Waktu input + siapa yang mengetik. Dua-duanya perlu: saat ada dua
           permintaan mirip, yang menjelaskan duplikatnya biasanya "diketik dua
           orang berbeda dalam sepuluh menit", dan itu tidak terlihat dari
           tanggal saja. */
        '<td><span class="mut" style="white-space:nowrap">'+esc(fWaktu(p.at))+'</span>'+
          (p.input&&p.input!==poRequester(p)?'<div class="mut" style="font-size:11px">oleh '+esc(p.input)+'</div>':'')+'</td>'+
        '<td><span class="mut">'+esc(p.vendor||'—')+'</span></td>'+
        '<td><span class="mut num">'+(+p.qty||0)+' '+esc(p.unit||'')+'</span></td>'+
        '<td>'+(belumDihitung?'<span class="mut">belum dihitung</span>':'<span class="nm num">'+fRpPenuh(p.amount)+'</span>')+'</td>'+
        '<td><span class="tag div">'+esc(String(p.div).split(' ')[0])+'</span></td>'+
        /* Baris yang sudah beres tidak lagi menampilkan tenggat sama sekali —
           bukan cuma dihilangkan merahnya. "Kemarin" di kolom Butuh tetap
           terbaca sebagai keterlambatan walau warnanya netral; tanggalnya
           dipindah ke tooltip supaya tidak hilang dari layar. */
        '<td>'+(beres
            ? '<span class="pill p-go" title="'+esc(p.needBy?'Dibutuhkan '+fTgl(p.needBy):'Tanpa tanggal butuh')+'">Done</span>'
            : '<span class="mut"'+(telat?' style="color:var(--danger);font-weight:600"':'')+'>'+fDue(p.needBy)+'</span>')+'</td>'+
        '<td>'+poProsesSel(p)+'</td>'+
        '<td>'+pill(p.status,PO_COLOR[p.status]||'p-mute')+'</td>'+
        '<td><button class="iconbtn" title="Hapus" onclick="event.stopPropagation();APP.hapusPo(\''+p.id+'\')">'+ic('trash')+'</button></td></tr>';
    }).join('')+'</tbody></table></div>';
}

/* ---- REKAP MINGGUAN ----
   Dikelompokkan menurut TANGGAL DIBUTUHKAN (needBy), bukan tanggal request.
   Pertanyaan yang dijawab rekap ini adalah "minggu depan kita harus
   mengeluarkan apa saja", dan itu ditentukan kapan barangnya dipakai — bukan
   kapan orang sempat mengetik permintaannya. Tanggal request tetap tercatat
   dan tampil di barisnya. */
function poRekapMingguan(){
  var senin=geserMinggu(awalMinggu(todayISO()),poMinggu);
  var akhir=geserMinggu(senin,1);
  var minggu=DB.po.filter(function(p){ return p.needBy && p.needBy>=senin && p.needBy<akhir; });

  var perStatus={};
  PO_FLOW.forEach(function(s){ perStatus[s]=0; });
  var nilai=0, belum=0;
  minggu.forEach(function(p){
    perStatus[p.status]=(perStatus[p.status]||0)+1;
    var a=+p.amount||0;
    nilai+=a;
    if(!a && (p.status==='Draft'||p.status==='Diajukan')) belum++;
  });

  var h='<div class="filters">'+
    '<div class="seg">'+
      '<button onclick="APP.geserMingguPo(-1)">'+ic('chevL',14)+'</button>'+
      '<button class="on" style="cursor:default">'+labelMinggu(senin)+'</button>'+
      '<button onclick="APP.geserMingguPo(1)">'+ic('chevR',14)+'</button>'+
    '</div>'+
    (poMinggu?'<button class="btn sm" onclick="APP.geserMingguPo(0)">Minggu ini</button>':
              '<span class="pill p-gold">minggu ini</span>')+
    '<span class="muted" style="font-size:12px;margin-left:auto">dikelompokkan menurut tanggal dibutuhkan</span>'+
  '</div>';

  h+='<div class="stats">'+
    stat('PO minggu ini',minggu.length,minggu.length?'butuh antara '+labelMinggu(senin):'tidak ada kebutuhan','')+
    stat('Nilai',fRp(nilai),belum?belum+' item belum dihitung':'seluruhnya sudah dihitung',belum?'wa':'tl')+
    stat('Perlu approval',perStatus['Diajukan']||0,'menunggu diproses',(perStatus['Diajukan']||0)?'wa':'gr')+
    stat('Sudah diterima',perStatus['Diterima']||0,'dari '+minggu.length+' PO',
         (minggu.length&&perStatus['Diterima']===minggu.length)?'gr':'')+
  '</div>';

  h+='<div class="card" style="margin-bottom:16px"><div class="card-b" style="display:flex;gap:9px;flex-wrap:wrap">'+
    PO_FLOW.map(function(s){
      return '<span class="pill '+(PO_COLOR[s]||'p-mute')+'">'+s+': '+(perStatus[s]||0)+'</span>';
    }).join('')+'</div></div>';

  h+=(minggu.length? poTabel(minggu.slice().sort(function(a,b){return a.needBy<b.needBy?-1:1;}))
    :'<div class="card"><div class="card-b">'+
      kosong('Tidak ada PO yang dibutuhkan minggu ini',
        'Geser ke minggu lain, atau buat request lewat tombol Request Order.')+'</div></div>');

  /* Ringkasan 6 minggu ke depan: rekap satu minggu menjawab "minggu ini apa",
     tapi tidak menjawab "minggu mana yang menumpuk". Deretan ini yang
     membuat penumpukan terlihat sebelum terjadi. */
  var depan='';
  for(var i=-1;i<5;i++){
    var s0=geserMinggu(awalMinggu(todayISO()),i), s1=geserMinggu(s0,1);
    var g=DB.po.filter(function(p){ return p.needBy && p.needBy>=s0 && p.needBy<s1; });
    var n=g.reduce(function(a,p){return a+(+p.amount||0);},0);
    depan+='<tr class="clk" onclick="APP.pilihMinggu('+i+')"'+(i===poMinggu?' style="background:var(--gold-glow)"':'')+'>'+
      '<td><span class="nm">'+labelMinggu(s0)+'</span>'+(i===0?' '+pill('minggu ini','p-gold'):'')+'</td>'+
      '<td><span class="num">'+g.length+'</span></td>'+
      '<td><span class="num">'+fRp(n)+'</span></td>'+
      '<td>'+(g.filter(function(p){return p.status==='Diajukan';}).length||'—')+'</td></tr>';
  }
  h+='<div class="card" style="margin-top:16px"><div class="card-h"><h3>Enam minggu terdekat</h3></div>'+
    '<div class="tw" style="border:none;box-shadow:none;border-radius:0">'+
    '<table><thead><tr><th>Minggu</th><th>PO</th><th>Nilai</th><th>Perlu approval</th></tr></thead>'+
    '<tbody>'+depan+'</tbody></table></div></div>';
  return h;
}

/* ============ PURCHASE REQUEST MINGGUAN ============
   Lembar inilah yang sebenarnya berjalan di tim: dikumpulkan sepanjang
   minggu, dijadikan satu dokumen bernomor, dikirim sebagai PDF ke Finance dan
   CEO, lalu ditandatangani. Aplikasi ini tidak mengubah alur itu — ia hanya
   menggantikan pengetikan ulang di spreadsheet.

   Item TIDAK disalin ke dalam dokumen. `po.prId` menunjuk ke dokumennya, jadi
   satu item hanya punya satu tempat tinggal. Dokumen yang menyalin isi item
   akan menyimpang dari barisnya begitu salah satu diubah, dan tidak akan ada
   yang tahu mana yang benar — persis masalah yang membuat rekap spreadsheet
   lama harus dicek ulang manual. */
function prItems(prId){ return DB.po.filter(function(p){return p.prId===prId;}); }
/* Lembar PR dianggap SELESAI kalau seluruh itemnya sudah beres, dan itu
   DIHITUNG — bukan penanda tersimpan yang harus ditekan seseorang.

   Sebabnya: penanda tersimpan berarti ada dua kebenaran yang bisa berselisih.
   Lembar bertanda "arsip" yang salah satu itemnya dibuka lagi akan duduk di
   arsip dengan pekerjaan hidup di dalamnya, dan tidak ada tempat yang
   melaporkannya. Dihitung dari itemnya, melepas centang satu item langsung
   menarik lembarnya kembali ke daftar berjalan.

   Lembar KOSONG tidak pernah dianggap selesai: nol dari nol memenuhi "semua
   sudah beres" secara logika, tapi lembar yang baru dibuat dan itemnya belum
   dimasukkan akan langsung lenyap ke arsip. */
function prBeres(prId){
  var items=prItems(prId);
  return items.length>0 && items.every(poBeres);
}
function prTotal(prId){
  var grand=0, belum=0;
  prItems(prId).forEach(function(p){
    var a=+p.amount||0;
    grand+=a;
    if(!a) belum++;
  });
  return {grand:grand, belum:belum};
}
function prNoBerikut(){
  /* Nomor diambil dari yang TERTINGGI, bukan dari jumlah dokumen. PR yang
     pernah dihapus tidak boleh membuat nomor terpakai ulang — dua lembar
     bernomor sama di arsip Finance tidak bisa dibedakan lagi. */
  var maks=0;
  DB.pr.forEach(function(x){ var n=parseInt(x.no,10); if(!isNaN(n)&&n>maks) maks=n; });
  return String(maks+1);
}

var prAktif=null;
var prLihatArsip=false;

/* Request yang BELUM ikut dokumen mana pun.

   TIDAK disaring per minggu, dan itu koreksi dari rancangan pertama. Lembar
   PR yang dipakai tim tidak punya tanggal-dibutuhkan per baris sama sekali —
   yang ada cuma satu REQUEST DATE untuk seluruh lembar. Cara kerjanya
   mengumpulkan apa pun yang masuk, lalu menjadikannya satu lembar; bukan
   memilah menurut kapan barangnya dipakai.

   Versi pertama menyaringnya menurut minggu needBy, dan akibatnya request
   yang baru saja diketik menghilang dari layar hanya karena tanggal
   butuhnya jatuh di minggu berikutnya. Yang tersaring diam-diam lebih buruk
   daripada daftar panjang: orang menyangka datanya tidak tersimpan. */
function poBebas(){ return DB.po.filter(function(p){ return !p.prId; }); }

  var urut=DB.pr.slice().sort(function(a,b){return (b.tanggal||b.weekStart||'')<(a.tanggal||a.weekStart||'')?-1:1;});

  h+='<div class="filters">'+

    tampil.map(function(x){

function idTerpilihPr(){
  var out=[];
  document.querySelectorAll('.pick:checked').forEach(function(el){ out.push(el.getAttribute('data-id')); });
  return out;
}
function buatPr(){
  var pilih=idTerpilihPr();
  var bebas=poBebas().filter(function(p){ return pilih.indexOf(p.id)>-1; });
  if(!bebas.length){ toast('Belum ada item yang dicentang.'); return; }

  /* KONFIRMASI DULU, jangan langsung terbentuk.

     Lembar PR memakan nomor urut, dan nomor itu tidak bisa dipakai ulang —
     PR yang terbuat karena salah tekan meninggalkan lubang di penomoran arsip
     Finance yang tidak bisa dijelaskan lagi setahun kemudian. Satu dialog
     jauh lebih murah daripada nomor yang hilang. */
  var total=bebas.reduce(function(a,p){return a+(+p.amount||0);},0);
  var daftar=bebas.slice(0,8).map(function(p,i){return '  '+(i+1)+'. '+p.item;}).join('\n')+
             (bebas.length>8?'\n  … dan '+(bebas.length-8)+' item lagi':'');
  if(!confirm('Buat lembar PR-'+prNoBerikut()+' berisi '+bebas.length+' item?\n\n'+daftar+
    '\n\nGrand total: '+fRpPenuh(total)+
    '\n\nLembarnya dibuat sebagai DRAFT — belum terkirim ke siapa pun sampai kamu '+
    'menekan "Kunci & ajukan" di halaman dokumennya.')) return;

  var senin=awalMinggu(todayISO());
  var approvals={};
  penyetujuPr(null).forEach(function(s){ approvals[s.k]={nama:s.nama, at:'', oleh:''}; });
  var pr={
    id:uid('pr'), no:prNoBerikut(),
    nama:(AKU&&AKU.name)||((sesi()||{}).name)||'—',
    dept:(AKU&&AKU.div)||'Purchasing',
    tanggal:todayISO(), weekStart:senin, status:'Draft',
    total:0, approvals:approvals, catatan:''
  };
  DB.pr.push(pr);
  bebas.forEach(function(p){ p.prId=pr.id; });
  pr.total=prTotal(pr.id).grand;
  save(); bukaPr(pr.id);
  toast('PR-'+pr.no+' dibuat dari '+bebas.length+' request');
}
function bukaPr(id){
  prAktif=id;
  // Persetujuan lama berkunci 'finance'/'ceo'/'head' dipindah ke id orang saat
  // lembarnya dibuka — kalau tidak, PR yang sudah disetujui tampil kosong lagi.
  migrasiApprovals(DB.pr.find(function(x){return x.id===id;}));
  view='prDetail'; render(); window.scrollTo(0,0);
}
function hapusPr(id){
  var n=prItems(id).length;
  if(!confirm('Hapus dokumen PR ini?\n\n'+n+' item di dalamnya TIDAK ikut terhapus — '+
    'mereka kembali jadi request bebas dan bisa dimasukkan ke PR lain.')) return;
  DB.po.forEach(function(p){ if(p.prId===id) p.prId=null; });
  DB.pr=DB.pr.filter(function(x){return x.id!==id;});
  save(); closeModal(); view='purchasing'; render(); toast('Dokumen PR dihapus, itemnya dilepas');
}

}
function masukkanKePr(poId){

  p.prId=prAktif;
  var pr=DB.pr.find(function(x){return x.id===prAktif;});

/* ---- REALISASI & OVERBUDGET (3 Agustus 2026) ----------------------------
   `amount`    = harga yang DIAJUKAN saat request dibuat.
   `realisasi` = harga yang BENAR-BENAR dibayar saat barangnya dibeli.
   overbudget  = amount − realisasi, DIHITUNG, tidak pernah disimpan.

   Sengaja tidak disimpan: satu angka turunan yang ikut ditulis ke data pasti
   akan menyimpang begitu salah satu penyusunnya diubah dan yang lain lupa
   dihitung ulang. Positif = hemat, negatif = lebih mahal dari pengajuan.

   Baris yang realisasinya belum diisi TIDAK dianggap nol — ia belum dibeli,
   dan menampilkan overbudget "+Rp2.000.000" untuk barang yang belum dibeli
   akan terbaca seolah anggarannya sudah kembali. */
function realisasiNum(p){
  var v=p&&p.realisasi;
  return (v===''||v===null||v===undefined)?null:(+v||0);
}
function overbudget(p){
  var r=realisasiNum(p);
  return r===null?null:(+p.amount||0)-r;
}
function selRealisasi(p){
  /* Kotak isian, bukan teks: purchasing mengisinya langsung di lembar ini
     saat barangnya dibeli. no-print di kotaknya saja — nilainya tetap
     tercetak lewat span di sebelahnya. */
  var r=realisasiNum(p);
  /* Angkanya BERTITIK RIBUAN (27 Agustus 2026, permintaan user). Nilai di
     lembar ini jutaan rupiah, dan "1985000" tanpa pemisah adalah bentuk yang
     paling mudah salah dibaca satu digit — di lembar yang justru dipakai
     mencocokkan uang. isiRealisasi() membuang titiknya lagi saat menyimpan,
     jadi yang tersimpan tetap angka murni. */
  return '<input class="rz-inp" inputmode="numeric" data-rz="'+esc(p.id)+'" '+
           'oninput="APP.isiRealisasi(this.dataset.rz,this.value)" '+
           'value="'+(r===null?'':esc(rzFormat(r)))+'" placeholder="belum dibeli" '+
           'style="width:110px;text-align:right;padding:5px 7px;border:1.5px solid var(--line);border-radius:7px;font:inherit;font-variant-numeric:tabular-nums">'+
         '<span class="only-print">'+(r===null?'—':fRpPenuh(r))+'</span>';
}
function selOverbudget(p){
  var o=overbudget(p);
  if(o===null) return '<span class="muted">—</span>';
  if(o===0)    return '<span class="muted">Rp0</span>';
  // Lebih mahal dari pengajuan ditandai merah dan diberi tanda minus, persis
  // seperti lembar yang selama ini dipakai purchasing.
  return '<span style="color:var(--'+(o<0?'danger':'ok')+');font-weight:700">'+
         (o<0?'−':'')+fRpPenuh(Math.abs(o))+'</span>';
}
/* Simpan realisasi saat diketik. Ditunda 500 ms supaya tidak menulis ke
   server tiap huruf, dan TIDAK menggambar ulang halaman — render ulang saat
   orang sedang mengetik akan merebut fokus dari kotaknya. Kolom overbudget
   di baris yang sama ditambal di tempat. */
var _rzTimer=null;
/* Angka murni → "1.985.000". Dipakai saat menggambar kotak DAN saat mengetik,
   supaya bentuk yang muncul pertama kali tidak pernah berbeda dari bentuk
   sesudah disentuh. */
function rzFormat(v){
  var d=String(v==null?'':v).replace(/[^0-9]/g,'');
  return d?Number(d).toLocaleString('id-ID'):'';
}
function isiRealisasi(id,nilai){
  var p=DB.po.find(function(x){return x.id===id;});
  if(!p) return;
  var t=String(nilai).replace(/[^0-9]/g,'');
  p.realisasi = t===''?'':(+t);
  var sel=document.querySelector('[data-rz="'+id+'"]');
  if(sel){
    /* Titik ribuan dipasang ulang SAMBIL mengetik, dan kursornya digeser
       sebanyak titik yang bertambah/berkurang. Tanpa penggeseran itu, kursor
       melompat ke ujung kanan tiap kali sebuah titik lahir — dan yang sedang
       membetulkan digit di tengah angka akan mengetik sisanya di tempat yang
       salah tanpa sadar. */
    var sebelum=sel.value.length, caret=sel.selectionStart;
    sel.value=rzFormat(t);
    var geser=sel.value.length-sebelum;
    try{ sel.setSelectionRange(Math.max(0,caret+geser), Math.max(0,caret+geser)); }catch(e){}
    var td=sel.closest('td');
    if(td&&td.nextElementSibling) td.nextElementSibling.innerHTML=selOverbudget(p);
  }
  clearTimeout(_rzTimer);
  _rzTimer=setTimeout(function(){ save(); }, 500);
}

/* ================= SET PENYETUJU =====================================
   Satu "set" = satu susunan penanda tangan untuk lembar PR. Boleh lebih dari
   satu: PR Marketing dan PR Business Development memakai orang yang berbeda,
   dan sebelumnya itu tidak mungkin karena daftarnya dipatok di kode.

   Bentuk: { id, nama, orang:[personId,…], bawaan:true|false }
   `orang` menyimpan ID BARIS PEOPLE, bukan nama — nama bisa berubah di Office
   dan set yang menyimpan nama akan diam-diam kehilangan orangnya. Jabatan
   yang tercetak TIDAK disimpan di sini sama sekali: ia selalu dibaca ulang
   dari Tim/Keterangan orang itu, jadi promosi yang dicatat di Office langsung
   ikut ke lembar PR tanpa ada yang perlu menyunting apa pun di BD. */
function approverSets(){
  if(!Array.isArray(DB.approverSets)) DB.approverSets=[];
  return DB.approverSets;
}
/* Set bawaan. Dibuat sekali dari PENYETUJU_BIBIT kalau belum ada satu pun —
   supaya instalasi lama tetap punya susunan yang sama seperti sebelumnya, dan
   tidak ada lembar PR yang tiba-tiba kehilangan kolom tanda tangannya. */
function setBawaan(){
  var s=approverSets();
  if(!s.length){
    s.push({ id:uid('as'), nama:'Default', bawaan:true,
      orang:PENYETUJU_BIBIT.map(function(nm){
        var p=(DB.people||[]).find(function(x){
          return String(x.name||'').trim().toLowerCase()===nm.trim().toLowerCase();});
        return p?p.id:null;
      }).filter(Boolean) });
  }
  return s.find(function(x){return x.bawaan;})||s[0];
}
function setPr(pr){
  var s=approverSets();
  return (pr&&pr.setId&&s.find(function(x){return x.id===pr.setId;})) || setBawaan();
}
/* Jabatan yang tercetak di bawah kotak tanda tangan. Sumbernya Tim/Keterangan
   Office (p.ket). Kalau kosong, jatuh ke role BD, lalu ke '—' — bukan ke
   tebakan: kolom jabatan yang mengarang isi pada dokumen yang ditandatangani
   lebih berbahaya daripada kolom yang mengaku tidak tahu. */
function jabatanOrang(p){
  var t=String((p&&p.ket)||'').trim() || String((p&&p.role)||'').trim();
  return t ? t.toUpperCase() : '—';
}
/* Daftar penanda tangan untuk satu PR, dalam bentuk yang dipakai penggambar:
   {k, l, nama, pid}. `k` = kunci approval, memakai ID ORANG supaya persetujuan
   tetap menempel pada orangnya walau posisinya di set digeser. */
function penyetujuPr(pr){
  var set=setPr(pr);
  return (set&&set.orang||[]).map(function(pid){
    var p=(DB.people||[]).find(function(x){return x.id===pid;});
    if(!p) return null;
    return { k:p.id, l:jabatanOrang(p), nama:p.name||'—', pid:p.id };
  }).filter(Boolean);
}
/* MIGRASI approvals lama. Sebelum ini kuncinya 'finance'/'ceo'/'head'; sekarang
   id orang. Dipindahkan saat lembarnya dibuka, berdasarkan urutan set bawaan —
   itu urutan yang sama dengan konstanta lama. Tanpa ini, PR yang sudah
   disetujui akan tampil kosong lagi seolah persetujuannya hilang. */
function migrasiApprovals(pr){
  if(!pr||!pr.approvals) return;
  var lama=['finance','ceo','head'], set=setBawaan(), ubah=false;
  lama.forEach(function(k,i){
    var a=pr.approvals[k];
    if(!a) return;
    var pid=(set&&set.orang||[])[i];
    if(pid && !pr.approvals[pid]){ pr.approvals[pid]=a; ubah=true; }
    delete pr.approvals[k]; ubah=true;
  });
  if(ubah) save();
}

/* ---- SIAPA YANG BOLEH MENEKAN SETUJUI --------------------------------
   Nama penyetuju diambil dari User Database Office (DB.people, hasil sinkron
   roster) berdasarkan NAMA di PENYETUJU — bukan dipatok id, karena id akun
   bisa berbeda antar lingkungan dan nama itulah yang tertulis di lembar
   fisiknya.

   Yang boleh menekan: orang yang bersangkutan sendiri, atau admin modul BD /
   superadmin. Selain itu tombolnya mati dengan alasan yang disebutkan —
   sebelumnya siapa pun bisa menekannya, dan catatan "via <nama>" tidak
   menahan apa pun.

   TETAP BUKAN OTORISASI SUNGGUHAN: ini dicek di browser. Yang mengikat
   tetap PDF bertanda tangan. Kalau suatu saat harus jadi otorisasi, tempat
   pemeriksaannya WAJIB di server. */
function orangPenyetuju(s){
  // s.pid sudah id baris people (dari penyetujuPr). Pencocokan nama hanya
  // cadangan untuk pemanggil lama yang cuma punya nama.
  if(s&&s.pid) return (DB.people||[]).find(function(p){return p.id===s.pid;})||null;
  var nm=String((s&&s.nama)||'').trim().toLowerCase();
  return (DB.people||[]).find(function(p){
    return String(p.name||'').trim().toLowerCase()===nm;
  })||null;
}
function bolehSetuju(s){
  if(adminModul()) return true;                       // admin BD / superadmin
  var aku=String((sesi()||{}).name||'').trim().toLowerCase();
  if(!aku) return false;
  /* Dicocokkan lewat officeUserId kalau ada — nama bisa berbeda tipis antara
     sesi Office dan baris people ("Howandi" vs "Howandi Chandra"), dan
     pencocokan nama mentah akan menolak orang yang sebenarnya berhak. */
  var p=orangPenyetuju(s), sid=(sesi()||{}).id;
  if(p&&sid&&p.officeUserId&&String(p.officeUserId)===String(sid)) return true;
  return aku===String((s&&s.nama)||'').trim().toLowerCase();
}
/* Alasan tombolnya mati — ditulis apa adanya supaya tidak ada yang mengira
   halamannya rusak. Nama yang BELUM terdaftar di Office disebut terpisah:
   itu bukan soal izin, itu akunnya memang belum dibuat. */
function alasanTakBolehSetuju(s){
  return orangPenyetuju(s)
    ? 'Hanya '+s.nama+' atau admin BD yang bisa menekan ini.'
    : s.nama+' belum terdaftar di User Database Office — mintakan akunnya dibuat dulu.';
}

/* Persetujuan mencatat SIAPA yang menekannya (dari sesi Office) dan kapan.

   Ini jejak, BUKAN penjagaan: aplikasi tidak memeriksa apakah yang menekan
   benar-benar Finance atau CEO. Yang mengikat tetap PDF bertanda tangan —
   layar ini merekam persetujuan yang sudah terjadi, bukan menggantikannya.
   Kalau nanti ini harus jadi otorisasi sungguhan, pemeriksaannya wajib di
   server; dicek di browser tidak menahan siapa pun. */
function setujuPr(kunci,batal){
  var pr=DB.pr.find(function(x){return x.id===prAktif;});
  if(!pr) return;
  pr.approvals=pr.approvals||{};
  var def=penyetujuPr(pr).find(function(s){return s.k===kunci;})||{};
  /* Gerbang yang SAMA dipakai tombolnya dan di sini. Tombol yang mati masih
     bisa dipanggil dari konsol, dan membatalkan persetujuan orang lain sama
     seriusnya dengan memberikannya. */
  if(!bolehSetuju(def)){ toast(alasanTakBolehSetuju(def)); return; }
  var a=pr.approvals[kunci]||{nama:def.nama||'',at:'',oleh:''};
  if(batal){
    if(!confirm('Batalkan persetujuan '+(def.l||kunci)+'?')) return;
    a.at=''; a.oleh='';
  }else{
    a.at=todayISO();
    a.oleh=(sesi()||{}).name||'?';
  }
  pr.approvals[kunci]=a;
  var semua=penyetujuPr(pr).every(function(s){return (pr.approvals[s.k]||{}).at;});
  if(semua && pr.status!=='Selesai') pr.status='Disetujui';
  if(!semua && pr.status==='Disetujui') pr.status='Diajukan';
  save(); render();
  toast(batal?'Persetujuan dibatalkan':(def.l||kunci)+' disetujui');
}

   Bentuknya tabel, bukan satu form per barang, karena begitulah kebutuhan
   datang: sekali duduk seseorang menuliskan tujuh hal yang kurang minggu ini.
   Form satu-barang memaksa membuka-tutup modal tujuh kali dan mengisi ulang
   divisi, tanggal, serta project setiap kalinya — cukup melelahkan untuk
   membuat orang menunda, dan request yang ditunda berubah jadi pesan WhatsApp
   yang tidak tercatat di mana pun.

   Divisi, tanggal dibutuhkan, dan project ditaruh SEKALI di atas: satu sesi
   pengisian hampir selalu untuk keperluan yang sama. Yang berbeda tinggal
   diubah lewat form penuh sesudahnya. */
/* Kolom "Request" = SIAPA yang minta barang itu, dan namanya datang dari
   database account (tabel people, hasil sinkron roster) — bukan diketik.

   Per BARIS, bukan sekali untuk seluruh form: di lembar PR yang dipakai tim,
   satu lembar berisi permintaan beberapa orang sekaligus (Wandi, Rizki, …)
   yang dikumpulkan satu penyusun. Memaksa satu nama untuk seluruh sesi
   membuat kolom itu selalu berisi nama penyusunnya, dan pertanyaan "ini

/* ============ CALENDAR ============ */
var calRef=null;
/* Semua yang punya tanggal dikumpulkan jadi satu daftar. Sumbernya empat, dan
   warnanya sengaja beda supaya "banyak merah di satu minggu" langsung terbaca
   sebagai minggu yang padat deadline, bukan sekadar penuh. */
/* `geser` menandai item yang boleh DIPINDAH dengan menyeretnya ke kotak lain.

   Hanya task. Milestone, PO, dan koordinasi punya konsekuensi di luar
   kalender — milestone mengikat kesepakatan project, tanggal PO mengikat
   vendor, due koordinasi sudah dijanjikan ke divisi lain — dan menggesernya
   dengan satu tarikan tangan yang bahkan bisa tidak sengaja terlalu murah
   untuk perubahan sepenting itu. Ketiganya tetap diubah lewat modalnya
   masing-masing, di mana orang melihat konteks lengkapnya dulu. */
/* Kalender memakai penyaring YANG SAMA dengan Projects — lingkup, divisi, dan
   PIC. Sebelumnya ia menampilkan seisi papan tanpa peduli penyaring mana pun
   yang sedang aktif, jadi berpindah dari Projects ke Calendar seperti
   berpindah ke aplikasi lain.

   Koordinasi dan agenda TIDAK ikut disaring PIC: keduanya tidak punya PIC di
   sisi BD (koordinasi ditujukan ke divisi lain, agenda milik tim). Menyaring
   berdasarkan field yang tidak ada berarti menyembunyikan semuanya begitu
   satu nama dicentang. */
function calItems(){
  var out=[];
  var tugas=saringLingkup(DB.tasks,pScope).filter(cocokPic)
              .filter(function(t){ return (!pDiv||t.div===pDiv) && t.deadline && !selesai(t); });
  tugas.forEach(function(t){
    out.push({date:t.deadline,title:t.name,color:'var(--danger)',jenis:'Deadline',id:t.id,geser:true});});

  saringLingkup(DB.projects,pScope).filter(cocokPic)
    .filter(function(p){ return !pDiv||p.div===pDiv; })
    .forEach(function(p){(p.milestones||[]).forEach(function(ms){
      if(ms.date) out.push({date:ms.date,title:ms.t+' ('+p.name+')',color:'var(--violet)',jenis:'Milestone'});});});

  DB.po.filter(function(p){
      /* poBeres, bukan status saja: baris lama yang sudah ditandai proses
         sebelum 20 Agustus 2026 statusnya masih Draft/Diajukan, dan tanpa ini
         ia terus nongol di kalender sebagai kebutuhan yang belum diurus. */
      return !poBeres(p) && p.needBy &&
             (!pDiv||p.div===pDiv) && (!fPics.length || fPics.indexOf(p.pic)>-1);
    }).forEach(function(p){
      out.push({date:p.needBy,title:'PO: '+p.item,color:'var(--teal)',jenis:'PO'});});

  DB.agenda.forEach(function(e){
    if(e.date) out.push({date:e.date,title:e.title,color:'var(--gold)',jenis:e.type||'Agenda'});});
  return out;
}

/* ---- geser task di kalender ---- */
var _dragCal=null, _baruSeret=0;
function dragCal(e,id){
  _dragCal=id;
  e.dataTransfer.effectAllowed='move';
  /* Firefox tidak memulai drag sama sekali kalau dataTransfer kosong. */
  try{ e.dataTransfer.setData('text/plain',id); }catch(_){}
  e.target.classList.add('dragging');
}
/* Klik SESUDAH menyeret harus diabaikan. Sebagian browser tetap melepaskan
   event click di ujung drag, jadi tanpa penjaga ini tiap kali task digeser
   modalnya ikut terbuka menimpa kalender — terlihat seperti aplikasi yang
   melakukan dua hal padahal diminta satu. */
function klikCal(id){
  if(Date.now()-_baruSeret < 400) return;
  taskModal(id);
}
function dropCal(e,iso){
  e.preventDefault();
  _baruSeret=Date.now();
  document.querySelectorAll('.cd').forEach(function(c){c.classList.remove('drop');});
  var t=DB.tasks.find(function(x){return x.id===_dragCal;});
  _dragCal=null;
  if(!t || t.deadline===iso) return;
  var lama=t.deadline;
  t.deadline=iso;
  save(); render();
  /* Toast menyebut ASAL dan TUJUAN. Salah jatuh satu kotak gampang terjadi di
     kalender rapat, dan tanpa keterangan ini orang tidak punya cara tahu
     tanggal apa yang barusan tergeser. */
  toast(t.name+': '+fTgl(lama)+' → '+fTgl(iso));
}
function vCalendar(){
  if(!calRef) calRef=new Date(new Date().getFullYear(),new Date().getMonth(),1);
  var items=calItems();
  var y=calRef.getFullYear(), mo=calRef.getMonth();
  var mulaiDow=(new Date(y,mo,1).getDay()+6)%7;      // Senin sebagai kolom pertama
  var jml=new Date(y,mo+1,0).getDate();
  var sel='';
  for(var i=0;i<mulaiDow;i++) sel+=calCell(new Date(y,mo,1-mulaiDow+i),true,items);
  for(var d=1;d<=jml;d++)     sel+=calCell(new Date(y,mo,d),false,items);
  var total=mulaiDow+jml;
  for(var k=total;k<Math.ceil(total/7)*7;k++) sel+=calCell(new Date(y,mo,jml+(k-total)+1),true,items);

  return head('Calendar',SUB.calendar[2],
      '<div class="seg">'+
        '<button onclick="APP.geserBulan(-1)">'+ic('chevL',14)+'</button>'+
        '<button class="on" style="cursor:default">'+BULAN[mo]+' '+y+'</button>'+
        '<button onclick="APP.geserBulan(1)">'+ic('chevR',14)+'</button></div>'+

      'ondragover="event.preventDefault();this.classList.add(\'drop\')" '+

      'ondrop="APP.dropCal(event,\''+ds+'\')">'+
