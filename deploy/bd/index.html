<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<script>
/* Penjaga SSO. Dijalankan SEBELUM apa pun digambar: kalau sesi Office tidak
   ada / kedaluwarsa / tidak berhak, jangan sempat menampilkan sekilas isi
   modul dulu baru dilempar keluar. */
(function(){try{var s=JSON.parse(localStorage.getItem('lm_session')||'null');
  var ok=s&&s.expiry&&Date.now()<s.expiry&&(s.modules||[]).some(function(m){return m==='*'||m==='bd';});
  if(!ok)location.replace('../');}catch(e){location.replace('../');}})();
</script>
<title>Laksamana Muda — BD OS: Business Development, Project &amp; Purchasing</title>
<link rel="icon" type="image/jpeg" href="../assets/LaksamanaMudaLogo.jpeg">
<meta name="theme-color" content="#F7F6F4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===========================================================================
   PALET — disalin dari modul Marketing/Radar. Konsep aslinya (BD-OS.html)
   memakai palet sendiri yang mirip tapi tidak sama; nilai-nilai itu SENGAJA
   ditimpa dengan milik office supaya modul ini tidak terlihat asing di antara
   modul lain. Kalau palet Marketing/Radar berubah lagi, samakan blok ini.
   =========================================================================== */
:root{
  --gold:#A9791F; --gold-soft:#C8961F; --gold-deep:#7A560F; --gold-glow:#F2E9D3;
  --ink-950:#FFFFFF; --ink-900:#F7F6F4; --ink-880:#F2F0EA; --ink-850:#EDEAE1;
  --ink-800:#EDE7DA; --ink-750:#DBD4C2; --ink-700:#C7BFA9;
  --line:rgba(160,120,40,.20); --line-soft:rgba(60,55,45,.11); --line-hard:rgba(60,55,45,.20);
  --sand:#2A2620; --sand-dim:#5C574D; --muted:#6B6456; --muted-dk:#8C8677;
  --ok:#12703F;     --ok-bg:#E4F5EC;
  --warn:#8A6412;   --warn-bg:#F7EFDB;
  --danger:#B93A22; --danger-bg:#F8E4DF;
  --info:#2367AE;   --info-bg:#E4EFF8;
  --violet:#6748B0; --violet-bg:#ECE6F7;
  --teal:#0C6B64;   --teal-bg:#DFF2F0;
  --navy:#2c4a6b;   --navy-bg:#E4EAF1;
  --radius:14px; --radius-sm:9px;
  --shadow:0 4px 18px rgba(50,42,28,.07);
  --shadow-lg:0 18px 48px rgba(50,42,28,.12);
  --ff-display:'Plus Jakarta Sans',system-ui,sans-serif; --ff-body:'Inter',system-ui,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --sidebar-w:250px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--ff-body);color:var(--sand);background:var(--ink-900);
  font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4{font-family:var(--ff-display);font-weight:700;line-height:1.2;letter-spacing:-.02em}
.num{font-variant-numeric:tabular-nums}
svg{width:16px;height:16px;flex-shrink:0;vertical-align:middle}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--ink-700);border-radius:8px;border:2px solid var(--ink-900)}
::selection{background:rgba(169,121,31,.2)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
.hidden{display:none!important}

/* ---------- RANGKA ---------- */
#app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:100vh}
.sidebar{background:#fff;border-right:1px solid var(--line-soft);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow-y:auto;z-index:50}
.brand{display:flex;align-items:center;gap:11px;padding:18px 18px 14px;border-bottom:1px solid var(--line-soft)}
.brand img{width:36px;height:36px;border-radius:9px;object-fit:cover}
.brand .bt{font-family:var(--ff-display);font-size:15px;font-weight:700;line-height:1.15}
.brand .bs{font-size:9px;letter-spacing:.22em;color:var(--gold-deep);text-transform:uppercase;margin-top:2px;font-weight:700}
.nav{padding:10px;display:flex;flex-direction:column;gap:2px}
.nav-l{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);
  font-weight:700;padding:12px 10px 6px}
.nl{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;font-size:13px;
  font-weight:600;color:var(--sand-dim);transition:.14s;text-align:left;width:100%;position:relative}
.nl:hover{background:var(--ink-880);color:var(--sand)}
.nl.on{background:var(--gold-glow);color:var(--gold-deep)}
.nl.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;background:var(--gold);border-radius:0 3px 3px 0}
.nl svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nl .badge{margin-left:auto;background:var(--danger);color:#fff;font-size:10px;font-weight:700;
  padding:1px 7px;border-radius:20px;min-width:18px;text-align:center}
.nl.on .badge{background:var(--gold)}

/* Blok identitas + tombol keluar. Bentuknya SENGAJA sama persis dengan
   Marketing dan Event: kru berpindah modul puluhan kali sehari, dan tombol
   keluar yang pindah tempat atau berganti rupa membuat mereka ragu apakah
   mereka masih di aplikasi yang sama. */
.side-user{margin-top:auto;border-top:1px solid var(--line-soft);padding:12px;display:flex;align-items:center;gap:10px}
.side-user .su-avatar{width:36px;height:36px;border-radius:10px;background:var(--gold);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.side-user .su-info{line-height:1.25;flex:1;min-width:0}
.side-user .su-info b{display:block;font-size:13.5px;color:var(--sand);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-user .su-info span{font-size:11px;color:var(--muted)}
.logout-x{background:var(--ink-900);border:1px solid var(--line-hard);color:var(--muted);width:32px;height:32px;
  border-radius:9px;display:inline-flex;align-items:center;justify-content:center;flex:none;cursor:pointer;transition:.16s}
.logout-x:hover{background:var(--danger-bg);color:var(--danger);border-color:var(--danger)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.88);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line-soft);padding:13px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.menu-btn{display:none;font-size:20px;color:var(--sand);width:34px;height:34px;border-radius:9px}
.tb-sub{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-deep);font-weight:700}
.tb-title{font-family:var(--ff-display);font-size:20px;font-weight:700;margin-top:2px}
.tb-sp{flex:1}
.search{position:relative;max-width:320px;flex:1;min-width:150px}
.search input{width:100%;padding:8px 12px 8px 32px;border:1px solid var(--line-hard);border-radius:999px;
  background:var(--ink-900);font-size:13px;outline:none;transition:.15s}
.search input:focus{border-color:var(--gold);background:#fff}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;
  stroke:var(--muted);fill:none;stroke-width:1.9}
.sync{font-size:11px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:block;flex:none}
.view{padding:22px 24px 56px;max-width:1560px;width:100%;margin:0 auto;flex:1}

.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.page-head h2{font-size:23px}
.page-head .desc{color:var(--muted);font-size:13px;margin-top:3px}
.head-actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}

/* ---------- PRIMITIF ---------- */
.card{background:#fff;border:1px solid var(--line-soft);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{padding:14px 17px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;
  justify-content:space-between;gap:12px;flex-wrap:wrap}
.card-h h3{font-size:15.5px;display:flex;align-items:center;gap:8px}
.card-h .tagn{font-family:var(--mono);font-size:10px;color:var(--muted);background:var(--ink-880);padding:2px 8px;border-radius:20px}
.card-b{padding:16px 17px}
.card-b.tight{padding:5px 12px}
.muted{color:var(--muted)}
.grid{display:grid;gap:15px}
.g12{grid-template-columns:repeat(12,minmax(0,1fr))}
.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}

.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:10px;
  border:1px solid var(--line-hard);background:#fff;color:var(--sand);font-weight:600;font-size:12.5px;
  white-space:nowrap;box-shadow:0 1px 2px rgba(50,42,28,.06);
  transition:background .15s,border-color .15s,color .15s,box-shadow .15s,transform .1s}
.btn:hover{border-color:var(--gold);color:var(--gold-deep);background:var(--gold-glow)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:linear-gradient(135deg,#9A6E14,var(--gold-deep));color:#fff;border-color:transparent;
  box-shadow:0 2px 10px rgba(122,86,15,.28)}
.btn.pri:hover{filter:brightness(1.07);color:#fff}
.btn.bad{border-color:var(--danger);color:var(--danger)}
.btn.bad:hover{background:var(--danger-bg);color:var(--danger);border-color:var(--danger)}
.btn.sm{padding:6px 11px;font-size:11.5px;border-radius:8px}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:10.5px;
  font-weight:700;letter-spacing:.04em;text-transform:uppercase;border:1px solid transparent;white-space:nowrap}
.p-go{color:var(--ok);background:var(--ok-bg)}
.p-warn{color:var(--warn);background:var(--warn-bg)}
.p-bad{color:var(--danger);background:var(--danger-bg)}
.p-sea{color:var(--info);background:var(--info-bg)}
.p-vip{color:var(--violet);background:var(--violet-bg)}
.p-teal{color:var(--teal);background:var(--teal-bg)}
.p-navy{color:var(--navy);background:var(--navy-bg)}
.p-gold{color:var(--gold-deep);background:var(--gold-glow)}
.p-mute{color:var(--sand-dim);background:var(--ink-880)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}

.stat{background:#fff;border:1px solid var(--line-soft);border-radius:var(--radius);padding:15px 17px;
  position:relative;overflow:hidden;box-shadow:var(--shadow)}
.stat::before{content:'';position:absolute;inset:0 0 auto 0;height:3px;
  background:linear-gradient(90deg,var(--gold-soft),var(--gold-deep))}
.stat.se::before{background:var(--info)} .stat.gr::before{background:var(--ok)}
.stat.rd::before{background:var(--danger)} .stat.tl::before{background:var(--teal)}
.stat.vi::before{background:var(--violet)} .stat.wa::before{background:var(--warn)}
.stat-l{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stat-v{font-family:var(--ff-display);font-size:27px;font-weight:700;line-height:1.08;margin:6px 0 2px}
.stat-v small{font-size:14px;color:var(--muted);font-weight:500;font-family:var(--ff-body)}
.stat-d{font-size:11.5px;color:var(--sand-dim)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:13px;margin-bottom:18px}

.tw{overflow-x:auto;border:1px solid var(--line-soft);border-radius:var(--radius);background:#fff;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  font-weight:700;padding:11px 13px;background:var(--ink-880);white-space:nowrap;border-bottom:1px solid var(--line-soft)}
td{padding:11px 13px;border-bottom:1px solid var(--line-soft);font-size:13px;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr.clk{cursor:pointer;transition:.12s}
tbody tr.clk:hover{background:var(--gold-glow)}
td .nm{font-weight:600}
td .mut{color:var(--muted);font-size:12.5px}

.empty{text-align:center;padding:38px 20px;color:var(--muted)}
.empty b{display:block;color:var(--sand);font-family:var(--ff-display);font-size:15px;margin-bottom:4px}

.filters{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:15px}
.filters select{border:1px solid var(--line-hard);border-radius:9px;padding:7px 10px;background:#fff;
  outline:none;font-size:12.5px;font-weight:500;transition:.15s}
.filters select:focus{border-color:var(--gold)}
.flabel{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;
  display:flex;align-items:center;gap:6px}
.seg{display:inline-flex;background:var(--ink-880);border:1px solid var(--line-soft);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:6px 13px;border-radius:8px;font-size:12.5px;color:var(--muted);font-weight:600;transition:.13s}
.seg button.on{background:#fff;color:var(--gold-deep);box-shadow:0 1px 3px rgba(50,42,28,.1)}

/* ---------- BARIS TASK ---------- */
.trow{display:flex;align-items:flex-start;gap:11px;padding:11px 4px;border-bottom:1px solid var(--line-soft)}
.trow:last-child{border-bottom:none}
.chk{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--ink-700);flex:none;display:grid;
  place-items:center;transition:.15s;background:#fff;margin-top:1px}
.chk:hover{border-color:var(--gold)}
.chk.done{background:var(--ok);border-color:var(--ok)}
.chk svg{width:12px;height:12px;stroke:#fff;fill:none;stroke-width:2.6;opacity:0;transition:.15s}
.chk.done svg{opacity:1}
.t-main{flex:1;min-width:0}
.t-name{font-size:13.5px;font-weight:500;line-height:1.35}
.t-name.done{color:var(--muted-dk);text-decoration:line-through}
.t-desc{font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-meta{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
.tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.3px;padding:2px 7px;border-radius:5px;
  background:var(--ink-880);color:var(--muted);white-space:nowrap;border:1px solid var(--line-soft)}
.tag.q-do{background:var(--danger-bg);color:var(--danger);border-color:transparent}
.tag.q-schedule{background:var(--info-bg);color:var(--info);border-color:transparent}
.tag.q-delegate{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.tag.q-delete{background:var(--ink-880);color:var(--muted);border-color:transparent}
.tag.div{background:var(--gold-glow);color:var(--gold-deep);border-color:transparent}
.tag.proj{background:var(--violet-bg);color:var(--violet);border-color:transparent}
.tag.pic{background:var(--teal-bg);color:var(--teal);border-color:transparent}
.tag.overdue{background:var(--danger-bg);color:var(--danger);border-color:transparent}
.t-actions{display:flex;gap:2px;opacity:0;transition:.15s}
.trow:hover .t-actions{opacity:1}
.iconbtn{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--muted-dk);transition:.13s}
.iconbtn:hover{background:var(--ink-880);color:var(--sand)}
.iconbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.mini-av{width:22px;height:22px;border-radius:50%;background:var(--sand);color:#fff;display:inline-flex;
  align-items:center;justify-content:center;font-size:9px;font-weight:700;flex:none}

/* ---------- MATRIKS EISENHOWER ---------- */
.eisen{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.quad{border:1px solid var(--line-soft);border-radius:var(--radius);background:#fff;overflow:hidden;
  min-height:180px;box-shadow:var(--shadow);display:flex;flex-direction:column}
.quad-h{padding:12px 15px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:9px}
.quad-h .qb{font-family:var(--mono);font-size:9.5px;letter-spacing:1px;padding:3px 8px;border-radius:6px;
  text-transform:uppercase;font-weight:700}
.quad-h .qd{font-size:11px;color:var(--muted-dk)}
.quad-h .qc{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted-dk)}
.quad-b{padding:5px 13px 12px;flex:1;min-height:40px;transition:.15s}
.quad.do{border-top:3px solid var(--danger)}.quad.schedule{border-top:3px solid var(--info)}
.quad.delegate{border-top:3px solid var(--warn)}.quad.delete{border-top:3px solid var(--muted-dk)}
.qb.do{background:var(--danger-bg);color:var(--danger)}.qb.schedule{background:var(--info-bg);color:var(--info)}
.qb.delegate{background:var(--warn-bg);color:var(--warn)}.qb.delete{background:var(--ink-880);color:var(--muted)}
.quad-b.drop{background:var(--gold-glow);outline:1.5px dashed var(--gold-soft);outline-offset:-4px}
.trow[draggable=true]{cursor:grab}
.trow.dragging{opacity:.4}

/* ---------- KANBAN ---------- */
.kanban{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px}
.kcol{flex:0 0 264px;background:var(--ink-880);border:1px solid var(--line-soft);border-radius:var(--radius);
  display:flex;flex-direction:column;max-height:calc(100vh - 230px)}
.kcol-h{padding:12px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line-soft)}
.kcol-h .kt{font-family:var(--mono);font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:600}
.kcol-h .kc{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--muted-dk);background:#fff;padding:1px 7px;border-radius:20px}
.kcol-b{padding:10px;overflow-y:auto;flex:1;min-height:60px;transition:.15s}
.kcol-b.drop{background:var(--gold-glow);outline:1.5px dashed var(--gold-soft);outline-offset:-5px}
.kcard{background:#fff;border:1px solid var(--line-soft);border-radius:11px;padding:12px;margin-bottom:9px;
  cursor:pointer;box-shadow:0 1px 2px rgba(50,42,28,.04);transition:.13s;text-align:left;width:100%;display:block}
.kcard:hover{box-shadow:var(--shadow);transform:translateY(-1px);border-color:var(--gold)}
.kcard.dragging{opacity:.4}
.kcard .kt2{font-size:13px;font-weight:600;line-height:1.35;margin-bottom:8px;display:block}
.kmeta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.krow{display:flex;align-items:center;gap:7px;margin-top:9px}
/* display:block wajib: .krow/.progress dipakai sebagai <span> di dalam
   <button> (kartu kanban). Elemen inline mengabaikan height & overflow, jadi
   tanpa ini bilah progres di kartu project hilang sama sekali. */
.progress{display:block;height:6px;background:var(--ink-850);border-radius:20px;overflow:hidden;flex:1}
.progress>i{display:block;height:100%;border-radius:20px;background:linear-gradient(90deg,var(--gold-deep),var(--gold-soft));transition:width .5s}
.progress.ok>i{background:linear-gradient(90deg,#0d5c33,var(--ok))}
.pctnum{font-family:var(--mono);font-size:10.5px;color:var(--muted);font-weight:600;width:34px;text-align:right}

/* ---------- MILESTONE ---------- */
.mstone{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-soft);
  width:100%;text-align:left}
.mstone:last-child{border-bottom:none}
.mstone .mc{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-hard);display:grid;
  place-items:center;flex:none;margin-top:1px;color:var(--muted-dk)}
.mstone.done .mc{background:var(--ok);border-color:var(--ok);color:#fff}
.mstone .mt{font-size:13px;font-weight:500}
.mstone.done .mt{color:var(--muted);text-decoration:line-through}
.mstone .md{font-size:11.5px;color:var(--muted);margin-top:1px}

/* ---------- KALENDER ---------- */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal-hd{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;
  text-align:center;padding:7px 0}
.cd{min-height:106px;min-width:0;border:1px solid var(--line-soft);border-radius:9px;padding:6px;background:#fff;
  display:flex;flex-direction:column;gap:3px}
.cd.out{opacity:.42;background:var(--ink-880)}

<script>
/* ============================================================================
   BD OS LAKSAMANA MUDA — Business Development, Project & Purchasing
   ----------------------------------------------------------------------------
   Konsep aslinya (BD-OS.html) menyimpan seluruh state di localStorage dan
   memakai pemilih "Login sebagai" untuk berganti peran. Dua hal itu DIBUANG,
   dan alasannya bukan selera:

   1. localStorage berarti tiap kru punya salinan datanya sendiri. Nadia
      menandai task selesai, Galih tidak pernah melihatnya. Untuk papan yang
      justru gunanya membagi pekerjaan, itu bukan kekurangan kecil — itu
      membuat modulnya salah. State sekarang di MySQL lewat
      ../bd-api-mysql/api.php, kontraknya sama dengan Event & Reservasi.

   2. Pemilih "Login sebagai" adalah alat demo: siapa pun bisa berpura-pura
      jadi CEO dan melihat semua task. Identitas sekarang datang dari sesi
      Office (lm_session) yang sudah dijaga di <head>, dan tombol Keluar-nya
      disamakan dengan Marketing/Event.
   ============================================================================ */
(function(){
'use strict';

/* Kalau backend perlu dipindah/dibalik, cukup ganti SATU baris di bawah. */
const API_URL = "../bd-api-mysql/api.php";

/* Data contoh diisi HANYA kalau database benar-benar kosong (tidak ada kru dan
   tidak ada task). Berguna untuk mengenalkan modul.
   >>> Setelah tim mulai input data beneran, ganti ke false <<<
   supaya database yang (misalnya) dikosongkan tidak diam-diam terisi ulang
   data karangan. */
const SEED_CONTOH = true;

/* ============ ORGANISASI ============
   OWNER_DIVS = divisi yang PEKERJAANNYA dikelola di sini.
   COORD_DIVS = divisi lain, tujuan permintaan koordinasi. Tim BD tidak
   menugaskan mereka lewat modul ini — mereka punya modulnya sendiri; yang
   dicatat di sini cuma permintaannya dan sampai mana jalannya. */
const OWNER_DIVS = ["Business Development","Project","Purchasing"];
const COORD_DIVS = ["Kitchen","Bar","Marketing","Finance","Event","Floor","HR"];
const DIV_COLOR = {"Business Development":"#A9791F","Project":"#6748B0","Purchasing":"#0C6B64",
  "Kitchen":"#B93A22","Bar":"#6748B0","Marketing":"#8A6412","Finance":"#2367AE",
  "Event":"#12703F","Floor":"#2c4a6b","HR":"#7A560F"};

const STATUS_FLOW  = ["Backlog","To Do","Doing","Waiting","Review","Done"];
const STATUS_COLOR = {Backlog:"p-mute","To Do":"p-sea",Doing:"p-warn",Waiting:"p-vip",Review:"p-navy",Done:"p-go"};
const PRIORITAS    = ["Urgent","High","Medium","Low"];
const PRIO_COLOR   = {Urgent:"p-bad",High:"p-warn",Medium:"p-sea",Low:"p-mute"};
const PROJ_STAGES  = ["Idea","Planning","Running","Review","Completed"];
const PROJ_HEALTH  = {"on-track":{c:"p-go",l:"On track"},"at-risk":{c:"p-warn",l:"At risk"},"off-track":{c:"p-bad",l:"Off track"}};
const COORD_FLOW   = ["Diminta","Diproses","Review","Selesai"];
const COORD_COLOR  = {Diminta:"p-warn",Diproses:"p-sea",Review:"p-vip",Selesai:"p-go"};
const PO_FLOW      = ["Draft","Diajukan","Approved","Dibeli","Diterima"];
const PO_COLOR     = {Draft:"p-mute",Diajukan:"p-warn",Approved:"p-sea",Dibeli:"p-vip",Diterima:"p-go"};

/* ============ ALAT ============ */
function $(s){return document.querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad(n){return n<10?'0'+n:''+n;}
function uid(p){return (p||'x')+Math.random().toString(36).slice(2,9);}
const HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const BULAN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const BLN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Ags','Sep','Okt','Nov','Des'];

/* Tanggal SELALU lewat helper lokal, tidak pernah toISOString().
   toISOString() memberi tanggal UTC: di WIB, apa pun sebelum jam 07:00 pagi
   dilaporkan sebagai HARI KEMARIN. Untuk papan yang inti kerjanya "deadline
   hari ini vs lewat", pergeseran satu hari itu langsung salah menuduh task
   sebagai overdue tiap pagi. */
function isoOf(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function todayISO(){return isoOf(new Date());}
function pDate(iso){var p=String(iso||'').split('-');return new Date(+p[0],(+p[1]||1)-1,+p[2]||1);}
function inDays(n){var d=new Date();d.setDate(d.getDate()+n);return isoOf(d);}
function sisaHari(iso){if(!iso)return 9999;var a=pDate(iso);a.setHours(0,0,0,0);
  var b=new Date();b.setHours(0,0,0,0);return Math.round((a-b)/86400000);}
function fTgl(iso){if(!iso)return '—';var d=pDate(iso);return d.getDate()+' '+BLN[d.getMonth()];}
function fTglPanjang(iso){if(!iso)return '—';var d=pDate(iso);
  return HARI[d.getDay()]+', '+d.getDate()+' '+BULAN[d.getMonth()]+' '+d.getFullYear();}
function fDue(iso){if(!iso)return '';var n=sisaHari(iso);
  if(n===0)return 'Hari ini'; if(n===1)return 'Besok'; if(n===-1)return 'Kemarin';
  if(n<0)return Math.abs(n)+'h lewat'; if(n<=7)return n+'h lagi'; return fTgl(iso);}
function fRp(n){n=+n||0;var s=n<0?'-':'';n=Math.abs(n);
  if(n>=1e9)return s+'Rp '+(n/1e9).toFixed(n>=1e10?1:2).replace(/\.?0+$/,'')+' M';
  if(n>=1e6)return s+'Rp '+Math.round(n/1e6)+' jt';
  if(n>=1e3)return s+'Rp '+Math.round(n/1e3)+'rb';
  return s+'Rp '+n.toLocaleString('id-ID');}
function inisial(n){return String(n||'?').trim().split(/\s+/).slice(0,2).map(function(w){return w[0]||'';}).join('').toUpperCase();}

const ICON={
  dashboard:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
  matrix:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 3v18M3 12h18"/>',
  projects:'<rect x="3" y="3.5" width="7" height="7" rx="1.5"/><rect x="14" y="3.5" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  handoff:'<path d="M4 12h11M11 8l4 4-4 4"/><path d="M20 5v14"/>',
  routine:'<path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v4h-4"/>',
  cart:'<path d="M6 6h15l-1.5 9h-12z"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M6 6 5 3H3"/>',
  cal:'<rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M3 9h18M8 2.5v4M16 2.5v4"/>',
  users:'<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-5 6-5s6 1.7 6 5"/><path d="M16 5.2a3.2 3.2 0 0 1 0 6M21 20c0-2.6-1.5-4.2-3.8-4.8"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', check:'<path d="M20 6 9 17l-5-5"/>',
  edit:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  chevL:'<path d="M15 18l-6-6 6-6"/>', chevR:'<path d="M9 18l6-6-6-6"/>',
  refresh:'<path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6"/>'
};
function ic(n,w){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" '+
  'stroke-linecap="round" stroke-linejoin="round"'+(w?' style="width:'+w+'px;height:'+w+'px"':'')+'>'+(ICON[n]||'')+'</svg>';}
function toast(t){
  var w=$('#toasts'),el=document.createElement('div');
  el.className='toast'; el.textContent=t; w.appendChild(el);
  setTimeout(function(){el.style.opacity='0';el.style.transform='translateX(28px)';
    setTimeout(function(){el.remove();},250);},2600);
}

/* ============ LAPISAN API (pola sama dengan modul Event/Reservasi) ============ */
function fetchTimeout(url,opts,ms){
  var ctrl=new AbortController();
  var t=setTimeout(function(){ctrl.abort();},ms||20000);
  return fetch(url,Object.assign({},opts,{signal:ctrl.signal}))
    .finally(function(){clearTimeout(t);});
}
/* Semua panggilan lewat SATU antrian: tidak pernah ada dua request jalan
   bersamaan dari satu perangkat (polling getAll + saveAll gampang tabrakan). */
var _rantai=Promise.resolve();
function antre(fn){var jalan=_rantai.then(fn,fn);_rantai=jalan.then(function(){},function(){});return jalan;}
/* Membaca jawaban server dengan pesan yang bisa DITINDAKLANJUTI.

   r.json() yang polos melempar "Unexpected token '<', "<!DOCTYPE "... is not
   valid JSON" begitu server membalas HTML — dan HTML justru balasan paling
   sering saat ada yang salah: halaman 404 karena folder bd-api-mysql belum
   di-upload, atau halaman error PHP karena config.php keliru. Pesan bawaan itu
   menyuruh orang mencari bug di JavaScript, padahal yang kurang cuma satu
   folder di server. Jadi jawabannya dibaca sebagai teks dulu, baru diurai. */
function bacaJawaban(r){
  return r.text().then(function(teks){
    var j=null;
    try{ j=JSON.parse(teks); }catch(e){}
    if(!j){
      var cuplik=String(teks||'').replace(/\s+/g,' ').slice(0,110);
      if(r.status===404) throw new Error(
        'Backend belum terpasang — '+API_URL+' menjawab 404. Upload isi folder '+
        'bd-mysql/ ke server sebagai bd-api-mysql/ (config.php ikut, tanpa itu 500).');
      if(!r.ok) throw new Error('Server membalas HTTP '+r.status+', bukan JSON. Cuplikan: '+cuplik);
      throw new Error('Server membalas HTML, bukan JSON — biasanya error PHP '+
        'atau config.php belum benar. Cuplikan: '+cuplik);
    }
    if(!j.ok) throw new Error(j.error||'server error');
    return j.data;
  });
}
function _get(action){
  var url=API_URL+(API_URL.indexOf('?')>-1?'&':'?')+'action='+encodeURIComponent(action)+'&t='+Date.now();
  return fetchTimeout(url,{method:'GET',redirect:'follow',cache:'no-store'},20000)
    .catch(function(e){throw new Error(e.name==='AbortError'?'Server tidak merespons (timeout).':e.message);})
    .then(bacaJawaban);
}
function _post(action,data){
  return fetchTimeout(API_URL,{method:'POST',redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:action,data:data})},30000)
    .catch(function(e){throw new Error(e.name==='AbortError'?'Server tidak merespons (timeout).':e.message);})
    .then(bacaJawaban);
}
function apiGet(a){return antre(function(){return _get(a);});}
function apiPost(a,d){return antre(function(){return _post(a,d);});}

/* ============ STATE ============ */
var DB=null;
const KOLEKSI=['people','projects','tasks','routines','coord','po','agenda'];
function normalize(s){
  s=s||{};
  KOLEKSI.forEach(function(k){ if(!Array.isArray(s[k])) s[k]=[]; });
  /* PHP mengirim {} untuk map kosong, tapi json_decode di sisi lain bisa
     memberi []. Array juga bertipe 'object', jadi pemeriksaan naif akan
     meloloskannya — dan DB.focus[id]=… yang menempel sebagai properti array
     dibuang diam-diam oleh JSON.stringify saat menyimpan. */
  if(!s.focus||typeof s.focus!=='object'||Array.isArray(s.focus)) s.focus={};
  return s;
}

/* ---- penstempel updatedAt otomatis ----
   Server menolak baris kiriman yang lebih LAMA daripada baris di server
   (penjaga updated_at) — itu yang mencegah dua kru saling menimpa. Supaya
   penjaga itu bekerja, tiap baris yang BERUBAH harus dicap waktu. Daripada
   menambah cap di puluhan tempat mutasi satu per satu (gampang kelewat), di
   sini sidik jari tiap baris dibandingkan dengan salinan terakhir yang
   diketahui server: yang berubah saja yang dicap. */
var _snap={};
function sig(o){var c=Object.assign({},o);delete c.updatedAt;return JSON.stringify(c);}
function tiapBaris(fn){
  KOLEKSI.forEach(function(k){(DB[k]||[]).forEach(function(r){if(r&&r.id)fn(k+':'+r.id,r);});});
}
function capPerubahan(){
  var now=Date.now();
  tiapBaris(function(key,r){
    if(_snap[key]===sig(r)) return;    // tidak berubah -> jangan dicap ulang
    r.updatedAt=now;
    if(!r.createdAt) r.createdAt=now;
  });
}
function segarkanSnapshot(){var n={};tiapBaris(function(k,r){n[k]=sig(r);});_snap=n;}

function setSync(st,msg){
  var el=$('#sync'); if(!el)return;
  var peta={saving:['Menyimpan…','var(--gold)'],saved:['Tersimpan','var(--ok)'],
            pending:['Menunggu…','var(--muted-dk)'],error:['Gagal simpan','var(--danger)']};
  var m=peta[st]||peta.saved;
  el.querySelector('span').textContent=m[0];
  el.querySelector('i').style.background=m[1];
  el.title=msg||'';
}

/* ---- simpan: dikumpulkan dulu (debounce) baru dikirim sekali ---- */
var _timer=null,_kotor=false,_menyimpan=false;
function save(){_kotor=true;setSync('pending');clearTimeout(_timer);_timer=setTimeout(kirim,800);}
function kirim(){
  if(_menyimpan||!_kotor) return Promise.resolve();
  _menyimpan=true; _kotor=false; setSync('saving');
  capPerubahan();
  return apiPost('saveAll',DB).then(function(){
    segarkanSnapshot(); setSync('saved');
  },function(e){
    _kotor=true;                       // dicoba lagi; perubahan tidak hilang
    setSync('error',e.message);
    toast('Gagal simpan: '+e.message);
  }).then(function(){
    _menyimpan=false;
    if(_kotor) setTimeout(kirim,2000);
  });
}

window.addEventListener('beforeunload',function(e){ if(_kotor||_menyimpan){e.preventDefault();e.returnValue='';} });

/* ---- tarik perubahan kru lain ----
   Hanya saat idle: tidak sedang menyimpan, tidak ada perubahan menggantung,
   tab sedang dilihat, dan tidak ada modal terbuka (biar isian tidak hilang). */
setInterval(function(){
  if(_kotor||_menyimpan||document.hidden) return;
  if($('#overlay').classList.contains('show')) return;
  apiGet('getAll').then(function(s){
    var baru=normalize(s);
    if(JSON.stringify(baru)===JSON.stringify(DB)) return;
    DB=baru; segarkanSnapshot();
    /* kenali() diulang: kalau kru lain baru saja mendaftarkan kita di tabel
       people, AKU harus ikut terisi tanpa perlu reload halaman. */
    kenali(); cetakIdentitas(); render();
  },function(){ /* diam: polling gagal bukan alasan mengganggu kerja */ });
},20000);

/* ============ IDENTITAS ============
   Nama & hak akses datang dari Office; penjaga di <head> sudah memastikan
   sesinya sah. Yang masih perlu dicari di sini: BARIS KRU mana di tabel
   `people` yang mewakili orang ini — itulah yang menentukan task siapa yang
   dia lihat dan siapa yang jadi PIC default.

   Dicocokkan lewat officeUserId dulu, baru nama. officeUserId lebih tahan
   banting: nama bisa berubah ejaannya, dan dua orang bisa bernama mirip. */
function sesi(){ try{ return JSON.parse(localStorage.getItem('lm_session')||'null'); }catch(e){ return null; } }
var AKU=null;                     // baris people milik user, atau null
function kenali(){
  var s=sesi()||{};
  AKU = DB.people.find(function(p){return p.officeUserId && p.officeUserId===s.userId;})
     || DB.people.find(function(p){return String(p.name||'').toLowerCase()===String(s.name||'').toLowerCase();})
     || null;
}
/* Admin modul BD di Office selalu melihat semuanya, terlepas dari posisinya
   di hierarki people — kalau tidak, admin yang kebetulan terdaftar sebagai
   staff justru tidak bisa merapikan data yang jadi tanggung jawabnya. */
function adminModul(){
  var a=(sesi()||{}).adminModules||[];
  return a.indexOf('*')>-1 || a.indexOf('bd')>-1;
}
function P(id){return DB.people.find(function(p){return p.id===id;})||{id:'',name:'—',role:'',div:''};}
function bawahan(id){
  var out=[];
  DB.people.forEach(function(p){ if(p.boss===id){ out.push(p.id); out=out.concat(bawahan(p.id)); } });
  return out;
}
/* Daftar id orang yang task-nya boleh dilihat user ini. null = semua.

   Orang yang BELUM terdaftar di tabel kru juga mendapat null (semua). Itu
   disengaja: yang menjaga pintu modul ini adalah izin Office, bukan tabel
   kru. Menyembunyikan segalanya dari kru yang lupa didaftarkan cuma membuat
   modulnya terlihat rusak — mereka justru dituntun mendaftar lewat pita di
   Dashboard. */
function lingkup(){
  if(!AKU || adminModul()) return null;
  return [AKU.id].concat(bawahan(AKU.id));
}
function tasksTerlihat(){
  var l=lingkup();
  if(!l) return DB.tasks;
  return DB.tasks.filter(function(t){return l.indexOf(t.pic)>-1;});
}
function catIniAku(){ return AKU?AKU.id:('office:'+((sesi()||{}).userId||'?')); }

/* "Keluar" = kembali ke portal Office. Sesi Office sengaja TIDAK dihapus:
   modul lain memakainya juga, jadi menghapusnya di sini akan memaksa kru
   login ulang hanya karena menutup BD OS. */
window.logout=function(){ location.replace('../'); };
window.toggleSidebar=function(buka){
  var sb=$('#sidebar'), sc=$('#sideScrim');
  var on = buka===undefined ? !sb.classList.contains('open') : !!buka;
  sb.classList.toggle('open',on); sc.classList.toggle('on',on);
};

/* ============ EISENHOWER ============
   Kuadran adalah TURUNAN dari important+urgent, tidak pernah disimpan
   sendiri — kalau disimpan, ada dua kebenaran yang bisa menyimpang. */
function kuadran(t){
  if(t.important&&t.urgent)  return {k:'do',       l:'DO',       d:'Kerjakan sekarang'};
  if(t.important&&!t.urgent) return {k:'schedule', l:'SCHEDULE', d:'Jadwalkan'};
  if(!t.important&&t.urgent) return {k:'delegate', l:'DELEGATE', d:'Delegasikan / koordinasi'};
  return {k:'delete', l:'DELETE', d:'Pertimbangkan hapus'};
}
function selesai(t){return t.status==='Done';}
function lewat(t){return t.deadline && !selesai(t) && sisaHari(t.deadline)<0;}

/* ============ NAVIGASI ============ */
const NAV=[
  {sec:'Workspace',items:[
    {id:'dashboard',l:'Dashboard',i:'dashboard'},
    {id:'tasks',    l:'Tasks',    i:'matrix'},
    {id:'projects', l:'Projects', i:'projects'}]},
  {sec:'Operasi',items:[
    {id:'coord',      l:'Koordinasi', i:'handoff'},
    {id:'routine',    l:'Routine',    i:'routine'},
    {id:'purchasing', l:'Purchasing', i:'cart'}]},
  {sec:'Jadwal & Tim',items:[
    {id:'calendar', l:'Calendar', i:'cal'},
    {id:'tim',      l:'Kru BD',   i:'users'}]}
];
const SUB={dashboard:['Workspace','Dashboard','Kondisi hari ini — BD, Project & Purchasing'],
  tasks:['Workspace','Tasks','Prioritas ala Eisenhower — Penting × Mendesak'],
  projects:['Workspace','Projects','Pekerjaan besar berjangka + milestone'],
  projectDetail:['Workspace','Project','Detail project'],
  coord:['Operasi','Koordinasi','Request & follow-up ke divisi lain'],
  routine:['Operasi','Routine','Task berulang & kepatuhannya'],
  purchasing:['Operasi','Purchasing','Purchase order, vendor & status pembelian'],
  calendar:['Jadwal','Calendar','Deadline, milestone & agenda'],
  tim:['Tim','Kru BD','Siapa mengerjakan apa, dan siapa atasannya']};
var view='dashboard';

function renderNav(){
  var coordPending=DB.coord.filter(function(c){return c.status!=='Selesai';}).length;
  var overdue=tasksTerlihat().filter(lewat).length;
  $('#nav').innerHTML=NAV.map(function(s){
    return '<div class="nav-l">'+s.sec+'</div>'+s.items.map(function(it){
      var b='';
      if(it.id==='coord'&&coordPending) b='<span class="badge">'+coordPending+'</span>';
      if(it.id==='tasks'&&overdue)      b='<span class="badge">'+overdue+'</span>';
      var aktif=(it.id===view)||(it.id==='projects'&&view==='projectDetail');
      return '<button class="nl'+(aktif?' on':'')+'" onclick="APP.go(\''+it.id+'\')">'+ic(it.i)+it.l+b+'</button>';
    }).join('');
  }).join('');
}

function render(){
  renderNav();
  var s=SUB[view]||SUB.dashboard;
  $('#tbSub').textContent=s[0]; $('#tbTitle').textContent=s[1];
  var peta={dashboard:vDashboard,tasks:vTasks,projects:vProjects,projectDetail:vProjectDetail,
            coord:vCoord,routine:vRoutine,purchasing:vPurchasing,calendar:vCalendar,tim:vTim};
  $('#view').innerHTML=(peta[view]||vDashboard)();
  if(view==='dashboard') pasangFokus();
}
function go(v){view=v;render();window.scrollTo(0,0);toggleSidebar(false);}

/* ============ KOMPONEN BERSAMA ============ */
function head(judul,desc,aksi){
  return '<div class="page-head"><div><h2>'+judul+'</h2><div class="desc">'+esc(desc)+'</div></div>'+
    '<div class="head-actions">'+(aksi||'')+'</div></div>';
}
function kosong(j,k){return '<div class="empty"><b>'+esc(j)+'</b>'+esc(k||'')+'</div>';}
function pill(t,c){return '<span class="pill '+c+'">'+esc(t)+'</span>';}
function tagDiv(d){return '<span class="tag div">'+esc(d)+'</span>';}
/* Sengaja <span>, bukan <div>: bilah ini ikut dipasang di dalam kartu kanban
   yang elemennya <button>, dan <div> di dalam <button> bukan HTML yang sah. */
function bar(pct,ok){return '<span class="krow"><span class="progress'+(ok?' ok':'')+'"><i style="width:'+pct+'%"></i></span>'+
  '<span class="pctnum num">'+pct+'%</span></span>';}
function stat(l,v,d,c){return '<div class="stat '+(c||'')+'"><div class="stat-l">'+esc(l)+'</div>'+
  '<div class="stat-v num">'+v+'</div><div class="stat-d">'+esc(d)+'</div></div>';}

function taskRow(t,o){
  o=o||{};
  var q=kuadran(t), od=lewat(t), sel=selesai(t);
  var pr=t.project&&DB.projects.find(function(p){return p.id===t.project;});
  return '<div class="trow"'+(o.drag?' draggable="true" ondragstart="APP.dragTask(event,\''+t.id+'\')" ondragend="this.classList.remove(\'dragging\')"':'')+'>'+
    '<button class="chk'+(sel?' done':'')+'" title="Tandai selesai" onclick="APP.toggleTask(\''+t.id+'\')">'+ic('check')+'</button>'+
    '<div class="t-main" style="cursor:pointer" onclick="APP.taskModal(\''+t.id+'\')">'+
      '<div class="t-name'+(sel?' done':'')+'">'+esc(t.name)+'</div>'+
      (t.desc?'<div class="t-desc">'+esc(t.desc)+'</div>':'')+
      '<div class="t-meta">'+
        (o.noQuad?'':'<span class="tag q-'+q.k+'">'+q.l+'</span>')+
        (o.hideDiv?'':tagDiv(t.div))+
        (pr&&!o.hideProj?'<span class="tag proj">'+esc(pr.name)+'</span>':'')+
        '<span class="tag pic">'+esc(inisial(P(t.pic).name))+'</span>'+
        (t.type&&t.type!=='Ad-hoc'?'<span class="tag">'+esc(t.type)+'</span>':'')+
        (t.deadline?'<span class="tag'+(od?' overdue':'')+'">'+fDue(t.deadline)+'</span>':'')+
      '</div></div>'+
    '<div class="t-actions">'+
      '<button class="iconbtn" title="Edit" onclick="APP.taskModal(\''+t.id+'\')">'+ic('edit')+'</button>'+
      '<button class="iconbtn" title="Hapus" onclick="APP.hapusTask(\''+t.id+'\')">'+ic('trash')+'</button>'+
    '</div></div>';
}

/* ============ DASHBOARD ============ */
function pitaDaftar(){
  /* Pita ini muncul hanya untuk orang yang belum punya baris di tabel kru.
     Tanpa baris itu, semua penyaring "tim saya" tidak punya titik acuan dan
     dia melihat pekerjaan seluruh tim — bukan kesalahan fatal, tapi juga
     bukan yang dia inginkan. */
  if(AKU) return '';
  var s=sesi()||{};
  return '<div class="notice">Kamu (<b>'+esc(s.name||'?')+'</b>) belum terdaftar sebagai kru BD, '+
    'jadi papan ini menampilkan pekerjaan <b>semua orang</b>. Daftarkan dirimu di '+
    '<b>Kru BD</b> supaya penyaring "tim saya" dan PIC default bekerja.'+
    '<button class="btn sm" style="margin-left:auto" onclick="APP.go(\'tim\')">Buka Kru BD</button></div>';
}
function vDashboard(){
  var vt=tasksTerlihat();
  var aktif=vt.filter(function(t){return !selesai(t);});
  var od=vt.filter(lewat);
  var jalan=DB.projects.filter(function(p){return p.stage!=='Completed'&&p.stage!=='Idea';});
  var coordP=DB.coord.filter(function(c){return c.status!=='Selesai';});
  var poP=DB.po.filter(function(p){return p.status!=='Diterima';});
  var t0=todayISO();
  var dueHariIni=aktif.filter(function(t){return t.deadline===t0;});
  var agHariIni=DB.agenda.filter(function(e){return e.date===t0;});

  /* Urutan prioritas: overdue dulu, lalu kuadran (penting+mendesak paling
     atas), baru deadline terdekat. */
  var top=aktif.slice().sort(function(a,b){
    var oa=lewat(a),ob=lewat(b); if(oa!==ob) return oa?-1:1;
    var qa=(a.important?2:0)+(a.urgent?1:0), qb=(b.important?2:0)+(b.urgent?1:0);
    if(qa!==qb) return qb-qa;
    return (a.deadline||'9999')<(b.deadline||'9999')?-1:1;
  }).slice(0,6);

  var f=DB.focus[catIniAku()]||{};
  var teksFokus=(f.tgl===t0)?(f.teks||''):'';

  var h=head('Dashboard',SUB.dashboard[2],
    '<button class="btn pri" onclick="APP.taskModal()">'+ic('plus')+'Task baru</button>')+pitaDaftar();

  h+='<div class="stats">'+
    stat('Task aktif',aktif.length,vt.filter(selesai).length+' selesai tercatat','')+
    stat('Overdue',od.length,od.length?'Perlu perhatian':'Semua terkendali',od.length?'rd':'gr')+
    stat('Project jalan',jalan.length,DB.projects.filter(function(p){return p.health==='at-risk';}).length+' at-risk','vi')+
    stat('Koordinasi pending',coordP.length,'ke divisi lain','wa')+
    stat('PO berjalan',poP.length,fRp(poP.reduce(function(s,p){return s+(+p.amount||0);},0)),'tl')+
  '</div>';

  h+='<div class="card" style="margin-bottom:16px"><div class="card-b" style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">'+
    '<div style="flex:none;font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--gold-deep)">★ Fokus utama hari ini</div>'+
    '<input id="fokusInp" value="'+esc(teksFokus)+'" placeholder="Apa satu hal terpenting hari ini?" '+
    'style="flex:1;min-width:220px;background:var(--ink-900);border:1px solid var(--line-hard);border-radius:10px;'+
    'padding:11px 13px;outline:none;font-size:15px;font-weight:600;color:var(--gold-deep)">'+
  '</div></div>';

  h+='<div class="grid g12">'+
    '<div class="card c8"><div class="card-h"><h3>Prioritas teratas</h3>'+
      '<button class="btn sm" onclick="APP.go(\'tasks\')">Semua task '+ic('chevR',13)+'</button></div>'+
      '<div class="card-b tight">'+(top.length?top.map(function(t){return taskRow(t);}).join(''):kosong('Tidak ada task aktif','Papan bersih.'))+'</div></div>'+
    '<div class="card c4"><div class="card-h"><h3>Overdue</h3>'+(od.length?pill(od.length+' task','p-bad'):'')+'</div>'+
      '<div class="card-b tight">'+(od.length?od.slice(0,6).map(function(t){return taskRow(t,{noQuad:true});}).join(''):kosong('Tidak ada yang lewat deadline','Pertahankan.'))+'</div></div>'+
    '<div class="card c7"><div class="card-h"><h3>Kesehatan project</h3>'+
      '<button class="btn sm" onclick="APP.go(\'projects\')">Buka '+ic('chevR',13)+'</button></div>'+
      '<div class="card-b tight">'+(jalan.length?jalan.map(projMini).join(''):kosong('Belum ada project berjalan',''))+'</div></div>'+
    '<div class="card c5"><div class="card-h"><h3>Agenda hari ini</h3><span class="tagn">'+fTglPanjang(t0)+'</span></div>'+
      '<div class="card-b tight">'+((agHariIni.length||dueHariIni.length)?
        agHariIni.map(function(e){
          return '<div class="trow"><span class="dot" style="background:'+(DIV_COLOR[e.div]||'#999')+';margin-top:6px"></span>'+
            '<div class="t-main"><div class="t-name">'+esc(e.title)+'</div>'+
            '<div class="t-meta"><span class="tag">'+esc(e.type)+'</span>'+tagDiv(e.div)+'</div></div></div>';
        }).join('')+
        dueHariIni.map(function(t){
          return '<div class="trow"><span class="dot" style="background:var(--danger);margin-top:6px"></span>'+
            '<div class="t-main"><div class="t-name">'+esc(t.name)+'</div>'+
            '<div class="t-meta"><span class="tag overdue">Deadline hari ini</span>'+tagDiv(t.div)+'</div></div></div>';
        }).join('')
        :kosong('Agenda kosong hari ini',''))+'</div></div>'+
  '</div>';
  return h;
}
function pasangFokus(){
  var el=$('#fokusInp'); if(!el) return;
  el.addEventListener('input',function(){
    /* Fokus disimpan BERSAMA TANGGALNYA, bukan sebagai satu teks abadi.
       Tanpa tanggal, catatan "kirim proposal sponsor" masih menempel di layar
       tiga minggu kemudian dan berhenti berarti apa pun. */
    DB.focus[catIniAku()]={teks:el.value,tgl:todayISO()};
    save();
  });
}
function projMini(p){
  var pg=projProgress(p), hh=PROJ_HEALTH[p.health]||PROJ_HEALTH['on-track'], dl=sisaHari(p.end);
  return '<div class="trow" style="cursor:pointer" onclick="APP.bukaProject(\''+p.id+'\')">'+
    '<span class="dot" style="background:'+(DIV_COLOR[p.div]||'#999')+';margin-top:6px"></span>'+
    '<div class="t-main"><div class="t-name" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">'+
      esc(p.name)+pill(hh.l,hh.c)+'</div>'+bar(pg,pg>=100)+
      '<div class="t-meta"><span class="tag pic">'+esc(inisial(P(p.pic).name))+'</span>'+
      '<span class="tag">'+esc(p.stage)+'</span>'+
      '<span class="tag'+(dl<0?' overdue':'')+'">'+(dl<0?Math.abs(dl)+'h lewat':dl+'h lagi')+'</span></div>'+
    '</div></div>';
}

/* ============ TASKS ============ */
var taskMode='matrix', fDiv='', fProj='', fType='', fScope='tim';
function vTasks(){
  var base=(fScope==='saya'&&AKU)?DB.tasks.filter(function(t){return t.pic===AKU.id;}):tasksTerlihat();
  base=base.filter(function(t){
    return (!fDiv||t.div===fDiv)&&(!fProj||t.project===fProj)&&(!fType||t.type===fType);
  });
  var h=head('Tasks',SUB.tasks[2],
    '<div class="seg">'+
      ['matrix','today','week','div'].map(function(m,i){
        var l=['Matrix','Hari ini','Minggu ini','Per Divisi'][i];
        return '<button class="'+(taskMode===m?'on':'')+'" onclick="APP.setTaskMode(\''+m+'\')">'+l+'</button>';
      }).join('')+
    '</div><button class="btn pri" onclick="APP.taskModal()">'+ic('plus')+'Task</button>');

  h+='<div class="filters"><span class="flabel">'+ic('matrix',14)+' Filter</span>'+
    '<select onchange="APP.filter(\'scope\',this.value)">'+
      '<option value="tim"'+(fScope==='tim'?' selected':'')+'>Tim saya</option>'+
      '<option value="saya"'+(fScope==='saya'?' selected':'')+(AKU?'':' disabled')+'>Ditugaskan ke saya</option></select>'+
    '<select onchange="APP.filter(\'div\',this.value)"><option value="">Semua divisi</option>'+
      OWNER_DIVS.map(function(d){return '<option'+(fDiv===d?' selected':'')+'>'+esc(d)+'</option>';}).join('')+'</select>'+
    '<select onchange="APP.filter(\'proj\',this.value)"><option value="">Semua project</option>'+
      DB.projects.map(function(p){return '<option value="'+p.id+'"'+(fProj===p.id?' selected':'')+'>'+esc(p.name)+'</option>';}).join('')+'</select>'+
    '<select onchange="APP.filter(\'type\',this.value)"><option value="">Semua tipe</option>'+
      ['Rutin','Project','Ad-hoc'].map(function(x){return '<option'+(fType===x?' selected':'')+'>'+x+'</option>';}).join('')+'</select>'+
    ((fDiv||fProj||fType||fScope!=='tim')?'<button class="btn sm" onclick="APP.filter(\'reset\')">'+ic('x',12)+'Reset</button>':'')+
  '</div>';

  if(taskMode==='matrix') h+=matrixHtml(base);
  else if(taskMode==='today') h+=daftarPanel(base.filter(function(t){return !selesai(t)&&(t.deadline===todayISO()||lewat(t));}),'Hari ini & overdue');
  else if(taskMode==='week')  h+=daftarPanel(base.filter(function(t){return !selesai(t)&&t.deadline&&sisaHari(t.deadline)<=7;}),'7 hari ke depan');
  else h+=perDivisiHtml(base);
  return h;
}
function matrixHtml(base){
  function sel(imp,urg,cls,label,desc){
    var l=base.filter(function(t){return !selesai(t)&&!!t.important===imp&&!!t.urgent===urg;});
    return '<div class="quad '+cls+'">'+
      '<div class="quad-h"><span class="qb '+cls+'">'+label+'</span><span class="qd">'+desc+'</span>'+
        '<span class="qc num">'+l.length+'</span></div>'+
      '<div class="quad-b" ondragover="event.preventDefault();this.classList.add(\'drop\')" '+
        'ondragleave="this.classList.remove(\'drop\')" ondrop="APP.dropTask(event,'+imp+','+urg+')">'+
        (l.length?l.map(function(t){return taskRow(t,{noQuad:true,drag:true});}).join('')
                 :'<div class="empty" style="padding:20px">Kosong</div>')+
      '</div></div>';
  }
  return '<div class="eisen">'+
    sel(true,true,'do','DO','Penting + Mendesak')+
    sel(true,false,'schedule','SCHEDULE','Penting + Tidak Mendesak')+
    sel(false,true,'delegate','DELEGATE','Tidak Penting + Mendesak')+
    sel(false,false,'delete','DELETE','Tidak Penting + Tidak Mendesak')+
  '</div><div class="card" style="margin-top:16px"><div class="card-b" '+
    'style="font-size:12.5px;color:var(--muted);display:flex;gap:18px;flex-wrap:wrap">'+
    '<span><b style="color:var(--danger)">DO</b> — kerjakan sendiri sekarang</span>'+
    '<span><b style="color:var(--info)">SCHEDULE</b> — blok waktu, jadwalkan</span>'+
    '<span><b style="color:var(--warn)">DELEGATE</b> — koordinasikan / titip ke divisi lain</span>'+
    '<span><b style="color:var(--muted)">DELETE</b> — pertimbangkan hapus/tunda</span>'+
    '<span style="width:100%;color:var(--muted-dk)">Geser kartu antar kotak untuk mengubah prioritasnya.</span>'+
  '</div></div>';
}
function daftarPanel(list,judul){
  var l=list.slice().sort(function(a,b){return (a.deadline||'9999')<(b.deadline||'9999')?-1:1;});
  return '<div class="card"><div class="card-h"><h3>'+esc(judul)+'</h3><span class="tagn">'+l.length+' task</span></div>'+
    '<div class="card-b tight">'+(l.length?l.map(function(t){return taskRow(t);}).join(''):kosong('Tidak ada task',''))+'</div></div>';
}
function perDivisiHtml(base){
  var g={};
  base.filter(function(t){return !selesai(t);}).forEach(function(t){(g[t.div]=g[t.div]||[]).push(t);});
  var urut=OWNER_DIVS.filter(function(d){return g[d];});
  if(!urut.length) return '<div class="card"><div class="card-b">'+kosong('Belum ada task aktif','')+'</div></div>';
  return urut.map(function(d){
    return '<div class="card" style="margin-bottom:16px"><div class="card-h">'+
      '<h3><span class="dot" style="background:'+DIV_COLOR[d]+'"></span>'+esc(d)+'</h3>'+

   yang diketik manual: persen yang diketik tangan selalu ketinggalan dari
   kenyataan dan tidak ada yang tahu kapan terakhir diperbarui. */
function projProgress(p){
  var ts=projTasks(p.id);
  if(ts.length) return Math.round(ts.filter(selesai).length/ts.length*100);
  var m=p.milestones||[];
  if(m.length) return Math.round(m.filter(function(x){return x.done;}).length/m.length*100);
  return 0;
}

/* Milestone diketik sebagai teks banyak-baris, bukan daftar dinamis. Bentuknya
   sederhana dan bisa disalin dari catatan rapat; status selesainya TIDAK ikut
   di teks ini supaya mengedit nama milestone tidak diam-diam mereset centang
   yang sudah ada — pencocokannya per nama, lihat di bawah. */
function bacaMilestone(teks,lama){
  return String(teks||'').split('\n').map(function(b){return b.trim();}).filter(Boolean).map(function(b){
    var q=b.split('|');
    var nama=(q[0]||'').trim();
    var tgl=(q[1]||'').trim();
    var sebelum=(lama||[]).find(function(m){return m.t===nama;});
    return {t:nama,date:/^\d{4}-\d{2}-\d{2}$/.test(tgl)?tgl:'',done:sebelum?!!sebelum.done:false};
  });
}

     ikut dihapus. Membiarkan id project yang sudah tidak ada akan membuat

  DB.tasks.forEach(function(t){ if(t.project===id) t.project=null; });

/* ============ CALENDAR ============ */
var calRef=null;
/* Semua yang punya tanggal dikumpulkan jadi satu daftar. Sumbernya empat, dan
   warnanya sengaja beda supaya "banyak merah di satu minggu" langsung terbaca
   sebagai minggu yang padat deadline, bukan sekadar penuh. */
function calItems(){
  var out=[];
  DB.tasks.filter(function(t){return t.deadline&&!selesai(t);}).forEach(function(t){
    out.push({date:t.deadline,title:t.name,color:'var(--danger)',jenis:'Deadline'});});
  DB.projects.forEach(function(p){(p.milestones||[]).forEach(function(ms){
    if(ms.date) out.push({date:ms.date,title:ms.t+' ('+p.name+')',color:'var(--violet)',jenis:'Milestone'});});});
  DB.po.filter(function(p){return p.status!=='Diterima'&&p.needBy;}).forEach(function(p){
    out.push({date:p.needBy,title:'PO: '+p.item,color:'var(--teal)',jenis:'PO'});});
  DB.coord.filter(function(c){return c.status!=='Selesai'&&c.due;}).forEach(function(c){
    out.push({date:c.due,title:'Koord: '+c.title,color:'var(--warn)',jenis:'Koordinasi'});});
  DB.agenda.forEach(function(e){
    if(e.date) out.push({date:e.date,title:e.title,color:'var(--gold)',jenis:e.type||'Agenda'});});
  return out;
}
function vCalendar(){
  if(!calRef) calRef=new Date(new Date().getFullYear(),new Date().getMonth(),1);
  var items=calItems();
  var y=calRef.getFullYear(), mo=calRef.getMonth();
  var mulaiDow=(new Date(y,mo,1).getDay()+6)%7;      // Senin sebagai kolom pertama
  var jml=new Date(y,mo+1,0).getDate();
  var sel='';
  for(var i=0;i<mulaiDow;i++) sel+=calCell(new Date(y,mo,1-mulaiDow+i),true,items);
  for(var d=1;d<=jml;d++)     sel+=calCell(new Date(y,mo,d),false,items);
  var total=mulaiDow+jml;
  for(var k=total;k<Math.ceil(total/7)*7;k++) sel+=calCell(new Date(y,mo,jml+(k-total)+1),true,items);

  return head('Calendar',SUB.calendar[2],
      '<div class="seg">'+
        '<button onclick="APP.geserBulan(-1)">'+ic('chevL',14)+'</button>'+

function vTim(){
  var s=sesi()||{};

  if(!AKU) h+='<div class="notice">Akun Office kamu: <b>'+esc(s.name||'?')+'</b>'+
    (s.userId?' <span class="tag">'+esc(s.userId)+'</span>':'')+'. Tambahkan dirimu di daftar ini '+
    '(isi "ID Office" dengan id di atas) supaya papan tahu task mana milikmu.</div>';
  if(!DB.people.length) return h+'<div class="card"><div class="card-b">'+
    kosong('Belum ada kru terdaftar','Tanpa kru, kolom PIC di task/project/PO tidak punya pilihan.')+'</div></div>';

  var byBoss={};
  DB.people.forEach(function(p){ (byBoss[p.boss||'']=byBoss[p.boss||'']||[]).push(p); });
  var baris=[];
  /* Digambar berjenjang (atasan dulu, anak buah menjorok) supaya struktur
     yang menentukan visibilitas task terlihat, bukan cuma daftar nama. */
  (function gambar(bossId,level){
    (byBoss[bossId]||[]).forEach(function(p){
      baris.push({p:p,level:level});
      gambar(p.id,level+1);
    });
  })('',0);
  /* Kru yang atasannya menunjuk id yang sudah tidak ada tidak boleh hilang
     dari layar — justru merekalah yang perlu dibetulkan. */
  DB.people.forEach(function(p){
    if(!baris.some(function(b){return b.p.id===p.id;})) baris.push({p:p,level:0,yatim:true});
  });

  return h+'<div class="tw"><table><thead><tr><th>Nama</th><th>Jabatan</th><th>Divisi</th><th>Atasan</th>'+
    '<th>ID Office</th><th>Task aktif</th><th>Status</th><th></th></tr></thead><tbody>'+

        '<td style="padding-left:'+(13+b.level*18)+'px"><span class="mini-av" style="margin-right:8px">'+esc(inisial(p.name))+'</span>'+

        '<td><span class="mut">'+esc(p.role||'—')+'</span></td>'+
        '<td>'+tagDiv(p.div||'—')+'</td>'+
        '<td><span class="mut">'+esc(p.boss?P(p.boss).name:(b.yatim?'(atasan tidak ditemukan)':'—'))+'</span></td>'+
        '<td><span class="mut" style="font-family:var(--mono);font-size:11px">'+esc(p.officeUserId||'—')+'</span></td>'+
        '<td><span class="num">'+nAktif+'</span>'+(nLewat?' '+pill(nLewat+' lewat','p-bad'):'')+'</td>'+
        '<td>'+pill(p.active!==false?'Aktif':'Nonaktif',p.active!==false?'p-go':'p-mute')+'</td>'+
        '<td><button class="iconbtn" title="Hapus" onclick="event.stopPropagation();APP.hapusOrang(\''+p.id+'\')">'+ic('trash')+'</button></td></tr>';
    }).join('')+'</tbody></table></div>';

function simpanOrang(id){
  var g=function(x){return document.getElementById(x);};
  var nama=g('k_name').value.trim();
  if(!nama){ toast('Nama wajib diisi.'); return; }
  var boss=g('k_boss').value;
  /* Cegah lingkaran atasan (A atasan B, B atasan A). Tanpa penjagaan ini,
     bawahan() memanggil dirinya tanpa henti dan seluruh halaman membeku —
     bukan pesan error, cuma tab yang mati. */
  if(id&&boss){
    var jalan=boss, langkah=0;
    while(jalan&&langkah++<200){
      if(jalan===id){ toast('Atasan melingkar — orang ini sudah jadi atasan dari kru tersebut.'); return; }
      var nx=DB.people.find(function(x){return x.id===jalan;});
      jalan=nx?nx.boss:'';
    }
  }
  var data={name:nama,role:g('k_role').value.trim(),div:g('k_div').value,boss:boss,
    officeUserId:g('k_office').value.trim(),active:g('kg_act').classList.contains('on')};
  if(id) Object.assign(DB.people.find(function(x){return x.id===id;}),data);
  else DB.people.push(Object.assign({id:uid('u')},data));
  save(); closeModal(); kenali(); render(); toast(id?'Data kru diperbarui':'Kru ditambahkan');
}
function hapusOrang(id){
  var dipakai=DB.tasks.filter(function(t){return t.pic===id;}).length
             +DB.projects.filter(function(p){return p.pic===id;}).length
             +DB.po.filter(function(p){return p.pic===id;}).length
             +DB.routines.filter(function(r){return r.pic===id;}).length;
  /* Menghapus kru yang masih memegang pekerjaan membuat barisnya jadi PIC "—"
     yang tidak bisa ditelusuri lagi. Menonaktifkan jauh lebih tepat, jadi itu
     yang ditawarkan lebih dulu. */
  if(dipakai){
    if(!confirm('Kru ini masih tercatat sebagai PIC di '+dipakai+' baris (task/project/PO/routine).\n\n'+
      'Lebih aman menonaktifkannya lewat tombol Edit. Tetap hapus?')) return;
  }else if(!confirm('Hapus kru ini?')) return;
  DB.people=DB.people.filter(function(p){return p.id!==id;});
  DB.people.forEach(function(p){ if(p.boss===id) p.boss=''; });
  save(); closeModal(); kenali(); render(); toast('Kru dihapus');
}

/* ============ CARI ============
   Pencarian ringan: menyaring apa yang sedang tampil terasa ajaib tapi
   membingungkan (kenapa papan Eisenhower tiba-tiba kosong?). Jadi yang
   dilakukan adalah melompat ke hal yang paling cocok. */
var _cariTimer=null;
function cari(q){
  clearTimeout(_cariTimer);
  _cariTimer=setTimeout(function(){
    q=String(q||'').trim().toLowerCase();
    if(q.length<3) return;
    var p=DB.projects.find(function(x){return String(x.name).toLowerCase().indexOf(q)>-1;});
    if(p){ bukaProject(p.id); return; }
    var t=DB.tasks.find(function(x){return String(x.name).toLowerCase().indexOf(q)>-1;});
    if(t){ taskModal(t.id); return; }
    var o=DB.po.find(function(x){return String(x.item).toLowerCase().indexOf(q)>-1;});
    if(o){ poModal(o.id); return; }
    var c=DB.coord.find(function(x){return String(x.title).toLowerCase().indexOf(q)>-1;});
    if(c){ coordModal(c.id); }
  },420);
}

/* ============ JEMBATAN KE HTML ============
   Semua onclick di markup memanggil lewat APP.*, jadi seluruh modul tetap di
   dalam IIFE dan tidak menaburkan nama global yang bisa bertabrakan. */
window.APP={
  go:go, cari:cari, qprev:qprev,
  taskModal:function(id,proj){ _presetProject=proj||null; taskModal(id); },
  simpanTask:simpanTask, hapusTask:hapusTask, toggleTask:toggleTask,
  dragTask:dragTask, dropTask:dropTask,
  setTaskMode:function(m){taskMode=m;render();},
  filter:function(apa,nilai){
    if(apa==='reset'){fDiv='';fProj='';fType='';fScope='tim';}
    else if(apa==='div')fDiv=nilai; else if(apa==='proj')fProj=nilai;
    else if(apa==='type')fType=nilai; else if(apa==='scope')fScope=nilai;
    render();
  },
  projModal:projModal, simpanProj:simpanProj, hapusProj:hapusProj,
  bukaProject:bukaProject, dragProj:dragProj, dropProj:dropProj, toggleMilestone:toggleMilestone,

/* ============ BOOT ============ */
function cetakIdentitas(){
  var s=sesi()||{};
  var nama=s.name||'Kru';
  $('#su-avatar').textContent=inisial(nama);
  $('#su-un').textContent=nama;
  $('#su-ur').textContent=AKU?((AKU.role||'Kru')+' · '+(AKU.div||'')):'Kru BD OS';
}
function layarGagal(pesan){
  $('#loading').style.display='none';
  $('#app').style.display='';
  /* Identitas tetap dicetak walau server mati: namanya datang dari sesi
     Office di localStorage, bukan dari API. Sidebar yang menampilkan "?" saat
     galat membuat kru mengira sesinya ikut bermasalah — padahal tidak. */
  cetakIdentitas();
  $('#view').innerHTML='<div class="card" style="border-color:var(--danger);max-width:640px;margin:40px auto">'+
    '<div class="card-h"><h3 style="color:var(--danger)">Tidak bisa memuat data</h3></div>'+
    /* Sengaja TIDAK menjanjikan "data kamu aman di database". Penyebab
       tersering layar ini muncul justru saat backend belum terpasang sama
       sekali — belum ada database untuk diamankan, dan janji yang salah
       membuat orang berhenti mencari penyebabnya. */
    '<div class="card-b"><p style="color:var(--muted);line-height:1.6">BD OS tidak bisa bicara dengan '+
    'backendnya, jadi tidak ada yang ditampilkan. Ini kegagalan <b>memuat</b> — tidak ada yang terhapus. '+
    'Pesan di bawah menyebut penyebabnya.</p>'+
    '<div style="margin-top:12px;font-size:12.5px"><div class="stat-l">Alamat API</div>'+
    '<div style="font-family:var(--mono);font-size:12px">'+esc(API_URL)+'</div>'+
    '<div class="stat-l" style="margin-top:8px">Pesan</div><div>'+esc(pesan)+'</div></div>'+
    '<div style="margin-top:16px;display:flex;gap:10px"><button class="btn pri" onclick="location.reload()">'+
    ic('refresh')+'Coba lagi</button><button class="btn" onclick="logout()">Kembali ke Office</button></div>'+
    '</div></div>';
  $('#tbTitle').textContent='Gagal memuat';
  $('#tbSub').textContent='Kesalahan';
}
apiGet('getAll').then(function(s){
  DB=normalize(s);
  /* Data contoh hanya kalau database benar-benar perawan — bukan sekadar
     "tasks kosong". Tim yang sengaja menghapus semua task tidak boleh
     mendapati task karangan muncul kembali di sesi berikutnya. */
  if(SEED_CONTOH && !DB.people.length && !DB.tasks.length && !DB.projects.length){
    DB=normalize(contoh()); _snap={};
    return kirimPaksa();
  }
}).then(function(){
  segarkanSnapshot();
  kenali();
  cetakIdentitas();
  $('#loading').style.display='none';
  $('#app').style.display='';
  render();
},function(e){ layarGagal(e.message||String(e)); });

})();
