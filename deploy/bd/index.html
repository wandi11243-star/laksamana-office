/* Milestone diketik sebagai teks banyak-baris, bukan daftar dinamis. Bentuknya
   sederhana dan bisa disalin dari catatan rapat; status selesainya TIDAK ikut
   di teks ini supaya mengedit nama milestone tidak diam-diam mereset centang
   yang sudah ada — pencocokannya per nama, lihat di bawah. */
function bacaMilestone(teks,lama){
  return String(teks||'').split('\n').map(function(b){return b.trim();}).filter(Boolean).map(function(b){
    var q=b.split('|');
    var nama=(q[0]||'').trim();
    var tgl=(q[1]||'').trim();
    var sebelum=(lama||[]).find(function(m){return m.t===nama;});
    return {t:nama,date:/^\d{4}-\d{2}-\d{2}$/.test(tgl)?tgl:'',done:sebelum?!!sebelum.done:false};
  });
}
function simpanProj(id){
  var g=function(x){return document.getElementById(x).value;};

  var lama=id?(DB.projects.find(function(x){return x.id===id;}).milestones||[]):[];
  var data={name:nama,desc:g('p_desc').trim(),div:g('p_div'),type:g('p_type').trim()||'Internal',
    stage:g('p_stage'),start:g('p_start'),end:g('p_end'),
    budget:bacaRp('p_budget'),spent:bacaRp('p_spent'),health:g('p_health'),
    milestones:bacaMilestone(g('p_ms'),lama)};
  var p;
  if(id){ p=DB.projects.find(function(x){return x.id===id;}); Object.assign(p,data); }
  else  { p=Object.assign({id:uid('p')},data); DB.projects.push(p); }
  setPics(p,bacaPic('p_pics'));
  save(); closeModal(); render(); toast(id?'Project diperbarui':'Project ditambahkan');
}
function hapusProj(id){
  if(!confirm('Hapus project ini? Task-nya TIDAK ikut terhapus — hanya dilepas dari project.')) return;
  DB.projects=DB.projects.filter(function(p){return p.id!==id;});
  /* Task/PO/koordinasi yang menunjuk project ini dilepas tautannya, bukan
     ikut dihapus. Membiarkan id project yang sudah tidak ada akan membuat
     penyaring "per project" menampilkan baris hantu tanpa nama. */
  DB.tasks.forEach(function(t){ if(t.project===id) t.project=null; });
  DB.po.forEach(function(o){ if(o.project===id) o.project=null; });
  DB.coord.forEach(function(c){ if(c.project===id) c.project=null; });
  save(); closeModal(); view='projects'; render(); toast('Project dihapus');
}

      stat('Kepatuhan',rate+'<small>%</small>','rata-rata periode ini',rate>=90?'gr':(rate>=70?'wa':'rd'))+
      stat('Terlewat',lewatTotal,'total periode ini',lewatTotal?'wa':'gr')+

      '<th>Eisenhower</th><th>Kepatuhan</th><th>Status</th><th></th></tr></thead><tbody>'+
      DB.routines.map(function(r){

        return '<tr class="clk" onclick="APP.routineModal(\''+r.id+'\')">'+
          '<td><span class="nm">'+esc(r.name)+'</span></td>'+
          '<td>'+tagDiv(r.div)+'</td>'+
          '<td><span class="mut">'+esc(r.freq)+(r.time?' · '+esc(r.time):'')+'</span></td>'+
          '<td><span class="mini-av">'+esc(inisial(P(r.pic).name))+'</span></td>'+
          '<td><span class="tag q-'+q.k+'">'+q.l+'</span></td>'+
          '<td><div class="krow" style="margin:0"><div class="progress'+(pc>=90?' ok':'')+'" style="max-width:80px">'+
            '<i style="width:'+pc+'%"></i></div><span class="pctnum num">'+pc+'%</span></div>'+
            '<span class="mut" style="font-size:11px">'+(+r.done||0)+'/'+(+r.total||0)+(r.missed?' · '+r.missed+' lewat':'')+'</span></td>'+
          '<td>'+pill(r.active?'Aktif':'Nonaktif',r.active?'p-go':'p-mute')+'</td>'+
          '<td><button class="iconbtn" title="Hapus" onclick="event.stopPropagation();APP.hapusRoutine(\''+r.id+'\')">'+ic('trash')+'</button></td></tr>';
      }).join('')+'</tbody></table></div>'

}

function simpanRoutine(id){
  var g=function(x){return document.getElementById(x);};
  var nama=g('r_name').value.trim();
  if(!nama){ toast('Nama routine wajib diisi.'); return; }
  var data={name:nama,div:g('r_div').value,pic:g('r_pic').value,freq:g('r_freq').value,time:g('r_time').value.trim(),
    done:+g('r_done').value||0,total:+g('r_total').value||0,missed:+g('r_missed').value||0,
    important:g('rg_imp').classList.contains('on'),urgent:g('rg_urg').classList.contains('on'),
    active:g('rg_act').classList.contains('on')};
  if(id) Object.assign(DB.routines.find(function(x){return x.id===id;}),data);
  else DB.routines.push(Object.assign({id:uid('r')},data));
  save(); closeModal(); render(); toast(id?'Routine diperbarui':'Routine ditambahkan');
}
function hapusRoutine(id){
  if(!confirm('Hapus routine ini beserta catatan kepatuhannya?')) return;
  DB.routines=DB.routines.filter(function(r){return r.id!==id;});
  save(); closeModal(); render(); toast('Routine dihapus');
}

/* ============ PURCHASING ============
   Dua peran dalam satu halaman, dan itu disengaja:

   - SIAPA PUN boleh mengajukan request order (tombol "Request Order").
     Formnya pendek — barang, jumlah, kapan dibutuhkan, alasan — karena
     pemintanya belum tahu vendor maupun harga, dan memaksanya menebak dua
     hal itu cuma menghasilkan angka karangan yang lalu dipercaya orang lain.
   - Tim purchasing melengkapinya lewat form penuh (vendor, nilai, status).

   Keduanya baris yang SAMA, bukan dua tabel. Request yang disetujui bukan
   dokumen baru; ia PO yang sama yang berpindah status, sehingga jejak dari
   permintaan sampai barang diterima tidak pernah putus. */
var poFilter='', poMode='pr', poMinggu=0;

/* Senin sebagai awal minggu, sama dengan kalender. */
function awalMinggu(iso){
  var d=pDate(iso||todayISO());
  d.setDate(d.getDate()-((d.getDay()+6)%7));
  return isoOf(d);
}
function geserMinggu(iso,n){ var d=pDate(iso); d.setDate(d.getDate()+n*7); return isoOf(d); }
function akhirMinggu(iso){ var d=pDate(awalMinggu(iso)); d.setDate(d.getDate()+6); return isoOf(d); }
function labelMinggu(senin){
  var m=pDate(senin), a=new Date(m); a.setDate(a.getDate()+6);
  return m.getDate()+' '+BLN[m.getMonth()]+' – '+a.getDate()+' '+BLN[a.getMonth()]+' '+a.getFullYear();
}
/* Nama peminta. `by` (id kru dari database account) diutamakan; `byName`
   dipakai untuk baris yang datang dari modul lain — Marketing tidak mengenal
   id kru BD, jadi ia mengirim namanya sebagai teks. Mengarang id di sana akan
   membuat kolom Peminta menunjuk orang yang salah, dan itu lebih buruk
   daripada teks biasa. */
function poRequester(p){
  if(p.by && P(p.by).id) return P(p.by).name;
  if(p.byName) return p.byName;
  return p.pic ? P(p.pic).name : '—';
}

function vPurchasing(){

  var nilai=berjalan.reduce(function(s,p){return s+(+p.amount||0);},0);

      '<button class="'+(poMode==='daftar'?'on':'')+'" onclick="APP.setPoMode(\'daftar\')">Semua Item</button>'+
      '<button class="'+(poMode==='minggu'?'on':'')+'" onclick="APP.setPoMode(\'minggu\')">Rekap</button>'+
    '</div>'+
    '<button class="btn pri" onclick="APP.requestModal()">'+ic('plus')+'Request Order</button>');

  h+='<div class="stats">'+
    stat('Total PO',DB.po.length,DB.po.filter(function(p){return p.status==='Diterima';}).length+' sudah diterima','')+

    stat('Nilai berjalan',fRpPenuh(nilai),'belum diterima','tl')+
  '</div>';

  return h+(poMode==='pr'?vPrList():(poMode==='minggu'?poRekapMingguan():poDaftar()));

function poDaftar(){
  var list=poFilter?DB.po.filter(function(p){return p.status===poFilter;}):DB.po;

      (poFilter?'<button class="btn sm" onclick="APP.setPoFilter(\'\')">'+ic('x',12)+'Reset</button>':'')+
    '</div>'+
    (list.length?poTabel(list)
    :'<div class="card"><div class="card-b">'+kosong('Tidak ada PO',poFilter?'Tidak ada PO berstatus '+poFilter+'.':'')+'</div></div>');
}

/* ---- PENANDA "SUDAH DIPROSES" ----
   Terpisah dari `status`, dan itu disengaja. `status` (Draft → Diajukan →
   Approved → Dibeli → Diterima) adalah posisi barang di alur pembelian —
   yang menggerakkannya approval dan barang datang. Penanda ini menjawab
   pertanyaan lain: "baris ini sudah saya kerjakan atau belum". Purchasing
   memakainya untuk menandai mana yang sudah ditindaklanjuti walau statusnya
   belum bergerak, mis. sudah menghubungi vendor tapi harga belum keluar.

   Menumpangkannya ke `status` sebagai tahap baru akan merusak rekap: nilai
   mingguan dan hitungan "perlu approval" dihitung dari status, jadi tahap
   tambahan membuat baris hilang dari salah satu hitungan itu.

   Disimpan di field `proses` + jejak siapa/kapan. Backend menyimpan seluruh
   baris sebagai JSON di kolom `data`, jadi field baru tidak butuh migrasi. */
function poProsesSel(p){
  var on=!!p.proses;
  var judul=on
    ? 'Sudah diproses'+(p.prosesBy?' oleh '+p.prosesBy:'')+(p.prosesAt?' · '+fWaktu(p.prosesAt):'')+' — klik untuk batalkan'
    : 'Klik kalau barang ini sudah diproses';
  return '<span class="pill '+(on?'p-go':'p-mute')+'" role="button" tabindex="0" style="cursor:pointer;user-select:none"'+
    ' title="'+esc(judul)+'"'+
    ' onclick="event.stopPropagation();APP.togglePoProses(\''+p.id+'\')">'+
    (on?'✓ Diproses':'Belum')+'</span>';
}
function togglePoProses(id){
  var p=DB.po.find(function(x){return x.id===id;}); if(!p) return;
  p.proses=!p.proses;
  // Jejaknya ikut dibersihkan saat penandanya dilepas — meninggalkan nama dan
  // jam pada baris yang statusnya "Belum" membuat tooltip berbohong.
  if(p.proses){ p.prosesAt=Date.now(); p.prosesBy=(AKU&&AKU.name)||''; }
  else { delete p.prosesAt; delete p.prosesBy; }
  save(); render();
}

function poTabel(list){
  return '<div class="tw"><table><thead><tr><th>Item</th><th>Peminta</th><th>Diinput</th><th>Vendor</th><th>Qty</th><th>Nilai</th>'+
    '<th>Divisi</th><th>Butuh</th><th>Proses</th><th>Status</th><th></th></tr></thead><tbody>'+
    list.map(function(p){
      var pr=p.project&&DB.projects.find(function(x){return x.id===p.project;});
      var telat=sisaHari(p.needBy)<0&&p.status!=='Diterima';
      /* Nilai 0 pada request yang belum diproses BUKAN "gratis" — belum
         dihitung. Menampilkannya sebagai "Rp 0" membuat rekap mingguan
         terbaca seolah minggu itu tidak memakan biaya apa pun. */
      var belumDihitung=(!(+p.amount)) && (p.status==='Draft'||p.status==='Diajukan');
      return '<tr class="clk" onclick="APP.poModal(\''+p.id+'\')">'+
        '<td><span class="nm">'+esc(p.item)+'</span>'+
          (pr?'<div class="tag proj" style="margin-top:3px;display:inline-block">'+esc(pr.name)+'</div>':'')+
          (p.note?'<div class="mut" style="font-size:11.5px;margin-top:2px">'+esc(p.note)+'</div>':'')+'</td>'+
        '<td><span class="mut">'+esc(poRequester(p))+'</span>'+
          /* Asal modul ditandai. Baris dari Marketing tidak punya id kru BD,
             jadi tanpa penanda ini "kenapa Peminta-nya cuma teks" jadi
             pertanyaan yang tidak ada jawabannya di layar. */
          (p.sumber?'<div><span class="tag">dari '+esc(p.sumber)+'</span></div>':'')+'</td>'+
        /* Waktu input + siapa yang mengetik. Dua-duanya perlu: saat ada dua
           permintaan mirip, yang menjelaskan duplikatnya biasanya "diketik dua
           orang berbeda dalam sepuluh menit", dan itu tidak terlihat dari
           tanggal saja. */
        '<td><span class="mut" style="white-space:nowrap">'+esc(fWaktu(p.at))+'</span>'+
          (p.input&&p.input!==poRequester(p)?'<div class="mut" style="font-size:11px">oleh '+esc(p.input)+'</div>':'')+'</td>'+
        '<td><span class="mut">'+esc(p.vendor||'—')+'</span></td>'+
        '<td><span class="mut num">'+(+p.qty||0)+' '+esc(p.unit||'')+'</span></td>'+
        '<td>'+(belumDihitung?'<span class="mut">belum dihitung</span>':'<span class="nm num">'+fRpPenuh(p.amount)+'</span>')+'</td>'+
        '<td><span class="tag div">'+esc(String(p.div).split(' ')[0])+'</span></td>'+
        '<td><span class="mut"'+(telat?' style="color:var(--danger);font-weight:600"':'')+'>'+fDue(p.needBy)+'</span></td>'+
        '<td>'+poProsesSel(p)+'</td>'+
        '<td>'+pill(p.status,PO_COLOR[p.status]||'p-mute')+'</td>'+
        '<td><button class="iconbtn" title="Hapus" onclick="event.stopPropagation();APP.hapusPo(\''+p.id+'\')">'+ic('trash')+'</button></td></tr>';
    }).join('')+'</tbody></table></div>';
}

/* ---- REKAP MINGGUAN ----
   Dikelompokkan menurut TANGGAL DIBUTUHKAN (needBy), bukan tanggal request.
   Pertanyaan yang dijawab rekap ini adalah "minggu depan kita harus
   mengeluarkan apa saja", dan itu ditentukan kapan barangnya dipakai — bukan
   kapan orang sempat mengetik permintaannya. Tanggal request tetap tercatat
   dan tampil di barisnya. */
function poRekapMingguan(){
  var senin=geserMinggu(awalMinggu(todayISO()),poMinggu);
  var akhir=geserMinggu(senin,1);
  var minggu=DB.po.filter(function(p){ return p.needBy && p.needBy>=senin && p.needBy<akhir; });

  var perStatus={};
  PO_FLOW.forEach(function(s){ perStatus[s]=0; });
  var nilai=0, belum=0;
  minggu.forEach(function(p){
    perStatus[p.status]=(perStatus[p.status]||0)+1;
    var a=+p.amount||0;
    nilai+=a;
    if(!a && (p.status==='Draft'||p.status==='Diajukan')) belum++;
  });

  var h='<div class="filters">'+
    '<div class="seg">'+
      '<button onclick="APP.geserMingguPo(-1)">'+ic('chevL',14)+'</button>'+
      '<button class="on" style="cursor:default">'+labelMinggu(senin)+'</button>'+
      '<button onclick="APP.geserMingguPo(1)">'+ic('chevR',14)+'</button>'+
    '</div>'+
    (poMinggu?'<button class="btn sm" onclick="APP.geserMingguPo(0)">Minggu ini</button>':
              '<span class="pill p-gold">minggu ini</span>')+
    '<span class="muted" style="font-size:12px;margin-left:auto">dikelompokkan menurut tanggal dibutuhkan</span>'+
  '</div>';

  h+='<div class="stats">'+
    stat('PO minggu ini',minggu.length,minggu.length?'butuh antara '+labelMinggu(senin):'tidak ada kebutuhan','')+
    stat('Nilai',fRp(nilai),belum?belum+' item belum dihitung':'seluruhnya sudah dihitung',belum?'wa':'tl')+
    stat('Perlu approval',perStatus['Diajukan']||0,'menunggu diproses',(perStatus['Diajukan']||0)?'wa':'gr')+
    stat('Sudah diterima',perStatus['Diterima']||0,'dari '+minggu.length+' PO',
         (minggu.length&&perStatus['Diterima']===minggu.length)?'gr':'')+
  '</div>';

  h+='<div class="card" style="margin-bottom:16px"><div class="card-b" style="display:flex;gap:9px;flex-wrap:wrap">'+
    PO_FLOW.map(function(s){
      return '<span class="pill '+(PO_COLOR[s]||'p-mute')+'">'+s+': '+(perStatus[s]||0)+'</span>';
    }).join('')+'</div></div>';

  h+=(minggu.length? poTabel(minggu.slice().sort(function(a,b){return a.needBy<b.needBy?-1:1;}))
    :'<div class="card"><div class="card-b">'+
      kosong('Tidak ada PO yang dibutuhkan minggu ini',
        'Geser ke minggu lain, atau buat request lewat tombol Request Order.')+'</div></div>');

  /* Ringkasan 6 minggu ke depan: rekap satu minggu menjawab "minggu ini apa",
     tapi tidak menjawab "minggu mana yang menumpuk". Deretan ini yang
     membuat penumpukan terlihat sebelum terjadi. */
  var depan='';
  for(var i=-1;i<5;i++){
    var s0=geserMinggu(awalMinggu(todayISO()),i), s1=geserMinggu(s0,1);
    var g=DB.po.filter(function(p){ return p.needBy && p.needBy>=s0 && p.needBy<s1; });
    var n=g.reduce(function(a,p){return a+(+p.amount||0);},0);
    depan+='<tr class="clk" onclick="APP.pilihMinggu('+i+')"'+(i===poMinggu?' style="background:var(--gold-glow)"':'')+'>'+
      '<td><span class="nm">'+labelMinggu(s0)+'</span>'+(i===0?' '+pill('minggu ini','p-gold'):'')+'</td>'+
      '<td><span class="num">'+g.length+'</span></td>'+
      '<td><span class="num">'+fRp(n)+'</span></td>'+
      '<td>'+(g.filter(function(p){return p.status==='Diajukan';}).length||'—')+'</td></tr>';
  }
  h+='<div class="card" style="margin-top:16px"><div class="card-h"><h3>Enam minggu terdekat</h3></div>'+
    '<div class="tw" style="border:none;box-shadow:none;border-radius:0">'+
    '<table><thead><tr><th>Minggu</th><th>PO</th><th>Nilai</th><th>Perlu approval</th></tr></thead>'+
    '<tbody>'+depan+'</tbody></table></div></div>';
  return h;
}

/* ============ PURCHASE REQUEST MINGGUAN ============
   Lembar inilah yang sebenarnya berjalan di tim: dikumpulkan sepanjang
   minggu, dijadikan satu dokumen bernomor, dikirim sebagai PDF ke Finance dan
   CEO, lalu ditandatangani. Aplikasi ini tidak mengubah alur itu — ia hanya
   menggantikan pengetikan ulang di spreadsheet.

   Item TIDAK disalin ke dalam dokumen. `po.prId` menunjuk ke dokumennya, jadi
   satu item hanya punya satu tempat tinggal. Dokumen yang menyalin isi item
   akan menyimpang dari barisnya begitu salah satu diubah, dan tidak akan ada
   yang tahu mana yang benar — persis masalah yang membuat rekap spreadsheet
   lama harus dicek ulang manual. */
function prItems(prId){ return DB.po.filter(function(p){return p.prId===prId;}); }
function prTotal(prId){
  var grand=0, belum=0;
  prItems(prId).forEach(function(p){
    var a=+p.amount||0;
    grand+=a;
    if(!a) belum++;
  });
  return {grand:grand, belum:belum};
}
function prNoBerikut(){
  /* Nomor diambil dari yang TERTINGGI, bukan dari jumlah dokumen. PR yang
     pernah dihapus tidak boleh membuat nomor terpakai ulang — dua lembar
     bernomor sama di arsip Finance tidak bisa dibedakan lagi. */
  var maks=0;
  DB.pr.forEach(function(x){ var n=parseInt(x.no,10); if(!isNaN(n)&&n>maks) maks=n; });
  return String(maks+1);
}

var prAktif=null;

/* Request yang BELUM ikut dokumen mana pun.

   TIDAK disaring per minggu, dan itu koreksi dari rancangan pertama. Lembar
   PR yang dipakai tim tidak punya tanggal-dibutuhkan per baris sama sekali —
   yang ada cuma satu REQUEST DATE untuk seluruh lembar. Cara kerjanya
   mengumpulkan apa pun yang masuk, lalu menjadikannya satu lembar; bukan
   memilah menurut kapan barangnya dipakai.

   Versi pertama menyaringnya menurut minggu needBy, dan akibatnya request
   yang baru saja diketik menghilang dari layar hanya karena tanggal
   butuhnya jatuh di minggu berikutnya. Yang tersaring diam-diam lebih buruk
   daripada daftar panjang: orang menyangka datanya tidak tersimpan. */
function poBebas(){ return DB.po.filter(function(p){ return !p.prId; }); }

function vPrList(){
  var bebas=poBebas();
  var h='';

  if(bebas.length){
    /* Item dipilih lewat centang, bukan "semua atau tidak sama sekali".
       Sering ada satu-dua request yang belum jelas harganya atau memang mau
       ditahan ke minggu depan; tanpa pemilihan, satu-satunya jalan adalah
       membuat PR lalu mengeluarkannya lagi — dan lembar bernomor yang sempat

    h+='<div class="card" style="margin-bottom:16px"><div class="card-h">'+

      '<div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap">'+

         dengan lembar PR — nama, jumlah, satuan, alasan, peminta, harga —
         supaya yang memeriksa sebelum menekan "Buat PR" membaca susunan yang
         persis sama dengan yang nanti tercetak, bukan menerjemahkan ulang di
         kepala. */
      '<div class="tw" style="border:none;box-shadow:none;border-radius:0">'+
      '<table><thead><tr>'+
        /* Kelasnya `pickall`, BUKAN `pick`. Kalau sama, kotak di kepala tabel
           ikut terhitung sebagai item terpilih dan tombolnya menjanjikan satu
           item lebih banyak daripada yang benar-benar masuk lembar. */
        '<th style="width:34px"><input type="checkbox" class="pickall pick-hdr" checked title="Pilih semua" '+
          'onchange="APP.pilihSemuaPr(this.checked)"></th>'+
        '<th>Nama item</th><th>Jumlah</th><th>Satuan</th><th>Alasan / kebutuhan</th>'+
        '<th>Peminta</th><th>Harga</th><th>Butuh</th><th>Diinput</th><th></th>'+
      '</tr></thead><tbody>'+
      bebas.map(function(p){
        return '<tr class="clk" onclick="APP.poModal(\''+p.id+'\')">'+
          /* stopPropagation: tanpa itu, mencentang kotak juga membuka modal
             item — jadi tiap kali memilih, layar tertutup dialog. */
          '<td onclick="event.stopPropagation()"><input type="checkbox" class="pick" checked '+
            'data-id="'+esc(p.id)+'" onchange="APP.hitungPilihPr()"></td>'+
          '<td><span class="nm">'+esc(p.item)+'</span>'+
            (p.sumber?' <span class="tag">dari '+esc(p.sumber)+'</span>':'')+'</td>'+
          '<td><span class="num">'+(+p.qty||0)+'</span></td>'+
          '<td><span class="mut">'+esc(p.unit||'—')+'</span></td>'+
          '<td><span class="mut">'+esc(p.note||'—')+'</span></td>'+
          '<td><span class="mut">'+esc(poRequester(p))+'</span></td>'+
          '<td>'+((+p.amount)?'<span class="nm num" style="white-space:nowrap">'+fRpPenuh(p.amount)+'</span>'

          '<td onclick="event.stopPropagation()">'+
            '<button class="iconbtn" title="Ubah" onclick="APP.poModal(\''+p.id+'\')">'+ic('edit')+'</button>'+
            '<button class="iconbtn" title="Hapus" onclick="APP.hapusPo(\''+p.id+'\')">'+ic('trash')+'</button>'+
          '</td></tr>';

      '</tbody></table></div></div>';
  }

  if(!DB.pr.length) return h+'<div class="card"><div class="card-b">'+
    kosong(bebas.length?'Belum ada dokumen PR':'Belum ada request maupun dokumen PR',
      bebas.length?'Tekan "Buat PR dari semuanya" di atas untuk menjadikannya satu lembar bernomor.'
                 :'Mulai dari tombol "Request Order" di kanan atas.')+'</div></div>';

  /* Tabelnya memuat isi lembarnya, bukan cuma ringkasan angka: pertanyaan
     yang paling sering muncul di daftar ini adalah "PR minggu lalu itu isinya
     apa saja" — dan menjawabnya dengan membuka satu per satu berarti daftar
     ini tidak menghemat apa pun. Nama item ikut ditulis (dipotong di item
     kelima), dan tiga penyetuju ditampilkan terpisah supaya terlihat siapa
     yang belum tanda tangan tanpa harus masuk ke dokumennya. */

}

function idTerpilihPr(){
  var out=[];
  document.querySelectorAll('.pick:checked').forEach(function(el){ out.push(el.getAttribute('data-id')); });
  return out;
}
function buatPr(){
  var pilih=idTerpilihPr();
  var bebas=poBebas().filter(function(p){ return pilih.indexOf(p.id)>-1; });
  if(!bebas.length){ toast('Belum ada item yang dicentang.'); return; }

  /* KONFIRMASI DULU, jangan langsung terbentuk.

     Lembar PR memakan nomor urut, dan nomor itu tidak bisa dipakai ulang —
     PR yang terbuat karena salah tekan meninggalkan lubang di penomoran arsip
     Finance yang tidak bisa dijelaskan lagi setahun kemudian. Satu dialog
     jauh lebih murah daripada nomor yang hilang. */
  var total=bebas.reduce(function(a,p){return a+(+p.amount||0);},0);
  var daftar=bebas.slice(0,8).map(function(p,i){return '  '+(i+1)+'. '+p.item;}).join('\n')+
             (bebas.length>8?'\n  … dan '+(bebas.length-8)+' item lagi':'');
  if(!confirm('Buat lembar PR-'+prNoBerikut()+' berisi '+bebas.length+' item?\n\n'+daftar+
    '\n\nGrand total: '+fRpPenuh(total)+
    '\n\nLembarnya dibuat sebagai DRAFT — belum terkirim ke siapa pun sampai kamu '+
    'menekan "Kunci & ajukan" di halaman dokumennya.')) return;

  var senin=awalMinggu(todayISO());
  var approvals={};
  PENYETUJU.forEach(function(s){ approvals[s.k]={nama:s.nama, at:'', oleh:''}; });
  var pr={
    id:uid('pr'), no:prNoBerikut(),
    nama:(AKU&&AKU.name)||((sesi()||{}).name)||'—',
    dept:(AKU&&AKU.div)||'Purchasing',
    tanggal:todayISO(), weekStart:senin, status:'Draft',
    total:0, approvals:approvals, catatan:''
  };
  DB.pr.push(pr);
  bebas.forEach(function(p){ p.prId=pr.id; });
  pr.total=prTotal(pr.id).grand;
  save(); bukaPr(pr.id);
  toast('PR-'+pr.no+' dibuat dari '+bebas.length+' request');
}
function bukaPr(id){ prAktif=id; view='prDetail'; render(); window.scrollTo(0,0); }
function hapusPr(id){
  var n=prItems(id).length;
  if(!confirm('Hapus dokumen PR ini?\n\n'+n+' item di dalamnya TIDAK ikut terhapus — '+
    'mereka kembali jadi request bebas dan bisa dimasukkan ke PR lain.')) return;
  DB.po.forEach(function(p){ if(p.prId===id) p.prId=null; });
  DB.pr=DB.pr.filter(function(x){return x.id!==id;});
  save(); closeModal(); view='purchasing'; render(); toast('Dokumen PR dihapus, itemnya dilepas');
}

/* Tidak ada penjaga kunci lagi: item boleh diubah kapan pun, termasuk sesudah
   dokumen diajukan. Lihat catatan di vPrDetail. */
function lepasDariPr(poId){
  var p=DB.po.find(function(x){return x.id===poId;});
  if(!p) return;
  p.prId=null;
  var pr=DB.pr.find(function(x){return x.id===prAktif;});
  if(pr) pr.total=prTotal(pr.id).grand;
  save(); render(); toast(p.item+' dikeluarkan dari lembar ini');
}
function masukkanKePr(poId){
  var p=DB.po.find(function(x){return x.id===poId;});
  if(!p) return;
  p.prId=prAktif;
  var pr=DB.pr.find(function(x){return x.id===prAktif;});
  if(pr) pr.total=prTotal(pr.id).grand;
  save(); render(); toast(p.item+' masuk ke lembar ini');
}
function statusPr(st){
  var pr=DB.pr.find(function(x){return x.id===prAktif;});
  if(!pr) return;
  pr.status=st;
  pr.total=prTotal(pr.id).grand;
  save(); render();
  toast(st==='Draft'?'Kunci dibuka — item bisa diubah lagi':'PR-'+pr.no+' dikunci sebagai '+st);
}
/* Persetujuan mencatat SIAPA yang menekannya (dari sesi Office) dan kapan.

   Ini jejak, BUKAN penjagaan: aplikasi tidak memeriksa apakah yang menekan
   benar-benar Finance atau CEO. Yang mengikat tetap PDF bertanda tangan —
   layar ini merekam persetujuan yang sudah terjadi, bukan menggantikannya.
   Kalau nanti ini harus jadi otorisasi sungguhan, pemeriksaannya wajib di
   server; dicek di browser tidak menahan siapa pun. */
function setujuPr(kunci,batal){
  var pr=DB.pr.find(function(x){return x.id===prAktif;});
  if(!pr) return;
  pr.approvals=pr.approvals||{};
  var def=PENYETUJU.find(function(s){return s.k===kunci;})||{};
  var a=pr.approvals[kunci]||{nama:def.nama||'',at:'',oleh:''};
  if(batal){
    if(!confirm('Batalkan persetujuan '+(def.l||kunci)+'?')) return;
    a.at=''; a.oleh='';
  }else{
    a.at=todayISO();
    a.oleh=(sesi()||{}).name||'?';
  }
  pr.approvals[kunci]=a;
  var semua=PENYETUJU.every(function(s){return (pr.approvals[s.k]||{}).at;});
  if(semua && pr.status!=='Selesai') pr.status='Disetujui';
  if(!semua && pr.status==='Disetujui') pr.status='Diajukan';
  save(); render();
  toast(batal?'Persetujuan dibatalkan':(def.l||kunci)+' disetujui');
}

/* ---- REQUEST ORDER (banyak baris sekaligus) ----
   Bentuknya tabel, bukan satu form per barang, karena begitulah kebutuhan
   datang: sekali duduk seseorang menuliskan tujuh hal yang kurang minggu ini.
   Form satu-barang memaksa membuka-tutup modal tujuh kali dan mengisi ulang
   divisi, tanggal, serta project setiap kalinya — cukup melelahkan untuk
   membuat orang menunda, dan request yang ditunda berubah jadi pesan WhatsApp
   yang tidak tercatat di mana pun.

   Divisi, tanggal dibutuhkan, dan project ditaruh SEKALI di atas: satu sesi
   pengisian hampir selalu untuk keperluan yang sama. Yang berbeda tinggal
   diubah lewat form penuh sesudahnya. */
/* Kolom "Request" = SIAPA yang minta barang itu, dan namanya datang dari
   database account (tabel people, hasil sinkron roster) — bukan diketik.

   Per BARIS, bukan sekali untuk seluruh form: di lembar PR yang dipakai tim,
   satu lembar berisi permintaan beberapa orang sekaligus (Wandi, Rizki, …)
   yang dikumpulkan satu penyusun. Memaksa satu nama untuk seluruh sesi
   membuat kolom itu selalu berisi nama penyusunnya, dan pertanyaan "ini
   siapa yang butuh" tidak terjawab lagi. */

/* ============ CALENDAR ============ */
var calRef=null;
/* Semua yang punya tanggal dikumpulkan jadi satu daftar. Sumbernya empat, dan
   warnanya sengaja beda supaya "banyak merah di satu minggu" langsung terbaca
   sebagai minggu yang padat deadline, bukan sekadar penuh. */
/* `geser` menandai item yang boleh DIPINDAH dengan menyeretnya ke kotak lain.

   Hanya task. Milestone, PO, dan koordinasi punya konsekuensi di luar
   kalender — milestone mengikat kesepakatan project, tanggal PO mengikat
   vendor, due koordinasi sudah dijanjikan ke divisi lain — dan menggesernya
   dengan satu tarikan tangan yang bahkan bisa tidak sengaja terlalu murah
   untuk perubahan sepenting itu. Ketiganya tetap diubah lewat modalnya
   masing-masing, di mana orang melihat konteks lengkapnya dulu. */
/* Kalender memakai penyaring YANG SAMA dengan Projects — lingkup, divisi, dan
   PIC. Sebelumnya ia menampilkan seisi papan tanpa peduli penyaring mana pun
   yang sedang aktif, jadi berpindah dari Projects ke Calendar seperti
   berpindah ke aplikasi lain.

   Koordinasi dan agenda TIDAK ikut disaring PIC: keduanya tidak punya PIC di
   sisi BD (koordinasi ditujukan ke divisi lain, agenda milik tim). Menyaring
   berdasarkan field yang tidak ada berarti menyembunyikan semuanya begitu
   satu nama dicentang. */
function calItems(){
  var out=[];
  var tugas=saringLingkup(DB.tasks,pScope).filter(cocokPic)
              .filter(function(t){ return (!pDiv||t.div===pDiv) && t.deadline && !selesai(t); });
  tugas.forEach(function(t){
    out.push({date:t.deadline,title:t.name,color:'var(--danger)',jenis:'Deadline',id:t.id,geser:true});});

  saringLingkup(DB.projects,pScope).filter(cocokPic)
    .filter(function(p){ return !pDiv||p.div===pDiv; })
    .forEach(function(p){(p.milestones||[]).forEach(function(ms){
      if(ms.date) out.push({date:ms.date,title:ms.t+' ('+p.name+')',color:'var(--violet)',jenis:'Milestone'});});});

  DB.po.filter(function(p){
      return p.status!=='Diterima' && p.needBy &&
             (!pDiv||p.div===pDiv) && (!fPics.length || fPics.indexOf(p.pic)>-1);
    }).forEach(function(p){
      out.push({date:p.needBy,title:'PO: '+p.item,color:'var(--teal)',jenis:'PO'});});

  DB.coord.filter(function(c){return c.status!=='Selesai'&&c.due;}).forEach(function(c){
    out.push({date:c.due,title:'Koord: '+c.title,color:'var(--warn)',jenis:'Koordinasi'});});
  DB.agenda.forEach(function(e){
    if(e.date) out.push({date:e.date,title:e.title,color:'var(--gold)',jenis:e.type||'Agenda'});});
  return out;
}

/* ---- geser task di kalender ---- */
var _dragCal=null, _baruSeret=0;
function dragCal(e,id){
  _dragCal=id;
  e.dataTransfer.effectAllowed='move';
  /* Firefox tidak memulai drag sama sekali kalau dataTransfer kosong. */
  try{ e.dataTransfer.setData('text/plain',id); }catch(_){}
  e.target.classList.add('dragging');
}
/* Klik SESUDAH menyeret harus diabaikan. Sebagian browser tetap melepaskan
   event click di ujung drag, jadi tanpa penjaga ini tiap kali task digeser
   modalnya ikut terbuka menimpa kalender — terlihat seperti aplikasi yang
   melakukan dua hal padahal diminta satu. */
function klikCal(id){
  if(Date.now()-_baruSeret < 400) return;
  taskModal(id);
}
function dropCal(e,iso){
  e.preventDefault();
  _baruSeret=Date.now();
  document.querySelectorAll('.cd').forEach(function(c){c.classList.remove('drop');});
  var t=DB.tasks.find(function(x){return x.id===_dragCal;});
  _dragCal=null;
  if(!t || t.deadline===iso) return;
  var lama=t.deadline;
  t.deadline=iso;
  save(); render();
  /* Toast menyebut ASAL dan TUJUAN. Salah jatuh satu kotak gampang terjadi di
     kalender rapat, dan tanpa keterangan ini orang tidak punya cara tahu
     tanggal apa yang barusan tergeser. */
  toast(t.name+': '+fTgl(lama)+' → '+fTgl(iso));
}
function vCalendar(){
  if(!calRef) calRef=new Date(new Date().getFullYear(),new Date().getMonth(),1);
  var items=calItems();
  var y=calRef.getFullYear(), mo=calRef.getMonth();
  var mulaiDow=(new Date(y,mo,1).getDay()+6)%7;      // Senin sebagai kolom pertama
  var jml=new Date(y,mo+1,0).getDate();
  var sel='';
  for(var i=0;i<mulaiDow;i++) sel+=calCell(new Date(y,mo,1-mulaiDow+i),true,items);
  for(var d=1;d<=jml;d++)     sel+=calCell(new Date(y,mo,d),false,items);
  var total=mulaiDow+jml;
  for(var k=total;k<Math.ceil(total/7)*7;k++) sel+=calCell(new Date(y,mo,jml+(k-total)+1),true,items);

  return head('Calendar',SUB.calendar[2],
      '<div class="seg">'+
        '<button onclick="APP.geserBulan(-1)">'+ic('chevL',14)+'</button>'+
        '<button class="on" style="cursor:default">'+BULAN[mo]+' '+y+'</button>'+
        '<button onclick="APP.geserBulan(1)">'+ic('chevR',14)+'</button></div>'+
      '<button class="btn sm" onclick="APP.bulanIni()">Bulan ini</button>'+
      '<button class="btn pri" onclick="APP.agendaModal()">'+ic('plus')+'Agenda</button>')+
    /* Bilah filter SAMA PERSIS dengan Projects, termasuk keadaannya (pScope,
       pDiv, fPics) — bukan salinan yang berdiri sendiri. Menyetel "cuma
       Wandi" di Projects lalu pindah ke Calendar harus tetap menampilkan
       Wandi saja; dua penyaring terpisah untuk data yang sama cuma bikin
       orang tidak percaya pada keduanya. */
    '<div class="filters"><span class="flabel">'+ic('projects',14)+' Filter</span>'+
      segLingkup(pScope,'APP.filterProj(\'scope\',this.value)')+
      '<select onchange="APP.filterProj(\'div\',this.value)"><option value="">Semua divisi</option>'+
        OWNER_DIVS.map(function(d){return '<option'+(pDiv===d?' selected':'')+'>'+esc(d)+'</option>';}).join('')+'</select>'+
      filterPic()+
      ((fPics.length||pDiv||pScope!=='tim')?'<button class="btn sm" onclick="APP.filterProj(\'reset\')">'+ic('x',12)+'Reset</button>':'')+
    '</div>'+
    '<div class="card"><div class="card-b">'+
      '<div class="cal">'+['Sen','Sel','Rab','Kam','Jum','Sab','Min'].map(function(x){
        return '<div class="cal-hd">'+x+'</div>';}).join('')+sel+'</div>'+
      '<div class="legend">'+
        '<span><span class="dot" style="background:var(--danger)"></span> Deadline task</span>'+
        '<span><span class="dot" style="background:var(--violet)"></span> Milestone</span>'+
        '<span><span class="dot" style="background:var(--teal)"></span> PO</span>'+
        '<span><span class="dot" style="background:var(--warn)"></span> Koordinasi</span>'+
        '<span><span class="dot" style="background:var(--gold)"></span> Agenda tim</span>'+
        '<span style="margin-left:auto;color:var(--gold-deep);font-weight:600">'+
          'Seret <b>deadline task</b> ke kotak lain untuk memindahkan tanggalnya.</span>'+
      '</div></div></div>';
}
function calCell(d,luar,items){
  var ds=isoOf(d), hariIni=ds===todayISO();
  var ev=items.filter(function(x){return x.date===ds;});
  return '<div class="cd'+(luar?' out':'')+(hariIni?' today':'')+'" '+
      'ondragover="event.preventDefault();this.classList.add(\'drop\')" '+
      'ondragleave="this.classList.remove(\'drop\')" '+
      'ondrop="APP.dropCal(event,\''+ds+'\')">'+
    '<span class="cd-n">'+d.getDate()+'</span>'+
    /* Sengaja TIDAK dipotong 3 lagi kalau ada yang bisa digeser: item yang
       tersembunyi di balik "+2 lagi" tidak bisa diseret sama sekali, dan
       orang akan mengira fiturnya rusak untuk task itu. Batasnya dinaikkan
       jadi 4 dan sisanya tetap diringkas. */
    ev.slice(0,4).map(function(e){
      return '<span class="cev'+(e.geser?' geser':'')+'" '+
        (e.geser?'draggable="true" ondragstart="APP.dragCal(event,\''+e.id+'\')" '+
                 'ondragend="this.classList.remove(\'dragging\')" '+
                 'onclick="APP.klikCal(\''+e.id+'\')" ':'')+
        'style="border-color:'+e.color+';background:'+e.color+'18;color:'+e.color+'" '+
        'title="'+esc(e.jenis+' — '+e.title)+(e.geser?' (seret untuk pindah tanggal)':'')+'">'+esc(e.title)+'</span>';
    }).join('')+
    (ev.length>4?'<span class="cal-more">+'+(ev.length-4)+' lagi</span>':'')+
  '</div>';
}

        'jadwal gabungannya dibaca di modul Radar.</div>'+
    '</div>'+
    '<div class="modal-f"><div>'+(baru?'':'<button class="btn bad sm" onclick="APP.hapusAgenda(\''+id+'\')">'+ic('trash')+'Hapus</button>')+'</div>'+
      '<div style="display:flex;gap:10px"><button class="btn" onclick="closeModal()">Batal</button>'+
      '<button class="btn pri" onclick="APP.simpanAgenda(\''+(id||'')+'\')">'+ic('check')+'Simpan</button></div></div>');
}
function simpanAgenda(id){
  var g=function(x){return document.getElementById(x).value;};
  var judul=g('a_title').trim();
  if(!judul){ toast('Judul agenda wajib diisi.'); return; }
  var data={title:judul,date:g('a_date'),type:g('a_type'),div:g('a_div')};
  if(id) Object.assign(DB.agenda.find(function(x){return x.id===id;}),data);
  else DB.agenda.push(Object.assign({id:uid('a')},data));
  save(); closeModal(); render(); toast(id?'Agenda diperbarui':'Agenda ditambahkan');
}
function hapusAgenda(id){
  if(!confirm('Hapus agenda ini?')) return;
  DB.agenda=DB.agenda.filter(function(e){return e.id!==id;});
  save(); closeModal(); render(); toast('Agenda dihapus');
}

/* ============ KRU BD ============
   TIDAK ADA tombol "tambah kru" di sini, dan itu disengaja. Siapa yang boleh
   masuk BD OS ditentukan di Office (Kelola Akses), bukan di modul ini —
   memberi modul ini tombol tambah berarti membuat daftar kedua yang bisa
   berbeda dari daftar akses sesungguhnya, dan yang lebih buruk: mengundang
   orang mengira menambah nama di sini sudah memberi orang itu akses. */
function vTim(){
  var h=head('Kru BD',SUB.tim[2],
    '<button class="btn" onclick="APP.segarkanKru()">'+ic('refresh')+'Segarkan dari Office</button>');

  h+='<div class="notice">Daftar ini datang dari <b>database account</b> — isinya '+
    'persis pemegang hak akses modul <code>bd</code>. Menambah/menghapus orang dilakukan di '+
    '<b>Kelola Akses</b> di Office, bukan di sini. Yang diatur di halaman ini hanya '+
    '<b>jabatan, divisi, dan atasan</b>, karena tiga hal itu tidak dikenal Office — '+
    'padahal atasanlah yang menentukan siapa melihat task siapa.</div>';

  if(!DB.people.length) return h+'<div class="card"><div class="card-b">'+
    kosong('Belum ada kru dengan akses modul ini',
      'Beri akses modul `bd` lewat Kelola Akses di Office, lalu tekan Segarkan.')+'</div></div>';

  var byBoss={};
  DB.people.forEach(function(p){ (byBoss[p.boss||'']=byBoss[p.boss||'']||[]).push(p); });
  var baris=[];
  /* Digambar berjenjang (atasan dulu, anak buah menjorok) supaya struktur
     yang menentukan visibilitas task terlihat, bukan cuma daftar nama. */
  (function gambar(bossId,level){
    (byBoss[bossId]||[]).forEach(function(p){
      baris.push({p:p,level:level});
      gambar(p.id,level+1);
    });
  })('',0);
  /* Kru yang atasannya menunjuk id yang sudah tidak ada tidak boleh hilang
     dari layar — justru merekalah yang perlu dibetulkan. */
  DB.people.forEach(function(p){
    if(!baris.some(function(b){return b.p.id===p.id;})) baris.push({p:p,level:0,yatim:true});
  });

  return h+'<div class="tw"><table><thead><tr><th>Nama</th><th>Jabatan</th><th>Divisi</th><th>Atasan</th>'+
    '<th>Task aktif</th><th>Akses</th><th></th></tr></thead><tbody>'+
    baris.map(function(b){
      var p=b.p;
      var nAktif=DB.tasks.filter(function(t){return punyaPic(t,p.id)&&!selesai(t);}).length;
      var nLewat=DB.tasks.filter(function(t){return punyaPic(t,p.id)&&lewat(t);}).length;
      var akses = p.tanpaAkses ? pill('dicabut','p-bad')
                : (p.active===false ? pill('nonaktif','p-mute') : pill('aktif','p-go'));
      return '<tr class="clk" onclick="APP.orangModal(\''+p.id+'\')">'+
        '<td style="padding-left:'+(13+b.level*18)+'px"><span class="mini-av" style="margin-right:8px">'+esc(inisial(p.name))+'</span>'+
          '<span class="nm">'+esc(p.name)+'</span>'+(AKU&&AKU.id===p.id?' '+pill('kamu','p-gold'):'')+'</td>'+
        '<td><span class="mut">'+esc(p.role||'—')+'</span></td>'+
        '<td>'+(p.div?tagDiv(p.div):'<span class="mut">belum diatur</span>')+'</td>'+
        '<td><span class="mut">'+esc(p.boss?P(p.boss).name:(b.yatim?'(atasan tidak ditemukan)':'—'))+'</span></td>'+
        '<td><span class="num">'+nAktif+'</span>'+(nLewat?' '+pill(nLewat+' lewat','p-bad'):'')+'</td>'+
        '<td>'+akses+'</td>'+
        /* Tombol hapus HANYA untuk baris yang aksesnya sudah dicabut DAN tidak
           lagi memegang pekerjaan apa pun. Selama masih ada task atas namanya,
           menghapus berarti membuang jejak siapa mengerjakan apa. */
        '<td>'+((p.tanpaAkses&&!nAktif)?'<button class="iconbtn" title="Hapus dari daftar" '+
          'onclick="event.stopPropagation();APP.hapusOrang(\''+p.id+'\')">'+ic('trash')+'</button>':'')+'</td></tr>';
    }).join('')+'</tbody></table></div>';
}
function orangModal(id){
  var p=id?DB.people.find(function(x){return x.id===id;}):null;
  if(!p) return;                       // kru hanya lahir dari roster, tidak dari modal
  showModal(
    '<div class="modal-h"><h3>'+esc(p.name)+'</h3>'+
      '<button class="x" onclick="closeModal()">'+ic('x')+'</button></div>'+
    '<div class="modal-b">'+
      /* Nama & status akses TIDAK bisa diedit di sini: pemiliknya database
         account. Field yang bisa diketik padahal perubahannya akan ditimpa
         sinkron berikutnya lebih buruk daripada tidak ada field sama sekali. */
      '<div class="notice" style="margin:0">Nama dan hak akses dikelola di <b>Office → Kelola Akses</b>, '+
        'jadi tidak bisa diubah dari sini — perubahannya akan ditimpa saat daftar disegarkan. '+
        'Yang di bawah ini milik BD OS.</div>'+
      '<div class="frow">'+
        '<div class="field"><label>Jabatan</label><input id="k_role" value="'+esc(p.role)+'" placeholder="mis. BD Manager"></div>'+
        '<div class="field"><label>Divisi</label><select id="k_div">'+
          '<option value=""'+(p.div?'':' selected')+'>— belum diatur —</option>'+
          OWNER_DIVS.map(function(d){return '<option'+(p.div===d?' selected':'')+'>'+esc(d)+'</option>';}).join('')+'</select></div></div>'+
      '<div class="field"><label>Atasan langsung</label><select id="k_boss"><option value="">— tidak ada (puncak) —</option>'+
        DB.people.filter(function(x){return x.id!==id;}).map(function(x){
          return '<option value="'+x.id+'"'+(p.boss===x.id?' selected':'')+'>'+esc(x.name)+'</option>';}).join('')+'</select>'+
        '<div style="font-size:11px;color:var(--muted);margin-top:5px">Atasan menentukan siapa melihat task siapa: '+
        'seorang atasan melihat task seluruh anak buahnya, langsung maupun tidak.</div></div>'+
      '<div class="field"><label>Dari database account</label>'+
        '<div style="font-size:12px;color:var(--muted);line-height:1.7">'+
        'ID Office: <code>'+esc(p.officeUserId||'—')+'</code><br>'+
        'Status: '+(p.tanpaAkses?'<b style="color:var(--danger)">akses modul bd sudah dicabut</b>'
                   :(p.active===false?'akun nonaktif':'aktif, punya akses modul bd'))+
        '</div></div>'+
    '</div>'+
    '<div class="modal-f"><div></div>'+
      '<div style="display:flex;gap:10px"><button class="btn" onclick="closeModal()">Batal</button>'+
      '<button class="btn pri" onclick="APP.simpanOrang(\''+id+'\')">'+ic('check')+'Simpan</button></div></div>');
}
function simpanOrang(id){
  var g=function(x){return document.getElementById(x);};
  var orang=DB.people.find(function(x){return x.id===id;});
  if(!orang) return;
  var boss=g('k_boss').value;
  /* Cegah lingkaran atasan (A atasan B, B atasan A). Tanpa penjagaan ini,
     bawahan() memanggil dirinya tanpa henti dan seluruh halaman membeku —
     bukan pesan error, cuma tab yang mati. */
  if(boss){
    var jalan=boss, langkah=0;
    while(jalan&&langkah++<200){
      if(jalan===id){ toast('Atasan melingkar — orang ini sudah jadi atasan dari kru tersebut.'); return; }
      var nx=DB.people.find(function(x){return x.id===jalan;});
      jalan=nx?nx.boss:'';
    }
  }
  // Hanya tiga field milik BD OS yang ditulis. name/active/tanpaAkses sengaja
  // tidak disentuh — pemiliknya database account.
  orang.role=g('k_role').value.trim();
  orang.div =g('k_div').value;
  orang.boss=boss;
  save(); closeModal(); kenali(); render(); toast('Data kru diperbarui');
}
function hapusOrang(id){
  var dipakai=DB.tasks.filter(function(t){return punyaPic(t,id);}).length
             +DB.projects.filter(function(p){return punyaPic(p,id);}).length
             +DB.po.filter(function(p){return p.pic===id;}).length
             +DB.routines.filter(function(r){return r.pic===id;}).length;
  /* Menghapus kru yang masih memegang pekerjaan membuat barisnya jadi PIC "—"
     yang tidak bisa ditelusuri lagi. Halaman Kru hanya menampilkan tombol ini
     untuk baris yang aksesnya dicabut DAN tidak memegang task aktif, tapi
     pemeriksaannya diulang di sini: yang menghitung task aktif saja bisa
     meloloskan orang yang masih tercatat di project/PO/routine. */
  if(dipakai){
    toast('Tidak bisa dihapus — masih tercatat sebagai PIC di '+dipakai+' baris.');
    return;
  }
  if(!confirm('Hapus '+P(id).name+' dari daftar kru BD?\n\n'+
    'Ini tidak mencabut apa pun di Office. Kalau akses modulnya diberikan lagi, '+
    'barisnya akan muncul kembali saat disegarkan.')) return;
  DB.people=DB.people.filter(function(p){return p.id!==id;});
  DB.people.forEach(function(p){ if(p.boss===id) p.boss=''; });
  save(); closeModal(); kenali(); render(); toast('Kru dihapus dari daftar BD');
}

/* ============ CARI ============
   Pencarian ringan: menyaring apa yang sedang tampil terasa ajaib tapi
   membingungkan (kenapa papan Eisenhower tiba-tiba kosong?). Jadi yang
   dilakukan adalah melompat ke hal yang paling cocok. */
var _cariTimer=null;
function cari(q){
  clearTimeout(_cariTimer);
  _cariTimer=setTimeout(function(){
    q=String(q||'').trim().toLowerCase();
    if(q.length<3) return;
    var p=DB.projects.find(function(x){return String(x.name).toLowerCase().indexOf(q)>-1;});
    if(p){ bukaProject(p.id); return; }
    var t=DB.tasks.find(function(x){return String(x.name).toLowerCase().indexOf(q)>-1;});
    if(t){ taskModal(t.id); return; }
    var o=DB.po.find(function(x){return String(x.item).toLowerCase().indexOf(q)>-1;});
    if(o){ poModal(o.id); return; }
    var c=DB.coord.find(function(x){return String(x.title).toLowerCase().indexOf(q)>-1;});
    if(c){ coordModal(c.id); }
  },420);
}

/* ============ MODAL ============ */
window.closeModal=function(){ $('#overlay').classList.remove('show'); $('#modal').innerHTML=''; };
function showModal(html,lebar){
  $('#modal').className='modal'+(lebar?' wide':'');
  $('#modal').innerHTML=html;
  $('#overlay').classList.add('show');
}
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeModal(); });


/* ============ JEMBATAN KE HTML ============
   Semua onclick di markup memanggil lewat APP.*, jadi seluruh modul tetap di
   dalam IIFE dan tidak menaburkan nama global yang bisa bertabrakan. */
window.APP={
  go:go, cari:cari, qprev:qprev,
  taskModal:function(id,proj){ _presetProject=proj||null; taskModal(id); },
  simpanTask:simpanTask, hapusTask:hapusTask, toggleTask:toggleTask,
  dragTask:dragTask, dropTask:dropTask,
  setTaskMode:function(m){taskMode=m;render();},
  filter:function(apa,nilai){
    if(apa==='reset'){fDiv='';fProj='';fType='';fScope='tim';fPics=[];}
    else if(apa==='div')fDiv=nilai; else if(apa==='proj')fProj=nilai;
    else if(apa==='type')fType=nilai; else if(apa==='scope')fScope=nilai;
    render();
  },
  projModal:projModal, simpanProj:simpanProj, hapusProj:hapusProj,
  togglePic:function(el){ el.classList.toggle('on'); },
  /* Pemformat rupiah sambil mengetik. Posisi kursor dijaga dengan MENGHITUNG
     DIGIT sebelum kursor, bukan menyimpan indeksnya: menyisipkan satu titik
     pemisah menggeser semua indeks di belakangnya, dan kursor yang melompat
     ke ujung tiap ketikan membuat angka mustahil dikoreksi di tengah. */
  fmtRp:function(el){
    var digitSebelum=String(el.value).slice(0,el.selectionStart).replace(/\D/g,'').length;
    var digit=String(el.value).replace(/\D/g,'').replace(/^0+(?=\d)/,'').slice(0,15);
    el.value = digit ? (+digit).toLocaleString('id-ID') : '';
    var i=0,n=0;
    while(i<el.value.length && n<digitSebelum){ if(el.value.charCodeAt(i)>=48&&el.value.charCodeAt(i)<=57) n++; i++; }
    el.selectionStart=el.selectionEnd=i;
  },
  filterProj:function(apa,nilai){
    if(apa==='reset'){ pScope='tim'; pDiv=''; fPics=[]; }
    else if(apa==='scope') pScope=nilai;
    else if(apa==='div')   pDiv=nilai;
    render();
  },
  /* id kosong = lepas semua. Dipakai bersama tiga halaman, jadi cukup satu
     keadaan dan satu penyetel. */
  togglePicFilter:function(id){
    if(!id){ fPics=[]; }
    else{
      var i=fPics.indexOf(id);
      if(i>-1) fPics.splice(i,1); else fPics.push(id);
    }
    render();
  },
  klikCal:klikCal,
  bukaProject:bukaProject, dragProj:dragProj, dropProj:dropProj, toggleMilestone:toggleMilestone,
  coordModal:coordModal, simpanCoord:simpanCoord, hapusCoord:hapusCoord,
  dragCoord:dragCoord, dropCoord:dropCoord, setCoordMode:function(m){coordMode=m;render();},
  routineModal:routineModal, simpanRoutine:simpanRoutine, hapusRoutine:hapusRoutine,
  poModal:poModal, simpanPo:simpanPo, hapusPo:hapusPo, togglePoProses:togglePoProses, setPoFilter:function(v){poFilter=v;render();},
  requestModal:requestModal, simpanRequest:simpanRequest,
  tambahBarisReq:function(){
    document.getElementById('q_rows').insertAdjacentHTML('beforeend',barisRequest());
    nomoriBarisReq();
    var r=document.querySelectorAll('#q_rows tr');
    r[r.length-1].querySelector('.q-item').focus();
  },
  hapusBarisReq:function(btn){
    var tr=btn.closest('tr'), tbody=document.getElementById('q_rows');
    /* Baris terakhir tidak dihapus, cuma dikosongkan — tabel tanpa satu pun
       baris tidak menyisakan apa pun untuk diketik, dan orang harus menebak
       bahwa ada tombol "Tambah baris" di bawahnya. */
    if(tbody.querySelectorAll('tr').length<=1){
      tr.querySelectorAll('input').forEach(function(i){ i.value=(i.className.indexOf('q-qty')>-1)?'1':''; });
      tr.querySelector('.q-unit').value='Unit';

      return;
    }
    tr.remove(); nomoriBarisReq();
  },
  buatPr:buatPr, bukaPr:bukaPr, hapusPr:hapusPr, prModal:prModal, simpanPr:simpanPr,
  /* Centang TIDAK memicu render ulang — halaman yang menggambar ulang dirinya
     tiap centang akan menggulung balik ke atas dan menghapus pilihan yang
     sedang disusun. Yang diperbarui cuma tulisan di tombolnya. */
  hitungPilihPr:function(){
    var semua=document.querySelectorAll('.pick').length;
    var n=document.querySelectorAll('.pick:checked').length;
    var b=document.getElementById('btnBuatPr');
    if(b) b.innerHTML=ic('plus')+(n?'Buat PR dari '+n+' item':'Pilih item dulu');
    /* Kotak di kepala tabel mengikuti isinya: penuh saat semua tercentang,
       setengah (indeterminate) saat sebagian. Kotak kepala yang tetap penuh
       padahal barisnya tinggal separuh memberi tahu hal yang keliru. */
    document.querySelectorAll('.pickall').forEach(function(el){
      el.checked = n>0 && n===semua;
      el.indeterminate = n>0 && n<semua;
    });
  },
  pilihSemuaPr:function(on){
    document.querySelectorAll('.pick').forEach(function(el){ el.checked=!!on; });
    window.APP.hitungPilihPr();
  },
  statusPr:statusPr, setujuPr:setujuPr, lepasDariPr:lepasDariPr, masukkanKePr:masukkanKePr,
  /* Cetak dipanggil setelah satu putaran render selesai. Tanpa jeda, Chrome
     kadang membuka dialog cetak sebelum gambar kop selesai dimuat, dan
     lembarnya tercetak tanpa logo. */
  cetakPr:function(){ setTimeout(function(){ window.print(); }, 120); },
  setPoMode:function(m){poMode=m;render();},
  geserMingguPo:function(n){ poMinggu = n===0 ? 0 : poMinggu+n; render(); },
  pilihMinggu:function(i){ poMinggu=i; render(); },
  agendaModal:agendaModal, simpanAgenda:simpanAgenda, hapusAgenda:hapusAgenda,
  dragCal:dragCal, dropCal:dropCal,
  geserBulan:function(n){calRef=new Date(calRef.getFullYear(),calRef.getMonth()+n,1);render();},
  bulanIni:function(){var d=new Date();calRef=new Date(d.getFullYear(),d.getMonth(),1);render();},
  orangModal:orangModal, simpanOrang:simpanOrang, hapusOrang:hapusOrang,
  segarkanKru:function(){
    toast('Mengambil daftar kru dari Office…');
    sinkronRoster(false).then(function(ok){
      cetakIdentitas(); render();
      if(ok) toast('Daftar kru diperbarui — '+DB.people.filter(function(p){return !p.tanpaAkses;}).length+' kru berakses');
    });
  }
};

/* ============ BOOT ============ */
function cetakIdentitas(){
  var s=sesi()||{};
  var nama=s.name||'Kru';
  $('#su-avatar').textContent=inisial(nama);
  $('#su-un').textContent=nama;
  $('#su-ur').textContent=AKU?((AKU.role||'Kru')+' · '+(AKU.div||'')):'Kru BD OS';
}
function layarGagal(pesan){
  $('#loading').style.display='none';
  $('#app').style.display='';
  /* Identitas tetap dicetak walau server mati: namanya datang dari sesi
     Office di localStorage, bukan dari API. Sidebar yang menampilkan "?" saat
     galat membuat kru mengira sesinya ikut bermasalah — padahal tidak. */
  cetakIdentitas();
  $('#view').innerHTML='<div class="card" style="border-color:var(--danger);max-width:640px;margin:40px auto">'+
    '<div class="card-h"><h3 style="color:var(--danger)">Tidak bisa memuat data</h3></div>'+
    /* Sengaja TIDAK menjanjikan "data kamu aman di database". Penyebab
       tersering layar ini muncul justru saat backend belum terpasang sama
       sekali — belum ada database untuk diamankan, dan janji yang salah
       membuat orang berhenti mencari penyebabnya. */
    '<div class="card-b"><p style="color:var(--muted);line-height:1.6">BD OS tidak bisa bicara dengan '+
    'backendnya, jadi tidak ada yang ditampilkan. Ini kegagalan <b>memuat</b> — tidak ada yang terhapus. '+
    'Pesan di bawah menyebut penyebabnya.</p>'+
    '<div style="margin-top:12px;font-size:12.5px"><div class="stat-l">Alamat API</div>'+
    '<div style="font-family:var(--mono);font-size:12px">'+esc(API_URL)+'</div>'+
    '<div class="stat-l" style="margin-top:8px">Pesan</div><div>'+esc(pesan)+'</div></div>'+
    '<div style="margin-top:16px;display:flex;gap:10px"><button class="btn pri" onclick="location.reload()">'+
    ic('refresh')+'Coba lagi</button><button class="btn" onclick="logout()">Kembali ke Office</button></div>'+
    '</div></div>';
  $('#tbTitle').textContent='Gagal memuat';
  $('#tbSub').textContent='Kesalahan';
}
/* Urutannya penting dan bukan kebetulan:
     1. state BD dari MySQL
     2. roster dari database account  -> baris people lahir di sini
     3. kenali()                      -> AKU sudah bisa ditemukan sebelum
                                         apa pun digambar

   Roster yang GAGAL tidak menghentikan boot — sinkronRoster() menelan
   galatnya dan menyimpannya di ROSTER_PESAN untuk ditampilkan sebagai pita.
   Papan kerja yang mogok total gara-gara layanan lain sedang batuk lebih
   merugikan daripada daftar kru yang ketinggalan sehari. */
apiGet('getAll').then(function(s){
  DB=normalize(s);
  return sinkronRoster(true);
}).then(function(){
  segarkanSnapshot();
  kenali();
  cetakIdentitas();
  // Halaman awal dari alamat (#purchasing dari Marketing, bookmark, dst).
  var awal=bacaAlamat(); if(awal) view=awal;
  $('#loading').style.display='none';
  $('#app').style.display='';
  render();
},function(e){ layarGagal(e.message||String(e)); });

})();
</script>
