/* =====================================================================
   HALAMAN — KALENDER TAMU
   Pertanyaan yang dijawab halaman ini cuma satu, dan tidak dijawab di mana
   pun lagi di modul ini: "hari mana yang ramai, dan sudah cukup belum daily
   worker-nya?" Jumlah tamu ada di Marketing dan Event; jumlah DW ada di
   sini. Selama keduanya di dua layar berbeda, HR memutuskan sambil mengingat
   angka — dan yang terjadi berulang kali adalah DW baru dicari H-1 saat
   ketahuan acaranya 300 pax.

   Kotak harinya bisa diklik: langsung mengajukan DW untuk hari itu, sama
   seperti mengklik sel di Jadwal Shift. Itu inti halaman ini — melihat
   ramainya dan menindaklanjutinya tidak boleh dipisah dua halaman.
   ===================================================================== */
function ajuanHidupTgl(iso){
  /* DITOLAK dan BATAL tidak dihitung: keduanya berarti orangnya TIDAK jadi
     datang, dan menghitungnya membuat hari yang sebenarnya kosong terlihat
     sudah terisi — persis kesalahan yang paling mahal di halaman ini. */
  return (S.ajuan||[]).filter(x=>x.tgl===iso && (x.status==='DISETUJUI'||x.status==='MENUNGGU'));
}
function viewTamu(){
  const mk=BULAN_AKTIF||bulanDari(hariIni());
  const a=awalBulan(mk), z=akhirBulan(mk), ini=hariIni();
  const mulai=seninDari(a);

  const pita=TAMU_ERR
    ? '<div class="note w">Agenda belum lengkap — '+esc(TAMU_ERR)+'. Angka pax di bawah hanya dari sumber yang berhasil dihubungi. '
      +'<button class="btn btn-ghost btn-sm" style="margin-left:6px" onclick="muatTamuDanGambar(true)">Coba lagi</button></div>'
    : '';

  /* Puncak bulan ini dipakai sebagai patokan tiga tingkat keramaian. Dihitung
     dari bulan yang SEDANG DILIHAT, bukan sepanjang data: bulan sepi pun tetap
     punya hari tersibuknya sendiri, dan itulah yang perlu ditandai. */
  let puncak=0;
  for(let d=a; d<=z; d=addD(d,1)) puncak=Math.max(puncak, paxTgl(d));

  let kisi='<div class="kt">';
  HARI.forEach(function(h,i){ kisi+='<div class="kh'+(i>=5?' wknd':'')+'">'+esc(h.slice(0,3))+'</div>'; });
  for(let i=0;i<42;i++){
    const iso=addD(mulai,i);
    const luar=(iso<a||iso>z);
    const ags=tamuTgl(iso);
    const pax=ags.reduce((n,x)=>n+(+x.pax||0),0);
    const hidup=ajuanHidupTgl(iso);
    const setuju=hidup.filter(x=>x.status==='DISETUJUI').length;
    const tunggu=hidup.length-setuju;

    const tk = (!pax||!puncak) ? '' : (pax>=puncak*.66 ? 'p3' : (pax>=puncak*.33 ? 'p2' : 'p1'));
    const judul=[tglPanjang(iso)];
    if(pax) judul.push(pax+' pax dari '+ags.length+' acara');
    if(hidup.length) judul.push(setuju+' DW disetujui'+(tunggu?', '+tunggu+' menunggu':''));
    judul.push('Klik untuk mengajukan daily worker hari ini');

    kisi+='<button type="button" class="kd'+(luar?' luar':'')+(iso===ini?' ini':'')+'" '
      +'onclick="ajukanTgl(\''+iso+'\')" title="'+esc(judul.join(' · '))+'">'
      +'<div class="n">'+parseD(iso).getDate()
        +(iso===ini?'<em>hari ini</em>':(idxHari(iso)>=5?'<em class="wknd">'+esc(HARI[idxHari(iso)].slice(0,3))+'</em>':''))+'</div>'
      +(pax?'<span class="pax '+tk+'">'+pax+' pax</span>':'');
    ags.slice(0,2).forEach(function(x){
      kisi+='<div class="ev'+(x.sumber==='evt'?' evt':'')+'">'+esc(x.judul)+'</div>';
    });
    if(ags.length>2) kisi+='<div class="lagi">+'+(ags.length-2)+' acara lagi</div>';
    /* Baris paling bawah selalu ada isinya kalau harinya ramai — termasuk saat
       DW-nya nol, karena justru itu yang perlu terbaca dari jauh. */
    if(hidup.length) kisi+='<div class="dwc"><b>'+setuju+' DW</b>'+(tunggu?' · '+tunggu+' menunggu':'')+'</div>';
    else if(pax)     kisi+='<div class="dwc perlu">belum ada DW</div>';
    kisi+='</button>';
  }
  kisi+='</div>';

  const agBulan=TAMU.filter(x=>x.tgl>=a&&x.tgl<=z);
  const paxBulan=agBulan.reduce((n,x)=>n+(+x.pax||0),0);
  let hariRamai=0, hariTanpaDW=0;
  for(let d=a; d<=z; d=addD(d,1)){
    const p=paxTgl(d); if(!p) continue;
    hariRamai++;
    if(!ajuanHidupTgl(d).filter(x=>x.status==='DISETUJUI').length) hariTanpaDW++;
  }

  const memuat = (!TAMU_ADA && !TAMU_ERR)
    ? '<div class="note i">Menarik agenda dari Marketing & Event…</div>' : '';

  return '<div class="panel">'
    +'<div class="rowbar"><div class="legend">'
      +'<span class="chip"><span class="sw" style="background:var(--gold-2)"></span>Marketing</span>'
      +'<span class="chip"><span class="sw" style="background:#7C6BD6"></span>Event</span>'
    +'</div><div class="spacer"></div>'
    +'<div class="navdate noprint"><button class="iconbtn" onclick="geserBulanAktif(-1)" aria-label="Bulan sebelumnya">‹</button>'
    +'<b>'+esc(labelBulan(mk))+'</b>'
    +'<button class="iconbtn" onclick="geserBulanAktif(1)" aria-label="Bulan berikutnya">›</button>'
    +tombolKembali('bulanIni', mk===bulanDari(hariIni()), 'Kembali ke bulan ini')
    +'<button class="btn btn-ghost btn-sm" onclick="muatTamuDanGambar(true)" title="Ambil ulang agenda dari Marketing & Event">↻ Muat ulang</button>'
    +'</div></div>'
    +memuat+pita
    +'<div class="stats">'
      +statBox(paxBulan,'Total Pax')
      +statBox(agBulan.length,'Acara')
      +statBox(hariRamai,'Hari Ada Tamu')
      +statBox(hariTanpaDW,'Hari Tanpa DW')
    +'</div>'
    +kisi
    +'<p class="mutedhint" style="margin-top:12px">Angka pax dibaca langsung dari modul <b>Marketing</b> dan <b>Event</b> — '
    +'hanya acara yang statusnya sudah pasti jalan. Warna kotak menunjukkan ramainya <b>dibanding hari lain di bulan ini</b>, '
    +'bukan ambang tetap. Klik hari mana pun untuk mengajukan daily worker di hari itu.</p>'
    +'</div>';
}

/* ---------- Ajukan DW langsung dari kotak kalender ----------
   Bukan melompat ke halaman Ajukan Jadwal: yang sedang dikerjakan HR adalah
   membaca kalender, dan pindah halaman berarti kehilangan konteks hari yang
   baru saja ia lihat ramainya. Modal ini membawa konteks itu ikut — pax hari
   itu, acara apa saja, dan siapa yang sudah dijadwalkan — lalu tetap TERBUKA
   setelah mengirim, karena hari ramai hampir tidak pernah butuh cuma satu
   orang. */
let AJT=null;   // {tgl,dw,div,pos,m,s,cat}
function ajukanTgl(tgl){
  if(!isOffice()){ toast('Halaman ini untuk staf Office'); return; }
  const jam=S.setting.jam||[];
  const lama=AJT||{};
  /* Divisi, posisi, dan jam DIPERTAHANKAN dari pengisian sebelumnya — HR yang
     memasukkan lima DW untuk malam Sabtu memilih jam yang sama lima kali.
     Nama dan catatan selalu dikosongkan: itu yang berbeda tiap orang. */
  AJT={
    tgl:tgl, dw:'', cat:'',
    div:lama.div||DIVISI[0].k,
    pos:lama.pos||(S.setting.posisi||POSISI_BAWAAN)[0],
    m:lama.m||(jam[0]?jam[0].m:'16:00'),
    s:lama.s||(jam[0]?jam[0].s:'23:00')
  };
  gambarAjukanTgl();
}
/* Serap isian ke state sebelum apa pun yang menggambar ulang — jebakan yang
   sama dengan form Ajukan Jadwal (lihat serapAjukan). */
function serapAjukanTgl(){
  if(!AJT) return;
  const el=x=>document.getElementById(x);
  if(el('ajtDw'))  AJT.dw =el('ajtDw').value;
  if(el('ajtDiv')) AJT.div=el('ajtDiv').value;
  if(el('ajtPos')) AJT.pos=el('ajtPos').value;
  if(el('ajtM'))   AJT.m  =el('ajtM').value;
  if(el('ajtS'))   AJT.s  =el('ajtS').value;
  if(el('ajtCat')) AJT.cat=el('ajtCat').value;
}
function ajtJam(i){
  const j=(S.setting.jam||[])[i]; if(!j||!AJT) return;
  serapAjukanTgl(); AJT.m=j.m; AJT.s=j.s; gambarAjukanTgl();
}
function gambarAjukanTgl(){
  const b=AJT; if(!b) return;
  const ags=tamuTgl(b.tgl);
  const pax=ags.reduce((n,x)=>n+(+x.pax||0),0);
  const jam=S.setting.jam||[];
  const posisi=S.setting.posisi||POSISI_BAWAAN;

  const daftarAcara = ags.length
    ? ags.map(function(x){
        return '<div class="row"><div class="who"><b>'+esc(x.judul)+'</b><span>'
          +esc((x.sumber==='mkt'?'Marketing':'Event')+(x.jam?' · '+x.jam:'')
              +(x.tempat?' · '+x.tempat:'')+(x.fb?' · '+x.fb:''))+'</span></div>'
          +'<div class="chip">'+(+x.pax||0)+' pax</div></div>';
      }).join('')
    : '<p class="mutedhint">Tidak ada acara terjadwal di Marketing maupun Event pada hari ini.</p>';

  /* Yang sudah ada di hari itu, DIPECAH PER DIVISI. Yang ditulis adalah
     JUMLAH ORANGNYA, bukan "0/2" terhadap kuota: bentuk pecahan itu terbaca
     sebagai target yang harus dipenuhi, padahal kuota di modul ini cuma
     ambang peringatan — dan yang benar-benar ingin diketahui saat menambah
     orang adalah "sekarang sudah berapa di Bar". Divisi yang kosong tidak
     ditulis sama sekali supaya barisnya tidak jadi deretan nol.

     Yang masih MENUNGGU tetap dihitung — orangnya memang sudah dipesan — tapi
     disebut terpisah, karena ajuan yang belum disetujui bukan lubang yang
     sudah tertutup. */
  const hidup=ajuanHidupTgl(b.tgl);
  const perDiv=DIVISI.map(function(d){
    const orang=hidup.filter(x=>x.divisi===d.k);
    if(!orang.length) return '';
    const t=orang.filter(x=>x.status==='MENUNGGU').length;
    return '<span class="chip" title="'+esc(orang.map(x=>namaDW(x.dwId)+' ('+jamAjuan(x)+')').join(', '))+'">'
      +d.ic+' <b>'+orang.length+'</b> '+esc(d.n)
      +(t?'<em style="font-style:normal;color:var(--warn)"> · '+t+' menunggu</em>':'')+'</span>';
  }).filter(Boolean).join('');

  const isi=
     '<div class="rowbar"><span class="chip"><b>'+pax+' pax</b></span>'
      +'<span class="chip">'+ags.length+' acara</span>'
      +'<span class="chip">'+(hidup.length?hidup.length+' DW di hari ini':'belum ada DW')+'</span></div>'
    +daftarAcara
    +(perDiv?'<div class="rowbar" style="margin-top:8px">'+perDiv+'</div>':'')
    +'<p class="mutedhint" style="margin:8px 0 0">'+esc(panduanTeks(b.tgl))+'</p>'
    +(TAMU_ERR?'<div class="note w">Agenda belum lengkap — '+esc(TAMU_ERR)+'.</div>':'')
    /* Tanggal yang sudah lewat TIDAK dilarang — ajuan susulan untuk orang
       yang terlanjur dipanggil kemarin adalah hal yang wajar dan justru perlu
       tercatat. Cukup diberi tahu, supaya salah klik tanggal tetap kelihatan. */
    +(b.tgl<hariIni()?'<div class="note w">Tanggal ini sudah lewat. Boleh saja — ajuan susulan tetap tercatat seperti biasa.</div>':'')
    +'<hr style="border:none;border-top:1px solid var(--line);margin:14px 0">'
    /* Yang sudah punya ajuan hari itu DITANDAI di daftarnya, bukan cuma
       ditegur setelah tombol kirim ditekan. Nama yang sama dipilih dua kali
       adalah kesalahan yang paling gampang terjadi saat memasukkan lima orang
       berturut-turut, dan mencegahnya di daftar jauh lebih murah daripada
       menjelaskannya di kotak peringatan. */
    +'<div class="field"><label>Daily Worker *</label><select id="ajtDw">'
      +'<option value="">— pilih daily worker —</option>'
      +(S.pekerja||[]).filter(p=>p.status==='AKTIF')
        .map(function(p){
          const ada=ajuanOrangTgl(p.id, b.tgl);
          return '<option value="'+esc(p.id)+'"'+(b.dw===p.id?' selected':'')+'>'
            +esc(p.nama)+' · '+esc(namaDivisi(p.divisi))
            +(ada?' — sudah ada ('+esc(STATUS_AJU[ada.status]||ada.status)+')':'')+'</option>';
        }).join('')
      +'</select></div>'
    +(jam.length?'<label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px">Jam siap pakai</label>'
      +'<div class="pick">'+tombolJam(b.m,b.s,'ajtJam')+'</div>':'')
    +'<div class="duo">'
      +'<div class="field"><label>Jam mulai *</label><input id="ajtM" type="time" value="'+esc(b.m)+'"></div>'
      +'<div class="field"><label>Jam selesai *</label><input id="ajtS" type="time" value="'+esc(b.s)+'"></div>'
    +'</div>'
    +'<div class="duo">'
      +'<div class="field"><label>Divisi</label><select id="ajtDiv">'
        +DIVISI.map(d=>'<option value="'+d.k+'"'+(b.div===d.k?' selected':'')+'>'+d.ic+' '+esc(d.n)+'</option>').join('')
      +'</select></div>'
      +'<div class="field"><label>Posisi</label><select id="ajtPos">'
        +posisi.map(p=>'<option'+(b.pos===p?' selected':'')+'>'+esc(p)+'</option>').join('')
      +'</select></div>'
    +'</div>'
    +'<div class="field"><label>Catatan untuk HR</label><textarea id="ajtCat" placeholder="Mis. dipanggil karena acara 300 pax">'+esc(b.cat)+'</textarea></div>'
    +'<p class="mutedhint">Ajuan yang dibuat dari sini langsung masuk antrean seperti biasa. '
    +'Modal tetap terbuka setelah dikirim supaya bisa menambah orang berikutnya untuk hari yang sama.</p>';

  modal('Ajukan DW — '+esc(tglPanjang(b.tgl)), isi,
    [{t:'Kirim Ajuan', c:'btn-primary', f:function(){ kirimAjukanTgl(); return false; }}], true);
}
async function kirimAjukanTgl(){
  const b=AJT; if(!b) return;
  serapAjukanTgl();
  /* Panduan diperiksa SEBELUM dikirim, bukan sesudah. Yang dihitung di sini
     termasuk yang masih menunggu: orangnya sudah dipesan, dan menambah orang
     keenam ke hari berpanduan empat tetap keputusan yang layak ditanyakan
     sekali walau belum satu pun disetujui. */
  /* Orang yang sama, tanggal yang sama → menimpa ajuan lama. Ditanya lebih
     dulu, dan kalimatnya menyebut akibat yang paling mudah terlewat: yang
     sudah DISETUJUI turun lagi jadi menunggu. */
  const sudahAda=(b.dw && b.tgl) ? ajuanOrangTgl(b.dw, b.tgl) : null;
  if(sudahAda && !b.lanjutkanTimpa){
    modal('Sudah ada ajuan untuk '+esc(namaDW(b.dw)),
      '<p style="font-size:13.5px;color:var(--muted)">'+esc(namaDW(b.dw))+' sudah punya ajuan '
      +esc(tglPanjang(b.tgl))+' ('+esc(jamAjuan(sudahAda))+' · '+esc(STATUS_AJU[sudahAda.status]||sudahAda.status)+'). '
      +'Mengirim lagi <b>mengganti</b> ajuan itu, bukan menambah orang.'
      +(sudahAda.status==='DISETUJUI'?' Statusnya akan <b>kembali menunggu</b> dan perlu disetujui ulang.':'')+'</p>',
      [{t:'Kembali ke form', c:'btn-ghost', f:function(){ gambarAjukanTgl(); return false; }},
       {t:'Ya, ganti ajuannya', c:'btn-danger', f:function(){ b.lanjutkanTimpa=true; kirimAjukanTgl(); return false; }}]);
    return;
  }
  b.lanjutkanTimpa=false;
  const l=(b.dw && b.tgl) ? lampauiPanduan(b.tgl, b.div, ['DISETUJUI','MENUNGGU'], '') : null;
  if(l && !b.lanjutkanLebih){
    /* Dipasang dengan modal() dan bukan konfirmasi(), supaya "Batal" bisa
       MENGEMBALIKAN form yang sudah diisi. konfirmasi() cuma menutup — dan
       isian yang lenyap gara-gara satu peringatan adalah cara tercepat
       membuat orang berhenti membaca peringatannya. */
    modal('Lebih dari panduan '+esc(namaDivisi(l.div))+'?',
      '<p style="font-size:13.5px;color:var(--muted)">'
      +esc(KONTEKS_LBL[l.konteks]+' '+tglPanjang(l.tgl))+': panduan <b>'+esc(namaDivisi(l.div))+' '+l.kuota+' orang</b>, '
      +'sudah ada '+l.kini+' (termasuk yang masih menunggu). Dengan ini jadi <b>'+l.jadi+'</b>.</p>'
      +'<p class="mutedhint">Bukan larangan — lanjutkan saja kalau memang perlu. '
      +'Angkanya diatur di Pengaturan → Panduan jumlah DW.</p>',
      [{t:'Kembali ke form', c:'btn-ghost', f:function(){ gambarAjukanTgl(); return false; }},
       {t:'Ya, tetap ajukan', c:'btn-primary', f:function(){ b.lanjutkanLebih=true; kirimAjukanTgl(); return false; }}]);
    return;
  }
  b.lanjutkanLebih=false;
  const ok=await simpanAjuanRow({dwId:b.dw, tgl:b.tgl, m:b.m, s:b.s,
    divisi:b.div, posisi:b.pos, catatan:b.cat});
  if(!ok) return;
  toast(namaDW(b.dw)+' diajukan untuk '+tglManusia(b.tgl));
  b.dw=''; b.cat='';
  await muatData(true);
  /* Gambar ulang KEDUANYA: kotak kalender di belakang modal harus ikut
     bertambah hitungan DW-nya, kalau tidak angkanya berbohong sampai halaman
     dibuka ulang. */
  render();
  gambarAjukanTgl();
}

/* =====================================================================
   HALAMAN — AJUKAN JADWAL
   Dipakai dua pihak: daily worker untuk dirinya sendiri, dan staf Office
   yang mengisikan atas nama DW yang menelepon. Bedanya hanya pemilih nama.
   ===================================================================== */
/* SELURUH isian form disimpan di state, bukan hanya dibaca dari DOM saat
   kirim. Sebelumnya hanya sebagian yang disimpan, dan `pilihJam()` cuma
   menyetel nilai <input> tanpa menyentuh state — jadi begitu halaman digambar
   ulang, jamnya kembali ke bawaan. Halaman ini digambar ulang SENDIRI di dua
   keadaan yang sering terjadi: saat muatData() pertama selesai (beberapa detik
   setelah dibuka) dan tiap kali tab kembali aktif. Gejalanya persis seperti
   yang dilaporkan — "tombol jam siap pakai tidak bisa": tombolnya bekerja,
   hasilnya yang dihapus render berikutnya. */
let AJU_TGL='', AJU_M='', AJU_S='', AJU_DW='', AJU_DIV='', AJU_POS='', AJU_CAT='';
/* Serap isi form ke state SEBELUM apa pun yang menggambar ulang. Dipanggil
   dari pilihJam() dan kirimAjuan(). */
function serapAjukan(){
  const el=x=>document.getElementById(x);
  if(el('ajTgl')) AJU_TGL=el('ajTgl').value;
  if(el('ajM'))   AJU_M  =el('ajM').value;
  if(el('ajS'))   AJU_S  =el('ajS').value;
  if(el('ajDw'))  AJU_DW =el('ajDw').value;
  if(el('ajDiv')) AJU_DIV=el('ajDiv').value;
  if(el('ajPos')) AJU_POS=el('ajPos').value;
  if(el('ajCat')) AJU_CAT=el('ajCat').value;
}
function viewAjukan(){
  const t=AJU_TGL||hariIni();
  const jam=S.setting.jam||[];
  const posisi=S.setting.posisi||POSISI_BAWAAN;
  /* Nilai yang BENAR-BENAR dipakai untuk menggambar: state kalau sudah pernah
     diisi, kalau belum baru jatuh ke bawaan. Sebelumnya divisi/posisi/catatan
     selalu digambar dari bawaan, jadi render apa pun di tengah pengisian
     mengembalikannya diam-diam. */
  const mSekarang  = AJU_M   || (jam[0]?jam[0].m:'16:00');
  const sSekarang  = AJU_S   || (jam[0]?jam[0].s:'23:00');
  const divSekarang= AJU_DIV || (isDW()?MEDW.divisi:'');
  const posSekarang= AJU_POS || (isDW()?MEDW.posisi:'');

  const siapa = isDW()
    ? '<div class="field"><label>Daily Worker</label><input class="inp" style="width:100%" value="'+esc(MEDW.nama)+'" disabled></div>'
    : '<div class="field"><label>Daily Worker *</label><select id="ajDw">'
        +'<option value="">— pilih daily worker —</option>'
        +(S.pekerja||[]).filter(p=>p.status==='AKTIF')
          .map(p=>'<option value="'+esc(p.id)+'"'+(AJU_DW===p.id?' selected':'')+'>'+esc(p.nama)+' · '+esc(namaDivisi(p.divisi))+'</option>').join('')
        +'</select><div class="hint">Yang berstatus Blokir / Tidak Aktif sengaja tidak ada di daftar ini.</div></div>';

  /* Ajuan milik sendiri yang akan datang — supaya DW melihat apa yang sudah
     ia kirim tanpa pindah halaman, dan tidak mengirim ulang tanggal yang
     sama karena mengira gagal. */
  const akuId = isDW()?MEDW.id:AJU_DW;
  const nanti=(S.ajuan||[]).filter(a=>a.dwId===akuId && a.tgl>=hariIni() && a.status!=='BATAL')
    .sort((a,b)=>a.tgl.localeCompare(b.tgl));

  return '<div class="panel">'
    /* Jalan pulang untuk staf Office. Halaman ini tidak lagi punya baris di
       sidebar (dibuka dari tombol di Antrean), jadi tanpa tombol ini ia jadi
       jalan buntu: satu-satunya cara kembali adalah menebak menu mana yang
       tadi ditinggalkan. DW tidak butuh — baginya halaman ini memang
       halaman utamanya. */
    +'<div class="rowbar"><h2>Ajukan tanggal kerja</h2><div class="spacer"></div>'
    +(isOffice()?'<button class="btn btn-ghost btn-sm" onclick="go(\'antrean\')">↩ Kembali ke Antrean</button>':'')
    +'</div>'
    +'<div class="note i">Ajuan masuk ke antrean HR. Begitu <b>disetujui</b>, nama Anda otomatis muncul di kalender Jadwal Shift hari itu — tidak perlu mengabari siapa pun lagi.</div>'
    +siapa
    +'<div class="field"><label>Tanggal kerja *</label>'
      /* Tanpa `min`: tidak ada tanggal yang dikunci, termasuk hari ini dan
         hari yang sudah lewat. Lihat alasannya di normalSetting(). */
      +'<input id="ajTgl" class="inp" style="width:100%" type="date" value="'+esc(t)+'">'
      +'<div class="hint">Boleh untuk hari ini juga, bahkan untuk tanggal yang sudah lewat kalau ini ajuan susulan.</div></div>'
    +'<label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px">Jam siap pakai</label>'
    /* Tombol yang sedang terpakai ditandai. Tanpa penanda, satu-satunya bukti
       kliknya berhasil adalah dua kotak jam di bawahnya — dan di layar HP
       keduanya sering di luar pandangan saat tombolnya ditekan, sehingga
       terasa seperti tidak terjadi apa-apa. */
    +'<div class="pick">'+tombolJam(mSekarang,sSekarang,'pilihJam')+'</div>'
    +'<div class="duo">'
      +'<div class="field"><label>Jam mulai *</label><input id="ajM" type="time" value="'+esc(mSekarang)+'"></div>'
      +'<div class="field"><label>Jam selesai *</label><input id="ajS" type="time" value="'+esc(sSekarang)+'"></div>'
    +'</div>'
    +'<div class="duo">'
      +'<div class="field"><label>Divisi</label><select id="ajDiv">'
        +DIVISI.map(d=>'<option value="'+d.k+'"'+(divSekarang===d.k?' selected':'')+'>'+d.ic+' '+esc(d.n)+'</option>').join('')
      +'</select></div>'
      +'<div class="field"><label>Posisi</label><select id="ajPos">'
        +posisi.map(p=>'<option'+(posSekarang===p?' selected':'')+'>'+esc(p)+'</option>').join('')
      +'</select></div>'
    +'</div>'
    +'<div class="field"><label>Catatan untuk HR</label><textarea id="ajCat" placeholder="Mis. bisa datang lebih awal, atau minta pulang tepat waktu karena kuliah">'+esc(AJU_CAT)+'</textarea></div>'
    +'<button class="btn btn-primary btn-block" onclick="kirimAjuan()">Kirim Ajuan</button>'
    +'<p class="mutedhint" style="margin-top:10px">Satu orang hanya bisa punya <b>satu</b> ajuan per tanggal. Mengirim ulang untuk tanggal yang sama akan <b>mengganti</b> ajuan lama dan statusnya kembali menunggu HR.</p>'
    +'</div>'
    +(nanti.length?'<div class="panel"><div class="rowbar"><h2>Ajuan yang akan datang</h2></div>'
      +nanti.map(a=>barisAjuan(a,{tanggal:true, aksi:(a.status==='MENUNGGU'||a.status==='DISETUJUI')
        ?'<button class="btn btn-ghost btn-sm" onclick="batalkanAjuan(\''+escJs(a.id)+'\')">Batalkan</button>':''})).join('')
      +'</div>':'');
}
function pilihJam(i){
  const j=(S.setting.jam||[])[i]; if(!j) return;
  /* Serap dulu isian lain, baru ubah jamnya, baru gambar ulang. Menulis
     langsung ke <input> saja TIDAK cukup: render berikutnya menggambar dari
     state, dan pilihan yang tidak pernah masuk state akan hilang tanpa jejak. */
  serapAjukan();
  AJU_M=j.m; AJU_S=j.s;
  render();
}
/* SATU jalur penulisan ajuan untuk DUA pintu: form halaman Ajukan Jadwal dan
   modal cepat di Kalender Tamu. Aturan yang menahan kesalahan — wajib pilih
   orang dan wajib jam — tidak boleh hidup di dua
   tempat: pintu yang lupa memeriksanya akan mengirim ajuan yang ditolak
   backend dengan pesan yang jauh lebih membingungkan.
   Mengembalikan true kalau benar-benar tersimpan. */
/* Ajuan yang sudah ada untuk orang + tanggal yang sama. Backend memakai kunci
   unik (dw_id, tgl) dan MENIMPA lewat ON DUPLICATE KEY — barisnya kembali
   MENUNGGU, jejak putusannya dihapus. Itu benar sebagai perilaku, tapi
   berbahaya kalau terjadi tanpa disadari: HR yang memasukkan lima orang untuk
   malam Sabtu lalu salah memilih nama yang sama dua kali TIDAK melihat
   jumlahnya bertambah — yang terjadi justru shift yang tadi sudah disetujui
   turun lagi jadi menunggu, dan tidak ada satu pun pesan yang menyebutkannya.

   Yang dianggap "sudah ada" hanya ajuan yang MASIH HIDUP (menunggu atau
   disetujui). Yang DITOLAK dan DIBATALKAN sengaja tidak dihitung: menimpanya
   justru yang diinginkan — HR berubah pikiran, dan menanyakan konfirmasi
   untuk baris yang memang sudah mati cuma melatih orang menekan lanjut. */
function ajuanOrangTgl(dwId,tgl){
  return (S.ajuan||[]).find(a=>a.dwId===dwId && a.tgl===tgl
    && (a.status==='MENUNGGU' || a.status==='DISETUJUI')) || null;
}
async function simpanAjuanRow(row){
  if(!row.dwId){ toast('Pilih daily worker dulu', true); return false; }
  if(!row.tgl){ toast('Tanggal kerja wajib diisi', true); return false; }
  if(!row.m||!row.s){ toast('Jam mulai dan jam selesai wajib diisi', true); return false; }
  try{
    await apiPost({action:'simpanAjuan', row:row});
    return true;
  }catch(e){
    toast('Gagal mengirim: '+e.message, true);
    return false;
  }
}
async function kirimAjuan(){
  /* Serap SELURUH isian ke state lebih dulu. Kalau kirimannya gagal, form
     digambar ulang dari state — dan tanpa langkah ini semua yang baru saja
     diketik lenyap tepat pada saat orangnya paling kesal. */
  serapAjukan();
  const dwId = isDW() ? MEDW.id : AJU_DW;
  const tgl=AJU_TGL;
  const ok=await simpanAjuanRow({dwId, tgl, m:AJU_M, s:AJU_S,
    divisi:AJU_DIV, posisi:AJU_POS, catatan:AJU_CAT});
  if(!ok) return;
  toast('Ajuan '+tglManusia(tgl)+' terkirim — menunggu HR');
  /* Hanya tanggal & catatan yang dikosongkan. Jam, divisi, dan posisi
     sengaja DIPERTAHANKAN: HR yang memasukkan lima DW untuk malam Sabtu
     memilih jam yang sama lima kali, dan mengulang tiga isian itu tiap
     orang adalah alasan paling umum orang kembali mencatat di kertas. */
  AJU_TGL=''; AJU_CAT='';
  await muatData(true); render();
}
function batalkanAjuan(id){
  const a=(S.ajuan||[]).find(x=>x.id===id); if(!a) return;
  konfirmasi('Batalkan ajuan '+tglManusia(a.tgl)+'?',
    'Kalau sudah disetujui, nama Anda akan hilang dari kalender Jadwal Shift hari itu.',
    async function(){
      try{
        await apiPost({action:'putusAjuan', id, status:'BATAL', nota:'Dibatalkan oleh '+namaSaya()});
        toast('Ajuan dibatalkan');
        await muatData(true); render();
      }catch(e){ toast('Gagal membatalkan: '+e.message, true); }
    });
}

/* =====================================================================
   HALAMAN — AJUAN SAYA (daily worker)
   ===================================================================== */
function viewSaya(){
  const akuId = isDW()?MEDW.id:'';
  const mine=(S.ajuan||[]).filter(a=>a.dwId===akuId).sort((a,b)=>b.tgl.localeCompare(a.tgl));
  if(!isDW()){

function statistikDW(id){
  const mine=(S.ajuan||[]).filter(a=>a.dwId===id);
  const kerja=mine.filter(a=>a.status==='DISETUJUI');
  return {
    total:kerja.length,
    jam:Math.round(kerja.reduce((n,a)=>n+durasiJam(a.m,a.s),0)*10)/10,
    menunggu:mine.filter(a=>a.status==='MENUNGGU').length
  };
}

/* =====================================================================
   HALAMAN — PEMBAYARAN MINGGUAN

   Pertanyaan yang dijawab: "minggu ini si A masuk berapa kali, dan berapa
   yang harus ditransfer?" — dan sesudah itu, pertanyaan yang sebenarnya
   memakan waktu: "berapa kali saya harus buka m-banking?"

   Karena itu ada DUA tampilan atas data yang sama:
     Per orang    — untuk mencocokkan dengan orangnya kalau ia bertanya.
     Per tujuan   — untuk mengerjakan transfernya. Tiga DW yang nomor
                    tujuannya sama digabung jadi satu baris, satu jumlah,
                    sekali transfer. Inilah alasan nomor rekening dipecah
                    jadi kolom sendiri (lihat BAYAR di atas): selama ia teks
                    bebas, "BCA 1234" dan "bca-1234" adalah dua tujuan
                    berbeda bagi komputer dan satu tujuan bagi manusia.

   Yang dihitung hanya ajuan DISETUJUI. Yang masih menunggu belum tentu
   jadi, dan memasukkannya ke daftar transfer berarti uang keluar untuk
   orang yang mungkin tidak pernah datang.
   ===================================================================== */
let BAYAR_MINGGU='';          // tanggal Senin, '' = minggu berjalan
let BAYAR_FILTER='ALL';       // ALL | BANK | GOPAY | DANA
let BAYAR_GABUNG=true;        // true = per tujuan transfer, false = per orang

function bayarSenin(){ return BAYAR_MINGGU||seninDari(hariIni()); }
function bayarGeser(n){ BAYAR_MINGGU=addD(bayarSenin(), n*7); muatDanGambar(); }
function bayarMingguIni(){ BAYAR_MINGGU=seninDari(hariIni()); muatDanGambar(); }
function bayarFilter(k){ BAYAR_FILTER=k; render(); }
function bayarGabung(v){ BAYAR_GABUNG=!!v; render(); }

/* Kunci penggabungan: jenis + nomor, dengan nomor dibersihkan dari spasi,
   titik, dan tanda hubung. "1234 5678" dan "1234-5678" adalah rekening yang
   sama, dan kalau dibiarkan beda ia menghasilkan dua transfer ke tempat yang
   persis sama — persis kebalikan dari gunanya halaman ini.
   Yang belum punya nomor tujuan TIDAK digabung dengan siapa pun; masing-masing
   berdiri sendiri supaya kelihatan bahwa datanya memang belum lengkap. */
function kunciBayar(p, dwId){
  const nomor=String(p&&p.bayarNomor||'').replace(/[\s.\-]/g,'');
  /* Yang belum punya nomor berdiri sendiri-sendiri. Kuncinya memakai id
     orangnya (dwId), BUKAN p.id — kalau ia sudah dihapus dari talent pool,
     `p` bernilai null dan semua yang null akan menyatu jadi SATU baris
     transfer berisi beberapa orang yang tidak ada hubungannya. */
  if(!nomor) return 'KOSONG|'+(dwId||(p?p.id:''));
  return bayarJenisSah(p.bayarJenis)+'|'+nomor.toLowerCase();
}
/* Rekap satu minggu: {uid → {p, kali, jam, total}} */
function rekapBayar(senin){
  const hari=[]; for(let i=0;i<7;i++) hari.push(addD(senin,i));
  const dari=hari[0], sampai=hari[6];
  const peta={};
  (S.ajuan||[]).forEach(function(a){
    if(a.status!=='DISETUJUI') return;
    if(a.tgl<dari || a.tgl>sampai) return;
    const p=pekerjaById(a.dwId);
    const k=a.dwId;
    if(!peta[k]) peta[k]={id:k, p:p, nama:namaDW(k), kali:0, jam:0, total:0, tgl:[]};
    peta[k].kali++;
    peta[k].jam+=durasiJam(a.m,a.s);
    peta[k].total+=biayaAjuan(a);
    peta[k].tgl.push(a.tgl);
  });
  return Object.keys(peta).map(k=>peta[k])
    .sort((x,y)=>String(x.nama).localeCompare(String(y.nama)));
}
function labelTujuan(p){
  if(!p) return 'Data DW terhapus';
  const j=BAYAR[bayarJenisSah(p.bayarJenis)];
  if(!p.bayarNomor) return j.ic+' '+j.n+' — nomor belum diisi';
  return j.ic+' '+j.n+' '+p.bayarNomor+(p.bayarNama?' a.n. '+p.bayarNama:' a.n. '+p.nama);
}

     yang termuat; memanggilnya lagi untuk tiap chip penyaring adalah lima
     sapuan untuk angka yang sama persis. */
  const semua=rekapBayar(senin);
  let baris=semua;

  const kelompok={};

  }else if(BAYAR_GABUNG){

      +grup.map(function(g,i){

            +(g.orang.length>1?'<div class="kecil">'+g.orang.length+' orang sekali transfer</div>':'')+'</td>'
          +'<td>'+g.orang.map(function(o){
              return esc(o.nama)+' <span class="kecil">('+o.kali+'× · '+rp(o.total)+')</span>';
            }).join('<br>')+'</td>'
          +'<td class="kanan mono">'+g.kali+'×</td>'
          +'<td class="kanan mono"><b>'+esc(rp(g.total))+'</b></td>'
        +'</tr>';
      }).join('')
      +'</tbody></table></div>';
  }else{
    isi='<div class="tablewrap"><table class="list">'
      +'<thead><tr><th class="no">No.</th><th>Daily Worker</th><th>Divisi / Posisi</th>'
      +'<th class="kanan">Shift</th><th class="kanan">Jam</th><th>Tujuan transfer</th>'

        const p=x.p;

          +'<td class="no">'+(i+1)+'</td>'
          +'<td class="nama">'+esc(x.nama)
            +'<div class="kecil">'+esc(x.tgl.map(t=>HARI[idxHari(t)].slice(0,3)).join(', '))+'</div></td>'
          +'<td>'+(p?esc(ikonDivisi(p.divisi)+' '+namaDivisi(p.divisi))+'<div class="kecil">'+esc(p.posisi||'—')+'</div>':'—')+'</td>'
          +'<td class="kanan mono">'+x.kali+'×</td>'
          +'<td class="kanan mono">'+(Math.round(x.jam*10)/10)+'</td>'
          +'<td class="kecil">'+esc(labelTujuan(p))+'</td>'
          +'<td class="kanan mono"><b>'+esc(rp(x.total))+'</b></td>'
        +'</tr>';
      }).join('')
      +'</tbody></table></div>';
  }

  /* Yang nomornya belum diisi diangkat sebagai pita, bukan dibiarkan
     tenggelam di tabel: transfernya tidak bisa dikerjakan malam itu juga,
     dan itu perlu ketahuan SEBELUM HR mulai membuka m-banking. */
  const belum=baris.filter(x=>!(x.p&&x.p.bayarNomor));
  const nol=baris.filter(x=>x.total<=0);

  return '<div class="panel">'
    +'<div class="rowbar"><h2>Pembayaran mingguan</h2><div class="spacer"></div>'
    +'<div class="navdate noprint"><button class="iconbtn" onclick="bayarGeser(-1)" aria-label="Minggu sebelumnya">‹</button>'
    +'<b>'+esc(rentangMinggu(senin))+'</b>'
    +'<button class="iconbtn" onclick="bayarGeser(1)" aria-label="Minggu berikutnya">›</button>'
    +tombolKembali('bayarMingguIni', senin===seninDari(hariIni()), 'Kembali ke minggu ini')+'</div></div>'
    +'<div class="stats">'
      +statBox(baris.length,'Daily Worker')
      +statBox(totalKali,'Total Shift')
      +statBox(grup.length,'Transfer')
      +statUang(rp(totalRp),'Total Dibayar')
    +'</div>'
    +(belum.length?'<div class="note w"><b>'+belum.length+' orang</b> belum punya nomor tujuan: '
      +esc(belum.map(x=>x.nama).join(', '))+'. Lengkapi di <b>Database DW</b> supaya bisa ikut digabung.</div>':'')
    /* Nominal nol hampir selalu berarti tarif posisinya belum disetel, bukan
       orangnya memang tidak dibayar. Tanpa pita ini, satu baris Rp 0 di antara
       belasan baris lain tidak pernah tertangkap mata — dan orangnya tetap
       bekerja tanpa dibayar. */
    +(nol.length?'<div class="note d">Nominal <b>Rp 0</b> untuk '
      +esc(nol.map(x=>x.nama+' ('+((x.p&&x.p.posisi)||'tanpa posisi')+')').join(', '))
      +'. Tarif posisinya belum disetel di <b>Pengaturan → Tarif per shift</b>.</div>':'')
    +'<div class="rowbar">'
      +'<div class="seg">'+chip('ALL','Semua ('+semua.length+')')
        +Object.keys(BAYAR).map(k=>chip(k,BAYAR[k].ic+' '+BAYAR[k].n+' ('+hitungJenis(k)+')')).join('')+'</div>'
      +'<div class="spacer"></div>'
      +'<div class="seg">'
        +'<button class="'+(BAYAR_GABUNG?'active':'')+'" onclick="bayarGabung(1)" title="Gabungkan yang tujuannya sama">Per tujuan</button>'
        +'<button class="'+(BAYAR_GABUNG?'':'active')+'" onclick="bayarGabung(0)">Per orang</button>'
      +'</div>'
      +'<button class="btn btn-ghost btn-sm noprint" onclick="salinBayar()">📋 Salin daftar</button>'
      +'<button class="btn btn-ghost btn-sm noprint" onclick="window.print()">🖨️ Print</button>'
    +'</div>'
    +isi
    +'<p class="mutedhint" style="margin-top:10px">Yang dihitung hanya shift yang <b>sudah disetujui</b> pada '
    +esc(rentangMinggu(senin))+'. Nominalnya dari tarif per posisi di Pengaturan — '
    +'kalau tarifnya berubah, angka minggu yang sudah lewat ikut berubah.</p>'
    +'</div>';
}
/* Daftar transfer sebagai teks polos, untuk ditempel ke WhatsApp atau catatan
   sendiri saat mengerjakan transfernya. Disusun dari kelompok yang sama
   dengan yang di layar, bukan dihitung ulang. */
function salinBayar(){
  const senin=bayarSenin();
  let baris=rekapBayar(senin);
  if(BAYAR_FILTER!=='ALL') baris=baris.filter(x=>bayarJenisSah(x.p&&x.p.bayarJenis)===BAYAR_FILTER);
  const kelompok={};
  baris.forEach(function(x){
    const k=kunciBayar(x.p, x.id);
    if(!kelompok[k]) kelompok[k]={p:x.p, orang:[], total:0};
    kelompok[k].orang.push(x); kelompok[k].total+=x.total;
  });
  const grup=Object.keys(kelompok).map(k=>kelompok[k]).sort((a,b)=>b.total-a.total);
  if(!grup.length){ toast('Tidak ada yang perlu ditransfer minggu ini'); return; }
  let t='PEMBAYARAN DAILY WORKER\n'+rentangMinggu(senin)+'\n';
  grup.forEach(function(g,i){
    t+='\n'+(i+1)+'. '+labelTujuan(g.p)+'\n';
    g.orang.forEach(function(o){ t+='   - '+o.nama+' '+o.kali+'x = '+rp(o.total)+'\n'; });
    t+='   TRANSFER: '+rp(g.total)+'\n';
  });
  t+='\nTOTAL: '+rp(grup.reduce((n,g)=>n+g.total,0));
  salinTeks(t);
}
function salinTeks(t){
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(function(){ toast('Daftar transfer disalin'); },
        function(){ salinLewatKotak(t); });
      return;
    }
  }catch(e){}
  salinLewatKotak(t);
}
/* Peramban lama / halaman tanpa izin clipboard: tampilkan teksnya supaya
   tetap bisa disalin manual, bukan diam-diam gagal. */
function salinLewatKotak(t){
  modal('Daftar transfer', '<textarea style="width:100%;height:260px" readonly>'+esc(t)+'</textarea>'
    +'<p class="mutedhint">Peramban ini tidak mengizinkan salin otomatis — pilih semua teks di atas lalu salin sendiri.</p>', []);
}

/* =====================================================================
   HALAMAN — PENGATURAN (admin modul)
   ===================================================================== */
function viewPengaturan(){
  const st=S.setting;
  const posisi=st.posisi||POSISI_BAWAAN;
  return '<div class="panel">'
    +'<div class="rowbar"><h2>Tarif per shift</h2><div class="spacer"></div>'
    +'<div class="mutedhint">Dipakai untuk estimasi biaya di Dashboard & Kalender</div></div>'
    +'<div class="tablewrap"><table class="list">'
    +'<thead><tr><th>Posisi</th><th class="kanan">Tarif / shift</th></tr></thead><tbody>'
    +posisi.map(p=>'<tr><td class="nama">'+esc(p)+'</td>'
      /* Bertitik ribuan dan berawalan Rp, bukan <input type=number> telanjang.
         "140000" harus dihitung sendiri di kepala tiap kali halaman ini dibuka,
         dan satu nol kelebihan tidak kelihatan sama sekali sampai muncul di
         estimasi biaya sebulan. inputmode numeric supaya HP tetap membuka
         papan angka. */
      +'<td class="kanan"><span class="mutedhint" style="margin-right:6px">Rp</span>'
      +'<input class="inp mono" style="width:132px;text-align:right" type="text" inputmode="numeric" '
      +'value="'+esc(fmtRibuan(tarifPosisi(p)))+'" onchange="ubahTarif(\''+escJs(p)+'\',this.value,this)"></td></tr>').join('')
    +'</tbody></table></div>'
    +'<div class="rowbar" style="margin-top:12px"><input class="inp" id="stPosBaru" placeholder="Tambah posisi baru…">'
    +'<button class="btn btn-ghost btn-sm" onclick="tambahPosisi()">+ Tambah posisi</button></div>'
    +'</div>'

    +'<div class="panel">'
    +'<div class="rowbar"><h2>Jam siap pakai</h2><div class="spacer"></div>'
    +'<button class="btn btn-ghost btn-sm" onclick="tambahJam()">+ Tambah</button></div>'
    +'<p class="mutedhint" style="margin-bottom:10px">Tombol pintas di form ajuan. Jangan memakai <b>24:00</b> — server memvalidasi jam sebagai 00:00–23:59 dan menolaknya sebagai jam kosong.</p>'
    +(st.jam||[]).map((j,i)=>'<div class="row">'
      +'<input class="inp" style="width:130px" value="'+esc(j.n)+'" onchange="ubahJam('+i+',\'n\',this.value)">'
      +'<input class="inp" type="time" value="'+esc(j.m)+'" onchange="ubahJam('+i+',\'m\',this.value)">'
      +'<span>—</span>'
      +'<input class="inp" type="time" value="'+esc(j.s)+'" onchange="ubahJam('+i+',\'s\',this.value)">'
      +'<span class="chip mono">'+durasiJam(j.m,j.s)+' jam</span>'
      +'<div class="spacer"></div>'
      +'<button class="btn btn-ghost btn-sm" onclick="hapusJam('+i+')">Hapus</button></div>').join('')
    +'</div>'

    +'<div class="panel">'
    +'<div class="rowbar"><h2>Panduan jumlah DW per hari</h2></div>'
    +'<p class="mutedhint" style="margin-bottom:10px">Panduan, <b>bukan penguncian</b>. Melebihinya hanya memunculkan satu pertanyaan yang bisa dilanjutkan — larangan keras akan menghambat malam Sabtu yang butuh tambahan mendadak, dan yang terjadi berikutnya selalu sama: orang mencatatnya di luar sistem.</p>'
    +'<p class="mutedhint" style="margin-bottom:10px"><b>Hari event</b> = hari yang ada acaranya di Marketing atau Event (lihat Kalender Tamu). <b>Akhir pekan</b> = Sabtu &amp; Minggu. Sisanya hari biasa. Isi <b>0</b> untuk divisi yang tidak perlu dipandu — nol tidak pernah memunculkan pertanyaan.</p>'
    +'<div class="tablewrap"><table class="list">'
    +'<thead><tr><th>Divisi</th>'
      +KONTEKS.map(k=>'<th class="kanan">'+esc(KONTEKS_LBL[k])+'</th>').join('')+'</tr></thead><tbody>'
    +DIVISI.map(d=>'<tr><td class="nama">'+d.ic+' '+esc(d.n)+'</td>'
      +KONTEKS.map(function(k){
        return '<td class="kanan"><input class="inp mono" style="width:78px;text-align:right" type="number" min="0" '
          +'value="'+(+(((st.kuota||{})[d.k]||{})[k])||0)+'" onchange="ubahKuota(\''+d.k+'\',\''+k+'\',this.value)"></td>';
      }).join('')+'</tr>').join('')
    +'</tbody></table></div>'
    +'</div>';
}
function ubahTarif(p,v,el){
  /* Semua yang bukan angka dibuang: kotaknya kini bertitik ribuan, dan
     `+'140.000'` adalah NaN yang diam-diam menjadi tarif nol. */
  const n=Math.max(0, +String(v==null?'':v).replace(/\D+/g,'')||0);
  (S.setting.tarif=S.setting.tarif||{})[p]=n;
  if(el) el.value=fmtRibuan(n);
  simpanSetting(); toast('Tarif '+p+' disimpan: '+rp(n));
}
function tambahPosisi(){
  const el=document.getElementById('stPosBaru'); if(!el) return;
  const v=String(el.value||'').trim(); if(!v) return;
  S.setting.posisi=S.setting.posisi||POSISI_BAWAAN.slice();
  if(S.setting.posisi.indexOf(v)<0) S.setting.posisi.push(v);
  simpanSetting(); render(); toast('Posisi "'+v+'" ditambahkan');
}
function tambahJam(){ (S.setting.jam=S.setting.jam||[]).push({n:'Shift Baru',m:'16:00',s:'23:00'}); simpanSetting(); render(); }
function ubahJam(i,f,v){ const j=(S.setting.jam||[])[i]; if(!j) return; j[f]=v; simpanSetting(); render(); }
function hapusJam(i){ (S.setting.jam||[]).splice(i,1); simpanSetting(); render(); }
function ubahKuota(div,konteks,v){
  const kuota=(S.setting.kuota=normalKuota(S.setting.kuota));
  kuota[div]=kuota[div]||{};
  kuota[div][konteks]=Math.max(0,+v||0);
  simpanSetting();
}

/* =====================================================================
   DETAIL AJUAN
   ===================================================================== */
function bukaAjuan(id){
  const a=(S.ajuan||[]).find(x=>x.id===id); if(!a) return;
  const p=pekerjaById(a.dwId);
  const boleh=isOffice();
  const aksi=[];
  if(boleh && a.status!=='DISETUJUI') aksi.push({t:'Setujui',c:'btn-ok',f:function(){ tutupModal(); setujuiAjuan(id); return false; }});
  if(boleh && a.status!=='DITOLAK')   aksi.push({t:'Tolak',c:'btn-danger',f:function(){ tutupModal(); tolakAjuan(id); return false; }});

  modal('Ajuan — '+esc(namaDW(a.dwId)),
    '<div class="rowbar">'+pilStatus(a.status)
      +'<span class="chip">'+esc(tglPanjang(a.tgl))+'</span></div>'
    +'<div class="row"><div class="who"><b>Jam kerja</b><span>'+esc(jamAjuan(a))+' · '+durasiJam(a.m,a.s)+' jam</span></div></div>'
    +'<div class="row"><div class="who"><b>Penempatan</b><span>'+esc(ikonDivisi(a.divisi)+' '+namaDivisi(a.divisi))+' · '+esc(a.posisi||'—')+'</span></div></div>'
    +'<div class="row"><div class="who"><b>Estimasi biaya</b><span class="mono">'+esc(rp(biayaAjuan(a)))+'</span></div></div>'
    +(p&&boleh?'<div class="row"><div class="who"><b>Kontak</b><span class="mono">'+esc(p.hp)+(p.bank?' · '+esc(p.bank):'')+'</span></div></div>':'')
    +(a.catatan?'<div class="note i"><b>Catatan DW:</b> '+esc(a.catatan)+'</div>':'')
    +(a.putusNota?'<div class="note w"><b>Catatan HR:</b> '+esc(a.putusNota)+(a.putusOleh?' — '+esc(a.putusOleh):'')+'</div>':'')
    +'<p class="mutedhint">Dikirim '+(a.dibuatOleh?esc(a.dibuatOleh):'—')+(a.dibuatAt?' · '+new Date(a.dibuatAt).toLocaleString('id-ID'):'')+'</p>',
    aksi, true);
}

/* =====================================================================
   MODAL & KONFIRMASI
   ===================================================================== */
let MODAL_AKSI=[];
function modal(judul,isi,aksi,lebar){
  MODAL_AKSI=aksi||[];
  const root=document.getElementById('modalRoot'); if(!root) return;
  root.innerHTML='<div class="overlay" onclick="if(event.target===this)tutupModal()">'
    +'<div class="modal'+(lebar?' lebar':'')+'">'
    +'<div class="mh"><h3>'+judul+'</h3><button class="xbtn" onclick="tutupModal()" aria-label="Tutup">×</button></div>'
    +'<div class="mb">'+isi+'</div>'
    +'<div class="mf"><button class="btn btn-ghost" onclick="tutupModal()">Tutup</button>'
    +MODAL_AKSI.map((a,i)=>'<button class="btn '+(a.c||'btn-primary')+'" onclick="jalankanAksiModal('+i+')">'+esc(a.t)+'</button>').join('')
    +'</div></div></div>';
}
function jalankanAksiModal(i){
  const a=MODAL_AKSI[i]; if(!a||!a.f) return;
  a.f();
}
function tutupModal(){ const m=document.getElementById('modalRoot'); if(m) m.innerHTML=''; MODAL_AKSI=[]; }
function konfirmasi(judul,pesan,cb){
  modal(esc(judul), '<p style="font-size:13.5px;color:var(--muted)">'+esc(pesan)+'</p>',
    [{t:'Ya, lanjut',c:'btn-danger',f:function(){ tutupModal(); cb(); return false; }}]);
}
function tanyaTeks(judul,label,nilai,cb){
  modal(esc(judul),
    '<div class="field"><label>'+esc(label)+'</label><textarea id="tanyaIsi">'+esc(nilai||'')+'</textarea></div>',
    [{t:'Kirim',c:'btn-primary',f:function(){
      const v=(document.getElementById('tanyaIsi')||{}).value||'';
      tutupModal(); cb(v); return false;
    }}]);
}

/* =====================================================================
   BOOT
   ===================================================================== */
function tampilkanGerbang(judul,pesan){
  const g=document.getElementById('gate');
  if(judul) document.getElementById('gateJudul').textContent=judul;
  if(pesan) document.getElementById('gatePesan').textContent=pesan;
  g.classList.remove('hidden');
  document.getElementById('app').classList.add('hidden');
}
async function mulaiAplikasi(){
  const nama = isDW()?MEDW.nama:(ME&&ME.name)||'—';
  document.getElementById('su-un').textContent=nama;
  document.getElementById('su-avatar').textContent=inisial(nama);
  document.getElementById('su-ur').textContent =
    isDW() ? 'Daily worker' : (isAdmin()?'Admin modul':'Staf Office');

  /* Tombol keluar berbeda arah: staf Office kembali ke portal, DW keluar
     dari sesinya sendiri — mengirim DW ke halaman Office cuma menyodorkan
     layar login yang tidak pernah bisa ia pakai. */
  const kel=document.getElementById('su-keluar');
  if(kel && isDW()){
    kel.removeAttribute('href');
    kel.title='Keluar';
    kel.onclick=keluarDW;
  }

  try{ if(localStorage.getItem('lm_dw_navmini')==='1') document.getElementById('app').classList.add('nav-mini'); }catch(e){}

  if(!bolehBuka(VIEW)) VIEW = isDW() ? 'ajukan' : 'dashboard';
  render();                       // gambar dari cache dulu — layar tidak pernah kosong menunggu jaringan
  await muatData(true);
  render();

  /* Agenda tamu ditarik di LATAR, tanpa ditunggu. Bukan cuma untuk halaman
     Kalender Tamu: panduan jumlah DW memakai angka "hari event", dan tanpa
     data ini hari yang ada acara 300 pax akan dinilai sebagai hari biasa —
     peringatan yang paling penting justru tidak muncul. Karena tidak
     di-await, halaman tetap tampil seketika; angkanya menajam sendiri
     beberapa saat kemudian lewat render() di bawah. */
  if(isOffice()) muatTamuDanGambar();
}
async function boot(){
  const lg=document.getElementById("brand-logo"); if(lg) lg.src=LOGO_URI;
  BULAN_AKTIF=bulanDari(hariIni());
  DASH_TGL=hariIni();

  const sesDW=bacaSesiDW();
  const ses=bacaSesi();

  /* Sesi Office menang kalau keduanya ada: satu-satunya cara itu terjadi
     adalah staf yang pernah menguji gerbang DW di perangkatnya sendiri, dan
     yang ia harapkan berikutnya adalah layar HR-nya, bukan layar DW. */
  if(ses && !ses.tolak){
    ME=ses;
    S=bacaCache()||seed();
  }else if(sesDW){
    MEDW=sesDW;
    S=seed();
  }else{
    S=seed();
    if(ses&&ses.tolak){
      tampilkanGerbang('Tidak punya akses Office',
        (ses.name?ses.name+', a':'A')+'kun Anda belum diberi akses modul Daily Worker. Minta admin menambahkannya lewat Kelola Akses di Office — atau masuk sebagai daily worker di bawah.');
    }else{
      tampilkanGerbang(null,null);
    }
    return;
  }

  document.getElementById('gate').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  await mulaiAplikasi();
}

/* Tab yang dibiarkan terbuka semalaman memegang antrean kemarin. Saat kembali
   aktif, ambil ulang — HR lain mungkin sudah memutuskan sebagiannya. */
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible' || !(ME||MEDW)) return;
  muatData(true).then(render);
  /* Agenda tamu ikut disegarkan, tapi hanya kalau sudah basi lebih dari 10
     menit. Ia dipakai untuk menentukan "hari event" di panduan jumlah DW,
     dan tab yang dibiarkan terbuka semalaman akan menilai acara yang baru
     di-deal hari ini sebagai hari biasa. Tidak setiap kali tab kembali
     aktif: getAll Marketing membawa seluruh isi modul itu, dan HR berpindah
     tab puluhan kali sehari. */
  if(isOffice() && TAMU_AT && (Date.now()-TAMU_AT)>600000) muatTamuDanGambar(true);
});

boot();
