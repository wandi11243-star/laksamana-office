<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Laksamana Muda · Ticketing</title>
<meta name="description" content="Beli tiket event Laksamana Muda — pilih kursi langsung di denah venue.">
<!-- Ikon tab & huruf DISAMAKAN dengan modul internal (deploy/event, deploy/marketing).
     Sebelumnya tab menampilkan ikon dunia bawaan peramban dan hurufnya jatuh ke
     font sistem — satu perusahaan tampil seperti dua produk berbeda. -->
<link rel="icon" type="image/jpeg" href="../assets/LaksamanaMudaLogo.jpeg">
<link rel="apple-touch-icon" href="../assets/LaksamanaMudaLogo.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- SATU KELUARGA HURUF, BUKAN DUA.
     Sebelumnya judul memakai Plus Jakarta Sans dan isi memakai Inter. Keduanya
     sans geometris yang mirip tapi tidak sama — bedanya terlalu kecil untuk
     terbaca sebagai pilihan, dan cukup besar untuk terbaca sebagai berantakan,
     apalagi kalau salah satunya gagal termuat dan diam-diam jatuh ke font
     sistem. Satu keluarga dengan rentang tebal penuh menyelesaikan keduanya. -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   SITUS CUSTOMER — LAKSAMANA MUDA TICKETING
   Token warna disalin dari tema Office supaya satu merek, dua wajah.
   ===================================================================== */
:root{
  --ink:#2A2620; --gold:#A9791F; --gold-2:#C8961F; --gold-dim:#7A560F;
  --gold-soft:#F2E9D3; --paper:#F7F6F4; --surface:#fff;
  --line:#E7E1D3; --line-soft:rgba(60,55,45,.10);
  --muted:#5C574D; --muted-2:#8C8677;
  --ok:#1F9D5F; --ok-bg:#E4F5EC; --warn:#B5831A; --warn-bg:#F7EFDB;
  --danger:#C9432B; --danger-bg:#F8E4DF; --info:#2F7FC4; --info-bg:#E4EFF8;
  --radius:16px; --radius-sm:10px; --shadow:0 4px 18px rgba(50,42,28,.06);
  --shadow-lg:0 18px 48px rgba(50,42,28,.12);
  /* Nama variabelnya sengaja sama dengan modul internal (--ff-display /
     --ff-body) supaya jelas keduanya satu tema, bukan kebetulan mirip. */
  --ff-display:'Plus Jakarta Sans',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ff-body:var(--ff-display);
  --sans:var(--ff-body);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:radial-gradient(900px 480px at 50% -12%,rgba(227,160,8,.09),transparent 60%),var(--paper);
  color:var(--ink);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
/* Hierarki dijaga oleh UKURAN dan TEBAL, bukan oleh keluarga huruf yang
   berganti-ganti. Judul rapat (-.015em) supaya tegas; teks isi dibiarkan pada
   jarak normalnya karena huruf yang dirapatkan lebih sulit dibaca di layar HP. */
h1,h2,h3{font-weight:700;letter-spacing:-.015em;line-height:1.25}
h1{font-size:26px} h2{font-size:18px} h3{font-size:16px}
.btn{font-weight:600}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
img{max-width:100%;display:block}
.mono{font-variant-numeric:tabular-nums}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise .45s cubic-bezier(.16,1,.3,1) both}
.spinner{width:16px;height:16px;border:2.5px solid var(--gold-soft);border-top-color:var(--gold-2);
  border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:-2px}

.btn{border:none;border-radius:var(--radius-sm);padding:12px 18px;font-weight:600;font-size:15px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:filter .15s}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-block{width:100%}
.btn-pri{background:linear-gradient(135deg,var(--gold-2),var(--gold-dim));color:#fff;box-shadow:0 3px 12px rgba(122,86,15,.28)}
.btn-pri:hover:not(:disabled){filter:brightness(1.07)}
.btn-ghost{background:var(--surface);border:1.5px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--gold-2);background:var(--gold-soft)}

.topbar{position:sticky;top:0;z-index:50;background:rgba(247,246,244,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1120px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer}
.brand .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--gold-2),var(--gold-dim));
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px}
.brand b{font-size:15px}
.brand span{font-size:11px;color:var(--muted-2);display:block;margin-top:-2px}
.topnav{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.topnav button{padding:8px 13px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;
  color:var(--muted);background:transparent;border:none}
.topnav button:hover{color:var(--ink);background:var(--gold-soft)}
.topnav button.on{color:var(--gold-dim);background:var(--gold-soft)}
.topnav .siapa{font-size:12px;color:var(--muted-2);padding:0 4px;max-width:190px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kelas{border:1px solid var(--line);border-radius:var(--radius);padding:15px 17px;margin-bottom:10px;
  display:flex;gap:14px;align-items:flex-start;background:var(--surface)}
.kelas .warna{width:6px;align-self:stretch;border-radius:20px;flex:none;min-height:44px}
/* Kategori yang sudah habis tetap DITAMPILKAN, cuma diredupkan: menghapusnya
   membuat pembeli mengira kategori itu tidak pernah ada, lalu bertanya lewat
   WhatsApp. */
.kelas-habis{opacity:.62}
/* Bar ketersediaan. "12 tersisa" tidak berarti apa-apa tanpa tahu dari berapa. */
.sisa-bar{height:5px;border-radius:5px;background:rgba(60,55,45,.13);margin-top:9px;overflow:hidden}
.sisa-bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#E4B849,#A9791F)}
.sisa-ket{margin-top:5px}
.tanda-hampir{display:block;margin-top:6px;font-size:10.5px;font-weight:800;letter-spacing:.03em;
  color:#b5831a;text-transform:uppercase}
/* Deretan keterangan singkat di kepala halaman event. */
.chipbar{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 4px}
.chip-i{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;
  padding:5px 11px;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--ink)}
.chip-i.kuat{border-color:#E4B849;background:linear-gradient(135deg,#FDF3D8,#F7E7B8);color:#7a560f}
.chip-i.habis{border-color:rgba(201,67,43,.35);background:rgba(201,67,43,.08);color:#a63421}
.bagikan{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.kelas .isi{flex:1;min-width:0}
.kelas .isi b{font-size:15px}
.kelas .isi p{font-size:12.5px;color:var(--muted);margin-top:4px}
.kelas .harga{text-align:right;white-space:nowrap}
.kelas .harga b{font-size:17px;font-family:var(--ff-display)}
.kelas .harga span{display:block;font-size:11.5px;color:var(--muted-2);margin-top:2px}
/* Pengatur jumlah tiket reguler. Tombolnya sengaja 34px — di bawah itu jempol
   meleset, dan tiap kali meleset orang menambah tiket yang tidak diinginkan. */
.jumlah{display:flex;align-items:center;gap:10px;margin-top:9px;flex-wrap:wrap}
.jbtn{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);
  font-size:18px;line-height:1;color:var(--ink);display:grid;place-items:center}
.jbtn:hover:not(:disabled){border-color:var(--gold-2);background:var(--gold-soft)}
.jbtn:disabled{opacity:.4;cursor:not-allowed}
.jumlah b{min-width:22px;text-align:center;font-size:16px}
.btn.sm{padding:7px 12px;font-size:13px}

.lantai-ring{display:flex;gap:10px;flex-wrap:wrap}
.lantai-ring>div{flex:1;min-width:210px;border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:11px 13px;background:var(--surface)}
.lantai-ring b{display:block;font-size:14px}
.lantai-ring>div>span{font-size:12px;color:var(--muted-2)}
.tier-list{margin-top:9px;border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:6px}
.tier-row{display:flex;align-items:center;gap:8px;font-size:12.5px}
.tier-row i{width:9px;height:9px;border-radius:3px;flex:none}
.tier-row .nm{font-weight:600}
.tier-row .mini{margin-left:auto;text-align:right}
.riwayat{display:flex;gap:14px;align-items:center;padding:14px 16px;border:1px solid var(--line);
  border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow);margin-bottom:12px;
  cursor:pointer;transition:transform .15s,border-color .15s}
.riwayat:hover{transform:translateY(-2px);border-color:var(--gold-2)}
.riwayat .isi{flex:1;min-width:0}
.riwayat .isi b{font-size:15px;display:block}
.riwayat .isi span{font-size:12px;color:var(--muted-2)}
.chip{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap}
.chip.lunas{background:var(--ok-bg);color:var(--ok)}
.chip.nunggu{background:var(--warn-bg);color:var(--warn)}
.chip.batal{background:var(--danger-bg);color:var(--danger)}
.wrap{max-width:1120px;margin:0 auto;padding:24px 20px 90px}
.crumb{display:flex;gap:7px;align-items:center;font-size:13px;color:var(--muted-2);margin-bottom:14px;flex-wrap:wrap}
.crumb button{background:none;border:none;color:var(--muted);font-size:13px;font-weight:600;padding:0}
.crumb button:hover{color:var(--gold-dim)}
.head{margin-bottom:18px}
.head h1{font-size:28px;margin-bottom:4px}
.head p{color:var(--muted)}

/* ---------- BAGIAN ALA HALAMAN PERKENALAN ----------
   Halaman ini dibuka orang yang belum tentu pernah membeli tiket di sini.
   Daftar kartu saja menjawab "ada acara apa", tapi tidak menjawab pertanyaan
   yang datang lebih dulu: ini beli di mana, aman tidak, tiketnya bentuknya
   apa, masuknya bagaimana. Itu yang dijawab bagian-bagian di bawah. */
.hero{text-align:center;padding:34px 18px 30px;margin-bottom:26px;border-radius:22px;
  background:radial-gradient(120% 120% at 50% 0%,#FDF6E4 0%,#FFFDF8 55%,#fff 100%);
  border:1px solid var(--line)}
.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;
  color:var(--emas,#A9791F);margin-bottom:10px}
.hero h1{font-size:clamp(26px,5vw,40px);line-height:1.15;margin-bottom:12px;font-weight:800}
.hero h1 .em{background:linear-gradient(120deg,#C8961F,#7a560f);-webkit-background-clip:text;
  background-clip:text;color:transparent}
.hero p{color:var(--muted);max-width:620px;margin:0 auto;font-size:15px}
.hero .angka{display:flex;justify-content:center;gap:26px;flex-wrap:wrap;margin-top:20px}
.hero .angka div{min-width:96px}
.hero .angka b{display:block;font-size:23px;font-weight:800;color:var(--ink)}
.hero .angka span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}

.sect-h{text-align:center;margin:34px 0 18px}
.sect-h h2{font-size:clamp(21px,3.4vw,29px);font-weight:800;line-height:1.2}
.sect-h h2 .em{color:#A9791F}
.sect-h p{color:var(--muted);margin-top:7px;font-size:14px}

/* Langkah bernomor — bentuk yang sama dengan panduan di situs utama, supaya
   pembeli yang datang dari sana merasa masih di tempat yang sama. */
.langkah{display:grid;gap:10px}
.langkah .l{display:flex;gap:14px;align-items:flex-start;background:#fff;border:1px solid var(--line);
  border-radius:14px;padding:15px 17px}
.langkah .n{width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;
  justify-content:center;font-weight:800;color:#fff;font-size:14px;
  background:linear-gradient(135deg,#E4B849,#A9791F);box-shadow:0 3px 10px rgba(122,86,15,.3)}
.langkah b{display:block;margin-bottom:3px;font-size:14.5px}
.langkah p{color:var(--muted);font-size:13px;line-height:1.55}

.jaminan{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.jaminan .j{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 16px}
.jaminan .j .ic{font-size:21px;margin-bottom:7px}
.jaminan .j b{display:block;margin-bottom:3px;font-size:14px}
.jaminan .j p{color:var(--muted);font-size:12.5px;line-height:1.55}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.sec{padding:20px;margin-bottom:16px}
.sec h2{font-size:18px;margin-bottom:10px}
.empty{text-align:center;padding:56px 20px;color:var(--muted-2)}
.mini{font-size:12px;color:var(--muted-2)}
.divider{height:1px;background:var(--line);margin:14px 0}

/* ---- daftar event ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.ev{overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:transform .2s,box-shadow .2s}
.ev:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.ev .cover{aspect-ratio:16/10;display:grid;place-items:center;position:relative;
  background:linear-gradient(135deg,#3A2E6B,var(--gold-2));color:#fff;padding:0 16px;text-align:center}
.ev .cover h3{color:#fff;font-size:23px;text-shadow:0 2px 18px rgba(0,0,0,.4)}
.ev .cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* Tanpa uppercase: kategori event ditulis apa adanya ("Music", bukan "MUSIC").
   Huruf kapital semua memaksa mata mengeja per huruf dan membuat halaman
   terbaca seperti berteriak. */
.ev .cover .cat{position:absolute;top:11px;left:11px;background:rgba(0,0,0,.45);color:#fff;font-size:11.5px;
  font-weight:600;padding:4px 10px;border-radius:20px;z-index:1}
.ev .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.ev .row{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted)}
.ev .price{font-weight:700;font-size:17px;margin-top:auto}
.ev .price small{font-weight:500;font-size:12px;color:var(--muted-2)}

/* ---- denah (bentuknya sama dengan denah EMS) ---- */
/* JENDELA DENAH — tinggi tetap, isinya yang bergerak.
   touch-action:none mematikan gulir & cubit bawaan peramban DI DALAM kotak ini
   supaya gerakan jari sampai ke penangan kita, dan yang bergerak hanya denahnya.
   Di luar kotak, halaman tetap digulir seperti biasa. */
/* KURSOR DIGAMBAR SENDIRI, TIDAK MEMAKAI `grab` BAWAAN.
   Kursor tangan bawaan sistem berwarna putih dengan garis tepi tipis; di atas
   denah yang latarnya terang ia praktis hilang, dan pembeli kehilangan jejak
   di mana penunjuknya berada. Ini gambar empat-arah berisi tinta gelap dengan
   tepi putih — terlihat di latar terang maupun gelap, apa pun warna kursinya.
   Angka 14 14 adalah titik tunjuknya (tengah gambar); `move` disiapkan sebagai
   cadangan kalau peramban menolak kursor gambar. */
.denah-wrap{position:relative;overflow:hidden;touch-action:none;
  background:repeating-linear-gradient(45deg,var(--paper),var(--paper) 12px,rgba(0,0,0,.012) 12px,rgba(0,0,0,.012) 24px);
  border-radius:var(--radius);border:1px solid var(--line);height:62vh;min-height:320px;
  user-select:none;-webkit-user-select:none;
  cursor:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='28'%20height='28'%20viewBox='0%200%2028%2028'%3E%3Cpath%20d='M14%202%20L18%207%20H15.5%20V12.5%20H21%20V10%20L26%2014%20L21%2018%20V15.5%20H15.5%20V21%20H18%20L14%2026%20L10%2021%20H12.5%20V15.5%20H7%20V18%20L2%2014%20L7%2010%20V12.5%20H12.5%20V7%20H10%20Z'%20fill='%232A2620'%20stroke='%23fff'%20stroke-width='1.7'%20stroke-linejoin='round'/%3E%3C/svg%3E") 14 14, move}
/* Kursi tetap memakai telunjuk biasa: di sana yang dilakukan MENGETUK, bukan
   menggeser, dan telunjuk di atas kotak berwarna selalu terlihat. */
.denah-wrap .obj.bisa{cursor:pointer}
.denah{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.obj{position:absolute;border:2px solid;border-radius:7px;display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;text-align:center;overflow:hidden;line-height:1.1;transition:filter .12s,transform .1s}
.obj.bulat{border-radius:50%}
.obj.bisa{cursor:pointer}
.obj.bisa:hover{filter:brightness(1.08);transform:scale(1.06);z-index:3}
.obj small{display:block;font-size:8px;font-weight:600;opacity:.85}
.obj.sold{background:#D8D3CA!important;border-color:#B3AC9E!important;color:#6B6456!important;cursor:not-allowed}
.obj.checked{background:var(--info-bg)!important;border-color:var(--info)!important;color:var(--info)!important;cursor:not-allowed}
.obj.held{background:var(--warn-bg)!important;border-color:var(--warn)!important;color:var(--warn)!important;cursor:not-allowed}
.obj.mine{box-shadow:0 0 0 3px var(--info-bg),0 0 0 5px var(--info);z-index:2}
.obj.area{opacity:.85;cursor:default;border-style:dashed}
/* ============ ALUR BELI DI HP ============
   Tiga hal yang membuat orang menyerah di tengah pembelian lewat HP: tidak tahu
   sedang di langkah ke berapa, tidak bisa melihat apa yang sudah dipilih tanpa
   menggulir jauh, dan kursi yang terlalu kecil untuk disentuh. Tiga blok di
   bawah ini menjawab ketiganya. */

/* Penunjuk langkah — sama di semua layar pembelian. */
.langkah{display:flex;align-items:center;gap:6px;margin-bottom:14px;font-size:12px}
.langkah>div{display:flex;align-items:center;gap:6px;color:var(--muted-2)}
.langkah i{width:20px;height:20px;border-radius:50%;background:var(--line);color:var(--muted);
  display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700;flex:none}
.langkah .on{color:var(--ink);font-weight:700}
.langkah .on i{background:var(--gold-2);color:#fff}
.langkah .sudah i{background:var(--ok);color:#fff}
.langkah .garis{flex:1;height:1px;background:var(--line);min-width:8px}

/* Ringkasan yang bisa ditarik naik dari bar bawah. Di HP, kolom kanan tidak
   pernah terlihat tanpa menggulir sampai dasar halaman — padahal justru isinya
   yang ingin dicek berulang kali sebelum membayar. */
.bar-hp .i.buka{cursor:pointer;-webkit-tap-highlight-color:transparent}
.bar-hp .tarik{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted-2)}
.bar-hp .isi{max-height:0;overflow:hidden;transition:max-height .22s ease}
.bar-hp .isi.on{max-height:46vh;overflow:auto;margin-bottom:10px;
  border-bottom:1px solid var(--line);padding-bottom:8px}
.bar-hp .isi .pilih{margin-bottom:6px}

/* Kontrol perbesar denah. Cubit-zoom peramban memperbesar SELURUH halaman
   (termasuk tombol & bar bawah), jadi denahnya sendiri butuh pengatur sendiri. */
/* Tombol perbesar/perkecil: KECIL DAN SAMAR.
   Ia alat bantu, bukan bagian dari denah — dan denahlah yang sedang dibaca
   orang. Kotak putih pekat berisi dua tombol besar tadi justru menutupi kursi
   di pojok kanan bawah. Sekarang ia menempel tipis di sudut, dan baru menjadi
   jelas saat penunjuk mendekat (atau saat disentuh di HP). */
.zoomctl{position:absolute;right:8px;bottom:8px;z-index:4;display:flex;gap:4px;align-items:center;
  opacity:.42;transition:opacity .18s}
.zoomctl:hover,.zoomctl:active,.zoomctl:focus-within{opacity:1}
.zoomctl button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);
  background:rgba(255,255,255,.82);font-size:14px;line-height:1;color:var(--muted);
  display:grid;place-items:center;padding:0}
.zoomctl button:hover{border-color:var(--gold-2);background:#fff;color:var(--gold-dim)}


/* Versi HP dari panduan: satu baris, bukan tiga kartu. */
/* Spanduk mode upgrade — sengaja mencolok: layar ini terlihat sama persis
   dengan pembelian biasa, dan satu ketukan di sini artinya berbeda. */
.tbl-upg{background:var(--gold-soft);border:1px solid var(--gold-2);border-radius:var(--radius-sm);
  padding:11px 14px;margin-bottom:12px;color:var(--gold-dim)}
.tbl-upg .mini{color:var(--muted);margin-top:2px}

<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="brand" onclick="go('events')">
      <div class="mark">LM</div>
      <div><b>Laksamana Muda</b><span>Event Ticketing</span></div>
    </div>
    <nav class="topnav" id="topnav"></nav>
  </div>
</header>
<main class="wrap" id="app"></main>
<!-- PENANDA VERSI.
     Berkas ini satu HTML utuh yang di-cache peramban. Berkali-kali terjadi
     perbaikan sudah ter-deploy tapi yang dilihat masih versi lama, dan dari
     luar keduanya tidak bisa dibedakan — waktu habis untuk mencari bug yang
     sebenarnya sudah tidak ada. Sekarang versinya tertulis di kaki halaman:
     satu lirikan cukup untuk tahu yang terbuka versi mana. -->
<footer class="kaki"><span id="appVersi"></span></footer>
<div id="barhp"></div>
<div class="toasts" id="toasts"></div>

<script>
/* =====================================================================
   SITUS CUSTOMER LAKSAMANA MUDA TICKETING

   Denah yang digambar di sini adalah objek denah YANG SAMA dengan yang
   dirancang kru di EMS — koordinat, bentuk, dan warnanya diambil apa
   adanya dari server. Bukan tafsir ulang yang mirip: satu denah, dua
   tampilan. Kalau kru menggeser satu meja di EMS, halaman ini ikut
   bergeser tanpa ada kode yang diubah.

   Yang TIDAK ada di sini, dan memang disengaja:
   - harga tidak pernah dikirim ke server (server yang menghitung)
   - tidak ada tombol "saya sudah bayar" (yang menentukan lunas adalah
     webhook Xendit, bukan pengakuan pembeli)
   ===================================================================== */

/* Alamat API. Relatif, jadi satu berkas ini bekerja di DUA tempat tanpa
   diubah: dev.laksamanamuda.id/ticketing/ dan laksamanamuda.id/ticketing/
   sama-sama menemukan ../ticketing-api/. */
const API = '../ticketing-api/api.php';
/* Versi berkas ini. NAIKKAN tiap kali situs customer diubah — inilah satu-
   satunya cara membedakan "bugnya belum diperbaiki" dari "peramban masih
   memegang salinan lama". Ditulis di kaki halaman. */
const APP_VERSI = '2026-08-03h';

const $  = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* Teks dari EMS bisa berisi HTML — deskripsi event disimpan sebagai
   '<p>…</p>'. Kalau di-esc mentah, tagnya ikut TERBACA pembeli; kalau
   di-render apa adanya, teks dari EMS bisa menyuntikkan markup ke halaman
   publik. Jadi tagnya dibuang, isinya saja yang dipakai. */
function bersihTeks(x){
  return String(x==null?'':x)
    .replace(/<br\s*\/?>/gi,'\n').replace(/<\/p>/gi,'\n')
    .replace(/<[^>]*>/g,'')
    .replace(/&nbsp;/gi,' ').replace(/&amp;/gi,'&')
    .replace(/\n{3,}/g,'\n\n').trim();
}
const rp  = n => 'Rp' + (+n||0).toLocaleString('id-ID');
function tgl(iso){ if(!iso) return '-';
  const d=new Date(iso); if(isNaN(d)) return String(iso).slice(0,10);
  return d.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'}); }
function jam(iso){ if(!iso) return ''; const d=new Date(iso); if(isNaN(d)) return '';
  return d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})+' WIB'; }
function klok(ms){ const s=Math.max(0,Math.floor(ms/1000));
  return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }

function toast(pesan, jenis){
  const w={ok:'#1F9D5F',err:'#C9432B',warn:'#B5831A'}[jenis]||'#2F7FC4';
  const el=document.createElement('div'); el.className='toast';
  el.innerHTML='<i style="background:'+w+'"></i>'+esc(pesan);
  $('#toasts').appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); },3000);
}

/* ---------- lapisan API ----------
   Satu tempat yang menyentuh jaringan. Semua kegagalan dipulangkan sebagai
   Error dengan pesan dari server, supaya layar tidak pernah diam saja saat
   sesuatu gagal — diam adalah kegagalan paling membingungkan buat pembeli. */
async function api(aksi, data){
  let res;
  try{
    res = data
      ? await fetch(API, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
                          body: JSON.stringify(Object.assign({action:aksi}, data))})
      : await fetch(API + '?' + aksi);
  }catch(e){ throw new Error('Tidak bisa menghubungi server. Periksa koneksi lalu coba lagi.'); }
  let d; try{ d = await res.json(); }catch(e){ throw new Error('Jawaban server tidak terbaca.'); }
  if(!d || !d.ok) throw new Error((d && d.error) || 'Permintaan ditolak server.');
  return d.data;
}

/* ---------- AKUN PEMBELI ----------
   Token sesi disimpan di localStorage, bukan cookie: backend bisa berada di
   domain lain dari halaman ini, dan cookie tidak selalu ikut terkirim ke sana.
   Konsekuensinya token ikut hilang kalau orang membersihkan data peramban —
   itu sebabnya tautan e-ticket ber-access_token tetap dipertahankan sebagai
   jalan masuk yang tidak bergantung akun sama sekali. */
const Akun = {
  sesi: localStorage.getItem('lmtix_sesi') || '',
  user: null,
  simpan(t, u){ this.sesi=t||''; this.user=u||null;
    try{ t ? localStorage.setItem('lmtix_sesi',t) : localStorage.removeItem('lmtix_sesi'); }catch(e){} },
  masuk(){ return !!this.user; }
};
async function muatAkun(){
  if(!Akun.sesi){ Akun.user=null; return; }
  try{ Akun.user = await api('action=saya&sesi='+encodeURIComponent(Akun.sesi)); }
  catch(e){ Akun.simpan('', null); }        // sesi kedaluwarsa -> anggap keluar
}
function gambarTopnav(){
  const n=$('#topnav'); if(!n) return;
  const hal=(location.hash.slice(1)||'events').split('/')[0];
  n.innerHTML =
     '<button class="'+(hal==='events'?'on':'')+'" onclick="go(\'events\')">Event</button>'
    +(Akun.masuk()
       ? '<button class="'+(hal==='tiketsaya'?'on':'')+'" onclick="go(\'tiketsaya\')">Tiket Saya</button>'
         +'<span class="siapa" title="'+esc(Akun.user.email)+'">'+esc(Akun.user.name||Akun.user.email)+'</span>'
         +'<button onclick="keluarAkun()">Keluar</button>'
       : '<button class="'+(hal==='masuk'?'on':'')+'" onclick="go(\'masuk\')">Masuk</button>');
}
window.keluarAkun = async ()=>{
  try{ await api('keluar',{sesi:Akun.sesi}); }catch(e){}
  Akun.simpan('', null); gambarTopnav();
  toast('Kamu sudah keluar.','ok'); go('events');
};

/* ---------- keranjang ---------- */
const Beli = {
  /* DUA KERANJANG, SATU PESANAN.
     `items` = tempat bernomor yang ditahan server 10 menit (punya hold_token).
     `umum`  = tiket reguler tanpa nomor tempat: tidak ada yang bisa ditahan,
     jadi yang disimpan cuma kategori + jumlah lembar, dan sisa kuotanya baru
     dipastikan server saat checkout. Dipisah karena aturannya memang beda —
     menyatukan keduanya berarti timer 10 menit ikut menghitung mundur tiket
     yang sebetulnya tidak sedang menahan apa pun. */
  eventId:null, holdToken:localStorage.getItem('lmtix_hold')||'', items:[], umum:[], habis:0, jam:null,
  simpanToken(t){ this.holdToken=t; localStorage.setItem('lmtix_hold',t); },
  /* Isian data pemesan disimpan supaya bolak-balik ke denah untuk menambah
     atau mengurangi tempat tidak menghapus nama, email, dan nomor HP yang
     sudah diketik. Mengetik ulang tiga isian itu tiap kali berubah pikiran
     adalah cara paling cepat membuat orang batal membeli. */
  isian:{nama:'',email:'',hp:''},
  simpanIsian(){
    const g=id=>{ const el=$(id); return el?el.value:''; };
    if($('#f-nama')) this.isian={nama:g('#f-nama'),email:g('#f-email'),hp:g('#f-hp')};
  },
  total(){ return this.items.reduce((a,i)=>a+(+i.price||0),0)
                 + this.umum.reduce((a,u)=>a+(+u.price||0)*(+u.qty||0),0); },
  // Jumlah tiket yang akan terbit. Beda dengan jumlah baris keranjang begitu
  // ada tiket reguler yang dibeli beberapa lembar sekaligus.
  pax(){ return this.items.reduce((a,i)=>a+Math.max(1,+i.pax||1),0)
              + this.umum.reduce((a,u)=>a+(+u.qty||0),0); },
  kosong(){ return !this.items.length && !this.umum.length; },
  /* Kategori reguler yang jumlahnya jadi nol dibuang, bukan disimpan dengan
     qty 0 — kalau tidak, ringkasan menampilkan baris kosong dan tombol bayar
     menyala untuk pesanan yang isinya tidak ada. */
  setUmum(cid, nama, harga, qty){
    qty = Math.max(0, qty|0);
    const i = this.umum.findIndex(u=>u.class_id===cid);
    if (!qty) { if (i>=0) this.umum.splice(i,1); return; }
    if (i>=0) this.umum[i].qty = qty;
    else this.umum.push({class_id:cid, nama:nama, price:harga, qty:qty});
  },
  qtyUmum(cid){ const u=this.umum.find(x=>x.class_id===cid); return u?u.qty:0; },
  mulaiJam(){
    clearInterval(this.jam);
    this.jam=setInterval(()=>{
      const sisa=this.habis-Date.now();
      const el=$('#sisa-waktu');
      if(sisa<=0){ this.waktuHabis(); return; }
      if(el) el.textContent=klok(sisa);
    },500);
  },
  /* WAKTU HABIS = MULAI DARI NOL.
     Server sudah melepas kursinya (sapu_hold), jadi apa pun yang masih
     tercentang di layar adalah kebohongan: kursi itu sekarang milik siapa saja
     yang mengklik lebih dulu. Token lamanya ikut dibuang — token yang sama
     membuat halaman denah berikutnya bertanya "mana kursi milikku?" dan, kalau
     kebetulan ada kunci tersisa, memilihkannya kembali tanpa diminta.
     Tiket reguler tidak ikut dihapus: ia memang tidak pernah menahan apa pun. */
  waktuHabis(){
    clearInterval(this.jam); this.jam=null; this.habis=0;
    this.items=[];
    const tokenLama=this.holdToken;
    this.holdToken=''; try{ localStorage.removeItem('lmtix_hold'); }catch(e){}
    // Pemberitahuan ke server dikirim sekali, tanpa ditunggu: kalaupun gagal,
    // kuncinya toh sudah kedaluwarsa dan akan disapu permintaan berikutnya.
    if(tokenLama) api('release',{hold_token:tokenLama}).catch(()=>{});
    toast('Waktu menahan kursi habis — pilihanmu dikosongkan.','warn');
    const h=location.hash;
    if(h.indexOf('#denah')===0||h.indexOf('#checkout')===0) go('denah',this.eventId);
    else gambarBarHp();
  },
  stop(){ clearInterval(this.jam); this.jam=null; }
};

/* ---------- router ---------- */
const Layar = {};
function go(nama, a, b){
  Beli.simpanIsian();   // sebelum layarnya diganti, bukan sesudah
  const hash = nama + (a?('/'+a):'') + (b?('/'+b):'');
  if(location.hash.slice(1) !== hash) location.hash = hash;
  window.scrollTo(0,0);
  (Layar[nama]||Layar.events)(a,b);
  gambarTopnav();
  gambarBarHp();
}
/* Akun dimuat SEBELUM layar pertama digambar, supaya menu atas tidak sempat
   berkedip dari "Masuk" ke nama orangnya. */
async function mulai(){
  const v=document.getElementById('appVersi');
  if(v) v.textContent='Laksamana Muda Ticketing · versi '+APP_VERSI;
  await muatAkun();
  gambarTopnav();
  dariHash();
}
function dariHash(){
  const p=(location.hash.slice(1)||'events').split('/');
  go(p[0], p[1], p[2]);
}
window.addEventListener('hashchange', dariHash);
function memuat(teks){ $('#app').innerHTML='<div class="empty"><span class="spinner"></span> '+esc(teks||'Memuat…')+'</div>'; }
function galat(pesan, kembali){
  $('#app').innerHTML='<div class="empty"><h2 style="margin-bottom:8px">Tidak bisa ditampilkan</h2>'
    +'<p style="margin-bottom:16px">'+esc(pesan)+'</p>'

/* ---------- Potongan bersama halaman perkenalan ----------

function langkahHTML2(list){

/* Alamat poster yang diunggah kru di EMS. `e.poster` BUKAN alamat gambar —
   isinya emoji cadangan, dan memasangnya ke <img src> menghasilkan gambar
   rusak. Itu sebab poster tidak pernah muncul sebelum ini. */
function posterUrl(e){ return e.poster_img ? API+'?action=poster&id='+encodeURIComponent(e.id) : ''; }

/* ---------- Keterangan yang dicari pembeli sebelum memutuskan ----------
   Semuanya dihitung dari data yang SUDAH dikirim server (start, end, classes),
   jadi tidak ada permintaan tambahan dan tidak ada kolom baru di backend. */
function hariLagi(iso){
  if(!iso) return null;
  const d=new Date(iso); if(isNaN(d)) return null;
  const a=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  const k=new Date(); const b=new Date(k.getFullYear(),k.getMonth(),k.getDate());
  return Math.round((a-b)/86400000);
}
function labelHitungMundur(iso){
  const n=hariLagi(iso);
  if(n===null) return '';
  if(n<0)  return 'sudah lewat';
  if(n===0) return 'HARI INI';
  if(n===1) return 'besok';
  if(n<=7) return n+' hari lagi';
  return n+' hari lagi';
}
/* Sisa tiket seluruh event. Yang dihitung hanya kategori berbayar — kelas
   berharga nol biasanya tanda undangan/komplimen, bukan barang dagangan, dan
   memasukkannya membuat "tersisa 300" untuk acara yang tiket jualnya tinggal 5. */
function sisaEvent(e){
  return (e.classes||[]).filter(c=>+c.price>0)
    .reduce(function(a,c){ return a+Math.max(0,+c.sisa||0); },0);
}
function totalEvent(e){
  return (e.classes||[]).filter(c=>+c.price>0)
    .reduce(function(a,c){ return a+Math.max(0,+c.quota||0); },0);
}
/* Bagikan: WhatsApp lebih dulu karena ke situlah tautan acara sebenarnya
   beredar di sini. Tombol salin disediakan untuk yang lain. */
function bagikanHTML(e){
  const url=location.href;
  const teks=e.title+' — '+tgl(e.start)+' di '+e.venue+'\n'+url;
  return '<div class="bagikan">'
   +'<a class="btn btn-ghost sm" target="_blank" rel="noopener" '
   +'href="https://wa.me/?text='+encodeURIComponent(teks)+'">Bagikan ke WhatsApp</a>'
   +'<button class="btn btn-ghost sm" onclick="salinTautan()">Salin tautan</button>'
   +'</div>';
}
window.salinTautan=function(){
  const u=location.href;
  const beres=function(){ toast('Tautan halaman ini disalin'); };
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(u).then(beres,function(){ prompt('Salin tautan ini:',u); });
      return;
    }
  }catch(err){}
  prompt('Salin tautan ini:',u);
};
function kartuEvent(e){
  const img=posterUrl(e);
  return '<article class="card ev rise" onclick="go(\'event\',\''+esc(e.id)+'\')">'
    +'<div class="cover">'
      /* Emoji + judul SELALU digambar, lalu poster ditumpuk di atasnya (img di
         .cover memang position:absolute). Jadi kalau gambarnya gagal dimuat —
         berkasnya belum terjangkau server, jaringan putus, apa pun — yang
         terlihat tetap sampul yang masuk akal, bukan ikon gambar rusak. */
      +'<div style="display:grid;gap:6px;justify-items:center">'
        +(e.poster?'<div style="font-size:44px;line-height:1">'+esc(e.poster)+'</div>':'')
        +'<h3>'+esc(e.title)+'</h3></div>'
      +(img?'<img src="'+esc(img)+'" alt="'+esc(e.title)+'" loading="lazy" onerror="this.remove()">':'')
      +(e.category?'<span class="cat">'+esc(e.category)+'</span>':'')
    +'</div>'

      +(img?'<h3 style="font-size:17px">'+esc(e.title)+'</h3>':'')
      +'<div class="row">📅 '+esc(tgl(e.start))+' · '+esc(jam(e.start))+'</div>'
      +'<div class="row">📍 '+esc(e.venue)+'</div>'
      +'<div class="price">'+(e.price_from?rp(e.price_from)+' <small>mulai</small>':'<small>harga menyusul</small>')+'</div>'

/* ---------- 2. DETAIL EVENT ---------- */
/* HALAMAN DETAIL = LANDING PAGE, bukan sekadar antara sebelum memilih kursi.
   Pembeli perlu tahu ACARANYA APA, KATEGORINYA APA SAJA, DAPAT APA, dan BERAPA
   sebelum dihadapkan pada denah berisi ratusan kotak. Denah yang muncul sebelum
   orang paham kategorinya membuat harga terasa datang entah dari mana, dan itu
   titik paling sering orang mundur. */
let EVENT_DETIL=null, DENAH_DETIL=[];
Layar.event = async (id)=>{
  memuat();
  // Pindah event = keranjang tiket regulernya ikut ditinggal. Membawa 3 lembar
  // Reguler event lain ke halaman ini akan ditolak server saat checkout,
  // setelah pembelinya terlanjur mengisi seluruh formulir.
  if(Beli.eventId && Beli.eventId!==id) Beli.umum=[];
  Beli.eventId=id;
  try{
    EVENT_DETIL = await api('action=event&id='+encodeURIComponent(id));
    DENAH_DETIL = await api('action=denah&id='+encodeURIComponent(id));
  }catch(err){ return galat(err.message); }
  gambarEvent();
};
/* Digambar ulang dari data yang SUDAH ada tiap kali jumlah tiket reguler
   berubah. Menembak server lagi untuk perubahan yang seluruhnya terjadi di
   halaman ini membuat tombol +/- terasa berat dan bisa gagal saat sinyal
   jelek — padahal tidak ada satu pun angka baru yang perlu ditanyakan. */
function gambarEvent(){
  const e=EVENT_DETIL, denah=DENAH_DETIL;
  if(!e) return;
  const kelas=(e.classes||[]).filter(c=>+c.price>0);
  const warnaKelas={};
  denah.forEach(function(o){ if(o.tier && !warnaKelas[o.tier]) warnaKelas[o.tier]=o.warna||o.warna_tepi||'#A9791F'; });

  /* Rincian per lantai dipecah SAMPAI KATEGORI. "Lantai 2: 40 tempat tersedia"
     tidak menjawab pertanyaan yang sebenarnya ada di kepala pembeli — yang
     ingin diketahui adalah lantai ini isinya kategori apa dan berapa harganya,
     karena itulah yang menentukan ia naik ke lantai 2 atau tidak.
     Yang dihitung hanya objek yang benar-benar dijual: meja & zona ikut
     digambar di denah, tapi bukan barang dagangan. */
  const lantai={};
  denah.forEach(function(o){
    if(!o.dijual) return;
    const f=o.floor||'1';
    lantai[f]=lantai[f]||{ada:0,sisa:0,tier:{}};
    lantai[f].ada++;
    if(o.status==='available') lantai[f].sisa++;
    const t=o.tier||'Lainnya';
    lantai[f].tier[t]=lantai[f].tier[t]||{ada:0,sisa:0,harga:0};
    lantai[f].tier[t].ada++;
    if(o.status==='available') lantai[f].tier[t].sisa++;
    if(+o.price>0) lantai[f].tier[t].harga=+o.price;
  });

  $('#app').innerHTML=
    '<div class="crumb"><button onclick="go(\'events\')">Event</button> › <span>'+esc(e.title)+'</span></div>'
   +langkahHTML(1)
   +'<div class="dua">'
    +'<div>'
      // Poster ikut tampil di halaman detail, bukan cuma di kartu daftar:
      // inilah halaman yang dibagikan lewat WhatsApp, dan poster adalah alasan
      // orang berhenti menggulir.
      // Kalau posternya gagal dimuat, KARTUNYA yang dibuang — kotak kosong
      // setinggi 420px di puncak halaman jauh lebih buruk daripada tidak ada
      // poster sama sekali.
      +(posterUrl(e)?'<div class="card rise" style="overflow:hidden;margin-bottom:16px">'
          +'<img src="'+esc(posterUrl(e))+'" alt="'+esc(e.title)+'" style="width:100%;max-height:420px;object-fit:cover"'
          +' onerror="this.parentNode.remove()">'
        +'</div>':'')
      +'<div class="card sec rise">'
        +'<h1 style="font-size:26px;margin-bottom:8px">'+esc(e.title)+'</h1>'
        /* Deretan chip menggantikan dua baris teks kecil. Yang ditanyakan
           pembeli sebelum memutuskan selalu itu-itu juga — kapan, jam berapa,
           sampai jam berapa, di mana, tinggal berapa lama lagi, dan masih ada
           tiket atau tidak — dan enam pertanyaan itu tidak boleh dijawab oleh
           satu paragraf yang harus dibaca sampai habis. */
        +'<div class="chipbar">'
          +(e.category?'<span class="chip-i">'+esc(e.category)+'</span>':'')
          +'<span class="chip-i">📅 '+esc(tgl(e.start))+'</span>'
          +'<span class="chip-i">🕒 '+esc(jam(e.start))+(jam(e.end)?' – '+esc(jam(e.end)):'')+'</span>'
          +'<span class="chip-i">📍 '+esc(e.venue)+'</span>'
          +(labelHitungMundur(e.start)
            ? '<span class="chip-i '+(hariLagi(e.start)<=1?'kuat':'')+'">'+esc(labelHitungMundur(e.start))+'</span>' : '')
          +(sisaEvent(e)>0
            ? '<span class="chip-i '+(sisaEvent(e)<=Math.max(5,totalEvent(e)*0.1)?'kuat':'')+'">🎟️ '+sisaEvent(e)+' tiket tersisa</span>'
            : '<span class="chip-i habis">🎟️ Tiket habis</span>')
        +'</div>'
        +bagikanHTML(e)
        /* Deskripsi dari EMS disimpan sebagai HTML ('<p>…</p>'). Di-esc mentah
           membuat tagnya ikut TERBACA pembeli. Tagnya dibuang, isinya yang
           ditampilkan — bukan di-render sebagai HTML, karena teks dari EMS
           tidak boleh bisa menyuntikkan markup ke halaman publik. */
        +(bersihTeks(e.desc)?'<div class="divider"></div><p style="color:var(--muted);white-space:pre-wrap">'+esc(bersihTeks(e.desc))+'</p>':'')
      +'</div>'
      +(kelas.length?'<div class="card sec rise"><h2>Kategori tiket</h2>'
        +'<p class="mini" style="margin:-4px 0 12px">Kategori bernomor tempat dipilih di denah; kategori reguler cukup ditentukan jumlahnya di sini.</p>'
        +kelas.map(kelasHTML).join('')
        +'</div>':'')
      +(Object.keys(lantai).length?'<div class="card sec rise"><h2>Isi tiap lantai</h2>'
        +'<p class="mini" style="margin:-4px 0 10px">Warna titik sama dengan warna tempatnya di denah.</p>'
        +'<div class="lantai-ring">'+Object.keys(lantai).sort().map(function(f){
            const L=lantai[f];
            return '<div><b>Lantai '+esc(f)+'</b>'
              +'<span>'+L.sisa+' dari '+L.ada+' tempat masih tersedia</span>'
              +'<div class="tier-list">'+Object.keys(L.tier).sort().map(function(t){
                  const T=L.tier[t];
                  return '<div class="tier-row"><i style="background:'+esc(warnaKelas[t]||'#A9791F')+'"></i>'
                    +'<span class="nm">'+esc(t)+'</span>'
                    +'<span class="mini">'+(T.harga?rp(T.harga)+' · ':'')
                    +(T.sisa?T.sisa+' dari '+T.ada+' sisa':'habis')+'</span></div>';
                }).join('')+'</div></div>';
          }).join('')+'</div>'
        // Jalan masuk ke denah ada TEPAT di bawah rincian lantainya — di situlah
        // pertanyaan "aku duduk di mana" muncul, bukan di kolom kanan yang di HP
        // sudah tergulir jauh ke bawah.
        +'<button class="btn btn-pri btn-block" style="margin-top:14px" onclick="go(\'denah\',\''+esc(e.id)+'\')">'
          +'Pilih kursi di denah</button>'
        +'<p class="mini" style="margin-top:8px;text-align:center">Ketuk kursi yang kamu mau — kursinya ditahan 10 menit untukmu.</p>'
      +'</div>':'')
      /* Panduan & jaminan ikut di halaman detail, BUKAN cuma di daftar event.
         Tautan yang beredar di WhatsApp hampir selalu langsung ke halaman
         event tertentu — orang yang datang lewat situ tidak pernah melewati
         daftar, dan tanpa ini ia melihat harga tanpa satu pun keterangan
         tentang bentuk tiketnya maupun cara masuknya. */
      +kepalaBagian('Panduan','Cara Beli','Tiketnya','Empat langkah, semuanya di halaman ini.')
      +langkahHTML2([
         ['Pilih kategori','Tiap kategori punya harga, sisa tempat, dan fasilitasnya sendiri — tertulis di atas.'],
         ['Tentukan tempat','Kategori bernomor: tunjuk kursinya di denah. Kategori bebas: cukup tentukan jumlahnya.'],
         ['Isi data & bayar','Nama, nomor HP, dan email. Tempatmu ditahan 10 menit selama pembayaran.'],
         ['Terima e-ticket','QR muncul di layar dan dikirim ke email. Tunjukkan di pintu pada hari-H.']
        ])
      +kepalaBagian('Sebelum berangkat','Yang Perlu','Diketahui','')
      +'<div class="jaminan" style="margin-bottom:6px">'
        +'<div class="j"><div class="ic">📍</div><b>Lokasi</b><p>'+esc(e.venue)+'</p></div>'
        +'<div class="j"><div class="ic">🕒</div><b>Waktu</b><p>'+esc(tgl(e.start))+'<br>'+esc(jam(e.start))
          +(jam(e.end)?' – '+esc(jam(e.end)):'')+' WIB</p></div>'
        +'<div class="j"><div class="ic">🎟️</div><b>Bentuk tiket</b><p>E-ticket ber-QR. Cukup tunjukkan dari layar HP; tidak perlu dicetak.</p></div>'
        +'<div class="j"><div class="ic">👤</div><b>Satu tiket satu orang</b><p>QR dipindai sekali di pintu lalu hangus. Datang bersama? Pesan sejumlah orangnya.</p></div>'
      +'</div>'
      +jaminanHTML()
    +'</div>'
    /* Ringkasan yang sama dengan di halaman denah begitu ada yang dipilih.
       Dulu sisi ini hanya memajang "mulai dari" — pembeli tiket reguler tidak
       punya tempat untuk melihat apa yang sudah ia pilih sampai halaman
       berikutnya. */
    +'<aside>'+(Beli.kosong()
      ? '<div class="card sum"><div class="sh">Mulai dari</div><div class="sb">'
        +'<div style="font-size:26px;font-weight:800;margin-bottom:14px">'+(e.price_from?rp(e.price_from):'—')+'</div>'

                      :'<p class="mini">Tentukan jumlah tiket di daftar kategori.</p>')
        +'<p class="mini" style="margin-top:9px;text-align:center">Bayar setelah tempatnya dipilih.</p>'
      +'</div></div>'
      : ringkasHTML('Lanjut ke data pemesan'))
    +'</aside>'
   +'</div>';
}
/* Event punya denah kalau ada satu saja tempat yang dijual di sana. Event
   standing murni tidak boleh menawarkan tombol ke halaman denah kosong. */
function punyaDenah(){ return DENAH_DETIL.some(o=>o.dijual); }

/* Satu baris kategori. Yang bernomor tempat mengarah ke denah; yang reguler
   dapat pengatur jumlah di tempat — memaksa pembeli tiket berdiri melewati
   halaman denah hanya untuk menemukan tidak ada yang bisa diklik di sana
   adalah cara paling cepat membuat orang menutup halaman. */
function kelasHTML(c){
  const warna=(DENAH_DETIL.find(o=>o.tier===c.name&&(o.warna||o.warna_tepi))||{});
  const sisa=Math.max(0,+c.sisa||0);
  const kuota=Math.max(0,+c.quota||0);
  const qty=Beli.qtyUmum(c.id);
  /* Bar ketersediaan: "12 tersisa" tidak berarti apa-apa tanpa tahu dari
     berapa. Dua belas dari lima belas itu hampir habis; dua belas dari tiga
     ratus itu masih lega, dan pembeli memutuskan berbeda di dua keadaan itu. */
  const pctTerjual=kuota?Math.min(100,Math.round((kuota-sisa)/kuota*100)):0;
  const hampir=(kuota&&sisa>0&&sisa<=Math.max(3,Math.round(kuota*0.2)));
  return '<div class="kelas'+(sisa?'':' kelas-habis')+'">'
    +'<i class="warna" style="background:'+esc(warna.warna||warna.warna_tepi||'#A9791F')+'"></i>'
    +'<div class="isi"><b>'+esc(c.name)+'</b>'
      +(c.benefit?'<p><b style="color:var(--ink)">Benefit:</b> '+esc(bersihTeks(c.benefit))+'</p>':'')
      +(c.description?'<p>'+esc(bersihTeks(c.description))+'</p>':'')
      +'<p>'+(c.is_seated?'Tempat duduk dipilih sendiri di denah':'Tanpa nomor tempat — bebas berdiri/duduk')+'</p>'
      +(kuota?'<div class="sisa-bar" title="'+(kuota-sisa)+' dari '+kuota+' sudah terjual">'
          +'<i style="width:'+pctTerjual+'%"></i></div>'
        +'<p class="mini sisa-ket">'+(sisa?((kuota-sisa)+' dari '+kuota+' terjual'):'semua terjual')+'</p>':'')
      +(c.is_seated||!sisa?''
        : '<div class="jumlah">'
          +'<button class="jbtn" '+(qty<1?'disabled':'')+' onclick="ubahUmum(\''+esc(c.id)+'\',-1)" aria-label="Kurangi">−</button>'
          +'<b class="mono">'+qty+'</b>'
          +'<button class="jbtn" '+(qty>=Math.min(sisa,10)?'disabled':'')+' onclick="ubahUmum(\''+esc(c.id)+'\',1)" aria-label="Tambah">+</button>'
          +'<span class="mini">maksimal '+Math.min(sisa,10)+' per pesanan</span>'
        +'</div>')
    +'</div>'
    +'<div class="harga"><b>'+rp(c.price)+'</b>'
      +'<span>'+(sisa?sisa+' tersisa':'habis')+'</span>'
      +(hampir?'<span class="tanda-hampir">Hampir habis</span>':'')
      +(c.is_seated&&sisa?'<button class="btn btn-ghost sm" style="margin-top:8px" onclick="go(\'denah\',\''+esc(EVENT_DETIL.id)+'\')">Pilih tempat</button>':'')
    +'</div></div>';
}
window.ubahUmum=(cid,delta)=>{
  const c=(EVENT_DETIL.classes||[]).find(x=>x.id===cid); if(!c) return;
  const batas=Math.min(Math.max(0,+c.sisa||0), 10);
  const baru=Math.min(batas, Math.max(0, Beli.qtyUmum(cid)+delta));
  Beli.setUmum(cid, c.name, +c.price, baru);
  gambarEvent(); gambarBarHp();
};

/* ---------- 3. DENAH ----------
   Objek digambar pada koordinat aslinya (x,y,w,h) di dalam kotak yang
   diskalakan agar muat di lebar layar. Skala dihitung dari kotak
   pembungkus terkecil yang memuat SEMUA objek lantai itu — bukan dari
   ukuran kanvas EMS, yang biasanya jauh lebih besar dari isinya dan
   membuat denah tampil kecil di tengah ruang kosong. */
/* Halaman ini TIDAK menyimpan palet warna sendiri. Sebelumnya ia punya
   salinan LDZ_RUANG milik EMS, jadi ada tiga tempat yang harus diubah
   bersamaan tiap kali palet berubah — dan yang lupa akan menampilkan denah
   berbeda untuk ruangan yang sama. Warna sekarang datang dari server
   (warna_bg / warna_tepi pada tiap objek), yang menghitungnya sekali. */
let DENAH=[], LANTAI='1', EVENT_KINI=null;
Layar.denah = async (id)=>{
  memuat('Memuat denah venue…');
  Beli.eventId=id;
  try{
    EVENT_KINI = await api('action=event&id='+encodeURIComponent(id));
    DENAH = await api('action=denah&id='+encodeURIComponent(id)+'&hold='+encodeURIComponent(Beli.holdToken));
  }catch(e){ return galat(e.message); }
  /* Pilihan yang MASIH dipegang server dikembalikan ke keranjang, supaya
     menyegarkan halaman tidak menghilangkan kursi yang sudah ditahan.
     Yang menentukan selalu jawaban server: kalau kuncinya sudah kedaluwarsa,
     server tidak lagi menyebutnya 'mine' dan keranjangnya memang kosong —
     tidak ada kursi yang tercentang sendiri saat pembeli mulai lagi. */
  const punyaku = DENAH.filter(o=>o.status==='mine');
  Beli.items = punyaku.map(o=>({seat_id:o.id,label:o.label,tier:o.tier,price:o.price}));
  // Hitung mundurnya dilanjutkan dari sisa waktu yang SEBENARNYA di server.
  Beli.habis = punyaku.reduce((a,o)=>Math.max(a,+o.hold_exp||0), 0);
  if(Beli.items.length && Beli.habis<=Date.now()){ Beli.items=[]; Beli.habis=0; }
  const lantaiAda=[...new Set(DENAH.map(o=>o.floor))].sort();
  if(lantaiAda.indexOf(LANTAI)<0) LANTAI=lantaiAda[0]||'1';
  // Denah yang isinya cuma meja & zona sama saja dengan tidak ada denah: tidak
  // ada satu pun yang bisa diklik, dan halaman ini hanya akan membuat pembeli
  // mengira sistemnya rusak.
  if(!DENAH.some(o=>o.dijual)) return galat('Event ini tidak memakai tempat bernomor. Tiketnya dipilih di halaman event.', 'event');
  gambarDenah();
  // Hitung mundur dilanjutkan hanya kalau memang masih ada yang ditahan.
  if(Beli.items.length) Beli.mulaiJam();
  mulaiSegarDenah();
};
/* DENAH DISEGARKAN BERKALA — sedekat mungkin dengan "realtime" tanpa server
   yang bisa mendorong perubahan sendiri. Hosting ini tidak punya WebSocket,
   jadi yang bisa dilakukan adalah bertanya ulang: tiap 15 detik, selama
   halamannya memang sedang dibuka dan tabnya terlihat.

   Kursi yang SEDANG dipilih dipertahankan sebagai milik sendiri — kalau tidak,
   jawaban server yang datang sepersekian detik sebelum kunci barunya tercatat
   akan membuat kursi itu berkedip jadi kosong di layar pemiliknya. */
let _segarDenah=null;
function mulaiSegarDenah(){
  clearInterval(_segarDenah);
  _segarDenah=setInterval(async ()=>{
    if(location.hash.indexOf('#denah')!==0){ clearInterval(_segarDenah); _segarDenah=null; return; }
    if(document.hidden) return;                  // tab di belakang: tak perlu menembak server
    const m=document.getElementById('modalUpg');
    if(m && m.style.display==='flex') return;    // sedang mengonfirmasi upgrade
    let baru;
    try{ baru = await api('action=denah&id='+encodeURIComponent(Beli.eventId)+'&hold='+encodeURIComponent(Beli.holdToken)); }
    catch(e){ return; }                          // gangguan sesaat: diamkan, coba lagi 15 detik lagi
    if(location.hash.indexOf('#denah')!==0) return;
    const punyaku={}; Beli.items.forEach(i=>{ punyaku[i.seat_id]=1; });
    DENAH=baru.map(o=>punyaku[o.id]?Object.assign({},o,{status:'mine'}):o);
    petakanObjek(); gambarPilihanBar();
  }, 15000);
}
function gambarDenah(){
  const lantaiAda=[...new Set(DENAH.map(o=>o.floor))].sort();
  $('#app').innerHTML=
    '<div class="crumb"><button onclick="go(\'events\')">Event</button> › '
      +'<button onclick="go(\'event\',\''+esc(Beli.eventId)+'\')">'+esc(EVENT_KINI?EVENT_KINI.title:'Event')+'</button> › <span>Pilih tempat</span></div>'
   +langkahHTML(1)
   +(UPG
      ? '<div class="tbl-upg">'
        +'<b>Naik kelas: '+esc(UPG.tier||'')+' '+esc(UPG.label||'')+' → pilih kursi tujuan</b>'
        +'<div class="mini">Yang dibayar hanya selisih harganya. Kursi lamamu baru dilepas setelah selisih itu lunas.</div>'
        +'<button class="btn btn-ghost sm" style="margin-top:8px" onclick="batalUpgrade()">Batal, kembali ke tiketku</button>'
        +'</div>'
      : '')
   +'<div class="head"><h1>'+(UPG?'Pilih kursi tujuan':'Pilih tempat')+'</h1><p class="sembunyi-hp">Denah di bawah ini sama persis dengan tata ruang aslinya di venue.</p></div>'
   /* DUA BENTUK PANDUAN, SATU ISI.
      Di layar lebar tiga kartu masih terbaca sekilas. Di HP tiga kartu itu
      memakan setengah layar sebelum denahnya sempat muncul — dan halaman jadi
      panjang persis seperti yang dikeluhkan. Versi HP-nya satu baris. */
   +'<div class="panduan">'
     +'<div><b>1</b><span>Ketuk kursi berwarna untuk memilih. Ketuk sekali lagi untuk melepas.</span></div>'
     +'<div><b>2</b><span>Kursi pilihanmu ditahan <b>10 menit</b> — orang lain tidak bisa mengambilnya selama itu.</span></div>'
     +'<div><b>3</b><span>Meja, panggung, dan tangga hanya penanda ruangan; yang dijual kursinya.</span></div>'
   +'</div>'
   +'<div class="panduan-hp">Ketuk kursi untuk memilih · cubit untuk memperbesar · ditahan 10 menit</div>'
   +'<div class="dua"><div>'
     +(lantaiAda.length>1?'<div class="lantai">'+lantaiAda.map(f=>{
         // Yang dihitung hanya yang dijual: memasukkan meja & zona membuat
         // "40 tempat" berubah jadi 12 begitu lantainya dibuka.
         const n=DENAH.filter(o=>o.floor===f&&o.dijual).length;
         return '<button class="'+(f===LANTAI?'on':'')+'" onclick="pilihLantai(\''+esc(f)+'\')">Lantai '+esc(f)+' <span class="mini">('+n+' tempat)</span></button>';
       }).join('')+'</div>':'')
     /* Jendela denah: tinggi TETAP, isinya yang bergerak. Tombolnya melayang di
        atas denah supaya tidak menambah tinggi halaman. */
     +'<div class="denah-wrap" id="denahWrap">'
       +'<div class="denah" id="denah"></div>'
       +'<div class="zoomctl">'
         /* Tinggal dua tombol. "Muat layar" dan angka persen dibuang: keduanya
            menjelaskan mesin, bukan menolong pembeli — yang dibutuhkan cuma
            "lebih besar" dan "lebih kecil". Mengembalikan denah ke tampilan
            penuh tetap bisa dengan menekan − sampai mentok, dan berpindah
            lantai selalu menata ulang dari awal. */
         +'<button type="button" onclick="zoomDenah(-1)" aria-label="Perkecil">−</button>'
         +'<button type="button" onclick="zoomDenah(1)" aria-label="Perbesar">+</button>'
       +'</div>'
     +'</div>'
     /* Kursi terpilih terlihat TANPA menggulir ke ringkasan — di HP, ringkasan
        ada jauh di bawah denah. */
     +'<div class="pilihan-bar" id="pilihanBar"></div>'
     +'<div class="legend">'
       +'<span><i style="background:#E4F5EC;border-color:#1F9D5F"></i>Tersedia</span>'
       +'<span><i style="background:#E4EFF8;border-color:#2F7FC4;box-shadow:0 0 0 2px #2F7FC4"></i>Pilihanmu</span>'
       +'<span><i style="background:#F7EFDB;border-color:#B5831A"></i>Dipilih orang lain</span>'
       +'<span><i style="background:#D8D3CA;border-color:#B3AC9E"></i>Terjual</span>'
       +'<span><i style="background:#EDE9DF;border-color:#A9791F;border-style:dashed"></i>Meja &amp; area (bukan tiket)</span>'
     +'</div>'
   +'</div><aside>'+ringkasHTML()+'</aside></div>';
  petakanObjek();
  gambarPilihanBar();
  /* BAR BAWAH IKUT DIGAMBAR ULANG DI SINI.
     Di HP, ringkasan samping disembunyikan dan tombol "Lanjut ke data pemesan"
     HANYA ada di bar bawah. Bar itu digambar oleh go(), sementara memilih kursi
     tidak lewat go() — jadi sesudah mengetuk kursi pertama, layar HP tidak
     punya satu pun jalan maju: kursinya terpilih, chipnya muncul, tapi tidak
     ada tombol lanjut di mana pun. Dilaporkan 3 Agustus 2026. */
  gambarBarHp();
}
/* Deretan kursi terpilih di bawah denah. Ketuk chip-nya untuk melepas — di HP
   itu jauh lebih mudah daripada mencari kursinya lagi di dalam denah. */
function gambarPilihanBar(){
  const el=$('#pilihanBar'); if(!el) return;
  if(!Beli.items.length){ el.innerHTML='<span class="kosong">Belum ada kursi dipilih.</span>'; return; }
  el.innerHTML=Beli.items.map(i=>'<button type="button" onclick="ketukTempat(\''+esc(i.seat_id)+'\')">'
    +esc(i.label||'Tempat')+' <span>'+rp(i.price)+' ✕</span></button>').join('');
}
window.pilihLantai=f=>{ LANTAI=f; gambarDenah(); };

/* ================= DENAH: CUBIT & GESER, SEPERTI APLIKASI BIOSKOP =================
   Sebelumnya denah diskalakan sekali supaya "muat layar", lalu digulir seperti
   blok halaman biasa. Dua akibatnya di HP: kursinya jadi kotak belasan piksel
   yang sulit disentuh, dan menggeser denah ikut menggeser SELURUH halaman —
   yang bergerak justru bukan yang ingin dilihat.

   Sekarang denah punya jendelanya sendiri dengan tinggi tetap. Isinya digeser
   dan diperbesar lewat transform (translate + scale), jadi hanya denah yang
   bergerak; halaman di belakangnya diam. Dua jari mencubit = memperbesar tepat
   di titik jari, satu jari = menggeser, roda tetikus = memperbesar di titik
   kursor. Tombol +/− dan "Muat layar" untuk yang memakai tetikus.

   touch-action:none pada jendelanya WAJIB: tanpa itu peramban mengambil alih
   gerakan jari untuk menggulir halaman, dan sentuhan kita tidak pernah sampai. */
let VIEW={z:1, x:0, y:0, w:0, h:0, kunci:''};   // z=perbesaran, x/y=geseran, w/h=ukuran isi, kunci=denah apa yang sedang tergambar
let _geserJauh=false;                  // true = gerakan tadi menggeser, bukan mengetuk

function petakanObjek(){
  const box=$('#denah'), wrap=$('#denahWrap'); if(!box) return;
  const its=DENAH.filter(o=>o.floor===LANTAI);
  if(!its.length){ box.innerHTML='<div class="empty">Lantai ini belum ada tempatnya.</div>'; return; }
  const minX=Math.min(...its.map(o=>o.x)), minY=Math.min(...its.map(o=>o.y));
  const maxX=Math.max(...its.map(o=>o.x+o.w)), maxY=Math.max(...its.map(o=>o.y+o.h));
  VIEW.w=maxX-minX+40; VIEW.h=maxY-minY+40;
  box.style.width=VIEW.w+'px'; box.style.height=VIEW.h+'px';

  box.innerHTML=its.map(o=>{
    /* `dijual` datang dari server. Meja & zona digambar supaya ruangannya
       terbaca, tapi tidak bisa diklik dan tidak punya harga — tidak ada
       pemesanan per meja (keputusan 31 Juli 2026). */
    const bisa = o.dijual && (o.status==='available' || o.status==='mine');
    // Warna eksplisit per objek menang; kalau tidak ada, server sudah
    // menghitungkan warna ruangnya. Halaman ini tidak menebak apa pun.
    const w = o.warna || o.warna_tepi || '#A9791F';
    const isiRuang = o.warna ? null : (o.warna_bg || null);
    /* Warna dasar mengikuti kategori tiketnya (sama seperti di EMS), dan hanya
       status yang menimpanya lewat kelas CSS — jadi kursi VIP tetap terlihat
       VIP sampai ia benar-benar terjual. */
    const gaya='left:'+(o.x-minX+20)+'px;top:'+(o.y-minY+20)+'px;width:'+o.w+'px;height:'+o.h+'px;'
      +'border-color:'+w+';background:'+(isiRuang||(o.kind==='table'?warnaMuda(w):w))
      +';color:'+kontras(isiRuang||(o.kind==='table'?'#EDE9DF':w))+';';
    const kelas='obj '+(o.shape==='circle'?'bulat ':'')+o.status+(bisa?' bisa':'')
      +((o.kind==='area'||!o.dijual)?' area':'');
    // Meja tidak pernah menyebut harga — ia bukan barang dagangan, dan angka
    // yang menempel padanya akan dibaca sebagai "harga sewa meja".
    const judul=(o.kind==='table'?'Meja ':'Kursi ')+(o.label||'')
      +(o.dijual?' · '+(o.tier||'')+(o.price?' · '+rp(o.price):''):'')
      +' · '+labelStatus(o.status);
    return '<div class="'+kelas+'" style="'+gaya+'" title="'+esc(judul)+'"'
      +(bisa?' onclick="ketukTempat(\'PENANDA_ID\')"'.replace('PENANDA_ID',escJsId(o.id)):'')+'>'
      +esc(o.label||'')+((o.dijual&&+o.capacity>1)?'<small>'+o.capacity+' pax</small>':'')+'</div>';
  }).join('');

  pasangGerak(wrap);
  /* PERBESARAN & POSISI DIPERTAHANKAN.
     Memilih kursi menggambar ulang seluruh denah, dan dulu penggambaran itu
     selalu diakhiri "muat layar" — jadi tiap kali satu kursi diketuk, denahnya
     melompat kembali ke tampilan penuh dan pembeli harus memperbesar lagi dari
     awal untuk memilih kursi kedua di sebelahnya. Menyakitkan justru pada
     pekerjaan yang paling sering dilakukan: memilih beberapa kursi berdekatan.

     Yang menentukan bukan "sudah pernah digambar", melainkan APA yang digambar:
     begitu lantainya berganti atau isinya berbeda, tampilan lama tidak lagi
     punya arti dan denahnya memang harus ditata ulang. */
  const kunci=LANTAI+'|'+its.length+'|'+Math.round(VIEW.w)+'x'+Math.round(VIEW.h);
  if(VIEW.kunci===kunci && VIEW.z>0){ terapkanView(); }
  else { VIEW.kunci=kunci; muatLayar(); }
}
function escJsId(x){ return esc(String(x)).replace(/'/g,'&#39;'); }

/* Perbesaran terkecil = pas satu layar; terbesar 3x ukuran asli. Batas bawahnya
   DIHITUNG, bukan dipatok: denah kecil tidak perlu diperkecil sama sekali. */
function zMin(){
  const wrap=$('#denahWrap'); if(!wrap||!VIEW.w) return 0.2;
  const W=wrap.clientWidth||360, H=wrap.clientHeight||360;
  return Math.min(1, Math.min((W-16)/VIEW.w, (H-16)/VIEW.h));
}
window.muatLayar=()=>{
  const wrap=$('#denahWrap'); if(!wrap) return;
  VIEW.z=zMin();
  VIEW.x=((wrap.clientWidth||0)  - VIEW.w*VIEW.z)/2;
  VIEW.y=((wrap.clientHeight||0) - VIEW.h*VIEW.z)/2;
  terapkanView();
};
window.zoomDenah=(arah)=>{
  const wrap=$('#denahWrap'); if(!wrap) return;
  // Diperbesar dari TENGAH jendela, bukan dari pojok — kalau dari pojok, bagian
  // yang sedang dilihat langsung terlempar keluar layar.
  ubahZoom(VIEW.z*(arah>0?1.35:1/1.35), (wrap.clientWidth||0)/2, (wrap.clientHeight||0)/2);
};
function ubahZoom(zBaru, px, py){
  const z=Math.max(zMin(), Math.min(3, zBaru));
  // Titik di bawah jari/kursor harus tetap berada di bawah jari/kursor.
  VIEW.x = px - (px - VIEW.x) * (z/VIEW.z);
  VIEW.y = py - (py - VIEW.y) * (z/VIEW.z);
  VIEW.z = z;
  terapkanView();
}
/* Denah tidak boleh bisa digeser sampai hilang dari layar. Kalau isinya lebih
   kecil dari jendela ia ditengahkan; kalau lebih besar, geserannya dibatasi
   supaya tepinya tidak pernah masuk melewati tepi jendela. */
function rapikanGeser(){
  const wrap=$('#denahWrap'); if(!wrap) return;
  const lw=VIEW.w*VIEW.z, lh=VIEW.h*VIEW.z;
  const W=wrap.clientWidth||0, H=wrap.clientHeight||0;
  if(!W||!H) return;
  VIEW.x = lw<=W ? (W-lw)/2 : Math.min(0, Math.max(W-lw, VIEW.x));
  VIEW.y = lh<=H ? (H-lh)/2 : Math.min(0, Math.max(H-lh, VIEW.y));
}
function terapkanView(){
  const box=$('#denah'); if(!box) return;
  rapikanGeser();
  box.style.transform='translate('+VIEW.x+'px,'+VIEW.y+'px) scale('+VIEW.z+')';
}

function pasangGerak(wrap){
  if(!wrap || wrap._gerakTerpasang) return;
  wrap._gerakTerpasang=true;
  const jari=new Map();
  let mulaiJarak=0, mulaiZ=1, mulaiTitik=null, geserDari=null, bergerak=0;

  const kumpul=()=>Array.from(jari.values());
  const titikTengah=()=>{
    const a=kumpul(), r=wrap.getBoundingClientRect();
    return {x:(a[0].x+a[1].x)/2-r.left, y:(a[0].y+a[1].y)/2-r.top};
  };
  const jarak=()=>{
    const a=kumpul();
    return Math.hypot(a[0].x-a[1].x, a[0].y-a[1].y);
  };

  wrap.addEventListener('pointerdown', e=>{
    jari.set(e.pointerId,{x:e.clientX,y:e.clientY});
    /* JANGAN setPointerCapture UNTUK SATU JARI.
       Menangkap pointer memindahkan sasaran event berikutnya — termasuk `click`
       — ke elemen penangkapnya. Akibatnya ketukan pada kursi mendarat di kotak
       denah, bukan di kursinya, dan onclick kursi tidak pernah jalan: denah
       tampak hidup (bisa digeser & dicubit) tapi tidak bisa dipesan sama
       sekali. Dilaporkan 3 Agustus 2026, tepat setelah cubit-geser dipasang.

       Penangkapan hanya dipakai saat jari KEDUA menempel, yaitu saat gerakannya
       sudah pasti mencubit dan tidak ada klik yang perlu diteruskan. */
    if(jari.size===2 && wrap.setPointerCapture){
      jari.forEach((v,id)=>{ try{ wrap.setPointerCapture(id); }catch(_){} });
    }
    bergerak=0; _geserJauh=false;
    if(jari.size===1) geserDari={x:e.clientX-VIEW.x, y:e.clientY-VIEW.y};
    else if(jari.size===2){ mulaiJarak=jarak(); mulaiZ=VIEW.z; mulaiTitik=titikTengah(); geserDari=null; }
  });
  wrap.addEventListener('pointermove', e=>{
    if(!jari.has(e.pointerId)) return;
    const lama=jari.get(e.pointerId);
    bergerak+=Math.hypot(e.clientX-lama.x, e.clientY-lama.y);
    jari.set(e.pointerId,{x:e.clientX,y:e.clientY});
    /* Ambang 8px memisahkan MENGETUK dari MENGGESER. Tanpa itu, jari yang
       bergeser satu-dua piksel saat mengetuk kursi ikut terbaca sebagai
       geseran, dan kursinya tidak pernah terpilih. */
    if(bergerak>8) _geserJauh=true;
    if(jari.size===2 && mulaiJarak>0){
      ubahZoom(mulaiZ*(jarak()/mulaiJarak), mulaiTitik.x, mulaiTitik.y);
    }else if(jari.size===1 && geserDari){
      VIEW.x=e.clientX-geserDari.x; VIEW.y=e.clientY-geserDari.y;
      terapkanView();
    }
    if(e.cancelable) e.preventDefault();
  }, {passive:false});
  const lepas=e=>{
    jari.delete(e.pointerId);
    if(jari.size<2) mulaiJarak=0;
    if(jari.size===1){ const a=kumpul()[0]; geserDari={x:a.x-VIEW.x, y:a.y-VIEW.y}; }
    if(jari.size===0){
      geserDari=null;
      /* Penanda "tadi menggeser" dipadamkan SESUDAH klik sempat diproses,
         supaya kursi yang kebetulan ada di bawah jari saat geseran berakhir
         tidak ikut terpilih. */
      setTimeout(()=>{ _geserJauh=false; }, 60);
    }
  };
  wrap.addEventListener('pointerup', lepas);
  wrap.addEventListener('pointercancel', lepas);
  /* Jari yang diangkat DI LUAR kotak denah tidak mengirim pointerup ke kotak
     itu — tanpa penadah di window, keadaannya tertinggal "sedang menggeser" dan
     ketukan berikutnya diabaikan diam-diam. */
  window.addEventListener('pointerup', lepas);
  window.addEventListener('pointercancel', lepas);
  wrap.addEventListener('wheel', e=>{
    if(e.cancelable) e.preventDefault();
    const r=wrap.getBoundingClientRect();
    ubahZoom(VIEW.z*(e.deltaY<0?1.12:1/1.12), e.clientX-r.left, e.clientY-r.top);
  }, {passive:false});
  // HP diputar / jendela berubah ukuran → denah ditata ulang agar tetap muat.
  window.addEventListener('resize', ()=>{ clearTimeout(wrap._rz); wrap._rz=setTimeout(terapkanView,150); });
}

function labelStatus(s){ return {available:'tersedia',mine:'pilihanmu',held:'sedang dipilih orang lain',
  sold:'terjual',checked:'sudah check-in',area:'area',perabot:'meja (bukan tiket)'}[s]||s; }
function warnaMuda(hex){ const c=hex2rgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+',.22)'; }
function kontras(hex){ const c=hex2rgb(hex);
  return (c[0]*299+c[1]*587+c[2]*114)/1000 > 150 ? '#2A2620' : '#fff'; }
function hex2rgb(h){ h=String(h||'').replace('#','');
  if(h.length===3) h=h.split('').map(x=>x+x).join('');
  if(!/^[0-9a-f]{6}$/i.test(h)) return [169,121,31];
  return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }

/* Menekan tempat: kalau sudah jadi pilihan kita, dilepas; kalau belum,
   ditahan di server dulu. Yang menentukan berhasil atau tidak selalu
   jawaban server — bukan tampilan di layar, yang bisa saja sudah basi. */
window.ketukTempat = async (seatId)=>{
  /* Geseran yang berakhir di atas kursi BUKAN pilihan. Tanpa penjaga ini, tiap
     kali pembeli menggeser denah, kursi yang kebetulan ada di bawah jarinya
     saat jari diangkat ikut terkunci 10 menit. */
  if(_geserJauh) return;
  const o=DENAH.find(x=>x.id===seatId); if(!o) return;
  /* MODE UPGRADE: mengetuk kursi berarti MEMINDAHKAN tiket, bukan menambah
     keranjang. Kursinya tidak ditahan lewat jalur keranjang — penguncian
     dikerjakan server saat upgrade dimulai, dan menahannya dua kali dengan dua
     token berbeda justru membuat kursi itu bentrok dengan dirinya sendiri. */
  if(UPG) return ketukUpgrade(o);
  if(o.status==='mine'){
    try{ await api('release',{hold_token:Beli.holdToken, seats:[seatId]}); }
    catch(e){ return toast(e.message,'err'); }
    o.status='available';
    Beli.items=Beli.items.filter(i=>i.seat_id!==seatId);
    if(!Beli.items.length) Beli.stop();
    return gambarDenah();
  }
  let r;
  try{ r = await api('hold',{event_id:Beli.eventId, seats:[seatId], hold_token:Beli.holdToken}); }
  catch(e){ return toast(e.message,'err'); }
  Beli.simpanToken(r.hold_token);
  if(!r.held.length){
    const sebab=(r.ditolak[0]||[])[1]||'tidak bisa dipilih';
    toast('Tempat '+(o.label||'')+' '+sebab+'.','warn');
    // Denah disegarkan supaya pembeli langsung melihat keadaan yang benar,
    // bukan tetap melihat kotak hijau yang ternyata sudah bukan miliknya.
    DENAH = await api('action=denah&id='+encodeURIComponent(Beli.eventId)+'&hold='+encodeURIComponent(Beli.holdToken));
    return gambarDenah();
  }
  o.status='mine';
  /* kind & capacity ikut disimpan karena ringkasan harus bisa mengatakan
     "1 meja = 6 tiket" SEBELUM orang membayar. Server menghitung ulang
     angka yang sama dari denah saat checkout — ini cuma untuk ditampilkan. */
  Beli.items.push({seat_id:o.id,label:o.label,tier:o.tier,price:o.price,
                   kind:o.kind,pax:(o.kind==='table'?Math.max(1,+o.capacity||1):1)});
  Beli.habis=r.expires_at; Beli.mulaiJam();
  gambarDenah();
};

/* Penunjuk langkah. Tiga kata, bukan tiga kalimat: yang dijawab cuma satu
   pertanyaan — "masih berapa lama lagi sampai selesai?". Pertanyaan itu yang
   membuat orang bertahan di layar berikutnya. */
function langkahHTML(n){
  const L=['Pilih tiket','Data pemesan','Bayar'];
  return '<div class="langkah">'+L.map(function(t,i){
    const ke=i+1;
    return (i?'<span class="garis"></span>':'')
      +'<div class="'+(ke===n?'on':(ke<n?'sudah':''))+'"><i>'+(ke<n?'✓':ke)+'</i>'+t+'</div>';
  }).join('')+'</div>';
}

window.toggleBar=()=>{ BAR_BUKA=!BAR_BUKA; gambarBarHp(); };
/* BAR BAWAH = RINGKASAN YANG SELALU TERJANGKAU.
   Di HP kolom ringkasan ada di dasar halaman: untuk mengeceknya, pembeli harus
   meninggalkan denah, menggulir, lalu menggulir balik. Sekarang isinya bisa
   ditarik naik dari bar yang memang selalu menempel di bawah layar — dan bar
   yang sama ikut hadir di layar Data pemesan, tempat tombol bayarnya dulu
   berada jauh di bawah formulir. */
function gambarBarHp(){
  const s=$('#barhp'); if(!s) return;
  const h=location.hash;
  const diDenah=h.indexOf('#denah')===0, diEvent=h.indexOf('#event/')===0, diCheckout=h.indexOf('#checkout')===0;
  if(!(diDenah||diEvent||diCheckout) || Beli.kosong()){ s.innerHTML=''; BAR_BUKA=false; return; }

  const rincian=Beli.items.map(i=>'<div class="pilih"><div><b>'+esc(i.label||'Tempat')+'</b>'
      +'<div class="mini">'+esc(i.tier||'')+'</div></div>'
      +'<div style="display:flex;align-items:center;gap:8px"><span class="mono">'+rp(i.price)+'</span>'
      +'<button class="rm" title="Lepas" onclick="event.stopPropagation();ketukTempat(\''+esc(i.seat_id)+'\')">×</button></div></div>').join('')
    +Beli.umum.map(u=>'<div class="pilih"><div><b>'+esc(u.nama)+'</b>'
      +'<div class="mini">'+u.qty+' tiket · '+rp(u.price)+' per tiket</div></div>'
      +'<div style="display:flex;align-items:center;gap:8px"><span class="mono">'+rp(u.price*u.qty)+'</span>'
      +'<button class="rm" title="Hapus" onclick="event.stopPropagation();hapusUmum(\''+esc(u.class_id)+'\')">×</button></div></div>').join('');

  const tombol = diCheckout
    ? '<button class="btn btn-pri" onclick="kirimCheckout()">Bayar</button>'
    : '<button class="btn btn-pri" onclick="go(\'checkout\',Beli.eventId)">Lanjut</button>';

  /* YANG BISA DIKETUK UNTUK MEMBUKA RINCIAN HANYA SISI KIRINYA.
     Dulu penangan ketuk dipasang di SELURUH baris, dan tombol Bayar duduk di
     dalam baris itu — jadi menekan Bayar ikut menggelembung ke induknya dan
     yang terjadi malah rincian kursi buka-tutup. Tombolnya jalan, tapi
     pembelinya tidak pernah tahu, karena layarnya cuma berkedip.
     Dilaporkan 3 Agustus 2026. */
  s.innerHTML='<div class="bar-hp">'
    +'<div class="isi'+(BAR_BUKA?' on':'')+'">'+rincian+'</div>'
    +'<div class="r">'
      +'<div class="i buka" onclick="toggleBar()"><span class="tarik">'+Beli.pax()+' tiket '
        +'<b style="font-weight:700">'+(BAR_BUKA?'▾ tutup':'▴ lihat')+'</b></span>'
      +'<b>'+rp(Beli.total())+'</b></div>'
      +tombol
    +'</div></div>';
}


/* ---------- 4. DATA PEMESAN ---------- */
Layar.checkout = (id)=>{
  // Dipulangkan ke halaman EVENT, bukan ke denah: event standing tidak punya
  // denah sama sekali, dan mengirim orang ke halaman kosong sebagai jawaban
  // atas "belum ada yang dipilih" hanya menambah kebingungan.
  if(Beli.kosong()){ toast('Pilih tiketnya dulu.','warn'); return go('event',id||Beli.eventId); }
  /* WAJIB MASUK SEBELUM MEMBELI.
     Tiket harus tercatat atas nama seseorang: itu yang membuat "Tiket Saya"
     berguna, membuat tiket bisa dibuka lagi dari HP lain, dan membuat kru punya
     cara mengenali pemiliknya kalau QR-nya hilang. Pemeriksaannya juga ada di
     server (checkout menolak sesi kosong) — penjaga di layar ini hanya supaya
     orangnya tidak mengisi formulir panjang dulu baru ditolak. */
  if(!Akun.masuk()){
    Beli.simpanIsian();
    SETELAH_MASUK='checkout';
    toast('Masuk dulu, ya','Tiketnya dicatat atas nama akunmu supaya bisa dibuka lagi kapan saja. Kursimu tetap ditahan.','warn');
    return go('masuk');
  }
  Beli.eventId = id||Beli.eventId;
  /* Isian diisikan dari akun kalau pembelinya sedang masuk dan belum pernah
     mengetik apa pun. Tidak menimpa yang sudah diketik — orang boleh membeli
     atas nama orang lain, dan menimpanya diam-diam akan mengirim tiket ke
     alamat yang salah. */
  if(Akun.masuk()){
    const i=Beli.isian;
    if(!i.nama)  i.nama  = Akun.user.name  || '';
    if(!i.email) i.email = Akun.user.email || '';
    if(!i.hp)    i.hp    = Akun.user.phone || '';
  }
  $('#app').innerHTML=
    '<div class="crumb"><button onclick="go(\'event\',\''+esc(Beli.eventId)+'\')">Pilih tiket</button> › <span>Data pemesan</span></div>'
   +langkahHTML(2)
   +'<div class="dua"><div class="card sec">'
     +'<h2>Data pemesan</h2>'
     +'<p class="mini" style="margin-bottom:14px">E-ticket dikirim ke email ini, jadi pastikan benar.</p>'
     +'<div class="field"><label>Nama lengkap *</label><input id="f-nama" autocomplete="name" placeholder="Nama sesuai identitas" value="'+esc(Beli.isian.nama)+'"></div>'
     +'<div class="field"><label>Email *</label><input id="f-email" type="email" autocomplete="email" placeholder="email@contoh.com" value="'+esc(Beli.isian.email)+'"></div>'
     +'<div class="field"><label>Nomor HP / WhatsApp *</label><input id="f-hp" autocomplete="tel" placeholder="08xxxxxxxxxx" value="'+esc(Beli.isian.hp)+'"></div>'
     +'<label class="cek"><input type="checkbox" id="f-setuju"> <span>Saya menyetujui syarat &amp; ketentuan dan kebijakan refund Laksamana Muda.</span></label>'
   +'</div><aside>'+ringkasHTML('Lanjut ke pembayaran','kirimCheckout()')+'</aside></div>';
  if(Beli.items.length) Beli.mulaiJam();
};
window.kirimCheckout = async ()=>{
  const nama=$('#f-nama').value.trim(), email=$('#f-email').value.trim(), hp=$('#f-hp').value.trim();
  if(!nama||!email||!hp) return toast('Lengkapi nama, email, dan nomor HP.','warn');
  if(!/^\S+@\S+\.\S+$/.test(email)) return toast('Format email belum benar.','warn');
  if(!$('#f-setuju').checked) return toast('Setujui syarat & ketentuan dulu.','warn');
  const tombol=document.querySelector('.sum .btn-pri');
  tombol.disabled=true; tombol.innerHTML='<span class="spinner"></span> Menyiapkan pembayaran…';
  let r;
  try{
    r = await api('checkout',{event_id:Beli.eventId, hold_token:Beli.holdToken,
                              name:nama, email:email, phone:hp, sesi:Akun.sesi,
                              // Yang dikirim cuma kategori + jumlah. Harganya
                              // dihitung ulang server dari database.
                              umum:Beli.umum.map(u=>({class_id:u.class_id, qty:u.qty}))});
  }catch(e){
    tombol.disabled=false; tombol.textContent='Lanjut ke pembayaran';
    return toast(e.message,'err');
  }
  Beli.stop();
  // Keranjang reguler dikosongkan begitu pesanannya jadi; kalau tidak, pembeli
  // yang kembali ke halaman event masih melihat 3 tiket "belum dibayar" yang
  // sebenarnya sudah punya invoice sendiri.
  Beli.umum=[];
  // Tautan e-ticket disimpan lokal SEBELUM berpindah ke halaman bayar.
  // Kalau tidak, pembeli yang menutup tab di tengah pembayaran kehilangan
  // satu-satunya jalan kembali ke tiketnya.
  simpanTiketku(r.ref, r.access_token);
  location.href = r.invoice_url;
};

/* Riwayat tiket di perangkat ini. Bukan akun — situs ini sengaja tanpa
   login: memaksa orang mendaftar hanya untuk membeli satu tiket adalah
   cara paling efektif membuat mereka batal. */
function simpanTiketku(ref, token){
  let arr=[]; try{ arr=JSON.parse(localStorage.getItem('lmtix_saya')||'[]'); }catch(e){}
  if(!arr.some(x=>x.ref===ref)) arr.unshift({ref, token, at:Date.now()});
  try{ localStorage.setItem('lmtix_saya', JSON.stringify(arr.slice(0,30))); }catch(e){}
}

/* ---------- MASUK & DAFTAR ----------
   Satu layar dengan dua mode, bukan dua halaman. Orang yang salah masuk ke
   "daftar" padahal sudah punya akun cukup menekan satu tautan, tanpa
   kehilangan apa yang sudah diketik. */
let modeDaftar=false;
/* Ke mana harus kembali sesudah masuk. Diisi saat pembeli dihentikan di tengah
   alur beli (lihat Layar.checkout). */
let SETELAH_MASUK=null;
Layar.masuk = ()=>{
  if(Akun.masuk()) return go('tiketsaya');
  $('#app').innerHTML='<div class="tengah" style="max-width:400px">'
   +'<div class="card sec">'
     +'<h1 style="font-size:22px;margin-bottom:4px">'+(modeDaftar?'Buat Akun':'Masuk')+'</h1>'
     +'<p class="mini" style="margin-bottom:16px">'+(modeDaftar
        ? 'Supaya tiketmu tersimpan dan bisa dibuka dari perangkat mana pun.'
        : 'Masuk untuk melihat tiket yang pernah kamu beli.')+'</p>'
     +(modeDaftar?'<div class="field"><label>Nama Lengkap *</label><input id="a-nama" autocomplete="name"></div>':'')
     +'<div class="field"><label>Email *</label><input id="a-email" type="email" autocomplete="email"></div>'
     +(modeDaftar?'<div class="field"><label>Nomor HP / WhatsApp</label><input id="a-hp" autocomplete="tel"></div>':'')
     +'<div class="field"><label>Password *</label><input id="a-pass" type="password" autocomplete="'+(modeDaftar?'new-password':'current-password')+'">'
       +(modeDaftar?'<div class="mini">Minimal 8 karakter.</div>':'')+'</div>'
     +'<button class="btn btn-pri btn-block" id="a-go">'+(modeDaftar?'Daftar':'Masuk')+'</button>'
     +(modeDaftar?'':'<p class="mini" style="text-align:center;margin-top:10px">'
        +'<a href="#lupa" onclick="go(\'lupa\');return false;">Lupa password?</a></p>')
     +'<p class="mini" style="text-align:center;margin-top:12px">'
       +(modeDaftar?'Sudah punya akun? ':'Belum punya akun? ')
       +'<a href="#masuk" onclick="modeDaftar='+(!modeDaftar)+';Layar.masuk();return false;"><b>'
       +(modeDaftar?'Masuk':'Buat akun')+'</b></a></p>'
     +'<p class="mini" style="text-align:center;margin-top:10px">Tiket dicatat atas nama akunmu, jadi bisa dibuka lagi kapan pun dari perangkat mana pun.</p>'
   +'</div></div>';
  $('#a-go').onclick=kirimAkun;
  ['a-nama','a-email','a-hp','a-pass'].forEach(function(id){
    const el=$('#'+id); if(el) el.addEventListener('keydown',function(e){ if(e.key==='Enter') kirimAkun(); });
  });
};
async function kirimAkun(){
  const g=id=>{ const el=$('#'+id); return el?el.value.trim():''; };
  const email=g('a-email'), pass=$('#a-pass').value;
  if(!email||!pass) return toast('Email dan password wajib diisi.','warn');
  if(modeDaftar && !g('a-nama')) return toast('Nama wajib diisi.','warn');
  const b=$('#a-go'); b.disabled=true; b.innerHTML='<span class="spinner"></span> Memproses\u2026';
  let r;
  try{
    r = modeDaftar
      ? await api('daftar',{name:g('a-nama'),email,phone:g('a-hp'),password:pass})
      : await api('masuk',{email,password:pass});
  }catch(e){
    b.disabled=false; b.textContent=modeDaftar?'Daftar':'Masuk';
    return toast(e.message,'err');
  }
  Akun.simpan(r.token, r.user);
  gambarTopnav();
  toast(modeDaftar?'Akun dibuat. Selamat datang!':'Berhasil masuk.','ok');
  /* Kembali ke tempat yang ditinggalkan, bukan selalu ke Tiket Saya. Orang yang
     dihentikan di tengah pembelian sedang memegang kursi yang berhitung mundur —
     melemparnya ke halaman riwayat berarti ia harus mencari jalan sendiri
     kembali ke denah sebelum kuncinya habis. */
  const balik=SETELAH_MASUK; SETELAH_MASUK=null;
  if(balik){ location.hash=balik; dariHash(); return; }
  go('tiketsaya');
}
