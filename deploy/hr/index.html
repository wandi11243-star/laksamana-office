function renderKehadiran(c, mk){
  const bulan = (S.attendance||{})[mk];
  const boleh = can('inputKpi');
  let html = '<div class="toolbar">'+monthPicker('khMonth', mk)+'<span class="sp"></span>'+
    (boleh?'<button class="btn btn-pri btn-sm" onclick="APP.openAttImport()">↑ Unggah Report Talenta</button>':'')+
    (boleh&&bulan?'<button class="btn btn-line btn-sm" onclick="APP.hapusAttBulan(\''+mk+'\')">Hapus bulan ini</button>':'')+
    '</div>';

  if(!bulan){
    html += '<div class="note">Belum ada report absensi untuk '+esc(fmtMonth(mk))+'.'+
      (boleh?' Unggah berkas <b>export_report_attendance.xlsx</b> dari Talenta lewat tombol di atas.':'')+'</div>';
    // Bulan lain yang sudah ada, supaya tidak terlihat seperti fitur mati.
    const ada = Object.keys(S.attendance||{}).sort();
    if(ada.length) html += '<div class="hint">Bulan yang sudah ada: '+ada.map(m=>'<a href="#" onclick="APP.gotoKehadiran(\''+m+'\');return false">'+esc(fmtMonth(m))+'</a>').join(', ')+'.</div>';
    c.innerHTML = html;
    mpHandlers['khMonth'] = nv => renderKehadiran(c, nv);
    return;
  }

  /* Kehadiran memakai scopeAll, BUKAN scopeEmps: kehadiran itu catatan sejarah.
     Kru yang hari ini berstatus Nonaktif tetap benar-benar bekerja di bulan yang
     sedang dilihat, dan menyembunyikannya membuat halaman ini kosong justru
     setelah data berhasil diunggah — persis yang terjadi ketika seluruh akun
     didaftarkan dalam keadaan nonaktif.

     Gerbang siapa-lihat-siapa tetap ada: yang tanpa hak 'seeAll' hanya melihat
     dirinya sendiri, sama seperti scopeEmps(). Yang dilonggarkan cuma filter
     status Aktif. */
  const terlihat = can('seeAll')
    ? S.employees.filter(e=>e.appRole!=='ceo')
    : S.employees.filter(e=>CU && e.id===CU.id);
  const semua = terlihat.map(e=>({e, d: attendanceDetail(e.id, mk), kum: attendanceCumulative(e.id)}))
                        .filter(r=>r.d);
  // Yang tidak pernah tap dipisah ke bawah: mereka tidak punya skor, dan
  // mencampurnya ke ranking berarti membandingkan orang dengan data kosong.
  const rows   = semua.filter(r=>!r.d.noData).sort((a,b)=>b.d.score - a.d.score);
  const noData = semua.filter(r=>r.d.noData);

  const R = attRules();
  html += '<div class="note">Berkas <b>'+esc(bulan.fileName||'(tanpa nama)')+'</b>, diunggah '+
    esc(bulan.importedBy||'?')+(bulan.importedAt?' pada '+esc(String(bulan.importedAt).slice(0,10)):'')+'. '+
    rows.length+' kru dinilai. Toleransi terlambat '+(R.lateToleranceMin??15)+' menit, penalti penuh di '+
    (R.lateCapMin??45)+' menit, check-in tanpa check-out dihitung '+(R.noCheckoutCredit??0.5)+' hari. '+
    'Ubah di Pengaturan.</div>';

  // Sebulan tanpa satu pun tap: hampir pasti tidak memakai aplikasi absensi,
  // bukan bolos sebulan. Ditanyakan, bukan diam-diam diberi nilai nol.
  if(noData.length){
    html += '<div class="note w"><b>'+noData.length+' kru tidak punya satu pun check-in sepanjang '+esc(fmtMonth(mk))+'</b>: '+
      esc(noData.map(r=>r.e.name).join(', '))+'. Mereka <b>tidak diberi skor</b> karena pola ini biasanya berarti '+
      'yang bersangkutan tidak memakai aplikasi absensi, bukan tidak masuk kerja. Kalau memang benar-benar tidak masuk, '+
      'catat lewat modul Disiplin. Kalau ini masalah aplikasi, perbaiki di Talenta lalu unggah ulang bulan ini.</div>';
  }

  // Kru di berkas yang belum punya talenta_id di Office. Ditampilkan menonjol:
  // dibiarkan diam berarti skor mereka hilang tanpa ada yang sadar.
  if(bulan.unmatched && bulan.unmatched.length){
    html += '<div class="note w"><b>'+bulan.unmatched.length+' nama di berkas belum terhubung ke akun Office</b>, '+
      'jadi belum punya skor kehadiran: '+esc(bulan.unmatched.map(u=>u.name+' ('+u.talentaId+')').join(', '))+'. '+
      'Isi <b>Talenta ID</b> orang tersebut di Office &gt; Kelola User, lalu buka halaman ini lagi. '+
      'Data harian mereka sudah tersimpan, jadi tidak perlu unggah ulang.</div>';
  }

  html += '<table class="tbl"><thead><tr><th>#</th><th>Kru</th><th>Divisi</th>'+
    '<th class="num">Hari kerja</th><th class="num">Hadir</th><th class="num">Alpa</th>'+
    '<th class="num">Telat</th><th class="num">Tanpa out</th>'+
    '<th class="num">Presensi</th><th class="num">Ketepatan</th><th>Skor bulan</th><th>Kumulatif</th><th></th></tr></thead><tbody>';
  const baris = (r, rank) => {
    const d = r.d, kosong = d.noData;
    return '<tr'+(kosong?' style="opacity:.55"':'')+'><td class="mono">'+(rank||'–')+'</td>'+
      '<td><b>'+esc(r.e.name)+'</b><div class="xs mut">'+esc(r.e.role||'')+'</div></td>'+
      '<td class="small">'+esc(divName(r.e.divId))+'</td>'+
      '<td class="num">'+d.hariKerja+'</td>'+
      '<td class="num">'+fmtNum(d.kredit)+'</td>'+
      '<td class="num'+(d.alpa?'':' mut')+'">'+(d.alpa||'–')+'</td>'+
      '<td class="num'+(d.telat?'':' mut')+'">'+(d.telat||'–')+'</td>'+
      '<td class="num'+(d.tanpaCheckout?'':' mut')+'">'+(d.tanpaCheckout||'–')+'</td>'+
      '<td class="num'+(kosong?' mut':'')+'">'+(kosong?'–':fmtNum(d.presence))+'</td>'+
      '<td class="num'+(kosong?' mut':'')+'">'+(kosong?'–':fmtNum(d.punctuality))+'</td>'+
      '<td style="min-width:110px">'+(kosong?'<span class="xs mut">tidak pernah tap</span>':barHtml(d.score))+'</td>'+
      '<td class="num">'+(r.kum?fmtNum(r.kum.score)+'<div class="xs mut">'+r.kum.bulan+' bln</div>':'–')+'</td>'+
      '<td><button class="btn btn-line btn-xs" onclick="APP.openAttDetail(\''+r.e.id+'\',\''+mk+'\')">Rincian</button></td></tr>';
  };
  rows.forEach((r,i)=>{ html += baris(r, i+1); });
  noData.forEach(r=>{ html += baris(r, null); });
  if(!semua.length) html += '<tr><td colspan="13" class="mut small" style="text-align:center;padding:20px">Tidak ada kru yang cocok dengan berkas ini. Periksa pemetaan Talenta ID di Office.</td></tr>';
  html += '</tbody></table>';
  html += '<div class="hint"><b>Presensi</b> = hari hadir dibagi hari kerja (check-in tanpa check-out dihitung '+(R.noCheckoutCredit??0.5)+'). '+
    '<b>Ketepatan</b> = 100 dikurangi penalti terlambat. Hari libur, cuti, dan izin dalam jatah '+
    'tidak masuk hitungan sama sekali. Izin melebihi jatah (I maks '+((R.excusedCaps||{}).I??3)+', S maks '+
    ((R.excusedCaps||{}).S??2)+') dihitung sebagai alpa.</div>';
  c.innerHTML = html;
  mpHandlers['khMonth'] = nv => renderKehadiran(c, nv);
}

/* Unggah. Pencocokan HANYA lewat talenta_id — sengaja tidak menebak dari nama.
   Nama di Talenta dan di Office sering beda ('M. Rizki Arfan' vs 'Rizki Arfan'),
   dan salah tebak berarti absensi orang lain masuk ke skor seseorang. Yang
   tidak cocok dilaporkan, bukan ditebak. */
function openAttImport(){
  const body = '<div class="note">Pilih berkas <b>export_report_attendance.xlsx</b> dari Talenta. '+
    'Satu berkas berisi satu bulan; bulannya dibaca dari isi berkas, bukan dari namanya.</div>'+
    '<input type="file" id="attFile" accept=".xlsx" style="width:100%;padding:10px">'+
    '<div id="attHasil" style="margin-top:12px"></div>';
  openModal('Unggah Report Kehadiran', body, {wide:true, saveLabel:'Proses', onSave:()=>{
    const f = $('#attFile').files[0];
    if(!f){ toast('Pilih berkas dulu.', true); return false; }
    prosesAttFile(f);
    return false;   // modal ditutup sendiri setelah pratinjau dikonfirmasi
  }});
}

async function prosesAttFile(file){
  const box = $('#attHasil');
  box.innerHTML = '<div class="small mut">Membaca berkas…</div>';
  let baris;
  try{ baris = await parseTalentaXlsx(file); }
  catch(err){ box.innerHTML = '<div class="note e">'+esc(err.message)+'</div>'; return; }

  // Bulan diambil dari tanggal terbanyak, bukan dari baris pertama: ekspor
  // kadang menyertakan satu-dua hari bulan sebelah di tepi periode.
  const hitung = {};
  baris.forEach(b=>{ const m = b.date.slice(0,7); hitung[m] = (hitung[m]||0)+1; });
  const mk = Object.keys(hitung).sort((a,b)=>hitung[b]-hitung[a])[0];

  // Resign dibuang di sini, bukan saat menghitung: mereka tidak akan pernah
  // dinilai, jadi menyimpan barisnya hanya memperbesar data tanpa guna.
  const aktif = baris.filter(b=>String(b.resign||'').toLowerCase() !== 'resigned');
  const nResign = baris.length - aktif.length;

  const byTid = {};
  S.employees.forEach(e=>{ if(e.talentaId) byTid[String(e.talentaId)] = e; });

  const unmatched = {};
  const days = aktif.map(b=>{
    const e = byTid[b.talentaId];
    if(!e) unmatched[b.talentaId] = {talentaId:b.talentaId, name:b.name, org:b.org};
    return { talentaId:b.talentaId, empId: e?e.id:'', date:b.date, shift:b.shift,
             code:b.code, timeOff:b.timeOff, checkIn:b.checkIn, checkOut:b.checkOut,
             lateMin:b.lateMin, org:b.org, name:b.name };
  });
  const takCocok = Object.values(unmatched);
  const cocok = new Set(days.filter(d=>d.empId).map(d=>d.empId)).size;
  const sudahAda = !!(S.attendance||{})[mk];

  let h = '<div class="note'+(sudahAda?' w':'')+'"><b>'+esc(fmtMonth(mk))+'</b> — '+days.length+' baris harian, '+
    cocok+' kru cocok'+(nResign?', '+nResign+' baris kru resign dilewati':'')+'.'+
    (sudahAda?' <b>Bulan ini sudah pernah diunggah dan akan diganti.</b>':'')+'</div>';
  if(takCocok.length){
    h += '<div class="note w"><b>'+takCocok.length+' nama belum punya Talenta ID di Office</b> — '+
      'boleh tetap disimpan, skornya menyusul begitu dipetakan:<br>'+
      esc(takCocok.map(u=>u.name+' ('+u.talentaId+')').join(', '))+'</div>';

  if(!cocok){
    h += '<div class="note e">Tidak ada satu pun kru yang cocok. Isi kolom <b>Talenta ID</b> di Office &gt; Kelola User lebih dulu, kalau tidak seluruh berkas ini tidak akan berpengaruh ke skor siapa pun.</div>';

  // Ditahan sampai dikonfirmasi, supaya pratinjau benar-benar berarti.

}
let PENDING_ATT = null;

function simpanAttImport(){
  if(!PENDING_ATT) return;
  const p = PENDING_ATT;
  S.attendance = S.attendance || {};
  S.attendance[p.mk] = { fileName:p.fileName, importedAt:new Date().toISOString(),
                         importedBy: CU?CU.name:'', unmatched:p.unmatched, days:p.days };
  log('ATT_IMPORT', p.mk+' — '+p.days.length+' baris, '+p.fileName);
  PENDING_ATT = null;

  save('Kehadiran '+fmtMonth(p.mk)+' tersimpan.');

}

RENDER.kpi = function(c){ renderKpi(c, monthKey()); };
function renderKpi(c, mk){
  let html = '<div class="toolbar">'+monthPicker('kpiMonth', mk)+'<span class="sp"></span>'+
    (can('manageSettings')?'<button class="btn btn-line btn-sm" onclick="APP.editKpiTemplate()">✎ Edit Template KPI</button>':'')+'</div>';
  html += '<div class="note">KPI dinilai per divisi per bulan. Achievement dihitung otomatis dari target (cost/waste: makin rendah makin baik), dibatasi maks. 120%. Target awal adalah kalibrasi. Sesuaikan setelah 2-3 bulan data aktual.</div>';
  html += '<div class="cards g2">';
  S.divisions.forEach(d=>{
    const t = kpiTemplateFor(d.id); if(!t) return;
    const acts = (S.kpiActuals[d.id]||{})[mk]||{};
    const ks = divKpiScore(d.id, mk);
    html += '<div class="card"><div class="flex"><h3 class="grow" style="margin:0">'+esc(d.name)+'</h3>'+
      (ks? '<span class="tag '+(ks.score>=100?'ok':ks.score>=85?'gold':'warn')+'">'+fmtNum(ks.score)+'</span>':'<span class="tag mut">belum diinput</span>')+
      (can('inputKpi')?'<button class="btn btn-pri btn-xs" onclick="APP.inputKpiActual(\''+d.id+'\')">Input</button>':'')+'</div>';
    html += '<table class="tbl" style="box-shadow:none;margin-top:8px"><thead><tr><th>Indikator</th><th class="num">Bobot</th><th class="num">Target</th><th class="num">Aktual</th><th class="num">Skor</th></tr></thead><tbody>';
    t.items.forEach(it=>{
      const a = acts[it.id], sc = kpiItemScore(it, a);
      html += '<tr><td>'+esc(it.name)+' <span class="xs mut">'+(it.dir==='down'?'↓':'↑')+'</span></td><td class="num">'+it.weight+'%</td><td class="num">'+fmtNum(it.target)+' '+esc(it.unit)+'</td><td class="num">'+(a!=null&&a!==''?fmtNum(a):'–')+'</td><td class="num">'+(sc!=null?'<b>'+fmtNum(sc)+'</b>':'–')+'</td></tr>';
    });
    html += '</tbody></table></div>';
  });
  html += '</div>';
  c.innerHTML = html;
  mpHandlers['kpiMonth'] = nv => renderKpi(c, nv);
}
function inputKpiActual(divId){
  const mk = $('#kpiMonth').value;
  const t = kpiTemplateFor(divId); if(!t) return;
  if(!can('seeAll') && CU.divId!==divId){ toast('Anda hanya bisa input KPI divisi sendiri.', true); return; }
  const acts = (S.kpiActuals[divId]||{})[mk]||{};
  let body = t.items.map(it=>'<div class="frow"><div><label>'+esc(it.name)+' ('+esc(it.unit)+'), target '+fmtNum(it.target)+'</label>'+
    '<input type="number" step="any" id="ka_'+it.id+'" value="'+(acts[it.id]??'')+'"></div><div style="align-self:end" class="xs mut">'+(it.dir==='down'?'Makin rendah makin baik':'Makin tinggi makin baik')+', bobot '+it.weight+'%</div></div>').join('');
  openModal('Input KPI '+divName(divId)+', '+fmtMonth(mk), body, {onSave:()=>{
    S.kpiActuals[divId] = S.kpiActuals[divId]||{};
    const o = S.kpiActuals[divId][mk] = S.kpiActuals[divId][mk]||{};
    t.items.forEach(it=>{ const v=$('#ka_'+it.id).value; if(v==='') delete o[it.id]; else o[it.id]=Number(v); });
    log('KPI_INPUT', divName(divId)+' '+mk); save('KPI tersimpan.');
    renderKpi($('#content'), mk);
  }});
}
function editKpiTemplate(){
  let body = '<div class="note w">Mengubah bobot/target berlaku untuk semua bulan (histori dihitung ulang). Ubah dengan sadar.</div>';

  const o = id ? S.okrs.find(x=>x.id===id) : {ownerType:'div', ownerId:'d_marketing', period:'Q3 2026', objective:'', krs:[{name:'',target:0,unit:'',progress:0}]};
  const krRows = (krs)=> krs.map((k,i)=>'<tr><td><input id="okr_kn_'+i+'" value="'+esc(k.name)+'" placeholder="Key result"></td><td><input type="number" step="any" style="width:80px" id="okr_kt_'+i+'" value="'+k.target+'"></td><td><input style="width:70px" id="okr_ku_'+i+'" value="'+esc(k.unit||'')+'" placeholder="unit"></td><td><input type="number" step="any" style="width:80px" id="okr_kp_'+i+'" value="'+k.progress+'"></td></tr>').join('');

    '<div><label>Divisi / Kru</label><span id="okr_ownerWrap"></span></div>'+
    '<div><label>Periode</label><input id="okr_period" value="'+esc(o.period)+'" placeholder="Q3 2026 / Jul 2026"></div></div>'+
    '<div class="frow f1"><div><label>Objective</label><input id="okr_obj" value="'+esc(o.objective)+'" placeholder="cth: Amankan 50 juta sponsorship untuk low season Sep–Nov"></div></div>'+
    '<label>Key Results</label><table class="tbl" style="box-shadow:none"><thead><tr><th>Nama</th><th>Target</th><th>Unit</th><th>Progress</th></tr></thead><tbody id="okr_krs">'+krRows(o.krs)+'</tbody></table>'+
    '<button class="btn btn-line btn-xs" style="margin-top:8px" id="okr_addKr">＋ Key Result</button>';
  openModal(id?'Edit OKR':'OKR Baru', body, {wide:true, onSave:()=>{
    const krs=[]; let i=0;
    while($('#okr_kn_'+i)){ const n=$('#okr_kn_'+i).value.trim(); if(n) krs.push({name:n, target:Number($('#okr_kt_'+i).value)||0, unit:$('#okr_ku_'+i).value, progress:Number($('#okr_kp_'+i).value)||0}); i++; }
    if(!$('#okr_obj').value.trim() || !krs.length){ toast('Objective dan minimal 1 key result wajib diisi.', true); return false; }
    const data = {ownerType:$('#okr_ot').value, ownerId:$('#okr_owner').value, period:$('#okr_period').value, objective:$('#okr_obj').value.trim(), krs};
    if(id) Object.assign(o, data); else S.okrs.push(Object.assign({id:uid('okr')}, data));
    log('OKR_SAVE', data.objective); save('OKR tersimpan.'); go('okr');
  }});
  const renderOwner = ()=>{
    const t = $('#okr_ot').value;
    $('#okr_ownerWrap').innerHTML = t==='div'

      : empSelect('okr_owner', activeEmps(), o.ownerId);

  renderOwner();

}

RENDER.review = function(c){ renderReview(c, monthKey()); };
function renderReview(c, mk){
  const emps = scopeEmps().filter(e=>e.appRole!=='ceo');
  const W = S.settings.reviewLayerWeights;
  let html = '<div class="toolbar">'+monthPicker('rvMonth', mk)+'<span class="sp"></span></div>';
  html += '<div class="note">Penilaian 12 aspek (skala 1–10), berlapis: Self ('+W.self+'%) → Manager ('+W.manager+'%) → HRD ('+W.hr+'%) → CEO ('+W.ceo+'%). Nilai akhir = rata-rata tertimbang layer yang sudah mengisi. Hasil review otomatis mengisi komponen Teamwork &amp; Inisiatif di People Score.</div>';
  html += '<table class="tbl"><thead><tr><th>Kru</th><th>Divisi</th><th>Self</th><th>Manager</th><th>HRD</th><th>CEO</th><th class="num">Nilai Akhir</th><th></th></tr></thead><tbody>';
  emps.forEach(e=>{
    const rv = S.reviews.find(r=>r.empId===e.id && r.month===mk);
    const layAvg = L => { if(!rv||!rv.layers[L]||!rv.layers[L].aspects) return null; const vs=Object.values(rv.layers[L].aspects).map(Number).filter(v=>!isNaN(v)); return vs.length?avg(vs):null; };
    const fin = reviewOverallScore(e.id, mk);
    html += '<tr><td><b>'+esc(e.name)+'</b></td><td class="small">'+esc(divName(e.divId))+'</td>'+
      lcell(layAvg('self'))+lcell(layAvg('manager'))+lcell(layAvg('hr'))+lcell(layAvg('ceo'))+
      '<td class="num">'+(fin!=null?'<b>'+fmtNum(fin)+'</b> '+gradeTag(fin):'–')+'</td>'+
      '<td><button class="btn btn-line btn-xs" onclick="APP.openReview(\''+e.id+'\',\''+mk+'\')">'+(rv?'Lihat / Isi':'Mulai')+'</button></td></tr>';
  });
  html += '</tbody></table>';
  c.innerHTML = html;
  mpHandlers['rvMonth'] = nv => renderReview(c, nv);
  function lcell(v){ return '<td>'+(v!=null?'<span class="tag '+(v>=8.5?'ok':v>=7?'gold':'warn')+'">'+fmtNum(v)+'</span>':'<span class="xs mut">–</span>')+'</td>'; }
}
function myLayer(empId){
  if(CU.appRole==='ceo') return 'ceo';
  if(CU.appRole==='hr') return 'hr';
  const e = empById(empId);
  if(CU.appRole==='manager' && e && e.divId===CU.divId && CU.id!==empId) return 'manager';
  if(CU.id===empId) return 'self';
  return null;
}
function openReview(empId, mk){
  const e = empById(empId);
  let rv = S.reviews.find(r=>r.empId===empId && r.month===mk);
  const L = myLayer(empId);
  if(!L){ toast('Anda tidak punya akses menilai kru ini.', true); return; }
  const cur = (rv && rv.layers[L]) ? rv.layers[L] : {aspects:{}, comment:''};
  let body = '<div class="note">Anda mengisi sebagai layer <b>'+({self:'Self Assessment',manager:'Atasan Langsung',hr:'HRD',ceo:'CEO'})[L]+'</b>. Skala 1–10.</div>';
  body += '<div class="cards g2">'+REVIEW_ASPECTS.map(a=>'<div class="flex"><label class="grow" style="margin:0">'+a+'</label><input type="number" min="1" max="10" style="width:70px" id="rv_'+a.replace(/\s/g,'')+'" value="'+(cur.aspects[a]??'')+'"></div>').join('')+'</div>';
  body += '<div style="margin-top:12px"><label>Komentar</label><textarea id="rv_comment" rows="3">'+esc(cur.comment||'')+'</textarea></div>';
  // Tampilkan layer lain (read-only)
  if(rv){
    const others = ['self','manager','hr','ceo'].filter(x=>x!==L && rv.layers[x] && rv.layers[x].aspects);
    if(others.length){
      body += '<div class="sec-title"><h3>Penilaian layer lain</h3></div><table class="tbl" style="box-shadow:none"><thead><tr><th>Aspek</th>'+others.map(o=>'<th>'+o.toUpperCase()+'</th>').join('')+'</tr></thead><tbody>'+
        REVIEW_ASPECTS.map(a=>'<tr><td>'+a+'</td>'+others.map(o=>'<td class="num">'+(rv.layers[o].aspects[a]??'–')+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
    }
  }
  openModal('Review '+e.name+', '+fmtMonth(mk), body, {wide:true, onSave:()=>{
    const aspects = {};
    let any=false;
    REVIEW_ASPECTS.forEach(a=>{ const v=$('#rv_'+a.replace(/\s/g,'')).value; if(v!==''){ aspects[a]=clamp(Number(v),1,10); any=true; } });
    if(!any){ toast('Isi minimal satu aspek.', true); return false; }
    if(!rv){ rv = {id:uid('rv'), empId, month:mk, layers:{}}; S.reviews.push(rv); }
    rv.layers[L] = {aspects, comment: $('#rv_comment').value, by: CU.id, at: todayStr()};
    log('REVIEW_SAVE', e.name+' '+mk+' ['+L+']'); save('Review tersimpan.');
    go('review');
  }});
}

/* Nomor sertifikat berikutnya untuk TAHUN sertifikat itu sendiri.
   Sebelumnya dipakai (trainingRecords.length + 1), yang salah karena:
   panjang array ikut menghitung yang GAGAL (jadi nomor melompat), dan menyusut
   saat record dihapus/impor (jadi nomor terpakai ulang, dua orang bisa dapat
   nomor sama). Di sini nomor diambil dari sertifikat yang BENAR-BENAR pernah
   terbit di tahun tsb, lalu diambil maksimum + 1, dan tetap dijaga unik. */
function nextCertNo(dateStr){
  const yr = (dateStr && dateStr.slice(0,4)) || String(new Date().getFullYear());
  const prefix = 'LM-CERT-' + yr + '-';
  const used = new Set(S.trainingRecords.map(r => r.certNo).filter(Boolean));
  let max = 0;
  used.forEach(no => {
    if(String(no).indexOf(prefix) !== 0) return;
    const n = parseInt(String(no).slice(prefix.length), 10);
    if(!isNaN(n) && n > max) max = n;
  });
  let n = max + 1, cand = prefix + String(n).padStart(3,'0');
  while(used.has(cand)){ n++; cand = prefix + String(n).padStart(3,'0'); }   // jaga-jaga
  return cand;
}
function recordTraining(trainingId){
  const t = S.trainings.find(x=>x.id===trainingId);
  const emps = t.divId==='all' ? activeEmps().filter(e=>e.appRole!=='ceo') : activeEmps().filter(e=>e.divId===t.divId);

    '<div class="hint">Status Lulus/Gagal otomatis dari passing grade ('+t.passingGrade+'). Lulus → sertifikat internal + '+S.settings.pointRules.trainingPass+' poin reward.</div>';
  openModal('Catat Hasil, '+t.title, body, {onSave:()=>{
    const empId = $('#trc_emp').value, sc = Number($('#trc_score').value);
    if(isNaN(sc)){ toast('Nilai wajib diisi.', true); return false; }

    S.trainingRecords.push(rec);
    if(lulus){ S.rewards.push({id:uid('rw'), empId, date:todayStr(), type:'earn', points:S.settings.pointRules.trainingPass, reason:'Lulus training: '+t.title}); }
    log('TRAINING_RECORD', (empById(empId)||{}).name+', '+t.title+' ('+sc+')'); save();
    toast(lulus? 'Lulus! Sertifikat '+rec.certNo+' diterbitkan.' : 'Tercatat: belum lulus, bisa remedial.');

const VIO_TYPES = ['Terlambat','Absen tanpa izin','Merokok di area kerja','Tidak pakai seragam','Komplain pelanggan','Selisih kas','Pelanggaran SOP','Sikap tidak profesional','Lainnya'];
function activeSP(empId){
  const cutoff = shiftMonth(monthKey(), -S.settings.spRules.spValidMonths);
  const sps = S.violations.filter(v=>v.empId===empId && v.sp && v.status!=='Dibatalkan' && monthKey(v.date) >= cutoff).map(v=>v.sp);
  if(sps.includes('SP3')) return 'SP3';
  if(sps.includes('SP2')) return 'SP2';
  if(sps.includes('SP1')) return 'SP1';
  return '';
}
function suggestSP(empId){
  const cutoff = shiftMonth(monthKey(), -S.settings.spRules.spValidMonths);
  const vios = S.violations.filter(v=>v.empId===empId && v.status!=='Dibatalkan' && monthKey(v.date)>=cutoff);
  const cur = activeSP(empId);
  const berat = vios.some(v=>v.severity==='Berat');
  const ringanCnt = vios.filter(v=>v.severity==='Ringan').length;
  const sedangCnt = vios.filter(v=>v.severity==='Sedang').length;
  if(cur==='SP2' && (berat||sedangCnt>=3)) return 'SP3';
  if(cur==='SP1' && (berat||sedangCnt>=2)) return 'SP2';
  if(!cur && (berat || sedangCnt>=2 || ringanCnt>=S.settings.spRules.ringanToSP1)) return 'SP1';
  return '';
}

  if(!list.length){ c.innerHTML = html+'<div class="empty">Tidak ada pelanggaran tercatat. 👍</div>'; return; }
  html += '<table class="tbl"><thead><tr><th>Tanggal</th><th>Kru</th><th>Jenis</th><th>Tingkat</th><th>SP</th><th>Catatan</th><th>Status</th><th></th></tr></thead><tbody>';

/* ====== PAGE: ENGAGEMENT ====== */
const MOODS = [{v:1,e:'😡'},{v:2,e:'☹️'},{v:3,e:'😐'},{v:4,e:'🙂'},{v:5,e:'😀'}];
RENDER.engage = function(c){
  const today = todayStr();
  const myMood = S.moods.find(m=>m.empId===CU.id && m.date===today);
  const mk = monthKey();
  let html = '<div class="cards g2"><div class="card"><h3>Mood Check Hari Ini</h3><div class="small mut">Bagaimana perasaanmu hari ini? Jawaban ini tercatat atas nama Anda dan bisa dilihat HRD. Sesama kru tidak bisa melihatnya. Kalau ingin menyampaikan sesuatu tanpa nama, pakai Kotak Saran di bawah dengan centang anonim.</div>'+
    '<div class="mood-row">'+MOODS.map(m=>'<button class="mood-btn'+(myMood&&myMood.mood===m.v?' sel':'')+'" onclick="APP.setMood('+m.v+')">'+m.e+'</button>').join('')+'</div>'+
    (myMood?'<div class="small" style="text-align:center;color:var(--ok)">Tercatat. Terima kasih! ⚓</div>':'')+'</div>';

  // Tren mood. Titik dengan check-in < MOOD_MIN_N sengaja dikosongkan: rata-rata
  // dari satu orang SAMA DENGAN mood orang itu, jadi grafik "agregat" malah
  // membocorkan individu ke siapa pun yang membuka halaman ini.
  const MOOD_MIN_N = 3;
  const days = [];
  for(let i=13;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); days.push(d.toISOString().slice(0,10)); }
  const trend = days.map(d=>{ const ms=S.moods.filter(m=>m.date===d); return ms.length>=MOOD_MIN_N ? avg(ms.map(m=>m.mood)) : null; });
  const mkMoods = S.moods.filter(m=>monthKey(m.date)===mk);
  html += '<div class="card"><h3>Tren Mood Tim (14 hari)</h3>'+sparkline(trend, 300, 60)+
    '<div class="xs mut" style="margin-top:6px">'+mkMoods.length+' check-in bulan ini'+
      (mkMoods.length>=MOOD_MIN_N ? ', rata-rata '+fmtNum(avg(mkMoods.map(m=>m.mood)))+' / 5' : '')+
      '<br>Hari dengan kurang dari '+MOOD_MIN_N+' check-in tidak ditampilkan, supaya mood satu orang tidak terbaca dari grafik.</div></div></div>';

  // Suggestion box
  html += '<div class="sec-title"><h3>Kotak Saran</h3><span class="sub">boleh anonim. Budaya hidup kalau suara kru didengar</span></div>';
  html += '<div class="card"><div class="frow"><div><input id="sg_text" placeholder="Tulis saran / ide / keluhan…"></div><div class="flex"><label class="flex" style="margin:0;font-weight:500"><input type="checkbox" id="sg_anon" style="width:auto"> Kirim anonim</label><button class="btn btn-pri btn-sm" onclick="APP.addSuggestion()">Kirim</button></div></div></div>';
  const sgs = S.suggestions.slice().sort((a,b)=>b.date.localeCompare(a.date));
  if(sgs.length){
    html += '<table class="tbl" style="margin-top:12px"><thead><tr><th>Tanggal</th><th>Dari</th><th>Saran</th><th>Status</th><th>Respon</th>'+(can('seeAll')?'<th></th>':'')+'</tr></thead><tbody>'+
      sgs.map(s=>'<tr><td class="mono small">'+fmtDate(s.date)+'</td><td class="small">'+(s.empId?esc((empById(s.empId)||{}).name||'-'):'<i class="mut">Anonim</i>')+'</td><td class="small" style="max-width:280px">'+esc(s.text)+'</td>'+
      '<td><span class="tag '+(s.status==='Diterapkan'?'ok':s.status==='Ditinjau'?'info':'mut')+'">'+esc(s.status)+'</span></td><td class="small mut">'+esc(s.response||'')+'</td>'+
      (can('seeAll')?'<td><button class="btn btn-line btn-xs" onclick="APP.respondSuggestion(\''+s.id+'\')">Respon</button></td>':'')+'</tr>').join('')+'</tbody></table>';
  } else html += '<div class="empty" style="margin-top:12px">Belum ada saran masuk.</div>';
  c.innerHTML = html;
};
function setMood(v){
  const today = todayStr();
  let m = S.moods.find(x=>x.empId===CU.id && x.date===today);
  if(m) m.mood = v; else S.moods.push({id:uid('md'), empId:CU.id, date:today, mood:v});
  save(); go('engage');
}
function addSuggestion(){
  const txt = $('#sg_text').value.trim(); if(!txt){ toast('Tulis dulu sarannya.', true); return; }
  S.suggestions.push({id:uid('sg'), empId: $('#sg_anon').checked? null : CU.id, date:todayStr(), text:txt, status:'Baru', response:''});
  log('SUGGESTION',''); save('Saran terkirim. Terima kasih!'); go('engage');
}
function respondSuggestion(id){
  const s = S.suggestions.find(x=>x.id===id);
  openModal('Respon Saran', '<div class="frow"><div><label>Status</label><select id="sg_status">'+['Baru','Ditinjau','Diterapkan','Ditolak'].map(x=>'<option'+(x===s.status?' selected':'')+'>'+x+'</option>').join('')+'</select></div><div><label>Respon</label><input id="sg_resp" value="'+esc(s.response||'')+'"></div></div>',
  {onSave:()=>{ s.status=$('#sg_status').value; s.response=$('#sg_resp').value; log('SUGGESTION_RESPON', s.status); save(); go('engage'); }});
}

RENDER.emp = function(c){

function openEmpDetail(empId){

  const recs = S.trainingRecords.filter(r=>r.empId===empId);

  const vios = S.violations.filter(v=>v.empId===empId && v.status!=='Dibatalkan');

    (e.appRole!=='ceo'?'<div style="text-align:right"><div class="disp" style="font-size:24px;font-weight:700;color:var(--ink)">'+fmtNum(ps.score)+'</div>'+gradeTag(ps.score, ps.completeness)+'</div>':'')+'</div>';

  body += '<table class="tbl" style="box-shadow:none"><thead><tr><th>Komponen</th><th class="num">Bobot</th><th class="num">Skor</th></tr></thead><tbody>'+
    [['Attendance (Talenta)','attendance'],['KPI','kpi'],['Training','training'],['Customer Review','review'],['Disiplin','discipline'],['Teamwork','teamwork'],['Inisiatif','initiative']].map(([lbl,k])=>{

    }).join('')+'</tbody></table>';

/* ====== PAGE: KALENDER HR ====== */
function calendarItems(){
  const out = S.calendar.map(ev=>({date:ev.date, title:ev.title, kind:ev.kind, note:ev.note, cls: ev.kind==='Training'?'info':ev.kind==='Event'?'gold':'mut', id:ev.id}));
  const yr = new Date().getFullYear();
  activeEmps().forEach(e=>{
    if(e.birthDate){ const md = e.birthDate.slice(5); out.push({date: yr+'-'+md, title:'🎂 Ulang tahun '+e.name, kind:'Birthday', cls:'gold'}); }
    if(e.contractEnd) out.push({date:e.contractEnd, title:'Kontrak habis: '+e.name, kind:'Kontrak', cls:'bad', note:'Putuskan perpanjang/evaluasi H-30'});
    if(e.probationEnd) out.push({date:e.probationEnd, title:'Probation selesai: '+e.name, kind:'Probation', cls:'warn'});
  });
  return out.sort((a,b)=>a.date.localeCompare(b.date));
}

  const items = calendarItems();
  const future = items.filter(i=>i.date>=todayStr());
  const past = items.filter(i=>i.date<todayStr()).slice(-6);
  if(!items.length){ c.innerHTML = html+'<div class="empty">Belum ada agenda.</div>'; return; }
  html += '<table class="tbl"><thead><tr><th>Tanggal</th><th>Agenda</th><th>Jenis</th><th></th></tr></thead><tbody>';
  future.forEach(ev=>{
    html += '<tr><td class="mono small" style="width:120px">'+fmtDate(ev.date)+'</td><td><b>'+esc(ev.title)+'</b>'+(ev.note?'<div class="xs mut">'+esc(ev.note)+'</div>':'')+'</td><td><span class="tag '+ev.cls+'">'+esc(ev.kind)+'</span></td>'+
      '<td>'+(ev.id && can('seeAll')?'<button class="btn btn-line btn-xs" onclick="APP.delCalEvent(\''+ev.id+'\')">🗑</button>':'')+'</td></tr>';

function delCalEvent(id){

function saveSettings(){
  const W = S.settings.scoreWeights;
  Object.keys(W).forEach(k=>{ W[k] = Number($('#sw_'+k).value)||0; });
  S.settings.defaultComponentScore = Number($('#s_dflt').value)||75;
  S.settings.grades.forEach((g,i)=>{ g.min = Number($('#gr_'+i).value)||0; });
  ['self','manager','hr','ceo'].forEach(k=>{ S.settings.reviewLayerWeights[k] = Number($('#rw_'+k).value)||0; });
  ['Ringan','Sedang','Berat'].forEach(k=>{ S.settings.violationDeduct[k] = Number($('#vd_'+k).value)||0; });
  S.settings.spRules.ringanToSP1 = Number($('#sp_r1').value)||3;
  S.settings.spRules.spValidMonths = Number($('#sp_valid').value)||6;
  S.settings.pointRules.badge = Number($('#pr_badge').value)||50;
  S.settings.pointRules.trainingPass = Number($('#pr_train').value)||20;
  S.settings.pointRules.eom = Number($('#pr_eom').value)||150;

  const AR = S.settings.attendanceRules;
  const daftar = v => String(v||'').split(',').map(x=>x.trim()).filter(Boolean);
  AR.weights.presence    = Number($('#ar_wp').value)||0;
  AR.weights.punctuality = Number($('#ar_wt').value)||0;
  AR.lateToleranceMin    = Number($('#ar_tol').value)||0;
  AR.lateCapMin          = Number($('#ar_cap').value)||45;
  AR.noCheckoutCredit    = clamp(Number($('#ar_noout').value)||0, 0, 1);
  AR.excusedCaps.I       = Number($('#ar_capI').value)||0;
  AR.excusedCaps.S       = Number($('#ar_capS').value)||0;
  AR.excusedCodes        = daftar($('#ar_codes').value).map(x=>x.toUpperCase());
  AR.offShifts           = daftar($('#ar_off').value);
  AR.offShiftContains    = daftar($('#ar_offkw').value).map(x=>x.toLowerCase());
  // cap di bawah toleransi membuat pembagi (cap-tol) negatif: tiap
  // keterlambatan langsung jadi penalti penuh tanpa ada yang sadar.
  if(AR.lateCapMin <= AR.lateToleranceMin){
    AR.lateCapMin = AR.lateToleranceMin + 1;
    toast('Penalti penuh harus lebih besar dari toleransi. Disetel ke '+AR.lateCapMin+' menit.', true);
  }

  log('SETTINGS_SAVE',''); save('Pengaturan tersimpan.'); go('settings');
}
function exportJson(){
  const blob = new Blob([JSON.stringify(S, null, 1)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'Staff-Performance_Laksamana_backup_'+todayStr()+'.json';
  a.click(); URL.revokeObjectURL(a.href);
  log('EXPORT',''); save(); toast('Backup terunduh.');
}
function importJson(ev){
  const f = ev.target.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = ()=>{
    try{
      const data = JSON.parse(rd.result);
      if(!data.employees || !data.settings) throw new Error('format');
      confirmBox('Impor akan MENIMPA semua data saat ini. Lanjutkan?', ()=>{
        S = data; migrate(); save(); toast('Backup diimpor. Silakan login ulang.'); doLogout();
      });
    }catch(e){ toast('File tidak valid.', true); }
  };
  rd.readAsText(f);
}
function resetAll(){
  confirmBox('Reset akan menghapus SEMUA data dan kembali ke data awal. Yakin?', ()=>{
    S = seed(); save(); toast('Data direset.'); doLogout();
  });
}

/* ====== INIT ====== */
// Dijaga sekali-jalan: dipasang lewat DOMContentLoaded DAN pemeriksaan readyState
// di bawah, jadi tanpa penjaga ini apiLoad() bisa jalan dua kali.
let _booted = false;
async function init(){
  if(_booted) return; _booted = true;
  const bs = document.getElementById('bootScreen');
  // Diam terlalu lama membuat orang mengira modulnya rusak lalu refresh berulang.
  // Lewat 3 detik: sebutkan apa yang sedang ditunggu.
  const lambat = setTimeout(()=>{ if(bs) bs.classList.add('is-slow'); }, 3000);
  try{
    $('#menuBtn').onclick = ()=> $('#sidebar').classList.toggle('open');
    $('#modalWrap').addEventListener('click', e=>{ if(e.target.id==='modalWrap') closeModal(); });
    await apiLoad();             // server dulu, baru identitas: resolveOfficeUser butuh S.employees
    // Roster Office (Apps Script) TERUKUR 16-23 detik. Dulu SELALU ditunggu.
    // Sekarang hanya ditunggu bila kru BELUM dikenal — sebab cuma di kasus itu
    // resolveOfficeUser membuat record baru yang bisa berduplikat dengan record
    // dari roster. Kru yang sudah terdaftar (mayoritas) langsung masuk, roster
    // disegarkan di latar belakang.
    const _ses = readLmSession();
    if(_ses && findEmployeeForSession(_ses)) autoSyncOfficeRoster();
    else await autoSyncOfficeRoster();
    await loadAkademiStats();    // training dari Akademi (dorman kalau URL kosong); non-fatal
    bootPeopleOS();
  }catch(e){
    // Tiap langkah di atas sudah menangkap error sendiri, jadi sampai sini
    // artinya ada yang tak terduga. Jangan tinggalkan spinner berputar
    // selamanya: tunjukkan apa yang terjadi supaya bisa dilaporkan.
    console.error('Boot HR gagal:', e);
    if(bs){
      bs.innerHTML = '<div class="t">Gagal memuat halaman</div>'+
        '<div class="s">Coba muat ulang. Kalau tetap gagal, laporkan pesan ini: '+
        esc(String(e && e.message || e))+'</div>';
      bs.classList.remove('is-slow');
    }
    return;                      // bootScreen sengaja DIBIARKAN sebagai layar pesan
  }finally{
    clearTimeout(lambat);
  }
  if(bs) bs.remove();            // hanya dibuang kalau boot benar-benar sukses
}
