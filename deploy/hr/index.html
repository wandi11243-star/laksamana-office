<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<meta name="theme-color" content="#A9791F">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Staff Performance, Laksamana Muda</title>
<link rel="icon" type="image/jpeg" href="../assets/LaksamanaMudaLogo.jpeg">
<!-- Guard SSO: tanpa sesi Office yang berhak buka hr, langsung ke login Office. -->
<script>
(function(){try{var s=JSON.parse(localStorage.getItem('lm_session')||'null');
  var ok=s&&s.expiry&&Date.now()<s.expiry&&(s.modules||[]).some(function(m){return m==='*'||m==='hr';});
  if(!ok)location.replace('../');}catch(e){location.replace('../');}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/laksamana.css">
<style>
/* Token PeopleOS dipetakan ke design system Office (laksamana.css). Nama
   variabel lama dipertahankan supaya aturan di bawah tak perlu ditulis ulang.
   Aturan copy: tanpa em dash, tanpa middle dot. */
:root{
  --ink:#2A2620; --ink2:#3A3428; --ink3:#4A4234;
  --gold:#C8961F; --gold2:#A9791F; --gold-soft:#F2E9D3;
  --cream:#F7F6F4; --paper:#FFFFFF; --line:#E7E1D3; --line2:#EFE9DB;
  --tx:#2A2620; --tx2:#5C574D; --tx3:#928C80;
  --ok:#1F9D5F; --ok-bg:#E4F5EC; --warn:#B5831A; --warn-bg:#F7EFDB;
  --bad:#C9432B; --bad-bg:#F8E4DF; --info:#2F7FC4; --info-bg:#E4EFF8;
  --r:12px; --r-sm:8px;
  --shadow:0 4px 18px rgba(50,42,28,.06);
  --font-d:'Plus Jakarta Sans',system-ui,sans-serif; --font-b:'Inter',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font-b);background:var(--cream);color:var(--tx);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,.disp{font-family:var(--font-d)}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13.5px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-sm);background:#fff;color:var(--tx);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:0;border-color:var(--gold2)}
label{font-size:12px;font-weight:600;color:var(--tx2);display:block;margin-bottom:4px}
::placeholder{color:var(--tx3)}

.btn{display:inline-flex;align-items:center;gap:7px;justify-content:center;padding:9px 16px;border-radius:var(--r-sm);border:1px solid transparent;font-weight:600;font-size:13.5px;transition:.15s}
.btn-gold{background:var(--gold);color:var(--ink);width:100%;padding:11px}
.btn-gold:hover{background:#e0a90c}
.btn-pri{background:var(--ink);color:#fff}
.btn-pri:hover{background:var(--ink3)}
.btn-line{background:#fff;border-color:var(--line);color:var(--tx)}
.btn-line:hover{border-color:var(--gold2);color:var(--ink)}
.btn-danger{background:var(--bad);color:#fff}
.btn-sm{padding:5px 10px;font-size:12.5px}
.btn-xs{padding:3px 8px;font-size:11.5px;border-radius:6px}

/* ---------- SHELL (canonical, matches akademi/reservasi) ---------- */
#appView{display:none;min-height:100vh}

/* Layar muat. HTML biasa (bukan dibuat JS) supaya tampil SEKETIKA, sebelum
   script apa pun jalan. init() menunggu beberapa panggilan jaringan sebelum
   menggambar; tanpa ini layar putih kosong dan kru mengira modulnya rusak. */
#bootScreen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;background:var(--cream);z-index:9999;text-align:center;padding:24px}
#bootScreen .ring{width:34px;height:34px;border:3px solid rgba(200,150,31,.25);border-top-color:var(--gold);
  border-radius:50%;animation:bootSpin .8s linear infinite}
@keyframes bootSpin{to{transform:rotate(360deg)}}
#bootScreen .t{font-family:var(--font-d);font-weight:700;font-size:15px;color:var(--ink)}
#bootScreen .s{font-size:12.5px;color:var(--tx2);max-width:320px;line-height:1.5}
#bootScreen .slow{font-size:12.5px;color:var(--tx3);max-width:340px;line-height:1.5;display:none}
#bootScreen.is-slow .slow{display:block}
@media (prefers-reduced-motion:reduce){ #bootScreen .ring{animation-duration:2.4s} }
.shell{display:flex;min-height:100vh}
.sidebar{width:242px;flex:none;background:var(--paper);border-right:1px solid var(--line);color:var(--tx);padding:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar::-webkit-scrollbar{width:6px}
.sidebar::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
.side-brand{display:flex;align-items:center;gap:11px;padding:18px 18px 14px;border-bottom:1px solid var(--line);margin-bottom:6px}
.side-brand img{width:38px;height:38px;object-fit:contain;border-radius:9px;flex:none}
.side-brand .t{font-family:var(--font-d);font-weight:700;font-size:16px;color:var(--ink);line-height:1.1}
.side-brand .s{font-family:var(--font-b);font-size:9.5px;color:var(--gold2);text-transform:uppercase;letter-spacing:.18em;margin-top:2px}
nav{flex:1;overflow-y:auto;padding:6px 0 16px}
.ngroup{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--tx3);padding:16px 24px 7px}
.nitem{display:flex;align-items:center;gap:11px;width:calc(100% - 24px);margin:0 12px 1px;padding:10px 12px;border-radius:10px;background:none;border:none;color:var(--tx);font-size:14px;font-weight:500;text-align:left;position:relative;transition:background .13s,color .13s}
.nitem svg{width:18px;height:18px;flex:none}
.nitem:hover{background:var(--cream)}
.nitem.on{background:var(--gold-soft);color:var(--gold2);font-weight:600}
.nitem.on::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--gold)}
.side-user{margin-top:auto;border-top:1px solid var(--line);padding:12px;display:flex;align-items:center;gap:10px}
.side-user .avatar{width:36px;height:36px;border-radius:10px;background:var(--gold);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.side-user .info{line-height:1.25;flex:1;min-width:0}
.side-user .n{display:block;font-weight:700;color:var(--ink);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-user .r{color:var(--tx2);font-size:11px;text-transform:capitalize}
.logout-x{background:var(--cream);border:1px solid var(--line);color:var(--tx2);width:32px;height:32px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
.logout-x:hover{background:var(--bad-bg);color:var(--bad);border-color:#E7BDB8}
.logout-x svg{width:16px;height:16px}
main{flex:1;overflow-y:auto;display:flex;flex-direction:column;min-width:0}
header.topbar{background:var(--paper);border-bottom:1px solid var(--line2);padding:12px 24px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20}
.topbar h2{font-size:19px;color:var(--ink);font-weight:700;flex:1}
/* Badge sinkron: hanya muncul kalau ADA masalah, jadi topbar tetap bersih saat lancar. */
.sync-badge{font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--bad-bg);color:var(--bad);white-space:nowrap}
.sync-badge.conflict{background:var(--warn-bg);color:var(--warn)}
.sync-badge[hidden]{display:none}
#content{padding:22px 24px 60px;max-width:1240px;width:100%;margin:0 auto}

/* mobile */
.mobile-top{display:none}
.mobile-nav{display:none}
@media(max-width:860px){
  .shell{display:block}
  .sidebar{display:none}
  #content{padding:16px 14px 90px}
  .mobile-top{display:flex;align-items:center;justify-content:space-between;background:var(--paper);color:var(--ink);border-bottom:1px solid var(--line);padding:13px 16px;position:sticky;top:0;z-index:40}
  .mobile-top .t{font-family:var(--font-d);font-weight:700;font-size:15px}
}

/* ---------- COMPONENTS ---------- */
.cards{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--paper);border:1px solid var(--line2);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card h3{font-size:15px;color:var(--ink);margin-bottom:10px;font-weight:700}
.kpi-card .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx2);font-weight:700}
.kpi-card .val{font-family:var(--font-d);font-size:28px;font-weight:700;color:var(--ink);margin-top:3px}
.kpi-card .sub{font-size:11.5px;color:var(--tx2);margin-top:2px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar .sp{flex:1}
.toolbar input,.toolbar select{width:auto}
table.tbl{width:100%;border-collapse:collapse;background:var(--paper);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);font-size:13px}
.tbl th{background:var(--ink);color:#E8EDF2;text-align:left;padding:9px 12px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;white-space:nowrap}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr:hover{background:#FCF9F2}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}
.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}.tag.info{background:var(--info-bg);color:var(--info)}
.tag.gold{background:var(--gold-soft);color:var(--gold2)}.tag.mut{background:#EEF1F4;color:var(--tx2)}
.grade{font-family:var(--font-d);font-weight:700;font-size:15px}
.bar{height:7px;background:#EDF0F3;border-radius:99px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--gold2)}
.bar.g i{background:var(--ok)}.bar.w i{background:var(--warn)}.bar.b i{background:var(--bad)}
.stars{color:var(--gold2);letter-spacing:1px;font-size:13px;white-space:nowrap}
.empty{padding:36px;text-align:center;color:var(--tx3);background:var(--paper);border:1.5px dashed var(--line);border-radius:var(--r);font-size:13px}
.hint{font-size:11.5px;color:var(--tx3);margin-top:6px}
.note{background:var(--info-bg);border-left:3px solid var(--info);padding:9px 12px;border-radius:0 8px 8px 0;font-size:12.5px;color:#1E3A8A;margin-bottom:14px}
.note.w{background:var(--warn-bg);border-color:var(--warn);color:#7A5104}
.sec-title{display:flex;align-items:baseline;gap:10px;margin:22px 0 10px}
.sec-title h3{font-size:16px;color:var(--ink)}
.sec-title .sub{font-size:12px;color:var(--tx2)}
.flex{display:flex;gap:10px;align-items:center}.grow{flex:1}
.right{margin-left:auto}
.mut{color:var(--tx2)}.small{font-size:12px}.xs{font-size:11px}
.mono{font-variant-numeric:tabular-nums}

/* ---------- MODAL / TOAST ---------- */
#modalWrap{position:fixed;inset:0;background:rgba(11,31,51,.55);display:none;align-items:flex-start;justify-content:center;z-index:80;padding:40px 16px;overflow-y:auto}
#modalWrap.on{display:flex}
.modal{background:var(--paper);border-radius:14px;width:100%;max-width:640px;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:pop .18s ease}
.modal.wide{max-width:860px}
@keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.m-head{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line2)}
.m-head h3{font-size:17px;color:var(--ink);flex:1}
.m-x{background:none;border:none;font-size:20px;color:var(--tx3);line-height:1;padding:4px}
.m-body{padding:18px 20px;max-height:calc(100vh - 220px);overflow-y:auto}
.m-foot{padding:13px 20px;border-top:1px solid var(--line2);display:flex;justify-content:flex-end;gap:9px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.frow.f3{grid-template-columns:1fr 1fr 1fr}
.frow.f1{grid-template-columns:1fr}
#toasts{position:fixed;bottom:20px;right:20px;z-index:99;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--ink);color:#fff;padding:11px 16px;border-radius:10px;font-size:13px;box-shadow:var(--shadow);border-left:3px solid var(--gold);animation:pop .2s ease;max-width:340px}
.toast.err{border-left-color:var(--bad)}

/* leaderboard / misc */
.podium{display:flex;gap:12px;align-items:flex-end;margin:8px 0 16px}
.pod{flex:1;background:var(--paper);border:1px solid var(--line2);border-radius:var(--r);padding:14px;text-align:center;box-shadow:var(--shadow)}
.pod .rank{font-family:var(--font-d);font-size:22px;font-weight:700;color:var(--gold2)}
.pod.first{border-color:var(--gold);background:linear-gradient(180deg,#FFFDF5,#fff)}
.mood-row{display:flex;gap:8px;justify-content:center;margin:8px 0}
.mood-btn{font-size:26px;background:none;border:2px solid transparent;border-radius:12px;padding:6px 10px;transition:.12s}
.mood-btn:hover{transform:scale(1.12)}
.mood-btn.sel{border-color:var(--gold);background:var(--gold-soft)}
.badge-pill{display:inline-flex;align-items:center;gap:5px;background:var(--gold-soft);border:1px solid rgba(184,137,58,.35);color:var(--gold2);border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:600;margin:2px}
.timeline{border-left:2px solid var(--line);padding-left:16px;margin-left:6px}
.tl-item{position:relative;padding-bottom:14px}
.tl-item:before{content:'';position:absolute;left:-21px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--gold2)}
.chip-month{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 10px;font-weight:600;font-size:13px}
svg.chart text{font-family:var(--font-b)}
.print-only{display:none}
@media(max-width:1000px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:860px){
  .sidebar{position:fixed;left:-260px;top:0;bottom:0;z-index:60;transition:.2s}
  .sidebar.open{left:0}
  #menuBtn{display:inline-flex}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .frow,.frow.f3{grid-template-columns:1fr}
  #content{padding:16px 14px 60px}
}
#menuBtn{display:none;background:none;border:1px solid var(--line);border-radius:8px;padding:6px 9px;color:var(--tx)}
@media print{
  .sidebar,header.topbar,.toolbar,.btn,#toasts{display:none!important}
  body{background:#fff}
  #content{max-width:none;padding:0}
  .print-only{display:block}
}
</style>
</head>
<body>

<!-- Tampil seketika, dibuang oleh init() setelah data siap. Sengaja HTML
     statis: kalau digambar JS, layar tetap kosong selama script memuat. -->
<div id="bootScreen">
  <div class="ring"></div>
  <div class="t">Menyiapkan Staff Performance</div>
  <div class="s">Memuat data kru & penilaian…</div>
  <div class="slow">Menyinkronkan roster kru dari Office — ini kadang butuh sampai 15 detik.
    Halaman tetap terbuka walau sinkron ini gagal.</div>
</div>

<div id="appView">
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="mobile-top">
    <button id="menuBtn">☰</button>
    <span class="t">Staff Performance</span>
    <span style="width:32px"></span>
  </div>
  <main>
    <header class="topbar">
      <h2 id="pageTitle">Anjungan</h2>
      <span class="sync-badge" id="sync-badge" hidden></span>
    </header>
    <div id="content"></div>
  </main>
</div>
</div>
</div>

<div id="modalWrap"><div class="modal" id="modalBox"></div></div>
<div id="toasts"></div>

<script>
/* ====== GLOBALS (di luar IIFE agar bisa diakses dari inline handler & test) ====== */
// Backend MySQL sendiri (hr-mysql/). Kontrak SENGAJA dibuat sama persis dengan
// Apps Script lama — GET ?action=getAll, POST {action:'saveAll', data, baseRev}
// — jadi nama variabel ini dipertahankan dan 8 titik pemakaiannya tidak berubah.
// Cara pasang backend: hr-mysql/README.md.
// Sheet lama TIDAK dihapus; dia jadi arsip beku, tidak dibaca lagi dari sini.
var WEB_APP_URL = "../hr-api-mysql/api.php";

/* Integrasi Akademi (baca-saja): komponen Training di People Score idealnya
   berasal dari training ASLI di modul Akademi, bukan input manual. Isi dengan
   URL yang mengekspos `?action=trainingStats` -> peta
   { userId: {mandPct,mandTotal,mandDone,certified} }. Lihat
   docs/hr-akademi-integration.md. Selama KOSONG, Training tetap dari input
   manual seperti biasa (fitur ini dorman, tidak mengganggu apa pun).

   SENGAJA DIKOSONGKAN. Sebelumnya diisi URL /exec Akademi, tapi Apps Script
   itu TIDAK PERNAH punya aksi `trainingStats` — jawabannya selalu
   {ok:false, error:'unknown_action'}. Jadi fitur ini memang sudah dorman
   sejak awal, hanya saja membayar ~2,3 detik panggilan jaringan yang pasti
   gagal SETIAP kali halaman dibuka, dan boot menunggunya.

   DIHIDUPKAN 2026-07-17: aksi `trainingStats` sudah ada di akademi-mysql/api.php
   (-> training_stats() di lib_akademi_mysql.php, meniru userStats() klien
   Akademi persis), dan variabel ini menunjuk ke API MySQL Akademi. */
var AKADEMI_STATS_URL = "../akademi-api-mysql/api.php";

// URL /exec identitas Office (Sheet "Database User"), SAMA dengan yang dipakai
// landing page & modul lain. Dipakai autoSyncOfficeRoster: menarik daftar kru
// yang sudah diberi akses modul `hr` di Kelola Akses Office, supaya mereka muncul
// di halaman Kru walau belum pernah login ke modul ini. Read-only, tanpa PIN.
var OFFICE_WEBAPP_URL = "../account-api-mysql/api.php";
/* Cadangan ke Apps Script lama. Backend MySQL (account-api-mysql) mungkin
   belum terpasang di server ini — kalau begitu roster tetap bisa ditarik dari
   Google Sheet, bukan diam-diam berhenti bekerja sampai ada yang sadar
   dropdown PIC-nya tidak pernah bertambah. */
const OFFICE_LEGACY_URL = "https://script.google.com/macros/s/AKfycbyy1hlJPVfV_Xu3o4-2EhjbP4MI0QylphLgmf0Cj7Ve4fJ006tdls9_TYhEMpkVmPGsuA/exec";
async function fetchOffice(opts){
  try{
    const r = await fetch(OFFICE_WEBAPP_URL, opts);
    if(r.ok || !OFFICE_LEGACY_URL) return r;
  }catch(e){ if(!OFFICE_LEGACY_URL) throw e; }
  return fetch(OFFICE_LEGACY_URL, opts);
}


var LS_KEY = 'lm_peopleos_v1';   // cache lokal (fallback offline)
var AKADEMI_CACHE_KEY = 'lm_peopleos_akademi_v1';
var APP = null; // diisi oleh IIFE untuk akses eksternal/test

(function(){
'use strict';

/* ====== UTILS ====== */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const uid = p => (p||'id') + '_' + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const todayStr = () => new Date().toISOString().slice(0,10);
const monthKey = d => (d||new Date().toISOString()).slice(0,7);
const NBULAN = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const fmtMonth = mk => { if(!mk) return '-'; const [y,m]=mk.split('-'); return NBULAN[+m-1]+' '+y; };
const fmtDate = d => { if(!d) return '-'; const dt=new Date(d+'T00:00:00'); return dt.getDate()+' '+NBULAN[dt.getMonth()]+' '+dt.getFullYear(); };
const fmtNum = n => (n==null||isNaN(n)) ? '-' : Number(n).toLocaleString('id-ID',{maximumFractionDigits:1});
const initials = n => n.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();
const shiftMonth = (mk, d) => { const [y,m]=mk.split('-').map(Number); const dt=new Date(y, m-1+d, 1); return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0'); };
const lastMonths = (n, from) => { const out=[]; let mk = from||monthKey(); for(let i=0;i<n;i++){ out.unshift(mk); mk=shiftMonth(mk,-1);} return out; };
const avg = arr => arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : null;

// Dideklarasikan di sini (bukan dekat showSaveConflict) karena toast() di bawah
// membacanya, dan toast() dipakai jauh sebelum blok sync dalam urutan file.
let _conflictShown = false;

function toast(msg, err){
  // Saat modal konflik tampil, save() TIDAK jadi naik ke server. Menampilkan
  // "tersimpan" di situ menyesatkan, jadi toast sukses ditahan; badge + modal
  // yang jadi sumber informasi. Toast error tetap lewat.
  if(_conflictShown && !err) return;
  const t = document.createElement('div');
  t.className = 'toast' + (err?' err':'');
  t.textContent = msg;
  $('#toasts').appendChild(t);
  setTimeout(()=>t.remove(), 3200);
}

/* ====== STATE / SYNC ======
   Sumber kebenaran = Google Sheet lewat Apps Script (docs/performance-apps-script.gs).
   localStorage cuma cache: biar tetap kebaca saat offline dan first paint instan.
   Kontrak standar Office: GET ?action=getAll, POST {action:'saveAll', data, baseRev}.
   Lihat docs/office-data.md. */
let S = null;
let API_READY = false;

/* ===== Akademi training stats (baca-saja) =====
   Peta { userId: {mandPct,mandTotal,mandDone,certified} } dari modul Akademi.
   Dipakai trainingScore() sebagai sumber utama komponen Training. Dorman kalau
   AKADEMI_STATS_URL kosong. Lihat docs/hr-akademi-integration.md. */
let AKADEMI_STATS = null;
async function loadAkademiStats(){
  if(!AKADEMI_STATS_URL){ AKADEMI_STATS = null; return; }
  try{
    const res = await fetch(AKADEMI_STATS_URL + '?action=trainingStats', {method:'GET', redirect:'follow'});
    const j = await res.json();
    // Terima dua bentuk: {ok:true,data:{...}} atau langsung {...userId:...}.
    const map = (j && j.ok && j.data) ? j.data : (j && !j.ok ? null : j);
    if(map && typeof map === 'object'){
      AKADEMI_STATS = map;
      try{ localStorage.setItem(AKADEMI_CACHE_KEY, JSON.stringify(map)); }catch(e){}
    } else { throw new Error('bentuk tak dikenal'); }
  }catch(e){
    console.warn('Gagal memuat training Akademi, pakai cache/manual:', e);
    try{ AKADEMI_STATS = JSON.parse(localStorage.getItem(AKADEMI_CACHE_KEY) || 'null'); }catch(_){ AKADEMI_STATS = null; }
  }
}

/* ===== Sinkron roster dari Office =====
   Tarik daftar kru yang SUDAH diberi akses modul `hr` di Kelola Akses Office,
   supaya mereka muncul di halaman Kru walau belum pernah login ke modul ini.
   Sebelumnya kru cuma muncul saat DIA SENDIRI login (resolveOfficeUser), jadi
   admin yang baru memberi akses tak bisa menyiapkan divisi/level orang itu
   sampai yang bersangkutan buka modul. Pola sama dengan Marketing.
   Read-only, tanpa PIN (server listModuleRoster_ cuma balas id+nama+status).
   Kru baru dibuat sebagai record BELUM LENGKAP (divisi/jabatan kosong) supaya
   ikut ditandai "lengkapi data" di halaman Kru. Non-blocking, diam saat offline. */
async function autoSyncOfficeRoster(){
  if(!OFFICE_WEBAPP_URL) return;
  let data;
  try{
    // Batas waktu WAJIB: fetch tanpa batas akan menunggu selamanya kalau Apps
    // Script menggantung, dan boot menunggunya. Sinkron roster cuma pelengkap
    // — lebih baik dilewati daripada menahan seluruh halaman.
    // 25 detik, BUKAN 10: Apps Script Office diukur merespons 11-18 detik, jadi
    // batas 10 detik membatalkan sinkron ini hampir setiap kali, diam-diam.
    const stop = new AbortController();
    const jam = setTimeout(()=>stop.abort(), 25000);
    const res = await fetchOffice( {
      method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({action:'listModuleRoster', module:'hr'}), redirect:'follow',
      signal: stop.signal
    }).finally(()=>clearTimeout(jam));
    data = await res.json();
  }catch(e){ /* Office tak terjangkau: lewati diam-diam, coba lagi sesi berikutnya */ return; }
  if(!data || !data.ok || !Array.isArray(data.members)) return;

  let changed = false;
  data.members.forEach(m => {
    if(!m || !m.id) return;
    const appRole = m.isModuleAdmin ? 'hr' : 'staff';
    // Pakai pencocokan yang sama dengan login (id -> nama persis -> nama depan unik)
    // supaya tidak bikin duplikat dengan record yang sudah ada.
    let u = findEmployeeForSession({userId:m.id, name:m.name, talentaId:m.talentaId});
    if(u){
      if(u.id !== m.id){ reassignEmployeeId(u.id, m.id); changed = true; }  // klaim id Office, pindahkan riwayat
      if(m.name && u.name !== m.name){ u.name = m.name; changed = true; }
      // Admin modul dari Office menang atas role internal (mis. Rizki tetap 'hr').
      if(m.isModuleAdmin && u.appRole !== 'hr'){ u.appRole = 'hr'; changed = true; }
      if(m.active === false && u.status === 'Aktif'){ u.status = 'Nonaktif'; changed = true; }
      // Office pemegang pemetaan Talenta; di sini hanya disalin supaya
      // pencocokan absensi tidak perlu memanggil Office lagi.
      const tid = String(m.talentaId||'');
      if(tid && u.talentaId !== tid){ u.talentaId = tid; changed = true; }
    } else {
      S.employees.push({ id:m.id, name:m.name || '(tanpa nama)', role:'', divId:'', level:'Staff',
        appRole, joinDate:'', birthDate:'', status: m.active===false?'Nonaktif':'Aktif',
        phone:'', email:'', notes:'', probationEnd:'', contractEnd:'',
        talentaId: String(m.talentaId||'') });
      changed = true;
    }
  });
  if(gabungKembarTalenta()) changed = true;
  if(changed){ log('ROSTER_SYNC','dari Office'); save(); if(CU) buildNav(); }
}

// Ambil dari server. Gagal (offline/URL kosong) -> cache lokal -> seed baru.
async function apiLoad(){
  if(!WEB_APP_URL || WEB_APP_URL.indexOf('PASTE_') === 0){ loadLocal(); return; }
  try{
    // Batas waktu: kalau server diam, jatuh ke cache lokal daripada menahan
    // boot tanpa akhir. 15 detik — lebih longgar dari sinkron roster karena
    // ini data utamanya, bukan pelengkap.
    const stop = new AbortController();
    const jam = setTimeout(()=>stop.abort(), 15000);
    const res = await fetch(WEB_APP_URL + '?action=getAll',
      {method:'GET', redirect:'follow', signal: stop.signal}).finally(()=>clearTimeout(jam));
    const json = await res.json();
    if(!json || !json.ok) throw new Error((json && json.error) || 'respons server tidak valid');
    // Server masih kosong (belum pernah disimpan) -> pakai seed, lalu dorong ke
    // server supaya isi awal (divisi, template KPI) ada sejak awal.
    //
    // Penanda "masih kosong" = TIDAK ADA DIVISI. Jangan pakai employees.length:
    // roster memang SENGAJA mulai kosong (kru muncul sendiri lewat sinkron
    // Office), jadi memakai itu membuat setiap muat halaman menyemai ulang.
    // Akibatnya nyata: seed() memberi id acak (uid()) tiap kali dipanggil, jadi
    // id kpiTemplate & careerPath berubah tiap buka halaman — nilai kpiActuals
    // yang menunjuk id lama jadi yatim — dan rev naik terus sampai dua orang
    // yang kebetulan membuka bersamaan saling kena modal bentrok.
    // Divisi ikut tersemai pada simpan pertama dan tidak pernah dikosongkan,
    // jadi penanda ini benar walau roster memang kosong selamanya.
    const fresh = !json.data || (!(json.data.divisions || []).length &&
                                 !(json.data.employees || []).length);
    S = fresh ? seed() : json.data;
    // seed() tidak membawa _rev, padahal save() memakainya sebagai baseRev.
    // Tanpa baris ini simpan pertama dikirim TANPA baseRev, dan server hanya
    // menerima itu kalau rev masih 0 — begitu rev sudah pernah naik (server
    // pernah dipakai lalu datanya dikosongkan), pemasangan baru langsung kena
    // modal bentrok dan seed tidak pernah tersimpan.
    if(fresh && json.data && json.data._rev !== undefined) S._rev = json.data._rev;
    migrate();
    API_READY = true;
    cacheLocal();
    if(fresh) save();
  }catch(e){
    console.warn('Gagal memuat dari server, pakai cache lokal:', e);
    loadLocal();
    API_READY = false;
    setSyncBadge('err');
  }
}
function loadLocal(){
  try{ const raw = localStorage.getItem(LS_KEY); if(raw){ S = JSON.parse(raw); migrate(); return; } }catch(e){}
  S = seed();
}
function cacheLocal(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }
  catch(e){ /* kuota penuh: server tetap sumber kebenaran, cache boleh gagal */ }
}

/* Simpan menimpa SELURUH DB, jadi dua orang yang menyimpan bersamaan bisa saling
   menghapus. Kita kirim baseRev = _rev yang kita pegang; server menolak kalau
   sudah ketinggalan (lihat docs/performance-apps-script.gs), bukan menimpa diam-diam.
   save() tetap sinkron dan boleh dipanggil tanpa argumen: ~30 tempat di app ini
   cuma "ubah S lalu save()". `okMsg` opsional = toast yang BARU muncul setelah
   server benar-benar mengonfirmasi, supaya tidak pernah bilang "tersimpan" untuk
   simpan yang ternyata ditolak. */
let saveInFlight = false, savePending = false;
function save(okMsg){
  cacheLocal();                                     // cache dulu, instan
  if(!WEB_APP_URL || WEB_APP_URL.indexOf('PASTE_') === 0){
    // Mode offline (URL belum diisi): tersimpan lokal, jadi toast boleh langsung.
    if(okMsg) toast(okMsg);
    return;
  }
  if(saveInFlight){ savePending = true; return; }   // hindari dua POST balapan dari tab sama
  saveInFlight = true;
  const body = {action:'saveAll', data:S, by:(CU && CU.name) || ''};
  if(S._rev !== undefined && S._rev !== null) body.baseRev = S._rev;
  fetch(WEB_APP_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},   // simple request, hindari preflight CORS
    body: JSON.stringify(body),
    redirect:'follow'
  })
  .then(r => r.json())
  .then(j => {
    if(j && j.ok){
      if(j.data && j.data.rev !== undefined) S._rev = j.data.rev;
      API_READY = true; setSyncBadge('ok');
      if(okMsg) toast(okMsg);
    } else if(j && j.error === 'conflict'){
      API_READY = false; setSyncBadge('conflict');
      showSaveConflict(j);
    } else {
      API_READY = false; setSyncBadge('err');
      console.warn('Simpan ditolak server:', j && j.error);
      toast('Gagal menyimpan ke server. Perubahan baru ada di browser ini.', true);
    }
  })
  .catch(err => {
    API_READY = false; setSyncBadge('err'); console.warn('Gagal sinkron ke server:', err);
    toast('Gagal menyimpan ke server. Perubahan baru ada di browser ini.', true);
  })
  .finally(() => { saveInFlight = false; if(savePending){ savePending = false; save(); } });
}

// Perubahan kita ditolak karena server sudah lebih baru. Jangan timpa diam-diam,
// tanyakan: timpa paksa berarti membuang kerja orang lain. (_conflictShown
// dideklarasikan di dekat toast(), yang ikut membacanya.)
function showSaveConflict(j){
  if(_conflictShown) return; _conflictShown = true;
  const who = j.savedBy || 'user lain';
  const when = j.savedAt ? fmtDate(String(j.savedAt).slice(0,10)) : 'baru saja';
  openModal('Perubahan Tidak Tersimpan',
    '<div class="note w" style="margin-bottom:12px"><b>'+esc(who)+'</b> menyimpan perubahan ('+esc(when)+'), sesudah halaman ini dimuat. Perubahan Anda <b>belum tersimpan</b>.</div>'+
    '<p class="small mut">Kalau dipaksa simpan, semua perubahan '+esc(who)+' akan hilang. Amannya: muat ulang, lalu ulangi perubahan Anda.</p>',
    {saveLabel:'Muat ulang (disarankan)', onSave:()=>{ location.reload(); }});
}
// Badge hanya tampil kalau ADA masalah. Kalau lancar, topbar tetap bersih.
function setSyncBadge(state){
  const el = document.getElementById('sync-badge'); if(!el) return;
  if(state === 'ok'){ el.hidden = true; el.className = 'sync-badge'; return; }
  el.hidden = false;
  el.className = 'sync-badge ' + (state === 'conflict' ? 'conflict' : 'err');
  el.textContent = state === 'conflict' ? 'Belum tersimpan, bentrok' : 'Gagal sinkron, data hanya di browser ini';
  el.title = state === 'conflict'
    ? 'Server sudah lebih baru. Muat ulang lalu ulangi perubahan Anda.'
    : 'Perubahan tersimpan di browser tapi belum naik ke server. Cek koneksi.';
}
/* Data dibaca sekali saat boot, jadi tab yang lama dibiarkan terbuka memegang
   versi usang lalu bisa menimpa kerja orang lain. Saat tab kembali aktif, cek
   apakah server sudah lebih baru. */
async function refreshIfStale(){
  if(!WEB_APP_URL || WEB_APP_URL.indexOf('PASTE_') === 0 || !S) return;
  if(saveInFlight || _conflictShown) return;
  try{
    const res = await fetch(WEB_APP_URL + '?action=getAll', {method:'GET', redirect:'follow'});
    const j = await res.json();
    if(!j || !j.ok || !j.data || !(j.data.employees||[]).length) return;
    const srev = +j.data._rev || 0, mine = +S._rev || 0;
    if(!(srev > mine)) return;                     // server tidak lebih baru -> aman
    S = j.data; migrate(); cacheLocal();
    setSyncBadge('ok');
    // S diganti objek baru, jadi CU (referensi ke employee di S lama) harus
    // dicocokkan ulang ke roster baru, kalau tidak edit berikutnya menulis ke
    // objek yatim yang tidak ikut tersimpan.
    const sess = readLmSession();
    if(CU && sess){ OFFICE_HR_ADMIN = officeIsHrAdmin(sess); CU = resolveOfficeUser(sess); buildNav(); go(curPage); }
    toast('Data disegarkan, ada perubahan dari ' + ((j.data._savedBy) || 'user lain') + '.');
  }catch(e){ /* offline: biarkan, badge diurus save() */ }
}
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState === 'visible') refreshIfStale(); });

function migrate(){ const d = seed(); for(const k in d){ if(S[k]===undefined) S[k]=d[k]; } for(const k in d.settings){ if(S.settings[k]===undefined) S.settings[k]=d.settings[k]; } }

/* ====== AUTH & RBAC ====== */
let CU = null; // current user (employee object)
const ROLE_LABEL = { ceo:'CEO / Nahkoda', hr:'HRD', manager:'Manager', staff:'Kru' };
function can(perm){
  if(!CU) return false;
  // manageOps memakai status admin modul dari Office (superadmin + Rizki Arfan),
  // BUKAN appRole internal. Ini gate untuk halaman Operasional (Kru, Kalender) dan
  // Sistem (Pengaturan, Audit). Lihat OFFICE_HR_ADMIN.
  if(perm === 'manageOps') return OFFICE_HR_ADMIN;
  const r = CU.appRole;
  const P = {
    manageEmployees:['ceo','hr'], manageSettings:['ceo','hr'], inputKpi:['ceo','hr','manager'],
    manageReview:['ceo','hr','manager'], manageTraining:['ceo','hr','manager'], manageReward:['ceo','hr','manager'],
    manageDiscipline:['ceo','hr'], manageCareer:['ceo','hr'], seeAll:['ceo','hr'],
    coach:['ceo','hr','manager'], viewAudit:['ceo','hr'], exportData:['ceo','hr']
  };
  return (P[perm]||[]).includes(r);
}
function log(action, detail){
  S.audit.unshift({id:uid('a'), at:new Date().toISOString(), userId: CU?CU.id:'-', userName: CU?CU.name:'-', action, detail: detail||''});
  if(S.audit.length > 800) S.audit.length = 800;
}
function empById(id){ return S.employees.find(e=>e.id===id); }
function divById(id){ return S.divisions.find(d=>d.id===id); }
function divName(id){ const d=divById(id); return d?d.name:'-'; }
function activeEmps(){ return S.employees.filter(e=>e.status==='Aktif'); }
function scopeEmps(){
  if(can('seeAll')) return activeEmps();
  // Manager tanpa divisi (kru baru dari SSO yang belum dirapikan HRD) TIDAK
  // boleh jatuh ke filter divId===''; itu akan mengelompokkan semua orang yang
  // sama-sama belum berdivisi. Sampai HRD mengisi divisinya, dia lihat dirinya saja.
  if(CU.appRole==='manager' && CU.divId) return activeEmps().filter(e=>e.divId===CU.divId);
  return activeEmps().filter(e=>e.id===CU.id);
}

/* ===== Integrasi identitas Office (SSO) =====
   PeopleOS tidak punya login sendiri. Identitas datang dari Office lewat
   lm_session; kru dicocokkan ke daftar S.employees modul ini (id lalu nama).
   Kru baru (belum terdaftar di HR) disediakan sementara in-memory sebagai
   staff tanpa divisi; HRD merapikan data lengkapnya (divisi, level, dst) di
   halaman Kru. Pola sama dengan akademi/reservasi (Pattern B). */
function readLmSession(){
  try{
    const s = JSON.parse(localStorage.getItem('lm_session') || 'null');
    if(!s || !s.expiry || Date.now() > s.expiry) return null;
    const m = s.modules || [];
    if(!(m.indexOf('*') > -1 || m.indexOf('hr') > -1)) return null;
    return s;
  }catch(e){ return null; }
}
// Admin modul dari Office: adminModules mengandung '*' (superadmin: Admin,
// Howandi, Wandi) atau 'hr' (admin modul ini, mis. Rizki Arfan / HRD). Inilah
// "superadmin + Rizki Arfan" yang boleh membuka halaman Operasional & Sistem.
// Diatur lewat Kelola Akses Office, bukan hardcode. Diset saat boot.
let OFFICE_HR_ADMIN = false;
function officeIsHrAdmin(s){
  const adm = (s && s.adminModules) || [];
  return adm.indexOf('*') > -1 || adm.indexOf('hr') > -1;
}
// Peta hak Office -> role internal PeopleOS (ceo / hr / manager / staff).
// adminModules '*' (superadmin) atau 'hr' (admin modul HR) -> role hr.
function officeToAppRole(s){
  return officeIsHrAdmin(s) ? 'hr' : 'staff';
}
const normName = n => String(n||'').toLowerCase().replace(/[^a-z\s]/g,'').replace(/\s+/g,' ').trim();

/* Cari employee milik sesi Office ini.
   Urutan: (1) id Office, sumber paling pasti. (2) nama persis. (3) nama depan
   sama DAN cuma satu kandidat, untuk menjembatani "Howandi" (nama Office) vs
   "Howandi Chandra" (nama di roster). Pencocokan longgar sengaja hanya dipakai
   kalau kandidatnya tunggal; kalau ada dua "Rizki", lebih baik tidak menebak.
   Record yang cocok lewat nama langsung DIKLAIM (id ditimpa id Office) supaya
   pencocokan longgar hanya terjadi sekali seumur hidup record itu. */
function findEmployeeForSession(s){
  const byId = S.employees.find(x => x.id === s.userId);
  if(byId) return byId;

  /* Talenta ID sebelum nama: itu kunci yang pasti, nama tidak.
     Tanpa ini, dua kru yang nama depannya sama (mis. "Indah Putri Wardani"
     dan "Indah Sihombing") sama-sama gagal di pencocokan longgar di bawah,
     lalu DIBUATKAN record baru — padahal recordnya sudah ada. Akibatnya
     kru itu punya dua record: satu dengan Talenta ID, satu tanpa, dan
     halaman Kehadiran melaporkannya "belum punya Talenta ID". */
  const tid = String(s.talentaId||'');
  if(tid){
    const byTid = S.employees.filter(x => String(x.talentaId||'') === tid);
    if(byTid.length === 1) return byTid[0];
  }

  /* Kandidat yang Talenta ID-nya SUDAH TERISI dan BERBEDA bukan orang ini.
     Tanpa penjaga ini, pencocokan nama di bawah bisa menyatukan dua orang
     berbeda: "Indah Putri Wardani" (88125) pernah tercocokkan ke record
     "Indah Sihombing" (151426) hanya karena nama depannya sama dan waktu itu
     dialah satu-satunya "Indah" di daftar. Akibatnya identitas salah satunya
     hilang, bukan sekadar kembar. */
  const bukanOrangLain = x => !tid || !x.talentaId || String(x.talentaId) === tid;

  const target = normName(s.name);
  const exact = S.employees.filter(x => normName(x.name) === target && bukanOrangLain(x));
  if(exact.length === 1) return exact[0];

  const first = target.split(' ')[0];
  if(first){
    const loose = S.employees.filter(x => normName(x.name).split(' ')[0] === first && bukanOrangLain(x));
    if(loose.length === 1) return loose[0];
  }
  return null;
}
/* Ganti id employee di SELURUH data. Employee dirujuk lewat empId di banyak
   koleksi (violations, rewards, reviews, coachings, trainingRecords, moods,
   suggestions, successions) dan jadi KUNCI di kpiActuals/monthlyInputs. Menimpa
   id tanpa ikut memindahkan rujukan = riwayat orang itu jadi yatim. */
function reassignEmployeeId(oldId, newId){
  if(!oldId || !newId || oldId === newId) return;
  S.employees.forEach(e => { if(e.id === oldId) e.id = newId; });
  [S.reviews, S.competencies, S.trainingRecords, S.coachings, S.rewards, S.badges,
   S.violations, S.feedbacks, S.successions, S.moods, S.suggestions].forEach(list => {
    (list || []).forEach(r => { if(r && r.empId === oldId) r.empId = newId; });
  });
  (S.coachings || []).forEach(c => { if(c.coachId === oldId) c.coachId = newId; });
  (S.okrs || []).forEach(o => { if(o.ownerType === 'emp' && o.ownerId === oldId) o.ownerId = newId; });
  (S.audit || []).forEach(a => { if(a.userId === oldId) a.userId = newId; });
  if(S.monthlyInputs && S.monthlyInputs[oldId]){
    S.monthlyInputs[newId] = S.monthlyInputs[oldId]; delete S.monthlyInputs[oldId];
  }
}
/* Bereskan record kembar yang terlanjur dibuat sebelum pencocokan lewat
   Talenta ID ada. Gejalanya: satu orang punya DUA record — satu ber-Talenta ID
   (dari sinkron Office) dan satu tanpa (sisa pencocokan nama yang gagal karena
   nama depannya kembar, mis. dua "Indah").

   Yang MENANG adalah record yang id-nya sama dengan id Office, karena itu yang
   dirujuk sesi login dan grant modul. Riwayat dari record yang kalah dipindahkan
   lewat reassignEmployeeId, jadi tidak ada yang hilang.

   Hanya menggabungkan yang Talenta ID-nya SAMA PERSIS dan tidak kosong.
   Record tanpa Talenta ID tidak pernah disentuh: "belum dipetakan" bukan
   identitas, dan menggabungkan atas dasar itu akan menyatukan orang berbeda. */
function gabungKembarTalenta(){
  const perTid = {};
  S.employees.forEach(e => {
    const t = String(e.talentaId||'').trim();
    if(t) (perTid[t] = perTid[t] || []).push(e);
  });
  let berubah = false;
  Object.values(perTid).forEach(grup => {
    if(grup.length < 2) return;
    // Pemenang: yang punya riwayat paling banyak. Kalau seri, yang pertama.
    const skor = e => (S.reviews||[]).filter(r=>r.empId===e.id).length +
                      (S.trainingRecords||[]).filter(r=>r.empId===e.id).length +
                      (S.violations||[]).filter(r=>r.empId===e.id).length +
                      ((S.monthlyInputs||{})[e.id] ? 5 : 0);
    const menang = grup.slice().sort((a,b)=>skor(b)-skor(a))[0];
    grup.forEach(e => {
      if(e === menang) return;
      reassignEmployeeId(e.id, menang.id);
      berubah = true;
    });
    // reassignEmployeeId menyamakan id-nya; sisakan satu record saja.
    const lihat = new Set();
    S.employees = S.employees.filter(e => {
      if(e.id !== menang.id) return true;
      if(lihat.has(e.id)) return false;
      lihat.add(e.id); return true;
    });
  });
  return berubah;
}

function resolveOfficeUser(s){
  let u = findEmployeeForSession(s);
  if(u){
    // Klaim: ikat record ini ke identitas Office supaya login berikutnya lewat
    // jalur id (pasti), bukan tebak-tebakan nama. Rujukan riwayat ikut dipindah.
    // Cache saja: mencocokkan id ke identitas Office adalah housekeeping,
    // bukan perubahan data kru, jadi jangan sampai terlihat sebagai
    // "menyimpan perubahan" oleh user lain yang sedang membuka halaman ini.
    if(u.id !== s.userId){ reassignEmployeeId(u.id, s.userId); cacheLocal(); }
    return u;
  }
  u = { id: s.userId, name: s.name, role:'', divId:'', level:'Staff',
        appRole: officeToAppRole(s), joinDate:'', birthDate:'', status:'Aktif',
        phone:'', email:'', notes:'', probationEnd:'', contractEnd:'' };
  S.employees.push(u);   // in-memory; ikut tersimpan saat save() berikutnya
  return u;
}
function bootPeopleOS(){
  const office = readLmSession();
  if(!office){ location.replace('../'); return; }
  OFFICE_HR_ADMIN = officeIsHrAdmin(office);   // status admin dari Office, sumber gate Operasional/Sistem
  CU = resolveOfficeUser(office);
  log('LOGIN','');
  // Cache saja, JANGAN save() ke server: login semata bukan perubahan data.
  // save() penuh di sini bikin login siapapun terlihat sebagai "menyimpan
  // perubahan" di tab lain yang sedang terbuka (modal bentrok palsu).
  // Catatan LOGIN tetap ada di S.audit dan ikut terkirim naik pada save()
  // nyata berikutnya (mis. saat user itu benar-benar mengubah sesuatu).
  cacheLocal();
  $('#appView').style.display='block';
  buildNav(); go('dash');
}
function doLogout(){
  log('LOGOUT',''); cacheLocal();
  // Kembali ke pemilih modul Office. Sesi Office (lm_session) sengaja TIDAK
  // dihapus supaya user bisa pindah modul tanpa login ulang.
  location.replace('../');
}

/* ====== ENGINE: KPI SCORE ====== */
function kpiTemplateFor(divId){ return S.kpiTemplates.find(t=>t.divId===divId); }
function kpiItemScore(item, actual){
  if(actual==null || actual==='' || isNaN(actual)) return null;
  actual = Number(actual);
  let ach;
  if(item.dir==='down'){ ach = actual<=0 ? 120 : (item.target/actual)*100; }
  else { ach = item.target<=0 ? 100 : (actual/item.target)*100; }
  return clamp(ach, 0, 120);
}
function divKpiScore(divId, mk){
  const t = kpiTemplateFor(divId); if(!t) return null;
  const acts = (S.kpiActuals[divId]||{})[mk]||{};
  let sw=0, sum=0, filled=0;
  t.items.forEach(it=>{
    const sc = kpiItemScore(it, acts[it.id]);
    if(sc!=null){ sum += sc*it.weight; sw += it.weight; filled++; }
  });
  if(!sw) return null;
  return { score: clamp(sum/sw,0,120), filled, total:t.items.length };
}
function empKpiScore(emp, mk){
  const mi = ((S.monthlyInputs[emp.id]||{})[mk])||{};
  if(mi.kpiOverride!=null && mi.kpiOverride!=='') return clamp(Number(mi.kpiOverride),0,120);
  const d = divKpiScore(emp.divId, mk);
  return d ? Math.min(d.score,100) : null;
}

/* ====== KEHADIRAN: PEMBACA BERKAS TALENTA ======
   XLSX itu ZIP berisi XML. Dibaca langsung tanpa pustaka luar supaya modul
   ini tetap satu berkas HTML dan tidak menambah beban unduh untuk halaman
   yang jarang dipakai.

   Yang perlu diketahui tentang berkas Talenta:
   - Baris "TOTAL FOR EMPLOYEE : ..." disisipkan tiap ganti orang. Itu bukan
     data; dikenali dari kolom Date yang tidak berbentuk tanggal.
   - Teks bisa inline (<is><t>) ATAU lewat sharedStrings (t="s"). Ekspor yang
     saya periksa memakai inline, tapi Talenta bisa berubah, jadi keduanya
     ditangani. Salah satu saja = seluruh kolom nama kosong tanpa error.
   - Kolom dicari lewat JUDULNYA, bukan posisi. Talenta menambah kolom dari
     waktu ke waktu; mengunci ke huruf kolom akan diam-diam salah baca. */

const ATT_KOLOM = {  // judul di berkas -> nama field
  'Employee ID':'talentaId', 'Full Name':'name', 'Organization':'org',
  'Resign Status':'resign', 'Date':'date', 'Shift':'shift',
  'Attendance Code':'code', 'Time Off Code':'timeOff',
  'Check In':'checkIn', 'Check Out':'checkOut', 'Late In':'lateIn'
};

// 'AB' -> 27. Dipakai untuk memetakan referensi sel ke indeks kolom.
function colIndex(ref){
  let n = 0;
  for(const ch of ref.replace(/\d+/g,'')) n = n*26 + (ch.charCodeAt(0)-64);
  return n;
}
const attXmlText = s => String(s).replace(/&lt;/g,'<').replace(/&gt;/g,'>')
  .replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,'&');

// 'HH:MM' -> menit. '00:00' dan kosong sama-sama 0.
function hhmmToMin(t){
  const m = /^(\d{1,3}):(\d{2})/.exec(String(t||'').trim());
  return m ? (+m[1])*60 + (+m[2]) : 0;
}

async function parseTalentaXlsx(file){
  const buf = await file.arrayBuffer();
  const zip = await unzipEntries(buf);

  const sheet = zip['xl/worksheets/sheet1.xml'];
  if(!sheet) throw new Error('Bukan berkas XLSX Talenta: sheet1.xml tidak ditemukan.');

  // sharedStrings opsional — ekspor Talenta yang ada memakai teks inline.
  let shared = [];
  if(zip['xl/sharedStrings.xml']){
    shared = (zip['xl/sharedStrings.xml'].match(/<si>[\s\S]*?<\/si>/g)||[]).map(si=>
      (si.match(/<t[^>]*>([\s\S]*?)<\/t>/g)||[])
        .map(t=>attXmlText(t.replace(/<[^>]+>/g,''))).join(''));
  }

  const cellText = (c) => {
    const inline = /<is>[\s\S]*?<\/is>/.exec(c);
    if(inline) return attXmlText(inline[0].replace(/<[^>]+>/g,''));
    const v = /<v>([\s\S]*?)<\/v>/.exec(c);
    if(!v) return '';
    if(/\bt="s"/.test(c)) return shared[+v[1]] ?? '';
    return attXmlText(v[1]);
  };

  const rows = sheet.match(/<row[\s\S]*?<\/row>/g) || [];
  if(!rows.length) throw new Error('Berkas kosong: tidak ada baris sama sekali.');

  // Baris pertama = judul kolom.
  const headMap = {};   // indeks kolom -> field
  (rows[0].match(/<c [\s\S]*?(?:\/>|<\/c>)/g)||[]).forEach(c=>{
    const ref = /r="([A-Z]+)\d+"/.exec(c);
    const field = ATT_KOLOM[cellText(c).trim()];
    if(ref && field) headMap[colIndex(ref[1])] = field;
  });
  const wajib = ['talentaId','name','date','shift'];
  const hilang = wajib.filter(f=>!Object.values(headMap).includes(f));
  if(hilang.length) throw new Error('Kolom wajib tidak ada di berkas: '+hilang.join(', '));

  const out = [];
  for(let i=1;i<rows.length;i++){
    const rec = {};
    (rows[i].match(/<c [\s\S]*?(?:\/>|<\/c>)/g)||[]).forEach(c=>{
      const ref = /r="([A-Z]+)\d+"/.exec(c);
      if(!ref) return;
      const field = headMap[colIndex(ref[1])];
      if(field) rec[field] = cellText(c).trim();
    });
    // Penyaring baris "TOTAL FOR EMPLOYEE": tanggalnya bukan tanggal.
    if(!/^\d{4}-\d{2}-\d{2}$/.test(rec.date||'')) continue;
    if(!rec.talentaId) continue;
    out.push({
      talentaId: rec.talentaId, name: rec.name||'', org: rec.org||'',
      resign: rec.resign||'', date: rec.date, shift: rec.shift||'',
      code: rec.code||'', timeOff: rec.timeOff||'',
      checkIn: rec.checkIn||'', checkOut: rec.checkOut||'',
      lateMin: hhmmToMin(rec.lateIn)
    });
  }
  if(!out.length) throw new Error('Tidak ada baris absensi yang terbaca. Pastikan ini report "Attendance" dari Talenta.');
  return out;
}

/* Pembaca ZIP seadanya: cukup untuk XLSX, yang isinya selalu deflate mentah
   atau tanpa kompresi. DecompressionStream ada di semua browser yang dipakai
   Office (Chrome/Edge 80+, Safari 16.4+). */
async function unzipEntries(buf){
  const dv = new DataView(buf), u8 = new Uint8Array(buf), out = {};
  // Cari End of Central Directory dari belakang.
  let eocd = -1;
  for(let i=u8.length-22;i>=0 && i>u8.length-65558;i--){
    if(dv.getUint32(i,true) === 0x06054b50){ eocd = i; break; }
  }
  if(eocd < 0) throw new Error('Berkas rusak atau bukan .xlsx (struktur ZIP tidak ditemukan).');

  let n = dv.getUint16(eocd+10,true), p = dv.getUint32(eocd+16,true);
  const dec = new TextDecoder();
  for(let i=0;i<n;i++){
    if(dv.getUint32(p,true) !== 0x02014b50) break;
    const metode = dv.getUint16(p+10,true);
    const ukuran = dv.getUint32(p+20,true);
    const nLen = dv.getUint16(p+28,true), eLen = dv.getUint16(p+30,true),
          kLen = dv.getUint16(p+32,true);
    const nama = dec.decode(u8.subarray(p+46, p+46+nLen));
    const lho  = dv.getUint32(p+42,true);
    p += 46 + nLen + eLen + kLen;

    // Header lokal punya panjang field sendiri — yang di central directory
    // TIDAK selalu sama, dan memakai yang salah menggeser awal data.
    const lnLen = dv.getUint16(lho+26,true), leLen = dv.getUint16(lho+28,true);
    const mulai = lho + 30 + lnLen + leLen;
    const data = u8.subarray(mulai, mulai + ukuran);

    if(!/\.xml$/.test(nama)) continue;              // hanya XML yang dipakai
    if(metode === 0){ out[nama] = dec.decode(data); continue; }
    if(metode !== 8) continue;
    const ds = new DecompressionStream('deflate-raw');
    const buf2 = await new Response(new Blob([data]).stream().pipeThrough(ds)).arrayBuffer();
    out[nama] = dec.decode(buf2);
  }
  return out;
}

/* ====== KEHADIRAN: MESIN NILAI ======
   Skor dihitung ULANG dari baris harian tiap kali dibaca — tidak pernah
   disimpan sebagai angka jadi. Konsekuensinya disengaja: mengubah aturan
   di Pengaturan langsung berlaku ke semua bulan yang sudah diunggah. */

function attRules(){ return S.settings.attendanceRules || {}; }

// Apakah nama shift ini berarti "bukan hari kerja".
function isOffShift(shift){
  const R = attRules(), s = String(shift||'').trim().toLowerCase();
  if(!s) return false;
  if((R.offShifts||[]).some(x=>String(x).trim().toLowerCase() === s)) return true;
  return (R.offShiftContains||[]).some(x=>s.includes(String(x).toLowerCase()));
}

/* Hitung satu bulan untuk satu kru. Mengembalikan null kalau tidak ada
   data sama sekali, supaya peopleScore bisa jatuh ke input manual.

   Urutan pemeriksaan tiap hari PENTING:
     1. shift libur          -> tidak dihitung sama sekali
     2. kode izin berjatah   -> tidak dihitung SELAMA masih dalam jatah
     3. kode izin bebas      -> tidak dihitung
     4. ada check-in         -> hadir (penuh / setengah bila tanpa check-out)
     5. sisanya              -> alpa
   Kalau nomor 2 ditaruh setelah 4, izin yang kelewat jatah tidak akan
   pernah terhitung alpa. */
function attendanceDetail(empId, mk){
  const bulan = (S.attendance||{})[mk];
  if(!bulan || !Array.isArray(bulan.days)) return null;
  const hari = bulan.days.filter(d=>d.empId === empId);
  if(!hari.length) return null;

  const R = attRules();
  const tol = R.lateToleranceMin ?? 15, cap = R.lateCapMin ?? 45;
  const kreditNoOut = R.noCheckoutCredit ?? 0.5;
  const caps = R.excusedCaps || {};
  const bebas = R.excusedCodes || [];

  const d = {
    hariKerja:0, hadir:0, hadirPenuh:0, tanpaCheckout:0, alpa:0,
    telat:0, telatMenit:0, libur:0, izin:0, izinLewatJatah:0,
    kredit:0, penaltiTelat:0, rincian:[]
  };
  const dipakai = {};   // berapa kali tiap kode berjatah sudah terpakai

  hari.slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))).forEach(h=>{
    const kode = String(h.code||h.timeOff||'').trim().toUpperCase();
    let status;

    if(isOffShift(h.shift)){ d.libur++; status='libur'; }
    else if(caps[kode] != null){
      dipakai[kode] = (dipakai[kode]||0) + 1;
      if(dipakai[kode] <= caps[kode]){ d.izin++; status='izin'; }
      else {
        // Jatah habis: hari ini dihitung sebagai hari kerja yang ditinggalkan.
        d.hariKerja++; d.alpa++; d.izinLewatJatah++; status='izin-lewat';
      }
    }
    else if(bebas.includes(kode)){ d.izin++; status='izin'; }
    else if(h.checkIn){
      d.hariKerja++;
      if(h.checkOut){ d.hadir++; d.hadirPenuh++; d.kredit += 1; status='hadir'; }
      else { d.hadir++; d.tanpaCheckout++; d.kredit += kreditNoOut; status='tanpa-checkout'; }

      // Terlambat hanya dinilai pada hari yang memang dihadiri.
      const lm = Number(h.lateMin||0);
      if(lm > tol){
        d.telat++; d.telatMenit += lm;
        // Ramp linear dari toleransi ke cap: 15 mnt -> 0, 45 mnt ke atas -> 1.
        d.penaltiTelat += cap > tol ? Math.min((lm - tol) / (cap - tol), 1) : 1;
      }
    }
    else { d.hariKerja++; d.alpa++; status='alpa'; }

    d.rincian.push({date:h.date, shift:h.shift, code:kode, status,
                    checkIn:h.checkIn, checkOut:h.checkOut, lateMin:Number(h.lateMin||0)});
  });

  if(!d.hariKerja) return null;   // sebulan penuh libur/izin: tidak ada yang dinilai

  /* Tidak pernah check-in SEKALI PUN sebulan penuh hampir selalu berarti
     orangnya tidak memakai aplikasi absensi (kru baru, ponsel bermasalah,
     posisi yang tidak diwajibkan tap), bukan bolos 25 hari berturut-turut.
     Skor 30 untuk kasus begitu terbaca seperti vonis padahal sumbernya
     data kosong, jadi ditandai dan TIDAK diberi skor — persis seperti
     komponen lain yang kosong. Bedakan dari orang yang hadir 24 hari lalu
     alpa 1: itu tetap dinilai. */
  if(d.hadir === 0){ d.noData = true; d.score = null; d.presence = null; d.punctuality = null; return d; }

  const W = R.weights || {presence:70, punctuality:30};
  const totalW = (W.presence||0) + (W.punctuality||0);
  d.presence = (d.kredit / d.hariKerja) * 100;
  // Penalti telat dibagi hari kerja, bukan jumlah hari telat: telat 3 dari
  // 25 hari tidak boleh terbaca sama buruknya dengan telat 3 dari 3 hari.
  d.punctuality = clamp((1 - d.penaltiTelat / d.hariKerja) * 100, 0, 100);
  d.score = totalW ? clamp((d.presence*(W.presence||0) + d.punctuality*(W.punctuality||0)) / totalW, 0, 100) : 0;
  return d;
}

// Angka yang dipakai People Score. null = tidak ada data bulan itu, atau
// kru itu tidak pernah tap sama sekali (lihat noData di attendanceDetail).
function attendanceScore(empId, mk){
  const d = attendanceDetail(empId, mk);
  return (d && d.score != null) ? d.score : null;
}

// Rata-rata seluruh bulan yang punya data — untuk kolom "kumulatif".
function attendanceCumulative(empId){
  const mks = Object.keys(S.attendance||{}).sort();
  const nilai = [];
  mks.forEach(mk=>{ const d = attendanceDetail(empId, mk); if(d && d.score != null) nilai.push(d); });
  if(!nilai.length) return null;
  // Ditimbang jumlah hari kerja, bukan rata-rata dari rata-rata: bulan yang
  // cuma berisi 3 hari kerja tidak boleh sebobot bulan penuh.
  const totHari = nilai.reduce((a,x)=>a+x.hariKerja, 0);
  return { score: nilai.reduce((a,x)=>a + x.score*x.hariKerja, 0) / totHari,
           bulan: nilai.length, hariKerja: totHari };
}

/* ====== ENGINE: KOMPONEN PEOPLE SCORE ====== */
function trainingScore(empId){
  // Sumber utama: Akademi (training ASLI, materi + kuis). Kalau ada entri untuk
  // kru ini, itu yang dipakai, bukan input manual. Lihat docs/hr-akademi-integration.md.
  if(AKADEMI_STATS && AKADEMI_STATS[empId] && AKADEMI_STATS[empId].mandPct != null){
    return clamp(Number(AKADEMI_STATS[empId].mandPct), 0, 100);
  }
  // Fallback (Akademi belum tersambung / kru belum ada di Akademi): hitung dari
  // catatan training manual seperti sebelumnya.
  const recs = S.trainingRecords.filter(r=>r.empId===empId);
  const mandatory = S.trainings.filter(t=>t.mandatory && (t.divId==='all' || t.divId===(empById(empId)||{}).divId));
  if(!mandatory.length && !recs.length) return null;
  const relevant = mandatory.length ? mandatory : S.trainings.filter(t=>recs.some(r=>r.trainingId===t.id));
  if(!relevant.length) return null;
  const done = relevant.filter(t=>recs.some(r=>r.trainingId===t.id && r.status==='Lulus')).length;
  return (done/relevant.length)*100;
}
// Apakah skor training kru ini datang dari Akademi (untuk penanda UI).
function trainingFromAkademi(empId){
  return !!(AKADEMI_STATS && AKADEMI_STATS[empId] && AKADEMI_STATS[empId].mandPct != null);
}
function feedbackScore(empId, mk){
  const fb = S.feedbacks.filter(f=>f.empId===empId && monthKey(f.date)===mk);
  if(!fb.length) return null;
  const pos = fb.filter(f=>f.kind==='positif').length, neg = fb.length-pos;
  return clamp(80 + pos*5 - neg*10, 0, 100);
}
function disciplineScore(empId, mk){
  const vio = S.violations.filter(v=>v.empId===empId && monthKey(v.date)===mk && v.status!=='Dibatalkan');
  let ded = 0;
  vio.forEach(v=>{ ded += (S.settings.violationDeduct[v.severity]||0); });
  return clamp(100-ded, 0, 100);
}
function reviewAspectScore(empId, mk, aspects){
  const rv = S.reviews.find(r=>r.empId===empId && r.month===mk);
  if(!rv) return null;
  const w = S.settings.reviewLayerWeights;
  const vals = [];
  aspects.forEach(a=>{
    let sw=0,sum=0;
    ['self','manager','hr','ceo'].forEach(L=>{
      const lay=rv.layers[L];
      if(lay && lay.aspects && lay.aspects[a]!=null){ sum += Number(lay.aspects[a])*(w[L]||0); sw += (w[L]||0); }
    });
    if(sw) vals.push(sum/sw);
  });
  if(!vals.length) return null;
  return avg(vals)*10; // 1-10 -> 0-100
}
function reviewOverallScore(empId, mk){
  return reviewAspectScore(empId, mk, REVIEW_ASPECTS);
}
const REVIEW_ASPECTS = ['Skill','Knowledge','Attitude','Leadership','Discipline','Communication','Problem Solving','Ownership','Integrity','Initiative','Creativity','Customer Service'];

function peopleScore(emp, mk){
  const W = S.settings.scoreWeights;
  const mi = ((S.monthlyInputs[emp.id]||{})[mk])||{};
  const dflt = S.settings.defaultComponentScore;
  const comp = {};
  /* Kehadiran: report Talenta yang diunggah MENANG atas input manual, sama
     seperti Akademi menang atas catatan training manual. Input manual tetap
     dipakai untuk bulan-bulan sebelum modul ini ada — kalau tidak, semua
     histori attendance akan hilang begitu fitur ini menyala. */
  comp.attendance = attendanceScore(emp.id, mk);
  if(comp.attendance==null && mi.attendance!=null && mi.attendance!=='') comp.attendance = clamp(Number(mi.attendance),0,100);
  comp.kpi = empKpiScore(emp, mk);
  comp.training = trainingScore(emp.id);
  comp.review = feedbackScore(emp.id, mk); // customer review
  if(comp.review==null && mi.review!=null && mi.review!=='') comp.review = clamp(Number(mi.review),0,100);
  comp.discipline = disciplineScore(emp.id, mk);
  comp.teamwork = reviewAspectScore(emp.id, mk, ['Attitude','Communication']);
  if(comp.teamwork==null && mi.teamwork!=null && mi.teamwork!=='') comp.teamwork = clamp(Number(mi.teamwork),0,100);
  comp.initiative = reviewAspectScore(emp.id, mk, ['Initiative','Ownership']);
  if(comp.initiative==null && mi.initiative!=null && mi.initiative!=='') comp.initiative = clamp(Number(mi.initiative),0,100);
  let sum=0, dataFilled=0, totalW=0;
  const keys = ['attendance','kpi','training','review','discipline','teamwork','initiative'];
  keys.forEach(k=>{
    const w = W[k]||0; totalW += w;
    let v = comp[k];
    if(v==null){ v = dflt; } else { dataFilled += w; }
    comp[k+'_used'] = v;
    sum += Math.min(v,100)*w;
  });
  const score = totalW ? sum/totalW : 0;
  return { score, comp, completeness: totalW? Math.round(dataFilled/totalW*100):0 };
}
function gradeOf(score){
  const g = S.settings.grades.slice().sort((a,b)=>b.min-a.min).find(g=>score>=g.min);
  return g ? g.g : 'D';
}
/* Ambang kelengkapan data. Di bawah ini, skor sebagian besar berasal dari nilai
   default (defaultComponentScore), bukan dari kinerja yang benar-benar terukur:
   kru tanpa data apa pun tetap keluar sekitar 77 (grade B). Angka seperti itu
   tidak boleh tampil seolah-olah hasil penilaian, karena dipakai untuk ranking
   dan promosi. Skor tetap dihitung, tapi ditandai jelas. */
const SCORE_MIN_COMPLETENESS = 40;

// `completeness` opsional supaya pemanggil lama tetap jalan; kalau diisi dan
// masih di bawah ambang, grade diganti penanda "data kurang".
function gradeTag(score, completeness){
  if(completeness != null && completeness < SCORE_MIN_COMPLETENESS){
    return '<span class="tag mut" title="Kelengkapan data '+completeness+'%. Sebagian besar komponen memakai nilai default, jadi skor ini belum bisa dipakai menilai.">data kurang</span>';
  }
  const g = gradeOf(score);
  const cls = score>=85?'ok':score>=70?'gold':score>=60?'warn':'bad';
  return '<span class="tag '+cls+'"><span class="grade">'+g+'</span></span>';
}

}
function barHtml(v, max){
  max = max||100; const p = clamp((v/max)*100,0,100);
  const cls = v>=85?'g':v>=70?'':v>=60?'w':'b';
  return '<div class="flex"><div class="bar grow '+cls+'"><i style="width:'+p+'%"></i></div><span class="mono small" style="width:38px;text-align:right">'+fmtNum(v)+'</span></div>';
}
function sparkline(vals, w, h){
  w=w||160; h=h||40;
  const pts = vals.filter(v=>v!=null);
  if(pts.length<2) return '<span class="xs mut">data belum cukup</span>';
  const mn = Math.min(...pts)-2, mx = Math.max(...pts)+2;
  const step = w/(vals.length-1);
  let dAttr='', started=false;
  vals.forEach((v,i)=>{
    if(v==null) return;
    const x=(i*step).toFixed(1), y=(h-((v-mn)/(mx-mn||1))*h).toFixed(1);
    dAttr += (started?' L':'M')+x+' '+y; started=true;
  });
  return '<svg class="chart" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'"><path d="'+dAttr+'" fill="none" stroke="#B8893A" stroke-width="2" stroke-linecap="round"/></svg>';
}

/* ====== INSIGHT ENGINE ======
   Aturan tetap (bukan AI): skor turun, pelanggaran menumpuk, training tertinggal,
   kontrak mau habis, action plan coaching lewat deadline. Semua dihormati batas
   scopeEmps() supaya kru biasa tidak melihat data rekannya. */
function buildInsights(mk){
  const prev = shiftMonth(mk,-1);
  const out = [];
  scopeEmps().forEach(e=>{
    if(e.appRole==='ceo') return;
    const now = peopleScore(e, mk), was = peopleScore(e, prev);
    if(now.completeness>=40 && was.completeness>=40 && was.score-now.score >= 8)
      out.push({sev:'warn', text: e.name+': People Score turun '+fmtNum(was.score-now.score)+' poin dari bulan lalu ('+fmtNum(was.score)+' → '+fmtNum(now.score)+'). Rekomendasi: jadwalkan coaching minggu ini.', act:'coach', empId:e.id});
    const vio = S.violations.filter(v=>v.empId===e.id && monthKey(v.date)===mk && v.status!=='Dibatalkan');
    if(vio.length>=2) out.push({sev:'bad', text: e.name+': '+vio.length+' pelanggaran bulan ini. Cek modul Disiplin. Kemungkinan perlu SP sesuai aturan eskalasi.', act:'disc', empId:e.id});
    const ts = trainingScore(e.id);
    if(ts!=null && ts<50) out.push({sev:'info', text: e.name+': training wajib baru '+fmtNum(ts)+'% selesai. Assign ulang di Training Center.', act:'training', empId:e.id});
  });
  // scopeEmps(), BUKAN S.employees: tanggal habis kontrak itu data HR sensitif.
  // Tanpa ini, kru biasa ikut melihat kontrak semua rekannya di Anjungan.
  scopeEmps().filter(e=>e.contractEnd).forEach(e=>{
    const d = Math.round((new Date(e.contractEnd)-new Date())/86400000);
    if(d>=0 && d<=45) out.push({sev:'warn', text:'Kontrak '+e.name+' habis '+fmtDate(e.contractEnd)+' ('+d+' hari lagi). Putuskan perpanjang / evaluasi.', act:'emp', empId:e.id});
  });
  const cnt = S.coachings.filter(c=>c.status!=='Selesai' && c.deadline && c.deadline < todayStr()).length;
  if(cnt) out.push({sev:'warn', text: cnt+' action plan coaching lewat deadline dan belum di-follow up.', act:'coach'});
  return out.slice(0, 8);
}

/* ====== PAGE: ANJUNGAN (DASHBOARD) ====== */
RENDER.dash = function(c){
  const mk = monthKey();
  const emps = scopeEmps().filter(e=>e.appRole!=='ceo');
  // Hanya kru dengan data memadai yang masuk ranking & rata-rata. Kalau tidak,
  // kru tanpa data (skor default) ikut menggerakkan angka dan bisa nangkring di Top 5.
  const scored = emps.map(e=>({e, ps: peopleScore(e, mk)}))
    .filter(x => x.ps.completeness >= SCORE_MIN_COMPLETENESS)
    .sort((a,b)=>b.ps.score-a.ps.score);
  const avgScore = avg(scored.map(x=>x.ps.score));
  const trainAvg = avg(emps.map(e=>trainingScore(e.id)).filter(v=>v!=null));
  const vioCount = S.violations.filter(v=>monthKey(v.date)===mk && v.status!=='Dibatalkan').length;
  const moodsMk = S.moods.filter(m=>monthKey(m.date)===mk);
  const moodAvg = avg(moodsMk.map(m=>m.mood));
  const insights = buildInsights(mk);
  const my = peopleScore(CU, mk);

  let html = '';
  // Kartu personal untuk semua role
  html += '<div class="card" style="background:linear-gradient(120deg,var(--ink),var(--ink3));color:#fff;border:none;margin-bottom:16px">'+
    '<div class="flex"><div class="grow"><div class="disp" style="font-size:21px;font-weight:700">Halo, '+esc(CU.name.split(' ')[0])+' 👋</div>'+
    '<div class="small" style="color:#B9C6D2;margin-top:3px">'+esc(divName(CU.divId))+', '+fmtMonth(mk)+'</div></div>'+
    (CU.appRole!=='ceo' ? '<div style="text-align:right"><div class="xs" style="color:#B9C6D2;letter-spacing:.1em">PEOPLE SCORE BULAN INI</div>'+
      (my.completeness < SCORE_MIN_COMPLETENESS
        // Menampilkan angka besar dari data yang hampir semuanya default itu
        // menyesatkan, apalagi ini skor diri sendiri yang paling dipercaya orang.
        ? '<div class="disp" style="font-size:22px;font-weight:700;color:#B9C6D2">Belum bisa dinilai</div>'+
          '<div class="xs" style="color:#8FA2B5">data baru '+my.completeness+'%, minimal '+SCORE_MIN_COMPLETENESS+'% supaya skor berarti</div>'
        : '<div class="disp" style="font-size:30px;font-weight:700;color:var(--gold)">'+fmtNum(my.score)+' <span style="font-size:17px">'+gradeOf(my.score)+'</span></div>'+
          '<div class="xs" style="color:#8FA2B5">kelengkapan data '+my.completeness+'%</div>')+
    '</div>' : '')+
    '</div></div>';

  html += '<div class="cards g4" style="margin-bottom:16px">'+
    kcard('Rata-rata People Score', fmtNum(avgScore), scored.length? fmtMonth(mk)+', '+scored.length+' kru terukur' : 'belum ada kru dgn data cukup')+
    kcard('Training Wajib Selesai', trainAvg!=null?fmtNum(trainAvg)+'%':'-', 'rata-rata tim')+
    kcard('Pelanggaran Bulan Ini', vioCount, vioCount? 'perlu tindak lanjut':'bersih 👍')+
    kcard('Mood Tim', moodAvg? fmtNum(moodAvg)+' / 5':'-', moodsMk.length+' check-in')+
    '</div>';

  // Insight
  html += '<div class="sec-title"><h3>Insight Otomatis</h3><span class="sub">hal yang perlu ditindak, dihitung dari data bulan ini</span></div>';
  if(!insights.length) html += '<div class="empty">Tidak ada alert. Kapal berlayar tenang. ⚓</div>';
  else html += insights.map(i=>{
    // Tombol "Buka" hanya kalau user memang boleh membuka halaman tujuannya,
    // supaya tidak mengarahkan ke halaman admin lalu ditolak go().
    const btn = canOpenPage(i.act) ? '<button class="btn btn-line btn-xs" onclick="APP.go(\''+i.act+'\')">Buka →</button>' : '';
    return '<div class="note'+(i.sev==='warn'||i.sev==='bad'?' w':'')+'" style="display:flex;gap:10px;align-items:center"><span class="grow">'+esc(i.text)+'</span>'+btn+'</div>';
  }).join('');

  // Leaderboard mini + KPI divisi
  html += '<div class="cards g2" style="margin-top:16px"><div class="card"><h3>Top 5 People Score, '+fmtMonth(mk)+'</h3>';
  if(!scored.length) html+='<div class="mut small">Belum ada data.</div>';
  else html += '<table class="tbl" style="box-shadow:none">'+scored.slice(0,5).map((x,i)=>
    '<tr><td style="width:26px" class="mono">'+(i+1)+'</td><td><b>'+esc(x.e.name)+'</b><div class="xs mut">'+esc(divName(x.e.divId))+'</div></td><td style="width:110px">'+barHtml(x.ps.score)+'</td><td style="width:50px">'+gradeTag(x.ps.score, x.ps.completeness)+'</td></tr>').join('')+'</table>';
  html += '<button class="btn btn-line btn-sm" style="margin-top:10px" onclick="APP.go(\'score\')">Lihat semua →</button></div>';

  html += '<div class="card"><h3>KPI per Divisi, '+fmtMonth(mk)+'</h3><table class="tbl" style="box-shadow:none">';
  S.divisions.filter(d=>kpiTemplateFor(d.id)).forEach(d=>{
    const ks = divKpiScore(d.id, mk);
    html += '<tr><td><b>'+esc(d.name)+'</b></td><td style="width:140px">'+(ks?barHtml(ks.score,120):'<span class="xs mut">belum diinput</span>')+'</td><td class="xs mut" style="width:70px">'+(ks?ks.filled+'/'+ks.total+' item':'')+'</td></tr>';
  });
  html += '</table><button class="btn btn-line btn-sm" style="margin-top:10px" onclick="APP.go(\'kpi\')">Input KPI →</button></div></div>';

  // Kalender ringkas
  const upcoming = calendarItems().filter(ev=>ev.date>=todayStr()).slice(0,6);
  html += '<div class="sec-title"><h3>Agenda Terdekat</h3></div>';
  html += upcoming.length ? '<div class="card"><table class="tbl" style="box-shadow:none">'+upcoming.map(ev=>'<tr><td style="width:110px" class="mono small">'+fmtDate(ev.date)+'</td><td><b>'+esc(ev.title)+'</b>'+(ev.note?'<div class="xs mut">'+esc(ev.note)+'</div>':'')+'</td><td style="width:90px"><span class="tag '+ev.cls+'">'+esc(ev.kind)+'</span></td></tr>').join('')+'</table></div>' : '<div class="empty">Belum ada agenda.</div>';

  c.innerHTML = html;
};
function kcard(lbl, val, sub){ return '<div class="card kpi-card"><div class="lbl">'+lbl+'</div><div class="val">'+val+'</div><div class="sub">'+sub+'</div></div>'; }

RENDER.score = function(c){
  const mk = $('#psMonth') ? $('#psMonth').value : monthKey();
  renderScore(c, mk);
};
function renderScore(c, mk){
  const emps = scopeEmps().filter(e=>e.appRole!=='ceo');
  const all = emps.map(e=>({e, ps: peopleScore(e, mk)}));
  // Pisahkan yang datanya cukup dari yang belum. Mengurutkan keduanya bersama
  // berarti kru tanpa data (skor default ~77) bisa mengalahkan kru yang benar
  // benar diukur, dan podium juaranya jadi karangan.
  const rows   = all.filter(r => r.ps.completeness >= SCORE_MIN_COMPLETENESS).sort((a,b)=>b.ps.score-a.ps.score);
  const unrank = all.filter(r => r.ps.completeness <  SCORE_MIN_COMPLETENESS);
  const W = S.settings.scoreWeights;
  let html = '<div class="toolbar">'+monthPicker('psMonth', mk)+'<span class="sp"></span>'+
    (can('inputKpi')?'<button class="btn btn-pri btn-sm" onclick="APP.openMonthlyInput()">＋ Input Data Bulanan</button>':'')+'</div>';
  html += '<div class="note">Bobot: Attendance '+W.attendance+'% (dari report Talenta di halaman Kehadiran), KPI '+W.kpi+'%, Training '+W.training+'%, Customer Review '+W.review+'%, Disiplin '+W.discipline+'%, Teamwork '+W.teamwork+'%, Inisiatif '+W.initiative+'%. Komponen kosong memakai nilai default '+S.settings.defaultComponentScore+'. Ubah di Pengaturan.</div>';
  if(unrank.length){
    html += '<div class="note w">'+unrank.length+' kru belum masuk ranking karena kelengkapan datanya di bawah '+SCORE_MIN_COMPLETENESS+'% ('+
      esc(unrank.map(r=>r.e.name).join(', '))+'). Skor mereka masih sebagian besar nilai default, jadi belum menggambarkan kinerja. Isi Data Bulanan dan KPI divisinya dulu.</div>';
  }

  if(rows.length>=3){
    const p = rows.slice(0,3);
    html += '<div class="podium">'+
      pod(p[1],2,mk)+pod(p[0],1,mk)+pod(p[2],3,mk)+'</div>';
  }
  html += '<table class="tbl"><thead><tr><th>#</th><th>Kru</th><th>Divisi</th><th class="num">Attend</th><th class="num">KPI</th><th class="num">Training</th><th class="num">Review</th><th class="num">Disiplin</th><th>Score</th><th>Grade</th><th>Tren 6 bln</th><th></th></tr></thead><tbody>';
  const line = (r, rank) => {
    const cp=r.ps.comp;
    const weak = r.ps.completeness < SCORE_MIN_COMPLETENESS;
    const trend = lastMonths(6, mk).map(m=>{ const p2=peopleScore(r.e,m); return p2.completeness>=SCORE_MIN_COMPLETENESS?p2.score:null; });
    return '<tr'+(weak?' style="opacity:.6"':'')+'><td class="mono">'+(rank||'–')+'</td><td><b>'+esc(r.e.name)+'</b><div class="xs mut">'+esc(r.e.role)+'</div></td><td class="small">'+esc(divName(r.e.divId))+'</td>'+
      cell(cp.attendance)+cell(cp.kpi)+cell(cp.training)+cell(cp.review)+cell(cp.discipline)+
      '<td style="min-width:110px">'+(weak?'<span class="xs mut">belum cukup data</span>':barHtml(r.ps.score))+'</td>'+
      '<td>'+gradeTag(r.ps.score, r.ps.completeness)+'</td><td>'+sparkline(trend,110,30)+'</td>'+
      '<td><button class="btn btn-line btn-xs" onclick="APP.openEmpDetail(\''+r.e.id+'\')">Detail</button></td></tr>';
  };
  rows.forEach((r,i)=>{ html += line(r, i+1); });
  unrank.forEach(r=>{ html += line(r, null); });
  if(!all.length) html += '<tr><td colspan="12" class="mut small" style="text-align:center;padding:20px">Belum ada kru.</td></tr>';
  html += '</tbody></table><div class="hint">Skor komponen "–" artinya belum ada data, jadi nilai default dipakai. Kru dengan kelengkapan di bawah '+SCORE_MIN_COMPLETENESS+'% tidak diberi ranking dan grade, karena skornya belum menggambarkan kinerja.</div>';
  c.innerHTML = html;
  mpHandlers['psMonth'] = nv => renderScore(c, nv);
  function cell(v){ return '<td class="num'+(v==null?' mut':'')+'">'+(v==null?'–':fmtNum(v))+'</td>'; }
  function pod(r, rank, mk2){
    if(!r) return '';
    return '<div class="pod'+(rank===1?' first':'')+'"><div class="rank">'+(rank===1?'🏆':'#'+rank)+'</div><b>'+esc(r.e.name)+'</b><div class="xs mut">'+esc(divName(r.e.divId))+'</div><div class="disp" style="font-size:22px;font-weight:700;color:var(--ink);margin-top:4px">'+fmtNum(r.ps.score)+'</div>'+gradeTag(r.ps.score, r.ps.completeness)+'</div>';
  }
}

RENDER.kehadiran = function(c){
