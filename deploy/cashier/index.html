/* ============ 2. COMPLIMENT ============
   Di luar kalkulasi metode pembayaran: ini catatan SIAPA yang merelakan omset
   dan untuk apa. PIC-nya ditarik dari akun Office ber-Tim/Keterangan
   Marketing/Office/Event, ditambah "Tamu" yang bukan orang — compliment untuk
   tamu umum tidak boleh membebani realisasi siapa pun. */
let compDate=todayISO();
let COMP_ROSTER=null, COMP_ROSTER_ERR='';
/* Peta Tim/Keterangan MENTAH dari Office (kunci '#id' dan '@nama' → teks apa
   adanya), diisi berbarengan dengan COMP_ROSTER dari balasan yang sama.
   Dipisah karena COMP_ROSTER sudah TERSARING: ia hanya menyimpan divisi yang
   dikenal COMP_DIV, jadi akun ber-keterangan "kasir floor" tersimpan sebagai
   divs:['kasir'] — persis sama dengan kasir murni, tidak bisa dibedakan lagi.
   Penyaringan Performa Kasir butuh teks aslinya. Lihat kasirMurni(). */
let KET_MAP=null;
function ambilRoster(){
  if(COMP_ROSTER!==null) return Promise.resolve(COMP_ROSTER);
  return fetch('../account-api-mysql/api.php',{method:'POST',redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'listDivisiRoster'})})
    .then(r=>r.json())
    .then(j=>{
      if(!j||!j.ok||!Array.isArray(j.members)) throw new Error(j&&j.error||'balasan tidak dikenal');
      /* `divs` (JAMAK) sejak Office boleh memberi satu orang lebih dari satu
         tim. Kembar persis dengan ambilRoster() di deploy/kompas/index.html —
         kalau salah satu diubah, ubah keduanya. */
      /* Diisi SEBELUM penyaringan di bawah, dan tanpa membuang yang nonaktif:
         ini kamus keterangan, bukan daftar orang yang boleh dipilih. */
      KET_MAP={};
      j.members.forEach(u=>{
        const teks=String(u.keterangan||'');
        if(u.id!=null&&u.id!=='') KET_MAP['#'+u.id]=teks;
        const nm=String(u.name||'').trim().toLowerCase();
        if(nm) KET_MAP['@'+nm]=teks;
      });
      COMP_ROSTER=j.members.map(u=>{
        if(u.active===false) return null;
        const ket=String(u.keterangan||'').toLowerCase().split(/[\s,;/]+/);
        const divs=COMP_DIV.filter(dv=>ket.indexOf(dv)>-1);
        if(!divs.length) return null;
        return {id:u.id,name:String(u.name||'').trim(),div:divs[0],divs};
      }).filter(u=>u&&u.name);
      COMP_ROSTER_ERR='';
      return COMP_ROSTER;
    })
    .catch(e=>{ COMP_ROSTER_ERR=e.message||'gagal'; COMP_ROSTER=[]; return COMP_ROSTER; });
}
function compsOn(date){ return (DB.compliments||[]).filter(c=>c.date===date); }
/* 'office' DITAMBAHKAN 7 Agustus 2026 — compliment yang diputuskan manajemen
   sebelumnya tidak punya tempat dan terpaksa dicatat "Tamu", yang artinya
   tidak ada seorang pun tercatat sebagai pemberinya. Namanya sengaja tidak
   ditulis di kode; daftarnya ikut Tim/Keterangan akun Office.
   KEMBAR PERSIS dengan deploy/kompas/index.html — ubah dua-duanya. */
function divPemberi(u){
  const d=(u&&u.divs)||[(u&&u.div)||''];
  return d.indexOf('marketing')>-1?'marketing'
       :(d.indexOf('event')>-1?'event'
       :(d.indexOf('office')>-1?'office':''));
}
/* Status putusan potong/tidak untuk sisi PEMBERI. Modul ini tidak memutuskan
   apa pun — keputusannya diambil di halaman Performa Marketing/Event modul
   Kompas — tapi tetap perlu MEMBACA statusnya supaya kasir tahu catatannya
   sudah diputus atau belum. KEMBAR dengan compStatusPemberi() di kompas. */
function compStatusPemberi(c){
  const s=String((c&&c.pemberiStatus)||'menunggu');
  return (s==='potong'||s==='tidak')?s:'menunggu';
}
/* DUA PIC, dua pertanyaan yang berbeda (permintaan user 5 Agustus 2026):
     PIC Kasir   — siapa yang menutup bill-nya di POS. Selalu kasir.
     PIC Pemberi — siapa yang MEMBERIKAN compliment itu (marketing / event).
   Dua-duanya boleh "Tamu". Yang ber-PIC Tamu tidak memotong realisasi siapa
   pun — itulah gunanya: compliment untuk tamu umum memang bukan beban orang.

   Sebelum ini hanya ada satu PIC, jadi compliment yang diputuskan marketing
   tapi ditutup kasir harus dipilih salah satu, dan yang tidak dipilih tidak
   pernah terlihat menanggungnya. */
let COMP_EDIT='';   // id catatan yang sedang diubah; '' = sedang menambah baru
function compById(id){ return (DB.compliments||[]).find(c=>c.id===id)||null; }
function editCompliment(id){
  const c=compById(id); if(!c) return;
  // Catatan tanggal lain: pindahkan dulu tanggal aktifnya, kalau tidak formnya
  // terisi tapi daftarnya menampilkan hari yang berbeda.
  COMP_EDIT=id; compDate=c.date; render(); window.scrollTo(0,0);
}
function batalEditCompliment(){ COMP_EDIT=''; render(); }
/* ---- PENCOCOKAN KE REPORT DAILY (7 Agustus 2026) ----
   Compliment dan Member Deposit sama-sama metode pembayaran yang tidak
   membawa uang masuk: barangnya keluar, bill-nya ditutup tanpa setoran. Total
   catatan Compliment hari itu HARUS sama dengan POS Compliment + POS Member
   Deposit hari yang sama.

   Kartunya ada di modul ini justru karena kasir yang menginput KEDUANYA —
   selisihnya paling murah diperbaiki saat orangnya masih di depan layar,
   bukan sebulan kemudian saat rekap. Yang dipakai angka POS, bukan Actual:
   compliment memang tidak pernah punya uangnya, jadi membandingkan ke Actual
   akan selalu selisih sebesar nilainya sendiri.
   KEMBAR dengan angkaRD/kartuCocokRD di deploy/kompas/index.html. */
function angkaRD(date, totalComp){
  const rec=repOf(date);
  const comp=repPay(rec,'compliment').pos;
  const dep=repPay(rec,'member_dep').pos;
  const total=comp+dep;
  const selisih=num(totalComp)-total;
  return { ada:!!rec, comp, dep, total, catat:num(totalComp), selisih, cocok:!!rec && selisih===0 };
}
function kartuCocokRD(rd){
  if(!rd.ada) return `<div class="notice info">ℹ️ <b>Report Daily tanggal ini belum diisi.</b> Total compliment di bawah belum bisa dicocokkan. Isi Compliment &amp; Member Deposit di menu <b>Report Daily</b>, lalu angkanya harus sama persis dengan total di sini.</div>`;
  if(rd.cocok) return `<div class="notice ok">✓ Cocok dengan Report Daily — Compliment ${fmtRp(rd.comp)} + Member Deposit ${fmtRp(rd.dep)} = <b>${fmtRp(rd.total)}</b>.</div>`;
  const kurang=rd.selisih<0;
  return `<div class="notice bad">⚠ <b>Tidak cocok dengan Report Daily.</b> Catatan di halaman ini <b>${fmtRp(rd.catat)}</b>, sedangkan POS Compliment ${fmtRp(rd.comp)} + Member Deposit ${fmtRp(rd.dep)} = <b>${fmtRp(rd.total)}</b> — ${kurang
      ? `masih ada ${fmtRp(-rd.selisih)} yang belum ditulis catatannya di sini, jadi barang segitu keluar tanpa PIC yang menanggungnya`
      : `catatan di sini kelebihan ${fmtRp(rd.selisih)} dibanding angka mesin kasir`}. Perbaiki salah satunya sebelum tutup hari.</div>`;
}

    };
    DB.compliments=DB.compliments||[];
    const lama=COMP_EDIT?compById(COMP_EDIT):null;
    if(lama){
      /* Yang TIDAK ditimpa: id, siapa yang mencatat, dan kapan. Baris yang
         diperbaiki tetap milik pencatat aslinya — mengganti `by` dengan nama
         orang yang mengoreksi menghapus jejak siapa yang sebenarnya
         memberikan compliment itu. `alasan` catatan lama juga dipertahankan. */
      /* Putusan potong/tidak dipertahankan selama pemberinya orang yang sama;
         kalau pemberinya diganti, putusannya direset — keputusan itu diambil
         atas nama orang lain. KEMBAR dengan kompas. */
      const gantiPemberi = String(lama.pemberiOfficeId||'')!==String(isi.pemberiOfficeId||'')
                        || String(lama.pemberiName||'')!==String(isi.pemberiName||'');
      const putusanLama = gantiPemberi ? null : {
        pemberiStatus: lama.pemberiStatus, putusOleh: lama.putusOleh, putusAt: lama.putusAt
      };
      Object.assign(lama, isi);
      if(putusanLama) Object.assign(lama, putusanLama);
      else { lama.pemberiStatus='menunggu'; lama.putusOleh=''; lama.putusAt=0; }
      lama.ubahOleh=CURRENT_USER?CURRENT_USER.name:'';
      lama.ubahAt=Date.now();
      COMP_EDIT='';
    }else{
      DB.compliments.push(Object.assign({
        id:'c'+Date.now().toString(36)+Math.floor(Math.random()*1e4), alasan:'',
        pemberiStatus:'menunggu', putusOleh:'', putusAt:0,
        by:CURRENT_USER?CURRENT_USER.name:'', at:Date.now()
      }, isi));
    }
    save(); render();
  });
  // Roster belum ada → ambil sekali, lalu gambar ulang supaya dropdown terisi.
  if(COMP_ROSTER===null) ambilRoster().then(()=>{ if(CURRENT==='compliment') render(); });
}
function hapusCompliment(id){
  if(!confirm('Hapus catatan compliment ini?')) return;

  DB.compliments=(DB.compliments||[]).filter(c=>c.id!==id);
  save(); render();

/* Compliment memotong REALISASI PIC (keputusan 27 Juli 2026), bukan targetnya.
   Yang ber-PIC "Tamu" tidak memotong siapa pun. Pencocokan ke PIC kompas lewat
   officeUserId dulu — nama bisa berubah ejaannya di Office, id tidak. */
function compsBulan(monthKey){ return (DB.compliments||[]).filter(c=>monthKeyOf(c.date)===monthKey); }
/* Daftar compliment yang membebani satu PIC. Dipisah dari compPic() supaya
   halaman Performa bisa memajang rinciannya — angka potongan saja bikin PIC
   bertanya-tanya "dipotong apa", dan jawabannya cuma ada di halaman lain. */
/* Penyaringnya dipisah dari sumber daftarnya supaya rentang mana pun bisa
   dipakai — sebulan maupun rentang aktif yang bisa cuma sehari. Tanpa
   pemisahan ini, Performa Kasir versi harian akan memotong realisasi memakai
   compliment SEBULAN penuh. Bentuknya disamakan dengan modul Kompas. */
/* Berapa yang dipotong sebuah compliment dari realisasi PIC-nya.
   SUB TOTAL saja (permintaan user 5 Agustus 2026), bukan totalnya: tax dan
   service charge bukan omset siapa pun — keduanya titipan yang memang tidak
   pernah diakui sebagai pencapaian, jadi memotongnya berarti menghukum PIC
   untuk uang yang tak pernah jadi haknya.

   Catatan LAMA tidak punya rincian; nominal-nya tetap dipakai apa adanya
   supaya angka bulan-bulan yang sudah ditutup tidak berubah surut. */
function compPotong(c){ return c && c.subTotal!=null ? num(c.subTotal) : num(c&&c.nominal); }
/* Cocok kalau `emp` adalah PIC KASIR-nya ATAU PEMBERI-nya.
   Satu compliment sekarang menyebut dua orang, dan dua-duanya menanggung:
   kasir karena barang keluar lewat mejanya, marketing/event karena dialah yang
   memutuskan memberikannya. Keduanya dinilai di halaman Performa yang berbeda,
   jadi tidak ada satu angka pun yang terpotong dua kali di tempat yang sama.
   Sisi yang ber-PIC "Tamu" tidak menunjuk siapa pun, jadi tidak pernah cocok. */
function compFilterPic(list, emp){
  if(!emp) return [];
  const nama=String(emp.name||'').trim().toLowerCase();
  const cocok=(div, oid, pnama)=>{
    if(div==='tamu') return false;
    if(emp.officeUserId && oid) return oid===emp.officeUserId;
    if(!pnama) return false;
    return String(pnama).trim().toLowerCase()===nama;
  };
  return list.filter(c=>
    cocok(c.picDiv, c.picOfficeId, c.picName) ||
    cocok(c.pemberiDiv, c.pemberiOfficeId, c.pemberiName));
}
function compListPic(monthKey, emp){ return compFilterPic(compsBulan(monthKey), emp); }
function compPic(monthKey, emp){
  return compListPic(monthKey, emp).reduce((s,c)=>s+compPotong(c),0);
}
function compListPicRentang(emp){ return compFilterPic(compsRentang(), emp); }

   Performa Kasir — lihat alasannya di sana. Fungsinya sendiri sudah tidak

   compFilterPic/compListPic/compPic di atas TETAP dipakai — dari situlah angka

/* ---- Alur omset: KASIR DULU, event MEMOTONG (keputusan 30 Juli 2026) ----
   CERMINAN dari blok yang sama di modul Kompas. Breakdown-nya sendiri hanya ada
   di Kompas; di sini yang dibutuhkan cuma cara MEMBACA-nya, supaya Performa
   Kasir di dua modul tidak pernah menampilkan angka berbeda untuk orang yang
   sama. Kalau salah satu diubah, ubah keduanya.

   MODEL SEKARANG. Semua uang masuk lewat meja kasir — termasuk tiket event dan
   tagihan gathering. Jadi omset per KASIR yang diisi di Breakdown sudah memuat
   semuanya, dan totalnya sendiri sama dengan omset net hari itu. Baris
   marketing & event tidak menambah total apa pun: barisnya MEMOTONG omset kasir
   yang kena shift event tersebut.

   Centang yang dulu bernama "Ticketing" sejak 30 Juli 2026 DITULIS "Free Entry"
   di layar Kompas. Label saja yang berubah; fieldnya tetap `r.tiket` dan artinya
   tetap potongan 50%, jadi tidak ada migrasi data.

     • baris TANPA centang Free Entry → SELURUH nominalnya dipotong dari kasir
       shift, dan seluruhnya diakui untuk PIC.
     • baris DICENTANG Free Entry     → hanya SEPARUH yang dipotong dari kasir
       shift, dan separuh itu juga yang diakui untuk PIC. Separuh sisanya tetap
       milik kasir — tiketnya dijual atas nama event, tapi yang melayani
       penjualan dan tamunya kasir.

   Karena potongan kasir = porsi PIC (uang yang sama, cuma berpindah pemilik),
   jumlah seluruh realisasi tetap sama dengan omset net.

   MODEL LAMA (28 Juli 2026, sudah tidak dipakai): kasir diisi walk-in MURNI,
   dan separuh omset free entry DITAMBAHKAN ke kasir shift sebagai bagi hasil.
   Persis kebalikan arah potongannya. Data lama tidak dimigrasi — bentuknya
   memang tidak berubah, hanya artinya.

   Semua halaman WAJIB lewat fungsi-fungsi di bawah. Sempat ada empat tempat
   berbeda yang menjumlahkan r.amount sendiri-sendiri; kalau satu terlewat,
   realisasi orang yang sama beda antara Performa dan Ranking. */
const PORSI_PIC_TIKET=0.5;
function porsiPic(r){
  const a=num(r.amount);
  return r.tiket ? Math.round(a*PORSI_PIC_TIKET) : a;
}
/* ---- OPEN BILL (11 Agustus 2026) ----
   Pesanan tambahan tamu event yang dibayar langsung ke kasir, di luar paket
   marketing. Diisi di Breakdown Sumber (modul Finance > Omset); di sini ia
   hanya DIBACA, untuk memberi kasir pengakuan bernama atas event mana.

   TIDAK BOLEH masuk ke porsiPic() di atas. porsiPic() dipakai potonganBaris()
   sebagai besar POTONGAN ke kasir shift — menambahkan Open Bill ke sana akan
   memotong kasir untuk uang yang justru sengaja tidak dipotong (keputusan user
   11 Agustus 2026: Open Bill diakui PIC, kasir tidak dipotong).

   Angkanya juga TIDAK ditambahkan ke realisasi kasir. Uangnya sudah ada di
   dalam omset bruto kasir hari itu; menambahkannya lagi berarti satu uang
   terhitung dua kali di sisi kasir. Yang ditampilkan adalah keterangan. */
function obAktif(r){ return !!(r && r.ob); }
function obTotal(r){ return obAktif(r) ? num(r.obAmount)+num(r.obTax)+num(r.obService) : 0; }
/* Rincian Open Bill satu hari: [{kasirId,eventName,total}]. Bentuknya sama
   dengan openBillList() di Finance > Omset — dua salinan, satu aturan. */
function openBillList(d){
  const out=[];
  ['marketing','event'].forEach(key=>{
    ((d.bd&&d.bd[key])||[]).forEach(r=>{
      if(!obAktif(r)) return;
      const t=obTotal(r); if(t<=0) return;
      out.push({kasirId:r.obKasirId||'', eventName:r.eventName||'', total:t});
    });
  });
  return out;
}
/* Potongan yang ditanggung kasir karena SATU baris event, dibagi per SHIFT —
   bukan rata ke semua kasir yang masuk hari itu. Kasir yang masuk tapi tidak
   kebagian shift event tersebut tidak ikut dipotong.

   Yang dipotong = porsiPic(r), yaitu uang yang sama yang diakui untuk PIC.
   Bukan kebetulan: omsetnya sudah tercatat penuh di baris kasir, jadi memotong
   lebih kecil dari yang diakui PIC berarti uang yang sama dihitung dua kali.

   DW TIDAK IKUT MEMBAGI potongan ini — beda dari aturan 28 Juli yang lama, dan
   ini perbedaan yang paling mudah salah kalau kodenya disamakan begitu saja.
   Alasannya: section kasir di Breakdown hanya punya baris untuk kasir TETAP,
   jadi setoran DW pun ikut tercatat di baris kasir tetap yang menaunginya.
   Kalau DW dijadikan pembagi, sebagian potongan tidak dibebankan ke siapa pun
   sementara omsetnya tetap ada di baris kasir tetap — realisasi kasir jadi
   lebih besar dari yang seharusnya dan totalnya melebihi omset net. Jumlah DW
   tetap disimpan (`r.dw`) karena berguna sebagai catatan operasional shift,
   tapi tidak lagi memengaruhi angka.

   Baris yang shift-nya belum diisi mengembalikan pembagi 0 → potongannya tidak
   dibebankan ke siapa pun. Halaman Performa Kasir menandainya supaya ketahuan,
   daripada diam-diam membebankannya ke orang yang tidak bertugas. */
function potonganBaris(r){
  const total=porsiPic(r);
  const ids=Array.isArray(r.shift)?r.shift.filter(Boolean):[];
  const dw=Math.max(0,num(r.dw));
  const pembagi=ids.length;
  if(total<=0||pembagi<=0) return {per:0,ids:[],dw,pembagi,total:Math.max(total,0)};
  return {per:Math.round(total/pembagi),ids,dw,pembagi,total};
}
/* Total potongan yang ditanggung satu kasir tetap dari seluruh event pada satu
   hari. */
function potonganHari(d,kasirId){
  let s=0;
  [...(d.bd?.marketing||[]),...(d.bd?.event||[])].forEach(r=>{
    const b=potonganBaris(r);
    if(b.ids.indexOf(kasirId)>-1) s+=b.per;
  });
  return s;
}
/* Baris bernominal yang shift-nya belum ditentukan. Filter `r.tiket` yang dulu
   ada di sini DIHAPUS: sekarang setiap baris event memotong kasir, bukan cuma
   yang ticketing, jadi semuanya butuh shift. */
function barisTanpaShift(d){
  return [...(d.bd?.marketing||[]),...(d.bd?.event||[])]
    .filter(r=>num(r.amount)>0 && potonganBaris(r).pembagi<=0);
}


/* ---- Kalender kustom (bukan input type=date bawaan Chrome). Satu
   implementasi dipakai dua tempat, dibedakan lewat `key`:
     'rp' → Tanggal di Report Daily
     'cp' → Tanggal di Compliment
   Semua tanggal terbuka; tanggal yang sudah ada omset diberi titik. */
const CAL_MON=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const CAL_REG={
  rp:{ box:'rp_cal', get:()=>repDate,            set:ds=>{ repDate=ds; PERIOD=monthKeyOf(ds); } },
  cp:{ box:'cp_cal', get:()=>compDate,           set:ds=>{ compDate=ds; PERIOD=monthKeyOf(ds); } },
  rk:{ box:'rk_cal', get:()=>rokokDate,          set:ds=>{ rokokDate=ds; PERIOD=monthKeyOf(ds); } },
  bn:{ box:'bn_cal', get:()=>bonDate,            set:ds=>{ bonDate=ds; PERIOD=monthKeyOf(ds); } }
};
const CAL_ST={ rp:{open:false,month:null}, cp:{open:false,month:null}, rk:{open:false,month:null}, bn:{open:false,month:null} };
function ymdLocal(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dateLabel(ds){ const d=new Date(ds+'T00:00:00'); return isNaN(d)?ds:d.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'short',year:'numeric'}); }
function paintCal(key){ const el=document.getElementById(CAL_REG[key].box); if(el) el.innerHTML=calInner(key); }
function calToggle(key){ const s=CAL_ST[key]; s.open=!s.open; if(s.open){ const [y,m]=CAL_REG[key].get().split('-').map(Number); s.month=new Date(y,m-1,1); } paintCal(key); }
function calNav(key,delta){ const s=CAL_ST[key]; if(!s.month) s.month=new Date(); s.month=new Date(s.month.getFullYear(),s.month.getMonth()+(+delta),1); paintCal(key); }
function calPickDay(key,ds){ CAL_ST[key].open=false; CAL_REG[key].set(ds); render(); }
function calQuick(key,off){ const d=new Date(); d.setDate(d.getDate()+off); calPickDay(key,ymdLocal(d)); }
function calInner(key){
  const st=CAL_ST[key], sel=CAL_REG[key].get()||todayISO();
  const btn=`<button type="button" class="calbtn" onclick="calToggle('${key}')"><span>📅 ${dateLabel(sel)}</span><span style="opacity:.55">▾</span></button>`;
  if(!st.open) return btn;
  if(!st.month){ const [yy,mm]=sel.split('-').map(Number); st.month=new Date(yy,mm-1,1); }
  const y=st.month.getFullYear(), mo=st.month.getMonth();
  const startDow=new Date(y,mo,1).getDay(), dim=new Date(y,mo+1,0).getDate(), prevDim=new Date(y,mo,0).getDate();
  const DOW=['MIN','SEN','SEL','RAB','KAM','JUM','SAB'];
  let cells='';
  for(let i=startDow-1;i>=0;i--) cells+=`<button class="calday off" disabled>${prevDim-i}</button>`;
  for(let dd=1;dd<=dim;dd++){
    const ds=`${y}-${String(mo+1).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
    const cls=['calday']; if(ds===todayISO())cls.push('today'); if(ds===sel)cls.push('sel'); if(getDay(ds))cls.push('caldata');
    cells+=`<button class="${cls.join(' ')}" onclick="calPickDay('${key}','${ds}')">${dd}</button>`;
  }
  return btn+`<div class="calback" onclick="calToggle('${key}')"></div><div class="calpop">
    <div class="calhead"><button class="calnav" onclick="calNav('${key}',-1)">‹</button><b>${CAL_MON[mo]} ${y}</b><button class="calnav" onclick="calNav('${key}',1)">›</button></div>
    <div class="calgrid">${DOW.map(d=>`<div class="caldow">${d}</div>`).join('')}${cells}</div>
    <div class="calquick"><button onclick="calPickDay('${key}','${todayISO()}')">Hari Ini</button><button onclick="calQuick('${key}',-1)">Kemarin</button><button onclick="calToggle('${key}')">Tutup</button></div>
  </div>`;
}

function emptyCanvas(id,msg){const c=document.getElementById(id);if(c)c.parentElement.innerHTML='<div class="empty" style="padding:60px 10px"><div class="big">📊</div>'+(msg||'Belum ada data')+'</div>';}
/* ============ 3. DAILY STOCK ROKOK ============
   Barang masuk & keluar per hari, per item. Bukan hanya rokok — Korek dan
   Coin ikut di daftar yang sama karena dihitung di meja yang sama oleh orang
   yang sama; memisahkannya jadi halaman sendiri hanya menambah tempat yang
   harus dibuka tiap malam.

   SEMUA ITEM SELALU DITAMPILKAN, termasuk yang hari itu tidak bergerak.
   Nol adalah jawaban yang sah dan memang sering terjadi — daftar yang cuma
   memuat item bergerak membuat "belum diisi" dan "tidak ada pergerakan"
   terlihat sama persis, padahal yang pertama perlu ditindaklanjuti.

   SISA dihitung, bukan dihitung fisik. Sisa Awal = akumulasi (masuk − keluar)
   SELURUH tanggal sebelum hari yang dipilih; Sisa Akhir = Awal + Masuk −
   Keluar. Jadi angka ini benar sepanjang setiap hari yang ada pergerakannya
   memang dicatat. Kalau nanti perlu stock opname fisik, itu kolom keempat
   yang harus diinput terpisah — jangan menimpa hitungan ini, karena selisih
   antara hitungan dan fisik justru itu yang dicari. */
/* LA Menthol & Djarum Mild DIHAPUS 30 Juli 2026 atas permintaan (sudah tidak
   dijual). Kuncinya ('la_menthol', 'djarum_mild') sengaja TIDAK di-DROP dari
   data yang sudah tersimpan — lihat penjagaan di tombol simpan di bawah, yang
   mempertahankan kunci tak dikenal. Jadi angka historisnya masih utuh di
   database kalau suatu saat ditanyakan, cuma tidak lagi ditampilkan dan tidak
   lagi ikut dijumlah ke Sisa Awal.

   DJARUM MILD DIKEMBALIKAN 21 Agustus 2026 atas permintaan tim. Kuncinya
   `djarum_mild` DIPAKAI LAGI PERSIS, bukan kunci baru: karena datanya dulu
   tidak pernah dibuang, angka Juli-nya langsung kembali utuh dan ikut lagi ke
   Sisa Awal. Kunci baru akan membuat riwayatnya seolah hilang, dan yang lama
   menggantung selamanya tanpa nama di layar mana pun.

   DAFTAR INI SEKARANG CUMA BAWAAN. Sejak 21 Agustus 2026 daftarnya bisa
   dikelola sendiri di halaman Pengaturan Item (DB.rokok_items) — lihat
   rokokItems(). Yang di bawah ini dipakai selama belum pernah disetel, dan
   jadi isi awal saat halaman pengaturan pertama kali dibuka. */
const ROKOK_BAWAAN=[
  {k:'la_purple',       n:'LA Purple'},
  {k:'la_mango',        n:'LA Mango'},
  {k:'la_bold',         n:'LA Bold'},
  {k:'la_ice',          n:'LA Ice'},
  {k:'la_light',        n:'LA Light'},
  {k:'djarum_super',    n:'Djarum Super'},
  {k:'djarum_mild',     n:'Djarum Mild'},
  {k:'insta',           n:'Insta'},
  {k:'korek',           n:'Korek'},
  {k:'dos_hermanos',    n:'Dos Hermanos'},
  {k:'dos_h_rojo',      n:'Dos H. Rojo'},
  {k:'dos_h_maduro',    n:'Dos H. Maduro'},
  {k:'dos_h_corona',    n:'Dos H. Corona'},
  {k:'dos_h_torito',    n:'Dos H. Torito'},
  {k:'gold_seal_petit', n:'Gold Seal Petit'},
  {k:'gold_seal_senor', n:'Gold Seal Senor'},
  {k:'coin',            n:'Coin', lain:true},
  /* ESKRIM ditambahkan 15 Agustus 2026 atas permintaan user. Sama seperti Coin
     dan Korek: bukan rokok, tapi dihitung di meja yang sama oleh orang yang
     sama tiap malam — memisahkannya jadi halaman sendiri cuma menambah tempat
     yang harus dibuka. */
  {k:'eskrim',          n:'Eskrim', lain:true}
];
/* DAFTAR YANG BERLAKU. `DB.rokok_items` kalau memang sudah pernah disetel di
   halaman Pengaturan Item, kalau tidak jatuh ke bawaan di atas.

   Sengaja TIDAK menyalin bawaan ke DB saat modul dibuka: selama belum pernah
   disetel, pemasangan ini ikut tiap penambahan bawaan berikutnya. Begitu
   disetel sekali, daftarnya jadi milik tim sepenuhnya — penambahan bawaan
   sesudahnya tidak lagi menyusup dan mengubah lembar yang sudah mereka atur.

   Dipanggil sebagai FUNGSI, bukan disimpan sebagai const saat modul dimuat:
   daftarnya berubah begitu halaman pengaturan menekan simpan, dan const akan
   membekukan daftar lama sampai halamannya dimuat ulang — tabel stok masih
   memakai item lama sementara pengaturannya berkata sudah berubah. */
function rokokItems(){
  const d=DB&&DB.rokok_items;
  return (Array.isArray(d)&&d.length) ? d : ROKOK_BAWAAN;
}
// Kunci non-rokok PERTAMA — dipakai menaruh garis pemisah SEKALI saja. Dulu
// pemisahnya menempel di tiap item ber-`lain`, jadi dengan dua item begitu
// tabelnya punya dua garis dan terbaca seperti tiga kelompok.
function rokokLainPertama(){ return (rokokItems().find(it=>it.lain)||{}).k||''; }
let rokokDate=todayISO();
function rokokOf(date){ return (DB.rokok||{})[date]||null; }
function rokokItem(rec,k){ const x=(rec&&rec.items&&rec.items[k])||{}; return {in:num(x.in),out:num(x.out)}; }
/* Sisa sebelum hari yang dipilih. Menjumlah SELURUH tanggal yang lebih awal,
   bukan hanya hari sebelumnya: pencatatan sering bolong (tidak semua hari ada
   pergerakan), dan mengambil "kemarin" saja akan mengembalikan 0 pada hari
   yang kemarinnya kosong — seolah stoknya habis. */
function rokokSisaAwal(date){
  const out={}; rokokItems().forEach(it=>out[it.k]=0);
  Object.keys(DB.rokok||{}).filter(d=>d<date).forEach(d=>{
    const rec=DB.rokok[d];
    rokokItems().forEach(it=>{ const v=rokokItem(rec,it.k); out[it.k]+=v.in-v.out; });
  });
  return out;
}
function viewRokok(){
  CAL_ST.rk.open=false;
  const el=document.getElementById('app-view');
  const rec=rokokOf(rokokDate);
  const awal=rokokSisaAwal(rokokDate);
  const baris=it=>{
    const v=rokokItem(rec,it.k);
    return `<tr${it.k===rokokLainPertama()?' style="border-top:2px solid var(--line)"':''}>
      <td><b>${esc(it.n)}</b>${it.lain?'<div class="muted" style="font-size:11px">bukan rokok — ikut dihitung di sini</div>':''}</td>
      <td class="num mono" id="rk_aw_${it.k}">${awal[it.k]}</td>
      <td class="num"><input class="rkf mono" data-k="${it.k}" data-f="in" inputmode="numeric" value="${v.in}" style="width:86px;padding:7px 9px;border:1.5px solid var(--line);border-radius:8px;text-align:right"></td>
      <td class="num"><input class="rkf mono" data-k="${it.k}" data-f="out" inputmode="numeric" value="${v.out}" style="width:86px;padding:7px 9px;border:1.5px solid var(--line);border-radius:8px;text-align:right"></td>
      <td class="num mono" id="rk_ak_${it.k}"></td>
    </tr>`;
  };
  el.innerHTML=`
    <div class="card" style="display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap">
      <div><h3>Daily Stock Rokok</h3><div class="card-sub" style="margin:0">Isi jumlah yang <b>masuk</b> dan <b>keluar</b> hari itu. Item yang tidak bergerak biarkan <b>0</b> — itu tetap tercatat sebagai "sudah diperiksa, tidak ada pergerakan".</div></div>
      <div class="field" style="margin:0"><label>Tanggal</label><div class="calwrap" id="rk_cal">${calInner('rk')}</div></div>
    </div>
    ${jejakHtml(rec)}
    <div class="card" style="padding:0;overflow:hidden">
      <div class="tbl-wrap"><table>
        <thead><tr><th>Item</th><th class="num">Sisa Awal</th><th class="num">Masuk</th><th class="num">Keluar</th><th class="num">Sisa Akhir</th></tr></thead>
        <tbody>${rokokItems().map(baris).join('')}</tbody>
        <tfoot><tr style="font-weight:800;border-top:2px solid var(--line)">
          <td>TOTAL</td><td class="num mono" id="rk_t_aw"></td><td class="num mono" id="rk_t_in"></td>
          <td class="num mono" id="rk_t_out"></td><td class="num mono" id="rk_t_ak"></td>
        </tr></tfoot>
      </table></div>
    </div>
    <div id="rk_err"></div>
    <div class="balance-bar">
      <div class="bnums">
        <div class="bi">Item bergerak<b class="mono" id="rk_gerak">0</b></div>
        <div class="bi">Total Masuk<b class="mono" id="rk_s_in">0</b></div>
        <div class="bi">Total Keluar<b class="mono" id="rk_s_out">0</b></div>
      </div>
      <button class="btn btn-primary" id="rk_save">Simpan Stock Harian</button>
    </div>`;

  const nilai=(k,f)=>{ const e=el.querySelector(`.rkf[data-k="${k}"][data-f="${f}"]`); return e?num(e.value):0; };
  function hitung(){
    let tAw=0,tIn=0,tOut=0,tAk=0,gerak=0;
    rokokItems().forEach(it=>{
      const i=nilai(it.k,'in'), o=nilai(it.k,'out');
      const ak=awal[it.k]+i-o;
      tAw+=awal[it.k]; tIn+=i; tOut+=o; tAk+=ak;
      if(i||o) gerak++;
      const c=document.getElementById('rk_ak_'+it.k);
      c.textContent=ak;
      /* Sisa akhir minus berarti keluarnya lebih banyak daripada yang pernah
         tercatat masuk — hampir selalu tanda ada hari yang belum diisi, bukan
         stok benar-benar negatif. Ditandai merah, tapi TIDAK mengunci simpan:
         catatan hari ini sendiri sudah benar, yang bolong hari yang lain. */
      c.style.color = ak<0?'var(--danger)':(ak===0?'var(--muted)':'');
      c.style.fontWeight = ak<0?'800':'';
    });
    document.getElementById('rk_t_aw').textContent=tAw;
    document.getElementById('rk_t_in').textContent=tIn;
    document.getElementById('rk_t_out').textContent=tOut;
    document.getElementById('rk_t_ak').textContent=tAk;
    document.getElementById('rk_gerak').textContent=gerak+' / '+rokokItems().length;
    document.getElementById('rk_s_in').textContent=tIn;
    document.getElementById('rk_s_out').textContent=tOut;
    const minus=rokokItems().filter(it=>awal[it.k]+nilai(it.k,'in')-nilai(it.k,'out')<0);
    document.getElementById('rk_err').innerHTML = minus.length
      ? `<div class="notice warn">⚠ ${minus.length} item sisa akhirnya minus (${esc(minus.map(x=>x.n).join(', '))}). Biasanya ada hari sebelumnya yang barang masuknya belum dicatat — periksa tanggal-tanggal sebelum ini. Simpan tetap boleh.</div>`
      : '';
  }
  el.querySelectorAll('.rkf').forEach(i=>i.addEventListener('input',hitung));
  document.getElementById('rk_save').addEventListener('click',()=>{
    /* Kunci yang TIDAK ADA lagi di rokokItems() dipertahankan apa adanya —
       item yang dihapus dari daftar (mis. LA Menthol & Djarum Mild, 30 Juli
       2026) meninggalkan angka di hari-hari sebelumnya, dan membangun `items`
       dari nol akan MENGHAPUSNYA begitu ada yang membuka lalu menyimpan ulang
       tanggal lama. Kehilangan itu tidak menimbulkan error apa pun, jadi tidak
       akan ada yang menyadarinya sampai angkanya dibutuhkan. */
    const lama=(DB.rokok&&DB.rokok[rokokDate]&&DB.rokok[rokokDate].items)||{};
    const items={};
    Object.keys(lama).forEach(k=>{ if(!rokokItems().some(it=>it.k===k)) items[k]=lama[k]; });
    rokokItems().forEach(it=>{ items[it.k]={in:nilai(it.k,'in'),out:nilai(it.k,'out')}; });
    DB.rokok=DB.rokok||{};
    const jejak=tambahJejak(DB.rokok[rokokDate]);
    DB.rokok[rokokDate]={items,by:CURRENT_USER?CURRENT_USER.name:'',at:Date.now(),log:jejak};
    save();
    document.getElementById('rk_err').innerHTML=`<div class="notice ok">✓ Stock ${esc(dateLabel(rokokDate))} tersimpan.</div>`;
    setTimeout(()=>render(),700);
  });
  hitung();
}

/* ============ 3c. PENGATURAN ITEM ROKOK (21 Agustus 2026) ============
   Daftar item di lembar Daily Stock Rokok dulu ditulis di kode, jadi tiap ada
   produk baru tim harus menunggu satu siklus deploy. Sekarang dikelola sendiri
   dari sini, dan HANYA dari sini — tidak ada modul lain yang membaca atau
   menulis DB.rokok, jadi pengaturan kedua di tempat lain cuma akan jadi pintu
   yang bisa berbeda isinya.

   KUNCI (`k`) PERMANEN dan tidak bisa diubah sesudah dibuat. Seluruh angka
   harian tersimpan dengan kunci itu (DB.rokok[tgl].items[k]); menggantinya
   berarti riwayat item tersebut menggantung tanpa nama sementara item "baru"
   mulai dari nol — dan tidak ada satu pun galat yang muncul. Yang bisa diubah
   NAMANYA, dan itu memang yang biasanya perlu (salah ketik, ganti sebutan).

   MENGHAPUS TIDAK MENGHAPUS ANGKA. Item yang dibuang cuma hilang dari lembar;
   datanya tetap tersimpan apa adanya (lihat penjagaan di tombol simpan stok
   harian), persis seperti LA Menthol & Djarum Mild pada 30 Juli 2026 — yang
   membuat Djarum Mild bisa dikembalikan hari ini lengkap dengan riwayatnya. */
let RKS_PESAN='';
/* Kunci dibuat dari namanya: huruf kecil, non-huruf/angka jadi garis bawah.
   Bentuk yang sama dengan kunci bawaan ('gold_seal_petit'), supaya daftar
   buatan sendiri dan bawaan tidak bisa dibedakan dari bentuk kuncinya — kalau
   berbeda, suatu saat akan ada kode yang menyaring "yang bawaan saja". */
function rksKunci(nama){
  return String(nama||'').toLowerCase().trim()
    .replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,40);
}
/* Menulis daftar ke DB. Bawaan disalin dulu kalau belum pernah disetel —
   penyuntingan pertama harus berangkat dari daftar yang SEDANG TERLIHAT di
   lembar stok, bukan dari daftar kosong. */
function rksDaftar(){ return rokokItems().map(it=>({k:it.k,n:it.n,lain:!!it.lain})); }
function rksSimpan(daftar,pesan){
  DB.rokok_items=daftar;
  save();
  RKS_PESAN=pesan||'';
  render();
}
function rksTambah(){
  const nama=(document.getElementById('rks_nama').value||'').trim();
  const lain=!!document.getElementById('rks_lain').checked;
  if(!nama){ RKS_PESAN='bad|Nama item wajib diisi.'; render(); return; }
  const k=rksKunci(nama);
  if(!k){ RKS_PESAN='bad|Nama itu tidak menghasilkan kunci yang sah — pakai huruf atau angka.'; render(); return; }
  const daftar=rksDaftar();
  /* Kunci kembar ditolak, TAPI sebutkan item mana yang sudah memakainya:
     "Djarum Mild" dan "Djarum  Mild" menghasilkan kunci yang sama, dan tanpa
     menyebut namanya orang akan mengira penolakannya salah. */
  const bentrok=daftar.find(it=>it.k===k);
  if(bentrok){ RKS_PESAN='bad|Kunci <b>'+esc(k)+'</b> sudah dipakai item <b>'+esc(bentrok.n)+'</b>. Pakai nama yang berbeda.'; render(); return; }
  daftar.push({k,n:nama,lain});
  rksSimpan(daftar,'ok|Item <b>'+esc(nama)+'</b> ditambahkan (kunci <span class="mono">'+esc(k)+'</span>).');
}
function rksHapus(k){
  const daftar=rksDaftar();
  const it=daftar.find(x=>x.k===k); if(!it) return;
  if(daftar.length<=1){ RKS_PESAN='bad|Daftar tidak boleh kosong — sisakan minimal satu item.'; render(); return; }
  /* Berapa hari yang punya angka untuk item ini — disebutkan di konfirmasi.
     "Hapus item?" tanpa angka membuat orang mengira tidak ada yang hilang;
     dengan angkanya, ia tahu persis apa yang akan lenyap dari lembar (dan
     bahwa datanya sendiri tidak ikut terhapus). */
  let hari=0;
  Object.keys(DB.rokok||{}).forEach(d=>{
    const v=rokokItem(DB.rokok[d],k); if(v.in||v.out) hari++;
  });
  if(!confirm('Buang "'+it.n+'" dari lembar Daily Stock Rokok?\n\n'
    +(hari?hari+' hari punya angka untuk item ini. Angkanya TIDAK dihapus — tetap tersimpan '
        +'dan kembali utuh kalau item ini ditambahkan lagi dengan nama yang sama.'
       :'Belum ada satu hari pun yang mencatat pergerakan item ini.')
    +'\n\nYang berubah cuma: item ini tidak lagi muncul di lembar harian dan tidak lagi ikut Sisa Awal.')) return;
  rksSimpan(daftar.filter(x=>x.k!==k),'ok|Item <b>'+esc(it.n)+'</b> dibuang dari lembar. Angkanya tetap tersimpan.');
}
function rksUbahNama(k){
  const daftar=rksDaftar();
  const it=daftar.find(x=>x.k===k); if(!it) return;
  const nama=prompt('Nama item (kunci <'+k+'> tidak berubah, jadi angkanya tetap):', it.n);
  if(nama===null) return;
  if(!nama.trim()){ RKS_PESAN='bad|Nama tidak boleh kosong.'; render(); return; }
  it.n=nama.trim();
  rksSimpan(daftar,'ok|Nama diperbarui jadi <b>'+esc(it.n)+'</b>.');
}
function rksToggleLain(k){
  const daftar=rksDaftar();
  const it=daftar.find(x=>x.k===k); if(!it) return;
  it.lain=!it.lain;
  rksSimpan(daftar,'ok|<b>'+esc(it.n)+'</b> dipindah ke kelompok '+(it.lain?'<b>Lainnya</b>':'<b>Rokok</b>')+'.');
}
/* Urutan di sini = urutan baris di lembar harian. Kasir menghitung fisiknya
   berurutan sesuai susunan di rak, jadi bisa digeser sampai cocok — daftar
   yang urutannya beda dari raknya membuat penghitungan bolak-balik. */
function rksGeser(k,arah){
  const daftar=rksDaftar();
  const i=daftar.findIndex(x=>x.k===k);
  const j=i+arah;
  if(i<0||j<0||j>=daftar.length) return;
  const t=daftar[i]; daftar[i]=daftar[j]; daftar[j]=t;
  rksSimpan(daftar,'');
}
function rksPulihkanBawaan(){
  if(!confirm('Kembalikan daftar ke bawaan sistem?\n\n'
    +'Item yang kamu tambahkan sendiri akan hilang dari lembar — angkanya tetap tersimpan, '
    +'tapi harus ditambahkan lagi kalau mau muncul lagi.')) return;
  /* Kuncinya DIHAPUS, bukan diisi salinan bawaan: dengan begitu pemasangan ini
     kembali ikut tiap penambahan bawaan berikutnya, sama seperti sebelum
     pernah disetel sama sekali. */
  delete DB.rokok_items;
  save();
  RKS_PESAN='ok|Daftar dikembalikan ke bawaan sistem.';
  render();
}
function viewRokokSet(){
  const el=document.getElementById('app-view');
  const daftar=rokokItems();
  const disetel=Array.isArray(DB.rokok_items)&&DB.rokok_items.length;
  const pesan=RKS_PESAN; RKS_PESAN='';
  const p=pesan?pesan.split('|'):null;

  const baris=(it,i)=>`<tr>
      <td style="width:52px;text-align:center">
        <button class="btn btn-ghost btn-xs" title="Naikkan" ${i===0?'disabled':''} onclick="rksGeser('${esc(it.k)}',-1)">↑</button>
        <button class="btn btn-ghost btn-xs" title="Turunkan" ${i===daftar.length-1?'disabled':''} onclick="rksGeser('${esc(it.k)}',1)">↓</button></td>
      <td><b>${esc(it.n)}</b></td>
      <td class="mono" style="font-size:11.5px;color:var(--muted)">${esc(it.k)}</td>
      <td>${it.lain
          ? '<span class="chip mute">Lainnya</span>'
          : '<span class="chip info">Rokok</span>'}</td>
      <td style="text-align:right;white-space:nowrap">
        <button class="btn btn-ghost btn-xs" onclick="rksUbahNama('${esc(it.k)}')">Ubah nama</button>
        <button class="btn btn-ghost btn-xs" title="Pindah kelompok Rokok / Lainnya" onclick="rksToggleLain('${esc(it.k)}')">${it.lain?'Jadikan Rokok':'Jadikan Lainnya'}</button>
        <button class="btn btn-danger btn-xs" onclick="rksHapus('${esc(it.k)}')">Buang</button>
      </td></tr>`;

  el.innerHTML=
    (p?`<div class="notice ${p[0]==='ok'?'ok':'bad'}">${p[0]==='ok'?'✓':'⚠'} <div>${p[1]}</div></div>`:'')+
    `<div class="notice info">💡 <div>Daftar ini menentukan baris apa saja yang muncul di <b>Daily Stock Rokok</b> dan
       <b>Rekap Stock Rokok</b>, berikut urutannya. <b>Membuang item tidak menghapus angkanya</b> — datanya tetap
       tersimpan dan kembali utuh kalau item itu ditambahkan lagi dengan nama yang sama.
       Kunci di kolom ketiga dibuat sekali dan tidak berubah walau namanya diganti; itu yang mengikat angka harian
       ke itemnya.</div></div>
    <div class="card">
      <div style="display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap">
        <div style="flex:1;min-width:200px">
          <h3>Item di Lembar Stock</h3>
          <div class="card-sub" style="margin:0">${daftar.length} item · ${
            disetel?'daftar disetel sendiri':'masih memakai daftar bawaan sistem'}</div>
        </div>
        ${disetel?'<button class="btn btn-ghost btn-sm" onclick="rksPulihkanBawaan()">↩ Kembalikan ke bawaan</button>':''}
      </div>
      <div class="tbl-wrap" style="margin-top:12px"><table><thead><tr>
        <th style="text-align:center">Urut</th><th style="text-align:left">Nama</th>
        <th style="text-align:left">Kunci data</th><th style="text-align:left">Kelompok</th><th></th>
      </tr></thead><tbody>${daftar.map(baris).join('')}</tbody></table></div>
    </div>
    <div class="card">
      <h3>Tambah Item</h3>
      <div class="card-sub">Item baru langsung muncul di lembar harian, dimulai dari sisa 0.</div>
      <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center">
        <input id="rks_nama" placeholder="Nama item, mis. Djarum Mild" style="flex:1;min-width:200px;padding:9px 11px;border:1.5px solid var(--line);border-radius:8px">
        <label style="display:flex;gap:7px;align-items:center;font-size:12.5px;cursor:pointer">
          <input type="checkbox" id="rks_lain"> bukan rokok (Korek, Coin, Eskrim…)</label>
        <button class="btn btn-primary btn-sm" onclick="rksTambah()">Tambah</button>
      </div>
      <div class="muted" style="font-size:11.5px;margin-top:7px">Item ber-tanda <b>bukan rokok</b> dikelompokkan di bawah, dipisahkan satu garis — tetap dihitung di meja yang sama.</div>
    </div>`;
  const kotak=document.getElementById('rks_nama');
  if(kotak) kotak.addEventListener('keydown',e=>{ if(e.key==='Enter') rksTambah(); });

/* ============ 3b. REKAP STOCK ROKOK (BULANAN) ============
   15 Agustus 2026, permintaan user. Halaman ini MEMBACA saja — tidak ada satu
   pun isian di sini, dan itu disengaja: yang mengisi tetap Daily Stock Rokok
   per hari, supaya tidak ada dua pintu menuju angka yang sama.

   Bulannya mengikuti pemilih Periode di topbar (PERIOD), bukan pemilih sendiri.
   Modul ini sudah punya satu; menambah yang kedua berarti dua kotak bulan di
   layar yang sama yang bisa menunjuk bulan berbeda, dan tidak ada apa pun yang
   menjelaskan mana yang sedang dipakai. */
function rokokTanggalBulan(monthKey){
  return Object.keys(DB.rokok||{}).filter(d=>monthKeyOf(d)===monthKey).sort();
}
/* Rekap satu bulan per item. `awal` = sisa sebelum tanggal 1 bulan itu, dipakai
   ulang dari rokokSisaAwal() — bukan dihitung ulang dengan rumus sendiri, yang
   berarti dua tempat bisa menjawab beda untuk pertanyaan yang sama. */
function rokokRekapBulan(monthKey){
  const tgl=rokokTanggalBulan(monthKey);
  const awal=rokokSisaAwal(monthKey+'-01');
  const baris=rokokItems().map(it=>{
    let masuk=0,keluar=0,hariGerak=0;
    tgl.forEach(d=>{
      const v=rokokItem(DB.rokok[d],it.k);
      masuk+=v.in; keluar+=v.out;
      if(v.in||v.out) hariGerak++;
    });
    return {k:it.k,n:it.n,lain:!!it.lain,awal:awal[it.k],masuk,keluar,
            akhir:awal[it.k]+masuk-keluar,hariGerak};
  });
  return {tgl,baris,
    tMasuk:baris.reduce((s,b)=>s+b.masuk,0),
    tKeluar:baris.reduce((s,b)=>s+b.keluar,0),
    tAkhir:baris.reduce((s,b)=>s+b.akhir,0)};
}
function viewRokokRekap(){
  const el=document.getElementById('app-view');
  const R=rokokRekapBulan(PERIOD);
  const labelBulan=(()=>{ const d=new Date(PERIOD+'-01T00:00:00');
    return isNaN(d)?PERIOD:d.toLocaleDateString('id-ID',{month:'long',year:'numeric'}); })();

  if(!R.tgl.length){
    el.innerHTML=`<div class="card"><div class="empty"><div class="big">📦</div>
      Belum ada catatan stock untuk <b>${esc(labelBulan)}</b>.
      <div class="muted" style="margin-top:6px">Isi lewat menu <b>Daily Stock Rokok</b> — rekap ini menjumlah apa yang sudah dicatat di sana.</div></div></div>`;
    return;
  }

  /* Diurut menurut KELUAR, bukan nama. Pertanyaan yang dibawa orang ke halaman
     ini hampir selalu "apa yang paling laku / paling perlu dibeli lagi", dan
     urutan alfabetis membuat jawabannya harus dicari dengan mata. Yang tidak
     bergerak sama sekali tetap ditampilkan, di bawah — nol adalah jawaban yang
     sah, dan menyembunyikannya membuat "tidak laku" tak bisa dibedakan dari
     "belum pernah didaftarkan". */
  const urut=R.baris.slice().sort((a,b)=>b.keluar-a.keluar||a.n.localeCompare(b.n));
  const maxKeluar=Math.max(1,...urut.map(b=>b.keluar));
  const nGerak=R.baris.filter(b=>b.masuk||b.keluar).length;
  const minus=R.baris.filter(b=>b.akhir<0);

  el.innerHTML=`
    <div class="card" style="display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap">
      <div><h3>Rekap ${esc(labelBulan)}</h3>
        <div class="card-sub" style="margin:0">Dijumlah dari <b>${R.tgl.length} hari</b> yang tercatat di Daily Stock Rokok. Ganti bulannya lewat pemilih <b>Periode</b> di atas.</div></div>
    </div>
    <div class="grid g4">
      <div class="stat"><div class="lab">Total Keluar</div><div class="val mono">${R.tKeluar}</div>
        <div class="foot">${R.tgl.length?('rata-rata '+(R.tKeluar/R.tgl.length).toFixed(1)+' / hari tercatat'):''}</div></div>
      <div class="stat"><div class="lab">Total Masuk</div><div class="val mono">${R.tMasuk}</div>
        <div class="foot">barang yang ditambahkan bulan ini</div></div>
      <div class="stat"><div class="lab">Sisa Akhir Bulan</div><div class="val mono">${R.tAkhir}</div>
        <div class="foot">seluruh item digabung</div></div>
      <div class="stat"><div class="lab">Produk Bergerak</div><div class="val mono">${nGerak} / ${R.baris.length}</div>
        <div class="foot">${R.baris.length-nGerak} item tanpa pergerakan</div></div>
    </div>
    ${minus.length?`<div class="notice warn">⚠ ${minus.length} item sisa akhirnya minus (${esc(minus.map(x=>x.n).join(', '))}). Biasanya ada hari yang barang masuknya belum dicatat — periksa di <b>Daily Stock Rokok</b>.</div>`:''}
    <div class="card" style="padding:0;overflow:hidden">
      <div class="tbl-wrap"><table>
        <thead><tr><th>Produk</th><th class="num">Sisa Awal</th><th class="num">Masuk</th>
          <th class="num">Keluar</th><th class="num">Sisa Akhir</th><th class="num">Hari Bergerak</th></tr></thead>
        <tbody>${urut.map(b=>`<tr>
          <td><b>${esc(b.n)}</b>${b.lain?'<div class="muted" style="font-size:11px">bukan rokok</div>':''}
            <div style="height:4px;border-radius:3px;background:var(--line);margin-top:5px;overflow:hidden">
              <div style="height:100%;width:${Math.round(b.keluar/maxKeluar*100)}%;background:var(--gold-dim)"></div></div></td>
          <td class="num mono">${b.awal}</td>
          <td class="num mono">${b.masuk||'<span class="muted">0</span>'}</td>
          <td class="num mono"><b>${b.keluar||'<span class="muted" style="font-weight:400">0</span>'}</b></td>
          <td class="num mono"${b.akhir<0?' style="color:var(--danger);font-weight:800"':''}>${b.akhir}</td>
          <td class="num mono muted">${b.hariGerak} / ${R.tgl.length}</td>
        </tr>`).join('')}</tbody>
        <tfoot><tr style="font-weight:800;border-top:2px solid var(--line)">
          <td>TOTAL</td><td class="num mono">${R.baris.reduce((s,b)=>s+b.awal,0)}</td>
          <td class="num mono">${R.tMasuk}</td><td class="num mono">${R.tKeluar}</td>
          <td class="num mono">${R.tAkhir}</td><td></td>
        </tr></tfoot>
      </table></div>
    </div>`;
}

/* ============ 4. PERFORMA KASIR ============ */
/* Halaman ini disamakan dengan Kompas (3 Agustus 2026). Justru DI SINI yang
   paling penting: modul inilah yang dibuka kasir sendiri, sedangkan Performa
   Kasir di Kompas hanya bisa dilihat pemegang level penuh. Kalau salah satu
   tertinggal, kasir dan atasannya membaca angka yang berbeda untuk orang yang
   sama — dan yang salah selalu dianggap yang dibaca kasir.

   ---- BONUS KASIR (skema SDM, dokumen "Skema Target & Bonus — Tim Kasir") ----
   Tangga bonus dari omset yang DIAKUI untuk kasir itu sendiri. Batas atas
   TIDAK dipatok: dokumen berhenti di Rp 250 juta, tapi omset di atas itu tetap
   berhak atas level tertinggi. Satu-satunya tempat mengubah nilainya adalah
   tabel ini — dan salinannya di deploy/kompas/index.html. */
const BONUS_KASIR=[
  { min:200000000, bonus:500000, label:'Level 4' },
  { min:150000000, bonus:300000, label:'Level 3' },
  { min:100000000, bonus:150000, label:'Level 2' },
  { min: 80000000, bonus: 50000, label:'Level 1' },
];
function bonusKasir(real){
  const t=BONUS_KASIR.find(x=>real>=x.min);
  if(t) return { ...t, next:BONUS_KASIR[BONUS_KASIR.indexOf(t)-1]||null };
  return { min:0, bonus:0, label:'Standar kerja', next:BONUS_KASIR[BONUS_KASIR.length-1] };
}
/* Baris ringkasan: target, omset diakui, achievement, bonus, dan jarak ke
   level berikutnya dalam SATU baris — dibaca sebagai satu cerita. */
/* Bonus TIDAK ikut dicabut bersama target: tangganya dihitung dari omset yang
   DIAKUI, bukan dari pencapaian target. Yang hilang cuma dua kotak
   pertamanya. BERKAS KEMBAR dengan versi di deploy/finance/kas/. */
function baguRingkasKasir(a){
  const b=bonusKasir(a.real);
  const kurang=b.next?Math.max(0,b.next.min-a.real):0;
  return `<div class="grid g3">
    <div class="stat accent"><div class="lab">Omset Diakui</div><div class="val sm mono">${fmtRp(a.real)}</div><div class="foot">angka final · dasar bonus</div></div>
    <div class="stat ${b.bonus?'accent':''}"><div class="lab">Bonus Saat Ini</div><div class="val sm mono">${fmtRp(b.bonus)}</div><div class="foot">${esc(b.label)}</div></div>
    <div class="stat"><div class="lab">${b.next?'Menuju '+b.next.label:'Level Tertinggi'}</div>
      <div class="val sm mono">${b.next?fmtRp(kurang):'—'}</div>
      <div class="foot">${b.next?`lagi untuk bonus ${fmtRp(b.next.bonus)}`:'sudah di level teratas'}</div></div>
  </div>`;
}
/* Pengakuan Open Bill. Kartunya hanya muncul kalau memang ada — mayoritas
   kasir dan mayoritas rentang tidak punya satu pun, dan kartu kosong yang
   nangkring permanen adalah persis yang sudah dibuang dari halaman ini
   sebelumnya (rincian compliment, catatan nama tersaring).

   Angkanya SENGAJA tidak dijumlahkan ke Omset Diakui di kotak atas. Uang open
   bill sudah masuk lewat meja kasir, jadi sudah ada di dalam omset brutonya
   hari itu; menambahkannya lagi di sini akan membuat satu uang terhitung dua
   kali dan bonusnya jadi lebih besar dari omset yang benar-benar ada. Yang
   diberikan kartu ini adalah PENGAKUAN: open bill event mana, berapa. */
function kartuOpenBill(rows){
  if(!Array.isArray(rows)||!rows.length) return '';
  const tot=rows.reduce((s,x)=>s+num(x.total),0);
  const urut=rows.slice().sort((x,y)=>x.date<y.date?-1:1);
  return `<div class="card"><h3>Pengakuan Open Bill</h3>
    <div class="card-sub">Pesanan tambahan tamu event yang dilayani lewat meja kasir, di luar paket marketing. Total <b>${fmtRp(tot)}</b> dalam rentang ini. Nominalnya <b>sudah termasuk</b> di dalam Omset Diakui di atas — kartu ini menyebutkan event mana, bukan menambah angka.</div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Tanggal</th><th>Event</th>${rows[0]&&rows[0].kasir!==undefined?'<th>Kasir</th>':''}<th class="num">Nominal</th></tr></thead>
      <tbody>${urut.map(x=>`<tr><td>${esc(x.date)}</td><td><b>${esc(x.eventName||'Event tanpa nama')}</b></td>${x.kasir!==undefined?`<td>${esc(x.kasir||'—')}</td>`:''}<td class="num mono">${fmtRp(num(x.total))}</td></tr>`).join('')}</tbody>
      <tfoot><tr style="font-weight:800;border-top:2px solid var(--line)"><td colspan="${rows[0]&&rows[0].kasir!==undefined?3:2}">TOTAL</td><td class="num mono">${fmtRp(tot)}</td></tr></tfoot>
    </table></div></div>`;
}
function kartuBonusKasir(real, semua){
  const b=bonusKasir(real);
  const baris=BONUS_KASIR.slice().reverse().map(t=>{
    const aktif=t.label===b.label;
    return `<tr${aktif?' style="background:var(--gold-soft)"':''}>
      <td>${aktif?'<b>'+t.label+'</b> ✓':t.label}</td>
      <td class="num mono">${fmtRp(t.min)}</td>
      <td class="num mono">${aktif?'<b>'+fmtRp(t.bonus)+'</b>':fmtRp(t.bonus)}</td></tr>`;
  }).join('');
  return `<div class="card">
    <h3>💰 Tangga Bonus ${semua?'(gabungan semua kasir)':''}</h3>
    <div class="card-sub">Posisi saat ini ada di baris ringkasan paling atas. ${
      semua?'Angka gabungan itu hanya gambaran; bonus dinilai per kasir, pilih namanya di atas.':''}</div>
    <div class="tbl-wrap"><table><thead><tr><th>Level</th><th class="num">Omset Diakui Minimal</th><th class="num">Bonus per Orang</th></tr></thead><tbody>
      <tr${b.bonus?'':' style="background:var(--gold-soft)"'}><td>${b.bonus?'Standar kerja':'<b>Standar kerja</b> ✓'}</td><td class="num mono">&lt; ${fmtRp(80000000)}</td><td class="num mono">—</td></tr>
      ${baris}
    </tbody></table></div>
    <div class="helper" style="margin-top:10px">Angka nett (sebelum tax &amp; service). Pencairan tetap lewat verifikasi SM/CEO dan persetujuan Finance, HRD &amp; CEO — kartu ini hanya menunjukkan posisi capaian.</div>
  </div>`;
}

/* ---- SIAPA YANG DINILAI DI HALAMAN INI (11 Agustus 2026) ----
   Performa Kasir hanya memajang akun yang Tim/Keterangan-nya di Office PERSIS
   "kasir". Dua golongan sengaja hilang dari sini:

     - yang keterangannya bukan kasir sama sekali (PIC lama, atau akun yang
       timnya sudah dipindah di Office tapi barisnya tertinggal di sini);
     - yang bertim rangkap — "kasir floor", "Kasir, Office".

   Alasannya: halaman ini menilai TARGET dan BONUS kasir penuh waktu. Orang yang
   cuma sesekali memegang POS akan selalu terlihat gagal target, dan angkanya
   ikut menyeret kotak "Semua" — dua angka yang dipakai untuk memutuskan uang,
   dihitung dari orang yang tidak diukur dengan ukuran itu.

   Yang TIDAK ikut berubah, dan memang tidak boleh: pilihan kasir di Input Omset
   /Breakdown (milik Kompas) dan roster yang disinkronkan syncPicOffice. Omset
   mereka tetap boleh dialokasikan dan tetap tercatat — cuma tidak dinilai di
   sini.

   Dasarnya keterangan MENTAH dari Office (KET_MAP), bukan salinan di DB: kalau
   HR memperbaiki tim seseorang, halaman ini ikut benar tanpa menunggu sinkron
   apa pun. Kalau Office belum menjawab (atau orangnya sudah tidak ada di sana),
   ketKasir() memulangkan null dan orangnya TETAP DITAMPILKAN — sesaat memajang
   satu nama berlebih jauh lebih tidak berbahaya daripada menyembunyikan kasir
   sungguhan beserta bonusnya cuma karena jaringan belum selesai.

   Kembar persis di deploy/kompas/index.html dan deploy/finance/index.html —
   kalau salah satu diubah, ubah ketiganya. */
function ketKasir(e){
  if(!e) return null;
  if(KET_MAP){
    if(e.officeUserId!=null){ const a=KET_MAP['#'+e.officeUserId]; if(a!==undefined) return a; }
    const b=KET_MAP['@'+String(e.name||'').trim().toLowerCase()];
    if(b!==undefined) return b;
  }
  return null;
}
function kasirMurni(e){
  const ket=ketKasir(e);
  if(ket===null) return true;                       // belum diketahui → jangan sembunyikan
  // Pemisahnya sama dengan seluruh modul (spasi, koma, titik koma, garis miring)
  // supaya "Floor, Kasir" dan "kasir/office" terbaca dua kata, bukan satu.
  const t=String(ket).toLowerCase().split(/[\s,;/]+/).filter(Boolean);
  return t.length===1 && t[0]==='kasir';
}
/* Pager tabel Riwayat (11 Agustus 2026). Sebulan penuh bisa lewat 30 baris, dan
   kartunya berdiri BERSEBELAHAN dengan grafik Omset Harian: tabel sepanjang itu
   membuat barisnya memanjang jauh melewati grafik, dan tangga bonus di bawahnya
   terdorong keluar layar. KS_HAL global (bukan di dalam viewKasir) supaya
   bertahan saat hanya tabelnya yang digambar ulang. */
const KS_PER_HAL=12;
let KS_HAL=1;
function viewKasir(){
  const el=document.getElementById('app-view');
  const days=rentangAktif();
  KS_HAL=1;   // masuk halaman / ganti rentang selalu mulai dari halaman pertama
  /* Roster Office belum pernah ditarik kalau halaman Compliment belum dibuka.
     Tarik sekali, lalu gambar ulang — bukan menunggu, supaya halaman tetap
     tampil seketika. */
  if(COMP_ROSTER===null) ambilRoster().then(()=>{ if(CURRENT==='kasir') render(); });
  const semuaPic=DB.employees.kasir;
  const list=semuaPic.filter(kasirMurni);
  const disaring=semuaPic.filter(e=>!kasirMurni(e));
  const agg={};
  list.forEach(k=>agg[k.id]={real:0,masuk:0,off:0,hist:[],potong:0,ob:[]});
  /* Open Bill dikumpulkan dari SELURUH hari dalam rentang, terpisah dari
     perulangan baris kasir di bawah — Open Bill bisa jatuh di hari yang kasir
     bersangkutan tidak punya baris omset sama sekali (mis. ia melayani open
     bill lalu sisa shiftnya diambil orang lain), dan kalau ikut di dalam sana
     baris itu hilang tanpa jejak. Angkanya tidak menambah `real`: uangnya
     sudah ada di dalam omset bruto hari itu (lihat obTotal). */
  days.forEach(d=>{
    openBillList(d).forEach(x=>{ if(agg[x.kasirId]) agg[x.kasirId].ob.push({date:d.date,eventName:x.eventName,total:x.total}); });
  });
  days.forEach(d=>{
    (d.bd?.kasir||[]).forEach(r=>{if(agg[r.kasirId]){
      if(r.off){agg[r.kasirId].off++;agg[r.kasirId].hist.push({date:d.date,real:0,off:true});}
      else{
        // Potongan dihitung dari shift tiap baris event, bukan dari kehadiran
        // hari itu: kasir yang masuk tapi tidak kena shift event tidak dipotong.
        const potong=potonganHari(d,r.kasirId);
        /* `real` sudah bersih: bruto − diskon yang dia berikan − potongan
           event. Riwayat di bawah SENGAJA hanya memajang angka ini, tidak
           lagi memecahnya jadi kolom omset + kolom potongan (permintaan user
           3 Agustus 2026): kasir membaca deretan potongan sebagai hukuman,
           padahal yang menentukan bonusnya cuma angka finalnya. Rinciannya
           tidak hilang — ada di kartu "Efek ke Realisasi Kasir" di Breakdown
           milik Kompas, tempat orang yang memang perlu memeriksa mencarinya. */
        const real=omsetKasir(r)-potong;
        agg[r.kasirId].real+=real;
        agg[r.kasirId].potong+=potong;
        agg[r.kasirId].masuk++;
        agg[r.kasirId].hist.push({date:d.date,real,off:false});
      }
    }});
  });
  /* sama seperti Performa & Ranking: compliment memotong realisasi.
     compRows TETAP dikumpulkan walau kartu rinciannya sudah tidak dipajang di
     modul ini (5 Agustus 2026): baris-baris itulah yang menurunkan omset per
     HARI di tabel Riwayat (lihat blok di bawah), bukan cuma angka totalnya. */
  list.forEach(k=>{
    const cr=compListPicRentang(k);
    agg[k.id].compRows=cr;
    agg[k.id].comp=cr.reduce((s,c)=>s+compPotong(c),0);
    agg[k.id].real-=agg[k.id].comp;
    /* Compliment ikut diturunkan di hari kejadiannya, bukan cuma dari total.
       Sejak riwayat memajang angka final, jumlah kolomnya HARUS sama dengan
       Omset Diakui di kotak atas — kalau tidak, dua angka di halaman yang sama
       bercerita beda dan tidak ada yang tahu mana yang benar.
       Compliment pada hari yang tidak punya baris kasir (mis. dia OFF) tetap
       dimunculkan sebagai barisnya sendiri supaya nominalnya tidak lenyap. */
    const perTgl={};
    cr.forEach(c=>{ perTgl[c.date]=(perTgl[c.date]||0)+compPotong(c); });
    agg[k.id].hist.forEach(h=>{ if(perTgl[h.date]){ h.real-=perTgl[h.date]; delete perTgl[h.date]; } });
    Object.keys(perTgl).forEach(dt=>agg[k.id].hist.push({date:dt,real:-perTgl[dt],off:false,extra:true}));
  });
  const seg='<button class="active" data-k="__all__">🧮 Semua</button>'+list.map(k=>`<button data-k="${k.id}">${esc(k.name)}</button>`).join('');
  /* Hari yang punya baris event tanpa kasir shift. Potongannya tidak dibebankan
     ke siapa pun, jadi realisasi kasir di bawah lebih BESAR dari seharusnya —
     sebut alasannya, jangan biarkan angkanya tampak wajar. Breakdown Sumber
     tidak ada di modul ini, jadi kalimatnya menunjuk ke Kompas. */
  const hariBelum=days.filter(d=>barisTanpaShift(d).length);
  const peringatan=hariBelum.length
    ? `<div class="notice warn">⚠ ${hariBelum.length} hari punya baris event yang belum ditentukan kasir shift-nya (${esc(hariBelum.slice(0,5).map(d=>d.date).join(', '))}${hariBelum.length>5?', …':''}). Potongannya belum dibebankan ke kasir mana pun, jadi realisasi di bawah masih terlalu besar — atur di <b>Breakdown Sumber</b> pada modul Kompas untuk tanggal tersebut.</div>`
    : '';
  /* Baris catatan yang menyebut nama-nama yang disaring DIHAPUS atas permintaan
     user (11 Agustus 2026). Sempat ada satu hari: isinya jadi daftar panjang
     lima nama lengkap dengan keterangannya ("Rizki Arnold (Floor, Kasir), …"),
     nangkring permanen di atas halaman yang dibuka tiap hari, dan tidak
     menambah apa pun yang bisa dikerjakan dari sini — memperbaikinya tetap di
     Office. Kalau suatu saat perlu tahu siapa yang tersaring, `disaring` masih
     dihitung di atas; jangan hidupkan lagi sebagai notice permanen. */
  el.innerHTML=`<div class="card" style="padding:12px 16px"><div class="card-sub" style="margin:0">Menampilkan <b>${modeHarian()?'satu hari':'satu bulan'}</b> · ${esc(labelRentang())}</div></div>`+peringatan+(list.length?`<div class="seg" id="ks_seg">${seg}</div>`:'')+`<div id="ks_body"></div>`;
  const draw=kid=>{
    let k,a;
    if(kid==='__all__'){
      k={name:'Semua Kasir', target:list.reduce((s,x)=>s+num(x.target),0)};
      a={real:0,masuk:0,off:0,hist:[],comp:0,compRows:[],potong:0,ob:[]};
      list.forEach(x=>{const g=agg[x.id];if(!g)return;a.real+=g.real;a.masuk+=g.masuk;a.off+=g.off;a.potong+=(g.potong||0);a.comp+=(g.comp||0);(g.compRows||[]).forEach(c=>a.compRows.push(c));g.hist.forEach(h=>a.hist.push(Object.assign({kasir:x.name},h)));(g.ob||[]).forEach(o=>a.ob.push(Object.assign({kasir:x.name},o)));});
    } else { k=list.find(x=>x.id===kid); a=agg[kid]; }
    if(!k||!a) return;
    const avg=a.masuk>0?a.real/a.masuk:0;
    /* Riwayat di MODUL INI hanya berstatus Masuk dan OFF (permintaan user
       11 Agustus 2026). Baris `extra` — potongan compliment yang jatuh di hari
       tanpa omset, jadi tampil sebagai baris tersendiri bernominal minus —
       dibuang dari tabel. Lanjutan dari keputusan 3 & 5 Agustus 2026 yang sudah
       membuang kolom potongan dan kartu rincian compliment dari modul ini:
       halaman ini dibuka kasirnya sendiri, dan deretan angka minus dibaca
       sebagai daftar hukuman padahal yang menentukan bonusnya cuma angka final.
       Yang perlu memeriksa compliment mana membebani siapa membukanya di
       Kompas → Performa Kasir, tempat barisnya tetap ada.

       Potongannya TIDAK hilang dari perhitungan — a.real sudah dikurangi di
       viewKasir, dan hari yang punya baris omset tetap memajang angka yang
       sudah dipotong. Yang hilang cuma barisnya sendiri, jadi kalau ada
       compliment di hari OFF jumlah kolom tabel ini TIDAK lagi sama persis
       dengan Omset Diakui. Selisih itu disebutkan di card-sub, bukan
       dibiarkan tampak seperti salah hitung. */
    const histUrut=[...a.hist].filter(h=>!h.extra).sort((x,y)=>x.date<y.date?-1:1);
    const compLuar=a.hist.filter(h=>h.extra).reduce((s,h)=>s+h.real,0);   // negatif
    /* Tabelnya digambar TERPISAH dari ks_body (lihat #ks_riw di bawah) supaya
       ganti halaman tidak membangun ulang seluruh kartu — kalau ks_body ikut
       digambar ulang, Chart.js membuat ulang grafik Omset Harian tiap klik dan
       gulir melompat kembali ke atas halaman. */
    const gambarRiwayat=()=>{
      const wadah=document.getElementById('ks_riw'); if(!wadah) return;
      const totalHal=Math.max(1,Math.ceil(histUrut.length/KS_PER_HAL));
      if(KS_HAL>totalHal) KS_HAL=totalHal;
      if(KS_HAL<1) KS_HAL=1;
      const mulai=(KS_HAL-1)*KS_PER_HAL, akhir=Math.min(mulai+KS_PER_HAL,histUrut.length);
      const rows=histUrut.slice(mulai,akhir).map(h=>`<tr><td>${h.date}${h.kasir?` <span class="muted" style="font-size:11px">· ${esc(h.kasir)}</span>`:''}</td><td class="num mono">${h.off&&!h.real?'<span class="muted">—</span>':fmtRp(h.real)}</td><td>${h.off?'<span class="chip warn">OFF</span>':'<span class="chip ok">Masuk</span>'}</td></tr>`).join('');
      const pager=totalHal>1?`<div id="ks_pager" style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:10px">
        <button class="btn btn-ghost btn-sm" data-hal="${KS_HAL-1}"${KS_HAL<=1?' disabled':''}>‹ Sebelumnya</button>
        <span class="muted" style="font-size:12.5px">Baris ${mulai+1}–${akhir} dari ${histUrut.length} · halaman ${KS_HAL}/${totalHal}</span>
        <button class="btn btn-ghost btn-sm" data-hal="${KS_HAL+1}"${KS_HAL>=totalHal?' disabled':''}>Berikutnya ›</button>
      </div>`:'';
      wadah.innerHTML=`<div class="tbl-wrap"><table><thead><tr><th>Tanggal</th><th class="num">Omset Diakui</th><th>Status</th></tr></thead><tbody>${rows||'<tr><td colspan="3" class="empty">Belum ada data.</td></tr>'}</tbody></table></div>${pager}`;
      wadah.querySelectorAll('#ks_pager button').forEach(b=>{ if(!b.disabled) b.onclick=()=>{ KS_HAL=num(b.dataset.hal); gambarRiwayat(); }; });
    };
    document.getElementById('ks_body').innerHTML=`
      ${baguRingkasKasir(a)}
      <div class="card"><div class="foot" style="font-size:12.5px;color:var(--muted)">Omset diakui ${fmtRp(a.real)} · ${a.masuk} hari masuk, ${a.off} hari OFF (rata-rata ${fmtRp(avg)}/hari)</div></div>
      <div class="grid g2" style="align-items:start">
        <div class="card"><h3>Omset Harian</h3><div class="chart-box sm"><canvas id="ks_chart"></canvas></div></div>
        <div class="card"><h3>Riwayat</h3><div class="card-sub">${a.masuk} hari masuk, ${a.off} hari OFF · angka per hari sudah <b>final</b>${compLuar?` · ada ${fmtRp(-compLuar)} potongan compliment yang jatuh di hari tanpa omset, jadi tidak punya barisnya sendiri di sini — Omset Diakui di atas sudah memperhitungkannya`:', jumlahnya tepat sama dengan Omset Diakui di atas'}</div><div id="ks_riw"></div></div>
      </div>
      ${kartuOpenBill(a.ob||[])}
      ${kartuBonusKasir(a.real, kid==='__all__')}`;
    gambarRiwayat();
    /* Kartu "Rincian Compliment" DIBUANG dari modul ini (permintaan user
       5 Agustus 2026) — di modul Kompas kartunya tetap ada.
       Bedanya siapa yang membaca: modul ini dibuka kasir sendiri, dan yang ia
       perlukan cuma angka omset yang diakui. Manajer yang perlu tahu compliment
       mana membebani siapa tetap melihatnya di Kompas → Performa Kasir.
       Sejak 11 Agustus 2026 baris "Compliment" di tabel Riwayat pun ikut hilang
       dari sini (lihat histUrut di atas), jadi satu-satunya yang tersisa
       menyebut potongannya di halaman ini adalah ringkasan atas dan satu
       kalimat di card-sub Riwayat. Itu memang yang diminta — bukan kelalaian. */
    /* clearCharts(), bukan clearChartsExcept(). Nama kedua itu ada di Kompas
       tapi TIDAK PERNAH ikut terbawa waktu modul ini dipecah, jadi baris ini
       melempar ReferenceError setiap kali Performa Kasir digambar — grafik
       Omset Harian tidak pernah muncul dan grafik lama tidak pernah dibuang.
       Halamannya tetap tampil (innerHTML sudah diisi sebelum baris ini), jadi
       tidak ada gejala selain kotak grafik yang diam. Ketahuan 3 Agustus 2026
       saat halaman ini disamakan dengan Kompas. */
    clearCharts();
    /* Grafik memakai SELURUH a.hist, termasuk baris compliment yang tidak
       ditampilkan di tabel: yang dijaga di sini adalah totalnya tetap sama
       dengan Omset Diakui di kotak atas. Kalau baris itu ikut dibuang dari
       grafik juga, batangnya akan menjumlah lebih besar dari angka yang
       dipakai menghitung bonus — dan tidak ada tempat lain di modul ini yang
       bisa menjelaskan selisihnya. */
    const h=[...a.hist].sort((x,y)=>x.date<y.date?-1:1);
    if(h.length)charts.push(new Chart(document.getElementById('ks_chart'),{type:'bar',data:{labels:h.map(x=>x.date.slice(8)),datasets:[{data:h.map(x=>x.real),backgroundColor:'#1F9D8F',borderRadius:5}]},options:barOpts()}));
    else emptyCanvas('ks_chart','Belum ada data');
  };
  // Ganti kasir = daftar riwayat lain sama sekali; bertahan di halaman 3 milik
  // orang sebelumnya cuma memajang layar kosong pada kasir yang riwayatnya pendek.
  document.querySelectorAll('#ks_seg button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#ks_seg button').forEach(x=>x.classList.remove('active'));b.classList.add('active');KS_HAL=1;draw(b.dataset.k);});
  if(list.length)draw('__all__');
  else document.getElementById('ks_body').innerHTML=semuaPic.length
    ? `<div class="card"><div class="empty">Tidak ada kasir yang dinilai di sini — ${semuaPic.length} nama yang ada semuanya bertim rangkap atau bukan kasir. Halaman ini hanya menilai akun ber-Tim/Keterangan <b>kasir</b> saja; perbaikannya di Office.</div></div>`
    : '<div class="card"><div class="empty">Belum ada kasir. Muncul otomatis dari Tim/Keterangan di Office.</div></div>';
}

/* Sinkron PIC dari Office OTOMATIS (tanpa PIN) berdasarkan Tim/Keterangan.
   Memakai listDivisiRoster — endpoint terbuka yang hanya membalas nama +
   keterangan. Di modul ini yang benar-benar dipakai cuma daftar `kasir`
   (Performa Kasir kosong tanpa itu), tapi ketiga divisi tetap disinkronkan
   supaya isi database sama persis dengan yang ditulis Kompas — kalau hanya
   kasir yang ditambahkan di sini, dua modul akan bergantian menulis daftar
   PIC yang berbeda ke blob yang sama. NON-DESTRUKTIF: cuma menambah yang
   belum ada (cocok officeUserId atau nama). */
async function syncPicOffice(){
  if(!DB) return;
  try{
    const r=await fetch('../account-api-mysql/api.php',{method:'POST',redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'listDivisiRoster'})});
    const j=await r.json();
    if(!j||!j.ok||!Array.isArray(j.members)) return;
    let changed=false;
    ['marketing','event','kasir'].forEach(divi=>{
      j.members.forEach(u=>{
        if(u.active===false) return;
        const ket=String(u.keterangan||'').toLowerCase().split(/[\s,;/]+/);
        if(ket.indexOf(divi)<0) return;                 // kata divisi utuh
        const nama=String(u.name||'').trim(); if(!nama) return;
        const ada=DB.employees[divi].some(e=>e.officeUserId===u.id || String(e.name||'').trim().toLowerCase()===nama.toLowerCase());
        if(!ada){ DB.employees[divi].push({id:divi[0]+Date.now().toString(36)+Math.floor(Math.random()*1e4),name:nama,target:0,officeUserId:u.id}); changed=true; }
      });
    });
    if(changed){ save(); if(CURRENT==='kasir') render(); }
  }catch(e){ /* Office diam → biarkan; PIC yang sudah tersimpan tetap ada */ }
}

/* ============ 5. DANA MASUK (DP) ============
   BUKAN salinan. Yang ditampilkan di sini adalah halaman Dana Masuk MILIK
   MODUL RESERVASI, dijalankan apa adanya di dalam <iframe> dengan parameter
   `?embed=finance`. Satu domain, jadi tidak ada urusan lintas-asal.

   Kenapa begini, bukan disalin kodenya (permintaan 28 Juli 2026 "sama persis
   seperti yang ada di tab reservasi"): halaman itu bukan cuma tabel. Di
   belakangnya ada mesin OCR pembaca bukti transfer, pengunduh berkas bukti
   yang disimpan terpisah di server, jalur simpan verifikasi berpelindung
   tabrakan (merge per baris + baseVer), dan audit log. Menyalin semuanya
   berarti membuat salinan kedua yang pelan-pelan melenceng dari aslinya —
   dan "sama persis" cuma benar di hari pertama. Dengan cara ini perbaikan apa
   pun di modul Reservasi langsung ikut ke sini, tanpa disalin ulang.

   Sisi Reservasi yang menopang ini ada tiga baris kecil: guard SSO menerima
   pemegang modul `cashier` lewat pintu embed, body.embed menyembunyikan
   sidebar & appbar, dan navigate() dikunci ke 'finance'. Role-nya dipaksa
   `cashier` — kolom yang memang sudah ada di matriks Hak Akses per Role di
   sana, dengan Dana Masuk = Boleh Ubah.

   Kalau iframe-nya gagal (mis. akses reservasi dicabut), yang tampil adalah
   halaman login Office di dalam bingkai — itu memang jawaban yang benar,
   bukan layar putih. */
function viewDp(){
  const el=document.getElementById('app-view');
  /* Tanpa kartu keterangan di atas bingkai (permintaan 29 Juli 2026). Judul
     "Dana Masuk (DP)" sudah ada di topbar lewat TITLES, jadi kartu itu cuma
     mengulanginya dan memakan tinggi yang lebih berguna untuk isinya.

     Tombol Muat Ulang tetap ada: isi bingkai adalah aplikasi Reservasi yang
     menarik datanya sendiri saat dimuat, jadi inilah satu-satunya cara
     menarik data terbaru tanpa berpindah halaman dulu. Yang dimuat ulang
     iframe-nya saja, bukan halaman Cashier — kalau seluruh halaman di-reload,
     modul ini ikut menarik ulang database Kompas tanpa alasan. */
  el.innerHTML=`
    <div style="display:flex;justify-content:flex-end;margin-bottom:10px">
      <button class="btn btn-ghost btn-sm" onclick="muatUlangDp()">↻ Muat Ulang</button>
    </div>
    <div class="card" style="padding:0;overflow:hidden">
      <iframe id="dpFrame" src="../reservasi/?embed=finance" title="Dana Masuk (DP)"
        style="display:block;width:100%;height:calc(100vh - 168px);min-height:520px;border:0"></iframe>
    </div>`;
}
/* Menyetel ulang `src` alih-alih memanggil contentWindow.location.reload():
   keduanya sama-sama memuat ulang, tapi reload() menyentuh dokumen di dalam
   frame dan akan gagal dengan galat lintas-asal begitu ada yang memindahkan
   modul Reservasi ke subdomain sendiri. Menulis src aman dalam dua keadaan. */
function muatUlangDp(){
  const f=document.getElementById('dpFrame');
  if(f) f.src='../reservasi/?embed=finance&t='+Date.now();
}

/* ============ 6. KELOLA AKSES KRU ============
   Daftar siapa saja yang PUNYA akses modul cashier, ditarik dari database
   account lewat `listModuleRoster` — endpoint TANPA gerbang PIN (identitas
   sudah dijamin sesi Office). Read-only: menambah dan menghapus akses tetap
   dilakukan di "Kelola Akses" milik Office, bukan di sini.

   Beda dari halaman serupa di Kompas: DI SINI TIDAK ADA KOLOM LEVEL. Kompas
   punya dua level tampilan ('ops'/'full'); modul ini tidak, karena semua
   halamannya memang pekerjaan kasir. Yang ditampilkan cuma siapa pemegang
   aksesnya — kalau kolom level ikut disalin, isinya akan berbohong. */
let AKSES_ROSTER=null, AKSES_ERR='';
async function muatAkses(){
  const stop=new AbortController(); const jam=setTimeout(()=>stop.abort(),8000);
  try{
    const r=await fetch('../account-api-mysql/api.php',{method:'POST',redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'listModuleRoster',module:'cashier'}),signal:stop.signal});
    clearTimeout(jam);
    const t=await r.text(); let j=null; try{ j=JSON.parse(t); }catch(e){}
    if(!j) throw new Error('Office membalas bukan JSON (account-api-mysql belum terpasang?)');
    if(!j.ok) throw new Error(j.error||'ditolak');
    if(!Array.isArray(j.members)) throw new Error('balasan tanpa daftar anggota');
    AKSES_ROSTER=j.members; AKSES_ERR='';
  }catch(e){ clearTimeout(jam); AKSES_ROSTER=null; AKSES_ERR=(e.name==='AbortError'?'Office tidak menjawab dalam 8 detik':e.message); }
  if(CURRENT==='akses') viewAkses();
}
function viewAkses(){
  const el=document.getElementById('app-view');
  const meNama=(CURRENT_USER&&CURRENT_USER.name)||'';
  const initial=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase();
  if(AKSES_ROSTER===null && !AKSES_ERR){
    el.innerHTML=`<div class="card"><div class="empty"><div class="big">⏳</div>Memuat daftar akses dari Office…</div></div>`;
    muatAkses(); return;
  }
  const rows=(AKSES_ROSTER||[]).slice().sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')));
  el.innerHTML=`
    <div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap">
      <div><h3>Pemegang Akses Modul Cashier</h3><div class="card-sub" style="margin:0">Ditarik dari database Office. Menambah dan menghapus akses dilakukan di <b>Kelola Akses</b> milik Office, bukan di sini.</div></div>
      <button class="btn btn-ghost btn-sm" onclick="AKSES_ROSTER=null;AKSES_ERR='';viewAkses()">↻ Segarkan</button>
    </div>
    <div class="notice info">🔑 <div><b>Semua pemegang akses melihat halaman yang sama.</b>
      Report Daily, Compliment, Performa Kasir, dan Dana Masuk — tidak ada level tampilan di modul ini.
      Kalau seseorang tidak boleh melihat salah satunya, yang benar adalah tidak memberinya modul ini sama sekali,
      bukan menambah gerbang kedua di dalam sini.
      <b>Admin modul</b> hanya menentukan siapa yang boleh mengelola akses lewat konsol Office.</div></div>
    ${AKSES_ERR?`<div class="notice bad">⚠ Gagal memuat: ${esc(AKSES_ERR)}</div>`:`
    <div class="card" style="padding:0;overflow:hidden">
      <div class="tbl-wrap"><table>
        <thead><tr><th>Nama</th><th>Tim / Keterangan</th><th>Status Akun</th><th>Admin Modul</th></tr></thead>
        <tbody>${rows.length?rows.map(m=>{const adm=!!m.isModuleAdmin;return `<tr>
          <td><div style="display:flex;align-items:center;gap:10px">
            <span style="width:30px;height:30px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--gold-2),var(--gold-dim));color:#fff;font-weight:800;font-size:11px">${esc(initial(m.name))}</span>
            <b>${esc(m.name||'(tanpa nama)')}</b>${meNama&&String(m.name||'').toLowerCase()===meNama.toLowerCase()?' <span class="chip info" style="margin-left:4px">kamu</span>':''}</div></td>
          <td class="muted" style="font-size:12.5px">${esc(m.keterangan||'—')}</td>
          <td>${m.active===false?'<span class="chip warn">nonaktif</span>':'<span class="chip ok">aktif</span>'}</td>
          <td>${adm?'<span class="chip ok">admin modul</span>':'<span class="muted" style="font-size:12px">—</span>'}</td>
        </tr>`;}).join(''):`<tr><td colspan="4" class="empty">Belum ada kru dengan akses modul Cashier. Beri akses lewat Kelola Akses di Office.</td></tr>`}</tbody>
      </table></div>
    </div>
    <div class="foot" style="font-size:12px;color:var(--muted);margin-top:2px">${rows.length} kru memegang akses Cashier · ${rows.filter(m=>m.isModuleAdmin).length} di antaranya admin modul.</div>`}`;
}

/* ---- chart option factories ---- */
const money=v=>fmtRpShort(v);
function lineOpts(){return{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top',labels:{font:{family:'Inter'},boxWidth:12}}},scales:{y:{ticks:{callback:money,font:{family:'Inter'}}},x:{ticks:{font:{family:'Inter'}}}}};}
function barOpts(horizontal){return{indexAxis:horizontal?'y':'x',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{[horizontal?'x':'y']:{ticks:{callback:money,font:{family:'Inter'}}},[horizontal?'y':'x']:{ticks:{font:{family:'Inter'}}}}};}
function pieOpts(){return{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{font:{family:'Inter'},boxWidth:12,padding:10}},tooltip:{callbacks:{label:c=>c.label+': '+fmtRp(c.raw)}}}};}

/* ---- init: muat dari server, lalu jalankan ---- */
function boot(){
  CURRENT_USER=bacaSesi();
  if(!CURRENT_USER){ location.replace('../'); return; }
  const av=document.getElementById('suAvatar'), nm=document.getElementById('suName');
  if(av) av.textContent=(String(CURRENT_USER.name||'?').trim()[0]||'?').toUpperCase();
  if(nm) nm.textContent=CURRENT_USER.name||'—';
  setSync('load');
  render();   // tampilkan status "memuat"
  apiGet().then(data=>{
    DB=normalizeDB(data);
    setSync('ok');
    PERIOD=DB.daily.length?monthKeyOf(DB.daily[DB.daily.length-1].date):monthKeyOf(todayISO());
    const dibersihkan=purgeSeedKasir(DB);   // buang PIC contoh "Kasir 1/2/3"
    go('report');
    if(dibersihkan) save();
    syncPicOffice();   // tarik PIC per divisi dari Office (otomatis, tanpa PIN)
  }, err=>{
    // Jaringan gagal → pakai salinan lokal kalau ada, biar tetap bisa dilihat.
    let cache=null; try{ cache=JSON.parse(localStorage.getItem(CACHE_KEY)||'null'); }catch(e){}
    DB=normalizeDB(cache||seed());
    setSync('err','Offline — memakai salinan lokal, perubahan akan disinkronkan saat online');
    PERIOD=DB.daily.length?monthKeyOf(DB.daily[DB.daily.length-1].date):monthKeyOf(todayISO());
    purgeSeedKasir(DB);   // rapikan tampilan; simpannya nanti saat online
    go('report');
  });
}
boot();
</script>
