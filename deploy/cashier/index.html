<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#F7F6F4">
<title>CASHIER · Laksamana Muda</title>
<link rel="icon" href="../assets/LaksamanaMudaLogo.jpeg">

<!-- Guard SSO: cukup punya akses modul `cashier` (atau '*'). Dijaga di sini
     supaya halaman tidak sempat tergambar sedikit pun bagi yang tidak berhak.
     Penjaga sebenarnya tetap di sisi Office: `modules`/`adminModules` dibuat
     server saat login, bukan diketik browser.

     Kuncinya `cashier`, BUKAN `kompas` — itu inti dipisahnya modul ini: kasir
     boleh mengisi setoran dan compliment tanpa ikut memegang akses ke seluruh
     angka omset, target, dan bonus perusahaan yang ada di Kompas.
     Syaratnya HARUS sama persis dengan bacaSesi() di bawah; kalau salah satu
     diubah, ubah keduanya. -->
<script>
(function(){try{
  var s=JSON.parse(localStorage.getItem('lm_session')||'null');
  var hidup=s&&s.expiry&&Date.now()<s.expiry;
  var punyaModul=hidup&&(s.modules||[]).some(function(m){return m==='*'||m==='cashier';});
  if(!punyaModul)location.replace('../');
}catch(e){location.replace('../');}})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ===== TEMA OFFICE LAKSAMANA (emas di atas krem/putih, tanpa hitam) ===== */
:root{
  --ink:#2A2620; --ink-2:#3A3428; --ink-3:#4A4234;
  --gold:#A9791F; --gold-2:#C8961F; --gold-dim:#7A560F;
  --gold-soft:#F2E9D3; --gold-glow:rgba(169,121,31,.13);
  --paper:#F7F6F4; --surface:#FFFFFF; --line:#E7E1D3;
  --line-soft:rgba(60,55,45,.10); --line-hard:rgba(60,55,45,.18);
  --text:#2A2620; --muted:#5C574D; --muted-2:#928C80;
  --ok:#1F9D5F; --ok-bg:#E4F5EC; --ok-bg-t:rgba(31,157,95,.12);
  --warn:#B5831A; --warn-bg:#F7EFDB; --warn-bg-t:rgba(181,131,26,.14);
  --danger:#C9432B; --danger-bg:#F8E4DF; --danger-bg-t:rgba(201,67,43,.12);
  --info:#2F7FC4; --info-bg:#E4EFF8; --info-bg-t:rgba(47,127,196,.12);
  --violet:#7C5FC0; --violet-bg:#ECE6F7; --violet-bg-t:rgba(124,95,192,.12);
  --teal:#1F9D8F; --teal-bg:#E2F4F2; --teal-bg-t:rgba(31,157,143,.12);
  --radius:16px; --radius-sm:10px; --radius-lg:20px;
  --shadow:0 4px 18px rgba(50,42,28,.06); --shadow-lg:0 18px 48px rgba(50,42,28,.12);
  --ring:0 0 0 3px rgba(227,160,8,.18); --ease:cubic-bezier(.16,1,.3,1);
  --font-display:'Plus Jakarta Sans',system-ui,sans-serif;
  --font-body:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:var(--font-display); --sans:var(--font-body); --sidebar-w:248px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans);
  background:radial-gradient(900px 480px at 50% -12%, rgba(227,160,8,.09), transparent 60%),var(--paper);
  color:var(--text); font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased; min-height:100vh;
}
h1,h2,h3,h4{font-family:var(--serif); font-weight:700; letter-spacing:-.02em; line-height:1.18; color:var(--ink)}
a{color:var(--info)}
button{font-family:inherit; cursor:pointer}
input,select,textarea{font-family:inherit}
.mono{font-variant-numeric:tabular-nums; font-feature-settings:"tnum"}
.hidden{display:none !important}
@keyframes lm-rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.rise{animation:lm-rise .5s var(--ease) both}
.btn{border:none;border-radius:var(--radius-sm);padding:11px 17px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:filter .15s var(--ease),transform .1s var(--ease)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:none;box-shadow:var(--ring)}
.btn-block{width:100%}
.btn-sm{padding:8px 12px;font-size:13px}
.btn-xs{padding:5px 9px;font-size:12px;border-radius:8px}
.btn-primary{background:linear-gradient(135deg,var(--gold-2),var(--gold-dim));color:#fff;box-shadow:0 3px 12px rgba(122,86,15,.28)}
.btn-primary:hover{filter:brightness(1.06)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;filter:none}
.btn-ghost{background:var(--surface);border:1.5px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--gold-2);background:var(--gold-soft)}
.btn-danger{background:var(--danger-bg);color:var(--danger);border:1.5px solid rgba(201,67,43,.25)}
.btn-danger:hover{filter:brightness(.98)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--ink-2);background:var(--gold-soft);border:1px solid var(--line);border-radius:20px;padding:3px 9px}
.pill .dot{width:5px;height:5px;border-radius:50%;background:var(--gold);flex:none}
.field{text-align:left;margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);font-size:15px;transition:border-color .15s,box-shadow .15s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--gold);box-shadow:var(--ring)}

/* ===== LAYOUT ===== */
.app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);flex:none;background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 18px}
.brand .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--gold-2),var(--gold-dim));display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:800;color:#fff;font-size:18px;flex:none}
.brand .bt{font-family:var(--serif);font-weight:800;font-size:16px;color:var(--ink);letter-spacing:-.02em;line-height:1.1}
.brand .bs{font-size:10.5px;color:var(--muted-2);letter-spacing:.5px;margin-top:2px}
.nav{flex:1}
.nav-group{margin-top:14px}
.nav-label{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted-2);padding:0 10px 7px}
.nav a{position:relative;display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;color:var(--muted);text-decoration:none;font-size:13.5px;font-weight:500;margin-bottom:2px;transition:background .13s,color .13s}
.nav a:hover{background:var(--paper);color:var(--ink)}
/* Menu aktif: latar krem lembut + garis emas di kiri (samakan dgn Reservasi/
   BD OS), BUKAN blok kuning penuh. */
.nav a.active{background:var(--gold-soft);color:var(--gold-dim);font-weight:600}
.nav a.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--gold)}
.nav a .ico{width:18px;display:flex;align-items:center;justify-content:center;flex:none}
.nav a .ico svg{width:17px;height:17px;stroke-width:1.9;opacity:.85}
.nav a.active .ico svg{opacity:1}
/* Ciutkan ke ikon saja (tombol ☰). Label/teks disembunyikan, ikon tetap.
   Hanya di desktop — di layar sempit sidebar sudah off-canvas. */
@media(min-width:621px){
  .app.nav-mini .sidebar{width:72px}
  .app.nav-mini .brand .bt,.app.nav-mini .brand .bs,.app.nav-mini .nav-label,.app.nav-mini .su-info{display:none}
  .app.nav-mini .brand{justify-content:center;padding:6px 0 18px}
  .app.nav-mini .nav a{justify-content:center;gap:0;font-size:0;padding:9px 0}
  .app.nav-mini .nav a .ico{font-size:16px;width:auto}
  .app.nav-mini .side-user{flex-direction:column;gap:8px;padding:10px 6px}
}
@media(max-width:620px){#navMiniBtn{display:none}}
/* kartu user + tombol keluar di kaki sidebar — pola sama seperti modul lain */
.side-user{display:flex;align-items:center;gap:9px;margin-top:12px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
.su-avatar{width:32px;height:32px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--gold-2),var(--gold-dim));color:#fff;font-family:var(--serif);font-weight:800;font-size:14px}
.su-info{min-width:0;flex:1}
.su-info b{display:block;font-size:12.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.su-info span{font-size:10.5px;color:var(--muted-2)}
.logout-x{background:var(--surface);border:1px solid var(--line);color:var(--muted);width:32px;height:32px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;flex:none;transition:.16s}
.logout-x:hover{background:var(--danger-bg);color:var(--danger);border-color:var(--danger)}
.logout-x svg{width:16px;height:16px}
.main{flex:1;min-width:0;padding:26px 30px 60px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.topbar h1{font-size:23px}
.topbar .sub{font-size:13px;color:var(--muted);margin-top:3px}
.month-pick{display:flex;align-items:center;gap:10px}
.month-pick input{padding:9px 11px;border:1.5px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);font-size:14px;font-weight:600;color:var(--ink)}
/* Saklar Harian / Bulanan — sama persis dengan modul Kompas. */
.modesw{display:inline-flex;gap:3px;background:var(--paper);border:1.5px solid var(--line);border-radius:var(--radius-sm);padding:3px}
.modesw button{border:none;background:transparent;padding:6px 12px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;transition:background .15s,color .15s}
.modesw button:hover{color:var(--ink)}
.modesw button.on{background:var(--surface);color:var(--gold-dim);box-shadow:0 1px 4px rgba(50,42,28,.12)}
/* Pesan galat simpan sekarang membawa sebab asli dari server (bisa sepanjang
   "SQLSTATE[HY000] [1044] Access denied..."), jadi span-nya harus boleh
   membungkus dan memotong kata panjang, bukan melebarkan header. */
.sync{font-size:11.5px;font-weight:600;color:var(--muted-2);display:inline-block;max-width:340px;line-height:1.45;text-align:right;overflow-wrap:anywhere}
.sync.ok{color:var(--ok)} .sync.err{color:var(--danger)} .sync.saving{color:var(--warn)}
.view{max-width:1180px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 22px;margin-bottom:18px}
.card h3{font-size:16px;margin-bottom:4px}
.card .card-sub{font-size:12.5px;color:var(--muted);margin-bottom:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
/* g5 dipakai baris ringkasan Performa Kasir — sama persis dengan Kompas. */
.g5{grid-template-columns:repeat(5,1fr)}
@media(max-width:1200px){.g5{grid-template-columns:repeat(3,1fr)}}
@media(max-width:900px){.g2,.g3,.g4,.g5{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.g2,.g3,.g4,.g5{grid-template-columns:1fr}.sidebar{position:fixed;z-index:50;transform:translateX(-100%);transition:transform .2s}.sidebar.open{transform:none}.main{padding:18px}}
.row-in{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}

/* stat cards — pita emas tipis di tepi atas (gaya Marketing) */
.stat{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:17px 18px;box-shadow:var(--shadow)}
.stat::before{content:'';position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--gold-2),var(--gold-dim))}
.stat .lab{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:6px}
.stat .val{font-family:var(--serif);font-weight:700;font-size:26px;color:var(--ink);margin-top:8px;letter-spacing:-.02em;line-height:1}
.stat .val.sm{font-size:19px}
.stat .foot{font-size:12px;color:var(--muted);margin-top:8px}
.stat.accent{background:linear-gradient(135deg,var(--gold-2),var(--gold-dim));color:#fff;border:none}
.stat.accent::before{display:none}
.stat.accent .lab{color:rgba(255,255,255,.72)}
.stat.accent .val{color:#fff}
.stat.accent .foot{color:rgba(255,255,255,.72)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;border-radius:20px;padding:3px 9px}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.bad{background:var(--danger-bg);color:var(--danger)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.info{background:var(--info-bg);color:var(--info)}
/* Netral — untuk label yang bukan status baik/buruk, mis. Non-Free Entry.
   .chip polos tidak punya background sama sekali, jadi jangan dipakai telanjang. */
.chip.mute{background:var(--paper);color:var(--muted);border:1px solid var(--line)}

/* progress */
.prog{height:9px;border-radius:20px;background:var(--gold-soft);overflow:hidden;margin-top:9px}
.prog>i{display:block;height:100%;border-radius:20px;background:linear-gradient(90deg,var(--gold-2),var(--gold-dim));transition:width .5s var(--ease)}
.prog.ok>i{background:linear-gradient(90deg,#28b06e,var(--ok))}

/* table */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:10px 12px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);color:var(--text)}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto}
tbody tr:hover{background:var(--gold-soft)}

/* status badge */
.status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600}
.status .d{width:9px;height:9px;border-radius:50%;flex:none}
.status.ok .d{background:var(--ok)}
.status.ok{color:var(--ok)}
.status.bad .d{background:var(--danger)}
.status.bad{color:var(--danger)}

/* breakdown row */
.brow{display:grid;gap:10px;align-items:end;margin-bottom:10px}
.brow.mk{grid-template-columns:1.1fr 1.3fr .9fr auto auto auto}
.brow.ks{grid-template-columns:1.3fr 1fr auto}
.brow .field{margin-bottom:0}
@media(max-width:760px){.brow.mk,.brow.ks{grid-template-columns:1fr}}
/* Centang Free Entry (dulu "Ticketing") di baris breakdown. Dibuat setinggi field di sebelahnya
   supaya tidak melayang saat baris ikut memanjang. */
.tkbox{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;padding-bottom:9px}
.tkbox input{cursor:pointer}
.tkbox.on{color:var(--gold-dim)}
/* Tombol ringkasan potongan di baris breakdown. Merah kalau shift-nya belum
   diisi — tanpa itu potongannya tidak dibebankan ke siapa pun dan omset yang
   sama diam-diam terhitung dua kali. (Breakdown-nya ada di Kompas; gaya ini
   ikut disimpan di sini supaya kedua modul tetap kembar.) */
.bhbtn{border:1px dashed var(--line);background:var(--surface);border-radius:9px;padding:7px 10px;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;margin-bottom:9px;line-height:1.35;text-align:left}
.bhbtn:hover{border-color:var(--gold);color:var(--gold-dim)}
.bhbtn.kosong{border-color:var(--danger);color:var(--danger)}
.bhbtn b{display:block;font-size:12.5px;color:var(--text)}
.bhbtn.kosong b{color:var(--danger)}

/* ---- Modal ---- */
.ovl{position:fixed;inset:0;background:rgba(15,18,24,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:80}
.mdl{background:var(--surface);border-radius:var(--radius);max-width:560px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.mdl-h{padding:18px 22px 12px;border-bottom:1px solid var(--line)}
.mdl-h h3{font-size:16px;margin:0}
.mdl-h .sub{font-size:12.5px;color:var(--muted);margin-top:4px}
.mdl-b{padding:18px 22px}
.mdl-f{padding:14px 22px 18px;display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid var(--line)}
.kslist{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-top:8px}
.kschip{display:flex;align-items:center;gap:9px;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;font-size:13px;font-weight:600;cursor:pointer}
.kschip:hover{border-color:var(--gold)}
.kschip.on{border-color:var(--gold);background:var(--gold-soft);color:var(--gold-dim)}
.mini-lab{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-bottom:8px}
/* Mode UBAH catatan compliment. Kartu form dan barisnya di daftar ditandai
   bersamaan — tanpa itu, form yang sudah terisi terlihat persis seperti form
   tambah-baru, dan orang menekan Simpan mengira sedang menambah. */
.card.edit-on{border-color:var(--accent,#C9A227);box-shadow:0 0 0 2px rgba(201,162,39,.16)}
tr.baris-edit{background:rgba(201,162,39,.10)}
.mini-actions{display:inline-flex;gap:5px;align-items:center}
.balance-bar{position:sticky;bottom:0;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--radius);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:16px;box-shadow:var(--shadow-lg);flex-wrap:wrap;margin-top:8px}
.balance-bar .bnums{display:flex;gap:26px;flex-wrap:wrap}
.balance-bar .bnums .bi{font-size:12px;color:var(--muted)}
.balance-bar .bnums .bi b{display:block;font-family:var(--serif);font-size:16px;color:var(--ink);font-weight:800;margin-top:2px}
.notice{padding:11px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;margin-bottom:14px;display:flex;gap:9px;align-items:flex-start}
.notice.ok{background:var(--ok-bg);color:#146c42}
.notice.bad{background:var(--danger-bg);color:#8f2718}
.notice.info{background:var(--info-bg);color:#1a5a91}
.notice.warn{background:var(--warn-bg);color:#7a5a10}
.empty{text-align:center;padding:40px 20px;color:var(--muted-2)}
.empty .big{font-size:34px;margin-bottom:8px}
.seg{display:inline-flex;background:var(--gold-soft);border-radius:10px;padding:3px;gap:2px;margin-bottom:16px;flex-wrap:wrap}
.seg button{border:none;background:transparent;padding:7px 15px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.divlabel{display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:3px 9px;border-radius:6px;margin-bottom:12px}
.divlabel.mk{background:var(--info-bg);color:var(--info)}
.divlabel.ev{background:var(--violet-bg);color:var(--violet)}
.divlabel.ks{background:var(--teal-bg);color:var(--teal)}
.hamb{display:none}
@media(max-width:620px){.hamb{display:inline-flex}}
.chart-box{position:relative;height:280px}
.chart-box.sm{height:230px}
.helper{font-size:11.5px;color:var(--muted-2);margin-top:4px}
.tax-note{background:var(--warn-bg-t);border:1px dashed rgba(181,131,26,.4);border-radius:var(--radius-sm);padding:10px 13px;font-size:12.5px;color:#7a5a10;margin-top:6px}
.leader{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--radius-sm);border:1px solid var(--line);margin-bottom:9px;background:var(--surface)}
.leader .rank{width:30px;height:30px;border-radius:50%;background:var(--gold-soft);color:var(--gold-dim);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px;flex:none}
.leader.top1 .rank{background:linear-gradient(135deg,#f4c752,#c8961f);color:#fff}
.leader .ln{font-weight:700;font-size:14px}
.leader .lm{font-size:11.5px;color:var(--muted)}
.leader .lspace{flex:1}

/* ===== Kalender kustom (bukan date picker bawaan browser) ===== */
.calwrap{position:relative}
.calbtn{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);font-size:15px;font-weight:600;text-align:left;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:220px}
.calbtn:hover{border-color:var(--gold)}
/* di dalam grid form (row-in) tombolnya ikut lebar kolom, jangan memaksa 220px */
.row-in .calbtn{min-width:0}
.row-in .calpop{left:0;right:auto;max-width:min(300px,86vw)}
.calback{position:fixed;inset:0;z-index:55}
.calpop{position:absolute;z-index:60;top:calc(100% + 6px);right:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);padding:14px;width:300px}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calhead b{font-family:var(--serif);font-size:15px;color:var(--ink)}
.calnav{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:16px;display:grid;place-items:center;color:var(--muted)}
.calnav:hover{border-color:var(--gold);color:var(--gold-dim)}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.caldow{font-size:10px;font-weight:700;color:var(--muted-2);text-transform:uppercase;padding:5px 0;letter-spacing:.4px}
.calday{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;border:none;background:none;color:var(--text);position:relative}
.calday:hover{background:var(--gold-soft)}
.calday.off{color:var(--muted-2);opacity:.45;cursor:default}
.calday.off:hover{background:none}
.calday.today{color:var(--gold-dim);font-weight:800}
.calday.sel{background:linear-gradient(135deg,var(--gold-2),var(--gold-dim));color:#fff}
.calday.caldata::after{content:'';position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--gold)}
.calday.sel.caldata::after{background:#fff}
.calquick{display:flex;gap:6px;margin-top:10px}
.calquick button{flex:1;padding:7px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-size:12px;font-weight:600;cursor:pointer;color:var(--text)}
.calquick button:hover{background:var(--gold-soft);border-color:var(--gold)}

/* ---- Lembar cetak Report Achievement ----
   WAJIB display:none di layar. Isinya diisi tepat sebelum window.print(), dan
   tanpa aturan ini lembarnya ikut menempel di bawah halaman sesudah dialog
   cetak ditutup. Ditampilkan hanya di dalam @media print. */
#printSheet{display:none}
@media print{
  /* Sembunyikan aplikasi, sisakan lembar. visibility saja tidak cukup —
     sidebar tetap memesan ruang dan lembarnya terdorong ke halaman 2. */
  .app,.topbar{display:none!important}
  #printSheet{display:block!important;font-family:Inter,system-ui,sans-serif;color:#111}
  #printSheet .ph{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2.5px solid #111;padding-bottom:10px;margin-bottom:18px}
  #printSheet .ph h1{font-size:19px;margin:0 0 3px;letter-spacing:.2px}
  #printSheet .ph .sub{font-size:11.5px;color:#555}
  #printSheet .ph .brand{font-size:12px;font-weight:800;letter-spacing:1.5px;text-align:right}
  #printSheet h2{font-size:13px;margin:20px 0 8px;text-transform:uppercase;letter-spacing:.6px;color:#444}
  #printSheet .kv{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:6px}
  #printSheet .kv>div{border:1px solid #bbb;border-radius:6px;padding:9px 11px}
  #printSheet .kv .l{font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;color:#666;margin-bottom:3px}
  #printSheet .kv .v{font-size:15px;font-weight:800}
  #printSheet table{width:100%;border-collapse:collapse;font-size:11.5px}
  #printSheet th,#printSheet td{border:1px solid #bbb;padding:6px 8px;text-align:left}
  #printSheet th{background:#eee;font-size:10px;text-transform:uppercase;letter-spacing:.4px}
  #printSheet td.num,#printSheet th.num{text-align:right;font-variant-numeric:tabular-nums}
  #printSheet tfoot td{font-weight:800;background:#f4f4f4}
  #printSheet .ttd{margin-top:34px;font-size:11px;color:#555}
  @page{margin:14mm}
}
</style>

<script>
/* =========================================================
   CASHIER — engine

   Modul ini DIPECAH DARI KOMPAS (28 Juli 2026), bukan ditulis dari nol.
   Mesin state, normalisasi, dan lapisan API-nya sengaja dibiarkan sama persis
   karena DATABASENYA MEMANG SATU: API_URL di bawah tetap kompas-api-mysql.
   Yang dicatat kasir di sini langsung terbaca di Kompas dan sebaliknya —
   Report Daily dan Compliment adalah halaman yang sama, cuma pintunya beda.

   Konsekuensi yang harus diingat saat menyunting: perubahan pada Report Daily
   atau Compliment yang cuma dikerjakan di salah satu berkas akan membuat dua
   modul menulis bentuk data yang berbeda ke blob yang sama. Kalau menyentuh
   dua halaman itu, sunting KEDUANYA (deploy/kompas/index.html dan berkas ini).

   Yang TIDAK dibawa ke sini: Input Omset, Breakdown, Dashboard, Ranking,
   Performa Marketing/Event, Pengaturan Target, Kelola Akses Kru. Itu semua
   pekerjaan admin, dan justru karena halaman-halaman itulah modul ini dipisah.

   Omset (net) = Food + Beverage + Lainnya − Discount
   Service Charge & Tax = di luar omset, TAPI ikut ditagihkan ke tamu → jadi
     pembanding setoran kasir di Report Daily
   Compliment = catatan terpisah; memotong REALISASI PIC penanggungnya

   Data disimpan di server (kompas-api-mysql) sebagai satu blob JSON, dengan
   salinan lokal (localStorage) untuk tampil saat jaringan putus. Dana Masuk
   (DP) datang dari tempat lain lagi — lihat bagian 4.
   ========================================================= */
const API_URL='../kompas-api-mysql/api.php';
const CACHE_KEY='lm_cashier_cache_v1';
const SESSION_KEY='lm_session';
const fmtRp=n=>'Rp'+Math.round(n||0).toLocaleString('id-ID');
/* Nominal BERTANDA untuk kolom selisih. fmtRp() menempelkan minus di belakang
   "Rp" ("Rp-9.001") karena tandanya ikut ke dalam toLocaleString — di kolom
   yang justru isinya sering negatif itu terbaca salah sekilas. */
const fmtSel=n=>{ n=Math.round(n||0); return (n>0?'+':n<0?'−':'')+'Rp'+Math.abs(n).toLocaleString('id-ID'); };
const fmtRpShort=n=>{n=n||0;if(Math.abs(n)>=1e9)return 'Rp'+(n/1e9).toFixed(1).replace('.0','')+'M';if(Math.abs(n)>=1e6)return 'Rp'+(n/1e6).toFixed(1).replace('.0','')+'jt';if(Math.abs(n)>=1e3)return 'Rp'+Math.round(n/1e3)+'rb';return 'Rp'+Math.round(n);};
const pct=(a,b)=>b>0?(a/b*100):0;
// Semua nominal di modul ini bilangan BULAT (rupiah/jumlah), dan input rupiah
// diformat dengan titik pemisah ribuan. Jadi titik DIBUANG (bukan dianggap
// desimal) supaya "3.000.000" terbaca 3000000, bukan 3.
const num=v=>{const n=parseInt(String(v).replace(/[^0-9-]/g,''),10);return isNaN(n)?0:n;};
const HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const daysInMonth=(y,m)=>new Date(y,m,0).getDate();
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const monthKeyOf=iso=>iso.slice(0,7);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---- Format rupiah untuk input nominal (angka + pemisah ribuan titik) ----
   Inputan diberi class "rp": nilainya diformat hidup saat diketik, dan num()
   (yang membuang non-digit) tetap membacanya benar. */
function fmtRpInput(v){ var d=String(v==null?'':v).replace(/[^0-9]/g,''); return d?Number(d).toLocaleString('id-ID'):''; }
function formatAllRp(root){ (root||document).querySelectorAll('input.rp').forEach(function(el){ el.value=fmtRpInput(el.value); }); }
document.addEventListener('input',function(e){
  var el=e.target; if(!el||!el.classList||!el.classList.contains('rp')) return;
  var before=el.value.length, caret=el.selectionStart;
  el.value=fmtRpInput(el.value);
  var delta=el.value.length-before;
  try{ el.setSelectionRange(Math.max(0,caret+delta), Math.max(0,caret+delta)); }catch(_){}
});

/* ---- Nol langsung tergantikan saat mulai mengetik ----
   Hampir semua kotak angka di modul ini mulai dari "0". Tanpa ini kru harus
   menghapus nolnya sendiri tiap kali mengisi — dan kalau lupa, hasilnya "05"
   yang terbaca 5 di kotak rupiah tapi tetap terlihat salah, dan benar-benar
   jadi "05" di kotak biasa (traffic/bill/qty) yang tidak lewat formatter. */
function kotakAngka(el){
  return !!el && el.tagName==='INPUT' && !!el.classList &&
         (el.classList.contains('rp') || el.classList.contains('ci') || el.getAttribute('inputmode')==='numeric');
}
function pilihKalauNol(el){ if(kotakAngka(el) && num(el.value)===0){ try{ el.select(); }catch(_){} } }
document.addEventListener('focusin',function(e){ pilihKalauNol(e.target); });
// Klik membatalkan select() dari focusin, jadi dipilih ulang sesudah klik
// selesai. Aman: hanya berlaku saat isinya nol, yang memang tidak ada yang
// perlu ditunjuk kursornya.
document.addEventListener('mouseup',function(e){
  var el=e.target;
  if(kotakAngka(el) && el.selectionStart===el.selectionEnd) pilihKalauNol(el);
});
// Jaring pengaman untuk kotak TANPA class "rp" (traffic, bill, qty): buang nol
// di depan begitu ada angka lain diketik.
document.addEventListener('input',function(e){
  var el=e.target;
  if(!kotakAngka(el) || el.classList.contains('rp')) return;   // yang "rp" sudah dirapikan formatter di atas
  var bersih=String(el.value).replace(/[^0-9]/g,'').replace(/^0+(?=\d)/,'');
  if(bersih!==el.value) el.value=bersih;
});

/* Ciutkan / lebarkan menu samping (tombol ☰). Diingat per perangkat. */
function toggleNav(){
  const app=document.querySelector('.app'), mini=!app.classList.contains('nav-mini');
  app.classList.toggle('nav-mini',mini);
  try{ localStorage.setItem('lm_cashier_navmini',mini?'1':'0'); }catch(e){}
}
(function(){ try{ if(localStorage.getItem('lm_cashier_navmini')==='1') document.querySelector('.app').classList.add('nav-mini'); }catch(e){} })();

/* Identitas dari Office (lm_session).

   TIDAK ADA LEVEL di modul ini — sengaja. Kompas punya dua level ('ops' dan
   'full') karena satu modul itu memuat pekerjaan kasir SEKALIGUS angka
   perusahaan. Di sini pemisahannya sudah terjadi di lapisan modul: siapa pun
   yang boleh membuka Cashier boleh membuka keempat halamannya, dan yang tidak
   boleh tidak diberi modulnya di Kelola Akses. Menambahkan level di sini cuma
   akan jadi gerbang kedua yang diam-diam bertentangan dengan yang pertama —
   persis bug yang memakan satu sesi pelacakan di Kompas pada 28 Juli 2026. */
let CURRENT_USER=null;
function bacaSesi(){
  try{
    const s=JSON.parse(localStorage.getItem(SESSION_KEY)||'null');
    if(!s||!s.expiry||Date.now()>=s.expiry) return null;
    const m=s.modules||[];
    if(m.indexOf('*')<0 && m.indexOf('cashier')<0) return null;
    return {id:s.userId,name:s.name,keterangan:s.keterangan||''};
  }catch(e){ return null; }
}
function bolehLihat(view){ return !!TITLES[view]; }

/* Metode pembayaran Report Daily. Urutannya sengaja alfabetis seperti yang
   dipakai kasir di POS supaya mudah dicocokkan baris per baris.

   HARUS SAMA PERSIS dengan PAYS di deploy/kompas/index.html. Kedua modul
   membaca dan menulis SATU objek yang sama (DB.reports[tgl].pay di blob
   kompas-api-mysql), jadi metode yang cuma ada di salah satunya akan
   diisi di satu layar lalu tidak kelihatan di layar satunya — dan
   totalnya berbeda antara dua halaman yang seharusnya menampilkan angka
   yang sama. Menambah/menghapus di sini WAJIB diikuti di sana. */
/* ENAM BARIS BARU (permintaan user 8 Agustus 2026): Gofood dan lima baris
   "Error ...". Yang Error BUKAN metode pembayaran — tidak ada uang yang masuk
   lewat sana. Ia tempat menuliskan selisih yang SUDAH diketahui sebabnya dan
   sudah jelas siapa yang menanggungnya: salah input kasir, salah masak dapur,
   salah antar floor, salah pesan tamu, salah racik bar.

   Ditaruh di tabel yang sama, bukan di kartu terpisah, justru karena itu yang
   membuatnya berguna: total baris di sini yang dibandingkan dengan setoran,
   jadi selisih yang sudah ada penjelasannya ikut terhitung dan tidak lagi
   muncul sebagai "Selisih POS vs Actual" tanpa nama. Konsekuensinya: baris
   Error ikut masuk Total POS/Actual dan ikut dinilai toleransi Rp5.000 —
   memang begitu maksudnya.

   HARUS SAMA PERSIS dengan PAYS di deploy/kompas/index.html — lihat catatan
   di atas. Menambah di satu berkas saja membuat baris yang diisi kasir di sini
   tidak pernah kelihatan di Kompas, dan totalnya berbeda antara dua halaman
   yang seharusnya menampilkan angka yang sama. */
const PAYS=[
  {k:'cash',        n:'Cash'},
  {k:'compliment',  n:'Compliment'},
  {k:'edc_bca',     n:'EDC BCA'},
  {k:'edc_bri',     n:'EDC BRI'},
  {k:'edc_mandiri', n:'EDC Mandiri'},
  {k:'error_bar',      n:'Error Bar'},
  {k:'error_customer', n:'Error Customer'},
  {k:'error_floor',    n:'Error Floor'},
  {k:'error_kasir',    n:'Error Kasir'},
  {k:'error_kitchen',  n:'Error Kitchen'},
  {k:'gofood',      n:'Gofood'},
  {k:'grabfood',    n:'Grabfood'},
  {k:'member_dep',  n:'Member Deposit'},
  {k:'qris_bca',    n:'QRIS BCA'},
  {k:'qris_bri',    n:'QRIS BRI'},
  /* Labelnya "QRIS POS" sejak 12 Agustus 2026 — samakan dengan panel Finance >
     Input Omset Harian. Kuncinya tetap `qris_esb` (riwayat Daily Report). */
  {k:'qris_esb',    n:'QRIS POS'},
  {k:'qris_mandiri',n:'QRIS Mandiri'},
  {k:'tiktokgo',    n:'TikTok Go'},
  {k:'transfer_uob',n:'Transfer UOB'},
  {k:'voucher',     n:'Voucher'}
];
/* Batas toleransi selisih, dinaikkan ke Rp5.000 pada 3 Agustus 2026 atas
   permintaan user.

   Yang dinilai adalah TOTAL, bukan per metode. Selisih antar metode itu wajar
   dan sering: tamu bayar lewat QRIS lalu uangnya dikembalikan tunai, atau
   pembayaran tercatat di metode yang keliru lalu ditutup dengan metode lain.
   Dalam kasus seperti itu satu metode lebih dan satunya kurang dengan nominal
   yang sama — totalnya tetap nol, dan tidak ada uang yang hilang.

   Karena itu Rp5.000 ke bawah TIDAK dipermasalahkan sama sekali, dan di atas
   itu pun tombol submit tidak dikunci — cuma diberi peringatan. Mengunci

/* Default awal — dipakai kalau server masih kosong. Daftar PIC SENGAJA kosong:

/* Jaga bentuk data supaya view tidak pernah menemui field hilang. */
function normalizeDB(d){
  d=(d&&typeof d==='object'&&!Array.isArray(d))?d:{};
  const s=seed();
  if(!d.settings||typeof d.settings!=='object'||Array.isArray(d.settings)) d.settings=s.settings;
  else for(const k in s.settings) if(d.settings[k]===undefined||d.settings[k]===null) d.settings[k]=s.settings[k];
  if(!d.employees||typeof d.employees!=='object'||Array.isArray(d.employees)) d.employees=JSON.parse(JSON.stringify(s.employees));
  else ['marketing','event','kasir'].forEach(k=>{ if(!Array.isArray(d.employees[k])) d.employees[k]=s.employees[k]; });
  if(!Array.isArray(d.daily)) d.daily=[];
  if(!d.reports||typeof d.reports!=='object'||Array.isArray(d.reports)) d.reports={};
  /* Stock rokok harian. Dibaca & ditulis HANYA oleh modul Cashier, tapi ikut
     di blob yang sama dengan Kompas — dan itu aman: normalizeDB() di kedua
     modul tidak pernah membuang kunci yang tidak dikenalnya, dan backend
     menyimpan blob apa adanya. Kalau suatu saat ada yang menambah normalisasi
     bergaya "hapus kunci asing", data ini yang pertama hilang. */
  if(!d.rokok||typeof d.rokok!=='object'||Array.isArray(d.rokok)) d.rokok={};
  /* Daftar item stock rokok yang disetel sendiri (21 Agustus 2026). SENGAJA
     TIDAK diisi bawaan di sini: yang belum pernah menyetelnya harus tetap
     kosong, supaya rokokItems() jatuh ke ROKOK_BAWAAN dan ikut tiap penambahan
     bawaan berikutnya. Mengisinya di sini membekukan daftar hari ini untuk
     SELURUH pemasangan, termasuk yang tidak pernah membuka halaman
     pengaturannya.

     Yang dibersihkan cuma bentuknya — baris tanpa kunci atau tanpa nama
     dibuang, karena satu baris rusak membuat tabel stok punya kolom isian yang
     tidak pernah bisa disimpan ke mana pun. Kalau sesudah dibersihkan jadi
     kosong, kuncinya dihapus supaya kembali ke bawaan alih-alih menghasilkan
     halaman stok tanpa satu pun baris. */
  if(d.rokok_items!==undefined){
    if(!Array.isArray(d.rokok_items)) delete d.rokok_items;
    else {
      d.rokok_items=d.rokok_items
        .filter(it=>it&&typeof it==='object'&&String(it.k||'').trim()&&String(it.n||'').trim())
        .map(it=>({k:String(it.k).trim(), n:String(it.n).trim(), lain:!!it.lain}));
      if(!d.rokok_items.length) delete d.rokok_items;
    }
  }
  if(!Array.isArray(d.compliments)) d.compliments=[];
  /* Bon/piutang. Sama seperti rokok: ikut di blob yang sama dengan Kompas, dan
     aman karena tidak ada modul yang membuang kunci asing saat menyimpan.
     Bidang yang hilang diisi di sini supaya baris lama (kalau bentuknya pernah
     berubah) tidak pernah membuat halaman blank karena `undefined.length`. */
  if(!Array.isArray(d.piutang)) d.piutang=[];
  d.piutang.forEach(b=>{
    if(b.status!=='lunas') b.status='open';
    if(b.tipe===undefined) b.tipe='tamu';
    if(b.payKey===undefined) b.payKey='cash';
    if(b.bill===undefined) b.bill='';
    b.nominal=num(b.nominal);
    /* Bon berstatus lunas TANPA tanggal pelunasan tidak boleh ada: Report Daily
       menjumlahkan pelunasan berdasarkan lunasDate, jadi baris seperti itu akan
       hilang dari semua hari dan uangnya seolah tidak pernah masuk. Jatuhkan ke
       tanggal billnya — hari terdekat yang pasti benar-benar ada. */
    if(b.status==='lunas'){
      if(!b.lunasDate) b.lunasDate=b.date;
      if(!b.lunasPayKey) b.lunasPayKey=b.payKey;
    }
  });
  /* `d.penyesuaian` pernah ada di sini (input penyesuaian dana manual) dan
     DIBUANG 3 Agustus 2026 atas permintaan user: begitu penilaiannya pindah
     ke total, kasus yang dulu perlu dicatat manual — refund yang memindahkan
     uang dari QRIS ke Cash — sudah tertutup sendiri karena totalnya nol.
     Barisnya sengaja tidak dihapus dari blob: tidak ada yang membacanya, dan
     menghapus data lama demi kerapian tidak pernah sepadan. */
  /* Daftar owner. Kalau kuncinya hilang, dikembalikan ke bawaan; kalau
     ARRAY-nya kosong dibiarkan kosong — user memang boleh menghapus semuanya,
     dan mengembalikan nama yang baru saja dibuang itu perilaku yang menyebalkan. */
  if(!Array.isArray(d.owners)) d.owners=s.owners.slice();
  d.owners=d.owners.map(x=>String(x||'').trim()).filter(Boolean);
  /* Migrasi: "Total Tax & Service" dulu SATU angka (tax_service). Sekarang
     dipecah jadi service_charge + tax. Nilai lama seluruhnya dianggap tax —
     menebak pembagiannya justru mengarang angka yang tidak pernah diinput. */
  d.daily.forEach(x=>{
    if(x.service_charge===undefined && x.tax===undefined && x.tax_service!==undefined){
      x.tax=num(x.tax_service); x.service_charge=0;
    }
    if(x.service_charge===undefined) x.service_charge=0;
    if(x.tax===undefined) x.tax=0;
    /* Dua bidang di bawah HARUS diisi persis seperti di Kompas. Bukan sekadar
       kerapian: kalau cuma satu modul yang menambahkannya, dua modul akan
       bergantian menulis bentuk yang berbeda ke blob yang sama, dan modul yang
       tidak mengenalnya akan menghapusnya diam-diam saat menyimpan. */
    if(x.bd&&Array.isArray(x.bd.kasir)) x.bd.kasir.forEach(r=>{ if(r.disc===undefined) r.disc=0; });
    if(x.bd&&(!x.bd.self||typeof x.bd.self!=='object'||Array.isArray(x.bd.self))) x.bd.self={amount:0,disc:0};
  });
  return d;
}

/* Bersih-bersih PIC contoh "Kasir 1/2/3" bawaan seed versi lama. Daftar kasir
   sekarang datang dari akun Office yang divisinya di-define, jadi placeholder
   ini tidak dipakai lagi. Baris breakdown miliknya ikut dibuang HANYA kalau
   nominalnya nol — kalau ternyata pernah dipakai, PIC-nya dibiarkan supaya
   omset yang sudah dialokasikan tidak hilang diam-diam. Idempoten: sekali
   bersih, panggilan berikutnya tidak melakukan apa-apa. */
function purgeSeedKasir(d){
  const contoh=e=>/^k[123]$/.test(String(e.id||'')) && /^kasir\s*\d+$/i.test(String(e.name||'').trim()) && !e.officeUserId;
  const kandidat=(d.employees.kasir||[]).filter(contoh);
  if(!kandidat.length) return false;
  const terpakai=new Set();
  (d.daily||[]).forEach(day=>(day.bd&&Array.isArray(day.bd.kasir)?day.bd.kasir:[]).forEach(r=>{ if(num(r.amount)>0) terpakai.add(r.kasirId); }));
  const buang=new Set(kandidat.filter(e=>!terpakai.has(e.id)).map(e=>e.id));
  if(!buang.size) return false;
  d.employees.kasir=d.employees.kasir.filter(e=>!buang.has(e.id));
  (d.daily||[]).forEach(day=>{ if(day.bd&&Array.isArray(day.bd.kasir)) day.bd.kasir=day.bd.kasir.filter(r=>!buang.has(r.kasirId)); });
  return true;
}

let DB=null;

/* ---- lapisan API ---- */
let SAVE_TIMER=null, SAVING=false, DIRTY=false, RETRY_TIMER=null, RETRY_KE=0;
function setSync(st,msg){
  const el=document.getElementById('syncBox'); if(!el) return;
  el.className='sync'+(st==='err'?' err':st==='ok'?' ok':st==='saving'?' saving':'');
  el.innerHTML=msg||(st==='ok'?'✓ Tersimpan':st==='saving'?'Menyimpan…':st==='load'?'Memuat…':'');
}
function fetchTimeout(url,opts,ms){
  const c=new AbortController(); const t=setTimeout(()=>c.abort(),ms||25000);
  opts=opts||{}; opts.signal=c.signal;
  return fetch(url,opts).then(r=>{clearTimeout(t);return r;},e=>{clearTimeout(t);throw e;});
}
function apiGet(){
  return fetchTimeout(API_URL+'?action=getAll&t='+Date.now(),{method:'GET',redirect:'follow'})
    .then(r=>r.json()).then(j=>{ if(!j.ok) throw new Error(j.error||'server error'); return j.data; });
}
function apiSave(state){
  return fetchTimeout(API_URL,{method:'POST',redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'saveAll',data:state})},40000)
    .then(r=>r.json()).then(j=>{ if(!j.ok) throw new Error(j.error||'server error'); return j.data; });
}
/* Simpan ditunda sebentar lalu dikirim sekali — mengetik di form tidak boleh
   memicu satu request per ketukan. */
function save(){
  DIRTY=true;
  DB._savedBy=CURRENT_USER?CURRENT_USER.name:'';
  try{ localStorage.setItem(CACHE_KEY,JSON.stringify(DB)); }catch(e){}
  setSync('saving');
  clearTimeout(SAVE_TIMER);
  clearTimeout(RETRY_TIMER);   // suntingan baru sudah menjadwalkan kirim sendiri
  SAVE_TIMER=setTimeout(kirim,1000);
}
/* Percobaan ulang kalau simpan gagal. Sebelumnya retry dijaga `if(DIRTY)`,
   padahal DIRTY baru saja di-set false di awal kirim() — jadi syaratnya tidak
   pernah benar dan "mencoba lagi…" itu bohong: datanya diam di localStorage
   sampai ada suntingan berikutnya. Sekarang dijadwalkan tanpa syarat, dengan
   jeda menanjak supaya server yang sedang bermasalah tidak dihujani. */
const RETRY_JEDA=[5000,10000,20000,40000,60000];
function jadwalkanUlang(){
  clearTimeout(RETRY_TIMER);
  const jeda=RETRY_JEDA[Math.min(RETRY_KE,RETRY_JEDA.length-1)];
  RETRY_KE++;
  RETRY_TIMER=setTimeout(kirim,jeda);
  return jeda;
}
function kirim(){
  if(SAVING){ SAVE_TIMER=setTimeout(kirim,700); return; }
  SAVING=true; DIRTY=false;
  apiSave(DB).then(()=>{
    SAVING=false; RETRY_KE=0; clearTimeout(RETRY_TIMER);
    setSync(DIRTY?'saving':'ok'); if(DIRTY) kirim();
  },err=>{
    SAVING=false;
    /* Sebab aslinya WAJIB ikut tampil. Pesan generik bikin galat konfigurasi
       (mis. MySQL 1044 "Access denied ... to database") tidak bisa dibedakan
       dari jaringan putus, dan itu memakan waktu diagnosa yang tidak perlu. */
    const sebab=(err&&err.message?String(err.message):'penyebab tidak diketahui').slice(0,200);
    const detik=Math.round(jadwalkanUlang()/1000);
    setSync('err',`Gagal simpan — tersimpan lokal, coba lagi ${detik}s.<br><span style="opacity:.85;font-size:11px">${esc(sebab)}</span>`);
  });
}

/* ---- derived helpers ----
   Rokok & Videotron DIHAPUS 27 Juli 2026 atas permintaan. Aman dilakukan

   omset, jadi tidak ada total historis yang berubah diam-diam. Field lamanya
   sengaja tidak di-DROP dari data yang mungkin tersimpan — cuma tidak
   dihitung lagi. */
function grossOf(d){ return num(d.food)+num(d.bev)+num(d.lainnya); }
function netOf(d){ return grossOf(d)-num(d.discount); }
/* Tax & service ADA DI LUAR omset (tidak menambah/mengurangi netOf), tapi
   tetap ditagihkan ke tamu. Jadi yang harus disamai total pembayaran di
   Report Daily adalah netOf + tax + service, bukan netOf saja. */
function taxSvcOf(d){ return num(d.service_charge)+num(d.tax); }
function tagihanOf(d){ return netOf(d)+taxSvcOf(d); }
function avgSpendOf(d){ const b=num(d.bill); return b>0?netOf(d)/b:0; }
function itemsOf(d){ return num(d.qty_food)+num(d.qty_bev)+num(d.qty_others); }

/* ---- DISKON BILL PER KASIR (3 Agustus 2026) ----
   Disalin apa adanya dari Kompas — bentuk datanya WAJIB sama, blob-nya satu.
     amount = omset BRUTO kasir itu (sebelum diskon)
     disc   = diskon bill yang DIA berikan ke tamu
     diakui = amount − disc     ← inilah yang masuk pengakuan omset
   Data lama punya disc=0 dan amount yang sudah neto, jadi angkanya tidak
   berubah sama sekali. Lihat catatan lengkapnya di deploy/kompas/index.html. */
function omsetKasir(r){ return num(r&&r.amount)-num(r&&r.disc); }
function diskonKasir(r){ return r&&r.off?0:num(r&&r.disc); }

/* ============ 1. REPORT DAILY ============
   Kasir mencatat setoran per metode pembayaran dalam dua kolom: POS (angka
   yang keluar dari mesin) dan Actual (uang/mutasi yang benar-benar ada).
   Selisih per metode langsung kelihatan supaya ketahuan metode MANA yang
   bermasalah — total saja tidak cukup, karena kelebihan di satu metode bisa
   menutupi kekurangan di metode lain dan seolah-olah balance.

   Halaman ini SENGAJA tidak menyebut omset harian sama sekali. Dulu ada kartu
   "Tagihan Menurut Omset" + "Selisih terhadap Omset" di sini, dan hasilnya
   membingungkan: selama admin belum menginput omset, tagihannya Rp0 sehingga
   selisihnya sama dengan seluruh setoran (mis. +Rp9.430.148 merah) — seolah
   kasir salah besar padahal pekerjaannya sudah benar. Pencocokan ke omset
   sepenuhnya jadi urusan Input Omset Harian, yang memang diisi belakangan.
   Yang tersisa di sini hanya selisih POS vs Actual: itu murni internal kasir. */
let repDate=todayISO();
function repOf(date){ return (DB.reports||{})[date]||null; }
function repPay(rec,k){ const p=(rec&&rec.pay&&rec.pay[k])||{}; return {pos:num(p.pos),actual:num(p.actual)}; }
function viewReport(){
  CAL_ST.rp.open=false;
  const el=document.getElementById('app-view');
  const rec=repOf(repDate);
  /* Bon & pelunasan tanggal ini — lihat catatan panjang di bagian Piutang.
     Dua angka inilah yang menjelaskan kenapa Actual boleh berbeda dari POS
     tanpa ada uang yang benar-benar hilang. Kolom dan kartunya HANYA muncul
     kalau hari itu memang ada bon/pelunasan; hari biasa tetap sepolos dulu,
     supaya halaman ini tidak jadi rumit untuk mayoritas hari yang tidak ada
     hutang sama sekali. */
  const bh=penjelasHari(repDate);
  /* Kolom "Bon Baru (−)" dan "Pelunasan (+)" DIHAPUS 3 Agustus 2026 atas
     permintaan user: tujuh kolom terlalu lebar untuk layar kasir, dan dua
     kolom itu isinya hampir selalu "—" sehingga membuat tabel ramai tanpa
     memberi tahu apa pun. Angkanya tidak hilang — pindah ke catatan di bawah
     tabel, yang justru menyebut metode pembayarannya dengan nama. */
  const thBon = bh.ada ? '<th class="num">Sisa Selisih</th>' : '';
  el.innerHTML=`
    <div class="card" style="display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap">
      <div><h3>Setoran per Metode Pembayaran</h3><div class="card-sub">Isi POS dan Actual tiap metode. Boleh disubmit kapan saja.</div></div>
      <div class="field" style="margin:0"><label>Tanggal</label><div class="calwrap" id="rp_cal">${calInner('rp')}</div></div>
    </div>
    ${jejakHtml(rec)}
    <div class="card">
      <div class="tbl-wrap"><table>
        <thead><tr><th>Metode Pembayaran</th><th class="num">POS</th><th class="num">Actual</th><th class="num">Selisih</th>${thBon}</tr></thead>
        <tbody>${PAYS.map(p=>{
          const v0=repPay(rec,p.k);
          return `<tr>
          <td><b>${esc(p.n)}</b></td>
          <td class="num"><input class="mono rp rf" data-k="${p.k}" data-f="pos" inputmode="numeric" style="text-align:right;width:150px;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px" value="${v0.pos}"></td>
          <td class="num"><input class="mono rp rf" data-k="${p.k}" data-f="actual" inputmode="numeric" style="text-align:right;width:150px;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px" value="${v0.actual}"></td>
          <td class="num mono" id="rs_${p.k}">Rp0</td>
          ${bh.ada?`<td class="num mono" id="rz_${p.k}">Rp0</td>`:''}
        </tr>`;}).join('')}</tbody>
        <tfoot><tr style="font-weight:800;border-top:2px solid var(--line)">
          <td>TOTAL</td><td class="num mono" id="rt_pos">Rp0</td><td class="num mono" id="rt_act">Rp0</td><td class="num mono" id="rt_sel">Rp0</td>
          ${bh.ada?`<td class="num mono" id="rt_sisa">Rp0</td>`:''}
        </tr></tfoot>
      </table></div>
      <div id="rp_notepay"></div>
    </div>
    ${bh.ada?kartuPenjelasan(bh):''}
    <div class="grid ${bh.ada?'g4':'g3'}">
      <div class="stat accent"><div class="lab">Total POS</div><div class="val sm mono" id="rc_pos">Rp0</div><div class="foot">angka dari mesin kasir</div></div>
      <div class="stat"><div class="lab">Total Actual</div><div class="val sm mono" id="rc_act">Rp0</div><div class="foot">uang & mutasi yang benar-benar ada</div></div>
      ${bh.ada
        ? `<div class="stat"><div class="lab">Selisih POS vs Actual</div><div class="val sm mono" id="rc_sel">Rp0</div><div class="foot">seharusnya <b class="js-harus">Rp0</b></div></div>
           <div class="stat" id="rc_box"><div class="lab">Sisa Selisih</div><div class="val sm mono" id="rc_sisa">Rp0</div><div class="foot" id="rc_foot"></div></div>`

        : `<div class="stat" id="rc_box"><div class="lab">Selisih POS vs Actual</div><div class="val sm mono" id="rc_sel">Rp0</div><div class="foot" id="rc_foot"></div></div>`}
    </div>
    <div id="rp_err"></div>
    <div style="display:flex;gap:10px;align-items:center;margin-top:6px;flex-wrap:wrap">
      <button class="btn btn-primary" id="rp_save">${rec&&rec.submitted?'Update Report':'Submit Report'}</button>
      <div class="helper" style="margin:0">Submit atas nama <b>${esc(CURRENT_USER?CURRENT_USER.name:'—')}</b> — nama dan jamnya ikut tercatat di laporan ini.</div>
    </div>`;

  const hitung=()=>{
    let tp=0,ta=0,th=0;
    /* Metode yang angkanya tidak cocok, dikumpulkan untuk catatan di bawah
       tabel. Inilah pengganti dua kolom yang dibuang: kasir tidak perlu
       memindai 13 baris mencari yang merah — nama metodenya disebut. */
    const bermasalah=[];
    PAYS.forEach(p=>{
      const pos=num(inputVal(p.k,'pos')), act=num(inputVal(p.k,'actual'));
      tp+=pos; ta+=act;
      const s=act-pos;
      const c=document.getElementById('rs_'+p.k);
      c.textContent=fmtSel(s);
      c.style.color = s===0?'var(--muted)' : (s>0?'var(--ok)':'var(--danger)');
      c.style.fontWeight = s===0?'500':'800';
      /* BARIS YANG BELUM DIISI TIDAK DINILAI.

         POS 0 dan Actual 0 berarti kasir belum sampai ke baris itu, bukan
         berarti tidak ada uangnya. Bonnya sendiri SUDAH termasuk di angka POS
         yang nanti diketik, jadi selama POS-nya masih kosong, membandingkannya
         dengan bon cuma menghasilkan tuduhan palsu — persis yang terjadi pada
         4 Agustus 2026: "EDC BCA — POS Rp0, Actual Rp0, selisih Rp0 (bon
         Rp222.222, sisa +Rp222.222)". Kalimat yang menyalahkan dirinya sendiri.

         Bonnya dikeluarkan dari TOTAL juga (th), bukan cuma dari daftar:
         kalau hanya barisnya yang disembunyikan, totalnya tetap memperingatkan
         angka yang tidak bisa ditunjuk asalnya di layar. */
      const kosong = pos===0 && act===0;
      const bb=kosong?0:num(bh.baru[p.k]), bl=kosong?0:num(bh.lunas[p.k]);
      const hk=kosong?0:num(bh.harus[p.k]);
      const z=s-hk;
      th+=hk;
      if(bh.ada){
        const cz=document.getElementById('rz_'+p.k);
        cz.textContent=kosong?'—':fmtSel(z);
        /* Sengaja TIDAK pernah merah. Sisa per metode bukan vonis: selama
           totalnya seimbang, metode yang lebih dan yang kurang cuma dua sisi
           dari uang yang sama berpindah tempat. Yang berhak merah cuma total. */
        cz.style.color = z===0?'var(--muted)':'var(--warn)';
        cz.style.fontWeight = z===0?'500':'800';
      }
      // Yang dilaporkan adalah angka SESUDAH bon (z) — hari tanpa bon z===s,
      // jadi hari biasa tetap melaporkan selisih POS vs Actual apa adanya.
      if(z!==0) bermasalah.push({n:p.n,pos,act,s,bb,bl,z});
    });
    document.getElementById('rt_pos').textContent=fmtRp(tp);
    document.getElementById('rt_act').textContent=fmtRp(ta);
    const tsel=ta-tp;
    const tf=document.getElementById('rt_sel');
    tf.textContent=fmtSel(tsel);
    tf.style.color = tsel===0?'var(--muted)':(tsel>0?'var(--ok)':'var(--danger)');
    /* Satu-satunya angka yang dinilai: sisa selisih TOTAL sesudah bon &
       pelunasan. Selisih per metode tidak ikut menentukan apa pun — lihat
       catatan di catatanMetode(). Submit tetap tidak pernah dikunci: kasir
       mengisi lebih dulu, sering sebelum omset harian ada. */
    const sisa=tsel-th;
    const abs=Math.abs(sisa);
    const aman=abs<=SELISIH_TOLERANSI;   // Rp5.000 TEPAT masih dianggap aman
    if(bh.ada){
      document.getElementById('rt_sisa').textContent=fmtSel(sisa);
      document.getElementById('rt_sisa').style.color = sisa===0?'var(--muted)':(aman?'var(--warn)':'var(--danger)');
      document.getElementById('rc_sisa').textContent=fmtSel(sisa);
      const bx=document.getElementById('bn_sisa'); if(bx) bx.textContent=fmtSel(sisa);
      const bs=document.getElementById('bn_sel');  if(bs) bs.textContent=fmtSel(tsel);
      /* "Seharusnya" ikut hidup di KETIGA tempat yang memajangnya (kartu stat,
         tabel waterfall, kalimat catatan). Nilainya menyusut selama baris-
         barisnya belum diisi (lihat catatan `kosong` di atas), jadi angka
         statis akan bertengkar dengan sisa yang ditulis tepat di bawahnya. */
      el.querySelectorAll('.js-harus').forEach(x=>{ x.textContent=fmtSel(th); });
    }
    catatanMetode(bermasalah,bh,sisa);
    document.getElementById('rc_pos').textContent=fmtRp(tp);
    document.getElementById('rc_act').textContent=fmtRp(ta);
    document.getElementById('rc_sel').textContent=fmtSel(tsel);
    document.getElementById('rc_box').style.background =
      sisa===0?'var(--ok-bg-t)' : aman?'var(--warn-bg-t)':'var(--danger-bg-t)';
    document.getElementById('rc_foot').innerHTML = sisa===0
      ? (bh.ada?'cocok setelah bon & pelunasan diperhitungkan ✓':'POS dan Actual cocok ✓')
      : aman
        ? `masih dalam toleransi ${fmtRp(SELISIH_TOLERANSI)} ✓`
        : `⚠ melebihi toleransi ${fmtRp(SELISIH_TOLERANSI)} — uang ${sisa>0?'lebih':'kurang'}, perlu ditelusuri`;
    return {tp,ta,sel:tsel,sisa,abs,aman};
  };
  function inputVal(k,f){ const e=el.querySelector(`.rf[data-k="${k}"][data-f="${f}"]`); return e?e.value:0; }
  el.querySelectorAll('.rf').forEach(i=>i.addEventListener('input',hitung));
  document.getElementById('rp_save').addEventListener('click',()=>{
    const h=hitung();
    const box=document.getElementById('rp_err');
    const pay={};
    PAYS.forEach(p=>{ pay[p.k]={pos:num(inputVal(p.k,'pos')),actual:num(inputVal(p.k,'actual'))}; });
    DB.reports=DB.reports||{};
    const jejak=tambahJejak(DB.reports[repDate]);
    DB.reports[repDate]={pay,by:CURRENT_USER?CURRENT_USER.name:'',at:Date.now(),submitted:true,log:jejak};
    save();
    box.innerHTML=`<div class="notice ok">✓ Report ${esc(dateLabel(repDate))} tersimpan${h.abs?` dengan ${bh.ada?'sisa selisih':'selisih POS vs Actual'} ${fmtRp(h.abs)}`:''}.</div>`;
    setTimeout(()=>render(),700);
  });
  hitung();
}
function fmtWaktu(ts){ const d=new Date(ts); return isNaN(d)?'':d.toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); }

/* ============ JEJAK SUBMIT (Report Daily & Daily Stock Rokok) ============
   Siapa yang mengisi, dan jam berapa. Ditambahkan 11 Agustus 2026.

   Jejaknya sengaja MENUMPUK, bukan menimpa. Satu tanggal biasa disubmit lebih
   dari sekali oleh orang yang berbeda — kasir shift sore mengisi, lalu ada yang
   mengoreksi satu baris dan menekan Update. Sampai hari ini yang tersimpan cuma
   `by`/`at` penyimpan TERAKHIR, jadi begitu ada yang mengoreksi, nama orang yang
   benar-benar mengisi hilang tanpa bekas — padahal justru itu yang dicari kalau
   angkanya bermasalah.

   Dibatasi 20 entri terakhir: DB ini SATU blob untuk seluruh perusahaan, dan
   riwayat yang tumbuh tanpa batas membebani setiap pemuatan halaman di semua
   modul yang ikut blob ini, bukan cuma halaman ini.

   `by`/`at` di baris tetap ditulis seperti dulu — modul lain (Kompas/Finance
   Omset) dan tampilan lama masih membacanya. */
const JEJAK_MAKS=20;
function tambahJejak(lama){
  const log=Array.isArray(lama&&lama.log)?lama.log.slice():[];
  log.push({by:(CURRENT_USER&&CURRENT_USER.name)||'', at:Date.now()});
  return log.slice(-JEJAK_MAKS);
}
/* Baris yang dibuat SEBELUM jejak ini ada tidak punya `log`. Dibaca mundur dari
   by/at lamanya supaya tanggal-tanggal lama tidak terlihat seperti "tidak ada
   yang pernah mengisi". */
function jejakList(rec){
  if(rec&&Array.isArray(rec.log)&&rec.log.length) return rec.log;
  return (rec&&rec.at)?[{by:rec.by||'',at:rec.at}]:[];
}
function jejakHtml(rec){
  const log=jejakList(rec);
  if(!log.length) return '';
  const akhir=log[log.length-1];
  const sebelum=log.slice(0,-1).reverse();
  /* Dibungkus SATU div: `.notice` display:flex, jadi tanpa pembungkus tiap
     penebalan jadi kolomnya sendiri dan kalimatnya pecah bertumpuk. */
  return `<div class="notice info"><div>
      📝 Disubmit oleh <b>${esc(akhir.by||'—')}</b> · <b>${esc(fmtWaktu(akhir.at))}</b>
      ${sebelum.length?`<div style="font-size:12px;margin-top:6px;opacity:.78">Sebelumnya diisi/diubah oleh ${sebelum.map(x=>`${esc(x.by||'—')} (${esc(fmtWaktu(x.at))})`).join(' · ')}</div>`:''}
    </div></div>`;
}

/* Sebab selisih yang WAJAR pada satu tanggal, per metode. Report Daily cuma
   perlu memanggil ini.

     harus[k] = pelunasan[k] − bon[k]   →  selisih yang seharusnya terjadi
     sisa[k]  = selisih sebenarnya − harus[k]

   Input "Penyesuaian Dana" manual (pending bank / refund tamu) DIBUANG di
   sini pada 3 Agustus 2026. Sebabnya: penilaiannya sekarang di TOTAL, dan
   kasus yang dulu perlu dicatat manual justru yang totalnya nol dengan
   sendirinya — refund memindahkan uang dari QRIS ke Cash, jadi satu metode
   lebih dan satunya kurang dengan nominal yang sama. Mencatatnya manual cuma
   menambah pekerjaan malam untuk menjelaskan sesuatu yang sudah terjelaskan.
   Sisa yang benar-benar tidak seimbang tetap muncul sebagai peringatan. */
function penjelasHari(date){
  const bh=bonRingkasHari(date);
  const harus={};
  PAYS.forEach(p=>{ harus[p.k]=num(bh.lunas[p.k])-num(bh.baru[p.k]); });
  return Object.assign({},bh,{ harus, totHarus: bh.totLunas-bh.totBaru });
}
/* Catatan di bawah tabel, digambar ulang tiap kali angka diketik. Ia
   menjawab satu pertanyaan: perlu ditindaklanjuti atau tidak?

   Yang MENENTUKAN adalah total, bukan per metode. Selisih antar metode dengan
   total nol berarti uang cuma berpindah tempat — tamu bayar QRIS lalu
   uangnya dikembalikan tunai, atau pembayaran masuk ke metode yang keliru
   lalu ditutup dengan metode lain. Tidak ada uang yang hilang, jadi tidak ada
   yang perlu dikerjakan; daftar metodenya tetap dipajang sekadar supaya kasir
   tahu pasangan mana yang saling menutup.

   Baru kalau totalnya sendiri lewat toleransi, catatannya jadi peringatan —
   dan tetap hanya peringatan, submit tidak pernah dikunci. */
function catatanMetode(rows,bh,sisa){
  const box=document.getElementById('rp_notepay');
  if(!box) return;
  const lewat=Math.abs(sisa)>SELISIH_TOLERANSI;
  if(!rows.length){
    box.innerHTML=`<div class="notice ok" style="margin:14px 0 0">✓ <div>Semua metode pembayaran cocok antara POS dan Actual${bh.ada?', setelah bon &amp; pelunasan hari ini diperhitungkan':''}.</div></div>`;
    return;
  }
  const li=rows.map(r=>{
    const jelas=[];
    if(r.bb) jelas.push(`bon ${fmtRp(r.bb)}`);
    if(r.bl) jelas.push(`pelunasan ${fmtRp(r.bl)}`);
    return `<div style="margin-top:3px">· <b>${esc(r.n)}</b> — POS ${fmtRp(r.pos)}, Actual ${fmtRp(r.act)}, selisih <b>${fmtSel(r.s)}</b>`
      + (jelas.length?` (${jelas.join(' + ')} → sisa <b>${fmtSel(r.z)}</b>)`:'')
      + `</div>`;
  }).join('');
  box.innerHTML = lewat
    ? `<div class="notice bad" style="margin:14px 0 0;display:block">
        <b>⚠ Total selisih ${fmtSel(sisa)} — lewat toleransi ${fmtRp(SELISIH_TOLERANSI)}, perlu ditelusuri.</b>${li}</div>`
    : `<div class="notice ok" style="margin:14px 0 0;display:block">
        <b>✓ Selisih antar metode saling menutup — total ${fmtSel(sisa)}, masih dalam toleransi ${fmtRp(SELISIH_TOLERANSI)}.</b>${li}</div>`;
}

/* Selisih yang WAJAR terjadi pada satu hari karena bon & pelunasan. Positif =
   uang seharusnya lebih dari catatan POS, negatif = seharusnya kurang. */
function selisihSeharusnya(bh){ return bh.totHarus!==undefined?bh.totHarus:(bh.totLunas-bh.totBaru); }
/* Catatan berbahasa manusia untuk Report Daily. Angka saja ternyata tidak
   cukup: kasir melihat Actual lebih kecil dari POS lalu tetap mengira dirinya
   salah hitung, karena tidak ada kalimat di layar yang bilang "memang
   seharusnya begitu, ada yang berhutang". Kalimat inilah yang dulu hilang. */
function catatanSelisihHari(bh){
  const harus=selisihSeharusnya(bh);
  const namaUnik=l=>{
    const s=[...new Set(l.map(b=>String(b.nama||'').trim()).filter(Boolean))];
    return s.length>3 ? s.slice(0,3).join(', ')+' dkk' : s.join(', ');
  };
  /* Metode pembayarannya disebut namanya, bukan cuma totalnya: sejak kolom
     per-metode dibuang, kalimat inilah satu-satunya tempat kasir bisa tahu
     BARIS MANA di tabel di atas yang seharusnya tidak cocok. */
  const perMetode=obj=>Object.keys(obj).filter(k=>num(obj[k])>0)
    .map(k=>`<b>${esc(payName(k))}</b> ${fmtRp(num(obj[k]))}`).join(' + ');
  /* Ditulis sependek mungkin (permintaan user 4 Agustus 2026). Versi sebelumnya
     mengulang penjelasan konsepnya tiap hari — kasir sudah tahu apa itu bon
     setelah membacanya sekali, yang dibutuhkan tiap malam cuma angka & nama. */
  const kal=[];
  if(bh.totBaru>0) kal.push(`<b>${bh.listBaru.length} bon belum dibayar ${fmtRp(bh.totBaru)}</b> (${esc(namaUnik(bh.listBaru))}) lewat ${perMetode(bh.baru)}`);
  if(bh.totLunas>0) kal.push(`<b>${bh.listLunas.length} pelunasan bon lama ${fmtRp(bh.totLunas)}</b> (${esc(namaUnik(bh.listLunas))}) lewat ${perMetode(bh.lunas)}`);
  return `<div class="notice ${harus===0?'info':'warn'}">📌 <div>${kal.join(' · ')} → selisih seharusnya <b class="js-harus">Rp0</b>.</div></div>`;
}
/* Kartu penjelas di bawah tabel Report Daily: urutan penguranganya ditulis
   apa adanya (bon → pelunasan → seharusnya → sebenarnya → sisa)
   supaya tidak perlu ada yang menghitung di kepala, plus daftar SIAPA yang
   berhutang dan bon mana yang dilunasi. Tanpa daftar nama, angka bonnya benar
   tapi tidak bisa ditagih. */
function kartuPenjelasan(bh){
  const harus=selisihSeharusnya(bh);
  const grup=bonGrupBelum();
  const totOpen=grup.reduce((s,g)=>s+g.total,0), jmlOrang=grup.length;
  const baris=(l,v,warna)=>`<tr><td>${l}</td><td class="num mono" style="color:${warna||'inherit'}">${v}</td></tr>`;
  const daftar=(judul,rows,kosong)=>`
    <div>
      <div class="mini-lab">${judul}</div>
      ${rows.length?`<div class="tbl-wrap"><table>${rows.join('')}</table></div>`:`<div class="helper" style="margin:6px 0 0">${kosong}</div>`}
    </div>`;
  const rBaru=bh.listBaru.map(b=>`<tr>
    <td><b>${esc(b.nama)}</b> <span class="chip mute">${esc(bonTipeNama(b.tipe))}</span>${b.bill||b.picName?`<div class="muted" style="font-size:11px">${esc(b.bill||'')}${b.bill&&b.picName?' · ':''}${b.picName?'PIC '+esc(b.picName):''}</div>`:''}</td>
    <td class="muted" style="font-size:12px">POS: ${esc(payName(b.payKey))}</td>
    <td class="num mono" style="color:var(--danger)">${fmtSel(-num(b.nominal))}</td></tr>`);
  const rLunas=bh.listLunas.map(b=>`<tr>
    <td><b>${esc(b.nama)}</b>${b.bill?`<div class="muted" style="font-size:11px">${esc(b.bill)}</div>`:''}</td>
    <td class="muted" style="font-size:12px">bill ${esc(b.date)} · ${esc(payName(b.lunasPayKey))}</td>
    <td class="num mono" style="color:var(--ok)">${fmtSel(num(b.nominal))}</td></tr>`);
  return `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap">
        <div><h3>Penjelasan Selisih Hari Ini</h3>
        <div class="card-sub">Bon &amp; pelunasan yang jatuh pada tanggal ini.</div></div>
        <button class="btn btn-ghost btn-sm" onclick="go('piutang')">Buka halaman Piutang →</button>
      </div>
      <div style="margin-top:12px">${catatanSelisihHari(bh)}</div>
      <div class="grid g2" style="align-items:start">
        <div class="tbl-wrap"><table>
          ${baris('Bon baru hari ini (uang belum diterima)',fmtSel(-bh.totBaru),'var(--danger)')}
          ${baris('Pelunasan bon hari lain, diterima hari ini',fmtSel(bh.totLunas),'var(--ok)')}
          <tr style="font-weight:800;border-top:2px solid var(--line)">
            <td>Selisih yang <u>SEHARUSNYA</u> terjadi</td>
            <td class="num mono"><span class="js-harus">Rp0</span></td></tr>
          ${baris('Selisih sebenarnya (Actual − POS)','<span id="bn_sel">Rp0</span>')}
          <tr style="font-weight:800;border-top:2px solid var(--line)">
            <td>= Sisa yang belum terjelaskan</td>
            <td class="num mono"><span id="bn_sisa">Rp0</span></td></tr>
        </table>
        <div class="helper" style="margin-top:8px">Total piutang belum lunas seluruh tanggal: <b>${fmtRp(totOpen)}</b> dari ${jmlOrang} orang.</div></div>
        <div style="display:grid;gap:12px">
          ${daftar('Bon baru hari ini',rBaru,'Tidak ada bon baru pada tanggal ini.')}
          ${daftar('Pelunasan diterima hari ini',rLunas,'Tidak ada pelunasan pada tanggal ini.')}
        </div>
      </div>
    </div>`;
}

/* ============ 1b. PIUTANG / BON ============
   Kenapa halaman ini ada: POS tidak mengenal "belum bayar". Supaya bill bisa
   ditutup, kasir terpaksa memilih SATU metode pembayaran padahal uangnya belum
   masuk — biasanya Cash. Akibatnya Report Daily hari itu selalu terlihat kurang
   sebesar bon tersebut, dan sebelum halaman ini ada tidak ada apa pun di layar
   yang menjelaskan kenapa; selisihnya terbaca seperti uang hilang.

   Yang dicatat karena itu ada tiga: nominalnya, SIAPA yang berhutang, dan
   metode POS sementara yang dipakai menutup billnya. Yang ketiga bukan
   kelengkapan — tanpanya selisih hanya bisa dijelaskan di tingkat total, dan
   metode MANA yang kurang tetap tidak ketahuan.

   Pelunasan SENGAJA dicatat pada tanggal uangnya diterima, bukan dimundurkan
   ke tanggal bill. Uangnya memang masuk hari itu; memundurkannya akan mengubah
   report yang sudah disubmit dan tetap meninggalkan hari pelunasan kelebihan
   uang tanpa sebab. Itu persis keluhan yang melahirkan halaman ini: 3 bon lama
   dilunasi sekaligus, dan report hari itu berlebih. Sekarang kelebihan itu
   muncul sebagai kolom "Pelunasan (+)" dengan nama orangnya. */
let bonDate=todayISO();
let BON_TAB='open';   // 'open' | 'lunas'
/* Hasil pengelompokan render terakhir. Tombol Lunasi merujuk grup lewat indeks
   ("g0", "g1"), bukan lewat nama: nama tamu bisa memuat kutip dan tanda baca
   yang merusak atribut HTML, dan indeks tidak pernah bisa. */
let BON_GRUP=[];
let BON_EDIT=null;   // id bon yang sedang diubah; null = form dalam mode tambah
const BON_TIPE=[{k:'tamu',n:'Tamu'},{k:'owner',n:'Owner'},{k:'staff',n:'Staff'},{k:'lain',n:'Lainnya'}];
const bonTipeNama=k=>{ const t=BON_TIPE.find(x=>x.k===k); return t?t.n:'Lainnya'; };
const payName=k=>{ const p=PAYS.find(x=>x.k===k); return p?p.n:(k||'—'); };
function bonSemua(){ return DB.piutang||[]; }
function bonBelum(){ return bonSemua().filter(b=>b.status!=='lunas'); }
function bonBaruOn(date){ return bonSemua().filter(b=>b.date===date); }
function bonLunasOn(date){ return bonSemua().filter(b=>b.status==='lunas'&&b.lunasDate===date); }
/* Ringkasan satu tanggal, per metode pembayaran — inilah yang dipakai Report
   Daily. Bon yang dibuat DAN dilunasi pada hari yang sama sengaja ikut di
   kedua ember: kalau metodenya sama keduanya saling meniadakan (memang benar,
   uangnya keluar-masuk di hari yang sama), kalau berbeda selisih antar
   metodenya justru yang harus terlihat. */
function bonRingkasHari(date){
  const baru={},lunas={}; let totBaru=0,totLunas=0;
  const listBaru=bonBaruOn(date), listLunas=bonLunasOn(date);
  listBaru.forEach(b=>{ const n=num(b.nominal); baru[b.payKey]=(baru[b.payKey]||0)+n; totBaru+=n; });
  listLunas.forEach(b=>{ const n=num(b.nominal); lunas[b.lunasPayKey]=(lunas[b.lunasPayKey]||0)+n; totLunas+=n; });
  return {baru,lunas,totBaru,totLunas,listBaru,listLunas,ada:listBaru.length>0||listLunas.length>0};
}
/* Bon belum lunas dikelompokkan per orang. Kuncinya nama (huruf kecil, tanpa
   spasi tepi) + tipe, supaya "Pak Budi" dan "pak budi " tidak jadi dua orang —
   nama diketik ulang tiap kali, dan itu satu-satunya pengait yang ada. */
function bonGrupBelum(){
  const map=new Map();
  bonBelum().forEach(b=>{
    const key=String(b.nama||'').trim().toLowerCase()+'|'+b.tipe;
    if(!map.has(key)) map.set(key,{nama:b.nama,tipe:b.tipe,items:[],total:0});
    const g=map.get(key); g.items.push(b); g.total+=num(b.nominal);
  });
  const arr=[...map.values()];
  arr.forEach(g=>g.items.sort((a,b)=>a.date<b.date?-1:1));
  arr.sort((a,b)=>b.total-a.total);
  return arr;
}
function setBonTab(t){ BON_TAB=t; render(); }
/* Ubah bon: form di atas halaman berganti mode, terisi nilai bon ini. Tanggal
   bill dipegang oleh kalender, jadi bonDate ikut dipindahkan ke tanggal bon —
   kalau tidak, menyimpan tanpa menyentuh kalender akan diam-diam memindahkan
   bonnya ke tanggal yang sedang dilihat. */
function editBon(id){
  const b=(DB.piutang||[]).find(x=>x.id===id);
  if(!b) return;
  BON_EDIT=id; bonDate=b.date; PERIOD=monthKeyOf(b.date);
  render();
  try{ window.scrollTo({top:0,behavior:'smooth'}); }catch(_){ window.scrollTo(0,0); }
}

  /* Bidang yang muncul mengikuti Tipe. Disembunyikan lewat style, BUKAN dengan

     diubah akan menghapus nominal & no. bill yang sudah terlanjur diketik. */
  const tampil=(id,ya)=>{ const e=document.getElementById(id); if(e) e.style.display=ya?'':'none'; };

    const t=document.getElementById('bn_tipe').value;

  document.getElementById('bn_add').addEventListener('click',()=>{

        id:'pt'+Date.now().toString(36)+Math.floor(Math.random()*1e4)
      },isi,{
        status:'open', lunasDate:'', lunasPayKey:'', lunasBy:'', lunasAt:0,
        by:CURRENT_USER?CURRENT_USER.name:'', at:Date.now()
      }));
    }
    save(); render();
  });

  if(COMP_ROSTER===null) ambilRoster().then(()=>{ if(CURRENT==='piutang') render(); });

  function hitungGrup(gid){
    let t=0,n=0;
    el.querySelectorAll(`.bnck[data-g="${gid}"]:checked`).forEach(x=>{ t+=num(x.dataset.nom); n++; });
    const s=document.getElementById('bnsum_'+gid); if(s) s.textContent=fmtRp(t);
    const btn=el.querySelector(`.bn-lunas[data-g="${gid}"]`); if(btn) btn.disabled=!n;
  }
  el.querySelectorAll('.bnall').forEach(c=>c.addEventListener('change',e=>{
    const gid=e.target.dataset.g;
    el.querySelectorAll(`.bnck[data-g="${gid}"]`).forEach(x=>{ x.checked=e.target.checked; });

/* Lunasi bon yang dicentang dalam satu grup sekaligus — kasus "3 bill satu
   orang, dibayar barengan" memang bentuk normalnya, bukan pengecualian. */
function lunasiGrup(gid){
  const el=document.getElementById('app-view');
  const g=BON_GRUP[parseInt(String(gid).slice(1),10)];
  if(!g) return;
  const dicentang=[...el.querySelectorAll(`.bnck[data-g="${gid}"]:checked`)];
  const box=document.getElementById('bnerr_'+gid);
  if(!dicentang.length){ if(box) box.innerHTML='<div class="notice bad">⚠ Belum ada bon yang dicentang.</div>'; return; }
  const tglEl=el.querySelector(`.bn-tgl[data-g="${gid}"]`);
  const tgl=(tglEl&&tglEl.value)||todayISO();
  const payEl=el.querySelector(`.bn-pay[data-g="${gid}"]`);
  const pay=(payEl&&payEl.value)||'cash';
  const tot=dicentang.reduce((s,x)=>s+num(x.dataset.nom),0);
  const ids=new Set(dicentang.map(x=>x.dataset.id));
  if(!confirm(`Lunasi ${ids.size} bon atas nama ${g.nama} senilai ${fmtRp(tot)}?\n\nUang dicatat masuk pada ${dateLabel(tgl)} lewat ${payName(pay)}. Report Daily tanggal itu akan menampilkannya sebagai pelunasan.`)) return;
  (DB.piutang||[]).forEach(b=>{
    if(!ids.has(b.id)) return;
    b.status='lunas'; b.lunasDate=tgl; b.lunasPayKey=pay;
    b.lunasBy=CURRENT_USER?CURRENT_USER.name:''; b.lunasAt=Date.now();
  });
  save(); render();
}
/* Salah tanggal / salah metode pelunasan diperbaiki dengan mengembalikannya ke
   belum lunas lalu melunasi ulang — bukan dengan menyunting diam-diam, supaya
   report hari yang salah ikut kembali benar. */
function batalLunas(id){
  if(!confirm('Kembalikan bon ini ke status BELUM LUNAS?\n\nPelunasannya akan hilang dari Report Daily tanggal tersebut.')) return;
  (DB.piutang||[]).forEach(b=>{
    if(b.id!==id) return;
    b.status='open'; b.lunasDate=''; b.lunasPayKey=''; b.lunasBy=''; b.lunasAt=0;

  save(); render();
}
function hapusBon(id){
  if(!confirm('Hapus catatan bon ini?\n\nSelisih Report Daily tanggal billnya akan kembali tidak terjelaskan.')) return;

/* Nama owner dibuang dari DAFTAR PILIHAN saja. Bon yang terlanjur memakai nama
   itu sengaja dibiarkan utuh — hutangnya tetap ada walaupun namanya tidak
   dipakai lagi untuk input baru. Dirujuk lewat indeks, bukan nama, supaya
   tanda kutip pada nama tidak pernah bisa merusak atribut onclick. */
function hapusOwner(i){
  const nama=(DB.owners||[])[i];
  if(!nama) return;
  if(!confirm('Hapus "'+nama+'" dari daftar owner?\n\nBon yang sudah terlanjur atas nama itu TIDAK ikut terhapus.')) return;
