/* Token tema Office — nilai yang SAMA dengan panel Stock lain (usage, ordering).

body{margin:0;font-family:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--paper);color:var(--text);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:'Plus Jakarta Sans',system-ui,sans-serif;letter-spacing:-.02em;line-height:1.18;color:var(--ink);margin:0}
button,input,select,textarea{font:inherit}
.muted{color:var(--muted)} .muted2{color:var(--muted-2)}

/* ---------- kerangka ---------- */

.top .mark{width:36px;height:36px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;font-size:18px;background:linear-gradient(135deg,var(--gold-2),var(--gold-dim))}

/* ---------- komponen ---------- */

<header class="top">
  <div class="top-in">

  </div>
  <nav class="tabs" id="tabs">

    <button data-tab="rekap">📊 Rekap Bulanan</button>
  </nav>
</header>
<main id="app"><div class="empty"><div class="ic">⏳</div>Memuat data…</div></main>
<div id="modal-root"></div>
<div id="lb-root"></div>
<div id="toast"></div>

<script>
/* ==========================================================================
 * BREAK & LOSS — barang inventaris yang pecah atau hilang (9 Oktober 2026).
 * Konsepnya sama dengan Waste Produk di panel Pemakaian, ditambah:
 *   - MASTER BARANG berfoto yang didaftarkan sekali (Stok Barang);
 *   - STOK TERKINI per barang, dihitung server dari seluruh catatannya.
 *
 * Backend: ../../stock-api-mysql/breakloss.php (lihat lib_stock_breakloss.php).
 * Tidak ada tombol hapus di halaman ini, dan itu disengaja: catatan barang
 * pecah adalah catatan pertanggungjawaban. Salah input DIBATALKAN (alasan
 * wajib), barang yang tidak dipakai lagi DINONAKTIFKAN.
 * ========================================================================== */

const API = '../../stock-api-mysql/breakloss.php';
const JENIS = {
  break:  { label: 'Break',  ket: 'Pecah / rusak', cls: 'b-break' },
  loss:   { label: 'Loss',   ket: 'Hilang',        cls: 'b-loss' },
  masuk:  { label: 'Masuk',  ket: 'Barang datang', cls: 'b-masuk' },
  opname: { label: 'Opname', ket: 'Koreksi hitungan fisik', cls: 'b-opname' }
};
const TIM = ['Kitchen', 'Bar', 'Floor', 'Cashier', 'Steward', 'Lainnya'];
const SEBAB_SARAN = {
  break: ['Jatuh saat service', 'Pecah saat dicuci', 'Retak / gompal', 'Jatuh dari rak', 'Rusak dipakai tamu'],
  loss:  ['Tidak kembali dari meja', 'Terbawa tamu', 'Tidak ditemukan saat opname', 'Tertinggal di event luar', 'Terbuang bersama sampah']
};

/* ------------------------------------------------------------------ sesi */
function sesi() {
  try { return JSON.parse(localStorage.getItem('lm_session') || 'null') || {}; } catch (e) { return {}; }
}
function namaSaya() { return String(sesi().name || '').trim(); }

/* ------------------------------------------------------------------ API */
async function apiGet(params) {
  const q = new URLSearchParams(Object.assign({ t: Date.now(), sesi: sesi().token || '' }, params || {}));
  const r = await fetch(API + '?' + q);
  const teks = await r.text();
  let d; try { d = JSON.parse(teks); } catch (e) { throw new Error('Balasan server bukan JSON (HTTP ' + r.status + ')'); }
  if (!r.ok && !(d && d.message)) throw new Error('HTTP ' + r.status);
  return d;
}
async function apiPost(body) {
  const r = await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // simple request, tanpa preflight
    body: JSON.stringify(Object.assign({ sesi: sesi().token || '', oleh: namaSaya() }, body))
  });
  const teks = await r.text();
  let d; try { d = JSON.parse(teks); } catch (e) { throw new Error('Balasan server bukan JSON (HTTP ' + r.status + ')'); }
  return d;
}

/* ------------------------------------------------------------------ util */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function angka(n) {
  const v = Math.round((+n || 0) * 100) / 100;
  return v.toLocaleString('id-ID', { maximumFractionDigits: 2 });
}
function rp(n) { return 'Rp' + Math.round(+n || 0).toLocaleString('id-ID'); }
function hariIni() {
  const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 10);
}
const BLN = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
function fmtTgl(t) {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(t || ''); if (!m) return t || '-';
  return (+m[3]) + ' ' + BLN[+m[2] - 1] + ' ' + m[1];
}
function namaBulan(ym) { const [y, m] = ym.split('-'); return ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'][+m - 1] + ' ' + y; }
/* Hari terakhir bulan lewat tanggal 0 bulan berikutnya — benar juga untuk
   Februari & tahun kabisat. Rumus yang sama dengan rentangBulan() di usage. */
function rentangBulan(ym) {
  const [y, m] = ym.split('-').map(Number);
  const akhir = new Date(y, m, 0).getDate();
  return { dari: ym + '-01', ke: ym + '-' + String(akhir).padStart(2, '0') };
}
function toast(judul, pesan, jenis) {
  const w = document.getElementById('toast'); if (!w) return;
  const el = document.createElement('div');
  el.className = 'toast' + (jenis === 'err' ? ' err' : jenis === 'warn' ? ' warn' : '');
  el.innerHTML = '<b>' + esc(judul) + '</b>' + (pesan ? '<span>' + esc(pesan) + '</span>' : '');
  w.appendChild(el);
  setTimeout(() => el.remove(), jenis === 'err' ? 7000 : 3500);
}

/* Foto dikecilkan SEBELUM dikirim, jadi DUA ukuran:
     foto  1280px — bukti yang dibuka saat diklik;
     thumb  320px — yang ikut di daftar barang.
   Daftar tanpa thumbnail berarti seratus foto penuh tiap halaman dibuka. */
function kecilkan(img, maks, mutu) {
  let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
  if (w > maks || h > maks) { const r = Math.min(maks / w, maks / h); w = Math.round(w * r); h = Math.round(h * r); }
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  // JPEG tidak punya transparansi: tanpa latar putih, PNG bening jadi HITAM.
  g.fillStyle = '#fff'; g.fillRect(0, 0, w, h);
  g.drawImage(img, 0, 0, w, h);
  return c.toDataURL('image/jpeg', mutu);
}
function bacaFoto(file) {
  return new Promise((ok, gagal) => {
    if (!file) return ok(null);
    if (!/^image\//.test(file.type || '')) return gagal(new Error('Pilih berkas gambar (jpg/png).'));
    if (file.size > 15 * 1024 * 1024) return gagal(new Error('Foto maksimal 15MB.'));
    const fr = new FileReader();
    fr.onload = e => {
      const img = new Image();
      img.onload = () => {
        try { ok({ foto: kecilkan(img, 1280, 0.72), thumb: kecilkan(img, 320, 0.7), nama: file.name }); }
        catch (er) { gagal(er); }
      };
      img.onerror = () => gagal(new Error('Gambar tidak terbaca.'));
      img.src = e.target.result;
    };
    fr.onerror = () => gagal(new Error('Berkas tidak terbaca.'));
    fr.readAsDataURL(file);
  });
}

/* ------------------------------------------------------------------ state */
const ST = {
  tab: 'stok',
  bulan: hariIni().slice(0, 7),
  items: [], mutasi: [], dimuat: false, galat: '',
  // Stok Barang
  cari: '', kat: '', tampil: 'aktif',
  // Riwayat
  rJenis: 'blk', rItem: '', rCari: '',
  // Form catat — hidup DI LUAR DOM: render di halaman ini total, jadi isian
  // yang cuma ada di kotaknya ikut hilang tiap halaman digambar ulang.
  form: null,
  foto: {}          // cache foto penuh: 'item:ID' / 'mutasi:ID' -> data URI
};
function formBaru(itemId, jenis) {
  return { itemId: itemId || '', jenis: jenis || 'break', qty: '', tanggal: hariIni(), sebab: '',
           pic: namaSaya(), tim: '', catatan: '', foto: null, salah: [] };
}
ST.form = formBaru();
function item(id) { return ST.items.find(i => i.id === id) || null; }

async function muat(diam) {
  try {
    const d = await apiGet(rentangBulan(ST.bulan));
    if (!d || d.status !== 'success') throw new Error((d && d.message) || 'balasan tidak dikenal');
    ST.items = d.items || []; ST.mutasi = d.mutasi || []; ST.galat = ''; ST.dimuat = true;
  } catch (e) {
    ST.galat = e.message || String(e);
    if (!diam) toast('Gagal memuat', ST.galat, 'err');
  }
  render();
}

/* ------------------------------------------------------------------ render */
function render() {
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === ST.tab));
  const el = document.getElementById('app');
  if (!ST.dimuat && ST.galat) {
    el.innerHTML = `<div class="notice err"><b>Data Break &amp; Loss tidak terbaca.</b> ${esc(ST.galat)}
      <div style="margin-top:8px"><button class="btn sm" onclick="muat()">Coba lagi</button></div></div>`;
    return;
  }
  if (!ST.dimuat) { el.innerHTML = '<div class="empty"><div class="ic">⏳</div>Memuat data…</div>'; return; }
  const peta = { stok: vStok, catat: vCatat, riwayat: vRiwayat, rekap: vRekap };
  el.innerHTML = (ST.galat ? `<div class="notice warn">Penyegaran terakhir gagal (${esc(ST.galat)}) — yang tampil data sebelumnya.</div>` : '')
               + (peta[ST.tab] || vStok)();
}
function go(tab) { ST.tab = tab; render(); window.scrollTo(0, 0); }

/* Ringkasan break & loss SATU bulan, dari baris yang tidak dibatalkan. */
function ringkasBulan() {
  const r = { break: { q: 0, n: 0, nilai: 0 }, loss: { q: 0, n: 0, nilai: 0 }, perItem: {} };
  ST.mutasi.forEach(m => {
    if (m.batalAt || (m.jenis !== 'break' && m.jenis !== 'loss')) return;
    const q = Math.abs(m.qty), s = r[m.jenis];
    s.q += q; s.n++; s.nilai += q * (m.harga || 0);
    const p = r.perItem[m.itemId] || (r.perItem[m.itemId] = { break: 0, loss: 0, nilai: 0 });
    p[m.jenis] += q; p.nilai += q * (m.harga || 0);
  });
  return r;
}
function stokMenipis(i) { return i.aktif && i.stokMin > 0 && i.stok <= i.stokMin; }

function thumbHtml(i, cls) {
  if (i && i.thumb) return `<img class="${cls || 'thumb-s'}" src="${esc(i.thumb)}" alt="">`;
  return `<span class="${cls || 'thumb-s'}">🍽️</span>`;
}

function pilihBulanHtml(onch) {
  return `<input type="month" value="${esc(ST.bulan)}" onchange="${onch}(this.value)" title="Bulan">`;
}
function gantiBulan(v) { if (!/^\d{4}-\d{2}$/.test(v)) return; ST.bulan = v; muat(); }

/* ======================= TAB: STOK BARANG ======================= */
function vStok() {
  const R = ringkasBulan();
  const aktif = ST.items.filter(i => i.aktif);
  const menipis = aktif.filter(stokMenipis);
  const kats = [...new Set(ST.items.map(i => i.kategori).filter(Boolean))].sort();
  const q = ST.cari.trim().toLowerCase();
  const daftar = ST.items.filter(i =>
       (ST.tampil === 'semua' || (ST.tampil === 'aktif' ? i.aktif : !i.aktif))
    && (!ST.kat || i.kategori === ST.kat)
    && (!q || (i.nama + ' ' + i.kategori + ' ' + i.lokasi).toLowerCase().includes(q)));
  const nNon = ST.items.length - aktif.length;

  let h = `<div class="recaps">
    <div class="recap"><div class="lab">Barang terdaftar</div><div class="val">${aktif.length}</div>
      <div class="foot">${nNon ? nNon + ' nonaktif tidak dihitung' : 'semuanya aktif'}</div></div>
    <div class="recap red"><div class="lab">Break · ${esc(namaBulan(ST.bulan))}</div><div class="val">${angka(R.break.q)}</div>
      <div class="foot">${R.break.n} catatan · ${rp(R.break.nilai)}</div></div>
    <div class="recap pur"><div class="lab">Loss · ${esc(namaBulan(ST.bulan))}</div><div class="val">${angka(R.loss.q)}</div>
      <div class="foot">${R.loss.n} catatan · ${rp(R.loss.nilai)}</div></div>
    <div class="recap warn"><div class="lab">Stok menipis</div><div class="val">${menipis.length}</div>
      <div class="foot">di bawah / sama dengan stok minimum</div></div>
  </div>`;

  h += `<div class="panel"><div class="panel-head"><div><h3>Stok Barang Terkini</h3>
      <div class="sub">Stok dihitung dari seluruh catatan: masuk − break − loss ± opname. Angka break &amp; loss di kartu: ${esc(namaBulan(ST.bulan))}.</div></div>
      <button class="btn pri" onclick="bukaItem()">＋ Daftarkan Barang</button></div>
    <div class="panel-body">
    <div class="bar">
      <input class="grow" type="text" id="cari-stok" placeholder="Cari nama, kategori, lokasi…" value="${esc(ST.cari)}" oninput="ketikCari(this.value)">
      <select onchange="ST.kat=this.value;render()"><option value="">Semua kategori</option>
        ${kats.map(k => `<option ${k === ST.kat ? 'selected' : ''}>${esc(k)}</option>`).join('')}</select>
      <div class="seg">${[['aktif','Aktif'],['non','Nonaktif'],['semua','Semua']].map(([k, l]) =>
        `<button class="${ST.tampil === k ? 'on' : ''}" onclick="ST.tampil='${k}';render()">${l}</button>`).join('')}</div>
      ${pilihBulanHtml('gantiBulan')}
    </div>
    <div id="kartu-stok">${kartuStok(daftar, R)}</div>
    </div></div>`;
  return h;
}
function kartuStok(daftar, R) {
  if (!ST.items.length) return `<div class="empty"><div class="ic">📦</div><b>Belum ada barang terdaftar.</b><br>
      Daftarkan dulu barang inventarisnya (piring, gelas, alat bar…) berikut fotonya, baru break &amp; loss bisa dicatat.
      <div style="margin-top:12px"><button class="btn pri" onclick="bukaItem()">＋ Daftarkan Barang</button></div></div>`;
  if (!daftar.length) return `<div class="empty"><div class="ic">🔎</div>Tidak ada barang yang cocok dengan saringan ini
      (${ST.tampil === 'aktif' ? 'yang aktif saja' : ST.tampil === 'non' ? 'yang nonaktif saja' : 'semua'}${ST.kat ? ', kategori ' + esc(ST.kat) : ''}${ST.cari ? ', kata "' + esc(ST.cari) + '"' : ''}).</div>`;
  return `<div class="cards">${daftar.map(i => {
    const p = R.perItem[i.id] || { break: 0, loss: 0 };
    const min = stokMenipis(i);
    return `<div class="card ${i.aktif ? '' : 'off'}">
      <div class="ph">${i.thumb ? `<img src="${esc(i.thumb)}" alt="" onclick="lihatFoto('item','${esc(i.id)}')" title="Lihat foto">` : '🍽️'}
        <span class="tag">${!i.aktif ? '<span class="badge b-off">Nonaktif</span>' : min ? '<span class="badge b-warn">⚠ Stok menipis</span>' : ''}</span></div>
      <div class="bd">
        <div class="nm">${esc(i.nama)}</div>
        <div class="meta">${esc(i.kategori || 'Tanpa kategori')}${i.lokasi ? ' · ' + esc(i.lokasi) : ''}${i.harga ? ' · ' + rp(i.harga) + '/' + esc(i.satuan) : ''}</div>
        <div class="stok"><b class="${min || i.stok < 0 ? 'min' : ''}">${angka(i.stok)}</b><span class="muted">${esc(i.satuan)}</span>
          ${i.stokMin ? `<span class="muted2" style="font-size:11.5px">min ${angka(i.stokMin)}</span>` : ''}</div>
        ${i.stok < 0 ? '<div class="bl" style="color:var(--danger)">Stok minus — break/loss tercatat melebihi stok. Lakukan opname.</div>' : ''}
        <div class="bl">Bulan ini: <b style="color:var(--danger)">${angka(p.break)}</b> break · <b style="color:var(--purple)">${angka(p.loss)}</b> loss</div>
      </div>
      <div class="act">
        ${i.aktif ? `<button class="btn sm pri" onclick="catatUntuk('${esc(i.id)}')">✍️ Catat</button>
        <button class="btn sm" onclick="bukaMutasi('${esc(i.id)}','masuk')" title="Barang baru datang">＋ Stok</button>
        <button class="btn sm" onclick="bukaMutasi('${esc(i.id)}','opname')" title="Hitung fisik & koreksi">⚖ Opname</button>` : ''}
        <button class="btn sm" onclick="bukaItem('${esc(i.id)}')" title="Sunting barang">✎</button>
      </div></div>`;
  }).join('')}</div>`;
}
/* Mengetik di kotak cari menggambar ulang KARTUNYA saja, bukan halaman: kotak
   yang dibuat ulang kehilangan fokus dan hanya huruf pertama yang masuk. */
function ketikCari(v) {
  ST.cari = v;
  const R = ringkasBulan(), q = v.trim().toLowerCase();
  const daftar = ST.items.filter(i =>
       (ST.tampil === 'semua' || (ST.tampil === 'aktif' ? i.aktif : !i.aktif))
    && (!ST.kat || i.kategori === ST.kat)
    && (!q || (i.nama + ' ' + i.kategori + ' ' + i.lokasi).toLowerCase().includes(q)));
  const w = document.getElementById('kartu-stok'); if (w) w.innerHTML = kartuStok(daftar, R);
}
function catatUntuk(id) { ST.form = formBaru(id, 'break'); go('catat'); }

    <div class="grid2">

      <div class="help">Yang membedakan kecelakaan biasa dari pola yang perlu dibereskan. Tulis sejujurnya.</div></div>

    </div>
    <div class="field"><label>Foto bukti</label>

    <div class="field"><label>Catatan</label>
      <textarea rows="2" oninput="ubahForm('catatan',this.value)">${esc(F.catatan)}</textarea></div>

/* Mengetik TIDAK menggambar ulang form (kotaknya kehilangan fokus); hanya
   pilihan yang mengubah bentuk form (jenis, barang) yang memanggil render. */
function ubahForm(k, v, gambar) {
  ST.form[k] = v;
  ST.form.salah = ST.form.salah.filter(x => x !== k);
  if (gambar) { render(); return; }
  if (k === 'qty') {
    const it = item(ST.form.itemId), q = parseFloat(v) || 0, h = document.getElementById('qty-help');
    if (h) h.innerHTML = it && q > it.stok ? '<span style="color:var(--danger)">Melebihi stok terkini — stok akan jadi minus.</span>'
                      : it && it.harga && q ? 'Nilai ± ' + rp(q * it.harga) : '';
  }
  const ev = window.event && window.event.target;
  if (ev && ev.classList) ev.classList.remove('err');
}
async function pilihFotoForm(inp) {
  try { const f = await bacaFoto(inp.files && inp.files[0]); if (f) { ST.form.foto = f; render(); } }
  catch (e) { toast('Foto tidak bisa dipakai', e.message, 'err'); }
  inp.value = '';
}
async function simpanCatat() {
  const F = ST.form, kurang = [];
  if (!F.itemId) kurang.push('itemId');
  if (!(parseFloat(F.qty) > 0)) kurang.push('qty');
  if (!F.tanggal) kurang.push('tanggal');
  if (!F.sebab.trim()) kurang.push('sebab');
  // DITAHAN, bukan cuma diperingatkan: kiriman yang tetap berangkat sambil
  // memasang pita merah terlihat sama persis dengan yang benar-benar ditahan.
  if (kurang.length) { F.salah = kurang; render(); toast('Belum lengkap', 'Isi kotak yang ditandai merah.', 'err'); return; }
  const it = item(F.itemId), q = parseFloat(F.qty);
  if (it && q > it.stok && !confirm(`Jumlah ${angka(q)} melebihi stok terkini ${angka(it.stok)} ${it.satuan}. Stok akan jadi minus.\n\nTetap simpan? (Sebaiknya lakukan opname setelahnya.)`)) return;
  const btn = document.getElementById('btn-catat'); if (btn) { btn.disabled = true; btn.textContent = 'Menyimpan…'; }
  try {
    const d = await apiPost({ action: 'mutasiSimpan', itemId: F.itemId, jenis: F.jenis, qty: q, tanggal: F.tanggal,
      sebab: F.sebab.trim(), pic: F.pic.trim(), tim: F.tim, catatan: F.catatan.trim(),
      foto: F.foto ? F.foto.foto : '', fotoNama: F.foto ? F.foto.nama : '' });
    if (!d || d.status !== 'success') {
      if (d && d.kurang) F.salah = d.kurang;
      throw new Error((d && d.message) || 'gagal');
    }
    toast('Tersimpan', `${JENIS[F.jenis].label} ${angka(q)} ${it ? it.satuan + ' ' + it.nama : ''} — stok sekarang ${angka(d.stok)}.`);
    const jenisTerakhir = F.jenis;
    ST.form = formBaru('', jenisTerakhir);
    if (F.tanggal.slice(0, 7) !== ST.bulan) toast('Tanggalnya di bulan lain', `Catatan ini ada di ${namaBulan(F.tanggal.slice(0, 7))}, bukan bulan yang sedang dibuka.`, 'warn');
    await muat(true);
  } catch (e) {
    toast('Gagal menyimpan', e.message, 'err');
    if (btn) { btn.disabled = false; btn.textContent = 'Simpan Catatan'; }
    render();
  }
}

/* ======================= TAB: RIWAYAT ======================= */

    return true;

      <select onchange="ST.rItem=this.value;render()"><option value="">Semua barang</option>${opsiItem}</select>

function ketikRiwayat(v) {

function tabelRiwayat(daftar) {

        ${m.batalAt ? '' : `<button class="btn sm danger" onclick="bukaBatal('${esc(m.id)}')" title="Batalkan catatan salah input">Batalkan</button>`}</td>
    </tr>`;
  }).join('')}</tbody></table>`;
}

/* ======================= TAB: REKAP ======================= */
function vRekap() {
  const R = ringkasBulan();
  const baris = Object.keys(R.perItem).map(id => Object.assign({ id, item: item(id) }, R.perItem[id]))
    .sort((a, b) => (b.nilai - a.nilai) || ((b.break + b.loss) - (a.break + a.loss)));
  const perTim = {}, perSebab = {};
  ST.mutasi.forEach(m => {
    if (m.batalAt || (m.jenis !== 'break' && m.jenis !== 'loss')) return;
    const q = Math.abs(m.qty), v = q * (m.harga || 0);
    const t = perTim[m.tim || '(tanpa tim)'] = perTim[m.tim || '(tanpa tim)'] || { q: 0, n: 0, nilai: 0 };
    t.q += q; t.n++; t.nilai += v;
    // Sebab dikelompokkan tanpa memandang huruf besar-kecil, tapi yang tampil
    // ejaan pertama yang ketemu — isinya teks bebas.
    const k = (m.sebab || '(tanpa sebab)').trim().toLowerCase();
    const s = perSebab[k] = perSebab[k] || { label: (m.sebab || '(tanpa sebab)').trim(), q: 0, n: 0 };
    s.q += q; s.n++;
  });
  const totNilai = R.break.nilai + R.loss.nilai;
  const tanpaHarga = baris.filter(b => b.item && !b.item.harga).length;

  const tblItem = !baris.length ? `<div class="empty"><div class="ic">🎉</div>Tidak ada break maupun loss di ${esc(namaBulan(ST.bulan))}.</div>`
    : `<div class="tbl-wrap"><table><thead><tr><th>Barang</th><th class="num">Break</th><th class="num">Loss</th><th class="num">Total</th><th class="num">Nilai</th><th class="num">Stok terkini</th></tr></thead><tbody>
      ${baris.map(b => `<tr><td><div style="display:flex;gap:8px;align-items:center">${thumbHtml(b.item)}<b>${esc(b.item ? b.item.nama : '(tidak dikenal)')}</b></div></td>
        <td class="num">${angka(b.break)}</td><td class="num">${angka(b.loss)}</td><td class="num"><b>${angka(b.break + b.loss)}</b> ${esc(b.item ? b.item.satuan : '')}</td>
        <td class="num">${b.nilai ? rp(b.nilai) : '<span class="muted2" title="Harga barang belum diisi">—</span>'}</td>
        <td class="num">${b.item ? angka(b.item.stok) + ' ' + esc(b.item.satuan) : '-'}</td></tr>`).join('')}
      <tr><td><b>TOTAL</b></td><td class="num"><b>${angka(R.break.q)}</b></td><td class="num"><b>${angka(R.loss.q)}</b></td>
        <td class="num"><b>${angka(R.break.q + R.loss.q)}</b></td><td class="num"><b>${rp(totNilai)}</b></td><td></td></tr>
      </tbody></table></div>`;

  const kecil = (judul, obj, kol) => {
    const ks = Object.keys(obj).sort((a, b) => obj[b].q - obj[a].q);
    return `<div class="panel"><div class="panel-head"><h3>${judul}</h3></div><div class="tbl-wrap">${!ks.length ? '<div class="empty">—</div>' :
      `<table><thead><tr><th>${kol}</th><th class="num">Catatan</th><th class="num">Qty</th></tr></thead><tbody>${ks.map(k =>
        `<tr><td>${esc(obj[k].label || k)}</td><td class="num">${obj[k].n}</td><td class="num">${angka(obj[k].q)}</td></tr>`).join('')}</tbody></table>`}</div></div>`;
  };

  return `<div class="bar">${pilihBulanHtml('gantiBulan')}<span class="muted">Hanya catatan yang tidak dibatalkan.</span></div>
    <div class="recaps">
      <div class="recap red"><div class="lab">Break</div><div class="val">${angka(R.break.q)}</div><div class="foot">${R.break.n} catatan · ${rp(R.break.nilai)}</div></div>
      <div class="recap pur"><div class="lab">Loss</div><div class="val">${angka(R.loss.q)}</div><div class="foot">${R.loss.n} catatan · ${rp(R.loss.nilai)}</div></div>
      <div class="recap"><div class="lab">Nilai kerugian</div><div class="val">${rp(totNilai)}</div><div class="foot">harga saat kejadian dicatat</div></div>
      <div class="recap warn"><div class="lab">Barang terdampak</div><div class="val">${baris.length}</div><div class="foot">${tanpaHarga ? tanpaHarga + ' belum punya harga' : 'semua berharga'}</div></div>
    </div>
    ${tanpaHarga ? `<div class="notice warn">${tanpaHarga} barang di rekap ini belum punya harga satuan, jadi nilainya tidak ikut terhitung. Isi harganya lewat ✎ di Stok Barang — catatan <b>berikutnya</b> yang ikut bernilai; catatan lama memakai harga saat ia dicatat.</div>` : ''}
    <div class="panel"><div class="panel-head"><div><h3>Per Barang · ${esc(namaBulan(ST.bulan))}</h3><div class="sub">Diurutkan dari nilai kerugian terbesar.</div></div></div>${tblItem}</div>
    <div class="grid2" style="gap:0 18px">${kecil('Per Tim', perTim, 'Tim')}${kecil('Sebab Tersering', perSebab, 'Sebab')}</div>`;
}

/* ======================= MODAL ======================= */
function modal(html) { document.getElementById('modal-root').innerHTML = `<div class="mb" onclick="if(event.target===this)tutup()"><div class="md">${html}</div></div>`; }
function tutup() { document.getElementById('modal-root').innerHTML = ''; IF = null; }

/* --- daftarkan / sunting barang --- */
let IF = null;   // isian form barang, di luar DOM (alasan yang sama dengan ST.form)
function bukaItem(id) {
  const i = id ? item(id) : null;
  IF = i ? { id: i.id, nama: i.nama, kategori: i.kategori, satuan: i.satuan, lokasi: i.lokasi, harga: i.harga || '',
             stokMin: i.stokMin || '', catatan: i.catatan, stokAwal: '', foto: undefined, thumbLama: i.thumb, aktif: i.aktif }
         : { id: '', nama: '', kategori: '', satuan: 'pcs', lokasi: '', harga: '', stokMin: '', catatan: '', stokAwal: '', foto: undefined, thumbLama: '', aktif: true };
  gambarItem();
}
function gambarItem(salah) {
  salah = salah || [];
  const kats = [...new Set(ST.items.map(i => i.kategori).filter(Boolean))].sort();
  const lok = [...new Set(ST.items.map(i => i.lokasi).filter(Boolean))].sort();
  const thumb = IF.foto ? IF.foto.thumb : IF.foto === null ? '' : IF.thumbLama;
  modal(`<div class="md-h"><h3>${IF.id ? 'Sunting Barang' : 'Daftarkan Barang Baru'}</h3><button class="x" onclick="tutup()">×</button></div>
    <div class="md-b">
      <div class="field"><label>Foto barang</label>
        <div class="prev">${thumb ? `<img src="${esc(thumb)}" alt="">` : '<span class="thumb-s" style="width:72px;height:72px;font-size:28px">🍽️</span>'}
          <div style="display:flex;flex-direction:column;gap:6px"><input type="file" accept="image/*" onchange="pilihFotoItem(this)">
          ${thumb ? '<button class="btn sm" onclick="IF.foto=null;gambarItem()">✕ Buang foto</button>' : ''}</div></div>
        <div class="help">Foto membuat barang mudah dikenali saat mencatat — "Gelas A" dan "Gelas B" tidak.</div></div>
      <div class="field"><label>Nama barang <span class="req">*</span></label>
        <input type="text" id="if-nama" class="${salah.includes('nama') ? 'err' : ''}" value="${esc(IF.nama)}" placeholder="mis. Piring Saji Putih 27cm"></div>
      <div class="grid2">
        <div class="field"><label>Kategori</label><input type="text" id="if-kategori" list="dl-kat" value="${esc(IF.kategori)}" placeholder="mis. Piring, Gelas, Alat Bar">
          <datalist id="dl-kat">${kats.map(k => `<option value="${esc(k)}">`).join('')}</datalist></div>
        <div class="field"><label>Lokasi</label><input type="text" id="if-lokasi" list="dl-lok" value="${esc(IF.lokasi)}" placeholder="mis. Kitchen, Bar">
          <datalist id="dl-lok">${lok.map(k => `<option value="${esc(k)}">`).join('')}</datalist></div>
      </div>
      <div class="grid3">
        <div class="field"><label>Satuan</label><input type="text" id="if-satuan" value="${esc(IF.satuan)}"></div>
        <div class="field"><label>Harga satuan (Rp)</label><input type="number" min="0" step="any" id="if-harga" value="${esc(IF.harga)}"></div>
        <div class="field"><label>Stok minimum</label><input type="number" min="0" step="any" id="if-min" value="${esc(IF.stokMin)}"></div>
      </div>
      ${IF.id ? '' : `<div class="field"><label>Stok awal (jumlah fisik sekarang)</label>
        <input type="number" min="0" step="any" id="if-awal" value="${esc(IF.stokAwal)}">
        <div class="help">Dicatat sebagai "Masuk — Stok awal". Kosongkan kalau mau diisi nanti lewat Opname.</div></div>`}
      <div class="field"><label>Catatan</label><textarea rows="2" id="if-catatan">${esc(IF.catatan)}</textarea></div>
      ${IF.id ? `<div class="notice info" style="margin:0">Stok tidak diubah dari sini — pakai <b>＋ Stok</b> atau <b>⚖ Opname</b> supaya perubahannya tercatat.</div>` : ''}
    </div>
    <div class="md-f">
      ${IF.id ? `<button class="btn ${IF.aktif ? 'danger' : ''}" style="margin-right:auto" onclick="aktifkanItem('${esc(IF.id)}',${IF.aktif ? 0 : 1})">${IF.aktif ? 'Nonaktifkan' : 'Aktifkan lagi'}</button>` : ''}
      <button class="btn" onclick="tutup()">Batal</button><button class="btn pri" id="btn-item" onclick="simpanItem()">Simpan</button></div>`);
}
function bacaFormItem() {
  const v = id => { const e = document.getElementById(id); return e ? e.value : ''; };
  IF.nama = v('if-nama'); IF.kategori = v('if-kategori'); IF.lokasi = v('if-lokasi'); IF.satuan = v('if-satuan');
  IF.harga = v('if-harga'); IF.stokMin = v('if-min'); IF.catatan = v('if-catatan');
  if (!IF.id) IF.stokAwal = v('if-awal');
}
async function pilihFotoItem(inp) {
  bacaFormItem();   // simpan ketikan dulu: menggambar ulang modal membuangnya
  try { const f = await bacaFoto(inp.files && inp.files[0]); if (f) IF.foto = f; }
  catch (e) { toast('Foto tidak bisa dipakai', e.message, 'err'); }
  gambarItem();
}
async function simpanItem() {
  bacaFormItem();
  if (!IF.nama.trim()) { gambarItem(['nama']); toast('Nama barang wajib diisi', '', 'err'); return; }
  const body = { action: 'itemSimpan', id: IF.id, nama: IF.nama.trim(), kategori: IF.kategori.trim(), satuan: IF.satuan.trim() || 'pcs',
    lokasi: IF.lokasi.trim(), harga: parseFloat(IF.harga) || 0, stokMin: parseFloat(IF.stokMin) || 0, catatan: IF.catatan.trim() };
  if (!IF.id) body.stokAwal = parseFloat(IF.stokAwal) || 0;
  // Foto: tidak dikirim = pertahankan; string kosong = hapus (lihat backend).
  if (IF.foto === null) { body.foto = ''; body.thumb = ''; body.fotoNama = ''; }
  else if (IF.foto) { body.foto = IF.foto.foto; body.thumb = IF.foto.thumb; body.fotoNama = IF.foto.nama; }
  const btn = document.getElementById('btn-item'); if (btn) { btn.disabled = true; btn.textContent = 'Menyimpan…'; }
  try {
    const d = await apiPost(body);
    if (!d || d.status !== 'success') { gambarItem(d && d.kurang || []); throw new Error((d && d.message) || 'gagal'); }
    toast('Tersimpan', IF.id ? 'Barang diperbarui.' : `${body.nama} terdaftar.`);
    if (IF.id) delete ST.foto['item:' + IF.id];
    tutup(); await muat(true);
  } catch (e) {
    toast('Gagal menyimpan', e.message, 'err');
    const b = document.getElementById('btn-item'); if (b) { b.disabled = false; b.textContent = 'Simpan'; }
  }
}
async function aktifkanItem(id, aktif) {
  const i = item(id);
  if (!aktif && !confirm(`Nonaktifkan "${i ? i.nama : id}"?\n\nBarangnya tidak dihapus — riwayatnya tetap ada, cuma tidak bisa dicatat lagi dan tidak dihitung di Stok Barang. Bisa diaktifkan lagi kapan saja.`)) return;
  try {
    const d = await apiPost({ action: 'itemAktif', id, aktif });
    if (!d || d.status !== 'success') throw new Error((d && d.message) || 'gagal');
    toast(aktif ? 'Diaktifkan lagi' : 'Dinonaktifkan', i ? i.nama : '');
    tutup(); await muat(true);
  } catch (e) { toast('Gagal', e.message, 'err'); }
}

/* --- tambah stok / opname --- */
function bukaMutasi(id, jenis) {
  const i = item(id); if (!i) return;
  const op = jenis === 'opname';
  modal(`<div class="md-h"><h3>${op ? '⚖ Opname' : '＋ Tambah Stok'} — ${esc(i.nama)}</h3><button class="x" onclick="tutup()">×</button></div>
    <div class="md-b">
      <div class="pilih-info" style="margin:0 0 14px">${thumbHtml(i)}<div>Stok terkini menurut catatan: <b>${angka(i.stok)} ${esc(i.satuan)}</b></div></div>
      <div class="grid2">
        <div class="field"><label>${op ? 'Jumlah FISIK hasil hitung' : 'Jumlah masuk'} (${esc(i.satuan)}) <span class="req">*</span></label>
          <input type="number" min="0" step="any" id="mt-qty" oninput="opnameHint(${i.stok})"><div class="help" id="mt-hint">${op ? 'Selisihnya dihitung sendiri dan dicatat sebagai koreksi.' : ''}</div></div>
        <div class="field"><label>Tanggal <span class="req">*</span></label><input type="date" id="mt-tgl" value="${hariIni()}" max="${hariIni()}"></div>
      </div>
      <div class="field"><label>Keterangan</label><input type="text" id="mt-sebab" placeholder="${op ? 'mis. Opname akhir bulan' : 'mis. Pembelian dari vendor X'}"></div>
      <div class="field"><label>Catatan</label><textarea rows="2" id="mt-cat"></textarea></div>
    </div>
    <div class="md-f"><button class="btn" onclick="tutup()">Batal</button>
      <button class="btn pri" id="btn-mt" onclick="simpanMutasi('${esc(id)}','${jenis}')">Simpan</button></div>`);
  setTimeout(() => { const e = document.getElementById('mt-qty'); if (e) e.focus(); }, 30);
}
function opnameHint(stok) {
  const h = document.getElementById('mt-hint'), e = document.getElementById('mt-qty');
  if (!h || !e || e.value === '' || !document.querySelector('.md-h h3').textContent.includes('Opname')) return;
  const d = Math.round((parseFloat(e.value) - stok) * 100) / 100;
  h.innerHTML = d === 0 ? 'Sama dengan catatan — tetap dicatat sebagai bukti sudah dihitung.'
    : `Selisih <b style="color:${d < 0 ? 'var(--danger)' : 'var(--ok)'}">${d > 0 ? '+' : ''}${angka(d)}</b> akan dicatat sebagai koreksi opname.`;
}
async function simpanMutasi(id, jenis) {
  const g = x => (document.getElementById(x) || {}).value || '';
  const qty = g('mt-qty'), tgl = g('mt-tgl');
  if (qty === '' || (jenis !== 'opname' && !(parseFloat(qty) > 0)) || parseFloat(qty) < 0) {
    const e = document.getElementById('mt-qty'); if (e) e.classList.add('err');
    toast('Jumlah belum benar', jenis === 'opname' ? 'Isi jumlah fisik (boleh 0).' : 'Jumlah harus lebih dari 0.', 'err'); return;
  }
  const body = { action: 'mutasiSimpan', itemId: id, jenis, tanggal: tgl, sebab: g('mt-sebab').trim(), catatan: g('mt-cat').trim(), pic: namaSaya() };
  if (jenis === 'opname') body.fisik = parseFloat(qty); else body.qty = parseFloat(qty);
  const btn = document.getElementById('btn-mt'); if (btn) { btn.disabled = true; btn.textContent = 'Menyimpan…'; }
  try {
    const d = await apiPost(body);
    if (!d || d.status !== 'success') throw new Error((d && d.message) || 'gagal');
    toast('Tersimpan', `Stok sekarang ${angka(d.stok)}${jenis === 'opname' ? ' (selisih ' + (d.delta > 0 ? '+' : '') + angka(d.delta) + ')' : ''}.`);
    tutup(); await muat(true);
  } catch (e) {
    toast('Gagal menyimpan', e.message, 'err');
    const b = document.getElementById('btn-mt'); if (b) { b.disabled = false; b.textContent = 'Simpan'; }
  }
}

/* --- batalkan catatan --- */
function bukaBatal(id) {
  const m = ST.mutasi.find(x => x.id === id); if (!m) return;
  const i = item(m.itemId);
  modal(`<div class="md-h"><h3>Batalkan Catatan</h3><button class="x" onclick="tutup()">×</button></div>
    <div class="md-b">
      <div class="notice warn">${esc(JENIS[m.jenis] ? JENIS[m.jenis].label : m.jenis)} <b>${angka(Math.abs(m.qty))} ${esc(i ? i.satuan + ' ' + i.nama : '')}</b>, ${esc(fmtTgl(m.tanggal))}.
        Catatannya tetap terlihat (dicoret) dan berhenti dihitung — stok kembali seperti sebelum dicatat.</div>
      <div class="field"><label>Alasan pembatalan <span class="req">*</span></label>
        <input type="text" id="bt-alasan" placeholder="mis. Salah pilih barang, salah jumlah"></div></div>
    <div class="md-f"><button class="btn" onclick="tutup()">Tidak jadi</button><button class="btn danger" id="btn-bt" onclick="simpanBatal('${esc(id)}')">Batalkan catatan</button></div>`);
}
async function simpanBatal(id) {
  const e = document.getElementById('bt-alasan'), alasan = e ? e.value.trim() : '';
  if (!alasan) { if (e) e.classList.add('err'); toast('Alasan wajib diisi', '', 'err'); return; }
  const btn = document.getElementById('btn-bt'); if (btn) btn.disabled = true;
  try {
    const d = await apiPost({ action: 'mutasiBatal', id, alasan });
    if (!d || d.status !== 'success') throw new Error((d && d.message) || 'gagal');
    toast('Dibatalkan', 'Catatan dicoret dan tidak lagi dihitung.');
    tutup(); await muat(true);
  } catch (er) { toast('Gagal', er.message, 'err'); if (btn) btn.disabled = false; }
}

/* ======================= LIGHTBOX ======================= */
/* Foto dibesarkan DI HALAMAN INI. window.open('data:…') diblokir Chrome sejak
   versi 60 — tombolnya akan diam tanpa satu pun galat (pelajaran modul
   Reservasi). Wadahnya menempel di <body>, bukan di dalam <main>. */
async function lihatFoto(jenis, id) {
  const kunci = jenis + ':' + id;
  const judul = jenis === 'item' ? ((item(id) || {}).nama || 'Foto barang')
    : (() => { const m = ST.mutasi.find(x => x.id === id) || {}; const i = item(m.itemId); return (i ? i.nama : 'Bukti') + ' — ' + fmtTgl(m.tanggal); })();
  const root = document.getElementById('lb-root');
  const gambar = src => { root.innerHTML = `<div class="lb" onclick="if(event.target===this)tutupLb()"><button class="x" onclick="tutupLb()">×</button>
      ${src ? `<img src="${esc(src)}" alt="">` : '<div style="color:#fff">Memuat foto…</div>'}<div class="cap">${esc(judul)}</div></div>`; };
  if (ST.foto[kunci]) { gambar(ST.foto[kunci]); return; }
  // Thumbnail barang langsung tampil sambil menunggu foto penuhnya.
  gambar(jenis === 'item' ? (item(id) || {}).thumb || '' : '');
  try {
    const d = await apiGet({ action: 'foto', jenis, id });
    if (!d || d.status !== 'success') throw new Error((d && d.message) || 'foto tidak ada');
    ST.foto[kunci] = d.foto;
    if (root.innerHTML) gambar(d.foto);
  } catch (e) { tutupLb(); toast('Foto tidak terbuka', e.message, 'err'); }
}
function tutupLb() { document.getElementById('lb-root').innerHTML = ''; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') { tutupLb(); } });

/* ======================= BOOT ======================= */
document.querySelectorAll('#tabs button').forEach(b => b.addEventListener('click', () => go(b.dataset.tab)));
(function () { const w = document.getElementById('who'); if (w) w.textContent = namaSaya(); })();
muat();
</script>
