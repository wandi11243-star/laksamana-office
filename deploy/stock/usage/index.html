<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemakaian Bahan Event - Laksamana Muda</title>
    <link rel="icon" type="image/jpeg" href="../../assets/LaksamanaMudaLogo.jpeg">

    <!-- Guard SSO sebelum body dirender, supaya tidak ada kedipan halaman
         untuk orang yang memang tidak berhak membukanya. -->
    <script>
    (function(){try{var s=JSON.parse(localStorage.getItem('lm_session')||'null');
      var ok=s&&s.expiry&&Date.now()<s.expiry&&(s.modules||[]).some(function(m){
        return m==='*'||m==='ordering'||m==='purchasing'||m==='stock';});
      if(!ok)location.replace('../../');}catch(e){location.replace('../../');}})();
    </script>

    <meta name="theme-color" content="#2A2620">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body{font-family:'Inter',system-ui,sans-serif}
        .fade-in{animation:fi .18s ease-out}
        @keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
        @media (prefers-reduced-motion:reduce){.fade-in{animation:none}}
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <div class="flex min-h-screen">
    <aside id="app-sidebar" class="hidden md:flex w-64 flex-none flex-col bg-white border-r border-slate-200 sticky top-0 h-screen"></aside>

    <div class="flex-1 min-w-0 flex flex-col">
      <div class="sticky top-0 z-30 bg-white/85 backdrop-blur-md border-b border-slate-200 px-4 py-2.5 flex items-center gap-2">
        <div id="mobile-tabs" class="md:hidden flex items-center gap-1 bg-slate-100 rounded-lg p-1 overflow-x-auto"></div>
        <div class="flex-1"></div>
      </div>

      <main class="max-w-5xl w-full mx-auto px-4 py-6 pb-20 space-y-5">
        <div id="page-head" class="flex items-start justify-between gap-3"></div>

        <!-- ===== FORM ===== -->
        <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-visible">
          <div class="p-4 bg-slate-50 border-b border-slate-100 rounded-t-2xl flex items-center justify-between gap-2">
            <span id="form-judul" class="text-xs font-black text-slate-500 uppercase tracking-wider">Catat Pemakaian Baru</span>
            <button type="button" id="btn-batal-edit" onclick="resetForm()" class="hidden text-xs font-bold text-slate-500 hover:text-slate-800">✕ Batal edit</button>
          </div>

          <div class="p-4 space-y-4">
            <input type="hidden" id="f-id">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
              <div>
                <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1">Tanggal Pakai</label>
                <input type="date" id="f-tanggal" class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
              </div>
              <div>
                <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1">Jenis Event</label>
                <select id="f-jenis" class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
                  <option value="Prasmanan">🍽️ Prasmanan</option>
                  <option value="Training">🎓 Training</option>
                  <option value="RND">🧪 RND</option>
                  <option value="Lainnya">📌 Lainnya</option>
                </select>
              </div>
              <div class="sm:col-span-2">
                <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1">Nama / Keterangan Event</label>
                <input type="text" id="f-nama" placeholder="cth: Prasmanan PT Bahari, 80 pax" class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
              </div>
            </div>

            <div>
              <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1">Catatan — ini untuk apa</label>
              <textarea id="f-catatan" rows="2" placeholder="cth: uji resep sambal baru untuk menu Agustus; bahan diambil dari gudang utama" class="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50/60"></textarea>
            </div>

            <div>
              <div class="flex items-center justify-between mb-2">
                <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Bahan yang Dipakai</label>
                <button type="button" onclick="tambahBaris()" class="bg-indigo-50 border border-indigo-200 hover:bg-indigo-100 text-indigo-700 font-bold px-3 py-1.5 rounded-lg text-xs transition-all">
                  <i class="fa-solid fa-plus text-[10px]"></i> Tambah Bahan
                </button>
              </div>
              <div id="baris-wrap" class="space-y-2"></div>
            </div>

            <div class="flex flex-col sm:flex-row gap-2 pt-2 border-t border-slate-100">
              <button type="button" onclick="simpan('Rencana')" class="flex-1 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 font-bold py-3 rounded-xl text-sm transition-all">
                💾 Simpan sebagai Rencana
              </button>
              <button type="button" onclick="simpan('Selesai')" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl text-sm transition-all shadow-lg shadow-indigo-500/20">
                ✅ Simpan &amp; Tandai Sudah Dipakai
              </button>
            </div>
            <p class="text-[10px] text-slate-400 font-semibold leading-relaxed">
              <b>Rencana</b> = bahannya belum diambil dari gudang. <b>Sudah Dipakai</b> = bahannya benar-benar sudah keluar.
              Statusnya bisa diubah kapan saja dari daftar di bawah.
            </p>
          </div>
        </div>

        <!-- ===== FILTER ===== -->
        <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm space-y-3">
          <div class="relative">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
            <input type="text" id="q" oninput="render()" placeholder="Cari nama event, bahan, atau PIC…" class="w-full border border-slate-200 rounded-xl pl-9 pr-3 py-2.5 text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50/60">
          </div>
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
            <button onclick="setPeriode('hari')"  id="p-hari"  class="px-3 py-2 text-xs font-bold rounded-lg border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 transition-all">Hari Ini</button>
            <button onclick="setPeriode('minggu')" id="p-minggu" class="px-3 py-2 text-xs font-bold rounded-lg border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 transition-all">7 Hari</button>
            <button onclick="setPeriode('bulan')" id="p-bulan" class="px-3 py-2 text-xs font-bold rounded-lg border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 transition-all">Bulan Ini</button>
            <button onclick="setPeriode('semua')" id="p-semua" class="px-3 py-2 text-xs font-bold rounded-lg border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 transition-all">Semua</button>
          </div>
          <div>
            <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2">Jenis Event</label>
            <div id="filter-jenis" class="grid grid-cols-2 sm:grid-cols-5 gap-2"></div>
          </div>
        </div>

        <!-- ===== RINGKASAN + DAFTAR ===== -->
        <div id="ringkas" class="grid grid-cols-2 lg:grid-cols-4 gap-3"></div>
        <div id="daftar" class="space-y-3"></div>
      </main>
    </div>
  </div>

  <div id="toast-wrap" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <script src="../catat-common.js"></script>
  <script>
  /* =====================================================================
     PEMAKAIAN BAHAN UNTUK EVENT
     Mencatat bahan apa saja yang keluar untuk Prasmanan / Training / RND,
     lengkap dengan catatan "ini untuk apa".

     TIDAK mengurangi tabel `stock` — lihat catatan di schema.sql. Tujuannya
     memang mengetahui pemakaian, bukan menjadi sumber kebenaran stok.
     ===================================================================== */

  const SESI = sesiOffice('stock');
  let DATA = [];
  let PERIODE = 'bulan';
  let JENIS = 'ALL';
  let NOMOR_BARIS = 0;

  const JENIS_OPSI = [
    ['ALL', 'Semua'], ['Prasmanan', '🍽️ Prasmanan'], ['Training', '🎓 Training'],
    ['RND', '🧪 RND'], ['Lainnya', '📌 Lainnya']
  ];

  document.addEventListener('DOMContentLoaded', async () => {
    if (!SESI) { location.replace('../../'); return; }
    pasangCangkang('usage', 'Pemakaian Bahan Event',
      'Catat bahan yang dipakai untuk Prasmanan, Training, dan RND.', SESI);
    document.getElementById('f-tanggal').value = hariIni();
    renderFilterJenis();
    setAktifPeriode();
    tambahBaris();
    await muatBahan();
    await muat();
  });

  /* ------------------------------- FORM ------------------------------- */

  function tambahBaris(isi) {
    const id = ++NOMOR_BARIS;
    const wrap = document.getElementById('baris-wrap');
    const row = document.createElement('div');
    row.id = `br-${id}`;
    row.className = 'flex flex-col sm:flex-row gap-2 items-start bg-slate-50/60 border border-slate-100 rounded-xl p-2 fade-in';
    row.innerHTML = `
      <div class="relative flex-1 min-w-0 w-full">
        <input type="text" id="br-item-${id}" value="${esc((isi && isi.item) || '')}" placeholder="Nama bahan…"
               autocomplete="off" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-xs font-bold focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
        <div id="br-ac-${id}" class="hidden absolute left-0 right-0 top-full mt-1 z-20 bg-white border border-slate-200 rounded-lg shadow-xl max-h-52 overflow-y-auto"></div>
      </div>
      <input type="number" id="br-qty-${id}" value="${(isi && isi.qty) || 1}" min="0" step="0.01"
             class="w-full sm:w-20 border border-slate-200 rounded-lg px-2 py-2 text-xs font-black text-center focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
      <select id="br-unit-${id}" class="w-full sm:w-28 border border-slate-200 rounded-lg px-2 py-2 text-xs font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
        ${opsiSatuan((isi && isi.item) || '', (isi && isi.unit) || '')}
      </select>
      <input type="text" id="br-note-${id}" value="${esc((isi && isi.note) || '')}" placeholder="Catatan baris (opsional)"
             class="flex-1 min-w-0 w-full border border-slate-200 rounded-lg px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
      <button type="button" onclick="hapusBaris(${id})" class="p-2 text-slate-400 hover:text-rose-600 transition-all self-end sm:self-auto" title="Hapus baris">
        <i class="fa-solid fa-trash text-xs"></i></button>`;
    wrap.appendChild(row);

    // Satuan ikut menyempit mengikuti bahan yang dipilih — aturan yang sama
    // dengan form order, supaya satuan yang dicatat tidak bertentangan.
    pasangAutocomplete(
      document.getElementById(`br-item-${id}`),
      document.getElementById(`br-ac-${id}`),
      (nama) => {
        const sel = document.getElementById(`br-unit-${id}`);
        if (sel) sel.innerHTML = opsiSatuan(nama, sel.value);
      });
  }

  function hapusBaris(id) {
    const wrap = document.getElementById('baris-wrap');
    // Satu baris terakhir dipertahankan: form tanpa baris sama sekali tidak
    // punya tempat untuk mulai mengetik lagi.
    if (wrap.children.length <= 1) { toast('Minimal satu baris', 'Kosongkan isinya kalau tidak dipakai.', 'err'); return; }
    document.getElementById(`br-${id}`)?.remove();
  }

  function bacaBaris() {
    const out = [];
    [...document.getElementById('baris-wrap').children].forEach(row => {
      const id = row.id.replace('br-', '');
      const item = (document.getElementById(`br-item-${id}`)?.value || '').trim();
      if (!item) return;
      out.push({
        item,
        qty: parseFloat(document.getElementById(`br-qty-${id}`)?.value) || 0,
        unit: document.getElementById(`br-unit-${id}`)?.value || '',
        note: (document.getElementById(`br-note-${id}`)?.value || '').trim()
      });
    });
    return out;
  }

  function resetForm() {
    document.getElementById('f-id').value = '';
    document.getElementById('f-tanggal').value = hariIni();
    document.getElementById('f-jenis').value = 'Prasmanan';
    document.getElementById('f-nama').value = '';
    document.getElementById('f-catatan').value = '';
    document.getElementById('baris-wrap').innerHTML = '';
    NOMOR_BARIS = 0;
    tambahBaris();
    document.getElementById('form-judul').textContent = 'Catat Pemakaian Baru';
    document.getElementById('btn-batal-edit').classList.add('hidden');
  }

  function edit(id) {
    const r = DATA.find(x => x.id === id);
    if (!r) return;
    document.getElementById('f-id').value = r.id;
    document.getElementById('f-tanggal').value = r.tanggal || hariIni();
    document.getElementById('f-jenis').value = r.jenis || 'Prasmanan';
    document.getElementById('f-nama').value = r.namaEvent || '';
    document.getElementById('f-catatan').value = r.catatan || '';
    document.getElementById('baris-wrap').innerHTML = '';
    NOMOR_BARIS = 0;
    (r.items || []).forEach(tambahBaris);
    if (!(r.items || []).length) tambahBaris();
    document.getElementById('form-judul').textContent = 'Ubah Catatan Pemakaian';
    document.getElementById('btn-batal-edit').classList.remove('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  async function simpan(status) {
    const items = bacaBaris();
    if (!items.length) { toast('Bahan kosong', 'Isi minimal satu bahan yang dipakai.', 'err'); return; }
    const body = {
      action: 'simpan',
      id: document.getElementById('f-id').value,
      tanggal: document.getElementById('f-tanggal').value,
      jenis: document.getElementById('f-jenis').value,
      namaEvent: document.getElementById('f-nama').value.trim(),
      catatan: document.getElementById('f-catatan').value.trim(),
      status,
      pic: SESI.name || '',
      tim: timSesi(SESI),
      items
    };
    try {
      const d = await apiPost('usage.php', body);
      if (d && d.status === 'success') {
        toast('Tersimpan', `${items.length} bahan tercatat sebagai ${status === 'Selesai' ? 'sudah dipakai' : 'rencana'}.`, 'ok');
        resetForm();
        await muat();
      } else {
        toast('Gagal menyimpan', (d && d.message) || 'Ditolak server.', 'err');
      }
    } catch (e) {
      toast('Gagal terhubung', 'Cek koneksi lalu coba lagi.', 'err');
    }
  }

  async function ubahStatus(id, status) {
    try {
      const d = await apiPost('usage.php', { action: 'status', id, status });
      if (d && d.status === 'success') { toast('Status diperbarui', '', 'ok'); await muat(); }
      else toast('Gagal', (d && d.message) || '', 'err');
    } catch (e) { toast('Gagal terhubung', 'Cek koneksi.', 'err'); }
  }

  async function hapus(id, nama) {
    if (!confirm(`Hapus catatan pemakaian "${nama || id}"?\n\nTindakan ini tidak bisa dibatalkan.`)) return;
    try {
      const d = await apiPost('usage.php', { action: 'hapus', id });
      if (d && d.status === 'success') { toast('Dihapus', '', 'ok'); await muat(); }
      else toast('Gagal', (d && d.message) || '', 'err');
    } catch (e) { toast('Gagal terhubung', 'Cek koneksi.', 'err'); }
  }

  /* ------------------------------ DAFTAR ------------------------------ */

  function rentang() {
    if (PERIODE === 'semua') return {};
    if (PERIODE === 'hari')  return { dari: hariIni(), ke: hariIni() };
    if (PERIODE === 'minggu') return { dari: tglGeser(-6), ke: hariIni() };
    const d = new Date();
    return { dari: `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-01`, ke: hariIni() };
  }

  function setPeriode(p) { PERIODE = p; setAktifPeriode(); muat(); }
  function setAktifPeriode() {
    ['hari', 'minggu', 'bulan', 'semua'].forEach(p => {
      const b = document.getElementById('p-' + p);
      if (!b) return;
      b.className = `px-3 py-2 text-xs font-bold rounded-lg border transition-all ${
        PERIODE === p ? 'bg-indigo-600 text-white border-indigo-600 shadow-sm'
                      : 'border-slate-200 bg-white text-slate-600 hover:bg-slate-50'}`;
    });
  }
  function setJenis(j) { JENIS = j; renderFilterJenis(); render(); }
  function renderFilterJenis() {
    document.getElementById('filter-jenis').innerHTML = JENIS_OPSI.map(([v, l]) => `
      <button onclick="setJenis('${v}')" class="px-3 py-2 text-xs font-bold rounded-lg border transition-all truncate ${
        JENIS === v ? 'bg-slate-900 text-white border-slate-900 shadow-sm'
                    : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'}">${l}</button>`).join('');
  }

  async function muat() {
    try {
      const d = await apiGet('usage.php', rentang());
      DATA = Array.isArray(d) ? d : [];
    } catch (e) {
      DATA = [];
      toast('Gagal memuat', 'Daftar pemakaian tidak bisa diambil.', 'err');
    }
    render();
  }

  function render() {
    const q = (document.getElementById('q').value || '').trim().toLowerCase();
    const list = DATA
      .filter(r => JENIS === 'ALL' || r.jenis === JENIS)
      .filter(r => !q || [r.namaEvent, r.pic, r.catatan, r.jenis]
        .concat((r.items || []).map(i => i.item))
        .some(v => String(v || '').toLowerCase().includes(q)));

    // Ringkasan dihitung dari yang SEDANG tampil, bukan seluruh data —
    // supaya angkanya menjawab pertanyaan yang sedang dilihat.
    const totalItem = list.reduce((a, r) => a + (r.items || []).length, 0);
    const rencana = list.filter(r => r.status !== 'Selesai').length;
    const perJenis = {};
    list.forEach(r => { perJenis[r.jenis] = (perJenis[r.jenis] || 0) + 1; });
    const teratas = Object.entries(perJenis).sort((a, b) => b[1] - a[1])[0];

    document.getElementById('ringkas').innerHTML = `
      ${kartu('📋 Total Catatan', list.length, 'event tercatat')}
      ${kartu('📦 Baris Bahan', totalItem, 'total item dipakai')}
      ${kartu('⏳ Masih Rencana', rencana, 'belum diambil', rencana ? 'amber' : '')}
      ${kartu('🔥 Terbanyak', teratas ? teratas[0] : '—', teratas ? `${teratas[1]} catatan` : 'belum ada')}`;

    const box = document.getElementById('daftar');
    if (!list.length) {
      box.innerHTML = `<div class="bg-white border border-slate-200 rounded-2xl p-10 text-center">
        <div class="text-3xl mb-2 opacity-50">📭</div>
        <div class="text-sm font-bold text-slate-600">${q ? 'Tidak ada yang cocok dengan pencarian.' : 'Belum ada catatan pemakaian pada periode ini.'}</div>
      </div>`;
      return;
    }

    box.innerHTML = list.map(r => {
      const selesai = r.status === 'Selesai';
      const ikon = { Prasmanan: '🍽️', Training: '🎓', RND: '🧪' }[r.jenis] || '📌';
      return `
      <div class="bg-white border border-slate-200 rounded-2xl overflow-hidden fade-in">
        <div class="p-4 flex flex-wrap items-start gap-3 border-b border-slate-100">
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2 flex-wrap">
              <span class="text-sm font-black text-slate-900">${ikon} ${esc(r.namaEvent || '(tanpa nama)')}</span>
              <span class="px-2 py-0.5 rounded-full text-[10px] font-black uppercase tracking-wider ${
                selesai ? 'bg-emerald-50 text-emerald-700 border border-emerald-200'
                        : 'bg-amber-50 text-amber-700 border border-amber-200'}">${selesai ? '✅ Sudah Dipakai' : '⏳ Rencana'}</span>
              <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-slate-100 text-slate-600">${esc(r.jenis)}</span>
            </div>
            <div class="text-[11px] text-slate-400 font-semibold mt-1">
              ${fmtTgl(r.tanggal)} · ${esc(r.pic || '-')}${r.tim ? ` · ${esc(r.tim)}` : ''} · dicatat ${fmtWaktu(r.waktu)}
            </div>
            ${r.catatan ? `<div class="mt-2 text-xs text-slate-600 bg-slate-50 border border-slate-100 rounded-lg px-3 py-2 leading-relaxed">📝 ${esc(r.catatan)}</div>` : ''}
          </div>
          <div class="flex items-center gap-1 shrink-0">
            <button onclick="ubahStatus('${r.id}','${selesai ? 'Rencana' : 'Selesai'}')" title="${selesai ? 'Kembalikan ke rencana' : 'Tandai sudah dipakai'}"
              class="px-2.5 py-1.5 rounded-lg text-xs font-bold border ${selesai
                ? 'border-slate-200 text-slate-500 hover:bg-slate-50'
                : 'border-emerald-200 text-emerald-700 bg-emerald-50 hover:bg-emerald-100'} transition-all">
              ${selesai ? '↩' : '✅'}</button>
            <button onclick="edit('${r.id}')" title="Ubah" class="px-2.5 py-1.5 rounded-lg text-xs font-bold border border-slate-200 text-slate-500 hover:bg-slate-50 transition-all">✏️</button>
            <button onclick="hapus('${r.id}', ${JSON.stringify(r.namaEvent || '').replace(/"/g, '&quot;')})" title="Hapus"
              class="px-2.5 py-1.5 rounded-lg text-xs font-bold border border-rose-200 text-rose-600 hover:bg-rose-50 transition-all">🗑️</button>
          </div>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs">
            <thead><tr class="bg-slate-50 text-[10px] uppercase text-slate-400 tracking-wider">
              <th class="px-4 py-2 font-black">Bahan</th>
              <th class="px-4 py-2 font-black w-28">Jumlah</th>
              <th class="px-4 py-2 font-black">Catatan</th>
            </tr></thead>
            <tbody class="divide-y divide-slate-50">
              ${(r.items || []).map(i => `<tr>
                <td class="px-4 py-2 font-bold text-slate-800">${esc(i.item)}</td>
                <td class="px-4 py-2 font-black text-slate-700" style="font-variant-numeric:tabular-nums">${i.qty} ${esc(i.unit || '')}</td>
                <td class="px-4 py-2 text-slate-500">${i.note ? esc(i.note) : '<span class="text-slate-300">-</span>'}</td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>`;
    }).join('');
  }

  function kartu(label, nilai, sub, warna) {
    const c = warna === 'amber' ? 'border-amber-200 bg-amber-50' : 'border-slate-200 bg-white';
    return `<div class="border ${c} rounded-2xl p-4">
      <div class="text-[10px] font-black uppercase tracking-wider text-slate-400">${label}</div>
      <div class="text-2xl font-black text-slate-900 mt-1">${esc(String(nilai))}</div>
      <div class="text-[11px] text-slate-400 font-semibold mt-0.5">${esc(sub)}</div>
    </div>`;
  }
  </script>
</body>
</html>
