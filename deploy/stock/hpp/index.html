<script>
(function(){try{
  var s=JSON.parse(localStorage.getItem('lm_session')||'null');
  var hidup=s&&s.expiry&&Date.now()<s.expiry;
  var punya=hidup&&(s.modules||[]).some(function(m){return m==='*'||m==='hpp';});
  if(!punya)location.replace('../../');
}catch(e){location.replace('../../');}})();
</script>

:root{
  --ink:#2A2620; --ink-2:#3A3428;
  --gold:#A9791F; --gold-2:#C8961F; --gold-dim:#7A560F; --gold-soft:#F2E9D3;
  --paper:#F7F6F4; --surface:#FFFFFF; --line:#E7E1D3; --line-soft:rgba(60,55,45,.10);
  --text:#2A2620; --muted:#5C574D; --muted-2:#928C80;
  --ok:#1F9D5F; --ok-bg:#E4F5EC; --warn:#B5831A; --warn-bg:#F7EFDB;
  --danger:#C9432B; --danger-bg:#F8E4DF; --info:#2F7FC4; --info-bg:#E4EFF8;
  --violet:#7C5FC0; --violet-bg:#ECE6F7; --teal:#1F9D8F; --teal-bg:#E2F4F2;
  --radius:16px; --radius-sm:10px; --shadow:0 4px 18px rgba(50,42,28,.06);
  --shadow-lg:0 18px 48px rgba(50,42,28,.12);
  --ring:0 0 0 3px rgba(227,160,8,.18); --ease:cubic-bezier(.16,1,.3,1);
  --serif:'Plus Jakarta Sans',system-ui,sans-serif;
  --sans:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --sidebar-w:248px;
}

body{font-family:var(--sans);background:radial-gradient(900px 480px at 50% -12%,rgba(227,160,8,.09),transparent 60%),var(--paper);
  color:var(--text);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
h1,h2,h3,h4{font-family:var(--serif);font-weight:700;letter-spacing:-.02em;line-height:1.18;color:var(--ink)}
button{font-family:inherit;cursor:pointer} input,select,textarea{font-family:inherit}
.mono{font-variant-numeric:tabular-nums} .hidden{display:none!important}
a{color:var(--info)}
.btn{border:none;border-radius:var(--radius-sm);padding:10px 16px;font-weight:600;font-size:13.5px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:filter .15s var(--ease)}
.btn:focus-visible{outline:none;box-shadow:var(--ring)}
.btn-primary{background:linear-gradient(135deg,var(--gold-2),var(--gold-dim));color:#fff;box-shadow:0 3px 12px rgba(122,86,15,.28)}
.btn-primary:hover{filter:brightness(1.06)} .btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-ghost{background:var(--surface);border:1.5px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--gold-2);background:var(--gold-soft)}
.btn-danger{background:var(--danger-bg);color:var(--danger);border:1.5px solid rgba(201,67,43,.25)}
.btn-sm{padding:7px 11px;font-size:12.5px} .btn-xs{padding:5px 9px;font-size:11.5px;border-radius:8px}
.field{margin-bottom:12px} .field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1.5px solid var(--line);

.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--gold);box-shadow:var(--ring)}

.app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);flex:none;background:var(--surface);border-right:1px solid var(--line);

/* lembar cetak — "export PDF" di repo ini = cetak lalu simpan sebagai PDF.

<script>
/* ======================================================================
   HPP & RESEP — sub-modul kelima Stock (13 Agustus 2026)

   Menggantikan berkas "HPP Food Laksamana Updated March 2026.xlsx" (5 sheet:
   Item, Recipe - Food, Recipe - Drink, Harga - Food, Harga - Drink). Data
   awalnya dipindahkan sekali dari berkas itu; SESUDAH ITU sumber kebenarannya
   modul ini — keputusan user saat memesannya, dan itu sebabnya setiap layar di
   sini bisa menulis, bukan cuma memajang hasil impor.

   YANG MEMBUATNYA LEBIH DARI SALINAN EXCEL: resep boleh memakai resep lain
   sebagai bahan, dan di berkas aslinya memang begitu — dish "Ayam Bawang
   Putih" memakai base "Ayam Karage" 80 Gr, yang punya resepnya sendiri. Di
   Excel angka Rp54,785/gr itu diketik tangan hasil hitungan terpisah; di sini
   ia DIHITUNG berjenjang, jadi satu perubahan harga ayam merambat sendiri ke
   seluruh base dan seluruh dish. 345 baris bahan di data awal menunjuk resep
   lain — itu 345 angka yang dulu harus dihitung ulang manual tiap harga naik.

   Modal dihitung DI SINI, bukan di server (lihat catatan di stock-mysql/hpp.php):
   satu rumus di dua tempat pasti menyimpang, dan yang dilihat orang angka di
   layar.
   ====================================================================== */
const API      = '../../stock-api-mysql/hpp.php';
const API_ITEM = '../../stock-api-mysql/items.php';
const SEED_URL = 'seed-hpp.json';
/* Ambang & buffer datang dari server (tabel hpp_setting) supaya bisa diubah
   tanpa deploy — di prototipe user angka ini ada di halaman Pengaturan.
   Bawaannya tetap 33%, sama dengan kolom "Below 33%" di berkas HPP aslinya. */
let SET={targetFood:0.33,targetDrink:0.33,buffer:0.05,lampuKuning:3,lampuMerah:8};
const AMBANG_OF=r=>(r&&r.jenis==='drink')?num(SET.targetDrink):num(SET.targetFood);
const AMBANG   = 0.33;   // dipakai tampilan umum (sebaran & judul kolom)

const $=i=>document.getElementById(i);
const num=v=>{const n=parseFloat(String(v==null?'':v).replace(/[^0-9.\-]/g,''));return isNaN(n)?0:n;};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>'Rp'+Math.round(n||0).toLocaleString('id-ID');
/* Harga bahan sering pecahan kecil (Rp0,289/ml air). Dibulatkan ke rupiah
   penuh, satu porsi jadi meleset jauh — jadi sisi bahan pakai 2 desimal. */
const rp2=n=>'Rp'+(Math.round((n||0)*100)/100).toLocaleString('id-ID',{maximumFractionDigits:2});
const pct=n=>(isFinite(n)?(n*100).toFixed(1):'—')+'%';
const low=s=>String(s||'').trim().toLowerCase();
const kini=()=>new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});

let ME=null, S={bahan:[],resep:[]}, PRODUK={}, VIEW='dash', PESAN='';
let PB={}, PR={};          // peta nama -> bahan / resep
let MEMO={};               // hasil hitung modal, dibuang tiap data berubah

function bacaSesi(){
  try{
    const s=JSON.parse(localStorage.getItem('lm_session')||'null');
    if(!s||!s.expiry||Date.now()>=s.expiry) return null;
    const m=s.modules||[];
    if(m.indexOf('*')<0&&m.indexOf('hpp')<0) return null;
    const a=s.adminModules||[];
    return {id:s.userId,name:s.name,isAdmin:(a.indexOf('*')>-1||a.indexOf('hpp')>-1)};
  }catch(e){ return null; }
}
function petakan(){
  PB={}; PR={}; MEMO={};
  S.bahan.forEach(b=>{ PB[low(b.nama)]=b; });
  /* Resep dipetakan per JENIS dulu, baru global. Ada nama yang muncul di food
     dan drink (mis. "Simple Syrup"); yang dipakai harus yang sejenis, kalau
     tidak modal drink bisa diam-diam memakai resep food. */
  S.resep.forEach(r=>{ PR[r.jenis+'|'+low(r.nama)]=r; if(!PR[low(r.nama)]) PR[low(r.nama)]=r; });
}
function cariResep(nama,jenis){ return PR[jenis+'|'+low(nama)]||PR[low(nama)]||null; }
function per1(b){ return (b&&num(b.qty_beli)>0)?num(b.harga_beli)/num(b.qty_beli):0; }

/* ---- MODAL BERJENJANG ----
   Memulangkan {total, hilang:[nama…], siklus:bool}. `hilang` itu bahan yang
   dirujuk tapi tidak ada daftarnya — di data awal ada 77 nama begitu (bahan
   minuman yang tidak pernah masuk sheet Item). Sengaja DILAPORKAN, tidak
   dihitung nol diam-diam: modal yang kelihatan murah karena bahannya hilang
   adalah kesalahan yang paling mahal di layar ini. */
function modalResep(r,jalur){
  if(!r) return {total:0,hilang:[],siklus:false};
  if(MEMO[r.id]) return MEMO[r.id];
  jalur=jalur||{};
  if(jalur[r.id]) return {total:0,hilang:[],siklus:true};   // resep memanggil dirinya sendiri
  jalur[r.id]=1;
  let total=0, hilang=[], siklus=false;
  (r.bahan||[]).forEach(b=>{
    if(!b||!b.nama) return;
    if(b.ref==='resep'){
      const sub=cariResep(b.nama,r.jenis);
      if(!sub){ hilang.push(b.nama); return; }
      const m=modalResep(sub,jalur);
      if(m.siklus) siklus=true;
      const perUnit=num(sub.yield_qty)>0?m.total/num(sub.yield_qty):0;
      total+=perUnit*num(b.qty);
      hilang=hilang.concat(m.hilang);
    }else{
      const it=PB[low(b.nama)];
      if(!it){ hilang.push(b.nama); return; }
      total+=per1(it)*num(b.qty);
    }
  });
  delete jalur[r.id];
  const hasil={total,hilang,siklus};
  if(!siklus) MEMO[r.id]=hasil;    // hasil di bawah siklus tidak boleh disimpan
  return hasil;
}
/* Modal satu MENU. Resep kosong → pakai modal ketikan tangan (menu yang dibeli
   jadi, atau yang resepnya belum dipindahkan). */
function modalMenu(r){
  const m=modalResep(r);
  if((r.bahan||[]).length===0 && num(r.modal_manual)>0) return {total:num(r.modal_manual),hilang:[],siklus:false,manual:true};
  return m;
}
function hargaJual(r){ return num(r.harga_baru)||num(r.harga_lama)||0; }
function cogsOf(r){ const h=hargaJual(r); if(h<=0) return null; return modalMenu(r).total/h; }
function chipCogs(c,r){
  if(c===null) return '<span class="chip mute">belum ada harga</span>';
  const t=r?AMBANG_OF(r):num(SET.targetFood);   // target bisa beda food vs drink
  const k=c<=t*0.75?'ok':c<=t?'warn':'bad';
  return `<span class="chip ${k}">${pct(c)}</span>`;
}
/* Berapa resep memakai bahan/resep ini — dipakai daftar Bahan & layar
   pencocokan, dan jadi pengaman sebelum menghapus sesuatu. */
function dipakaiOleh(nama){
  const n=low(nama), out=[];
  S.resep.forEach(r=>{ if((r.bahan||[]).some(b=>b&&low(b.nama)===n)) out.push(r); });
  return out;
}

/* KOTAK PENCARIAN. Sebelumnya tiap ketikan memanggil render() lalu focus()
   saja — elemennya digambar ulang, jadi kursor selalu meloncat ke UJUNG teks.
   Akibatnya mustahil membetulkan huruf di tengah kata: yang diketik masuk ke
   belakang. Posisi kursor sekarang dicatat sebelum menggambar ulang dan
   dikembalikan sesudahnya. */
/* KOTAK NOMINAL BERFORMAT RUPIAH. "102125" mustahil dibaca sebagai seratus dua
   ribu seratus dua puluh lima — dan harga beli adalah satu-satunya angka di
   modul ini yang salah ketiknya menggeser SELURUH modal menu. Titik ribuan
   dipasang sambil mengetik.

   Kursor dijaga dengan cara menghitung DIGIT sebelum kursor, bukan posisi
   karakternya: menambah satu titik ribuan menggeser posisi karakter tapi tidak
   menggeser jumlah digit, jadi hanya cara ini yang tidak melompat sendiri. */
const fmtIn=v=>{ const d=String(v==null?'':v).replace(/[^0-9]/g,''); return d?Number(d).toLocaleString('id-ID'):''; };
function angkaKetik(el,setter){
  const digitSebelum=String(el.value).slice(0,el.selectionStart).replace(/[^0-9]/g,'').length;
  const bersih=String(el.value).replace(/[^0-9]/g,'');
  setter(bersih);
  el.value=fmtIn(bersih);
  let pos=0, n=0;
  while(pos<el.value.length && n<digitSebelum){ if(/[0-9]/.test(el.value[pos])) n++; pos++; }
  try{ el.setSelectionRange(pos,pos); }catch(_){}
}
function cari(el,setter){
  const id=el.id, p=el.selectionStart;
  setter(el.value);
  render();
  const n=document.getElementById(id);
  if(n){ n.focus(); try{ n.setSelectionRange(p,p); }catch(_){} }
}
function render(){
  $('pesan').innerHTML=PESAN;

}

   2026, permintaan user): keduanya dibaca dengan pertanyaan yang berbeda —
   menu jadi dinilai dari COGS terhadap harga jual, base dari modal per satuan
   hasil. Dicampur dalam satu daftar, kolom Harga jual & COGS kosong di separuh
   barisnya dan pengurutan menurut COGS jadi tidak ada artinya.

   `aktifSaja` menyala secara bawaan: yang ingin dilihat cuma resep yang masih
   dipakai. Resep lama tidak dihapus — ia cuma dinonaktifkan, karena
   menghapusnya akan memutus rujukan di resep lain yang mungkin masih
   memakainya, dan riwayat modalnya ikut hilang. */
let F={q:'',jenis:'',seksi:'',hal:1,per:25,sortK:'nama',sortD:1,aktifSaja:true};
let FBS={hal:1,per:25,sortK:'nama',sortD:1};
const AMB_RESEP={
  nama:r=>low(r.nama), jenis:r=>r.jenis, seksi:r=>low(r.seksi||''),
  yield:r=>num(r.yield_qty), bahan:r=>(r.bahan||[]).filter(x=>x&&x.nama).length,
  modal:r=>modalMenu(r).total,
  perunit:r=>modalMenu(r).total/(num(r.yield_qty)||1),
  harga:r=>hargaJual(r),
  /* Menu tanpa harga jual tidak punya COGS. Diberi -1 supaya ia mengumpul di
     satu ujung, bukan berserak di tengah sebagai nol yang terlihat "sangat
     sehat". */
  cogs:r=>{ const c=cogsOf(r); return c===null?-1:c; },
  aktif:r=>(r.aktif===0?0:1)
};
function resepTersaring(tipe){
  const q=low(F.q);
  const l=S.resep.filter(r=>{
    if(tipe&&r.tipe!==tipe) return false;
    if(F.aktifSaja&&r.aktif===0) return false;
    if(F.jenis&&r.jenis!==F.jenis) return false;
    if(F.seksi&&r.seksi!==F.seksi) return false;
    if(q&&low(r.nama).indexOf(q)<0&&low(r.seksi||'').indexOf(q)<0) return false;
    return true;
  });
  return urutkanDaftar(l,tipe==='base'?'FBS':'F',AMB_RESEP,'nama');
}
function setAktif(id,on){
  const r=S.resep.find(x=>x.id===id); if(!r) return;
  if(!on){
    const pakai=S.resep.filter(x=>x.id!==id&&(x.bahan||[]).some(b=>b&&b.ref==='resep'&&low(b.nama)===low(r.nama)));
    if(pakai.length&&!confirm(`"${r.nama}" masih dipakai ${pakai.length} resep lain (${pakai.slice(0,3).map(x=>x.nama).join(', ')}${pakai.length>3?', …':''}).\n\nMenonaktifkan tidak menghapusnya — modal resep-resep itu tetap terhitung — tapi ia hilang dari daftar. Lanjut?`)) return;

  kirim({action:'simpanResep',data:Object.assign({},r,{aktif:on?1:0})},on?'Resep diaktifkan.':'Resep dinonaktifkan.');
}

/* Satu pembuat untuk kedua tabel. Kolom Harga jual & COGS hanya ada di Menu
   Jadi: di tabel Base keduanya selalu kosong, dan kolom yang selalu kosong
   cuma memakan lebar sambil membuat orang mengira ada yang belum diisi. */
function tabelResep(tipe,judul,sub,mana){
  const semua=resepTersaring(tipe), st=ST[mana]();
  const nHal=Math.max(1,Math.ceil(semua.length/st.per));
  if(st.hal>nHal) st.hal=nHal;
  const hal=semua.slice((st.hal-1)*st.per,st.hal*st.per);
  const dish=(tipe==='dish');
  let h=`<div class="card"><h3>${judul} <span style="font-weight:400;color:var(--muted-2);font-size:13px">${semua.length}</span></h3>
    <div class="card-sub">${sub}</div>`;
  if(!semua.length) return h+`<div class="empty" style="padding:22px">Tidak ada yang cocok dengan saringan ini.</div></div>`;
  h+=`<div class="tbl-wrap"><table><thead><tr>
      ${thUrut(mana,'nama','Nama')}${thUrut(mana,'jenis','Jenis')}${thUrut(mana,'seksi','Seksi')}
      ${thUrut(mana,'yield','Yield','num')}${thUrut(mana,'bahan','Bahan','num')}
      ${thUrut(mana,'modal','Modal','num')}${thUrut(mana,'perunit','Per unit','num')}
      ${dish?thUrut(mana,'harga','Harga jual','num')+thUrut(mana,'cogs','COGS%','num'):''}
      ${thUrut(mana,'aktif','Aktif')}<th></th></tr></thead><tbody>`;
  hal.forEach(r=>{
    const m=modalMenu(r), y=num(r.yield_qty)||1, mati=(r.aktif===0);
    h+=`<tr class="${mati?'mati':''}">
      <td><b>${esc(r.nama)}</b>${m.hilang.length?` <span class="chip bad" title="${esc([...new Set(m.hilang)].join(', '))}">${m.hilang.length} bahan hilang</span>`:''}${m.siklus?' <span class="chip bad">resep berputar</span>':''}${m.manual?' <span class="chip mute">modal manual</span>':''}</td>
      <td>${r.jenis==='drink'?'<span class="chip teal">Drink</span>':'<span class="chip violet">Food</span>'}</td>
      <td style="font-size:11.5px;color:var(--muted)">${esc(r.seksi||'—')}</td>
      <td class="num">${y} ${esc(r.yield_unit||'')}</td>
      <td class="num">${(r.bahan||[]).filter(b=>b&&b.nama).length}</td>
      <td class="num mono">${rp(m.total)}</td>
      <td class="num mono">${rp2(m.total/y)}</td>
      ${dish?`<td class="num mono">${hargaJual(r)?rp(hargaJual(r)):'—'}</td><td class="num">${chipCogs(cogsOf(r),r)}</td>`:''}
      <td><button class="btn btn-ghost btn-xs" onclick="setAktif('${esc(r.id)}',${mati?1:0})" title="${mati?'Aktifkan kembali':'Nonaktifkan — resepnya tetap tersimpan, cuma hilang dari daftar'}">${mati?'○ non-aktif':'● aktif'}</button></td>
      <td style="white-space:nowrap">
        <button class="btn btn-ghost btn-xs" onclick="bukaResep('${esc(r.id)}')">Ubah</button>
        <button class="btn btn-ghost btn-xs" onclick="cetakResep('${esc(r.id)}',1)" title="Cetak / simpan PDF dengan harga modal">PDF</button>
      </td></tr>`;
  });
  return h+`</tbody></table></div>${pagerBar(semua.length,st.hal,nHal,st.per,mana,'resep')}</div>`;
}
/* SATU pembuat pagination untuk kedua daftar (resep & bahan). Sebelumnya
   masing-masing punya kodenya sendiri, dan yang di daftar Bahan tidak punya
   tombol maju/mundur sama sekali — angka halaman saja, yang di layar sempit
   berarti harus membidik kotak kecil. Tombolnya sekarang berlabel, bukan cuma
   panah, dan mati sendiri di ujung supaya tidak ada klik yang tidak berbuat
   apa-apa. */
/* ---- PENGURUTAN KOLOM (14 Agustus 2026, permintaan user) ----
   Satu mesin untuk semua tabel. Tiap daftar menyetor peta "kunci kolom ->
   cara mengambil nilainya"; header yang bisa diurut cukup dipanggil lewat
   thUrut(). Dibuat bersama, bukan per tabel, karena tiga tabel dengan tiga
   pengurut sendiri berarti tiga tempat yang bisa menyimpang — dan yang
   menyimpang tidak akan kelihatan sampai ada yang membandingkan hasilnya.

   Angka diurut sebagai ANGKA, teks pakai localeCompare 'id'. Tanpa itu
   "Rp1.000.000" duduk sebelum "Rp90.000" karena dibaca sebagai teks. */
const ST={F:()=>F,FB:()=>FB,FBS:()=>FBS,PK:()=>PK};
function keHal(mana,n){ ST[mana]().hal=n; render(); }
function urutKolom(mana,k){
  const s=ST[mana]();
  if(s.sortK===k) s.sortD=-(s.sortD||1); else { s.sortK=k; s.sortD=1; }
  s.hal=1; render();
}
function thUrut(mana,k,label,kelas){
  const s=ST[mana](), on=s.sortK===k;
  return `<th class="thurut ${kelas||''}${on?' on':''}" onclick="urutKolom('${mana}','${k}')" title="Urutkan menurut ${esc(label)}">${label}<span class="ar">${on?(s.sortD>0?'▲':'▼'):'↕'}</span></th>`;
}
function urutkanDaftar(list,mana,peta,bawaan){
  const s=ST[mana](), k=s.sortK||bawaan, d=s.sortD||1, amb=peta[k]||peta[bawaan];
  if(!amb) return list;
  return list.slice().sort((a,b)=>{
    const x=amb(a), y=amb(b);
    if(typeof x==='number'&&typeof y==='number') return (x-y)*d;
    return String(x==null?'':x).localeCompare(String(y==null?'':y),'id')*d;
  });
}
function pagerBar(total,hal,nHal,per,mana,satuan){
  const dari=total?((hal-1)*per+1):0, sampai=Math.min(hal*per,total);
  let b='';
  for(let i=1;i<=nHal;i++){
    if(nHal>9 && i>2 && i<nHal-1 && Math.abs(i-hal)>1){ if(i===3||i===nHal-2) b+='<span style="padding:5px 4px;color:var(--muted-2)">…</span>'; continue; }
    b+=`<button class="${i===hal?'on':''}" onclick="keHal('${mana}',${i})">${i}</button>`;
  }
  return `<div class="pager"><div class="ket">Menampilkan ${dari}–${sampai} dari ${total} ${esc(satuan)} · halaman ${hal}/${nHal}</div><div class="pg">
    <button ${hal<=1?'disabled':''} onclick="keHal('${mana}',${hal-1})">‹ Sebelumnya</button>
    ${b}
    <button ${hal>=nHal?'disabled':''} onclick="keHal('${mana}',${hal+1})">Berikutnya ›</button></div></div>`;
}

function hitungBaris(b,jenis){
  if(!b||!b.nama) return {ada:false,nilai:0};
  if(b.ref==='resep'){
    const sub=cariResep(b.nama,jenis);
    if(!sub) return {ada:false,nilai:0};
    const m=modalResep(sub); const y=num(sub.yield_qty)||1;
    return {ada:true,nilai:(m.total/y)*num(b.qty)};
  }
  const it=PB[low(b.nama)];
  if(!it) return {ada:false,nilai:0};
  return {ada:true,nilai:per1(it)*num(b.qty)};
}
function modalPratinjau(r){
  let t=0,hilang=0;
  (r.bahan||[]).forEach(b=>{ if(!b||!b.nama) return; const s=hitungBaris(b,r.jenis); if(s.ada) t+=s.nilai; else hilang++; });
  if((r.bahan||[]).length===0) t=num(r.modal_manual);
  return {total:t,hilang};
}
function ringkasEditor(m,r){
  const y=num(r.yield_qty)||1, hj=num(r.harga_baru)||num(r.harga_lama)||0;
  const c=hj>0?m.total/hj:null;
  return `<div>Modal <b>${rp(m.total)}</b> · per ${esc(r.yield_unit||'unit')} <b>${rp2(m.total/y)}</b>`
    +(hj>0?` · harga jual ${rp(hj)} → COGS <b>${pct(c)}</b> ${c>AMBANG?'<span class="chip bad">di atas '+(AMBANG*100)+'%</span>':'<span class="chip ok">sehat</span>'}`:'')
    +(m.hilang?` · <span style="color:var(--danger)">${m.hilang} baris bahannya belum dikenal</span>`:'')+`</div>`;
}
/* Mengetik qty tidak menggambar ulang seluruh modal — fokus akan lompat dari
   kotak yang sedang diketik. Yang diperbarui cuma subtotal & ringkasan. */
function segarSub(){
  if(!ED) return;
  document.querySelectorAll('[data-sub]').forEach(el=>{
    const b=ED.bahan[+el.dataset.sub]; if(!b) return;
    const s=hitungBaris(b,ED.jenis);
    el.innerHTML=s.ada?rp2(s.nilai):'<span style="color:var(--danger)">tak dikenal</span>';
  });
  const box=$('ringkasEd'); if(box) box.innerHTML=ringkasEditor(modalPratinjau(ED),ED);
}
function simpanResep(){
  if(!ED||!String(ED.nama||'').trim()){ alert('Nama resep belum diisi.'); return; }
  kirim({action:'simpanResep',data:ED},'Resep tersimpan.');
}
function hapusResep(id){
  const r=S.resep.find(x=>x.id===id); if(!r) return;
  const pakai=dipakaiOleh(r.nama).filter(x=>x.id!==id);
  if(pakai.length && !confirm(`"${r.nama}" dipakai ${pakai.length} resep lain (${pakai.slice(0,3).map(x=>x.nama).join(', ')}…).\n\nModal resep-resep itu akan kehilangan komponen ini. Tetap hapus?`)) return;
  if(!pakai.length && !confirm(`Hapus resep "${r.nama}"?`)) return;
  kirim({action:'hapusResep',id:id},'Resep dihapus.');
}

/* ====================== 2. BAHAN & HARGA ====================== */
let FB={q:'',hal:1,per:25,st:'',kembar:false};
function viewBahan(){
  const q=low(FB.q);
  /* NAMA YANG SUDAH ADA DI DAFTAR RESEP DISEMBUNYIKAN dari sini (14 Agustus
     2026, permintaan user). Halaman ini isinya BAHAN BAKU RAW; barang yang
     dibuat sendiri hidup sebagai resep, dan memajangnya di dua tempat membuat
     orang mengubah harga di satu sisi lalu bingung kenapa modal tidak bergerak
     — penghitung modal mengambil sisi resep lebih dulu (lihat modalResep). */
  const namaResep={}; S.resep.forEach(r=>{ namaResep[low(r.nama)]=1; });
  const kembar=S.bahan.filter(b=>namaResep[low(b.nama)]);
  const kasar=S.bahan.filter(b=>{
    if(!FB.kembar&&namaResep[low(b.nama)]) return false;
    /* Saringan keadaan purchasing (14 Agustus 2026, permintaan user). Dulu cuma
       centang "belum ada di purchasing saja" — sekarang keempat keadaannya bisa
       dipilih, termasuk "tidak perlu di purchasing" yang justru paling sering
       ingin ditinjau ulang. */
    if(FB.st&&statusPur(b).k!==FB.st) return false;
    return !q||low(b.nama).indexOf(q)>-1||low(vendorOf(b)).indexOf(q)>-1;
  });
  const semua=urutkanDaftar(kasar,'FB',{
    nama:b=>low(b.nama), vendor:b=>low(vendorOf(b)), qty:b=>num(b.qty_beli),
    satuan:b=>low(b.satuan||''), harga:b=>num(b.harga_beli), per1:b=>per1(b),
    dipakai:b=>dipakaiOleh(b.nama).length
  },'nama');
  const nHal=Math.max(1,Math.ceil(semua.length/FB.per));
  if(FB.hal>nHal) FB.hal=nHal;
  const hal=semua.slice((FB.hal-1)*FB.per,FB.hal*FB.per);
  let h=spanduSamakan()+spanduTarik()+spanduBelumTerdaftar()+`<div class="card">
    <div class="bar">
      <input type="search" id="qb" placeholder="Cari bahan atau vendor…" value="${esc(FB.q)}" oninput="cari(this,v=>{FB.q=v;FB.hal=1})">
      <select onchange="FB.st=this.value;FB.hal=1;render()" title="Saring menurut keadaannya di purchasing">
        ${[['','Semua keadaan'],['ada','✓ Ada di purchasing'],['belum','• Belum di purchasing'],
           ['mandiri','⃠ Tidak perlu di purchasing'],['beda','⚠ Nama beda']]
          .map(o=>`<option value="${o[0]}"${FB.st===o[0]?' selected':''}>${o[1]}${o[0]?' ('+S.bahan.filter(b=>statusPur(b).k===o[0]).length+')':''}</option>`).join('')}
      </select>
      ${kembar.length?`<label style="display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted)" title="${kembar.length} nama juga terdaftar sebagai resep">
        <input type="checkbox" ${FB.kembar?'checked':''} onchange="FB.kembar=this.checked;FB.hal=1;render()" style="accent-color:var(--gold)"> tampilkan ${kembar.length} yang bernama sama dengan resep</label>`:''}
      <button class="btn btn-primary btn-sm" onclick="bukaBahan('')">+ Bahan Baru</button>
    </div>
    ${kembar.length&&!FB.kembar?`<div class="ket" style="font-size:12px;color:var(--muted);margin:-4px 0 10px">
      ${kembar.length} nama disembunyikan karena sudah ada di <b>Daftar Resep</b> (${esc(kembar.slice(0,4).map(b=>b.nama).join(', '))}${kembar.length>4?', …':''}) — barang yang dibuat sendiri diurus di sana, bukan di sini.</div>`:''}
    <div class="tbl-wrap"><table><thead><tr>
      ${thUrut('FB','nama','Bahan')}${thUrut('FB','vendor','Vendor')}
      ${thUrut('FB','qty','Qty beli','num')}${thUrut('FB','satuan','Satuan')}
      ${thUrut('FB','harga','Harga beli','num')}${thUrut('FB','per1','Harga / satuan','num')}
      ${thUrut('FB','dipakai','Dipakai','num')}<th></th>
    </tr></thead><tbody>`;
  hal.forEach(b=>{
    const n=dipakaiOleh(b.nama).length, st=statusPur(b);
    h+=`<tr>
      <td><b>${esc(b.nama)}</b>${st.k==='ada'?''
        :` <span class="chip ${st.c}" title="${st.k==='beda'?'sudah punya pasangan di purchasing ('+esc(b.produk)+') — tinggal disamakan namanya':st.k==='mandiri'?'ditandai tidak dibeli lewat purchasing':'nama ini belum ada di basis bahan baku purchasing'}">${st.t}</span>`}</td>
      <td style="font-size:12px">${vendorOf(b)?esc(vendorOf(b)):'<span style="color:var(--muted-2)">—</span>'}</td>
      <td class="num mono">${num(b.qty_beli).toLocaleString('id-ID')}</td>
      <td>${esc(b.satuan||'')}</td>
      <td class="num mono">${rp(b.harga_beli)}</td>
      <td class="num mono"><b>${rp2(per1(b))}</b></td>
      <td class="num">${n
        ? `<button class="btn btn-ghost btn-xs" onclick="lihatPakai('${esc(b.nama)}')" title="Lihat resep mana saja yang memakainya">${n} resep</button>`
        : '<span style="color:var(--muted-2)">0</span>'}</td>
      <td style="white-space:nowrap"><button class="btn btn-ghost btn-xs" onclick="bukaBahan('${esc(b.nama)}')">Ubah</button>
        ${st.k==='belum'?`<button class="btn btn-ghost btn-xs" onclick="daftarkanKePurchasing('${esc(b.nama)}')" title="Tambahkan nama ini ke basis bahan baku purchasing">+ Purchasing</button>`:''}</td></tr>`;
  });
  h+=`</tbody></table></div>${pagerBar(semua.length,FB.hal,nHal,FB.per,'FB','bahan')}</div>`;
  return h;
}
let EB=null;
/* "DIPAKAI KE MANA" (14 Agustus 2026, permintaan user). Angka di kolom Dipakai
   sebelumnya cuma jumlah — tahu 11 resep memakai sebuah bahan tapi tidak tahu
   yang mana, jadi tiap perubahan harga atau takaran berujung menyisir 365 resep
   satu-satu. Sekarang angkanya tombol: daftar resep pemakainya keluar berikut
   takaran di baris itu, kontribusinya ke modal resep tersebut, dan jalan
   langsung ke penyuntingnya.

   Diurut menurut KONTRIBUSI, bukan nama: kalau harga bahan ini naik, resep di
   baris atas itulah yang paling goyang, dan itu yang perlu diputuskan lebih
   dulu. */
function lihatPakai(nama){
  const b=PB[low(nama)];
  const pakai=dipakaiOleh(nama).map(r=>{
    const baris=(r.bahan||[]).filter(x=>x&&low(x.nama)===low(nama));
    const qty=baris.reduce((s,x)=>s+num(x.qty),0);
    const sat=(baris[0]&&baris[0].satuan)||(b&&b.satuan)||'';
    const ref=(baris[0]&&baris[0].ref==='resep')?'resep':'bahan';
    const nilai=baris.reduce((s,x)=>s+hitungBaris(x,r.jenis).nilai,0);
    const m=modalMenu(r).total;
    return {r,qty,sat,ref,nilai,porsi:m>0?nilai/m:0};
  }).sort((a,b2)=>b2.nilai-a.nilai);
  $('modal').innerHTML=`<div class="ovl" onclick="if(event.target===this)tutupModal()"><div class="mdl" style="max-width:760px">
    <div class="mdl-h"><div><h3>${esc(nama)} dipakai di ${pakai.length} resep</h3>
      <div class="card-sub" style="margin:0">Harga sekarang <b>${rp2(per1(b||{}))}</b> per ${esc((b&&b.satuan)||'unit')}. Urut menurut seberapa besar bahan ini menyumbang modal resepnya.</div></div>
      <button class="btn btn-ghost btn-sm" onclick="tutupModal()">Tutup</button></div>
    <div class="mdl-b">
      ${pakai.length?`<div class="tbl-wrap"><table><thead><tr>
        <th>Resep</th><th>Tipe</th><th class="num">Takaran</th><th class="num">Nilai di resep</th><th class="num">Porsi modal</th><th></th>
      </tr></thead><tbody>
      ${pakai.map(p=>`<tr>
        <td><b>${esc(p.r.nama)}</b>${p.ref==='resep'?' <span class="chip info" title="dirujuk sebagai resep, bukan bahan mentah">via resep</span>':''}
          <div style="font-size:11px;color:var(--muted-2)">${esc(p.r.seksi||'')}</div></td>
        <td>${p.r.tipe==='base'?'<span class="chip info">Base</span>':'<span class="chip warn">Menu jadi</span>'}</td>
        <td class="num mono">${p.qty} ${esc(p.sat)}</td>
        <td class="num mono">${rp2(p.nilai)}</td>
        <td class="num">${p.porsi?pct(p.porsi):'—'}</td>
        <td><button class="btn btn-primary btn-xs" onclick="bukaResep('${esc(p.r.id)}')">Ubah resep →</button></td>
      </tr>`).join('')}
      </tbody></table></div>`:'<div class="empty">Belum dipakai resep mana pun.</div>'}
    </div>
    <div class="mdl-f"><button class="btn btn-ghost btn-sm" onclick="bukaBahan('${esc(nama)}')">Ubah harga bahan ini</button>
      <button class="btn btn-ghost" onclick="tutupModal()">Tutup</button></div></div></div>`;
}
/* Mengubah saklar purchasing mengubah keterangan di jendela yang sama (chip
   status, kalimat penjelas), jadi jendelanya digambar ulang — bukan seluruh
   halaman, supaya isian lain yang sedang diketik tidak hilang. */
function gambarUlangBahan(){ if(EB) bukaBahan(EB.namaLama||EB.nama,true); }

     tetap dipakai, bukan dibaca ulang dari data tersimpan. */
  if(!pertahankan||!EB){
    EB=b?Object.assign({namaLama:b.nama},JSON.parse(JSON.stringify(b)))
        :{nama:'',satuan:'Gr',qty_beli:1000,harga_beli:0,vendor:'',produk:'',kategori:'',catatan:'',di_purchasing:1};
  }
  const opsi=Object.keys(PRODUK).sort().map(p=>`<option value="${esc(p)}">`).join('');
  $('modal').innerHTML=`<div class="ovl" onclick="if(event.target===this)tutupModal()"><div class="mdl" style="max-width:620px">
    <div class="mdl-h"><h3>${b?'Ubah Bahan':'Bahan Baru'}</h3>
      <button class="btn btn-ghost btn-sm" onclick="tutupModal()">Tutup</button></div>

      <datalist id="dlProduk">${opsi}</datalist>

        <input list="dlProduk" value="${esc(EB.nama)}" oninput="EB.nama=this.value"></div>
      <div class="g3">
        <div class="field"><label>Qty beli</label>
          <input inputmode="numeric" value="${fmtIn(EB.qty_beli)}" oninput="angkaKetik(this,v=>{EB.qty_beli=v});segarPer1()"></div>
        <div class="field"><label>Satuan</label><input value="${esc(EB.satuan||'')}" oninput="EB.satuan=this.value"></div>
        <div class="field"><label>Harga beli <span style="font-weight:400;color:var(--muted)">(Rp)</span></label>
          <input inputmode="numeric" value="${fmtIn(EB.harga_beli)}" oninput="angkaKetik(this,v=>{EB.harga_beli=v});segarPer1()"></div>
      </div>
      <div class="notice info" id="per1Box"></div>
      <!-- Nama bahan DI ATAS itu sendiri kunci ke purchasing — tidak ada lagi
           kolom "pasangan". Kotak nama memakai daftar purchasing sebagai saran
           ketik supaya nama baru yang diketik cenderung sama sejak awal. -->
      <div class="notice ${statusPur(EB).k==='ada'?'ok':statusPur(EB).k==='beda'?'warn':'info'}" id="pkBox">${
        statusPur(EB).k==='ada'
          ? `✓ Nama ini ada di purchasing — vendornya <b>${esc((PRODUK[EB.nama]||{}).utama||'belum diisi di sana')}</b>, dibaca langsung dari sana.`
        : statusPur(EB).k==='beda'
          ? `⚠ Bahan ini berpasangan dengan <b>${esc(EB.produk)}</b> di purchasing, tapi namanya masih berbeda. Samakan lewat tombol di halaman Bahan &amp; Harga — resep yang memakainya ikut disesuaikan.`
        : statusPur(EB).k==='mandiri'
          ? `Ditandai tidak dibeli lewat purchasing.`
          : `⚠ Nama ini belum ada di basis purchasing. Bahannya tetap terpakai penuh di resep; daftarkan kalau memang barang yang dibeli.`}</div>
      <label style="display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--ink);margin-bottom:10px">
        <input type="checkbox" ${EB.di_purchasing===0?'':'checked'} onchange="EB.di_purchasing=this.checked?1:0;gambarUlangBahan()" style="accent-color:var(--gold)">
        Bahan ini <b>dibeli lewat Purchasing</b> — harus berdiri juga di daftar bahan baku mereka</label>
      <div class="ket" style="font-size:11.5px;color:var(--muted-2);margin:-6px 0 12px">Matikan untuk bahan yang tidak pernah dibeli ke vendor (air keran, es dari mesin sendiri). Ia berhenti dihitung sebagai pekerjaan yang tertinggal, dan tidak akan didaftarkan ke sana.</div>
      ${b&&statusPur(EB).k==='ada'?`<label style="display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:12px">
        <input type="checkbox" id="ikutPur" checked style="accent-color:var(--gold)">
        Kalau namanya diganti, ganti juga di basis purchasing — supaya kedua daftar tidak pernah berbeda</label>
      <div class="ket" style="font-size:11.5px;color:var(--muted-2);margin:-6px 0 12px">Arah sebaliknya berjalan sendiri: bahan yang diganti namanya di modul Purchasing otomatis ikut berubah di sini, berikut baris resep yang memakainya.</div>`:''}
      <div class="field"><label>Catatan</label><input value="${esc(EB.catatan||'')}" oninput="EB.catatan=this.value"></div>
    </div>
    <div class="mdl-f">
      ${b?`<button class="btn btn-danger btn-sm" onclick="hapusBahan('${esc(b.nama)}')">Hapus</button>`:''}
      <button class="btn btn-ghost" onclick="tutupModal()">Batal</button>
      <button class="btn btn-primary" onclick="simpanBahan()">💾 Simpan</button>
    </div></div></div>`;
  segarPer1();
}
function segarPer1(){
  const el=$('per1Box'); if(!el||!EB) return;
  const q=num(EB.qty_beli), hg=num(EB.harga_beli);
  el.innerHTML=q>0
    ? `<div>Harga per satuan: <b>${rp2(hg/q)}</b> per ${esc(EB.satuan||'unit')} — inilah angka yang dipakai semua resep.</div>`
    : `<div>Qty beli harus lebih dari 0, kalau tidak harga per satuannya tidak bisa dihitung.</div>`;
}
/* GANTI NAMA MENGUBAH KEDUA SISI (permintaan user 14 Agustus 2026: "kalau saya
   ubah nama, yang di bahan & harga juga ikut berubah"). Karena kedua modul
   sekarang memakai satu daftar nama, mengganti nama hanya di satu sisi justru
   MEMUTUS kaitannya — bahan yang tadinya dikenal jadi "belum ada di
   purchasing" tanpa ada yang mengubah apa pun di sana.

   Purchasing diberi tahu lewat addProduct berikut `oldProductName`; itu jalur
   ganti-nama miliknya sendiri, jadi order lama tetap menunjuk barang yang sama.
   Kalau purchasing menolak, penggantian di HPP TETAP jalan dan pesannya
   disebutkan — data HPP tidak boleh tersandera modul tetangga. */
function simpanBahan(){
  const lama=EB.namaLama||'', baru=String(EB.nama||'').trim();
  if(!baru){ alert('Nama bahan belum diisi.'); return; }
  const kotak=$('ikutPur');
  const ikut=!!(kotak&&kotak.checked&&lama&&lama!==baru&&PRODUK[lama]);
  if(!ikut){ kirim({action:'simpanBahan',data:EB},'Bahan tersimpan.'); return; }
  const p=PRODUK[lama]||{};
  fetch(API_ITEM,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'addProduct',productName:baru,oldProductName:lama,
        primaryVendor:p.utama||'',backupVendors:p.cadangan||[],units:p.satuan||[]})})
    .then(r=>r.text())
    .then(t=>{
      let j=null; try{ j=JSON.parse(t); }catch(e){}
      if(j&&j.status==='error') throw new Error(j.message||'ditolak purchasing');
      return muatProduk();
    })
    .catch(e=>{ pesan(`<div class="notice warn">⚠ Nama di purchasing TIDAK ikut berubah (${esc(e.message||'')}). Nama di HPP tetap disimpan — samakan manual di modul Purchasing.</div>`); })
    .then(()=>kirim({action:'simpanBahan',data:EB},'Bahan tersimpan, nama purchasing ikut disesuaikan.'));
}
function hapusBahan(nama){
  const n=dipakaiOleh(nama).length;
  if(n && !confirm(`"${nama}" dipakai ${n} resep. Modalnya akan kehilangan komponen ini. Tetap hapus?`)) return;
  if(!n && !confirm(`Hapus bahan "${nama}"?`)) return;
  kirim({action:'hapusBahan',nama:nama},'Bahan dihapus.');
}

/* ====================== SATU DAFTAR NAMA DENGAN PURCHASING ======================
   14 Agustus 2026, permintaan user: pencocokan dihapus sebagai konsep. Nama
   bahan di HPP HARUS sama persis dengan nama di basis bahan baku purchasing,
   supaya bahan baru di sana langsung terpakai di sini tanpa ada yang perlu
   menyandingkan.

   Konsekuensi yang disengaja: vendor TIDAK lagi disimpan di sini, melainkan
   dibaca langsung dari purchasing tiap kali digambar. Vendor yang disalin akan
   basi diam-diam begitu purchasing ganti pemasok — dan tidak ada satu pun
   layar yang akan memberitahu. */
const adaDiPurchasing=nama=>!!PRODUK[nama];
/* Keadaan sebuah bahan terhadap purchasing. EMPAT keadaan, bukan dua —
   "ada" vs "belum ada" saja pernah membuat bahan yang SUDAH disandingkan user
   tetap tertulis "belum ada di purchasing", dan itu terbaca seperti pekerjaan
   yang hilang padahal cuma namanya yang belum diganti. */
function statusPur(b){
  if(PRODUK[b.nama]) return {k:'ada',t:'',c:''};
  /* Saklar "perlu ada di purchasing" (14 Agustus 2026). Bahan yang memang tidak
     dibeli lewat purchasing BUKAN pekerjaan yang tertinggal — ia tidak boleh
     ikut menghitung di spanduk, kalau tidak angkanya tidak pernah bisa nol dan
     spanduknya jadi peringatan abadi yang berhenti dibaca orang. */
  if(b.di_purchasing===0||b.produk==='-') return {k:'mandiri',t:'tidak perlu di purchasing',c:'mute'};
  if(b.produk&&PRODUK[b.produk]) return {k:'beda',t:'nama beda',c:'warn'};
  return {k:'belum',t:'belum di purchasing',c:'info'};
}
function vendorOf(b){
  /* Vendor selalu dari purchasing — lewat nama kalau sudah sama, lewat pasangan
     lama selama namanya belum disamakan. Yang tersimpan di hpp_bahan cuma
     cadangan untuk bahan yang memang tidak ada di sana. */
  const p=PRODUK[b.nama]||(b.produk&&b.produk!=='-'?PRODUK[b.produk]:null);
  if(p&&p.utama) return p.utama;
  return b.vendor||'';
}
/* Sisa pekerjaan dari masa pencocokan: bahan yang namanya masih beda dari
   nama purchasing pasangannya. Sekali klik, seluruhnya diganti nama dan semua
   baris resep yang merujuknya ikut ditambal server. */
function spanduSamakan(){
  const punyaNama={}; S.bahan.forEach(b=>{ punyaNama[b.nama]=1; });
  const beda=S.bahan.filter(b=>b.produk&&b.produk!=='-'&&b.produk!==b.nama);
  /* DIPISAH: yang bisa diganti namanya, dan yang tujuannya sudah dipakai bahan
     lain. Sebelumnya keduanya dihitung jadi satu, jadi tombolnya tetap muncul
     sesudah diklik dan selalu memulangkan "0 disamakan, N dilewati" — tombol
     yang mustahil menyelesaikan pekerjaannya sendiri. Yang bentrok sekarang
     punya jalan keluarnya masing-masing. */
  const bisa=beda.filter(b=>!punyaNama[b.produk]);
  const bentrok=beda.filter(b=>punyaNama[b.produk]);
  const sisa=S.bahan.filter(b=>b.produk&&b.produk!=='-'&&b.produk===b.nama);
  let h='';
  if(bisa.length||sisa.length){
    h+=`<div class="notice warn"><div>
      <b>${bisa.length} bahan namanya masih berbeda dari purchasing</b>${sisa.length?` (dan ${sisa.length} sudah sama, tinggal dibersihkan penandanya)`:''}.
      Pasangan yang dulu Anda buat dipakai sekali untuk <b>mengganti namanya</b> — resep yang memakainya ikut disesuaikan otomatis.
      ${bisa.length?`<div style="margin-top:6px;font-size:12px;color:var(--muted)">Contoh: ${bisa.slice(0,4).map(b=>esc(b.nama)+' → '+esc(b.produk)).join(' · ')}</div>`:''}
      <div style="margin-top:9px"><button class="btn btn-primary btn-sm" onclick="samakanNama()">🔤 Samakan nama dengan purchasing</button></div>
    </div></div>`;
  }
  if(bentrok.length){
    h+=`<div class="notice bad"><div>
      <b>${bentrok.length} pasangan tidak bisa disamakan otomatis</b> — nama tujuannya sudah dipakai bahan lain di sini, dan menggabung dua bahan berharga beda itu keputusan Anda, bukan skrip.
      <div class="tbl-wrap" style="margin-top:10px"><table><thead><tr><th>Bahan HPP</th><th>Dipasangkan ke</th><th class="num">Dipakai</th><th></th></tr></thead><tbody>
      ${bentrok.map(b=>`<tr>
        <td><b>${esc(b.nama)}</b> <span style="color:var(--muted-2)">${rp2(per1(b))}</span></td>
        <td>${esc(b.produk)} <span style="color:var(--muted-2)">${rp2(per1(S.bahan.find(x=>x.nama===b.produk)||{}))}</span></td>
        <td class="num">${dipakaiOleh(b.nama).length}</td>
        <td style="white-space:nowrap">
          <button class="btn btn-ghost btn-xs" onclick="lepasPasangan('${esc(b.nama)}')">Lepas pasangan</button>
          <button class="btn btn-danger btn-xs" onclick="gabungBahan('${esc(b.nama)}','${esc(b.produk)}')">Gabungkan</button></td></tr>`).join('')}
      </tbody></table></div>
      <div class="ket" style="font-size:11.5px;margin-top:8px;color:var(--muted)"><b>Lepas</b> = keduanya tetap berdiri sendiri (pilih ini kalau pasangannya memang salah, mis. Tomat Chery ≠ Tomato Paste). <b>Gabungkan</b> = resep yang memakai bahan kiri dialihkan ke bahan kanan, lalu yang kiri dihapus.</div>
    </div></div>`;
  }
  return h;
}
function lepasPasangan(nama){
  const b=S.bahan.find(x=>x.nama===nama); if(!b) return;
  if(!confirm(`Lepas pasangan "${nama}" dari "${b.produk}"?\n\nTidak ada yang dihapus — keduanya tetap berdiri sendiri.`)) return;
  kirim({action:'simpanBahan',data:Object.assign({},b,{produk:''})},'Pasangan dilepas.');
}
function gabungBahan(dari,ke){
  const a=S.bahan.find(x=>x.nama===dari), n=dipakaiOleh(dari).length;
  if(!a) return;
  if(!confirm(`Gabungkan "${dari}" ke "${ke}"?\n\n${n} resep yang memakai "${dari}" akan dialihkan memakai "${ke}", lalu "${dari}" dihapus.\n\nHarga "${ke}" tidak diubah. Tidak bisa dibatalkan.`)) return;
  kirim({action:'gabungBahan',dari:dari,ke:ke},`"${dari}" digabungkan ke "${ke}".`);
}
/* Produk purchasing yang belum punya baris di HPP. Sejak penambahan disambung
   dua arah, ini cuma sisa sejarah — produk yang sudah berdiri di sana sebelum
   penyambungannya dibuat. Ditarik sekali, lalu spanduknya hilang selamanya. */
function spanduTarik(){
  const nama=Object.keys(PRODUK);
  if(!nama.length) return '';
  const adaHpp={}; S.bahan.forEach(b=>{ adaHpp[b.nama]=1; });
  const kurang=nama.filter(n=>!adaHpp[n]);
  if(!kurang.length) return '';
  return `<div class="notice warn"><div>
    <b>${kurang.length} bahan ada di Purchasing tapi belum ada di sini.</b>
    Sejak sekarang bahan baru dari sana masuk sendiri — yang ini sisa yang sudah berdiri lebih dulu.
    Tarik sekali supaya kedua daftar benar-benar sama; harganya dibiarkan nol untuk diisi belakangan.
    <div style="margin-top:6px;font-size:12px;color:var(--muted)">Contoh: ${kurang.slice(0,5).map(esc).join(' · ')}</div>
    <div style="margin-top:9px"><button class="btn btn-primary btn-sm" onclick="tarikProduk()">⬇ Tarik ${kurang.length} bahan dari Purchasing</button></div>
  </div></div>`;
}
function tarikProduk(){
  if(!confirm('Tarik semua bahan purchasing yang belum ada di sini?\n\nBarisnya dibuat dengan harga nol — tidak ada harga yang ditimpa.')) return;
  setSync('','Menarik…');
  fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'tarikProduk',by:(ME&&ME.name)||''})})
    .then(r=>r.text()).then(t=>{
      let j=null; try{ j=JSON.parse(t); }catch(e){}
      if(!j||j.status==='error') throw new Error((j&&j.message)||'balasan bukan JSON');
      pesan(`<div class="notice ok">✓ ${j.ditarik} bahan ditarik dari Purchasing. Harganya masih nol — isi lewat tombol Ubah.</div>`);
      return muat();
    })
    .catch(e=>{ setSync('err','✕ Gagal'); pesan(`<div class="notice bad">✕ Gagal menarik: ${esc(e.message||'')}</div>`); });
}
function spanduBelumTerdaftar(){
  if(!Object.keys(PRODUK).length) return `<div class="notice bad">✕ Basis bahan baku purchasing tidak bisa dibaca, jadi kolom vendor kosong dan penanda "belum di purchasing" tidak bisa dipercaya. Coba muat ulang halaman.</div>`;
  const blm=S.bahan.filter(b=>statusPur(b).k==='belum');
  const mandiri=S.bahan.filter(b=>statusPur(b).k==='mandiri').length;
  if(!blm.length) return '';
  return `<div class="notice info"><div>
    <b>${blm.length} bahan belum ada di basis purchasing.</b>${mandiri?` (${mandiri} lagi Anda tandai tidak dibeli lewat purchasing — itu tidak dihitung di sini.)`:''}
    Mereka tetap terpakai penuh di resep — yang belum cuma vendornya.
    Daftarkan supaya keduanya benar-benar satu daftar; purchasing bisa mengisi vendornya belakangan.
    <div style="margin-top:9px"><button class="btn btn-ghost btn-sm" onclick="FB.st='belum';FB.hal=1;render()">Lihat daftarnya</button>
    <button class="btn btn-ghost btn-sm" onclick="daftarkanSemua()">+ Daftarkan semuanya ke Purchasing</button></div>
  </div></div>`;
}
function samakanNama(){
  if(!confirm('Ganti nama bahan HPP mengikuti nama purchasing pasangannya?\n\nSeluruh baris resep yang merujuk nama lama ikut disesuaikan. Nama yang tujuannya sudah dipakai bahan lain akan dilewati dan dilaporkan.')) return;
  setSync('','Menyamakan…');
  fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'samakanNama',by:(ME&&ME.name)||''})})
    .then(r=>r.text()).then(t=>{
      let j=null; try{ j=JSON.parse(t); }catch(e){}
      if(!j||j.status==='error') throw new Error((j&&j.message)||'balasan bukan JSON');
      pesan(`<div class="notice ok">✓ ${j.ganti} nama disamakan${j.bersih?`, ${j.bersih} sudah sama`:''}.${
        (j.bentrok&&j.bentrok.length)?` <b>${j.bentrok.length} dilewati karena nama tujuannya sudah dipakai bahan lain</b> — gabungkan manual: ${esc(j.bentrok.slice(0,5).join(', '))}`:''}</div>`);
      return muat();
    })
    .catch(e=>{ setSync('err','✕ Gagal'); pesan(`<div class="notice bad">✕ Gagal: ${esc(e.message||'')}</div>`); });
}
/* Menulis ke basis purchasing — modul TETANGGA. Yang dikirim cuma nama +
   satuan; vendor, kategori, dan cara beli sengaja dibiarkan kosong supaya
   purchasing yang memutuskannya. Menebak isian milik modul lain berarti
   mengarang data atas nama orang lain. */
/* Bahan BARU yang dibuat dari layar ini didaftarkan ke purchasing oleh SERVER
   (lihat simpanBahan di stock-mysql/hpp.php), bukan dari sini — supaya jalurnya
   satu dan tidak bergantung pada layar mana yang dipakai. Tombol di bawah
   khusus untuk bahan LAMA yang terlanjur berdiri sendiri. */
function daftarkanKePurchasing(nama){
  const b=S.bahan.find(x=>x.nama===nama); if(!b) return;
  if(!confirm(`Tambahkan "${nama}" ke basis bahan baku purchasing?\n\nVendor & kategorinya dikosongkan — biar purchasing yang mengisi.`)) return;
  kirimProduk([b]);
}
function daftarkanSemua(){
  const blm=S.bahan.filter(b=>!adaDiPurchasing(b.nama));
  if(!blm.length) return;
  if(!confirm(`Tambahkan ${blm.length} bahan ke basis bahan baku purchasing?\n\nSemuanya masuk tanpa vendor & kategori; purchasing mengisinya belakangan.`)) return;
  kirimProduk(blm);
}
function kirimProduk(daftar){
  setSync('','Mendaftarkan…');
  const satu=b=>fetch(API_ITEM,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'addProduct',productName:b.nama,primaryVendor:b.vendor||'',
                           backupVendors:[],oldProductName:'',units:b.satuan?[b.satuan]:[]})})
    .then(r=>r.text());
  /* Berurutan, bukan serentak: purchasing menyimpan peta produk sebagai satu
     blob per baris, dan 130 permintaan bersamaan membuat yang belakangan
     menimpa yang duluan. Lambat sedikit, tapi tidak ada yang hilang. */
  let i=0, gagal=0;
  const lanjut=()=>{
    if(i>=daftar.length){
      return muatProduk().then(()=>{
        setSync('ok','✓ Tersambung');
        pesan(`<div class="notice ${gagal?'warn':'ok'}">✓ ${daftar.length-gagal} bahan terdaftar di purchasing${gagal?`, ${gagal} gagal`:''}.</div>`);
        render();
      });
    }
    const b=daftar[i++];
    return satu(b).catch(()=>{gagal++;}).then(lanjut);
  };
  lanjut();
}

/* ====================== 4. DASHBOARD HPP ====================== */
function kartu(lab,val,foot,kelas){
  return `<div class="stat ${kelas||''}"><div class="lab">${esc(lab)}</div><div class="val mono">${val}</div><div class="foot">${foot}</div></div>`;
}
/* Pemakaian bahan mentah, DIURAI sampai dasar: dish → base → bahan. Inilah
   angka yang menjawab "kalau harga ayam naik 10%, HPP goyang berapa" — dan
   satu-satunya cara mendapatkannya di Excel adalah menjumlahkan manual lintas
   sheet, jadi praktis tidak pernah dilakukan. */
function uraiBahan(r,faktor,keranjang,jalur){
  jalur=jalur||{}; if(jalur[r.id]) return; jalur[r.id]=1;
  (r.bahan||[]).forEach(b=>{
    if(!b||!b.nama) return;
    if(b.ref==='resep'){
      const sub=cariResep(b.nama,r.jenis); if(!sub) return;
      const y=num(sub.yield_qty)||1;
      uraiBahan(sub,faktor*(num(b.qty)/y),keranjang,jalur);
    }else{
      const it=PB[low(b.nama)]; if(!it) return;
      const k=it.nama;
      keranjang[k]=keranjang[k]||{nama:k,nilai:0,menu:{}};
      keranjang[k].nilai+=per1(it)*num(b.qty)*faktor;
    }
  });
  delete jalur[r.id];
}
function viewDash(){
  const dish=S.resep.filter(r=>r.tipe==='dish'&&r.aktif!==0);   // resep non-aktif tidak ikut dinilai
  const berharga=dish.filter(r=>hargaJual(r)>0);
  const cogsList=berharga.map(r=>({r,c:cogsOf(r)})).filter(x=>x.c!==null);
  const rata=j=>{ const l=cogsList.filter(x=>x.r.jenis===j); return l.length?l.reduce((s,x)=>s+x.c,0)/l.length:null; };
  const lewat=cogsList.filter(x=>x.c>AMBANG);
  const hilangTot=new Set(); S.resep.forEach(r=>modalMenu(r).hilang.forEach(n=>hilangTot.add(n)));

  let h=`<div class="row-in">
    ${kartu('COGS rata-rata Food',rata('food')===null?'—':pct(rata('food')),cogsList.filter(x=>x.r.jenis==='food').length+' menu berharga','accent')}
    ${kartu('COGS rata-rata Drink',rata('drink')===null?'—':pct(rata('drink')),cogsList.filter(x=>x.r.jenis==='drink').length+' menu berharga','')}
    ${kartu('Lewat ambang '+(AMBANG*100)+'%',lewat.length,'menu yang modalnya terlalu tinggi','')}
    ${kartu('Resep tercatat',S.resep.length,dish.length+' menu jadi · '+(S.resep.length-dish.length)+' base','')}
    ${kartu('Bahan tercatat',S.bahan.length,'sumber seluruh angka modal','')}
    ${kartu('Bahan belum dikenal',hilangTot.size,hilangTot.size?'modal resepnya masih kurang lengkap':'semua rujukan bahan ketemu',hilangTot.size?'':'')}
  </div>`;

  if(hilangTot.size) h+=`<div class="notice warn">⚠ <b>${hilangTot.size} nama bahan dirujuk resep tapi tidak ada di daftar Bahan</b>, jadi modal resep yang memakainya lebih rendah dari yang sebenarnya. Contoh: ${[...hilangTot].slice(0,6).map(esc).join(', ')}. Tambahkan lewat menu <b>Bahan &amp; Harga</b>.</div>`;

  /* --- sebaran COGS --- */
  const ember=[{l:'< 20%',f:c=>c<0.20},{l:'20–25%',f:c=>c>=0.20&&c<0.25},{l:'25–30%',f:c=>c>=0.25&&c<0.30},
               {l:'30–33%',f:c=>c>=0.30&&c<=AMBANG},{l:'> 33%',f:c=>c>AMBANG,bahaya:1}];
  const maks=Math.max(1,...ember.map(e=>cogsList.filter(x=>e.f(x.c)).length));
  h+=`<div class="card"><h3>Sebaran COGS</h3><div class="card-sub">Menu berharga jual, ${cogsList.length} menu.</div><div class="dist">`;
  ember.forEach(e=>{
    const n=cogsList.filter(x=>e.f(x.c)).length;
    h+=`<div class="d ${e.bahaya?'bahaya':''}"><div>${e.l}</div><div class="t"><i style="width:${Math.round(n/maks*100)}%"></i></div><div class="num">${n}</div></div>`;
  });
  h+=`</div></div>`;

  /* --- menu paling boros --- */
  h+=`<div class="card"><h3>Menu paling boros</h3>
    <div class="card-sub">Urut COGS% tertinggi. "Harga ideal" = harga jual yang membuat COGS-nya pas ${AMBANG*100}%.</div>
    <div class="tbl-wrap"><table><thead><tr><th>Menu</th><th>Jenis</th><th class="num">Modal</th><th class="num">Harga jual</th><th class="num">COGS%</th><th class="num">Harga ideal</th><th class="num">Selisih</th></tr></thead><tbody>`;
  cogsList.sort((a,b)=>b.c-a.c).slice(0,15).forEach(x=>{
    const m=modalMenu(x.r).total, hj=hargaJual(x.r), ideal=m/AMBANG;
    h+=`<tr><td><b>${esc(x.r.nama)}</b></td><td>${x.r.jenis==='drink'?'Drink':'Food'}</td>
      <td class="num mono">${rp(m)}</td><td class="num mono">${rp(hj)}</td><td class="num">${chipCogs(x.c,x.r)}</td>
      <td class="num mono">${rp(ideal)}</td>
      <td class="num mono" style="color:${ideal>hj?'var(--danger)':'var(--ok)'}">${ideal>hj?'+':''}${rp(ideal-hj)}</td></tr>`;
  });
  h+=`</tbody></table></div></div>`;

  /* --- sensitivitas bahan --- */
  const keranjang={};
  dish.forEach(r=>{
    const sebelum=Object.keys(keranjang).length;
    uraiBahan(r,1,keranjang,{});
    Object.keys(keranjang).forEach(k=>{ if(keranjang[k].nilai>0) keranjang[k].menu[r.id]=1; });
    void sebelum;
  });
  const sens=Object.values(keranjang).sort((a,b)=>b.nilai-a.nilai).slice(0,15);
  const totalNilai=Object.values(keranjang).reduce((s,x)=>s+x.nilai,0)||1;
  h+=`<div class="card"><h3>Bahan yang paling menggerakkan HPP</h3>
    <div class="card-sub">Nilai pemakaian = jumlah rupiah bahan ini di dalam <b>satu porsi setiap menu</b>, sudah diurai lewat base-nya. Kolom terakhir: tambahan modal seluruh menu kalau harganya naik 10%.</div>
    <div class="tbl-wrap"><table><thead><tr><th>Bahan</th><th class="num">Harga/satuan</th><th class="num">Nilai pemakaian</th><th class="num">Porsi dari total</th><th class="num">Jika naik 10%</th></tr></thead><tbody>`;
  sens.forEach(x=>{
    const b=PB[low(x.nama)];
    h+=`<tr><td><b>${esc(x.nama)}</b></td><td class="num mono">${b?rp2(per1(b)):'—'}</td>
      <td class="num mono">${rp(x.nilai)}</td><td class="num">${pct(x.nilai/totalNilai)}</td>
      <td class="num mono" style="color:var(--danger)">+${rp(x.nilai*0.1)}</td></tr>`;
  });
  h+=`</tbody></table></div></div>`;

  /* --- simulasi --- */
  h+=`<div class="card"><h3>Simulasi kenaikan harga bahan</h3>
    <div class="card-sub">Berapa menu yang tembus ambang kalau satu bahan naik? Tidak ada yang tersimpan — ini hitungan di layar saja.</div>
    <div class="bar">
      <select id="simBahan">${S.bahan.slice().sort((a,b)=>low(a.nama)<low(b.nama)?-1:1).map(b=>`<option value="${esc(b.nama)}">${esc(b.nama)}</option>`).join('')}</select>
      <select id="simPersen"><option value="5">+5%</option><option value="10" selected>+10%</option><option value="20">+20%</option><option value="50">+50%</option></select>
      <button class="btn btn-primary btn-sm" onclick="jalankanSimulasi()">Hitung</button>
    </div><div id="simHasil"></div></div>`;
  return h;
}
function jalankanSimulasi(){
  const nama=$('simBahan').value, p=num($('simPersen').value)/100;
  const b=PB[low(nama)]; if(!b) return;
  const dish=S.resep.filter(r=>r.tipe==='dish'&&hargaJual(r)>0);
  const sebelum=dish.map(r=>({id:r.id,c:cogsOf(r),m:modalMenu(r).total}));
  const asli=b.harga_beli;
  b.harga_beli=num(asli)*(1+p); MEMO={};
  const sesudah=dish.map(r=>({id:r.id,nama:r.nama,c:cogsOf(r),m:modalMenu(r).total}));
  b.harga_beli=asli; MEMO={};
  const petaS={}; sebelum.forEach(x=>petaS[x.id]=x);
  const berubah=sesudah.filter(x=>x.m-petaS[x.id].m>0.5)
    .map(x=>({...x,dM:x.m-petaS[x.id].m,c0:petaS[x.id].c}))
    .sort((a,b)=>b.dM-a.dM);
  const baruLewat=berubah.filter(x=>x.c>AMBANG&&x.c0<=AMBANG);
  const totalTambah=berubah.reduce((s,x)=>s+x.dM,0);
  $('simHasil').innerHTML=!berubah.length
    ? `<div class="notice info">Tidak ada menu yang memakai <b>${esc(nama)}</b>.</div>`
    : `<div class="notice ${baruLewat.length?'bad':'ok'}">
         <div><b>${berubah.length} menu</b> ikut naik modalnya, total <b>${rp(totalTambah)}</b> per satu porsi tiap menu.
         ${baruLewat.length?`<b>${baruLewat.length} menu jadi tembus ${AMBANG*100}%</b>: ${baruLewat.slice(0,8).map(x=>esc(x.nama)).join(', ')}.`:'Tidak ada yang jadi tembus ambang.'}</div></div>
       <div class="tbl-wrap"><table><thead><tr><th>Menu</th><th class="num">Modal naik</th><th class="num">COGS sebelum</th><th class="num">COGS sesudah</th></tr></thead><tbody>
       ${berubah.slice(0,12).map(x=>`<tr><td>${esc(x.nama)}</td><td class="num mono">+${rp(x.dM)}</td>
          <td class="num">${chipCogs(x.c0)}</td><td class="num">${chipCogs(x.c,x.r)}</td></tr>`).join('')}
       </tbody></table></div>`;
}

/* ====================== 5. PEMAKAIAN & SELISIH ======================
   Digabungkan dari prototipe "Kontrol Bahan Baku". Rumusnya dibawa apa adanya
   karena memang benar dan sudah dipahami user:

     masuk         = stok awal + belanja
     tercatat      = terpakai menurut resep + spoil + team + rnd + compliment
     pakai aktual  = masuk − stok opname
     SELISIH       = pakai aktual − tercatat     (+ boros/hilang, − irit)

   Selisih inilah yang jadi lampu: hijau di bawah ambang kuning, kuning sampai
   ambang merah, merah di atasnya (bawaan 3% & 8%, bisa diubah di Pengaturan).
   Yang tidak dibawa dari prototipe: halaman opname & waste berdiri sendiri —
   pencatatannya sudah ada di Stock > Pemakaian Bahan Baku, dan dua tempat
   mencatat hal yang sama berarti dua angka yang berbeda.

   PENJUALAN bulan itu diketik satu kali; darinya COGS aktual = nilai pakai
   aktual ÷ penjualan. Itulah COGS sebenarnya, yang selalu berbeda dari COGS
   teoretis di Dashboard (yang dihitung dari resep) — dan selisih antara
   keduanya persis yang dicari orang tiap tutup bulan. */
let PK={bulan:'',baris:{},penjualan:0,catatan:'',daftar:[],muat:false,q:''};
function bulanIni(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function hitungPakai(nama){
  const r=PK.baris[nama]||{}, b=PB[low(nama)];
  const h=b?per1(b):0;
  const masuk=num(r.sa)+num(r.beli);
  const lain=num(r.spoil)+num(r.team)+num(r.rnd)+num(r.comp);
  const tercatat=num(r.resep)+lain;
  const aktual=masuk-num(r.opname);
  const selisih=aktual-tercatat;
  const p=tercatat>0?(selisih/tercatat)*100:0;
  const a=Math.abs(p);
  const lampu=a>num(SET.lampuMerah)?'merah':a>num(SET.lampuKuning)?'kuning':'hijau';
  return {h,masuk,lain,tercatat,aktual,selisih,p,lampu,nilai:selisih*h,nilaiAktual:aktual*h,
          nilaiStok:num(r.opname)*h,ada:masuk>0||tercatat>0||num(r.opname)>0};
}
function muatPakai(bulan){
  PK.bulan=bulan||PK.bulan||bulanIni();
  setSync('','Memuat…');
  return fetch(API+'?action=pakai&bulan='+encodeURIComponent(PK.bulan)+'&t='+Date.now())
    .then(r=>r.json()).then(j=>{
      PK.baris={}; (j.baris||[]).forEach(r=>{ PK.baris[r.bahan]=r; });
      PK.penjualan=num(j.penjualan); PK.catatan=j.catatan||''; PK.daftar=j.daftarBulan||[];
      PK.muat=true; setSync('ok','✓ Tersambung'); render();
    }).catch(e=>{ setSync('err','✕ Gagal'); pesan(`<div class="notice bad">✕ Gagal memuat pemakaian: ${esc(e.message||'')}</div>`); });
}
function isiPakai(nama,kolom,nilai){
  PK.baris[nama]=PK.baris[nama]||{bahan:nama};
  PK.baris[nama][kolom]=nilai;
  segarBaris(nama);
}
function segarBaris(nama){
  const c=hitungPakai(nama);
  const el=document.querySelector(`[data-hasil="${CSS.escape(nama)}"]`);
  if(el) el.innerHTML=selHtml(c);
  const box=$('pkRingkas'); if(box) box.innerHTML=ringkasPakai();
}
function selHtml(c){
  const w={hijau:'ok',kuning:'warn',merah:'bad'}[c.lampu];
  return `<span class="chip ${w}">${c.selisih>0?'+':''}${(Math.round(c.selisih*100)/100).toLocaleString('id-ID')} · ${c.p.toFixed(1)}%</span>
          <div style="font-size:11px;color:${c.selisih>0?'var(--danger)':'var(--muted-2)'};margin-top:2px">${c.nilai?rp(c.nilai):'—'}</div>`;
}
function ringkasPakai(){
  let rugi=0,stok=0,aktual=0,merah=0,kuning=0,hijau=0,n=0;
  Object.keys(PK.baris).forEach(nm=>{
    const c=hitungPakai(nm); if(!c.ada) return;
    n++; if(c.selisih>0) rugi+=c.nilai;
    stok+=c.nilaiStok; aktual+=c.nilaiAktual;
    if(c.lampu==='merah') merah++; else if(c.lampu==='kuning') kuning++; else hijau++;
  });
  const cogs=PK.penjualan>0?aktual/PK.penjualan:null;
  return `<div class="row-in" style="margin-bottom:0">
    ${kartu('COGS aktual',cogs===null?'—':pct(cogs),PK.penjualan>0?('pakai '+rp(aktual)+' ÷ penjualan '+rp(PK.penjualan)):'isi dulu nilai penjualan','accent')}
    ${kartu('Nilai kerugian',rp(rugi),'selisih yang boros/hilang, dalam rupiah','')}
    ${kartu('Nilai stok akhir',rp(stok),'hasil opname × harga bahan','')}
    ${kartu('Lampu',`<span class="chip ok">${hijau}</span> <span class="chip warn">${kuning}</span> <span class="chip bad">${merah}</span>`,n+' bahan terisi bulan ini','')}
  </div>`;
}
function viewPakai(){
  if(!PK.muat){ muatPakai(PK.bulan||bulanIni()); return `<div class="card"><div class="empty"><div class="big">⏳</div>Memuat pemakaian…</div></div>`; }
  const q=low(PK.q);
  /* Yang ditampilkan: bahan yang sudah ada isinya + hasil pencarian. 296 baris
     kosong sekaligus tidak ada yang mengisinya, dan membuat halaman ini
     terlihat seperti pekerjaan yang mustahil selesai. */
  const terisi=S.bahan.filter(b=>PK.baris[b.nama]&&hitungPakai(b.nama).ada);
  const cari=q?S.bahan.filter(b=>low(b.nama).indexOf(q)>-1&&terisi.indexOf(b)<0).slice(0,40):[];
  const daftar=terisi.concat(cari);
  let h=`<div class="card">
    <div class="bar">
      <input type="month" value="${esc(PK.bulan)}" onchange="PK.muat=false;muatPakai(this.value)">
      <div class="field" style="margin:0"><input type="number" step="any" placeholder="Nilai penjualan bulan ini"
        value="${PK.penjualan||''}" oninput="PK.penjualan=this.value;document.getElementById('pkRingkas').innerHTML=ringkasPakai()" style="min-width:200px"></div>
      <input type="search" id="qp" placeholder="Cari bahan untuk ditambahkan…" value="${esc(PK.q)}"
        oninput="cari(this,v=>{PK.q=v})">
      <button class="btn btn-primary btn-sm" onclick="simpanPakai()">💾 Simpan bulan ini</button>
    </div>
    <div id="pkRingkas">${ringkasPakai()}</div>
  </div>
  <div class="card"><h3>Analisa selisih ${esc(PK.bulan)}</h3>
    <div class="card-sub">Selisih = (stok awal + belanja − opname) − (terpakai resep + spoil + team + RND + compliment). Lampu kuning di atas ${SET.lampuKuning}%, merah di atas ${SET.lampuMerah}%.</div>`;
  if(!daftar.length){
    h+=`<div class="empty"><div class="big">📅</div>Belum ada bahan yang diisi untuk bulan ini.<br>Cari namanya di kotak pencarian di atas untuk mulai mengisi.</div></div>`;
    return h;
  }
  h+=`<div class="tbl-wrap"><table><thead><tr>
      <th>Bahan</th><th class="num">Stok awal</th><th class="num">Belanja</th><th class="num">Resep</th>
      <th class="num">Spoil</th><th class="num">Team</th><th class="num">RND</th><th class="num">Comp</th>
      <th class="num">Opname</th><th class="num">Selisih</th></tr></thead><tbody>`;
  daftar.forEach(b=>{
    const r=PK.baris[b.nama]||{}, c=hitungPakai(b.nama);
    const kot=(k)=>`<input type="number" step="any" value="${r[k]!=null&&r[k]!==0?r[k]:''}" style="width:74px;padding:5px 6px;border:1.5px solid var(--line);border-radius:7px;text-align:right;font-size:12.5px"
        oninput="isiPakai('${esc(b.nama)}','${k}',this.value)">`;
    h+=`<tr><td><b>${esc(b.nama)}</b><div style="font-size:11px;color:var(--muted-2)">${rp2(per1(b))} / ${esc(b.satuan||'')}</div></td>
      <td class="num">${kot('sa')}</td><td class="num">${kot('beli')}</td><td class="num">${kot('resep')}</td>
      <td class="num">${kot('spoil')}</td><td class="num">${kot('team')}</td><td class="num">${kot('rnd')}</td>
      <td class="num">${kot('comp')}</td><td class="num">${kot('opname')}</td>
      <td class="num" data-hasil="${esc(b.nama)}">${selHtml(c)}</td></tr>`;
  });
  h+=`</tbody></table></div></div>`;
  return h;
}
function simpanPakai(){
  const baris=Object.keys(PK.baris).map(nm=>Object.assign({bahan:nm},PK.baris[nm]));
  kirimPakai({action:'simpanPakai',data:{bulan:PK.bulan,baris:baris,penjualan:PK.penjualan,catatan:PK.catatan}});
}
function kirimPakai(payload){
  payload.by=(ME&&ME.name)||'';
  setSync('','Menyimpan…');
  fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)})
    .then(r=>r.text()).then(t=>{
      let j=null; try{ j=JSON.parse(t); }catch(e){}
      if(!j||j.status==='error') throw new Error((j&&j.message)||'balasan bukan JSON');
      pesan(`<div class="notice ok">✓ Pemakaian ${esc(PK.bulan)} tersimpan (${j.baris} bahan).</div>`);
      setSync('ok','✓ Tersambung');
    })
    .catch(e=>{ setSync('err','✕ Gagal'); pesan(`<div class="notice bad">✕ Gagal menyimpan: ${esc(e.message||'')}</div>`); });
}

/* ====================== 6. KALKULATOR HPP ======================
   Dari prototipe "Galangan HPP". Bedanya dengan penyunting resep: yang ini
   TIDAK menyimpan apa pun — tempat mencoba "kalau begini, jadinya berapa"
   sebelum sebuah menu benar-benar dibuat. */
let KAL={baris:[{nama:'',qty:'',ref:'bahan'}],hargaJual:'',porsi:1};
function kalTotal(){
  let t=0,hilang=0;
  KAL.baris.forEach(b=>{ if(!b.nama) return; const s=hitungBaris(b,'food'); if(s.ada) t+=s.nilai; else hilang++; });
  return {t,hilang};
}
function viewKalk(){
  let h=`<div class="card"><h3>Coba hitung</h3>
    <div class="card-sub">Pilih bahan atau resep yang sudah ada, isi takarannya. Tidak ada yang tersimpan — kalau hasilnya bagus, buat resepnya di menu Daftar Resep.</div>
    <datalist id="dlBahanK">${S.bahan.map(b=>`<option value="${esc(b.nama)}">`).join('')}</datalist>
    <datalist id="dlResepK">${S.resep.map(r=>`<option value="${esc(r.nama)}">`).join('')}</datalist>
    <div class="brs" style="font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase">
      <div>Sumber</div><div>Nama</div><div>Qty</div><div>Satuan</div><div style="text-align:right">Subtotal</div><div></div></div>`;
  KAL.baris.forEach((b,i)=>{
    const s=hitungBaris(b,'food');
    h+=`<div class="brs">
      <select onchange="KAL.baris[${i}].ref=this.value;render()">
        <option value="bahan"${b.ref!=='resep'?' selected':''}>Bahan</option>
        <option value="resep"${b.ref==='resep'?' selected':''}>Resep</option></select>
      <!-- Sama seperti penyunting resep: mengetik TIDAK menggambar ulang
           halaman. Di sini akibatnya bahkan lebih parah — render() membangun
           ulang seluruh kalkulator, jadi setiap huruf melempar fokus keluar. -->
      <input list="${b.ref==='resep'?'dlResepK':'dlBahanK'}" value="${esc(b.nama||'')}" placeholder="nama…" oninput="KAL.baris[${i}].nama=this.value;segarKalk()">
      <input inputmode="numeric" value="${b.qty||''}" placeholder="qty" oninput="KAL.baris[${i}].qty=this.value;segarKalk()">
      <input value="${esc(b.satuan||'')}" placeholder="satuan" oninput="KAL.baris[${i}].satuan=this.value">
      <div class="sub" data-ksub="${i}">${s.ada?rp2(s.nilai):'<span style="color:var(--danger)">tak dikenal</span>'}</div>
      <button class="x" onclick="KAL.baris.splice(${i},1);render()">✕</button></div>`;
  });
  h+=`<div style="margin-top:8px"><button class="btn btn-ghost btn-sm" onclick="KAL.baris.push({nama:'',qty:'',ref:'bahan'});render()">+ Baris</button>
      <button class="btn btn-ghost btn-sm" onclick="KAL={baris:[{nama:'',qty:'',ref:'bahan'}],hargaJual:'',porsi:1};render()">Bersihkan</button></div>
    <div class="g3" style="margin-top:14px">
      <div class="field"><label>Jadi berapa porsi</label><input inputmode="numeric" value="${KAL.porsi}" oninput="KAL.porsi=this.value;segarKalk()"></div>
      <div class="field"><label>Rencana harga jual (Rp)</label><input inputmode="numeric" value="${fmtIn(KAL.hargaJual)}" oninput="angkaKetik(this,v=>{KAL.hargaJual=v});segarKalk()"></div>
    </div></div>
  <div class="row-in" id="kalKartu">${kartuKalk()}</div>
  <div id="kalNote">${noteKalk()}</div>`;
  return h;
}
/* Kartu & catatan kalkulator dipisah jadi fungsinya sendiri supaya bisa
   digambar ulang TANPA menyentuh kotak isian yang sedang diketik. */
function kartuKalk(){
  const {t,hilang}=kalTotal();
  const porsi=num(KAL.porsi)||1, perPorsi=t/porsi, hj=num(KAL.hargaJual);
  const c=hj>0?perPorsi/hj:null;
  return kartu('Modal total',rp(t),hilang?`${hilang} baris belum dikenal`:'dari '+KAL.baris.filter(b=>b.nama).length+' bahan','accent')
    +kartu('Modal per porsi',rp2(perPorsi),porsi+' porsi','')
    +kartu('COGS',c===null?'—':pct(c),hj>0?('harga jual '+rp(hj)):'isi rencana harga jual','')
    +kartu('Harga ideal',rp(perPorsi/num(SET.targetFood)),
        `supaya COGS pas ${(num(SET.targetFood)*100).toFixed(0)}% (drink: ${rp(perPorsi/num(SET.targetDrink))})`,'');
}
function noteKalk(){
  const {t}=kalTotal();
  const porsi=num(KAL.porsi)||1, perPorsi=t/porsi, hj=num(KAL.hargaJual);
  if(hj<=0) return '';
  const c=perPorsi/hj, tgt=num(SET.targetFood);
  return `<div class="notice ${c>tgt?'bad':'ok'}">${c>tgt
    ? `Dengan harga ${rp(hj)}, COGS-nya ${pct(c)} — di atas target. Harga minimalnya ${rp(perPorsi/tgt)}, atau modalnya perlu turun ke ${rp2(hj*tgt)} per porsi.`
    : `COGS ${pct(c)}, di bawah target. Marginnya ${rp(hj-perPorsi)} per porsi.`}</div>`;
}
function segarKalk(){
  document.querySelectorAll('[data-ksub]').forEach(el=>{
    const b=KAL.baris[+el.dataset.ksub]; if(!b) return;
    const s=hitungBaris(b,'food');
    el.innerHTML=s.ada?rp2(s.nilai):'<span style="color:var(--danger)">tak dikenal</span>';
  });
  const k=$('kalKartu'); if(k) k.innerHTML=kartuKalk();
  const n=$('kalNote'); if(n) n.innerHTML=noteKalk();
}

/* ====================== 7. PENGATURAN ====================== */
function viewAtur(){
  return `<div class="card"><h3>Target &amp; ambang</h3>
    <div class="card-sub">Angka-angka ini dipakai seluruh modul: warna chip COGS, kolom "harga ideal", dan lampu di halaman Pemakaian. Bawaannya mengikuti berkas HPP aslinya (ambang 33%, buffer 5%).</div>
    <div class="g3">
      <div class="field"><label>Target COGS Food (%)</label><input type="number" step="any" id="sF" value="${(num(SET.targetFood)*100)}"></div>
      <div class="field"><label>Target COGS Drink (%)</label><input type="number" step="any" id="sD" value="${(num(SET.targetDrink)*100)}"></div>
      <div class="field"><label>Buffer harga (%)</label><input type="number" step="any" id="sB" value="${(num(SET.buffer)*100)}"></div>
    </div>
    <div class="g2">
      <div class="field"><label>Lampu kuning di atas (% selisih)</label><input type="number" step="any" id="sK" value="${SET.lampuKuning}"></div>
      <div class="field"><label>Lampu merah di atas (% selisih)</label><input type="number" step="any" id="sM" value="${SET.lampuMerah}"></div>
    </div>
    <button class="btn btn-primary" onclick="simpanAtur()">💾 Simpan pengaturan</button>
  </div>
  <div class="card"><h3>Dari mana data modul ini</h3>
    <div class="card-sub">Supaya tidak ada yang mencari-cari sumbernya.</div>
    <table><tbody>
      <tr><td><b>Resep &amp; bahan</b></td><td>dipindahkan sekali dari <i>HPP Food Laksamana Updated March 2026.xlsx</i>; sesudah itu diurus dari layar ini.</td></tr>
      <tr><td><b>Nama &amp; vendor bahan</b></td><td>satu daftar dengan basis bahan baku Purchasing — nama bahan di sini <b>adalah</b> nama di sana. Ganti nama di salah satu modul, yang satunya ikut berubah otomatis (termasuk baris resep yang memakainya).</td></tr>
      <tr><td><b>Harga beli</b></td><td>milik modul ini. Purchasing tidak menyimpan harga sama sekali, jadi tidak ada yang bisa ditarik dari sana — di sinilah satu-satunya tempat harga bahan hidup.</td></tr>
      <tr><td><b>Opname, waste, order</b></td><td>tetap di Stock &gt; Pemakaian Bahan Baku dan Ordering/Purchasing — modul ini tidak menduplikasinya, angkanya diketik ulang di halaman Pemakaian sampai kedua modul disambungkan.</td></tr>
    </tbody></table></div>`;
}
function simpanAtur(){
  const d={targetFood:num($('sF').value)/100,targetDrink:num($('sD').value)/100,
           buffer:num($('sB').value)/100,lampuKuning:num($('sK').value),lampuMerah:num($('sM').value)};
  fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'simpanSetting',data:d,by:(ME&&ME.name)||''})})
    .then(r=>r.json()).then(j=>{
      if(j.status==='error') throw new Error(j.message);
      SET=j.setting||d; MEMO={};
      pesan('<div class="notice ok">✓ Pengaturan tersimpan.</div>'); render();
    }).catch(e=>pesan(`<div class="notice bad">✕ Gagal: ${esc(e.message||'')}</div>`));
}

/* ====================== CETAK / PDF ======================
   "Export PDF" di repo ini = jendela cetak peramban lalu "Simpan sebagai PDF".
   Tidak ada pustaka PDF dari CDN di modul mana pun, dan menambahnya berarti
   satu ketergantungan luar lagi yang bisa mati diam-diam. */
function lembarResep(r,denganModal){
  const m=modalMenu(r), y=num(r.yield_qty)||1;
  let t=`<div class="rjudul">${esc(r.nama)}</div>
    <div class="meta">${r.jenis==='drink'?'Drink':'Food'} · ${r.tipe==='base'?'Base':'Menu jadi'} · ${esc(r.seksi||'')} · hasil ${y} ${esc(r.yield_unit||'')}</div>
    <table><thead><tr><th style="width:44%">Bahan</th><th>Qty</th><th>Satuan</th>${denganModal?'<th class="num">Harga/satuan</th><th class="num">Subtotal</th>':''}</tr></thead><tbody>`;
  (r.bahan||[]).forEach(b=>{
    if(b.catatan!==undefined&&b.nama===undefined){
      t+=`<tr><td colspan="${denganModal?5:3}"><i>${esc(b.catatan)}</i></td></tr>`; return;
    }
    const s=hitungBaris(b,r.jenis);
    const it=b.ref==='resep'?null:PB[low(b.nama)];
    t+=`<tr><td>${esc(b.nama)}${b.ref==='resep'?' (resep)':''}</td><td>${b.qty}</td><td>${esc(b.satuan||'')}</td>`;
    if(denganModal) t+=`<td class="num">${it?rp2(per1(it)):(b.ref==='resep'?'—':'?')}</td><td class="num">${s.ada?rp2(s.nilai):'?'}</td>`;
    t+=`</tr>`;
  });
  if(denganModal){
    t+=`<tr><th colspan="4">TOTAL MODAL</th><th class="num">${rp(m.total)}</th></tr>
        <tr><th colspan="4">Modal per ${esc(r.yield_unit||'unit')}</th><th class="num">${rp2(m.total/y)}</th></tr>`;
    if(hargaJual(r)>0) t+=`<tr><th colspan="4">Harga jual · COGS</th><th class="num">${rp(hargaJual(r))} · ${pct(cogsOf(r))}</th></tr>`;
  }
  t+=`</tbody></table>`;
  if(r.catatan) t+=`<div class="meta"><b>Catatan:</b> ${esc(r.catatan)}</div>`;
  return t;
}
function cetak(judul,isi){
  $('sheet').innerHTML=`<div class="kop"><div><h2>${esc(judul)}</h2>
      <div class="meta">Laksamana Muda · HPP &amp; Resep · dicetak ${kini()}${ME?' oleh '+esc(ME.name):''}</div></div>
      <div class="meta">${S.resep.length} resep · ${S.bahan.length} bahan</div></div>${isi}`;
  window.print();
  setTimeout(()=>{ $('sheet').innerHTML=''; },500);
}
function cetakResep(id,denganModal){
  const r=S.resep.find(x=>x.id===id); if(!r) return;
  cetak(r.nama,lembarResep(r,denganModal));
}
function cetakBanyak(denganModal){
  /* Kedua tabel ikut tercetak: saringannya satu, jadi "PDF semua" yang cuma
     memuat menu jadi akan terasa seperti setengah pekerjaan. */
  const daftar=resepTersaring('dish').concat(resepTersaring('base'));
  if(!daftar.length) return;
  if(daftar.length>60&&!confirm(`${daftar.length} resep akan dicetak. Lanjut?`)) return;
  cetak(denganModal?'Resep & Modal':'Resep',daftar.map((r,i)=>
    `<div${i<daftar.length-1?' class="pecah"':''}>${lembarResep(r,denganModal)}</div>`).join(''));
}

/* ====================== JARINGAN ====================== */
let JALAN=false;
function kirim(payload,sukses){
  if(JALAN) return;
  JALAN=true; setSync('','Menyimpan…');
  payload.by=(ME&&ME.name)||'';
  fetch(API,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(payload)})
    .then(r=>r.text())
    .then(t=>{
      let j=null; try{ j=JSON.parse(t); }catch(e){}
      if(!j) throw new Error('balasan bukan JSON (stock-api-mysql/hpp.php belum ter-deploy?)');
      if(j.status==='error') throw new Error(j.message||'ditolak server');
      tutupModal();
      /* Pendaftaran ke purchasing dilakukan server, jadi layar harus
         MENGATAKANNYA — kalau tidak, orang tidak punya cara tahu apakah
         saklarnya benar-benar berbuat sesuatu. */
      const tambahan=j.purchasingBaru?' Namanya sekaligus didaftarkan di basis bahan baku Purchasing.'
        :j.purchasingGagal?' <b>Tapi gagal mendaftarkan ke Purchasing</b> — coba lagi, atau tambahkan manual di sana.':'';
      pesan(`<div class="notice ${j.purchasingGagal?'warn':'ok'}">✓ ${esc(sukses)}${tambahan}</div>`);
      /* Daftar produk purchasing ikut dimuat ulang: kalau tidak, bahan yang
         baru saja didaftarkan masih terbaca "belum di purchasing" sampai
         halaman disegarkan sendiri. */
      return muatProduk().then(muat);
    })
    .catch(e=>{ pesan(`<div class="notice bad">✕ Gagal: ${esc(e.message||'')}</div>`); })
    .then(()=>{ JALAN=false; setSync('ok','✓ Tersambung'); });
}
function muat(){
  return fetch(API+'?action=all&t='+Date.now())
    .then(r=>r.text())
    .then(t=>{
      let j=null; try{ j=JSON.parse(t); }catch(e){}
      if(!j) throw new Error('balasan bukan JSON');
      if(j.status==='error') throw new Error(j.message);
      S={bahan:j.bahan||[],resep:j.resep||[]};
      if(j.setting) SET=Object.assign(SET,j.setting);
      petakan(); setSync('ok','✓ Tersambung');
      if(!S.resep.length&&!S.bahan.length) tawarkanImpor();
      render();
    });
}
/* Pemindahan awal. Tombolnya HANYA muncul saat tabelnya benar-benar kosong —
   impor kedua akan melipatgandakan resep dan mengembalikan harga bahan ke
   angka Maret 2026. Servernya menolak juga, ini lapis keduanya. */
function tawarkanImpor(){
  pesan(`<div class="notice warn"><div><b>Belum ada data.</b> Berkas "HPP Food Laksamana Updated March 2026.xlsx" sudah disiapkan untuk dipindahkan: 296 bahan &amp; 365 resep.
    <div style="margin-top:9px"><button class="btn btn-primary btn-sm" onclick="imporSeed()">📥 Pindahkan data dari Excel sekarang</button></div></div></div>`);
}
function imporSeed(){
  if(!confirm('Pindahkan 296 bahan dan 365 resep dari berkas Excel ke modul ini?\n\nDilakukan sekali; sesudah ini datanya diurus dari layar, bukan dari Excel lagi.')) return;
  setSync('','Memindahkan…');
  fetch(SEED_URL+'?t='+Date.now()).then(r=>r.json())
    .then(seed=>fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify({action:'impor',by:(ME&&ME.name)||'',data:{bahan:seed.bahan,resep:seed.resep}})}))
    .then(r=>r.text())
    .then(t=>{
      let j=null; try{ j=JSON.parse(t); }catch(e){}
      if(!j||j.status==='error') throw new Error((j&&j.message)||'balasan bukan JSON');
      pesan(`<div class="notice ok">✓ Dipindahkan: ${j.bahan} bahan, ${j.resep} resep.</div>`);
      return muat();
    })
    .catch(e=>pesan(`<div class="notice bad">✕ Gagal memindahkan: ${esc(e.message||'')}</div>`));
}
function muatProduk(){
  /* Basis bahan baku purchasing — dipakai layar pencocokan & pengisi vendor.
     Kegagalannya TIDAK boleh menjatuhkan halaman: HPP tetap berguna tanpa
     purchasing, cuma saran pencocokannya yang kosong. */
  return fetch(API_ITEM+'?t='+Date.now()).then(r=>r.json())
    .then(j=>{ PRODUK=(j&&j.products)||{}; })
    .catch(()=>{ PRODUK={}; });
}
function boot(){
  ME=bacaSesi();
  if(!ME){ location.replace('../../'); return; }
  $('suName').textContent=ME.name||'—';
  $('suAvatar').textContent=(String(ME.name||'?').trim()[0]||'?').toUpperCase();
  document.querySelectorAll('.nav a').forEach(a=>a.addEventListener('click',()=>go(a.dataset.view)));
  render();
  muatProduk().then(muat).catch(e=>{
    setSync('err','✕ Gagal');
    pesan(`<div class="notice bad">✕ Tidak bisa membaca data: ${esc(e.message||'')}. Pastikan <b>stock-api-mysql/hpp.php</b> sudah ter-deploy.</div>`);
  });
}
boot();
</script>
