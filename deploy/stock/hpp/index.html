<!-- Guard SSO. Syaratnya HARUS sama persis dengan bacaSesi() di bawah.
     Jalurnya '../../' (dua tingkat): berkas ini di deploy/stock/hpp/. -->
<script>
(function(){try{
  var s=JSON.parse(localStorage.getItem('lm_session')||'null');
  var hidup=s&&s.expiry&&Date.now()<s.expiry;
  var punya=hidup&&(s.modules||[]).some(function(m){return m==='*'||m==='hpp';});
  if(!punya)location.replace('../../');
}catch(e){location.replace('../../');}})();
</script>

/* Tema & kerangka disalin dari panel Finance > Kas Kecil supaya modul ini
   tidak terasa aplikasi lain. Nama kelasnya sengaja sama persis. */
:root{
  --ink:#2A2620; --ink-2:#3A3428;
  --gold:#A9791F; --gold-2:#C8961F; --gold-dim:#7A560F; --gold-soft:#F2E9D3;
  --paper:#F7F6F4; --surface:#FFFFFF; --line:#E7E1D3; --line-soft:rgba(60,55,45,.10);
  --text:#2A2620; --muted:#5C574D; --muted-2:#928C80;
  --ok:#1F9D5F; --ok-bg:#E4F5EC; --warn:#B5831A; --warn-bg:#F7EFDB;
  --danger:#C9432B; --danger-bg:#F8E4DF; --info:#2F7FC4; --info-bg:#E4EFF8;
  --violet:#7C5FC0; --violet-bg:#ECE6F7; --teal:#1F9D8F; --teal-bg:#E2F4F2;
  --radius:16px; --radius-sm:10px; --shadow:0 4px 18px rgba(50,42,28,.06);
  --shadow-lg:0 18px 48px rgba(50,42,28,.12);
  --ring:0 0 0 3px rgba(227,160,8,.18); --ease:cubic-bezier(.16,1,.3,1);
  --serif:'Plus Jakarta Sans',system-ui,sans-serif;
  --sans:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --sidebar-w:248px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:radial-gradient(900px 480px at 50% -12%,rgba(227,160,8,.09),transparent 60%),var(--paper);
  color:var(--text);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
h1,h2,h3,h4{font-family:var(--serif);font-weight:700;letter-spacing:-.02em;line-height:1.18;color:var(--ink)}
button{font-family:inherit;cursor:pointer} input,select,textarea{font-family:inherit}
.mono{font-variant-numeric:tabular-nums} .hidden{display:none!important}
a{color:var(--info)}
.btn{border:none;border-radius:var(--radius-sm);padding:10px 16px;font-weight:600;font-size:13.5px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:filter .15s var(--ease)}
.btn:focus-visible{outline:none;box-shadow:var(--ring)}
.btn-primary{background:linear-gradient(135deg,var(--gold-2),var(--gold-dim));color:#fff;box-shadow:0 3px 12px rgba(122,86,15,.28)}
.btn-primary:hover{filter:brightness(1.06)} .btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-ghost{background:var(--surface);border:1.5px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--gold-2);background:var(--gold-soft)}
.btn-danger{background:var(--danger-bg);color:var(--danger);border:1.5px solid rgba(201,67,43,.25)}
.btn-sm{padding:7px 11px;font-size:12.5px} .btn-xs{padding:5px 9px;font-size:11.5px;border-radius:8px}
.field{margin-bottom:12px} .field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1.5px solid var(--line);
  border-radius:var(--radius-sm);background:var(--surface);color:var(--text);font-size:14px}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--gold);box-shadow:var(--ring)}

.app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);flex:none;background:var(--surface);border-right:1px solid var(--line);
  padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 18px}
.brand .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--gold-2),var(--gold-dim));
  display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:800;color:#fff;font-size:16px;flex:none}
.brand .bt{font-family:var(--serif);font-weight:800;font-size:16px;color:var(--ink);line-height:1.1}
.brand .bs{font-size:10.5px;color:var(--muted-2);letter-spacing:.5px;margin-top:2px}
.nav{flex:1} .nav-group{margin-top:14px}
.nav-label{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted-2);padding:0 10px 7px}
.nav a{position:relative;display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;color:var(--muted);
  text-decoration:none;font-size:13.5px;font-weight:500;margin-bottom:2px;cursor:pointer}
.nav a:hover{background:var(--paper);color:var(--ink)}
.nav a.active{background:var(--gold-soft);color:var(--gold-dim);font-weight:600}
.nav a.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--gold)}
.nav a .ico{width:18px;display:flex;justify-content:center;flex:none;font-size:15px}
.side-user{display:flex;align-items:center;gap:9px;margin-top:12px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
.su-avatar{width:32px;height:32px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;

.su-info{min-width:0;flex:1} .su-info b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.main{flex:1;min-width:0;padding:24px 28px 60px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.topbar h1{font-size:22px} .topbar .sub{font-size:13px;color:var(--muted);margin-top:3px}
.sync{font-size:11.5px;font-weight:600;color:var(--muted-2)} .sync.ok{color:var(--ok)} .sync.err{color:var(--danger)}
.hamb{display:none} @media(max-width:620px){.hamb{display:inline-flex}}
@media(max-width:620px){.sidebar{position:fixed;z-index:50;transform:translateX(-100%);transition:transform .2s}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:16px}
.card h3{font-size:15.5px;margin-bottom:4px} .card .card-sub{font-size:12.5px;color:var(--muted);margin-bottom:14px}
.row-in{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));margin-bottom:16px}
.stat{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow)}
.stat::before{content:'';position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--gold-2),var(--gold-dim))}
.stat .lab{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stat .val{font-family:var(--serif);font-weight:700;font-size:21px;color:var(--ink);margin-top:6px;line-height:1.15;overflow-wrap:anywhere}
.stat .foot{font-size:11.5px;color:var(--muted);margin-top:6px}
.stat.accent{background:linear-gradient(135deg,var(--gold-2),var(--gold-dim));color:#fff;border:none}
.stat.accent::before{display:none} .stat.accent .lab,.stat.accent .foot{color:rgba(255,255,255,.75)} .stat.accent .val{color:#fff}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;border-radius:20px;padding:3px 9px}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.bad{background:var(--danger-bg);color:var(--danger)}
.chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.info{background:var(--info-bg);color:var(--info)}
.chip.mute{background:var(--paper);color:var(--muted);border:1px solid var(--line)}
.chip.violet{background:var(--violet-bg);color:var(--violet)} .chip.teal{background:var(--teal-bg);color:var(--teal)}
/* SAKLAR AKTIF / NON-AKTIF (15 Agustus 2026, permintaan user).
   Dulu tombol teks kecil "● aktif" yang bentuk & warnanya sama persis dengan
   "Ubah" dan "PDF" di baris yang sama — keadaan sebuah resep harus DIBACA satu
   per satu, padahal itu satu-satunya kolom yang dipindai sekilas saat menyisir
   daftar 237 menu. Sekarang berupa saklar: posisi knop dan warnanya terbaca
   tanpa membaca hurufnya. */
.sw{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--paper);
    border-radius:999px;padding:3px 11px 3px 3px;cursor:pointer;font:inherit;font-size:11.5px;
    font-weight:700;color:var(--muted-2);transition:background .15s,border-color .15s,color .15s;white-space:nowrap}
.sw .knop{width:30px;height:17px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw .knop::after{content:'';position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;
    background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.28);transition:transform .15s}
.sw.on{border-color:rgba(31,157,95,.35);background:var(--ok-bg);color:var(--ok)}
.sw.on .knop{background:var(--ok)}
.sw.on .knop::after{transform:translateX(13px)}
.sw:hover{border-color:var(--gold-dim)}
.notice{padding:11px 14px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:14px;display:flex;gap:9px}
.notice.ok{background:var(--ok-bg);color:#146c42} .notice.bad{background:var(--danger-bg);color:#8f2718}
.notice.info{background:var(--info-bg);color:#1a5a91} .notice.warn{background:var(--warn-bg);color:#7a5a10}
.empty{text-align:center;padding:40px 20px;color:var(--muted-2)} .empty .big{font-size:34px;margin-bottom:8px}
.seg{display:inline-flex;background:var(--gold-soft);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:none;background:transparent;padding:6px 13px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);
  padding:9px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);color:var(--text)}
tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--gold-soft)}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.bar input[type=search],.bar select{padding:8px 11px;border:1.5px solid var(--line);border-radius:9px;background:var(--surface);font-size:13px}
.bar input[type=search]{min-width:220px;flex:1}
.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;flex-wrap:wrap}
.pager .pg{display:flex;gap:4px;flex-wrap:wrap}
.pager button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;font-size:12.5px;font-weight:600;color:var(--muted)}
.pager button.on{background:var(--gold-soft);border-color:var(--gold);color:var(--gold-dim)}
.pager button:disabled{opacity:.4;cursor:not-allowed}
.thurut{cursor:pointer;user-select:none;white-space:nowrap}
.thurut:hover{color:var(--gold-dim)}
.thurut.on{color:var(--gold-dim)}
.thurut .ar{font-size:9px;margin-left:4px;opacity:.45}
.thurut.on .ar{opacity:1}
/* Baris non-aktif: dipudarkan DAN diberi garis kiri, bukan cuma dipudarkan.
   Opasitas saja hilang begitu barisnya kebetulan tersorot atau layarnya terang,
   dan saklar di ujung kanan tidak terlihat saat memindai kolom Nama.
   Saklarnya sendiri dikecualikan dari pudar — justru itu yang harus terbaca
   jelas, karena itu yang perlu ditekan untuk mengembalikannya. */
tr.mati td{opacity:.55;background:var(--paper)}
tr.mati td:first-child{box-shadow:inset 3px 0 0 var(--line)}
tr.mati td .sw{opacity:1}
.pager .ket{font-size:12px;color:var(--muted)}
/* modal */
.ovl{position:fixed;inset:0;background:rgba(30,25,15,.5);display:flex;align-items:flex-start;justify-content:center;padding:24px;z-index:80;overflow:auto}
.mdl{background:var(--surface);border-radius:var(--radius);max-width:900px;width:100%;box-shadow:var(--shadow-lg);margin:auto}
.mdl-h{padding:16px 20px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.mdl-b{padding:16px 20px;max-height:66vh;overflow:auto}
.mdl-f{padding:12px 20px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px} .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:700px){.g2,.g3{grid-template-columns:1fr}}
.brs{display:grid;grid-template-columns:96px 1fr 84px 88px 110px 30px;gap:7px;align-items:center;margin-bottom:6px}
.brs input,.brs select{padding:7px 8px;border:1.5px solid var(--line);border-radius:8px;font-size:12.5px;width:100%}
.brs .sub{font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.brs .x{border:none;background:none;color:var(--muted-2);font-size:15px}
.brs .x:hover{color:var(--danger)}
@media(max-width:760px){.brs{grid-template-columns:1fr 1fr;}}
/* bar sebaran */
.dist{display:flex;flex-direction:column;gap:7px}
.dist .d{display:grid;grid-template-columns:96px 1fr 54px;gap:10px;align-items:center;font-size:12.5px}
.dist .t{height:12px;border-radius:20px;background:var(--gold-soft);overflow:hidden}
.dist .t>i{display:block;height:100%;border-radius:20px;background:linear-gradient(90deg,var(--gold-2),var(--gold-dim))}
.dist .d.bahaya .t>i{background:linear-gradient(90deg,#e07a5f,var(--danger))}
/* lembar cetak — "export PDF" di repo ini = cetak lalu simpan sebagai PDF.
   Tidak ada pustaka PDF dari CDN: modul lain pun memakai window.print(). */
#sheet{display:none}
@media print{
  .app,.ovl{display:none!important}
  #sheet{display:block!important;padding:0;color:#000}
  @page{size:A4;margin:14mm}
  #sheet h2{font-family:var(--serif);font-size:19px;margin-bottom:2px}
  #sheet .kop{border-bottom:2px solid #A9791F;padding-bottom:8px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:flex-end}
  #sheet .meta{font-size:11px;color:#555}
  #sheet table{width:100%;border-collapse:collapse;font-size:11.5px;margin-bottom:14px}
  #sheet th,#sheet td{border:1px solid #bbb;padding:5px 7px;text-align:left}
  #sheet th{background:#F2E9D3}
  #sheet td.num{text-align:right}
  #sheet .rjudul{font-weight:700;font-size:13px;margin:10px 0 4px}
  #sheet .pecah{page-break-after:always}
}
</style>

<script>
/* ======================================================================
   HPP & RESEP — sub-modul kelima Stock (13 Agustus 2026)

   Menggantikan berkas "HPP Food Laksamana Updated March 2026.xlsx" (5 sheet:
   Item, Recipe - Food, Recipe - Drink, Harga - Food, Harga - Drink). Data
   awalnya dipindahkan sekali dari berkas itu; SESUDAH ITU sumber kebenarannya
   modul ini — keputusan user saat memesannya, dan itu sebabnya setiap layar di
   sini bisa menulis, bukan cuma memajang hasil impor.

   YANG MEMBUATNYA LEBIH DARI SALINAN EXCEL: resep boleh memakai resep lain
   sebagai bahan, dan di berkas aslinya memang begitu — dish "Ayam Bawang
   Putih" memakai base "Ayam Karage" 80 Gr, yang punya resepnya sendiri. Di
   Excel angka Rp54,785/gr itu diketik tangan hasil hitungan terpisah; di sini
   ia DIHITUNG berjenjang, jadi satu perubahan harga ayam merambat sendiri ke
   seluruh base dan seluruh dish. 345 baris bahan di data awal menunjuk resep

function purIsi(p){

  if(v&&typeof v==='object') Object.keys(v).forEach(k=>{

function purSatuanUkur(p){

function dariDasarPur(qty,u,p){

   muncul sebagai modal, bukan sebagai galat. */
function konvSatuan(qty,dari,ke,pur){
  const f=konvFam(qty,dari,ke);
  if(f!==null) return f;
  if(!pur) return null;
  const b=keDasarPur(qty,dari,pur);

}
/* Qty sebuah baris resep, dinyatakan dalam satuan HARGA bahannya (atau satuan

   tanda ⚠ supaya "1 Pcs telur" yang harganya per Gram terbaca sebagai
   pertanyaan, bukan sebagai modal Rp0,05. */
function qtySesuai(qty,dari,ke,pur){
  const d=String(dari||'').trim(), k=String(ke||'').trim();
  if(!d||!k||low(d)===low(k)) return {qty:qty,campur:false};
  const c=konvSatuan(qty,d,k,pur);
  if(c===null) return {qty:qty,campur:true};
  return {qty:c,campur:false};

   centang — aturan yang ada tapi tak bisa dilihat siapa pun di sana. */
function bakuSatuan(u){
  const s=String(u||'').trim(); if(!s) return '';
  const tepat=SATUAN_TERSEDIA.find(x=>low(x)===low(s));
  if(tepat) return tepat;
  const f=satFam(s);
  if(f){
    const sama=SATUAN_TERSEDIA.find(x=>{ const g=satFam(x); return g&&g[0]===f[0]&&g[1]===f[1]; });
    if(sama) return sama;
  }
  return s;
}

/* ---- MODAL BERJENJANG ----
   Memulangkan {total, hilang:[nama…], siklus:bool}. `hilang` itu bahan yang
   dirujuk tapi tidak ada daftarnya — di data awal ada 77 nama begitu (bahan
   minuman yang tidak pernah masuk sheet Item). Sengaja DILAPORKAN, tidak
   dihitung nol diam-diam: modal yang kelihatan murah karena bahannya hilang
   adalah kesalahan yang paling mahal di layar ini. */
function modalResep(r,jalur){
  if(!r) return {total:0,hilang:[],siklus:false,campur:[]};
  if(MEMO[r.id]) return MEMO[r.id];
  jalur=jalur||{};
  if(jalur[r.id]) return {total:0,hilang:[],siklus:true,campur:[]};   // resep memanggil dirinya sendiri
  jalur[r.id]=1;
  let total=0, hilang=[], siklus=false, campur=[];
  (r.bahan||[]).forEach(b=>{
    if(!b||!b.nama) return;
    /* lewatResep(): `ref` baris ini, ATAU baris bahannya sendiri menyatakan
       harganya datang dari resep bernama sama (sisi 'resep'). Base olahan
       seperti Ayam Karage berdiri di daftar bahan cuma sebagai penopang nama
       untuk purchasing/CK dan harganya di sana nol — baris resep yang
       terlanjur bertipe Bahan akan menghitungnya Rp0 tanpa satu pun tanda. */
    if(lewatResep(b)){
      const sub=cariResep(b.nama,r.jenis);
      if(!sub){ hilang.push(b.nama); return; }
      const m=modalResep(sub,jalur);
      if(m.siklus) siklus=true;
      const perUnit=num(sub.yield_qty)>0?m.total/num(sub.yield_qty):0;
      /* Takaran baris DIKONVERSI ke satuan hasil resep yang dirujuk: base
         "Ayam Karage" hasil 1000 Gr dipakai 0,08 Kg tetap 80 Gr, bukan 0,08. */
      const q=qtySesuai(num(b.qty),b.satuan,sub.yield_unit);
      if(q.campur) campur.push(b.nama);
      total+=perUnit*q.qty;
      hilang=hilang.concat(m.hilang); campur=campur.concat(m.campur||[]);
    }else{
      const it=PB[low(b.nama)];
      if(!it){ hilang.push(b.nama); return; }

         dengan satuan lain (beli per Kg, takar per Gram) harus dikonversi
         dulu — inilah tempat modal 1.000× dulu terbentuk. */
      const q=qtySesuai(num(b.qty),b.satuan,it.satuan,infoPur(it));
      if(q.campur) campur.push(b.nama);
      total+=per1(it)*q.qty;
    }
  });
  delete jalur[r.id];
  const hasil={total,hilang,siklus,campur};
  if(!siklus) MEMO[r.id]=hasil;    // hasil di bawah siklus tidak boleh disimpan
  return hasil;
}

   menghapusnya. Itu benar untuk kasus yang melahirkannya (base buatan sendiri
   yang terlanjur punya baris harga ketikan tangan dari berkas Maret 2026), tapi
   salah untuk barang yang memang dibeli — dan salahnya mahal: barisnya tak
   terlihat, jadi harganya TIDAK BISA diisi sama sekali, sementara menu yang
   memakainya menghitung modal dari bahan yang harganya nol.

   Klaim lama "penghitung modal selalu mengambil sisi resep lebih dulu" juga
   TIDAK BENAR, dan itu yang membuat aturannya terasa masuk akal. Lihat
   modalResep: tiap baris resep menyimpan `ref` sendiri — 'bahan' atau 'resep' —
   dan itulah yang menentukan sisi mana yang dibaca. Tidak pernah ada tebakan
   dari nama. Jadi dua sisi memang bisa hidup berdampingan tanpa satu pun angka
   jadi ambigu; yang perlu diputuskan cuma "baris ini maksudnya yang mana", dan
   itu sudah dipilih di penyunting resep lewat dropdown Bahan/Resep.

   ADA SISI KETIGA, dan ia yang paling banyak (17 Agustus 2026, sesudah user
   melihat hasilnya di dev): **base olahan buatan sendiri yang berdiri juga di
   Purchasing** — Ayam Karage, Ayam Hainan, Ayam Panggang Merah, Sate Lilit.
   Outlet MEMESANNYA ke Central Kitchen, jadi namanya memang harus ada di basis
   bahan baku purchasing; tapi harganya bukan harga beli, melainkan modal
   resepnya sendiri. Tiga jalan yang ditawarkan sebelumnya — hapus, ganti nama,
   atau nyatakan "dibeli jadi" — tidak satu pun benar untuk barang seperti ini:
   menghapusnya memutus namanya dari purchasing, mengganti namanya membuat dua
   nama untuk satu benda, dan "dibeli jadi" bohong.

   Maka yang disimpan bukan lagi saklar ya/tidak, melainkan JAWABAN atas satu
   pertanyaan: **harga untuk nama ini diambil dari mana?**

     'beli'  → dari baris bahan ini. Barang yang benar-benar dibeli ke vendor
               walaupun ada menu bernama sama (dimsum beku, mi instan).
     'resep' → dari resep bernama sama. Barisnya di sini cuma PENOPANG NAMA
               supaya purchasing/CK punya barang yang bisa dipesan; qty & harga
               belinya tidak dibaca siapa pun.
     ''      → belum diputuskan.

   Yang kosong DISIMPULKAN, bukan dibiarkan menggantung — dan yang menyimpulkan
   adalah TIPE resep yang bertabrakan dengannya, bukan cara orang mengetik
   barisnya:

     - bertabrakan dengan **BASE** → 'resep'. Base adalah "dibuat sendiri lalu
       dipakai resep lain" menurut definisi halaman Daftar Resep sendiri, jadi
       harganya memang modal resepnya. Inilah keempat contoh user: Ayam Karage,
       Ayam Hainan, Ayam Panggang Merah, Sate Lilit — semuanya bersih tanpa satu
       pun klik.
     - bertabrakan dengan **MENU JADI** dan ada baris resep yang memakainya
       sebagai **Bahan** → 'beli'. Ada yang benar-benar membaca harganya.
     - bertabrakan dengan menu jadi, tapi tidak dipakai siapa pun → tetap
       kosong, ditandai "bayangan?" untuk ditinjau. Ini satu-satunya keadaan
       yang masih perlu diputuskan orang, dan jumlahnya kecil.

   TIPE, BUKAN CARA MERUJUK, dan itu penting. Sempat dicoba menyimpulkan dari
   `ref` baris-baris yang memakainya — dirujuk sebagai Resep berarti 'resep'.
   Tapi satu baris yang salah pilih dropdown (menyebut Ayam Karage sebagai
   Bahan, padahal ia base) langsung membalik kesimpulannya jadi 'beli', dan
   seluruh base itu dihargai nol di setiap resep yang memakainya. Kesimpulan
   yang bisa dibalik oleh satu salah ketik bukan kesimpulan.

   KONSEKUENSI DI PENGHITUNG MODAL: baris resep yang menunjuk nama bersisi
   'resep' dibaca dari RESEPNYA walaupun barisnya terlanjur bertipe Bahan (lihat
   modalResep). Ini bukan tebakan dari nama — ini pernyataan tersimpan, sama
   derajatnya dengan `ref`. Tanpa itu, satu baris yang salah tipe akan
   menghitung Ayam Karage sebagai Rp0 tanpa satu pun tanda di layar. */
function dipakaiSebagaiBahan(nama){
  const n=low(nama), out=[];
  S.resep.forEach(r=>{ if((r.bahan||[]).some(b=>b&&b.ref!=='resep'&&low(b.nama)===n)) out.push(r); });
  return out;
}
function dipakaiSebagaiResep(nama){
  const n=low(nama), out=[];
  S.resep.forEach(r=>{ if((r.bahan||[]).some(b=>b&&b.ref==='resep'&&low(b.nama)===n)) out.push(r); });
  return out;
}
/* Sisi harga yang tersimpan TERANG-TERANGAN: '' kalau belum diputuskan. */
function sisiTersimpan(b){
  const s=low((b&&b.sisi_harga)||'');
  if(s==='beli'||s==='resep') return s;
  /* Warisan saklar `dibeli_jadi` yang berumur satu hari (17 Agustus 2026 pagi),
     sebelum sisi ketiga ada. Server sudah memindahkannya saat kolom baru lahir;
     ini lapis keduanya, untuk data yang keburu terbaca sebelum migrasi jalan. */
  return (b&&b.dibeli_jadi)?'beli':'';
}
/* Sisi harga sebuah bahan: 'beli' | 'resep' | '' (belum diputuskan).
   Pernyataan lebih dulu, lalu kesimpulan dari TIPE resep yang bertabrakan.

   SENGAJA MURAH: cuma satu pencarian peta, tidak menyisir daftar resep sama
   sekali. Ia dipanggil dari dalam modalResep untuk tiap baris tiap resep, dan
   menyisir 365 resep di sana membuat satu penggambaran daftar jadi ratusan ribu
   langkah. Sisi 'beli' yang butuh bukti pemakaian dihitung di tabrakan(), yang
   cuma dipakai layar — dan untuk penghitung modal bedanya tidak ada: yang
   bukan 'resep' selalu dibaca dari daftar bahan. */
function sisiHarga(b){
  const s=sisiTersimpan(b);
  if(s) return s;
  const r=b?PR[low(b.nama)]:null;
  return (r&&r.tipe==='base')?'resep':'';
}
/* "Baris resep ini dibaca dari RESEP, bukan dari daftar bahan." Satu penentu
   untuk SEMUA pembacanya — modalResep, hitungBaris (angka per baris di
   penyunting), uraiBahan (uraian Dashboard), dan saran satuan. Ditulis
   sekali karena empat salinan aturan yang sama pasti menyimpang, dan yang
   menyimpang di sini muncul sebagai penyunting resep yang menampilkan angka
   berbeda dari totalnya sendiri. */
const lewatResep=b=>{
  if(!b) return false;
  if(b.ref==='resep') return true;
  const it=PB[low(b.nama)];
  return !!(it&&sisiHarga(it)==='resep');
};
function tabrakan(b){
  const r=b?PR[low(b.nama)]:null;
  if(!r) return {ada:false,sisi:'',sah:false,bayangan:false,dipakai:[],pakaiResep:[],r:null};
  const dipakai=dipakaiSebagaiBahan(b.nama), pakaiResep=dipakaiSebagaiResep(b.nama);
  const eksplisit=sisiTersimpan(b);
  // sisiHarga() sudah menutup tabrakan dengan BASE; sisanya (menu jadi) baru
  // butuh bukti pemakaian sebagai Bahan.
  const sisi=eksplisit||sisiHarga(b)||(dipakai.length?'beli':'');
  return {ada:true,sisi:sisi,tebakan:!eksplisit&&!!sisi,sah:!!sisi,bayangan:!sisi,
          dipakai:dipakai,pakaiResep:pakaiResep,r:r};
}
/* Modal per satuan hasil sebuah resep — angka yang menggantikan "harga /
   satuan" untuk bahan bersisi 'resep'. Dua daftar yang menampilkan dua angka
   untuk benda yang sama adalah cara paling pasti membuat orang berhenti
   percaya keduanya. */
function perUnitResep(r){
  if(!r) return 0;
  const y=num(r.yield_qty)||1;
  /* modalDasar, BUKAN modalMenu: angka ini menjadi "harga per satuan" sebuah
     bahan yang dibuat sendiri, lalu dipakai menyusun modal resep lain. Spare
     yang ikut di sini akan dipadding lagi di menu yang memakainya. */
  return modalDasar(r).total/y;
}

  kalk :['Kalkulator HPP','Hitung modal & harga jual sebuah menu tanpa menyimpan apa pun'],
  atur :['Pengaturan','Target COGS, buffer, dan ambang lampu selisih']
};
function go(v){

function setSync(st,msg){ const e=$('sync'); e.className='sync'+(st?' '+st:''); e.textContent=msg; }
function pesan(html){ PESAN=html; $('pesan').innerHTML=html; }
/* KOTAK PENCARIAN. Sebelumnya tiap ketikan memanggil render() lalu focus()
   saja — elemennya digambar ulang, jadi kursor selalu meloncat ke UJUNG teks.
   Akibatnya mustahil membetulkan huruf di tengah kata: yang diketik masuk ke
   belakang. Posisi kursor sekarang dicatat sebelum menggambar ulang dan
   dikembalikan sesudahnya. */
/* KOTAK NOMINAL BERFORMAT RUPIAH. "102125" mustahil dibaca sebagai seratus dua
   ribu seratus dua puluh lima — dan harga beli adalah satu-satunya angka di
   modul ini yang salah ketiknya menggeser SELURUH modal menu. Titik ribuan
   dipasang sambil mengetik.

   Kursor dijaga dengan cara menghitung DIGIT sebelum kursor, bukan posisi
   karakternya: menambah satu titik ribuan menggeser posisi karakter tapi tidak
   menggeser jumlah digit, jadi hanya cara ini yang tidak melompat sendiri. */
/* NOL DITAMPILKAN SEBAGAI KOSONG di kotak isian (14 Agustus 2026, permintaan
   user). Angka 0 yang sudah duduk di kotak memaksa orang menghapusnya dulu
   sebelum mengetik — dan yang lupa menghapus mengetik di belakangnya. Kotaknya
   dikosongkan; nolnya tetap tersimpan sebagai nol karena num('') = 0. */
const fmtIn=v=>{ const d=String(v==null?'':v).replace(/[^0-9]/g,''); const n=Number(d);
  return (d&&n)?n.toLocaleString('id-ID'):''; };
function angkaKetik(el,setter){
  const digitSebelum=String(el.value).slice(0,el.selectionStart).replace(/[^0-9]/g,'').length;
  const bersih=String(el.value).replace(/[^0-9]/g,'');
  setter(bersih);
  el.value=fmtIn(bersih);
  let pos=0, n=0;
  while(pos<el.value.length && n<digitSebelum){ if(/[0-9]/.test(el.value[pos])) n++; pos++; }
  try{ el.setSelectionRange(pos,pos); }catch(_){}
}
function cari(el,setter){
  const id=el.id, p=el.selectionStart;
  setter(el.value);
  render();
  const n=document.getElementById(id);
  if(n){ n.focus(); try{ n.setSelectionRange(p,p); }catch(_){} }
}
function render(){
  $('pesan').innerHTML=PESAN;
  $('view').innerHTML=({resep:viewResep,dash:viewDash,bahan:viewBahan,floor:viewFloor,
                        pakai:viewPakai,kalk:viewKalk,atur:viewAtur}[VIEW])();
}

/* ====================== 1. DAFTAR RESEP ====================== */
/* F = tabel Menu Jadi, FBS = tabel Base. DIPISAH jadi dua tabel (14 Agustus
   2026, permintaan user): keduanya dibaca dengan pertanyaan yang berbeda —
   menu jadi dinilai dari COGS terhadap harga jual, base dari modal per satuan
   hasil. Dicampur dalam satu daftar, kolom Harga jual & COGS kosong di separuh
   barisnya dan pengurutan menurut COGS jadi tidak ada artinya.

   `aktif` = 'ya' (bawaan) | 'tidak' | '' (semua). SEBELUMNYA sebuah centang
   "hanya yang aktif" — dan centang cuma punya dua keadaan, jadi keadaan ketiga
   yang justru paling dicari mustahil diminta: MELIHAT yang non-aktif saja.
   Untuk menemukan satu resep yang tak sengaja dimatikan, orang harus mencentang
   lepas lalu menyisir 237 baris mencari yang pudar (permintaan user 15 Agustus
   2026). Bawaannya tetap 'ya': yang ingin dilihat sehari-hari cuma resep yang
   masih dipakai. Resep lama tidak dihapus — ia cuma dinonaktifkan, karena
   menghapusnya akan memutus rujukan di resep lain yang mungkin masih
   memakainya, dan riwayat modalnya ikut hilang. */
let F={q:'',jenis:'',seksi:'',hal:1,per:25,sortK:'nama',sortD:1,aktif:'ya',tab:'dish'};
let FBS={hal:1,per:25,sortK:'nama',sortD:1};
const AMB_RESEP={
  nama:r=>low(r.nama), jenis:r=>r.jenis, seksi:r=>low(r.seksi||''),
  yield:r=>num(r.yield_qty), bahan:r=>(r.bahan||[]).filter(x=>x&&x.nama).length,
  modal:r=>modalMenu(r).total,
  perunit:r=>modalMenu(r).total/(num(r.yield_qty)||1),
  harga:r=>hargaJual(r),
  /* Menu tanpa harga jual tidak punya COGS. Diberi -1 supaya ia mengumpul di
     satu ujung, bukan berserak di tengah sebagai nol yang terlihat "sangat
     sehat". */
  cogs:r=>{ const c=cogsOf(r); return c===null?-1:c; },
  aktif:r=>(r.aktif===0?0:1)
};
/* `abaikanJenis` dipakai HANYA untuk menghitung angka di tombol Makanan /
   Minuman. Kalau angkanya dihitung dengan tapis jenis ikut berlaku, tombol
   yang tidak sedang dipilih SELALU menulis (0) — dan tombol bertuliskan nol
   membaca sebagai "tidak ada minuman sama sekali", bukan sebagai "kamu sedang
   melihat makanan". Saringan lain (seksi, aktif, kata kunci) TETAP berlaku:
   angkanya harus menjanjikan apa yang benar-benar muncul kalau ditekan. */
function resepTersaring(tipe,abaikanJenis){
  const q=low(F.q);
  const l=S.resep.filter(r=>{
    if(tipe&&r.tipe!==tipe) return false;
    if(F.aktif==='ya'&&r.aktif===0) return false;
    if(F.aktif==='tidak'&&r.aktif!==0) return false;
    if(!abaikanJenis&&F.jenis&&r.jenis!==F.jenis) return false;
    if(F.seksi&&r.seksi!==F.seksi) return false;
    if(q&&low(r.nama).indexOf(q)<0&&low(r.seksi||'').indexOf(q)<0) return false;
    return true;
  });
  return urutkanDaftar(l,tipe==='base'?'FBS':'F',AMB_RESEP,'nama');
}
/* SELALU BERTANYA sejak 15 Agustus 2026 (permintaan user), termasuk saat
   mengaktifkan kembali. Sebelumnya cuma bertanya kalau resepnya dipakai resep
   lain, jadi saklarnya berpindah dari satu klik yang tak sengaja — dan di
   daftar 237 baris, satu resep yang mendadak lenyap dari layar tidak akan
   dicari orang sampai ada yang menanyakan kenapa menunya hilang. */
function setAktif(id,on){
  const r=S.resep.find(x=>x.id===id); if(!r) return;
  const jalan=()=>kirim({action:'simpanResep',data:Object.assign({},r,{aktif:on?1:0})},
                        on?'Resep diaktifkan.':'Resep dinonaktifkan.');
  if(on){
    konfirmasi({judul:'Aktifkan resep?', tombol:'Aktifkan', onYa:jalan,
      pesan:`<b>${esc(r.nama)}</b> akan tampil lagi di daftar dan ikut dihitung di Dashboard HPP.`});
    return;
  }
  const pakai=S.resep.filter(x=>x.id!==id&&(x.bahan||[]).some(b=>b&&b.ref==='resep'&&low(b.nama)===low(r.nama)));
  konfirmasi({judul:'Nonaktifkan resep?', tombol:'Nonaktifkan', bahaya:true, onYa:jalan,
    pesan:`<b>${esc(r.nama)}</b> akan hilang dari daftar dan tidak lagi ikut dihitung di Dashboard HPP.
      Resepnya <b>tetap tersimpan</b> — bisa diaktifkan lagi lewat saringan “hanya yang aktif”.`
      +(pakai.length?`<div class="notice warn" style="margin:12px 0 0">
        <div>Masih dipakai <b>${pakai.length} resep lain</b>: ${esc(pakai.slice(0,5).map(x=>x.nama).join(', '))}${pakai.length>5?', …':''}.
        Modal resep-resep itu tetap terhitung, jadi angkanya tidak berubah.</div></div>`:'')});
}
/* ================= ISI YIELD "1 PORSI" UNTUK MENU JADI =================
   Permintaan user 2 September 2026: seluruh menu jadi di Daftar Resep diisi
   yield-nya "1 Porsi". Sebagian besar memang cuma kosong satuannya — warisan
   pemindahan dari berkas Excel Maret 2026, yang kolom hasilnya memang tidak
   selalu terisi.

   TAPI TIDAK SEMUA BOLEH DIISI BEGITU SAJA, dan ini bagian yang harus tetap
   dijaga siapa pun yang menyentuh alat ini:

   Ada menu jadi yang resepnya ditulis untuk SATU BATCH — Bubur Ayam hasil 10
   Porsi, Chicken Skin hasil 400 Gr, Tea Orange Extract hasil 1600 Ml. Yield
   itu BUKAN keterangan; ia PEMBAGI. `perUnitResep()` = modal ÷ yield, dan
   angka itulah yang dipakai resep LAIN yang merujuknya sebagai bahan
   (`hitungBaris`, cabang lewatResep). Menuliskan 1 Porsi di sana tanpa ikut
   membagi takaran bahannya membuat:

     Nasi Campur Bali pakai 20 Gr Chicken Skin
       sebelum : (modal ÷ 400) × 20
       sesudah : (modal ÷   1) × 20      -> 400 kali lipat

   Tidak ada satu pun galat yang muncul; yang berubah cuma angka modal, dan
   angka modal yang salah terlihat persis seperti angka modal yang benar.
   Di data Maret 2026 ada 7 resep semacam itu, dan 9 resep lain merujuknya.

   Karena itu yang hasilnya BUKAN 1 ditahan secara bawaan, disebut satu per
   satu berikut siapa yang merujuknya, dan baru ikut kalau diminta
   terang-terangan. Membaginya otomatis TIDAK dilakukan: takaran bahan sebuah
   batch tidak selalu habis dibagi rata (satu telur untuk 10 porsi), dan
   menebaknya berarti mengarang resep. */
function menuYieldBelum(){
  return S.resep.filter(r=>r.tipe==='dish'
    && !(num(r.yield_qty)===1 && String(r.yield_unit||'')==='Porsi'));
}
/* Hasilnya bukan 1 = resepnya untuk sebatch, bukan sepiring. */
function yieldSebatch(r){ return num(r.yield_qty)!==1; }
/* Resep lain yang memakainya sebagai bahan — dirinya sendiri tidak dihitung
   (ada resep yang namanya sama dengan salah satu barisnya sendiri). */
function perujukResep(r){ return dipakaiOleh(r.nama).filter(x=>x.id!==r.id); }

let ISI_PORSI_BATCH=false;   // di luar DOM: modal digambar ulang sebagai string
function isiPorsiSetBatch(v){ ISI_PORSI_BATCH=!!v; }

function bukaIsiPorsi(){
  const semua=menuYieldBelum();
  if(!semua.length){ pesan('<div class="notice ok">✓ Semua menu jadi sudah 1 Porsi.</div>'); return; }
  const aman=semua.filter(r=>!yieldSebatch(r));
  const batch=semua.filter(yieldSebatch);
  ISI_PORSI_BATCH=false;

  let h=`<div>Menu jadi yang yield-nya belum <b>1 Porsi</b>: <b>${semua.length}</b>.</div>`;
  if(aman.length) h+=`<div class="notice ok" style="margin:11px 0"><div><b>${aman.length} resep aman diisi.</b>
    Hasilnya sudah 1, cuma satuannya yang kosong — jadi <b>tidak ada satu angka pun yang berubah</b>,
    yang ditulis cuma kata “Porsi”.</div></div>`;
  if(batch.length){
    h+=`<div class="notice bad" style="margin:11px 0"><div><b>${batch.length} resep ditahan.</b>
      Resepnya ditulis untuk <b>satu batch</b>, dan yield-nya dipakai sebagai PEMBAGI —
      bukan sekadar keterangan. Menuliskan 1 Porsi tanpa ikut membagi takaran bahannya
      membuat modalnya melonjak, dan resep lain yang memakainya ikut terseret.</div></div>
      <div class="tbl-wrap" style="max-height:210px;overflow:auto"><table><thead><tr>
        <th>Resep</th><th>Hasil sekarang</th><th>Modal per satuan</th><th>Kalau jadi 1 Porsi</th></tr></thead><tbody>`;
    batch.forEach(r=>{
      const y=num(r.yield_qty)||1, m=modalDasar(r).total, ref=perujukResep(r);
      h+=`<tr><td><b>${esc(r.nama)}</b>${ref.length?`<div style="font-size:11px;color:var(--danger)">dipakai ${ref.length} resep lain: ${esc(ref.slice(0,3).map(x=>x.nama).join(', '))}${ref.length>3?', …':''}</div>`:''}</td>
        <td class="num">${y} ${esc(r.yield_unit||'—')}</td>
        <td class="num mono">${rp2(m/y)}</td>
        <td class="num mono" style="color:var(--danger)">${rp2(m)} <span style="font-size:10px">(${y}×)</span></td></tr>`;
    });
    h+=`</tbody></table></div>
      <label style="display:flex;gap:8px;align-items:flex-start;margin-top:12px;font-size:12.5px;cursor:pointer">
        <input type="checkbox" onchange="isiPorsiSetBatch(this.checked)" style="margin-top:2px">
        <span>Isi juga yang ${batch.length} itu. <b>Takaran bahannya tidak ikut dibagi</b> — sesudah ini
        takarannya harus dibetulkan satu per satu supaya modalnya benar lagi.</span></label>`;
  }
  konfirmasi({judul:'Isi Yield Menu Jadi',pesan:h,tombol:'Isikan 1 Porsi',
    onYa:()=>isiPorsiJalan()});
}

/* Disimpan SATU PER SATU lewat simpanResep yang sama dengan penyunting resep —
   tidak ada aksi massal di hpp.php, dan menambahnya berarti satu jalur tulis
   kedua yang aturannya harus dijaga sejajar dengan yang pertama.

   Seluruh baris resep ikut dikirim apa adanya: hpp_simpan_resep() menulis
   ulang SELURUH baris, jadi mengirim yield saja akan menghapus bahannya. */
async function isiPorsiJalan(){
  if(JALAN) return;
  const daftar=menuYieldBelum().filter(r=>ISI_PORSI_BATCH||!yieldSebatch(r));
  if(!daftar.length){ pesan('<div class="notice warn">Tidak ada yang diisi — yang tersisa semuanya resep sebatch, dan itu tidak dicentang.</div>'); return; }
  JALAN=true; setSync('','Menyimpan…');
  let sukses=0; const gagal=[];
  for(let i=0;i<daftar.length;i++){
    const r=daftar[i];
    pesan(`<div class="notice info">Mengisi yield… ${i+1}/${daftar.length} — ${esc(r.nama)}</div>`);
    try{
      const res=await fetch(API,{method:'POST',redirect:'follow',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify({action:'simpanResep',by:(ME&&ME.name)||'',
          data:Object.assign({},r,{yield_qty:1,yield_unit:'Porsi'})})});
      const t=await res.text();
      let j=null; try{ j=JSON.parse(t); }catch(e){}
      if(!j||j.status==='error') throw new Error((j&&j.message)||'balasan bukan JSON');
      sukses++;
    }catch(e){ gagal.push(r.nama); }
  }
  JALAN=false;
  /* Yang gagal DISEBUT NAMANYA. "5 gagal" tanpa nama berarti harus membuka 108
     resep satu per satu untuk mencarinya. */
  await muat();
  pesan(gagal.length
    ? `<div class="notice warn">Terisi <b>${sukses}</b> resep. <b>${gagal.length} gagal</b>: ${esc(gagal.slice(0,8).join(', '))}${gagal.length>8?', …':''}. Coba lagi untuk yang gagal.</div>`
    : `<div class="notice ok">✓ Yield <b>${sukses}</b> menu jadi diisi 1 Porsi.</div>`);
  setSync('ok','✓ Tersambung');
}

/* Satu pembuat untuk kedua tabel. Kolom Harga jual & COGS hanya ada di Menu
   Jadi: di tabel Base keduanya selalu kosong, dan kolom yang selalu kosong
   cuma memakan lebar sambil membuat orang mengira ada yang belum diisi. */
function tabelResep(tipe,judul,sub,mana){
  const semua=resepTersaring(tipe), st=ST[mana]();
  const nHal=Math.max(1,Math.ceil(semua.length/st.per));
  if(st.hal>nHal) st.hal=nHal;
  const hal=semua.slice((st.hal-1)*st.per,st.hal*st.per);
  const dish=(tipe==='dish');
  /* Kolom Modal di tabel Menu Jadi sudah termasuk spare, dan itu HARUS tertulis:
     angka yang diam-diam 5% lebih besar daripada jumlah bahannya adalah selisih
     yang dicari orang berjam-jam di tempat yang salah. Rinciannya menyusul di
     title tiap sel supaya barisnya tidak ikut ramai. */
  const sp=dish?spareModal():0;
  let h=`<div class="card"><h3>${judul} <span style="font-weight:400;color:var(--muted-2);font-size:13px">${semua.length}</span></h3>
    <div class="card-sub">${sub}${sp>0?` <b>Modal sudah termasuk spare ${pctSp(sp)}</b> — diatur di Pengaturan.`:''}</div>`;
  if(!semua.length) return h+`<div class="empty" style="padding:22px">Tidak ada yang cocok dengan saringan ini.</div></div>`;
  h+=`<div class="tbl-wrap"><table><thead><tr>
      ${thUrut(mana,'nama','Nama')}${thUrut(mana,'jenis','Jenis')}${thUrut(mana,'seksi','Seksi')}
      ${thUrut(mana,'yield','Yield','num')}${thUrut(mana,'bahan','Bahan','num')}
      ${thUrut(mana,'modal','Modal','num')}${thUrut(mana,'perunit','Per unit','num')}
      ${dish?thUrut(mana,'harga','Harga jual','num')+thUrut(mana,'cogs','COGS%','num'):''}
      ${thUrut(mana,'aktif','Aktif')}<th></th></tr></thead><tbody>`;
  hal.forEach(r=>{
    const m=modalMenu(r), y=num(r.yield_qty)||1, mati=(r.aktif===0);
    h+=`<tr class="${mati?'mati':''}">
      <td><b>${esc(r.nama)}</b>${m.hilang.length?` <span class="chip bad" title="${esc([...new Set(m.hilang)].join(', '))}">${m.hilang.length} bahan hilang</span>`:''}${m.siklus?' <span class="chip bad">resep berputar</span>':''}${m.manual?' <span class="chip mute">modal manual</span>':''}${
        (m.campur&&m.campur.length)?` <span class="chip warn" title="${esc([...new Set(m.campur)].join(', '))} — satuan takarannya tidak sebanding dengan satuan harga bahannya (mis. Pcs vs Gram), jadi angkanya dipakai apa adanya. Kg↔Gram dan Liter↔ML dikonversi otomatis dan tidak muncul di sini.">${[...new Set(m.campur)].length} satuan campur</span>`:''}</td>
      <td>${r.jenis==='drink'?'<span class="chip teal">Minuman</span>':'<span class="chip violet">Makanan</span>'}</td>
      <td style="font-size:11.5px;color:var(--muted)">${esc(r.seksi||'—')}</td>
      <td class="num">${y} ${esc(r.yield_unit||'')}</td>
      <td class="num">${(r.bahan||[]).filter(b=>b&&b.nama).length}</td>
      <td class="num mono"${m.spare>0?` title="Modal bahan ${rp(m.bahan)} + spare ${pctSp(m.rate)} ${rp(m.spare)}"`:''}>${rp(m.total)}</td>
      <td class="num mono">${rp2(m.total/y)}</td>
      ${dish?`<td class="num mono">${hargaJual(r)?rp(hargaJual(r)):'—'}</td><td class="num">${chipCogs(cogsOf(r),r)}</td>`:''}
      <td><button type="button" class="sw${mati?'':' on'}" role="switch" aria-checked="${mati?'false':'true'}"
            onclick="setAktif('${esc(r.id)}',${mati?1:0})"
            title="${mati?'Aktifkan kembali — akan ditanya dulu':'Nonaktifkan — resepnya tetap tersimpan, cuma hilang dari daftar'}"><span class="knop"></span>${mati?'Non-aktif':'Aktif'}</button></td>
      <td style="white-space:nowrap">
        <button class="btn btn-ghost btn-xs" onclick="bukaResep('${esc(r.id)}')">Ubah</button>
        <button class="btn btn-ghost btn-xs" onclick="cetakResep('${esc(r.id)}',1)" title="Cetak / simpan PDF dengan harga modal">PDF</button>
      </td></tr>`;
  });
  return h+`</tbody></table></div>${pagerBar(semua.length,st.hal,nHal,st.per,mana,'resep')}</div>`;
}
/* SATU pembuat pagination untuk kedua daftar (resep & bahan). Sebelumnya
   masing-masing punya kodenya sendiri, dan yang di daftar Bahan tidak punya
   tombol maju/mundur sama sekali — angka halaman saja, yang di layar sempit
   berarti harus membidik kotak kecil. Tombolnya sekarang berlabel, bukan cuma
   panah, dan mati sendiri di ujung supaya tidak ada klik yang tidak berbuat
   apa-apa. */
/* ---- PENGURUTAN KOLOM (14 Agustus 2026, permintaan user) ----
   Satu mesin untuk semua tabel. Tiap daftar menyetor peta "kunci kolom ->
   cara mengambil nilainya"; header yang bisa diurut cukup dipanggil lewat
   thUrut(). Dibuat bersama, bukan per tabel, karena tiga tabel dengan tiga
   pengurut sendiri berarti tiga tempat yang bisa menyimpang — dan yang
   menyimpang tidak akan kelihatan sampai ada yang membandingkan hasilnya.

   Angka diurut sebagai ANGKA, teks pakai localeCompare 'id'. Tanpa itu
   "Rp1.000.000" duduk sebelum "Rp90.000" karena dibaca sebagai teks. */
const ST={F:()=>F,FB:()=>FB,FF:()=>FF,FBS:()=>FBS,PK:()=>PK};
function keHal(mana,n){ ST[mana]().hal=n; render(); }
function urutKolom(mana,k){
  const s=ST[mana]();
  if(s.sortK===k) s.sortD=-(s.sortD||1); else { s.sortK=k; s.sortD=1; }
  s.hal=1; render();
}
function thUrut(mana,k,label,kelas){
  const s=ST[mana](), on=s.sortK===k;
  return `<th class="thurut ${kelas||''}${on?' on':''}" onclick="urutKolom('${mana}','${k}')" title="Urutkan menurut ${esc(label)}">${label}<span class="ar">${on?(s.sortD>0?'▲':'▼'):'↕'}</span></th>`;
}
function urutkanDaftar(list,mana,peta,bawaan){
  const s=ST[mana](), k=s.sortK||bawaan, d=s.sortD||1, amb=peta[k]||peta[bawaan];
  if(!amb) return list;
  return list.slice().sort((a,b)=>{
    const x=amb(a), y=amb(b);
    if(typeof x==='number'&&typeof y==='number') return (x-y)*d;
    return String(x==null?'':x).localeCompare(String(y==null?'':y),'id')*d;
  });
}
function pagerBar(total,hal,nHal,per,mana,satuan){
  const dari=total?((hal-1)*per+1):0, sampai=Math.min(hal*per,total);
  let b='';
  for(let i=1;i<=nHal;i++){
    if(nHal>9 && i>2 && i<nHal-1 && Math.abs(i-hal)>1){ if(i===3||i===nHal-2) b+='<span style="padding:5px 4px;color:var(--muted-2)">…</span>'; continue; }
    b+=`<button class="${i===hal?'on':''}" onclick="keHal('${mana}',${i})">${i}</button>`;
  }
  return `<div class="pager"><div class="ket">Menampilkan ${dari}–${sampai} dari ${total} ${esc(satuan)} · halaman ${hal}/${nHal}</div><div class="pg">
    <button ${hal<=1?'disabled':''} onclick="keHal('${mana}',${hal-1})">‹ Sebelumnya</button>
    ${b}
    <button ${hal>=nHal?'disabled':''} onclick="keHal('${mana}',${hal+1})">Berikutnya ›</button></div></div>`;
}

/* ---- SARAN SATUAN SEBUAH BARIS RESEP (15 Agustus 2026, permintaan user) ----
   Urutan sumbernya, dari yang paling tahu ke yang paling menebak:

   1. baris bertipe RESEP  -> satuan hasil resep yang dirujuk. Base "Sirup Gula"
      berhasil 100 ML, jadi satu-satunya satuan yang berarti untuk memakainya
      adalah ML — menawarkan Rim di situ tidak pernah benar.
   2. baris bertipe BAHAN  -> satuan yang DITETAPKAN purchasing untuk bahan itu
      (satuanPurchasing sudah memuat satuan berukuran & satuan pack CK).
   3. belum ada di purchasing -> satuan beli yang tercatat di HPP sendiri.
   4. tidak dikenal sama sekali -> seluruh daftar baku, seperti dulu.

   Kotaknya TETAP bisa diketik bebas: takaran dapur ("sdm", "secukupnya") tidak
   pernah ada di daftar mana pun, dan menutup pilihannya akan membuat baris
   seperti itu mustahil ditulis. Yang dipersempit cuma SARANNYA. */
function saranSatuanBaris(b){
  if(!b) return null;
  if(lewatResep(b)){
    const sub=cariResep(b.nama, ED?ED.jenis:'');
    const u=sub&&String(sub.yield_unit||'').trim();
    return u?[u]:null;
  }
  const dari=satuanPurchasing(b.nama);
  if(dari&&dari.length) return dari;
  const it=PB[low(String(b.nama||''))];
  const u=it&&String(it.satuan||'').trim();
  return u?[u]:null;
}
function dlSaranSatuan(b){
  return (saranSatuanBaris(b)||SATUAN_TERSEDIA).map(u=>`<option value="${esc(u)}">`).join('');
}
function judulSaranSatuan(b){
  const s=saranSatuanBaris(b);
  if(!s) return 'Bahan ini belum dikenal, jadi sarannya seluruh satuan baku. Boleh diketik bebas.';
  return (b&&b.ref==='resep')
    ? `Satuan hasil resep yang dirujuk: ${s.join(', ')}. Boleh diketik bebas.`
    : `Satuan yang ditetapkan untuk bahan ini: ${s.join(', ')}. Boleh diketik bebas.`;
}

  $('modal').innerHTML=`<div class="ovl" onclick="if(event.target===this)tutupModal()"><div class="mdl">
    <div class="mdl-h"><div><h3>${r.id?'Ubah Resep':'Resep Baru'}</h3>
      <div class="card-sub" style="margin:0">Modal dihitung otomatis dari harga bahan. Baris bertipe <b>Resep</b> memakai resep lain — modalnya ikut berjenjang.</div></div>
      <button class="btn btn-ghost btn-sm" onclick="tutupModal()">Tutup</button></div>

function hitungBaris(b,jenis){
  if(!b||!b.nama) return {ada:false,nilai:0,campur:false,sat:''};
  // lewatResep(), bukan b.ref: angka per baris di penyunting HARUS memakai
  // aturan yang sama dengan modalResep, kalau tidak jumlah barisnya tidak
  // pernah sama dengan total yang tertulis di bawahnya.
  if(lewatResep(b)){
    const sub=cariResep(b.nama,jenis);
    if(!sub) return {ada:false,nilai:0,campur:false,sat:''};
    const m=modalResep(sub); const y=num(sub.yield_qty)||1;
    const q=qtySesuai(num(b.qty),b.satuan,sub.yield_unit);
    return {ada:true,nilai:(m.total/y)*q.qty,campur:q.campur,sat:sub.yield_unit||''};
  }
  const it=PB[low(b.nama)];
  if(!it) return {ada:false,nilai:0,campur:false,sat:''};
  const q=qtySesuai(num(b.qty),b.satuan,it.satuan,infoPur(it));
  return {ada:true,nilai:per1(it)*q.qty,campur:q.campur,sat:it.satuan||''};
}
/* Tanda ⚠ untuk baris yang satuannya tidak sebanding. Judulnya menyebut KEDUA
   satuannya — "satuan campur" saja membuat orang harus menebak sisi mana yang
   perlu diperbaiki, dan sisi yang salah biasanya bukan yang sedang dilihat. */
function tandaCampur(s,b){
  if(!s||!s.campur) return '';
  return `<span style="color:var(--warn);cursor:help" title="Satuan baris ini (${esc(b.satuan||'—')}) tidak sebanding dengan satuan harganya (${esc(s.sat||'—')}), jadi angkanya dipakai apa adanya. Samakan satuannya, atau perbaiki satuan bahan di Bahan &amp; Harga.">⚠</span>`;
}
function modalPratinjau(r){
  let t=0,hilang=0,campur=0;
  (r.bahan||[]).forEach(b=>{ if(!b||!b.nama) return; const s=hitungBaris(b,r.jenis);
    if(s.ada){ t+=s.nilai; if(s.campur) campur++; } else hilang++; });
  if((r.bahan||[]).length===0) t=num(r.modal_manual);
  /* Spare-nya dihitung dengan aturan yang SAMA dengan modalMenu(). Kalau tidak,
     angka di penyunting berbeda dari angka di daftar untuk resep yang sama —
     dan yang menyuntingnya akan menyimpan lalu mendapati modalnya berubah. */
  const p=kenaSpare(r)?spareModal():0;
  return {total:t+t*p, bahan:t, spare:t*p, rate:p, hilang, campur};
}
function ringkasEditor(m,r){
  const y=num(r.yield_qty)||1, hj=hargaJual(r);
  const c=hj>0?m.total/hj:null;
  return `<div>${m.spare>0?`Modal bahan ${rp(m.bahan)} + spare ${pctSp(m.rate)} ${rp(m.spare)} → `:''}Modal <b>${rp(m.total)}</b> · per ${esc(r.yield_unit||'unit')} <b>${rp2(m.total/y)}</b>`
    +(hj>0?` · harga jual ${rp(hj)} → COGS <b>${pct(c)}</b> ${c>AMBANG?'<span class="chip bad">di atas '+(AMBANG*100)+'%</span>':'<span class="chip ok">sehat</span>'}`:'')
    +(m.hilang?` · <span style="color:var(--danger)">${m.hilang} baris bahannya belum dikenal</span>`:'')
    +(m.campur?` · <span style="color:var(--warn)">${m.campur} baris satuannya tidak sebanding dengan satuan harga bahannya (⚠) — angkanya dipakai apa adanya</span>`:'')+`</div>`;
}
/* Mengetik qty tidak menggambar ulang seluruh modal — fokus akan lompat dari
   kotak yang sedang diketik. Yang diperbarui cuma subtotal & ringkasan. */
function segarSub(){
  if(!ED) return;
  document.querySelectorAll('[data-sub]').forEach(el=>{
    const i=+el.dataset.sub, b=ED.bahan[i]; if(!b) return;
    const s=hitungBaris(b,ED.jenis);
    el.innerHTML=s.ada?rp2(s.nilai)+tandaCampur(s,b):'<span style="color:var(--danger)">tak dikenal</span>';
    /* Saran satuan ikut nama yang sedang diketik. Diperbarui DI SINI, bukan
       lewat gambarEditor(): menggambar ulang barisnya membuat kotak yang sedang
       diketik dibuat ulang, fokus lepas, dan huruf berikutnya mendarat entah di
       mana — jebakan yang sudah dicatat di atas kotak nama. Mengganti isi
       <datalist> tidak menyentuh fokus sama sekali. */
    const dl=document.getElementById('dlSat'+i);
    if(dl){
      const baru=dlSaranSatuan(b);
      if(dl.innerHTML!==baru) dl.innerHTML=baru;
    }
    const kotak=dl&&dl.nextElementSibling;
    if(kotak&&kotak.tagName==='INPUT') kotak.title=judulSaranSatuan(b);
  });
  const box=$('ringkasEd'); if(box) box.innerHTML=ringkasEditor(modalPratinjau(ED),ED);
}
function simpanResep(){
  if(!ED||!String(ED.nama||'').trim()){ alert('Nama resep belum diisi.'); return; }
  kirim({action:'simpanResep',data:ED},'Resep tersimpan.');
}
function hapusResep(id){
  const r=S.resep.find(x=>x.id===id); if(!r) return;
  const pakai=dipakaiOleh(r.nama).filter(x=>x.id!==id);
  konfirmasi({judul:'Hapus resep?', tombol:'Hapus permanen', bahaya:true,
    onYa:()=>kirim({action:'hapusResep',id:id},'Resep dihapus.'),
    pesan:`<b>${esc(r.nama)}</b> akan dihapus dan <b>tidak bisa dikembalikan</b>.
      <div class="ket" style="font-size:12px;color:var(--muted);margin-top:8px">Kalau cuma ingin menyembunyikannya dari daftar, <b>nonaktifkan</b> saja — resepnya tetap tersimpan berikut riwayat modalnya.</div>`
      +(pakai.length?`<div class="notice bad" style="margin:12px 0 0">
        <div>Dipakai <b>${pakai.length} resep lain</b>: ${esc(pakai.slice(0,5).map(x=>x.nama).join(', '))}${pakai.length>5?', …':''}.
        Modal resep-resep itu akan <b>kehilangan komponen ini</b> dan turun tanpa sebab yang terlihat di sana.</div></div>`:'')});
}

/* ====================== 2. BAHAN & HARGA ====================== */
let FB={q:'',hal:1,per:25,st:'',nm:''};
/* Saringan halaman Barang Floor. SENGAJA objek sendiri, bukan menumpang FB:
   kedua halaman dibaca bergantian saat merapikan master bahan, dan pencarian
   yang terbawa dari halaman sebelah membuat halaman baru terlihat kosong
   padahal isinya cuma tersaring. */
let FF={q:'',hal:1,per:25,st:'',nm:''};

/* ---- AREA: MILIK PURCHASING, DI SINI CUMA DIBACA ----
   Jalurnya persis vendorOf(): lewat nama kalau sudah sama, lewat pasangan lama
   selama namanya belum disamakan. Tidak disalin ke hpp_bahan dengan alasan yang
   sama pula — salinan area akan basi diam-diam begitu purchasing memindahkan
   barangnya, dan tidak ada satu pun layar yang akan memberitahu. */
/* DAFTAR area, bukan satu nilai (15 Agustus 2026): satu barang boleh dipegang
   dua tim. TIGA bentuk simpanan harus terbaca, dan ketiganya beredar di data:
     - array          -> server yang sudah diperbarui
     - 'Bar'          -> baris lama, sebelum area boleh banyak
     - 'Bar,Floor'    -> server LAMA yang menerima kiriman baru; purchasing
                         sengaja mengirim teks koma supaya server yang belum
                         ikut ter-deploy tidak menyimpan kata "Array" */
function areaOf(b){
  const p=infoPur(b);
  const v=p?p.area:null;
  const l=Array.isArray(v)?v:(typeof v==='string'?v.split(','):[]);
  const out=[];
  l.forEach(x=>{ const a=String(x||'').trim();
    if(a&&!out.some(y=>low(y)===low(a))) out.push(a); });
  return out;
}
/* Barang Floor — tisu, sedotan, cutlery, lilin meja — dipisah jadi halaman
   sendiri (15 Agustus 2026, permintaan user). Ia dibeli dan berharga, jadi
   tidak bisa sekadar dibuang dari modul ini, tapi ia tidak pernah masuk resep:
   di daftar Bahan & Harga ia cuma menumpuk di antara barang yang justru dibaca
   untuk menjawab "modal menu ini dari mana".

   PRODUK KOSONG (purchasing tidak terbaca) berarti TIDAK ADA yang berpindah —
   areaOf() memulangkan [] untuk semuanya, jadi Bahan & Harga tetap lengkap dan
   halaman Floor yang kosong. Kebalikannya, menebak Floor saat basisnya tidak
   terbaca, akan menyembunyikan bahan dari KEDUA halaman sekaligus.

   FLOOR SAJA, bukan "termasuk Floor" (15 Agustus 2026, sejak area boleh
   banyak). Barang berarea Floor+Kitchen memang dipegang dapur juga dan bisa
   betul-betul masuk resep — mengeluarkannya dari Bahan & Harga berarti
   menyembunyikan bahan resep dari daftar harga yang jadi sumber seluruh angka
   modal di modul ini. Patokan yang sama dipakai pengelompokan Daily SO
   (soFloorMurni di stock/usage), supaya satu barang tidak digolongkan berbeda
   di dua modul. */
const isFloor=b=>{ const a=areaOf(b); return a.length===1&&low(a[0])==='floor'; };

function viewBahan(){ return layarBahan(false); }
function viewFloor(){ return layarBahan(true); }
/* Satu mesin untuk dua halaman. Ditulis bersama, bukan disalin, karena dua
   tabel bahan dengan dua penggambar sendiri berarti dua tempat yang bisa
   menyimpang — dan yang menyimpang baru ketahuan saat ada yang membandingkan
   angkanya. */
function layarBahan(floor){
  const st=floor?FF:FB, mana=floor?'FF':'FB', q=low(st.q);
  /* PENYEMBUNYIAN NAMA YANG JUGA ADA DI DAFTAR RESEP DICABUT (17 Agustus 2026,
     permintaan user) — lihat catatan panjang di tabrakan(). Ringkasnya: barang
     yang DIBELI boleh bernama sama dengan menu yang dijual, dan menyembunyikan
     barisnya membuat harganya mustahil diisi. Yang tinggal cuma bayangan
     sungguhan: tabrakan tanpa satu pun baris resep yang memakainya sebagai
     Bahan dan tanpa saklar "dibeli jadi". Itu pun sekarang TERLIHAT, ditandai,
     dan bisa ditinjau satu-satu. */
  const lingkup=S.bahan.filter(b=>isFloor(b)===floor);
  const kembar=lingkup.filter(b=>tabrakan(b).bayangan);
  /* Saringan SELAIN kembar, dipisah jadi fungsi sendiri supaya bisa dipakai dua
     kali: untuk menyusun daftarnya, DAN untuk menghitung berapa yang tersembunyi
     DI DALAM pencarian yang sedang berjalan. Dulu angka "N disembunyikan"
     dihitung dari seluruh daftar, jadi saat mencari "dimsum" ia tetap berbunyi
     "102 disembunyikan (Acar Timun, Ad. Pancake, …)" — angka dan contoh yang
     tidak ada hubungannya dengan yang sedang dicari, sehingga pertanyaan
     "kenapa dimsum tidak muncul" justru tidak terjawab olehnya. */
  const lolosSaringLain=b=>{
    /* Saringan keadaan purchasing (14 Agustus 2026, permintaan user). Dulu cuma
       centang "belum ada di purchasing saja" — sekarang keempat keadaannya bisa
       dipilih, termasuk "tidak perlu di purchasing" yang justru paling sering
       ingin ditinjau ulang. */
    if(st.st&&statusPur(b).k!==st.st) return false;
    /* Saringan tabrakan nama (17 Agustus 2026). Menggantikan penyembunyian yang
       dicabut: yang dulu otomatis hilang sekarang bisa DIMINTA — "tunjukkan
       nama yang juga ada di Daftar Resep" untuk meninjaunya, atau "bayangan
       saja" untuk membereskan sisa data lama. Bawaannya kosong = semuanya
       tampil, karena halaman ini dibuka untuk mengisi harga, bukan untuk
       mengurus tabrakan nama. */
    if(st.nm){
      const t=tabrakan(b);
      /* "Bahan baku saja" (17 Agustus 2026, permintaan user): yang harganya
         benar-benar HARGA BELI. Sejak base olahan boleh berdiri di daftar ini
         sebagai penopang nama untuk Purchasing/CK, halaman "Harga beli tiap
         bahan" memuat baris yang harganya bukan harga beli — dan yang sedang
         menyisir daftar belanja harus melewatinya satu-satu.

         Yang dibuang: sisi 'resep' (harganya dari resep) DAN bayangan (belum
         diputuskan, jadi belum bisa disebut bahan baku). Barang yang dibeli
         tapi bernama sama dengan menunya — dimsum beku, mi instan — TETAP
         masuk: ia memang dibeli, dan itulah yang ditanyakan saringan ini. */
      if(st.nm==='baku'&&(t.sisi==='resep'||t.bayangan)) return false;
      if(st.nm==='tabrakan'&&!t.ada) return false;
      if(st.nm==='bayangan'&&!t.bayangan) return false;
      if((st.nm==='beli'||st.nm==='resep')&&t.sisi!==st.nm) return false;
    }
    return !q||low(b.nama).indexOf(q)>-1||low(vendorOf(b)).indexOf(q)>-1;
  };
  const kasar=lingkup.filter(lolosSaringLain);
  const semua=urutkanDaftar(kasar,mana,{
    nama:b=>low(b.nama), vendor:b=>low(vendorOf(b)), qty:b=>num(b.qty_beli),
    satuan:b=>low(b.satuan||''), harga:b=>num(b.harga_beli), per1:b=>per1(b),
    dipakai:b=>dipakaiOleh(b.nama).length
  },'nama');
  const nHal=Math.max(1,Math.ceil(semua.length/st.per));
  if(st.hal>nHal) st.hal=nHal;
  const hal=semua.slice((st.hal-1)*st.per,st.hal*st.per);
  const nFloor=S.bahan.filter(isFloor).length;
  /* Spanduk pekerjaan-tertinggal (samakan nama, tarik dari purchasing, belum
     terdaftar) TETAP hanya di Bahan & Harga. Isinya urusan seluruh modul, bukan
     halaman ini; dipasang di dua tempat, satu pekerjaan yang sama terbaca
     sebagai dua tumpukan dan yang menyelesaikannya di sini akan mencarinya lagi
     di sebelah. */
  let h=(floor?'':spanduSamakan()+spanduTarik()+spanduBelumTerdaftar())+`<div class="card">
    <div class="bar">
      <input type="search" id="${floor?'qf':'qb'}" placeholder="Cari ${floor?'barang':'bahan'} atau vendor…" value="${esc(st.q)}" oninput="cari(this,v=>{${mana}.q=v;${mana}.hal=1})">
      <select onchange="${mana}.st=this.value;${mana}.hal=1;render()" title="Saring menurut keadaannya di purchasing">
        ${[['','Semua keadaan'],['ada','✓ Ada di purchasing'],['belum','• Belum di purchasing'],
           ['mandiri','⃠ Tidak perlu di purchasing'],['beda','⚠ Nama beda']]
          .map(o=>`<option value="${o[0]}"${st.st===o[0]?' selected':''}>${o[1]}${o[0]?' ('+lingkup.filter(b=>statusPur(b).k===o[0]).length+')':''}</option>`).join('')}
      </select>
      <select onchange="${mana}.nm=this.value;${mana}.hal=1;render()" title="Saring menurut sumber harganya — bahan baku yang dibeli, atau olahan yang harganya dihitung dari resep">
        ${[['','Semua nama'],['baku','🧂 Bahan baku saja'],['tabrakan','⇄ Juga nama resep'],
           ['beli','⇄ Dibeli'],['resep','⇄ Harga dari resep'],['bayangan','⚠ Bayangan']]
          .map(o=>{ const n=o[0]?lingkup.filter(b=>{ const t=tabrakan(b);
                      return o[0]==='baku'?(t.sisi!=='resep'&&!t.bayangan)
                           : o[0]==='tabrakan'?t.ada
                           : o[0]==='bayangan'?t.bayangan
                           : t.sisi===o[0]; }).length:0;
                    return `<option value="${o[0]}"${st.nm===o[0]?' selected':''}>${o[1]}${o[0]?' ('+n+')':''}</option>`; }).join('')}
      </select>
      ${floor?'':'<button class="btn btn-primary btn-sm" onclick="bukaBahan(\'\')">+ Bahan Baru</button>'}
      <!-- EKSPOR/IMPOR ADA DI KEDUA HALAMAN dan isinya SAMA: satu berkas untuk
           seluruh bahan, termasuk Barang Floor. Dua berkas terpisah berarti dua
           unggahan yang harus diingat, dan yang lupa mengunggah satunya tidak
           akan diberitahu apa pun. Saringan & pencarian yang sedang aktif
           sengaja tidak ikut — lihat catatan di bagian EKSPOR & IMPOR EXCEL. -->
      <button class="btn btn-ghost btn-sm" onclick="exportBahanXlsx()" title="Unduh SELURUH bahan (termasuk Barang Floor) sebagai berkas Excel — saringan di layar ini tidak ikut">⬇ Excel</button>
      <button class="btn btn-ghost btn-sm" onclick="exportBahanCsv()" title="Sama isinya dengan Excel, tapi tanpa mengunduh pustaka apa pun. Excel membukanya sama saja">⬇ CSV</button>
      <button class="btn btn-ghost btn-sm" onclick="pilihBerkasBahan()" title="Unggah berkas hasil ekspor yang sudah disunting — .xlsx maupun .csv dikenali sendiri. Tidak ada yang dihapus, dan ada pratinjau sebelum ditulis">⬆ Impor</button>
      <input type="file" id="fBahan" accept=".xlsx,.xls,.csv,text/csv" class="hidden" onchange="bacaBerkasBahan(this)">
    </div>
    ${(!floor&&kembar.length)?`<div class="notice warn" style="margin:0 0 12px"><div>
      <b>${kembar.length} nama di sini juga jadi nama Menu Jadi, dan belum ada resep yang memakainya sebagai bahan.</b>

function lihatPakai(nama){
  const b=PB[low(nama)];
  const pakai=dipakaiOleh(nama).map(r=>{

    const m=modalMenu(r).total;

/* ---- PILIHAN SATUAN DATANG DARI PURCHASING (14 Agustus 2026) ----
   Sebelumnya kotak satuan di Ubah Bahan / Bahan Baru adalah input teks bebas.
   Akibatnya satu bahan bisa bersatuan "Gr" di sini dan tercentang "Gram" di
   purchasing — dua ejaan yang sama artinya bagi manusia, tapi bukan bagi
   konversi Kg↔Gram di bawah. Sumbernya sekarang satu: daftar satuan yang
   dicentang purchasing untuk bahan ITU. */
function satuanPurchasing(nama){
  const p=PRODUK[nama]; if(!p) return null;
  const s=Array.isArray(p.satuan)?p.satuan.map(x=>String(x||'').trim()).filter(Boolean):[];
  /* Barang produksi Central Kitchen tidak memakai daftar centang: satuannya
     ditentukan isi pack-nya (1 Pack = 500 Gram), persis seperti di form order
     purchasing. Keduanya ditawarkan supaya harga belinya boleh dicatat per
     pack maupun per satuan dasar. */
  const ck=[];
  if(p.sumber==='ck'||p.sumber==='both'){
    if(p.packSatuan) ck.push(String(p.packSatuan));
    if(num(p.packIsi)>0) ck.push('Pack');
  }
  /* Satuan yang PUNYA UKURAN ikut ditawarkan — "Botol Besar" tidak ada di
     SATUAN_TERSEDIA (daftar baku cuma punya satu "Botol"), jadi tanpa baris ini
     satuan buatan sendiri yang sudah diukur tetap tidak bisa dipilih di sini,
     dan ukurannya jadi angka yang tersimpan tanpa jalan memakainya.
     Server sudah menambahkannya ke `satuan` — tapi HANYA kalau daftar itu tidak
     kosong (kosong berarti "semua satuan boleh", mengisinya justru
     mempersempit). Untuk bahan berdaftar kosong, dari sinilah ia datang. */
  const uk=[]; if(purDasar(p)) uk.push(purDasar(p));
  purSatuanUkur(p).forEach(k=>uk.push(k));
  const gab=[]; s.concat(ck).concat(uk).forEach(u=>{ if(u&&!gab.some(x=>low(x)===low(u))) gab.push(u); });
  return gab.length?gab:null;
}
/* Daftar kosong di purchasing = BELUM DIATUR, dan itu berarti seluruh satuan
   baku boleh — perilaku yang sama dengan form order dan halaman catat
   (satuanBahan() di catat-common.js). Kalau di sini dibuat lebih ketat, bahan
   yang belum diatur jadi tidak punya satu pun satuan yang bisa dipilih.

   Nilai yang SEDANG tersimpan selalu ikut digambar walau di luar daftar,
   ditandai "(lama)". Tanpa itu, membuka bahan lama bersatuan "Gr" lalu menekan
   Simpan diam-diam menggantinya ke pilihan pertama — dan satuan yang berubah
   tanpa disadari langsung mengubah modal SETIAP resep yang memakai bahan itu. */
function opsiSatuanBahan(nama,terpilih){
  const daftar=satuanPurchasing(nama)||SATUAN_TERSEDIA;
  const t=String(terpilih||'').trim();
  const ada=daftar.some(u=>low(u)===low(t));
  let h=daftar.map(u=>`<option value="${esc(u)}"${low(u)===low(t)?' selected':''}>${esc(u)}</option>`).join('');
  if(t&&!ada) h=`<option value="${esc(t)}" selected>${esc(t)} (lama)</option>`+h;
  if(!t)      h=`<option value="" selected>— pilih satuan —</option>`+h;
  return h;
}

}

        if(t.sisi==='beli') return `Harganya dari baris ini — <b>${rp2(per1(EB))}</b> per ${esc(EB.satuan||'satuan')}.${
          t.dipakai.length?` Sudah ada buktinya: <b>${t.dipakai.length} resep</b> memakainya sebagai <b>Bahan</b> (${esc(t.dipakai.slice(0,3).map(r=>r.nama).join(', '))}${t.dipakai.length>3?', …':''}).`

        return `Ada <b>menu jadi</b> bernama <b>${esc(t.r.nama)}</b>, tapi belum ada baris resep mana pun yang memakai nama ini sebagai <b>Bahan</b>. Selama begitu barisnya dihitung sebagai bayangan. Pilih di atas: <b>dibeli</b> kalau barangnya dipesan ke vendor, <b>dibuat sendiri</b> kalau ia olahan dapur/CK yang namanya cuma perlu berdiri di Purchasing.`;
      })()}</div>`:''}
      ${b&&statusPur(EB).k==='ada'?`<label style="display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:12px">

      <div class="ket" style="font-size:11.5px;color:var(--muted-2);margin:-6px 0 12px">Arah sebaliknya berjalan sendiri: bahan yang diganti namanya di modul Purchasing otomatis ikut berubah di sini, berikut baris resep yang memakainya.</div>`:''}
