function segarPer1(){
  const el=$('per1Box'); if(!el||!EB) return;
  const q=num(EB.qty_beli), hg=num(EB.harga_beli);
  el.innerHTML=q>0
    ? `<div>Harga per satuan: <b>${rp2(hg/q)}</b> per ${esc(EB.satuan||'unit')} — inilah angka yang dipakai semua resep.</div>`
    : `<div>Qty beli harus lebih dari 0, kalau tidak harga per satuannya tidak bisa dihitung.</div>`;
}
/* GANTI NAMA MENGUBAH KEDUA SISI (permintaan user 14 Agustus 2026: "kalau saya
   ubah nama, yang di bahan & harga juga ikut berubah"). Karena kedua modul
   sekarang memakai satu daftar nama, mengganti nama hanya di satu sisi justru
   MEMUTUS kaitannya — bahan yang tadinya dikenal jadi "belum ada di
   purchasing" tanpa ada yang mengubah apa pun di sana.

   Purchasing diberi tahu lewat addProduct berikut `oldProductName`; itu jalur
   ganti-nama miliknya sendiri, jadi order lama tetap menunjuk barang yang sama.
   Kalau purchasing menolak, penggantian di HPP TETAP jalan dan pesannya
   disebutkan — data HPP tidak boleh tersandera modul tetangga. */
function simpanBahan(){
  const lama=EB.namaLama||'', baru=String(EB.nama||'').trim();
  if(!baru){ alert('Nama bahan belum diisi.'); return; }
  const kotak=$('ikutPur');
  const ikut=!!(kotak&&kotak.checked&&lama&&lama!==baru&&PRODUK[lama]);
  if(!ikut){ kirim({action:'simpanBahan',data:EB},'Bahan tersimpan.'); return; }
  const p=PRODUK[lama]||{};
  fetch(API_ITEM,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'addProduct',productName:baru,oldProductName:lama,
        primaryVendor:p.utama||'',backupVendors:p.cadangan||[],units:p.satuan||[]})})
    .then(r=>r.text())
    .then(t=>{
      let j=null; try{ j=JSON.parse(t); }catch(e){}
      if(j&&j.status==='error') throw new Error(j.message||'ditolak purchasing');
      return muatProduk();
    })
    .catch(e=>{ pesan(`<div class="notice warn">⚠ Nama di purchasing TIDAK ikut berubah (${esc(e.message||'')}). Nama di HPP tetap disimpan — samakan manual di modul Purchasing.</div>`); })
    .then(()=>kirim({action:'simpanBahan',data:EB},'Bahan tersimpan, nama purchasing ikut disesuaikan.'));
}
/* Membuang bayangan bahan yang namanya sudah ada di Daftar Resep. Yang
   menentukan APA yang dihapus adalah SERVER (lihat hapusBahanSamaResep di
   stock-mysql/hpp.php), bukan daftar nama dari layar ini: layar cuma memegang
   halaman yang sedang tampil, dan daftar yang dikirim sebagian akan menyisakan
   sisanya tanpa ada yang tahu.

   Resepnya sendiri TIDAK tersentuh — yang dibuang bayangannya. */
function hapusBahanKembar(){
  /* DIPERSEMPIT 17 Agustus 2026: yang dihapus cuma bayangan SUNGGUHAN — tabrakan
     nama yang tidak dipakai resep mana pun sebagai Bahan dan tidak ditandai
     "dibeli jadi". Aturan lamanya menyapu SETIAP tabrakan, jadi tombol ini akan
     menghapus Dimsum Ayam, Indomie Goreng, dan Sate Taichan yang justru barang
     beli. Servernya memakai aturan yang sama persis (hapusBahanSamaResep di
     stock-mysql/hpp.php) — dua aturan berbeda di dua sisi berarti angka di
     tombol tidak pernah sama dengan yang benar-benar terhapus. */
  const n=S.bahan.filter(b=>tabrakan(b).bayangan);
  if(!n.length) return;
  konfirmasi({judul:'Hapus bayangan bahan?', tombol:`Hapus ${n.length} bahan`, bahaya:true,
    onYa:()=>{
      setSync('','Menghapus…');
      fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
          body:JSON.stringify({action:'hapusBahanSamaResep',by:(ME&&ME.name)||''})})
        .then(r=>r.text()).then(t=>{
          let j=null; try{ j=JSON.parse(t); }catch(e){}
          if(!j||j.status==='error') throw new Error((j&&j.message)||'balasan bukan JSON');
          pesan(`<div class="notice ok">✓ ${j.dihapus} bahan dihapus dari daftar bahan. Resepnya tidak tersentuh.</div>`);
          return muat();
        })
        .catch(e=>{ setSync('err','✕ Gagal'); pesan(`<div class="notice bad">✕ Gagal menghapus: ${esc(e.message||'')}. Kalau server belum diperbarui, unggah ulang <b>stock-mysql/</b> dulu.</div>`); });
    },
    pesan:`<b>${n.length} baris</b> akan dihapus dari <b>Bahan &amp; Harga</b>: namanya ada di <b>Daftar Resep</b>, dan tidak ada satu pun baris resep yang memakainya — baik sebagai Bahan maupun sebagai Resep — serta belum ditentukan sumber harganya.
      <div style="margin-top:8px;font-size:12px;color:var(--muted)">${esc(n.slice(0,8).map(b=>b.nama).join(' · '))}${n.length>8?` · … (+${n.length-8})`:''}</div>
      <div class="ket" style="font-size:12px;color:var(--muted);margin-top:8px">Resepnya sendiri <b>tidak disentuh</b> — yang dibuang barisnya di daftar bahan.</div>
      <div class="notice warn" style="margin:12px 0 0"><div>Namanya ikut hilang dari daftar ini, jadi <b>tidak bisa lagi dipesan lewat Purchasing</b> kalau ternyata masih dibutuhkan. Batalkan dulu dan tekan <b>⇄ Dibeli</b> (barang beli) atau <b>⇄ Dari resep</b> (olahan sendiri yang dipesan ke Central Kitchen) pada baris yang memang masih dipakai — sesudah itu ia tidak akan ikut terhapus.</div></div>`});
}

/* Jalan pintas dari baris tabel: satu tekan, tanpa membuka modal. Yang dikirim
   baris LENGKAP (kirim -> simpanBahan menulis seluruh kolom), bukan cuma
   saklarnya — mengirim sebagian akan mengosongkan harga & satuan barang yang
   justru sedang dinyatakan sah. */
function tandaiSisi(nama,sisi){
  const b=S.bahan.find(x=>low(x.nama)===low(nama)); if(!b) return;
  const d=Object.assign({},b,{sisi_harga:sisi});
  delete d.per1; delete d.updated_at; delete d.updated_by;
  kirim({action:'simpanBahan',data:d}, sisi==='resep'
    ? `"${b.nama}" memakai harga dari resepnya. Barisnya tetap berdiri di Purchasing, dan qty/harga beli di sini berhenti dibaca.`
    : `"${b.nama}" ditandai barang beli. Tinggal pakai namanya sebagai Bahan di resep menunya.`);
}

// Ikut memakai konfirmasi() yang sama dengan Hapus resep: dua tombol hapus
// dengan dua gaya bertanya membuat yang satu terasa lebih ringan daripada
// yang lain, padahal keduanya sama-sama tidak bisa dibatalkan.
function hapusBahan(nama){
  const pakai=dipakaiOleh(nama);
  konfirmasi({judul:'Hapus bahan?', tombol:'Hapus permanen', bahaya:true,
    onYa:()=>kirim({action:'hapusBahan',nama:nama},'Bahan dihapus.'),
    pesan:`<b>${esc(nama)}</b> akan dihapus dari daftar bahan dan <b>tidak bisa dikembalikan</b>.`
      +(pakai.length?`<div class="notice bad" style="margin:12px 0 0">
        <div>Dipakai <b>${pakai.length} resep</b>: ${esc(pakai.slice(0,5).map(x=>x.nama).join(', '))}${pakai.length>5?', …':''}.
        Modal resep-resep itu akan <b>kehilangan komponen ini</b> dan turun tanpa sebab yang terlihat di sana.</div></div>`:'')});
}

/* ====================== SATU DAFTAR NAMA DENGAN PURCHASING ======================
   14 Agustus 2026, permintaan user: pencocokan dihapus sebagai konsep. Nama
   bahan di HPP HARUS sama persis dengan nama di basis bahan baku purchasing,
   supaya bahan baru di sana langsung terpakai di sini tanpa ada yang perlu
   menyandingkan.

   Konsekuensi yang disengaja: vendor TIDAK lagi disimpan di sini, melainkan
   dibaca langsung dari purchasing tiap kali digambar. Vendor yang disalin akan
   basi diam-diam begitu purchasing ganti pemasok — dan tidak ada satu pun
   layar yang akan memberitahu. */
const adaDiPurchasing=nama=>!!PRODUK[nama];
/* Keadaan sebuah bahan terhadap purchasing. EMPAT keadaan, bukan dua —
   "ada" vs "belum ada" saja pernah membuat bahan yang SUDAH disandingkan user
   tetap tertulis "belum ada di purchasing", dan itu terbaca seperti pekerjaan
   yang hilang padahal cuma namanya yang belum diganti. */
function statusPur(b){
  if(PRODUK[b.nama]) return {k:'ada',t:'',c:''};
  /* Saklar "perlu ada di purchasing" (14 Agustus 2026). Bahan yang memang tidak
     dibeli lewat purchasing BUKAN pekerjaan yang tertinggal — ia tidak boleh
     ikut menghitung di spanduk, kalau tidak angkanya tidak pernah bisa nol dan
     spanduknya jadi peringatan abadi yang berhenti dibaca orang. */
  if(b.di_purchasing===0||b.produk==='-') return {k:'mandiri',t:'tidak perlu di purchasing',c:'mute'};
  if(b.produk&&PRODUK[b.produk]) return {k:'beda',t:'nama beda',c:'warn'};
  return {k:'belum',t:'belum di purchasing',c:'info'};
}
/* SIAPA YANG MEMASOK SEBUAH BAHAN — teks yang tampil di kolom Vendor, dan
   apakah ia NAMA VENDOR atau KEADAAN.

   17 Agustus 2026, permintaan user: "di purchasing saya sudah define dia online
   dan tidak ada vendor, kenapa masih ada nama Novi?". Sebabnya cabang terakhir
   yang dulu berbunyi `return b.vendor||''` — jatuh ke vendor yang TERSIMPAN di
   hpp_bahan, salinan dari berkas Excel Maret 2026. Bunga Telang sudah dipindah
   ke pembelian online di purchasing, tapi salinan lamanya masih menyebut Novi,
   dan tidak ada satu pun layar yang akan memberitahu bahwa itu sudah basi —
   persis yang sudah ditulis sebagai peringatan di kepala bagian ini, cuma
   kodenya sendiri belum mengikutinya.

   Sekarang: kalau bahannya ADA di basis purchasing, purchasing-lah jawabannya,
   TERMASUK ketika ia menjawab "tidak ada vendor". Kosongnya itu jawaban, bukan
   isian yang belum sempat diisi:

     - caraBeli 'online' -> "Online". Barang dipesan daring, memang tidak punya
       vendor tetap. Sama dengan yang ditampilkan kartu order di Purchasing
       (lihat onlineTanpaVendor di deploy/stock/purchasing/index.html).
     - sumber 'ck'       -> "Central Kitchen". Diproduksi sendiri lalu diambil
       outlet; juga tidak punya vendor, dan juga bukan kekurangan data.
     - selain itu       -> kosong, artinya purchasing memang belum menunjuk
       vendor utamanya.

   Salinan `b.vendor` hanya dipakai untuk bahan yang TIDAK ADA di purchasing
   sama sekali — di situ ia satu-satunya keterangan yang kita punya, dan tidak
   ada sumber lain yang bisa membantahnya. */
function vendorInfo(b){
  const p=infoPur(b);
  if(p&&p.utama) return {teks:p.utama,keadaan:''};
  if(p){
    if(low(p.caraBeli)==='online') return {teks:'Online',keadaan:'online'};
    if(low(p.sumber)==='ck')       return {teks:'Central Kitchen',keadaan:'ck'};
    return {teks:'',keadaan:''};
  }
  return {teks:(b&&b.vendor)||'',keadaan:''};
}
// Satu pembaca teks untuk pencarian, pengurutan, dan ekspor — supaya "online"
// bisa diketik di kotak cari dan berkas ekspornya menyebut hal yang sama
// dengan layarnya.
function vendorOf(b){ return vendorInfo(b).teks; }
/* Sisa pekerjaan dari masa pencocokan: bahan yang namanya masih beda dari
   nama purchasing pasangannya. Sekali klik, seluruhnya diganti nama dan semua
   baris resep yang merujuknya ikut ditambal server. */
function spanduSamakan(){
  const punyaNama={}; S.bahan.forEach(b=>{ punyaNama[b.nama]=1; });
  const beda=S.bahan.filter(b=>b.produk&&b.produk!=='-'&&b.produk!==b.nama);
  /* DIPISAH: yang bisa diganti namanya, dan yang tujuannya sudah dipakai bahan
     lain. Sebelumnya keduanya dihitung jadi satu, jadi tombolnya tetap muncul
     sesudah diklik dan selalu memulangkan "0 disamakan, N dilewati" — tombol
     yang mustahil menyelesaikan pekerjaannya sendiri. Yang bentrok sekarang
     punya jalan keluarnya masing-masing. */
  const bisa=beda.filter(b=>!punyaNama[b.produk]);
  const bentrok=beda.filter(b=>punyaNama[b.produk]);
  const sisa=S.bahan.filter(b=>b.produk&&b.produk!=='-'&&b.produk===b.nama);
  let h='';
  if(bisa.length||sisa.length){
    h+=`<div class="notice warn"><div>
      <b>${bisa.length} bahan namanya masih berbeda dari purchasing</b>${sisa.length?` (dan ${sisa.length} sudah sama, tinggal dibersihkan penandanya)`:''}.
      Pasangan yang dulu Anda buat dipakai sekali untuk <b>mengganti namanya</b> — resep yang memakainya ikut disesuaikan otomatis.
      ${bisa.length?`<div style="margin-top:6px;font-size:12px;color:var(--muted)">Contoh: ${bisa.slice(0,4).map(b=>esc(b.nama)+' → '+esc(b.produk)).join(' · ')}</div>`:''}
      <div style="margin-top:9px"><button class="btn btn-primary btn-sm" onclick="samakanNama()">🔤 Samakan nama dengan purchasing</button></div>
    </div></div>`;
  }
  if(bentrok.length){
    h+=`<div class="notice bad"><div>
      <b>${bentrok.length} pasangan tidak bisa disamakan otomatis</b> — nama tujuannya sudah dipakai bahan lain di sini, dan menggabung dua bahan berharga beda itu keputusan Anda, bukan skrip.
      <div class="tbl-wrap" style="margin-top:10px"><table><thead><tr><th>Bahan HPP</th><th>Dipasangkan ke</th><th class="num">Dipakai</th><th></th></tr></thead><tbody>
      ${bentrok.map(b=>`<tr>
        <td><b>${esc(b.nama)}</b> <span style="color:var(--muted-2)">${rp2(per1(b))}</span></td>
        <td>${esc(b.produk)} <span style="color:var(--muted-2)">${rp2(per1(S.bahan.find(x=>x.nama===b.produk)||{}))}</span></td>
        <td class="num">${dipakaiOleh(b.nama).length}</td>
        <td style="white-space:nowrap">
          <button class="btn btn-ghost btn-xs" onclick="lepasPasangan('${esc(b.nama)}')">Lepas pasangan</button>
          <button class="btn btn-danger btn-xs" onclick="gabungBahan('${esc(b.nama)}','${esc(b.produk)}')">Gabungkan</button></td></tr>`).join('')}
      </tbody></table></div>
      <div class="ket" style="font-size:11.5px;margin-top:8px;color:var(--muted)"><b>Lepas</b> = keduanya tetap berdiri sendiri (pilih ini kalau pasangannya memang salah, mis. Tomat Chery ≠ Tomato Paste). <b>Gabungkan</b> = resep yang memakai bahan kiri dialihkan ke bahan kanan, lalu yang kiri dihapus.</div>
    </div></div>`;
  }
  return h;
}
function lepasPasangan(nama){
  const b=S.bahan.find(x=>x.nama===nama); if(!b) return;
  if(!confirm(`Lepas pasangan "${nama}" dari "${b.produk}"?\n\nTidak ada yang dihapus — keduanya tetap berdiri sendiri.`)) return;
  kirim({action:'simpanBahan',data:Object.assign({},b,{produk:''})},'Pasangan dilepas.');
}
function gabungBahan(dari,ke){
  const a=S.bahan.find(x=>x.nama===dari), n=dipakaiOleh(dari).length;
  if(!a) return;
  if(!confirm(`Gabungkan "${dari}" ke "${ke}"?\n\n${n} resep yang memakai "${dari}" akan dialihkan memakai "${ke}", lalu "${dari}" dihapus.\n\nHarga "${ke}" tidak diubah. Tidak bisa dibatalkan.`)) return;
  kirim({action:'gabungBahan',dari:dari,ke:ke},`"${dari}" digabungkan ke "${ke}".`);
}
/* Produk purchasing yang belum punya baris di HPP. Sejak penambahan disambung
   dua arah, ini cuma sisa sejarah — produk yang sudah berdiri di sana sebelum
   penyambungannya dibuat. Ditarik sekali, lalu spanduknya hilang selamanya. */
function spanduTarik(){
  const nama=Object.keys(PRODUK);
  if(!nama.length) return '';
  const adaHpp={}; S.bahan.forEach(b=>{ adaHpp[b.nama]=1; });
  const kurang=nama.filter(n=>!adaHpp[n]);
  if(!kurang.length) return '';
  /* "belum ada di modul ini", bukan "di sini": yang berarea Floor akan mendarat
     di halaman Barang Floor, bukan di halaman tempat spanduk ini dibaca — dan
     tombol yang menjanjikan N baris lalu memunculkan sebagiannya di tempat lain
     terbaca seperti tarikan yang setengah gagal. */
  const nFloorKurang=kurang.filter(n=>isFloor({nama:n})).length;
  return `<div class="notice warn"><div>
    <b>${kurang.length} bahan ada di Purchasing tapi belum ada di modul ini.</b>${
      nFloorKurang?` ${nFloorKurang} di antaranya berarea Floor dan akan mendarat di halaman <b>Barang Floor</b>.`:''}
    Sejak sekarang bahan baru dari sana masuk sendiri — yang ini sisa yang sudah berdiri lebih dulu.
    Tarik sekali supaya kedua daftar benar-benar sama; harganya dibiarkan nol untuk diisi belakangan.
    <div style="margin-top:6px;font-size:12px;color:var(--muted)">Contoh: ${kurang.slice(0,5).map(esc).join(' · ')}</div>
    <div style="margin-top:9px"><button class="btn btn-primary btn-sm" onclick="tarikProduk()">⬇ Tarik ${kurang.length} bahan dari Purchasing</button></div>
  </div></div>`;
}
function tarikProduk(){
  if(!confirm('Tarik semua bahan purchasing yang belum ada di sini?\n\nBarisnya dibuat dengan harga nol — tidak ada harga yang ditimpa.')) return;
  setSync('','Menarik…');
  fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'tarikProduk',by:(ME&&ME.name)||''})})
    .then(r=>r.text()).then(t=>{
      let j=null; try{ j=JSON.parse(t); }catch(e){}

/* ====================== EKSPOR & IMPOR EXCEL (17 Agustus 2026, permintaan user)
   ======================
   "Bahan dan harga bisa di-import dan export via Excel." Yang dijawab bukan
   kenyamanan: menaikkan harga 40 bahan sesudah vendor kirim daftar harga baru
   berarti 40× buka modal, ketik, simpan — dan yang terlewat tidak kelihatan
   dari mana pun, karena modal resep tetap terhitung dengan harga lama tanpa
   satu pun tanda.

   ALURNYA SATU ARAH BOLAK-BALIK, sama persis dengan Purchasing → Database &
   Vendor: unduh dulu (isinya SELURUH bahan), sunting di Excel, unggah lagi.
   Ekspor sengaja TIDAK ikut saringan/pencarian yang sedang aktif — berkas yang
   cuma memuat sebagian akan terasa seperti "data lengkap" saat dibuka besok,
   dan yang mengimpornya kembali mengira sisanya memang sudah tidak ada.

   IMPOR TIDAK PERNAH MENGHAPUS dan tidak pernah menggandakan: baris dicocokkan
   ke data lewat NAMA (tak peduli besar-kecil huruf, sama dengan aturan kunci
   tabelnya). Nama yang sudah ada diperbarui, yang belum ada ditambahkan, dan
   yang ada di data tapi tidak ada di berkas DIBIARKAN.

   IMPOR JUGA TIDAK PERNAH MENGGANTI NAMA. Nama di berkas yang berbeda dari yang
   tersimpan berarti bahan BARU — tidak ada kolom yang bisa memberitahu mana
   yang sebenarnya "bahan lama yang berganti nama". Ganti nama tetap lewat
   tombol Ubah, tempat resep yang memakainya ikut ditambal server.

   DUA FORMAT: .xlsx dan .csv. Ekspor menawarkan keduanya; IMPOR cuma satu
   tombol dan mengenali sendiri berkas yang dipilih — yang mengunggah tidak
   perlu mengingat lagi tadi mengunduhnya dalam bentuk apa.

   Pustaka .xlsx DIMUAT SAAT DIBUTUHKAN, bukan di <head>: ratusan KB untuk
   fitur yang dipakai sebulan sekali, sementara halaman ini dibuka tiap hari.
   Gagal memuatnya hanya mematikan jalur Excel, dan pesannya menunjuk ke CSV
   yang tidak butuh unduhan apa pun. */
const XLSX_URL='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
let _xlsxJanji=null;
function muatXlsx(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  // Janji yang sama dipakai ulang: menekan Excel dua kali beruntun tidak boleh
  // menyuntikkan dua <script>.
  if(_xlsxJanji) return _xlsxJanji;
  _xlsxJanji=new Promise((ok,gagal)=>{
    const s=document.createElement('script');
    s.src=XLSX_URL;
    s.onload=()=>window.XLSX?ok(window.XLSX):gagal(new Error('XLSX tidak terpasang'));
    s.onerror=()=>gagal(new Error('gagal memuat'));
    document.head.appendChild(s);
  }).catch(e=>{ _xlsxJanji=null; throw e; });   // boleh dicoba lagi
  return _xlsxJanji;
}
function galatXlsx(){
  pesan(`<div class="notice bad">✕ Pustaka Excel gagal diunduh — periksa koneksi, atau pakai <b>⬇ CSV</b> yang tidak butuh unduhan apa pun. Excel membuka CSV sama saja.</div>`);
}

// Pemisah nilai DI DALAM satu sel (kolom Area bisa berisi lebih dari satu).
// '|' dipilih karena ia tidak pernah muncul di nama bahan/vendor dan tidak
// punya arti khusus bagi Excel — sama dengan yang dipakai Purchasing, supaya
// dua berkas dari dua modul tidak memakai dua aturan.
const CSV_SUB='|';
const capYa=v=>v?'Ya':'Tidak';
const bacaYa=v=>/^(ya|y|true|1|benar)$/i.test(String(v||'').trim());
function csvSel(v){ return `"${String(v==null?'':v).replace(/"/g,'""')}"`; }
function csvBaris(a){ return a.map(csvSel).join(','); }
function unduhCsv(nama,teks){
  /* BOM di depan: tanpa itu Excel membaca UTF-8 sebagai ANSI, dan nama
     ber-aksen berubah jadi karakter sampah begitu dibuka. */
  const blob=new Blob(['﻿'+teks],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=nama; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
/* Pembaca CSV yang benar-benar mengurai tanda kutip: nama bahan memuat koma
   ("Ayam Fillet, Fresh") dan catatan memuat baris baru. Membelah dengan
   split(',') memecah baris seperti itu jadi dua kolom dan menggeser SELURUH
   kolom sesudahnya — data yang mendarat di kolom yang salah tidak menimbulkan
   galat apa pun, ia cuma jadi harga yang aneh.

   Pemisah kolom DIDETEKSI dari baris pertama: Excel berbahasa Indonesia
   menyimpan ulang CSV dengan titik-koma, jadi berkas yang kita ekspor dengan
   koma bisa kembali sebagai titik-koma tanpa penggunanya tahu. */
function uraiCsv(teks){
  const t=String(teks||'').replace(/^﻿/,'');
  const brs=t.split(/\r?\n/)[0]||'';
  let luar=true,koma=0,titik=0;
  for(let i=0;i<brs.length;i++){
    const c=brs[i];
    if(c==='"') luar=!luar;
    else if(luar&&c===',') koma++;
    else if(luar&&c===';') titik++;
  }
  const SEP=titik>koma?';':',';
  const rows=[]; let row=[],sel='',dalam=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(dalam){
      if(c==='"'){ if(t[i+1]==='"'){ sel+='"'; i++; } else dalam=false; }
      else sel+=c;
      continue;
    }
    if(c==='"'){ dalam=true; continue; }
    if(c===SEP){ row.push(sel); sel=''; continue; }
    if(c==='\r') continue;
    if(c==='\n'){ row.push(sel); rows.push(row); row=[]; sel=''; continue; }
    sel+=c;
  }
  if(sel!==''||row.length){ row.push(sel); rows.push(row); }
  // Baris kosong dibuang: Excel hampir selalu meninggalkan satu di ekor.
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}
/* Kolom dicocokkan lewat NAMA KEPALANYA, bukan posisi. Orang menyisipkan kolom
   sendiri, memindahkan kolom, atau menghapus yang tidak dipakai — dan impor
   yang membaca posisi akan diam-diam memasukkan catatan ke kolom harga. Yang
   tidak ada di berkas memulangkan undefined, dan pemanggil memperlakukannya
   sebagai "tidak disebutkan". */
function petaKolom(kepala){
  const p={};
  (kepala||[]).forEach((h,i)=>{ p[String(h||'').trim().toLowerCase()]=i; });
  return (baris,nama)=>{
    const i=p[String(nama).toLowerCase()];
    return i===undefined?undefined:String(baris[i]==null?'':baris[i]).trim();
  };
}
/* ANGKA DARI BERKAS — jangan diganti num(). num() membuang semua kecuali digit
   dan titik, jadi "1.000" (ribuan gaya Indonesia, dan itulah yang diketik orang
   di Excel berbahasa Indonesia) terbaca sebagai 1. Harga beli adalah satu-
   satunya angka di modul ini yang salahnya menggeser SELURUH modal menu, dan
   selisih 1.000× seperti itu tidak menimbulkan satu pun galat — ia cuma muncul
   sebagai COGS yang tiba-tiba sangat sehat.

   Aturannya: kalau titik DAN koma sama-sama ada, yang paling belakang adalah
   desimalnya. Kalau cuma satu jenis yang ada, ia dianggap pemisah ribuan hanya
   bila polanya memang berkelompok tiga (1.234.567) — "12.5" tetap 12,5. */
function angkaImpor(v){
  if(typeof v==='number') return isFinite(v)?v:0;
  let s=String(v==null?'':v).replace(/[^0-9.,\-]/g,'').trim();
  if(!s) return 0;
  const t=s.lastIndexOf('.'), k=s.lastIndexOf(',');
  if(t>-1&&k>-1){
    if(t>k){ s=s.split(',').join(''); }
    else   { s=s.split('.').join('').replace(',','.'); }
  } else if(k>-1){
    s=/^-?\d{1,3}(,\d{3})+$/.test(s) ? s.split(',').join('') : s.replace(',','.');
  } else if(t>-1){
    if(/^-?\d{1,3}(\.\d{3})+$/.test(s)) s=s.split('.').join('');
  }
  const n=parseFloat(s);
  return isNaN(n)?0:n;
}

/* KOLOM. Enam yang pertama BISA DISUNTING dan dibaca kembali saat impor; empat
   sisanya keterangan — dituliskan supaya berkasnya bisa dibaca sebagai daftar
   harga yang utuh (harga per satuan, vendor, area, dipakai berapa resep), tapi
   diubah pun tidak berpengaruh. Judulnya sengaja menyebutkan itu sendiri:
   kolom "Vendor" polos akan disunting orang, lalu hilang tanpa penjelasan —
   vendor memang milik Purchasing, bukan modul ini (lihat vendorOf). */
/* "Sumber Harga" hanya berarti untuk nama yang bertabrakan dengan resep;
   kosong untuk ratusan bahan lain, dan kosong memang artinya "tidak ada
   pertanyaannya". Isinya `Beli` / `Resep` — kata yang sama dengan yang dipilih
   di layar, supaya yang menyunting di Excel tidak perlu menerjemahkan. */
const KOL_BAHAN=['Nama Bahan','Satuan','Qty Beli','Harga Beli','Dibeli Lewat Purchasing','Sumber Harga','Catatan',
                 'Harga / Satuan (otomatis)','Vendor (dari Purchasing)','Area (dari Purchasing)','Dipakai (resep)'];
/* BAYANGAN TIDAK IKUT DIEKSPOR — dan sejak 17 Agustus 2026 yang disebut
   bayangan jauh lebih sempit: tabrakan nama yang tidak dipakai resep mana pun
   sebagai Bahan DAN tidak ditandai "dibeli jadi" (lihat tabrakan()). Barang
   beli yang bernama sama dengan menu — Dimsum Ayam, Indomie Goreng — sekarang
   ikut diekspor, karena harganya memang diurus dari berkas ini.

   Yang benar-benar bayangan tetap dikecualikan: baris itu ditawarkan untuk
   dihapus di halaman yang sama, dan memasukkannya ke berkas berarti unggahan
   berikutnya MENGHIDUPKANNYA KEMBALI — pekerjaan yang sudah diselesaikan orang
   muncul lagi tanpa ada yang merasa melakukannya. */
function bahanEkspor(){
  return S.bahan.filter(b=>!tabrakan(b).bayangan)
                .slice().sort((a,b)=>low(a.nama).localeCompare(low(b.nama)));
}
function barisEksporBahan(){
  return bahanEkspor().map(b=>{
    const t=tabrakan(b);
    return [
      b.nama, b.satuan||'', num(b.qty_beli), num(b.harga_beli),
      capYa(b.di_purchasing!==0),
      /* Yang ditulis SISI YANG BERLAKU, termasuk yang disimpulkan dari bukti —
         bukan cuma yang tersimpan. Berkas yang membiarkan kolomnya kosong untuk
         baris yang jelas-jelas 'resep' akan terbaca seperti pekerjaan yang
         belum diputuskan, padahal ia sudah beres. */
      t.sisi==='beli'?'Beli':t.sisi==='resep'?'Resep':'',
      b.catatan||'',
      /* Harga per satuan mengikuti sisinya, sama dengan yang tampil di layar. */
      Math.round((t.sisi==='resep'?perUnitResep(t.r):per1(b))*100)/100,
      vendorOf(b), areaOf(b).join(CSV_SUB), dipakaiOleh(b.nama).length
    ];
  });
}
function tglBerkas(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function ringkasEkspor(n,bentuk){
  const bayangan=S.bahan.length-bahanEkspor().length;
  pesan(`<div class="notice ok"><div>✓ <b>${n} bahan</b> diekspor ke ${bentuk}. Sunting kolom <b>Satuan, Qty Beli, Harga Beli, Dibeli Lewat Purchasing, Sumber Harga, dan Catatan</b> di sana, lalu unggah lagi lewat <b>⬆ Impor</b>.
    <div style="margin-top:6px;font-size:12px;color:var(--muted)">Empat kolom terakhir cuma keterangan — diubah pun tidak dibaca saat impor. Baris yang dihapus dari berkas <b>tidak</b> ikut terhapus dari data.${
      bayangan?` ${bayangan} baris bayangan tidak ikut diekspor: namanya ada di Daftar Resep dan belum ada resep yang memakainya sebagai bahan.`:''}</div></div></div>`);
}
function exportBahanCsv(){
  const r=barisEksporBahan();
  unduhCsv(`bahan_hpp_laksamana_${tglBerkas()}.csv`,[csvBaris(KOL_BAHAN),...r.map(csvBaris)].join('\n'));
  ringkasEkspor(r.length,'CSV');
}
/* Baris yang diekspor disusun SEKALI di barisEksporBahan, lalu dipakai jalur
   CSV maupun Excel. Menyusunnya dua kali berarti kolom yang ditambahkan nanti
   bisa ikut di satu format dan tertinggal di format lain — dan yang tertinggal
   tidak menimbulkan galat, ia cuma hilang dari berkas yang dipakai orang. */
async function exportBahanXlsx(){
  let XL; try{ XL=await muatXlsx(); }catch(e){ return galatXlsx(); }
  const aoa=[KOL_BAHAN,...barisEksporBahan()];
  const ws=XL.utils.aoa_to_sheet(aoa);
  /* Lebar kolom disetel supaya nama bahan tidak terpotong dan angka tidak
     tampil "####" saat dibuka. Berkas yang harus dilebarkan manual dulu sebelum
     bisa dibaca akan membuat orang kembali mengetik satu-satu di layar. */
  ws['!cols']=aoa[0].map((h,i)=>({wch:Math.min(42,Math.max(String(h).length+2,
    ...aoa.slice(1).map(r=>String(r[i]==null?'':r[i]).length+2)))}));
  const wb=XL.utils.book_new();
  XL.utils.book_append_sheet(wb,ws,'Bahan & Harga');
  XL.writeFile(wb,`bahan_hpp_laksamana_${tglBerkas()}.xlsx`);
  ringkasEkspor(aoa.length-1,'Excel');
}

/* ---------- ALUR IMPOR ---------- */
let IMPOR=null;   // {rows:[…]} — sudah digabung dengan data lama, menunggu Ya
function pilihBerkasBahan(){
  const i=$('fBahan'); if(!i) return;
  i.value='';                       // berkas yang sama boleh dipilih dua kali
  i.click();
}
/* FORMATNYA DIKENALI SENDIRI dari nama berkasnya — tidak ada tombol "impor
   Excel" vs "impor CSV". Salah pilih tombol adalah kesalahan yang tidak perlu
   ada. */
function bacaBerkasBahan(el){
  const f=el.files&&el.files[0]; if(!f) return;
  const excel=/\.xlsx?$/i.test(f.name||'');
  const lanjut=rows=>{
    const h=bacaBahanRows(rows);
    if(h.galat) return pesan(`<div class="notice bad">✕ ${h.galat}</div>`);
    if(!h.rows.length) return pesan(`<div class="notice bad">✕ Tidak ada baris berisi nama bahan di berkas itu.</div>`);
    siapkanImpor(h.rows,h.bolong);
  };
  const fr=new FileReader();
  fr.onerror=()=>pesan(`<div class="notice bad">✕ Berkasnya tidak bisa dibaca.</div>`);
  if(excel){
    fr.onload=()=>{
      muatXlsx().then(XL=>{
        const wb=XL.read(new Uint8Array(fr.result),{type:'array'});
        const ws=wb.Sheets[wb.SheetNames[0]];
        if(!ws) return pesan(`<div class="notice bad">✕ Tidak ada sheet yang bisa dibaca di berkas itu.</div>`);
        /* header:1 -> array-of-array, bentuknya sama persis dengan keluaran
           uraiCsv, jadi CSV dan Excel memakai SATU pembaca kolom. Dua pembaca
           terpisah berarti kolom yang ditambahkan nanti bisa terbaca di satu
           format dan diam di format lain. raw:false + defval:'' supaya angka &
           sel kosong datang sebagai teks — sisa kodenya memperlakukan semuanya
           sebagai teks lalu mengubahnya sendiri lewat angkaImpor. */
        lanjut(XL.utils.sheet_to_json(ws,{header:1,raw:false,defval:''})
                 .filter(r=>(r||[]).some(c=>String(c).trim()!=='')));
      }).catch(e=>{
        if(!window.XLSX) return galatXlsx();
        console.error(e);
        pesan(`<div class="notice bad">✕ Isi berkas Excel tidak bisa dibaca. Coba buka lalu simpan ulang dari Excel.</div>`);
      });
    };
    fr.readAsArrayBuffer(f);
  } else {
    fr.onload=()=>lanjut(uraiCsv(fr.result));
    fr.readAsText(f,'utf-8');
  }
}
function bacaBahanRows(rows){
  if(!rows.length) return {galat:'Berkasnya kosong.'};
  const amb=petaKolom(rows[0]);
  if(amb(rows[0],'Nama Bahan')===undefined){
    return {galat:'Kolom <b>Nama Bahan</b> tidak ada di baris pertama berkas itu. Pakai hasil <b>⬇ Excel</b> atau <b>⬇ CSV</b> dari halaman ini sebagai kerangkanya.'};
  }
  const out=[],bolong=[];
  rows.slice(1).forEach((b,i)=>{
    const n=amb(b,'Nama Bahan');
    if(!n){ bolong.push(i+2); return; }        // +2: baris kepala + hitungan dari 1
    const rec={nama:n};
    /* SEL KOSONG = "tidak disebutkan", BUKAN nol. Harga yang dikosongkan orang
       di Excel hampir selalu berarti "saya tidak mengurus baris ini", bukan
       "bahan ini gratis" — dan nol di sini menjatuhkan modal setiap resep yang
       memakainya tanpa satu pun tanda. Catatan dikecualikan: mengosongkan
       catatan memang satu-satunya cara menghapusnya dari berkas. */
    const isi=(kol,kunci,ubah)=>{
      const v=amb(b,kol);
      if(v===undefined||v==='') return;
      rec[kunci]=ubah?ubah(v):v;
    };
    isi('Satuan','satuan');
    isi('Qty Beli','qty_beli',angkaImpor);
    isi('Harga Beli','harga_beli',angkaImpor);
    isi('Dibeli Lewat Purchasing','di_purchasing',v=>bacaYa(v)?1:0);
    /* Sumber Harga: cuma dua kata yang dikenali. Yang lain — termasuk sel
       kosong — berarti "tidak disebutkan", dan nilai tersimpannya dipertahankan.
       Mengosongkan kolom ini di Excel adalah hal yang paling mungkin terjadi
       tanpa disengaja (kolomnya memang kosong untuk ratusan baris lain), dan
       menafsirkannya sebagai "batalkan keputusannya" akan mengembalikan Ayam
       Karage jadi bayangan berharga Rp0 di seluruh resep yang memakainya. */
    isi('Sumber Harga','sisi_harga',v=>{
      const s=low(v);
      return s.indexOf('resep')>-1?'resep':s.indexOf('beli')>-1?'beli':undefined;
    });
    if(rec.sisi_harga===undefined) delete rec.sisi_harga;
    const ct=amb(b,'Catatan');
    if(ct!==undefined) rec.catatan=ct;
    out.push(rec);
  });
  return {rows:out,bolong};
}
/* PRATINJAU SEBELUM MENULIS. Impor 300 baris adalah satu tekan tombol yang
   mengubah sumber SELURUH angka modal di modul ini; tanpa pratinjau, satu
   berkas salah pilih baru ketahuan sesudahnya — dan tidak ada tombol urungnya.

   Yang paling perlu dilihat bukan jumlah barisnya, tapi HARGA YANG PALING
   BERGERAK: satu angka yang salah baca (1.000 jadi 1) muncul di situ sebagai
   −99,9% dan langsung terbaca, sementara di ringkasan "40 diperbarui" ia tidak
   bisa dibedakan dari kenaikan yang memang diniatkan. */
function siapkanImpor(rows,bolong){
  const baru=[],ubah=[]; let sama=0;
  rows.forEach(r=>{
    const lama=PB[low(r.nama)];
    if(!lama){
      baru.push(Object.assign({satuan:'Gram',qty_beli:0,harga_beli:0,vendor:'',produk:'',
                               kategori:'',catatan:'',di_purchasing:1,sisi_harga:''},r));
      return;
    }
    /* DIGABUNG DENGAN BARIS LAMA, bukan dikirim apa adanya: server menulis
       seluruh kolom tiap kali (hpp_simpan_bahan), jadi kolom yang tidak ada di
       berkas — vendor cadangan, penanda pasangan `produk`, kategori — akan
       terhapus jadi kosong tanpa ada yang memintanya. */
    const rec=Object.assign({},lama,r);
    delete rec.per1; delete rec.updated_at; delete rec.updated_by; delete rec.namaLama;
    /* Ejaan yang TERSIMPAN dipertahankan. Pencocokan tidak peduli besar-kecil
       huruf, dan kunci tabelnya juga tidak — jadi "ayam fillet" di berkas tidak
       akan mengganti nama "Ayam Fillet" yang sudah ada, ia cuma memperbarui
       barisnya. Mengirim ejaan berkas justru menyesatkan: layar akan
       menampilkannya seolah berubah padahal tidak. */
    rec.nama=lama.nama;
    const beda=['satuan','qty_beli','harga_beli','catatan'].some(k=>
        String(rec[k]==null?'':rec[k])!==String(lama[k]==null?'':lama[k]))
      || (rec.di_purchasing===0)!==(lama.di_purchasing===0)
      /* Sisi dibandingkan terhadap sisi yang BERLAKU, bukan yang tersimpan.
         Ekspor menuliskan sisi hasil simpulan juga (Ayam Karage -> "Resep"),
         jadi membandingkannya dengan kolom tersimpan yang masih kosong akan
         membuat unduh-lalu-unggah tanpa menyunting apa pun terbaca sebagai
         puluhan baris "diperbarui" — dan pratinjau yang berbohong soal itu
         adalah pratinjau yang berhenti dibaca orang. */
      || sisiHarga(rec)!==tabrakan(lama).sisi;
    if(beda) ubah.push({rec,lama}); else sama++;
  });
  if(!baru.length&&!ubah.length){
    return pesan(`<div class="notice info">Tidak ada yang berubah — ${sama} baris di berkas itu isinya sama persis dengan yang tersimpan.</div>`);
  }
  const rasio=g=>g.dari>0?(g.ke-g.dari)/g.dari:(g.ke>0?1:0);
  const gerak=ubah.map(x=>({nama:x.rec.nama,dari:per1(x.lama),ke:per1(x.rec)}))
    .filter(g=>Math.abs(g.ke-g.dari)>0.005)
    .sort((a,b)=>Math.abs(rasio(b))-Math.abs(rasio(a))).slice(0,5);
  IMPOR={rows:baru.concat(ubah.map(x=>x.rec))};
  konfirmasi({
    judul:'Impor Bahan & Harga',
    tombol:`Impor ${IMPOR.rows.length} baris`,
    onYa:jalankanImpor,
    pesan:`<div style="display:flex;gap:8px;margin-bottom:12px">
        ${[['Baru',baru.length],['Diperbarui',ubah.length],['Sama, dilewati',sama]].map(k=>
          `<div style="flex:1;text-align:center;border:1px solid var(--line);border-radius:10px;padding:9px 6px">
             <div class="mono" style="font-size:19px;font-weight:800">${k[1]}</div>
             <div style="font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px">${k[0]}</div></div>`).join('')}
      </div>
      <div style="font-size:12.5px">Nama yang <b>sudah ada akan diperbarui</b>, bukan ditambah kembar. Bahan yang ada di data tapi <b>tidak ada di berkas ini tidak dihapus</b> — ia dibiarkan apa adanya. Nama tidak pernah diganti lewat impor.</div>
      ${gerak.length?`<div class="notice warn" style="margin:12px 0 0"><div>
        <b>Harga per satuan yang paling bergerak</b> — periksa dulu, angka yang salah ketik muncul di sini:
        <div style="margin-top:6px;font-size:12px">${gerak.map(g=>
          `${esc(g.nama)}: ${rp2(g.dari)} → <b>${rp2(g.ke)}</b> (${g.dari>0?(rasio(g)>0?'+':'')+(rasio(g)*100).toFixed(1)+'%':'baru'})`).join('<br>')}</div>
      </div></div>`:''}
      ${baru.length?`<div style="margin-top:12px;font-size:12px;color:var(--muted)"><b>Contoh yang akan ditambahkan:</b> ${esc(baru.slice(0,8).map(r=>r.nama).join(', '))}${baru.length>8?`, … (+${baru.length-8})`:''}</div>`:''}
      ${(bolong&&bolong.length)?`<div class="notice warn" style="margin:12px 0 0"><div>⚠ ${bolong.length} baris dilewati karena kolom namanya kosong (baris ${bolong.slice(0,6).join(', ')}${bolong.length>6?', …':''}).</div></div>`:''}`
  });
}
function jalankanImpor(){
  if(!IMPOR||!IMPOR.rows.length) return;
  const rows=IMPOR.rows; IMPOR=null;
  setSync('','Mengimpor…');
  fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'imporBahan',by:(ME&&ME.name)||'',rows:rows})})
    .then(r=>r.text()).then(t=>{
      let j=null; try{ j=JSON.parse(t); }catch(e){}
      if(!j||j.status==='error') throw new Error((j&&j.message)||'balasan bukan JSON (stock-api-mysql/hpp.php belum ter-deploy?)');
      /* Bahan baru dari impor SENGAJA tidak didaftarkan sendiri ke purchasing,
         beda dengan tombol Simpan di layar. Satu berkas bisa membawa ratusan
         nama, dan membanjiri basis bahan baku modul tetangga adalah keputusan
         yang harus diambil orang, bukan efek samping sebuah unggahan. Jalannya
         sudah ada dan disebut di sini: spanduk "Daftarkan semuanya". */
      pesan(`<div class="notice ok"><div>✓ Impor selesai: <b>${j.baru||0} bahan baru</b>, <b>${j.diubah||0} diperbarui</b>${
        (j.galat&&j.galat.length)?`, <b>${j.galat.length} gagal</b> (${esc(j.galat.slice(0,5).join(', '))})`:''}. Yang tidak ada di berkas tidak disentuh.${
        j.baru?`<div style="margin-top:6px;font-size:12px">Bahan baru itu <b>belum</b> berdiri di basis bahan baku Purchasing — pakai tombol <b>+ Daftarkan semuanya ke Purchasing</b> di spanduk atas kalau memang dibeli ke vendor.</div>`:''}</div></div>`);
      return muat();
    })
    .catch(e=>{
      setSync('err','✕ Gagal');
      pesan(`<div class="notice bad">✕ Gagal mengimpor: ${esc(e.message||'')}. <b>Tidak ada yang tersimpan.</b> Kalau server belum diperbarui, unggah ulang <b>stock-mysql/</b> dulu.</div>`);
    });
}

/* ====================== 4. DASHBOARD HPP ====================== */
function kartu(lab,val,foot,kelas){
  return `<div class="stat ${kelas||''}"><div class="lab">${esc(lab)}</div><div class="val mono">${val}</div><div class="foot">${foot}</div></div>`;
}
/* Pemakaian bahan mentah, DIURAI sampai dasar: dish → base → bahan. Inilah
   angka yang menjawab "kalau harga ayam naik 10%, HPP goyang berapa" — dan
   satu-satunya cara mendapatkannya di Excel adalah menjumlahkan manual lintas
   sheet, jadi praktis tidak pernah dilakukan. */
function uraiBahan(r,faktor,keranjang,jalur){
  jalur=jalur||{}; if(jalur[r.id]) return; jalur[r.id]=1;
  (r.bahan||[]).forEach(b=>{
    if(!b||!b.nama) return;
    // lewatResep(), bukan b.ref: base olahan bersisi 'resep' harus DIURAI sampai
    // bahan mentahnya di sini juga, kalau tidak ia muncul di Dashboard sebagai
    // satu "bahan" berharga nol dan menutupi ayam yang sebenarnya menggerakkan.
    if(lewatResep(b)){
      const sub=cariResep(b.nama,r.jenis); if(!sub) return;
      const y=num(sub.yield_qty)||1;
      /* Konversi sama dengan modalResep — kalau di sini dilewatkan, halaman
         Dashboard memberi urutan "bahan paling menggerakkan modal" yang
         berbeda dari modal resepnya sendiri. */
      uraiBahan(sub,faktor*(qtySesuai(num(b.qty),b.satuan,sub.yield_unit).qty/y),keranjang,jalur);
    }else{
      const it=PB[low(b.nama)]; if(!it) return;
      const k=it.nama;
      keranjang[k]=keranjang[k]||{nama:k,nilai:0,menu:{}};
      keranjang[k].nilai+=per1(it)*qtySesuai(num(b.qty),b.satuan,it.satuan,infoPur(it)).qty*faktor;
    }
  });
  delete jalur[r.id];
}

    ${kartu('COGS rata-rata Minuman',rata('drink')===null?'—':pct(rata('drink')),cogsList.filter(x=>x.r.jenis==='drink').length+' menu berharga','')}

  </div>`;

  if(hilangTot.size) h+=`<div class="notice warn">⚠ <b>${hilangTot.size} nama bahan dirujuk resep tapi tidak ada di daftar Bahan</b>, jadi modal resep yang memakainya lebih rendah dari yang sebenarnya. Contoh: ${[...hilangTot].slice(0,6).map(esc).join(', ')}. Tambahkan lewat menu <b>Bahan &amp; Harga</b>.</div>`;

  });
  h+=`</div></div>`;

  /* --- menu paling boros --- */

    <div class="card-sub">Urut COGS% tertinggi. "Harga ideal" = harga jual yang membuat COGS-nya pas ${AMBANG*100}%.</div>
    <div class="tbl-wrap"><table><thead><tr><th>Menu</th><th>Jenis</th><th class="num">Modal</th><th class="num">Harga jual</th><th class="num">COGS%</th><th class="num">Harga ideal</th><th class="num">Selisih</th></tr></thead><tbody>`;
  cogsList.sort((a,b)=>b.c-a.c).slice(0,15).forEach(x=>{

      <td class="num mono">${rp(ideal)}</td>
      <td class="num mono" style="color:${ideal>hj?'var(--danger)':'var(--ok)'}">${ideal>hj?'+':''}${rp(ideal-hj)}</td></tr>`;
  });
  h+=`</tbody></table></div></div>`;

  /* --- sensitivitas bahan --- */
  const keranjang={};
  dish.forEach(r=>{

    Object.keys(keranjang).forEach(k=>{ if(keranjang[k].nilai>0) keranjang[k].menu[r.id]=1; });

  });
  const sens=Object.values(keranjang).sort((a,b)=>b.nilai-a.nilai).slice(0,15);
  const totalNilai=Object.values(keranjang).reduce((s,x)=>s+x.nilai,0)||1;
  h+=`<div class="card"><h3>Bahan yang paling menggerakkan HPP</h3>
    <div class="card-sub">Nilai pemakaian = jumlah rupiah bahan ini di dalam <b>satu porsi setiap menu</b>, sudah diurai lewat base-nya. Kolom terakhir: tambahan modal seluruh menu kalau harganya naik 10%.</div>
    <div class="tbl-wrap"><table><thead><tr><th>Bahan</th><th class="num">Harga/satuan</th><th class="num">Nilai pemakaian</th><th class="num">Porsi dari total</th><th class="num">Jika naik 10%</th></tr></thead><tbody>`;
  sens.forEach(x=>{
    const b=PB[low(x.nama)];
    h+=`<tr><td><b>${esc(x.nama)}</b></td><td class="num mono">${b?rp2(per1(b)):'—'}</td>
      <td class="num mono">${rp(x.nilai)}</td><td class="num">${pct(x.nilai/totalNilai)}</td>
      <td class="num mono" style="color:var(--danger)">+${rp(x.nilai*0.1)}</td></tr>`;

  /* --- simulasi --- */
  h+=`<div class="card"><h3>Simulasi kenaikan harga bahan</h3>

    <div class="bar">
      <select id="simBahan">${S.bahan.slice().sort((a,b)=>low(a.nama)<low(b.nama)?-1:1).map(b=>`<option value="${esc(b.nama)}">${esc(b.nama)}</option>`).join('')}</select>
      <select id="simPersen"><option value="5">+5%</option><option value="10" selected>+10%</option><option value="20">+20%</option><option value="50">+50%</option></select>
      <button class="btn btn-primary btn-sm" onclick="jalankanSimulasi()">Hitung</button>
    </div><div id="simHasil"></div></div>`;
  return h;
}
function jalankanSimulasi(){
  const nama=$('simBahan').value, p=num($('simPersen').value)/100;
  const b=PB[low(nama)]; if(!b) return;
  const dish=S.resep.filter(r=>r.tipe==='dish'&&hargaJual(r)>0);
  const sebelum=dish.map(r=>({id:r.id,c:cogsOf(r),m:modalMenu(r).total}));
  const asli=b.harga_beli;
  b.harga_beli=num(asli)*(1+p); MEMO={};
  const sesudah=dish.map(r=>({id:r.id,nama:r.nama,c:cogsOf(r),m:modalMenu(r).total}));
  b.harga_beli=asli; MEMO={};
  const petaS={}; sebelum.forEach(x=>petaS[x.id]=x);
  const berubah=sesudah.filter(x=>x.m-petaS[x.id].m>0.5)
    .map(x=>({...x,dM:x.m-petaS[x.id].m,c0:petaS[x.id].c}))
    .sort((a,b)=>b.dM-a.dM);
  const baruLewat=berubah.filter(x=>x.c>AMBANG&&x.c0<=AMBANG);
  const totalTambah=berubah.reduce((s,x)=>s+x.dM,0);
  $('simHasil').innerHTML=!berubah.length
    ? `<div class="notice info">Tidak ada menu yang memakai <b>${esc(nama)}</b>.</div>`
    : `<div class="notice ${baruLewat.length?'bad':'ok'}">
         <div><b>${berubah.length} menu</b> ikut naik modalnya, total <b>${rp(totalTambah)}</b> per satu porsi tiap menu.
         ${baruLewat.length?`<b>${baruLewat.length} menu jadi tembus ${AMBANG*100}%</b>: ${baruLewat.slice(0,8).map(x=>esc(x.nama)).join(', ')}.`:'Tidak ada yang jadi tembus ambang.'}</div></div>
       <div class="tbl-wrap"><table><thead><tr><th>Menu</th><th class="num">Modal naik</th><th class="num">COGS sebelum</th><th class="num">COGS sesudah</th></tr></thead><tbody>
       ${berubah.slice(0,12).map(x=>`<tr><td>${esc(x.nama)}</td><td class="num mono">+${rp(x.dM)}</td>
          <td class="num">${chipCogs(x.c0)}</td><td class="num">${chipCogs(x.c,x.r)}</td></tr>`).join('')}
       </tbody></table></div>`;
}

/* ====================== 5. PEMAKAIAN & SELISIH ======================
   Digabungkan dari prototipe "Kontrol Bahan Baku". Rumusnya dibawa apa adanya
   karena memang benar dan sudah dipahami user:

     masuk         = stok awal + belanja
     tercatat      = terpakai menurut resep + spoil + team + rnd + compliment
     pakai aktual  = masuk − stok opname
     SELISIH       = pakai aktual − tercatat     (+ boros/hilang, − irit)

   Selisih inilah yang jadi lampu: hijau di bawah ambang kuning, kuning sampai
   ambang merah, merah di atasnya (bawaan 3% & 8%, bisa diubah di Pengaturan).
   Yang tidak dibawa dari prototipe: halaman opname & waste berdiri sendiri —
   pencatatannya sudah ada di Stock > Pemakaian Bahan Baku, dan dua tempat
   mencatat hal yang sama berarti dua angka yang berbeda.

   PENJUALAN bulan itu diketik satu kali; darinya COGS aktual = nilai pakai
   aktual ÷ penjualan. Itulah COGS sebenarnya, yang selalu berbeda dari COGS
   teoretis di Dashboard (yang dihitung dari resep) — dan selisih antara
   keduanya persis yang dicari orang tiap tutup bulan. */
let PK={bulan:'',baris:{},penjualan:0,catatan:'',daftar:[],muat:false,q:''};
function bulanIni(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function hitungPakai(nama){
  const r=PK.baris[nama]||{}, b=PB[low(nama)];
  const h=b?per1(b):0;
  const masuk=num(r.sa)+num(r.beli);
  const lain=num(r.spoil)+num(r.team)+num(r.rnd)+num(r.comp);
  const tercatat=num(r.resep)+lain;
  const aktual=masuk-num(r.opname);
  const selisih=aktual-tercatat;
  const p=tercatat>0?(selisih/tercatat)*100:0;
  const a=Math.abs(p);
  const lampu=a>num(SET.lampuMerah)?'merah':a>num(SET.lampuKuning)?'kuning':'hijau';
  return {h,masuk,lain,tercatat,aktual,selisih,p,lampu,nilai:selisih*h,nilaiAktual:aktual*h,
          nilaiStok:num(r.opname)*h,ada:masuk>0||tercatat>0||num(r.opname)>0};
}
function muatPakai(bulan){
  PK.bulan=bulan||PK.bulan||bulanIni();
  setSync('','Memuat…');
  return fetch(API+'?action=pakai&bulan='+encodeURIComponent(PK.bulan)+'&t='+Date.now())
    .then(r=>r.json()).then(j=>{
      PK.baris={}; (j.baris||[]).forEach(r=>{ PK.baris[r.bahan]=r; });
      PK.penjualan=num(j.penjualan); PK.catatan=j.catatan||''; PK.daftar=j.daftarBulan||[];
      PK.muat=true; setSync('ok','✓ Tersambung'); render();
    }).catch(e=>{ setSync('err','✕ Gagal'); pesan(`<div class="notice bad">✕ Gagal memuat pemakaian: ${esc(e.message||'')}</div>`); });
}
function isiPakai(nama,kolom,nilai){
  PK.baris[nama]=PK.baris[nama]||{bahan:nama};
  PK.baris[nama][kolom]=nilai;
  segarBaris(nama);
}
function segarBaris(nama){
  const c=hitungPakai(nama);
  const el=document.querySelector(`[data-hasil="${CSS.escape(nama)}"]`);
  if(el) el.innerHTML=selHtml(c);
  const box=$('pkRingkas'); if(box) box.innerHTML=ringkasPakai();
}
function selHtml(c){
  const w={hijau:'ok',kuning:'warn',merah:'bad'}[c.lampu];
  return `<span class="chip ${w}">${c.selisih>0?'+':''}${(Math.round(c.selisih*100)/100).toLocaleString('id-ID')} · ${c.p.toFixed(1)}%</span>
          <div style="font-size:11px;color:${c.selisih>0?'var(--danger)':'var(--muted-2)'};margin-top:2px">${c.nilai?rp(c.nilai):'—'}</div>`;
}
function ringkasPakai(){
  let rugi=0,stok=0,aktual=0,merah=0,kuning=0,hijau=0,n=0;
  Object.keys(PK.baris).forEach(nm=>{
    const c=hitungPakai(nm); if(!c.ada) return;
    n++; if(c.selisih>0) rugi+=c.nilai;
    stok+=c.nilaiStok; aktual+=c.nilaiAktual;
    if(c.lampu==='merah') merah++; else if(c.lampu==='kuning') kuning++; else hijau++;
  });
  const cogs=PK.penjualan>0?aktual/PK.penjualan:null;
  return `<div class="row-in" style="margin-bottom:0">
    ${kartu('COGS aktual',cogs===null?'—':pct(cogs),PK.penjualan>0?('pakai '+rp(aktual)+' ÷ penjualan '+rp(PK.penjualan)):'isi dulu nilai penjualan','accent')}
    ${kartu('Nilai kerugian',rp(rugi),'selisih yang boros/hilang, dalam rupiah','')}
    ${kartu('Nilai stok akhir',rp(stok),'hasil opname × harga bahan','')}
    ${kartu('Lampu',`<span class="chip ok">${hijau}</span> <span class="chip warn">${kuning}</span> <span class="chip bad">${merah}</span>`,n+' bahan terisi bulan ini','')}
  </div>`;
}
function viewPakai(){
  if(!PK.muat){ muatPakai(PK.bulan||bulanIni()); return `<div class="card"><div class="empty"><div class="big">⏳</div>Memuat pemakaian…</div></div>`; }
  const q=low(PK.q);
  /* Yang ditampilkan: bahan yang sudah ada isinya + hasil pencarian. 296 baris
     kosong sekaligus tidak ada yang mengisinya, dan membuat halaman ini
     terlihat seperti pekerjaan yang mustahil selesai. */
  const terisi=S.bahan.filter(b=>PK.baris[b.nama]&&hitungPakai(b.nama).ada);
  const cari=q?S.bahan.filter(b=>low(b.nama).indexOf(q)>-1&&terisi.indexOf(b)<0).slice(0,40):[];
  const daftar=terisi.concat(cari);
  let h=`<div class="card">
    <div class="bar">
      <input type="month" value="${esc(PK.bulan)}" onchange="PK.muat=false;muatPakai(this.value)">
      <div class="field" style="margin:0"><input type="number" step="any" placeholder="Nilai penjualan bulan ini"
        value="${PK.penjualan||''}" oninput="PK.penjualan=this.value;document.getElementById('pkRingkas').innerHTML=ringkasPakai()" style="min-width:200px"></div>
      <input type="search" id="qp" placeholder="Cari bahan untuk ditambahkan…" value="${esc(PK.q)}"
        oninput="cari(this,v=>{PK.q=v})">
      <button class="btn btn-primary btn-sm" onclick="simpanPakai()">💾 Simpan bulan ini</button>
    </div>
    <div id="pkRingkas">${ringkasPakai()}</div>
  </div>
  <div class="card"><h3>Analisa selisih ${esc(PK.bulan)}</h3>
    <div class="card-sub">Selisih = (stok awal + belanja − opname) − (terpakai resep + spoil + team + RND + compliment). Lampu kuning di atas ${SET.lampuKuning}%, merah di atas ${SET.lampuMerah}%.</div>`;
  if(!daftar.length){
    h+=`<div class="empty"><div class="big">📅</div>Belum ada bahan yang diisi untuk bulan ini.<br>Cari namanya di kotak pencarian di atas untuk mulai mengisi.</div></div>`;
    return h;
  }
  h+=`<div class="tbl-wrap"><table><thead><tr>
      <th>Bahan</th><th class="num">Stok awal</th><th class="num">Belanja</th><th class="num">Resep</th>
      <th class="num">Spoil</th><th class="num">Team</th><th class="num">RND</th><th class="num">Comp</th>
      <th class="num">Opname</th><th class="num">Selisih</th></tr></thead><tbody>`;
  daftar.forEach(b=>{
    const r=PK.baris[b.nama]||{}, c=hitungPakai(b.nama);
    const kot=(k)=>`<input type="number" step="any" value="${r[k]!=null&&r[k]!==0?r[k]:''}" style="width:74px;padding:5px 6px;border:1.5px solid var(--line);border-radius:7px;text-align:right;font-size:12.5px"
        oninput="isiPakai('${esc(b.nama)}','${k}',this.value)">`;
    h+=`<tr><td><b>${esc(b.nama)}</b><div style="font-size:11px;color:var(--muted-2)">${rp2(per1(b))} / ${esc(b.satuan||'')}</div></td>
      <td class="num">${kot('sa')}</td><td class="num">${kot('beli')}</td><td class="num">${kot('resep')}</td>
      <td class="num">${kot('spoil')}</td><td class="num">${kot('team')}</td><td class="num">${kot('rnd')}</td>
      <td class="num">${kot('comp')}</td><td class="num">${kot('opname')}</td>
      <td class="num" data-hasil="${esc(b.nama)}">${selHtml(c)}</td></tr>`;
  });
  h+=`</tbody></table></div></div>`;
  return h;
}
function simpanPakai(){
  const baris=Object.keys(PK.baris).map(nm=>Object.assign({bahan:nm},PK.baris[nm]));
  kirimPakai({action:'simpanPakai',data:{bulan:PK.bulan,baris:baris,penjualan:PK.penjualan,catatan:PK.catatan}});
}
function kirimPakai(payload){
  payload.by=(ME&&ME.name)||'';
  setSync('','Menyimpan…');
  fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)})
    .then(r=>r.text()).then(t=>{
      let j=null; try{ j=JSON.parse(t); }catch(e){}
      if(!j||j.status==='error') throw new Error((j&&j.message)||'balasan bukan JSON');
      pesan(`<div class="notice ok">✓ Pemakaian ${esc(PK.bulan)} tersimpan (${j.baris} bahan).</div>`);
      setSync('ok','✓ Tersambung');
    })
    .catch(e=>{ setSync('err','✕ Gagal'); pesan(`<div class="notice bad">✕ Gagal menyimpan: ${esc(e.message||'')}</div>`); });
}

/* ====================== 6. KALKULATOR HPP ======================
   Dari prototipe "Galangan HPP". Bedanya dengan penyunting resep: yang ini
   TIDAK menyimpan apa pun — tempat mencoba "kalau begini, jadinya berapa"
   sebelum sebuah menu benar-benar dibuat. */
let KAL={baris:[{nama:'',qty:'',ref:'bahan'}],hargaJual:'',porsi:1};
function kalTotal(){
  let t=0,hilang=0;
  KAL.baris.forEach(b=>{ if(!b.nama) return; const s=hitungBaris(b,'food'); if(s.ada) t+=s.nilai; else hilang++; });
  /* Kalkulator ini menimbang MENU yang akan dijual — COGS & harga idealnya
     dipakai memutuskan harga. Jadi spare-nya ikut, sama seperti menu jadi yang
     sudah tersimpan; kalau tidak, harga yang diputuskan di sini selalu sedikit
     lebih murah daripada yang keluar di Daftar Resep begitu menunya dibuat. */
  const p=spareModal();
  return {t:t+t*p, bahan:t, spare:t*p, rate:p, hilang};
}
function viewKalk(){
  let h=`<div class="card"><h3>Coba hitung</h3>
    <div class="card-sub">Pilih bahan atau resep yang sudah ada, isi takarannya. Tidak ada yang tersimpan — kalau hasilnya bagus, buat resepnya di menu Daftar Resep.</div>
    <datalist id="dlBahanK">${S.bahan.map(b=>`<option value="${esc(b.nama)}">`).join('')}</datalist>
    <datalist id="dlResepK">${S.resep.map(r=>`<option value="${esc(r.nama)}">`).join('')}</datalist>
    <datalist id="dlSatuanK">${dlSatuanHtml()}</datalist>
    <div class="brs" style="font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase">
      <div>Sumber</div><div>Nama</div><div>Qty</div><div>Satuan</div><div style="text-align:right">Subtotal</div><div></div></div>`;
  KAL.baris.forEach((b,i)=>{
    const s=hitungBaris(b,'food');
    h+=`<div class="brs">
      <select onchange="KAL.baris[${i}].ref=this.value;render()">
        <option value="bahan"${b.ref!=='resep'?' selected':''}>Bahan</option>
        <option value="resep"${b.ref==='resep'?' selected':''}>Resep</option></select>
      <!-- Sama seperti penyunting resep: mengetik TIDAK menggambar ulang
           halaman. Di sini akibatnya bahkan lebih parah — render() membangun
           ulang seluruh kalkulator, jadi setiap huruf melempar fokus keluar. -->
      <input list="${b.ref==='resep'?'dlResepK':'dlBahanK'}" value="${esc(b.nama||'')}" placeholder="nama…" oninput="KAL.baris[${i}].nama=this.value;segarKalk()">
      <input inputmode="numeric" value="${b.qty||''}" placeholder="qty" oninput="KAL.baris[${i}].qty=this.value;segarKalk()">
      <input list="dlSatuanK" value="${esc(b.satuan||'')}" placeholder="satuan" oninput="KAL.baris[${i}].satuan=this.value;segarKalk()">
      <div class="sub" data-ksub="${i}">${s.ada?rp2(s.nilai)+tandaCampur(s,b):'<span style="color:var(--danger)">tak dikenal</span>'}</div>
      <button class="x" onclick="KAL.baris.splice(${i},1);render()">✕</button></div>`;
  });
  h+=`<div style="margin-top:8px"><button class="btn btn-ghost btn-sm" onclick="KAL.baris.push({nama:'',qty:'',ref:'bahan'});render()">+ Baris</button>
      <button class="btn btn-ghost btn-sm" onclick="KAL={baris:[{nama:'',qty:'',ref:'bahan'}],hargaJual:'',porsi:1};render()">Bersihkan</button></div>
    <div class="g3" style="margin-top:14px">
      <div class="field"><label>Jadi berapa porsi</label><input inputmode="numeric" value="${KAL.porsi}" oninput="KAL.porsi=this.value;segarKalk()"></div>
      <div class="field"><label>Rencana harga jual (Rp)</label><input inputmode="numeric" value="${fmtIn(KAL.hargaJual)}" placeholder="0" oninput="angkaKetik(this,v=>{KAL.hargaJual=v});segarKalk()"></div>
    </div></div>
  <div class="row-in" id="kalKartu">${kartuKalk()}</div>
  <div id="kalNote">${noteKalk()}</div>`;
  return h;
}
/* Kartu & catatan kalkulator dipisah jadi fungsinya sendiri supaya bisa
   digambar ulang TANPA menyentuh kotak isian yang sedang diketik. */
function kartuKalk(){
  const {t,hilang,bahan,spare,rate}=kalTotal();
  const porsi=num(KAL.porsi)||1, perPorsi=t/porsi, hj=num(KAL.hargaJual);
  const c=hj>0?perPorsi/hj:null;
  const kakiModal=hilang?`${hilang} baris belum dikenal`
    :(spare>0?`bahan ${rp(bahan)} + spare ${pctSp(rate)} ${rp(spare)}`
             :'dari '+KAL.baris.filter(b=>b.nama).length+' bahan');
  return kartu('Modal total',rp(t),kakiModal,'accent')
    +kartu('Modal per porsi',rp2(perPorsi),porsi+' porsi','')
    +kartu('COGS',c===null?'—':pct(c),hj>0?('harga jual '+rp(hj)):'isi rencana harga jual','')
    +kartu('Harga ideal',rp(perPorsi/num(SET.targetFood)),
        `supaya COGS pas ${(num(SET.targetFood)*100).toFixed(0)}% (minuman: ${rp(perPorsi/num(SET.targetDrink))})`,'');
}
function noteKalk(){
  const {t}=kalTotal();
  const porsi=num(KAL.porsi)||1, perPorsi=t/porsi, hj=num(KAL.hargaJual);
  if(hj<=0) return '';
  const c=perPorsi/hj, tgt=num(SET.targetFood);
  return `<div class="notice ${c>tgt?'bad':'ok'}">${c>tgt
    ? `Dengan harga ${rp(hj)}, COGS-nya ${pct(c)} — di atas target. Harga minimalnya ${rp(perPorsi/tgt)}, atau modalnya perlu turun ke ${rp2(hj*tgt)} per porsi.`
    : `COGS ${pct(c)}, di bawah target. Marginnya ${rp(hj-perPorsi)} per porsi.`}</div>`;
}
function segarKalk(){
  document.querySelectorAll('[data-ksub]').forEach(el=>{
    const b=KAL.baris[+el.dataset.ksub]; if(!b) return;
    const s=hitungBaris(b,'food');
    el.innerHTML=s.ada?rp2(s.nilai)+tandaCampur(s,b):'<span style="color:var(--danger)">tak dikenal</span>';
  });
  const k=$('kalKartu'); if(k) k.innerHTML=kartuKalk();
  const n=$('kalNote'); if(n) n.innerHTML=noteKalk();
}

/* ====================== CETAK / PDF ======================
   "Export PDF" di repo ini = jendela cetak peramban lalu "Simpan sebagai PDF".
   Tidak ada pustaka PDF dari CDN di modul mana pun, dan menambahnya berarti
   satu ketergantungan luar lagi yang bisa mati diam-diam. */
function lembarResep(r,denganModal){
  const m=modalMenu(r), y=num(r.yield_qty)||1;
  let t=`<div class="rjudul">${esc(r.nama)}</div>
    <div class="meta">${namaJenis(r.jenis)} · ${r.tipe==='base'?'Base':'Menu jadi'} · ${esc(r.seksi||'')} · hasil ${y} ${esc(r.yield_unit||'')}</div>
    <table><thead><tr><th style="width:44%">Bahan</th><th>Qty</th><th>Satuan</th>${denganModal?'<th class="num">Harga/satuan</th><th class="num">Subtotal</th>':''}</tr></thead><tbody>`;
  (r.bahan||[]).forEach(b=>{
    if(b.catatan!==undefined&&b.nama===undefined){
      t+=`<tr><td colspan="${denganModal?5:3}"><i>${esc(b.catatan)}</i></td></tr>`; return;
    }
    const s=hitungBaris(b,r.jenis);
    const it=b.ref==='resep'?null:PB[low(b.nama)];
    t+=`<tr><td>${esc(b.nama)}${b.ref==='resep'?' (resep)':''}</td><td>${b.qty}</td><td>${esc(b.satuan||'')}</td>`;
    if(denganModal) t+=`<td class="num">${it?rp2(per1(it)):(b.ref==='resep'?'—':'?')}</td><td class="num">${s.ada?rp2(s.nilai):'?'}</td>`;
    t+=`</tr>`;
  });
  if(denganModal){
    /* Spare ditulis sebagai BARISNYA SENDIRI, bukan dilebur ke TOTAL MODAL.
       Lembar ini dipegang orang dapur sambil menghitung ulang di kertas; total
       yang lebih besar daripada jumlah subtotal di atasnya akan dikira salah
       hitung, dan yang mencari selisihnya tidak punya satu pun petunjuk. */
    if(m.spare>0) t+=`<tr><th colspan="4">Modal bahan</th><th class="num">${rp(m.bahan)}</th></tr>
        <tr><th colspan="4">Spare ${pctSp(m.rate)}</th><th class="num">${rp(m.spare)}</th></tr>`;
    t+=`<tr><th colspan="4">TOTAL MODAL</th><th class="num">${rp(m.total)}</th></tr>
        <tr><th colspan="4">Modal per ${esc(r.yield_unit||'unit')}</th><th class="num">${rp2(m.total/y)}</th></tr>`;
    if(hargaJual(r)>0) t+=`<tr><th colspan="4">Harga jual · COGS</th><th class="num">${rp(hargaJual(r))} · ${pct(cogsOf(r))}</th></tr>`;
  }
  t+=`</tbody></table>`;
  if(r.catatan) t+=`<div class="meta"><b>Catatan:</b> ${esc(r.catatan)}</div>`;
  return t;
}
function cetak(judul,isi){
  $('sheet').innerHTML=`<div class="kop"><div><h2>${esc(judul)}</h2>
      <div class="meta">Laksamana Muda · HPP &amp; Resep · dicetak ${kini()}${ME?' oleh '+esc(ME.name):''}</div></div>
      <div class="meta">${S.resep.length} resep · ${S.bahan.length} bahan</div></div>${isi}`;
  window.print();
  setTimeout(()=>{ $('sheet').innerHTML=''; },500);
}
function cetakResep(id,denganModal){
  const r=S.resep.find(x=>x.id===id); if(!r) return;
  cetak(r.nama,lembarResep(r,denganModal));
}
function cetakBanyak(denganModal){
  /* Kedua tabel ikut tercetak: saringannya satu, jadi "PDF semua" yang cuma
     memuat menu jadi akan terasa seperti setengah pekerjaan. */
  const daftar=resepTersaring('dish').concat(resepTersaring('base'));
  if(!daftar.length) return;
  if(daftar.length>60&&!confirm(`${daftar.length} resep akan dicetak. Lanjut?`)) return;
  cetak(denganModal?'Resep & Modal':'Resep',daftar.map((r,i)=>
    `<div${i<daftar.length-1?' class="pecah"':''}>${lembarResep(r,denganModal)}</div>`).join(''));
}

/* ====================== JARINGAN ====================== */
let JALAN=false;
function kirim(payload,sukses){
  if(JALAN) return;
  JALAN=true; setSync('','Menyimpan…');
  payload.by=(ME&&ME.name)||'';
  fetch(API,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(payload)})
    .then(r=>r.text())
    .then(t=>{
      let j=null; try{ j=JSON.parse(t); }catch(e){}
      if(!j) throw new Error('balasan bukan JSON (stock-api-mysql/hpp.php belum ter-deploy?)');
      if(j.status==='error') throw new Error(j.message||'ditolak server');
      tutupModal();
      /* Pendaftaran ke purchasing dilakukan server, jadi layar harus
         MENGATAKANNYA — kalau tidak, orang tidak punya cara tahu apakah
         saklarnya benar-benar berbuat sesuatu. */
      const tambahan=j.purchasingBaru?' Namanya sekaligus didaftarkan di basis bahan baku Purchasing.'
        :j.purchasingGagal?' <b>Tapi gagal mendaftarkan ke Purchasing</b> — coba lagi, atau tambahkan manual di sana.':'';
      pesan(`<div class="notice ${j.purchasingGagal?'warn':'ok'}">✓ ${esc(sukses)}${tambahan}</div>`);
      /* Daftar produk purchasing ikut dimuat ulang: kalau tidak, bahan yang
         baru saja didaftarkan masih terbaca "belum di purchasing" sampai
         halaman disegarkan sendiri. */
      return muatProduk().then(muat);
    })
    .catch(e=>{ pesan(`<div class="notice bad">✕ Gagal: ${esc(e.message||'')}</div>`); })
    .then(()=>{ JALAN=false; setSync('ok','✓ Tersambung'); });
}
function muat(){
  return fetch(API+'?action=all&t='+Date.now())
    .then(r=>r.text())
    .then(t=>{
      let j=null; try{ j=JSON.parse(t); }catch(e){}
      if(!j) throw new Error('balasan bukan JSON');
      if(j.status==='error') throw new Error(j.message);
      S={bahan:j.bahan||[],resep:j.resep||[]};
      /* HARGA JUAL LAMA -> HARGA JUAL (15 Agustus 2026). Kotaknya sudah dihapus
         dari layar, jadi menu yang harganya cuma pernah diisi di sana akan
         terbaca "belum ada harga" dan kehilangan COGS-nya. Dipindahkan di sini,
         bukan lewat migrasi SQL: hosting ini tidak menjalankan berkas migrasi
         sendiri, dan migrasi yang harus diingat manusia adalah migrasi yang
         sebagian server tidak pernah dapat.

         Idempoten — sesudah harga_baru terisi, syaratnya tidak pernah benar
         lagi. Yang tersimpan di kolom lama dibiarkan apa adanya; ia tidak
         dibaca siapa pun dan menghapusnya butuh tulis ulang 365 baris untuk
         sesuatu yang tidak terlihat dari mana pun. */
      S.resep.forEach(r=>{ if(!num(r.harga_baru)&&num(r.harga_lama)) r.harga_baru=num(r.harga_lama); });
      if(j.setting) SET=Object.assign(SET,j.setting);
      petakan(); setSync('ok','✓ Tersambung');
      if(!S.resep.length&&!S.bahan.length) tawarkanImpor();
      render();
    });
}
/* Pemindahan awal. Tombolnya HANYA muncul saat tabelnya benar-benar kosong —
   impor kedua akan melipatgandakan resep dan mengembalikan harga bahan ke
   angka Maret 2026. Servernya menolak juga, ini lapis keduanya. */
function tawarkanImpor(){
  pesan(`<div class="notice warn"><div><b>Belum ada data.</b> Berkas "HPP Food Laksamana Updated March 2026.xlsx" sudah disiapkan untuk dipindahkan: 296 bahan &amp; 365 resep.
    <div style="margin-top:9px"><button class="btn btn-primary btn-sm" onclick="imporSeed()">📥 Pindahkan data dari Excel sekarang</button></div></div></div>`);
}
function imporSeed(){
  if(!confirm('Pindahkan 296 bahan dan 365 resep dari berkas Excel ke modul ini?\n\nDilakukan sekali; sesudah ini datanya diurus dari layar, bukan dari Excel lagi.')) return;
  setSync('','Memindahkan…');
  fetch(SEED_URL+'?t='+Date.now()).then(r=>r.json())
    .then(seed=>fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify({action:'impor',by:(ME&&ME.name)||'',data:{bahan:seed.bahan,resep:seed.resep}})}))
    .then(r=>r.text())
    .then(t=>{
      let j=null; try{ j=JSON.parse(t); }catch(e){}
      if(!j||j.status==='error') throw new Error((j&&j.message)||'balasan bukan JSON');
      pesan(`<div class="notice ok">✓ Dipindahkan: ${j.bahan} bahan, ${j.resep} resep.</div>`);
      return muat();
    })
    .catch(e=>pesan(`<div class="notice bad">✕ Gagal memindahkan: ${esc(e.message||'')}</div>`));
}
function muatProduk(){
  /* Basis bahan baku purchasing — dipakai layar pencocokan & pengisi vendor.
     Kegagalannya TIDAK boleh menjatuhkan halaman: HPP tetap berguna tanpa
     purchasing, cuma saran pencocokannya yang kosong. */
  return fetch(API_ITEM+'?t='+Date.now()).then(r=>r.json())
    .then(j=>{ PRODUK=(j&&j.products)||{}; })
    .catch(()=>{ PRODUK={}; });
}
function boot(){
  ME=bacaSesi();
  if(!ME){ location.replace('../../'); return; }
  $('suName').textContent=ME.name||'—';
  $('suAvatar').textContent=(String(ME.name||'?').trim()[0]||'?').toUpperCase();
  document.querySelectorAll('.nav a').forEach(a=>a.addEventListener('click',()=>go(a.dataset.view)));
  render();
  muatProduk().then(muat).catch(e=>{
    setSync('err','✕ Gagal');
    pesan(`<div class="notice bad">✕ Tidak bisa membaca data: ${esc(e.message||'')}. Pastikan <b>stock-api-mysql/hpp.php</b> sudah ter-deploy.</div>`);
  });
}
boot();
</script>
