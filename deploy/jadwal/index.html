<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2A2620">
<title>Jadwal Shift — Laksamana Muda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== TOKEN TEMA OFFICE LAKSAMANA ===== */
:root{
  --ink:#2A2620; --ink-2:#3A3428;
  --gold:#A9791F; --gold-2:#C8961F; --gold-dim:#7A560F; --gold-soft:#F2E9D3;
  --paper:#F7F6F4; --surface:#FFFFFF; --line:#E7E1D3; --line-soft:rgba(60,55,45,.10);
  --text:#2A2620; --muted:#5C574D; --muted-2:#928C80;
  --ok:#1F9D5F; --ok-bg:#E4F5EC; --warn:#B5831A; --warn-bg:#F7EFDB;
  --danger:#C9432B; --danger-bg:#F8E4DF; --info:#2F7FC4; --info-bg:#E4EFF8;
  --radius:16px; --radius-sm:10px; --radius-lg:20px;
  --shadow:0 4px 18px rgba(50,42,28,.06); --shadow-lg:0 18px 48px rgba(50,42,28,.12);
  --ring:0 0 0 3px rgba(227,160,8,.18); --ease:cubic-bezier(.16,1,.3,1);
  --font-display:'Plus Jakarta Sans',system-ui,sans-serif;
  --font-body:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font-body);
  background:radial-gradient(900px 480px at 50% -12%, rgba(227,160,8,.09), transparent 60%), var(--paper);
  color:var(--text);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:800;letter-spacing:-.02em;line-height:1.18;color:var(--ink)}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.hidden{display:none !important}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
a{color:var(--gold-dim)}
::-webkit-scrollbar{height:10px;width:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:20px}
::-webkit-scrollbar-thumb:hover{background:var(--muted-2)}

/* Tombol */
.btn{border:none;border-radius:var(--radius-sm);padding:10px 15px;font-weight:600;font-size:14px;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  transition:filter .15s var(--ease),transform .1s var(--ease),background .15s,border-color .15s}
.btn:active{transform:translateY(1px)}
.btn-primary{background:linear-gradient(135deg,var(--gold-2),var(--gold-dim));color:#fff;box-shadow:0 3px 12px rgba(122,86,15,.28)}
.btn-primary:hover{filter:brightness(1.06)}
.btn-ghost{background:var(--surface);border:1.5px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--gold-2);background:var(--gold-soft)}
.btn-sm{padding:7px 11px;font-size:13px;border-radius:8px}
.btn-danger{background:var(--danger);color:#fff}
.btn-ok{background:var(--ok);color:#fff}
.btn[disabled]{opacity:.5;cursor:default}

/* ===== KERANGKA: sidebar kiri + main =====
   Disamakan dengan modul Event/Marketing/Reservasi. Sebelumnya modul ini
   memakai tab melintang di atas, dan itu terasa asing begitu kru berpindah
   dari modul lain di hari yang sama — menu yang biasanya di kiri tiba-tiba
   di atas. Nilai-nilainya (250px, 66px saat diciutkan, 760px titik patah)
   sengaja SAMA PERSIS dengan modul Event supaya keduanya bergerak identik. */
#app{display:flex;min-height:100vh}
/* overflow-x:hidden jaring terakhir: begitu sidebar menyusut ke 66px, apa pun
   yang lupa disembunyikan akan menjulur keluar menimpa isi halaman. */
#sidebar{width:250px;background:#fff;border-right:1px solid var(--line-soft);position:fixed;
  height:100vh;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;transition:width .16s;z-index:30}
.brand{padding:20px 20px 16px;display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--line-soft)}
.brand img{width:34px;height:34px;object-fit:contain;flex:none}
.brand .bt{font-family:var(--font-display);font-weight:700;font-size:16px;letter-spacing:.02em;line-height:1}
.brand .bs{font-size:9px;letter-spacing:.22em;color:var(--gold);text-transform:uppercase;margin-top:3px}
.nav{padding:10px 12px;flex:1}
/* nowrap + hidden: "Jadwal Bulanan" tidak boleh melipat dua baris lalu
   menonjol keluar tepi saat sidebar menyempit. */
.nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;color:#5c574d;
  text-decoration:none;font-weight:500;font-size:13px;cursor:pointer;transition:.16s;white-space:nowrap;overflow:hidden}
.nav a:hover{background:var(--paper);color:var(--ink)}
.nav a.active{background:rgba(169,121,31,.13);color:var(--gold-dim);font-weight:600}
.nav a svg{width:17px;height:17px;flex:none;stroke-width:1.8}
.nav a .badge{margin-left:auto;background:var(--danger);color:#fff;border-radius:20px;font-size:10px;padding:1px 6px;font-weight:700;flex:none}
.nav .sect{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted-2);padding:16px 12px 7px}
.side-foot{padding:10px 14px;font-size:11px;color:var(--muted-2)}
.side-user{margin-top:auto;border-top:1px solid var(--line-soft);padding:12px;display:flex;align-items:center;gap:10px}
.su-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--gold-2),var(--gold-dim));
  color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:none}
.su-info{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.su-info b{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.su-info span{font-size:10.5px;color:var(--muted-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logout-x{background:var(--paper);border:1px solid var(--line);color:var(--muted-2);width:32px;height:32px;
  border-radius:9px;display:inline-flex;align-items:center;justify-content:center;flex:none;cursor:pointer;transition:.16s}
.logout-x:hover{border-color:var(--danger);color:var(--danger)}

#main{margin-left:250px;flex:1;min-width:0;transition:margin-left .16s}
.topbar{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.88);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:12px 26px;display:flex;align-items:center;gap:10px}
.topbar h2{font-size:18px;font-weight:700}
.topbar .crumb{font-size:12px;color:var(--muted-2)}
.content{padding:20px 26px 70px}
.spacer{flex:1}
.syncdot{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--warn-bg);color:var(--warn);flex:none}
.syncdot.err{background:var(--danger-bg);color:var(--danger)}

/* Ciutkan menu jadi ikon saja (desktop). Diingat per perangkat. */
#navMiniBtn{display:inline-flex;align-items:center;justify-content:center;font-size:19px;color:var(--muted-2);
  width:34px;height:34px;border-radius:9px;background:none;border:none;cursor:pointer;flex:none}
#navMiniBtn:hover{color:var(--gold)}
@media(max-width:760px){#navMiniBtn{display:none}}
@media(min-width:761px){
  #app.nav-mini #sidebar{width:66px}
  #app.nav-mini #main{margin-left:66px}
  #app.nav-mini .brand .bt,#app.nav-mini .brand .bs,#app.nav-mini .su-info,
  #app.nav-mini .nav .sect,#app.nav-mini .side-foot{display:none}
  #app.nav-mini .brand{justify-content:center;padding:20px 6px 16px}
  #app.nav-mini .nav{padding:10px 6px}
  #app.nav-mini .nav a{justify-content:center;gap:0;font-size:0;padding:9px 0}
  #app.nav-mini .nav a svg{width:18px;height:18px}
  #app.nav-mini .nav a .badge{display:none}
  #app.nav-mini .side-user{flex-direction:column;gap:8px;padding:10px 6px}
  #app.nav-mini .su-avatar{margin:0 auto}
}

/* Laci menu di layar kecil */
.menu-btn{display:none;background:var(--gold-soft);border:1px solid var(--line);color:var(--ink);
  width:38px;height:38px;border-radius:9px;font-size:17px;cursor:pointer;flex:none}
.menu-btn:hover{border-color:var(--gold-2);color:var(--gold-dim)}
#sideScrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:29}

/* Kartu */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
.rowbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.rowbar h2{font-size:17px}
.rowbar .spacer{flex:1}
.seg{display:inline-flex;background:var(--gold-soft);border:1px solid var(--line);border-radius:30px;padding:3px;flex-wrap:wrap}
.seg button{border:none;background:transparent;padding:7px 13px;border-radius:30px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(50,42,28,.12)}
.navdate{display:flex;align-items:center;gap:8px}
.navdate b{font-size:14px;min-width:170px;text-align:center}
.iconbtn{width:36px;height:36px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);
  display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--ink)}
.iconbtn:hover{border-color:var(--gold-2);background:var(--gold-soft)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px;border:1px solid var(--line)}
.chip .sw{width:12px;height:12px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.12)}
.legend{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tools{display:flex;gap:7px;flex-wrap:wrap}
.mutedhint{font-size:12px;color:var(--muted-2);margin-top:2px}
.note{border-radius:var(--radius-sm);padding:10px 12px;font-size:12.5px;margin-bottom:12px}
.note.w{background:var(--warn-bg);color:#6B4E0B}
.note.i{background:var(--info-bg);color:#1C4E7A}

/* Tabel jadwal */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface)}
/* Tabel daftar biasa (Dashboard). Beda dari table.sched yang berupa kisi
   jadwal: yang ini baris per orang, dibaca dari atas ke bawah. */
table.list{border-collapse:separate;border-spacing:0;width:100%;min-width:600px}
table.list th{background:var(--gold-soft);font-family:var(--font-display);font-size:11.5px;font-weight:700;
  color:var(--ink);padding:8px 10px;text-align:left;white-space:nowrap}
table.list td{padding:8px 10px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
table.list tbody tr:last-child td{border-bottom:none}
table.list tbody tr.klik{cursor:pointer}
table.list tbody tr.klik:hover{background:#FDFCFA}
table.list .no{width:34px;color:var(--muted-2);font-size:12px}
table.list .nama{font-weight:700}
table.list .kecil{font-size:11px;color:var(--muted-2)}
table.sched{border-collapse:separate;border-spacing:0;width:100%;min-width:900px}
table.sched th,table.sched td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0}
table.sched .no{width:40px;text-align:center;font-size:12px;color:var(--muted-2);font-weight:600}
table.sched .nm{min-width:170px;max-width:200px;padding:7px 10px;text-align:left;background:var(--surface)}
table.sched .jb{min-width:92px;padding:7px 8px;text-align:center;font-size:11.5px;font-weight:700;font-style:italic;color:var(--muted);background:var(--surface)}
table.sched .nm b{font-weight:700;font-size:13px;display:block;line-height:1.2}
table.sched .nm i{font-style:normal;font-size:11px;color:var(--muted-2)}
tr.hdr th{background:var(--gold-soft);font-family:var(--font-display);font-size:12px;font-weight:700;color:var(--ink);
  padding:6px 6px;text-align:center;white-space:nowrap}
tr.hdr2 th{background:#EFECE4;font-size:11.5px;font-weight:700;color:var(--muted);padding:4px 6px;text-align:center;letter-spacing:.02em}
tr.hdr2 th.wknd{color:var(--danger)}
td.cell{text-align:center;vertical-align:middle;height:44px;min-width:104px;cursor:default;transition:filter .12s;
  font-weight:800;font-size:12px;letter-spacing:.02em}
td.cell.editable{cursor:pointer}
td.cell.editable:hover{filter:brightness(.94)}
td.cell .tm{display:block;font-size:9.5px;font-weight:600;opacity:.85;letter-spacing:0}
td.cell.kosong{color:#C9C3B7;font-weight:600;font-size:16px}
tr.bandgap td{height:12px;border:none;background:transparent}

/* Ringkasan */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:11px 13px}
.stat .n{font-family:var(--font-display);font-size:23px;font-weight:800;line-height:1}
.stat .l{font-size:11px;color:var(--muted-2);font-weight:600;margin-top:4px;text-transform:uppercase;letter-spacing:.03em}

/* Baris daftar (pengajuan, pengaturan) */
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);
  border-radius:var(--radius-sm);background:var(--surface);flex-wrap:wrap;margin-bottom:8px}
.row .who{flex:1;min-width:160px}
.row .who b{font-size:13.5px}
.row .who span{font-size:11px;color:var(--muted-2);display:block}
.stpill{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:20px;letter-spacing:.02em}
.st-MENUNGGU{background:var(--warn-bg);color:var(--warn)}
.st-DISETUJUI{background:var(--ok-bg);color:var(--ok)}
.st-DITOLAK{background:var(--danger-bg);color:var(--danger)}
.aju .isi{font-size:13px;color:var(--muted);margin:4px 0 8px;width:100%}
.inp{padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);font-size:14px}
.inp:focus{outline:none;border-color:var(--gold);box-shadow:var(--ring)}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(42,38,32,.5);backdrop-filter:blur(3px);z-index:100;
  display:flex;align-items:center;justify-content:center;padding:18px}
.modal{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);width:100%;max-width:460px;max-height:90vh;overflow:auto}
.modal .mh{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.modal .mh h3{font-size:16px;flex:1}
.modal .mb{padding:18px 20px}
.modal .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.xbtn{width:30px;height:30px;border-radius:8px;border:none;background:var(--gold-soft);color:var(--ink);font-size:17px}
.field{margin-bottom:13px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);
  border-radius:var(--radius-sm);background:var(--surface);color:var(--text);font-size:14.5px}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--gold);box-shadow:var(--ring)}
.pick{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px}
.pick button{border:2px solid transparent;border-radius:9px;padding:10px 4px;font-weight:800;font-size:11.5px;
  display:flex;flex-direction:column;gap:2px;align-items:center;line-height:1.15}
.pick button small{font-weight:600;font-size:9.5px;opacity:.85}
.pick button.sel{border-color:var(--ink);transform:scale(1.03)}
.timerow{display:flex;gap:10px}
.timerow .field{flex:1}

/* Toast & kosong */
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(30px);background:var(--ink);color:#fff;
  padding:11px 20px;border-radius:30px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lg);opacity:0;
  pointer-events:none;transition:all .3s var(--ease);z-index:200;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--danger)}
.empty{text-align:center;padding:36px 20px;color:var(--muted-2)}
.empty .ic{font-size:34px;margin-bottom:8px}
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px}
#gate .panel{max-width:420px;text-align:center}

/* ---------- Layar kecil ----------
   Titik patah 760px SAMA dengan modul Event supaya laci menunya berperilaku
   identik: kru yang berpindah antar modul di HP tidak perlu belajar dua cara
   membuka menu. Di bawah titik itu sidebar jadi laci yang digeser masuk. */
@media(max-width:760px){
  .menu-btn{display:block}
  #sidebar{transform:translateX(-100%);transition:transform .22s ease;box-shadow:0 0 40px rgba(0,0,0,.18)}
  body.side-open #sidebar{transform:none}
  body.side-open #sideScrim{display:block}
  #main{margin-left:0}
  .topbar{padding:10px 14px}
  .topbar h2{font-size:16px}
  .content{padding:16px 14px 70px}
  .panel{padding:13px}
  /* Label rentang tanggal tidak boleh memaksa lebar tetap 170px — di layar
     360px itu mendorong tombol ›/‹ keluar barisnya. */
  .navdate{flex:1;min-width:0}
  .navdate b{min-width:0;flex:1;font-size:12.5px;text-align:center}
  .seg{max-width:100%}
  .stats{grid-template-columns:repeat(2,1fr)}
  table.sched .nm{min-width:132px;max-width:150px}
  table.sched .jb{min-width:74px}
  .pick{grid-template-columns:repeat(3,1fr)}
  .row .who{min-width:100%}
  .modal{max-height:92vh}
}
@media(max-width:420px){
  .pick{grid-template-columns:repeat(2,1fr)}
  .timerow{flex-direction:column;gap:0}
  .content{padding:14px 11px 70px}
}

/* Cetak — inilah yang dipakai head untuk menempel jadwal di papan */
@media print{
  body{background:#fff}
  #sidebar,#sideScrim,.topbar,.tools,.navdate,.seg,.noprint,#toast{display:none !important}
  #app{display:block}
  #main{margin-left:0}
  .content{padding:0}
  .panel{box-shadow:none;border:none;padding:0;margin:0}
  .tablewrap{overflow:visible;border:1px solid #999}
  table.sched{min-width:0;width:100%}
  td.cell{height:32px;min-width:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  tr.hdr th,tr.hdr2 th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:landscape;margin:10mm}
}
</style>
</head>
<body>

<!-- Gerbang: tampil kalau sesi Office tidak ada / tidak berhak modul ini -->
<div id="gate" class="hidden">
  <div class="panel">
    <div style="font-size:34px;margin-bottom:8px">🔒</div>
    <h2 id="gateJudul">Belum masuk</h2>
    <p style="color:var(--muted);font-size:13.5px;margin:8px 0 16px" id="gatePesan">
      Modul ini dibuka lewat Laksamana Office. Silakan masuk dulu di sana.</p>
    <a class="btn btn-primary" href="../" style="text-decoration:none">Ke Laksamana Office</a>
  </div>
</div>

<div id="app" class="hidden">
  <aside id="sidebar">
    <div class="brand">
      <img src="../assets/logo.png" alt="" onerror="this.style.display='none'">
      <div><div class="bt">Laksamana Muda</div><div class="bs">Jadwal Shift</div></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot" id="sideFoot"></div>
    <div class="side-user">
      <div class="su-avatar" id="su-avatar">?</div>
      <div class="su-info"><b id="su-un">—</b><span id="su-ur">—</span></div>
      <a class="logout-x" href="../" title="Kembali ke Laksamana Office" aria-label="Kembali ke Office">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      </a>
    </div>
  </aside>
  <div id="sideScrim" onclick="toggleSidebar(false)"></div>
  <main id="main">
    <div class="topbar">
      <button class="menu-btn" title="Menu" onclick="toggleSidebar()" aria-label="Buka menu">☰</button>
      <button id="navMiniBtn" onclick="toggleNav()" title="Sembunyikan / tampilkan menu" aria-label="Sembunyikan menu">☰</button>
      <div style="flex:1;min-width:0"><h2 id="pageTitle">Jadwal Bulanan</h2><div class="crumb" id="crumb">Laksamana Muda</div></div>
      <span id="syncBadge" class="syncdot hidden"></span>
    </div>
    <div class="content" id="view"></div>
  </main>
</div>

<div id="modalRoot"></div>
<div id="toast"></div>

<script>
/* =========================================================================
   JADWAL SHIFT LAKSAMANA MUDA
   -------------------------------------------------------------------------

/* =====================================================================
   BANTU: teks, tanggal
   ===================================================================== */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escJs(s){ return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\r?\n/g,' '); }
function pad(n){ return String(n).padStart(2,'0'); }
function fmtD(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function hariIni(){ return fmtD(new Date()); }
function parseD(s){ const p=String(s).split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
function addD(s,n){ const d=parseD(s); d.setDate(d.getDate()+n); return fmtD(d); }
/* Indeks hari 0=Senin..6=Minggu. getDay() bawaan JS mulai dari Minggu, dan
   memakainya apa adanya membuat kolom Senin jatuh di posisi kedua. */
function idxHari(s){ return (parseD(s).getDay()+6)%7; }
function seninDari(s){ return addD(s, -idxHari(s)); }
function bulanDari(s){ return String(s).slice(0,7); }
function tglPendek(s){ const d=parseD(s); return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+String(d.getFullYear()).slice(2); }
function tglManusia(s){ const d=parseD(s); return d.getDate()+' '+BULAN_PDK[d.getMonth()]; }
function tglPanjang(s){ const d=parseD(s); return d.getDate()+' '+BULAN[d.getMonth()]+' '+d.getFullYear(); }
function labelBulan(mk){ const p=mk.split('-'); return BULAN[(+p[1])-1]+' '+p[0]; }
function akhirBulan(mk){ const p=mk.split('-'); return fmtD(new Date(+p[0], +p[1], 0)); }
function awalBulan(mk){ return mk+'-01'; }
function geserBulan(mk,n){ const p=mk.split('-'); const d=new Date(+p[0],(+p[1]-1)+n,1); return d.getFullYear()+'-'+pad(d.getMonth()+1); }
function tujuhHari(senin){ return Array.from({length:7},(_,i)=>addD(senin,i)); }
function rentangMinggu(senin){
  const a=parseD(senin), b=parseD(addD(senin,6));
  return a.getDate()+' '+BULAN_PDK[a.getMonth()]+' – '+b.getDate()+' '+BULAN_PDK[b.getMonth()]+' '+b.getFullYear();
}
function inisial(n){ const p=String(n||'?').trim().split(/\s+/); return ((p[0]||'?')[0]+(p[1]?p[1][0]:'')).toUpperCase(); }

/* Pita minggu dalam satu bulan: tiap pita SELALU Senin–Minggu, dipotong di
   batas bulan. Lembar Excel lama memakai pita 7 lalu 8 hari yang tidak
   beraturan; disamakan ke minggu penuh supaya sama persis dengan satuan
   input mingguan — kalau tidak, satu minggu kerja bisa terbelah dua pita dan
   head harus menghitung sendiri hari mana yang sudah ia isi. */
function pitaBulan(mk){
  const a=awalBulan(mk), z=akhirBulan(mk);
  const out=[]; let sen=seninDari(a);
  while(sen<=z){
    const hari=tujuhHari(sen).filter(d=>d>=a&&d<=z);
    if(hari.length) out.push({senin:sen, hari});
    sen=addD(sen,7);
  }
  return out;
}

/* =====================================================================
   BANTU: warna

function hexRgb(h){
  h=String(h||'#888').replace('#','');
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  const n=parseInt(h,16)||0;
  return {r:(n>>16)&255, g:(n>>8)&255, b:n&255};
}
/* Warna teks dipilih dari terangnya latar, bukan ditetapkan per shift.
   Alasannya: warna shift boleh diubah admin, dan teks putih di atas kuning
   #FFC000 praktis tidak terbaca dari jarak papan pengumuman. */
function warnaTeks(bg){ const c=hexRgb(bg); return (c.r*0.299+c.g*0.587+c.b*0.114) > 150 ? '#2A2620' : '#FFFFFF'; }
function warnaLembut(bg,a){ const c=hexRgb(bg); return 'rgba('+c.r+','+c.g+','+c.b+','+(a==null?.16:a)+')'; }

/* =====================================================================
   STATE: seed & normalisasi
   ===================================================================== */
function seed(){
  return { setting:{ shifts:JSON.parse(JSON.stringify(SHIFT_BAWAAN)), heads:{}, divOverride:{}, jabatan:{}, shiftKru:{} },
           sel:{}, pengajuan:[] };
}
/* Dipanggil untuk apa pun yang datang dari server ATAU cache lama. Semua
   cabang diberi bentuk aman, sebab satu properti hilang di sini berarti
   halaman blank di browser kru — bukan pesan error yang bisa dilaporkan. */
function normalizeState(d){
  const b=seed();
  if(!d || typeof d!=='object') return b;
  const st=(d.setting&&typeof d.setting==='object')?d.setting:{};
  const shifts={};
  Object.keys(SHIFT_BAWAAN).forEach(k=>{ shifts[k]=Object.assign({}, SHIFT_BAWAAN[k], (st.shifts&&st.shifts[k])||{}); });
  // Shift buatan admin (di luar bawaan) ikut dipertahankan.
  Object.keys((st.shifts)||{}).forEach(k=>{ if(!shifts[k]) shifts[k]=Object.assign({n:k,m:'',s:'',w:'#7A756B',libur:0,urut:90}, st.shifts[k]); });
  b.setting.shifts=shifts;
  b.setting.heads=(st.heads&&typeof st.heads==='object')?st.heads:{};
  b.setting.divOverride=(st.divOverride&&typeof st.divOverride==='object')?st.divOverride:{};
  b.setting.jabatan=(st.jabatan&&typeof st.jabatan==='object')?st.jabatan:{};
  b.setting.shiftKru=(st.shiftKru&&typeof st.shiftKru==='object')?st.shiftKru:{};
  b.sel=(d.sel&&typeof d.sel==='object')?d.sel:{};
  b.pengajuan=Array.isArray(d.pengajuan)?d.pengajuan:[];
  return b;
}
function shiftDef(k){ return (S&&S.setting.shifts[k]) || SHIFT_BAWAAN[k] || {n:k,m:'',s:'',w:'#7A756B',libur:1,urut:99}; }
/* Shift kebiasaan seorang kru. Dipakai saat membuka sel kosong dan saat
   mengisi minggu secara massal. Kosong = belum pernah diatur; jatuh ke shift
   pertama yang bukan libur (PAGI pada susunan bawaan), bukan ke kode 'PAGI'
   yang dipatok — nama shift boleh diubah admin, dan memaksa 'PAGI' membuat
   modul mengacu ke shift yang mungkin sudah tidak ada. */
function shiftKru(uid){
  const pilih=S&&S.setting.shiftKru&&S.setting.shiftKru[uid];
  if(pilih && S.setting.shifts[pilih]) return pilih;
  return daftarShift().find(k=>!shiftDef(k).libur) || daftarShift()[0] || 'PAGI';
}
function daftarShift(){
  return Object.keys(S.setting.shifts).sort((a,b)=>(shiftDef(a).urut||99)-(shiftDef(b).urut||99));
}

/* =====================================================================
   SEL JADWAL
   ===================================================================== */
function kunci(uid,tgl){ return uid+'|'+tgl; }
function sel(uid,tgl){ return S.sel[kunci(uid,tgl)]||null; }
function jamSel(c){
  if(!c) return null;
  const d=shiftDef(c.t);
  const m=c.m||d.m, s=c.s||d.s;
  return (m&&s)?{m,s}:null;
}
/* Label yang tampil di dalam sel. Catatan bebas MENIMPA kode shift — itulah
   cara menulis hal seperti "HARAU!!!" atau "TRAINING" di lembar Excel lama,
   dan kru sudah terbiasa membacanya begitu. */
function labelSel(c){ return (c && c.n) ? c.n : (c ? shiftDef(c.t).n : ''); }

/* =====================================================================
   ROSTER & DIVISI
   ===================================================================== */
function divisiDari(u){
  if(!u) return DIV_NONSHIFT;
  /* Penempatan manual menang atas apa pun. Itu satu-satunya cara memasukkan
     orang yang keterangannya tidak menyebut divisi tapi memang ikut shift —
     mis. Store Manager yang turun ke Floor, atau kru baru yang kolom Tim-nya
     di Office belum sempat diisi. */
  const ov=S&&S.setting.divOverride[u.id];
  if(ov) return ov;
  return divisiDariMurni(u);
}
/* Divisi murni dari keterangan Office, TANPA penempatan manual. Dipakai
   divisiDari() di atas, dan dipakai lagi di Pengaturan untuk memberi label
   pada pilihan "Ikut Office" — supaya admin tahu apa yang terjadi kalau
   penempatan manualnya dilepas. */
function divisiDariMurni(u){
  const kata=String(u&&u.keterangan||'').toLowerCase().split(/[^a-z]+/).filter(Boolean);
  for(const d of DIVISI){
    const sin=DIV_SINONIM[d.k]||[d.k];
    if(sin.some(x=>kata.indexOf(x)>-1)) return d.k;
  }
  return DIV_NONSHIFT;
}
function namaDivisi(k){
  const d=DIVISI.find(x=>x.k===k);
  return d ? d.n : 'Tidak dijadwalkan';
}
/* Jabatan yang tampil di kolom ketiga. Default: keterangan Office apa
   adanya (mis. "Bar Senior"); bisa diganti pendek di Pengaturan supaya muat
   di kolom, seperti "S. BAR" di lembar lama. */
function jabatanDari(u){
  const j=S&&S.setting.jabatan[u.id];
  if(j) return j;
  return String(u.keterangan||'').trim() || '—';
}
function kruDivisi(k){
  return ROSTER.filter(u=>u.active!==false && divisiDari(u)===k)
    .sort((a,b)=>{
      const ha=isHeadUser(a.id,k)?0:1, hb=isHeadUser(b.id,k)?0:1;
      return ha-hb || String(a.name||'').localeCompare(String(b.name||''));
    });
}
function kruById(id){ return ROSTER.find(u=>u.id===id)||null; }
function namaKru(id){ const u=kruById(id); return u?u.name:'—'; }

/* =====================================================================
   HAK AKSES
   ===================================================================== */
function isAdmin(){ return !!(ME && ME.admin); }
function isHeadUser(uid,div){ return ((S&&S.setting.heads[div])||[]).indexOf(uid)>-1; }
function bolehUbah(div){ return isAdmin() || (!!ME && isHeadUser(ME.id,div)); }
/* Divisi mana saja yang boleh disunting orang ini — dipakai untuk memilih
   tab default dan untuk menyaring pengajuan yang bisa ia putuskan. */
function divisiKuasa(){
  if(isAdmin()) return DIVISI.map(d=>d.k);
  if(!ME) return [];
  return DIVISI.map(d=>d.k).filter(k=>isHeadUser(ME.id,k));
}
function divisiSaya(){ const u=ME&&kruById(ME.id); return u?divisiDari(u):(ME?divisiDari(ME):DIV_NONSHIFT); }
function labelPeran(){
  if(isAdmin()) return 'Admin Jadwal';
  const k=divisiKuasa();
  if(k.length) return 'Head '+k.map(namaDivisi).join(', ');
  return 'Kru · '+namaDivisi(divisiSaya());
}

let SYNC_ERR='';
function setSync(pesan,keras){
  SYNC_ERR=pesan||'';
  const el=document.getElementById('syncBadge'); if(!el) return;
  if(!pesan){ el.classList.add('hidden'); return; }
  el.classList.remove('hidden');
  el.className='syncdot'+(keras?' err':'');
  el.textContent=pesan;
}
function toast(msg,err){
  const t=document.getElementById('toast'); if(!t) return;
  t.textContent=msg; t.className='show'+(err?' err':'');
  clearTimeout(toast._t); toast._t=setTimeout(()=>{ t.className=''; },2800);
}
async function apiPost(payload){
  const r=await fetch(API_URL,{method:'POST',redirect:'follow',
    headers:{'Content-Type':'text/plain;charset=utf-8'},   // permintaan sederhana: hindari preflight CORS
    body:JSON.stringify(Object.assign({by:(ME&&ME.name)||''},payload))});
  const t=await r.text(); let j=null; try{ j=JSON.parse(t); }catch(e){}
  if(!j) throw new Error('Server membalas bukan JSON (backend belum terpasang?)');
  if(!j.ok) throw new Error(j.error||'ditolak server');
  return j.data;
}
async function apiGet(dari,sampai){
  const r=await fetch(API_URL+'?action=getAll&dari='+encodeURIComponent(dari)+'&sampai='+encodeURIComponent(sampai)+'&t='+Date.now(),
    {method:'GET',redirect:'follow'});
  const t=await r.text(); let j=null; try{ j=JSON.parse(t); }catch(e){}
  if(!j) throw new Error('Server membalas bukan JSON (backend belum terpasang?)');
  if(!j.ok) throw new Error(j.error||'ditolak server');
  return j.data;
}

/* Rentang yang perlu ada di memori supaya halaman aktif bisa digambar.
   Dilebihkan satu minggu di kedua ujung: pita bulan selalu Senin–Minggu,
   jadi 1 Agustus yang jatuh hari Sabtu tetap butuh 27 Juli untuk melengkapi
   pitanya. */
function rentangDibutuhkan(){
  const mk=BULAN_AKTIF||bulanDari(hariIni());
  let dari=addD(seninDari(awalBulan(mk)),-7);
  let sampai=addD(seninDari(akhirBulan(mk)),13);
  if(MINGGU_AKTIF){
    if(addD(MINGGU_AKTIF,-7)<dari) dari=addD(MINGGU_AKTIF,-7);
    if(addD(MINGGU_AKTIF,13)>sampai) sampai=addD(MINGGU_AKTIF,13);
  }
  /* Dashboard bisa dibawa ke tanggal jauh di luar bulan yang sedang dibuka.
     Tanpa baris ini selnya tidak pernah ikut terambil, dan layar melaporkan
     "belum dijadwalkan" untuk hari yang sebenarnya sudah terisi — kesalahan
     yang paling berbahaya di modul ini karena kelihatan meyakinkan. */
  if(DASH_TGL){
    if(addD(DASH_TGL,-7)<dari)  dari=addD(DASH_TGL,-7);
    if(addD(DASH_TGL,7)>sampai) sampai=addD(DASH_TGL,7);
  }
  return {dari,sampai};
}
let MUAT_JALAN=false;
async function muatData(paksa){
  const r=rentangDibutuhkan();
  if(!paksa && RANGE && RANGE.dari<=r.dari && RANGE.sampai>=r.sampai) return;
  if(MUAT_JALAN) return;
  MUAT_JALAN=true;
  try{
    const d=await apiGet(r.dari,r.sampai);
    const st=normalizeState({setting:d.setting, pengajuan:d.pengajuan});
    S.setting=st.setting;
    S.pengajuan=st.pengajuan;
    /* Sel di dalam rentang yang baru diambil DIBUANG dulu, baru diisi ulang.
       Tanpa ini, sel yang dihapus orang lain tetap hidup di layar kita —
       gejalanya: head menghapus OFF, layar sebelah masih menampilkannya. */
    Object.keys(S.sel).forEach(k=>{ const tgl=k.split('|')[1]; if(tgl>=r.dari&&tgl<=r.sampai) delete S.sel[k]; });
    (d.sel||[]).forEach(x=>{ S.sel[kunci(x.u,x.d)]={t:x.t,m:x.m||'',s:x.s||'',n:x.n||''}; });
    RANGE={dari:r.dari, sampai:r.sampai};
    simpanCache();
    setSync('');
  }catch(e){
    setSync('Gagal memuat dari server', true);
    console.warn('muatData:', e.message);
  }finally{ MUAT_JALAN=false; }
}
function simpanCache(){
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify({s:S, range:RANGE, at:Date.now()})); }catch(e){}
}
function bacaCache(){
  try{
    const c=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');
    if(c&&c.s){ RANGE=c.range||null; return normalizeState(c.s); }
  }catch(e){}
  return null;
}

/* Menulis sel: terapkan dulu di layar, baru kirim. Head mengisi sel satu per
   satu dan menunggu bolak-balik jaringan tiap klik membuatnya terasa rusak.
   Kalau kiriman gagal, rentangnya dimuat ULANG dari server — layar kembali
   ke kebenaran, bukan menyimpan perubahan yang sebenarnya tidak ada. */
async function tulisSel(rows,hapus){
  rows=rows||[]; hapus=hapus||[];
  rows.forEach(r=>{ S.sel[kunci(r.u,r.d)]={t:r.t,m:r.m||'',s:r.s||'',n:r.n||''}; });
  hapus.forEach(r=>{ delete S.sel[kunci(r.u,r.d)]; });
  simpanCache(); render();
  try{
    await apiPost({action:'simpanSel', rows, hapus});
    setSync('');
  }catch(e){
    setSync('Perubahan belum tersimpan', true);
    toast('Gagal menyimpan: '+e.message, true);
    await muatData(true); render();
  }
}
async function simpanSetting(){
  simpanCache();
  try{ await apiPost({action:'simpanSetting', data:S.setting}); setSync(''); }
  catch(e){ setSync('Pengaturan belum tersimpan', true); toast('Gagal menyimpan pengaturan: '+e.message, true); }
}
function save(){ simpanSetting(); }   // nama yang sama dengan modul lain (dan di-stub smoke test)

function bacaSesi(){
  try{
    const s=JSON.parse(localStorage.getItem(SESSION_KEY)||'null');
    if(!s||!s.expiry||Date.now()>=s.expiry) return null;
    const m=s.modules||[];
    if(m.indexOf('*')<0 && m.indexOf('jadwal')<0) return {tolak:true, name:s.name};
    const adm=s.adminModules||[];
    return {id:s.userId, name:s.name, keterangan:s.keterangan||'',
            admin:(adm.indexOf('*')>-1 || adm.indexOf('jadwal')>-1)};
  }catch(e){ return null; }
}
/* Roster ditarik TANPA PIN lewat listDivisiRoster — endpoint terbuka yang
   hanya membalas nama, keterangan, dan status aktif. Yang dipakai adalah
   SELURUH pegawai, bukan hanya pemegang akses modul: kru dapur dijadwalkan
   walau ia tidak pernah membuka Office sama sekali. */
async function muatRoster(){
  const stop=new AbortController(); const jam=setTimeout(()=>stop.abort(),8000);
  try{
    const r=await fetch(ACC_URL,{method:'POST',redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'listDivisiRoster'}), signal:stop.signal});
    clearTimeout(jam);
    const j=await r.json();
    if(!j||!j.ok||!Array.isArray(j.members)) throw new Error(j&&j.error||'balasan tidak dikenali');
    ROSTER=j.members; ROSTER_ERR='';
  }catch(e){
    clearTimeout(jam);
    ROSTER_ERR=(e.name==='AbortError')?'Office tidak menjawab dalam 8 detik':e.message;
  }
}

function buildNav(){

    if(n.s){ tunda=n.s; return; }

function toggleSidebar(buka){

/* =====================================================================
   HALAMAN 0 — DASHBOARD
   Pertanyaan pertama tiap pagi bukan "bagaimana sebulan ini", melainkan
   "hari ini siapa yang masuk dan siapa yang libur". Itu yang dijawab di sini,
   dalam DUA tabel terpisah supaya keduanya terbaca sekaligus tanpa harus
   memindai satu daftar campur.

   Kru yang selnya BELUM diisi sengaja TIDAK ikut ke tabel "tidak masuk".
   Belum dijadwalkan bukan berarti libur, dan menaruhnya di sana membuat head
   mengira jumlah orangnya sudah pas padahal ada lubang. Ia dilaporkan
   terpisah sebagai peringatan.
   ===================================================================== */
function dashTgl(){ return DASH_TGL||hariIni(); }
function dashKru(){
  return ROSTER.filter(function(u){
    if(u.active===false) return false;
    var d=divisiDari(u);
    if(d===DIV_NONSHIFT) return false;
    return DASH_DIV==='ALL' ? true : d===DASH_DIV;
  }).sort(function(a,b){
    return String(namaDivisi(divisiDari(a))).localeCompare(namaDivisi(divisiDari(b)))
        || String(a.name||'').localeCompare(String(b.name||''));
  });
}
function viewDashboard(){
  const tgl=dashTgl(), ini=(tgl===hariIni());
  const emps=dashKru();
  const masuk=[], libur=[], belum=[];
  emps.forEach(function(u){
    const c=sel(u.id,tgl);
    if(!c) belum.push(u);
    else if(shiftDef(c.t).libur) libur.push({u:u,c:c});
    else masuk.push({u:u,c:c});
  });
  /* Urut jam masuk: yang datang paling pagi di atas, seperti orang membaca
     daftar giliran. Yang tanpa jam ditaruh belakangan lewat '99:99'. */
  masuk.sort(function(a,b){
    const ja=jamSel(a.c), jb=jamSel(b.c);
    return (ja?ja.m:'99:99').localeCompare(jb?jb.m:'99:99')
        || String(a.u.name||'').localeCompare(String(b.u.name||''));
  });

  function klikSel(u){
    return bolehUbah(divisiDari(u))
      ? ' class="klik" onclick="bukaEditor(&#39;'+escJs(u.id)+'&#39;,&#39;'+tgl+'&#39;)"' : '';
  }
  function kolomOrang(u){
    return '<td><span class="nama">'+esc(u.name)+'</span><div class="kecil">'+esc(jabatanDari(u))+'</div></td>'
         + '<td>'+esc(namaDivisi(divisiDari(u)))+'</td>';
  }
  function pil(c){
    const d=shiftDef(c.t);
    return '<span class="stpill" style="background:'+esc(d.w)+';color:'+warnaTeks(d.w)+'">'+esc(labelSel(c))+'</span>';
  }

  const barisMasuk=masuk.map(function(r,i){
    const j=jamSel(r.c);
    return '<tr'+klikSel(r.u)+'><td class="no">'+(i+1)+'</td>'+kolomOrang(r.u)
      +'<td>'+pil(r.c)+'</td>'
      +'<td class="mono">'+(j?esc(j.m+' \u2013 '+j.s):'\u2014')+'</td></tr>';
  }).join('');
  const barisLibur=libur.map(function(r,i){
    return '<tr'+klikSel(r.u)+'><td class="no">'+(i+1)+'</td>'+kolomOrang(r.u)
      +'<td>'+pil(r.c)+'</td></tr>';
  }).join('');

  // Rincian per shift — sekilas cukup untuk tahu shift pagi kurang orang atau tidak.
  const rinci=daftarShift().filter(function(k){ return !shiftDef(k).libur; }).map(function(k){
    const n=masuk.filter(function(r){ return r.c.t===k; }).length;
    if(!n) return '';
    const d=shiftDef(k);
    return '<span class="chip"><span class="sw" style="background:'+esc(d.w)+'"></span>'+esc(d.n)+' <b>'+n+'</b></span>';
  }).join('');

  const seg='<div class="seg"><button class="'+(DASH_DIV==='ALL'?'active':'')+'" onclick="dashDiv(&#39;ALL&#39;)">Semua</button>'
    +DIVISI.map(function(d){
      return '<button class="'+(DASH_DIV===d.k?'active':'')+'" onclick="dashDiv(&#39;'+d.k+'&#39;)">'+d.ic+' '+esc(d.n)+'</button>';
    }).join('')+'</div>';

  const bolehApaPun=DIVISI.some(function(d){ return bolehUbah(d.k); });

  return '<div class="panel">'
    +'<div class="rowbar"><h2>'+(ini?'Hari Ini':esc(HARI[idxHari(tgl)]))+', '+esc(tglPanjang(tgl))+'</h2>'
    +(ini?'':'<span class="chip">bukan hari ini</span>')
    +'<div class="spacer"></div>'
    +'<div class="navdate"><button class="iconbtn" onclick="dashGeser(-1)" title="Hari sebelumnya">\u2039</button>'
    +'<input type="date" class="inp" value="'+tgl+'" onchange="dashSet(this.value)" style="font-weight:600">'
    +'<button class="iconbtn" onclick="dashGeser(1)" title="Hari berikutnya">\u203a</button>'
    +'<button class="btn btn-ghost btn-sm" onclick="dashHariIni()">Hari Ini</button></div></div>'
    +panelKosongRoster()
    +'<div class="rowbar">'+seg+'<div class="spacer"></div><div class="legend">'+rinci+'</div></div>'
    +'<div class="stats">'+statBox(masuk.length,'Masuk')+statBox(libur.length,'Tidak Masuk')
      +statBox(belum.length,'Belum Diatur')+statBox(emps.length,'Total Kru')+'</div>'
    +(belum.length
      ? '<div class="note w"><b>'+belum.length+' kru belum dijadwalkan</b> pada tanggal ini: '
        +esc(belum.map(function(u){ return u.name; }).join(', '))
        +'. Belum dijadwalkan bukan berarti libur \u2014 isi dulu lewat Input Mingguan.</div>'
      : '')
    +'</div>'

    +'<div class="panel"><div class="rowbar"><h2>\u2705 Masuk</h2>'
    +'<span class="chip">'+masuk.length+' orang</span><div class="spacer"></div></div>'
    +(masuk.length
      ? '<div class="tablewrap"><table class="list"><thead><tr><th class="no">#</th><th>Nama</th><th>Divisi</th><th>Shift</th><th>Jam</th></tr></thead><tbody>'+barisMasuk+'</tbody></table></div>'
      : '<div class="empty"><div class="ic">\ud83c\udf19</div>Tidak ada yang masuk pada tanggal ini.</div>')
    +'</div>'

    +'<div class="panel"><div class="rowbar"><h2>\ud83c\udfd6\ufe0f Tidak Masuk</h2>'
    +'<span class="chip">'+libur.length+' orang</span><div class="spacer"></div></div>'
    +(libur.length
      ? '<div class="tablewrap"><table class="list"><thead><tr><th class="no">#</th><th>Nama</th><th>Divisi</th><th>Status</th></tr></thead><tbody>'+barisLibur+'</tbody></table></div>'
      : '<div class="empty"><div class="ic">\ud83d\udcaa</div>Tidak ada yang libur, izin, atau cuti pada tanggal ini.</div>')
    +(bolehApaPun?'<p class="mutedhint" style="margin-top:10px">Klik baris mana pun untuk mengubah shift orang itu pada tanggal ini.</p>':'')
    +'</div>';
}

/* =====================================================================
   HALAMAN 1 — JADWAL BULANAN
   Inilah bentuk yang selama ini dipakai: satu lembar per divisi per bulan,
   dibaca berbaris-baris dari papan. Tiap pita = satu minggu Senin–Minggu.

function viewBulanan(){

      '<div class="mutedhint" style="margin-top:6px">Kru muncul otomatis begitu kolom <b>Tim</b>-nya diisi di Laksamana Office'+
      (isAdmin()?', atau tempatkan manual lewat Pengaturan.':'.')+'</div></div>';
  }else{

    pita.forEach((p,pi)=>{

      body+='<tr class="hdr2"><th></th><th></th><th>HARI</th>'+
        p.hari.map(d=>{ const i=idxHari(d); return '<th class="'+(i>=5?'wknd':'')+'">'+HARI_PJG[i]+'</th>'; }).join('')+'</tr>';
      emps.forEach((u,ui)=>{
        body+='<tr><td class="no">'+(ui+1)+'</td>'+

          p.hari.map(d=>selHtml(sel(u.id,d),u.id,d,bisa)).join('')+'</tr>';
      });
    });
    tabel='<div class="tablewrap" id="lembarBulan"><table class="sched">'+body+'</table></div>';
  }

  const r=rekapBulan(emps,mk);
  return '<div class="panel">'
    +'<div class="rowbar">'+segDivisi(DIV,'gantiDiv')+'<div class="spacer"></div>'
    +'<div class="navdate noprint"><button class="iconbtn" onclick="geserBulanAktif(-1)">‹</button>'
    +'<b>'+esc(labelBulan(mk))+'</b>'

    +'<div class="tools noprint">'

    +'<button class="btn btn-ghost btn-sm" onclick="exportWA(&#39;bulan&#39;)">💬 Teks WA</button>'
    +'<button class="btn btn-ghost btn-sm" onclick="window.print()">🖨️ Print / PDF</button>'
    +'</div></div>'
    +'<div class="stats noprint">'+statBox(emps.length,'Kru')+statBox(r.masuk,'Hari Masuk')
      +statBox(r.libur,'Off / Cuti')+statBox(r.kosong,'Sel Kosong')+'</div>'
    +tabel
    +(bisa?'<p class="mutedhint noprint" style="margin-top:10px">Klik sel mana pun untuk mengubahnya. Untuk mengisi satu minggu sekaligus, pakai <b>Input Mingguan</b>.</p>'
          :'<p class="mutedhint noprint" style="margin-top:10px">Mode lihat saja — yang menyusun jadwal divisi ini adalah head-nya.</p>')
    +'</div>';
}
function rekapBulan(emps,mk){
  const a=awalBulan(mk), z=akhirBulan(mk);
  let masuk=0,libur=0,kosong=0;
  emps.forEach(u=>{
    for(let d=a; d<=z; d=addD(d,1)){
      const c=sel(u.id,d);
      if(!c) kosong++;
      else if(shiftDef(c.t).libur) libur++;
      else masuk++;
    }
  });
  return {masuk,libur,kosong};
}

function bulanIni(){ BULAN_AKTIF=bulanDari(hariIni()); muatDanGambar(); }

/* =====================================================================
   HALAMAN 2 — INPUT MINGGUAN
   Satuan kerja head: satu minggu Senin–Minggu, satu divisi.
   ===================================================================== */
function viewMinggu(){
  const kuasa=divisiKuasa();
  if(!kuasa.length){
    return '<div class="panel"><div class="empty"><div class="ic">🔒</div>'
      +'Halaman ini untuk head divisi.<div class="mutedhint" style="margin-top:6px">'
      +'Kalau Anda memang head, minta admin menunjuk Anda di <b>Pengaturan → Head Divisi</b>.</div></div></div>';
  }
  if(kuasa.indexOf(DIV)<0) DIV=kuasa[0];
  const senin=MINGGU_AKTIF||seninDari(hariIni());
  const hari=tujuhHari(senin);
  const emps=kruDivisi(DIV);

  let body='<tr class="hdr"><th class="no">No.</th><th>NAMA</th><th>TGL</th>'
    +hari.map(d=>'<th>'+tglPendek(d)+'</th>').join('')+'</tr>'
    +'<tr class="hdr2"><th></th><th></th><th>HARI</th>'
    +hari.map((d,i)=>'<th class="'+(i>=5?'wknd':'')+'">'+HARI[i].toUpperCase()+'</th>').join('')+'</tr>';
  if(!emps.length){
    body+='<tr><td colspan="10" style="padding:24px;text-align:center;color:var(--muted-2)">Belum ada kru di divisi ini</td></tr>';
  }
  emps.forEach((u,ui)=>{
    body+='<tr><td class="no">'+(ui+1)+'</td>'
      +'<td class="nm"><b>'+esc(u.name)+'</b><i>'+esc(jabatanDari(u))+'</i></td>'
      +'<td class="jb"><button class="btn btn-ghost btn-sm" title="Isi seluruh baris" onclick="isiBaris(\''+escJs(u.id)+'\')">baris</button></td>'
      +hari.map(d=>selHtml(sel(u.id,d),u.id,d,true)).join('')+'</tr>';
  });

  const belum=emps.reduce((n,u)=>n+hari.filter(d=>!sel(u.id,d)).length,0);
  return '<div class="panel">'
    +'<div class="rowbar">'+segDivisi(DIV,'gantiDivMinggu')+'<div class="spacer"></div>'
    +'<div class="navdate"><button class="iconbtn" onclick="geserMinggu(-1)">‹</button>'
    +'<b>'+esc(rentangMinggu(senin))+'</b>'
    +'<button class="iconbtn" onclick="geserMinggu(1)">›</button>'
    +'<button class="btn btn-ghost btn-sm" onclick="mingguIni()">Minggu Ini</button></div></div>'
    +panelKosongRoster()
    +(belum?'<div class="note w"><b>'+belum+' sel</b> masih kosong di minggu ini.</div>':'<div class="note i">Minggu ini sudah terisi penuh.</div>')
    +'<div class="rowbar">'+legendaShift()+'<div class="spacer"></div><div class="tools">'
    +'<button class="btn btn-ghost btn-sm" onclick="salinMingguLalu()">📋 Salin Minggu Lalu</button>'
    +'<button class="btn btn-ghost btn-sm" onclick="isiSisa()">⚡ Isi Sel Kosong</button>'
    +'<button class="btn btn-ghost btn-sm" onclick="kosongkanMinggu()">🧹 Kosongkan</button>'
    +'</div></div>'
    /* Alat berbagi diletakkan juga di sini, bukan cuma di halaman bulanan:
       yang paling sering ditempel di papan dan dikirim ke grup justru jadwal
       MINGGU DEPAN, dan head sedang berada di halaman ini saat selesai
       menyusunnya. Menyuruhnya pindah ke halaman bulanan dulu cuma untuk
       mengunduh gambar adalah langkah yang tidak ada gunanya. */
    +'<div class="rowbar noprint"><span class="mutedhint">Bagikan minggu ini:</span><div class="spacer"></div><div class="tools">'
    +'<button class="btn btn-ghost btn-sm" onclick="exportPNG(&#39;minggu&#39;)">🖼️ PNG Minggu Ini</button>'
    +'<button class="btn btn-ghost btn-sm" onclick="exportWA(&#39;minggu&#39;)">💬 Teks WA</button>'
    +'<button class="btn btn-ghost btn-sm" onclick="window.print()">🖨️ Print / PDF</button>'
    +'</div></div>'
    +'<div class="tablewrap"><table class="sched">'+body+'</table></div>'
    +'<p class="mutedhint" style="margin-top:10px">Klik sel untuk memilih shift. Jam bawaan tiap shift bisa ditimpa per sel — dipakai untuk jadwal khusus, mis. shift 9 jam.</p>'
    +'</div>';
}
function gantiDivMinggu(k){ if(divisiKuasa().indexOf(k)<0){ toast('Anda bukan head divisi '+namaDivisi(k)); return; } DIV=k; render(); }
function geserMinggu(n){ MINGGU_AKTIF=addD(MINGGU_AKTIF||seninDari(hariIni()), n*7); muatDanGambar(); }
function mingguIni(){ MINGGU_AKTIF=seninDari(hariIni()); muatDanGambar(); }

/* =====================================================================
   EDITOR SEL
   ===================================================================== */
let EDIT=null;
function bukaEditor(uid,tgl){
  const u=kruById(uid); if(!u) return;
  const div=divisiDari(u);
  if(!bolehUbah(div)){ toast('Hanya head divisi '+namaDivisi(div)+' yang bisa mengatur jadwal ini'); return; }
  const c=sel(uid,tgl);
  /* Sel kosong dibuka dengan shift KEBIASAAN orang itu, bukan selalu PAGI.
     Kebanyakan kru memegang shift yang sama hampir tiap hari, jadi tebakan
     yang benar menghemat satu klik di hampir setiap sel — dan sel yang
     salah tebak tetap tinggal dipilih ulang seperti biasa. */
  const bawaan=shiftKru(uid);
  EDIT={uid, tgl, t:(c?c.t:bawaan), m:(c?c.m:''), s:(c?c.s:''), n:(c?c.n:''), ada:!!c};
  gambarEditor();
}
function gambarEditor(){
  const e=EDIT; if(!e) return;
  const u=kruById(e.uid)||{name:'—'};
  const d=shiftDef(e.t);
  const pilih=daftarShift().map(k=>{
    const sd=shiftDef(k), on=(e.t===k);
    const sub=sd.libur?'&nbsp;':(sd.m+'–'+sd.s);
    return '<button class="'+(on?'sel':'')+'" style="background:'+esc(sd.w)+';color:'+warnaTeks(sd.w)+'" onclick="pilihShift(\''+escJs(k)+'\')">'
      +esc(sd.n)+'<small>'+sub+'</small></button>';
  }).join('');
  const m=e.m||d.m, s=e.s||d.s;
  const blokJam=d.libur?'':(
    '<div class="timerow">'
    +'<div class="field"><label>Jam Masuk</label><input id="edM" type="time" value="'+esc(m)+'" oninput="EDIT.m=this.value"></div>'
    +'<div class="field"><label>Jam Pulang</label><input id="edS" type="time" value="'+esc(s)+'" oninput="EDIT.s=this.value"></div></div>'
    +'<p class="mutedhint" style="margin:-6px 0 12px">Kosongkan salah satunya untuk kembali ke jam bawaan shift ('+esc(d.m||'—')+'–'+esc(d.s||'—')+').</p>');

  const html='<div class="overlay" onclick="if(event.target===this)tutupModal()"><div class="modal">'
    +'<div class="mh"><h3>'+esc(u.name)+'</h3>'
    +'<span class="chip">'+HARI[idxHari(e.tgl)]+', '+esc(tglPanjang(e.tgl))+'</span>'
    +'<button class="xbtn" onclick="tutupModal()">×</button></div>'
    +'<div class="mb">'
    +'<label style="font-size:13px;font-weight:600;display:block;margin-bottom:8px">Shift / Status</label>'
    +'<div class="pick">'+pilih+'</div>'
    +blokJam
    +'<div class="field"><label>Catatan di dalam sel <span style="font-weight:500;color:var(--muted-2)">(opsional)</span></label>'
    +'<input id="edN" value="'+esc(e.n)+'" maxlength="20" placeholder="mis. HARAU!!!, TRAINING" oninput="EDIT.n=this.value">'
    +'<p class="mutedhint">Kalau diisi, teks ini yang tampil di sel menggantikan nama shift — warnanya tetap ikut shift yang dipilih.</p></div>'
    +'</div>'
    +'<div class="mf">'
    +(e.ada?'<button class="btn btn-ghost btn-sm" onclick="hapusSel()">Kosongkan</button>':'')
    +'<button class="btn btn-ghost" onclick="tutupModal()">Batal</button>'
    +'<button class="btn btn-primary" onclick="simpanSel()">Simpan</button></div>'
    +'</div></div>';
  document.getElementById('modalRoot').innerHTML=html;
}
function pilihShift(k){
  EDIT.t=k;
  const d=shiftDef(k);
  EDIT.m=d.m; EDIT.s=d.s;      // ganti shift = pakai jam bawaannya, jam timpaan lama dibuang
  gambarEditor();
}
function simpanSel(){
  const e=EDIT; if(!e) return;
  const d=shiftDef(e.t);
  const row={u:e.uid, d:e.tgl, t:e.t, m:d.libur?'':(e.m||''), s:d.libur?'':(e.s||''), n:(e.n||'').trim()};
  tutupModal(); tulisSel([row],[]); toast('Jadwal disimpan');
}
function hapusSel(){ const e=EDIT; tutupModal(); tulisSel([],[{u:e.uid,d:e.tgl}]); toast('Sel dikosongkan'); }
function tutupModal(){ const m=document.getElementById('modalRoot'); if(m) m.innerHTML=''; EDIT=null; }

/* =====================================================================
   ALAT MINGGUAN — salin, isi cepat, kosongkan, isi baris
   ===================================================================== */
const PILIH_BAWAAN='__BAWAAN__';
function pilihShiftModal(judul,pesan,cb,pakaiBawaan){
  const pilih=daftarShift().map(function(k){
    const sd=shiftDef(k);
    return '<button style="background:'+esc(sd.w)+';color:'+warnaTeks(sd.w)+'" onclick="PILIH_CB(&#39;'+escJs(k)+'&#39;)">'
      +esc(sd.n)+'<small>'+(sd.libur?'&nbsp;':(sd.m+'–'+sd.s))+'</small></button>';
  }).join('');
  /* Tombol paling atas, memenuhi lebar: inilah pilihan yang dipakai hampir
     tiap minggu. Tiap kru punya shift kebiasaan sendiri, jadi "isi semua
     dengan SIANG" justru jarang benar untuk seluruh divisi sekaligus. */
  const bawaan = pakaiBawaan
    ? '<button class="btn btn-primary" style="width:100%;margin-bottom:10px" onclick="PILIH_CB(&#39;'+PILIH_BAWAAN+'&#39;)">'
      +'⭐ Shift bawaan tiap kru</button>'
      +'<p class="mutedhint" style="margin:-4px 0 12px">Tiap orang diisi shift kebiasaannya masing-masing '
      +'(diatur di Pengaturan → Penempatan Kru). Atau pilih satu shift untuk semua di bawah ini.</p>'
    : '';
  window.PILIH_CB=function(k){ tutupModal(); cb(k); };
  document.getElementById('modalRoot').innerHTML=
    '<div class="overlay" onclick="if(event.target===this)tutupModal()"><div class="modal">'
    +'<div class="mh"><h3>'+esc(judul)+'</h3><button class="xbtn" onclick="tutupModal()">×</button></div>'
    +'<div class="mb"><p class="mutedhint" style="margin-bottom:12px">'+esc(pesan)+'</p>'
    +bawaan
    +'<div class="pick">'+pilih+'</div></div></div></div>';
}
function konfirmasi(judul,pesan,cb){
  window.KONFIRM_CB=function(){ tutupModal(); cb(); };
  document.getElementById('modalRoot').innerHTML=
    '<div class="overlay" onclick="if(event.target===this)tutupModal()"><div class="modal" style="max-width:390px">'
    +'<div class="mh"><h3>'+esc(judul)+'</h3></div>'
    +'<div class="mb"><p style="color:var(--muted);font-size:13.5px">'+pesan+'</p></div>'
    +'<div class="mf"><button class="btn btn-ghost" onclick="tutupModal()">Batal</button>'
    +'<button class="btn btn-danger" onclick="KONFIRM_CB()">Ya, lanjut</button></div></div></div>';
}
function salinMingguLalu(){
  const senin=MINGGU_AKTIF||seninDari(hariIni());
  const lalu=addD(senin,-7);
  const emps=kruDivisi(DIV);
  const rows=[];
  emps.forEach(u=>{
    for(let i=0;i<7;i++){
      const c=sel(u.id, addD(lalu,i));
      if(c) rows.push({u:u.id, d:addD(senin,i), t:c.t, m:c.m, s:c.s, n:c.n});
    }
  });
  if(!rows.length){ toast('Minggu lalu ('+rentangMinggu(lalu)+') masih kosong'); return; }
  konfirmasi('Salin minggu lalu?',
    '<b>'+rows.length+' sel</b> dari '+esc(rentangMinggu(lalu))+' akan disalin ke minggu ini. '
    +'Sel yang sudah terisi di minggu ini <b>ikut tertimpa</b>.',
    ()=>{ tulisSel(rows,[]); toast(rows.length+' sel disalin'); });
}
function isiSisa(){
  const senin=MINGGU_AKTIF||seninDari(hariIni());
  pilihShiftModal('Isi Sel Kosong','Hanya sel yang masih kosong di minggu ini yang diisi. Yang sudah terisi tidak disentuh.',function(pilihan){
    const rows=[];
    kruDivisi(DIV).forEach(function(u){
      // Shift ditentukan PER ORANG saat memakai bawaan, sekali di luar loop
      // hari supaya tidak dihitung ulang tujuh kali.
      const k=(pilihan===PILIH_BAWAAN)?shiftKru(u.id):pilihan;
      const d=shiftDef(k);
      for(let i=0;i<7;i++){
        const tgl=addD(senin,i);
        if(!sel(u.id,tgl)) rows.push({u:u.id, d:tgl, t:k, m:d.libur?'':d.m, s:d.libur?'':d.s, n:''});
      }
    });
    if(!rows.length){ toast('Tidak ada sel kosong'); return; }
    tulisSel(rows,[]);
    toast(rows.length+' sel diisi '+(pilihan===PILIH_BAWAAN?'shift bawaan tiap kru':shiftDef(pilihan).n));
  }, true);
}
function isiBaris(uid){
  const u=kruById(uid); if(!u) return;
  const senin=MINGGU_AKTIF||seninDari(hariIni());
  pilihShiftModal('Isi Satu Baris — '+u.name,'Seluruh 7 hari minggu ini untuk '+u.name+' akan diisi shift yang dipilih.',(k)=>{
    const d=shiftDef(k);
    const rows=tujuhHari(senin).map(tgl=>({u:uid, d:tgl, t:k, m:d.libur?'':d.m, s:d.libur?'':d.s, n:''}));
    tulisSel(rows,[]); toast(u.name+': 7 hari diisi '+d.n);
  });
}
function kosongkanMinggu(){
  const senin=MINGGU_AKTIF||seninDari(hariIni());
  const emps=kruDivisi(DIV);
  const hapus=[];
  emps.forEach(u=>{ tujuhHari(senin).forEach(tgl=>{ if(sel(u.id,tgl)) hapus.push({u:u.id,d:tgl}); }); });
  if(!hapus.length){ toast('Minggu ini sudah kosong'); return; }
  konfirmasi('Kosongkan minggu ini?',
    '<b>'+hapus.length+' sel</b> divisi '+esc(namaDivisi(DIV))+' pada '+esc(rentangMinggu(senin))+' akan dihapus. Tidak bisa dibatalkan.',
    ()=>{ tulisSel([],hapus); toast('Minggu dikosongkan'); });
}

/* =====================================================================
   HALAMAN 3 — JADWAL SAYA
   ===================================================================== */
function viewSaya(){
  const uid=ME&&ME.id;
  const u=uid?kruById(uid):null;
  const mk=BULAN_AKTIF||bulanDari(hariIni());
  if(!u){
    return '<div class="panel">'+panelKosongRoster()
      +'<div class="empty"><div class="ic">👤</div>Akun Anda belum ketemu di daftar kru Office.'
      +'<div class="mutedhint" style="margin-top:6px">Jadwal pribadi baru bisa ditampilkan setelah akun Anda terdaftar sebagai pegawai di Laksamana Office.</div></div></div>';
  }
  const div=divisiDari(u);
  const a=awalBulan(mk), z=akhirBulan(mk);
  let masuk=0, libur=0, jam=0;
  let baris='';
  for(let d=a; d<=z; d=addD(d,1)){
    const c=sel(uid,d);
    const sd=c?shiftDef(c.t):null;
    const jm=jamSel(c);
    if(c){ if(sd.libur) libur++; else { masuk++; if(jm) jam+=durasiJam(jm.m,jm.s); } }
    const ini=(d===hariIni());
    baris+='<div class="row" style="'+(ini?'border-color:var(--gold-2);background:#FFFDF7':'')+'">'
      +'<div class="who"><b>'+HARI[idxHari(d)]+', '+esc(tglManusia(d))+'</b>'
      +'<span>'+(ini?'hari ini':'')+'</span></div>'
      +(c?'<span class="stpill" style="background:'+esc(sd.w)+';color:'+warnaTeks(sd.w)+'">'+esc(labelSel(c))+'</span>':'<span class="stpill" style="background:var(--line);color:var(--muted)">belum diatur</span>')
      +(jm?'<span class="mono" style="font-size:12px;color:var(--muted)">'+jm.m+' – '+jm.s+'</span>':'')
      +'</div>';
  }
  return '<div class="panel">'
    +'<div class="rowbar"><h2>👤 Jadwal Saya</h2>'
    +'<span class="chip">'+esc(u.name)+' · '+esc(namaDivisi(div))+'</span>'
    +'<div class="spacer"></div>'
    +'<button class="btn btn-primary btn-sm" onclick="bukaAjukan()">+ Ajukan Off / Izin</button>'
    +'<div class="navdate"><button class="iconbtn" onclick="geserBulanAktif(-1)">‹</button><b>'+esc(labelBulan(mk))
    +'</b><button class="iconbtn" onclick="geserBulanAktif(1)">›</button></div></div>'
    +'<div class="stats">'+statBox(masuk,'Hari Masuk')+statBox(libur,'Off / Cuti')
      +statBox(Math.round(jam*10)/10,'Total Jam')+statBox(ajuSaya().filter(x=>x.status==='MENUNGGU').length,'Pengajuan Menunggu')+'</div>'
    +baris
    +'</div>';
}
function durasiJam(m,s){
  const t=x=>{ const p=String(x).split(':'); return (+p[0])*60+(+p[1]); };
  let a=t(m), b=t(s); if(b<=a) b+=1440;      // shift yang melewati tengah malam
  return (b-a)/60;
}
function ajuSaya(){ return (S.pengajuan||[]).filter(a=>a.userId===(ME&&ME.id)); }

/* =====================================================================
   HALAMAN 4 — PENGAJUAN
   Kru mengajukan, head divisinya yang memutuskan. Ini yang membedakan modul
   ini dari lembar Excel: perubahan jadwal punya jejak siapa menyetujui apa.
   ===================================================================== */
function bisaPutuskan(a){
  if(isAdmin()) return true;
  const u=kruById(a.userId);
  if(!u || !ME) return false;
  return isHeadUser(ME.id, divisiDari(u));
}
function viewPengajuan(){
  const semua=(S.pengajuan||[]).slice();
  /* Yang MENUNGGU selalu di atas: itu satu-satunya yang menuntut tindakan.
     Sisanya urut terbaru — riwayat cuma untuk dilihat sekali-sekali. */
  const list=semua.filter(a=>isAdmin() || bisaPutuskan(a) || a.userId===(ME&&ME.id))
    .sort((x,y)=>(x.status==='MENUNGGU'?0:1)-(y.status==='MENUNGGU'?0:1) || (y.dibuatAt||0)-(x.dibuatAt||0));

  let kartu='';
  if(!list.length) kartu='<div class="empty"><div class="ic">📭</div>Belum ada pengajuan.</div>';
  list.forEach(a=>{
    const u=kruById(a.userId);
    const div=u?divisiDari(u):DIV_NONSHIFT;
    const rentang=(a.dari===a.sampai)?tglPanjang(a.dari):(tglManusia(a.dari)+' – '+tglPanjang(a.sampai));
    const putus=(a.status==='MENUNGGU'&&bisaPutuskan(a))
      ? '<button class="btn btn-ok btn-sm" onclick="putuskan(\''+escJs(a.id)+'\',\'DISETUJUI\')">✓ Setujui</button>'
        +'<button class="btn btn-danger btn-sm" onclick="putuskan(\''+escJs(a.id)+'\',\'DITOLAK\')">✕ Tolak</button>'
      : '';
    const batal=(a.userId===(ME&&ME.id)&&a.status==='MENUNGGU')
      ? '<button class="btn btn-ghost btn-sm" onclick="batalAju(\''+escJs(a.id)+'\')">Batalkan</button>' : '';
    const jejak=a.status!=='MENUNGGU'
      ? '<span class="mutedhint">'+esc(a.status==='DISETUJUI'?'disetujui':'ditolak')+' oleh '+esc(a.putusOleh||'—')+'</span>' : '';
    kartu+='<div class="row aju" style="flex-direction:column;align-items:stretch">'
      +'<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">'
      +'<span class="stpill" style="background:var(--gold-soft);color:var(--gold-dim)">'+esc(JENIS_AJU[a.jenis]||a.jenis)+'</span>'
      +'<b>'+esc(u?u.name:namaKru(a.userId))+'</b>'
      +'<span style="font-size:11px;color:var(--muted-2)">'+esc(namaDivisi(div))+'</span>'
      +'<div class="spacer"></div><span class="stpill st-'+esc(a.status)+'">'+esc(a.status)+'</span></div>'
      +'<div class="isi"><b>'+esc(rentang)+'</b>'+(a.alasan?' — '+esc(a.alasan):'')+'</div>'
      +'<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">'+jejak
      +'<div class="spacer"></div>'+putus+batal+'</div></div>';
  });

  const nMenunggu=list.filter(a=>a.status==='MENUNGGU'&&bisaPutuskan(a)).length;
  return '<div class="panel">'
    +'<div class="rowbar"><h2>📝 Pengajuan Off, Izin &amp; Tukar Shift</h2><div class="spacer"></div>'
    +'<button class="btn btn-primary btn-sm" onclick="bukaAjukan()">+ Ajukan</button></div>'
    +(nMenunggu?'<div class="note w"><b>'+nMenunggu+' pengajuan</b> menunggu keputusan Anda.</div>':'')
    +'<p class="mutedhint" style="margin-bottom:12px">'
    +(isAdmin()?'Sebagai admin, Anda bisa memutuskan pengajuan semua divisi.'
      :(divisiKuasa().length?'Sebagai head '+esc(divisiKuasa().map(namaDivisi).join(', '))+', Anda memutuskan pengajuan kru divisi itu.'
        :'Pengajuan Anda diputuskan oleh head divisi Anda.'))
    +' Pengajuan <b>Off/Izin/Cuti</b> yang disetujui langsung mengisi sel jadwalnya.</p>'
    +kartu+'</div>';
}
function bukaAjukan(){
  const kuasa=divisiKuasa();
  /* Head boleh mengajukan atas nama kru divisinya — kru dapur sering titip
     lewat WhatsApp, dan memaksanya login sendiri berarti pengajuannya tidak
     pernah masuk sistem. */
  const pool = isAdmin() ? ROSTER.filter(u=>u.active!==false)
             : kuasa.length ? ROSTER.filter(u=>u.active!==false && kuasa.indexOf(divisiDari(u))>-1)
             : (ME&&kruById(ME.id) ? [kruById(ME.id)] : []);
  const opsiKru = pool.length>1
    ? '<div class="field"><label>Kru</label><select id="ajKru">'
      +pool.map(u=>'<option value="'+esc(u.id)+'"'+(u.id===(ME&&ME.id)?' selected':'')+'>'+esc(u.name)+' — '+esc(namaDivisi(divisiDari(u)))+'</option>').join('')
      +'</select></div>'
    : '';
  const hari=hariIni();
  document.getElementById('modalRoot').innerHTML=
    '<div class="overlay" onclick="if(event.target===this)tutupModal()"><div class="modal">'
    +'<div class="mh"><h3>Ajukan Perubahan Jadwal</h3><button class="xbtn" onclick="tutupModal()">×</button></div>'
    +'<div class="mb">'+opsiKru
    +'<div class="field"><label>Jenis</label><select id="ajJenis">'
    +Object.keys(JENIS_AJU).map(k=>'<option value="'+k+'">'+esc(JENIS_AJU[k])+'</option>').join('')+'</select></div>'
    +'<div class="timerow"><div class="field"><label>Dari Tanggal</label><input id="ajDari" type="date" value="'+hari+'"></div>'
    +'<div class="field"><label>Sampai Tanggal</label><input id="ajSampai" type="date" value="'+hari+'"></div></div>'
    +'<div class="field"><label>Alasan / Keterangan</label>'
    +'<textarea id="ajAlasan" rows="3" placeholder="Contoh: tukar shift dengan Yuza, Kamis jadi PAGI karena ada urusan keluarga"></textarea></div>'
    +'<p class="mutedhint">Pengajuan masuk ke head divisi untuk disetujui. Yang berjenis Off/Izin/Cuti akan langsung mengisi jadwal begitu disetujui.</p>'
    +'</div><div class="mf"><button class="btn btn-ghost" onclick="tutupModal()">Batal</button>'
    +'<button class="btn btn-primary" onclick="kirimAju()">Kirim Pengajuan</button></div></div></div>';
}
async function kirimAju(){
  const el=id=>document.getElementById(id);
  const uid=el('ajKru')?el('ajKru').value:(ME&&ME.id);
  const jenis=el('ajJenis').value;
  let dari=el('ajDari').value, sampai=el('ajSampai').value||dari;
  const alasan=el('ajAlasan').value.trim();
  if(!uid){ toast('Kru belum dipilih', true); return; }
  if(!dari){ toast('Tanggal belum diisi', true); return; }
  if(sampai<dari){ const t=dari; dari=sampai; sampai=t; }
  if(!alasan){ toast('Isi alasannya dulu', true); return; }
  tutupModal();
  const row={id:'A'+Date.now().toString(36)+Math.floor(Math.random()*900+100), userId:uid, jenis, dari, sampai, alasan};
  try{
    await apiPost({action:'simpanPengajuan', row});
    S.pengajuan.unshift(Object.assign({status:'MENUNGGU', dibuatAt:Date.now(), dibuatOleh:(ME&&ME.name)||'', putusOleh:'', putusAt:0}, row));
    simpanCache(); render(); toast('Pengajuan terkirim ke head divisi');
  }catch(e){ toast('Gagal mengirim: '+e.message, true); }
}
/* Menyetujui Off/Izin/Cuti langsung menulis selnya. Head yang baru saja
   menekan Setujui menganggap urusannya selesai — kalau jadwalnya tidak ikut
   berubah, kru tetap tercatat masuk dan itu baru ketahuan saat absensi. */
async function putuskan(id,status){
  const a=(S.pengajuan||[]).find(x=>x.id===id); if(!a) return;
  if(!bisaPutuskan(a)){ toast('Pengajuan ini bukan wewenang Anda', true); return; }
  try{
    await apiPost({action:'putusPengajuan', id, status, nota:''});
    a.status=status; a.putusOleh=(ME&&ME.name)||''; a.putusAt=Date.now();
    if(status==='DISETUJUI' && AJU_KE_SHIFT[a.jenis]){
      const t=AJU_KE_SHIFT[a.jenis], rows=[];
      for(let d=a.dari; d<=a.sampai; d=addD(d,1)) rows.push({u:a.userId, d, t, m:'', s:'', n:''});
      await tulisSel(rows,[]);
      toast('Disetujui — '+rows.length+' hari diisi '+t);
    }else{
      simpanCache(); render();
      toast(status==='DISETUJUI'?'Pengajuan disetujui':'Pengajuan ditolak');
    }
  }catch(e){ toast('Gagal menyimpan putusan: '+e.message, true); }
}
async function batalAju(id){
  try{
    await apiPost({action:'hapusPengajuan', id});
    S.pengajuan=(S.pengajuan||[]).filter(x=>x.id!==id);
    simpanCache(); render(); toast('Pengajuan dibatalkan');
  }catch(e){ toast('Gagal membatalkan: '+e.message, true); }
}

function ubahShift(k,f,v){
  const cur=S.setting.shifts[k]||Object.assign({},SHIFT_BAWAAN[k]);
  cur[f]=v; S.setting.shifts[k]=cur;
  simpanSetting(); render();
}
function ubahHead(div,uid,on){
  const l=(S.setting.heads[div]||[]).filter(x=>x!==uid);
  if(on) l.push(uid);
  S.setting.heads[div]=l;
  simpanSetting(); render();
  toast(on?(namaKru(uid)+' jadi head '+namaDivisi(div)):(namaKru(uid)+' bukan head lagi'));
}
function ubahDivisi(uid,k){
  if(k) S.setting.divOverride[uid]=k; else delete S.setting.divOverride[uid];
  simpanSetting(); render();
}
function ubahShiftKru(uid,k){
  if(k) S.setting.shiftKru[uid]=k; else delete S.setting.shiftKru[uid];
  simpanSetting(); render();
}
function ubahJabatan(uid,v){
  v=String(v||'').trim();
  if(v) S.setting.jabatan[uid]=v; else delete S.setting.jabatan[uid];
  simpanSetting(); render();
}

/* =====================================================================
   EKSPOR — teks WA & PNG
   Head menempel jadwal di papan DAN mengirimnya ke grup. Dua jalur itu
   memang dua kebiasaan yang berbeda, jadi keduanya disediakan.
   ===================================================================== */
/* Satu bulan penuh dan satu minggu dibedakan HANYA oleh daftar pitanya.
   Sisanya — penggambar PNG, penyusun teks WA, judul, nama berkas — memakai
   jalur yang sama persis. Menduplikasi penggambar canvas untuk mode mingguan
   berarti dua tempat yang harus diperbaiki tiap kali bentuk selnya berubah,
   dan yang satunya pasti terlupa. */
function pitaBulanAktif(){ return pitaBulan(BULAN_AKTIF||bulanDari(hariIni())); }
function pitaMingguAktif(){
  const senin=MINGGU_AKTIF||seninDari(hariIni());
  return [{senin, hari:tujuhHari(senin)}];
}
function judulLembar(lingkup){
  const nama=namaDivisi(DIV).toUpperCase();
  return lingkup==='minggu'
    ? 'SCHEDULE '+nama+' — '+rentangMinggu(MINGGU_AKTIF||seninDari(hariIni())).toUpperCase()
    : 'SCHEDULE '+nama+' — '+labelBulan(BULAN_AKTIF||bulanDari(hariIni())).toUpperCase();
}

function exportWA(lingkup){
  const emps=kruDivisi(DIV);
  if(!emps.length){ toast('Belum ada kru untuk diekspor'); return; }
  const pita=(lingkup==='minggu')?pitaMingguAktif():pitaBulanAktif();
  let txt='*'+judulLembar(lingkup)+'*\nLaksamana Muda\n';
  pita.forEach(p=>{
    // Pemisah minggu tidak ada gunanya kalau memang cuma satu minggu.
    if(pita.length>1) txt+='\n──────────────\n_'+rentangMinggu(p.senin)+'_\n';
    else txt+='\n';
    emps.forEach(u=>{
      const isi=p.hari.map(d=>{
        const c=sel(u.id,d);
        return HARI[idxHari(d)].slice(0,3)+' '+(c?labelSel(c):'-');
      }).join(', ');
      txt+='*'+u.name+'* ('+jabatanDari(u)+')\n'+isi+'\n';
    });
  });
  txt+='\n_'+daftarShift().map(k=>shiftDef(k).n+(shiftDef(k).libur?'':' '+shiftDef(k).m+'-'+shiftDef(k).s)).join(' · ')+'_';
  salinTeks(txt);
}
function salinTeks(txt){
  const tampil=(ok)=>{
    document.getElementById('modalRoot').innerHTML=
      '<div class="overlay" onclick="if(event.target===this)tutupModal()"><div class="modal">'
      +'<div class="mh"><h3>Teks untuk WhatsApp</h3><button class="xbtn" onclick="tutupModal()">×</button></div>'
      +'<div class="mb">'+(ok?'<div class="note i">✓ Sudah tersalin ke clipboard — tinggal tempel di grup.</div>'
                            :'<p class="mutedhint" style="margin-bottom:8px">Salin teks di bawah lalu kirim ke grup.</p>')
      +'<textarea rows="14" style="width:100%;font-size:12.5px;padding:10px;border:1.5px solid var(--line);border-radius:10px" onclick="this.select()">'
      +esc(txt)+'</textarea></div>'
      +'<div class="mf"><button class="btn btn-primary" onclick="tutupModal()">Selesai</button></div></div></div>';
  };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>tampil(true),()=>tampil(false));
  }else tampil(false);
}

/* PNG digambar ulang di canvas, BUKAN memotret tabel HTML: html2canvas dan
   sejenisnya butuh pustaka eksternal, dan modul ini tidak memuat satu pun
   skrip dari luar. Ukurannya mengikuti jumlah kru, jadi divisi besar tidak
   terpotong. */
function exportPNG(lingkup){
  const emps=kruDivisi(DIV);
  if(!emps.length){ toast('Belum ada kru untuk diekspor'); return; }
  const minggu=(lingkup==='minggu');
  const pita=minggu?pitaMingguAktif():pitaBulanAktif();
  const namaBerkas='jadwal-'+DIV+'-'+(minggu?('minggu-'+(MINGGU_AKTIF||seninDari(hariIni())))
                                            :(BULAN_AKTIF||bulanDari(hariIni())))+'.png';

  const sc=2, padX=20, noW=42, nmW=210, jbW=96, dayW=118;
  const hRow=34, hHdr=26, hHdr2=22, hJudul=74, gap=16, hLegend=46;
  const W=padX*2+noW+nmW+jbW+dayW*7;
  const H=hJudul+pita.reduce((s,p)=>s+hHdr+hHdr2+hRow*emps.length+gap,0)+hLegend+padX;

  const cv=document.createElement('canvas'); cv.width=W*sc; cv.height=H*sc;
  const cx=cv.getContext('2d');
  // Peramban tua / lingkungan tanpa canvas mengembalikan null. Lebih baik satu
  // pesan jelas daripada TypeError yang membuat seluruh halaman diam.
  if(!cx){ toast('Peramban ini tidak mendukung ekspor PNG — pakai Print/PDF', true); return; }
  cx.scale(sc,sc);
  cx.fillStyle='#FFFFFF'; cx.fillRect(0,0,W,H);

  // Kepala
  cx.fillStyle='#2A2620'; cx.fillRect(0,0,W,hJudul);
  cx.fillStyle='#C8961F'; cx.font='800 24px "Plus Jakarta Sans",sans-serif'; cx.textAlign='left';
  cx.fillText(judulLembar(lingkup), padX, 36);
  cx.fillStyle='#F2E9D3'; cx.font='600 13px Inter,sans-serif';
  cx.fillText('Laksamana Muda · dicetak '+tglPanjang(hariIni()), padX, 58);

  let y=hJudul+gap/2;
  const x0=padX;
  pita.forEach(p=>{
    const kolom=p.hari.length;
    // Baris tanggal
    cx.fillStyle='#F2E9D3'; cx.fillRect(x0,y,noW+nmW+jbW+dayW*kolom,hHdr);
    cx.fillStyle='#2A2620'; cx.font='700 12px "Plus Jakarta Sans",sans-serif'; cx.textAlign='center';
    cx.fillText('No.', x0+noW/2, y+17);
    cx.fillText('NAMA', x0+noW+nmW/2, y+17);
    cx.fillText('TGL', x0+noW+nmW+jbW/2, y+17);
    p.hari.forEach((d,i)=>{ cx.fillText(tglPendek(d), x0+noW+nmW+jbW+dayW*i+dayW/2, y+17); });
    y+=hHdr;
    // Baris nama hari
    cx.fillStyle='#EFECE4'; cx.fillRect(x0,y,noW+nmW+jbW+dayW*kolom,hHdr2);
    cx.font='700 11px Inter,sans-serif';
    cx.fillStyle='#5C574D'; cx.fillText('HARI', x0+noW+nmW+jbW/2, y+15);
    p.hari.forEach((d,i)=>{
      const idx=idxHari(d);
      cx.fillStyle=(idx>=5)?'#C9432B':'#5C574D';
      cx.fillText(HARI_PJG[idx], x0+noW+nmW+jbW+dayW*i+dayW/2, y+15);
    });
    y+=hHdr2;
    // Baris kru
    emps.forEach((u,ui)=>{
      cx.fillStyle=ui%2?'#FFFFFF':'#FBFAF8'; cx.fillRect(x0,y,noW+nmW+jbW+dayW*kolom,hRow);
      cx.textAlign='center'; cx.fillStyle='#928C80'; cx.font='600 11px Inter,sans-serif';
      cx.fillText(String(ui+1), x0+noW/2, y+hRow/2+4);
      cx.textAlign='left'; cx.fillStyle='#2A2620'; cx.font='700 12.5px Inter,sans-serif';
      cx.fillText(potong(cx,u.name,nmW-14), x0+noW+8, y+hRow/2+4);
      cx.textAlign='center'; cx.fillStyle='#5C574D'; cx.font='700 11px Inter,sans-serif';
      cx.fillText(potong(cx,jabatanDari(u),jbW-8), x0+noW+nmW+jbW/2, y+hRow/2+4);
      p.hari.forEach((d,i)=>{
        const cell=sel(u.id,d);
        const cxx=x0+noW+nmW+jbW+dayW*i;
        if(cell){
          const sd=shiftDef(cell.t);
          cx.fillStyle=sd.w; cx.fillRect(cxx+1,y+1,dayW-2,hRow-2);
          cx.fillStyle=warnaTeks(sd.w); cx.font='800 12px "Plus Jakarta Sans",sans-serif';
          cx.fillText(potong(cx,labelSel(cell),dayW-10), cxx+dayW/2, y+hRow/2+4);
        }else{
          cx.fillStyle='#C9C3B7'; cx.font='600 13px Inter,sans-serif';
          cx.fillText('·', cxx+dayW/2, y+hRow/2+4);
        }
      });
      y+=hRow;
    });
    // Garis kisi pita ini
    cx.strokeStyle='#D9D3C4'; cx.lineWidth=1;
    const atas=y-hRow*emps.length-hHdr-hHdr2;
    for(let i=0;i<=kolom;i++){
      const gx=x0+noW+nmW+jbW+dayW*i+.5;
      cx.beginPath(); cx.moveTo(gx,atas); cx.lineTo(gx,y); cx.stroke();
    }
    [x0+.5, x0+noW+.5, x0+noW+nmW+.5].forEach(gx=>{ cx.beginPath(); cx.moveTo(gx,atas); cx.lineTo(gx,y); cx.stroke(); });
    for(let r=0;r<=emps.length;r++){
      const gy=atas+hHdr+hHdr2+hRow*r+.5;
      cx.beginPath(); cx.moveTo(x0,gy); cx.lineTo(x0+noW+nmW+jbW+dayW*kolom,gy); cx.stroke();
    }
    cx.beginPath(); cx.moveTo(x0,atas+.5); cx.lineTo(x0+noW+nmW+jbW+dayW*kolom,atas+.5); cx.stroke();
    y+=gap;
  });

  // Legenda
  cx.textAlign='left'; let lx=padX; const ly=y+18;
  daftarShift().forEach(k=>{
    const sd=shiftDef(k);
    cx.fillStyle=sd.w; cx.fillRect(lx,ly-11,14,14);
    cx.strokeStyle='#D9D3C4'; cx.strokeRect(lx+.5,ly-10.5,13,13);
    cx.fillStyle='#5C574D'; cx.font='600 11.5px Inter,sans-serif';
    cx.fillText(sd.n, lx+20, ly);
    lx+=20+cx.measureText(sd.n).width+18;
  });

  cv.toBlob(b=>{
    if(!b){ toast('Gagal membuat PNG', true); return; }
    const a=document.createElement('a');
    a.href=URL.createObjectURL(b);
    a.download=namaBerkas;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000);
    toast(minggu?'PNG jadwal minggu ini diunduh':'PNG jadwal sebulan diunduh');
  });
}
function potong(cx,txt,maxW){
  txt=String(txt==null?'':txt);
  if(cx.measureText(txt).width<=maxW) return txt;
  let t=txt;
  while(t.length>1 && cx.measureText(t+'…').width>maxW) t=t.slice(0,-1);
  return t+'…';
}

/* =====================================================================
   BOOT
   ===================================================================== */
function tampilkanGerbang(judul,pesan){
  const g=document.getElementById('gate');
  document.getElementById('gateJudul').textContent=judul;
  document.getElementById('gatePesan').textContent=pesan;
  g.classList.remove('hidden');
  document.getElementById('app').classList.add('hidden');
}
async function boot(){
  BULAN_AKTIF=bulanDari(hariIni());
  DASH_TGL=hariIni();
  MINGGU_AKTIF=seninDari(hariIni());
  S=bacaCache()||seed();

  const ses=bacaSesi();
  if(!ses){ tampilkanGerbang('Belum masuk','Modul ini dibuka lewat Laksamana Office. Silakan masuk dulu di sana.'); return; }
  if(ses.tolak){
    tampilkanGerbang('Tidak punya akses',
      (ses.name?ses.name+', a':'A')+'kun Anda belum diberi akses modul Jadwal Shift. Minta admin menambahkannya lewat Kelola Akses di Office.');
    return;
  }
  ME=ses;
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('su-un').textContent=ME.name||'—';
  document.getElementById('su-avatar').textContent=inisial(ME.name);
  /* Pilihan menu ciut dipulihkan SEBELUM render pertama, bukan sesudah —
     kalau sesudah, sidebar sempat melebar lalu menyempit dan seluruh isi
     halaman ikut bergeser di depan mata pemakainya. */
  try{ if(localStorage.getItem('lm_jadwal_navmini')==='1') document.getElementById('app').classList.add('nav-mini'); }catch(e){}

  render();                                   // gambar dari cache dulu — layar tidak pernah kosong menunggu jaringan
  await muatRoster();
  await muatData(true);

  /* Divisi awal: divisi yang paling masuk akal untuk orang ini. Head langsung
     mendarat di divisinya sendiri, bukan di Bar yang kebetulan pertama. */
  const kuasa=divisiKuasa();
  DIV = kuasa.length ? kuasa[0] : divisiSaya();
  // Yang tidak dijadwalkan tidak punya lembar sendiri; jatuhkan ke Bar.
  if(DIVISI.every(d=>d.k!==DIV)) DIV='bar';
  if(!bolehBuka(VIEW)) VIEW='dashboard';

  document.getElementById('su-ur').textContent=labelPeran();
  render();
}

/* Tab yang dibiarkan terbuka semalaman memegang jadwal kemarin. Saat kembali
   aktif, ambil ulang — head lain mungkin sudah mengubahnya. */
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible' && ME){ muatData(true).then(render); }
});

boot();
</script>
