/* dgnSemua = tambahkan tab "Semua Divisi" di depan. Dipakai Input Mingguan
   DAN, sejak 14 Agustus 2026, halaman bulanan.
   Keberatan lamanya masih benar — lembar sebulan satu divisi sudah 31 kolom,
   dan menumpuk empat divisi di lebar yang sama tidak menambah satu kolom pun
   tapi memanjangkan halamannya berlipat. Yang berubah: lembarnya tidak
   ditumpuk melainkan DIURUT — tiap divisi mendapat pita namanya sendiri di
   dalam pita minggu yang sama, jadi yang bertambah cuma gulungan ke bawah,
   arah yang memang sudah dipakai halaman ini. Itu ditukar dengan satu-satunya
   tampilan yang menjawab "malam Sabtu ini siapa saja yang masuk, di semua
   pos" tanpa membuka empat tab bergantian. */
function segDivisi(aktif,onclick,dgnSemua){
  /* Hanya keempat divisi shift. Tidak ada tab tambahan untuk sisanya:
     yang tidak dijadwalkan memang tidak punya lembar untuk dilihat. */
  const semua=DIVISI.slice();
  const kuasa=divisiKuasa();
  let h='<div class="seg">';
  if(dgnSemua){
    /* Hitungannya HANYA divisi yang boleh disusun orang ini — sama dengan isi
       lembarnya nanti. Menampilkan jumlah seluruh kru sementara yang tergambar
       cuma satu divisi membuat angka di tab tidak pernah cocok dengan yang
       terlihat di bawahnya. */
    const n=kuasa.reduce((a,k)=>a+kruDivisi(k).length,0);
    h+='<button class="'+(aktif==='ALL'?'active':'')+'" onclick="'+onclick+'(\'ALL\')" '
      +'title="Susun seluruh divisi yang Anda pegang dalam satu layar">🗂️ Semua Divisi'
      +(n?' <span style="opacity:.6;font-weight:600">'+n+'</span>':'')+'</button>';
  }
  h+=semua.map(d=>{
    const n=kruDivisi(d.k).length;
    return '<button class="'+(aktif===d.k?'active':'')+'" onclick="'+onclick+'(\''+d.k+'\')">'+d.ic+' '+esc(d.n)+
           (n?' <span style="opacity:.6;font-weight:600">'+n+'</span>':'')+'</button>';
  }).join('');
  return h+'</div>';
}
function legendaShift(){
  return '<div class="legend">'+daftarShift().map(k=>{
    const d=shiftDef(k);
    return '<span class="chip"><span class="sw" style="background:'+esc(d.w)+'"></span>'+esc(d.n)+'</span>';
  }).join('')+'</div>';
}
function statBox(n,l){ return '<div class="stat"><div class="n">'+n+'</div><div class="l">'+esc(l)+'</div></div>'; }

/* Tombol balik ke hari/bulan/minggu berjalan.
   Dua hal yang diperbaiki sekaligus di sini:

   1. Tulisannya tidak lagi "Hari Ini" / "Bulan Ini" / "Minggu Ini". Diletakkan
      persis di sebelah label rentang yang sedang dibuka, tulisan itu terbaca
      sebagai KETERANGAN halaman ("ini hari ini"), bukan sebagai tombol — jadi
      saat head sudah menggeser ke Oktober, layarnya tetap seolah menuliskan
      "Bulan Ini" di sebelah "Oktober 2026". Sekarang isinya kalimat perintah
      utuh: "Kembali ke bulan ini". Bentuk pendek sebelumnya ("Bulan berjalan")
      masih menyisakan tebakan — berjalan ke mana, dan apa yang terjadi kalau
      diklik. Kalimat penuh menghabiskan sedikit lebih banyak tempat dan
      menghapus seluruh tebakan itu.
   2. Tombolnya hanya muncul kalau memang sedang TIDAK di rentang berjalan.
      Saat sudah di sana ia tidak melakukan apa-apa, dan tombol yang diklik
      lalu tidak terjadi apa-apa membuat orang mengira layarnya menggantung. */
function tombolKembali(fn,diRentangIni,ket){
  if(diRentangIni) return '';
  return '<button class="btn btn-ghost btn-sm" onclick="'+fn+'()" title="'+esc(ket)+'">↩ '+esc(ket)+'</button>';
}
/* `luar` = sel ini milik bulan tetangga (kolom sambungan di lembar bulanan).
   Ia digambar redup DAN dipaksa tidak bisa diklik di sini, bukan cuma di
   pemanggilnya: satu pemanggil yang lupa mengirim `editable:false` sudah
   cukup untuk membuat head menimpa jadwal bulan lalu tanpa sadar. */
function selHtml(c,uid,tgl,editable,luar){
  if(luar) editable=false;
  const cls='cell'+(editable?' editable':'')+(luar?' luar':'');
  const klik=editable?' onclick="bukaEditor(\''+escJs(uid)+'\',\''+tgl+'\')"':'';
  if(!c) return '<td class="'+cls+' kosong"'+klik+'>·</td>';
  const d=shiftDef(c.t);
  const jm=jamSel(c);
  const gaya='background:'+esc(d.w)+';color:'+warnaTeks(d.w);
  const jam=(jm&&!c.n)?'<span class="tm mono">'+jm.m+'–'+jm.s+'</span>':'';
  return '<td class="'+cls+'" style="'+gaya+'"'+klik+'>'+esc(labelSel(c))+jam+'</td>';
}
function panelKosongRoster(){
  if(ROSTER.length) return '';
  return '<div class="note w">Daftar kru belum bisa diambil dari Office'+
    (ROSTER_ERR?(' ('+esc(ROSTER_ERR)+')'):'')+'. Jadwal tidak bisa digambar tanpa nama kru. '+
    '<button class="btn btn-ghost btn-sm" style="margin-left:6px" onclick="ulangRoster()">Coba lagi</button></div>';
}
async function ulangRoster(){ await muatRoster(); render(); }

/* =====================================================================
   HALAMAN 0 — DASHBOARD
   Pertanyaan pertama tiap pagi bukan "bagaimana sebulan ini", melainkan
   "hari ini siapa yang masuk dan siapa yang libur". Itu yang dijawab di sini,
   dalam DUA tabel terpisah supaya keduanya terbaca sekaligus tanpa harus
   memindai satu daftar campur.

   Kru yang selnya BELUM diisi sengaja TIDAK ikut ke tabel "tidak masuk".
   Belum dijadwalkan bukan berarti libur, dan menaruhnya di sana membuat head
   mengira jumlah orangnya sudah pas padahal ada lubang. Ia dilaporkan
   terpisah sebagai peringatan.
   ===================================================================== */
function dashTgl(){ return DASH_TGL||hariIni(); }
function dashKru(){
  return ROSTER.filter(function(u){
    if(u.active===false) return false;
    var d=divisiDari(u);
    if(d===DIV_NONSHIFT) return false;
    return DASH_DIV==='ALL' ? true : d===DASH_DIV;
  }).sort(function(a,b){
    return String(namaDivisi(divisiDari(a))).localeCompare(namaDivisi(divisiDari(b)))
        || String(a.name||'').localeCompare(String(b.name||''));
  });
}
/* ================= PANDUAN LANGKAH PERTAMA =================
   Head baru yang membuka modul ini melihat Dashboard berisi angka nol dan
   dua tabel kosong — layar yang benar tapi tidak memberi tahu apa pun tentang
   apa yang harus dikerjakan. Pertanyaan yang muncul persis tiga, dan selalu
   sama: "krunya dari mana?", "ngisi jadwalnya di mana?", "kalau ada yang minta
   off gimana?".

   Panduan ini menjawab ketiganya dalam tiga kalimat, DAN HILANG SENDIRI begitu
   jadwalnya mulai terisi — panduan yang menetap akan dibaca sekali lalu jadi
   perabot yang mendorong isi halaman ke bawah selamanya. Tidak ada tombol
   "jangan tampilkan lagi": tombol itu perlu disimpan di suatu tempat, dan
   keadaan "sudah ada jadwalnya" adalah penanda yang lebih jujur daripada
   centang yang mungkin ditekan orang lain di perangkat yang sama. */
function panduanAwalHTML(){
  /* Muncul hanya kalau BELUM ADA satu pun sel terisi di seluruh modul. Bukan
     "bulan ini kosong": bulan depan yang masih kosong itu keadaan normal
     sepanjang tahun, dan panduannya akan muncul lagi tiap kali head menggeser
     ke bulan berikutnya. */
  if(S && S.sel && Object.keys(S.sel).length) return '';
  if(!ROSTER.length) return '';        // panelKosongRoster sudah bicara duluan
  const kuasa=divisiKuasa();
  const bisaSusun=kuasa.length>0;
  const langkah=[
    ['1','Kru datang otomatis dari Office',
     'Daftar nama di bawah ditarik dari database pegawai Laksamana Office — tidak perlu diketik ulang di sini. '
     +'Kalau ada nama yang belum muncul, kolom <b>Tim / Keterangan</b> orang itu di Office belum diisi divisinya.'],
    ['2','Susun jadwalnya di Input Mingguan',
     bisaSusun
       ? 'Buka <b>Input Mingguan</b>, pilih minggunya, lalu klik sel mana pun untuk memilih shift. '
         +'Untuk mengisi satu orang tujuh hari sekaligus, pakai tombol <b>Input Mingguan</b> di barisnya.'
       : 'Yang menyusun jadwal adalah head tiap divisi. Kalau Anda memang head, minta admin menunjuk Anda '
         +'lewat <b>Pengaturan → Head Divisi</b>.'],
    ['3','Off & izin masuk lewat Pengajuan',
     'Kru mengajukan sendiri dari <b>Jadwal Saya</b> — cukup klik tanggalnya. '
     +'Yang Anda setujui di halaman <b>Pengajuan</b> langsung mengisi sel jadwalnya, jadi tidak perlu diketik dua kali.']
  ];
  return '<div class="panel noprint" style="border-color:var(--gold);background:linear-gradient(180deg,#FFFDF7,#fff)">'
    +'<div class="rowbar"><h2>🧭 Tiga langkah untuk mulai</h2>'
    +'<div class="spacer"></div>'
    +'<span class="mutedhint">Panduan ini hilang sendiri begitu ada jadwal yang terisi.</span></div>'
    +'<div class="langkah">'
    +langkah.map(function(l){
        return '<div class="lk"><div class="lk-n">'+l[0]+'</div>'
          +'<div class="lk-t"><b>'+esc(l[1])+'</b><span>'+l[2]+'</span></div></div>';
      }).join('')
    +'</div>'
    +(bisaSusun
      ? '<div class="rowbar" style="margin-top:12px">'
        +'<button class="btn btn-primary btn-sm" onclick="go(&#39;minggu&#39;)">Mulai susun jadwal →</button>'
        +'<button class="btn btn-ghost btn-sm" onclick="go(&#39;pengaturan&#39;)">Atur shift &amp; jam dulu</button>'
        +'</div>'
      : '')
    +'</div>';
}
function viewDashboard(){
  const tgl=dashTgl(), ini=(tgl===hariIni());
  const emps=dashKru();
  const masuk=[], libur=[], belum=[];
  emps.forEach(function(u){
    const c=sel(u.id,tgl);
    if(!c) belum.push(u);
    else if(shiftDef(c.t).libur) libur.push({u:u,c:c});
    else masuk.push({u:u,c:c});
  });
  /* Urutan bisa dipilih. Bawaannya JAM MASUK — yang datang paling pagi di
     atas, seperti orang membaca daftar giliran. Dua urutan lain ada karena
     dicari untuk pertanyaan yang berbeda: "nama" saat mencari satu orang
     tertentu, "divisi" saat melihat Semua dan ingin tahu tiap divisi terisi
     berapa. Nama selalu jadi pemecah seri supaya urutannya tidak pernah
     berubah-ubah sendiri antar render. */
  const urutDash=function(a,b){
    if(DASH_URUT==='nama') return String(a.u.name||'').localeCompare(String(b.u.name||''));
    if(DASH_URUT==='divisi')
      return String(namaDivisi(divisiDari(a.u))).localeCompare(String(namaDivisi(divisiDari(b.u))))
          || String(a.u.name||'').localeCompare(String(b.u.name||''));
    const ja=jamSel(a.c), jb=jamSel(b.c);
    return (ja?ja.m:'99:99').localeCompare(jb?jb.m:'99:99')
        || String(a.u.name||'').localeCompare(String(b.u.name||''));
  };
  masuk.sort(urutDash);
  libur.sort(urutDash);

  /* Halaman dijepit ke rentang yang masih ada. Tanpa ini, berpindah tanggal
     saat sedang di halaman 3 meninggalkan tabel KOSONG di hari yang cuma
     punya satu halaman — dan tabel kosong terbaca sebagai "tidak ada yang
     masuk", kesalahan yang paling mahal di halaman ini. */
  const jepit=function(hal,total){
    const maks=Math.max(1,Math.ceil(total/DASH_PER));
    return Math.min(Math.max(1,hal),maks);
  };
  DASH_HAL =jepit(DASH_HAL, masuk.length);
  DASH_HAL2=jepit(DASH_HAL2,libur.length);
  const potong=function(list,hal){ return list.slice((hal-1)*DASH_PER, hal*DASH_PER); };

  function klikSel(u){
    return bolehUbah(divisiDari(u))
      ? ' class="klik" onclick="bukaEditor(&#39;'+escJs(u.id)+'&#39;,&#39;'+tgl+'&#39;)"' : '';
  }
  function kolomOrang(u){
    return '<td><span class="nama">'+esc(u.name)+'</span><div class="kecil">'+esc(jabatanDari(u))+'</div></td>'
         + '<td>'+esc(namaDivisi(divisiDari(u)))+'</td>';
  }
  function pil(c){
    const d=shiftDef(c.t);
    return '<span class="stpill" style="background:'+esc(d.w)+';color:'+warnaTeks(d.w)+'">'+esc(labelSel(c))+'</span>';
  }

  /* Nomor baris meneruskan hitungan antar halaman (11, 12, \u2026 di halaman 2),
     bukan mulai dari 1 lagi \u2014 nomor yang mengulang membuat orang mengira ia
     sedang melihat daftar yang sama. */
  const awalM=(DASH_HAL-1)*DASH_PER, awalL=(DASH_HAL2-1)*DASH_PER;
  const barisMasuk=potong(masuk,DASH_HAL).map(function(r,i){
    const j=jamSel(r.c);
    return '<tr'+klikSel(r.u)+'><td class="no">'+(awalM+i+1)+'</td>'+kolomOrang(r.u)
      +'<td>'+pil(r.c)+'</td>'
      +'<td class="mono">'+(j?esc(j.m+' \u2013 '+j.s):'\u2014')+'</td></tr>';
  }).join('');
  const barisLibur=potong(libur,DASH_HAL2).map(function(r,i){
    return '<tr'+klikSel(r.u)+'><td class="no">'+(awalL+i+1)+'</td>'+kolomOrang(r.u)
      +'<td>'+pil(r.c)+'</td></tr>';
  }).join('');

  /* Pemilih urutan & pager hanya muncul kalau memang ada gunanya: satu
     halaman tidak butuh tombol pindah halaman, dan tiga baris tidak butuh
     pemilih urutan. Kontrol yang selalu ada tapi tak pernah berubah hasilnya
     cuma menambah hal yang harus diabaikan. */
  const segUrut = masuk.length>1
    ? '<div class="seg" style="margin-left:auto">'
      +[['jam','Jam'],['nama','Nama'],['divisi','Divisi']].map(function(x){
          return '<button class="'+(DASH_URUT===x[0]?'active':'')+'" onclick="dashUrut(&#39;'+x[0]+'&#39;)">'+x[1]+'</button>';
        }).join('')+'</div>'
    : '';
  function pagerDash(total,hal,fn){
    const maks=Math.ceil(total/DASH_PER);
    if(maks<=1) return '';
    const a=(hal-1)*DASH_PER+1, z=Math.min(hal*DASH_PER,total);
    return '<div class="rowbar noprint" style="margin:10px 0 0">'
      +'<span class="mutedhint">'+a+'\u2013'+z+' dari '+total+' orang</span><div class="spacer"></div>'
      +'<div class="navdate">'
      +'<button class="iconbtn" onclick="'+fn+'('+(hal-1)+')"'+(hal<=1?' disabled':'')+' aria-label="Halaman sebelumnya">\u2039</button>'
      +'<b style="min-width:auto;padding:0 6px">'+hal+' / '+maks+'</b>'
      +'<button class="iconbtn" onclick="'+fn+'('+(hal+1)+')"'+(hal>=maks?' disabled':'')+' aria-label="Halaman berikutnya">\u203a</button>'
      +'</div></div>';
  }

  // Rincian per shift — sekilas cukup untuk tahu shift pagi kurang orang atau tidak.
  const rinci=daftarShift().filter(function(k){ return !shiftDef(k).libur; }).map(function(k){
    const n=masuk.filter(function(r){ return r.c.t===k; }).length;
    if(!n) return '';
    const d=shiftDef(k);
    return '<span class="chip"><span class="sw" style="background:'+esc(d.w)+'"></span>'+esc(d.n)+' <b>'+n+'</b></span>';
  }).join('');

  const seg='<div class="seg"><button class="'+(DASH_DIV==='ALL'?'active':'')+'" onclick="dashDiv(&#39;ALL&#39;)">Semua</button>'
    +DIVISI.map(function(d){
      return '<button class="'+(DASH_DIV===d.k?'active':'')+'" onclick="dashDiv(&#39;'+d.k+'&#39;)">'+d.ic+' '+esc(d.n)+'</button>';
    }).join('')+'</div>';

  const bolehApaPun=DIVISI.some(function(d){ return bolehUbah(d.k); });

  /* Daily worker pada tanggal ini. Diberi panel SENDIRI, tidak dilebur ke
     tabel "Masuk": angka di kartu ringkasan (Masuk / Belum Diatur / Total
     Kru) semuanya dihitung dari roster Office, dan menyelipkan DW ke
     tabelnya membuat jumlah baris tidak lagi cocok dengan angka di atasnya —
     persis jenis ketidakcocokan yang membuat orang berhenti percaya layarnya.
     Yang tampil hanya yang sudah DISETUJUI HR (lihat jadwal_dw). */
  const dwHari=DW_ROWS.filter(function(x){
    return x.tgl===tgl && (DASH_DIV==='ALL' || x.divisi===DASH_DIV);
  }).sort(function(a,b){
    return String(a.m||'99:99').localeCompare(String(b.m||'99:99'))
        || String(a.nama||'').localeCompare(String(b.nama||''));
  });
  const panelDW = dwHari.length
    ? '<div class="panel"><div class="rowbar"><h2>🧑‍🍳 Daily Worker</h2>'
      +'<span class="chip">'+dwHari.length+' orang</span><div class="spacer"></div>'
      +'<span class="mutedhint">disetujui HR di modul Daily Worker</span></div>'
      +'<div class="tablewrap"><table class="list"><thead><tr><th class="no">#</th><th>Nama</th>'
      +'<th>Divisi</th><th>Posisi</th><th>Jam</th></tr></thead><tbody>'
      +dwHari.map(function(x,i){
        return '<tr class="dwrow"><td class="no">'+(i+1)+'</td>'
          +'<td><span class="nama">'+esc(x.nama)+'</span><div class="kecil">daily worker</div></td>'
          +'<td>'+esc(namaDivisi(x.divisi))+'</td>'
          +'<td>'+esc(x.posisi||'—')+'</td>'
          +'<td class="mono">'+((x.m&&x.s)?esc(x.m+' – '+x.s):'—')+'</td></tr>';
      }).join('')
      +'</tbody></table></div></div>'
    : '';

  return panduanAwalHTML()
    +'<div class="panel">'
    +'<div class="rowbar"><h2>'+(ini?'Hari Ini':esc(HARI[idxHari(tgl)]))+', '+esc(tglPanjang(tgl))+'</h2>'
    +(ini?'':'<span class="chip">bukan hari ini</span>')
    +'<div class="spacer"></div>'
    +'<div class="navdate"><button class="iconbtn" onclick="dashGeser(-1)" title="Hari sebelumnya">\u2039</button>'
    +'<input type="date" class="inp" value="'+tgl+'" onchange="dashSet(this.value)" style="font-weight:600">'
    +'<button class="iconbtn" onclick="dashGeser(1)" title="Hari berikutnya">\u203a</button>'
    +tombolKembali('dashHariIni', ini, 'Kembali ke hari ini')+'</div></div>'
    +panelKosongRoster()+panelGagalDW()
    +'<div class="rowbar">'+seg+'<div class="spacer"></div><div class="legend">'+rinci+'</div></div>'
    +'<div class="stats">'+statBox(masuk.length,'Masuk')+statBox(libur.length,'Tidak Masuk')
      +statBox(belum.length,'Belum Diatur')+statBox(emps.length,'Total Kru')
      +statBox(dwHari.length,'Daily Worker')+'</div>'
    /* NAMANYA TIDAK LAGI DIDAFTAR SEMUA. Dulu seluruh nama ditulis di dalam
       pita ini, dan pada hari yang belum disusun sama sekali itu berarti 37
       nama beruntun dalam satu paragraf kuning setinggi lima baris — tidak
       terbaca, tidak bisa dipindai, dan mendorong seluruh isi halaman ke bawah
       justru pada hari yang paling perlu segera dikerjakan.

       Yang ditinggalkan cuma angkanya + satu jalan keluar. Daftar namanya
       memang sudah punya tempatnya sendiri: tabel di bawah, dan lembar Input
       Mingguan yang justru dipakai membetulkannya. */
    +(belum.length
      ? '<div class="note w"><b>'+belum.length+' kru belum dijadwalkan</b> pada tanggal ini. '
        +'Belum dijadwalkan bukan berarti libur.'
        +(divisiKuasa().length
          ? ' <button class="btn btn-ghost btn-sm noprint" style="margin-left:6px" '
            +'onclick="go(&#39;minggu&#39;)">Isi lewat Input Mingguan</button>' : '')
        +'</div>'
      : '')
    +'</div>'

    +'<div class="panel"><div class="rowbar"><h2>\u2705 Masuk</h2>'
    +'<span class="chip">'+masuk.length+' orang</span>'+segUrut+'</div>'
    +(masuk.length
      ? '<div class="tablewrap"><table class="list"><thead><tr><th class="no">#</th><th>Nama</th><th>Divisi</th><th>Shift</th><th>Jam</th></tr></thead><tbody>'+barisMasuk+'</tbody></table></div>'
        +pagerDash(masuk.length,DASH_HAL,'dashHal')
      : '<div class="empty"><div class="ic">\ud83c\udf19</div>Tidak ada yang masuk pada tanggal ini.</div>')
    +'</div>'

    +panelDW

    +'<div class="panel"><div class="rowbar"><h2>\ud83c\udfd6\ufe0f Tidak Masuk</h2>'
    +'<span class="chip">'+libur.length+' orang</span><div class="spacer"></div></div>'
    +(libur.length
      ? '<div class="tablewrap"><table class="list"><thead><tr><th class="no">#</th><th>Nama</th><th>Divisi</th><th>Status</th></tr></thead><tbody>'+barisLibur+'</tbody></table></div>'
        +pagerDash(libur.length,DASH_HAL2,'dashHal2')
      : '<div class="empty"><div class="ic">\ud83d\udcaa</div>Tidak ada yang libur, izin, atau cuti pada tanggal ini.</div>')
    +(bolehApaPun?'<p class="mutedhint" style="margin-top:10px">Klik baris mana pun untuk mengubah shift orang itu pada tanggal ini.</p>':'')
    +'</div>';
}
/* Ganti urutan MENGEMBALIKAN pembacaan ke halaman 1. Mempertahankan halaman
   lama setelah urutannya berubah berarti orang yang sedang mencari satu nama
   mendarat di tengah daftar yang isinya sudah lain sama sekali. */
function dashUrut(k){ DASH_URUT=k; DASH_HAL=1; DASH_HAL2=1; render(); }
function dashHal(n){ DASH_HAL=Math.max(1,n); render(); }
function dashHal2(n){ DASH_HAL2=Math.max(1,n); render(); }
/* Pindah tanggal / divisi juga kembali ke halaman 1 — jumlah orangnya
   berbeda, jadi halaman 3 kemarin belum tentu ada hari ini. */
function dashGeser(n){ DASH_HAL=1; DASH_HAL2=1; DASH_TGL=addD(dashTgl(),n); muatDanGambar(); }

/* Beban kerja sebulan per kru: berapa hari masuk, berapa libur, berapa jam,
   dan rangkaian hari masuk terpanjang tanpa sela.

   Ini yang paling sering jadi keributan di grup: "kenapa OFF saya cuma dua",
   dan head tidak punya cara cepat membuktikannya selain menghitung manual
   tiga puluh kolom.

   Panel yang dulu memakainya di kaki Jadwal Bulanan sudah dihapus; angkanya
   sekarang dibaca PER ORANG di halaman Rekap Pegawai. Fungsinya tetap di sini
   karena Rekap memanggilnya. */
function bebanKru(u,mk){
  const a=awalBulan(mk), z=akhirBulan(mk);
  let masuk=0, libur=0, kosong=0, jam=0, beruntun=0, maxBeruntun=0;
  for(let d=a; d<=z; d=addD(d,1)){
    const c=sel(u.id,d);
    if(!c){ kosong++; beruntun=0; continue; }
    if(shiftDef(c.t).libur){ libur++; beruntun=0; continue; }
    masuk++; beruntun++;
    if(beruntun>maxBeruntun) maxBeruntun=beruntun;
    const j=jamSel(c); if(j) jam+=durasiJam(j.m,j.s);
  }
  return {masuk,libur,kosong,jam:Math.round(jam*10)/10,maxBeruntun};
}
/* Jeda antara shift hari ini dan shift besoknya, dalam jam. Shift yang
   melewati tengah malam ikut terhitung benar karena jam selesai yang lebih
   kecil dari jam mulai digeser satu hari — tanpa itu SIANG 14:00–00:00
   terbaca sebagai jeda 14 jam, padahal kru baru pulang saat besok dimulai. */
function jedaKeBesok(uid,tgl){
  const c1=sel(uid,tgl), c2=sel(uid,addD(tgl,1));
  if(!c1||!c2) return null;
  if(shiftDef(c1.t).libur||shiftDef(c2.t).libur) return null;
  const j1=jamSel(c1), j2=jamSel(c2);
  if(!j1||!j2) return null;
  const men=function(t){ const q=String(t).split(":"); return (+q[0])*60+(+q[1]); };
  let selesai=men(j1.s); if(selesai<=men(j1.m)) selesai+=1440;
  const mulaiBesok=1440+men(j2.m);
  return Math.round((mulaiBesok-selesai)/60*10)/10;
}
/* peringatanBulan() dan panelBeban() dihapus 5 Agustus 2026 bersama panel
   "Beban Kerja Bulan Ini" di kaki Jadwal Bulanan. Keduanya tidak punya
   pemanggil lain, dan fungsi tanpa pemanggil ikut muncul saat mencari lalu
   membuat pembaca berikutnya mengira masih ada layar yang memakainya.

   Peringatan yang setara tetap ada, tapi PER ORANG di halaman Rekap Pegawai \u2014
   di sana ia menempel pada orang yang sedang dilihat, bukan sebagai tabel
   sepanjang divisi yang memanjangkan halaman yang justru dibuka untuk
   melihat kisi jadwalnya. */
function rekapBulan(emps,mk){
  const a=awalBulan(mk), z=akhirBulan(mk);
  let masuk=0,libur=0,kosong=0;
  emps.forEach(u=>{
    for(let d=a; d<=z; d=addD(d,1)){
      const c=sel(u.id,d);
      if(!c) kosong++;
      else if(shiftDef(c.t).libur) libur++;
      else masuk++;
    }
  });
  return {masuk,libur,kosong};
}
/* =====================================================================
   HALAMAN — REKAP PEGAWAI  (head / admin / manajemen)
   Menjawab pertanyaan yang selama ini dijawab dengan memelototi lembar
   bulanan sambil menghitung kolom pakai jari: "sebulan ini si A masuk berapa
   hari, berapa jam, dan off-nya berapa". Lembar bulanan bagus untuk melihat
   SATU DIVISI sekaligus, tapi buruk untuk melihat SATU ORANG utuh — matanya
   harus menyusuri satu baris melewati lima pita minggu.

   Angkanya sengaja dihitung ulang lewat bebanKru()/jedaKeBesok() yang sama
   dengan panel Beban Kerja, bukan rumus baru: dua tempat yang menghitung jam
   kerja dengan cara sedikit berbeda adalah cara tercepat kehilangan
   kepercayaan pada keduanya.
   ===================================================================== */
let REKAP_UID='';
/* Semua kru yang memang dijadwalkan, diurut per divisi lalu nama — bentuk
   yang sama dengan cara orang menyebut mereka ("anak bar", "anak kitchen"). */
function rekapKandidat(){
  const out=[];
  DIVISI.forEach(function(d){ kruDivisi(d.k).forEach(function(u){ out.push({u:u, div:d.k}); }); });
  return out;
}
/* Berapa kali tiap kode shift dipakai orang ini sebulan. Inilah yang
   menjawab "kok dia SIANG terus" dengan angka, bukan dengan perasaan. */
function rincianShift(uid,mk){
  const a=awalBulan(mk), z=akhirBulan(mk);
  const n={};
  for(let d=a; d<=z; d=addD(d,1)){
    const c=sel(uid,d); if(!c) continue;
    n[c.t]=(n[c.t]||0)+1;
  }
  return n;
}
function rekapDetail(uid,mk){
  const a=awalBulan(mk), z=akhirBulan(mk);
  let wknd=0, jedaMin=null;
  for(let d=a; d<=z; d=addD(d,1)){
    const c=sel(uid,d);
    if(c && !shiftDef(c.t).libur && idxHari(d)>=5) wknd++;
    if(d<z){
      const j=jedaKeBesok(uid,d);
      if(j!==null && (jedaMin===null || j<jedaMin)) jedaMin=j;
    }
  }
  return {wknd, jedaMin};
}

    +'</select>';

  /* Kalender sebulan — bentuk yang sama dengan Jadwal Saya, supaya head yang

  pitaBulan(mk).forEach(function(p){

      kal+='<div class="kd'+(d===hariIni()?' ini':'')+(c?'':' belum')+'"'

        +'<div class="tg">'+parseD(d).getDate()+'</div>'
        +(c
          ? '<div class="sf" style="background:'+esc(sd.w)+';color:'+warnaTeks(sd.w)+'">'+esc(labelSel(c))+'</div>'

        +'</div>';
    });
  });
  kal+='</div>';

  const chipShift=Object.keys(rinci).sort((x,y)=>(shiftDef(x).urut||99)-(shiftDef(y).urut||99))
    .map(function(k){
      const d=shiftDef(k);
      return '<span class="chip"><span class="sw" style="background:'+esc(d.w)+'"></span>'+esc(d.n)+' <b>'+rinci[k]+'×</b></span>';
    }).join('');

  const maks=(S.setting.maksBeruntun)||6, batasJeda=(S.setting.jedaMin)||10;
  const alarm=[];
  if(b.maxBeruntun>maks) alarm.push('<b>'+b.maxBeruntun+' hari masuk beruntun</b> tanpa libur (batas '+maks+')');
  if(det.jedaMin!==null && det.jedaMin<batasJeda) alarm.push('jeda tersingkat antar shift hanya <b>'+det.jedaMin+' jam</b> (batas '+batasJeda+')');
  if(b.kosong) alarm.push('<b>'+b.kosong+' hari</b> belum diatur sama sekali');

  const ajuOrang=(S.pengajuan||[]).filter(function(x){
    return x.userId===u.id && !(x.sampai<a || x.dari>z);
  }).sort((x,y)=>String(x.dari).localeCompare(String(y.dari)));

  return '<div class="panel">'
    +'<div class="rowbar"><h2>📈 Rekap Pegawai</h2><div class="spacer"></div>'
    +'<div class="navdate noprint"><button class="iconbtn" onclick="geserBulanAktif(-1)" aria-label="Bulan sebelumnya">‹</button>'
    +'<b>'+esc(labelBulan(mk))+'</b>'
    +'<button class="iconbtn" onclick="geserBulanAktif(1)" aria-label="Bulan berikutnya">›</button>'
    +tombolKembali('bulanIni', mk===bulanDari(hariIni()), 'Kembali ke bulan ini')+'</div></div>'
    +panelKosongRoster()
    +'<div class="rowbar">'+pilih
    +'<span class="chip">'+esc(ikonDivisiJadwal(div)+' '+namaDivisi(div))+'</span>'
    /* Chip jabatan hanya kalau ia MENAMBAH keterangan. jabatanDari() jatuh ke
       kolom keterangan Office, yang untuk sebagian besar kru berisi persis
       nama divisinya ("Bar") -- jadi barisnya memajang divisi dua kali
       berturut-turut, dan yang kedua terbaca seolah jabatan yang berbeda. */
    +(jabatanSetara(jabatanDari(u), div) ? '' : '<span class="chip">'+esc(jabatanDari(u))+'</span>')
    +(isHeadUser(u.id,div)?'<span class="stpill" style="background:var(--gold-soft);color:var(--gold-dim)">head divisi</span>':'')
    +'<div class="spacer"></div>'
    +'<button class="btn btn-ghost btn-sm noprint" onclick="window.print()">🖨️ Print / PDF</button></div>'

    +'<div class="stats">'
      +statBox(b.masuk,'Hari Masuk')
      +statBox(b.libur,'Off / Cuti')
      +statBox(b.jam?b.jam:'—','Total Jam')
      +statBox(rata?rata:'—','Rata Jam/Hari')
      +statBox(b.maxBeruntun,'Beruntun Terpanjang')
      +statBox(det.wknd,'Masuk Akhir Pekan')
      +statBox(det.jedaMin===null?'—':det.jedaMin,'Jeda Tersingkat (jam)')
      +statBox(b.kosong,'Belum Diatur')
    +'</div>'
    +(alarm.length
      ? '<div class="note w"><b>Perlu dilihat:</b><ul style="margin:6px 0 0 18px">'
        +alarm.map(x=>'<li>'+x+'</li>').join('')+'</ul></div>'
      : '<div class="note i">Tidak ada yang melewati batas hari beruntun maupun jeda antar-shift.</div>')
    +(chipShift?'<div class="rowbar"><span class="mutedhint">Rincian shift:</span><div class="legend">'+chipShift+'</div></div>':'')
    +kal
    +(bolehUbah(div)
      ? '<p class="mutedhint noprint" style="margin-top:10px">Klik tanggal mana pun untuk mengubah shift '+esc(u.name)+'.</p>'
      : '<p class="mutedhint noprint" style="margin-top:10px">Mode lihat saja — yang menyusun jadwal divisi ini adalah head-nya.</p>')
    +'</div>'
    +(ajuOrang.length
      ? '<div class="panel"><div class="rowbar"><h2>Pengajuan bulan ini</h2>'
        +'<span class="chip">'+ajuOrang.length+'</span></div>'
        +ajuOrang.map(function(x){
            const rentang=(x.dari===x.sampai)?tglPanjang(x.dari):(tglManusia(x.dari)+' – '+tglPanjang(x.sampai));
            return '<div class="row"><div class="who"><b>'+esc(JENIS_AJU[x.jenis]||x.jenis)+'</b>'
              +'<span>'+esc(rentang)+(x.alasan?' — '+esc(x.alasan):'')+'</span></div>'
              +pilShiftAju(x)+'<span class="stpill st-'+esc(x.status)+'">'+esc(x.status)+'</span></div>';
          }).join('')
        +'</div>'
      : '');
}
/* Benar-benar sama dengan nama divisinya? Dibandingkan setelah huruf besar,
   spasi, dan tanda baca dibuang, supaya "bar", "BAR", dan "Bar " terhitung
   sama. Yang kosong ("-") juga tidak perlu chip sendiri. */
function jabatanSetara(jab,div){
  const rapi=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'');
  const j=rapi(jab);
  return !j || j===rapi(namaDivisi(div));
}
function pilihRekap(id){ REKAP_UID=id; render(); }
function ikonDivisiJadwal(k){ const d=DIVISI.find(x=>x.k===k); return d?d.ic:'•'; }

function gantiDiv(k){ DIV=k; render(); }
function geserBulanAktif(n){ BULAN_AKTIF=geserBulan(BULAN_AKTIF||bulanDari(hariIni()),n); muatDanGambar(); }
function bulanIni(){ BULAN_AKTIF=bulanDari(hariIni()); muatDanGambar(); }

/* =====================================================================
   HALAMAN 2 — INPUT MINGGUAN
   Satuan kerja head: satu minggu Senin–Minggu, satu divisi.
   ===================================================================== */
function viewMinggu(){
  const kuasa=divisiKuasa();
  if(!kuasa.length){
    return '<div class="panel"><div class="empty"><div class="ic">🔒</div>'
      +'Halaman ini untuk head divisi.<div class="mutedhint" style="margin-top:6px">'
      +'Kalau Anda memang head, minta admin menunjuk Anda di <b>Pengaturan → Head Divisi</b>.</div></div></div>';
  }
  if(DIV!=='ALL' && kuasa.indexOf(DIV)<0) DIV=kuasa[0];
  const semuaDiv=(DIV==='ALL');
  const senin=MINGGU_AKTIF||seninDari(hariIni());
  const hari=tujuhHari(senin);
  /* Divisi yang digambar. Di mode Semua HANYA yang boleh disusun orang ini —
     head Bar tidak pernah boleh mengisi lembar Kitchen, dan menampilkannya
     sebagai sel yang bisa diklik lalu ditolak backend adalah janji palsu. */
  const daftarDiv=semuaDiv?kuasa.slice():[DIV];
  const emps=semuaDiv?[]:kruDivisi(DIV);

  const kepala='<tr class="hdr"><th class="no">No.</th><th>NAMA</th><th>TGL</th>'
    +hari.map(d=>'<th>'+tglPendek(d)+'</th>').join('')+'</tr>'
    +'<tr class="hdr2"><th></th><th></th><th>HARI</th>'
    +hari.map((d,i)=>'<th class="'+(i>=5?'wknd':'')+'">'+HARI[i].toUpperCase()+'</th>').join('')+'</tr>';
  /* Satu divisi = satu tabel. Dulu isi tabel dirakit langsung di sini; sejak
     mode Semua ada, potongannya dipisah supaya KEDUA mode memakai perakit yang
     sama — kalau tidak, kolom yang ditambahkan nanti pasti cuma masuk ke salah
     satunya. */
  const tabelDiv=function(k){
    const list=kruDivisi(k);
    let b=kepala;
    if(!list.length){
      b+='<tr><td colspan="10" style="padding:24px;text-align:center;color:var(--muted-2)">Belum ada kru di divisi ini</td></tr>';
    }
    list.forEach((u,ui)=>{
      b+='<tr><td class="no">'+(ui+1)+'</td>'
        +'<td class="nm"><b>'+esc(u.name)+'</b><i>'+esc(jabatanDari(u))+'</i></td>'
        /* Dulu tombol ini cuma bertulis "baris" dan tidak ada yang menebak
           gunanya. Namanya sekarang menyebut pekerjaannya: mengisi satu minggu
           penuh untuk orang itu, satu klik satu hari. */
        +'<td class="jb"><button class="btn btn-ghost btn-sm" title="Isi seluruh minggu untuk kru ini — satu klik satu hari" onclick="isiBaris(\''+escJs(u.id)+'\')">Input Mingguan</button></td>'
        +hari.map(d=>selHtml(sel(u.id,d),u.id,d,true)).join('')+'</tr>';
    });
    /* Blok daily worker ikut tampil saat head menyusun minggu depan — justru di
       sinilah ia paling dibutuhkan: head perlu tahu sudah ada berapa DW hari
       Sabtu SEBELUM memutuskan berapa kru tetap yang di-off-kan. Barisnya
       TIDAK bisa diklik: yang mengubahnya adalah HR di modul Daily Worker. */
    b+=blokDW(k,hari);
    return '<div class="tablewrap"><table class="sched">'+b+'</table></div>';
  };
  const isiTabel=semuaDiv
    ? daftarDiv.map(function(k){
        const n=kruDivisi(k).length;
        const kosong=kruDivisi(k).reduce((a,u)=>a+hari.filter(d=>!sel(u.id,d)).length,0);
        return '<div class="rowbar" style="margin-top:14px">'
          +'<h2 style="font-size:15px">'+esc(ikonDivisiJadwal(k)+' '+namaDivisi(k))+'</h2>'
          +'<span class="chip">'+n+' kru</span>'
          +(kosong?'<span class="chip" style="color:var(--danger)">'+kosong+' sel kosong</span>'
                  :'<span class="chip" style="color:var(--ok)">lengkap</span>')
          +'</div>'+tabelDiv(k);
      }).join('')
    : tabelDiv(DIV);

  const belum=(semuaDiv?daftarDiv:[DIV]).reduce(function(n,k){
    return n+kruDivisi(k).reduce((a,u)=>a+hari.filter(d=>!sel(u.id,d)).length,0);
  },0);
  return '<div class="panel">'
    +kopCetakHTML('Jadwal Shift — '+(semuaDiv?'Semua Divisi':namaDivisi(DIV)), rentangMinggu(senin))
    +'<div class="rowbar">'+segDivisi(DIV,'gantiDivMinggu',true)+'<div class="spacer"></div>'
    +'<div class="navdate"><button class="iconbtn" onclick="geserMinggu(-1)">‹</button>'
    +'<b>'+esc(rentangMinggu(senin))+'</b>'
    +'<button class="iconbtn" onclick="geserMinggu(1)">›</button>'
    +tombolKembali('mingguIni', senin===seninDari(hariIni()), 'Kembali ke minggu ini')+'</div></div>'
    +panelKosongRoster()+panelGagalDW()
    +(belum?'<div class="note w"><b>'+belum+' sel</b> masih kosong di minggu ini'+(semuaDiv?' (seluruh divisi Anda)':'')+'.</div>'
           :'<div class="note i">Minggu ini sudah terisi penuh.</div>')
    /* ALAT MASSAL DISEMBUNYIKAN DI MODE SEMUA, dan itu bukan kemalasan.
       Salin Minggu Lalu, Isi Sel Kosong, Kosongkan, PNG, dan Teks WA semuanya
       bekerja atas kruDivisi(DIV) — dan kruDivisi('ALL') memulangkan array
       KOSONG. Kalau tombolnya dibiarkan, menekannya tidak melakukan apa pun
       (atau memunculkan "Belum ada kru untuk diekspor" pada divisi yang jelas
       penuh isinya): kegagalan yang paling membingungkan, karena layarnya
       memperlihatkan puluhan kru tepat di bawah tombol yang berkata tidak ada
       kru. Yang tetap jalan di mode ini: klik sel satu per satu, dan tombol
       "Input Mingguan" per baris — keduanya bekerja per ORANG, bukan per DIV. */
    +'<div class="rowbar">'+legendaShift()+'<div class="spacer"></div><div class="tools">'
    +(semuaDiv
      ? '<span class="mutedhint">Salin / isi massal &amp; ekspor bekerja per divisi — pilih tab divisinya.</span>'
      : '<button class="btn btn-ghost btn-sm" onclick="salinMingguLalu()">📋 Salin Minggu Lalu</button>'
        +'<button class="btn btn-ghost btn-sm" onclick="isiSisa()">⚡ Isi Sel Kosong</button>'
        +'<button class="btn btn-ghost btn-sm" onclick="kosongkanMinggu()">🧹 Kosongkan</button>')
    +'</div></div>'
    /* Alat berbagi diletakkan juga di sini, bukan cuma di halaman bulanan:
       yang paling sering ditempel di papan dan dikirim ke grup justru jadwal
       MINGGU DEPAN, dan head sedang berada di halaman ini saat selesai
       menyusunnya. Menyuruhnya pindah ke halaman bulanan dulu cuma untuk
       mengunduh gambar adalah langkah yang tidak ada gunanya. */
    +'<div class="rowbar noprint"><span class="mutedhint">Bagikan minggu ini:</span><div class="spacer"></div><div class="tools">'
    /* PNG & Teks WA ikut disembunyikan di mode Semua — alasannya sama dengan
       alat massal di atas. Print/PDF TETAP ADA: ia mencetak apa yang benar-
       benar ada di layar, jadi justru di mode inilah ia paling berguna. */
    +(semuaDiv?''
      : '<button class="btn btn-ghost btn-sm" onclick="exportExcel(&#39;minggu&#39;)">📗 Excel Seminggu</button>'
        +'<button class="btn btn-ghost btn-sm" onclick="exportPNG(&#39;minggu&#39;)">🖼️ PNG Seminggu</button>'
        +'<button class="btn btn-ghost btn-sm" onclick="exportWA(&#39;minggu&#39;)">💬 Teks WA</button>')
    +'<button class="btn btn-ghost btn-sm" onclick="window.print()">🖨️ Print / PDF</button>'
    +'</div></div>'
    +isiTabel
    +'<p class="mutedhint" style="margin-top:10px">Klik sel untuk memilih shift. Jam bawaan tiap shift bisa ditimpa per sel — dipakai untuk jadwal khusus, mis. shift 9 jam.</p>'
    +'</div>';
}
/* 'ALL' dilewatkan tanpa pemeriksaan divisi — ia BUKAN divisi, melainkan
   permintaan menampilkan seluruh divisi yang memang sudah jadi kuasa orang ini
   (viewMinggu menyaringnya lagi lewat divisiKuasa()). Tanpa pengecualian ini,

function bukaEditor(uid,tgl){
  const u=kruById(uid); if(!u) return;
  const div=divisiDari(u);
  if(!bolehUbah(div)){ toast('Hanya head divisi '+namaDivisi(div)+' yang bisa mengatur jadwal ini'); return; }
  const c=sel(uid,tgl);
  /* Sel kosong dibuka dengan shift orang itu pada hari yang sama MINGGU LALU,
     bukan selalu PAGI. Pola tiap orang berulang minggu demi minggu, jadi
     tebakan yang benar menghemat satu klik di hampir setiap sel — dan sel yang
     salah tebak tetap tinggal dipilih ulang seperti biasa. */
  const bawaan=shiftKru(uid,tgl);
  EDIT={uid, tgl, t:(c?c.t:bawaan), m:(c?c.m:''), s:(c?c.s:''), n:(c?c.n:''), ada:!!c};

/* =====================================================================
   ALAT MINGGUAN — salin, isi cepat, kosongkan, isi baris
   ===================================================================== */
const PILIH_BAWAAN='__BAWAAN__';

/* ---------- Peringatan "ini akan menimpa apa" ----------
   Semua alat massal di halaman ini menulis puluhan sel sekaligus, dan
   sebelumnya kalimat peringatannya cuma "sel yang sudah terisi ikut
   tertimpa" — benar, tapi tidak menjawab pertanyaan yang sebenarnya dipunyai
   head: tertimpa yang MANA. Head lain sudah menyusun sebagian minggu itu,
   dan satu klik Salin bisa menghapusnya tanpa bekas; yang hilang baru
   ketahuan berhari-hari kemudian saat orangnya datang di jam yang salah.
   Sekarang bentroknya didaftar satu per satu — nama, tanggal, dari apa jadi
   apa — dan baru dieksekusi setelah dikonfirmasi.

   Sel yang isinya PERSIS SAMA dengan yang akan ditulis tidak dihitung
   bentrok. Menulis ulang nilai yang identik tidak mengubah apa pun, dan
   memasukkannya ke daftar membuat peringatannya berisik lalu diabaikan —
   persis nasib semua peringatan yang terlalu sering muncul. */
function samaSel(a,b){
  return a && b && a.t===b.t && (a.m||'')===(b.m||'') && (a.s||'')===(b.s||'') && (a.n||'')===(b.n||'');
}
function daftarTimpa(rows){
  const out=[];
  rows.forEach(function(r){
    const lama=sel(r.u,r.d);
    if(!lama || samaSel(lama,r)) return;
    out.push({nama:namaKru(r.u), tgl:r.d, lama:lama, baru:r});
  });
  out.sort(function(a,b){ return a.tgl===b.tgl ? String(a.nama).localeCompare(String(b.nama)) : (a.tgl<b.tgl?-1:1); });
  return out;
}
function chipSel(c){
  const d=shiftDef(c.t);
  return '<span style="background:'+esc(d.w)+';color:'+warnaTeks(d.w)+'">'+esc(labelSel(c))+'</span>';
}
/* Daftar bentrok, dipotong di 40 baris. Yang di atas 40 tidak dibaca siapa
   pun satu per satu — angkanya sendiri yang jadi peringatan. */
function htmlTimpa(list){
  const batas=40, tampil=list.slice(0,batas);
  return '<div class="timpa">'+tampil.map(function(x){
      return '<div class="tr"><b>'+esc(x.nama)+'</b>'
        +'<em>'+esc(HARI[idxHari(x.tgl)].slice(0,3))+' '+esc(tglPendek(x.tgl))+'</em>'
        +chipSel(x.lama)+'<em>→</em>'+chipSel(x.baru)+'</div>';
    }).join('')
    +(list.length>batas?'<div class="tr"><b>+ '+(list.length-batas)+' sel lagi</b></div>':'')
    +'</div>';
}
/* opsi: {lebar, ya, alt:{label,cb}} — `alt` adalah jalan keluar ketiga
   (mis. "salin tapi lewati yang terisi"). Tanpa itu head yang melihat daftar
   bentrok cuma punya dua pilihan sama-sama buruk: batal total, atau menimpa
   kerja orang lain. */
function konfirmasi(judul,pesan,cb,opsi){
  opsi=opsi||{};
  window.KONFIRM_CB=function(){ tutupModal(); cb(); };
  const alt=opsi.alt
    ? (window.KONFIRM_ALT=function(){ tutupModal(); opsi.alt.cb(); },
       '<button class="btn btn-ghost" onclick="KONFIRM_ALT()">'+esc(opsi.alt.label)+'</button>')
    : '';
  document.getElementById('modalRoot').innerHTML=
    '<div class="overlay" onclick="if(event.target===this)tutupModal()"><div class="modal" style="max-width:'+(opsi.lebar||'390px')+'">'
    +'<div class="mh"><h3>'+esc(judul)+'</h3></div>'
    +'<div class="mb"><p style="color:var(--muted);font-size:13.5px">'+pesan+'</p></div>'
    +'<div class="mf"><button class="btn btn-ghost" onclick="tutupModal()">Batal</button>'
    +alt
    +'<button class="btn btn-danger" onclick="KONFIRM_CB()">'+esc(opsi.ya||'Ya, lanjut')+'</button></div></div></div>';
}
function salinMingguLalu(){
  const senin=MINGGU_AKTIF||seninDari(hariIni());
  const lalu=addD(senin,-7);
  const emps=kruDivisi(divTunggal());
  const rows=[];
  emps.forEach(u=>{
    for(let i=0;i<7;i++){
      const c=sel(u.id, addD(lalu,i));
      if(c) rows.push({u:u.id, d:addD(senin,i), t:c.t, m:c.m, s:c.s, n:c.n});
    }
  });
  if(!rows.length){ toast('Minggu lalu ('+rentangMinggu(lalu)+') masih kosong'); return; }

  const bentrok=daftarTimpa(rows);
  const jalan=function(pakai){
    return function(){
      if(!pakai.length){ toast('Tidak ada yang perlu disalin'); return; }
      tulisSel(pakai,[]);
      toast(pakai.length+' sel disalin dari '+rentangMinggu(lalu));
    };
  };
  if(!bentrok.length){
    konfirmasi('Salin minggu lalu?',
      '<b>'+rows.length+' sel</b> dari '+esc(rentangMinggu(lalu))+' akan disalin ke '
      +esc(rentangMinggu(senin))+'.<br>Tidak ada sel terisi yang tertimpa.',
      jalan(rows), {ya:'Ya, salin'});
    return;
  }
  /* Yang benar-benar baru = rows dikurangi yang bentrok. Dipakai tombol
     "Lewati yang sudah terisi": itulah yang diinginkan hampir setiap kali
     head menyalin minggu lalu ke minggu yang sudah ia sentuh sebagian. */
  const bentrokKunci={};
  bentrok.forEach(function(x){ bentrokKunci[kunci(x.baru.u,x.baru.d)]=1; });
  const aman=rows.filter(function(r){ return !bentrokKunci[kunci(r.u,r.d)]; });

  konfirmasi('Salin minggu lalu — '+bentrok.length+' sel akan tertimpa',
    '<b>'+rows.length+' sel</b> dari '+esc(rentangMinggu(lalu))+' akan disalin ke '
    +esc(rentangMinggu(senin))+'. <b style="color:var(--danger)">'+bentrok.length+' di antaranya sudah terisi</b> '
    +'dan isinya akan diganti — daftarnya di bawah. Sisanya ('+aman.length+' sel) mengisi sel yang masih kosong.'
    /* Pengajuan yang sudah disetujui disebut TERPISAH dari sekadar "sudah
       terisi": sel biasa yang tertimpa cuma pekerjaan yang diulang, sel hasil
       pengajuan yang tertimpa adalah janji ke orangnya yang dibatalkan tanpa
       ada yang memberi tahu. */
    +(function(){
        const aju=selDariPengajuan(bentrok.map(function(x){ return x.baru; }));
        return aju.length
          ? '<div class="note w" style="margin-top:8px"><b>'+aju.length+' di antaranya menimpa hasil '
            +'pengajuan yang sudah disetujui.</b> Pakai “Lewati yang terisi” kalau tidak bermaksud membatalkannya.</div>'
          : '';
      })()
    +htmlTimpa(bentrok),
    jalan(rows),
    { lebar:'580px',
      ya:'Ya, timpa '+bentrok.length+' sel',
      alt: aman.length?{label:'Lewati yang terisi ('+aman.length+')', cb:jalan(aman)}:null });
}

/* ---------- Isi Sel Kosong ----------
   Dulu tombol ini mengisi ketujuh hari sekaligus, dan itu memaksa head
   memakainya sebagai "cat dasar" lalu membetulkan sel satu per satu. Padahal
   pekerjaan yang sebenarnya berulang tiap minggu berbentuk PER HARI: "Selasa
   semua off", "Sabtu semua masuk". Sekarang harinya dicentang dulu — matikan
   enam, sisakan Selasa, pilih OFF, selesai.

   Jumlah sel yang akan tersentuh ditulis di tiap hari, bukan cuma totalnya.
   Head perlu melihat bahwa "Selasa: 5 kosong" sebelum menekan OFF; angka nol
   di situ adalah satu-satunya penjelasan kenapa nanti tidak ada yang berubah
   di kolom itu.

   `timpa` mati secara bawaan. Nama tombolnya "Isi Sel Kosong", dan alat yang
   diam-diam melakukan lebih dari namanya adalah cara tercepat menghapus kerja
   head lain. Kalau dinyalakan, bentroknya tetap harus dikonfirmasi satu per
   satu lewat daftar yang sama dengan Salin Minggu Lalu. */
let ISI_SISA=null;   // {senin, hari:[7], timpa}
function isiSisa(){
  ISI_SISA={senin:(MINGGU_AKTIF||seninDari(hariIni())), hari:[1,1,1,1,1,1,1], timpa:false};
  gambarIsiSisa();
}
function isiSisaHitung(){
  const b=ISI_SISA, kosong=[0,0,0,0,0,0,0], terisi=[0,0,0,0,0,0,0];
  kruDivisi(divTunggal()).forEach(function(u){
    for(let i=0;i<7;i++){ if(sel(u.id, addD(b.senin,i))) terisi[i]++; else kosong[i]++; }
  });
  return {kosong:kosong, terisi:terisi};
}
function isiSisaHari(i){ const b=ISI_SISA; if(!b) return; b.hari[i]=b.hari[i]?0:1; gambarIsiSisa(); }
function isiSisaSemua(v){ const b=ISI_SISA; if(!b) return; for(let i=0;i<7;i++) b.hari[i]=v?1:0; gambarIsiSisa(); }
function isiSisaTimpa(){ const b=ISI_SISA; if(!b) return; b.timpa=!b.timpa; gambarIsiSisa(); }
function gambarIsiSisa(){
  const b=ISI_SISA; if(!b) return;
  const h=isiSisaHitung();
  const hari=tujuhHari(b.senin);
  let total=0;
  for(let i=0;i<7;i++) if(b.hari[i]) total+=h.kosong[i]+(b.timpa?h.terisi[i]:0);

  const strip=hari.map(function(tgl,i){
    const n=h.kosong[i]+(b.timpa?h.terisi[i]:0);
    const on=!!b.hari[i];
    return '<button class="hb'+(on?'':' mati')+(i>=5?' wknd':'')+'" onclick="isiSisaHari('+i+')" '
      +'title="'+esc(HARI[i]+' '+tglPanjang(tgl))+'">'
      +'<small>'+(on?'☑':'☐')+' '+esc(HARI[i].slice(0,3).toUpperCase())+'</small>'
      +'<b>'+esc(tglPendek(tgl))+'</b>'
      +'<u>'+n+' sel</u></button>';
  }).join('');

  const tombolShift=daftarShift().map(function(k){
    const sd=shiftDef(k);
    return '<button style="background:'+esc(sd.w)+';color:'+warnaTeks(sd.w)+'" onclick="isiSisaPilih(&#39;'+escJs(k)+'&#39;)">'
      +esc(sd.n)+'<small>'+(sd.libur?'&nbsp;':(sd.m+'–'+sd.s))+'</small></button>';
  }).join('');

  document.getElementById('modalRoot').innerHTML=
    '<div class="overlay" onclick="if(event.target===this)tutupModal()"><div class="modal">'
    +'<div class="mh"><h3>Isi Sel Kosong</h3>'
      +'<span class="chip">'+total+' sel</span>'
      +'<button class="xbtn" onclick="tutupModal()">×</button></div>'
    +'<div class="mb">'
      +'<p class="mutedhint" style="margin-bottom:10px">Centang hari yang mau diisi, lalu pilih shift-nya. '
      +'Mis. matikan semua kecuali <b>SELASA</b> lalu pilih <b>OFF</b> — seluruh kru divisi '
      +esc(namaDivisi(divTunggal()))+' libur hari Selasa.</p>'
      +'<div class="hari7">'+strip+'</div>'
      +'<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-6px 0 12px">'
        +'<button class="btn btn-ghost btn-sm" onclick="isiSisaSemua(1)">Semua hari</button>'
        +'<button class="btn btn-ghost btn-sm" onclick="isiSisaSemua(0)">Kosongkan pilihan</button>'
        +'<div class="spacer" style="flex:1"></div>'
        +'<button class="btn btn-ghost btn-sm" onclick="isiSisaTimpa()" title="Bawaannya hanya sel kosong yang diisi">'
        +(b.timpa?'☑':'☐')+' Timpa sel yang sudah terisi</button>'
      +'</div>'
      +(total?'':'<div class="note w" style="margin-bottom:12px">Tidak ada sel yang akan tersentuh dengan pilihan hari ini.</div>')
      /* Tombol paling atas, memenuhi lebar: inilah pilihan yang dipakai hampir
         tiap minggu. Pola tiap kru berulang minggu demi minggu, jadi "isi semua
         dengan SIANG" justru jarang benar untuk seluruh divisi sekaligus. */
      +'<button class="btn btn-primary" style="width:100%;margin-bottom:10px" onclick="isiSisaPilih(&#39;'+PILIH_BAWAAN+'&#39;)">'
      +'⭐ Ikut minggu lalu</button>'
      +'<p class="mutedhint" style="margin:-4px 0 12px">Tiap sel diisi shift orang itu pada '
      +'<b>hari yang sama minggu lalu</b> — termasuk OFF-nya, jadi pola liburnya ikut terbawa. '
      +'Kru yang belum punya riwayat minggu lalu memakai shift kebiasaannya di Pengaturan. '
      +'Atau pilih satu shift untuk semua di bawah ini.</p>'
      +'<div class="pick">'+tombolShift+'</div>'
    +'</div></div></div>';
}
function isiSisaPilih(pilihan){
  const b=ISI_SISA; if(!b) return;
  if(!b.hari.some(Boolean)){ toast('Belum ada hari yang dicentang'); return; }
  const rows=[];
  kruDivisi(divTunggal()).forEach(function(u){
    for(let i=0;i<7;i++){
      if(!b.hari[i]) continue;
      const tgl=addD(b.senin,i);
      if(sel(u.id,tgl) && !b.timpa) continue;
      /* Shift dihitung PER HARI, bukan sekali per orang: bawaannya kini
         berarti "ikut hari yang sama minggu lalu", jadi Senin dan Selasa
         bisa berbeda. Menghitungnya sekali di luar loop — seperti dulu —
         akan menyalin satu shift ke tujuh hari dan justru menghapus pola
         liburnya. */
      const k=(pilihan===PILIH_BAWAAN)?shiftKru(u.id,tgl):pilihan;
      const d=shiftDef(k);
      rows.push({u:u.id, d:tgl, t:k, m:d.libur?'':d.m, s:d.libur?'':d.s, n:''});
    }
  });
  const nama=(pilihan===PILIH_BAWAAN?'mengikuti minggu lalu':shiftDef(pilihan).n);
  if(!rows.length){ toast('Tidak ada sel yang cocok dengan pilihan hari itu'); return; }

  const bentrok=daftarTimpa(rows);
  const jalan=function(){ tulisSel(rows,[]); toast(rows.length+' sel diisi '+nama); };
  tutupModal();
  if(!bentrok.length){ jalan(); return; }
  konfirmasi('Timpa '+bentrok.length+' sel yang sudah terisi?',
    '<b>'+rows.length+' sel</b> akan diisi <b>'+esc(nama)+'</b>. '
    +'<b style="color:var(--danger)">'+bentrok.length+' di antaranya sudah terisi</b> dan isinya akan diganti:'
    +htmlTimpa(bentrok),
    jalan, {lebar:'580px', ya:'Ya, timpa '+bentrok.length+' sel'});
}
/* ---------- Isi Satu Baris: klik beruntun, satu hari per klik ----------
   Dulu tombol ini meminta SATU shift lalu menimpa ketujuh hari dengan shift
   itu — dan itu hampir tidak pernah benar. Tidak ada kru yang masuk PAGI
   tujuh hari berturut-turut; setiap baris minggu selalu campuran, dan selalu
   ada satu atau dua OFF di dalamnya. Akibatnya head memakai tombol ini untuk
   "mengecat dasar" lalu tetap mengklik sel satu per satu untuk membetulkan —
   dua pekerjaan untuk satu baris.

   Sekarang pointer-nya berjalan sendiri: klik PAGI → Senin terisi PAGI dan
   pointer pindah ke Selasa; klik OFF → Selasa OFF, pointer ke Rabu; begitu
   sampai tujuh hari penuh, lalu tersimpan sendiri. Satu baris minggu selesai
   dalam tujuh klik tanpa memindahkan tangan dari deretan tombol shift.

   Yang sudah terisi ikut dimuat sebagai keadaan awal (bukan dianggap kosong),
   dan pointer melompat ke hari kosong BERIKUTNYA — baris yang tinggal
   kurang dua hari tidak memaksa head mengetik ulang lima hari yang sudah benar. */
let ISI_BARIS=null;   // {uid,nama,senin,i,isi:[7]}
function isiBaris(uid){
  const u=kruById(uid); if(!u) return;
  const senin=MINGGU_AKTIF||seninDari(hariIni());
  ISI_BARIS={
    uid:uid, nama:u.name, senin:senin, i:0,
    isi:tujuhHari(senin).map(function(tgl){
      const c=sel(uid,tgl);
      return c?{t:c.t, m:c.m||'', s:c.s||'', n:c.n||''}:null;
    })
  };
  ISI_BARIS.i=isiBarisKosongPertama(0);
  gambarIsiBaris();
}
/* Hari kosong pertama mulai dari `dari`, memutar balik ke awal minggu.
   Mengembalikan -1 kalau ketujuhnya sudah terisi. */
function isiBarisKosongPertama(dari){
  const b=ISI_BARIS; if(!b) return -1;
  for(let n=0;n<7;n++){ const i=(dari+n)%7; if(!b.isi[i]) return i; }
  return -1;
}
function gambarIsiBaris(){
  const b=ISI_BARIS; if(!b) return;
  const hari=tujuhHari(b.senin);
  const terisi=b.isi.filter(Boolean).length;

  const strip=hari.map(function(tgl,i){
    const c=b.isi[i];
    let isiHtml='<span>·</span>';
    if(c){
      const d=shiftDef(c.t);
      isiHtml='<span style="background:'+esc(d.w)+';color:'+warnaTeks(d.w)+'">'+esc(d.n)+'</span>';
    }
    return '<button class="hb'+(i===b.i?' sel':'')+(i>=5?' wknd':'')+'" onclick="isiBarisKe('+i+')">'
      +'<small>'+esc(HARI[i].slice(0,3).toUpperCase())+'</small>'
      +'<b>'+esc(tglPendek(tgl))+'</b>'+isiHtml+'</button>';
  }).join('');

  const tombolShift=daftarShift().map(function(k){
    const sd=shiftDef(k);
    return '<button style="background:'+esc(sd.w)+';color:'+warnaTeks(sd.w)+'" onclick="isiBarisPilih(&#39;'+escJs(k)+'&#39;)">'
      +esc(sd.n)+'<small>'+(sd.libur?'&nbsp;':(sd.m+'–'+sd.s))+'</small></button>';
  }).join('');

  const sedang = b.i>=0
    ? '<b>'+esc(HARI[b.i])+', '+esc(tglManusia(hari[b.i]))+'</b> — pilih shift di bawah, lalu pointer pindah sendiri ke hari berikutnya.'
    : '<b>Tujuh hari sudah terisi.</b> Klik salah satu hari di atas kalau mau membetulkan, atau tekan Simpan.';

  document.getElementById('modalRoot').innerHTML=
    '<div class="overlay" onclick="if(event.target===this)tutupModal()"><div class="modal">'
    +'<div class="mh"><h3>Isi Satu Baris — '+esc(b.nama)+'</h3>'
      +'<span class="chip">'+terisi+'/7</span>'
      +'<button class="xbtn" onclick="tutupModal()">×</button></div>'
    +'<div class="mb">'
      +'<div class="hari7">'+strip+'</div>'
      +'<p class="mutedhint" style="margin:-4px 0 12px">'+sedang+'</p>'
      +'<div class="pick">'+tombolShift+'</div>'
    +'</div>'
    +'<div class="mf">'
      +'<button class="btn btn-ghost btn-sm" onclick="isiBarisMundur()"'+(b.i===0?' disabled':'')+'>‹ Mundur</button>'
      +'<button class="btn btn-ghost btn-sm" onclick="isiBarisKosongkan()"'+(b.i<0||!b.isi[b.i]?' disabled':'')+'>Kosongkan hari ini</button>'
      +'<div class="spacer"></div>'
      +'<button class="btn btn-primary" onclick="isiBarisSimpan()"'+(terisi?'':' disabled')+'>Simpan</button>'
    +'</div></div></div>';
}
function isiBarisKe(i){ const b=ISI_BARIS; if(!b) return; b.i=i; gambarIsiBaris(); }
function isiBarisMundur(){
  const b=ISI_BARIS; if(!b||b.i<=0) return;
  b.i=(b.i<0?6:b.i-1); gambarIsiBaris();
}
function isiBarisKosongkan(){
  const b=ISI_BARIS; if(!b||b.i<0) return;
  b.isi[b.i]=null; gambarIsiBaris();
}
function isiBarisPilih(k){
  const b=ISI_BARIS; if(!b) return;
  /* Pointer -1 = ketujuhnya sudah terisi. Klik shift saat itu tidak boleh
     menulis ke mana-mana; kalau tidak, klik yang tidak sengaja akan menimpa
     hari yang tidak pernah dituju siapa pun. */
  if(b.i<0){ toast('Pilih dulu hari yang mau diubah di atas'); return; }
  const d=shiftDef(k);
  b.isi[b.i]={t:k, m:d.libur?'':d.m, s:d.libur?'':d.s, n:''};
  const lanjut=isiBarisKosongPertama(b.i+1);
  b.i=lanjut;
  /* Tujuh hari penuh → simpan sendiri dan tutup. Itu memang akhir pekerjaan
     yang dimaksud tombol ini, dan menyuruh head menekan Simpan lagi setelah
     klik ketujuh cuma satu langkah yang tidak menambah apa pun. */
  if(lanjut<0){ isiBarisSimpan(); return; }
  gambarIsiBaris();
}
function isiBarisSimpan(){
  const b=ISI_BARIS; if(!b) return;
  const hari=tujuhHari(b.senin);
  const rows=[], hapus=[];
  hari.forEach(function(tgl,i){
    const c=b.isi[i];
    if(c) rows.push({u:b.uid, d:tgl, t:c.t, m:c.m, s:c.s, n:c.n});
    /* Hari yang dikosongkan HANYA dikirim sebagai hapus kalau selnya memang
       ada di server. Mengirim hapus untuk sel yang tidak pernah ada cuma
       menambah baris kerja tanpa efek. */
    else if(sel(b.uid,tgl)) hapus.push({u:b.uid, d:tgl});
  });
  const n=rows.length;
  tutupModal();
  if(!n && !hapus.length){ return; }
  tulisSel(rows,hapus);
  toast(b.nama+': '+n+' hari terisi'+(hapus.length?', '+hapus.length+' dikosongkan':''));
}
/* Berapa dari sel-sel ini yang lahir dari PENGAJUAN YANG SUDAH DISETUJUI.
   Dipakai konfirmasi aksi massal, dan inilah keterangan yang paling menentukan
   apakah tombolnya jadi ditekan: menghapus 34 sel yang disusun sendiri itu
   pekerjaan setengah jam; menghapus 34 sel yang 12 di antaranya adalah off
   yang sudah dijanjikan ke orangnya adalah janji yang dibatalkan tanpa ada
   yang memberi tahu. Angkanya tidak bisa dibaca dari sel — sel cuma menyimpan
   jenis shift — jadi dicocokkan balik ke daftar pengajuan. */
function selDariPengajuan(rows){
  const aju=(S.pengajuan||[]).filter(function(a){ return a.status==='DISETUJUI'; });
  if(!aju.length) return [];
  return rows.filter(function(r){
    return aju.some(function(a){ return a.userId===r.u && r.d>=a.dari && r.d<=a.sampai; });
  });
}
/* Rincian per jenis shift, urut terbanyak: "8 PAGI · 4 OFF · 2 IZIN".
   Satu angka besar ("34 sel") tidak memberi tahu apa yang hilang; deretan ini
   memberitahunya dalam satu baris tanpa membuka lembarnya lagi. */
function rincianSelHTML(rows){
  const per={};
  rows.forEach(function(r){
    const c=sel(r.u,r.d); if(!c) return;
    const d=shiftDef(c.t);
    per[d.n]=(per[d.n]||0)+1;
  });
  const k=Object.keys(per).sort(function(x,y){ return per[y]-per[x]; });
  if(!k.length) return '';
  return '<div style="margin-top:8px">'+k.map(function(n){
    return '<span class="chip">'+esc(n)+' <b>'+per[n]+'</b></span>'; }).join(' ')+'</div>';
}
function kosongkanMinggu(){
  const senin=MINGGU_AKTIF||seninDari(hariIni());
  const emps=kruDivisi(divTunggal());
  const hapus=[];
  emps.forEach(u=>{ tujuhHari(senin).forEach(tgl=>{ if(sel(u.id,tgl)) hapus.push({u:u.id,d:tgl}); }); });
  if(!hapus.length){ toast('Minggu ini sudah kosong'); return; }
  const dariAju=selDariPengajuan(hapus);
  /* Nama orangnya disebut, bukan cuma jumlahnya. "3 di antaranya hasil
     pengajuan" masih bisa diabaikan; "termasuk off Budi 12 Agu yang sudah
     Anda setujui" tidak bisa. Dibatasi lima nama supaya dialognya tidak
     berubah jadi daftar. */
  const namaAju=[...new Set(dariAju.map(function(r){ return namaKru(r.u); }))];
  konfirmasi('Kosongkan minggu ini?',
    '<b>'+hapus.length+' sel</b> divisi '+esc(namaDivisi(divTunggal()))+' pada '
    +esc(rentangMinggu(senin))+' akan dihapus. Tidak bisa dibatalkan.'
    +rincianSelHTML(hapus)
    +(dariAju.length
      ? '<div class="note w" style="margin-top:10px"><b>'+dariAju.length+' di antaranya berasal dari '
        +'pengajuan yang sudah Anda setujui</b> ('+esc(namaAju.slice(0,5).join(', '))
        +(namaAju.length>5?', +'+(namaAju.length-5)+' lagi':'')+'). '
        +'Menghapusnya tidak membatalkan pengajuannya — orangnya tetap mengira hari itu off.</div>'
      : ''),
    ()=>{ tulisSel([],hapus); toast('Minggu dikosongkan — '+hapus.length+' sel dihapus'); });
}

/* =====================================================================
   HALAMAN 3 — JADWAL SAYA
   ===================================================================== */
function viewSaya(){
  const uid=ME&&ME.id;
  const u=uid?kruById(uid):null;
  const mk=BULAN_AKTIF||bulanDari(hariIni());
  if(!u){
    return '<div class="panel">'+panelKosongRoster()
      +'<div class="empty"><div class="ic">👤</div>Akun Anda belum ketemu di daftar kru Office.'
      +'<div class="mutedhint" style="margin-top:6px">Jadwal pribadi baru bisa ditampilkan setelah akun Anda terdaftar sebagai pegawai di Laksamana Office.</div></div></div>';
  }
  const div=divisiDari(u);
  const a=awalBulan(mk), z=akhirBulan(mk);
  let masuk=0, libur=0, jam=0;
  for(let d=a; d<=z; d=addD(d,1)){
    const c=sel(uid,d); if(!c) continue;
    if(shiftDef(c.t).libur) libur++;
    else { masuk++; const jm=jamSel(c); if(jm) jam+=durasiJam(jm.m,jm.s); }
  }

  /* Tanggal yang sedang/pernah diajukan, supaya kru tidak mengirim pengajuan
     kedua untuk hari yang sama hanya karena tidak ingat. Yang MENUNGGU
     menang atas yang sudah diputus — itu yang perlu dilihat. */
  const ajuPeta={};
  ajuSaya().forEach(function(x){
    if(x.status==='DITOLAK') return;
    for(let d=x.dari; d<=x.sampai; d=addD(d,1)){
      if(ajuPeta[d]!=='MENUNGGU') ajuPeta[d]=x.status;
    }
  });

  let kal='<div class="kal">'
    +HARI.map((h,i)=>'<div class="kh'+(i>=5?' wknd':'')+'">'+esc(h.slice(0,3))+'</div>').join('');
  pitaBulan(mk).forEach(function(p){
    p.hari.forEach(function(d){
      /* Hari di luar bulan yang sedang dilihat tetap memakan satu kotak —
         tanpa itu kolom harinya bergeser dan Senin tidak lagi di bawah SEN. */
      if(d<a || d>z){ kal+='<div class="kd kosong"></div>'; return; }
      const c=sel(uid,d), sd=c?shiftDef(c.t):null, jm=jamSel(c);
      const ini=(d===hariIni());
      const st=ajuPeta[d];
      /* Judulnya menyebut apa yang akan terjadi, bukan cuma "klik untuk
         mengajukan": yang membuka halaman ini kru biasa, dan kata "ajukan"
         sendiri tidak memberi tahu bahwa yang diajukan bisa off, izin, ATAU
         tukar shift. */
      kal+='<div class="kd'+(ini?' ini':'')+(c?'':' belum')+'" onclick="bukaAjukan(\''+d+'\')" title="'
        +esc(tglPanjang(d))+(c?' — klik untuk mengajukan off, izin, atau tukar shift'
                              :' — belum diatur head. Klik untuk mengajukan.')+'">'
        +'<div class="tg">'+parseD(d).getDate()+(st==='MENUNGGU'?'<span class="tt" title="pengajuan menunggu">•</span>':'')+'</div>'
        +(c
          ? '<div class="sf" style="background:'+esc(sd.w)+';color:'+warnaTeks(sd.w)+'">'+esc(labelSel(c))+'</div>'
            +(jm?'<div class="jm">'+esc(jm.m+'–'+jm.s)+'</div>':'')
          : '<div class="blm">belum diatur</div>')
        +'</div>';
    });
  });
  kal+='</div>';

  const menunggu=ajuSaya().filter(x=>x.status==='MENUNGGU');
  return '<div class="panel">'
    +'<div class="rowbar"><h2>👤 Jadwal Saya</h2>'
    +'<span class="chip">'+esc(u.name)+' · '+esc(namaDivisi(div))+'</span>'
    +'<div class="spacer"></div>'
    +'<button class="btn btn-primary btn-sm" onclick="bukaAjukan()">+ Ajukan Off / Izin</button>'
    +'<div class="navdate"><button class="iconbtn" onclick="geserBulanAktif(-1)" aria-label="Bulan sebelumnya">‹</button><b>'+esc(labelBulan(mk))
    +'</b><button class="iconbtn" onclick="geserBulanAktif(1)" aria-label="Bulan berikutnya">›</button>'
    +tombolKembali('bulanIni', mk===bulanDari(hariIni()), 'Kembali ke bulan ini')+'</div></div>'
    +'<div class="stats">'+statBox(masuk,'Hari Masuk')+statBox(libur,'Off / Cuti')
      +statBox(Math.round(jam*10)/10,'Total Jam')+statBox(menunggu.length,'Pengajuan Menunggu')+'</div>'
    /* PETUNJUK DI ATAS KALENDER, bukan di bawahnya. Kalimatnya sudah lama ada
       — tapi ditaruh SESUDAH kisi 31 kotak, jadi ia baru terbaca oleh orang
       yang sudah selesai memindai kalendernya, yaitu orang yang sudah tidak
       membutuhkannya lagi. Yang belum tahu tanggalnya bisa diklik justru
       menutup halaman sebelum sampai ke sana.

       Bentuknya note, bukan mutedhint: ini satu-satunya cara kru mengajukan
       off dari halaman ini, dan tulisan abu 11px di pojok bukan tempat untuk
       satu-satunya jalan. */
    +'<div class="note i" style="margin-bottom:10px">👆 <b>Klik tanggal mana pun</b> di kalender '
    +'untuk mengajukan <b>off</b>, <b>izin</b>, atau <b>tukar shift</b> pada hari itu — '
    +'atau pakai tombol <b>+ Ajukan Off / Izin</b> di atas.</div>'
    +kal
    +'<div class="rowbar" style="margin:14px 0 0">'+legendaShift()+'<div class="spacer"></div>'
    +'<span class="mutedhint">Kotak berarsir = belum diatur head, bukan libur.</span></div>'
    +'</div>'
    +(menunggu.length
      ? '<div class="panel"><div class="rowbar"><h2>Pengajuan menunggu</h2><div class="spacer"></div>'
        +'<button class="btn btn-ghost btn-sm" onclick="go(&#39;pengajuan&#39;)">Lihat semua</button></div>'
        +menunggu.map(function(x){
            const rentang=(x.dari===x.sampai)?tglPanjang(x.dari):(tglManusia(x.dari)+' – '+tglPanjang(x.sampai));
            return '<div class="row"><div class="who"><b>'+esc(JENIS_AJU[x.jenis]||x.jenis)+'</b>'
              +'<span>'+esc(rentang)+'</span></div>'+pilShiftAju(x)
              +'<span class="stpill st-MENUNGGU">'+esc(LABEL_STATUS_AJU.MENUNGGU)+'</span></div>';
          }).join('')
        +'</div>'
      : '');
}
function durasiJam(m,s){
  const t=x=>{ const p=String(x).split(':'); return (+p[0])*60+(+p[1]); };
  let a=t(m), b=t(s); if(b<=a) b+=1440;      // shift yang melewati tengah malam
  return (b-a)/60;
}
function ajuSaya(){ return (S.pengajuan||[]).filter(a=>a.userId===(ME&&ME.id)); }

/* =====================================================================
   HALAMAN 4 — PENGAJUAN
   Kru mengajukan, head divisinya yang memutuskan. Ini yang membedakan modul
   ini dari lembar Excel: perubahan jadwal punya jejak siapa menyetujui apa.
   ===================================================================== */
function bisaPutuskan(a){
  if(isAdmin()) return true;
  const u=kruById(a.userId);
  if(!u || !ME) return false;
  return isHeadUser(ME.id, divisiDari(u));
}
/* Pil shift pada kartu pengajuan. Kosong untuk pengajuan lama yang memang
   belum punya kolomnya — bukan diganti tebakan. */
function pilShiftAju(a){
  const k = AJU_KE_SHIFT[a.jenis] || a.shift || '';
  if(!k || !S.setting.shifts[k]) return '';
  const d=shiftDef(k);
  /* JAM TURUN KE BARIS SENDIRI, tidak lagi dijejalkan ke dalam pil.
     Kolom Shift dipatok 130px; pil berisi "MIDDLE 16:00–23:00" tidak muat dan
     pecah jadi dua baris DI DALAM latar berwarnanya — tepinya bergerigi,
     tingginya melompat, dan barisnya ikut menjulur. Yang terlihat persis
     seperti CSS yang rusak, padahal isinya yang kelebihan.
     `shiftpil` juga dilarang pecah, supaya nama shift sepanjang apa pun tetap
     satu baris utuh. */
  const jam=(!d.libur && a.jamMulai && a.jamSelesai)
    ? '<div class="kecil mono">'+esc(a.jamMulai+'–'+a.jamSelesai)+'</div>' : '';
  return '<span class="stpill shiftpil" style="background:'+esc(d.w)+';color:'+warnaTeks(d.w)+'">'
    +esc(d.n)+'</span>'+jam;
}
/* Berapa pengajuan yang ditampilkan di daftar utama. Sisanya turun ke panel
   Riwayat yang tertutup. */
const AJU_TAMPIL=20;
let AJU_TAB='antri';      // antri | riwayat | semua
let AJU_HAL=1;
/* Pindah tab SELALU kembali ke halaman 1. Tanpa itu, berpindah dari Riwayat
   halaman 7 ke Antrian yang cuma punya satu halaman memperlihatkan daftar
   kosong — dan yang membacanya menyimpulkan antriannya memang kosong. */
function ajuTab(k){ AJU_TAB=k; AJU_HAL=1; CARI_AJU=''; render(); }
/* Cari nama di halaman Pengajuan — aturannya SAMA PERSIS dengan setCariBulan()
   di lembar bulanan: barisnya disaring (bukan disorot), kotaknya hanya muncul
   kalau memang ada yang perlu dicari, dan fokusnya dikembalikan sesudah render
   karena halaman ini digambar ulang penuh tiap ketukan.

   Kenapa perlu: head Kitchen dengan dua belas kru membaca antrean yang memuat
   pengajuan sebulan penuh, dan pertanyaan yang dibawa orang ke ruangannya
   selalu spesifik — "punya saya sudah diputuskan belum?". Tanpa kotak ini
   jawabannya dicari dengan mata, satu halaman pager demi satu halaman. */
let CARI_AJU='';
function setCariAju(v){ CARI_AJU=v; AJU_HAL=1; render(); sorotCariAju(); }
function sorotCariAju(){
  const i=document.getElementById('cariAju'); if(!i) return;
  i.focus(); try{ i.setSelectionRange(i.value.length,i.value.length); }catch(e){}
}
function ajuHal(n){ AJU_HAL=Math.max(1,n); render(); }
/* Pager sederhana: Sebelumnya / halaman x dari y / Berikutnya. Sengaja BUKAN
   deretan nomor halaman — riwayat pengajuan tidak pernah dicari per nomor
   halaman, dan deretan tombol kecil di layar HP lebih sering salah tekan
   daripada tepat. Yang benar-benar dipakai cuma "mundur satu lagi". */
function ajuPagerHTML(hal,maks,total){
  if(maks<=1) return '';
  return '<div class="rowbar noprint" style="margin-top:10px">'
    +'<button class="btn btn-ghost btn-sm"'+(hal<=1?' disabled':'')
      +' onclick="ajuHal('+(hal-1)+')">‹ Sebelumnya</button>'
    +'<span class="mutedhint">Halaman <b>'+hal+'</b> dari '+maks+' · '+total+' pengajuan</span>'
    +'<div class="spacer"></div>'
    +'<button class="btn btn-ghost btn-sm"'+(hal>=maks?' disabled':'')
      +' onclick="ajuHal('+(hal+1)+')">Berikutnya ›</button></div>';
}
function viewPengajuan(){
  const semua=(S.pengajuan||[]).slice();
  /* Yang MENUNGGU selalu di atas: itu satu-satunya yang menuntut tindakan.
     Sisanya urut terbaru — riwayat cuma untuk dilihat sekali-sekali. */
  const urut=semua.filter(a=>isAdmin() || bisaPutuskan(a) || a.userId===(ME&&ME.id))
    .sort((x,y)=>(x.status==='MENUNGGU'?0:1)-(y.status==='MENUNGGU'?0:1) || (y.dibuatAt||0)-(x.dibuatAt||0));

  /* TIGA TAB, bukan panel Riwayat yang cuma muncul kalau datanya kebetulan
     lebih dari 20.

     Bentuk sebelumnya secara teknis benar tapi tidak bisa ditemukan: pada
     venue yang baru punya satu-dua pengajuan, panel Riwayat maupun pagernya
     TIDAK PERNAH TERGAMBAR — dan yang membuka halaman ini menyimpulkan
     riwayatnya memang tidak ada. Kalau sebuah bagian baru muncul setelah
     datanya banyak, ia tidak pernah dipelajari sebelum dibutuhkan.

     Sekarang ketiga tab SELALU ada beserta angkanya, jadi bentuk halamannya
     tetap sama sejak hari pertama. Sepasang dengan Approval Flow di EMS &
     Marketing — kru yang membuka ketiganya tidak belajar tiga tata letak.

     KETIGANYA BERHALAMAN, termasuk Antrian. Sempat dikecualikan dengan alasan
     "yang menunggu tidak boleh disembunyikan", tapi 60 pengajuan menunggu di
     satu halaman adalah persis keluhan yang membuat paginasi ini diadakan —
     dan yang tenggelam di layar kesepuluh sama tidak terlihatnya dengan yang
     ada di halaman dua.

     Yang menjaga tidak ada pekerjaan hilang bukan "jangan dipotong",
     melainkan ANGKANYA SELALU DISEBUT UTUH di dua tempat yang tidak ikut
     dipotong: tab Antrian membawa jumlah totalnya, dan pita peringatan di
     atas berbunyi "N pengajuan menunggu keputusan Anda" — keduanya dihitung
     dari seluruh antrian, bukan dari halaman yang sedang tampil. */
  const menunggu=urut.filter(a=>a.status==='MENUNGGU');
  const sudah=urut.filter(a=>a.status!=='MENUNGGU');
  if(['riwayat','semua'].indexOf(AJU_TAB)<0) AJU_TAB='antri';
  const qAju=(CARI_AJU||'').trim().toLowerCase();
  const saring=(arr)=>qAju?arr.filter(function(a){
    const u=kruById(a.userId);
    return String((u?u.name:namaKru(a.userId))||'').toLowerCase().indexOf(qAju)>-1;
  }):arr;
  const sumber = AJU_TAB==='riwayat' ? sudah
               : AJU_TAB==='semua'   ? urut
               :                       menunggu;
  /* Halaman dijepit saat menggambar, bukan di ajuHal(): jumlah halaman
     berubah tiap ada keputusan baru, dan nomor yang melewati batas
     memulangkan daftar kosong yang terbaca seperti datanya hilang. */
  const sumberSaring=saring(sumber);
  const maksHal=Math.max(1,Math.ceil(sumberSaring.length/AJU_TAMPIL));
  if(AJU_HAL>maksHal) AJU_HAL=maksHal;
  const mulai=(AJU_HAL-1)*AJU_TAMPIL;
  const list=sumberSaring.slice(mulai,mulai+AJU_TAMPIL);

  /* SATU BARIS TABEL, bukan kartu bertumpuk.
     Bentuk kartu memakan ~110px per pengajuan: empat baris berisi jenis, nama,
     rentang, alasan, jejak keputusan, dan tombol. Dua puluh di antaranya
     berarti menggulir lima layar penuh untuk membaca satu bulan — padahal yang
     dicari hampir selalu satu baris tertentu, dan yang membandingkan (siapa
     paling sering minta off) justru butuh melihat banyak baris sekaligus.

     Sebagai baris tabel, dua puluh pengajuan muat dalam satu layar dan
     kolomnya sejajar, jadi bisa dipindai menurun. Yang hilang cuma jarak
     antar-kartu — tidak ada satu pun keterangan yang dibuang: jenis, nama,
     divisi, rentang, shift, alasan, status, jejak penyetuju, dan tombolnya
     semuanya masih ada, cuma pindah ke kolomnya masing-masing. */
  const barisAju=function(a){
    const u=kruById(a.userId);
    const div=u?divisiDari(u):DIV_NONSHIFT;
    const rentang=(a.dari===a.sampai)?tglManusia(a.dari):(tglManusia(a.dari)+' – '+tglManusia(a.sampai));
    const hari=(a.dari===a.sampai)?'' :('<div class="kecil">'+(selisihHariAju(a))+' hari</div>');
    /* TOMBOL BERLABEL, bukan ✓ dan ✕ telanjang.
       Dua ikon tanpa kata di kolom paling kanan menuntut ditebak — dan yang
       menebak salah di sini MENYETUJUI pengajuan, tindakan yang langsung
       menulis sel jadwal untuk seluruh rentang tanggalnya. Alasannya sama
       persis dengan yang sudah ditulis di modul Daily Worker soal ikon 💬
       ("ikon chat ini apa?"): ikon hanya terbaca oleh yang sudah tahu
       artinya, dan yang sudah tahu tidak butuh tombolnya diperkecil.

       Ikonnya TETAP ada di depan katanya — itu yang membuat baris hijau dan
       merah bisa dibedakan sekilas saat memindai dua puluh baris. */
    const putus=(a.status==='MENUNGGU'&&bisaPutuskan(a))
      ? '<button class="btn btn-ok btn-sm" title="Setujui pengajuan ini"'
        +' onclick="putuskan(\''+escJs(a.id)+'\',\'DISETUJUI\')">✓ Setujui</button>'
        /* Bergaris, bukan terisi — lihat .btn-ghost.bahaya. Di baris yang
           sudah punya tombol Setujui, satu-satunya yang boleh menonjol adalah
           tindakan yang dituju. */
        +'<button class="btn btn-ghost bahaya btn-sm" title="Tolak, dengan alasan yang dibaca kru"'
        +' onclick="putuskan(\''+escJs(a.id)+'\',\'DITOLAK\')">✕ Tolak</button>'
      : '';
    const batal=(a.userId===(ME&&ME.id)&&a.status==='MENUNGGU')
      ? '<button class="btn btn-ghost btn-sm" onclick="batalAju(\''+escJs(a.id)+'\')">Batal</button>' : '';
    /* Jejak keputusan ditulis KECIL DI BAWAH statusnya, bukan di kolom sendiri:
       ia cuma dibaca saat ada yang mempertanyakan, dan satu kolom penuh untuk
       itu mengambil lebar dari kolom Alasan yang jauh lebih sering dibaca. */
    /* Alasan penolakan ikut ditulis di bawah statusnya. Sebelumnya ia tersimpan
       di database tapi tidak pernah tergambar di mana pun — kru yang ditolak
       menanyakannya lewat WhatsApp, dan jawabannya tidak pernah kembali ke
       sistem. Kolom yang diisi tapi tidak pernah dibaca sama saja dengan
       kolom yang tidak ada. */
    const jejak=a.status!=='MENUNGGU'
      ? '<div class="kecil">'+esc(a.putusOleh||'—')+'</div>'
        +(a.putusNota?'<div class="kecil" style="color:var(--danger)">"'+esc(a.putusNota)+'"</div>':'')
      : '';
    return '<tr'+(a.status==='MENUNGGU'?' class="tunggu"':'')+'>'
      +'<td><span class="stpill" style="background:var(--gold-soft);color:var(--gold-dim)">'
        +esc(JENIS_AJU[a.jenis]||a.jenis)+'</span></td>'
      +'<td class="nama">'+esc(u?u.name:namaKru(a.userId))
        +'<div class="kecil">'+esc(namaDivisi(div))+'</div></td>'
      +'<td class="mono">'+esc(rentang)+hari+'</td>'
      +'<td>'+(pilShiftAju(a)||'<span class="kecil">—</span>')+'</td>'
      +'<td class="alasan">'+(a.alasan?esc(a.alasan):'<span class="kecil">—</span>')+'</td>'
      +'<td class="st-kol"><span class="stpill st-'+esc(a.status)+'">'
        +esc(LABEL_STATUS_AJU[a.status]||a.status)+'</span>'+jejak+'</td>'
      +'<td class="aksi-aju">'+(putus+batal||'<span class="kecil">—</span>')+'</td>'
    +'</tr>';
  };
  /* Berapa hari yang diajukan. Inklusif: 4–5 Agustus adalah DUA hari, bukan
     satu — yang membacanya sedang menghitung berapa hari orangnya tidak masuk. */
  const selisihHariAju=function(a){
    let n=0; for(let d=a.dari; d<=a.sampai; d=addD(d,1)) n++;
    return n;
  };
  const kosongTeks = AJU_TAB==='antri'   ? 'Tidak ada pengajuan yang menunggu keputusan.'
                   : AJU_TAB==='riwayat' ? 'Belum ada pengajuan yang diputuskan.'
                   :                       'Belum ada pengajuan sama sekali.';
  /* Tabel dibungkus tablewrap supaya di layar sempit yang bergeser cuma
     tabelnya, bukan seluruh halaman. */
  const kartu=list.length
    ? '<div class="tablewrap"><table class="list tbl-aju"><thead><tr>'
      +'<th>Jenis</th><th>Nama</th><th>Tanggal</th><th>Shift</th>'
      /* Kepala "Aksi" ikut rata kanan. Selama ia rata kiri sementara selnya
         rata kanan, judulnya berdiri di ujung yang berlawanan dari tombol yang
         ia namai — dan di tabel selebar tujuh kolom itu terbaca sebagai kolom
         yang meleset satu. */
      +'<th>Alasan</th><th>Status</th><th class="kanan">Aksi</th></tr></thead><tbody>'
      +list.map(barisAju).join('')
      +'</tbody></table></div>'
    : '<div class="empty"><div class="ic">📭</div>'+kosongTeks+'</div>';
  /* Dihitung dari SELURUH antrian, bukan dari halaman yang sedang tampil:
     pita peringatan "N menunggu keputusan Anda" harus menyebut pekerjaan yang
     ada, bukan pekerjaan yang kebetulan muat di layar ini. */
  const nMenunggu=menunggu.filter(a=>bisaPutuskan(a)).length;
  /* Tab SELALU digambar lengkap dengan angkanya, TERMASUK saat angkanya nol.
     Nol yang tertulis adalah keterangan ("memang belum ada"); tab yang hilang
     adalah teka-teki — dan itulah yang terjadi pada bentuk sebelumnya, waktu
     panel Riwayat baru muncul setelah pengajuannya lebih dari 20. */
  const tab=function(k,l,n){
    return '<button class="'+(AJU_TAB===k?'active':'')+'" onclick="ajuTab(\''+k+'\')">'
      +esc(l)+' <span style="opacity:.6;font-weight:600">'+n+'</span></button>';
  };
  return '<div class="panel">'
    +'<div class="rowbar"><h2>📝 Pengajuan Off, Izin &amp; Tukar Shift</h2><div class="spacer"></div>'
    +'<button class="btn btn-primary btn-sm" onclick="bukaAjukan()">+ Ajukan</button></div>'
    +(nMenunggu?'<div class="note w"><b>'+nMenunggu+' pengajuan</b> menunggu keputusan Anda.</div>':'')
    +'<p class="mutedhint" style="margin-bottom:12px">'
    +(isAdmin()?'Sebagai admin, Anda bisa memutuskan pengajuan semua divisi.'
      :(divisiKuasa().length?'Sebagai head '+esc(divisiKuasa().map(namaDivisi).join(', '))+', Anda memutuskan pengajuan kru divisi itu.'
        :'Pengajuan Anda diputuskan oleh head divisi Anda.'))
    +' Pengajuan <b>Off/Izin/Cuti</b> yang disetujui langsung mengisi sel jadwalnya.</p>'
    +'<div class="rowbar"><div class="seg">'
      +tab('antri','Antrian',menunggu.length)
      +tab('riwayat','Riwayat',sudah.length)
      +tab('semua','Semua',urut.length)
    +'</div><div class="spacer"></div>'
    /* Kotak cari muncul hanya kalau memang ada yang perlu dicari — ambang 8
       sama dengan lembar bulanan. Di bawah itu memindai dengan mata lebih
       cepat daripada mengetik, dan satu baris alat yang tidak pernah dipakai
       cuma mendorong isi halaman ke bawah. */
    +(sumber.length>=8
      ? '<input class="inp noprint" id="cariAju" style="max-width:220px" '
        +'placeholder="🔍 Cari nama kru…" value="'+esc(CARI_AJU)+'" '
