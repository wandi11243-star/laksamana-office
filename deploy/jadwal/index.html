    ;
}
/* `tglAwal` diisi saat dipanggil dari kotak tanggal di kalender Jadwal Saya.
   Kru yang mengklik tanggal 12 sudah menyatakan hari mana yang ia maksud;
   membiarkannya memilih ulang di dalam modal cuma mengundang salah tanggal. */
function bukaAjukan(tglAwal){
  const kuasa=divisiKuasa();
  /* Head boleh mengajukan atas nama kru divisinya — kru dapur sering titip
     lewat WhatsApp, dan memaksanya login sendiri berarti pengajuannya tidak
     pernah masuk sistem. */
  const pool = isAdmin() ? ROSTER.filter(u=>u.active!==false)
             : kuasa.length ? ROSTER.filter(u=>u.active!==false && kuasa.indexOf(divisiDari(u))>-1)
             : (ME&&kruById(ME.id) ? [kruById(ME.id)] : []);
  const opsiKru = pool.length>1
    ? '<div class="field"><label>Kru</label><select id="ajKru">'
      +pool.map(u=>'<option value="'+esc(u.id)+'"'+(u.id===(ME&&ME.id)?' selected':'')+'>'+esc(u.name)+' — '+esc(namaDivisi(divisiDari(u)))+'</option>').join('')
      +'</select></div>'
    : '';
  const hari=(typeof tglAwal==='string' && /^\d{4}-\d{2}-\d{2}$/.test(tglAwal)) ? tglAwal : hariIni();
  /* Shift yang disodorkan = shift orang itu pada hari yang sama minggu lalu
     relatif terhadap tanggal yang sedang diajukan. */
  AJU_SHIFT = shiftKru(pool.length?pool[0].id:(ME&&ME.id), hari);
  document.getElementById('modalRoot').innerHTML=
    '<div class="overlay" onclick="if(event.target===this)tutupModal()"><div class="modal">'
    +'<div class="mh"><h3>Ajukan Perubahan Jadwal</h3><button class="xbtn" onclick="tutupModal()">×</button></div>'
    +'<div class="mb">'+opsiKru
    +'<div class="field"><label>Jenis</label><select id="ajJenis" onchange="gambarShiftAju()">'
    +Object.keys(JENIS_AJU).map(k=>'<option value="'+k+'">'+esc(JENIS_AJU[k])+'</option>').join('')+'</select></div>'
    +'<div class="timerow"><div class="field"><label>Dari Tanggal</label><input id="ajDari" type="date" value="'+hari+'"></div>'
    +'<div class="field"><label>Sampai Tanggal</label><input id="ajSampai" type="date" value="'+hari+'"></div></div>'
    +'<div id="ajShiftBox"></div>'
    +'<div class="field"><label>Alasan / Keterangan</label>'
    +'<textarea id="ajAlasan" rows="3" placeholder="Contoh: ada urusan keluarga, sudah dibicarakan dengan Yuza"></textarea></div>'
    +'<p class="mutedhint">Pengajuan masuk ke head divisi untuk disetujui. Begitu disetujui, jadwalnya <b>langsung terisi</b> sesuai shift yang dipilih di atas — head tidak perlu mengetik ulang.</p>'
    +'</div><div class="mf"><button class="btn btn-ghost" onclick="tutupModal()">Batal</button>'
    +'<button class="btn btn-primary" id="ajKirim" onclick="kirimAju()">Kirim Pengajuan</button></div></div></div>';
  gambarShiftAju();
}
/* Shift yang diminta, dipilih dari tombol — bukan diketik di dalam kalimat
   alasan.

   Dulu satu-satunya tempat menuliskan "Kamis jadi PAGI" adalah kotak alasan,
   dan itu memindahkan pekerjaan ke tempat yang salah: head menekan Setujui,
   menganggap urusannya selesai, lalu sel jadwalnya tidak pernah berubah
   karena tidak ada yang bisa disimpulkan mesin dari prosa. Pengajuan
   berstatus DISETUJUI dengan jadwal yang masih shift lama adalah kesalahan
   paling mahal di modul ini — kru merasa sudah beres, absensi berkata lain.

   Sekarang bentuknya eksplisit, jadi TUKAR dan UBAH ikut bisa mengisi sel
   otomatis seperti OFF/IZIN/CUTI. */
let AJU_SHIFT='';
function gambarShiftAju(){
  const box=document.getElementById('ajShiftBox'); if(!box) return;
  const el=document.getElementById('ajJenis');
  const jenis=el?el.value:'OFF';
  const tetap=AJU_KE_SHIFT[jenis];

  /* OFF/IZIN/CUTI shift-nya sudah pasti dari jenisnya sendiri. Menyodorkan
     pemilih di situ cuma mengundang kombinasi yang tidak masuk akal
     ("Izin, tapi shift SIANG"). Yang ditampilkan cukup keterangan. */
  if(tetap){
    const d=shiftDef(tetap);
    box.innerHTML='<div class="note i" style="display:flex;align-items:center;gap:8px">'
      +'<span class="stpill" style="background:'+esc(d.w)+';color:'+warnaTeks(d.w)+'">'+esc(d.n)+'</span>'
      +'<span>Sel jadwal pada tanggal itu akan diisi <b>'+esc(d.n)+'</b> begitu disetujui.</span></div>';
    return;
  }
  if(!AJU_SHIFT || !S.setting.shifts[AJU_SHIFT]){
    const el2=document.getElementById("ajDari");
    AJU_SHIFT=shiftKru(ME&&ME.id, el2?el2.value:"");
  }
  const d=shiftDef(AJU_SHIFT);
  box.innerHTML='<div class="field"><label>Shift yang diminta</label>'
    +'<div class="pick">'+daftarShift().filter(k=>!shiftDef(k).libur).map(function(k){
        const sd=shiftDef(k);
        return '<button type="button" class="'+(k===AJU_SHIFT?'sel':'')+'" style="background:'+esc(sd.w)+';color:'+warnaTeks(sd.w)+'" '
          +'onclick="pilihShiftAju(&#39;'+escJs(k)+'&#39;)">'+esc(sd.n)+'<small>'+esc(sd.m+'–'+sd.s)+'</small></button>';
      }).join('')+'</div></div>'
    /* Jam khusus hanya untuk UBAH — itu memang seluruh isi jenis tersebut.
       Untuk TUKAR, jam ikut shift tujuannya dan kotak tambahan cuma satu
       tempat lagi yang bisa diisi tidak konsisten. */
    +(jenis==='UBAH'
      ? '<div class="timerow"><div class="field"><label>Jam mulai</label>'
        +'<input id="ajJamM" type="time" value="'+esc(d.m)+'"></div>'
        +'<div class="field"><label>Jam selesai</label>'
        +'<input id="ajJamS" type="time" value="'+esc(d.s)+'"></div></div>'
        +'<p class="mutedhint" style="margin-top:-6px">Kosongkan kalau jamnya ikut bawaan shift di atas.</p>'
      : '');
}
function pilihShiftAju(k){ AJU_SHIFT=k; gambarShiftAju(); }
async function kirimAju(){
  /* TOMBOLNYA DIKUNCI SELAMA KIRIMAN BERJALAN.
     `row.id` dibuat DI LAYAR dan berbeda tiap pemanggilan, jadi klik kedua
     saat yang pertama masih menunggu jawaban melahirkan PENGAJUAN KEDUA yang
     identik — bukan menimpa yang pertama. Head lalu melihat dua permintaan
     cuti untuk orang dan tanggal yang sama, dan yang menyetujui keduanya
     menulis sel jadwalnya dua kali.

     Di jaringan venue jeda satu-dua detik itu biasa, dan layar tidak berubah
     apa pun selama menunggu — jadi menekan ulang adalah reaksi yang wajar,
     bukan kecerobohan. */
  const el=id=>document.getElementById(id);
  const uid=el('ajKru')?el('ajKru').value:(ME&&ME.id);
  const jenis=el('ajJenis').value;
  let dari=el('ajDari').value, sampai=el('ajSampai').value||dari;
  const alasan=el('ajAlasan').value.trim();
  if(!uid){ toast('Kru belum dipilih', true); return; }
  if(!dari){ toast('Tanggal belum diisi', true); return; }
  if(sampai<dari){ const t=dari; dari=sampai; sampai=t; }
  if(!alasan){ toast('Isi alasannya dulu', true); return; }
  /* Shift ikut dikirim SEBELUM modal ditutup — sesudahnya elemennya sudah
     tidak ada dan nilainya hilang tanpa jejak. */
  const tetap=AJU_KE_SHIFT[jenis];
  const shift=tetap||AJU_SHIFT||'';
  const jamM=(!tetap&&el('ajJamM'))?el('ajJamM').value:'';
  const jamS=(!tetap&&el('ajJamS'))?el('ajJamS').value:'';
  if(!shift){ toast('Pilih shift yang diminta dulu', true); return; }

  /* TOMBOL DIKUNCI DI SINI — SESUDAH seluruh validasi, tepat sebelum kiriman
     berangkat. Kalau dikunci di awal, tiap galat validasi meninggalkan tombol
     "Mengirim…" yang mati padahal tidak ada yang sedang dikirim, dan orangnya
     terjebak di formulir yang kelihatan menggantung.

     Yang dijaga: `row.id` dibuat DI LAYAR dan berbeda tiap pemanggilan, jadi
     klik kedua saat yang pertama masih menunggu jawaban melahirkan PENGAJUAN
     KEDUA yang identik — bukan menimpa yang pertama. Head lalu melihat dua
     permintaan cuti untuk orang dan tanggal yang sama. Di jaringan venue jeda
     satu-dua detik itu biasa, dan layar tidak berubah apa pun selama menunggu,
     jadi menekan ulang adalah reaksi yang wajar. */
  const btnKirim=document.getElementById('ajKirim');
  if(btnKirim){
    if(btnKirim.disabled) return;
    btnKirim.disabled=true; btnKirim.textContent='Mengirim…';
  }
  tutupModal();
  const row={id:'A'+Date.now().toString(36)+Math.floor(Math.random()*900+100), userId:uid, jenis, dari, sampai, alasan,
             shift, jamMulai:jamM, jamSelesai:jamS};
  try{
    await apiPost({action:'simpanPengajuan', row});
    S.pengajuan.unshift(Object.assign({status:'MENUNGGU', dibuatAt:Date.now(), dibuatOleh:(ME&&ME.name)||'', putusOleh:'', putusAt:0}, row));
    simpanCache(); render(); toast('Pengajuan terkirim ke head divisi');
  }catch(e){
    /* Modal sudah tertutup, jadi tombolnya ikut hilang — tidak ada yang perlu
       dibebaskan. Yang penting galatnya sampai, dan isian tidak hilang karena
       pengajuannya bisa diulang dari awal dengan data yang masih sama. */
    toast('Gagal mengirim: '+e.message, true);
  }
}
/* Menyetujui Off/Izin/Cuti langsung menulis selnya. Head yang baru saja
   menekan Setujui menganggap urusannya selesai — kalau jadwalnya tidak ikut
   berubah, kru tetap tercatat masuk dan itu baru ketahuan saat absensi. */
/* Satu ketukan di sini MENULIS SEL JADWAL untuk seluruh rentang tanggalnya —
   dan yang tertimpa adalah shift yang sudah disusun head sendiri minggu lalu.
   Karena itu keduanya ditanya dulu, dengan kalimat yang menyebut akibatnya
   secara spesifik: berapa hari, shift apa yang akan tertulis, dan tanggal
   berapa saja. Konfirmasi yang cuma bertanya "yakin?" tidak menambah apa pun;
   yang menambah adalah menyebutkan apa yang akan berubah.

   Penolakan MEMINTA ALASAN, tidak lagi mengirim nota kosong. Kru yang
   pengajuannya ditolak tanpa sebab akan menanyakannya lewat WhatsApp, dan
   jawabannya tidak pernah kembali ke sistem — persis alasan modul Daily
   Worker sudah meminta alasan sejak awal (lihat tolakAjuan di sana). */
function putuskan(id,status){
  const a=(S.pengajuan||[]).find(x=>x.id===id); if(!a) return;
  if(!bisaPutuskan(a)){ toast('Pengajuan ini bukan wewenang Anda', true); return; }
  const u=kruById(a.userId);
  const nama=u?u.name:namaKru(a.userId);
  const rentang=(a.dari===a.sampai)?tglPanjang(a.dari):(tglPanjang(a.dari)+' – '+tglPanjang(a.sampai));
  let n=0; for(let d=a.dari; d<=a.sampai; d=addD(d,1)) n++;

  if(status==='DITOLAK'){
    tanyaAlasanTolak(nama, function(nota){ kirimPutusan(id,'DITOLAK',nota); });
    return;
  }
  const tShift = AJU_KE_SHIFT[a.jenis] || (a.shift && S.setting.shifts[a.shift] ? a.shift : '');
  const efek = tShift
    ? 'Sel jadwalnya langsung terisi <b>'+esc(shiftDef(tShift).n)+'</b> untuk <b>'+n
      +' hari</b> — menimpa shift yang sekarang ada di sana.'
    : 'Pengajuan ini tidak menyebut shift yang diminta, jadi <b>sel jadwalnya tidak ikut berubah</b>. '
      +'Isi sendiri di lembar setelah ini.';
  konfirmasi('Setujui '+JENIS_AJU[a.jenis]+' — '+nama+'?',
    '<b>'+esc(rentang)+'</b><br>'+efek
    +(a.alasan?'<br><br><i>"'+esc(a.alasan)+'"</i>':''),
    function(){ kirimPutusan(id,'DISETUJUI',''); },
    { ya:'Ya, setujui', lebar:'430px' });
}
/* Kotak alasan penolakan. Sengaja BUKAN prompt() peramban: yang itu tidak bisa
   diberi keterangan, tidak bisa diberi contoh, dan di sebagian peramban HP
   muncul sebagai kotak abu-abu tanpa judul yang tidak jelas milik halaman apa. */
function tanyaAlasanTolak(nama, cb){
  window.TOLAK_CB=function(){
    const el=document.getElementById('tolakNota');
    const v=el?String(el.value||'').trim():'';
    tutupModal();
    cb(v||'Tidak disetujui head divisi');
  };
  document.getElementById('modalRoot').innerHTML=
    '<div class="overlay" onclick="if(event.target===this)tutupModal()"><div class="modal" style="max-width:430px">'
    +'<div class="mh"><h3>Tolak pengajuan '+esc(nama)+'</h3>'
    +'<button class="xbtn" onclick="tutupModal()">×</button></div>'
    +'<div class="mb"><div class="field"><label>Alasan penolakan</label>'
    +'<textarea id="tolakNota" rows="3" placeholder="Mis. hari itu sudah dua orang off di Cashier"></textarea>'
    +'<div class="hint">Dibaca kru yang mengajukan. Kosongkan kalau memang tidak perlu — '
    +'akan tertulis "Tidak disetujui head divisi".</div></div></div>'
    +'<div class="mf"><button class="btn btn-ghost" onclick="tutupModal()">Batal</button>'
    +'<button class="btn btn-danger" onclick="TOLAK_CB()">Tolak pengajuan</button></div></div></div>';
  setTimeout(function(){ const el=document.getElementById('tolakNota'); if(el) el.focus(); },50);
}
async function kirimPutusan(id,status,nota){
  const a=(S.pengajuan||[]).find(x=>x.id===id); if(!a) return;
  try{
    await apiPost({action:'putusPengajuan', id, status, nota:nota||''});
    a.putusNota=nota||'';
    a.status=status; a.putusOleh=(ME&&ME.name)||''; a.putusAt=Date.now();
    /* Shift tujuan: OFF/IZIN/CUTI disimpulkan dari jenisnya, TUKAR/UBAH
       dibaca dari yang DIPILIH kru saat mengajukan. Sebelum kolom `shift`
       ada, dua jenis terakhir sengaja tidak pernah mengisi sel — tidak ada
       satu shift pun yang bisa disimpulkan dari kalimat alasan. Sekarang
       bisa, jadi head tidak perlu mengetik ulang apa yang baru saja ia
       setujui: langkah itulah yang paling sering terlewat, dan hasilnya
       pengajuan DISETUJUI dengan jadwal yang masih shift lama.

       Pengajuan LAMA (dikirim sebelum ada kolom ini) tidak punya `shift`,
       jadi TUKAR/UBAH-nya tetap berperilaku seperti dulu — disetujui tanpa
       menyentuh sel. Menebak shift untuknya jauh lebih berbahaya daripada
       membiarkan head mengisinya sendiri. */
    const tShift = AJU_KE_SHIFT[a.jenis] || (a.shift && S.setting.shifts[a.shift] ? a.shift : '');
    if(status==='DISETUJUI' && tShift){
      const libur=shiftDef(tShift).libur;
      const rows=[];
      for(let d=a.dari; d<=a.sampai; d=addD(d,1)){
        rows.push({u:a.userId, d, t:tShift,
          m:libur?'':(a.jamMulai||''), s:libur?'':(a.jamSelesai||''), n:''});
      }
      await tulisSel(rows,[]);
      toast('Disetujui — '+rows.length+' hari diisi '+shiftDef(tShift).n);
    }else{
      simpanCache(); render();
      toast(status==='DISETUJUI'?'Pengajuan disetujui':'Pengajuan ditolak');
    }
  }catch(e){ toast('Gagal menyimpan putusan: '+e.message, true); }
}
async function batalAju(id){
  try{
    await apiPost({action:'hapusPengajuan', id});
    S.pengajuan=(S.pengajuan||[]).filter(x=>x.id!==id);
    simpanCache(); render(); toast('Pengajuan dibatalkan');
  }catch(e){ toast('Gagal membatalkan: '+e.message, true); }
}

/* =====================================================================
   HALAMAN 5 — PENGATURAN (admin modul)

function viewPengaturan(){
  if(!isAdmin()){
    return '<div class="panel"><div class="empty"><div class="ic">🔒</div>Halaman ini hanya untuk admin modul Jadwal.'
      +'<div class="mutedhint" style="margin-top:6px">Admin modul ditetapkan di <b>Kelola Akses</b> milik Laksamana Office.</div></div></div>';
  }
  const barisShift=daftarShift().map(k=>{
    const d=shiftDef(k);
    return '<div class="row">'
      +'<span class="stpill" style="background:'+esc(d.w)+';color:'+warnaTeks(d.w)+';min-width:74px;text-align:center">'+esc(d.n)+'</span>'
      +'<input class="inp" style="flex:1;min-width:110px" value="'+esc(d.n)+'" onchange="ubahShift(\''+escJs(k)+'\',\'n\',this.value)" title="Nama yang tampil di sel">'
      +'<input class="inp" type="time" value="'+esc(d.m)+'" onchange="ubahShift(\''+escJs(k)+'\',\'m\',this.value)"'+(d.libur?' disabled':'')+'>'
      +'<input class="inp" type="time" value="'+esc(d.s)+'" onchange="ubahShift(\''+escJs(k)+'\',\'s\',this.value)"'+(d.libur?' disabled':'')+'>'
      +'<input type="color" value="'+esc(d.w)+'" onchange="ubahShift(\''+escJs(k)+'\',\'w\',this.value)" style="width:44px;height:36px;border:1.5px solid var(--line);border-radius:8px;padding:2px;background:var(--surface)">'
      +'<label style="font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px">'
      +'<input type="checkbox"'+(d.libur?' checked':'')+' onchange="ubahShift(\''+escJs(k)+'\',\'libur\',this.checked?1:0)" style="width:auto"> tidak masuk</label>'
      /* Hapus hanya untuk shift BUATAN SENDIRI. Yang bawaan (PAGI, OFF, CUTI…)
      sengaja tidak bisa dihapus: kodenya sudah tertulis di sel jadwal yang
      ada dan di pengajuan lama, dan menghapus definisinya membuat sel-sel itu
      digambar abu-abu tanpa nama — kehilangan arti, tanpa satu pun galat. */
      +(SHIFT_BAWAAN[k]?'':'<button class="btn btn-ghost btn-sm" title="Hapus shift ini" onclick="hapusShift(&#39;'+escJs(k)+'&#39;)">🗑</button>')
      +'</div>';
  }).join('');

  const semuaDiv=DIVISI.map(d=>d.k);
  const barisHead=semuaDiv.map(k=>{
    const anggota=kruDivisi(k);
    const heads=(S.setting.heads[k]||[]);
    const pil=anggota.map(u=>'<label style="display:inline-flex;align-items:center;gap:5px;margin:0 10px 6px 0;font-size:12.5px">'
      +'<input type="checkbox"'+(heads.indexOf(u.id)>-1?' checked':'')+' onchange="ubahHead(\''+escJs(k)+'\',\''+escJs(u.id)+'\',this.checked)" style="width:auto">'
      +esc(u.name)+'</label>').join('');
    return '<div class="row" style="flex-direction:column;align-items:stretch">'
      +'<div style="display:flex;align-items:center;gap:8px"><b>'+esc(namaDivisi(k))+'</b>'
      +'<span style="font-size:11px;color:var(--muted-2)">'+anggota.length+' kru</span>'
      +'<div class="spacer"></div>'
      +'<span class="stpill" style="background:'+(heads.length?'var(--ok-bg);color:var(--ok)':'var(--warn-bg);color:var(--warn)')+'">'
      +(heads.length?heads.length+' head':'belum ada head')+'</span></div>'
      +'<div style="margin-top:8px">'+(pil||'<span class="mutedhint">Belum ada kru di divisi ini.</span>')+'</div></div>';
  }).join('');

  /* Akses Rekap Pegawai dulu punya panel sendiri berisi deretan centang nama.
     Dipindah ke baris tiap pegawai di Penempatan Kru: di panel terpisah, satu
     orang muncul DUA KALI di halaman yang sama — sekali untuk divisinya,
     sekali untuk aksesnya — dan admin harus mencarinya dua kali untuk satu
     orang yang sama. Sekarang semua yang bisa diatur tentang seseorang ada di
     satu baris. */
  const mnj=(S.setting.manajemen||[]);

  const kruAktif=ROSTER.filter(u=>u.active!==false)
    .sort((a,b)=>String(a.name).localeCompare(String(b.name)));
  /* Yang disembunyikan dihitung DULU dan jumlahnya disebut di layar. Daftar
     yang diam-diam menyusut membuat admin mengira akun orangnya hilang dari
     Office, lalu mencarinya di tempat yang salah. */
  const kantor=kruAktif.filter(u=>stafKantor(u) && !S.setting.divOverride[u.id]);
  const notaKantor = kantor.length
    ? '<p class="mutedhint" style="margin-bottom:12px"><b>'+kantor.length+' akun staf kantor</b> '
      +'(kolom Tim-nya di Office menyebut Office/Kantor) '
      +(TAMPIL_KANTOR?'sedang ikut ditampilkan':'tidak ditampilkan di daftar ini')

  const barisKru=(TAMPIL_KANTOR?kruAktif:kruAktif.filter(u=>kantor.indexOf(u)<0))

        +DIVISI.concat([{k:DIV_NONSHIFT,n:'Tidak dijadwalkan'}])

        /* Kotak "Jabatan di lembar" dihapus 5 Agustus 2026 atas permintaan.
           Jabatan sekarang SELALU ikut kolom keterangan di Office — satu

           `S.setting.jabatan` yang lama tetap dibaca jabatanDari(), jadi
           penyesuaian yang terlanjur diisi tidak hilang begitu saja. */
        +'<span class="chip"'+(d===DIV_NONSHIFT?' style="opacity:.6"':'')+'>'+esc(namaDivisi(d))+'</span>'
        
        /* Shift kebiasaan orang ini. Hanya berarti untuk kru yang memang

        +(d===DIV_NONSHIFT ? '' :
          '<select class="inp" style="width:134px" title="Shift kebiasaan" onchange="ubahShiftKru(&#39;'+escJs(u.id)+'&#39;,this.value)">'
          +'<option value="">Cadangan: '+esc(shiftDef(shiftKru(u.id)).n)+'</option>'

            }).join('')
          +'</select>')

        /* Akses Rekap Pegawai, per orang, di baris orangnya sendiri.

           Head divisi dan admin modul TIDAK perlu dicentang — keduanya sudah
           otomatis berhak (lihat bolehRekap()), dan menampilkan centang yang
           tidak berpengaruh apa-apa untuk mereka cuma mengundang admin
           mengira aksesnya dicabut saat kotaknya kosong. Karena itu untuk

        +(function(){

            if(otomatis){
              return '<span class="stpill" style="background:var(--ok-bg);color:var(--ok)" '

              +' onchange="ubahManajemen(&#39;'+escJs(u.id)+'&#39;,this.checked)" style="width:auto;margin:0">'
              +'📈 Rekap</label>';
          })()
        +'</div>';
    }).join('');

  return '<div class="panel"><div class="rowbar"><h2>⚙️ Definisi Shift</h2><div class="spacer"></div>'
    +'<button class="btn btn-primary btn-sm" onclick="tambahShift()">+ Tambah Shift</button></div>'
    +'<p class="mutedhint" style="margin-bottom:12px">Nama, jam bawaan, dan warna tiap shift. Mengubah jam di sini berlaku untuk sel yang <b>belum</b> punya jam khusus — sel yang jamnya sudah ditimpa per orang tidak ikut berubah.</p>'
    +barisShift
    +'<p class="mutedhint" style="margin-top:10px">Shift buatan sendiri bisa dihapus lewat 🗑. Shift bawaan (PAGI, MIDDLE, SPLIT, SIANG, OFF, IZIN, CUTI, LAIN) sengaja tidak — kodenya sudah tertulis di sel jadwal dan pengajuan lama, dan menghapus definisinya membuat sel-sel itu kehilangan nama tanpa satu pun galat.</p>'
    +'</div>'

    /* Panel "Batas Beban Kerja" dihapus 5 Agustus 2026 atas permintaan.
       Peringatannya SENDIRI tetap jalan (panel Beban Kerja di Jadwal Bulanan
       dan alarm di Rekap Pegawai) — yang hilang cuma layar untuk menyetelnya,
       jadi keduanya memakai angka bawaan: 6 hari beruntun, jeda 10 jam.
       Kalau suatu saat perlu disetel lagi, `S.setting.maksBeruntun` dan
       `S.setting.jedaMin` masih dibaca di semua tempat pemakainya. */
    +'<div class="panel"><div class="rowbar"><h2>👑 Head Divisi</h2></div>'
    +'<p class="mutedhint" style="margin-bottom:12px">Head menyusun jadwal divisinya dan memutuskan pengajuan kru divisinya. Sengaja ditunjuk manual, bukan ditebak dari jabatan: salah tebak berarti tombol Setujui dipegang orang yang salah. Boleh lebih dari satu per divisi.</p>'
    +barisHead+'</div>'

    /* Tombol "Tarik Ulang dari Office" dihapus 5 Agustus 2026 atas permintaan.
       Roster memang sudah ditarik sendiri tiap kali modul dibuka, jadi
       tombolnya hanya berguna pada satu keadaan sempit — dan untuk keadaan itu
       sudah ada tombol "Coba lagi" di panelKosongRoster() yang muncul persis
       saat roster gagal diambil. ulangRoster() tetap ada karena panel itu

    +'<div class="panel"><div class="rowbar"><h2>👥 Penempatan Kru</h2></div>'
    +'<p class="mutedhint" style="margin-bottom:12px">Divisi diambil dari kolom <b>Tim</b> di Laksamana Office. Ubah di sini hanya kalau kru itu memang dijadwalkan di divisi lain — dan lebih baik perbaiki di Office supaya modul lain ikut benar. Jabatan yang tampil di lembar bulanan (mis. <i>S. BAR</i>, <i>BARISTA</i>) selalu mengikuti kolom keterangan di Office.</p>'
    +'<p class="mutedhint" style="margin-bottom:12px">Centang <b>📈 Rekap</b> untuk memberi orang itu akses ke halaman <b>Rekap Pegawai</b> (jam kerja, pola libur, dan peringatan beban kerja seluruh kru). <b>Head divisi dan admin modul otomatis berhak</b> — barisnya bertanda <i>otomatis</i> dan tidak perlu dicentang. Kru biasa sengaja tidak bisa membukanya: jadwalnya sendiri memang terbuka di Jadwal Bulanan, yang ditahan adalah rekap dan angkanya, karena itu bahan perbandingan antar kru yang ujungnya jadi keributan di grup.</p>'
    +'<p class="mutedhint" style="margin-bottom:12px">Kolom <b>shift kebiasaan</b> tiap kru dipakai sebagai <b>cadangan saja</b>. Shift bawaan yang sesungguhnya diambil dari <b>hari yang sama minggu lalu</b>: sel kosong yang diklik terbuka di shift itu, dan tombol <b>Isi Sel Kosong &rarr; Ikut minggu lalu</b> menyalin pola satu minggu penuh berikut OFF-nya. Kolom di bawah baru dipakai untuk kru yang <b>belum punya riwayat</b> minggu lalu — mis. yang baru masuk.</p>'
    +'<p class="mutedhint" style="margin-bottom:12px">Hanya kolom Tim yang menyebut <b>Bar</b>, <b>Kitchen</b>, <b>Floor</b>, atau <b>Cashier</b> yang masuk lembar jadwal. Selebihnya — staf kantor maupun kru yang kolom Tim-nya masih kosong — ditandai <b>Tidak dijadwalkan</b> dan tidak muncul di lembar mana pun. Yang kolom Tim-nya masih <b>kosong</b> tetap ditampilkan di sini — <b>halaman ini satu-satunya tempat mereka kelihatan</b>, jadi kalau ada kru yang hilang dari jadwalnya, di sinilah dicari dan ditempatkan. Yang kolom Tim-nya sudah jelas <b>Office/Kantor</b> disembunyikan, karena mereka memang tidak pernah dijadwalkan.</p>'
    +notaKantor+panelKosongRoster()+(barisKru||'<div class="empty">Roster kosong.</div>')+'</div>'

    /* Mulai dari nol. Sengaja diletakkan PALING BAWAH dan di panel sendiri:
       tombol yang menghapus jadwal seluruh perusahaan tidak boleh berdiri
       sebaris dengan tombol yang dipakai sehari-hari. */
    +'<div class="panel"><div class="rowbar"><h2>&#129529; Mulai Dari Nol</h2></div>'
    +'<p class="mutedhint" style="margin-bottom:12px">Menghapus <b>seluruh sel jadwal</b> (semua bulan, semua divisi) dan <b>seluruh pengajuan</b> di server, supaya modul bisa disusun ulang dari kosong. <b>Definisi shift, head divisi, penempatan kru, dan akses rekap TIDAK ikut terhapus</b> &mdash; semua yang sudah diatur di halaman ini tetap berlaku.</p>'
    +'<p class="mutedhint" style="margin-bottom:12px">Tidak ada pembatalan. Jadwal yang terhapus tidak bisa dikembalikan dari layar mana pun, termasuk oleh admin.</p>'
    +'<button class="btn btn-danger btn-sm" onclick="bukaKosongkan()">Kosongkan Semua Data Jadwal</button>'
    +'</div>';
}
/* Dua lapis penjaga, dan keduanya memang perlu: kata kunci yang harus
   DIKETIK (bukan sekadar tombol "Ya" yang sudah jadi refleks) di layar, dan
   kata kunci yang sama diperiksa ulang di server -- supaya panggilan API yang
   nyasar tanpa lewat layar ini tidak bisa menghapus apa pun. */
const KOSONG_SANDI = 'HAPUS SEMUA';
function bukaKosongkan(){
  if(!isAdmin()) return toast('Hanya admin modul yang bisa mengosongkan data', true);
  window.KOSONG_CB=function(){
    const el=document.getElementById('kosongKode');
    const v=String(el?el.value:'').trim().toUpperCase();
    if(v!==KOSONG_SANDI){ toast('Ketik '+KOSONG_SANDI+' persis untuk melanjutkan', true); return; }
    tutupModal(); kosongkanSemua();
  };
  /* TIDAK menyebut angka "sekian sel akan dihapus". S.sel hanya memuat
     rentang yang sedang dimuat di layar, jadi angka apa pun di sini pasti
     lebih kecil dari yang sebenarnya terhapus -- dan angka yang meremehkan
     akibatnya justru membuat orang menekan lanjut. Jumlah sesungguhnya
     dilaporkan server sesudahnya. */
  document.getElementById('modalRoot').innerHTML=
    '<div class="overlay" onclick="if(event.target===this)tutupModal()"><div class="modal" style="max-width:430px">'
    +'<div class="mh"><h3>Kosongkan semua data jadwal?</h3><button class="xbtn" onclick="tutupModal()">&times;</button></div>'
    +'<div class="mb"><p style="color:var(--muted);font-size:13.5px">Seluruh <b>sel jadwal</b> dan <b>pengajuan</b> di semua bulan dan semua divisi akan dihapus dari server. '
    +'Definisi shift, head divisi, dan penempatan kru tetap.</p>'
    +'<p style="color:var(--muted);font-size:13.5px">Tindakan ini <b>tidak bisa dibatalkan</b>.</p>'
    +'<div class="field"><label>Ketik <b>'+KOSONG_SANDI+'</b> untuk melanjutkan</label>'
    +'<input id="kosongKode" class="inp" style="width:100%" autocomplete="off" placeholder="'+KOSONG_SANDI+'">'
    +'</div></div>'
    +'<div class="mf"><button class="btn btn-ghost" onclick="tutupModal()">Batal</button>'
    +'<button class="btn btn-danger" onclick="KOSONG_CB()">Kosongkan</button></div></div></div>';
  setTimeout(function(){ const el=document.getElementById('kosongKode'); if(el) el.focus(); },50);
}
async function kosongkanSemua(){
  try{
    const d=await apiPost({action:'kosongkanSemua', konfirmasi:KOSONG_SANDI});
    /* Cache lokal ikut dikosongkan di sini juga. Kalau hanya server yang
       bersih, tab yang sedang terbuka menggambar ulang dari cache dan
       jadwalnya terlihat masih utuh -- lalu sel-sel "lama" itu ikut terkirim
       lagi begitu ada satu sel disunting. */
    S.sel={}; S.pengajuan=[]; RANGE=null; simpanCache();
    toast('Terhapus: '+((d&&d.sel)||0)+' sel jadwal, '+((d&&d.pengajuan)||0)+' pengajuan');
    muatDanGambar();
  }catch(e){ toast('Gagal mengosongkan: '+e.message, true); }
}
function toggleKantor(){ TAMPIL_KANTOR=!TAMPIL_KANTOR; render(); }
/* Shift baru — mis. "MALAM" atau "EVENT" yang cuma dipakai satu outlet.
   Kodenya diturunkan dari NAMANYA (huruf kapital, tanpa spasi) supaya yang
   tertulis di sel jadwal tetap terbaca manusia saat datanya diperiksa langsung
   di database, bukan deretan id acak. Kalau kodenya sudah dipakai, angka
   ditambahkan di belakang — menimpanya berarti mengubah arti SELURUH sel yang
   sudah memakai kode itu, dan tidak ada satu pun layar yang akan menyebutkan
   itu terjadi. */
function tambahShift(){
  if(!isAdmin()) return toast('Hanya admin modul yang bisa menambah shift', true);
  tanyaNamaShift(function(nama){
    nama=String(nama||'').trim();
    if(!nama) return;
    let k=nama.toUpperCase().replace(/[^A-Z0-9]+/g,'').slice(0,12);
    if(!k) k='SHIFT';
    if(S.setting.shifts[k]){
      let n=2; while(S.setting.shifts[k+n]) n++;
      k=k+n;
    }
    /* `urut` menentukan letaknya di legenda dan di daftar pilihan sel. Yang
       baru ditaruh SESUDAH seluruh shift kerja tapi SEBELUM shift libur (OFF
       urut 50), karena shift tambahan di sini praktis selalu shift kerja.
       Bisa digeser sendiri kalau ternyata bukan. */
    S.setting.shifts[k]={n:nama.toUpperCase().slice(0,12), m:'16:00', s:'23:00',
                         w:'#7C6BD6', libur:0, urut:45};
    simpanSetting(); render();
    toast('Shift '+k+' ditambahkan — atur jam & warnanya di baris barunya');
  });
}
function tanyaNamaShift(cb){
  window.SHIFT_CB=function(){
    const el=document.getElementById('nmShift');
    const v=el?el.value:'';
    tutupModal(); cb(v);
  };
  document.getElementById('modalRoot').innerHTML=
    '<div class="overlay" onclick="if(event.target===this)tutupModal()"><div class="modal" style="max-width:390px">'
    +'<div class="mh"><h3>Tambah Shift</h3><button class="xbtn" onclick="tutupModal()">&times;</button></div>'
    +'<div class="mb"><div class="field"><label>Nama shift</label>'
    +'<input id="nmShift" class="inp" style="width:100%" maxlength="12" placeholder="Mis. MALAM">'
    +'<div class="hint">Inilah yang tampil di sel jadwal. Jam dan warnanya diatur di baris barunya setelah ini.</div></div></div>'
    +'<div class="mf"><button class="btn btn-ghost" onclick="tutupModal()">Batal</button>'
    +'<button class="btn btn-primary" onclick="SHIFT_CB()">Tambahkan</button></div></div></div>';
  setTimeout(function(){ const el=document.getElementById('nmShift'); if(el) el.focus(); },50);
}
function hapusShift(k){
  if(!isAdmin()) return toast('Hanya admin modul yang bisa menghapus shift', true);
  if(SHIFT_BAWAAN[k]) return toast('Shift bawaan tidak bisa dihapus', true);
  /* Berapa sel yang MEMAKAINYA dihitung dulu dan disebut di pertanyaannya.
     "Yakin hapus?" tidak menambah apa pun; "17 sel memakai shift ini dan akan
     kehilangan namanya" yang membuat orang berhenti dan berpikir. */
  const pakai=Object.keys(S.sel||{}).filter(x=>S.sel[x] && S.sel[x].t===k).length;
  konfirmasi('Hapus shift '+shiftDef(k).n+'?',
    pakai
      ? '<b>'+pakai+' sel jadwal</b> masih memakainya. Selnya TIDAK ikut terhapus — '
        +'ia tetap ada tapi kehilangan nama, jam, dan warnanya, lalu tergambar abu-abu polos. '
        +'Lebih aman ganti dulu sel-sel itu ke shift lain.'
      : 'Belum ada satu sel pun yang memakainya, jadi tidak ada yang terpengaruh.',
    function(){
      delete S.setting.shifts[k];
      simpanSetting(); render();
      toast('Shift dihapus');
    }, { ya:'Ya, hapus', lebar:'420px' });
}
function ubahShift(k,f,v){
  const cur=S.setting.shifts[k]||Object.assign({},SHIFT_BAWAAN[k]);
  cur[f]=v; S.setting.shifts[k]=cur;
  simpanSetting(); render();
}
function ubahHead(div,uid,on){
  const l=(S.setting.heads[div]||[]).filter(x=>x!==uid);
  if(on) l.push(uid);
  S.setting.heads[div]=l;
  simpanSetting(); render();
  toast(on?(namaKru(uid)+' jadi head '+namaDivisi(div)):(namaKru(uid)+' bukan head lagi'));
}
function ubahManajemen(uid,on){
  const l=(S.setting.manajemen||[]).filter(x=>x!==uid);
  if(on) l.push(uid);
  S.setting.manajemen=l;
  simpanSetting(); render();
  toast(on?(namaKru(uid)+' bisa membuka Rekap Pegawai'):(namaKru(uid)+' tidak lagi bisa membukanya'));
}
function ubahDivisi(uid,k){
  if(k) S.setting.divOverride[uid]=k; else delete S.setting.divOverride[uid];
  simpanSetting(); render();
}
/* ubahAmbang() dan ubahJabatan() dihapus 5 Agustus 2026 bersama dua panel
   Pengaturan yang memanggilnya (Batas Beban Kerja & kotak "Jabatan di
   lembar"). Fungsi tanpa pemanggil lebih berbahaya daripada tidak ada: ia
   ikut muncul saat mencari, dan pembaca berikutnya mengira masih ada layar
   yang memakainya.

   Nilai yang dulu mereka tulis TETAP dibaca: `S.setting.maksBeruntun` /
   `jedaMin` oleh peringatan beban kerja (kini memakai bawaan 6 hari & 10 jam
   kalau belum pernah diisi), dan `S.setting.jabatan` oleh jabatanDari() —
   jadi penyesuaian lama tidak hilang, cuma tidak bisa diubah dari sini lagi. */
function ubahShiftKru(uid,k){
  if(k) S.setting.shiftKru[uid]=k; else delete S.setting.shiftKru[uid];
  simpanSetting(); render();
}

/* =====================================================================
   EKSPOR — teks WA & PNG
   Head menempel jadwal di papan DAN mengirimnya ke grup. Dua jalur itu
   memang dua kebiasaan yang berbeda, jadi keduanya disediakan.
   ===================================================================== */
/* Satu bulan penuh dan satu minggu dibedakan HANYA oleh daftar pitanya.
   Sisanya — penggambar PNG, penyusun teks WA, judul, nama berkas — memakai
   jalur yang sama persis. Menduplikasi penggambar canvas untuk mode mingguan
   berarti dua tempat yang harus diperbaiki tiap kali bentuk selnya berubah,
   dan yang satunya pasti terlupa. */
function pitaBulanAktif(){ return pitaBulan(BULAN_AKTIF||bulanDari(hariIni())); }
function pitaMingguAktif(){
  const senin=MINGGU_AKTIF||seninDari(hariIni());
  return [{senin, hari:tujuhHari(senin)}];
}
function judulLembar(lingkup){
  const nama=namaDivisi(divTunggal()).toUpperCase();
  return lingkup==='minggu'
    ? 'SCHEDULE '+nama+' — '+rentangMinggu(MINGGU_AKTIF||seninDari(hariIni())).toUpperCase()
    : 'SCHEDULE '+nama+' — '+labelBulan(BULAN_AKTIF||bulanDari(hariIni())).toUpperCase();
}

/* Isi satu hari, dikelompokkan per shift, plus daftar daily worker hari itu.
   Dipakai KEDUA bentuk teks WA (mingguan yang lapang dan bulanan yang padat)
   supaya keduanya tidak pernah bisa melaporkan hari yang sama secara berbeda. */
function isiHariWA(emps,tgl){
  const per={};
  emps.forEach(function(u){
    const c=sel(u.id,tgl); if(!c) return;
    (per[c.t]=per[c.t]||[]).push(u.name);
  });
  return {
    per: per,
    urut: daftarShift().filter(function(k){ return per[k]; }),
    dw: DW_ROWS.filter(function(x){ return x.divisi===divTunggal() && x.tgl===tgl; })
               .sort(function(a,b){ return String(a.m||'').localeCompare(String(b.m||'')); }),
    kosong: emps.filter(function(u){ return !sel(u.id,tgl); }).length
  };
}
/* Teks WhatsApp.

   Disusun PER HARI, bukan per orang. Bentuk lama menulis satu baris koma
   panjang untuk tiap kru ("Sen PAGI, Sel PAGI, Rab SIANG, …") — dan itu dua
   kali salah: di layar HP baris itu melipat di tempat yang tidak terduga
   sehingga kolomnya tidak pernah sejajar, dan pertanyaan yang sebenarnya
   dibawa orang ke grup bukan "si A minggu ini bagaimana" melainkan "Sabtu
   siapa yang masuk". Pengelompokan per hari menjawabnya tanpa dibaca dua kali.

   Daily worker IKUT. Sebelumnya tidak, dan itu membuat teks WA diam-diam
   berbeda isi dengan lembar yang dipajang di papan — tepat pada hari yang
   paling ramai, karena hari itulah DW dipanggil.

   Dua kerapatan, satu jalur: seminggu ditulis lapang (satu blok per hari),
   sebulan ditulis padat (satu baris per hari). Sebulan dalam bentuk lapang
   menjadi 150-an baris dan tidak ada yang membacanya sampai habis. */
function exportWA(lingkup){
  const emps=kruDivisi(divTunggal());
  const pita=(lingkup==='minggu')?pitaMingguAktif():pitaBulanAktif();
  const mingguan=(lingkup==='minggu');
  const mk=BULAN_AKTIF||bulanDari(hariIni());
  const a=awalBulan(mk), z=akhirBulan(mk);

  if(!emps.length && !DW_ROWS.some(function(x){ return x.divisi===divTunggal(); })){
    toast('Belum ada kru untuk diekspor'); return;
  }

  const garis='━━━━━━━━━━━━━━━';
  let txt='*JADWAL SHIFT — '+namaDivisi(divTunggal()).toUpperCase()+'*\n'
    +'_'+(mingguan ? rentangMinggu(MINGGU_AKTIF||seninDari(hariIni())) : labelBulan(mk))+'_\n'
    +garis+'\n';

  const dipakai={};       // shift yang benar-benar muncul → legenda tidak jadi daftar mati
  let totalKosong=0, adaDW=false;

  pita.forEach(function(p,pi){
    /* Label minggu hanya kalau memang lebih dari satu — untuk satu minggu ia
       cuma mengulang judul yang baru saja dibaca. */
    if(pita.length>1) txt+='\n_MINGGU '+(pi+1)+' · '+rentangMinggu(p.senin)+'_\n';

    p.hari.forEach(function(d){
      // Lembar bulanan memakai pita Senin–Minggu, jadi ujungnya menjulur ke
      // bulan tetangga. Hari di luar bulan yang diekspor tidak ikut ditulis.
      if(!mingguan && (d<a || d>z)) return;

      const h=isiHariWA(emps,d);
      totalKosong+=h.kosong;
      h.urut.forEach(function(k){ dipakai[k]=1; });
      if(h.dw.length) adaDW=true;

      const kepala=(mingguan?HARI_PJG[idxHari(d)]:HARI[idxHari(d)].slice(0,3))
        +' · '+tglManusia(d)+(idxHari(d)>=5?' 🔴':'');

      if(!h.urut.length && !h.dw.length){
        txt+=(mingguan?'\n*'+kepala+'*\n_belum diatur_\n':'*'+kepala+'* _belum diatur_\n');
        return;
      }

      if(mingguan){
        txt+='\n*'+kepala+'*\n';
        h.urut.forEach(function(k){
          const sd=shiftDef(k);
          txt+='▪ '+sd.n+(sd.libur?'':' _'+sd.m+'–'+sd.s+'_')+'\n';
          h.per[k].forEach(function(n){ txt+='   • '+n+'\n'; });
        });
        if(h.dw.length){
          txt+='▪ Daily Worker\n';
          h.dw.forEach(function(x){
            txt+='   • '+x.nama+' _('+(x.posisi||'DW')
              +((x.m&&x.s)?(' · '+x.m+'–'+x.s):'')+')_\n';
          });
        }
      }else{
        /* Padat: satu baris per hari. Shift libur ditaruh paling belakang —
           yang dicari orang di baris ini selalu siapa yang MASUK. */
        const bagian=h.urut.slice()
          .sort(function(x,y){ return (shiftDef(x).libur?1:0)-(shiftDef(y).libur?1:0); })
          .map(function(k){ return shiftDef(k).n+': '+h.per[k].join(', '); });
        if(h.dw.length) bagian.push('DW: '+h.dw.map(function(x){ return x.nama; }).join(', '));
        txt+='*'+kepala+'* '+bagian.join(' · ')+'\n';
      }
    });
  });

  txt+='\n'+garis+'\n';
  const legenda=Object.keys(dipakai)
    .sort(function(x,y){ return (shiftDef(x).urut||99)-(shiftDef(y).urut||99); })
    .filter(function(k){ return !shiftDef(k).libur; })
    .map(function(k){ return shiftDef(k).n+' '+shiftDef(k).m+'–'+shiftDef(k).s; });
  if(legenda.length) txt+='_'+legenda.join('  ·  ')+'_\n';
  if(adaDW)      txt+='_DW = daily worker (pekerja harian)_\n';
  if(totalKosong) txt+='_⚠️ '+totalKosong+' sel belum diatur_\n';
  txt+='_Laksamana Muda_';

  salinTeks(txt);
}
function salinTeks(txt){
  const tampil=(ok)=>{
    document.getElementById('modalRoot').innerHTML=
      '<div class="overlay" onclick="if(event.target===this)tutupModal()"><div class="modal">'
      +'<div class="mh"><h3>Teks untuk WhatsApp</h3><button class="xbtn" onclick="tutupModal()">×</button></div>'
      +'<div class="mb">'+(ok?'<div class="note i">✓ Sudah tersalin ke clipboard — tinggal tempel di grup.</div>'
                            :'<p class="mutedhint" style="margin-bottom:8px">Salin teks di bawah lalu kirim ke grup.</p>')
      +'<textarea rows="14" style="width:100%;font-size:12.5px;padding:10px;border:1.5px solid var(--line);border-radius:10px" onclick="this.select()">'
      +esc(txt)+'</textarea></div>'
      +'<div class="mf"><button class="btn btn-primary" onclick="tutupModal()">Selesai</button></div></div></div>';
  };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>tampil(true),()=>tampil(false));
  }else tampil(false);
}

/* PNG digambar ulang di canvas, BUKAN memotret tabel HTML: html2canvas dan
   sejenisnya butuh pustaka eksternal, dan modul ini tidak memuat satu pun
   skrip dari luar. Ukurannya mengikuti jumlah kru, jadi divisi besar tidak
   terpotong. */
function exportPNG(lingkup){
  const emps=kruDivisi(divTunggal());
  if(!emps.length){ toast('Belum ada kru untuk diekspor'); return; }
  const minggu=(lingkup==='minggu');
  const pita=minggu?pitaMingguAktif():pitaBulanAktif();
  const namaBerkas='jadwal-'+divTunggal()+'-'+(minggu?('minggu-'+(MINGGU_AKTIF||seninDari(hariIni())))
                                            :(BULAN_AKTIF||bulanDari(hariIni())))+'.png';

  const sc=2, padX=20, noW=42, nmW=210, jbW=96, dayW=118;
  const hRow=34, hHdr=26, hHdr2=22, hJudul=74, gap=16, hLegend=46;
  const W=padX*2+noW+nmW+jbW+dayW*7;
  const H=hJudul+pita.reduce((s,p)=>s+hHdr+hHdr2+hRow*emps.length+gap,0)+hLegend+padX;

  const cv=document.createElement('canvas'); cv.width=W*sc; cv.height=H*sc;
  const cx=cv.getContext('2d');
  // Peramban tua / lingkungan tanpa canvas mengembalikan null. Lebih baik satu
  // pesan jelas daripada TypeError yang membuat seluruh halaman diam.
  if(!cx){ toast('Peramban ini tidak mendukung ekspor PNG — pakai Print/PDF', true); return; }
  cx.scale(sc,sc);
  cx.fillStyle='#FFFFFF'; cx.fillRect(0,0,W,H);

  // Kepala
  cx.fillStyle='#2A2620'; cx.fillRect(0,0,W,hJudul);
  cx.fillStyle='#C8961F'; cx.font='800 24px "Plus Jakarta Sans",sans-serif'; cx.textAlign='left';
  cx.fillText(judulLembar(lingkup), padX, 36);
  cx.fillStyle='#F2E9D3'; cx.font='600 13px Inter,sans-serif';
  cx.fillText('Laksamana Muda · dicetak '+tglPanjang(hariIni()), padX, 58);

  let y=hJudul+gap/2;
  const x0=padX;
  pita.forEach(p=>{
    const kolom=p.hari.length;
    // Baris tanggal
    cx.fillStyle='#F2E9D3'; cx.fillRect(x0,y,noW+nmW+jbW+dayW*kolom,hHdr);
    cx.fillStyle='#2A2620'; cx.font='700 12px "Plus Jakarta Sans",sans-serif'; cx.textAlign='center';
    cx.fillText('No.', x0+noW/2, y+17);
    cx.fillText('NAMA', x0+noW+nmW/2, y+17);
    cx.fillText('TGL', x0+noW+nmW+jbW/2, y+17);
    p.hari.forEach((d,i)=>{ cx.fillText(tglPendek(d), x0+noW+nmW+jbW+dayW*i+dayW/2, y+17); });
    y+=hHdr;
    // Baris nama hari
    cx.fillStyle='#EFECE4'; cx.fillRect(x0,y,noW+nmW+jbW+dayW*kolom,hHdr2);
    cx.font='700 11px Inter,sans-serif';
    cx.fillStyle='#5C574D'; cx.fillText('HARI', x0+noW+nmW+jbW/2, y+15);
    p.hari.forEach((d,i)=>{
      const idx=idxHari(d);
      cx.fillStyle=(idx>=5)?'#C9432B':'#5C574D';
      cx.fillText(HARI_PJG[idx], x0+noW+nmW+jbW+dayW*i+dayW/2, y+15);
    });
    y+=hHdr2;
    // Baris kru
    emps.forEach((u,ui)=>{
      cx.fillStyle=ui%2?'#FFFFFF':'#FBFAF8'; cx.fillRect(x0,y,noW+nmW+jbW+dayW*kolom,hRow);
      cx.textAlign='center'; cx.fillStyle='#928C80'; cx.font='600 11px Inter,sans-serif';
      cx.fillText(String(ui+1), x0+noW/2, y+hRow/2+4);
      cx.textAlign='left'; cx.fillStyle='#2A2620'; cx.font='700 12.5px Inter,sans-serif';
      cx.fillText(potong(cx,u.name,nmW-14), x0+noW+8, y+hRow/2+4);
      cx.textAlign='center'; cx.fillStyle='#5C574D'; cx.font='700 11px Inter,sans-serif';
      cx.fillText(potong(cx,jabatanDari(u),jbW-8), x0+noW+nmW+jbW/2, y+hRow/2+4);
      p.hari.forEach((d,i)=>{
        const cell=sel(u.id,d);
        const cxx=x0+noW+nmW+jbW+dayW*i;
        if(cell){
          const sd=shiftDef(cell.t);
          cx.fillStyle=sd.w; cx.fillRect(cxx+1,y+1,dayW-2,hRow-2);
          cx.fillStyle=warnaTeks(sd.w); cx.font='800 12px "Plus Jakarta Sans",sans-serif';
          cx.fillText(potong(cx,labelSel(cell),dayW-10), cxx+dayW/2, y+hRow/2+4);
        }else{
          cx.fillStyle='#C9C3B7'; cx.font='600 13px Inter,sans-serif';
          cx.fillText('·', cxx+dayW/2, y+hRow/2+4);
        }
      });
      y+=hRow;
    });
    // Garis kisi pita ini
    cx.strokeStyle='#D9D3C4'; cx.lineWidth=1;
    const atas=y-hRow*emps.length-hHdr-hHdr2;
    for(let i=0;i<=kolom;i++){
      const gx=x0+noW+nmW+jbW+dayW*i+.5;
      cx.beginPath(); cx.moveTo(gx,atas); cx.lineTo(gx,y); cx.stroke();
    }
    [x0+.5, x0+noW+.5, x0+noW+nmW+.5].forEach(gx=>{ cx.beginPath(); cx.moveTo(gx,atas); cx.lineTo(gx,y); cx.stroke(); });
    for(let r=0;r<=emps.length;r++){
      const gy=atas+hHdr+hHdr2+hRow*r+.5;
      cx.beginPath(); cx.moveTo(x0,gy); cx.lineTo(x0+noW+nmW+jbW+dayW*kolom,gy); cx.stroke();
    }
    cx.beginPath(); cx.moveTo(x0,atas+.5); cx.lineTo(x0+noW+nmW+jbW+dayW*kolom,atas+.5); cx.stroke();
    y+=gap;
  });

  // Legenda
  cx.textAlign='left'; let lx=padX; const ly=y+18;
  daftarShift().forEach(k=>{
    const sd=shiftDef(k);
    cx.fillStyle=sd.w; cx.fillRect(lx,ly-11,14,14);
    cx.strokeStyle='#D9D3C4'; cx.strokeRect(lx+.5,ly-10.5,13,13);
    cx.fillStyle='#5C574D'; cx.font='600 11.5px Inter,sans-serif';
    cx.fillText(sd.n, lx+20, ly);
    lx+=20+cx.measureText(sd.n).width+18;
  });

  cv.toBlob(b=>{
    if(!b){ toast('Gagal membuat PNG', true); return; }
    const a=document.createElement('a');
    a.href=URL.createObjectURL(b);
    a.download=namaBerkas;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000);
    toast(minggu?'PNG jadwal minggu ini diunduh':'PNG jadwal sebulan diunduh');
  });
}
/* =====================================================================
   EKSPOR EXCEL (.xlsx)

   Kenapa .xlsx sungguhan dan bukan CSV atau tabel HTML ber-ekstensi .xls:
   yang dibawa lembar ini SEBAGIAN BESAR adalah warnanya. Kru membaca papan
   dari jauh dan mengenali shift-nya dari warna, bukan dari tulisannya —
   CSV membuang seluruhnya, dan tabel HTML ber-nama .xls membuat Excel
   memunculkan peringatan "format berbeda dengan ekstensi" tiap kali dibuka,
   yang di kantor ini sudah cukup untuk membuat berkasnya dianggap rusak.

   Kenapa ditulis sendiri sampai ke ZIP-nya: modul ini tidak memuat satu pun
   skrip dari luar (lihat alasan yang sama di exportPNG). ZIP-nya memakai
   metode SIMPAN (tanpa kompresi) — XML-nya beberapa ratus KB, dan menulis
   deflate sendiri berarti menambah 200 baris demi menghemat berkas yang
   toh langsung dibuka lalu ditutup.

   Bentuknya sengaja MENIRU lembar Excel yang sudah dipakai kru sehari-hari:
   pita mingguan yang mengulang kepala tanggal, kolom No/NAMA/jabatan di
   kiri, legenda warna di kanan. Yang menerima berkas ini tidak sedang
   belajar bentuk baru — ia sedang menerima lembar yang sudah dikenalnya,
   cuma tidak diketik ulang.
   ===================================================================== */
let CRC_TABEL=null;
function crc32(u8){
  if(!CRC_TABEL){
    CRC_TABEL=new Uint32Array(256);
    for(let i=0;i<256;i++){
      let c=i; for(let j=0;j<8;j++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);
      CRC_TABEL[i]=c>>>0;
    }
  }
  let c=0xFFFFFFFF;
  for(let i=0;i<u8.length;i++) c=CRC_TABEL[(c^u8[i])&0xFF]^(c>>>8);
  return (c^0xFFFFFFFF)>>>0;
}
/* ZIP metode 0 (simpan). Bendera 0x0800 wajib: tanpa itu nama berkas di
   dalam arsip dibaca sebagai CP437 dan Excel menolak paketnya. */
function zipSimpan(berkas){
  const enc=new TextEncoder(), isi=[], pusat=[]; let ofs=0;
  const n=new Date();
  const jam=((n.getHours()<<11)|(n.getMinutes()<<5)|((n.getSeconds()/2)|0))&0xFFFF;
  const tgl=(((n.getFullYear()-1980)<<9)|((n.getMonth()+1)<<5)|n.getDate())&0xFFFF;
  berkas.forEach(function(f){
    const nm=enc.encode(f.nama), c=crc32(f.data);
    const lok=new Uint8Array(30+nm.length), v=new DataView(lok.buffer);
    v.setUint32(0,0x04034b50,true); v.setUint16(4,20,true); v.setUint16(6,0x0800,true);
    v.setUint16(8,0,true); v.setUint16(10,jam,true); v.setUint16(12,tgl,true);
    v.setUint32(14,c,true); v.setUint32(18,f.data.length,true); v.setUint32(22,f.data.length,true);
    v.setUint16(26,nm.length,true); lok.set(nm,30);
    isi.push(lok, f.data);
    const cd=new Uint8Array(46+nm.length), w=new DataView(cd.buffer);
    w.setUint32(0,0x02014b50,true); w.setUint16(4,20,true); w.setUint16(6,20,true);
    w.setUint16(8,0x0800,true); w.setUint16(10,0,true);
    w.setUint16(12,jam,true); w.setUint16(14,tgl,true);
    w.setUint32(16,c,true); w.setUint32(20,f.data.length,true); w.setUint32(24,f.data.length,true);
    w.setUint16(28,nm.length,true); w.setUint32(42,ofs,true); cd.set(nm,46);
    pusat.push(cd);
    ofs+=lok.length+f.data.length;
  });
  const pjgPusat=pusat.reduce((s,x)=>s+x.length,0);
  const akhir=new Uint8Array(22), e=new DataView(akhir.buffer);
  e.setUint32(0,0x06054b50,true);
  e.setUint16(8,berkas.length,true); e.setUint16(10,berkas.length,true);
  e.setUint32(12,pjgPusat,true); e.setUint32(16,ofs,true);
  const semua=isi.concat(pusat,[akhir]);
  const out=new Uint8Array(semua.reduce((s,x)=>s+x.length,0));
  let p=0; semua.forEach(function(x){ out.set(x,p); p+=x.length; });
  return out;
}
function xEsc(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function kolHuruf(n){    // 1 -> A
  let s=''; while(n>0){ const r=(n-1)%26; s=String.fromCharCode(65+r)+s; n=((n-r)/26)|0; }
  return s;
}
/* Warna teks dipilih dari terang-gelapnya latar, bukan ditulis satu per satu:
   warna shift bisa diubah user di Pengaturan, dan tulisan hitam di atas
   CUTI merah tua (#C00000) praktis tidak terbaca. */
function tulisanKontras(hex){
  const h=String(hex||'#000000').replace('#','').padEnd(6,'0');
  const r=parseInt(h.slice(0,2),16)||0, g=parseInt(h.slice(2,4),16)||0, b=parseInt(h.slice(4,6),16)||0;
  return (0.299*r+0.587*g+0.114*b)>150 ? '000000' : 'FFFFFF';
}
function heks6(w){ return String(w||'#7A756B').replace('#','').padEnd(6,'0').slice(0,6).toUpperCase(); }

/* Penyusun styles.xml. Font/fill/border dikumpulkan sambil jalan supaya
   penambahan satu shift baru di Pengaturan tidak perlu menyentuh berkas ini. */
function xlsxGaya(){
  const fonts=[
    '<font><sz val="11"/><name val="Calibri"/></font>',                                  //0
    '<font><b/><sz val="11"/><name val="Calibri"/></font>',                              //1
    '<font><b/><sz val="16"/><name val="Calibri"/></font>',                              //2
    '<font><b/><i/><sz val="11"/><name val="Calibri"/></font>',                          //3
    '<font><i/><sz val="10"/><color rgb="FF5C574D"/><name val="Calibri"/></font>'        //4
  ];
  const fills=['<fill><patternFill patternType="none"/></fill>',
               '<fill><patternFill patternType="gray125"/></fill>'];
  const petaFill={};
  const xfs=[];
  const api={
    fill:function(hex){
      if(!hex) return 0;
      if(petaFill[hex]==null){
        petaFill[hex]=fills.length;
        fills.push('<fill><patternFill patternType="solid"><fgColor rgb="FF'+hex+'"/>'
          +'<bgColor indexed="64"/></patternFill></fill>');
      }
      return petaFill[hex];
    },
    /* o = {f:font, bg:hex, br:1, h:'center'|'left', wrap:1, warnaTeks:hex} */
    xf:function(o){
      o=o||{};
      const al='<alignment horizontal="'+(o.h||'center')+'" vertical="center"'
        +(o.wrap?' wrapText="1"':'')+'/>';
      xfs.push('<xf numFmtId="0" fontId="'+(o.f||0)+'" fillId="'+api.fill(o.bg)+'" borderId="'
        +(o.br?1:0)+'" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1">'
        +al+'</xf>');
      return xfs.length-1;
    },
    xml:function(){
      /* Warna teks putih perlu font-nya sendiri; ditambahkan di sini supaya
         daftar font tidak dibangun dua kali. */
      return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
        +'<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
        +'<fonts count="'+fonts.length+'">'+fonts.join('')+'</fonts>'
        +'<fills count="'+fills.length+'">'+fills.join('')+'</fills>'
        +'<borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border>'
        +'<border><left style="thin"><color rgb="FF000000"/></left>'
        +'<right style="thin"><color rgb="FF000000"/></right>'
        +'<top style="thin"><color rgb="FF000000"/></top>'
        +'<bottom style="thin"><color rgb="FF000000"/></bottom><diagonal/></border></borders>'
        +'<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'
        +'<cellXfs count="'+xfs.length+'">'+xfs.join('')+'</cellXfs>'
        +'<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>'
        +'</styleSheet>';
    },
    fontPutih:function(){
      fonts.push('<font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font>');
      return fonts.length-1;
    }
  };
  return api;
}

function exportExcel(lingkup){
  const div=divTunggal();
  const emps=kruDivisi(div);
  if(!emps.length){ toast('Belum ada kru untuk diekspor'); return; }
  if(typeof TextEncoder==='undefined' || typeof Uint8Array==='undefined'){
    toast('Peramban ini terlalu tua untuk ekspor Excel — pakai PNG atau Print', true); return;
  }
  const minggu=(lingkup==='minggu');
  const pita=minggu?pitaMingguAktif():pitaBulanAktif();
  const mk=BULAN_AKTIF||bulanDari(hariIni());

  const G=xlsxGaya();
  const fPutih=G.fontPutih();
  const gJudul  = G.xf({f:2, h:'center'});
  const gKuning = G.xf({f:1, bg:'FFFF00', br:1});
  const gKuningI= G.xf({f:3, bg:'FFFF00', br:1});
  const gAbu    = G.xf({f:1, bg:'BFBFBF', br:1});
  const gNo     = G.xf({f:0, br:1});
  const gNama   = G.xf({f:1, br:1, h:'left'});
  const gJab    = G.xf({f:3, br:1});
  const gKosong = G.xf({f:0, br:1});
  const gCatat  = G.xf({f:4, h:'left'});
  /* Satu gaya per kode shift, dipetakan sekali di depan: sel bulan penuh bisa
     mencapai 1.500 buah, dan mencari gaya per sel membuat berkasnya tumbuh
     tanpa perlu. */
  const gShift={};
  daftarShift().forEach(function(k){
    const w=heks6(shiftDef(k).w);
    gShift[k]=G.xf({f:(tulisanKontras(w)==='FFFFFF'?fPutih:1), bg:w, br:1});
  });

  const baris=[], gabung=[];
  let r=0;
  const KOL=10;                        // A..J : No, NAMA, TGL/HARI, 7 hari
  const sel_=(c,v,s)=>({c:c, v:v, s:s});
  const tambah=(sels,tinggi)=>{ r++; baris.push({r:r, sels:sels, h:tinggi}); return r; };

  /* Judul, digabung selebar tabel — sama seperti lembar lama. */
  tambah([sel_(1, judulLembar(lingkup), gJudul)], 26);
  gabung.push('A1:'+kolHuruf(KOL)+'1');
  tambah([sel_(1,'Laksamana Muda · dicetak '+tglPanjang(hariIni()), gCatat)], 15);
  tambah([], 6);

  pita.forEach(function(p){
    const h=p.hari;
    /* Dua baris kepala: tanggal lalu nama hari. Kolom No & NAMA digabung
       menurun melintasi keduanya, persis seperti lembar yang dipakai kru. */
    const rTgl=tambah([sel_(1,'No.',gKuning), sel_(2,'NAMA',gKuning), sel_(3,'TGL',gKuningI)]
      .concat(h.map(function(d,i){
        const q=parseD(d);
        return sel_(4+i, ('0'+q.getDate()).slice(-2)+'/'+('0'+(q.getMonth()+1)).slice(-2)
          +'/'+String(q.getFullYear()).slice(-2), gKuning);
      })), 18);
    const rHari=tambah([sel_(1,'',gKuning), sel_(2,'',gKuning), sel_(3,'HARI',gKuningI)]
      .concat(h.map(function(d,i){
        return sel_(4+i, HARI_PJG[(parseD(d).getDay()+6)%7], gAbu);
      })), 18);
    gabung.push('A'+rTgl+':A'+rHari, 'B'+rTgl+':B'+rHari);

    emps.forEach(function(u,i){
      /* Kolom ketiga = jabatan, lewat jabatanDari() yang sama dengan lembar
         di layar — termasuk jatuhnya ke keterangan Office kalau belum
         dipendekkan di Pengaturan. Menyalin aturannya ke sini berarti dua
         tempat yang bisa menulis jabatan berbeda untuk orang yang sama. */
      const jbt=jabatanDari(u);
      const s=[sel_(1,i+1,gNo), sel_(2,u.name,gNama), sel_(3,jbt,gJab)];
      h.forEach(function(d,j){
        const c=sel(u.id,d);
        s.push(c ? sel_(4+j, shiftDef(c.t).n, gShift[c.t]||gKosong)
                 : sel_(4+j, '', gKosong));
      });
      tambah(s, 17);
    });

    /* DAILY WORKER TIDAK IKUT KE EXCEL (14 Agustus 2026).
       ---------------------------------------------------------------------
       Blok ini dulu ikut, dengan alasan "lembar Excel tidak boleh diam-diam
       berbeda isi dengan papan". Yang tidak diperhitungkan: isinya tidak muat
       di sel selebar kolom shift. Kru tetap menulis satu kata ("PAGI",
       "MIDDLE"), DW menulis posisi + rentang jam ("Kitchen Helper 08:00–17:00")
       — di lembar cetak/Excel yang lebarnya sudah dikunci per hari, teks itu
       terpotong jadi "n Helper 08:00" dan menjulur ke sel tetangga yang kosong,
       sehingga satu shift DW terbaca seolah milik hari yang salah.

       Lembarnya juga memang dipakai untuk hal yang berbeda: yang dibagikan ke
       grup adalah jadwal KRU TETAP. Jadwal DW disusun, diputuskan, dan
       diekspor sendiri dari modul DW (Excel Sebulan di Kalender DW), lengkap
       dengan kolom yang lebarnya memang disiapkan untuk jam.

       Di LAYAR blok DW tetap ada — di sana lebarnya ikut isinya, dan head
       memang perlu melihat DW hari Sabtu sebelum meng-off-kan kru tetap. */
    tambah([], 6);
  });

  /* Legenda di kolom L, sejajar kepala tabel — di lembar lama letaknya juga
     di kanan, dan yang mencarinya mencari di sana. */
  const kolLeg=12;
  /* LEMBARNYA DIPANJANGKAN DULU KALAU MEMANG KURANG BARIS.

     Yang lama menjepit indeksnya dengan Math.min(…, baris.length-1), dan itu
     BUKAN sekadar legenda yang tertumpuk di layar: dua entri yang jatuh ke
     baris yang sama menulis DUA <c r="L9"> di dalam satu <row>, dan sel
     berulang membuat Excel menolak seluruh berkasnya — "We found a problem
     with some content", isinya hilang semua, bukan cuma legendanya.

     Terjadi diam-diam pada lembar pendek: ekspor MINGGUAN divisi berisi
     kurang dari lima kru cuma punya 9-10 baris, sedangkan shift bawaannya
     delapan. Cashier bertiga sudah cukup untuk memicunya, dan yang mengekspor
     tidak melihat apa pun yang salah sampai berkasnya dibuka.

     Barisnya ditambah (kosong, tanpa isi) supaya tiap shift dapat barisnya
     sendiri — nomor barisnya tetap berurutan karena baris[j].r selalu j+1. */
  while(baris.length < 3+daftarShift().length) tambah([], 15);
  daftarShift().forEach(function(k,i){
    const b=baris[3+i];
    if(!b) return;
    b.sels.push(sel_(kolLeg, shiftDef(k).n, gShift[k]||gKosong));
  });

  const lebar=[{min:1,max:1,w:5},{min:2,max:2,w:22},{min:3,max:3,w:12},
               {min:4,max:10,w:12},{min:11,max:11,w:2},{min:12,max:12,w:14}];
  const xmlBaris=baris.map(function(b){
    const cs=b.sels.slice().sort((x,y)=>x.c-y.c).map(function(c){
      const ref=kolHuruf(c.c)+b.r;
      const angka=(typeof c.v==='number');
      return '<c r="'+ref+'" s="'+c.s+'"'+(angka?'':' t="inlineStr"')+'>'
        +(angka ? '<v>'+c.v+'</v>' : '<is><t xml:space="preserve">'+xEsc(c.v)+'</t></is>')
        +'</c>';
    }).join('');
    return '<row r="'+b.r+'"'+(b.h?' ht="'+b.h+'" customHeight="1"':'')+'>'+cs+'</row>';
  }).join('');

  const sheet='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    +'<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
    +'<sheetFormatPr defaultRowHeight="15"/>'
    +'<cols>'+lebar.map(c=>'<col min="'+c.min+'" max="'+c.max+'" width="'+c.w+'" customWidth="1"/>').join('')+'</cols>'
    +'<sheetData>'+xmlBaris+'</sheetData>'
    +(gabung.length?'<mergeCells count="'+gabung.length+'">'
        +gabung.map(g=>'<mergeCell ref="'+g+'"/>').join('')+'</mergeCells>':'')
    +'<pageMargins left="0.25" right="0.25" top="0.3" bottom="0.3" header="0.3" footer="0.3"/>'
    +'<pageSetup orientation="landscape" fitToWidth="1" fitToHeight="0"/>'
    +'</worksheet>';

  const P='http://schemas.openxmlformats.org/';
  const enc=new TextEncoder();
  const B=(nama,teks)=>({nama:nama, data:enc.encode(teks)});
  const zip=zipSimpan([
    B('[Content_Types].xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      +'<Types xmlns="'+P+'package/2006/content-types">'
      +'<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
      +'<Default Extension="xml" ContentType="application/xml"/>'
      +'<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'
      +'<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>'
      +'<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'
      +'</Types>'),
    B('_rels/.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      +'<Relationships xmlns="'+P+'package/2006/relationships">'
      +'<Relationship Id="rId1" Type="'+P+'officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>'
      +'</Relationships>'),
    B('xl/workbook.xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      +'<workbook xmlns="'+P+'spreadsheetml/2006/main" xmlns:r="'+P+'officeDocument/2006/relationships">'
      +'<sheets><sheet name="'+xEsc(namaDivisi(div).slice(0,28))+'" sheetId="1" r:id="rId1"/></sheets>'
      +'</workbook>'),
    B('xl/_rels/workbook.xml.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
      +'<Relationships xmlns="'+P+'package/2006/relationships">'
      +'<Relationship Id="rId1" Type="'+P+'officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>'
      +'<Relationship Id="rId2" Type="'+P+'officeDocument/2006/relationships/styles" Target="styles.xml"/>'
      +'</Relationships>'),
    B('xl/styles.xml', G.xml()),
    B('xl/worksheets/sheet1.xml', sheet)
  ]);

  const namaBerkas=namaEkspor('shift_attendance','xlsx');
  const blob=new Blob([zip],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=namaBerkas;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1000);
  toast(minggu?'Excel jadwal minggu ini diunduh':'Excel jadwal sebulan diunduh');
}

/* NAMA BERKAS EKSPOR — pola yang sama dengan berkas ekspor Talenta yang
   sudah dipakai HR sehari-hari (`20260818044108-4167486-export_shift_attendance.xlsx`):
   cap waktu 14 angka, satu angka acak, lalu `export_<isi>`.

   Diminta 18 Agustus 2026. Sebabnya bukan selera: berkas ekspor dari sini dan
   dari Talenta berakhir di folder Unduhan yang sama lalu dilampirkan
   berdampingan, dan dua pola penamaan membuat yang mana-yang mana hanya bisa
   dipastikan dengan membukanya satu per satu.

   Cap waktunya WAKTU SETEMPAT, bukan UTC: nama berkas dibaca manusia yang
   membandingkannya dengan jam dinding, dan berkas "pukul 21.00" yang tertulis
   14.00 terbaca sebagai berkas kemarin.

   Angka acak bukan hiasan — dua ekspor dalam detik yang sama (dua divisi
   berturut-turut, yang memang kebiasaannya) akan bertabrakan namanya, dan
   peramban menimpanya atau menempelkan "(1)" di belakang. Divisi dan
   periodenya sengaja TIDAK lagi masuk nama berkas: keduanya tertulis di dalam
   berkasnya sendiri (nama sheet dan baris kop), dan pola Talenta memang tidak
   memuatnya. */
function capWaktuBerkas(){
  const d=new Date();
  return String(d.getFullYear())+pad(d.getMonth()+1)+pad(d.getDate())
        +pad(d.getHours())+pad(d.getMinutes())+pad(d.getSeconds());
}
function namaEkspor(isi,ext){
  const acak=String(Math.floor(1000000+Math.random()*9000000));
  return capWaktuBerkas()+'-'+acak+'-export_'+isi+'.'+ext;
}
function potong(cx,txt,maxW){
  txt=String(txt==null?'':txt);
  if(cx.measureText(txt).width<=maxW) return txt;
  let t=txt;
  while(t.length>1 && cx.measureText(t+'…').width>maxW) t=t.slice(0,-1);
  return t+'…';
}

/* =====================================================================
   BOOT
   ===================================================================== */
function tampilkanGerbang(judul,pesan){
  const g=document.getElementById('gate');
  document.getElementById('gateJudul').textContent=judul;
  document.getElementById('gatePesan').textContent=pesan;
  g.classList.remove('hidden');
  document.getElementById('app').classList.add('hidden');
}
async function boot(){
  const lg=document.getElementById("brand-logo"); if(lg) lg.src=LOGO_URI;
  BULAN_AKTIF=bulanDari(hariIni());
  DASH_TGL=hariIni();
  MINGGU_AKTIF=seninDari(hariIni());
  S=bacaCache()||seed();

  const ses=bacaSesi();
  if(!ses){ tampilkanGerbang('Belum masuk','Modul ini dibuka lewat Laksamana Office. Silakan masuk dulu di sana.'); return; }
  if(ses.tolak){
    /* Nama CENTANGNYA yang disebut, bukan nama modulnya. Di Kelola Akses tidak
       ada kotak bernama "Jadwal Shift": kartunya bernama Roster dan memuat dua
       kunci bersebelahan — "Roster · Jadwal Shift" dan "Roster · Daily Worker".
       Tertukar centang di situ adalah sebab pegawai tetap mendarat di Daily
       Worker, dan pemilih panel mengalihkannya ke sana TANPA berkata apa pun
       karena itu memang satu-satunya panel yang ia pegang. Pesan yang cuma
       menyebut "modul Jadwal Shift" membuat admin mencari kotak yang tidak
       pernah ada, lalu menyimpulkan aksesnya sudah benar. */
    tampilkanGerbang('Tidak punya akses',
      (ses.name?ses.name+', a':'A')+'kun Anda belum diberi akses Jadwal Shift. '
      +'Minta admin mencentang "Roster · Jadwal Shift" lewat Kelola Akses di Office '
      +'— perhatikan namanya, karena di sebelahnya ada "Roster · Daily Worker" yang berbeda.');
    return;
  }
  ME=ses;
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('su-un').textContent=ME.name||'—';
  document.getElementById('su-avatar').textContent=inisial(ME.name);
  /* Pilihan menu ciut dipulihkan SEBELUM render pertama, bukan sesudah —
     kalau sesudah, sidebar sempat melebar lalu menyempit dan seluruh isi
     halaman ikut bergeser di depan mata pemakainya. */
  try{ if(localStorage.getItem('lm_jadwal_navmini')==='1') document.getElementById('app').classList.add('nav-mini'); }catch(e){}

  /* TAHAP 1 — halaman dari alamat, SEBELUM render pertama dan sebelum satu pun
     await. Kalau dibaca sesudah muatRoster()/muatData(), dua hal terjadi:
     layar sempat memperlihatkan Dashboard lalu melompat ke halaman yang
     diminta (kedip yang terbaca seperti salah klik), dan kalau jaringannya
     menggantung — server dev mati, wifi venue putus — halamannya BERHENTI di
     Dashboard selamanya karena baris pembacaan alamatnya tidak pernah
     tercapai. Yang diperiksa di sini cuma "halaman ini ada": izinnya belum
     bisa dinilai karena roster & pengaturan memang belum dimuat. */
  const dariAlamat=hashHalaman();
  if(dariAlamat && TITLES[dariAlamat]) VIEW=dariAlamat;
  /* Alamat dirapikan SEKARANG JUGA, bukan menunggu tahap 2. Dua keadaan yang
     paling sering ditemui pemakai: dibuka tanpa hash sama sekali (dari
     pintasan lama), dan hash karangan. Kalau alamatnya baru dibetulkan
     sesudah jaringan menjawab, menyegarkan halaman saat server sedang mati
     mengulang keadaan yang sama persis — dan yang mem-bookmark halaman itu
     menyimpan alamat yang tidak menunjuk ke mana pun. */
  try{ history.replaceState(null,'','#/'+VIEW); }catch(e){}

  render();                                   // gambar dari cache dulu — layar tidak pernah kosong menunggu jaringan
  await muatRoster();
  await muatData(true);

  /* Divisi awal: divisi yang paling masuk akal untuk orang ini. Head langsung
     mendarat di divisinya sendiri, bukan di Bar yang kebetulan pertama. */
  const kuasa=divisiKuasa();
  DIV = kuasa.length ? kuasa[0] : divisiSaya();
  // Yang tidak dijadwalkan tidak punya lembar sendiri; jatuhkan ke Bar.
  if(DIVISI.every(d=>d.k!==DIV)) DIV='bar';
  /* TAHAP 2 — izinnya baru bisa dinilai SEKARANG: bolehBuka() bergantung pada
     roster & pengaturan yang baru selesai dimuat dua baris di atas. Yang
     tidak lolos ditarik ke Dashboard, dan alamatnya ikut dirapikan.

     replaceState, bukan location.hash: alamat yang dirapikan (mis. #/ngawur,
     atau #/pengaturan yang dibuka non-admin) tidak boleh menambah entri
     riwayat — kalau menambah, tombol Back memantul balik ke alamat yang
     barusan ditolak. */
  if(!halamanSah(VIEW)) VIEW='dashboard';
  try{ history.replaceState(null,'','#/'+VIEW); }catch(e){}

  document.getElementById('su-ur').textContent=labelPeran();
  render();
}

/* Tab yang dibiarkan terbuka semalaman memegang jadwal kemarin. Saat kembali
   aktif, ambil ulang — head lain mungkin sudah mengubahnya. */
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible' && ME){ muatData(true).then(render); }
});

boot();
