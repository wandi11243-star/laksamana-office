function tutupModal(){ const m=document.getElementById('modalRoot'); if(m) m.innerHTML=''; EDIT=null; ISI_BARIS=null; ISI_SISA=null; }

/* =====================================================================
   ALAT MINGGUAN — salin, isi cepat, kosongkan, isi baris
   ===================================================================== */
const PILIH_BAWAAN='__BAWAAN__';

/* ---------- Peringatan "ini akan menimpa apa" ----------
   Semua alat massal di halaman ini menulis puluhan sel sekaligus, dan
   sebelumnya kalimat peringatannya cuma "sel yang sudah terisi ikut
   tertimpa" — benar, tapi tidak menjawab pertanyaan yang sebenarnya dipunyai
   head: tertimpa yang MANA. Head lain sudah menyusun sebagian minggu itu,
   dan satu klik Salin bisa menghapusnya tanpa bekas; yang hilang baru
   ketahuan berhari-hari kemudian saat orangnya datang di jam yang salah.
   Sekarang bentroknya didaftar satu per satu — nama, tanggal, dari apa jadi
   apa — dan baru dieksekusi setelah dikonfirmasi.

   Sel yang isinya PERSIS SAMA dengan yang akan ditulis tidak dihitung
   bentrok. Menulis ulang nilai yang identik tidak mengubah apa pun, dan
   memasukkannya ke daftar membuat peringatannya berisik lalu diabaikan —
   persis nasib semua peringatan yang terlalu sering muncul. */
function samaSel(a,b){
  return a && b && a.t===b.t && (a.m||'')===(b.m||'') && (a.s||'')===(b.s||'') && (a.n||'')===(b.n||'');
}
function daftarTimpa(rows){
  const out=[];
  rows.forEach(function(r){
    const lama=sel(r.u,r.d);
    if(!lama || samaSel(lama,r)) return;
    out.push({nama:namaKru(r.u), tgl:r.d, lama:lama, baru:r});
  });
  out.sort(function(a,b){ return a.tgl===b.tgl ? String(a.nama).localeCompare(String(b.nama)) : (a.tgl<b.tgl?-1:1); });
  return out;
}
function chipSel(c){
  const d=shiftDef(c.t);
  return '<span style="background:'+esc(d.w)+';color:'+warnaTeks(d.w)+'">'+esc(labelSel(c))+'</span>';
}
/* Daftar bentrok, dipotong di 40 baris. Yang di atas 40 tidak dibaca siapa
   pun satu per satu — angkanya sendiri yang jadi peringatan. */
function htmlTimpa(list){
  const batas=40, tampil=list.slice(0,batas);
  return '<div class="timpa">'+tampil.map(function(x){
      return '<div class="tr"><b>'+esc(x.nama)+'</b>'
        +'<em>'+esc(HARI[idxHari(x.tgl)].slice(0,3))+' '+esc(tglPendek(x.tgl))+'</em>'
        +chipSel(x.lama)+'<em>→</em>'+chipSel(x.baru)+'</div>';
    }).join('')
    +(list.length>batas?'<div class="tr"><b>+ '+(list.length-batas)+' sel lagi</b></div>':'')
    +'</div>';
}
/* opsi: {lebar, ya, alt:{label,cb}} — `alt` adalah jalan keluar ketiga
   (mis. "salin tapi lewati yang terisi"). Tanpa itu head yang melihat daftar
   bentrok cuma punya dua pilihan sama-sama buruk: batal total, atau menimpa
   kerja orang lain. */
function konfirmasi(judul,pesan,cb,opsi){
  opsi=opsi||{};
  window.KONFIRM_CB=function(){ tutupModal(); cb(); };
  const alt=opsi.alt
    ? (window.KONFIRM_ALT=function(){ tutupModal(); opsi.alt.cb(); },
       '<button class="btn btn-ghost" onclick="KONFIRM_ALT()">'+esc(opsi.alt.label)+'</button>')
    : '';
  document.getElementById('modalRoot').innerHTML=
    '<div class="overlay" onclick="if(event.target===this)tutupModal()"><div class="modal" style="max-width:'+(opsi.lebar||'390px')+'">'
    +'<div class="mh"><h3>'+esc(judul)+'</h3></div>'
    +'<div class="mb"><p style="color:var(--muted);font-size:13.5px">'+pesan+'</p></div>'
    +'<div class="mf"><button class="btn btn-ghost" onclick="tutupModal()">Batal</button>'
    +alt
    +'<button class="btn btn-danger" onclick="KONFIRM_CB()">'+esc(opsi.ya||'Ya, lanjut')+'</button></div></div></div>';
}
function salinMingguLalu(){
  const senin=MINGGU_AKTIF||seninDari(hariIni());
  const lalu=addD(senin,-7);
  const emps=kruDivisi(DIV);
  const rows=[];
  emps.forEach(u=>{
    for(let i=0;i<7;i++){
      const c=sel(u.id, addD(lalu,i));
      if(c) rows.push({u:u.id, d:addD(senin,i), t:c.t, m:c.m, s:c.s, n:c.n});
    }
  });
  if(!rows.length){ toast('Minggu lalu ('+rentangMinggu(lalu)+') masih kosong'); return; }

  const bentrok=daftarTimpa(rows);
  const jalan=function(pakai){
    return function(){
      if(!pakai.length){ toast('Tidak ada yang perlu disalin'); return; }
      tulisSel(pakai,[]);
      toast(pakai.length+' sel disalin dari '+rentangMinggu(lalu));
    };
  };
  if(!bentrok.length){
    konfirmasi('Salin minggu lalu?',
      '<b>'+rows.length+' sel</b> dari '+esc(rentangMinggu(lalu))+' akan disalin ke '
      +esc(rentangMinggu(senin))+'.<br>Tidak ada sel terisi yang tertimpa.',
      jalan(rows), {ya:'Ya, salin'});
    return;
  }
  /* Yang benar-benar baru = rows dikurangi yang bentrok. Dipakai tombol
     "Lewati yang sudah terisi": itulah yang diinginkan hampir setiap kali
     head menyalin minggu lalu ke minggu yang sudah ia sentuh sebagian. */
  const bentrokKunci={};
  bentrok.forEach(function(x){ bentrokKunci[kunci(x.baru.u,x.baru.d)]=1; });
  const aman=rows.filter(function(r){ return !bentrokKunci[kunci(r.u,r.d)]; });

  konfirmasi('Salin minggu lalu — '+bentrok.length+' sel akan tertimpa',
    '<b>'+rows.length+' sel</b> dari '+esc(rentangMinggu(lalu))+' akan disalin ke '
    +esc(rentangMinggu(senin))+'. <b style="color:var(--danger)">'+bentrok.length+' di antaranya sudah terisi</b> '
    +'dan isinya akan diganti — daftarnya di bawah. Sisanya ('+aman.length+' sel) mengisi sel yang masih kosong.'
    +htmlTimpa(bentrok),
    jalan(rows),
    { lebar:'580px',
      ya:'Ya, timpa '+bentrok.length+' sel',
      alt: aman.length?{label:'Lewati yang terisi ('+aman.length+')', cb:jalan(aman)}:null });
}

/* ---------- Isi Sel Kosong ----------
   Dulu tombol ini mengisi ketujuh hari sekaligus, dan itu memaksa head
   memakainya sebagai "cat dasar" lalu membetulkan sel satu per satu. Padahal
   pekerjaan yang sebenarnya berulang tiap minggu berbentuk PER HARI: "Selasa
   semua off", "Sabtu semua masuk". Sekarang harinya dicentang dulu — matikan
   enam, sisakan Selasa, pilih OFF, selesai.

   Jumlah sel yang akan tersentuh ditulis di tiap hari, bukan cuma totalnya.
   Head perlu melihat bahwa "Selasa: 5 kosong" sebelum menekan OFF; angka nol
   di situ adalah satu-satunya penjelasan kenapa nanti tidak ada yang berubah
   di kolom itu.

   `timpa` mati secara bawaan. Nama tombolnya "Isi Sel Kosong", dan alat yang
   diam-diam melakukan lebih dari namanya adalah cara tercepat menghapus kerja
   head lain. Kalau dinyalakan, bentroknya tetap harus dikonfirmasi satu per
   satu lewat daftar yang sama dengan Salin Minggu Lalu. */
let ISI_SISA=null;   // {senin, hari:[7], timpa}
function isiSisa(){
  ISI_SISA={senin:(MINGGU_AKTIF||seninDari(hariIni())), hari:[1,1,1,1,1,1,1], timpa:false};
  gambarIsiSisa();
}
function isiSisaHitung(){
  const b=ISI_SISA, kosong=[0,0,0,0,0,0,0], terisi=[0,0,0,0,0,0,0];
  kruDivisi(DIV).forEach(function(u){
    for(let i=0;i<7;i++){ if(sel(u.id, addD(b.senin,i))) terisi[i]++; else kosong[i]++; }
  });
  return {kosong:kosong, terisi:terisi};
}
function isiSisaHari(i){ const b=ISI_SISA; if(!b) return; b.hari[i]=b.hari[i]?0:1; gambarIsiSisa(); }
function isiSisaSemua(v){ const b=ISI_SISA; if(!b) return; for(let i=0;i<7;i++) b.hari[i]=v?1:0; gambarIsiSisa(); }
function isiSisaTimpa(){ const b=ISI_SISA; if(!b) return; b.timpa=!b.timpa; gambarIsiSisa(); }
function gambarIsiSisa(){
  const b=ISI_SISA; if(!b) return;
  const h=isiSisaHitung();
  const hari=tujuhHari(b.senin);
  let total=0;
  for(let i=0;i<7;i++) if(b.hari[i]) total+=h.kosong[i]+(b.timpa?h.terisi[i]:0);

  const strip=hari.map(function(tgl,i){
    const n=h.kosong[i]+(b.timpa?h.terisi[i]:0);
    const on=!!b.hari[i];
    return '<button class="hb'+(on?'':' mati')+(i>=5?' wknd':'')+'" onclick="isiSisaHari('+i+')" '
      +'title="'+esc(HARI[i]+' '+tglPanjang(tgl))+'">'
      +'<small>'+(on?'☑':'☐')+' '+esc(HARI[i].slice(0,3).toUpperCase())+'</small>'
      +'<b>'+esc(tglPendek(tgl))+'</b>'
      +'<u>'+n+' sel</u></button>';
  }).join('');

  const tombolShift=daftarShift().map(function(k){
    const sd=shiftDef(k);
    return '<button style="background:'+esc(sd.w)+';color:'+warnaTeks(sd.w)+'" onclick="isiSisaPilih(&#39;'+escJs(k)+'&#39;)">'
      +esc(sd.n)+'<small>'+(sd.libur?'&nbsp;':(sd.m+'–'+sd.s))+'</small></button>';
  }).join('');

  document.getElementById('modalRoot').innerHTML=
    '<div class="overlay" onclick="if(event.target===this)tutupModal()"><div class="modal">'
    +'<div class="mh"><h3>Isi Sel Kosong</h3>'
      +'<span class="chip">'+total+' sel</span>'
      +'<button class="xbtn" onclick="tutupModal()">×</button></div>'
    +'<div class="mb">'
      +'<p class="mutedhint" style="margin-bottom:10px">Centang hari yang mau diisi, lalu pilih shift-nya. '
      +'Mis. matikan semua kecuali <b>SELASA</b> lalu pilih <b>OFF</b> — seluruh kru divisi '
      +esc(namaDivisi(DIV))+' libur hari Selasa.</p>'
      +'<div class="hari7">'+strip+'</div>'
      +'<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-6px 0 12px">'
        +'<button class="btn btn-ghost btn-sm" onclick="isiSisaSemua(1)">Semua hari</button>'
        +'<button class="btn btn-ghost btn-sm" onclick="isiSisaSemua(0)">Kosongkan pilihan</button>'
        +'<div class="spacer" style="flex:1"></div>'
        +'<button class="btn btn-ghost btn-sm" onclick="isiSisaTimpa()" title="Bawaannya hanya sel kosong yang diisi">'
        +(b.timpa?'☑':'☐')+' Timpa sel yang sudah terisi</button>'
      +'</div>'
      +(total?'':'<div class="note w" style="margin-bottom:12px">Tidak ada sel yang akan tersentuh dengan pilihan hari ini.</div>')
      /* Tombol paling atas, memenuhi lebar: inilah pilihan yang dipakai hampir
         tiap minggu. Pola tiap kru berulang minggu demi minggu, jadi "isi semua
         dengan SIANG" justru jarang benar untuk seluruh divisi sekaligus. */
      +'<button class="btn btn-primary" style="width:100%;margin-bottom:10px" onclick="isiSisaPilih(&#39;'+PILIH_BAWAAN+'&#39;)">'
      +'⭐ Ikut minggu lalu</button>'
      +'<p class="mutedhint" style="margin:-4px 0 12px">Tiap sel diisi shift orang itu pada '
      +'<b>hari yang sama minggu lalu</b> — termasuk OFF-nya, jadi pola liburnya ikut terbawa. '
      +'Kru yang belum punya riwayat minggu lalu memakai shift kebiasaannya di Pengaturan. '
      +'Atau pilih satu shift untuk semua di bawah ini.</p>'
      +'<div class="pick">'+tombolShift+'</div>'
    +'</div></div></div>';
}
function isiSisaPilih(pilihan){
  const b=ISI_SISA; if(!b) return;
  if(!b.hari.some(Boolean)){ toast('Belum ada hari yang dicentang'); return; }
  const rows=[];
  kruDivisi(DIV).forEach(function(u){
    for(let i=0;i<7;i++){
      if(!b.hari[i]) continue;
      const tgl=addD(b.senin,i);
      if(sel(u.id,tgl) && !b.timpa) continue;
      /* Shift dihitung PER HARI, bukan sekali per orang: bawaannya kini
         berarti "ikut hari yang sama minggu lalu", jadi Senin dan Selasa
         bisa berbeda. Menghitungnya sekali di luar loop — seperti dulu —
         akan menyalin satu shift ke tujuh hari dan justru menghapus pola
         liburnya. */
      const k=(pilihan===PILIH_BAWAAN)?shiftKru(u.id,tgl):pilihan;
      const d=shiftDef(k);
      rows.push({u:u.id, d:tgl, t:k, m:d.libur?'':d.m, s:d.libur?'':d.s, n:''});
    }
  });
  const nama=(pilihan===PILIH_BAWAAN?'mengikuti minggu lalu':shiftDef(pilihan).n);
  if(!rows.length){ toast('Tidak ada sel yang cocok dengan pilihan hari itu'); return; }

  const bentrok=daftarTimpa(rows);
  const jalan=function(){ tulisSel(rows,[]); toast(rows.length+' sel diisi '+nama); };
  tutupModal();
  if(!bentrok.length){ jalan(); return; }
  konfirmasi('Timpa '+bentrok.length+' sel yang sudah terisi?',
    '<b>'+rows.length+' sel</b> akan diisi <b>'+esc(nama)+'</b>. '
    +'<b style="color:var(--danger)">'+bentrok.length+' di antaranya sudah terisi</b> dan isinya akan diganti:'
    +htmlTimpa(bentrok),
    jalan, {lebar:'580px', ya:'Ya, timpa '+bentrok.length+' sel'});
}
/* ---------- Isi Satu Baris: klik beruntun, satu hari per klik ----------
   Dulu tombol ini meminta SATU shift lalu menimpa ketujuh hari dengan shift
   itu — dan itu hampir tidak pernah benar. Tidak ada kru yang masuk PAGI
   tujuh hari berturut-turut; setiap baris minggu selalu campuran, dan selalu
   ada satu atau dua OFF di dalamnya. Akibatnya head memakai tombol ini untuk
   "mengecat dasar" lalu tetap mengklik sel satu per satu untuk membetulkan —
   dua pekerjaan untuk satu baris.

   Sekarang pointer-nya berjalan sendiri: klik PAGI → Senin terisi PAGI dan
   pointer pindah ke Selasa; klik OFF → Selasa OFF, pointer ke Rabu; begitu
   sampai tujuh hari penuh, lalu tersimpan sendiri. Satu baris minggu selesai
   dalam tujuh klik tanpa memindahkan tangan dari deretan tombol shift.

   Yang sudah terisi ikut dimuat sebagai keadaan awal (bukan dianggap kosong),
   dan pointer melompat ke hari kosong BERIKUTNYA — baris yang tinggal
   kurang dua hari tidak memaksa head mengetik ulang lima hari yang sudah benar. */
let ISI_BARIS=null;   // {uid,nama,senin,i,isi:[7]}
function isiBaris(uid){
  const u=kruById(uid); if(!u) return;
  const senin=MINGGU_AKTIF||seninDari(hariIni());
  ISI_BARIS={
    uid:uid, nama:u.name, senin:senin, i:0,
    isi:tujuhHari(senin).map(function(tgl){
      const c=sel(uid,tgl);
      return c?{t:c.t, m:c.m||'', s:c.s||'', n:c.n||''}:null;
    })
  };
  ISI_BARIS.i=isiBarisKosongPertama(0);
  gambarIsiBaris();
}
/* Hari kosong pertama mulai dari `dari`, memutar balik ke awal minggu.
   Mengembalikan -1 kalau ketujuhnya sudah terisi. */
function isiBarisKosongPertama(dari){
  const b=ISI_BARIS; if(!b) return -1;
  for(let n=0;n<7;n++){ const i=(dari+n)%7; if(!b.isi[i]) return i; }
  return -1;
}
function gambarIsiBaris(){
  const b=ISI_BARIS; if(!b) return;
  const hari=tujuhHari(b.senin);
  const terisi=b.isi.filter(Boolean).length;

  const strip=hari.map(function(tgl,i){
    const c=b.isi[i];
    let isiHtml='<span>·</span>';
    if(c){
      const d=shiftDef(c.t);
      isiHtml='<span style="background:'+esc(d.w)+';color:'+warnaTeks(d.w)+'">'+esc(d.n)+'</span>';
    }
    return '<button class="hb'+(i===b.i?' sel':'')+(i>=5?' wknd':'')+'" onclick="isiBarisKe('+i+')">'
      +'<small>'+esc(HARI[i].slice(0,3).toUpperCase())+'</small>'
      +'<b>'+esc(tglPendek(tgl))+'</b>'+isiHtml+'</button>';
  }).join('');

  const tombolShift=daftarShift().map(function(k){
    const sd=shiftDef(k);
    return '<button style="background:'+esc(sd.w)+';color:'+warnaTeks(sd.w)+'" onclick="isiBarisPilih(&#39;'+escJs(k)+'&#39;)">'
      +esc(sd.n)+'<small>'+(sd.libur?'&nbsp;':(sd.m+'–'+sd.s))+'</small></button>';
  }).join('');

  const sedang = b.i>=0
    ? '<b>'+esc(HARI[b.i])+', '+esc(tglManusia(hari[b.i]))+'</b> — pilih shift di bawah, lalu pointer pindah sendiri ke hari berikutnya.'
    : '<b>Tujuh hari sudah terisi.</b> Klik salah satu hari di atas kalau mau membetulkan, atau tekan Simpan.';

  document.getElementById('modalRoot').innerHTML=
    '<div class="overlay" onclick="if(event.target===this)tutupModal()"><div class="modal">'
    +'<div class="mh"><h3>Isi Satu Baris — '+esc(b.nama)+'</h3>'
      +'<span class="chip">'+terisi+'/7</span>'
      +'<button class="xbtn" onclick="tutupModal()">×</button></div>'
    +'<div class="mb">'
      +'<div class="hari7">'+strip+'</div>'
      +'<p class="mutedhint" style="margin:-4px 0 12px">'+sedang+'</p>'
      +'<div class="pick">'+tombolShift+'</div>'
    +'</div>'
    +'<div class="mf">'
      +'<button class="btn btn-ghost btn-sm" onclick="isiBarisMundur()"'+(b.i===0?' disabled':'')+'>‹ Mundur</button>'
      +'<button class="btn btn-ghost btn-sm" onclick="isiBarisKosongkan()"'+(b.i<0||!b.isi[b.i]?' disabled':'')+'>Kosongkan hari ini</button>'
      +'<div class="spacer"></div>'
      +'<button class="btn btn-primary" onclick="isiBarisSimpan()"'+(terisi?'':' disabled')+'>Simpan</button>'
    +'</div></div></div>';
}
function isiBarisKe(i){ const b=ISI_BARIS; if(!b) return; b.i=i; gambarIsiBaris(); }
function isiBarisMundur(){
  const b=ISI_BARIS; if(!b||b.i<=0) return;
  b.i=(b.i<0?6:b.i-1); gambarIsiBaris();
}
function isiBarisKosongkan(){
  const b=ISI_BARIS; if(!b||b.i<0) return;
  b.isi[b.i]=null; gambarIsiBaris();
}
function isiBarisPilih(k){
  const b=ISI_BARIS; if(!b) return;
  /* Pointer -1 = ketujuhnya sudah terisi. Klik shift saat itu tidak boleh
     menulis ke mana-mana; kalau tidak, klik yang tidak sengaja akan menimpa
     hari yang tidak pernah dituju siapa pun. */
  if(b.i<0){ toast('Pilih dulu hari yang mau diubah di atas'); return; }
  const d=shiftDef(k);
  b.isi[b.i]={t:k, m:d.libur?'':d.m, s:d.libur?'':d.s, n:''};
  const lanjut=isiBarisKosongPertama(b.i+1);
  b.i=lanjut;
  /* Tujuh hari penuh → simpan sendiri dan tutup. Itu memang akhir pekerjaan
     yang dimaksud tombol ini, dan menyuruh head menekan Simpan lagi setelah
     klik ketujuh cuma satu langkah yang tidak menambah apa pun. */
  if(lanjut<0){ isiBarisSimpan(); return; }
  gambarIsiBaris();
}
function isiBarisSimpan(){
  const b=ISI_BARIS; if(!b) return;
  const hari=tujuhHari(b.senin);
  const rows=[], hapus=[];
  hari.forEach(function(tgl,i){
    const c=b.isi[i];
    if(c) rows.push({u:b.uid, d:tgl, t:c.t, m:c.m, s:c.s, n:c.n});
    /* Hari yang dikosongkan HANYA dikirim sebagai hapus kalau selnya memang
       ada di server. Mengirim hapus untuk sel yang tidak pernah ada cuma
       menambah baris kerja tanpa efek. */
    else if(sel(b.uid,tgl)) hapus.push({u:b.uid, d:tgl});
  });
  const n=rows.length;
  tutupModal();
  if(!n && !hapus.length){ return; }
  tulisSel(rows,hapus);
  toast(b.nama+': '+n+' hari terisi'+(hapus.length?', '+hapus.length+' dikosongkan':''));
}
function kosongkanMinggu(){
  const senin=MINGGU_AKTIF||seninDari(hariIni());
  const emps=kruDivisi(DIV);
  const hapus=[];
  emps.forEach(u=>{ tujuhHari(senin).forEach(tgl=>{ if(sel(u.id,tgl)) hapus.push({u:u.id,d:tgl}); }); });
  if(!hapus.length){ toast('Minggu ini sudah kosong'); return; }
  konfirmasi('Kosongkan minggu ini?',
    '<b>'+hapus.length+' sel</b> divisi '+esc(namaDivisi(DIV))+' pada '+esc(rentangMinggu(senin))+' akan dihapus. Tidak bisa dibatalkan.',
    ()=>{ tulisSel([],hapus); toast('Minggu dikosongkan'); });
}

/* =====================================================================
   HALAMAN 3 — JADWAL SAYA
   ===================================================================== */
function viewSaya(){
  const uid=ME&&ME.id;
  const u=uid?kruById(uid):null;
  const mk=BULAN_AKTIF||bulanDari(hariIni());
  if(!u){
    return '<div class="panel">'+panelKosongRoster()
      +'<div class="empty"><div class="ic">👤</div>Akun Anda belum ketemu di daftar kru Office.'
      +'<div class="mutedhint" style="margin-top:6px">Jadwal pribadi baru bisa ditampilkan setelah akun Anda terdaftar sebagai pegawai di Laksamana Office.</div></div></div>';
  }
  const div=divisiDari(u);
  const a=awalBulan(mk), z=akhirBulan(mk);
  let masuk=0, libur=0, jam=0;
  for(let d=a; d<=z; d=addD(d,1)){
    const c=sel(uid,d); if(!c) continue;
    if(shiftDef(c.t).libur) libur++;
    else { masuk++; const jm=jamSel(c); if(jm) jam+=durasiJam(jm.m,jm.s); }
  }

  /* Tanggal yang sedang/pernah diajukan, supaya kru tidak mengirim pengajuan
     kedua untuk hari yang sama hanya karena tidak ingat. Yang MENUNGGU
     menang atas yang sudah diputus — itu yang perlu dilihat. */
  const ajuPeta={};
  ajuSaya().forEach(function(x){
    if(x.status==='DITOLAK') return;
    for(let d=x.dari; d<=x.sampai; d=addD(d,1)){
      if(ajuPeta[d]!=='MENUNGGU') ajuPeta[d]=x.status;
    }
  });

  let kal='<div class="kal">'
    +HARI.map((h,i)=>'<div class="kh'+(i>=5?' wknd':'')+'">'+esc(h.slice(0,3))+'</div>').join('');
  pitaBulan(mk).forEach(function(p){
    p.hari.forEach(function(d){
      /* Hari di luar bulan yang sedang dilihat tetap memakan satu kotak —
         tanpa itu kolom harinya bergeser dan Senin tidak lagi di bawah SEN. */
      if(d<a || d>z){ kal+='<div class="kd kosong"></div>'; return; }
      const c=sel(uid,d), sd=c?shiftDef(c.t):null, jm=jamSel(c);
      const ini=(d===hariIni());
      const st=ajuPeta[d];
      kal+='<div class="kd'+(ini?' ini':'')+'" onclick="bukaAjukan(\''+d+'\')" title="Klik untuk mengajukan perubahan '+esc(tglPanjang(d))+'">'
        +'<div class="tg">'+parseD(d).getDate()+(st==='MENUNGGU'?'<span class="tt" title="pengajuan menunggu">•</span>':'')+'</div>'
        +(c
          ? '<div class="sf" style="background:'+esc(sd.w)+';color:'+warnaTeks(sd.w)+'">'+esc(labelSel(c))+'</div>'
            +(jm?'<div class="jm">'+esc(jm.m+'–'+jm.s)+'</div>':'')
          : '<div class="blm">belum diatur</div>')
        +'</div>';
    });
  });
  kal+='</div>';

  const menunggu=ajuSaya().filter(x=>x.status==='MENUNGGU');
  return '<div class="panel">'
    +'<div class="rowbar"><h2>👤 Jadwal Saya</h2>'
    +'<span class="chip">'+esc(u.name)+' · '+esc(namaDivisi(div))+'</span>'
    +'<div class="spacer"></div>'
    +'<button class="btn btn-primary btn-sm" onclick="bukaAjukan()">+ Ajukan Off / Izin</button>'
    +'<div class="navdate"><button class="iconbtn" onclick="geserBulanAktif(-1)" aria-label="Bulan sebelumnya">‹</button><b>'+esc(labelBulan(mk))
    +'</b><button class="iconbtn" onclick="geserBulanAktif(1)" aria-label="Bulan berikutnya">›</button>'
    +tombolKembali('bulanIni', mk===bulanDari(hariIni()), 'Kembali ke bulan ini')+'</div></div>'
    +'<div class="stats">'+statBox(masuk,'Hari Masuk')+statBox(libur,'Off / Cuti')
      +statBox(Math.round(jam*10)/10,'Total Jam')+statBox(menunggu.length,'Pengajuan Menunggu')+'</div>'
    +kal
    +'<div class="rowbar" style="margin:14px 0 0">'+legendaShift()+'<div class="spacer"></div>'
    +'<span class="mutedhint">Klik tanggal mana pun untuk mengajukan perubahan di hari itu.</span></div>'
    +'</div>'
    +(menunggu.length
      ? '<div class="panel"><div class="rowbar"><h2>Pengajuan menunggu</h2><div class="spacer"></div>'
        +'<button class="btn btn-ghost btn-sm" onclick="go(&#39;pengajuan&#39;)">Lihat semua</button></div>'
        +menunggu.map(function(x){
            const rentang=(x.dari===x.sampai)?tglPanjang(x.dari):(tglManusia(x.dari)+' – '+tglPanjang(x.sampai));
            return '<div class="row"><div class="who"><b>'+esc(JENIS_AJU[x.jenis]||x.jenis)+'</b>'
              +'<span>'+esc(rentang)+'</span></div>'+pilShiftAju(x)
              +'<span class="stpill st-MENUNGGU">MENUNGGU</span></div>';
          }).join('')
        +'</div>'
      : '');
}
function durasiJam(m,s){
  const t=x=>{ const p=String(x).split(':'); return (+p[0])*60+(+p[1]); };
  let a=t(m), b=t(s); if(b<=a) b+=1440;      // shift yang melewati tengah malam
  return (b-a)/60;
}
function ajuSaya(){ return (S.pengajuan||[]).filter(a=>a.userId===(ME&&ME.id)); }

/* =====================================================================
   HALAMAN 4 — PENGAJUAN
   Kru mengajukan, head divisinya yang memutuskan. Ini yang membedakan modul
   ini dari lembar Excel: perubahan jadwal punya jejak siapa menyetujui apa.
   ===================================================================== */
function bisaPutuskan(a){
  if(isAdmin()) return true;
  const u=kruById(a.userId);
  if(!u || !ME) return false;
  return isHeadUser(ME.id, divisiDari(u));
}
/* Pil shift pada kartu pengajuan. Kosong untuk pengajuan lama yang memang
   belum punya kolomnya — bukan diganti tebakan. */
function pilShiftAju(a){
  const k = AJU_KE_SHIFT[a.jenis] || a.shift || '';
  if(!k || !S.setting.shifts[k]) return '';
  const d=shiftDef(k);
  const jam=(!d.libur && a.jamMulai && a.jamSelesai) ? ' '+esc(a.jamMulai+'–'+a.jamSelesai) : '';
  return ' <span class="stpill" style="background:'+esc(d.w)+';color:'+warnaTeks(d.w)+'">'+esc(d.n)+jam+'</span>';
}
function viewPengajuan(){
  const semua=(S.pengajuan||[]).slice();
  /* Yang MENUNGGU selalu di atas: itu satu-satunya yang menuntut tindakan.
     Sisanya urut terbaru — riwayat cuma untuk dilihat sekali-sekali. */
  const list=semua.filter(a=>isAdmin() || bisaPutuskan(a) || a.userId===(ME&&ME.id))
    .sort((x,y)=>(x.status==='MENUNGGU'?0:1)-(y.status==='MENUNGGU'?0:1) || (y.dibuatAt||0)-(x.dibuatAt||0));

  let kartu='';
  if(!list.length) kartu='<div class="empty"><div class="ic">📭</div>Belum ada pengajuan.</div>';
  list.forEach(a=>{
    const u=kruById(a.userId);
    const div=u?divisiDari(u):DIV_NONSHIFT;
    const rentang=(a.dari===a.sampai)?tglPanjang(a.dari):(tglManusia(a.dari)+' – '+tglPanjang(a.sampai));
    const putus=(a.status==='MENUNGGU'&&bisaPutuskan(a))
      ? '<button class="btn btn-ok btn-sm" onclick="putuskan(\''+escJs(a.id)+'\',\'DISETUJUI\')">✓ Setujui</button>'
        +'<button class="btn btn-danger btn-sm" onclick="putuskan(\''+escJs(a.id)+'\',\'DITOLAK\')">✕ Tolak</button>'
      : '';
    const batal=(a.userId===(ME&&ME.id)&&a.status==='MENUNGGU')
      ? '<button class="btn btn-ghost btn-sm" onclick="batalAju(\''+escJs(a.id)+'\')">Batalkan</button>' : '';
    const jejak=a.status!=='MENUNGGU'
      ? '<span class="mutedhint">'+esc(a.status==='DISETUJUI'?'disetujui':'ditolak')+' oleh '+esc(a.putusOleh||'—')+'</span>' : '';
    kartu+='<div class="row aju" style="flex-direction:column;align-items:stretch">'
      +'<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">'
      +'<span class="stpill" style="background:var(--gold-soft);color:var(--gold-dim)">'+esc(JENIS_AJU[a.jenis]||a.jenis)+'</span>'
      +'<b>'+esc(u?u.name:namaKru(a.userId))+'</b>'
      +'<span style="font-size:11px;color:var(--muted-2)">'+esc(namaDivisi(div))+'</span>'
      +'<div class="spacer"></div><span class="stpill st-'+esc(a.status)+'">'+esc(a.status)+'</span></div>'
      /* Shift yang diminta ditampilkan sebagai pil berwarna, bukan dititip di
         dalam kalimat alasan: inilah satu-satunya hal yang benar-benar perlu
         dilihat head sebelum menekan Setujui, karena itu juga yang akan
         ditulis ke sel jadwalnya. */
      +'<div class="isi"><b>'+esc(rentang)+'</b>'+pilShiftAju(a)+(a.alasan?' — '+esc(a.alasan):'')+'</div>'
      +'<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">'+jejak
      +'<div class="spacer"></div>'+putus+batal+'</div></div>';
  });

  const nMenunggu=list.filter(a=>a.status==='MENUNGGU'&&bisaPutuskan(a)).length;
  return '<div class="panel">'
    +'<div class="rowbar"><h2>📝 Pengajuan Off, Izin &amp; Tukar Shift</h2><div class="spacer"></div>'
    +'<button class="btn btn-primary btn-sm" onclick="bukaAjukan()">+ Ajukan</button></div>'
    +(nMenunggu?'<div class="note w"><b>'+nMenunggu+' pengajuan</b> menunggu keputusan Anda.</div>':'')
    +'<p class="mutedhint" style="margin-bottom:12px">'
    +(isAdmin()?'Sebagai admin, Anda bisa memutuskan pengajuan semua divisi.'
      :(divisiKuasa().length?'Sebagai head '+esc(divisiKuasa().map(namaDivisi).join(', '))+', Anda memutuskan pengajuan kru divisi itu.'
        :'Pengajuan Anda diputuskan oleh head divisi Anda.'))
    +' Pengajuan <b>Off/Izin/Cuti</b> yang disetujui langsung mengisi sel jadwalnya.</p>'
    +kartu+'</div>';
}
/* `tglAwal` diisi saat dipanggil dari kotak tanggal di kalender Jadwal Saya.
   Kru yang mengklik tanggal 12 sudah menyatakan hari mana yang ia maksud;
   membiarkannya memilih ulang di dalam modal cuma mengundang salah tanggal. */
function bukaAjukan(tglAwal){
  const kuasa=divisiKuasa();
  /* Head boleh mengajukan atas nama kru divisinya — kru dapur sering titip
     lewat WhatsApp, dan memaksanya login sendiri berarti pengajuannya tidak
     pernah masuk sistem. */
  const pool = isAdmin() ? ROSTER.filter(u=>u.active!==false)
             : kuasa.length ? ROSTER.filter(u=>u.active!==false && kuasa.indexOf(divisiDari(u))>-1)
             : (ME&&kruById(ME.id) ? [kruById(ME.id)] : []);
  const opsiKru = pool.length>1
    ? '<div class="field"><label>Kru</label><select id="ajKru">'
      +pool.map(u=>'<option value="'+esc(u.id)+'"'+(u.id===(ME&&ME.id)?' selected':'')+'>'+esc(u.name)+' — '+esc(namaDivisi(divisiDari(u)))+'</option>').join('')
      +'</select></div>'
    : '';
  const hari=(typeof tglAwal==='string' && /^\d{4}-\d{2}-\d{2}$/.test(tglAwal)) ? tglAwal : hariIni();
  /* Shift yang disodorkan = shift orang itu pada hari yang sama minggu lalu
     relatif terhadap tanggal yang sedang diajukan. */
  AJU_SHIFT = shiftKru(pool.length?pool[0].id:(ME&&ME.id), hari);
  document.getElementById('modalRoot').innerHTML=
    '<div class="overlay" onclick="if(event.target===this)tutupModal()"><div class="modal">'
    +'<div class="mh"><h3>Ajukan Perubahan Jadwal</h3><button class="xbtn" onclick="tutupModal()">×</button></div>'
    +'<div class="mb">'+opsiKru
    +'<div class="field"><label>Jenis</label><select id="ajJenis" onchange="gambarShiftAju()">'
    +Object.keys(JENIS_AJU).map(k=>'<option value="'+k+'">'+esc(JENIS_AJU[k])+'</option>').join('')+'</select></div>'
    +'<div class="timerow"><div class="field"><label>Dari Tanggal</label><input id="ajDari" type="date" value="'+hari+'"></div>'
    +'<div class="field"><label>Sampai Tanggal</label><input id="ajSampai" type="date" value="'+hari+'"></div></div>'
    +'<div id="ajShiftBox"></div>'

    +'<textarea id="ajAlasan" rows="3" placeholder="Contoh: ada urusan keluarga, sudah dibicarakan dengan Yuza"></textarea></div>'

    +'</div><div class="mf"><button class="btn btn-ghost" onclick="tutupModal()">Batal</button>'
    +'<button class="btn btn-primary" onclick="kirimAju()">Kirim Pengajuan</button></div></div></div>';
  gambarShiftAju();
}
/* Shift yang diminta, dipilih dari tombol — bukan diketik di dalam kalimat
   alasan.

   Dulu satu-satunya tempat menuliskan "Kamis jadi PAGI" adalah kotak alasan,
   dan itu memindahkan pekerjaan ke tempat yang salah: head menekan Setujui,
   menganggap urusannya selesai, lalu sel jadwalnya tidak pernah berubah
   karena tidak ada yang bisa disimpulkan mesin dari prosa. Pengajuan
   berstatus DISETUJUI dengan jadwal yang masih shift lama adalah kesalahan
   paling mahal di modul ini — kru merasa sudah beres, absensi berkata lain.

   Sekarang bentuknya eksplisit, jadi TUKAR dan UBAH ikut bisa mengisi sel
   otomatis seperti OFF/IZIN/CUTI. */
let AJU_SHIFT='';
function gambarShiftAju(){
  const box=document.getElementById('ajShiftBox'); if(!box) return;
  const el=document.getElementById('ajJenis');
  const jenis=el?el.value:'OFF';
  const tetap=AJU_KE_SHIFT[jenis];

  /* OFF/IZIN/CUTI shift-nya sudah pasti dari jenisnya sendiri. Menyodorkan
     pemilih di situ cuma mengundang kombinasi yang tidak masuk akal
     ("Izin, tapi shift SIANG"). Yang ditampilkan cukup keterangan. */
  if(tetap){
    const d=shiftDef(tetap);
    box.innerHTML='<div class="note i" style="display:flex;align-items:center;gap:8px">'
      +'<span class="stpill" style="background:'+esc(d.w)+';color:'+warnaTeks(d.w)+'">'+esc(d.n)+'</span>'
      +'<span>Sel jadwal pada tanggal itu akan diisi <b>'+esc(d.n)+'</b> begitu disetujui.</span></div>';
    return;
  }
  if(!AJU_SHIFT || !S.setting.shifts[AJU_SHIFT]){
    const el2=document.getElementById("ajDari");
    AJU_SHIFT=shiftKru(ME&&ME.id, el2?el2.value:"");
  }
  const d=shiftDef(AJU_SHIFT);
  box.innerHTML='<div class="field"><label>Shift yang diminta</label>'
    +'<div class="pick">'+daftarShift().filter(k=>!shiftDef(k).libur).map(function(k){
        const sd=shiftDef(k);
        return '<button type="button" class="'+(k===AJU_SHIFT?'sel':'')+'" style="background:'+esc(sd.w)+';color:'+warnaTeks(sd.w)+'" '
          +'onclick="pilihShiftAju(&#39;'+escJs(k)+'&#39;)">'+esc(sd.n)+'<small>'+esc(sd.m+'–'+sd.s)+'</small></button>';
      }).join('')+'</div></div>'
    /* Jam khusus hanya untuk UBAH — itu memang seluruh isi jenis tersebut.
       Untuk TUKAR, jam ikut shift tujuannya dan kotak tambahan cuma satu
       tempat lagi yang bisa diisi tidak konsisten. */
    +(jenis==='UBAH'
      ? '<div class="timerow"><div class="field"><label>Jam mulai</label>'
        +'<input id="ajJamM" type="time" value="'+esc(d.m)+'"></div>'
        +'<div class="field"><label>Jam selesai</label>'
        +'<input id="ajJamS" type="time" value="'+esc(d.s)+'"></div></div>'
        +'<p class="mutedhint" style="margin-top:-6px">Kosongkan kalau jamnya ikut bawaan shift di atas.</p>'
      : '');
}
function pilihShiftAju(k){ AJU_SHIFT=k; gambarShiftAju(); }
async function kirimAju(){
  const el=id=>document.getElementById(id);
  const uid=el('ajKru')?el('ajKru').value:(ME&&ME.id);
  const jenis=el('ajJenis').value;
  let dari=el('ajDari').value, sampai=el('ajSampai').value||dari;
  const alasan=el('ajAlasan').value.trim();
  if(!uid){ toast('Kru belum dipilih', true); return; }
  if(!dari){ toast('Tanggal belum diisi', true); return; }
  if(sampai<dari){ const t=dari; dari=sampai; sampai=t; }
  if(!alasan){ toast('Isi alasannya dulu', true); return; }
  /* Shift ikut dikirim SEBELUM modal ditutup — sesudahnya elemennya sudah
     tidak ada dan nilainya hilang tanpa jejak. */
  const tetap=AJU_KE_SHIFT[jenis];
  const shift=tetap||AJU_SHIFT||'';
  const jamM=(!tetap&&el('ajJamM'))?el('ajJamM').value:'';
  const jamS=(!tetap&&el('ajJamS'))?el('ajJamS').value:'';
  if(!shift){ toast('Pilih shift yang diminta dulu', true); return; }
  tutupModal();
  const row={id:'A'+Date.now().toString(36)+Math.floor(Math.random()*900+100), userId:uid, jenis, dari, sampai, alasan,
             shift, jamMulai:jamM, jamSelesai:jamS};
  try{
    await apiPost({action:'simpanPengajuan', row});
    S.pengajuan.unshift(Object.assign({status:'MENUNGGU', dibuatAt:Date.now(), dibuatOleh:(ME&&ME.name)||'', putusOleh:'', putusAt:0}, row));
    simpanCache(); render(); toast('Pengajuan terkirim ke head divisi');
  }catch(e){ toast('Gagal mengirim: '+e.message, true); }
}
/* Menyetujui Off/Izin/Cuti langsung menulis selnya. Head yang baru saja
   menekan Setujui menganggap urusannya selesai — kalau jadwalnya tidak ikut
   berubah, kru tetap tercatat masuk dan itu baru ketahuan saat absensi. */
async function putuskan(id,status){
  const a=(S.pengajuan||[]).find(x=>x.id===id); if(!a) return;
  if(!bisaPutuskan(a)){ toast('Pengajuan ini bukan wewenang Anda', true); return; }
  try{
    await apiPost({action:'putusPengajuan', id, status, nota:''});
    a.status=status; a.putusOleh=(ME&&ME.name)||''; a.putusAt=Date.now();
    /* Shift tujuan: OFF/IZIN/CUTI disimpulkan dari jenisnya, TUKAR/UBAH
       dibaca dari yang DIPILIH kru saat mengajukan. Sebelum kolom `shift`
       ada, dua jenis terakhir sengaja tidak pernah mengisi sel — tidak ada
       satu shift pun yang bisa disimpulkan dari kalimat alasan. Sekarang
       bisa, jadi head tidak perlu mengetik ulang apa yang baru saja ia
       setujui: langkah itulah yang paling sering terlewat, dan hasilnya
       pengajuan DISETUJUI dengan jadwal yang masih shift lama.

       Pengajuan LAMA (dikirim sebelum ada kolom ini) tidak punya `shift`,
       jadi TUKAR/UBAH-nya tetap berperilaku seperti dulu — disetujui tanpa
       menyentuh sel. Menebak shift untuknya jauh lebih berbahaya daripada
       membiarkan head mengisinya sendiri. */
    const tShift = AJU_KE_SHIFT[a.jenis] || (a.shift && S.setting.shifts[a.shift] ? a.shift : '');
    if(status==='DISETUJUI' && tShift){
      const libur=shiftDef(tShift).libur;
      const rows=[];
      for(let d=a.dari; d<=a.sampai; d=addD(d,1)){
        rows.push({u:a.userId, d, t:tShift,
          m:libur?'':(a.jamMulai||''), s:libur?'':(a.jamSelesai||''), n:''});
      }
      await tulisSel(rows,[]);
      toast('Disetujui — '+rows.length+' hari diisi '+shiftDef(tShift).n);
    }else{
      simpanCache(); render();
      toast(status==='DISETUJUI'?'Pengajuan disetujui':'Pengajuan ditolak');
    }
  }catch(e){ toast('Gagal menyimpan putusan: '+e.message, true); }
}
async function batalAju(id){
  try{
    await apiPost({action:'hapusPengajuan', id});
    S.pengajuan=(S.pengajuan||[]).filter(x=>x.id!==id);
    simpanCache(); render(); toast('Pengajuan dibatalkan');
  }catch(e){ toast('Gagal membatalkan: '+e.message, true); }
}

function ubahShift(k,f,v){
  const cur=S.setting.shifts[k]||Object.assign({},SHIFT_BAWAAN[k]);
  cur[f]=v; S.setting.shifts[k]=cur;
  simpanSetting(); render();
}
function ubahHead(div,uid,on){
  const l=(S.setting.heads[div]||[]).filter(x=>x!==uid);
  if(on) l.push(uid);
  S.setting.heads[div]=l;
  simpanSetting(); render();
  toast(on?(namaKru(uid)+' jadi head '+namaDivisi(div)):(namaKru(uid)+' bukan head lagi'));
}
function ubahManajemen(uid,on){
  const l=(S.setting.manajemen||[]).filter(x=>x!==uid);
  if(on) l.push(uid);
  S.setting.manajemen=l;
  simpanSetting(); render();
  toast(on?(namaKru(uid)+' bisa membuka Rekap Pegawai'):(namaKru(uid)+' tidak lagi bisa membukanya'));
}
function ubahDivisi(uid,k){
  if(k) S.setting.divOverride[uid]=k; else delete S.setting.divOverride[uid];
  simpanSetting(); render();
}
/* ubahAmbang() dan ubahJabatan() dihapus 5 Agustus 2026 bersama dua panel
   Pengaturan yang memanggilnya (Batas Beban Kerja & kotak "Jabatan di
   lembar"). Fungsi tanpa pemanggil lebih berbahaya daripada tidak ada: ia
   ikut muncul saat mencari, dan pembaca berikutnya mengira masih ada layar
   yang memakainya.

   Nilai yang dulu mereka tulis TETAP dibaca: `S.setting.maksBeruntun` /
   `jedaMin` oleh peringatan beban kerja (kini memakai bawaan 6 hari & 10 jam
   kalau belum pernah diisi), dan `S.setting.jabatan` oleh jabatanDari() —
   jadi penyesuaian lama tidak hilang, cuma tidak bisa diubah dari sini lagi. */
function ubahShiftKru(uid,k){
  if(k) S.setting.shiftKru[uid]=k; else delete S.setting.shiftKru[uid];
  simpanSetting(); render();
}

   ===================================================================== */
/* Satu bulan penuh dan satu minggu dibedakan HANYA oleh daftar pitanya.
   Sisanya — penggambar PNG, penyusun teks WA, judul, nama berkas — memakai
   jalur yang sama persis. Menduplikasi penggambar canvas untuk mode mingguan
   berarti dua tempat yang harus diperbaiki tiap kali bentuk selnya berubah,
   dan yang satunya pasti terlupa. */
function pitaBulanAktif(){ return pitaBulan(BULAN_AKTIF||bulanDari(hariIni())); }
function pitaMingguAktif(){
  const senin=MINGGU_AKTIF||seninDari(hariIni());
  return [{senin, hari:tujuhHari(senin)}];
}
function judulLembar(lingkup){
  const nama=namaDivisi(DIV).toUpperCase();
  return lingkup==='minggu'
    ? 'SCHEDULE '+nama+' — '+rentangMinggu(MINGGU_AKTIF||seninDari(hariIni())).toUpperCase()
    : 'SCHEDULE '+nama+' — '+labelBulan(BULAN_AKTIF||bulanDari(hariIni())).toUpperCase();
}

/* Isi satu hari, dikelompokkan per shift, plus daftar daily worker hari itu.
   Dipakai KEDUA bentuk teks WA (mingguan yang lapang dan bulanan yang padat)
   supaya keduanya tidak pernah bisa melaporkan hari yang sama secara berbeda. */
function isiHariWA(emps,tgl){
  const per={};
  emps.forEach(function(u){
    const c=sel(u.id,tgl); if(!c) return;
    (per[c.t]=per[c.t]||[]).push(u.name);
  });
  return {
    per: per,
    urut: daftarShift().filter(function(k){ return per[k]; }),
    dw: DW_ROWS.filter(function(x){ return x.divisi===DIV && x.tgl===tgl; })
               .sort(function(a,b){ return String(a.m||'').localeCompare(String(b.m||'')); }),
    kosong: emps.filter(function(u){ return !sel(u.id,tgl); }).length
  };
}
/* Teks WhatsApp.

   Disusun PER HARI, bukan per orang. Bentuk lama menulis satu baris koma
   panjang untuk tiap kru ("Sen PAGI, Sel PAGI, Rab SIANG, …") — dan itu dua
   kali salah: di layar HP baris itu melipat di tempat yang tidak terduga
   sehingga kolomnya tidak pernah sejajar, dan pertanyaan yang sebenarnya
   dibawa orang ke grup bukan "si A minggu ini bagaimana" melainkan "Sabtu
   siapa yang masuk". Pengelompokan per hari menjawabnya tanpa dibaca dua kali.

   Daily worker IKUT. Sebelumnya tidak, dan itu membuat teks WA diam-diam
   berbeda isi dengan lembar yang dipajang di papan — tepat pada hari yang
   paling ramai, karena hari itulah DW dipanggil.

   Dua kerapatan, satu jalur: seminggu ditulis lapang (satu blok per hari),
   sebulan ditulis padat (satu baris per hari). Sebulan dalam bentuk lapang
   menjadi 150-an baris dan tidak ada yang membacanya sampai habis. */
function exportWA(lingkup){
  const emps=kruDivisi(DIV);
  const pita=(lingkup==='minggu')?pitaMingguAktif():pitaBulanAktif();
  const mingguan=(lingkup==='minggu');
  const mk=BULAN_AKTIF||bulanDari(hariIni());
  const a=awalBulan(mk), z=akhirBulan(mk);

  if(!emps.length && !DW_ROWS.some(function(x){ return x.divisi===DIV; })){
    toast('Belum ada kru untuk diekspor'); return;
  }

  const garis='━━━━━━━━━━━━━━━';
  let txt='*JADWAL SHIFT — '+namaDivisi(DIV).toUpperCase()+'*\n'
    +'_'+(mingguan ? rentangMinggu(MINGGU_AKTIF||seninDari(hariIni())) : labelBulan(mk))+'_\n'
    +garis+'\n';

  const dipakai={};       // shift yang benar-benar muncul → legenda tidak jadi daftar mati
  let totalKosong=0, adaDW=false;

  pita.forEach(function(p,pi){
    /* Label minggu hanya kalau memang lebih dari satu — untuk satu minggu ia
       cuma mengulang judul yang baru saja dibaca. */
    if(pita.length>1) txt+='\n_MINGGU '+(pi+1)+' · '+rentangMinggu(p.senin)+'_\n';

    p.hari.forEach(function(d){
      // Lembar bulanan memakai pita Senin–Minggu, jadi ujungnya menjulur ke
      // bulan tetangga. Hari di luar bulan yang diekspor tidak ikut ditulis.
      if(!mingguan && (d<a || d>z)) return;

      const h=isiHariWA(emps,d);
      totalKosong+=h.kosong;
      h.urut.forEach(function(k){ dipakai[k]=1; });
      if(h.dw.length) adaDW=true;

      const kepala=(mingguan?HARI_PJG[idxHari(d)]:HARI[idxHari(d)].slice(0,3))
        +' · '+tglManusia(d)+(idxHari(d)>=5?' 🔴':'');

      if(!h.urut.length && !h.dw.length){
        txt+=(mingguan?'\n*'+kepala+'*\n_belum diatur_\n':'*'+kepala+'* _belum diatur_\n');
        return;
      }

      if(mingguan){
        txt+='\n*'+kepala+'*\n';
        h.urut.forEach(function(k){
          const sd=shiftDef(k);
          txt+='▪ '+sd.n+(sd.libur?'':' _'+sd.m+'–'+sd.s+'_')+'\n';
          h.per[k].forEach(function(n){ txt+='   • '+n+'\n'; });
        });
        if(h.dw.length){
          txt+='▪ Daily Worker\n';
          h.dw.forEach(function(x){
            txt+='   • '+x.nama+' _('+(x.posisi||'DW')
              +((x.m&&x.s)?(' · '+x.m+'–'+x.s):'')+')_\n';
          });
        }
      }else{
        /* Padat: satu baris per hari. Shift libur ditaruh paling belakang —
           yang dicari orang di baris ini selalu siapa yang MASUK. */
        const bagian=h.urut.slice()
          .sort(function(x,y){ return (shiftDef(x).libur?1:0)-(shiftDef(y).libur?1:0); })
          .map(function(k){ return shiftDef(k).n+': '+h.per[k].join(', '); });
        if(h.dw.length) bagian.push('DW: '+h.dw.map(function(x){ return x.nama; }).join(', '));
        txt+='*'+kepala+'* '+bagian.join(' · ')+'\n';
      }
    });
  });

  txt+='\n'+garis+'\n';
  const legenda=Object.keys(dipakai)
    .sort(function(x,y){ return (shiftDef(x).urut||99)-(shiftDef(y).urut||99); })
    .filter(function(k){ return !shiftDef(k).libur; })
    .map(function(k){ return shiftDef(k).n+' '+shiftDef(k).m+'–'+shiftDef(k).s; });
  if(legenda.length) txt+='_'+legenda.join('  ·  ')+'_\n';
  if(adaDW)      txt+='_DW = daily worker (pekerja harian)_\n';
  if(totalKosong) txt+='_⚠️ '+totalKosong+' sel belum diatur_\n';
  txt+='_Laksamana Muda_';

  salinTeks(txt);
}
function salinTeks(txt){
  const tampil=(ok)=>{
    document.getElementById('modalRoot').innerHTML=
      '<div class="overlay" onclick="if(event.target===this)tutupModal()"><div class="modal">'
      +'<div class="mh"><h3>Teks untuk WhatsApp</h3><button class="xbtn" onclick="tutupModal()">×</button></div>'
      +'<div class="mb">'+(ok?'<div class="note i">✓ Sudah tersalin ke clipboard — tinggal tempel di grup.</div>'
                            :'<p class="mutedhint" style="margin-bottom:8px">Salin teks di bawah lalu kirim ke grup.</p>')
      +'<textarea rows="14" style="width:100%;font-size:12.5px;padding:10px;border:1.5px solid var(--line);border-radius:10px" onclick="this.select()">'
      +esc(txt)+'</textarea></div>'
      +'<div class="mf"><button class="btn btn-primary" onclick="tutupModal()">Selesai</button></div></div></div>';
  };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>tampil(true),()=>tampil(false));
  }else tampil(false);
}

/* PNG digambar ulang di canvas, BUKAN memotret tabel HTML: html2canvas dan
   sejenisnya butuh pustaka eksternal, dan modul ini tidak memuat satu pun
   skrip dari luar. Ukurannya mengikuti jumlah kru, jadi divisi besar tidak
   terpotong. */
function exportPNG(lingkup){
  const emps=kruDivisi(DIV);
  if(!emps.length){ toast('Belum ada kru untuk diekspor'); return; }
  const minggu=(lingkup==='minggu');
  const pita=minggu?pitaMingguAktif():pitaBulanAktif();
  const namaBerkas='jadwal-'+DIV+'-'+(minggu?('minggu-'+(MINGGU_AKTIF||seninDari(hariIni())))
                                            :(BULAN_AKTIF||bulanDari(hariIni())))+'.png';

  const sc=2, padX=20, noW=42, nmW=210, jbW=96, dayW=118;
  const hRow=34, hHdr=26, hHdr2=22, hJudul=74, gap=16, hLegend=46;
  const W=padX*2+noW+nmW+jbW+dayW*7;
  const H=hJudul+pita.reduce((s,p)=>s+hHdr+hHdr2+hRow*emps.length+gap,0)+hLegend+padX;

  const cv=document.createElement('canvas'); cv.width=W*sc; cv.height=H*sc;
  const cx=cv.getContext('2d');
  // Peramban tua / lingkungan tanpa canvas mengembalikan null. Lebih baik satu
  // pesan jelas daripada TypeError yang membuat seluruh halaman diam.
  if(!cx){ toast('Peramban ini tidak mendukung ekspor PNG — pakai Print/PDF', true); return; }
  cx.scale(sc,sc);
  cx.fillStyle='#FFFFFF'; cx.fillRect(0,0,W,H);

  // Kepala
  cx.fillStyle='#2A2620'; cx.fillRect(0,0,W,hJudul);
  cx.fillStyle='#C8961F'; cx.font='800 24px "Plus Jakarta Sans",sans-serif'; cx.textAlign='left';
  cx.fillText(judulLembar(lingkup), padX, 36);
  cx.fillStyle='#F2E9D3'; cx.font='600 13px Inter,sans-serif';
  cx.fillText('Laksamana Muda · dicetak '+tglPanjang(hariIni()), padX, 58);

  let y=hJudul+gap/2;
  const x0=padX;
  pita.forEach(p=>{
    const kolom=p.hari.length;
    // Baris tanggal
    cx.fillStyle='#F2E9D3'; cx.fillRect(x0,y,noW+nmW+jbW+dayW*kolom,hHdr);
    cx.fillStyle='#2A2620'; cx.font='700 12px "Plus Jakarta Sans",sans-serif'; cx.textAlign='center';
    cx.fillText('No.', x0+noW/2, y+17);
    cx.fillText('NAMA', x0+noW+nmW/2, y+17);
    cx.fillText('TGL', x0+noW+nmW+jbW/2, y+17);
    p.hari.forEach((d,i)=>{ cx.fillText(tglPendek(d), x0+noW+nmW+jbW+dayW*i+dayW/2, y+17); });
    y+=hHdr;
    // Baris nama hari
    cx.fillStyle='#EFECE4'; cx.fillRect(x0,y,noW+nmW+jbW+dayW*kolom,hHdr2);
    cx.font='700 11px Inter,sans-serif';
    cx.fillStyle='#5C574D'; cx.fillText('HARI', x0+noW+nmW+jbW/2, y+15);
    p.hari.forEach((d,i)=>{
      const idx=idxHari(d);
      cx.fillStyle=(idx>=5)?'#C9432B':'#5C574D';
      cx.fillText(HARI_PJG[idx], x0+noW+nmW+jbW+dayW*i+dayW/2, y+15);
    });
    y+=hHdr2;
    // Baris kru
    emps.forEach((u,ui)=>{
      cx.fillStyle=ui%2?'#FFFFFF':'#FBFAF8'; cx.fillRect(x0,y,noW+nmW+jbW+dayW*kolom,hRow);
      cx.textAlign='center'; cx.fillStyle='#928C80'; cx.font='600 11px Inter,sans-serif';
      cx.fillText(String(ui+1), x0+noW/2, y+hRow/2+4);
      cx.textAlign='left'; cx.fillStyle='#2A2620'; cx.font='700 12.5px Inter,sans-serif';
      cx.fillText(potong(cx,u.name,nmW-14), x0+noW+8, y+hRow/2+4);
      cx.textAlign='center'; cx.fillStyle='#5C574D'; cx.font='700 11px Inter,sans-serif';
      cx.fillText(potong(cx,jabatanDari(u),jbW-8), x0+noW+nmW+jbW/2, y+hRow/2+4);
      p.hari.forEach((d,i)=>{
        const cell=sel(u.id,d);
        const cxx=x0+noW+nmW+jbW+dayW*i;
        if(cell){
          const sd=shiftDef(cell.t);
          cx.fillStyle=sd.w; cx.fillRect(cxx+1,y+1,dayW-2,hRow-2);
          cx.fillStyle=warnaTeks(sd.w); cx.font='800 12px "Plus Jakarta Sans",sans-serif';
          cx.fillText(potong(cx,labelSel(cell),dayW-10), cxx+dayW/2, y+hRow/2+4);
        }else{
          cx.fillStyle='#C9C3B7'; cx.font='600 13px Inter,sans-serif';
          cx.fillText('·', cxx+dayW/2, y+hRow/2+4);
        }
      });
      y+=hRow;
    });
    // Garis kisi pita ini
    cx.strokeStyle='#D9D3C4'; cx.lineWidth=1;
    const atas=y-hRow*emps.length-hHdr-hHdr2;
    for(let i=0;i<=kolom;i++){
      const gx=x0+noW+nmW+jbW+dayW*i+.5;
      cx.beginPath(); cx.moveTo(gx,atas); cx.lineTo(gx,y); cx.stroke();
    }
    [x0+.5, x0+noW+.5, x0+noW+nmW+.5].forEach(gx=>{ cx.beginPath(); cx.moveTo(gx,atas); cx.lineTo(gx,y); cx.stroke(); });
    for(let r=0;r<=emps.length;r++){
      const gy=atas+hHdr+hHdr2+hRow*r+.5;
      cx.beginPath(); cx.moveTo(x0,gy); cx.lineTo(x0+noW+nmW+jbW+dayW*kolom,gy); cx.stroke();
    }
    cx.beginPath(); cx.moveTo(x0,atas+.5); cx.lineTo(x0+noW+nmW+jbW+dayW*kolom,atas+.5); cx.stroke();
    y+=gap;
  });

  // Legenda
  cx.textAlign='left'; let lx=padX; const ly=y+18;
  daftarShift().forEach(k=>{
    const sd=shiftDef(k);
    cx.fillStyle=sd.w; cx.fillRect(lx,ly-11,14,14);
    cx.strokeStyle='#D9D3C4'; cx.strokeRect(lx+.5,ly-10.5,13,13);
    cx.fillStyle='#5C574D'; cx.font='600 11.5px Inter,sans-serif';
    cx.fillText(sd.n, lx+20, ly);
    lx+=20+cx.measureText(sd.n).width+18;
  });

  cv.toBlob(b=>{
    if(!b){ toast('Gagal membuat PNG', true); return; }
    const a=document.createElement('a');
    a.href=URL.createObjectURL(b);
    a.download=namaBerkas;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000);
    toast(minggu?'PNG jadwal minggu ini diunduh':'PNG jadwal sebulan diunduh');
  });
}
function potong(cx,txt,maxW){
  txt=String(txt==null?'':txt);
  if(cx.measureText(txt).width<=maxW) return txt;
  let t=txt;
  while(t.length>1 && cx.measureText(t+'…').width>maxW) t=t.slice(0,-1);
  return t+'…';
}

/* =====================================================================
   BOOT
   ===================================================================== */
function tampilkanGerbang(judul,pesan){
  const g=document.getElementById('gate');
  document.getElementById('gateJudul').textContent=judul;
  document.getElementById('gatePesan').textContent=pesan;
  g.classList.remove('hidden');
  document.getElementById('app').classList.add('hidden');
}
async function boot(){
  const lg=document.getElementById("brand-logo"); if(lg) lg.src=LOGO_URI;
  BULAN_AKTIF=bulanDari(hariIni());
  DASH_TGL=hariIni();
  MINGGU_AKTIF=seninDari(hariIni());
  S=bacaCache()||seed();

  const ses=bacaSesi();
  if(!ses){ tampilkanGerbang('Belum masuk','Modul ini dibuka lewat Laksamana Office. Silakan masuk dulu di sana.'); return; }
  if(ses.tolak){
    tampilkanGerbang('Tidak punya akses',
      (ses.name?ses.name+', a':'A')+'kun Anda belum diberi akses modul Jadwal Shift. Minta admin menambahkannya lewat Kelola Akses di Office.');
    return;
  }
  ME=ses;
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('su-un').textContent=ME.name||'—';
  document.getElementById('su-avatar').textContent=inisial(ME.name);
  /* Pilihan menu ciut dipulihkan SEBELUM render pertama, bukan sesudah —
     kalau sesudah, sidebar sempat melebar lalu menyempit dan seluruh isi
     halaman ikut bergeser di depan mata pemakainya. */
  try{ if(localStorage.getItem('lm_jadwal_navmini')==='1') document.getElementById('app').classList.add('nav-mini'); }catch(e){}

  render();                                   // gambar dari cache dulu — layar tidak pernah kosong menunggu jaringan
  await muatRoster();
  await muatData(true);

  /* Divisi awal: divisi yang paling masuk akal untuk orang ini. Head langsung
     mendarat di divisinya sendiri, bukan di Bar yang kebetulan pertama. */
  const kuasa=divisiKuasa();
  DIV = kuasa.length ? kuasa[0] : divisiSaya();
  // Yang tidak dijadwalkan tidak punya lembar sendiri; jatuhkan ke Bar.
  if(DIVISI.every(d=>d.k!==DIV)) DIV='bar';
  if(!bolehBuka(VIEW)) VIEW='dashboard';

  document.getElementById('su-ur').textContent=labelPeran();
  render();
}

/* Tab yang dibiarkan terbuka semalaman memegang jadwal kemarin. Saat kembali
   aktif, ambil ulang — head lain mungkin sudah mengubahnya. */
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible' && ME){ muatData(true).then(render); }
});

boot();
</script>
