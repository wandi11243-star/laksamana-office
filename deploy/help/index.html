<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Help Center, Laksamana Muda</title>
<link rel="icon" type="image/png" href="../assets/laksamana-mark.png">

<!-- Guard SSO: kunci modulnya `help`. Bentuknya sama persis dengan modul lain
     (lihat deploy/service_excellent/) dan SENGAJA cuma SATU: guard kedua yang
     menanyakan kunci lain adalah cara paling mahal untuk membuat modul
     terpantul balik tanpa satu pun pesan. -->
<script>
(function(){try{var s=JSON.parse(localStorage.getItem('lm_session')||'null');
  var hidup=s&&s.expiry&&Date.now()<s.expiry;
  var mods=(s&&s.modules)||[];
  var ok=hidup&&(mods.indexOf('*')>-1||mods.indexOf('help')>-1);
  if(!ok)location.replace('../');}catch(e){location.replace('../');}})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Tema bersama. Modul ini BARU, jadi ia memakai nama token kanonik apa
     adanya (lihat catatan "Modul BARU" di assets/tema.css) dan tidak punya
     blok :root sendiri. Palet yang disalin ke dalam <style> adalah persis yang
     membuat --gold berarti dua warna berbeda di repo ini. -->
<link rel="stylesheet" href="../assets/laksamana.css">

<style>
/* ===================================================================
   HELP CENTER, GAYA
   Hanya tata letak & komponen khas halaman ini. Warna, sudut, bayangan,
   dan huruf datang dari tema bersama.
   =================================================================== */

body{background:var(--paper)}

/* ---------- Kerangka ---------- */
.hc{display:flex;min-height:100vh}

.hc-side{
  width:var(--sidebar-w);flex:none;background:var(--surface);
  border-right:1px solid var(--line);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh
}
.hc-brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.hc-brand img{width:34px;height:34px;object-fit:contain;flex:none}
.hc-brand .t{font-family:var(--font-display);font-weight:800;font-size:15px;color:var(--ink);line-height:1.15}
.hc-brand .s{font-size:11px;color:var(--muted-2)}

.hc-cari{padding:12px 14px;border-bottom:1px solid var(--line)}
.hc-cari input{
  width:100%;padding:9px 12px;border:1.5px solid var(--line);border-radius:var(--radius-sm);
  background:var(--paper);color:var(--text);font-size:13.5px
}
.hc-cari input:focus{outline:none;border-color:var(--gold);box-shadow:var(--ring)}

.hc-nav{flex:1;overflow-y:auto;padding:10px 10px 28px}

/* Blok pemakai di kaki sidebar. Bentuknya disalin dari `.side-user` modul
   Reservasi, dan itu disengaja: ikon daya di pojok kiri bawah sudah jadi
   tempat yang dicari orang di sembilan modul lain. Help yang menaruhnya di
   tempat berbeda membuat yang mencarinya menyimpulkan tombolnya memang tidak
   ada — dan itu persis yang dilaporkan 19 September 2026.

   NAMANYA IKUT DIPAJANG. Sebelum ini Help satu-satunya halaman Office yang
   tidak pernah menyebut siapa yang sedang login, padahal isinya justru
   disaring menurut hak akses orang itu: yang babnya lebih sedikit daripada
   yang ia harapkan tidak punya satu pun cara memastikan ia membukanya dengan
   akun yang benar. */
.hc-user{border-top:1px solid var(--line);padding:12px;display:flex;align-items:center;gap:10px;flex:none}
.hc-user .av{
  width:36px;height:36px;border-radius:10px;background:var(--gold);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none
}
.hc-user .info{line-height:1.25;flex:1;min-width:0}
.hc-user .info b{display:block;font-size:13.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc-user .info span{display:block;font-size:11px;color:var(--muted-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc-keluar{
  background:var(--paper);border:1px solid var(--line);color:var(--muted-2);
  width:32px;height:32px;border-radius:9px;flex:none;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center
}
.hc-keluar:hover{background:var(--danger-bg);color:var(--danger);border-color:#E7BDB8}
.hc-nav .sect{
  font-size:10.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;
  color:var(--muted-2);padding:14px 8px 6px
}
.hc-nav a{
  display:flex;align-items:baseline;gap:8px;padding:8px 10px;border-radius:var(--radius-sm);
  color:var(--text);text-decoration:none;font-size:13.5px;position:relative;margin-bottom:1px
}
.hc-nav a:hover{background:var(--paper)}
.hc-nav a.on{background:var(--gold-soft);color:var(--gold-dim);font-weight:600}
.hc-nav a.on::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:3px;background:var(--gold)}
.hc-nav a .soon{
  margin-left:auto;font-size:9.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;
  color:var(--muted-2);border:1px solid var(--line);border-radius:20px;padding:1px 7px;flex:none;align-self:center
}

.hc-main{flex:1;min-width:0;display:flex;flex-direction:column}
.hc-top{
  display:flex;align-items:center;gap:12px;padding:12px 26px;
  border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:5
}
.hc-top .kembali{margin-left:auto}
.hc-burger{display:none;background:none;border:1.5px solid var(--line);border-radius:var(--radius-sm);padding:7px 10px;color:var(--ink)}
.hc-wrap{max-width:860px;margin:0 auto;padding:28px 26px 96px;width:100%}

/* ---------- Kepala artikel ---------- */
.hc-head h1{font-size:28px;margin-bottom:6px}
.hc-head .sub{color:var(--muted);font-size:14.5px;max-width:62ch}
.hc-head .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

/* ---------- Daftar isi ---------- */
.hc-toc{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 16px;margin:22px 0 4px;box-shadow:var(--shadow)
}
.hc-toc .lbl{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted-2);margin-bottom:8px}
.hc-toc ol{margin:0;padding-left:20px;color:var(--text)}
.hc-toc li{margin:3px 0;font-size:13.5px}
.hc-toc a{color:var(--text);text-decoration:none}
.hc-toc a:hover{color:var(--gold-dim);text-decoration:underline}

/* ---------- Bagian ---------- */
.hc-sec{margin-top:34px;scroll-margin-top:72px}
.hc-sec > h2{font-size:19px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.hc-sec p{margin:10px 0;color:var(--text);font-size:14.5px;line-height:1.65}
.hc-sec b{color:var(--ink);font-weight:600}

.hc-langkah{counter-reset:lk;list-style:none;margin:12px 0;padding:0}
.hc-langkah > li{counter-increment:lk;position:relative;padding:2px 0 12px 38px;font-size:14.5px;line-height:1.6}
.hc-langkah > li::before{
  content:counter(lk);position:absolute;left:0;top:0;
  width:25px;height:25px;border-radius:50%;
  background:var(--gold-soft);color:var(--gold-dim);
  font-family:var(--font-display);font-weight:700;font-size:12.5px;
  display:flex;align-items:center;justify-content:center
}
.hc-langkah > li:not(:last-child)::after{
  content:"";position:absolute;left:12px;top:29px;bottom:2px;width:1.5px;background:var(--line)
}

.hc-bullet{margin:10px 0 10px 20px;font-size:14.5px;line-height:1.65}
.hc-bullet li{margin:5px 0}

/* ---------- Tabel istilah ---------- */
.hc-tbl{
  width:100%;border-collapse:collapse;margin:14px 0;font-size:13.5px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden
}
.hc-tbl th{
  text-align:left;padding:9px 13px;background:var(--paper);color:var(--ink);
  font-weight:600;font-size:12px;letter-spacing:.3px;border-bottom:1px solid var(--line)
}
.hc-tbl td{padding:9px 13px;border-bottom:1px solid var(--line-soft);vertical-align:top;line-height:1.55}
.hc-tbl tr:last-child td{border-bottom:none}
.hc-tbl td:first-child{white-space:nowrap;font-weight:600;color:var(--ink)}

/* ---------- Catatan ---------- */
.hc-note{
  border-radius:var(--radius-sm);padding:12px 15px;margin:16px 0;font-size:13.5px;line-height:1.6;
  border-left:3px solid var(--info);background:var(--info-bg);color:var(--ink-2)
}
.hc-note.awas{border-left-color:var(--danger);background:var(--danger-bg)}
.hc-note.ok{border-left-color:var(--ok);background:var(--ok-bg)}
.hc-note .jd{display:block;font-weight:700;margin-bottom:3px;color:var(--ink)}

/* ---------- Tangkapan layar ----------
   SENGAJA <figure><img>, bukan potongan HTML modulnya. Menyalin markup modul
   ke sini berarti Help pelan-pelan jadi aplikasi kedua yang tampilannya
   menyimpang dari yang asli, dan orang mengikuti layar yang salah. */
.hc-shot{margin:18px 0}
.hc-shot figure{margin:0;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.hc-shot img{display:block;width:100%;height:auto}
.hc-shot figcaption{padding:9px 14px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);background:var(--paper)}
/* Keadaan berkasnya belum ada. Menyebut JALUR BERKASNYA, bukan cuma "gambar
   tidak tersedia", karena yang membacanya sering justru orang yang bisa
   mengisinya, dan tanpa nama berkas ia tidak punya satu pun petunjuk harus
   menaruhnya di mana. */
.hc-shot .kosong{
  padding:26px 18px;text-align:center;color:var(--muted-2);font-size:13px;
  background:repeating-linear-gradient(45deg,var(--paper),var(--paper) 10px,var(--surface) 10px,var(--surface) 20px)
}
.hc-shot .kosong code{
  display:inline-block;margin-top:7px;font-size:12px;color:var(--ink-3);
  background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:3px 8px
}

/* ---------- Penanda bagian gambar ---------- */
.hc-tandai{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.hc-tandai li{display:flex;gap:9px;font-size:13px;line-height:1.55;align-items:baseline}
.hc-tandai .n{
  flex:none;width:19px;height:19px;border-radius:50%;background:var(--ink);color:#fff;
  font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;align-self:flex-start
}

/* ---------- FAQ ---------- */
.hc-faq{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--surface);margin:14px 0}
.hc-faq details{border-bottom:1px solid var(--line)}
.hc-faq details:last-child{border-bottom:none}
.hc-faq summary{padding:12px 15px;cursor:pointer;font-weight:600;font-size:14px;color:var(--ink);list-style:none;display:flex;gap:10px;align-items:baseline}
.hc-faq summary::-webkit-details-marker{display:none}
.hc-faq summary::before{content:"+";color:var(--gold);font-weight:700;flex:none;width:12px}
.hc-faq details[open] summary::before{content:"\2212"}
.hc-faq .jw{padding:0 15px 13px 37px;font-size:13.5px;color:var(--text);line-height:1.65}

/* ---------- Beranda ---------- */
.hc-kartu{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:12px;margin-top:12px}
.hc-kartu a{
  display:block;padding:14px 15px;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--surface);text-decoration:none;color:var(--text);box-shadow:var(--shadow);
  transition:border-color .15s var(--ease),transform .1s var(--ease)
}
.hc-kartu a:hover{border-color:var(--gold-2);transform:translateY(-1px)}
.hc-kartu .jd{font-family:var(--font-display);font-weight:700;color:var(--ink);font-size:14.5px;margin-bottom:3px}
.hc-kartu .ket{font-size:12.5px;color:var(--muted);line-height:1.5}
.hc-kartu .soon{display:inline-block;margin-top:8px;font-size:9.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted-2);border:1px solid var(--line);border-radius:20px;padding:1px 7px}
.hc-grup-jd{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted-2);margin:26px 0 0}

/* ---------- Hasil cari ---------- */
.hc-hasil a{display:block;padding:13px 15px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);text-decoration:none;margin-bottom:9px}
.hc-hasil .jd{font-family:var(--font-display);font-weight:700;color:var(--ink);font-size:14px}
.hc-hasil .br{font-size:11.5px;color:var(--gold-dim);font-weight:600;margin-bottom:2px}
.hc-hasil .cp{font-size:13px;color:var(--muted);line-height:1.55;margin-top:4px}
.hc-hasil mark{background:var(--gold-soft);color:var(--ink);border-radius:3px;padding:0 2px}

.hc-kosong{text-align:center;padding:52px 20px;color:var(--muted)}
.hc-kosong .ic{font-size:34px;margin-bottom:10px}

/* ---------- Ponsel ---------- */
@media (max-width:880px){
  .hc-side{
    position:fixed;left:0;top:0;bottom:0;z-index:40;transform:translateX(-100%);
    transition:transform .2s var(--ease);box-shadow:var(--shadow-lg)
  }
  .hc.buka .hc-side{transform:none}
  .hc-burger{display:inline-flex}
  .hc-wrap{padding:20px 16px 80px}
  .hc-head h1{font-size:23px}
  .hc-tirai{position:fixed;inset:0;background:rgba(20,17,12,.34);z-index:39;display:none}
  .hc.buka .hc-tirai{display:block}
}
</style>
</head>
<body>

<div class="hc" id="hc">
  <div class="hc-tirai" id="tirai"></div>

  <aside class="hc-side">
    <div class="hc-brand">
      <img src="../assets/laksamana-mark.png" alt="">
      <div>
        <div class="t">Help Center</div>

    </div>
    <div class="hc-cari">
      <input id="cari" type="search" placeholder="Cari panduan..." autocomplete="off" aria-label="Cari panduan">

    <nav class="hc-nav" id="nav"></nav>

           yang dicari orang yang sudah terbiasa dengan modul lain. Dua jalan
           ke tempat yang SAMA dan sama-sama aman -- beda dari dua tempat yang
           sama-sama boleh mengubah satu angka, yang memang dilarang di repo
           ini. -->

<script src="panduan/daftar.js"></script>
<script>
/* ===================================================================
   HELP CENTER, MESIN
   -------------------------------------------------------------------
   Berkas ini TIDAK memuat satu kalimat panduan pun. Ia cuma: menyaring bab
   menurut hak akses, memuat berkas panduan, dan menggambarnya. Menambah
   panduan modul baru = menambah satu berkas di panduan/, tanpa menyentuh
   berkas ini. Itu syarat yang membuat Help bisa tumbuh bertahap.
   =================================================================== */
(function () {
'use strict';

/* ---------------------------- Sesi & izin ---------------------------- */
/* Sumbernya `lm_session`, SAMA PERSIS dengan yang dibaca portal dan setiap
   modul. Help tidak boleh punya daftar izinnya sendiri: daftar kedua akan
   menyimpang, dan yang menyimpang di sini berarti orang membaca panduan modul
   yang tidak boleh ia buka. */
function sesi(){ try{ return JSON.parse(localStorage.getItem('lm_session')||'null'); }catch(e){ return null; } }
var SESI  = sesi() || {};
var MODS  = SESI.modules || [];
var SEMUA = MODS.indexOf('*') > -1;

/* Bab tanpa `izin` terbuka untuk semua yang bisa membuka Help. Sisanya wajib
   punya kuncinya. '*' diperiksa DULU, sama dengan canOpen() di portal. */
function boleh(m){ return !m.izin || SEMUA || MODS.indexOf(m.izin) > -1; }

var GRUP  = window.LM_HELP_GRUP  || [];
var MODUL = (window.LM_HELP_MODUL || []).filter(boleh);

/* Kunci bab = `key` kalau ada, kalau tidak kunci izinnya. Bab 'portal' tidak
   punya izin, jadi ia perlu `key` sendiri. */
function kunci(m){ return m.key || m.izin; }
function cariModul(k){ for(var i=0;i<MODUL.length;i++) if(kunci(MODUL[i])===k) return MODUL[i]; return null; }

/* ---------------------------- Teks ---------------------------- */
function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
/* Penekanan ringan UNTUK NAMA TOMBOL & MENU: *Simpan* jadi tebal. Dijalankan
   SESUDAH esc(), jadi tanda kurung sudut di dalam panduan tetap tidak bisa
   jadi tag. Dibalik urutannya, satu panduan yang menyebut "<b>" akan
   menyuntikkan markup. */
function teks(s){ return esc(s).replace(/\*([^*]+)\*/g, '<b>$1</b>'); }

/* ---------------------------- Penggambar blok ---------------------------- */
/* Tiap jenis blok punya satu penggambar, dan panduan HANYA boleh memakai jenis
   yang ada di sini. Itu yang membuat semua modul terbaca dengan bentuk yang
   sama; panduan yang boleh menulis HTML sendiri akan berbeda-beda dalam
   sebulan. */
var BLOK = {
  teks: function(b){ return '<p>' + teks(b.isi) + '</p>'; },

  langkah: function(b){
    return (b.judul ? '<p><b>' + esc(b.judul) + '</b></p>' : '')
      + '<ol class="hc-langkah">'
      + (b.isi||[]).map(function(x){ return '<li>' + teks(x) + '</li>'; }).join('')
      + '</ol>';
  },

  daftar: function(b){
    return '<ul class="hc-bullet">'
      + (b.isi||[]).map(function(x){ return '<li>' + teks(x) + '</li>'; }).join('')
      + '</ul>';
  },

  tabel: function(b){
    return '<table class="hc-tbl"><thead><tr>'
      + (b.kepala||[]).map(function(h){ return '<th>' + esc(h) + '</th>'; }).join('')
      + '</tr></thead><tbody>'
      + (b.baris||[]).map(function(r){
          return '<tr>' + r.map(function(c){ return '<td>' + teks(c) + '</td>'; }).join('') + '</tr>';
        }).join('')
      + '</tbody></table>';
  },

  catatan: function(b){
    var nada = (b.nada==='awas'||b.nada==='ok') ? b.nada : '';
    return '<div class="hc-note ' + nada + '">'
      + (b.judul ? '<span class="jd">' + esc(b.judul) + '</span>' : '')
      + teks(b.isi) + '</div>';
  },

  tanya: function(b){
    return '<div class="hc-faq">'
      + (b.isi||[]).map(function(q){
          return '<details><summary>' + teks(q.t) + '</summary>'
               + '<div class="jw">' + teks(q.j) + '</div></details>';
        }).join('')
      + '</div>';
  },

  /* Tangkapan layar. `berkas` relatif terhadap gambar/, jadi panduan menulis
     'reservasi/dashboard.png'. Berkas yang belum ada TIDAK menghasilkan ikon
     gambar rusak: onerror menggantinya dengan kotak yang menyebut jalur
     berkasnya, supaya yang membacanya tahu persis apa yang kurang. */
  gambar: function(b){
    var src = 'gambar/' + String(b.berkas||'');
    var kosong = '<div class="kosong">Tangkapan layar belum dipasang.'
               + '<br><code>deploy/help/' + esc(src) + '</code></div>';
    return '<div class="hc-shot"><figure>'
      + '<img src="' + esc(src) + '" alt="' + esc(b.teks||'Tangkapan layar') + '" loading="lazy"'
      + ' onerror="this.parentNode.insertAdjacentHTML(\'afterbegin\',this.dataset.kosong);this.remove()"'
      + ' data-kosong="' + esc(kosong) + '">'
      + (b.teks ? '<figcaption>' + teks(b.teks) + '</figcaption>' : '')
      + '</figure>'
      + (b.tandai && b.tandai.length
          ? '<ul class="hc-tandai">' + b.tandai.map(function(t,i){
              return '<li><span class="n">' + (i+1) + '</span><span>' + teks(t) + '</span></li>';
            }).join('') + '</ul>'
          : '')
      + '</div>';
  }
};

function gambarBlok(b){
  var f = b && BLOK[b.t];
  /* Jenis blok yang tidak dikenal DISEBUTKAN, bukan dilewati diam-diam.
     Dilewati, satu salah ketik ('tekas') menghapus satu paragraf panduan dan
     tidak ada satu pun tanda bahwa ada yang hilang. */
  if(!f) return '<div class="hc-note awas">Blok panduan tidak dikenal: <b>' + esc(b && b.t) + '</b></div>';
  return f(b);
}

/* ---------------------------- Pemuat panduan ---------------------------- */
/* Berkas panduan mendaftarkan dirinya ke ISI[kunci] lewat LM_HELP_ISI().
   Dimuat MALAS: orang yang cuma membuka panduan Reservasi tidak perlu ikut
   mengunduh panduan seluruh modul. */
var ISI = {};
window.LM_HELP_ISI = function(k, obj){ ISI[k] = obj; };

var STATUS = {};      /* kunci -> 'muat' | 'ada' | 'kosong' | 'rusak' */
var MENUNGGU = {};

function muatPanduan(k){
  if(STATUS[k]==='ada' || STATUS[k]==='kosong' || STATUS[k]==='rusak') return Promise.resolve(STATUS[k]);
  if(MENUNGGU[k]) return MENUNGGU[k];

  STATUS[k] = 'muat';
  MENUNGGU[k] = new Promise(function(res){
    var s = document.createElement('script');
    s.src = 'panduan/' + encodeURIComponent(k) + '.js';
    /* DUA kemungkinan gagal, dan keduanya wajib dibedakan dari berhasil:
         onerror                 -> berkasnya memang belum ada (404)
         onload + ISI[k] kosong  -> berkasnya ada tapi tidak mendaftarkan diri
                                    (salah ketik nama kunci, atau server
                                    memulangkan halaman galat ber-HTML)
       Disamakan, panduan yang SUDAH ditulis tapi salah kuncinya akan berbunyi
       "sedang disusun" selamanya, dan yang menulisnya tidak punya petunjuk. */
    s.onload  = function(){ STATUS[k] = ISI[k] ? 'ada' : 'rusak'; res(STATUS[k]); };
    s.onerror = function(){ STATUS[k] = 'kosong'; res(STATUS[k]); };
    document.head.appendChild(s);
  });
  return MENUNGGU[k];
}

/* ---------------------------- Sidebar ---------------------------- */
function gambarNav(aktif){
  var nav = document.getElementById('nav'), html = '';
  GRUP.forEach(function(g){
    var isi = MODUL.filter(function(m){ return (m.grup||'lainnya') === g.key; });
    /* Grup tanpa satu pun bab yang boleh dibuka orang ini tidak digambar sama
       sekali, bukan digambar kosong. Aturan yang sama dengan grup kartu di
       portal. */
    if(!isi.length) return;
    html += '<div class="sect">' + esc(g.label) + '</div>';
    isi.forEach(function(m){
      var k = kunci(m);
      html += '<a href="#/' + esc(k) + '"' + (k===aktif ? ' class="on"' : '') + '>'
            + '<span>' + esc(m.label) + '</span>'
            + (STATUS[k]==='kosong' ? '<span class="soon">Segera</span>' : '')
            + '</a>';
    });
  });
  /* Kunci yang dipegang orang ini tapi TIDAK ada di registri tetap disebut,
     bukan dihilangkan. Modul baru di portal yang belum didaftarkan di sini
     akan terbaca sebagai "Help-nya belum lengkap", bukan sebagai modul yang
     tidak ada. */
  var dikenal = {};
  (window.LM_HELP_MODUL||[]).forEach(function(m){ if(m.izin) dikenal[m.izin]=1; });
  var asing = SEMUA ? [] : MODS.filter(function(k){ return k!=='help' && k!=='*' && !dikenal[k]; });
  if(asing.length){
    html += '<div class="sect">Belum ada di Help</div>'
          + '<div style="padding:4px 10px;font-size:12px;color:var(--muted-2);line-height:1.5">'
          + esc(asing.join(', ')) + '</div>';
  }
  nav.innerHTML = html;
}

/* ---------------------------- Halaman ---------------------------- */
function setJudul(t){
  document.getElementById('judulAtas').textContent = t;
  document.title = t + ', Help Center Laksamana Muda';
}

function beranda(){
  setJudul('Help Center');
  var nama = esc(SESI.username || SESI.name || '');
  var html = '<div class="hc-head">'
    + '<h1>Help Center</h1>'
    + '<p class="sub">Panduan pemakaian Office Laksamana Muda' + (nama ? ', ' + nama : '') + '. '
    + 'Yang tampil di sini hanya modul yang memang bisa kamu buka, jadi daftarnya '
    + 'bisa berbeda dari daftar milik rekan kerjamu.</p></div>';

  GRUP.forEach(function(g){
    var isi = MODUL.filter(function(m){ return (m.grup||'lainnya') === g.key; });
    if(!isi.length) return;
    html += '<div class="hc-grup-jd">' + esc(g.label) + '</div><div class="hc-kartu">';
    isi.forEach(function(m){
      var k = kunci(m);
      html += '<a href="#/' + esc(k) + '">'
            + '<div class="jd">' + esc(m.label) + '</div>'
            + '<div class="ket">' + esc(m.ringkas||'') + '</div>'
            + (STATUS[k]==='kosong' ? '<span class="soon">Sedang disusun</span>' : '')
            + '</a>';
    });
    html += '</div>';
  });
  document.getElementById('isi').innerHTML = html;
  gambarNav('');
}

function gambarArtikel(m, bagianId){
  var k = kunci(m), d = ISI[k];
  setJudul(m.label);

  if(!d){
    var rusak = (STATUS[k]==='rusak');
    var pesan = rusak
      ? 'Berkas panduannya ada, tapi isinya tidak terbaca. Biasanya karena kunci yang '
      + 'didaftarkan di dalam berkas tidak sama dengan nama berkasnya.'
      : 'Panduan untuk modul ini belum ditulis. Modulnya sendiri tetap bisa dipakai '
      + 'seperti biasa, ini cuma dokumentasinya yang belum ada.';
    document.getElementById('isi').innerHTML =
        '<div class="hc-head"><h1>' + esc(m.label) + '</h1>'
      + '<p class="sub">' + esc(m.ringkas||'') + '</p></div>'
      + '<div class="hc-note ' + (rusak?'awas':'') + '" style="margin-top:22px">'
      + '<span class="jd">' + (rusak ? 'Panduan gagal dimuat' : 'Sedang disusun') + '</span>'
      + esc(pesan) + '</div>';
    gambarNav(k);
    return;
  }

  var bagian = d.bagian || [];
  var html = '<div class="hc-head"><h1>' + esc(m.label) + '</h1>'
    + '<p class="sub">' + teks(d.ringkas || m.ringkas || '') + '</p>'
    + (d.untuk ? '<div class="meta"><span class="pill"><span class="dot"></span>Dipakai oleh ' + esc(d.untuk) + '</span></div>' : '')
    + '</div>';

  if(bagian.length > 1){
    html += '<div class="hc-toc"><div class="lbl">Isi panduan</div><ol>'
      + bagian.map(function(s){
          return '<li><a href="#/' + esc(k) + '/' + esc(s.id) + '">' + esc(s.judul) + '</a></li>';
        }).join('')
      + '</ol></div>';
  }

  bagian.forEach(function(s){
    html += '<section class="hc-sec" id="bagian-' + esc(s.id) + '">'
      + '<h2>' + esc(s.judul) + '</h2>'
      + (s.isi||[]).map(gambarBlok).join('')
      + '</section>';
  });

  document.getElementById('isi').innerHTML = html;
  gambarNav(k);

  /* Gulir ke bagian yang diminta. Dilakukan SESUDAH isinya digambar; sebelum
     itu elemennya belum ada, dan gulirnya diam-diam tidak terjadi. */
  if(bagianId){
    var el = document.getElementById('bagian-' + bagianId);
    if(el) el.scrollIntoView({block:'start'});
  }else{
    window.scrollTo(0,0);
  }
}

/* ---------------------------- Pencarian ---------------------------- */
/* Mencari menuntut SELURUH panduan yang boleh dibaca orang ini sudah termuat;
   yang belum dimuat tidak bisa ditemukan, dan hasil yang diam-diam tidak
   lengkap lebih buruk daripada tidak ada pencarian sama sekali. */
var SIAP_CARI = false;
function siapkanCari(){
  if(SIAP_CARI) return Promise.resolve();
  return Promise.all(MODUL.map(function(m){ return muatPanduan(kunci(m)); }))
                .then(function(){ SIAP_CARI = true; });
}

function petik(t, q){
  var i = t.toLowerCase().indexOf(q);
  if(i < 0) return esc(t.slice(0,120));
  var a = Math.max(0, i-45), b = Math.min(t.length, i+q.length+65);
  return (a>0?'...':'') + esc(t.slice(a,i))
       + '<mark>' + esc(t.slice(i,i+q.length)) + '</mark>'
       + esc(t.slice(i+q.length,b)) + (b<t.length?'...':'');
}

/* Seluruh teks sebuah blok, untuk diindeks. Jenis blok baru yang lupa disebut
   di sini tidak melempar; isinya cuma tidak pernah bisa dicari. */
function tekaBlok(b){
  var out = [];
  if(b.judul) out.push(b.judul);
  if(typeof b.isi === 'string') out.push(b.isi);
  else if(Array.isArray(b.isi)) b.isi.forEach(function(x){
    if(typeof x === 'string') out.push(x);
    else if(x && (x.t || x.j)) out.push([x.t, x.j].join(' '));
  });
  if(Array.isArray(b.baris)) b.baris.forEach(function(r){ out.push(r.join(' ')); });
  if(Array.isArray(b.tandai)) out.push(b.tandai.join(' '));
  if(b.teks) out.push(b.teks);
  return out.join(' ');
}

function cari(q){
  q = String(q||'').trim().toLowerCase();
  setJudul('Hasil pencarian');
  var el = document.getElementById('isi');
  if(q.length < 2){
    el.innerHTML = '<div class="hc-kosong"><div class="ic">&#128269;</div>Ketik minimal dua huruf untuk mencari.</div>';
    return;
  }
  var hasil = [];
  MODUL.forEach(function(m){
    var k = kunci(m), d = ISI[k];
    if(!d) return;
    (d.bagian||[]).forEach(function(s){
      var t = [s.judul].concat((s.isi||[]).map(tekaBlok)).join(' ');
      if(t.toLowerCase().indexOf(q) > -1)
        hasil.push({ modul:m.label, kunci:k, bagian:s, petikan:petik(t,q) });
    });
  });

  if(!hasil.length){
    el.innerHTML = '<div class="hc-kosong"><div class="ic">&#128533;</div>'
      + 'Tidak ada panduan yang memuat <b>' + esc(q) + '</b>.<br>'
      + '<span style="font-size:13px">Pencarian hanya menyisir modul yang bisa kamu buka.</span></div>';
    return;
  }
  el.innerHTML = '<div class="hc-head"><h1>Hasil pencarian</h1>'
    + '<p class="sub">' + hasil.length + ' bagian memuat <b>' + esc(q) + '</b>.</p></div>'
    + '<div class="hc-hasil" style="margin-top:18px">'
    + hasil.map(function(h){
        return '<a href="#/' + esc(h.kunci) + '/' + esc(h.bagian.id) + '">'
             + '<div class="br">' + esc(h.modul) + '</div>'
             + '<div class="jd">' + esc(h.bagian.judul) + '</div>'
             + '<div class="cp">' + h.petikan + '</div></a>';
      }).join('')
    + '</div>';
  gambarNav('');
}

/* ---------------------------- Router ---------------------------- */
function buka(){
  document.getElementById('hc').classList.remove('buka');
  var p = location.hash.replace(/^#\/?/, '').split('/');
  var k = p[0] || '';

  if(!k){ beranda(); return; }

  var m = cariModul(k);
  /* Kunci yang tidak dikenal DAN kunci yang tidak boleh dibuka orang ini
     sama-sama dipulangkan ke beranda. Kalau dibedakan pesannya, halaman ini
     jadi alat untuk menebak modul apa saja yang ada di perusahaan. */
  if(!m){ location.replace('#/'); beranda(); return; }

  muatPanduan(k).then(function(){ gambarArtikel(m, p[1] || ''); });
}

/* ---------------------------- Mulai ---------------------------- */
var tundaCari = null;
document.getElementById('cari').addEventListener('input', function(e){
  var v = e.target.value;
  clearTimeout(tundaCari);
  tundaCari = setTimeout(function(){
    if(!String(v).trim()){ location.hash = '#/'; return; }
    siapkanCari().then(function(){
      /* Kotaknya dibaca ULANG, bukan memakai nilai saat penundaan dijadwalkan:
         memuat panduan butuh waktu, dan yang mengetik terus akan mendapat
         hasil untuk kata yang sudah tidak ada lagi di kotaknya. */
      cari(document.getElementById('cari').value);
    });
  }, 180);
});

document.getElementById('burger').addEventListener('click', function(){
  document.getElementById('hc').classList.toggle('buka');
});
document.getElementById('tirai').addEventListener('click', function(){
  document.getElementById('hc').classList.remove('buka');
});

/* ---------- Blok pemakai & tombol Keluar ----------
   TOMBOLNYA TIDAK MENGHAPUS `lm_session`, dan itu bukan kelalaian: aturan
   yang sama persis dengan tombol daya di sembilan modul lain (lihat
   `doLogout()` di deploy/reservasi/). Ia memulangkan orang ke pemilih modul
   supaya bisa pindah modul tanpa memasukkan PIN lagi; sign-out penuh memang
   hanya lewat tombol Keluar di Office sendiri.

   Ikon yang sama di posisi yang sama tidak boleh berarti dua hal berbeda:
   yang sudah terbiasa "daya = kembali ke Office" di modul lain akan
   kehilangan sesinya di sini tanpa pernah memintanya. Karena itu judulnya pun
   ditulis **Keluar ke Office**, bukan "Keluar" saja. */
(function(){
  var nama = (SESI.name || SESI.username || '').trim();
  var ket  = (SESI.keterangan || '').trim();
  document.getElementById('uNama').textContent = nama || 'Tidak dikenal';
  document.getElementById('uKet').textContent  = ket || 'Office';
  /* Inisial dari dua kata pertama; nama satu kata memberi satu huruf. Kalau
     namanya kosong, jangan gambar huruf karangan — tanda tanya mengatakan
     sesinya memang tidak membawa nama. */
  var ini = nama ? nama.split(/\s+/).slice(0, 2).map(function(w){ return w[0]; }).join('').toUpperCase() : '?';
  document.getElementById('uAv').textContent = ini;

  document.getElementById('keluar').addEventListener('click', function(){
    location.href = '../';
  });
})();

window.addEventListener('hashchange', buka);

/* Status "kosong" tiap bab baru diketahui SESUDAH berkasnya dicoba muat, dan
   sidebar memakainya untuk menandai "Segera". Beranda karena itu memuat
   seluruh bab yang boleh dibaca orang ini sekali di awal; jumlahnya kecil
   (teks saja), dan tanpa itu penanda "Sedang disusun" baru muncul sesudah
   babnya sempat dibuka satu per satu. */
gambarNav('');
siapkanCari().then(buka);
})();
</script>
