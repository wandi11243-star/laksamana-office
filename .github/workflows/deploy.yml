      # HOSTNAME PRODUKSI ADALAH team.laksamanamuda.id, BUKAN office.laksamanamuda.id.
      # Yang kedua sudah tidak punya catatan DNS sama sekali (NXDOMAIN), jadi
      # SELURUH langkah verifikasi di bawah selalu gagal — sementara file-nya
      # sebenarnya mendarat dengan benar. Akibatnya deploy produksi selalu
      # merah, dan lampu merah yang selalu menyala berhenti berarti apa pun:
      # kegagalan yang sungguhan pun tidak akan disadari siapa pun.
      # Diperbaiki 7 Agustus 2026, sesudah dipastikan satu per satu bahwa tiap
      # alamat di bawah menjawab 200 di team.laksamanamuda.id.

      # Deploy FTP bisa "sukses" walau file terpotong ATAU sama sekali tidak mendarat,
      # jadi jangan percaya status hijau saja. Cek "</html>" saja TIDAK CUKUP: file LAMA
      # yang masih utuh (dan halaman 404) juga punya </html>, sehingga deploy yang gagal
      # total tetap dilaporkan OK. Maka isinya dibandingkan langsung dengan repo.
      # FTP mengubah CRLF→LF, jadi \r dibuang dulu di kedua sisi.
      # if: always() — verifikasi tetap jalan walau kedua percobaan FTP gagal,
      # supaya laporannya menyebut file MANA yang tertinggal, bukan sekadar
      # "FTP gagal".
      # Memakai skrip yang SAMA dengan deploy dev (6 Agustus 2026). Sebelumnya
      # loop-nya disalin di sini dengan daftar modulnya sendiri — dan salinan
      # itu sudah lebih pendek daripada milik dev: stock/ordering, stock/
      # purchasing, stock/usage, stock/tree, service_excellent, howandi_life,
      # hr, radar, dan ticketing semuanya tidak pernah diperiksa di produksi.
      # Dua salinan daftar yang harus diingat manusia berarti dua daftar yang
      # lambat laun berbeda, dan yang tertinggal justru modul terbaru — yang
      # paling mungkin baru saja berubah. Skripnya sendiri sekarang membaca
      # daftar itu dari repo, jadi tidak ada lagi yang perlu diingat.
      # `ticketing=` WAJIB ADA DI PRODUKSI, dan tidak boleh ikut ke dev.
      # Situs customer punya alamat sendiri di laksamanamuda.id/ticketing dan
      # SENGAJA dikecualikan dari unggahan Office di atas (exclude:
      # ticketing/**). Tanpa pengalihan ini, verifikasi mencarinya di
      # team.laksamanamuda.id — host yang memang tidak pernah memilikinya —
      # lalu menggagalkan SETIAP deploy produksi dengan 404 setinggi 1.251
      # byte, untuk berkas yang sudah mendarat sempurna di tempat yang benar.
      # Di dev tidak perlu: di sana seluruh deploy/ diunggah apa adanya, jadi
      # dev.laksamanamuda.id/ticketing/ memang alamat yang benar.
      - name: Verifikasi file di server benar-benar versi ini
        id: cek1
        if: always()
        continue-on-error: true
        run: |
          bash tools/verifikasi-deploy.sh https://team.laksamanamuda.id \
               ticketing=https://laksamanamuda.id/ticketing

      # ==================================================================
      # UNGGAH PAKSA — SALINAN dari deploy-dev.yml, dan sengaja disamakan.
      #
      # Sampai 20 Agustus 2026 jaring ini cuma ada di dev. Akibatnya persis
      # yang bisa diduga: dev selalu mendarat, produksi kadang tidak, dan
      # bedanya bukan pada berkasnya. 20 Agustus 2026 deploy produksi gagal
      # dengan SATU berkas tertinggal — deploy/bd/index.html — sementara
      # berkas yang sama sudah mendarat sempurna di dev dari commit yang
      # sama. Server memegang versi commit sebelumnya UTUH (221.942 byte,
      # bukan terpotong), dan `.ftp-deploy-sync-state.json` di server masih
      # bertanggal run sebelumnya: aksi FTP tidak pernah menyelesaikan sinkron
      # hari itu, dan percobaan 1-3 tidak menolong karena ketiganya memakai
      # state yang sama.
      #
      # Cara kerjanya sama dengan di dev: `state-name` unik per run membuat
      # aksi tidak menemukan state apa pun, jadi ia mengunggah SEMUANYA tanpa
      # bertanya pada catatan lama. BUKAN `dangerous-clean-slate` — itu
      # menghapus berkas server yang tidak ada di local-dir, dan local-dir
      # kita (./deploy/) tidak memuat satu pun folder backend: seluruh API
      # akan ikut terhapus.
      #
      # `exclude: ticketing/**` WAJIB ikut, sama seperti unggahan utama di
      # atas. Tanpa itu unggah paksa justru MENCIPTAKAN salinan kedua di
      # office/ticketing/ yang pasti rusak — ../ticketing-api/ dari sana
      # menunjuk folder yang tak pernah ada.
      #
      # Hanya jalan kalau verifikasi gagal, jadi run normal tetap secepat
      # dulu. Efek sampingnya satu berkas state kecil tertinggal per run yang
      # gagal; jauh lebih murah daripada produksi yang diam-diam tidak
      # berubah sementara Actions-nya merah tanpa jalan keluar selain
      # menunggu commit berikutnya.
      # ==================================================================
      - name: Unggah paksa (abaikan sync-state) karena verifikasi gagal
        if: always() && steps.cek1.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy/
          server-dir: /public_html/office/
          exclude: |
            ticketing/**
          state-name: .ftp-deploy-paksa-${{ github.run_id }}.json
          timeout: 300000

      # Situs customer punya alamat sendiri, jadi unggah paksa office di atas
      # TIDAK menyentuhnya — padahal verifikasi ikut memeriksanya lewat
      # `ticketing=`. Tanpa langkah ini, kegagalan yang cuma mengenai
      # ticketing akan melewati seluruh jaring pengaman lalu tetap merah di
      # gerbang terakhir, tanpa satu pun percobaan yang bisa memperbaikinya.
      - name: Unggah paksa situs customer ticketing
        if: always() && steps.cek1.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy/ticketing/
          server-dir: /public_html/ticketing/
          state-name: .ftp-deploy-paksa-tix-${{ github.run_id }}.json
          timeout: 300000

      # Gerbangnya VERIFIKASI, bukan outcome langkah FTP di atasnya: unggah
      # paksa bisa saja melaporkan sukses padahal berkasnya dilewati — itu
      # justru penyakit yang sedang diobati di sini.
      - name: Verifikasi setelah unggah paksa
        id: cek2
        if: always() && steps.cek1.outcome == 'failure'
        continue-on-error: true
        run: |
          bash tools/verifikasi-deploy.sh https://team.laksamanamuda.id \
               ticketing=https://laksamanamuda.id/ticketing

      # Jeda panjang: kegagalan yang sampai di sini bukan gangguan sesaat
      # (sudah lewat 1-3 percobaan biasa + 1 unggah paksa), jadi menembak
      # lagi dalam hitungan detik menabrak dinding yang sama.
      - name: Jeda sebelum unggah paksa 2
        if: always() && steps.cek2.outcome == 'failure'
        run: sleep 90

      - name: Unggah paksa 2 (kesempatan terakhir)
        if: always() && steps.cek2.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy/
          server-dir: /public_html/office/
          exclude: |
            ticketing/**
          state-name: .ftp-deploy-paksa2-${{ github.run_id }}.json
          timeout: 300000

      # Penentu lulus/tidaknya seluruh unggahan frontend. TANPA
      # continue-on-error: inilah satu-satunya langkah verifikasi berkas yang
      # boleh menggagalkan job. Kalau ia ikut dilonggarkan, deploy yang tidak
      # pernah mendarat akan berakhir HIJAU — persis kebalikan dari gunanya
      # berkas ini.
      - name: Verifikasi ulang (penentu lulus/tidak)
        if: always()
        run: |
          bash tools/verifikasi-deploy.sh https://team.laksamanamuda.id \
               ticketing=https://laksamanamuda.id/ticketing

      # Berkas PHP tidak bisa dibandingkan isinya lewat HTTP — yang dikirim
      # server adalah hasil eksekusinya. Jadi yang diuji perilakunya.
      # env=produksi diperiksa lebih dulu: config yang tertukar (produksi
      # menunjuk database dev, atau sebaliknya) adalah kesalahan termahal di
      # repo ini, dan ping memang dibuat untuk menangkapnya.
      - name: Verifikasi backend hidup dan versi terbaru
        if: always()
        run: |
          gagal=0

          echo "--- account-api-mysql ---"
          acc=$(curl -s -m 60 "https://team.laksamanamuda.id/account-api-mysql/api.php?action=ping&ci=$GITHUB_SHA")
          echo "ping: $acc"
          case "$acc" in
            *'"env":"produksi"'*) echo "OK      env=produksi" ;;
            *) echo "GAGAL   env BUKAN produksi — config.php salah atau API tidak terjangkau"; gagal=1 ;;
          esac

          who=$(curl -s -m 60 -X POST "https://team.laksamanamuda.id/account-api-mysql/api.php" \
                  -H 'Content-Type: text/plain;charset=utf-8' \
                  -d '{"action":"whoami","token":"ci-probe-token-yang-pasti-salah"}')
          echo "whoami: $who"
          case "$who" in
            *invalid_token*) echo "OK      whoami dikenal (versi baru mendarat)" ;;
            *unknown_action*) echo "GAGAL   whoami TIDAK dikenal — api.php di server masih versi lama"; gagal=1 ;;
            *) echo "GAGAL   whoami menjawab tak terduga"; gagal=1 ;;
          esac

          echo "--- stock-api-mysql ---"
          stk=$(curl -s -m 60 "https://team.laksamanamuda.id/stock-api-mysql/usage.php?action=ping&ci=$GITHUB_SHA")
          echo "ping: $stk"
          case "$stk" in
            *'"env":"produksi"'*) echo "OK      env=produksi" ;;
            *) echo "GAGAL   env BUKAN produksi — config.php salah atau API tidak terjangkau"; gagal=1 ;;
          esac

          # ?action=ping TIDAK cukup: _boot menjawabnya lalu berhenti SEBELUM
          # lib_stock_catat di-require, jadi galat parse di sana tidak ketahuan.
          kode=$(curl -s -m 60 -o /tmp/usage.json -w '%{http_code}' \
                 "https://team.laksamanamuda.id/stock-api-mysql/usage.php?dari=2000-01-01&ke=2000-01-02&ci=$GITHUB_SHA")
          echo "daftar usage: HTTP $kode -> $(head -c 200 /tmp/usage.json)"
          if [ "$kode" = "200" ]; then
            echo "OK      usage.php memuat lib_stock_catat tanpa galat"
          else
            echo "GAGAL   usage.php balas HTTP $kode — kemungkinan galat PHP di lib_stock_catat.php"
            gagal=1
          fi

          echo "--- marketing-api-mysql ---"
          mkt=$(curl -s -m 60 "https://team.laksamanamuda.id/marketing-api-mysql/api.php?action=ping&ci=$GITHUB_SHA")
          echo "ping: $mkt"
          case "$mkt" in
            *'"env":"produksi"'*) echo "OK      env=produksi" ;;
            *) echo "GAGAL   env BUKAN produksi — config.php salah atau API tidak terjangkau"; gagal=1 ;;
          esac

          # Versi lib dibandingkan dengan yang ada di repo. Ini pembeda TEPAT
          # antara lib yang baru mendarat dan lib lama yang masih jalan —
          # keduanya sama-sama menjawab ping dengan env=produksi.
          repo_versi=$(sed -n "s/.*LIB_VERSI', *'\([^']*\)'.*/\1/p" marketing-mysql/lib_marketing_mysql.php)
          echo "versi di repo: $repo_versi"
          case "$mkt" in
            *"\"versi\":\"$repo_versi\""*) echo "OK      versi lib di server = repo" ;;
            *) echo "GAGAL   versi lib di server BUKAN $repo_versi — lib lama masih jalan"; gagal=1 ;;
          esac

          # stats memuat key_terpakai() + gc — kalau ada galat parse di sana,
          # ping tetap lolos tapi stats tidak. Sekalian melaporkan berkas yang
          # keynya tercatat tapi filenya sudah tidak ada.
          kode=$(curl -s -m 60 -o /tmp/mkt.json -w '%{http_code}' \
                 "https://team.laksamanamuda.id/marketing-api-mysql/api.php?action=stats&ci=$GITHUB_SHA")
          echo "stats: HTTP $kode -> $(head -c 300 /tmp/mkt.json)"
          if [ "$kode" = "200" ]; then
            echo "OK      stats jalan (key_terpakai & gc termuat tanpa galat)"
          else
            echo "GAGAL   stats balas HTTP $kode — kemungkinan galat PHP di lib_marketing_mysql.php"
            gagal=1
          fi

          echo "--- kompas-api-mysql ---"
          kmp=$(curl -s -m 60 "https://team.laksamanamuda.id/kompas-api-mysql/api.php?action=ping&ci=$GITHUB_SHA")
          echo "ping: $kmp"
          case "$kmp" in
            *'"env":"produksi"'*) echo "OK      env=produksi" ;;
            *) echo "GAGAL   env BUKAN produksi — config.php salah atau API tidak terjangkau"; gagal=1 ;;
          esac

          # ?action=ping cuma menyentuh config; stats benar-benar menjalankan
          # query lewat lib_kompas_mysql — jadi galat parse / skema hilang yang
          # lolos dari ping akan tertangkap di sini.
          kode=$(curl -s -m 60 -o /tmp/kmp.json -w '%{http_code}' \
                 "https://team.laksamanamuda.id/kompas-api-mysql/api.php?action=stats&ci=$GITHUB_SHA")
          echo "stats: HTTP $kode -> $(head -c 300 /tmp/kmp.json)"
          if [ "$kode" = "200" ]; then
            echo "OK      stats jalan (lib_kompas_mysql termuat tanpa galat)"
          else
            echo "GAGAL   stats balas HTTP $kode — kemungkinan galat PHP di lib_kompas_mysql.php"
            gagal=1
          fi

          # HTTP 200 saja TIDAK membuktikan versi barunya mendarat: backend lama
          # (multi-tabel) juga membalas 200, cuma bentuknya {daily,targets,
          # cashiers,pics,settings,log}. Justru itu yang lolos tanpa ketahuan
          # sampai 27 Juli 2026. Penyimpan blob membalas {bytes,updated_at,ada},
          # jadi kunci "ada" dipakai sebagai penanda versi — sepadan dengan
          # probe whoami milik account.
          case "$(cat /tmp/kmp.json)" in
            *'"ada"'*) echo "OK      stats berbentuk blob (versi baru mendarat)" ;;
            *) echo "GAGAL   stats masih berbentuk multi-tabel — lib_kompas_mysql.php di server MASIH VERSI LAMA"; gagal=1 ;;
          esac

          # ping cuma baca konstanta config dan stats MENELAN galat DB
          # (catch Throwable -> ada:false), jadi keduanya BUTA terhadap
          # kredensial/grant yang salah. Itu persis yang terjadi di dev 27 Juli
          # 2026: modul kelihatan hidup, tapi setiap simpan ditolak MySQL 1044.
          # saveAll TANPA field `data` memaksa jalur tulis dibuka — db_lock()
          # menyentuh DB lebih dulu — lalu berhenti di validasi payload, jadi
          # TIDAK ADA yang ditulis. "Payload kosong/invalid" = koneksi sehat.
          probe=$(curl -s -m 60 -X POST "https://team.laksamanamuda.id/kompas-api-mysql/api.php" \
                    -H 'Content-Type: text/plain;charset=utf-8' \
                    -d '{"action":"saveAll"}')
          echo "probe tulis: $(printf '%s' "$probe" | head -c 300)"
          case "$probe" in
            *'Payload kosong'*) echo "OK      koneksi DB sehat, jalur simpan terbuka" ;;
            *SQLSTATE*)         echo "GAGAL   DB menolak — cek user/grant di cPanel untuk database kompas"; gagal=1 ;;
            *)                  echo "GAGAL   probe menjawab tak terduga"; gagal=1 ;;
          esac

          echo "--- jadwal-api-mysql ---"
          jdw=$(curl -s -m 60 "https://team.laksamanamuda.id/jadwal-api-mysql/api.php?action=ping&ci=$GITHUB_SHA")
          echo "ping: $jdw"
          case "$jdw" in
            *'"env":"produksi"'*) echo "OK      env=produksi" ;;
            *) echo "GAGAL   env BUKAN produksi — config.php belum diunggah manual ke /jadwal-api-mysql/, atau config DEV salah terpasang di sini"; gagal=1 ;;
          esac

          # Probe tulis: membuka transaksi (dan CREATE TABLE IF NOT EXISTS)
          # lalu commit TANPA menulis satu baris pun.
          #
          # Aksinya `probeTulis`, BUKAN lagi `simpanSel`. Sejak simpanSel
          # dijaga sesi Office (14 Agustus 2026), probe lama dijawab
          # `sesi_tidak_sah` dan SELURUH deploy gagal — CI tidak punya sesi
          # Office dan tidak seharusnya punya. probeTulis sengaja terbuka: ia
          # tidak menerima parameter, tidak menulis apa pun, dan tidak
          # memulangkan satu baris data pun.
          # (lanjutan alasan lama:) simpanSel TANPA rows/hapus membuka transaksi (dan
          # CREATE TABLE IF NOT EXISTS) lalu commit tanpa menulis apa pun.
          # Ini menyentuh DB sungguhan, jadi grant yang salah muncul sebagai
          # SQLSTATE — sesuatu yang ping dan stats sama sekali tidak bisa
          # lihat (stats menelan galat DB dan membalas nol).
          jdwp=$(curl -s -m 60 -X POST "https://team.laksamanamuda.id/jadwal-api-mysql/api.php" \
                   -H 'Content-Type: text/plain;charset=utf-8' \
                   -d '{"action":"probeTulis"}')
          echo "probe tulis: $(printf '%s' "$jdwp" | head -c 300)"
          case "$jdwp" in
            *'"isi":0'*) echo "OK      koneksi DB sehat, tabel siap, tidak ada baris ditulis" ;;
            *SQLSTATE*)  echo "GAGAL   DB menolak — cek user/grant di cPanel untuk database jadwal"; gagal=1 ;;
            *)           echo "GAGAL   probe menjawab tak terduga"; gagal=1 ;;
          esac

          # --- dw-api-mysql ---------------------------------------------
          # Database dan config.php kedua lingkungan sudah terpasang (5 Agustus
          # 2026), jadi gerbangnya sekarang KERAS seperti jadwal di atas.
          echo "--- dw-api-mysql ---"
          dwp=$(curl -s -m 60 "https://team.laksamanamuda.id/dw-api-mysql/api.php?action=ping&ci=$GITHUB_SHA")
          echo "ping: $dwp"
          case "$dwp" in
            *'"env":"produksi"'*) echo "OK      env=produksi" ;;
            *) echo "GAGAL   env BUKAN produksi — config.php belum diunggah manual ke /dw-api-mysql/, atau config DEV salah terpasang di sini"; gagal=1 ;;
          esac

          # ping HANYA membacakan isi config.php — ia tetap hijau walau database
          # menolak kredensialnya, karena tidak satu pun kueri dijalankan di sana.
          # Itu sudah menyembunyikan user MySQL yang passwordnya tidak cocok
          # selama satu siklus deploy penuh pada 5 Agustus 2026: ping OK, env
          # benar, dan modulnya tetap tidak bisa menyimpan apa pun.
          # stats-lah yang menyentuh DB sungguhan dan melaporkan "ada":true.
          dws=$(curl -s -m 60 "https://team.laksamanamuda.id/dw-api-mysql/api.php?action=stats&ci=$GITHUB_SHA")
          echo "stats: $(printf '%s' "$dws" | head -c 300)"
          case "$dws" in
            *'"ada":true'*) echo "OK      koneksi DB sehat, tabel siap" ;;
            *1045*)      echo "GAGAL   user/password MySQL dw tidak cocok dengan config.php — samakan lewat cPanel > MySQL Databases > Change Password"; gagal=1 ;;
            *1044*)      echo "GAGAL   user MySQL dw belum di-Add User To Database (ALL PRIVILEGES)"; gagal=1 ;;
            *SQLSTATE*)  echo "GAGAL   DB menolak — cek user/grant di cPanel untuk database dw"; gagal=1 ;;
            *)           echo "GAGAL   stats menjawab tak terduga"; gagal=1 ;;
          esac

          exit $gagal
