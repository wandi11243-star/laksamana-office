name: Deploy to Rumahweb

on:
  push:
    branches: [ main ]

jobs:
  web-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ==================================================================
      # PROBE FTP — LANGKAH PERTAMA, DAN HASILNYA DITULIS KE RINGKASAN RUN
      #
      # Kenapa ada: 20-21 Agustus 2026 deploy produksi gagal tiga kali
      # berturut-turut dengan gejala yang sama — berkas yang berubah tidak
      # mendarat, `.ftp-deploy-sync-state.json` di server tidak ikut ter-
      # perbarui (artinya aksi FTP tidak pernah menyelesaikan sinkron), dan
      # dev dengan commit yang sama mendarat mulus. Jelas gangguannya di
      # koneksi/akun FTP produksi, bukan di repo.
      #
      # Masalahnya SEBABNYA tidak pernah sampai ke orang yang bisa
      # memperbaikinya. Pesan aslinya ada di dalam langkah "Deploy via FTP",
      # yang bertanda continue-on-error sehingga ikonnya TIDAK merah — jadi
      # yang membuka run gagal langsung menuju langkah merah di paling bawah
      # (Verifikasi), membaca "berkas beda dari repo", dan menyimpulkan yang
      # salah adalah berkasnya.
      #
      # Langkah ini menerjemahkan kode keluar curl jadi satu kalimat yang
      # menyebut APA yang harus dibetulkan, lalu menuliskannya ke
      # $GITHUB_STEP_SUMMARY — halaman ringkasan run, yang terbuka duluan
      # tanpa perlu membentangkan langkah apa pun.
      #
      # TANPA `-v`. Mode verbose curl mencetak percakapan FTP lengkap; itu
      # menambah risiko tanpa menambah kejelasan, karena baris ringkas
      # "curl: (67) ... 530" sudah menyebut sebabnya.
      # ==================================================================
      - name: Probe FTP & tulis diagnosis ke ringkasan run
        if: always()
        continue-on-error: true
        env:
          FTP_SERVER:   ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set +e
          # Secret-nya diisi manusia dan bisa saja memuat skema atau garis
          # miring di ujung ("ftp://host/"). Aksi FTP di bawah memaafkannya,
          # curl tidak — dan probe yang salah bentuk akan melapor "URL
          # malformed" seolah servernya yang bermasalah.
          HOST="${FTP_SERVER#ftp://}"; HOST="${HOST#ftps://}"; HOST="${HOST%/}"
          probe() {
            curl -sS --connect-timeout 20 --max-time 60 \
                 --user "$FTP_USERNAME:$FTP_PASSWORD" \
                 "ftp://$HOST$1" -o /dev/null 2>"/tmp/ftp_err$2.txt"
            echo $?
          }
          artinya() {
            case "$1" in
              0)  echo "OK — login berhasil & folder terbaca" ;;
              3)  echo "Alamat FTP salah bentuk. Periksa isi secret **FTP_SERVER** (harus nama host saja, tanpa \`ftp://\`)." ;;
              6)  echo "Nama server tidak bisa di-resolve. Secret **FTP_SERVER** salah, atau DNS-nya berubah." ;;
              7)  echo "Koneksi ditolak / tidak sampai. Port 21 diblokir — besar kemungkinan IP runner GitHub kena firewall (CSF) Rumahweb. **Minta whitelist ke support Rumahweb.**" ;;
              28) echo "Timeout, server tidak menjawab dalam 60 detik. Server sedang bermasalah atau koneksinya disaring." ;;
              67) echo "**LOGIN DITOLAK (530).** Secret **FTP_USERNAME / FTP_PASSWORD** sudah tidak cocok, atau akun FTP-nya dihapus. PALING SERING: FTP_USERNAME adalah user cPanel utama, jadi passwordnya = password cPanel — begitu password cPanel diganti (sendiri atau dipaksa Rumahweb), deploy mati seketika. Perbaikan tahan lama: buat akun FTP KHUSUS deploy dengan Directory \`/\`, lalu simpan passwordnya di secret." ;;
              9)  echo "Login berhasil TAPI foldernya tidak bisa dibuka. **server-dir** di workflow ini menunjuk path yang sudah tidak ada, atau hak aksesnya berubah." ;;
              *)  echo "Gagal dengan kode curl $1 — lihat cuplikan di bawah." ;;
            esac
          }
          r1=$(probe "/" 1)
          r2=$(probe "/public_html/office/" 2)
          e1=$(tail -n 2 /tmp/ftp_err1.txt 2>/dev/null | tr -d '\r')
          e2=$(tail -n 2 /tmp/ftp_err2.txt 2>/dev/null | tr -d '\r')
          {
            echo "## Diagnosis koneksi FTP produksi"
            echo ""
            if [ "$r1" = "0" ] && [ "$r2" = "0" ]; then
              echo "✅ **FTP produksi sehat** — login berhasil dan \`/public_html/office/\` terbaca."
              echo ""
              echo "Kalau run ini tetap gagal di langkah Verifikasi, berarti sambungannya baik"
              echo "tapi transfernya yang putus. Jaring \"unggah paksa\" di bawah sudah menanganinya."
            else
              echo "❌ **FTP produksi TIDAK BISA DIPAKAI.** Ini yang membuat deploy gagal —"
              echo "bukan isi berkasnya. Selama ini belum dibetulkan, setiap deploy ke \`main\`"
              echo "akan gagal dengan gejala yang sama."
            fi
            echo ""
            echo "| Yang dicoba | Kode curl | Artinya |"
            echo "|---|---|---|"
            echo "| Login + buka \`/\` | $r1 | $(artinya "$r1") |"
            echo "| Buka \`/public_html/office/\` | $r2 | $(artinya "$r2") |"
            echo ""
            if [ -n "$e1$e2" ]; then
              echo "<details><summary>Pesan mentah dari curl</summary>"
              echo ""
              echo '```'
              [ -n "$e1" ] && echo "/            : $e1"
              [ -n "$e2" ] && echo "/public_html/office/ : $e2"
              echo '```'
              echo ""
              echo "</details>"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
          # `tee`, bukan `>>` saja. Ketahuan 21 Agustus 2026: RINGKASAN RUN
          # TIDAK IKUT dalam "Download log archive". Waktu log lengkapnya
          # akhirnya diunduh untuk dibaca, langkah ini justru satu-satunya yang
          # kosong — diagnosanya ada, tapi di halaman yang tidak ikut terunduh.
          # Sekarang kalimatnya muncul di DUA tempat: ringkasan run (buat yang
          # membuka di browser) dan log langkah ini (buat yang mengunduhnya).
          #
          # Selalu sukses: ini diagnosa, bukan gerbang. Yang menentukan
          # lulus/tidaknya deploy tetap langkah Verifikasi di bawah.
          exit 0

      # continue-on-error + percobaan ulang di bawah: transfer FTP ke Rumahweb
      # kadang putus tanpa sebab yang bisa kita kendalikan. Kegagalan di sini
      # tidak langsung menggagalkan job; yang menentukan tetap langkah
      # Verifikasi, yang membandingkan isi file di server dengan repo.
      - name: Deploy via FTP
        id: ftp1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy/
          server-dir: /public_html/office/
          # Situs customer punya alamatnya sendiri di /public_html/ticketing/
          # (lihat langkah terpisah di bawah). Kalau ikut tersalin ke sini,
          # ada salinan kedua di office/ticketing/ yang PASTI rusak:
          # ../ticketing-api/ dari sana menunjuk folder yang tak pernah ada.
          exclude: |
            ticketing/**
          # Default action ini 30 detik per operasi FTP. Koneksi ke Rumahweb
          # sering lebih lambat dari itu untuk file besar (marketing ~400KB),
          # sehingga transfer diputus DI TENGAH: file di server jadi terpotong
          # dan JS-nya rusak, TAPI action tetap melaporkan "sukses" — modul
          # mati tanpa ada yang sadar. Sudah kejadian 2x pada 16 Juli 2026
          # (terpotong di 65KB lalu 234KB dari 403KB).
          timeout: 300000

      # Percobaan ke-2 dan ke-3, masing-masing hanya bila yang sebelumnya gagal.
      # Dua percobaan terbukti belum cukup untuk file besar (lihat catatan di
      # deploy-dev.yml): putus di tengah transfer bisa berulang beberapa kali.
      # JEDA sebelum mencoba lagi — lihat catatan di deploy-dev.yml.
      - name: Jeda sebelum percobaan 2
        if: steps.ftp1.outcome == 'failure'
        run: sleep 45

      - name: Deploy via FTP (percobaan 2)
        id: ftp2
        continue-on-error: true
        if: steps.ftp1.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy/
          server-dir: /public_html/office/
          # Situs customer punya alamatnya sendiri di /public_html/ticketing/
          # (lihat langkah terpisah di bawah). Kalau ikut tersalin ke sini,
          # ada salinan kedua di office/ticketing/ yang PASTI rusak:
          # ../ticketing-api/ dari sana menunjuk folder yang tak pernah ada.
          exclude: |
            ticketing/**
          timeout: 300000

      - name: Jeda sebelum percobaan 3
        if: steps.ftp1.outcome == 'failure' && steps.ftp2.outcome == 'failure'
        run: sleep 120

      - name: Deploy via FTP (percobaan 3)
        if: steps.ftp1.outcome == 'failure' && steps.ftp2.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy/
          server-dir: /public_html/office/
          # Situs customer punya alamatnya sendiri di /public_html/ticketing/
          # (lihat langkah terpisah di bawah). Kalau ikut tersalin ke sini,
          # ada salinan kedua di office/ticketing/ yang PASTI rusak:
          # ../ticketing-api/ dari sana menunjuk folder yang tak pernah ada.
          exclude: |
            ticketing/**
          timeout: 300000

      # ==================================================================
      # BACKEND (account-api-mysql & stock-api-mysql)
      # ------------------------------------------------------------------
      # Ada DI LUAR deploy/, jadi sebelumnya tidak pernah ikut terkirim dan
      # harus diunggah manual — sumber kejadian berulang "frontend baru,
      # backend lama" yang gejalanya cuma fitur diam tanpa error.
      #
      # Nama folder di server BEDA dari repo (account-mysql ->
      # account-api-mysql), mengikuti path yang dipakai frontend.
      #
      # config*.php TIDAK ikut: berisi password, dan produksi wajib
      # menunjuk database produksi sementara dev menunjuk database dev.
      # Mengirimnya dari repo justru akan menyeragamkan keduanya — persis
      # kesalahan yang paling mahal di sini. *.sql & *.md juga tidak ikut:
      # skema database tidak boleh bisa diunduh lewat URL biasa.
      # ==================================================================
      - name: Deploy backend account-api-mysql
        id: ftpacc
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./account-mysql/
          server-dir: /public_html/office/account-api-mysql/
          exclude: |
            config*.php
            **/config*.php
            *.sql
            **/*.sql
            *.md
            **/*.md
          timeout: 300000

      - name: Deploy backend account-api-mysql (percobaan 2)
        if: steps.ftpacc.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./account-mysql/
          server-dir: /public_html/office/account-api-mysql/
          exclude: |
            config*.php
            **/config*.php
            *.sql
            **/*.sql
            *.md
            **/*.md
          timeout: 300000

      - name: Deploy backend stock-api-mysql
        id: ftpstock
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./stock-mysql/
          server-dir: /public_html/office/stock-api-mysql/
          exclude: |
            config*.php
            **/config*.php
            *.sql
            **/*.sql
            *.md
            **/*.md
          timeout: 300000

      - name: Deploy backend stock-api-mysql (percobaan 2)
        if: steps.ftpstock.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./stock-mysql/
          server-dir: /public_html/office/stock-api-mysql/
          exclude: |
            config*.php
            **/config*.php
            *.sql
            **/*.sql
            *.md
            **/*.md
          timeout: 300000

      # marketing-mysql tadinya SATU-SATUNYA backend yang masih diunggah manual
      # lewat zip. Itu bukan kelalaian kecil: perbaikan penghapus lampiran ada
      # di lib ini, dan perbaikan backend yang tidak pernah terunggah sama
      # dengan tidak diperbaiki. Gejalanya pun tidak berupa error — cuma
      # lampiran yang hilang berhari-hari kemudian.
      - name: Deploy backend marketing-api-mysql
        id: ftpmkt
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./marketing-mysql/
          server-dir: /public_html/office/marketing-api-mysql/
          exclude: |
            config*.php
            **/config*.php
            *.sql
            **/*.sql
            *.md
            **/*.md
          timeout: 300000

      - name: Deploy backend marketing-api-mysql (percobaan 2)
        if: steps.ftpmkt.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./marketing-mysql/
          server-dir: /public_html/office/marketing-api-mysql/
          exclude: |
            config*.php
            **/config*.php
            *.sql
            **/*.sql
            *.md
            **/*.md
          timeout: 300000

      # event-mysql sebelumnya TIDAK ada di workflow mana pun. Akibatnya setiap
      # perubahan backend EMS hanya hidup di repo: pustaka template denah
      # (layoutTemplates) tersimpan di frontend, dikirim ke server, lalu DIBUANG
      # diam-diam karena api.php di server belum mengenal kuncinya — templatenya
      # "hilang" tiap kali halaman dimuat ulang. Sama persis dengan yang pernah
      # terjadi pada kompas-mysql.
      #
      # server-dir DIPERBAIKI 11 Agustus 2026, dan gejalanya persis seperti
      # "tidak ada di workflow" tadi. Sebelumnya tertulis `/event-api-mysql/`
      # — itu benar untuk akun FTP DEV (rumahnya sudah di docroot subdomain),
      # tapi SALAH untuk akun produksi yang rumahnya di root akun: berkasnya
      # mendarat di /event-api-mysql/ SEJAJAR public_html, tempat yang tidak
      # pernah dilayani web. FTP melaporkan sukses, langkah Verifikasi tidak
      # menyentuh backend ini, dan api.php di /public_html/office/ tidak pernah
      # berubah sejak diunggah manual. Ketahuan waktu Breakdown Sumber memanggil
      # action baru `eventsHari` dan dibalas "Aksi tidak dikenal" — padahal
      # marketing-api-mysql, yang server-dir-nya benar, menjawabnya dengan baik.
      # Bandingkan dengan tetangganya: SEMUA backend office di berkas ini pakai
      # /public_html/office/<x>-api-mysql/.
      - name: Deploy backend event-api-mysql
        id: ftpevt
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./event-mysql/
          server-dir: /public_html/office/event-api-mysql/
          exclude: |
            config*.php
            **/config*.php
            *.sql
            **/*.sql
            *.md
            **/*.md
          timeout: 300000

      - name: Deploy backend event-api-mysql (percobaan 2)
        if: steps.ftpevt.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./event-mysql/
          server-dir: /public_html/office/event-api-mysql/
          exclude: |
            config*.php
            **/config*.php
            *.sql
            **/*.sql
            *.md
            **/*.md
          timeout: 300000

      # ===============================================================
      # SITUS CUSTOMER — laksamanamuda.id/ticketing
      # Docroot domain utama = /public_html (dikonfirmasi 31 Juli 2026).
      # Berbeda dengan modul Office yang tinggal di /public_html/office/.
      # ===============================================================
      - name: Deploy situs customer ticketing
        id: ftptixweb
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy/ticketing/
          server-dir: /public_html/ticketing/
          timeout: 300000

      - name: Deploy situs customer ticketing (percobaan 2)
        if: steps.ftptixweb.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy/ticketing/
          server-dir: /public_html/ticketing/
          timeout: 300000

      # Backend publiknya. Letaknya SEJAJAR dengan situsnya, supaya
      # ../ticketing-api/ di dalam index.html menemukannya — jalur relatif
      # yang sama itu juga benar di dev, jadi satu berkas untuk dua server.
      #
      # config*.php dikecualikan: memuat password database DAN secret key
      # Xendit. Menimpanya dari repo = mematikan pembayaran di produksi.
      - name: Deploy backend ticketing-api
        id: ftptixapi
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./ticketing-mysql/
          server-dir: /public_html/ticketing-api/
          exclude: |
            config*.php
            **/config*.php
            *.sql
            **/*.sql
            *.md
            **/*.md
          timeout: 300000

      - name: Deploy backend ticketing-api (percobaan 2)
        if: steps.ftptixapi.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./ticketing-mysql/
          server-dir: /public_html/ticketing-api/
          exclude: |
            config*.php
            **/config*.php
            *.sql
            **/*.sql
            *.md
            **/*.md
          timeout: 300000

      # kompas-mysql sebelumnya TIDAK ada di workflow mana pun — hanya diunggah
      # manual, dan akibatnya terbukti nyata: 27 Juli 2026 ketahuan backend
      # produksi masih versi multi-tabel yang lama, padahal repo sudah lama
      # pindah ke penyimpan blob JSON. Gejalanya menyesatkan — getAll tetap
      # membalas ok:true (bentuk lama), jadi modul kelihatan hidup, tapi
      # `employees` tidak pernah ada sehingga frontend jatuh ke seed dan
      # memunculkan PIC contoh "Kasir 1/2/3".
      - name: Deploy backend kompas-api-mysql
        id: ftpkmp
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./kompas-mysql/
          server-dir: /public_html/office/kompas-api-mysql/
          exclude: |
            config*.php
            **/config*.php
            *.sql
            **/*.sql
            *.md
            **/*.md
          timeout: 300000

      - name: Deploy backend kompas-api-mysql (percobaan 2)
        if: steps.ftpkmp.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./kompas-mysql/
          server-dir: /public_html/office/kompas-api-mysql/
          exclude: |
            config*.php
            **/config*.php
            *.sql
            **/*.sql
            *.md
            **/*.md
          timeout: 300000


      # finance-mysql = backend Kas Kecil. HARUS didaftarkan di KEDUA workflow
      # (deploy.yml untuk main, deploy-dev.yml untuk develop) — menambahkannya
      # di satu berkas saja membuat push ke cabang satunya tidak menghasilkan
      # apa pun, tanpa galat. Sudah kejadian saat modul absensi lahir.
      #
      # Nama folder di server BEDA dari repo: finance-mysql -> finance-api-mysql,
      # karena frontend memanggilnya lewat '../finance-api-mysql/api.php'.
      - name: Deploy backend finance-api-mysql
        id: ftpfin
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./finance-mysql/
          server-dir: /public_html/office/finance-api-mysql/
          exclude: |
            config*.php
            **/config*.php
            *.sql
            **/*.sql
            *.md
            **/*.md
          timeout: 300000

      - name: Deploy backend finance-api-mysql (percobaan 2)
        if: steps.ftpfin.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./finance-mysql/
          server-dir: /public_html/office/finance-api-mysql/
          exclude: |
            config*.php
            **/config*.php
            *.sql
            **/*.sql
            *.md
            **/*.md
          timeout: 300000
      # jadwal-mysql ikut sejak modulnya lahir — pelajaran dari kompas di atas:
      # backend yang tidak pernah masuk workflow akan tertinggal versi lama
      # berbulan-bulan tanpa ada gejala yang jelas.
      # bd-mysql = backend BD OS. SEBELUM 25 Agustus 2026 folder ini TIDAK
      # terdaftar di satu workflow pun, jadi perubahan backend BD tidak pernah
      # sampai ke server dan harus diunggah manual lewat cPanel. Ketahuan saat
      # fitur Promo mendarat: frontend-nya hidup, tapi `promos` tidak ikut
      # dipulangkan getAll, sehingga promo yang baru dibuat lenyap begitu
      # halaman disegarkan - tanpa satu pun pesan galat.
      #
