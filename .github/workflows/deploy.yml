      # ==================================================================
      # ABSENSI — SITUS SENDIRI DI SUBDOMAIN SENDIRI
      # ------------------------------------------------------------------
      # BUKAN di dalam /office/. Modul ini dipasang sebagai aplikasi di layar
      # depan HP kru; ia tidak boleh menuntut orang membuka portal Office
      # lebih dulu setiap pagi, dan alamatnya harus pendek supaya bisa
      # diketik/di-scan sekali lalu dilupakan.
      #
      # Backend diletakkan DI DALAM folder situsnya (absensi/api/), bukan
      # sebagai folder tetangga. Kalau docroot subdomain ini adalah
      # /public_html/absensi/, maka '../absensi-api/' menunjuk KE LUAR docroot
      # dan tidak bisa dicapai lewat absensi.laksamanamuda.id sama sekali.
      # Di dalam, jalurnya benar apa pun cara subdomainnya dibuat.
      #
      # Aman ditumpuk begini: FTP-Deploy-Action hanya menghapus berkas yang
      # ADA di berkas state-nya sendiri, jadi job situs tidak akan menyapu
      # api/ yang diunggah job lain.
      #
      # Isi folder absensi/ berat (7,8 MB: pustaka wajah + bobot model), dan
      # itu memang harus ikut ter-deploy. Tanpa model, pengenalan wajah mati
      # total tanpa satu pun pesan galat yang menjelaskan kenapa.
      # investor/ = Investor Compass. Situs BERDIRI SENDIRI di subdomainnya
      # sendiri, seperti absensi/ - BUKAN di bawah deploy/. Isinya satu berkas
      # HTML mandiri: tidak memanggil API mana pun dan tidak membaca sesi
      # Office, jadi tidak ada backend yang perlu ikut.
      #
      # HARUS didaftarkan di KEDUA workflow. Menambahkannya di satu berkas
      # saja membuat push ke cabang satunya tidak menghasilkan apa pun, tanpa
      # galat - sudah kejadian saat modul absensi lahir, dan sekali lagi saat
      # backend BD ketahuan tidak pernah ter-deploy sama sekali.
      #
      # server-dir memakai NAMA DOMAIN PENUH sebagai nama folder; itu yang
      # dipakai cPanel ini saat subdomainnya dibuat. Salah folder di sini
      # tidak melempar apa pun - berkasnya mendarat di tempat yang tidak
      # dilayani siapa pun, dan yang membuka alamatnya melihat halaman 404
      # tanpa petunjuk sedikit pun soal sebabnya.
      - name: Deploy situs investor
        id: ftpinv
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./investor/
          server-dir: /public_html/investor.laksamanamuda.id/
