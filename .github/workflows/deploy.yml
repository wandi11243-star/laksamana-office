name: Deploy to Rumahweb

on:
  push:
    branches: [ main ]

jobs:
  web-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # continue-on-error + percobaan ulang di bawah: transfer FTP ke Rumahweb
      # kadang putus tanpa sebab yang bisa kita kendalikan. Kegagalan di sini
      # tidak langsung menggagalkan job; yang menentukan tetap langkah
      # Verifikasi, yang membandingkan isi file di server dengan repo.
      - name: Deploy via FTP
        id: ftp1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy/
          server-dir: /public_html/office/
          # Default action ini 30 detik per operasi FTP. Koneksi ke Rumahweb
          # sering lebih lambat dari itu untuk file besar (marketing ~400KB),
          # sehingga transfer diputus DI TENGAH: file di server jadi terpotong
          # dan JS-nya rusak, TAPI action tetap melaporkan "sukses" — modul
          # mati tanpa ada yang sadar. Sudah kejadian 2x pada 16 Juli 2026
          # (terpotong di 65KB lalu 234KB dari 403KB).
          timeout: 300000

      # Percobaan ulang, HANYA bila yang pertama gagal. Sekali saja: kegagalan
      # sejauh ini selalu putus koneksi sesaat, bukan kredensial/path salah —
      # yang begitu tidak sembuh berapa kali pun diulang.
      - name: Deploy via FTP (percobaan ulang)
        if: steps.ftp1.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy/
          server-dir: /public_html/office/
          timeout: 300000

      # Deploy FTP bisa "sukses" walau file terpotong ATAU sama sekali tidak mendarat,
      # jadi jangan percaya status hijau saja. Cek "</html>" saja TIDAK CUKUP: file LAMA
      # yang masih utuh (dan halaman 404) juga punya </html>, sehingga deploy yang gagal
      # total tetap dilaporkan OK. Maka isinya dibandingkan langsung dengan repo.
      # FTP mengubah CRLF→LF, jadi \r dibuang dulu di kedua sisi.
      - name: Verifikasi file di server benar-benar versi ini
        run: |
          gagal=0
          for m in "" marketing/ reservasi/ event/ akademi/ konten/ stock/; do
            src="deploy/${m}index.html"
            if [ ! -f "$src" ]; then echo "LEWAT   ${m:-/} (tidak ada di repo)"; continue; fi
            url="https://office.laksamanamuda.id/${m}index.html"
            curl -s -m 90 "$url?ci=$GITHUB_SHA" -o /tmp/live.html || true
            tr -d '\r' < "$src" > /tmp/a
            tr -d '\r' < /tmp/live.html > /tmp/b
            if cmp -s /tmp/a /tmp/b; then
              echo "OK      ${m:-/} ($(wc -c < /tmp/b) byte, sama persis dgn repo)"
            else
              echo "GAGAL   ${m:-/} — isi di server BEDA dari repo (tidak ter-upload / terpotong)"
              echo "        repo=$(wc -c < /tmp/a) byte, server=$(wc -c < /tmp/b) byte"
              grep -q '</html>' /tmp/b || echo "        server tidak punya </html> → terpotong atau 404"
              gagal=1
            fi
          done
          exit $gagal
