name: Deploy to Rumahweb

on:
  push:
    branches: [ main ]

jobs:
  web-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # continue-on-error + percobaan ulang di bawah: transfer FTP ke Rumahweb
      # kadang putus tanpa sebab yang bisa kita kendalikan. Kegagalan di sini
      # tidak langsung menggagalkan job; yang menentukan tetap langkah
      # Verifikasi, yang membandingkan isi file di server dengan repo.
      - name: Deploy via FTP
        id: ftp1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy/
          server-dir: /public_html/office/
          # Default action ini 30 detik per operasi FTP. Koneksi ke Rumahweb
          # sering lebih lambat dari itu untuk file besar (marketing ~400KB),
          # sehingga transfer diputus DI TENGAH: file di server jadi terpotong
          # dan JS-nya rusak, TAPI action tetap melaporkan "sukses" — modul
          # mati tanpa ada yang sadar. Sudah kejadian 2x pada 16 Juli 2026
          # (terpotong di 65KB lalu 234KB dari 403KB).
          timeout: 300000

      # Percobaan ke-2 dan ke-3, masing-masing hanya bila yang sebelumnya gagal.
      # Dua percobaan terbukti belum cukup untuk file besar (lihat catatan di
      # deploy-dev.yml): putus di tengah transfer bisa berulang beberapa kali.
      # JEDA sebelum mencoba lagi — lihat catatan di deploy-dev.yml.
      - name: Jeda sebelum percobaan 2
        if: steps.ftp1.outcome == 'failure'
        run: sleep 45

      - name: Deploy via FTP (percobaan 2)
        id: ftp2
        continue-on-error: true
        if: steps.ftp1.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy/
          server-dir: /public_html/office/
          timeout: 300000

      - name: Jeda sebelum percobaan 3
        if: steps.ftp1.outcome == 'failure' && steps.ftp2.outcome == 'failure'
        run: sleep 120

      - name: Deploy via FTP (percobaan 3)
        if: steps.ftp1.outcome == 'failure' && steps.ftp2.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy/
          server-dir: /public_html/office/
          timeout: 300000

      # ==================================================================
      # BACKEND (account-api-mysql & stock-api-mysql)
      # ------------------------------------------------------------------
      # Ada DI LUAR deploy/, jadi sebelumnya tidak pernah ikut terkirim dan
      # harus diunggah manual — sumber kejadian berulang "frontend baru,
      # backend lama" yang gejalanya cuma fitur diam tanpa error.
      #
      # Nama folder di server BEDA dari repo (account-mysql ->
      # account-api-mysql), mengikuti path yang dipakai frontend.
      #
      # config*.php TIDAK ikut: berisi password, dan produksi wajib
      # menunjuk database produksi sementara dev menunjuk database dev.
      # Mengirimnya dari repo justru akan menyeragamkan keduanya — persis
      # kesalahan yang paling mahal di sini. *.sql & *.md juga tidak ikut:
      # skema database tidak boleh bisa diunduh lewat URL biasa.
      # ==================================================================
      - name: Deploy backend account-api-mysql
        id: ftpacc
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./account-mysql/
          server-dir: /public_html/office/account-api-mysql/
          exclude: |
            config*.php
            **/config*.php
            *.sql
            **/*.sql
            *.md
            **/*.md
          timeout: 300000

      - name: Deploy backend account-api-mysql (percobaan 2)
        if: steps.ftpacc.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./account-mysql/
          server-dir: /public_html/office/account-api-mysql/
          exclude: |
            config*.php
            **/config*.php
            *.sql
            **/*.sql
            *.md
            **/*.md
          timeout: 300000

      - name: Deploy backend stock-api-mysql
        id: ftpstock
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./stock-mysql/
          server-dir: /public_html/office/stock-api-mysql/
          exclude: |
            config*.php
            **/config*.php
            *.sql
            **/*.sql
            *.md
            **/*.md
          timeout: 300000

      - name: Deploy backend stock-api-mysql (percobaan 2)
        if: steps.ftpstock.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./stock-mysql/
          server-dir: /public_html/office/stock-api-mysql/
          exclude: |
            config*.php
            **/config*.php
            *.sql
            **/*.sql
            *.md
            **/*.md
          timeout: 300000

      # marketing-mysql tadinya SATU-SATUNYA backend yang masih diunggah manual
      # lewat zip. Itu bukan kelalaian kecil: perbaikan penghapus lampiran ada
      # di lib ini, dan perbaikan backend yang tidak pernah terunggah sama
      # dengan tidak diperbaiki. Gejalanya pun tidak berupa error — cuma
      # lampiran yang hilang berhari-hari kemudian.
      - name: Deploy backend marketing-api-mysql
        id: ftpmkt
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./marketing-mysql/
          server-dir: /public_html/office/marketing-api-mysql/
          exclude: |
            config*.php
            **/config*.php
            *.sql
            **/*.sql
            *.md
            **/*.md
          timeout: 300000

      - name: Deploy backend marketing-api-mysql (percobaan 2)
        if: steps.ftpmkt.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./marketing-mysql/
          server-dir: /public_html/office/marketing-api-mysql/
          exclude: |
            config*.php
            **/config*.php
            *.sql
            **/*.sql
            *.md
            **/*.md
          timeout: 300000

      # Deploy FTP bisa "sukses" walau file terpotong ATAU sama sekali tidak mendarat,
      # jadi jangan percaya status hijau saja. Cek "</html>" saja TIDAK CUKUP: file LAMA
      # yang masih utuh (dan halaman 404) juga punya </html>, sehingga deploy yang gagal
      # total tetap dilaporkan OK. Maka isinya dibandingkan langsung dengan repo.
      # FTP mengubah CRLF→LF, jadi \r dibuang dulu di kedua sisi.
      # if: always() — verifikasi tetap jalan walau kedua percobaan FTP gagal,
      # supaya laporannya menyebut file MANA yang tertinggal, bukan sekadar
      # "FTP gagal".
      - name: Verifikasi file di server benar-benar versi ini
        if: always()
        run: |
          gagal=0
          for m in "" marketing/ reservasi/ event/ akademi/ konten/ stock/ bd/ kompas/; do
            src="deploy/${m}index.html"
            if [ ! -f "$src" ]; then echo "LEWAT   ${m:-/} (tidak ada di repo)"; continue; fi
            url="https://office.laksamanamuda.id/${m}index.html"
            curl -s -m 90 "$url?ci=$GITHUB_SHA" -o /tmp/live.html || true
            tr -d '\r' < "$src" > /tmp/a
            tr -d '\r' < /tmp/live.html > /tmp/b
            if cmp -s /tmp/a /tmp/b; then
              echo "OK      ${m:-/} ($(wc -c < /tmp/b) byte, sama persis dgn repo)"
            else
              echo "GAGAL   ${m:-/} — isi di server BEDA dari repo (tidak ter-upload / terpotong)"
              echo "        repo=$(wc -c < /tmp/a) byte, server=$(wc -c < /tmp/b) byte"
              grep -q '</html>' /tmp/b || echo "        server tidak punya </html> → terpotong atau 404"
              gagal=1
            fi
          done
          exit $gagal

      # Berkas PHP tidak bisa dibandingkan isinya lewat HTTP — yang dikirim
      # server adalah hasil eksekusinya. Jadi yang diuji perilakunya.
      # env=produksi diperiksa lebih dulu: config yang tertukar (produksi
      # menunjuk database dev, atau sebaliknya) adalah kesalahan termahal di
      # repo ini, dan ping memang dibuat untuk menangkapnya.
      - name: Verifikasi backend hidup dan versi terbaru
        if: always()
        run: |
          gagal=0

          echo "--- account-api-mysql ---"
          acc=$(curl -s -m 60 "https://office.laksamanamuda.id/account-api-mysql/api.php?action=ping&ci=$GITHUB_SHA")
          echo "ping: $acc"
          case "$acc" in
            *'"env":"produksi"'*) echo "OK      env=produksi" ;;
            *) echo "GAGAL   env BUKAN produksi — config.php salah atau API tidak terjangkau"; gagal=1 ;;
          esac

          who=$(curl -s -m 60 -X POST "https://office.laksamanamuda.id/account-api-mysql/api.php" \
                  -H 'Content-Type: text/plain;charset=utf-8' \
                  -d '{"action":"whoami","token":"ci-probe-token-yang-pasti-salah"}')
          echo "whoami: $who"
          case "$who" in
            *invalid_token*) echo "OK      whoami dikenal (versi baru mendarat)" ;;
            *unknown_action*) echo "GAGAL   whoami TIDAK dikenal — api.php di server masih versi lama"; gagal=1 ;;
            *) echo "GAGAL   whoami menjawab tak terduga"; gagal=1 ;;
          esac

          echo "--- stock-api-mysql ---"
          stk=$(curl -s -m 60 "https://office.laksamanamuda.id/stock-api-mysql/usage.php?action=ping&ci=$GITHUB_SHA")
          echo "ping: $stk"
          case "$stk" in
            *'"env":"produksi"'*) echo "OK      env=produksi" ;;
            *) echo "GAGAL   env BUKAN produksi — config.php salah atau API tidak terjangkau"; gagal=1 ;;
          esac

          # ?action=ping TIDAK cukup: _boot menjawabnya lalu berhenti SEBELUM
          # lib_stock_catat di-require, jadi galat parse di sana tidak ketahuan.
          kode=$(curl -s -m 60 -o /tmp/usage.json -w '%{http_code}' \
                 "https://office.laksamanamuda.id/stock-api-mysql/usage.php?dari=2000-01-01&ke=2000-01-02&ci=$GITHUB_SHA")
          echo "daftar usage: HTTP $kode -> $(head -c 200 /tmp/usage.json)"
          if [ "$kode" = "200" ]; then
            echo "OK      usage.php memuat lib_stock_catat tanpa galat"
          else
            echo "GAGAL   usage.php balas HTTP $kode — kemungkinan galat PHP di lib_stock_catat.php"
            gagal=1
          fi

          echo "--- marketing-api-mysql ---"
          mkt=$(curl -s -m 60 "https://team.laksamanamuda.id/marketing-api-mysql/api.php?action=ping&ci=$GITHUB_SHA")
          echo "ping: $mkt"
          case "$mkt" in
            *'"env":"produksi"'*) echo "OK      env=produksi" ;;
            *) echo "GAGAL   env BUKAN produksi — config.php salah atau API tidak terjangkau"; gagal=1 ;;
          esac

          # Versi lib dibandingkan dengan yang ada di repo. Ini pembeda TEPAT
          # antara lib yang baru mendarat dan lib lama yang masih jalan —
          # keduanya sama-sama menjawab ping dengan env=produksi.
          repo_versi=$(sed -n "s/.*LIB_VERSI', *'\([^']*\)'.*/\1/p" marketing-mysql/lib_marketing_mysql.php)
          echo "versi di repo: $repo_versi"
          case "$mkt" in
            *"\"versi\":\"$repo_versi\""*) echo "OK      versi lib di server = repo" ;;
            *) echo "GAGAL   versi lib di server BUKAN $repo_versi — lib lama masih jalan"; gagal=1 ;;
          esac

          # stats memuat key_terpakai() + gc — kalau ada galat parse di sana,
          # ping tetap lolos tapi stats tidak. Sekalian melaporkan berkas yang
          # keynya tercatat tapi filenya sudah tidak ada.
          kode=$(curl -s -m 60 -o /tmp/mkt.json -w '%{http_code}' \
                 "https://team.laksamanamuda.id/marketing-api-mysql/api.php?action=stats&ci=$GITHUB_SHA")
          echo "stats: HTTP $kode -> $(head -c 300 /tmp/mkt.json)"
          if [ "$kode" = "200" ]; then
            echo "OK      stats jalan (key_terpakai & gc termuat tanpa galat)"
          else
            echo "GAGAL   stats balas HTTP $kode — kemungkinan galat PHP di lib_marketing_mysql.php"
            gagal=1
          fi

          echo "--- kompas-api-mysql ---"
          kmp=$(curl -s -m 60 "https://office.laksamanamuda.id/kompas-api-mysql/api.php?action=ping&ci=$GITHUB_SHA")
          echo "ping: $kmp"
          case "$kmp" in
            *'"env":"produksi"'*) echo "OK      env=produksi" ;;
            *) echo "GAGAL   env BUKAN produksi — config.php salah atau API tidak terjangkau"; gagal=1 ;;
          esac

          # ?action=ping cuma menyentuh config; stats menjalankan query ke SEMUA
          # tabel lewat lib_kompas_mysql — jadi galat parse / skema hilang yang
          # lolos dari ping akan tertangkap di sini.
          kode=$(curl -s -m 60 -o /tmp/kmp.json -w '%{http_code}' \
                 "https://office.laksamanamuda.id/kompas-api-mysql/api.php?action=stats&ci=$GITHUB_SHA")
          echo "stats: HTTP $kode -> $(head -c 300 /tmp/kmp.json)"
          if [ "$kode" = "200" ]; then
            echo "OK      stats jalan (lib_kompas_mysql termuat, semua tabel terbaca)"
          else
            echo "GAGAL   stats balas HTTP $kode — kemungkinan galat PHP di lib_kompas_mysql.php / skema kurang"
            gagal=1
          fi

          exit $gagal
