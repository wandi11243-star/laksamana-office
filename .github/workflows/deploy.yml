name: Deploy to Rumahweb

on:
  push:
    branches: [ main ]

jobs:
  web-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # continue-on-error + percobaan ulang di bawah: transfer FTP ke Rumahweb
      # kadang putus tanpa sebab yang bisa kita kendalikan. Kegagalan di sini
      # tidak langsung menggagalkan job; yang menentukan tetap langkah
      # Verifikasi, yang membandingkan isi file di server dengan repo.
      - name: Deploy via FTP
        id: ftp1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy/
          server-dir: /public_html/office/
          # Situs customer punya alamatnya sendiri di /public_html/ticketing/
          # (lihat langkah terpisah di bawah). Kalau ikut tersalin ke sini,
          # ada salinan kedua di office/ticketing/ yang PASTI rusak:
          # ../ticketing-api/ dari sana menunjuk folder yang tak pernah ada.
          exclude: |
            ticketing/**
          # Default action ini 30 detik per operasi FTP. Koneksi ke Rumahweb
          # sering lebih lambat dari itu untuk file besar (marketing ~400KB),
          # sehingga transfer diputus DI TENGAH: file di server jadi terpotong
          # dan JS-nya rusak, TAPI action tetap melaporkan "sukses" — modul
          # mati tanpa ada yang sadar. Sudah kejadian 2x pada 16 Juli 2026
          # (terpotong di 65KB lalu 234KB dari 403KB).
          timeout: 300000

      # Percobaan ke-2 dan ke-3, masing-masing hanya bila yang sebelumnya gagal.
      # Dua percobaan terbukti belum cukup untuk file besar (lihat catatan di
      # deploy-dev.yml): putus di tengah transfer bisa berulang beberapa kali.
      # JEDA sebelum mencoba lagi — lihat catatan di deploy-dev.yml.
      - name: Jeda sebelum percobaan 2
        if: steps.ftp1.outcome == 'failure'
        run: sleep 45

      - name: Deploy via FTP (percobaan 2)
        id: ftp2
        continue-on-error: true
        if: steps.ftp1.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy/
          server-dir: /public_html/office/
          # Situs customer punya alamatnya sendiri di /public_html/ticketing/
          # (lihat langkah terpisah di bawah). Kalau ikut tersalin ke sini,
          # ada salinan kedua di office/ticketing/ yang PASTI rusak:
          # ../ticketing-api/ dari sana menunjuk folder yang tak pernah ada.
          exclude: |
            ticketing/**
          timeout: 300000

      - name: Jeda sebelum percobaan 3
        if: steps.ftp1.outcome == 'failure' && steps.ftp2.outcome == 'failure'
        run: sleep 120

      - name: Deploy via FTP (percobaan 3)
        if: steps.ftp1.outcome == 'failure' && steps.ftp2.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy/
          server-dir: /public_html/office/
          # Situs customer punya alamatnya sendiri di /public_html/ticketing/
          # (lihat langkah terpisah di bawah). Kalau ikut tersalin ke sini,
          # ada salinan kedua di office/ticketing/ yang PASTI rusak:
          # ../ticketing-api/ dari sana menunjuk folder yang tak pernah ada.
          exclude: |
            ticketing/**
          timeout: 300000

      # ==================================================================
      # BACKEND (account-api-mysql & stock-api-mysql)
      # ------------------------------------------------------------------
      # Ada DI LUAR deploy/, jadi sebelumnya tidak pernah ikut terkirim dan
      # harus diunggah manual — sumber kejadian berulang "frontend baru,
      # backend lama" yang gejalanya cuma fitur diam tanpa error.
      #
      # Nama folder di server BEDA dari repo (account-mysql ->
      # account-api-mysql), mengikuti path yang dipakai frontend.
      #
      # config*.php TIDAK ikut: berisi password, dan produksi wajib
      # menunjuk database produksi sementara dev menunjuk database dev.
      # Mengirimnya dari repo justru akan menyeragamkan keduanya — persis
      # kesalahan yang paling mahal di sini. *.sql & *.md juga tidak ikut:
      # skema database tidak boleh bisa diunduh lewat URL biasa.
      # ==================================================================
      - name: Deploy backend account-api-mysql
        id: ftpacc
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./account-mysql/
          server-dir: /public_html/office/account-api-mysql/
          exclude: |
            config*.php
            **/config*.php
            *.sql
            **/*.sql
            *.md
            **/*.md
          timeout: 300000

      - name: Deploy backend account-api-mysql (percobaan 2)
        if: steps.ftpacc.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./account-mysql/
          server-dir: /public_html/office/account-api-mysql/
          exclude: |
            config*.php
            **/config*.php
            *.sql
            **/*.sql
            *.md
            **/*.md
          timeout: 300000

      - name: Deploy backend stock-api-mysql
        id: ftpstock
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./stock-mysql/
          server-dir: /public_html/office/stock-api-mysql/
          exclude: |
            config*.php
            **/config*.php
            *.sql
            **/*.sql
            *.md
            **/*.md
          timeout: 300000

      - name: Deploy backend stock-api-mysql (percobaan 2)
        if: steps.ftpstock.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./stock-mysql/
          server-dir: /public_html/office/stock-api-mysql/
          exclude: |
            config*.php
            **/config*.php
            *.sql
            **/*.sql
            *.md
            **/*.md
          timeout: 300000

      # marketing-mysql tadinya SATU-SATUNYA backend yang masih diunggah manual
      # lewat zip. Itu bukan kelalaian kecil: perbaikan penghapus lampiran ada
      # di lib ini, dan perbaikan backend yang tidak pernah terunggah sama
      # dengan tidak diperbaiki. Gejalanya pun tidak berupa error — cuma
      # lampiran yang hilang berhari-hari kemudian.
      - name: Deploy backend marketing-api-mysql
        id: ftpmkt
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./marketing-mysql/
          server-dir: /public_html/office/marketing-api-mysql/
          exclude: |
            config*.php
            **/config*.php
            *.sql
            **/*.sql
            *.md
            **/*.md
          timeout: 300000

      - name: Deploy backend marketing-api-mysql (percobaan 2)
        if: steps.ftpmkt.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./marketing-mysql/
          server-dir: /public_html/office/marketing-api-mysql/
          exclude: |
            config*.php
            **/config*.php
            *.sql
            **/*.sql
            *.md
            **/*.md
          timeout: 300000

      # event-mysql sebelumnya TIDAK ada di workflow mana pun. Akibatnya setiap
      # perubahan backend EMS hanya hidup di repo: pustaka template denah
      # (layoutTemplates) tersimpan di frontend, dikirim ke server, lalu DIBUANG
      # diam-diam karena api.php di server belum mengenal kuncinya — templatenya
      # "hilang" tiap kali halaman dimuat ulang. Sama persis dengan yang pernah
      # terjadi pada kompas-mysql.
      - name: Deploy backend event-api-mysql
        id: ftpevt
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./event-mysql/
          server-dir: /event-api-mysql/
          exclude: |
            config*.php
            **/config*.php
            *.sql
            **/*.sql
            *.md
            **/*.md
          timeout: 300000

      - name: Deploy backend event-api-mysql (percobaan 2)
        if: steps.ftpevt.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./event-mysql/
          server-dir: /event-api-mysql/
          exclude: |
            config*.php
            **/config*.php
            *.sql
            **/*.sql
            *.md
            **/*.md
          timeout: 300000

      # ===============================================================
      # SITUS CUSTOMER — laksamanamuda.id/ticketing
      # Docroot domain utama = /public_html (dikonfirmasi 31 Juli 2026).
      # Berbeda dengan modul Office yang tinggal di /public_html/office/.
      # ===============================================================
      - name: Deploy situs customer ticketing
        id: ftptixweb
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy/ticketing/
          server-dir: /public_html/ticketing/
          timeout: 300000

      - name: Deploy situs customer ticketing (percobaan 2)
        if: steps.ftptixweb.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy/ticketing/
          server-dir: /public_html/ticketing/
          timeout: 300000

      # Backend publiknya. Letaknya SEJAJAR dengan situsnya, supaya
      # ../ticketing-api/ di dalam index.html menemukannya — jalur relatif
      # yang sama itu juga benar di dev, jadi satu berkas untuk dua server.
      #
      # config*.php dikecualikan: memuat password database DAN secret key
      # Xendit. Menimpanya dari repo = mematikan pembayaran di produksi.
      - name: Deploy backend ticketing-api
        id: ftptixapi
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./ticketing-mysql/
          server-dir: /public_html/ticketing-api/
          exclude: |
            config*.php
            **/config*.php
            *.sql
            **/*.sql
            *.md
            **/*.md
          timeout: 300000

      - name: Deploy backend ticketing-api (percobaan 2)
        if: steps.ftptixapi.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./ticketing-mysql/
          server-dir: /public_html/ticketing-api/
          exclude: |
            config*.php
            **/config*.php
            *.sql
            **/*.sql
            *.md
            **/*.md
          timeout: 300000

      # kompas-mysql sebelumnya TIDAK ada di workflow mana pun — hanya diunggah
      # manual, dan akibatnya terbukti nyata: 27 Juli 2026 ketahuan backend
      # produksi masih versi multi-tabel yang lama, padahal repo sudah lama
      # pindah ke penyimpan blob JSON. Gejalanya menyesatkan — getAll tetap
      # membalas ok:true (bentuk lama), jadi modul kelihatan hidup, tapi
      # `employees` tidak pernah ada sehingga frontend jatuh ke seed dan
      # memunculkan PIC contoh "Kasir 1/2/3".
      - name: Deploy backend kompas-api-mysql
        id: ftpkmp
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./kompas-mysql/
          server-dir: /public_html/office/kompas-api-mysql/
          exclude: |
            config*.php
            **/config*.php
            *.sql
            **/*.sql
            *.md
            **/*.md
          timeout: 300000

      - name: Deploy backend kompas-api-mysql (percobaan 2)
        if: steps.ftpkmp.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./kompas-mysql/
          server-dir: /public_html/office/kompas-api-mysql/
          exclude: |
            config*.php
            **/config*.php
            *.sql
            **/*.sql
            *.md
            **/*.md
          timeout: 300000

      # jadwal-mysql ikut sejak modulnya lahir — pelajaran dari kompas di atas:
      # backend yang tidak pernah masuk workflow akan tertinggal versi lama
      # berbulan-bulan tanpa ada gejala yang jelas.
      - name: Deploy backend jadwal-api-mysql
        id: ftpjdw
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./jadwal-mysql/
          server-dir: /public_html/office/jadwal-api-mysql/
          exclude: |
            config*.php
            **/config*.php
            *.sql
            **/*.sql
            *.md
            **/*.md
          timeout: 300000

      - name: Deploy backend jadwal-api-mysql (percobaan 2)
        if: steps.ftpjdw.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./jadwal-mysql/
          server-dir: /public_html/office/jadwal-api-mysql/
          exclude: |
            config*.php
            **/config*.php
            *.sql
            **/*.sql
            *.md
            **/*.md
          timeout: 300000

      # dw-mysql ikut sejak modulnya lahir, alasan yang sama dengan jadwal di atas:
      # backend yang tidak pernah masuk workflow akan tertinggal versi lama
      # berbulan-bulan tanpa ada gejala yang jelas.
      - name: Deploy backend dw-api-mysql
        id: ftpdw
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dw-mysql/
          server-dir: /public_html/office/dw-api-mysql/
          exclude: |
            config*.php
            **/config*.php
            *.sql
            **/*.sql
            *.md
            **/*.md
          timeout: 300000

      - name: Deploy backend dw-api-mysql (percobaan 2)
        if: steps.ftpdw.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dw-mysql/
          server-dir: /public_html/office/dw-api-mysql/
          exclude: |
            config*.php
            **/config*.php
            *.sql
            **/*.sql
            *.md
            **/*.md
          timeout: 300000

      # Deploy FTP bisa "sukses" walau file terpotong ATAU sama sekali tidak mendarat,
      # jadi jangan percaya status hijau saja. Cek "</html>" saja TIDAK CUKUP: file LAMA
      # yang masih utuh (dan halaman 404) juga punya </html>, sehingga deploy yang gagal
      # total tetap dilaporkan OK. Maka isinya dibandingkan langsung dengan repo.
      # FTP mengubah CRLF→LF, jadi \r dibuang dulu di kedua sisi.
      # if: always() — verifikasi tetap jalan walau kedua percobaan FTP gagal,
      # supaya laporannya menyebut file MANA yang tertinggal, bukan sekadar
      # "FTP gagal".
      - name: Verifikasi file di server benar-benar versi ini
        if: always()
        run: |
          gagal=0
          for m in "" marketing/ reservasi/ event/ akademi/ konten/ stock/ bd/ kompas/ cashier/ jadwal/ dw/; do
            src="deploy/${m}index.html"
            if [ ! -f "$src" ]; then echo "LEWAT   ${m:-/} (tidak ada di repo)"; continue; fi
            url="https://office.laksamanamuda.id/${m}index.html"
            curl -s -m 90 "$url?ci=$GITHUB_SHA" -o /tmp/live.html || true
            tr -d '\r' < "$src" > /tmp/a
            tr -d '\r' < /tmp/live.html > /tmp/b
            if cmp -s /tmp/a /tmp/b; then
              echo "OK      ${m:-/} ($(wc -c < /tmp/b) byte, sama persis dgn repo)"
            else
              echo "GAGAL   ${m:-/} — isi di server BEDA dari repo (tidak ter-upload / terpotong)"
              echo "        repo=$(wc -c < /tmp/a) byte, server=$(wc -c < /tmp/b) byte"
              grep -q '</html>' /tmp/b || echo "        server tidak punya </html> → terpotong atau 404"
              gagal=1
            fi
          done
          exit $gagal

      # Berkas PHP tidak bisa dibandingkan isinya lewat HTTP — yang dikirim
      # server adalah hasil eksekusinya. Jadi yang diuji perilakunya.
      # env=produksi diperiksa lebih dulu: config yang tertukar (produksi
      # menunjuk database dev, atau sebaliknya) adalah kesalahan termahal di
      # repo ini, dan ping memang dibuat untuk menangkapnya.
      - name: Verifikasi backend hidup dan versi terbaru
        if: always()
        run: |
          gagal=0

          echo "--- account-api-mysql ---"
          acc=$(curl -s -m 60 "https://office.laksamanamuda.id/account-api-mysql/api.php?action=ping&ci=$GITHUB_SHA")
          echo "ping: $acc"
          case "$acc" in
            *'"env":"produksi"'*) echo "OK      env=produksi" ;;
            *) echo "GAGAL   env BUKAN produksi — config.php salah atau API tidak terjangkau"; gagal=1 ;;
          esac

          who=$(curl -s -m 60 -X POST "https://office.laksamanamuda.id/account-api-mysql/api.php" \
                  -H 'Content-Type: text/plain;charset=utf-8' \
                  -d '{"action":"whoami","token":"ci-probe-token-yang-pasti-salah"}')
          echo "whoami: $who"
          case "$who" in
            *invalid_token*) echo "OK      whoami dikenal (versi baru mendarat)" ;;
            *unknown_action*) echo "GAGAL   whoami TIDAK dikenal — api.php di server masih versi lama"; gagal=1 ;;
            *) echo "GAGAL   whoami menjawab tak terduga"; gagal=1 ;;
          esac

          echo "--- stock-api-mysql ---"
          stk=$(curl -s -m 60 "https://office.laksamanamuda.id/stock-api-mysql/usage.php?action=ping&ci=$GITHUB_SHA")
          echo "ping: $stk"
          case "$stk" in
            *'"env":"produksi"'*) echo "OK      env=produksi" ;;
            *) echo "GAGAL   env BUKAN produksi — config.php salah atau API tidak terjangkau"; gagal=1 ;;
          esac

          # ?action=ping TIDAK cukup: _boot menjawabnya lalu berhenti SEBELUM
          # lib_stock_catat di-require, jadi galat parse di sana tidak ketahuan.
          kode=$(curl -s -m 60 -o /tmp/usage.json -w '%{http_code}' \
                 "https://office.laksamanamuda.id/stock-api-mysql/usage.php?dari=2000-01-01&ke=2000-01-02&ci=$GITHUB_SHA")
          echo "daftar usage: HTTP $kode -> $(head -c 200 /tmp/usage.json)"
          if [ "$kode" = "200" ]; then
            echo "OK      usage.php memuat lib_stock_catat tanpa galat"
          else
            echo "GAGAL   usage.php balas HTTP $kode — kemungkinan galat PHP di lib_stock_catat.php"
            gagal=1
          fi

          echo "--- marketing-api-mysql ---"
          mkt=$(curl -s -m 60 "https://team.laksamanamuda.id/marketing-api-mysql/api.php?action=ping&ci=$GITHUB_SHA")
          echo "ping: $mkt"
          case "$mkt" in
            *'"env":"produksi"'*) echo "OK      env=produksi" ;;
            *) echo "GAGAL   env BUKAN produksi — config.php salah atau API tidak terjangkau"; gagal=1 ;;
          esac

          # Versi lib dibandingkan dengan yang ada di repo. Ini pembeda TEPAT
          # antara lib yang baru mendarat dan lib lama yang masih jalan —
          # keduanya sama-sama menjawab ping dengan env=produksi.
          repo_versi=$(sed -n "s/.*LIB_VERSI', *'\([^']*\)'.*/\1/p" marketing-mysql/lib_marketing_mysql.php)
          echo "versi di repo: $repo_versi"
          case "$mkt" in
            *"\"versi\":\"$repo_versi\""*) echo "OK      versi lib di server = repo" ;;
            *) echo "GAGAL   versi lib di server BUKAN $repo_versi — lib lama masih jalan"; gagal=1 ;;
          esac

          # stats memuat key_terpakai() + gc — kalau ada galat parse di sana,
          # ping tetap lolos tapi stats tidak. Sekalian melaporkan berkas yang
          # keynya tercatat tapi filenya sudah tidak ada.
          kode=$(curl -s -m 60 -o /tmp/mkt.json -w '%{http_code}' \
                 "https://team.laksamanamuda.id/marketing-api-mysql/api.php?action=stats&ci=$GITHUB_SHA")
          echo "stats: HTTP $kode -> $(head -c 300 /tmp/mkt.json)"
          if [ "$kode" = "200" ]; then
            echo "OK      stats jalan (key_terpakai & gc termuat tanpa galat)"
          else
            echo "GAGAL   stats balas HTTP $kode — kemungkinan galat PHP di lib_marketing_mysql.php"
            gagal=1
          fi

          echo "--- kompas-api-mysql ---"
          kmp=$(curl -s -m 60 "https://office.laksamanamuda.id/kompas-api-mysql/api.php?action=ping&ci=$GITHUB_SHA")
          echo "ping: $kmp"
          case "$kmp" in
            *'"env":"produksi"'*) echo "OK      env=produksi" ;;
            *) echo "GAGAL   env BUKAN produksi — config.php salah atau API tidak terjangkau"; gagal=1 ;;
          esac

          # ?action=ping cuma menyentuh config; stats benar-benar menjalankan
          # query lewat lib_kompas_mysql — jadi galat parse / skema hilang yang
          # lolos dari ping akan tertangkap di sini.
          kode=$(curl -s -m 60 -o /tmp/kmp.json -w '%{http_code}' \
                 "https://office.laksamanamuda.id/kompas-api-mysql/api.php?action=stats&ci=$GITHUB_SHA")
          echo "stats: HTTP $kode -> $(head -c 300 /tmp/kmp.json)"
          if [ "$kode" = "200" ]; then
            echo "OK      stats jalan (lib_kompas_mysql termuat tanpa galat)"
          else
            echo "GAGAL   stats balas HTTP $kode — kemungkinan galat PHP di lib_kompas_mysql.php"
            gagal=1
          fi

          # HTTP 200 saja TIDAK membuktikan versi barunya mendarat: backend lama
          # (multi-tabel) juga membalas 200, cuma bentuknya {daily,targets,
          # cashiers,pics,settings,log}. Justru itu yang lolos tanpa ketahuan
          # sampai 27 Juli 2026. Penyimpan blob membalas {bytes,updated_at,ada},
          # jadi kunci "ada" dipakai sebagai penanda versi — sepadan dengan
          # probe whoami milik account.
          case "$(cat /tmp/kmp.json)" in
            *'"ada"'*) echo "OK      stats berbentuk blob (versi baru mendarat)" ;;
            *) echo "GAGAL   stats masih berbentuk multi-tabel — lib_kompas_mysql.php di server MASIH VERSI LAMA"; gagal=1 ;;
          esac

          # ping cuma baca konstanta config dan stats MENELAN galat DB
          # (catch Throwable -> ada:false), jadi keduanya BUTA terhadap
          # kredensial/grant yang salah. Itu persis yang terjadi di dev 27 Juli
          # 2026: modul kelihatan hidup, tapi setiap simpan ditolak MySQL 1044.
          # saveAll TANPA field `data` memaksa jalur tulis dibuka — db_lock()
          # menyentuh DB lebih dulu — lalu berhenti di validasi payload, jadi
          # TIDAK ADA yang ditulis. "Payload kosong/invalid" = koneksi sehat.
          probe=$(curl -s -m 60 -X POST "https://office.laksamanamuda.id/kompas-api-mysql/api.php" \
                    -H 'Content-Type: text/plain;charset=utf-8' \
                    -d '{"action":"saveAll"}')
          echo "probe tulis: $(printf '%s' "$probe" | head -c 300)"
          case "$probe" in
            *'Payload kosong'*) echo "OK      koneksi DB sehat, jalur simpan terbuka" ;;
            *SQLSTATE*)         echo "GAGAL   DB menolak — cek user/grant di cPanel untuk database kompas"; gagal=1 ;;
            *)                  echo "GAGAL   probe menjawab tak terduga"; gagal=1 ;;
          esac

          echo "--- jadwal-api-mysql ---"
          jdw=$(curl -s -m 60 "https://office.laksamanamuda.id/jadwal-api-mysql/api.php?action=ping&ci=$GITHUB_SHA")
          echo "ping: $jdw"
          case "$jdw" in
            *'"env":"produksi"'*) echo "OK      env=produksi" ;;
            *) echo "GAGAL   env BUKAN produksi — config.php belum diunggah manual ke /jadwal-api-mysql/, atau config DEV salah terpasang di sini"; gagal=1 ;;
          esac

          # Probe tulis: simpanSel TANPA rows/hapus membuka transaksi (dan
          # CREATE TABLE IF NOT EXISTS) lalu commit tanpa menulis apa pun.
          # Ini menyentuh DB sungguhan, jadi grant yang salah muncul sebagai
          # SQLSTATE — sesuatu yang ping dan stats sama sekali tidak bisa
          # lihat (stats menelan galat DB dan membalas nol).
          jdwp=$(curl -s -m 60 -X POST "https://office.laksamanamuda.id/jadwal-api-mysql/api.php" \
                   -H 'Content-Type: text/plain;charset=utf-8' \
                   -d '{"action":"simpanSel"}')
          echo "probe tulis: $(printf '%s' "$jdwp" | head -c 300)"
          case "$jdwp" in
            *'"isi":0'*) echo "OK      koneksi DB sehat, tabel siap, tidak ada baris ditulis" ;;
            *SQLSTATE*)  echo "GAGAL   DB menolak — cek user/grant di cPanel untuk database jadwal"; gagal=1 ;;
            *)           echo "GAGAL   probe menjawab tak terduga"; gagal=1 ;;
          esac

          # --- dw-api-mysql ---------------------------------------------
          # SENGAJA TIDAK meng-gagalkan build (tidak ada gagal=1). Modul Daily
          # Worker baru lahir dan config.php-nya diunggah MANUAL sekali per
          # lingkungan; sampai itu dikerjakan, gerbang keras di sini akan
          # membuat SETIAP deploy merah karena modul yang bahkan belum dipakai —
          # dan build merah yang sudah dianggap normal berhenti dibaca orang,
          # termasuk saat yang merah itu sesuatu yang sungguhan.
          # Naikkan jadi gagal=1 (ikuti pola jadwal di atas) begitu database dan
          # config.php-nya sudah terpasang.
          echo "--- dw-api-mysql ---"
          dwp=$(curl -s -m 60 "https://office.laksamanamuda.id/dw-api-mysql/api.php?action=ping&ci=$GITHUB_SHA")
          echo "ping: $dwp"
          case "$dwp" in
            *'"env":"produksi"'*) echo "OK      env=produksi" ;;
            *) echo "CATATAN modul Daily Worker belum siap — config.php belum diunggah manual ke /dw-api-mysql/ (belum menggagalkan build)" ;;
          esac

          exit $gagal
