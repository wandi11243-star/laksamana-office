name: Deploy to Dev

on:
  push:
    branches: [ develop ]

jobs:
  web-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # continue-on-error: transfer FTP ke Rumahweb kadang putus di tengah tanpa
      # sebab yang bisa kita kendalikan (sudah kejadian 16 Juli 2026 2x, lalu
      # 21 Juli 2026 pada reservasi/index.html yang 513KB). Kegagalan di sini
      # TIDAK langsung menggagalkan job — percobaan ulang di bawah diberi
      # kesempatan, dan yang menentukan lulus/tidak tetap langkah Verifikasi
      # yang membandingkan isi file di server dengan repo.
      - name: Deploy via FTP
        id: ftp1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.DEV_FTP_SERVER }}
          username: ${{ secrets.DEV_FTP_USERNAME }}
          password: ${{ secrets.DEV_FTP_PASSWORD }}
          local-dir: ./deploy/
          # PENTING — akun FTP dev BERBEDA sifatnya dari akun produksi:
          # rumahnya SUDAH berada di docroot subdomain (/public_html/dev.laksamanamuda.id/),
          # jadi server-dir di sini relatif terhadap docroot itu → cukup "/".
          # Mengisi ".../dev.laksamanamuda.id/dev_office/" (versi awal) atau
          # ".../dev.laksamanamuda.id/" membuat path BERTUMPUK, mis. file mendarat di
          # dev.laksamanamuda.id/public_html/dev.laksamanamuda.id/reservasi/ — terbukti
          # lewat percobaan: FTP "sukses" tapi dev.laksamanamuda.id/reservasi/ tak berubah.
          # (Beda dengan produksi yang akunnya di root akun → memakai /public_html/office/.)
          server-dir: /
          timeout: 300000

      # Percobaan ke-2 dan ke-3, masing-masing hanya bila yang sebelumnya gagal.
      #
      # Dua percobaan ternyata belum cukup: pada 21 Juli 2026 file reservasi
      # (±530KB, terbesar di repo) gagal terkirim dua run berturut-turut dan
      # baru mendarat di kesempatan ketiga. Putusnya selalu di tengah transfer,
      # bukan kredensial atau path salah — yang begitu memang tidak sembuh
      # dengan diulang, tapi koneksi putus jelas sembuh.
      # JEDA sebelum mencoba lagi. Percobaan beruntun tanpa jeda tidak menolong
      # untuk kegagalan "AggregateError: (control socket)" — itu artinya server
      # menolak/memutus koneksi, dan menembaknya lagi dalam hitungan detik
      # menabrak dinding yang sama. Kejadian 22 Juli 2026: tiga percobaan gagal
      # berturut-turut dalam 1m39s total.
      - name: Jeda sebelum percobaan 2
        if: steps.ftp1.outcome == 'failure'
        run: sleep 45

      - name: Deploy via FTP (percobaan 2)
        id: ftp2
        continue-on-error: true
        if: steps.ftp1.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.DEV_FTP_SERVER }}
          username: ${{ secrets.DEV_FTP_USERNAME }}
          password: ${{ secrets.DEV_FTP_PASSWORD }}
          local-dir: ./deploy/
          server-dir: /
          timeout: 300000

      # Jeda kedua dibuat lebih panjang: kalau 45 detik belum cukup, masalahnya
      # bukan sekadar sesaat.
      - name: Jeda sebelum percobaan 3
        if: steps.ftp1.outcome == 'failure' && steps.ftp2.outcome == 'failure'
        run: sleep 120

      - name: Deploy via FTP (percobaan 3)
        if: steps.ftp1.outcome == 'failure' && steps.ftp2.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.DEV_FTP_SERVER }}
          username: ${{ secrets.DEV_FTP_USERNAME }}
          password: ${{ secrets.DEV_FTP_PASSWORD }}
          local-dir: ./deploy/
          server-dir: /
          timeout: 300000

      # ==================================================================
      # BACKEND (account-api-mysql & stock-api-mysql)
      # ------------------------------------------------------------------
      # Dua folder ini ADA DI LUAR deploy/, jadi selama ini tidak pernah
      # ikut terkirim dan harus diunggah manual. Akibatnya berulang: kode
      # frontend mendarat sementara backendnya tertinggal versi lama, dan
      # gejalanya bukan error — cuma fitur yang "tidak berfungsi" tanpa
      # sebab yang kelihatan.
      #
      # NAMA FOLDERNYA BERBEDA antara repo dan server:
      #   account-mysql/ -> /account-api-mysql/
      #   stock-mysql/   -> /stock-api-mysql/
      # Itu yang dipakai frontend (mis. '../../stock-api-mysql/'), jadi
      # jangan disamakan dengan nama folder di repo.
      #
      # YANG SENGAJA TIDAK IKUT (exclude):
      #   config*.php — berisi password DB, dan tiap situs punya isinya
      #     sendiri (dev menunjuk db dev, produksi menunjuk db produksi).
      #     Sudah di-gitignore juga, tapi ditulis di sini supaya alasannya
      #     tidak hilang. Karena tidak pernah ada di local-dir, file ini
      #     juga tidak akan terhapus oleh sinkronisasi.
      #   *.sql — skema & migrasi. Kalau ikut terbit, siapa pun bisa
      #     mengunduh seluruh struktur database lewat URL biasa.
      #   *.md — catatan pemasangan, tidak ada gunanya di server.
      # ==================================================================
      - name: Deploy backend account-api-mysql
        id: ftpacc
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.DEV_FTP_SERVER }}
          username: ${{ secrets.DEV_FTP_USERNAME }}
          password: ${{ secrets.DEV_FTP_PASSWORD }}
          local-dir: ./account-mysql/
          server-dir: /account-api-mysql/
          exclude: |
            config*.php
            **/config*.php
            *.sql
            **/*.sql
            *.md
            **/*.md
          timeout: 300000

      - name: Deploy backend account-api-mysql (percobaan 2)
        if: steps.ftpacc.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.DEV_FTP_SERVER }}
          username: ${{ secrets.DEV_FTP_USERNAME }}
          password: ${{ secrets.DEV_FTP_PASSWORD }}
          local-dir: ./account-mysql/
          server-dir: /account-api-mysql/
          exclude: |
            config*.php
            **/config*.php
            *.sql
            **/*.sql
            *.md
            **/*.md
          timeout: 300000

      - name: Deploy backend stock-api-mysql
        id: ftpstock
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.DEV_FTP_SERVER }}
          username: ${{ secrets.DEV_FTP_USERNAME }}
          password: ${{ secrets.DEV_FTP_PASSWORD }}
          local-dir: ./stock-mysql/
          server-dir: /stock-api-mysql/
          exclude: |
            config*.php
            **/config*.php
            *.sql
            **/*.sql
            *.md
            **/*.md
          timeout: 300000

      - name: Deploy backend stock-api-mysql (percobaan 2)
        if: steps.ftpstock.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.DEV_FTP_SERVER }}
          username: ${{ secrets.DEV_FTP_USERNAME }}
          password: ${{ secrets.DEV_FTP_PASSWORD }}
          local-dir: ./stock-mysql/
          server-dir: /stock-api-mysql/
          exclude: |
            config*.php
            **/config*.php
            *.sql
            **/*.sql
            *.md
            **/*.md
          timeout: 300000


      # event-mysql sebelumnya TIDAK ada di workflow mana pun. Akibatnya setiap
      # perubahan backend EMS hanya hidup di repo: pustaka template denah
      # (layoutTemplates) tersimpan di frontend, dikirim ke server, lalu DIBUANG
      # diam-diam karena api.php di server belum mengenal kuncinya — templatenya
      # "hilang" tiap kali halaman dimuat ulang. Sama persis dengan yang pernah
      # terjadi pada kompas-mysql.
      - name: Deploy backend event-api-mysql
        id: ftpevt
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.DEV_FTP_SERVER }}
          username: ${{ secrets.DEV_FTP_USERNAME }}
          password: ${{ secrets.DEV_FTP_PASSWORD }}
          local-dir: ./event-mysql/
          server-dir: /event-api-mysql/
          exclude: |
            config*.php
            **/config*.php
            *.sql
            **/*.sql
            *.md
            **/*.md
          timeout: 300000

      - name: Deploy backend event-api-mysql (percobaan 2)
        if: steps.ftpevt.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.DEV_FTP_SERVER }}
          username: ${{ secrets.DEV_FTP_USERNAME }}
          password: ${{ secrets.DEV_FTP_PASSWORD }}
          local-dir: ./event-mysql/
          server-dir: /event-api-mysql/
          exclude: |
            config*.php
            **/config*.php
            *.sql
            **/*.sql
            *.md
            **/*.md
          timeout: 300000

      # ---------------------------------------------------------------
      # BACKEND TICKETING (situs customer). Databasenya SAMA dengan
      # event-api-mysql — lihat ticketing-mysql/README.md. Yang berbeda
      # cuma pintunya: endpoint sempit untuk publik + kunci Xendit.
      #
      # config*.php DIKECUALIKAN seperti backend lain, dan di sini
      # taruhannya lebih besar: berkas itu memuat password database DAN
      # secret key Xendit. Menimpanya dari repo = mematikan pembayaran.
      # ---------------------------------------------------------------
      - name: Deploy backend ticketing-api
        id: ftptix
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.DEV_FTP_SERVER }}
          username: ${{ secrets.DEV_FTP_USERNAME }}
          password: ${{ secrets.DEV_FTP_PASSWORD }}
          local-dir: ./ticketing-mysql/
          server-dir: /ticketing-api/
          exclude: |
            config*.php
            **/config*.php
            *.sql
            **/*.sql
            *.md
            **/*.md
          timeout: 300000

      - name: Deploy backend ticketing-api (percobaan 2)
        if: steps.ftptix.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.DEV_FTP_SERVER }}
          username: ${{ secrets.DEV_FTP_USERNAME }}
          password: ${{ secrets.DEV_FTP_PASSWORD }}
          local-dir: ./ticketing-mysql/
          server-dir: /ticketing-api/
          exclude: |
            config*.php
            **/config*.php
            *.sql
            **/*.sql
            *.md
            **/*.md
          timeout: 300000

      # kompas-mysql sebelumnya TIDAK ada di workflow mana pun — hanya diunggah
      # manual, dan itu terbukti bikin backend produksi tertinggal berbulan-bulan
      # tanpa ketahuan (lihat catatan sepadan di deploy.yml).
      - name: Deploy backend kompas-api-mysql
        id: ftpkmp
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.DEV_FTP_SERVER }}
          username: ${{ secrets.DEV_FTP_USERNAME }}
          password: ${{ secrets.DEV_FTP_PASSWORD }}
          local-dir: ./kompas-mysql/
          server-dir: /kompas-api-mysql/
          exclude: |
            config*.php
            **/config*.php
            *.sql
            **/*.sql
            *.md
            **/*.md
          timeout: 300000

      - name: Deploy backend kompas-api-mysql (percobaan 2)
        if: steps.ftpkmp.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.DEV_FTP_SERVER }}
          username: ${{ secrets.DEV_FTP_USERNAME }}
          password: ${{ secrets.DEV_FTP_PASSWORD }}
          local-dir: ./kompas-mysql/
          server-dir: /kompas-api-mysql/
          exclude: |
            config*.php
            **/config*.php
            *.sql
            **/*.sql
            *.md
            **/*.md
          timeout: 300000

      - name: Deploy backend jadwal-api-mysql
        id: ftpjdw
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.DEV_FTP_SERVER }}
          username: ${{ secrets.DEV_FTP_USERNAME }}
          password: ${{ secrets.DEV_FTP_PASSWORD }}
          local-dir: ./jadwal-mysql/
          server-dir: /jadwal-api-mysql/
          exclude: |
            config*.php
            **/config*.php
            *.sql
            **/*.sql
            *.md
            **/*.md
          timeout: 300000

      - name: Deploy backend jadwal-api-mysql (percobaan 2)
        if: steps.ftpjdw.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.DEV_FTP_SERVER }}
          username: ${{ secrets.DEV_FTP_USERNAME }}
          password: ${{ secrets.DEV_FTP_PASSWORD }}
          local-dir: ./jadwal-mysql/
          server-dir: /jadwal-api-mysql/
          exclude: |
            config*.php
            **/config*.php
            *.sql
            **/*.sql
            *.md
            **/*.md
          timeout: 300000

      # dw-mysql ikut sejak modulnya lahir, alasan yang sama dengan jadwal di atas:
      # backend yang tidak pernah masuk workflow akan tertinggal versi lama
      # berbulan-bulan tanpa ada gejala yang jelas.
      - name: Deploy backend dw-api-mysql
        id: ftpdw
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.DEV_FTP_SERVER }}
          username: ${{ secrets.DEV_FTP_USERNAME }}
          password: ${{ secrets.DEV_FTP_PASSWORD }}
          local-dir: ./dw-mysql/
          server-dir: /dw-api-mysql/
          exclude: |
            config*.php
            **/config*.php
            *.sql
            **/*.sql
            *.md
            **/*.md
          timeout: 300000

      - name: Deploy backend dw-api-mysql (percobaan 2)
        if: steps.ftpdw.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.DEV_FTP_SERVER }}
          username: ${{ secrets.DEV_FTP_USERNAME }}
          password: ${{ secrets.DEV_FTP_PASSWORD }}
          local-dir: ./dw-mysql/
          server-dir: /dw-api-mysql/
          exclude: |
            config*.php
            **/config*.php
            *.sql
            **/*.sql
            *.md
            **/*.md
          timeout: 300000

      # ==================================================================
      # ABSENSI — SITUS SENDIRI, BUKAN BAGIAN DARI OFFICE
      # ------------------------------------------------------------------
      # Di produksi ia berdiri di absensi.laksamanamuda.id. Di dev tidak perlu
      # subdomain terpisah: ia cukup jadi subfolder biasa
      # (dev.laksamanamuda.id/absensi/), dan backend-nya DI DALAM folder itu
      # sehingga jalur relatif 'api/api.php' benar di kedua server tanpa satu
      # pun syarat yang harus diingat orang.
      #
      # Isi folder absensi/ berat (7,8 MB: pustaka wajah + bobot model) dan
      # memang harus ikut ter-deploy. Tanpa model, pengenalan wajah mati total
      # tanpa satu pun pesan galat yang menjelaskan kenapa. Timeout-nya
      # digandakan karena alasan itu.
      - name: Deploy situs absensi
        id: ftpabs
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.DEV_FTP_SERVER }}
          username: ${{ secrets.DEV_FTP_USERNAME }}
          password: ${{ secrets.DEV_FTP_PASSWORD }}
          local-dir: ./absensi/
          server-dir: /absensi/
          timeout: 600000

      - name: Jeda sebelum percobaan 2 absensi
        if: steps.ftpabs.outcome == 'failure'
        run: sleep 45

      - name: Deploy situs absensi (percobaan 2)
        if: steps.ftpabs.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.DEV_FTP_SERVER }}
          username: ${{ secrets.DEV_FTP_USERNAME }}
          password: ${{ secrets.DEV_FTP_PASSWORD }}
          local-dir: ./absensi/
          server-dir: /absensi/
          timeout: 600000

      - name: Deploy backend absensi
        id: ftpabsapi
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.DEV_FTP_SERVER }}
          username: ${{ secrets.DEV_FTP_USERNAME }}
          password: ${{ secrets.DEV_FTP_PASSWORD }}
          local-dir: ./absensi-mysql/
          server-dir: /absensi/api/
          exclude: |
            config*.php
            **/config*.php
            *.sql
            **/*.sql
            *.md
            **/*.md
          timeout: 300000

      - name: Deploy backend absensi (percobaan 2)
        if: steps.ftpabsapi.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.DEV_FTP_SERVER }}
          username: ${{ secrets.DEV_FTP_USERNAME }}
          password: ${{ secrets.DEV_FTP_PASSWORD }}
          local-dir: ./absensi-mysql/
          server-dir: /absensi/api/
          exclude: |
            config*.php
            **/config*.php
            *.sql
            **/*.sql
            *.md
            **/*.md
          timeout: 300000


      # Verifikasi HARUS membuktikan file di server = file di repo.
      # Cek lama hanya mencari "</html>" — itu lolos juga pada halaman 404 dan pada file LAMA
      # yang masih utuh, sehingga deploy yang sama sekali tidak mendarat tetap dilaporkan OK.
      # Sekarang isinya dibandingkan langsung. FTP mengubah CRLF→LF, jadi \r dibuang dulu di
      # kedua sisi (tanpa ini selalu "beda" sebanyak jumlah baris).
      # if: always() — verifikasi HARUS tetap jalan walau kedua percobaan FTP
      # gagal. Tanpa ini langkah ini dilewati, dan yang tersisa cuma "FTP
      # gagal" tanpa keterangan file MANA yang tertinggal di server. Padahal
      # justru itu yang perlu diketahui: sebagian file biasanya sudah mendarat.
      - name: Verifikasi file di server benar-benar versi ini
        id: cek1
        if: always()
        continue-on-error: true
        run: bash tools/verifikasi-deploy.sh https://dev.laksamanamuda.id

      # ==================================================================
      # UNGGAH PAKSA — jaring pengaman untuk kegagalan yang TIDAK terdeteksi
      # oleh percobaan 1-3 di atas.
      #
      # Ketiga percobaan itu dipicu oleh `outcome == 'failure'` milik langkah
      # FTP sebelumnya. Itu tidak menolong untuk kegagalan yang paling licik:
      # aksi FTP melaporkan SUKSES padahal berkasnya tidak dikirim sama
      # sekali. Terjadi 4 Agustus 2026 pada reservasi/index.html — server
      # masih memegang versi commit sebelumnya, UTUH (583.958 byte, sama
      # persis dgn commit lama), bukan terpotong. Artinya bukan transfer yang
      # putus, melainkan berkasnya dilewati.
      #
      # Sebabnya `.ftp-deploy-sync-state.json` di server: aksi ini memutuskan
      # apa yang perlu dikirim dengan membandingkan hash ke berkas itu, dan
      # kalau state-nya terlanjur mencatat hash BARU sementara transfernya
      # gagal, run berikutnya menyimpulkan "tidak ada yang berubah" —
      # selamanya, karena hash repo tidak akan berubah lagi.
      #
      # `state-name` unik per run membuat aksi tidak menemukan state apa pun,
      # jadi ia mengunggah SEMUANYA. Bukan `dangerous-clean-slate`: itu
      # menghapus berkas di server yang tidak ada di local-dir, dan local-dir
      # kita (./deploy/) tidak memuat folder backend — seluruh API akan ikut
      # terhapus.
      #
      # Hanya jalan kalau verifikasi pertama gagal, jadi run normal tetap
      # cepat. Efek sampingnya satu berkas state kecil tertinggal per run
      # yang gagal; itu harga yang jauh lebih murah daripada deploy yang diam
      # -diam tidak mendarat.
      # ==================================================================
      - name: Unggah paksa (abaikan sync-state) karena verifikasi gagal
        if: always() && steps.cek1.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.DEV_FTP_SERVER }}
          username: ${{ secrets.DEV_FTP_USERNAME }}
          password: ${{ secrets.DEV_FTP_PASSWORD }}
          local-dir: ./deploy/
          server-dir: /
          state-name: .ftp-deploy-paksa-${{ github.run_id }}.json
          timeout: 300000

      # Unggah paksa cuma SEKALI ternyata belum cukup. 5 Agustus 2026:
      # service_excellent/index.html (601KB, terbesar kedua setelah marketing)
      # tidak mendarat di percobaan biasa MAUPUN di unggah paksa — server tetap
      # memegang berkas commit sebelumnya, utuh 600.599 byte. Deploy gagal
      # gara-gara satu berkas, dan tidak ada kesempatan kedua.
      #
      # Gerbangnya VERIFIKASI, bukan outcome langkah FTP sebelumnya: unggah
      # paksa bisa saja melaporkan sukses padahal berkasnya dilewati — itu
      # justru penyakit yang sedang diobati di sini. Jadi diperiksa dulu, baru
      # diputuskan perlu-tidaknya percobaan kedua.
      - name: Verifikasi setelah unggah paksa
        id: cek2
        if: always() && steps.cek1.outcome == 'failure'
        continue-on-error: true
        run: bash tools/verifikasi-deploy.sh https://dev.laksamanamuda.id

      # Jeda panjang: kegagalan yang sampai di titik ini bukan gangguan sesaat
      # (sudah lewat 1-3 percobaan biasa + 1 unggah paksa), jadi menembak lagi
      # dalam hitungan detik menabrak dinding yang sama.
      - name: Jeda sebelum unggah paksa 2
        if: always() && steps.cek2.outcome == 'failure'
        run: sleep 90

      - name: Unggah paksa 2 (kesempatan terakhir)
        if: always() && steps.cek2.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.DEV_FTP_SERVER }}
          username: ${{ secrets.DEV_FTP_USERNAME }}
          password: ${{ secrets.DEV_FTP_PASSWORD }}
          local-dir: ./deploy/
          server-dir: /
          state-name: .ftp-deploy-paksa2-${{ github.run_id }}.json
          timeout: 300000

      - name: Verifikasi ulang (penentu lulus/tidak)
        if: always()
        run: bash tools/verifikasi-deploy.sh https://dev.laksamanamuda.id

      # ==================================================================
      # VERIFIKASI BACKEND — beda caranya dari frontend.
      # Berkas PHP tidak bisa dibandingkan isinya lewat HTTP: yang dikirim
      # server adalah HASIL eksekusinya, bukan kodenya. Jadi yang diuji
      # PERILAKUNYA.
      #
      # Tiga hal yang dibuktikan, berurutan dari yang paling sering salah:
      #   1. env — memastikan situs ini bicara ke database DEV. Salah pasang
      #      config (dev menunjuk db produksi) adalah kesalahan paling mahal
      #      di repo ini, dan ping memang dibuat untuk menangkapnya.
      #   2. whoami dikenal — membuktikan api.php versi BARU yang mendarat.
      #      Versi lama menjawab 'unknown_action'; versi baru menolak token
      #      palsu dengan 'invalid_token'. Ini pembeda yang tepat, bukan
      #      sekadar "endpoint hidup".
      #   3. usage.php benar-benar dijalankan sampai memuat lib_stock_catat.
      #      ?action=ping TIDAK cukup: _boot menjawab ping lalu berhenti
      #      SEBELUM lib itu di-require, jadi salah tulis di sana tidak
      #      akan ketahuan. Permintaan daftar biasa memuatnya, dan galat
      #      parse akan muncul sebagai HTTP 500.
      # ==================================================================
      - name: Verifikasi backend hidup dan versi terbaru
        if: always()
        run: |
          gagal=0

          echo "--- account-api-mysql ---"
          acc=$(curl -s -m 60 "https://dev.laksamanamuda.id/account-api-mysql/api.php?action=ping&ci=$GITHUB_SHA")
          echo "ping: $acc"
          case "$acc" in
            *'"env":"dev"'*) echo "OK      env=dev" ;;
            *) echo "GAGAL   env BUKAN dev — config.php salah atau API tidak terjangkau"; gagal=1 ;;
          esac

          who=$(curl -s -m 60 -X POST "https://dev.laksamanamuda.id/account-api-mysql/api.php" \
                  -H 'Content-Type: text/plain;charset=utf-8' \
                  -d '{"action":"whoami","token":"ci-probe-token-yang-pasti-salah"}')
          echo "whoami: $who"
          case "$who" in
            *invalid_token*) echo "OK      whoami dikenal (versi baru mendarat)" ;;
            *unknown_action*) echo "GAGAL   whoami TIDAK dikenal — api.php di server masih versi lama"; gagal=1 ;;
            *) echo "GAGAL   whoami menjawab tak terduga"; gagal=1 ;;
          esac

          echo "--- stock-api-mysql ---"
          stk=$(curl -s -m 60 "https://dev.laksamanamuda.id/stock-api-mysql/usage.php?action=ping&ci=$GITHUB_SHA")
          echo "ping: $stk"
          case "$stk" in
            *'"env":"dev"'*) echo "OK      env=dev" ;;
            *) echo "GAGAL   env BUKAN dev — config.php salah atau API tidak terjangkau"; gagal=1 ;;
          esac

          kode=$(curl -s -m 60 -o /tmp/usage.json -w '%{http_code}' \
                 "https://dev.laksamanamuda.id/stock-api-mysql/usage.php?dari=2000-01-01&ke=2000-01-02&ci=$GITHUB_SHA")
          echo "daftar usage: HTTP $kode -> $(head -c 200 /tmp/usage.json)"
          if [ "$kode" = "200" ]; then
            echo "OK      usage.php memuat lib_stock_catat tanpa galat"
          else
            echo "GAGAL   usage.php balas HTTP $kode — kemungkinan galat PHP di lib_stock_catat.php"
            gagal=1
          fi

          echo "--- kompas-api-mysql ---"
          kmp=$(curl -s -m 60 "https://dev.laksamanamuda.id/kompas-api-mysql/api.php?action=ping&ci=$GITHUB_SHA")
          echo "ping: $kmp"
          case "$kmp" in
            *'"env":"dev"'*) echo "OK      env=dev" ;;
            *) echo "GAGAL   env BUKAN dev — config.php salah atau API tidak terjangkau"; gagal=1 ;;
          esac

          # Penanda versi: penyimpan blob membalas {bytes,updated_at,ada};
          # backend lama (multi-tabel) membalas {daily,targets,cashiers,...}.
          kmps=$(curl -s -m 60 "https://dev.laksamanamuda.id/kompas-api-mysql/api.php?action=stats&ci=$GITHUB_SHA")
          echo "stats: $(printf '%s' "$kmps" | head -c 300)"
          case "$kmps" in
            *'"ada"'*) echo "OK      stats berbentuk blob (versi baru mendarat)" ;;
            *) echo "GAGAL   stats masih berbentuk multi-tabel — lib_kompas_mysql.php di server MASIH VERSI LAMA"; gagal=1 ;;
          esac

          # ping cuma baca konstanta config dan stats MENELAN galat DB
          # (catch Throwable -> ada:false), jadi keduanya BUTA terhadap
          # kredensial/grant yang salah. Itu persis yang terjadi 27 Juli 2026:
          # modul kelihatan hidup, tapi setiap simpan ditolak MySQL 1044.
          # saveAll TANPA field `data` memaksa jalur tulis dibuka — db_lock()
          # menyentuh DB lebih dulu — lalu berhenti di validasi payload, jadi
          # TIDAK ADA yang ditulis. "Payload kosong/invalid" = koneksi sehat.
          probe=$(curl -s -m 60 -X POST "https://dev.laksamanamuda.id/kompas-api-mysql/api.php" \
                    -H 'Content-Type: text/plain;charset=utf-8' \
                    -d '{"action":"saveAll"}')
          echo "probe tulis: $(printf '%s' "$probe" | head -c 300)"
          case "$probe" in
            *'Payload kosong'*) echo "OK      koneksi DB sehat, jalur simpan terbuka" ;;
            *SQLSTATE*)         echo "GAGAL   DB menolak — cek user/grant di cPanel untuk database kompas"; gagal=1 ;;
            *)                  echo "GAGAL   probe menjawab tak terduga"; gagal=1 ;;
          esac

          echo "--- jadwal-api-mysql ---"
          jdw=$(curl -s -m 60 "https://dev.laksamanamuda.id/jadwal-api-mysql/api.php?action=ping&ci=$GITHUB_SHA")
          echo "ping: $jdw"
          case "$jdw" in
            *'"env":"dev"'*) echo "OK      env=dev" ;;
            *) echo "GAGAL   env BUKAN dev — config.php belum diunggah manual ke /jadwal-api-mysql/ atau salah isi"; gagal=1 ;;
          esac

          # Probe tulis: simpanSel TANPA rows/hapus membuka transaksi (dan
          # CREATE TABLE IF NOT EXISTS) lalu commit tanpa menulis apa pun.
          # Ini menyentuh DB sungguhan, jadi grant yang salah muncul sebagai
          # SQLSTATE — sesuatu yang ping dan stats sama sekali tidak bisa
          # lihat (stats menelan galat DB dan membalas nol).
          jdwp=$(curl -s -m 60 -X POST "https://dev.laksamanamuda.id/jadwal-api-mysql/api.php" \
                   -H 'Content-Type: text/plain;charset=utf-8' \
                   -d '{"action":"simpanSel"}')
          echo "probe tulis: $(printf '%s' "$jdwp" | head -c 300)"
          case "$jdwp" in
            *'"isi":0'*) echo "OK      koneksi DB sehat, tabel siap, tidak ada baris ditulis" ;;
            *SQLSTATE*)  echo "GAGAL   DB menolak — cek user/grant di cPanel untuk database jadwal"; gagal=1 ;;
            *)           echo "GAGAL   probe menjawab tak terduga"; gagal=1 ;;
          esac

          # --- dw-api-mysql ---------------------------------------------
          # Database dan config.php kedua lingkungan sudah terpasang (5 Agustus
          # 2026), jadi gerbangnya sekarang KERAS seperti jadwal di atas.
          echo "--- dw-api-mysql ---"
          dwp=$(curl -s -m 60 "https://dev.laksamanamuda.id/dw-api-mysql/api.php?action=ping&ci=$GITHUB_SHA")
          echo "ping: $dwp"
          case "$dwp" in
            *'"env":"dev"'*) echo "OK      env=dev" ;;
            *) echo "GAGAL   env BUKAN dev — config.php belum diunggah manual ke /dw-api-mysql/ atau salah isi"; gagal=1 ;;
          esac

          # ping HANYA membacakan isi config.php — ia tetap hijau walau database
          # menolak kredensialnya, karena tidak satu pun kueri dijalankan di sana.
          # Itu sudah menyembunyikan user MySQL yang passwordnya tidak cocok
          # selama satu siklus deploy penuh pada 5 Agustus 2026: ping OK, env
          # benar, dan modulnya tetap tidak bisa menyimpan apa pun.
          # stats-lah yang menyentuh DB sungguhan dan melaporkan "ada":true.
          dws=$(curl -s -m 60 "https://dev.laksamanamuda.id/dw-api-mysql/api.php?action=stats&ci=$GITHUB_SHA")
          echo "stats: $(printf '%s' "$dws" | head -c 300)"
          case "$dws" in
            *'"ada":true'*) echo "OK      koneksi DB sehat, tabel siap" ;;
            *1045*)      echo "GAGAL   user/password MySQL dw tidak cocok dengan config.php — samakan lewat cPanel > MySQL Databases > Change Password"; gagal=1 ;;
            *1044*)      echo "GAGAL   user MySQL dw belum di-Add User To Database (ALL PRIVILEGES)"; gagal=1 ;;
            *SQLSTATE*)  echo "GAGAL   DB menolak — cek user/grant di cPanel untuk database dw"; gagal=1 ;;
            *)           echo "GAGAL   stats menjawab tak terduga"; gagal=1 ;;
          esac

          exit $gagal