name: Deploy to Dev

on:
  push:
    branches: [ develop ]

jobs:
  web-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # continue-on-error: transfer FTP ke Rumahweb kadang putus di tengah tanpa
      # sebab yang bisa kita kendalikan (sudah kejadian 16 Juli 2026 2x, lalu
      # 21 Juli 2026 pada reservasi/index.html yang 513KB). Kegagalan di sini
      # TIDAK langsung menggagalkan job — percobaan ulang di bawah diberi
      # kesempatan, dan yang menentukan lulus/tidak tetap langkah Verifikasi
      # yang membandingkan isi file di server dengan repo.
      - name: Deploy via FTP
        id: ftp1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.DEV_FTP_SERVER }}
          username: ${{ secrets.DEV_FTP_USERNAME }}
          password: ${{ secrets.DEV_FTP_PASSWORD }}
          local-dir: ./deploy/
          # PENTING — akun FTP dev BERBEDA sifatnya dari akun produksi:
          # rumahnya SUDAH berada di docroot subdomain (/public_html/dev.laksamanamuda.id/),
          # jadi server-dir di sini relatif terhadap docroot itu → cukup "/".
          # Mengisi ".../dev.laksamanamuda.id/dev_office/" (versi awal) atau
          # ".../dev.laksamanamuda.id/" membuat path BERTUMPUK, mis. file mendarat di
          # dev.laksamanamuda.id/public_html/dev.laksamanamuda.id/reservasi/ — terbukti
          # lewat percobaan: FTP "sukses" tapi dev.laksamanamuda.id/reservasi/ tak berubah.
          # (Beda dengan produksi yang akunnya di root akun → memakai /public_html/office/.)
          server-dir: /
          timeout: 300000

      # Percobaan ke-2 dan ke-3, masing-masing hanya bila yang sebelumnya gagal.
      #
      # Dua percobaan ternyata belum cukup: pada 21 Juli 2026 file reservasi
      # (±530KB, terbesar di repo) gagal terkirim dua run berturut-turut dan
      # baru mendarat di kesempatan ketiga. Putusnya selalu di tengah transfer,
      # bukan kredensial atau path salah — yang begitu memang tidak sembuh
      # dengan diulang, tapi koneksi putus jelas sembuh.
      - name: Deploy via FTP (percobaan 2)
        id: ftp2
        continue-on-error: true
        if: steps.ftp1.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.DEV_FTP_SERVER }}
          username: ${{ secrets.DEV_FTP_USERNAME }}
          password: ${{ secrets.DEV_FTP_PASSWORD }}
          local-dir: ./deploy/
          server-dir: /
          timeout: 300000

      - name: Deploy via FTP (percobaan 3)
        if: steps.ftp1.outcome == 'failure' && steps.ftp2.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.DEV_FTP_SERVER }}
          username: ${{ secrets.DEV_FTP_USERNAME }}
          password: ${{ secrets.DEV_FTP_PASSWORD }}
          local-dir: ./deploy/
          server-dir: /
          timeout: 300000

      # Verifikasi HARUS membuktikan file di server = file di repo.
      # Cek lama hanya mencari "</html>" — itu lolos juga pada halaman 404 dan pada file LAMA
      # yang masih utuh, sehingga deploy yang sama sekali tidak mendarat tetap dilaporkan OK.
      # Sekarang isinya dibandingkan langsung. FTP mengubah CRLF→LF, jadi \r dibuang dulu di
      # kedua sisi (tanpa ini selalu "beda" sebanyak jumlah baris).
      # if: always() — verifikasi HARUS tetap jalan walau kedua percobaan FTP
      # gagal. Tanpa ini langkah ini dilewati, dan yang tersisa cuma "FTP
      # gagal" tanpa keterangan file MANA yang tertinggal di server. Padahal
      # justru itu yang perlu diketahui: sebagian file biasanya sudah mendarat.
      - name: Verifikasi file di server benar-benar versi ini
        if: always()
        run: |
          gagal=0
          for m in "" marketing/ reservasi/ event/ akademi/ konten/ stock/; do
            src="deploy/${m}index.html"
            if [ ! -f "$src" ]; then echo "LEWAT   ${m:-/} (tidak ada di repo)"; continue; fi
            url="https://dev.laksamanamuda.id/${m}index.html"
            curl -s -m 90 "$url?ci=$GITHUB_SHA" -o /tmp/live.html || true
            tr -d '\r' < "$src" > /tmp/a
            tr -d '\r' < /tmp/live.html > /tmp/b
            if cmp -s /tmp/a /tmp/b; then
              echo "OK      ${m:-/} ($(wc -c < /tmp/b) byte, sama persis dgn repo)"
            else
              echo "GAGAL   ${m:-/} — isi di server BEDA dari repo (tidak ter-upload / terpotong / salah folder)"
              echo "        repo=$(wc -c < /tmp/a) byte, server=$(wc -c < /tmp/b) byte"
              grep -q '</html>' /tmp/b || echo "        server tidak punya </html> → terpotong atau 404"
              gagal=1
            fi
          done
          exit $gagal