<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2A2620">
<title>Galangan HPP, Laksamana Muda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* ================= TEMA (dari tema.css, disalin inline agar file mandiri) ================= */
:root{
  --ink:#2A2620; --ink-2:#3A3428; --ink-3:#4A4234;
  --gold:#A9791F; --gold-2:#C8961F; --gold-dim:#7A560F; --gold-soft:#F2E9D3; --gold-glow:rgba(169,121,31,.13);
  --paper:#F7F6F4; --surface:#FFFFFF; --line:#E7E1D3; --line-soft:rgba(60,55,45,.10); --line-hard:rgba(60,55,45,.18);
  --text:#2A2620; --muted:#5C574D; --muted-2:#928C80;
  --ok:#1F9D5F; --ok-bg:#E4F5EC; --ok-bg-t:rgba(31,157,95,.12);
  --warn:#B5831A; --warn-bg:#F7EFDB; --warn-bg-t:rgba(181,131,26,.14);
  --danger:#C9432B; --danger-bg:#F8E4DF; --danger-bg-t:rgba(201,67,43,.12);
  --info:#2F7FC4; --info-bg:#E4EFF8; --info-bg-t:rgba(47,127,196,.12);
  --violet:#7C5FC0; --violet-bg:#ECE6F7;
  --teal:#1F9D8F; --teal-bg:#E2F4F2;
  --radius:16px; --radius-sm:10px; --radius-lg:20px;
  --shadow:0 4px 18px rgba(50,42,28,.06); --shadow-lg:0 18px 48px rgba(50,42,28,.12);
  --ring:0 0 0 3px rgba(227,160,8,.18); --ease:cubic-bezier(.16,1,.3,1);
  --font-display:'Plus Jakarta Sans',system-ui,sans-serif;
  --font-body:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --sidebar-w:250px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font-body);background:radial-gradient(900px 480px at 50% -12%, rgba(227,160,8,.09), transparent 60%),var(--paper);color:var(--text);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:700;letter-spacing:-.02em;line-height:1.18;color:var(--ink)}
a{color:var(--info)} button{font-family:inherit;cursor:pointer} input,select,textarea{font-family:inherit}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.hidden{display:none !important}
@keyframes lm-rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.rise{animation:lm-rise .5s var(--ease) both}
/* Buttons */
.btn{border:none;border-radius:var(--radius-sm);padding:11px 16px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:filter .15s var(--ease),transform .1s var(--ease)}
.btn:active{transform:translateY(1px)} .btn:focus-visible{outline:none;box-shadow:var(--ring)} .btn-block{width:100%}
.btn-primary{background:linear-gradient(135deg,var(--gold-2),var(--gold-dim));color:#fff;box-shadow:0 3px 12px rgba(122,86,15,.28)}
.btn-primary:hover{filter:brightness(1.06)}
.btn-ghost{background:var(--surface);border:1.5px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--gold-2);background:var(--gold-soft)}
.btn-sm{padding:7px 11px;font-size:12.5px;border-radius:8px}
.btn-danger{background:var(--danger-bg);color:var(--danger);border:1.5px solid transparent}
.btn-danger:hover{border-color:var(--danger)}
/* Pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--ink-2);background:var(--gold-soft);border:1px solid var(--line);border-radius:20px;padding:3px 9px}
.pill .dot{width:5px;height:5px;border-radius:50%;background:var(--gold);flex:none}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;border-radius:20px;padding:3px 10px}
.tag-ok{color:var(--ok);background:var(--ok-bg)} .tag-warn{color:var(--warn);background:var(--warn-bg)} .tag-danger{color:var(--danger);background:var(--danger-bg)}
.tag-food{color:var(--danger);background:var(--danger-bg)} .tag-bev{color:var(--info);background:var(--info-bg)} .tag-olahan{color:var(--violet);background:var(--violet-bg)}
/* Fields */
.field{text-align:left;margin-bottom:13px} .field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);font-size:14px;transition:border-color .15s,box-shadow .15s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--gold);box-shadow:var(--ring)}
/* Cards / tables */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted-2);font-weight:700;padding:10px 12px;border-bottom:1.5px solid var(--line)}
td{padding:11px 12px;border-bottom:1px solid var(--line-soft);font-size:13.5px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--gold-soft)}
/* ================= LOGIN ================= */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(1000px 600px at 50% -10%,rgba(200,150,31,.14),transparent 60%),var(--ink)}
.login-card{width:100%;max-width:400px;background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:34px 30px;text-align:center}
.crest{width:62px;height:62px;margin:0 auto 16px;border-radius:16px;background:linear-gradient(135deg,var(--gold-2),var(--gold-dim));display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-display);font-weight:800;font-size:26px;box-shadow:0 8px 22px rgba(122,86,15,.35)}
.login-card h1{font-size:22px;margin-bottom:3px} .login-card .sub{color:var(--muted);font-size:13px;margin-bottom:22px}
.role-pick{display:grid;gap:10px;margin-bottom:18px}
.role-opt{display:flex;gap:12px;align-items:center;text-align:left;padding:12px 14px;border:1.5px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);transition:.15s}
.role-opt:hover{border-color:var(--gold-2);background:var(--gold-soft)}
.role-opt.active{border-color:var(--gold);background:var(--gold-soft);box-shadow:var(--ring)}
.role-opt .ico{font-size:22px} .role-opt .nm{font-weight:700;font-size:14px;color:var(--ink)} .role-opt .ds{font-size:11.5px;color:var(--muted)}
#pinInput{letter-spacing:8px;text-align:center;font-size:20px;font-weight:700}
.login-err{color:var(--danger);font-size:12.5px;margin-top:10px;min-height:16px;font-weight:600}
/* ================= APP SHELL ================= */
#app{display:none;min-height:100vh}
.shell{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);flex:none;background:var(--ink);color:#EDE7D8;padding:20px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.sb-brand{display:flex;align-items:center;gap:11px;padding:4px 8px 18px}
.sb-crest{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--gold-2),var(--gold-dim));display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-display);font-weight:800;font-size:17px;flex:none}
.sb-brand .t{font-family:var(--font-display);font-weight:800;font-size:15px;color:#fff;line-height:1.1}
.sb-brand .s{font-size:10.5px;color:var(--gold-2);letter-spacing:.4px}
.nav{display:flex;flex-direction:column;gap:3px;margin-top:6px}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:#CFC7B4;font-size:13.5px;font-weight:600;border:none;background:none;text-align:left;width:100%;transition:.13s}
.nav-item .ic{width:20px;text-align:center;font-size:15px}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:linear-gradient(135deg,rgba(200,150,31,.9),rgba(122,86,15,.85));color:#fff}
.sb-foot{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.1)}
.who{display:flex;align-items:center;gap:10px;padding:6px 8px;font-size:12px;color:#CFC7B4}
.who .av{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:14px;flex:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:16px 26px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.7);backdrop-filter:blur(8px);position:sticky;top:0;z-index:20}
.topbar h2{font-size:19px} .topbar .desc{font-size:12.5px;color:var(--muted)}
.menu-btn{display:none;background:none;border:1.5px solid var(--line);border-radius:9px;width:38px;height:38px;font-size:18px}
.content{padding:24px 26px 60px;max-width:1180px;width:100%}
.section-hd{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.section-hd h3{font-size:16px} .section-hd .l{font-size:12.5px;color:var(--muted);margin-top:2px}
/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.kpi .k{font-size:11.5px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.kpi .v{font-family:var(--font-display);font-weight:800;font-size:26px;margin-top:6px;color:var(--ink)}
.kpi .m{font-size:11.5px;color:var(--muted);margin-top:3px}
/* toolbar */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar input,.toolbar select{padding:9px 12px;border:1.5px solid var(--line);border-radius:9px;background:var(--surface);font-size:13.5px}
.toolbar .grow{flex:1;min-width:160px}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(30,26,20,.5);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;z-index:60;overflow:auto}
.modal{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);width:100%;max-width:640px;padding:24px}
.modal h3{font-size:18px;margin-bottom:4px} .modal .mh-sub{font-size:12.5px;color:var(--muted);margin-bottom:18px}
.modal-x{float:right;background:none;border:none;font-size:22px;color:var(--muted-2);line-height:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.comp-row{display:grid;grid-template-columns:1fr 84px 78px auto;gap:8px;align-items:end;margin-bottom:8px}
.comp-row .field{margin-bottom:0}
.comp-cost{font-size:12.5px;color:var(--muted);text-align:right;padding-bottom:11px;font-weight:600}
.hint{background:var(--gold-soft);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 14px;font-size:12.5px;color:var(--ink-2);margin-bottom:16px}
.hint b{color:var(--gold-dim)}
.result-box{border-radius:var(--radius);padding:18px 20px;text-align:center;margin-top:8px}
.result-box .big{font-family:var(--font-display);font-weight:800;font-size:40px;line-height:1}
.result-box .lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
.empty{text-align:center;padding:44px 20px;color:var(--muted-2)}
.empty .e-ic{font-size:34px;margin-bottom:8px}
.mini-bar{height:7px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:5px}
.mini-bar > i{display:block;height:100%;border-radius:6px}
.recipe-line{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:6px 0;border-bottom:1px dashed var(--line-soft)}
.recipe-line:last-child{border-bottom:none}
.locknote{font-size:11.5px;color:var(--muted-2);display:inline-flex;gap:5px;align-items:center}
.stepper{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.step-pill{font-size:12px;font-weight:700;color:var(--muted);background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:5px 13px}
.step-pill b{color:var(--gold-dim)}
@media(max-width:860px){
  .sidebar{position:fixed;left:0;top:0;z-index:50;transform:translateX(-100%);transition:transform .25s var(--ease);box-shadow:var(--shadow-lg)}
  .sidebar.open{transform:translateX(0)}
  .menu-btn{display:flex;align-items:center;justify-content:center}
  .grid2{grid-template-columns:1fr}
  .comp-row{grid-template-columns:1fr 70px 62px auto}
  .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40}
}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="login">
  <div class="login-card rise">
    <div class="crest">LM</div>
    <h1>Galangan HPP</h1>
    <div class="sub">Kontrol Bahan Baku &amp; COGS, Laksamana Muda</div>
    <div class="role-pick">
      <button class="role-opt" data-role="bisnis" onclick="APP.pickRole('bisnis')">
        <span class="ico">&#9784;</span>
        <span><span class="nm">Tim Bisnis</span><br><span class="ds">Nahkoda, Finance. Akses penuh &amp; rahasia perusahaan</span></span>
      </button>
      <button class="role-opt" data-role="galangan" onclick="APP.pickRole('galangan')">
        <span class="ico">&#127859;</span>
        <span><span class="nm">Galangan &amp; Bar</span><br><span class="ds">Chef, Bar. Bahan, resep, persentase &amp; kalkulator</span></span>
      </button>
    </div>
    <div class="field"><input id="pinInput" type="password" inputmode="numeric" maxlength="6" placeholder="PIN" onkeydown="if(event.key==='Enter')APP.login()"></div>
    <button class="btn btn-primary btn-block" onclick="APP.login()">Masuk</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app">
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="sb-brand">
        <div class="sb-crest">LM</div>
        <div><div class="t">Galangan HPP</div><div class="s">Laksamana Muda</div></div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sb-foot">
        <div class="who"><div class="av" id="whoAv">&#9784;</div><div><div id="whoName" style="font-weight:700;color:#fff">Tim Bisnis</div><div id="whoRole" style="font-size:11px">Akses penuh</div></div></div>
        <button class="nav-item" onclick="APP.logout()" style="margin-top:6px"><span class="ic">&#8631;</span> Keluar</button>
      </div>
    </aside>
    <div class="backdrop hidden" id="backdrop" onclick="APP.toggleNav(false)"></div>
    <main class="main">
      <div class="topbar">
        <button class="menu-btn" onclick="APP.toggleNav(true)">&#9776;</button>
        <div><h2 id="pageTitle">Anjungan</h2><div class="desc" id="pageDesc"></div></div>
      </div>
      <div class="content" id="view"></div>
    </main>
  </div>
</div>

<script>
/* =====================================================================
   GALANGAN HPP, Laksamana Muda
   Single file, vanilla JS, localStorage. Namespace APP.* untuk onclick.
   ===================================================================== */
(function(){
"use strict";

/* ---------- Konstanta ---------- */
var LS = {
  ingr:'LM_HPP_ingredients_v1',
  olah:'LM_HPP_olahan_v1',
  prod:'LM_HPP_produk_v1',
  pemakaian:'LM_HPP_pemakaian_v1',
  settings:'LM_HPP_settings_v1',
  session:'LM_HPP_session_v1'
};
var UNITS = ['g','ml','pcs'];  // unit dasar resep
var KAT_BAHAN = ['Kopi','Susu & Dairy','Sirup & Gula','Buah & Sayur','Protein','Karbo & Tepung','Bumbu','Kemasan','Lainnya'];

/* ---------- Helper ---------- */
function $(id){return document.getElementById(id);}
function load(k,def){try{var v=JSON.parse(localStorage.getItem(k));return v==null?def:v;}catch(e){return def;}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v));}
function uid(p){return (p||'id')+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function rp(n){if(n==null||isNaN(n))return 'Rp 0';return 'Rp '+Math.round(n).toLocaleString('id-ID');}
function rp2(n){if(n==null||isNaN(n))return 'Rp 0';return 'Rp '+(Math.round(n*100)/100).toLocaleString('id-ID',{maximumFractionDigits:2});}
function pct(n){if(n==null||isNaN(n))return '0%';return (Math.round(n*10)/10).toLocaleString('id-ID')+'%';}
function num(v){var n=parseFloat(v);return isNaN(n)?0:n;}

/* ---------- Data stores ---------- */
var Ingr, Olah, Prod, Pem, Settings, Session;
function reloadStores(){
  Ingr=load(LS.ingr,[]); Olah=load(LS.olah,[]); Prod=load(LS.prod,[]);
  Pem=load(LS.pemakaian,[]); Settings=load(LS.settings,defaultSettings());
}
function defaultSettings(){
  return {
    pinBisnis:'2468', pinGalangan:'1357',
    // ambang persen COGS. aman: <= amanMax. waspada: <= waspadaMax. bahaya: > waspadaMax
    food:{amanMax:32, waspadaMax:37},
    beverage:{amanMax:24, waspadaMax:29}
  };
}

/* ---------- Seed data (contoh, boleh dihapus) ---------- */
function seedIfEmpty(){
  if(load(LS.ingr,null)!==null) return;
  var ing=[
    mkIngr('Biji Kopi Arabika','Kopi','g', 220000, 1000),
    mkIngr('Susu UHT Full Cream','Susu & Dairy','ml', 18000, 1000),
    mkIngr('Gula Pasir','Sirup & Gula','g', 15000, 1000),
    mkIngr('Sirup Gula (beli jadi)','Sirup & Gula','ml', 28000, 630),
    mkIngr('Es Batu','Lainnya','g', 12000, 5000),
    mkIngr('Air Mineral','Lainnya','ml', 6000, 1500),
    mkIngr('Ayam Fillet','Protein','g', 42000, 1000),
    mkIngr('Beras','Karbo & Tepung','g', 14000, 1000),
    mkIngr('Cabai Merah','Bumbu','g', 45000, 1000),
    mkIngr('Bawang Putih','Bumbu','g', 38000, 1000),
    mkIngr('Minyak Goreng','Lainnya','ml', 20000, 1000),
    mkIngr('Cup Plastik 16oz + Tutup','Kemasan','pcs', 45000, 50),
    mkIngr('Kotak Nasi','Kemasan','pcs', 60000, 50)
  ];
  save(LS.ingr, ing);
  var idOf=function(nm){var f=ing.filter(function(x){return x.nama===nm;})[0];return f?f.id:null;};
  var ol=[
    mkOlah('Simple Syrup','ml', 1200, [
      {refType:'ingredient', refId:idOf('Gula Pasir'), qty:1000},
      {refType:'ingredient', refId:idOf('Air Mineral'), qty:1000}
    ], 'Gula : air 1:1, dimasak. Hasil bersih sekitar 1200 ml.'),
    mkOlah('Espresso Shot (double, 18g)','pcs', 1, [
      {refType:'ingredient', refId:idOf('Biji Kopi Arabika'), qty:18}
    ], '1 shot = 18 g biji. Yield 1 pcs shot.'),
    mkOlah('Nasi Matang','g', 2600, [
      {refType:'ingredient', refId:idOf('Beras'), qty:1000},
      {refType:'ingredient', refId:idOf('Air Mineral'), qty:1300}
    ], '1000 g beras jadi sekitar 2600 g nasi matang.'),
    mkOlah('Sambal Geprek','g', 520, [
      {refType:'ingredient', refId:idOf('Cabai Merah'), qty:300},
      {refType:'ingredient', refId:idOf('Bawang Putih'), qty:80},
      {refType:'ingredient', refId:idOf('Minyak Goreng'), qty:150}
    ], 'Yield sekitar 520 g sambal.')
  ];
  save(LS.olah, ol);
  var oidOf=function(nm){var f=ol.filter(function(x){return x.nama===nm;})[0];return f?f.id:null;};
  var pr=[
    mkProd('Kopi Susu Laksamana','beverage', 28000, [
      {refType:'olahan', refId:oidOf('Espresso Shot (double, 18g)'), qty:1},
      {refType:'ingredient', refId:idOf('Susu UHT Full Cream'), qty:180},
      {refType:'olahan', refId:oidOf('Simple Syrup'), qty:20},
      {refType:'ingredient', refId:idOf('Es Batu'), qty:120},
      {refType:'ingredient', refId:idOf('Cup Plastik 16oz + Tutup'), qty:1}
    ], 'Signature. Es kopi susu gula aren style.'),
    mkProd('Americano','beverage', 22000, [
      {refType:'olahan', refId:oidOf('Espresso Shot (double, 18g)'), qty:1},
      {refType:'ingredient', refId:idOf('Air Mineral'), qty:180},
      {refType:'ingredient', refId:idOf('Es Batu'), qty:120},
      {refType:'ingredient', refId:idOf('Cup Plastik 16oz + Tutup'), qty:1}
    ], ''),
    mkProd('Nasi Ayam Geprek','food', 32000, [
      {refType:'olahan', refId:oidOf('Nasi Matang'), qty:250},
      {refType:'ingredient', refId:idOf('Ayam Fillet'), qty:150},
      {refType:'olahan', refId:oidOf('Sambal Geprek'), qty:40},
      {refType:'ingredient', refId:idOf('Minyak Goreng'), qty:40},

/* ---------- Lookup ---------- */
function ingrById(id){for(var i=0;i<Ingr.length;i++)if(Ingr[i].id===id)return Ingr[i];return null;}
function olahById(id){for(var i=0;i<Olah.length;i++)if(Olah[i].id===id)return Olah[i];return null;}
function prodById(id){for(var i=0;i<Prod.length;i++)if(Prod[i].id===id)return Prod[i];return null;}

/* ---------- Perhitungan COGS berjenjang ---------- */
function olahCostPerUnit(olah, guard){
  if(!olah) return 0;
  guard = guard || {};
  if(guard[olah.id]) return 0;           // cegah rekursi melingkar
  guard[olah.id]=true;
  var total=0;
  (olah.komponen||[]).forEach(function(k){ total+=komponenCost(k, guard); });
  var y = num(olah.yield)||1;
  guard[olah.id]=false;
  return total/y;
}
function komponenCost(k, guard){
  if(!k||!k.refId) return 0;
  var q=num(k.qty);
  if(k.refType==='ingredient'){
    var ing=ingrById(k.refId); return ing? num(ing.hargaPerUnit)*q : 0;
  }else{
    var ol=olahById(k.refId); return ol? olahCostPerUnit(ol, guard)*q : 0;
  }
}
function prodHPP(prod){
  if(!prod) return 0;
  var t=0; (prod.komponen||[]).forEach(function(k){ t+=komponenCost(k,{}); }); return t;
}
function cogsPct(prod){
  var hpp=prodHPP(prod); var h=num(prod.hargaJual);
  return h>0 ? hpp/h*100 : 0;
}
function statusOf(kategori, p){
  var s = kategori==='food'? Settings.food : Settings.beverage;
  if(p<=s.amanMax) return {k:'ok', t:'Aman', c:'var(--ok)'};
  if(p<=s.waspadaMax) return {k:'warn', t:'Waspada', c:'var(--warn)'};
  return {k:'danger', t:'Bahaya', c:'var(--danger)'};
}

function renderDash(){

  var avg=function(arr){ if(!arr.length)return 0; var s=0; arr.forEach(function(p){s+=cogsPct(p);}); return s/arr.length; };
  var bahaya=allP.filter(function(p){return statusOf(p.kategori,cogsPct(p)).k==='danger';});
  var waspada=allP.filter(function(p){return statusOf(p.kategori,cogsPct(p)).k==='warn';});
  // pemakaian bulan terakhir
  var lastPem = Pem.slice().sort(function(a,b){return a.bulan<b.bulan?1:-1;})[0];
  var pemHPP=0, pemRev=0;
  if(lastPem){ (lastPem.items||[]).forEach(function(it){ var p=prodById(it.produkId); if(p){ pemHPP+=prodHPP(p)*num(it.qty); pemRev+=num(p.hargaJual)*num(it.qty);} }); }

  html+=kpi('Produk Bahaya', bahaya.length, waspada.length+' waspada, perlu ditinjau');

    html+='<div class="card" style="padding:18px 20px;margin-bottom:22px">';
    html+='<div class="section-hd" style="margin-bottom:12px"><div><h3>Belanja COGS, bulan '+esc(fmtBulan(lastPem.bulan))+'</h3><div class="l">Dari data pemakaian terakhir</div></div><span class="pill"><span class="dot"></span>Rahasia perusahaan</span></div>';
    html+='<div class="kpi-grid" style="margin-bottom:0">';
    html+=kpi('Total HPP Terpakai', rp(pemHPP), 'Nilai bahan yang jadi produk terjual');
    html+=kpi('Estimasi Omzet', rp(pemRev), 'Harga jual x qty');
    html+=kpi('COGS Blended', '<span style="color:'+st.c+'">'+pct(blend)+'</span>', st.t+'. Gabungan semua produk');
    html+='</div></div>';
  }

  }else{
    html+='<div class="card" style="overflow:hidden"><table><thead><tr><th>Produk</th><th>Kategori</th><th>HPP</th><th>Harga Jual</th><th>COGS</th><th>Status</th></tr></thead><tbody>';
    perlu.sort(function(a,b){return cogsPct(b)-cogsPct(a);}).forEach(function(p){
      var pc=cogsPct(p), s=statusOf(p.kategori,pc);
      html+='<tr><td><b>'+esc(p.nama)+'</b></td><td>'+katTag(p.kategori)+'</td><td class="mono">'+rp(prodHPP(p))+'</td><td class="mono">'+rp(p.hargaJual)+'</td><td class="mono" style="color:'+s.c+';font-weight:700">'+pct(pc)+'</td><td><span class="tag tag-'+s.k+'">'+s.t+'</span></td></tr>';
    });

function saveProd(id){

function setKomp(i,kind,val){ if(!val){tmpKomp[i].refId='';} else { var p=val.split(':'); tmpKomp[i].refType=p[0]; tmpKomp[i].refId=p[1]; } renderKompRows(kind); kind==='olah'?updateOlahPrev():updateProdPrev(); }

function refreshCompCosts(kind){

function compName(k){ if(k.refType==='ingredient'){var x=ingrById(k.refId);return x?x.nama:'(bahan terhapus)';} var o=olahById(k.refId);return o?o.nama+' (olahan)':'(olahan terhapus)'; }
function compUnit(k){ if(k.refType==='ingredient'){var x=ingrById(k.refId);return x?x.unit:'';} var o=olahById(k.refId);return o?o.unit:''; }

function renderKalk(){

function renderKalkRows(){
  var wrap=$('kalk_rows'); var html='';
  kalkRows.forEach(function(r,i){
    html+='<div class="comp-row" style="grid-template-columns:1fr 88px 74px auto">'+

function kalkRm(i){kalkRows.splice(i,1);if(!kalkRows.length)kalkRows.push({nama:'',harga:'',qty:''});renderKalkRows();kalkCalc();}

function kalkCalc(){

function editPem(id){

    field('Bulan','pm_bulan', defBulan, 'month','')+

function savePem(id){

  if(id){ var m=Pem.filter(function(x){return x.id===id;})[0]; m.bulan=bulan; m.items=items; }
  else { if(Pem.some(function(x){return x.bulan===bulan;})){alert('Bulan itu sudah ada, ubah yang lama.');return;} Pem.push({id:uid('pm'),bulan:bulan,items:items}); }

function delPem(id){ if(!confirm('Hapus data bulan ini?'))return; Pem=Pem.filter(function(x){return x.id!==id;}); save(LS.pemakaian,Pem); renderPemakaian(); }

function savePins(){
  var b=$('st_pin_b').value.trim(), g=$('st_pin_g').value.trim();
  if(!b||!g){alert('PIN tidak boleh kosong');return;}
  Settings.pinBisnis=b; Settings.pinGalangan=g; save(LS.settings,Settings); alert('PIN disimpan.');
}
function exportData(){
  var data={ingredients:Ingr, olahan:Olah, produk:Prod, pemakaian:Pem, settings:Settings, _v:1, _at:new Date().toISOString()};
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='Laksamana_HPP_backup_'+new Date().toISOString().slice(0,10)+'.json'; a.click(); URL.revokeObjectURL(a.href);
}
function importData(inp){
  var f=inp.files[0]; if(!f)return; var rd=new FileReader();
  rd.onload=function(){ try{ var d=JSON.parse(rd.result);
    if(!confirm('Import akan menimpa semua data saat ini. Lanjut?')){inp.value='';return;}
    if(d.ingredients)save(LS.ingr,d.ingredients); if(d.olahan)save(LS.olah,d.olahan); if(d.produk)save(LS.prod,d.produk);
    if(d.pemakaian)save(LS.pemakaian,d.pemakaian); if(d.settings)save(LS.settings,d.settings);
    reloadStores(); alert('Data berhasil diimport.'); go('dash');
  }catch(e){alert('File tidak valid.');} inp.value=''; };
  rd.readAsText(f);
}
function resetData(){
  if(!confirm('Hapus SEMUA data dan kembalikan ke contoh awal? Tidak bisa dibatalkan.'))return;
  [LS.ingr,LS.olah,LS.prod,LS.pemakaian,LS.settings].forEach(function(k){localStorage.removeItem(k);});
  seedIfEmpty(); reloadStores(); alert('Data direset ke contoh awal.'); go('dash');
}

/* =====================================================================
   MODAL & FORM HELPERS
   ===================================================================== */
function openModal(inner, size){
  closeModal();
  var bg=document.createElement('div'); bg.className='modal-bg'; bg.id='modalHost';
  bg.innerHTML='<div class="modal" style="'+(size==='wide'?'max-width:720px':'')+'"><button class="modal-x" onclick="APP.closeModal()">&times;</button>'+inner+'</div>';
  bg.addEventListener('mousedown',function(e){ if(e.target===bg)closeModal(); });
  document.body.appendChild(bg);
}
function closeModal(){ var h=$('modalHost'); if(h)h.remove(); }
function field(label,id,val,type,ph){ return '<div class="field"><label>'+label+'</label><input id="'+id+'" type="'+(type||'text')+'"'+(type==='number'?' step="any"':'')+' value="'+esc(val)+'" placeholder="'+esc(ph||'')+'"></div>'; }
function selField(label,id,opts,val,labels){
  var o=opts.map(function(x){var t=labels&&labels[x]?labels[x]:x;return '<option value="'+esc(x)+'"'+(x===val?' selected':'')+'>'+esc(t)+'</option>';}).join('');
  return '<div class="field"><label>'+label+'</label><select id="'+id+'">'+o+'</select></div>';
}

/* =====================================================================
   BOOT
   ===================================================================== */
function boot(){
  seedIfEmpty(); reloadStores();
  Session=load(LS.session,null);
  if(Session&&Session.role&&ROLE[Session.role]){ startApp(); }
  else { $('pinInput').value=''; }
}

/* ---------- Expose namespace ---------- */
window.APP={ pickRole:pickRole, login:login, logout:logout, go:go, toggleNav:toggleNav,
  searchBahan:searchBahan, editBahan:editBahan, saveBahan:saveBahan, delBahan:delBahan, renderBahan:renderBahan,
  editOlah:editOlah, saveOlah:saveOlah, delOlah:delOlah,
  searchProd:searchProd, filterProd:filterProd, viewProd:viewProd, editProd:editProd, saveProd:saveProd, delProd:delProd,
  addKomp:addKomp, setKomp:setKomp, setQty:setQty, rmKomp:rmKomp,
  kalkAdd:kalkAdd, kalkRm:kalkRm, kalkSet:kalkSet,
  editPem:editPem, savePem:savePem, delPem:delPem,
  saveTargets:saveTargets, savePins:savePins, exportData:exportData, importData:importData, resetData:resetData,
  closeModal:closeModal };

if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
})();
</script>
